      - _ulid: 01KSYAZ3HKGBTTGXBNN1EV1QM5
        slugs:
          - runner-process-invocation-inputs
        title: Runner Process Invocation Inputs
        type: requirement
        description: |
          Runners describe the process inputs kspec applies while preparing an ACP
          adapter invocation. The resolved contract identifies the existing adapter,
          optional command reference, child-process arguments, child-process cwd,
          environment policy, and redacted diagnostics used for that invocation.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: |
              A runner configures an executable or command path
            id: ac-existing-executable-reference-resolves
            then: >
              The resolved invocation contract identifies the command reference that will be spawned
              or returns a typed unspawnable-command diagnostic
            when: |
              Runner preflight validates the invocation contract
          - given: |
              A runner declares additional non-secret arguments or argument templates
            id: ac-runner-args-extend-acp-invocation
            then: >
              Those arguments are appended only to the spawned process invocation and are not
              persisted into adapter definitions
            when: |
              kspec prepares an ACP process invocation
          - given: |
              A runner declares a working-directory policy or cwd override
            id: ac-runner-cwd-is-invocation-only
            then: >
              The cwd is applied only to that child process invocation and does not change the
              daemon or parent process cwd
            when: |
              kspec prepares an ACP process invocation
          - given: |
              Runner validation, dry-run, preflight, or spawn preparation succeeds or fails
            id: ac-invocation-diagnostics-identify-inputs
            then: >
              Diagnostics identify the runner name, resolved adapter, command source, cwd policy,
              argument source, and env policy without exposing secrets
            when: |
              Diagnostics are shown
          - given: A system runner config declares `process.cwd` as a relative path.
            id: ac-relative-system-cwd-resolves-from-config-dir
            then: The child-process cwd is the normalized path resolved relative to the directory that contains
              that system runner config file.
            when: kspec resolves the runner invocation contract, runs preflight, or spawns the adapter process.
          - given: A runner-backed agent resolves to a registered adapter command and the runner does not
              override `process.executable`.
            id: ac-effective-adapter-command-preflighted
            then: The effective adapter command is checked under the runner-resolved cwd and process environment
              search path before prompt forwarding or dispatch acceptance.
            when: runner validation or dispatch preflight checks whether the invocation can spawn.
        tags: []
        created: 2026-05-31T06:19:00.531Z
        notes:
          - _ulid: 01KT21BHGQEJSNKETRB4PH70MS
            content: "Follow-up plan @plan-agent-runner-contract-hardening-follow-up: closure validation found
              that relative `process.cwd` values from a system runner config were accepted without a
              deterministic resolution base, and that the effective adapter command was not
              preflighted under the runner-resolved cwd and PATH before prompt forwarding. Added
              ac-relative-system-cwd-resolves-from-config-dir and
              ac-effective-adapter-command-preflighted to remove that ambiguity. No prior ACs were
              edited; implementation evidence belongs to later tasks."
            supersedes: null
