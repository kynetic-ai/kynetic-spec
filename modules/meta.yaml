              The project runner config or system runner config contains one or more named runner
              entries
            id: ac-named-runners-loaded
            then: |
              Each named runner is available to agent resolution by its configured name
            when: |
              Runner configuration is loaded for a project
          - given: |
              Portable project-specific runner values are defined for a project
            id: ac-project-runner-storage-is-repo-managed
            then: >
              They are stored in a repo-managed runner config artifact rather than in agent meta
              records or process environment variables
            when: |
              Those values are persisted
          - given: |
              Local runner values are defined for a project
            id: ac-system-runner-storage-is-local
            then: >
              They are stored under the user-level kspec daemon config directory and are not
              committed to the project repository or shadow branch
            when: |
              Those values are persisted
          - given: |
              The same runner field is present in both project and system runner config
            id: ac-system-overrides-project-values
            then: |
              The system value is used for that field
            when: |
              The effective runner config is resolved
          - given: >
              Project runner config contains supported portable runner values such as non-secret
              env.set entries, privacy defaults, or diagnostics preferences
            id: ac-project-layer-accepts-portable-runner-values
            then: >
              Those values are accepted as project-layer runner inputs and retain project-layer
              source metadata
            when: |
              Project runner config is validated
          - given: >
              Project runner config contains a known adapter or harness API key, auth token, OAuth
              token, credential variable, or secret-looking literal field
            id: ac-project-layer-blocks-known-secret-keys
            then: |
              The project config is rejected before it can become the effective runner configuration
            when: |
