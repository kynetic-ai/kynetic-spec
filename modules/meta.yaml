      - _ulid: 01KMPNANGZ3F9YCKCJRT9SEB4A
        slugs:
          - automation-action-type-completeness
        title: Automation Action Type Completeness
        type: requirement
        description: >-
          When the daemon starts automation subsystems (schedule engine, hook executor, join
          accumulator), each subsystem must be capable of executing every supported action type. The
          supported action types are: command, kspec, agent, notify, and session_prompt. Each action
          type has prerequisites that must be satisfied before execution — agent actions need the
          ability to spawn invocations, notify actions need the ability to broadcast to clients,
          session_prompt actions need access to active sessions.


          If an automation subsystem cannot execute a configured action type, the failure must be
          diagnosable from the action run record and event log.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: a schedule is configured with any supported action type
            id: ac-1
            then: the action executes successfully regardless of action type
            when: the schedule fires
          - given: a hook is configured with any supported action type
            id: ac-2
            then: the action executes successfully regardless of action type
            when: a matching event fires
          - given: a composition join trigger has any supported action type
            id: ac-3
            then: the action executes successfully regardless of action type
            when: the join condition is satisfied
          - given: an automation subsystem cannot fulfill a configured action type
            id: ac-4
            then: the action run fails with an error message identifying what capability is missing and which
              action type requires it
            when: the action attempts to execute
          - given: an automation action fails for any reason
            id: ac-5
            then: the event payload includes the error description and failure reason from the action run so the
              cause is diagnosable from the event log
            when: the failure event is emitted to the event bus
        tags:
          - agent-runtime
          - daemon
