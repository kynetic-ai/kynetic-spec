            id: ac-reflection-hook-present
            then: A single reflection hook is present that triggers on session.idle events from any agent
              session (not scoped to a specific agent) and prompts the session to run the reflect
              skill. The hook may carry filters limiting which idle events trigger reflection
            when: |
              The hook list is inspected
          - given: |
              A project already has the default reflection hook
            id: ac-hook-idempotent
            then: |
              The existing hook is preserved and no duplicate hook
