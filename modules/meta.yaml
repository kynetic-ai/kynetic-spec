      - _ulid: 01KKZPVBX6GQYR5J954CGSXXAB
        slugs:
          - dispatch-event-taxonomy
        title: Dispatch Event Taxonomy
        type: feature
        description: >-
          Defines the event domains and maintains a registry of valid event type identifiers. Events
          use dotted-namespace domains. The registry is an explicit enumeration of known events, not
          a free-form string pattern — event identifiers must be registered to be valid.


          Event domains:

          - task.ready, task.in_progress, task.needs_work, task.pending_review (existing, unchanged)

          - invocation.started, invocation.completed, invocation.failed, invocation.stalled

          - session.idle, session.ended, session.idle_timeout, session.cancelled

          - schedule.tick

          - action.started, action.completed, action.failed (universal action run tracking — every
          hook, schedule, and composition action produces action run events regardless of action
          type)


          Identity model: session_id and invocation_id are the same value. A "session" in the
          dispatch context IS an invocation — they are not separate entities. invocation.* events
          use session_id as the canonical identifier. action.* events use action_run_id as their
          canonical identifier and link to session_id when the action type is agent.


          All events carry the standard envelope defined by @dispatch-event-envelope.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits:
          - "@trait-error-guidance"
        acceptance_criteria:
          - given: |
              An agent invocation reaches a terminal state
            id: ac-1
            then: |
              A corresponding invocation.completed, invocation.failed, or
              invocation.stalled event is emitted with the standard envelope
            when: |
              The dispatch engine processes the outcome
          - given: |
              A dispatch session ends (agent responds, timeout, or cancellation)
            id: ac-2
            then: |
              A corresponding session.ended, session.idle_timeout, or
              session.cancelled event is emitted with session_id, agent_id,
              task_ref, duration, and terminal reason in the payload
            when: |
              The session reaches a terminal state
          - given: |
              A configuration references an event type not in the registry
            id: ac-3
            then: |
              An error identifies the invalid event and lists valid event
              types within the referenced domain
            when: |
              The configuration is validated
          - given: |
              Existing agent definitions use the current 4 task event types
            id: ac-4
            then: |
              All existing dispatch rules function identically without changes
            when: |
              The expanded event system is active
          - given: |
              An event matches both a dispatch rule and a hook
            id: ac-5
            then: |
              Both are evaluated independently without interference
            when: |
              The event is processed
        tags: []
        requirements:
