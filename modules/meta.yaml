          that fires on any idle agent session regardless of which agent owns it, and prompts the
          session to run the reflect skill. Reflection applies to every session uniformly so setup
          does not need to enumerate individual agents. Users may disable or remove the hook without
          breaking any other setup invariant. The hook fires only on the first session idle event of
          an invocation, not on every turn of a multi-turn session.
