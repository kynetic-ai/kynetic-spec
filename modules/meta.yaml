      - _ulid: 01KSYAZ3D62KVPZK77VP2RVBWM
        slugs:
          - runner-resolution-and-preflight
        title: Runner Resolution and Preflight
        type: requirement
        description: |
          Agent invocation resolves a runner before spawning an adapter process. Resolution
          produces a single invocation contract containing runner identity, adapter identity,
          command, arguments, environment, cwd, process diagnostics, and cleanup hooks. Invalid
          runner configuration fails before prompt forwarding.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: |
              kspec agent run starts a one-shot invocation for an agent with a runner field
            id: ac-one-shot-uses-runner-resolution
            then: >
              The invocation uses the resolved runner contract instead of directly resolving the
              agent adapter field
            when: |
              The invocation is prepared
          - given: >
              The dispatch engine prepares an eligible queued invocation for an agent with a runner
              field
            id: ac-dispatch-uses-runner-resolution
            then: |
              The dispatch engine uses the same resolved runner contract as one-shot agent run
            when: |
              The invocation is prepared
          - given: |
              An agent references a runner name that is not present in the effective runner registry
            id: ac-unknown-runner-blocks-before-spawn
            then: |
              No adapter process is spawned
            when: |
              kspec prepares a one-shot or dispatched invocation
          - given: |
              An invocation is blocked because the configured runner name is unknown
            id: ac-unknown-runner-reports-guidance
            then: >
              The report names the missing runner and suggests checking both project runner config,
              system runner config, and the agent definition
            when: |
              The failure is reported to the user, session, or task
          - given: >
              Runner validation fails because a required field, adapter reference, process setting,
              or security setting is invalid
            id: ac-invalid-runner-blocks-before-prompt
            then: |
              The invocation fails before any prompt content is sent to an adapter process
            when: |
              kspec prepares an invocation
          - given: |
              An invocation uses a runner-backed agent
            id: ac-session-metadata-records-runner
            then: |
              The metadata includes the runner name and the resolved adapter id
            when: |
              Session metadata is written
          - given: |
              An invocation uses a runner-backed agent
            id: ac-dispatched-event-records-runner
            then: |
              The event includes the runner name and the resolved adapter id
            when: |
              The agent.dispatched event is written
          - given: Project or system runner config exists but cannot be parsed or validated into an effective
              runner registry.
            id: ac-registry-load-failure-reports-config-error
            then: The diagnostic identifies the runner registry as unavailable, identifies the failing config
              layer and config path, includes the validation or parse reason, and redacts
              secret-looking values.
            when: kspec validates, lists, edits, or prepares an agent that references a runner.
          - given: Project or system runner config exists but cannot be parsed or validated into an effective
              runner registry.
            id: ac-registry-load-failure-blocks-runner-spawn
            then: No adapter process is spawned and no prompt content is forwarded until the registry-load error
              is fixed.
            when: kspec prepares a runner-backed one-shot or dispatched invocation.
        tags: []
        created: 2026-05-31T06:19:00.390Z
        notes:
          - _ulid: 01KT21BK7HACC99123CFZ8AFYP
            content: "Follow-up plan @plan-agent-runner-contract-hardening-follow-up: closure validation found
              that runner registry load/parse failures could be silently collapsed into the
              unknown-runner fallback, hiding the actual config layer, path, and validation reason.
              Added ac-registry-load-failure-reports-config-error and
              ac-registry-load-failure-blocks-runner-spawn so registry-load failures must report the
              failing layer and must block adapter spawn and prompt forwarding. No prior ACs were
              edited."
            supersedes: null
            author: "@claude"
