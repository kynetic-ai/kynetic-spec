            content: "Follow-up plan @plan-agent-runner-contract-hardening-follow-up: closure validation found
              that dispatch preflight could compute session-scoped env, diagnostics, or
              interpolation against a different session id than the one later recorded as active and
              passed to runInvocation, allowing preflight/invocation drift. Added
