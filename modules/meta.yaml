        description: >-
          Defines how kspec discovers meta manifest files in the spec directory.


          Discovery algorithm:

          1. Check for explicit name: kynetic.meta.yaml

          2. If not found, scan directory for *.meta.yaml files

          3. For each candidate, validate it contains a 'kynetic_meta:' version field

          4. Return first valid match (alphabetical order for non-explicit names)


          This provides backward compatibility while supporting project-specific naming like
          {slug}.meta.yaml.
        acceptance_criteria:
          - id: ac-1
            given: A directory with kynetic.meta.yaml
            when: Finding the meta manifest
            then: Returns kynetic.meta.yaml path
          - id: ac-2
            given: A directory with {slug}.meta.yaml containing kynetic_meta version field
            when: Finding the meta manifest and no kynetic.meta.yaml exists
            then: Returns {slug}.meta.yaml path
          - id: ac-3
            given: Multiple *.meta.yaml files
            when: Finding the meta manifest
            then: Returns kynetic.meta.yaml if present, else first alphabetically
        status:
          maturity: draft
          implementation: implemented
