      - _ulid: 01KKZPVC4QFDS52EF4G2T5C0DD
        slugs:
          - dispatch-action-model
        title: Dispatch Action Model
        type: feature
        description: >-
          The shared action model used by hooks, schedules, and composition join triggers. An action
          describes what to do when an event matches.


          Five action types:

          - command: Run an executable with explicit arguments

          - kspec: Run a kspec CLI command

          - agent: Spawn an agent invocation

          - notify: Emit a WebSocket notification

          - session_prompt: Deliver a prompt to an active session


          Every action execution produces an action run — a lightweight tracking record with unique
          ID, status, duration, and optional linked invocation_id (for agent actions). Action runs
          are the uniform abstraction that overlap policies, UI status, event logging, and action
          history key off of, regardless of action type.


          Template variables use {{var}} syntax resolved from the triggering event's envelope and
          payload.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits:
          - "@trait-error-guidance"
        acceptance_criteria:
          - given: |
              A command action is configured
            id: ac-1
