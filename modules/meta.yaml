    title: AC Annotation Coverage Semantics
    type: requirement
    description: Coverage annotations map behavior tests to specific acceptance criteria so completeness
      validation reflects real behavior coverage. For specs and traits that define acceptance
      criteria, completeness accounting uses explicit AC-level mappings rather than bare spec-level
      references.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: A spec item or trait defines one or more acceptance criteria
        id: ac-explicit-mapping
        then: The annotation references one or more explicit ac-* identifiers rather than only the spec or
          trait ref
        when: A test annotation is used to claim completeness coverage for that behavior
      - given: A machine-parseable coverage annotation appears in a supported test file
        id: ac-annotation-format
        then: 'It accepts the form "// AC: @spec-ref ac-id [ac-id...]" where each ac-id may be numeric or
          named'
        when: kspec validate scans source files for acceptance-criteria coverage
      - given: A coverage annotation references a spec item or trait with acceptance criteria but omits
          explicit ac-* identifiers
        id: ac-no-blanket-credit
        then: The annotation is reported as an invalid AC annotation warning and grants no
          acceptance-criteria coverage credit
        when: kspec validate evaluates completeness coverage
    tags: []
    requirements:
      - _ulid: 01KQ93NEBFF14YMVCMKPGGARA6
        slugs:
          - ac-annotation-identifier-format
        title: AC Annotation Identifier Format
        type: requirement
        description: |
          Coverage annotations name acceptance criteria using the same
          ac-prefixed token format that catalog acceptance criteria use, so
          annotation parsing and catalog validation agree on what counts as an
          explicit acceptance-criterion reference.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: |
              A coverage annotation names a spec item or trait acceptance
              criterion
            id: ac-explicit-token-format
            then: |
              The acceptance criterion token is interpreted only when it uses
              the required ac-prefixed format
            when: |
              completeness validation parses the annotation
          - given: |
              A coverage annotation names an existing acceptance criterion using
              the required token format
            id: ac-valid-token-covers-ac
            then: |
              The named acceptance criterion receives coverage credit from the
              annotation
            when: |
              completeness validation computes acceptance-criterion coverage
          - given: |
              A coverage annotation names a spec item or trait without a valid
              acceptance criterion token
            id: ac-bare-ref-no-token-credit
            then: |
              The annotation provides no acceptance-criterion coverage credit
            when: |
              completeness validation computes acceptance-criterion coverage
          - given: A coverage annotation contains an ac-prefixed token with unsupported characters or embedded
              punctuation, such as ac-valid.extra, ac-valid/path, ac-valid#anchor, or ac-valid?query
            id: ac-malformed-token-not-truncated
            then: The malformed token is not truncated to a valid prefix and does not provide coverage credit to
              any acceptance criterion
            when: completeness validation parses the annotation
          - given: A coverage annotation separates valid acceptance criterion tokens with whitespace, a comma,
              or a comma followed by whitespace
            id: ac-valid-delimiters-preserved
            then: Each delimiter-separated token is recognized as its own acceptance criterion token
            when: completeness validation parses the annotation
