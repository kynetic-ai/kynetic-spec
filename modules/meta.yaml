              ```typescript

              {
                step_index: number,
                status: 'completed' | 'skipped' | 'failed',
                started_at: DateTimeSchema,
                completed_at: DateTimeSchema,
                entry_confirmed?: boolean,
                exit_confirmed?: boolean,
                notes?: string,
                inputs?: Record<string, string>,
              }

              ```


              ### WorkflowRunsFileSchema

              ```typescript

              {
                kynetic_runs: '1.0',
                runs: WorkflowRun[],
              }

