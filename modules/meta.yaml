_ulid: 01KF1XMETA0000000000000000
slugs:
  - meta
  - meta-spec
  - meta-module
title: Meta-Spec System
type: module
description: |
  Meta-spec is the layer that defines HOW work happens, separate from
  WHAT is being built (spec) and tracking WORK (tasks).

  The key distinction:
  - Spec: What to build (features, requirements)
  - Tasks: Work to do (implement feature X)
  - Meta-spec: How to work (check spec before implementing)

  Meta-spec enables a self-improvement loop:
  1. Define workflows → 2. Track adherence → 3. Identify friction →
  4. Propose improvements → 5. Update workflows → (repeat)

  Meta-spec complements prose docs (CLAUDE.md, AGENTS.md) rather than
  replacing them. Structured definitions + prose guidance work together.
status:
  maturity: draft
  implementation: implemented
traits: []
decisions:
  - _ulid: 01KKB8FCD3J3FDT051YBMGZADD
    slugs:
      - spec-completeness-policy
    title: Spec Completeness Policy
    type: decision
    description: |
      Codifies which item types require acceptance criteria and descriptions,
      reducing false-positive validate warnings. Modules are organizational
      containers and should not require ACs. Traits, features, requirements,
      and constraints must have ACs. All non-module items should have descriptions.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: |
          A spec item has type module
        id: ac-module-exempt
        then: |
          No "missing acceptance criteria" warning is emitted for module items
        when: |
          kspec validate --completeness runs
      - given: |
          A spec item has type feature, requirement, constraint, or trait
        id: ac-feature-required
        then: A completeness warning is emitted for each item without acceptance_criteria
        when: |
          The item has no acceptance_criteria defined
      - given: |
          A spec item has any type except module
        id: ac-description-required
        then: |
          A completeness warning is emitted
        when: |
          The item has no description field
      - given: A spec item has type decision
        id: ac-decision-required
        then: A completeness warning is emitted — decisions document rationale via ACs just like features
          and requirements
        when: The item has no acceptance_criteria defined
    tags: []
    created: 2026-03-10T06:55:43.011Z
    notes: []
features:
  - _ulid: 01KF1XMNF00000000000000000
    slugs:
      - meta-manifest
      - meta-file
    title: Meta Manifest
    type: feature
    description: |
      The meta manifest (kynetic.meta.yaml) is the root file for process
      definitions. It lives alongside kynetic.yaml and defines agents,
      workflows, conventions, and observations.

      Unlike spec items which define product features, meta items define
      how work is done on the project.
    status:
      maturity: draft
      implementation: implemented
    acceptance_criteria:
      - given: a project with kynetic.yaml
        id: ac-meta-manifest-1
        then: >
          kspec meta show outputs summary with counts for agents, workflows, conventions, and
          observations (exit code 0)
        when: kynetic.meta.yaml is created with valid structure
      - given: a meta manifest exists
        id: ac-meta-manifest-2
        then: >
          output includes "Meta: X agents, Y workflows, Z conventions" line; validation errors for
          meta items use "meta:" prefix to distinguish from spec errors
        when: kspec validate runs
      - given: kynetic.meta.yaml has invalid schema
        id: ac-meta-manifest-3
        then: >
          exits with code 1; error message identifies the invalid field path and expected type
          (e.g., "meta:agents[0].capabilities: expected array")
        when: kspec validate runs
    priority: high
    tags:
      - mvp
      - meta
    requirements:
      - _ulid: 01KF1XMNF10000000000000000
        slugs:
          - meta-manifest-format
        title: Meta Manifest Format
        type: requirement
        description: |
          Meta manifest structure:

          ```yaml
          kynetic_meta: "1.0"

          agents:
            - _ulid: ...
              id: claude
              name: Claude Code Agent
              ...

          workflows:
            - _ulid: ...
              id: spec-first
              trigger: behavior change
              ...

          conventions:
            - _ulid: ...
              domain: commits
              ...

          observations:
            - _ulid: ...
              type: friction
              ...

          includes:
            - meta/agents.yaml
            - meta/workflows.yaml
          ```

          Version field enables schema evolution.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@meta-manifest"
        acceptance_criteria:
          - given: a project defines a meta manifest with kynetic_meta, agents, workflows, conventions, or
              observations sections
            id: ac-1
            then: the file is parsed as a meta manifest using the declared kynetic_meta version field
            when: the manifest is loaded by kspec
          - given: a meta manifest uses an unsupported or malformed version declaration
            id: ac-2
            then: validation reports a meta-manifest schema error instead of silently accepting the file
            when: kspec validate runs
      - _ulid: 01KF1XMNF20000000000000000
        slugs:
          - meta-includes
        title: Meta Includes
        type: requirement
        description: |
          Meta manifest supports includes for organization:

          ```yaml
          includes:
            - meta/agents.yaml
            - meta/workflows.yaml
            - meta/conventions.yaml
          ```

          Allows splitting large meta-specs into focused files.
          Same pattern as spec manifest includes.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@meta-manifest"
        acceptance_criteria:
          - given: a meta manifest declares include files for agents, workflows, or conventions
            id: ac-1
            then: items from the included files are merged into the effective meta manifest
            when: the project meta context is loaded
          - given: a meta manifest references an include path that cannot be loaded
            id: ac-2
            then: validation reports the missing or unreadable include instead of ignoring it
            when: kspec validate runs
      - _ulid: 01KF1XMNF30000000000000000
        slugs:
          - meta-validation
        title: Meta Validation Integration
        type: requirement
        description: |
          `kspec validate` includes meta-spec validation:

          - Schema validation for all meta item types
          - Reference resolution (@refs in workflows, observations)
          - Cross-validation with product spec (meta-refs exist)

          Unified validation ensures consistency across both layers.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@meta-manifest"
        acceptance_criteria:
          - given: a meta item violates its schema or contains an invalid field value
