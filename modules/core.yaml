_ulid: 01KEZCJPHZ86X9PA509GREWDM0
slugs:
  - core
  - core-primitives
title: Core Primitives
type: module
description: |
  The foundational concepts that everything else builds on:
  spec items as the fundamental unit, the ULID+slug ID system,
  and the @reference syntax for linking items together.
status:
  maturity: draft
  implementation: implemented
traits:
  - _ulid: 01KS8XATZ8KGQ7D6CRQX142RQK
    slugs:
      - trait-folder-backed-entity-1
      - trait-folder-backed-entity
      - trait-folder-backed-entity
    title: Folder-Backed Entity Trait
    type: trait
    description: |
      An entity that adopts folder-backed storage owns a stable per-entity
      directory, keeps list/index projections bounded, preserves unknown files,
      and can rebuild its index from authoritative folder contents. This trait is
      storage-shape behavior shared by tasks, plans, reviews, and future
      folder-backed entities.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: |
          A folder-backed entity exists in the system
        id: ac-entity-has-ulid-directory
        then: >
          The entity has its own directory named by its full ULID under that entity type's storage
          root
        when: |
          The entity is persisted
      - given: |
          Folder-backed entities exist in a project
        id: ac-index-excludes-heavy-detail-bytes
        then: >
          The index contains bounded identity, lifecycle, summary, and relationship fields without
          embedding full documents, unbounded detail logs, or resource file bytes
        when: >
          The entity index is read for listing, filtering, cache warm-up, or dashboard summary
          surfaces
      - given: |
          A folder-backed entity directory contains unknown files or directories
        id: ac-unknown-files-preserved
        then: |
          Unknown entries are ignored by entity semantics and preserved across writes
        when: |
          The entity is read or updated
      - given: |
          A folder-backed entity index has drifted from entity directories
        id: ac-index-rebuilds-from-folders
        then: |
          The index can be regenerated from entity folders and sidecar metadata
        when: |
          An index rebuild is requested
      - given: A folder-backed entity is created
        id: ac-index-entry-created-with-folder
        then: The entity directory, authoritative sidecar files, and bounded index entry are written in the
          same logical atomic mutation
        when: The creation is persisted
      - given: A persisted folder-backed entity changes any field, count, derived summary, relationship,
          lifecycle value, or resource metadata that belongs in that entity type's bounded index
          projection
        id: ac-indexed-mutation-updates-index
        then: The authoritative sidecar update and the corresponding index entry update are committed as one
          logical atomic mutation
        when: The mutation is persisted
      - given: A folder-backed entity index has drifted from authoritative entity folders
        id: ac-index-repair-converges
        then: A subsequent dry-run rebuild reports no index changes
        when: an index repair successfully rewrites the index and no later entity mutation occurs
      - given: An indexed optional field has equivalent persisted forms such as an omitted value and an
          empty default collection
        id: ac-semantic-defaults-do-not-drift
        then: The semantically equivalent forms are treated as equal and do not produce repeated update
          drift
        when: Index drift is computed or an index repair is verified
    tags: []
    created: 2026-05-22T22:36:41.832Z
    notes:
      - _ulid: 01KSM983K7KSXMZB7WGNBWJNPA
        content: "Folder-backed index consistency hardening validated. Evidence: npm run format /
          format:check / lint / typecheck / build green; focused storage suites pass
          (tests/task-data-manager.test.ts, tests/plan-rebuild-index.test.ts,
          tests/review-rebuild-index.test.ts, tests/parser-plans-folder.test.ts,
          tests/parser-reviews-folder.test.ts, tests/plan-folder-migration.test.ts,
          tests/review-folder-migration.test.ts, tests/upgrade-folder-storage.test.ts — 199 tests);
          CLI resource suites pass (tests/cli-plan-resource.test.ts,
          tests/review-resource-cli.test.ts — 52 tests); built-CLI smoke in a temp project confirms
          task add / task start / plan add+set / review add+verdict+comment leave the index
          converged (kspec task|plan|review rebuild-index --dry-run reports no changes after each
          normal mutator). Normal mutators keep indexes clean without repair across tasks, plans,
          and reviews."
        supersedes: null
        author: "@claude"
        created_at: 2026-05-27T08:36:34.023Z
  - _ulid: 01KS8XAV0DHA0V3WD5T98D4RMA
    slugs:
      - trait-entity-scoped-local-resources-1
      - trait-entity-scoped-local-resources
    title: Entity-Scoped Local Resources Trait
    type: trait
    description: |
      A folder-backed entity that owns rich context can include local resource
      files beside its structured data. Resource files live under the owning
      entity's `resources/` directory and are declared in `resources.yaml`.
      User-authored references use `./resources/<relative-path>`; consumers
      receive normalized owner/type/resource metadata instead of arbitrary file
      paths.
    status:
      maturity: draft
      implementation: in_progress
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits:
      - "@trait-folder-backed-entity-1"
    acceptance_criteria:
      - given: |
          A folder-backed entity contains a declared local resource
        id: ac-resource-reference-resolves-within-owner
        then: >
          The reference resolves only to a declared file inside the owning entity's `resources/` tree
        when: >
          A user, UI route, API route, static export, or agent resolves a
          `./resources/<relative-path>` reference for that entity
      - given: |
          A folder-backed entity has one or more declared local resources
        id: ac-resource-metadata-exposes-safe-preview-fields
        then: >
          Consumers can discover resource id, label, relative path, content type, byte size, content
          hash, and git version metadata without embedding large file contents in index records
        when: |
          The entity is read through list, detail, API, static export, or agent-context surfaces
      - given: >
          A resource reference contains an absolute path, parent traversal, an undeclared resource
          path, or a symlink escape
        id: ac-path-escape-rejected
        then: >
          The operation is rejected with actionable guidance and no file outside the owning entity
          resource tree is read or written
        when: |
          The resource is imported, attached, served, exported, or resolved
      - given: |
          A local resource is binary or large text
        id: ac-binary-resources-are-not-inlined-into-yaml
        then: >
          The resource remains as a sidecar file and structured records store only bounded metadata
          or pointers
        when: |
          The entity is persisted
      - given: |
          A folder-backed entity with local resources is deleted
        id: ac-resource-delete-follows-owner-delete
        then: >
          The entity's owned resource files are removed in the same logical mutation as the entity
          record
        when: |
          The deletion is persisted
      - given: |
          A resource version is recorded for later resolution or drift detection
        id: ac-versioning-uses-git-backed-identity
        then: >
          The version metadata uses content hash plus git commit and repository-relative path when a
          commit is available, without maintaining a separate resource history log inside kspec
        when: |
          The project is stored in git
      - given: |
          A static export includes entities with declared local resources
        id: ac-static-export-copies-resource-assets
        then: >
          Resource files are copied under
          `assets/resources/<entity-type>/<entity-ulid>/<relative-path>` and exported metadata
          reports that exported path
        when: |
          The export is generated
    tags: []
    created: 2026-05-22T22:36:41.869Z
    notes: []
decisions:
  - _ulid: 01KVED702F0HMFRN30Q03WE5PY
    slugs:
      - subject-revision-vocabulary
    title: Subject Revision Vocabulary
    type: decision
    description: |
      A review subject's revision number means exactly one thing per
      subject type. For plan subjects, it is the ordinal of the first-class
      plan revision the review examined. For task, spec, and code subjects,
      it derives from the review's recorded subject-refresh sequence: the
      version captured at review creation is revision 1, and each recorded
      subject refresh increments the ordinal — no dedicated field stores
      it. A grouping of sibling reviews against the same subject is a
      sequence of review passes ordered by creation; review passes are
      never labeled with the revision vocabulary, and revision numbers are
      never derived from sibling-review order.
    status:
      maturity: draft
      implementation: implemented
    depends_on:
      - "@plan-revisions"
      - "@review-subject-bindings"
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: |
          a review on a task, spec, or code subject whose subject has been
          refreshed N times since the review was created
        id: ac-non-plan-derivation
        then: |
          the ordinal is N+1, derived from the review's recorded
          subject-refresh events with no dedicated stored field
        when: |
          the subject revision ordinal is reported
      - given: |
          a review on a plan subject bound to plan revision N, whatever the
          count of recorded subject refreshes on the review
        id: ac-plan-subject-ordinal
        then: |
          the reported value is the bound plan revision ordinal N
        when: |
          the subject revision is reported
      - given: |
          a surface or interface presents the set of sibling reviews
          against one subject
        id: ac-review-pass-labeling
        then: |
          the grouping is identified as review passes ordered by creation
          date and is not labeled with the revision vocabulary
        when: |
          the grouping is labeled and ordered
    tags: []
    created: 2026-06-18T22:21:49.007Z
    notes: []
features:
  - _ulid: 01KEZCJPHZTTRBTEXCF6WYQYR3
    slugs:
      - spec-item
      - item-concept
    title: Spec Item
    type: feature
    description: |
      A spec item is the fundamental unit in Kynetic Spec.
      Everything - features, requirements, constraints, decisions,
      tasks - is represented as an item with consistent structure.
    status:
      maturity: draft
      implementation: implemented
    acceptance_criteria:
      - given: any piece of spec content
        id: ac-item-1
        then: it exists as an item with id, title, type, and content
        when: it is stored in the spec
      - given: an item
        id: ac-item-2
        then: it has a ULID assigned automatically
        when: it is created
    priority: high
    tags:
      - mvp
      - core
    requirements:
      - _ulid: 01KEZCJPHZ0X9NQZMED44BM9MT
        slugs:
          - item-required-fields
        title: Required Item Fields
        type: requirement
        description: |
          Every item MUST have:
          - _ulid: Canonical unique identifier (auto-generated)
          - title: Human-readable name (required, user-provided)

          All other fields are optional with sensible defaults.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@spec-item"
        acceptance_criteria:
          - given: a user creates a new spec item with only a title
            id: ac-1
            then: the item has a generated ULID and preserves the provided title as required fields
            when: the item is stored
      - _ulid: 01KEZCJPHZ67B47NKNJZ8C1H3G
        slugs:
          - item-optional-fields
        title: Optional Item Fields
        type: requirement
        description: |
          Items MAY include:
          - slugs: Human-friendly aliases (array)
          - type: Item type (feature, requirement, etc.)
          - status: Maturity and implementation status
          - priority: high | medium | low
          - tags: Freeform labels (array)
          - description: Detailed content (multiline)
          - acceptance_criteria: Testable conditions (array)
          - depends_on, implements, relates_to: References (arrays)
          - traceability: Links to code, tests, commits
          - created, created_by: Lifecycle metadata
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@spec-item"
        acceptance_criteria:
          - given: a spec item is created without optional metadata such as slugs, tags, description, or
              relationships
            id: ac-1
            then: the item remains valid and the omitted fields do not prevent storage
            when: the item is retrieved or validated
      - _ulid: 01KF3H8QTT6W0FMEGQ97FH5VYA
        slugs:
