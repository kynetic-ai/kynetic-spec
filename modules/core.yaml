requirements:
  - _ulid: 01KKB8FCEPMCC7J05GV278WKGT
    slugs:
      - core-ac-backfill
    title: Core Primitives AC Backfill
    type: requirement
    description: |
      Add acceptance criteria to foundational spec items under @core that
      currently lack them: ULID system, slug system, reference system,
      item types, relationship types, and status lifecycle. These are the
      building blocks — their ACs define what correctness means for everything
      built on top.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: |
          All feature and requirement items under @core module
        id: ac-coverage
        then: |
          Zero "missing acceptance criteria" warnings for @core descendants
        when: |
          kspec validate --completeness runs
      - given: |
          Each newly added AC
        id: ac-testable
        then: It follows given/when/then format with concrete, observable outcomes
        when: |
          It is reviewed
    tags: []
    created: 2026-03-10T06:55:43.062Z
    notes: []
  - _ulid: 01KS8XAVAA8E2V5CAFZSSH9CQN
    slugs:
      - entity-folder-migration-and-compatibility-1
      - entity-folder-migration-and-compatibility
    title: Entity Folder Migration and Compatibility
    type: requirement
    description: |
      Projects using monolithic plan or review files migrate to folder-backed
      storage through `kspec upgrade`. The new project format is `kynetic: "1.2"`
      with `task_storage.format: split`, `plan_storage.format: folder`,
      `review_storage.format: folder`, and `resource_storage.format:
      entity_scoped`. Newer kspec versions that require folder-backed plans or
      reviews block incompatible projects with structured guidance instead of
      silently reading or rewriting ambiguous data.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: >
          A new project is created with the kspec version that includes folder-backed plans and
          reviews
        id: ac-new-projects-declare-folder-storage
        then: >
          The manifest declares `kynetic: "1.2"`, `task_storage.format: split`,
          `plan_storage.format: folder`, `review_storage.format: folder`, and
          `resource_storage.format: entity_scoped`
        when: |
          The project manifest is generated
      - given: |
          A project has monolithic plan or review records
        id: ac-upgrade-dry-run-previews-layout
        then: >
          The command reports the target manifest fields, directories, sidecar files, index changes,
          resource manifest changes, warnings, and previous shadow commit without writing them
        when: |
          The user runs `kspec upgrade --dry-run`
      - given: |
          A project has monolithic plan or review records and the user runs `kspec upgrade`
        id: ac-upgrade-executes-folder-migration
        then: >
          Plans and reviews are decomposed into the folder-backed layout, lean indexes are written,
          the manifest is updated to the 1.2 storage fields, and all changes are committed as one
          logical shadow mutation
        when: |
          The storage migration succeeds
      - given: |
          A monolithic plan or review record contains existing fields or unknown fields
        id: ac-migration-preserves-record-identity-and-unknown-fields
        then: >
          The migrated entity preserves its ULID, slugs, refs, timestamps, lifecycle state, known
          fields, and unknown record fields
        when: |
          It is migrated to folder-backed storage
      - given: >
          A newer kspec command or daemon route needs folder-backed plan, review, or resource
          behavior and finds `kynetic` below `1.2` or missing `plan_storage.format: folder` or
          `review_storage.format: folder`
        id: ac-unmigrated-projects-are-blocked-with-guidance
        then: >
          It fails with `entity_storage_incompatible` guidance to run `kspec upgrade` or use a kspec
          version compatible with the existing manifest
        when: |
          The operation cannot safely continue
      - given: >
          A project declares folder-backed plan or review storage but has monolithic records without
          corresponding entity directories or index entries that do not match folders
        id: ac-partial-folder-layouts-are-blocked
        then: >
          It fails with a structured `partial_entity_storage_layout` incompatibility instead of
          partially reading or rewriting ambiguous data
        when: |
          The relevant entity storage manager initializes
      - given: |
          A daemon API route needs plan, review, or resource data from an incompatible project
        id: ac-daemon-returns-structured-conflict
        then: >
          The response is HTTP 409 with top-level error `entity_storage_incompatible`, a
          domain-specific code, migration suggestion, and cache-domain context when available
        when: |
          The route handles the storage incompatibility
    tags: []
    created: 2026-05-22T22:36:42.186Z
    notes: []
  - _ulid: 01KTTD0XE1QWT768H2TT7C715S
    slugs:
      - subprocess-argument-literalness
    title: Subprocess Argument Literalness
    type: requirement
    description: |
      Dynamic values that flow into version-control subprocess invocations
      — branch names, remote names, revision identifiers, timestamps — are
      treated as literal data and are never interpreted by a shell.
      Repository metadata is externally influenceable (a cloned repository
      controls its own branch and remote names), so queries over that
      metadata must treat every dynamic value as literal data.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: |
          A repository's checked-out branch has a name containing shell
          metacharacters (command substitution, semicolons, quotes,
          backticks)
        id: ac-metacharacter-branch-literal
        then: |
          The metadata is returned containing the exact literal branch
          name, and no command embedded in the name is interpreted or
          executed
        when: |
          The tool reads current-branch or upstream-tracking metadata for
          that repository
      - given: |
          A version-control query incorporates a dynamic value (branch
          name, remote name, revision identifier, or timestamp) containing
          characters a shell would interpret (substitution, quoting,
          separators, expansion)
        id: ac-dynamic-values-treated-literally
        then: |
          The query operates on the exact literal value — it succeeds or
          fails based solely on whether the real value exists or is valid,
          no embedded command is executed, and no shell interpretation
          alters the query's meaning
        when: |
          The query runs
      - given: |
          A version-control query runs against a directory that is not a
          repository, or the underlying subprocess fails
        id: ac-failure-results-preserved
        then: |
          The helper reports failure through its documented null, empty,
          or default result rather than raising an error
        when: |
          The query helper is invoked
    tags: []
