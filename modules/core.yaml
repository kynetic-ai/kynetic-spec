      - _ulid: 01KHVXK25SDYTAEKZN28S2X66K
        slugs:
          - config-author
        title: Configurable Author Identity
        type: feature
        description: "Project-level default author via kspec.config.yaml identity.author. Establishes the
          author precedence chain - env var (KSPEC_AUTHOR, highest), then config identity.author,
          then git user.name, then OS user (lowest) - used to resolve an actor when a write supplies
          no explicit value. The chain only produces a CANDIDATE actor. Per @actor-identity-model,
          every new actor-bearing write passes that candidate (and any explicit caller value)
          through write-time classification before persistence: values recognized as the configured
          human identity or a canonical agent are stored in canonical form, while a resolved value
          that classifies to no configured human or agent identity is rejected on new writes rather
          than persisted as a free-form author. The configured human identity is itself derived from
          this chain, so a chain-resolved write is normally attributed to that canonical human;
          classification reconciles recognizable variants. This reconciles the earlier wording,
          which appeared to let arbitrary git/OS-derived names persist verbatim, with
          @actor-identity-model's write-time validation boundary."
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: |
              kspec.config.yaml sets author to a value like @bot-agent
            id: ac-1
            then: the author is recorded as the configured value
            when: a note or inbox item is created without KSPEC_AUTHOR env var set
          - given: both KSPEC_AUTHOR env var and config author are set
            id: ac-2
            then: the env var value wins
            when: a note is created
          - given: no config author and no KSPEC_AUTHOR env var
            id: ac-3
            then: the author candidate falls back to git user.name then OS user, and that candidate is passed
              through write-time classification before persistence; it is stored as the canonical
              configured human identity (the chain value defines that human), and only a value
              classifying to no configured human or agent identity is rejected on a new write
            when: a note is created
        tags: []
        created: 2026-02-19T21:41:10.969Z
