        when: the item graph is inspected
    priority: high
    tags:
      - mvp
      - core
    requirements:
      - _ulid: 01KEZCJPJ16V8C3N97BCEEV6GK
        slugs:
          - rel-depends-on
        title: depends_on Relationship
        type: requirement
        description: |
          "A depends_on B" means A requires B to be completed/available.
          Used for: ordering work, tracking prerequisites.

          For tasks: Auto-blocks A until B is completed.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@relationship-types"
        acceptance_criteria:
          - given: User provides a depends_on reference without @ prefix (e.g., --depends-on 01KH7XA9)
            id: ac-1
            then: the CLI auto-prefixes @ to normalize the reference (stores @01KH7XA9); applies to task set,
              task add, and derive commands
            when: the value is stored
          - given: A task has depends_on referencing incomplete tasks
            id: ac-2
            then: the task is excluded from tasks list and tasks ready by default, but is still accessible via
              task get @ref
            when: the task is auto-blocked
          - given: A task has depends_on with a valid @-prefixed reference
            id: ac-3
            then: the dependent task is automatically unblocked and appears in tasks list and tasks ready
            when: the referenced task is completed
      - _ulid: 01KEZCJPJ2MKTF1V4PCN9X6Y7K
        slugs:
          - rel-implements
        title: implements Relationship
        type: requirement
        description: |
          "A implements B" means A is a realization of B.
          Used for: requirement-to-task, feature-to-module.

          Enables traceability from high-level to concrete.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@relationship-types"
        acceptance_criteria:
          - given: item A implements item B
            id: ac-1
            then: A is linked to B showing concrete realization (e.g., requirement implements feature, task
              implements requirement)
            when: querying implementation traceability
          - given: multiple items implement the same item
            id: ac-2
            then: all implementers are shown enabling traceability from high-level to concrete
            when: viewing the implemented item
      - _ulid: 01KEZCJPJ2JS9T7PSR30RMDCFE
        slugs:
          - rel-relates-to
        title: relates_to Relationship
        type: requirement
        description: |
          "A relates_to B" is a general association without specific semantics.
          Used for: cross-references, "see also" links.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@relationship-types"
        acceptance_criteria:
          - given: item A relates_to item B
            id: ac-1
            then: B is shown as a related reference (general association without specific semantics like 'see
              also')
            when: viewing item A
          - given: item A relates_to item B
            id: ac-2
            then: relates_to is accepted as valid cross-reference without enforcing specific constraints (unlike
              depends_on or blocks)
            when: validating relationships
      - _ulid: 01KEZCJPJ26Q09SD3GCQAXJWP9
        slugs:
          - rel-blocks
        title: blocks Relationship
        type: requirement
        description: |
          "A blocks B" means B cannot proceed while A is unresolved.
          The inverse of depends_on, used for explicit blocking issues.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@relationship-types"
        acceptance_criteria:
          - given: item A blocks item B
            id: ac-1
            then: task B cannot transition to in_progress while A is unresolved (blocking relationship enforced)
            when: item B is a task
          - given: item A blocks item B
            id: ac-2
            then: item B becomes unblocked (blocks relationship is inverse of depends_on)
            when: item A is resolved or completed
      - _ulid: 01KEZCJPJ2HC490BP03G39SX8R
        slugs:
          - rel-tests
        title: tests Relationship
        type: requirement
        description: |
          "A tests B" means A validates or verifies B.
          Used for: linking test items to features/requirements.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@relationship-types"
        acceptance_criteria:
          - given: item A declares a tests relationship to item B
            id: ac-1
            then: item A is shown as evidence that validates item B
            when: verification traceability is viewed
      - _ulid: 01KEZCJPJ2ZJMV482PPMTCSZKN
        slugs:
          - rel-supersedes
        title: supersedes Relationship
        type: requirement
        description: |
          "A supersedes B" means A replaces B, which is now deprecated.
          The old item's ULID remains stable; the relationship links them.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@relationship-types"
        acceptance_criteria:
          - given: item A supersedes item B
            id: ac-1
            then: item B remains identifiable by its original ULID and the relationship points to item A as its
              replacement
            when: the superseded item is reviewed
  - _ulid: 01KHVXK254VHT2WXKK073TB5ZT
    slugs:
      - project-config
    title: Project Config File
    type: feature
    description: |
      A kspec.config.yaml file in the project root (main branch) that provides
      project-level configuration for shadow branch setup, identity, validation,
      and daemon settings. Loaded before shadow branch detection. All fields
      optional with backward-compatible defaults.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits:
      - "@trait-error-guidance"
    acceptance_criteria:
      - given: a project with no kspec.config.yaml
        id: ac-1
        then: all settings resolve to current defaults with no behavior change
        when: kspec commands are run
      - given: a kspec.config.yaml exists in the project root
        id: ac-2
        then: config is parsed, validated, and available on KspecContext.config before shadow detection
        when: initContext() is called
      - given: a kspec.config.yaml with invalid YAML syntax
        id: ac-3
        then: parsing falls back to defaults and emits a warning to stderr with the parse error
        when: config is loaded
      - given: a kspec.config.yaml with unknown fields
        id: ac-4
        then: unknown fields are ignored and valid fields are applied normally
        when: config is loaded
      - given: an env var override exists (e.g. KSPEC_AUTHOR)
        id: ac-5
        then: env var takes precedence over the config file value
        when: config is resolved
      - given: kspec is invoked from a subdirectory of the project
        id: ac-6
        then: config is loaded from the git root, not the current working directory
        when: initContext() resolves config
      - given: KSPEC_SPEC_DIR env var is set (batch atomic mode)
        id: ac-7
        then: config is still loaded from the real project root, not the temp spec dir
        when: initContext() runs
      - given: A kspec.config.yaml with a hooks section
        id: ac-hooks-section
        then: Each hook (checkpoint, prompt-check) can be independently enabled or disabled.
        when: kspec setup reads hook preferences
      - given: The hooks section exists but a specific hook key is absent
        id: ac-hooks-missing-keys
        then: "The hook resolves to its default (prompt-check: enabled, checkpoint: disabled)."
        when: kspec setup determines installation for that hook
      - given: No hooks section exists in kspec.config.yaml, or the config file is absent
        id: ac-hooks-no-config
        then: All hooks resolve to their defaults.
        when: kspec setup determines hook installation
      - given: A hooks section contains an invalid value
        id: ac-hooks-validation
        then: A validation error is reported identifying the invalid field.
        when: kspec setup reads the configuration
    tags: []
    features:
      - _ulid: 01KHVXK25H4Y67SNE1VR7M9H52
        slugs:
          - config-shadow
        title: Configurable Shadow Branch
        type: feature
        description: |
          Shadow branch name, worktree directory, and remote target are configurable
          via kspec.config.yaml instead of hardcoded constants. The remote can be any
          eligible git target — the current repo's remote name, a different remote name,
          a local directory path to a bare repo, or a remote git server URL. This enables
          multi-project machines with distinct branch names, and spec storage in separate
          repositories.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits:
          - "@trait-error-guidance"
        acceptance_criteria:
          - given: |
              kspec.config.yaml sets shadow.branch to a custom name
            id: ac-1
            then: the orphan branch is created with the configured name instead of kspec-meta
            when: kspec init is run
          - given: |
              kspec.config.yaml sets shadow.directory to a custom path
            id: ac-2
            then: the worktree is created at the configured directory and .gitignore is updated accordingly
            when: kspec init is run
          - given: |
              shadow.remote is set to a named remote (e.g. specs-origin)
            id: ac-3
            then: push/pull operations use the named remote instead of origin
            when: remote tracking is configured
          - given: |
              shadow.remote is set to a local filesystem path (starts with / or ./ or ~)
            id: ac-4
            then: a git remote is added using the local path as target
            when: remote tracking is configured
          - given: |
              shadow.remote is set to a git URL (contains :// or starts with git@)
            id: ac-5
            then: a git remote is added using the URL as target
            when: remote tracking is configured
          - given: |
              shadow.remote references a named remote that does not exist
            id: ac-6
            then: an error is reported with guidance to add the remote or fix the config
            when: push or pull is attempted
          - given: existing shadow branch functions (detectShadow, hasRemoteTracking, pushShadowBranch, etc.)
            id: ac-7
            then: they fall back to current constants (backward compat for direct callers)
            when: called without config parameter
          - given: |
              shadow.directory is set to a custom name (not .kspec)
            id: ac-8
            then: it correctly detects the custom worktree directory using git worktree metadata
            when: detectRunningFromShadowWorktree() is called
          - given: |
              a shadow branch already exists with default settings (kspec-meta, .kspec)
            id: ac-9
            then: kspec reports the mismatch and guides the user to migrate or repair
            when: config is changed to different shadow.branch or shadow.directory
          - given: git version is below 2.42 (does not support --orphan worktree flag)
            id: ac-10
            then: falls back to creating the orphan branch in a temporary directory (never modifies the project
              working tree), pushes the branch to the local repo, then uses standard git worktree
              add to attach it
            when: kspec init creates the shadow branch
          - given: Shadow branch has remote tracking configured and multiple clones or worktrees share the same
              remote shadow branch
            id: ac-11
            then: The shadow sync performs a pull-rebase before pushing, using the configured merge driver for
              conflict resolution, so that changes from other clones are integrated before pushing
              new commits — preventing divergence and reducing merge conflicts
            when: A kspec write command commits to the local shadow branch
          - given: The daemon is running with shadow remote tracking configured
            id: ac-12
            then: The daemon performs a background shadow pull to pick up changes pushed by other clones, making
              remote shadow state available locally without requiring a manual kspec shadow sync
            when: A configurable sync interval elapses (default 60s)
        tags: []
        features:
          - _ulid: 01KKCED6N48VAWE15SBABSC3MB
            slugs:
              - worktree-support
            title: Git Worktree Support
            type: feature
            description: kspec commands auto-resolve to the main repo's .kspec/ when run from a linked git
