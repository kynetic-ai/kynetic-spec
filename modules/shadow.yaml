  - _ulid: 01KF1VBPN5J53QJJM3FTXK2J9R
    slugs:
      - shadow-recovery
    title: Shadow Recovery
    type: feature
    status:
      maturity: draft
      implementation: implemented
    priority: high
    tags:
      - infrastructure
      - reliability
    description: |
      Recovery mechanisms for shadow branch issues. Provides CLI commands for
      diagnosing and repairing shadow branch problems.

      Commands:
      - `shadow status`: Check health of shadow branch
      - `shadow repair`: Recreate worktree when branch exists but worktree broken
      - `shadow log`: View recent commits on shadow branch

      Handles common issues:
      - Worktree directory deleted (recreate from existing branch)
      - Worktree disconnected from git (remove and recreate)
      - Stale worktree references in git
    acceptance_criteria:
      - id: ac-recovery-1
        given: shadow branch exists but .kspec/ directory is deleted
        when: kspec shadow repair runs
        then: worktree is recreated from existing branch
      - id: ac-recovery-2
        given: .kspec/ exists but .git file is missing or corrupt
        when: kspec shadow repair runs
        then: worktree is removed and recreated
      - id: ac-recovery-3
        given: shadow branch does not exist
        when: kspec shadow repair runs
        then: it fails with error suggesting kspec init
      - id: ac-recovery-4
        given: shadow branch is healthy
        when: kspec shadow repair runs
        then: it succeeds without changes (idempotent)
      - id: ac-recovery-5
        given: shadow branch is healthy
        when: kspec shadow status runs
        then: it reports healthy status with all checks passing
      - id: ac-recovery-6
        given: shadow branch has issues
        when: kspec shadow status runs
        then: it reports the specific issue and suggests repair
    requirements:
      - _ulid: 01KF1VBR1XMKDJ0K5HYW7RWGQE
        slugs:
          - shadow-repair-cmd
        title: Shadow Repair Command
        type: requirement
        status:
          maturity: draft
          implementation: implemented
        description: |
          kspec shadow repair

          Re-establishes worktree if .kspec/ is deleted or corrupted:
          - Recreates worktree link from .git/worktrees/.kspec
          - Detects and reports common corruption scenarios
          - Handles: stale locks, orphaned worktrees, detached HEAD

          Acceptance criteria:
          - Recovers from deleted .kspec/ directory
          - Reports clear error if shadow branch itself is missing
          - Idempotent (safe to run multiple times)
        implements:
          - "@shadow-recovery"
        acceptance_criteria:
          - id: ac-1
            given: the .kspec worktree is missing or stale while the shadow branch still exists
            when: the user runs kspec shadow repair
            then: the command recreates or reconnects the worktree and reports either a repaired state or that
              the worktree was already healthy when run again
      - _ulid: 01KF1VBRG99HYJ00CVABVKV0QM
        slugs:
          - shadow-validation
        title: Shadow Branch Validation
        type: requirement
        status:
          maturity: draft
          implementation: implemented
        description: |
          Shadow validation as part of kspec validate.

          Checks:
          - Worktree exists and is properly linked
          - Shadow branch exists and is reachable
          - No uncommitted changes (should be zero with auto-commit)
          - All spec files valid YAML with correct schema
        implements:
          - "@shadow-recovery"
        acceptance_criteria:
          - id: ac-1
            given: a project uses shadow branch mode
            when: the user runs kspec validate
            then: validation checks the shadow worktree link, branch reachability, clean shadow status, and
              schema-valid shadow spec files before reporting success
      - _ulid: 01KKJZTZ6309QBKBMQ0CSF3FXX
        slugs:
          - broken-shadow-safety
        title: Broken Shadow Safety
        type: requirement
        priority: high
        tags:
          - shadow
          - dispatch
          - reliability
        description: Broken-shadow handling must be fail-safe. Existing shadow repos that lose or disconnect
          the configured shadow worktree must not silently fall back to repo-root read/write paths,
          and recovery flows must preserve the prior shadow directory unless a replacement worktree
          is successfully recreated.
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        notes: []
        created: 2026-03-13T06:58:40.964Z
        acceptance_criteria:
          - id: ac-preserve-on-failure
            given: shadow repair or automatic shadow recovery is rebuilding a broken shadow worktree
            when: the replacement worktree cannot be created successfully
            then: the pre-repair shadow directory is preserved or restored and the failure reports recovery
              guidance instead of leaving the checkout without its shadow directory
          - id: ac-bootstrap-reuses-repair
            given: a project bootstrap or setup helper runs in a checkout where the shadow branch already exists
              but the shadow worktree is missing or unhealthy
            when: it chooses a recovery action
            then: it reuses the existing shadow branch via shadow repair instead of treating the checkout as a
              brand-new init
          - id: ac-context-fails-fast
            given: a checkout has an existing shadow branch but the configured shadow worktree is missing or
              disconnected
            when: any kspec read or write path initializes project context for CLI, daemon, or dispatch work
            then: initialization fails with actionable shadow recovery guidance instead of treating the checkout
              as a non-shadow repo
  - _ulid: 01KF47F4J7DAQ3TD3BGHFQSK9C
    slugs:
      - shadow-sync
    title: Shadow Remote Sync
    type: feature
    tags: []
    description: Automatic synchronization of shadow branch with remote repository. After each local
      auto-commit, attempt push to remote. On session start or read operations, pull remote changes
      first.
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    created: 2026-01-16T20:20:38.087Z
    acceptance_criteria:
      - id: ac-1
        given: remote tracking is configured for shadow branch
        when: a state-changing operation commits to shadow branch
        then: kspec attempts a fire-and-forget push to remote; if push fails, local operation still succeeds
          and warning output surfaces sync failure (with higher-visibility warning after repeated
          consecutive failures).
      - id: ac-2
        given: remote tracking is configured
        when: session start runs
        then: kspec pulls remote changes before showing session context
      - id: ac-3
        given: pull encounters a conflict
        when: sync is attempted
        then: local operation succeeds, warning displayed, user directed to run kspec shadow resolve
      - id: ac-4
        given: no remote tracking configured
        when: sync would normally occur
        then: sync is silently skipped (no error)
      - id: ac-5
        given: shadow branch has unresolved sync conflict
        when: user runs kspec shadow resolve
        then: interactive conflict resolution guides user through resolving conflicts
      - id: ac-6
        given: sync uses git pull
        when: pulling remote changes
        then: uses --ff-only first, falls back to --rebase if needed
      - id: ac-7
        given: new shadow branch is created and origin remote exists
        when: initializeShadow completes
        then: tracking is configured to origin/kspec-meta regardless of push success
      - id: ac-8
        given: shadow branch exists without tracking and main branch has origin remote
        when: any sync operation is attempted
        then: tracking is automatically configured to origin/kspec-meta
    status:
      maturity: draft
      implementation: implemented
    requirements:
      - _ulid: 01KKA7TQ0Z1E7G6YS8MVJ9PRS6
        slugs:
          - shadow-lazy-read-sync
        title: Lazy Shadow Sync on Reads
        type: requirement
        tags: []
        description: |
          Replace the blocking shadowPull() on every CLI/daemon read with a
          lightweight drift check. Only pull when the local shadow branch is
          behind or diverged from remote. Uses FETCH_HEAD mtime to avoid
          redundant git fetch calls, and compares ahead/behind counts when
          fetch data is fresh. FETCH_HEAD path is resolved via
          git rev-parse --git-path FETCH_HEAD from the same cwd used for
          fetch, ensuring correctness in worktree setups.
        acceptance_criteria:
          - id: ac-drift-check
            given: |
              A CLI read command runs (e.g. task list, item get) and
              shadow branch has remote tracking configured
            when: |
              initContext() initializes shadow state
            then: |
              Instead of unconditionally calling shadowPull(), a lightweight
              drift check runs first. If no drift detected, pull is skipped
              and the command proceeds with local state.
          - id: ac-fetch-head-location
            given: |
              The shadow branch is a git worktree of the main repository
            when: |
              Drift check needs to determine fetch freshness
            then: |
              FETCH_HEAD path is resolved via git rev-parse --git-path
              FETCH_HEAD from the worktree dir (the same cwd used for
              fetch operations). In worktrees, git fetch writes FETCH_HEAD
              to the worktree's git dir (e.g. .git/worktrees/-kspec/),
              not the common git dir. The drift check must stat the same
              file that fetch updates.
          - id: ac-fetch-head-freshness
            given: |
              FETCH_HEAD mtime (resolved per ac-fetch-head-location) is
              within the freshness threshold (derived from
              shadow.sync_interval config, default 60s)
            when: |
              Drift check runs
            then: |
              Git fetch is skipped. Drift is determined solely by comparing
              local HEAD against the cached upstream ref from the last fetch.
          - id: ac-fetch-when-stale
            given: |
              FETCH_HEAD mtime is older than the freshness threshold
              or FETCH_HEAD does not exist
            when: |
              Drift check runs
            then: |
              A git fetch is performed to refresh remote refs, then
              local HEAD is compared against upstream.
          - id: ac-fetch-timeout
            given: |
              Network is unavailable or git fetch exceeds 5 seconds
              during drift check
            when: |
              Drift check attempts a fetch due to stale FETCH_HEAD
            then: |
              The spawned git fetch process is killed (SIGTERM with
              SIGKILL fallback) and drift check proceeds with local
              state only.
          - id: ac-fetch-timeout-no-error
            given: |
              A fetch timeout or network failure occurs during drift check
            when: |
              The command continues execution
            then: |
              No error is surfaced to the user. The command proceeds as if
              no drift was detected.
          - id: ac-fetch-timeout-debug-log
            given: |
              A fetch timeout or network failure occurs during drift check
              and --debug-shadow flag or KSPEC_DEBUG=1 is set
            when: |
              Debug output is enabled
            then: |
              A debug-level log is emitted describing the fetch failure,
              visible via --debug-shadow for troubleshooting.
          - id: ac-pull-when-behind
            given: |
              Drift check detects local shadow branch is behind remote
              (remote has commits not present locally)
            when: |
              A read operation is about to proceed
            then: |
              shadowPull() is called to integrate remote changes before
              the read proceeds. Behavior after pull (conflict handling,
              warnings) remains unchanged.
          - id: ac-no-pull-when-ahead
            given: |
              Drift check detects local shadow branch is ahead of remote
              (local has unpushed commits, but remote has no new commits)
            when: |
              A read operation is about to proceed
            then: |
              No pull is performed. Local state is already up to date with
              all remote changes. The unpushed commits will be pushed on
              the next write or daemon sync cycle.
          - id: ac-pull-when-diverged
            given: |
              Drift check detects local and remote have diverged
              (both have commits the other does not)
            when: |
              A read operation is about to proceed
            then: |
              shadowPull() is called to integrate remote changes, using
              the existing rebase + merge driver strategy.
          - id: ac-upstream-ref-missing
            given: |
              Remote tracking is configured but the upstream ref does not
              exist after a successful fetch (e.g. first run, never pushed)
            when: |
              Drift check compares HEAD vs upstream
            then: |
              Drift check returns true (sync needed) as the safer default,
              allowing shadowPull() to handle the situation.
          - id: ac-no-drift-fast-path
            given: |
              Drift check determines local HEAD matches upstream
              (zero behind, zero diverged)
            when: |
              initContext() completes
            then: |
              No pull is performed. Command proceeds immediately with
              local state. No network calls are made when FETCH_HEAD is
              fresh and refs match.
          - id: ac-session-start-always-pulls
            given: |
              User runs kspec session start and remote tracking is configured
            when: |
              initContext() runs for session start
            then: |
              Session start bypasses the drift check and always performs a
              full shadowPull(), ensuring the user sees the latest remote
              state when beginning a work session.
          - id: ac-no-sync-env
            given: |
              KSPEC_NO_SYNC=1 environment variable is set
            when: |
              initContext() runs (regardless of syncMode — drift-check,
              always, or skip)
            then: |
              All pre-read sync is disabled, including drift check and
              unconditional pull for markAlwaysSync commands like session
              start. KSPEC_NO_SYNC takes highest precedence over all
              syncMode values.
          - id: ac-threshold-from-config
            given: |
              shadow.sync_interval is configured in kspec.config.yaml
            when: |
              Drift check determines FETCH_HEAD freshness threshold
            then: |
              Uses the configured sync_interval value (in seconds) as the
              freshness threshold. If not configured, defaults to 60 seconds.
          - id: ac-syncmode-propagation
            given: |
              A CLI command is dispatched via Commander
            when: |
              The preAction hook runs before the command handler
            then: |
              syncMode is determined centrally in the preAction hook based
              on command annotations (markMutating, markAlwaysSync) and
              stored as module-level state. Both the preAction initContext
              call (via maybeAutoStartDaemon) and the action handler
              initContext call read syncMode from this shared state.
              No per-command manual syncMode passing is required.
          - id: ac-syncmode-consume-once
            given: |
              initContext() is called multiple times within the same CLI
              command (e.g. preAction via maybeAutoStartDaemon, then
              action handler)
            when: |
              The second (or subsequent) initContext call runs
            then: |
              Only the first initContext call per command lifecycle
              executes the sync action (drift check, pull, or skip).
              Subsequent calls within the same command skip pre-read
              sync entirely, preventing double-pull.
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        notes: []
        created: 2026-03-09T21:25:11.327Z
        status:
          maturity: draft
          implementation: implemented
      - _ulid: 01KKA7TQ1JJE7W2DHCNF4G0EQ7
        slugs:
          - shadow-write-sync
        title: Always Sync on Shadow Writes
        type: requirement
        tags: []
        description: |
          Write operations always perform a full sync (pull then push) to
          ensure consistency. This preserves the current pull-rebase-before-push
          pattern in commitIfShadow/shadowPushAsync. Write commands skip the
          pre-read drift check in initContext since the write sync supersedes it.

          Depends on @shadow-lazy-read-sync for the syncMode mechanism.
        acceptance_criteria:
          - id: ac-write-always-syncs
            given: |
              A CLI write command commits to the shadow branch
              (task add, item set, etc.)
            when: |
              commitIfShadow() runs
            then: |
              The existing pull-rebase-before-push pattern executes
              regardless of drift check freshness. Writes never skip sync.
          - id: ac-write-skips-read-check
            given: |
              A mutating command triggers initContext() (either directly
              or via preAction hook)
            when: |
              initContext() initializes shadow state
            then: |
              The pre-read drift check is skipped for both initContext
              calls (preAction and action handler). The write path in
              commitIfShadow provides its own sync, so the pre-read
              check would be redundant overhead.
        depends_on:
          - "@shadow-lazy-read-sync"
        implements: []
        relates_to: []
        tests: []
        traits: []
        notes: []
        created: 2026-03-09T21:25:11.346Z
        status:
          maturity: draft
          implementation: implemented
      - _ulid: 01KKA7TQ1Y7T5F46Y8MKW3QNE3
        slugs:
          - shadow-daemon-push-sync
        title: Daemon Background Sync Pushes
        type: requirement
        tags: []
        description: |
          Extend the daemon's periodic ShadowSyncScheduler to also push
          after pulling, ensuring local commits are propagated at the
          sync interval rather than only on fire-and-forget after writes.

          Orthogonal to @shadow-lazy-read-sync and @shadow-write-sync —
          can be implemented independently. The daemon's periodic fetch
          freshens FETCH_HEAD in the worktree git dir, which the CLI
          drift check benefits from for its fast path.
        acceptance_criteria:
          - id: ac-periodic-push
            given: |
              Daemon periodic sync interval elapses and there are local
              commits ahead of upstream
            when: |
              ShadowSyncScheduler.syncOnce() runs
            then: |
              After pulling, a push is attempted if local is ahead of
              remote. Push failure is non-fatal (logged, not thrown).
          - id: ac-daemon-freshens-fetch-head
            given: |
              Daemon periodic sync runs its fetch from the worktree dir
            when: |
              CLI commands run between daemon sync intervals
            then: |
              FETCH_HEAD in the worktree git dir is fresh from the
              daemon's last fetch. CLI drift checks (which resolve
              FETCH_HEAD from the same worktree dir) see it as fresh
              and skip redundant fetches during the interval.
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        notes: []
        created: 2026-03-09T21:25:11.358Z
        status:
          maturity: draft
          implementation: implemented
  - _ulid: 01KFM78SSTQR07F36DKWJS85ZY
    slugs:
      - yaml-merge-driver
    title: Semantic YAML Merge Driver
    type: feature
    tags: []
    description: >-
      A custom git merge driver that parses both versions of kspec YAML files and merges them
      semantically, understanding the structure of tasks, items, and other kspec entities. This
      prevents git from creating conflict markers that would corrupt YAML files.


      Note on exit codes: This command intentionally does NOT use @trait-semantic-exit-codes because
      git merge drivers have special requirements - they must exit 0 to prevent git from falling
      back to its text merge, which would corrupt YAML.
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits:
      - "@trait-dry-run"
      - "@trait-error-guidance"
    notes: []
    created: 2026-01-23T01:25:01.370Z
    acceptance_criteria:
      - id: ac-1
        given: git attempts to merge two versions of a kspec YAML file
        when: the merge driver is configured
        then: kspec parses all three versions (base, ours, theirs) as structured data instead of text
      - id: ac-2
        given: both versions add different items to an array (tasks, inbox, specs)
        when: merge runs
        then: both additions are included in result (union merge by ULID)
      - id: ac-3
        given: both versions modify different fields of the same item
        when: merge runs
        then: fields are merged (non-conflicting field changes combined)
      - id: ac-4
        given: both versions modify the same scalar field (title, description, priority) of the same item
        when: merge runs
        then: user is prompted interactively to choose which value to keep
      - id: ac-5
        given: both versions modify append-only arrays (notes, todos)
        when: merge runs
        then: arrays are union merged by ULID (notes never conflict)
      - id: ac-6
        given: both versions modify set-like arrays (tags, depends_on)
        when: merge runs
        then: arrays are set-unioned (duplicates removed)
      - id: ac-7
        given: both versions modify nested objects (status, traceability)
        when: merge runs
        then: nested fields are merged recursively at field level
      - id: ac-8
        given: one version deletes an item while other modifies it
        when: merge runs
        then: user is prompted interactively to choose delete vs keep modified
      - id: ac-9
        given: merge completes with no true conflicts
        when: driver exits
        then: exit code 0, merged YAML written to output path
      - id: ac-10
        given: merge has unresolvable conflicts and --non-interactive flag set
        when: driver exits
        then: conflict markers written as YAML comments, exit code 0 (prevents git fallback)
      - id: ac-11
        given: YAML parsing fails on any input file
        when: driver runs
        then: "falls back gracefully: copies ours verbatim, creates .kspec-merge-failed marker, exits 0"
      - id: ac-12
        given: kspec init runs in a new repo
        when: initialization completes
        then: merge driver is configured in .git/config and .gitattributes updated in shadow branch
    requirements:
