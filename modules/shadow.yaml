_ulid: 01KF1V1SN0MGR80YA90E7VEM09
slugs:
  - shadow-branch
  - shadow
title: Shadow Branch
type: module
description: |
  Shadow branch for transparent spec/task state auto-tracking.
  Uses gitignored worktree (.kspec/) pointing to orphan branch (kspec-meta).
  Separates metadata commits from main branch history.

  Key properties:
  - Shadow branch has files at root (not nested under spec/)
  - .kspec/ is a git worktree pointing to the shadow branch
  - Main branch gitignores .kspec/
  - All kspec read/write operations target .kspec/
  - Changes auto-commit to shadow branch
status:
  maturity: draft
  implementation: implemented
features:
  - _ulid: 01KF1V1Z87Z7PTG4C68QSMK4EE
    slugs:
      - shadow-concept
    title: Shadow Branch Concept
    type: feature
    description: |
      Orphan git branch storing kspec state in gitignored worktree.

      Problem solved:
      - Commit bloat from task state changes
      - History pollution on main branch
      - Review noise in PRs

      Solution:
      - Orphan branch (kspec-meta) with files at root
      - .kspec/ worktree always available
      - Auto-commit on state changes
      - Main branch never touched by kspec operations
    status:
      maturity: draft
      implementation: implemented
    acceptance_criteria:
      - given: a project is initialized with shadow branch support
        id: ac-1
        then: the metadata change is committed on the orphan shadow branch through the .kspec worktree and
          the current code branch history remains unchanged
        when: a mutating kspec command updates spec or task state and git history is inspected
    priority: high
    tags:
      - infrastructure
      - git
    requirements:
      - _ulid: 01KF1V1ZJBRPWKF16HEPQG7KHX
        slugs:
          - shadow-structure
        title: Shadow Directory Structure
        type: requirement
        description: |
          Directory layout for shadow branch:

          project/
            .kspec/                    # Git worktree (gitignored by main)
              .git -> ../.git/worktrees/.kspec
              kynetic.yaml             # Root manifest
              kynetic.tasks.yaml       # Tasks
              kynetic.meta.yaml        # Meta-spec
              project.tasks.yaml       # Project tasks
              project.inbox.yaml       # Inbox
              modules/
                core.yaml
                cli.yaml
                shadow.yaml
            src/                       # Normal source (on main branch)
            tests/
            .gitignore                 # Contains: .kspec/

          Shadow branch contents (at root):
          - kynetic.yaml - manifest
          - *.tasks.yaml - task files
          - *.inbox.yaml - inbox files
          - modules/*.yaml - spec modules
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@shadow-concept"
        acceptance_criteria:
          - given: a project has been initialized with the shadow branch worktree
            id: ac-1
            then: the main worktree contains a gitignored .kspec worktree and the shadow worktree root contains
              the manifest, task/inbox files, and modules directory at top-level paths
            when: the user inspects the project root and the .kspec directory layout
        requirements:
          - _ulid: 01KJ37B5DDFRVPC9AFEQJPMX44
            slugs:
              - artifacts-directory
            title: Artifacts Directory Convention
            type: requirement
            description: Convention for .kspec/artifacts/ — an untracked directory within the shadow branch
              worktree for ephemeral files generated during sessions (reports, exports, generated
              HTML/JSON). Files are not tracked by the shadow branch. Subdirectories are permitted
              but flat structure is recommended. No automated cleanup or lifecycle management —
              files persist until manually removed.
            status:
              maturity: draft
              implementation: implemented
            depends_on: []
            implements: []
            relates_to: []
            tests: []
            traits: []
            acceptance_criteria:
              - given: a new project is being initialized
                id: ac-init-creates
                then: .kspec/artifacts/ directory is created with a .gitkeep file
                when: kspec init runs and creates the shadow branch worktree
              - given: .kspec/ worktree exists
                id: ac-gitignore-entry
                then: it contains an artifacts/ entry excluding the directory contents from shadow branch tracking
                when: the .gitignore in .kspec/ is examined
              - given: files exist in .kspec/artifacts/
                id: ac-commits-exclude
                then: artifact files are never included in the commit
                when: any kspec command auto-commits to shadow branch
              - given: an existing project where .kspec/artifacts/ is missing
                id: ac-setup-ensures
                then: .kspec/artifacts/ directory is created with a .gitkeep file
                when: kspec setup runs
              - given: .kspec/artifacts/ directory is missing
                id: ac-doctor-checks
                then: it reports the missing artifacts directory as an issue
                when: kspec doctor runs
              - given: .kspec/artifacts/ is missing
                id: ac-repair-recreates
                then: .kspec/artifacts/ directory is recreated with a .gitkeep file
                when: kspec shadow repair runs and rebuilds the worktree
              - given: a command or agent generates a file for artifacts/
                id: ac-naming-convention
                then: the recommended pattern is type-YYYY-MM-DD.ext with a counter suffix for collisions (e.g.
                  triage-report-2026-02-22.html, triage-report-2026-02-22-2.html)
                when: choosing a filename
              - given: artifacts/ is empty and the shadow branch worktree is recreated via clone or repair
                id: ac-empty-dir-persistence
                then: the artifacts/ directory exists due to the .gitkeep file being tracked on the shadow branch
                when: the worktree is set up
            tags: []
            created: 2026-02-22T17:46:18.926Z
            notes: []
      - _ulid: 01KF1V1ZTYSNNVT5WP56VCP5YB
        slugs:
          - shadow-autocommit
        title: Auto-Commit on State Changes
        type: requirement
        description: |-
          All state-changing kspec commands automatically commit to shadow branch.

          Commit messages by command:

          Task lifecycle:
          - task start @ref      -> "Start @{slug}"
          - task complete @ref   -> "Complete @{slug}: {reason}"
          - task block @ref      -> "Block @{slug}"
          - task unblock @ref    -> "Unblock @{slug}"
          - task cancel @ref     -> "Cancel @{slug}"
          - task set @ref        -> "Update @{slug}"

          Task notes/todos:
          - task note @ref       -> "Note on @{slug}"
          - task add             -> "Add task: {title}"
          - task todo add        -> "Todo on @{slug}"
          - task todo done       -> "Todo done on @{slug}"
          - task todo undone     -> "Todo undone on @{slug}"

          Inbox:
          - inbox add            -> "Inbox: {text}"
          - inbox promote        -> "Promote to @{slug}"
          - inbox delete         -> "Inbox delete"

          Items:
          - item add/set/delete  -> "{action} @{slug}"
          - item ac add          -> "AC on @{slug}"
          - item ac set          -> "AC update on @{slug}"
          - item ac remove       -> "AC remove on @{slug}"

          Derive:
          - derive               -> "Derive from @{spec}"

          Implementation:
          - After write, run: git -C .kspec add -A && git -C .kspec commit -m "..."
          - Low overhead (local commits only)
          - Commit includes all changes from the operation
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@shadow-concept"
        acceptance_criteria:
          - given: shadow branch is enabled and task @my-task exists
            id: ac-1
            then: shadow branch has new commit with appropriate message
            when: kspec task start/complete/block/unblock/cancel/set runs
          - given: shadow branch is enabled and task @my-task exists
            id: ac-2
            then: shadow branch has new commit with appropriate message
            when: kspec task note/add or task todo add/done/undone runs
          - given: shadow branch is enabled
            id: ac-3
            then: shadow branch has new commit with appropriate message
            when: kspec inbox add/promote/delete runs
          - given: shadow branch is enabled
            id: ac-4
            then: shadow branch has new commit with appropriate message
            when: kspec item add/set/delete or item ac add/set/remove runs
          - given: shadow branch is enabled and spec item @my-spec exists
            id: ac-5
            then: shadow branch has new commit with message containing the spec ref
            when: kspec derive @my-spec runs
          - given: shadow branch is enabled but commit fails (e.g., git error)
            id: ac-6
            then: command still succeeds, commit failure is silently ignored
            when: any state-changing command runs
      - _ulid: 01KF1V2027DTBEBN6A6DCBAT1Q
        slugs:
          - shadow-read-path
        title: Shadow Read Path
        type: requirement
        description: |
          All kspec read operations target .kspec/ directory.

          Affected operations:
          - kspec tasks ready
          - kspec session start
          - kspec item get
          - kspec validate
          - All other reads

          Implementation:
          - Parser loads YAML from .kspec/kynetic.yaml and includes
          - Ref resolution uses .kspec/ file paths
          - Source file tracking uses .kspec/ paths
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@shadow-concept"
        acceptance_criteria:
          - given: shadow branch mode is enabled and .kspec contains the latest spec state
            id: ac-1
            then: the command resolves data from files under .kspec rather than from copies in the main branch
              working tree
            when: the user runs a read command such as kspec item get or kspec tasks ready
      - _ulid: 01KF1V209B3C1C7AB3Y63SPSPB
        slugs:
          - shadow-write-path
        title: Shadow Write Path
        type: requirement
        description: |
          All kspec write operations target .kspec/ directory.

          - YAML files written to .kspec/
          - After write, auto-commit triggered
          - No interaction with main branch's working tree
        status:
          maturity: draft
