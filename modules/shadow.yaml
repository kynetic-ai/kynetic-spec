      - _ulid: 01KKJZTZ6309QBKBMQ0CSF3FXX
        slugs:
          - broken-shadow-safety
        title: Broken Shadow Safety
        type: requirement
        description: Broken-shadow handling must be fail-safe. Existing shadow repos that lose or disconnect
          the configured shadow worktree must not silently fall back to repo-root read/write paths,
          and recovery flows must preserve the prior shadow directory unless a replacement worktree
          is successfully recreated.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: shadow repair or automatic shadow recovery is rebuilding a broken shadow worktree
            id: ac-preserve-on-failure
            then: the pre-repair shadow directory is preserved or restored and the failure reports recovery
              guidance instead of leaving the checkout without its shadow directory
            when: the replacement worktree cannot be created successfully
          - given: setup or bootstrap recovery flows run in a checkout where the shadow branch already exists
              locally or on the configured remote but the shadow worktree is missing or unhealthy
            id: ac-bootstrap-reuses-repair
            then: it reuses or reattaches the existing shadow state via repair semantics instead of treating the
              checkout as a brand-new init
            when: the flow chooses a shadow recovery action
          - given: a checkout has an existing shadow branch but the configured shadow worktree is missing or
              disconnected
            id: ac-context-fails-fast
            then: initialization fails with actionable shadow recovery guidance instead of treating the checkout
              as a non-shadow repo
            when: any kspec read or write path initializes project context for CLI, daemon, or dispatch work
          - given: a checkout has an existing shadow branch but the configured shadow worktree is missing or
              disconnected
            id: ac-no-root-fallback
            then: it does not redirect reads or writes to repo-root fallback paths outside the configured shadow
              directory
            when: CLI, daemon, or dispatch code resolves kspec-managed manifest, registry, or metadata paths
          - given: A failed shadow rebuild is restoring the preserved pre-repair shadow directory from its
              backup location
            id: ac-restore-failure-reports-state
            then: The operation reports the restore failure alongside the original rebuild error, identifies the
              absolute path of the preserved backup directory and the resulting state of the shadow
              directory location, and provides concrete recovery steps; the backup directory is
              never deleted on this path
            when: The restore itself fails
        priority: high
        tags:
          - shadow
          - dispatch
          - reliability
        created: 2026-03-13T06:58:40.964Z
        notes: []
  - _ulid: 01KF47F4J7DAQ3TD3BGHFQSK9C
