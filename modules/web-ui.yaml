_ulid: 01KFHMF5ZS4RD70JBQNGBQJVFY
slugs:
  - web-ui
title: Web UI System
type: module
description: >-
  Web-based interface for viewing, editing, and managing kspec state. Includes three deployment
  modes:

  1. Local daemon mode runs the daemon on the configured JavaScript runtime, defaulting to Node,
  using Elysia with the appropriate runtime adapter. Bun remains supported as an optional configured
  runtime.

  2. Web dashboard - SvelteKit + shadcn-svelte for full CRUD operations

  3. GitHub Pages export - Static JSON snapshot with read-only SPA for public sharing


  Tech stack: Elysia.js, WebSocket (not SSE), SvelteKit, shadcn-svelte. Default runtime is Node; Bun
  is supported as an optional configured runtime.

  Distribution via npm; the runtime executable is provided by the user when an optional runtime such
  as Bun is selected.
status:
  maturity: draft
  implementation: implemented
depends_on: []
implements: []
relates_to: []
tests: []
traits: []
acceptance_criteria:
  - given: user installs kspec CLI package
    id: ac-1
    then: all daemon runtime dependencies for the configured runtime are available without additional
      install steps except the runtime executable itself when an optional runtime such as Bun is
      selected
    when: daemon starts on the configured runtime
  - given: The configured daemon runtime is not installed
    id: ac-2
    then: Shows a clear error message naming the missing runtime with installation guidance
    when: kspec serve start is run
