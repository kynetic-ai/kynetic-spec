        title: Web UI assets bundled in npm package
        type: requirement
        description: The kspec npm package bundles the pre-built web UI static assets so the daemon can
          serve the web UI when installed in any project, without requiring a local web UI build.
          The build pipeline copies packages/web-ui/build to dist/web-ui/, and resolveWebUiPath
          falls back to that location relative to the daemon module.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: npm run build is executed
            id: ac-1
            then: packages/web-ui/build output is copied to dist/web-ui/ in the package
            when: build completes
          - given: kspec is installed in a project with no local web UI build
            id: ac-2
            then: resolveWebUiPath returns the bundled dist/web-ui/ path relative to the daemon module location
            when: daemon starts and resolves web UI path
          - given: kspec is installed as an npm package in a non-monorepo project
            id: ac-3
            then: daemon serves the bundled web UI and returns HTTP 200 with HTML content
            when: browser opens http://localhost:3456/
          - given: an explicit webUiDir option or WEB_UI_DIR env var is present
            id: ac-4
            then: the explicit or env var path is used to serve web UI assets
            when: daemon starts
          - given: no explicit webUiDir option or WEB_UI_DIR env var is set
            id: ac-5
            then: web UI assets are served from the bundled dist/web-ui/ directory relative to the daemon's own
              module location
            when: daemon starts and resolves web UI path
          - given: A client receives a daemon-served web UI entry document
            id: ac-entry-bootstrap-assets-available
            then: The daemon returns HTTP 200 with the requested asset content
            when: The client requests a same-origin asset needed to start the web UI
          - given: A browser has previously loaded the daemon-served web UI from an older served bundle
            id: ac-reload-uses-current-entry
            then: The browser receives the entry document for the currently served bundle
            when: The browser reloads a web UI route
          - given: The served web UI entry document is temporarily unavailable
            id: ac-entry-unavailable-during-replacement
            then: The daemon returns HTTP 503 for the web UI route
            when: A client requests a web UI route
          - given: The served web UI entry document is available after a temporary interruption
            id: ac-entry-recovers-after-replacement
            then: The daemon returns the available entry document
            when: A client requests a web UI route
