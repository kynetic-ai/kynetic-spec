  - _ulid: 01KM5Z4JK0XX5BWAXEF4RVCFXS
    slugs:
      - api-input-type-safety
    title: API Input Type Safety
    type: feature
    description: |
      All daemon API endpoints must enforce type constraints on input
      fields at the framework schema level, not through manual checks in
      handler code. This applies to both mutation endpoints (request body
      fields) and query endpoints (filter parameters). When an input
      contains a field with a constrained type — an enum, a bounded
      number, a structured object with required shape — the framework
      must reject invalid values before the handler executes. This
      applies to HTTP endpoints and WebSocket message handlers.

      Framework-level validation is preferred over handler-level
      validation because it is declarative, cannot be bypassed by handler
      code paths, and produces consistent error responses. Existing
      handler-level validation may remain as defense-in-depth.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits:
      - "@trait-type-safe-input"
      - "@trait-api-endpoint"
    acceptance_criteria:
      - given: |
          An API mutation endpoint accepts a field with a type constraint
        id: ac-1
        then: |
          The framework returns a validation error before the handler
          executes, and no data is persisted
        when: |
          The request body contains a value that violates the constraint
      - given: |
          An API mutation endpoint accepts a field with a type constraint
        id: ac-2
        then: |
          The handler executes normally
        when: |
          The request body contains a valid value
      - given: |
          An API query endpoint accepts a typed filter parameter
        id: ac-3
        then: |
          The framework returns a validation error rather than silently
          returning empty results
        when: |
          The provided value does not match the filter's type constraint
    tags: []
    created: 2026-03-20T15:52:01.376Z
    notes: []
  - _ulid: 01KN7Q6A4ZKJZJRH9Q2BR480ZD
    slugs:
      - daemon-file-monitoring
    title: Resource-Bounded File Monitoring
    type: feature
    description: |
      Defines the contract for how the daemon monitors project directories
      for changes. File monitoring must be resource-proportional — the
      daemon's resource consumption scales with the number of directories
      and metadata files that need monitoring, not with the total volume
      of data stored in those directories.

      The daemon monitors two directory trees per project: the shadow
      branch worktree for spec/task state, and the sessions directory
      for session lifecycle. Each tree has distinct monitoring needs —
      the shadow branch contains structured YAML that drives cache
      invalidation, while the sessions directory contains metadata files
      alongside large volumes of content data (blobs) that are irrelevant
      to cache freshness.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits:
      - "@trait-error-guidance"
    acceptance_criteria:
      - given: |
          A project is registered with the daemon
        id: ac-1
        then: |
          Changes to structured data files in the shadow branch directory
          are detected and reported within the debounce window
        when: |
          File monitoring starts for that project
      - given: |
          The sessions directory contains large volumes of content data
          alongside session metadata files
        id: ac-2
        then: |
          Only session metadata and event files are monitored; content
          storage directories are excluded from monitoring
        when: |
          File monitoring starts for the sessions directory
      - given: |
          A project's sessions directory has thousands of sessions with
          accumulated content data
        id: ac-3
        then: File descriptor count is proportional to the number of active sessions and monitored spec
          directories
        when: |
          The daemon process resource usage is measured
      - given: |
          The daemon is running on any supported platform
        id: ac-4
        then: |
          File changes are detected reliably regardless of the
          operating system's native filesystem event mechanism
        when: |
          File monitoring is initialized
      - given: |
          A monitored file is modified through an atomic write operation
          (write to temporary file, then rename)
        id: ac-5
        then: |
          The change is detected and reported as a modification to the
          target path
        when: |
          The monitoring system processes the filesystem event
      - given: |
          Multiple projects are registered with the daemon
        id: ac-6
        then: |
          Only that project's change handler is invoked; no cross-project
          event delivery occurs
        when: |
          A file changes in one project's monitored directory
      - given: A new session directory for a session with active status is created after monitoring started
        id: ac-7
        then: The new session's metadata changes are detected without requiring a monitoring restart
        when: Metadata files are written into the new session directory
      - given: |
          The monitoring system encounters a persistent error for a
          project directory
        id: ac-8
        then: |
          The project is unregistered and resources are released, with
          a logged error identifying the affected project
        when: |
          Recovery attempts are exhausted
      - given: The sessions directory contains both active and non-active sessions (completed, abandoned,
          failed, timed_out, or stalled)
        id: ac-active-only-watching
        then: Only sessions with active status are individually watched for metadata and event changes
        when: File monitoring is running for the sessions directory
      - given: A watched session transitions from active to any non-active status (completed, abandoned,
          failed, timed_out, or stalled)
        id: ac-session-close-unwatch
        then: The per-session watch is removed and its file descriptors are released
        when: The status change is detected by the watcher
      - given: A new session directory appears in the sessions directory
        id: ac-new-session-conditional-watch
        then: The new session's metadata is checked and a per-session watch is added only if the session has
          active status
        when: The top-level directory watcher detects the new entry
      - given: The daemon starts with existing sessions in the sessions directory
        id: ac-startup-active-only
        then: Only sessions with active status at startup time are watched
        when: File monitoring is initialized
      - given: A new session directory appears in the sessions directory with any status (active or
          non-active — completed, abandoned, failed, timed_out, stalled)
        id: ac-new-session-list-freshness
        then: Exactly one session-change notification is emitted so consumers (entity cache, WebSocket
          broadcast) can refresh the session list, regardless of whether a per-session watcher is
          attached
        when: The top-level directory watcher detects the new entry and its session.yaml becomes readable
