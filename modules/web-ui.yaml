        when: the daemon starts
      - given: a project has a degraded cache domain with a recorded load error
        id: ac-cache-diagnostics-degraded-reason
        then: the diagnostics identify the degraded domain's current error reason
        when: cache diagnostics are requested
      - given: a project has a degraded cache domain with recovery guidance available
        id: ac-cache-diagnostics-recovery-guidance
        then: the diagnostics include the recovery guidance
