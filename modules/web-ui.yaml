                content: Tightened ACs ac-detached-cleanup-bound-before-observation and
                  ac-approved-daemon-helper-boundary-explicit lack current source/test evidence. (1)
                  The cleanup classifier in tools/eslint-rules/no-leaky-test-daemon.js recognizes
                  daemon-shaped cleanup CALL expressions (process.kill, child.kill('SIGTERM'),
                  killPid(pid), runKspec serve stop, etc.) and gates on registration before the next
                  observation, but it does not verify that the captured pid/child/stop handle was
                  already bound to the just-started daemon at the registration site; a pattern that
                  registers onTestFinished(() => killPid(pid)) before the detached start and then
                  assigns pid only after an intervening await/expect satisfies the current rule yet
                  leaves cleanup unbound on the failing path. (2) The Program:exit detached-cleanup
                  check skips reports when isInHelperFunction(node) is true. isInHelperFunction
                  classifies any named function declaration or variable-bound function expression as
                  a helper, so an unsafe daemon start hidden inside an arbitrary local wrapper in a
                  test file bypasses the rule even though the wrapper is not a shared fixture or
                  documented guardrail internal. Implementation status moved to in_progress
                  --no-cascade pending the follow-up rule fix and regression tests.
