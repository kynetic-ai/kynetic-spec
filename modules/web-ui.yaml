  - _ulid: 01KKCA3PZDN8667JGTAE51ZSQB
    slugs:
      - ansi-terminal-rendering
    title: ANSI Terminal Output Rendering
    type: feature
    tags:
      - web-ui
      - session
      - dx
    description: >-
      Parse and render ANSI SGR (Select Graphic Rendition) escape sequences in terminal/bash tool
      output displayed in the session stream. Convert ANSI color codes to styled HTML spans so
      terminal output appears with the same colors and formatting as a real terminal.


      Currently ToolCallView.svelte renders output in a plain <pre> tag — ANSI codes show as garbled
      raw text.


      Scope: SGR codes only (colors, bold, dim, italic, underline, strikethrough, reset). Cursor
      movement and screen control codes (CUU, CUD, clear, etc.) are outside scope and should be
      stripped.


      Rendering pipeline: Tool/bash output stays in <pre> blocks and is never markdown-parsed. ANSI
      color rendering applies only inside these <pre> blocks. Agent text messages continue to use
      the markdown renderer. The two parsers never touch the same content.
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    notes: []
    created: 2026-03-10T16:43:32.205Z
    acceptance_criteria:
      - id: ac-1
        given: tool output contains ANSI SGR escape sequences (e.g. \x1b[32mPASS\x1b[0m)
        when: the output is displayed in ToolCallView
        then: the text renders with corresponding CSS colors instead of showing raw escape codes
      - id: ac-2
        given: "tool output uses ANSI color codes: standard 16 colors (30-37, 40-47, 90-97, 100-107),
          256-color mode (38;5;N / 48;5;N), or 24-bit true color (38;2;R;G;B / 48;2;R;G;B)"
        when: rendered in the web UI
        then: colors render correctly using CSS custom properties that integrate with the existing oklch
          token system and work in both light and dark themes
      - id: ac-3
        given: tool output contains formatting codes (bold=1, dim=2, italic=3, underline=4, strikethrough=9)
        when: rendered in the web UI
        then: corresponding CSS styles are applied (font-weight, opacity, font-style, text-decoration)
      - id: ac-4
        given: tool output contains reset codes (\x1b[0m for full reset, or specific resets like \x1b[22m)
        when: rendered
        then: styling resets correctly without leaking to subsequent text
      - id: ac-5
        given: tool output contains ANSI parameter sequences but the ESC character was stripped or lost
          during storage
        when: rendered
        then: the raw bracket sequences are stripped rather than displayed as garbled text — fallback to
          clean plain text
      - id: ac-6
        given: tool output may contain user-controlled content alongside ANSI codes
        when: ANSI codes are converted to HTML
        then: all non-ANSI content is HTML-escaped before insertion to prevent XSS
      - id: ac-7
        given: tool output is 10000+ characters with many ANSI sequences
        when: rendered
        then: parsing and rendering completes without visible delay
      - id: ac-8
        given: tool/bash output is displayed in the session stream
        when: the rendering pipeline determines content type
        then: ANSI parsing applies only inside pre blocks for tool output — agent text messages use the
          markdown renderer and the two pipelines never process the same content
    status:
      maturity: draft
      implementation: implemented
requirements:
  - _ulid: 01KJZH33ZQ6DS7KTNFCRBBBBVX
    slugs:
      - e2e-test-daemon-isolation
    title: E2E Test Daemon Isolation
    type: requirement
    tags:
      - test
      - daemon
      - e2e
      - web-ui
    description: E2E (Playwright) tests must never interfere with user-invoked or other daemons. Tests
      must use ephemeral ports, isolated HOME/config, and deterministic cleanup — never killing
      processes by port number. This extends the vitest isolation patterns from
      @daemon-sensitive-cli-test-determinism to the Playwright E2E test infrastructure.
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    notes: []
    created: 2026-03-05T17:35:25.175Z
    acceptance_criteria:
      - id: ac-1
        given: E2E tests need a daemon for API/browser testing
        when: the Playwright test fixture starts a daemon
        then: the daemon binds to an ephemeral port (OS-assigned, port 0) so it never conflicts with user
          daemons or parallel test runs
      - id: ac-2
        given: a daemon is running on the default port (3456) before tests start
        when: E2E tests execute
        then: the user's daemon is never killed, stopped, or interfered with — tests use their own isolated
          port
      - id: ac-3
        given: E2E tests start a daemon in a temp directory
        when: the test fixture sets up the daemon environment
        then: HOME and config paths are isolated so daemon PID/port state does not leak to or from the
          ambient system
      - id: ac-4
        given: E2E tests complete (pass or fail)
        when: the Playwright test fixture tears down
        then: the test daemon is stopped via scoped kspec serve stop (not process killing) and temp
          directories are cleaned up
      - id: ac-5
        given: the test daemon port is dynamically assigned
        when: Playwright tests make API calls or navigate browser pages
        then: the port is propagated to all test fixtures and page URLs via the daemon fixture context
    status:
      maturity: draft
      implementation: implemented
  - _ulid: 01KKAYQYQJSF13A10F0AG08MBW
    slugs:
      - ui-url-panel-state
    title: URL-Driven Detail Panel State Management
    type: trait
    tags:
      - web-ui
      - navigation
    description: All detail panels/modals that sync state with URL query parameters must use goto() from
      $app/navigation for URL mutations (not replaceState, pushState, or window.history). This
      ensures $page.url updates reactively and prevents stale-URL effect loops where panels reopen
      after dismissal.
    depends_on: []
    implements: []
    relates_to:
      - "@web-dashboard"
    tests: []
    traits: []
    notes: []
    created: 2026-03-10T04:05:38.162Z
    acceptance_criteria:
      - id: ac-1
        given: a detail panel or modal is opened by setting a URL query parameter (e.g. ?ref=)
        when: the code updates the URL
        then: "goto(url, { replaceState: true, keepFocus: true, noScroll: true }) is used instead of
          replaceState, pushState, or window.history methods, ensuring $page.url updates reactively"
      - id: ac-2
        given: a detail panel or modal is dismissed (click outside, ESC, close button)
        when: the close handler runs
        then: the URL query parameter is removed via goto() and the reactive effect that watches
          $page.url.searchParams does not reopen the panel because $page.url reflects the updated
          URL
      - id: ac-3
        given: a user navigates to a page with ?ref= in the URL (e.g. from a cross-page link)
        when: the page loads and the detail panel opens
        then: dismissing the panel works correctly on the first attempt and the panel stays closed
      - id: ac-4
        given: a page uses URL query parameters for filter state (status, tag, plan)
        when: filters are updated
        then: goto() is used for URL mutations so $page.url stays in sync with the browser URL bar
    status:
      maturity: draft
      implementation: implemented
