          - given: "The ACP SDK sends tool calls in phases: registration (empty rawInput), input (populated
              rawInput), and completion (rawOutput + status)"
            id: ac-phased-tool-input
            then: The accumulator emits a tool_call_input event with the populated input so WebSocket consumers
