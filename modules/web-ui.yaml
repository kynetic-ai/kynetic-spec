features:
  - _ulid: 01KFHMFGD2563NGHJWPPXGN9CB
    slugs:
      - daemon-server
    title: Daemon Server Mode
    type: feature
    description: Long-running Elysia.js server that exposes kspec state via HTTP API and WebSocket for
      real-time updates. File watcher drives both WebSocket broadcast and entity cache invalidation.
      The server binds to a resolved daemon endpoint that defaults to 127.0.0.1 loopback and can be
      explicitly configured for other interfaces with visible unauthenticated-exposure warnings.
      Supports foreground and background modes with global daemon lifecycle metadata. Includes
      heartbeat ping/pong for connection health monitoring on runtimes that support it.
    status:
      maturity: draft
      implementation: in_progress
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits:
      - "@trait-json-output"
      - "@trait-error-guidance"
      - "@trait-shadow-commit"
      - "@trait-localhost-security"
      - "@trait-websocket-protocol"
    acceptance_criteria:
      - given: kspec is installed
        id: ac-1
        then: The Elysia HTTP server starts on the effective daemon port and bind host, defaulting to port
          3456 on 127.0.0.1
        when: the user runs "kspec serve start"
      - given: daemon.host is unset
        id: ac-2
        then: the daemon accepts only loopback HTTP and WebSocket connections
        when: the server binds to the network interface
      - given: daemon.host is unset
        id: ac-3
        then: the request is rejected with 403 Forbidden for HTTP or a policy-violation close for WebSocket
        when: a request is received from a non-loopback remote address or with a non-local Host or Origin
      - given: daemon is running
        id: ac-4
        then: connected WebSocket clients receive update event via topic subscription
        when: any .kspec/*.yaml file changes
      - given: file watching is active
        id: ac-5
        then: events are debounced and aggregated into single notification
        when: rapid changes occur (< 500ms apart)
      - given: watched file has YAML parse error
        id: ac-6
        then: error logged and WebSocket broadcasts error event (daemon does not crash)
        when: change detected
      - given: .kspec directory becomes inaccessible
        id: ac-7
        then: daemon logs error and attempts recovery with exponential backoff
        when: watcher encounters error
      - given: the daemon needs to detect file changes
        id: ac-8
        then: changes are detected reliably across all supported platforms without manual configuration
        when: file monitoring is initialized
      - given: daemon is not running
        id: ac-9
        then: the process detaches to the background, writes global daemon lifecycle and connection metadata
          under ~/.config/kspec/, and the CLI returns immediately
        when: the user runs "kspec serve start --detach"
      - given: daemon is running in background
        id: ac-10
        then: the daemon shuts down gracefully, removes global daemon lifecycle and connection metadata, and
          closes all WebSocket connections
        when: the user runs "kspec serve stop"
      - given: daemon is running
        id: ac-11
        then: returns {status, uptime, connections, version} JSON
        when: GET /api/health is called
      - given: daemon receives SIGTERM or SIGINT
        id: ac-12
        then: graceful shutdown (flush pending messages, close connections, save state)
        when: shutdown signal received
      - given: WebSocket connection established
        id: ac-13
        then: server sends ping frame
        when: 30 seconds pass without activity
      - given: ping was sent
        id: ac-14
        then: connection closed with code 1001
        when: no pong received within 90 seconds
      - given: Elysia server is configured
        id: ac-15
        then: use plugin pattern for middleware (CORS, logging, validation)
        when: routes are registered
      - given: The daemon is configured to use bun runtime and the daemon code is ready
        id: ac-16
        then: produces standalone executable without requiring Bun installation
        when: bun build --compile runs
      - given: daemon is running with web UI assets available
        id: ac-17
        then: the daemon serves the built web UI assets as the root route
        when: browser opens the advertised daemon api_url
      - given: the daemon is running
        id: ac-18
        then: it returns per-project cache state including domain states (unloaded/loading/ready/degraded),
          watcher status, entry counts per domain, and last invalidation timestamps
        when: GET /api/debug/cache-status is requested
      - given: The daemon's served web UI bundle has changed since an earlier entry response
        id: ac-root-route-current-entry
        then: The response contains the entry document for the currently served bundle
        when: A client requests the daemon root route
      - given: The daemon's served web UI bundle has changed since an earlier entry response
        id: ac-app-route-current-entry
        then: The response contains the entry document for the currently served bundle
        when: A client requests a web UI application route
      - given: daemon.host is explicitly configured to a non-loopback or wildcard address
        id: ac-external-bind-warning
        then: the server binds to that address and emits the external binding warning required by
