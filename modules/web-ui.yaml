  - _ulid: 01KKCA3PZDN8667JGTAE51ZSQB
    slugs:
      - ansi-terminal-rendering
    title: ANSI Terminal Output Rendering
    type: feature
    description: >-
      Parse and render ANSI SGR (Select Graphic Rendition) escape sequences in terminal/bash tool
      output displayed in the session stream. Convert ANSI color codes to styled HTML spans so
      terminal output appears with the same colors and formatting as a real terminal.


      Currently ToolCallView.svelte renders output in a plain <pre> tag — ANSI codes show as garbled
      raw text.


      Scope: SGR codes only (colors, bold, dim, italic, underline, strikethrough, reset). Cursor
      movement and screen control codes (CUU, CUD, clear, etc.) are outside scope and should be
      stripped.


      Rendering pipeline: Tool/bash output stays in <pre> blocks and is never markdown-parsed. ANSI
      color rendering applies only inside these <pre> blocks. Agent text messages continue to use
      the markdown renderer. The two parsers never touch the same content.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: tool output contains ANSI SGR escape sequences (e.g. \x1b[32mPASS\x1b[0m)
        id: ac-1
        then: the text renders with corresponding CSS colors instead of showing raw escape codes
        when: the output is displayed in ToolCallView
      - given: "tool output uses ANSI color codes: standard 16 colors (30-37, 40-47, 90-97, 100-107),
          256-color mode (38;5;N / 48;5;N), or 24-bit true color (38;2;R;G;B / 48;2;R;G;B)"
        id: ac-2
        then: colors render correctly using CSS custom properties that integrate with the existing oklch
          token system and work in both light and dark themes
        when: rendered in the web UI
      - given: tool output contains formatting codes (bold=1, dim=2, italic=3, underline=4, strikethrough=9)
        id: ac-3
        then: corresponding CSS styles are applied (font-weight, opacity, font-style, text-decoration)
        when: rendered in the web UI
      - given: tool output contains reset codes (\x1b[0m for full reset, or specific resets like \x1b[22m)
        id: ac-4
        then: styling resets correctly without leaking to subsequent text
        when: rendered
      - given: tool output contains ANSI parameter sequences but the ESC character was stripped or lost
          during storage
        id: ac-5
        then: the raw bracket sequences are stripped rather than displayed as garbled text — fallback to
          clean plain text
        when: rendered
      - given: tool output may contain user-controlled content alongside ANSI codes
        id: ac-6
        then: all non-ANSI content is HTML-escaped before insertion to prevent XSS
        when: ANSI codes are converted to HTML
      - given: tool output is 10000+ characters with many ANSI sequences
        id: ac-7
        then: parsing and rendering completes without visible delay
        when: rendered
      - given: tool/bash output is displayed in the session stream
        id: ac-8
        then: ANSI parsing applies only inside pre blocks for tool output — agent text messages use the
          markdown renderer and the two pipelines never process the same content
        when: the rendering pipeline determines content type
