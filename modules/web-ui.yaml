      - _ulid: 01KTD8S0NHAPTT9EW0V6RR3W2X
        slugs:
          - task-resource-resolution-api-contract
        title: Task Resource Resolution API Contract
        type: requirement
        description: >
          Task detail APIs expose a bounded resolved-resource projection and task-scoped bytes
          routes for the task's versioned `resource_refs` without embedding resource bytes in task
          indexes.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: |
              a task has one or more derived resource references
            id: ac-task-detail-exposes-resolved-resources
            then: >
              the response includes `resolved_resources`, where each entry reports owner type, owner
              ref, resource id, relative path, content type, byte size, recorded content hash,
              current content hash when available, drift status, and a human-readable status message
            when: |
              the task is read through the daemon task detail API
          - given: |
              a task detail response includes one or more `resolved_resources`
            id: ac-task-detail-exposes-resource-base-url
            then: >
              the response includes a task-scoped `resources_base_url` so clients construct
              `resources_base_url/<resource-id>/bytes` without guessing whether the bytes are
              plan-owned or task-owned
            when: |
              a client needs browser-fetchable bytes for a resolved task resource
          - given: |
              tasks with resource references exist in the project
            id: ac-task-resource-index-stays-bounded
            then: |
              those surfaces do not embed resource bytes or unbounded resource manifests
            when: |
              task list, dashboard, cache warm-up, or other index-tier surfaces are read
          - given: >
              a task resource reference is plan-owned and its current plan resource hash matches the
              hash recorded at task derivation
            id: ac-task-resource-bytes-serve-present-plan-owned-ref
            then: >
              the route returns the referenced plan resource bytes with content type, content
              length, and `X-Kspec-Resource-Sha256` matching the current declared resource
            when: |
              `GET /api/tasks/:ref/resources/:resourceId/bytes` is requested for that resource
          - given: >
              a task resource reference is task-owned because the task was derived with explicit
              resource materialization
            id: ac-task-resource-bytes-serve-present-task-owned-copy
            then: >
              the route returns the copied task-owned resource bytes with content type, content
              length, and `X-Kspec-Resource-Sha256` matching the task-owned manifest entry
            when: |
              `GET /api/tasks/:ref/resources/:resourceId/bytes` is requested for that resource
          - given: |
              a task resource reference is drifted, missing, or unresolved
            id: ac-task-resource-bytes-refuse-drifted-or-missing-ref
            then: >
              the response reports the exact status and does not stream replacement bytes that
              differ from the hash recorded at task derivation
            when: >
              a task resource detail route or task resource bytes route is requested for that
              resource
        tags: []
        created: 2026-06-06T01:29:20.305Z
        notes: []
