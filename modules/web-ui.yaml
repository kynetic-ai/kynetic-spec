  - _ulid: 01KKQRK0C161X7JRT3RZKDAB6F
    slugs:
      - ui-data-freshness
    title: UI Data Freshness and Caching
    type: feature
    description: |
      The web UI maintains a shared, reactive data cache that provides instant
      page transitions, request deduplication, and real-time updates without
      per-page independent fetching. Data fetched by one page is available to
      all pages. Real-time events drive cache invalidation. The UI degrades
      gracefully when the daemon is unreachable and supports read-only static
      mode for exported snapshots.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: |
          A page fetches data on first visit
        id: ac-1
        then: |
          The page renders immediately from cached data without a loading
          state, then revalidates in the background if the data is stale.
        when: |
          The user navigates away and returns to the same page
      - given: |
          Two or more pages or components need the same data concurrently
        id: ac-2
        then: |
          Only one HTTP request is made. Both consumers share the result.
        when: |
          Both are active at the same time
      - given: |
          A WebSocket broadcast event indicates data has changed
        id: ac-3
        then: |
          Cached data for the affected entity type is invalidated and
          active views revalidate in the background. If the broadcast
          includes sufficient enriched data, the cache is updated
          immediately without a server round-trip.
        when: |
          The event is processed by the UI
      - given: |
          The UI needs periodic status data (badge counts, agent status)
        id: ac-4
        then: |
          The data is served from cache and kept current via event-driven
          invalidation rather than timer-based polling.
        when: |
          The data changes on the server
      - given: |
          The user switches projects in the multi-directory daemon
        id: ac-5
        then: |
          All cached data is discarded. Subsequent data requests fetch
          fresh data for the new project.
        when: |
          The project context changes
      - given: |
          The app is running in static mode (exported snapshot)
        id: ac-6
        then: |
          The request is served from the static data source. No daemon
          HTTP calls are attempted.
        when: |
          A data request is made
      - given: |
          The daemon is unreachable or returns an error
        id: ac-7
        then: |
          The error is surfaced with appropriate messaging (e.g., daemon
          not running vs data error). Retry behavior is appropriate for
          localhost (minimal retries, short delay).
        when: |
          A data request fails
      - given: |
          A write operation is performed (start task, add note, etc.)
        id: ac-8
        then: |
          Related cached data is invalidated so the originating client
          updates immediately without waiting for a broadcast.
        when: |
          The operation succeeds
      - given: A user performs a hard page refresh or navigates directly to a URL
        id: ac-9
        then: The initialization lifecycle (mode detection, project loading, query enabling) completes and
          the page renders data. No SSR hydration mismatch prevents reactive state updates from
          propagating.
        when: The app initializes from scratch (no prior client state)
      - given: An entity can change through more than one server-side execution path
        id: ac-10
        then: The active view stays fresh without a manual reload, and the freshness contract does not
          depend on which internal path produced the change.
        when: Any path changes list-visible data for an active view
      - given: the server signals that its cache is still warming
        id: ac-warming-skeleton
        then: a loading skeleton is displayed instead of empty content, and the warming response is not
          persisted in the client cache as real data
        when: the UI receives the response
      - given: the UI is displaying a loading skeleton due to cache warming
        id: ac-warming-auto-transition
        then: the affected queries are invalidated and the view transitions to real data without user
          interaction
        when: a real-time event indicates the cache domain is ready
      - given: the UI is displaying a loading skeleton due to cache warming
        id: ac-warming-retry-fallback
        then: the UI retries the request at short intervals as a fallback for missed or delayed real-time
          events
        when: no real-time domain-ready event has been received
      - given: the UI has been retrying a cache-warming response
        id: ac-warming-timeout
        then: the UI displays an error state with a manual retry option instead of continuing to show the
          loading skeleton
        when: the retry ceiling (30 seconds) is reached without the cache becoming ready
    tags: []
    created: 2026-03-15T03:28:12.161Z
    notes: []
  - _ulid: 01KKSGSZ6S0C4F4XMRP1PNPZ8K
    slugs:
      - ws-session-event-streaming
    title: WebSocket Session Event Streaming
    type: feature
    description: |
      The session stream view receives all live session activity via WebSocket
      structured lifecycle events. Messages stream progressively at newline
      boundaries (not per-token). Tool calls show name and input immediately,
      with output fetched on demand. HTTP serves historical sessions and
      initial catch-up for live sessions already in progress.

      This replaces the current model where WebSocket sends raw text chunks
      and HTTP polls for structured events every 3 seconds during live sessions.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits:
      - "@trait-websocket-protocol"
    acceptance_criteria:
      - given: |
          A user is viewing a live session
        id: ac-message-start
        then: |
          A writing/thinking indicator appears for the in-progress message block.
        when: |
          The agent begins composing a response
      - given: |
          A user is viewing a live session where the agent is composing a response
        id: ac-message-progress
        then: |
          Completed lines stream into the message block progressively at
          newline boundaries. The user sees text appear line-by-line rather
          than waiting for the full message or seeing per-character updates.
        when: |
          The agent produces text that includes newline characters
      - given: |
          A user is viewing a live session where the agent is composing a response
        id: ac-message-complete
        then: |
          Any remaining buffered text is flushed to the message block.
          The writing indicator is removed. The message renders as a
          complete block identical to how it appears in historical playback.
        when: |
          The agent finishes the message (begins a tool call, starts thinking,
          ends the session, or starts a new turn)
      - given: |
          A user is viewing a live session
        id: ac-tool-call-start
        then: |
          A tool call block appears in "running" state showing the tool name
          and input parameters. No output is shown yet.
        when: |
          The agent initiates a tool call
      - given: |
          A user is viewing a live session with a running tool call
        id: ac-tool-call-complete
