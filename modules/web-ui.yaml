      - _ulid: 01KMMB3S2ST4PH6VDGQ6PP067S
        slugs:
          - daemon-entity-cache
        title: Daemon Entity Cache
        type: feature
        description: |
          Server-side in-memory cache for entity data served by the daemon API.
          The cache uses a two-tier model: index data (summaries, counts,
          references) is kept hot in memory, while detail data (full content,
          notes, event logs) is loaded on demand when accessed. The file watcher
          drives cache invalidation — when shadow branch files change, affected
          data is selectively reloaded. Data domains load progressively so
          high-priority data is available before the full cache is ready.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: |
              a project is registered with the daemon
            id: ac-load-on-register
            then: |
              index-tier entity data is loaded into memory and available for
              serving
            when: |
              the project's shadow branch directory is accessible
          - given: |
              a project's index data has been loaded into the cache
            id: ac-serve-from-memory
            then: |
              the response is served from the in-memory cache without reading
              files from disk or running git operations
            when: |
              an API list or summary request arrives for that project
          - given: |
              a request arrives for a single entity's full detail
            id: ac-detail-on-demand
            then: |
              the detail is loaded from disk, served, and optionally retained
              in cache until the next invalidation
            when: |
              the detail data is not in the cache
          - given: |
              the file watcher detects a change to a shadow branch file
            id: ac-watcher-invalidation
            then: |
              the affected data domain is reloaded from disk and the cache is
              updated before any subsequent request is served
            when: |
              the changed file belongs to a registered project
          - given: |
              a file change affects only one data domain
            id: ac-granular-reload
            then: |
              only the affected domain is reloaded, not unrelated domains
            when: |
              the cache processes the invalidation
          - given: |
              a write operation mutates entity data through the daemon API
            id: ac-write-through
            then: |
              the cache is updated with the new state before the response is
              sent, without waiting for the file watcher to detect the change
            when: |
              the mutation succeeds and is committed to the shadow branch
          - given: |
              multiple API requests arrive concurrently for the same project
            id: ac-concurrent-reads
            then: |
              all requests are served from the same cached data without
              blocking on each other or triggering redundant loads
            when: |
              the cache is populated
          - given: |
              multiple file changes arrive within a short window
            id: ac-reload-dedup
            then: |
              only a single reload is performed for each affected data domain,
              not one per file change event
            when: |
              the cache processes the invalidation events
          - given: |
              the cache encounters an error loading entity data
            id: ac-graceful-degradation
            then: |
              the request falls back to direct file reading and the error is
              logged, rather than failing the request entirely
            when: |
              an API request arrives
          - given: |
              multiple projects are registered with the daemon
            id: ac-project-isolation
            then: |
              other projects' cached data is not affected or reloaded
            when: |
              one project's cache is invalidated
          - given: |
              a project is unregistered from the daemon
            id: ac-unregister-cleanup
            then: |
              all cached data for that project is released from memory
            when: |
              the project context is removed
          - given: |
              a project has more sessions than the configured retention window
            id: ac-session-bounded-index
            then: |
              only the most recent sessions (up to the configured limit) are
              retained in the index; older sessions are accessible on demand
              but not held in the cache
            when: |
              the session index is loaded or refreshed
          - given: |
              a session has active status but exceeds the stale session
              criteria (age and inactivity thresholds)
            id: ac-session-stale-exclusion
            then: |
              the session is not treated as active in the cached index
            when: |
              the session index is loaded or refreshed
          - given: |
              a project is registered and cache loading is in progress
            id: ac-warming-availability
            then: |
              the request receives a response indicating the data is still
              loading rather than blocking until the full cache is ready
            when: |
              an API request arrives before loading completes
          - given: |
              a project begins cache loading on registration
            id: ac-progressive-loading
            then: |
              requests for loaded domains are served from cache immediately
              while remaining domains continue loading
            when: |
              high-priority data domains finish loading before others
          - given: a cache domain has reached ready state and a reload is triggered by file watcher invalidation
              or write-through
            id: ac-stale-during-reload
            then: the domain state remains ready and previously cached data continues to be served until the
              reload completes and the new data is swapped in — the domain never regresses to
              loading during a reload of already-populated data
            when: an API request arrives for data in that domain during the reload
          - given: a cache domain transitions to ready state (from loading, degraded, or any non-ready state)
            id: ac-domain-ready-event
            then: a real-time event is broadcast to all connected clients identifying the domain and project
              that became ready
            when: the transition completes
          - given: a session is active and events are being recorded
            id: ac-session-live-counter
            then: the event count reflects the current number of events recorded so far, without requiring a
              scan of stored event data
            when: the session list is served
          - given: the dispatch engine appends an event to an active session
            id: ac-session-event-tracking
            then: the cached event count for that session is incremented and available to subsequent list
              requests
            when: the event is successfully recorded
          - given: a session reaches a terminal status
            id: ac-session-stats-persist
            then: session statistics are persisted in the session metadata
            when: the session is closed
          - given: a session transitions from active to a terminal status
            id: ac-session-stats-handoff
            then: stats are read from persisted metadata rather than any live tracking state
            when: the session list is subsequently served
          - given: a file watcher detects a change that triggers a cache domain reload
            id: ac-broadcast-after-reload
            then: the WebSocket broadcast for the change is emitted after the cache reload finishes
            when: the reload completes and fresh data is available in cache
          - given: A cache domain reload enumerates filesystem directories (e.g. listing session directories to
              build the session index)
            id: ac-deterministic-fd-cleanup
            then: All directory handles opened during enumeration are closed before the reload function returns
            when: The enumeration completes or fails
          - given: Multiple cache domains are invalidated within the same debounce window
            id: ac-context-reuse
            then: Shared initialization work is performed once and reused across all domain reloads in that
              window
            when: The cache begins reloading affected data
          - given: The task cache domain loads or incrementally updates a task
            id: ac-task-history-retention
            then: Field-change history entries from the task file are retained in the cache and available to
              consumers without re-reading the file from disk
            when: The task file is parsed
          - given: |-
              the tasks cache domain cannot load because the project's task storage state
              is incompatible with the running daemon or requires migration
            id: ac-task-storage-incompatibility-degraded-state
            then: the tasks cache domain is reported as degraded
            when: the tasks cache domain state is observed
          - given: |-
              the tasks cache domain is degraded for a deterministic task-storage
              compatibility or migration problem
            id: ac-task-storage-incompatibility-stable-reporting
            then: the daemon does not emit repeated failure reports for the unchanged problem
            when: task cache activity occurs before relevant task-storage project state changes
          - given: |-
              the tasks cache domain is degraded for a deterministic task-storage
              compatibility or migration problem
            id: ac-task-storage-incompatibility-rechecked-after-storage-change
            then: the tasks cache domain is re-evaluated against the current task-storage state
            when: relevant task-storage project state changes
          - given: |-
              the tasks cache domain is degraded for a task-storage compatibility or
              migration problem
            id: ac-task-storage-incompatibility-recovers-after-migration
            then: |-
              the tasks cache domain returns to an available state without restarting the
              daemon
            when: the project is migrated to a task-storage state the daemon can read
          - given: |-
              the tasks cache domain is degraded for a task-storage compatibility or
              migration problem
            id: ac-task-storage-incompatibility-persists-when-unresolved
            then: the tasks cache domain remains degraded
            when: task-storage project state changes but the compatibility problem remains
          - given: the project manifest contains task-storage compatibility settings
            id: ac-manifest-task-storage-settings-affect-tasks-domain
            then: |-
              the tasks cache domain evaluates compatibility against the updated manifest
              state
            when: those task-storage compatibility settings change
          - given: A file watcher detects a change inside a registered project's folder-backed entity directory
            id: ac-folder-backed-entity-directory-invalidation
            then: The cache invalidates and reloads the plans domain for plan-directory changes or the reviews
              domain for review-directory changes
            when: The changed path is under .kspec/plans/<plan-ulid>/ or .kspec/reviews/<review-ulid>/
        tags: []
        requirements:
          - _ulid: 01KMMB3S7MJZ9ZJKZT31QPM572
            slugs:
              - daemon-read-path
            title: Daemon Read Path Optimization
            type: requirement
            description: |
              API read routes serve responses from the entity cache. Per-request
              sync operations move to the background sync scheduler so that read
              requests involve no git operations or filesystem reads.
            status:
              maturity: draft
              implementation: implemented
            depends_on: []
            implements: []
            relates_to: []
            tests: []
            traits: []
            acceptance_criteria:
              - given: |
                  the daemon is running with a registered project
                id: ac-no-per-request-sync
                then: |
                  no git operations are performed as part of handling the request
                when: |
                  a read-only API request arrives
              - given: |
                  the daemon's sync interval elapses
                id: ac-background-sync
                then: |
                  drift-check and pull happen in the background, and if new data
                  is pulled, the entity cache is invalidated and reloaded
                when: |
                  the background sync scheduler runs
              - given: |
                  a route needs a reference index or alignment index
                id: ac-index-from-cache
                then: |
                  the index is built from cached entity data, not from fresh
                  disk reads
                when: |
                  the request handler builds the index
              - given: |
                  a write operation is received through the daemon API
                id: ac-write-routes-sync
                then: |
                  the daemon commits the change to the shadow branch using the
                  standard write path before updating the cache
                when: |
                  the daemon processes the mutation
            tags: []
            created: 2026-03-26T05:50:40.372Z
            notes: []
        created: 2026-03-26T05:50:40.217Z
        notes: []
