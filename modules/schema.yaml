        title: Zod Schema Definition
        type: requirement
        description: |
          Schema is defined using Zod (TypeScript validation library):
          - Source of truth for item structure
          - z.infer<> generates TypeScript types
          - z.toJSONSchema() exports JSON Schema for docs/external tools

          Zod chosen for ecosystem size, type inference, JSON Schema export.
        status:
          maturity: draft
          implementation: implemented
        depends_on:
          - "@spec-item"
        implements:
          - "@validation"
        acceptance_criteria:
          - given: Manifest or item data is loaded into kspec
            id: ac-1
            then: Zod definitions act as the source of truth for accepted structure and for any validation
              errors that are reported
            when: Schema validation runs
      - _ulid: 01KEZCJPJ373KGN2PK8P3XQ929
        slugs:
          - validation-modes
        title: Validation Modes
        type: requirement
        description: >-
          `kspec validate` supports scoped and combinable mode flags.


          Mode flags:

          - --schema

          - --refs

          - --orphans

          - --alignment

          - --completeness

          - --conventions

          - --staleness

          - --skills

          - --drift


          Behavior:

          - No mode flags: run full validation surface

          - One mode flag: run only that mode's checks

          - Multiple mode flags: run the union of selected checks


          CI should run `kspec validate` (full baseline) and may run scoped modes for focused
          debugging.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@validation"
        acceptance_criteria:
          - given: No mode flags are passed to kspec validate
            id: ac-mode-default-all
            then: All validation modes execute.
            when: Validation runs
          - given: A single mode flag (for example --staleness or --completeness) is passed
            id: ac-mode-flag-isolation
            then: Only the selected mode's checks execute.
            when: Validation runs
          - given: Multiple mode flags are passed
            id: ac-mode-flag-combination
            then: Validation executes the union of selected modes and does not run unselected modes.
            when: Validation runs
      - _ulid: 01KEZCJPJ42RZQPFC962QV2TP3
        slugs:
          - validation-output
        title: Validation Output
        type: requirement
        description: |
          Validation output includes:
          - List of errors (must fix)
          - List of warnings (should fix)
          - Summary counts

          JSON output (--json) for programmatic consumption:
          { "valid": false, "errors": [...], "warnings": [...] }
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@validation"
        acceptance_criteria:
          - given: Validation finds schema, reference, or completeness issues
            id: ac-1
            then: Output lists the errors, warnings, and summary counts needed to understand the result
            when: kspec validate finishes in text mode
          - given: A user runs kspec validate --json
            id: ac-2
            then: Stdout contains valid JSON with validity, errors, and warnings fields for programmatic
              consumers
            when: Validation completes
