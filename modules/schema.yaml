      - _ulid: 01KG385W7W2R2HV8ZG5XQHJMBF
        slugs:
          - manifest-discovery
        title: Manifest File Discovery
        type: requirement
        description: >-
          Defines how kspec discovers manifest files in a project directory.


          Discovery algorithm:

          1. Check for explicit names: kynetic.yaml, kynetic.spec.yaml (in order)

          2. If not found, scan directory for *.yaml files (excluding *.tasks.yaml, *.inbox.yaml,
          *.meta.yaml, *.runs.yaml)

          3. For each candidate, validate it contains a 'kynetic:' version field

          4. Return first valid match (alphabetical order for non-explicit names)


          This provides backward compatibility while supporting project-specific naming like
          {slug}.yaml.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: A directory with kynetic.yaml
            id: ac-1
            then: Returns kynetic.yaml path
            when: Finding the manifest
          - given: A directory with kynetic.spec.yaml but no kynetic.yaml
            id: ac-2
            then: Returns kynetic.spec.yaml path
            when: Finding the manifest
          - given: A directory with {slug}.yaml containing kynetic version field
            id: ac-3
            then: Returns {slug}.yaml path
            when: Finding the manifest and no kynetic.yaml or kynetic.spec.yaml exists
          - given: Multiple *.yaml files matching pattern
            id: ac-4
            then: Returns first alphabetically after checking explicit names
            when: Finding the manifest
          - given: A *.yaml file without kynetic version field
            id: ac-5
            then: File is skipped as invalid manifest
            when: Finding the manifest
          - given: Any production code path needs to read the project manifest
            id: ac-6
            then: Must use the manifest discovery API (findManifestInDir/findManifest), never hardcode a
              filename like kynetic.yaml
            when: Resolving the manifest file path
        tags: []
        created: 2026-01-28T21:29:30.620Z
        notes: []
  - _ulid: 01KEZCJPJ3K12YTFTPFB1EHC63
    slugs:
      - yaml-conventions
      - yaml-safety
    title: YAML Conventions
    type: feature
    description: |
      YAML has pitfalls (Norway problem, type coercion).
      These conventions ensure safe, predictable parsing.
    status:
      maturity: draft
      implementation: implemented
    acceptance_criteria:
      - given: A manifest contains YAML values that are prone to implicit coercion or formatting ambiguity
        id: ac-1
        then: The YAML conventions preserve predictable values instead of silently changing their meaning
        when: kspec parses or rewrites the file
      - given: A project follows the quoting and literal-block conventions defined under @yaml-conventions
        id: ac-2
        then: The resulting file remains readable and semantically equivalent to the original content
        when: Its YAML is round-tripped through kspec
    priority: high
    tags:
      - mvp
      - schema
    requirements:
      - _ulid: 01KEZCJPJ3Z9T0AWQGEJ3GW2WZ
        slugs:
          - yaml-version
        title: YAML 1.2 Required
        type: requirement
        description: |
          Parsers MUST use YAML 1.2 (not 1.1).
          YAML 1.1 has dangerous implicit typing:
          - "NO" -> false
          - "on" -> true
          - "3.14" might become float

          YAML 1.2 is stricter and safer.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@yaml-conventions"
        acceptance_criteria:
          - given: a YAML file is parsed by kspec
            id: ac-1
            then: YAML 1.2 parser is used (not YAML 1.1) to avoid dangerous implicit typing
            when: the parser initializes
          - given: YAML content contains strings like 'NO', 'on', 'true'
            id: ac-2
            then: they are treated as strings, not booleans (YAML 1.2 is stricter and safer)
            when: parsed with YAML 1.2
      - _ulid: 01KEZCJPJ3MFX4H51TN64GEB6T
        slugs:
          - yaml-quoting
        title: Quote Ambiguous Strings
        type: requirement
        description: |
          Strings that might be misinterpreted MUST be quoted:
          - "NO", "YES", "true", "false", "on", "off"
          - Numbers that should be strings: "3.14", "1.0"
          - Special values: "null", "~"

          The linter should catch unquoted ambiguous values.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@yaml-conventions"
        acceptance_criteria:
          - given: YAML content contains ambiguous values like 'NO', 'YES', '3.14', 'null'
            id: ac-1
            then: warnings are emitted for unquoted ambiguous strings (they must be quoted to prevent
              misinterpretation)
            when: the linter runs
          - given: YAML content has properly quoted ambiguous values
            id: ac-2
            then: quoted values are accepted without warnings (e.g., '"NO"', '"3.14"', '"null"')
            when: validation runs
      - _ulid: 01KEZCJPJ3M7T6ZNEMTVYBWP96
        slugs:
          - yaml-multiline
        title: Multiline with Literal Blocks
        type: requirement
        description: |
          Multiline strings SHOULD use literal block style (|):

          description: |
            This is a multiline description.
            It preserves newlines.

          This is cleaner than quoted strings with \n.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@yaml-conventions"
        acceptance_criteria:
          - given: a spec item has multiline description
            id: ac-1
            then: literal block style (|) is used for cleaner formatting (preserves newlines without \n escape
              sequences)
            when: the YAML is written
          - given: multiline content uses literal block style
            id: ac-2
            then: newlines are preserved and the content is readable (recommended practice for descriptions and
              notes)
            when: the YAML is parsed
    notes:
      - _ulid: 01KFF74KDRTV1HZMR7GRANXD3W
        content: The 'yaml' library (v2.8.2+) has a known behavior where block scalars containing
          whitespace-only lines accumulate extra blank lines on each parse-stringify cycle. This is
          expected library behavior, not a bug. The writeYamlFilePreserveFormat() function includes
          a workaround that filters whitespace-only lines from output. See src/parser/yaml.ts for
          implementation details.
        supersedes: null
        author: "@claude"
        created_at: 2026-01-21T02:46:31.609Z
  - _ulid: 01KEZCJPJ36HXNV019K1S25BNM
    slugs:
      - validation
