    requirements:
      - _ulid: 01KJVPSXJDA0X7QW622DDD00R3
        slugs:
          - dispatch-in-progress-priority
        title: In-Progress Dispatch Priority
        type: requirement
        description: Define dispatch behavior so tasks already in progress are prioritized ahead of pending,
          needs_work, and pending_review when dispatch scheduling chooses what to run next. This
          preserves continuity and prevents partially executed work from being pre-empted by newly
          queued items.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: the dispatch engine has in_progress tasks and also has pending, needs_work, or pending_review
              tasks
            id: ac-1
            then: in_progress work is selected before lower-priority status buckets
            when: the scheduler decides which eligible invocation to dispatch next
          - given: the daemon or dispatch engine starts while tasks are already in_progress
            id: ac-2
            then: in_progress tasks are considered dispatch candidates and can be queued without waiting for a
              new external state transition
            when: bootstrap evaluation runs
          - given: agent definitions include dispatch rules and filters
            id: ac-3
            then: in_progress-compatible dispatch configuration is supported and can be constrained to
              automation-eligible tasks
            when: dispatch event types are validated and built-in worker defaults are seeded
          - given: the dispatch engine has both pending_review and pending task candidates and no in_progress
              work is waiting
            id: ac-4
            then: pending_review work is selected before pending work so review handoff is not starved by new
              assignments
            when: the scheduler decides which eligible invocation to dispatch next
        tags: []
        requirements:
          - _ulid: 01KKFY94D7CQSY0ABQ35SHCCER
            slugs:
              - dispatch-scheduling-priority-model
            title: Dispatch Scheduling Priority Model
            type: requirement
            description: |
              Dispatch ordering is governed by one explicit cross-agent scheduler
              contract spanning candidate kind, numeric task priority, continuity or
              affinity, and fairness. Agent definition order must not be the deciding
              rule for cross-agent work ordering.
            status:
              maturity: draft
              implementation: implemented
            depends_on: []
            implements: []
            relates_to: []
            tests: []
            traits:
              - "@trait-priority-parameter"
            acceptance_criteria:
              - given: |
                  The scheduler evaluates queued or candidate invocations
                id: ac-1
                then: |
                  Only candidates that satisfy the applicable eligibility contract are
                  ranked: pending and needs_work candidates must pass base task
                  readiness, in_progress and pending_review candidates must come from
                  explicit continuation or handoff dispatch support, and any candidate
                  with stale workspace state or unresolved dependency blocking is
                  excluded
                when: |
                  It determines eligibility
              - given: |
                  Eligible candidates exist across candidate bands
                id: ac-2
                then: |
                  The fixed band order is in_progress first, then needs_work, then
                  pending_review, then pending
                when: |
                  The scheduler ranks them
              - given: |
                  Multiple eligible candidates share the same candidate band
                id: ac-3
                then: |
                  Lower numeric task priority values (P1 before P5) rank ahead of higher
                  numeric values before continuity or FIFO is considered
                when: |
                  The scheduler ranks them
              - given: |
                  Multiple eligible candidates share the same candidate band and the same
                  numeric priority
                id: ac-4
                then: |
                  Continuity or affinity signals may prefer continuing an active review
                  or fix-cycle chain before unrelated work
                when: |
                  The scheduler ranks them
              - given: |
                  Continuity or affinity would otherwise keep skipping other equal-band,
                  equal-priority work indefinitely
                id: ac-5
                then: |
                  Continuity or affinity is ignored for that comparison and the oldest
                  equal-band, equal-priority eligible candidate wins
                when: |
                  A candidate exceeds the scheduler's starvation threshold
              - given: |
                  pending_review and pending candidates both exist and no in_progress or
                  needs_work work is waiting
                id: ac-6
                then: |
                  pending_review work remains ahead of pending work as a hard scheduler
                  rule, not merely an affinity preference
                when: |
                  The scheduler selects the next invocation
              - given: |
                  The scheduler chooses between worker and reviewer candidates
                id: ac-7
                then: |
                  The chosen order follows the scheduler contract above rather than agent
                  definition order alone
                when: |
                  Their relative rank is determined
              - given: queued dispatch candidates are excluded during eligibility pruning
                id: ac-8
                then: dispatch diagnostics identify the task ref, agent, and exclusion reason for each discarded
                  candidate instead of logging only aggregate discard counts
                when: the scheduler discards a worker or reviewer candidate
            tags: []
            created: 2026-03-12T02:33:44.615Z
            notes: []
        created: 2026-03-04T05:58:17.421Z
        notes: []
      - _ulid: 01KKFY9455V9VQ1N1B2FV7SQXS
        slugs:
