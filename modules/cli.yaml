requirements:
  - _ulid: 01KF109BR2PZACTM1Y91NWEEJQ
    slugs:
      - cmd-session-checkpoint
    title: kspec session checkpoint
    type: requirement
    description: >-
      Pre-stop hook for Claude Code integration.


      Checks for uncommitted git changes (staged, unstaged, untracked) before allowing session to
      end. Focuses on preventing data loss from uncommitted work.


      One-time trigger: Reads stop_hook_active from Claude Code stdin JSON to detect retry. First
      trigger blocks with instructions, subsequent triggers allow stop.


      Output: JSON formatted for Claude Code hook consumption with clear kspec-branded message
      instructing agent to commit changes. Uses {"decision": "block", "reason": "..."} format.


      Installation: Controlled by project configuration (kspec.config.yaml). Disabled by default.
      When enabled, kspec setup installs this hook to project-level .claude/settings.json. Hook
      format requires matcher field (even if empty string).
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    acceptance_criteria:
      - given: The checkpoint hook is triggered
        id: ac-git-only
        then: Only uncommitted git changes are reported as issues. Task status and todo completeness are not
          checked.
        when: It evaluates session state
      - given: A new project runs kspec init or kspec setup
        id: ac-default-disabled
        then: The checkpoint hook is not installed.
        when: No checkpoint preference is configured
      - given: Project configuration has checkpoint enabled
        id: ac-install-when-enabled
        then: The checkpoint hook is installed.
        when: kspec setup configures agent hooks
      - given: The checkpoint hook was previously installed
        id: ac-remove-when-disabled
        then: The hook is removed.
        when: kspec setup runs and checkpoint is disabled or unconfigured
    tags: []
    requirements:
      - _ulid: 01KF1D9G8HNSYRTPTPZZ4NVXJ1
        slugs:
          - cmd-session-prompt-check
        title: kspec session prompt-check
        type: requirement
        description: >-
          UserPromptSubmit hook for spec-first workflow reinforcement.


          Outputs a lean reminder on every user prompt: '[kspec] Before implementing behavior
          changes, check spec coverage. Update spec first if needed.'


          Design rationale:

          - Always injects (no filtering) - Claude is smart enough to apply when relevant

          - Minimal token overhead - short, instructive message

          - Non-blocking - context injection, not gating


          Installation: kspec setup automatically installs this hook alongside session checkpoint to
          project-level .claude/settings.json for Claude Code users.


          Acceptance Criteria:

          - AC1: Outputs single-line reminder to stdout

          - AC2: No stdin parsing required (stateless)

          - AC3: Installed by setup command as UserPromptSubmit hook
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        acceptance_criteria:
          - given: The UserPromptSubmit hook is invoked for a user prompt.
            id: ac-1
            then: It writes the single-line spec-first reminder to stdout.
            when: The `kspec session prompt-check` command runs.
          - given: The hook runs without any piped prompt payload.
            id: ac-2
            then: It completes without needing to read or parse stdin.
            when: The command executes.
          - given: A user runs `kspec setup` in a Claude Code project.
            id: ac-3
            then: The setup flow installs `kspec session prompt-check` as a `UserPromptSubmit` hook alongside
              the session checkpoint hook.
            when: Project hooks are installed.
        tags: []
