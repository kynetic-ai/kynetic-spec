      - _ulid: 01KKER1SDTFB94KPQA4D16C1B6
        slugs:
          - invocation-initial-activity-watchdog
        title: Initial Activity Watchdog
        type: feature
        description: Detects when an agent accepts a prompt via ACP but never starts producing meaningful
          output. Races a stall timer alongside the prompt promise and fails fast on detection,
          allowing the dispatch engine's reconciliation cycle to retry without penalty. Prevents
          wasting the full invocation timeout budget on non-responsive agent sessions.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits:
          - "@trait-error-guidance"
        acceptance_criteria:
          - given: An agent invocation has sent the prompt via session/prompt
            id: ac-1
            then: The invocation detects the stall and cancels the ACP session
            when: No meaningful session updates (agent_message_chunk, agent_thought_chunk, tool_call,
              tool_call_update, plan, usage_update) are received within the configured
              initial_response_timeout_seconds (default 120)
          - given: A stall has been detected per ac-1
            id: ac-2
            then: The agent process is terminated, the session is closed with status stalled and a reason
              indicating the duration, and no task note is added
            when: The invocation handles the stall
          - given: An agent invocation has sent the prompt via session/prompt
            id: ac-3
            then: The stall timer is cancelled and never fires for the remainder of the invocation, allowing the
              normal invocation timeout to govern session lifetime
            when: A meaningful session update arrives before the stall timer fires
          - given: A prior invocation ended with status stalled
            id: ac-4
            then: Stalled sessions are excluded from the count because they are transient infrastructure issues
              not agent logic failures
            when: The consecutive failure counter evaluates the task history
          - given: An agent definition includes a budget configuration
            id: ac-5
            then: The stall watchdog uses the configured value instead of the default 120 seconds
            when: The initial_response_timeout_seconds field is set
        tags: []
        created: 2026-03-11T15:25:38.107Z
        notes: []
