      - _ulid: 01KKFY94AJP149MMKWA8TK89G2
        slugs:
          - scoped-dispatch-shadow-serialization
        title: Scoped Dispatch Shadow Serialization
        type: requirement
        description: |
          Shadow-branch protection serializes only kspec metadata mutations, not the
          full lifetime of every invocation, so isolated code work can overlap safely
          across worker and reviewer roles.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits:
          - "@trait-error-guidance"
        acceptance_criteria:
          - given: |
              Two isolated invocations are running concurrently in separate code
              worktrees
            id: ac-1
            then: |
              They are allowed to continue in parallel without waiting on a global
              invocation-level mutex
            when: |
              Neither invocation is performing a kspec mutation
          - given: |
              Multiple invocations attempt shadow-branch mutations such as task note,
              task submit, task needs-work, or plan/task metadata writes
            id: ac-2
            then: |
              Only the mutation sections are serialized so shadow branch integrity is
              preserved
            when: |
              Those mutation windows overlap
          - given: |
              A mutation-level lock cannot be acquired or a protected mutation fails
            id: ac-3
            then: |
              The error is surfaced as a mutation failure, not disguised as a generic
              workspace execution failure
            when: |
              The invocation handles the failure
          - given: Multiple dispatch-scoped kspec CLI mutations are queued behind a held lock
            id: ac-4
            then: Waiting mutations block until the lock is released
            when: The lock holder process is alive, executing, and has not exceeded the maximum hold duration
              ceiling
          - given: A dispatch mutation is waiting for the shadow mutation lock
            id: ac-5
            then: Stale lock detection identifies the orphaned lock, cleans it up, and the waiting mutation
              acquires the lock without manual intervention
            when: The lock holder process is no longer alive
          - given: The KSPEC_SHADOW_MUTATION_LOCK_TIMEOUT_MS environment variable is set to a finite value
            id: ac-6
            then: The explicit timeout is honored, overriding the default wait-indefinitely behavior
            when: A dispatch mutation waits for the lock
          - given: The shadow mutation lock is acquired for a protected operation
            id: ac-7
            then: The lock is released before any subsequent work continues in that code path
            when: The operation completes, whether successfully or with an error
          - given: The shadow mutation lock has been held by a process
            id: ac-8
            then: The lock is eligible for reclamation by other processes regardless of whether the holder
              process is alive
            when: The hold duration exceeds a configurable maximum (KSPEC_SHADOW_MUTATION_LOCK_MAX_HOLD_MS
              environment variable, defaulting to 30000ms)
          - given: Periodic reconciliation evaluates multiple workspace records requiring shadow mutations
            id: ac-9
            then: Reconciliation yields the lock between individual record evaluations so waiting mutations can
              interleave
            when: Other processes are waiting to acquire the shadow mutation lock
          - given: A process attempts to acquire the shadow mutation lock and the current holder process is
              alive but has held the lock beyond the maximum duration ceiling
            id: ac-10
            then: The lock is treated as orphaned and reclaimed, with a diagnostic message identifying the
              previous holder
            when: The acquiring process evaluates lock staleness
          - given: A process reclaims the shadow mutation lock from a holder that exceeded the maximum hold
              duration
            id: ac-11
            then: The new holder checks the shadow worktree for uncommitted dirty state from the previous holder
              and rolls back uncommitted changes before proceeding with its own mutation
            when: The new holder begins its protected operation
        tags: []
        created: 2026-03-12T02:33:44.530Z
        notes: []
