                      is not instructed to check out the integration branch manually inside
                      the detached snapshot
                    when: |
                      Reviewer workflow guidance is rendered for a detached review snapshot
                  - given: The reviewed canonical branch head is already integrated at the integration target tip.
                    id: ac-helper-no-op-merge
                    then: The helper reports a no-op merge outcome and exits successfully without moving refs, without
                      creating a persistent target worktree, and without dirtying any existing
                      worktree.
                    when: The reviewer runs the supported merge helper.
                  - given: The integration target branch is checked out in an otherwise eligible existing worktree, but
