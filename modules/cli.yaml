    title: kspec session start
    type: requirement
    description: "Display session context for starting work. Two output modes: primer (default) shows
      curated actionable data; full (--full) shows same structure with more items and additional
      sections. Sections ordered by actionability. Empty sections omitted. Task refs display as
      @slug in human output (fallback to @short-ulid). Timestamps relative in human output, ISO 8601
      in JSON."
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits:
      - "@trait-json-output"
      - "@trait-semantic-exit-codes"
    acceptance_criteria:
      - given: no format flags specified
        id: ac-primer-default
        then: "primer mode renders: header, active tasks, pending review, blocked, ready (top 5), recent
          activity (10 items), inbox stat line, working tree (if dirty), quick commands"
        when: kspec session start runs
      - given: --full flag passed
        id: ac-full-sections
        then: "same section ordering as primer plus: all ready tasks, 20 activity items, up to 20 untriaged
          inbox items, observations section, session metadata (if populated)"
        when: output renders
      - given: --brief flag passed
        id: ac-brief-alias
        then: behaves identically to primer (backward-compat no-op alias)
        when: output renders
      - given: multiple sections have data
        id: ac-section-order
        then: "rendered sections appear in order: active tasks, pending review, blocked, ready, recent
          activity, inbox, working tree, quick commands"
        when: output renders
      - given: a section has zero items
        id: ac-empty-skip
        then: that section is omitted entirely (no header, no placeholder message)
        when: output renders
      - given: task has slugs
        id: ac-slug-display
        then: task ref displays as @slug
        when: human output renders
      - given: task has no slugs or item is inbox (no slug schema)
        id: ac-slug-fallback
        then: ref displays as @short-ulid
        when: human output renders
      - given: items have timestamps
        id: ac-relative-time-human
        then: all times shown as relative (2h ago, 3d ago)
        when: human output renders
      - given: --json flag used
        id: ac-iso-time-json
        then: all timestamps remain ISO 8601
        when: JSON output renders
      - given: working tree is clean
        id: ac-dirty-tree-only
        then: working tree section omitted
        when: output renders
      - given: tasks are in_progress or needs_work
        id: ac-active-detail
        then: shows title, description, and recent notes (richest detail level)
