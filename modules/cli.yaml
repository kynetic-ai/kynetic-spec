          - _ulid: 01KJQM85WKV636RTWZ5EB3WD5Z
            slugs:
              - batch-write-buffer
            title: Atomic isolation via write buffer
            type: requirement
            tags: []
            depends_on: []
            implements: []
            relates_to: []
            tests: []
            traits: []
            notes: []
            created: 2026-03-02T15:56:41.235Z
            description: >-
              Atomic batch isolation is implemented via an in-memory write buffer (overlay), not a
              full directory copy to /tmp.


              The overlay intercepts file writes during batch execution, buffering them in memory.
              Reads check the buffer first (returning the pending write if present), then fall
              through to the real .kspec/ directory. On success, all buffered writes are flushed to
              disk atomically. On failure, the buffer is discarded — real .kspec/ is never touched.


              This replaces the current fs.cp(realSpecDir, tempDir) approach in batch-exec.ts, which
              copies the entire .kspec/ directory including sessions/blobs/ (potentially GBs of
              data) for every batch run.
            acceptance_criteria:
              - id: ac-1
                given: atomic batch mode is active
                when: a command writes a file to .kspec/
                then: the write is stored in the in-memory buffer, not written to disk
              - id: ac-2
                given: command A writes a file and command B reads the same file in the same batch
                when: command B reads the file
                then: command B sees command A's buffered write (read-after-write consistency); this applies to ALL
                  read paths — readYamlFile, loadSpecFile, loadAllItems, loadAllTasks, and any other
                  function that reads .kspec/ files — not just the primary readYamlFile helper
              - id: ac-3
                given: all batch commands succeed
                when: batch commits
                then: only the buffered files (those actually written) are flushed to disk — files not touched by
                  the batch are unchanged
              - id: ac-4
                given: any batch command fails in atomic mode
                when: batch rolls back
                then: the buffer is discarded with no disk writes — .kspec/ state is identical to before the batch
              - id: ac-5
                given: a batch runs against a .kspec/ directory containing large sessions/blobs/ data
                when: batch executes in atomic mode
                then: .kspec/sessions/ is never copied to the temp location — only files actually written by batch
                  commands exist in the buffer
              - id: ac-6
                given: a batch is executing and has buffered writes not yet flushed
                when: another kspec process reads .kspec/ from disk
                then: the reading process sees the original pre-batch state (buffer is process-local and not visible
                  outside the batch process)
              - id: ac-7
                given: all batch commands succeed but writing the buffer to disk fails partway through the flush
                when: flush encounters a write error
                then: the error is reported and .kspec/ is left in a consistent pre-batch state — no partial writes
                  are silently committed
              - id: ac-8
                given: a new function or code path is added that reads files from .kspec/
                when: the function uses fs.readFile or fs.readdir directly instead of a buffer-aware helper
                then: the read bypasses the write buffer, violating ac-2; all .kspec/ file reads MUST go through a
                  buffer-aware helper (e.g. readYamlFile or a shared readFileBufferAware) that
                  checks getActiveBatchBuffer() before falling back to disk
            status:
              maturity: draft
              implementation: implemented
        acceptance_criteria:
          - id: ac-stdin
            given: JSON array piped via stdin
            when: kspec batch runs with no --file or --commands flag
            then: Commands are read from stdin and executed in order
          - id: ac-file
            given: --file flag with path to JSON file
            when: kspec batch --file commands.json runs
            then: Commands are read from the file and executed in order
          - id: ac-inline
            given: --commands flag with JSON string
            when: kspec batch --commands with inline JSON runs
            then: Inline JSON is parsed and commands execute
          - id: ac-stop-on-error
            given: Default mode (no --continue flag) with 5 commands where command 3 fails at runtime
            when: Batch executes
            then: "In atomic mode: all changes rolled back. In immediate mode: commands 1-2 committed, commands
              4-5 not executed. Exit code is 1"
          - id: ac-continue
            given: Immediate mode (--continue implies --no-atomic) with 5 commands where command 3 fails at
              runtime
            when: Batch executes
            then: All 5 commands are attempted, command 3 failure is recorded, other commands succeed, exit code
              is 1
          - id: ac-prevalidate
            given: Batch with 3 commands where command 2 has invalid syntax
            when: kspec batch runs
            then: Validation fails before any execution, no commands run, error identifies the invalid command
              by index, exit code is 1
          - id: ac-dry-run
            given: --dry-run flag with valid batch
            when: kspec batch --dry-run runs
            then: All commands are validated but not executed, output shows what would run, no state changes
              occur
          - id: ac-forward-ref
            given: Batch where command 2 references slug created by command 1
            when: kspec batch runs
            then: Pre-validation recognizes the forward reference as valid, execution succeeds for both commands
          - id: ac-single-commit
            given: Atomic mode (default) with 3 successful mutating commands
            when: Batch completes successfully
            then: A single shadow branch commit is created containing all changes (not 3 separate commits)
          - id: ac-partial-commit
            given: Immediate mode with --continue, commands 1-2 succeed, command 3 fails
            when: Batch completes with partial success
            then: 2 individual commits (commands 1-2), no commit for command 3
          - id: ac-mutating-only
            given: Batch containing a read-only command like item get
            when: kspec batch runs
            then: Validation rejects with error identifying the non-mutating command
          - id: ac-confirmation-suppressed
            given: Batch containing a command that normally requires confirmation (e.g., item delete without
              --force)
            when: kspec batch runs
            then: Command executes without prompting for confirmation (batch mode is implicitly non-interactive)
          - id: ac-invalid-json
            given: Malformed JSON input (from any source)
            when: kspec batch runs
            then: Parse error with line/position info if available, exit code 1, no commands executed
          - id: ac-empty-batch
            given: Empty JSON array []
            when: kspec batch runs
            then: Error message says batch contains no commands, exit code 1
          - id: ac-default-atomic
            given: kspec batch runs without --no-atomic
            when: Batch executes
            then: "Atomic mode: commands execute against isolated copy of state"
          - id: ac-atomic-rollback
            given: Atomic mode, 5 cmds where cmd 3 fails
            when: Batch encounters failure
            then: ALL changes discarded, no shadow commit, state identical to before batch, exit 1
          - id: ac-atomic-isolation
            given: Atomic mode, commands modifying state
            when: Batch is executing
            then: Modifications in isolated copy; other kspec operations see original state
          - id: ac-no-atomic-flag
            given: --no-atomic flag provided
            when: kspec batch runs
            then: "Immediate mode: per-command commits, no rollback"
          - id: ac-immediate-per-commit
            given: Immediate mode, 3 successful commands
            when: Batch completes
            then: 3 individual shadow commits (one per command)
          - id: ac-immediate-no-rollback
            given: Immediate mode, 5 cmds where cmd 3 fails
            when: Batch stops
            then: Commands 1-2 remain committed, cmds 4-5 not executed, exit 1
          - id: ac-continue-implies-immediate
            given: --continue without --no-atomic
            when: kspec batch runs
            then: Immediate mode activated implicitly with notice in output
          - id: ac-json-mode-field
            given: --json flag provided
            when: Batch completes
            then: "JSON output includes mode field: atomic or immediate"
        status:
          maturity: draft
          implementation: implemented
        description: Execute multiple mutating kspec commands from inline JSON, files, or stdin with shared
          validation, atomic or immediate execution modes, and structured result reporting.
    acceptance_criteria:
      - id: ac-1
        given: A user compares multiple kspec commands across resources such as item, task, and link.
        when: They inspect the command names, output shape, and error messaging.
        then: The CLI presents a consistent command vocabulary and predictable human-readable responses
          instead of resource-specific one-offs.
