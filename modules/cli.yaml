    slugs:
      - cli-schema-introspection
    title: CLI Schema Introspection
    type: feature
    tags:
      - agent-first
      - cli
      - dx
    description: >-
      Provides programmatic discovery of CLI commands, argument schemas, and exit codes for agent
      and tool integration.


      Agents need structured metadata to:

      1. Discover available commands without parsing help text

      2. Understand argument types and constraints for validation

      3. Handle exit codes semantically in automation scripts

      4. Generate UI elements or tooling from CLI definitions


      This feature extends the existing help system with introspection-focused outputs that
      prioritize machine readability over human readability. Infrastructure exists in
      introspection.ts and exit-codes.ts - needs wiring up.
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    notes: []
    created: 2026-02-04T03:08:36.169Z
    acceptance_criteria:
      - id: ac-1
        given: The CLI has registered commands with options and arguments
        when: "'kspec help --json' is run"
        then: "Output is valid JSON containing: commands (nested tree with name, description, arguments,
          options, subcommands), content (curated help content), and no ANSI color codes"
      - id: ac-2
        given: EXIT_CODE_METADATA is defined in exit-codes.ts
        when: "'kspec help --exit-codes' is run"
        then: "Output shows all exit codes with: code number, symbolic name, description, and list of
          commands that may return each code"
      - id: ac-3
        given: "'kspec help --exit-codes --json' is run"
