    slugs:
      - session-events
    title: Session Event Storage
    type: feature
    tags: []
    description: JSONL-based event storage for agent sessions. Provides append-only event logs for
      auditability, session metadata tracking, and integration with kspec commit boundaries.
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    created: 2026-01-17T15:16:24.306Z
    acceptance_criteria:
      - id: ac-1
        given: a new session is started
        when: createSession(id, metadata) is called
        then: creates .kspec-sessions/{id}/ directory with session.yaml metadata file
      - id: ac-2
        given: an active session
        when: appendEvent(id, event) is called
        then: appends JSON line to events.jsonl with auto-assigned ts and seq
      - id: ac-3
        given: events are appended
        when: written to disk
        then: uses atomic append (appendFileSync) for crash safety
      - id: ac-4
        given: a session exists
        when: readEvents(id) is called
        then: returns all events in sequence order
      - id: ac-5
        given: session metadata
        when: stored
        then: "includes: task_id (optional), agent_type, status, started_at, ended_at"
      - id: ac-6
        given: session ends
        when: updateSessionStatus(id, status) is called
        then: updates metadata with status and ended_at timestamp
      - id: ac-7
        given: events are accumulated
        when: a commit boundary is reached (task complete, session end)
        then: in local storage mode, no git commit occurs. In branch storage mode, events are included in
          the session branch commit at lifecycle boundaries (create, close, stale cleanup, compact).
      - id: ac-8
        given: A session event contains oversized payload fields (for example large tool outputs or chunk
          text)
        when: The event is prepared for persistence
        then: Oversized field content is externalized to session blob files under
          .kspec-sessions/{id}/blobs/ and the JSONL event stores a pointer object instead of the
          full payload
      - id: ac-9
        given: Event payload content is externalized
        when: The pointer object is written to events.jsonl
        then: The pointer records path, byte length, hash, truncation flag, and preview so audit trails
          remain reconstructible without silently dropping content
    status:
      maturity: draft
      implementation: implemented
