  - _ulid: 01KKAH0ZJ3QVPT8650HVEG5JDH
    slugs:
      - test-suite-perf-reliability
    title: Test Suite Performance and Reliability
    type: requirement
    description: Tests must complete reliably within their timeout budgets under concurrent/CI load.
      Tests that depend on build artifacts or external state must either verify prerequisites or
      skip gracefully. Subprocess-heavy test setups must use efficient fixtures instead of
      sequential CLI invocations.
    status:
      maturity: draft
      implementation: in_progress
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: a test requires N > 10 sequential CLI subprocess calls for setup
        id: ac-1
        then: setup uses pre-seeded YAML fixture files written directly to the temp dir instead of CLI
          subprocess loops
        when: the test is authored or modified
      - given: WebSocket or async event tests use polling/waitFor helpers
        id: ac-3
        then: timeout is at least 2000ms with configurable override, and timeout errors include the last
          observed state for diagnosis
        when: the poll timeout is set
      - given: a test uses crypto.randomUUID or similar Web APIs
        id: ac-4
        then: the test provides a polyfill or stub so it does not throw ReferenceError
        when: the test runs in a Node.js environment without global crypto
      - given: tests are run by agents or developers
        id: ac-5
        then: environment prerequisites (build artifacts, dependencies, config) are verified and gaps are
          fixed automatically before tests execute, similar to how bootstrap.cjs ensures dev
          environment readiness
        when: the test runner script is invoked
      - given: the test runner script is used instead of raw npm test
        id: ac-6
        then: output is structured with clear pass/fail summary, noise from setup steps is suppressed, and
          the script provides an extensible hook point for future pre/post-test actions
        when: tests complete
    tags:
      - testing
      - infra
