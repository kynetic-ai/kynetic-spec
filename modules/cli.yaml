        requirements:
          - _ulid: 01KM3ZMD1KXK06TYZJB2MZ9KA8
            slugs:
              - dispatch-integration-mutation-scope
            title: Dispatch Integration Mutation Scope Contract
            type: requirement
            description: Integration-branch operations mutate only an eligible branch-coherent mutation surface
              for the configured integration branch. An eligible occupied mutation surface is a
              pre-existing non-auxiliary project/user checkout of the integration target branch, not
              a worker, reviewer, helper, plan-scoped, detached review, or other dispatch-created
              auxiliary worktree. Dispatch does not spill into unrelated repository state, does not
              mutate worker or reviewer task worktrees as side effects, does not move checked-out
              integration target refs behind their worktrees, and fails safely when the intended
              mutation surface is ambiguous, auxiliary, or unsafe.
            status:
              maturity: draft
              implementation: in_progress
            depends_on: []
            implements: []
            relates_to: []
            tests: []
            traits: []
            acceptance_criteria:
              - given: Dispatch performs integration-branch sync, publish, health, or repair work for a configured
                  integration target.
                id: ac-1
                then: The resulting branch ref, index, and working tree changes are limited to the selected
                  branch-coherent mutation surface for that integration target.
                when: The operation completes successfully.
              - given: |
                  Worker and reviewer task worktrees exist for active task work
                id: ac-2
                then: |
                  Those task worktrees do not have their branch ref, index, or
                  working tree mutated as a side effect of the integration-branch
                  operation
                when: |
                  An integration-branch operation executes
              - given: Dispatch performs the same integration-branch operation against the same repository
                  checkout/occupancy state at different times during one daemon run.
                id: ac-3
                then: Dispatch selects the same branch-coherent mutation surface each time.
                when: Each operation completes successfully.
              - given: |
                  Dispatch cannot determine a safe mutation surface for the
                  configured integration branch
                id: ac-4
                then: |
                  Dispatch refuses the operation and reports actionable guidance
                  instead of mutating an ambiguous checkout
                when: |
                  A sync or push operation is attempted
              - given: Dispatch is running from a checkout that does not itself have the integration target branch
                  checked out, and exactly one other eligible clean non-auxiliary worktree has that
                  target branch checked out.
                id: ac-clean-occupied-target-checkout-is-valid-mutation-surface
                then: Dispatch uses the existing target checkout as the branch-coherent mutation surface instead of
                  moving the target ref behind that checkout or degrading the target solely because
                  it is checked out.
                when: Dispatch performs an integration-target sync or push for that branch.
              - given: Dispatch uses worker, reviewer, helper, or plan-scoped auxiliary worktrees while processing
                  integration-target work.
                id: ac-helper-created-target-locks-are-released
                then: That auxiliary operation restores or removes the temporary target checkout before completion,
                  failure, or cleanup so it does not create a new persistent target-branch lock.
                when: An auxiliary operation temporarily checks out an integration target branch that was not
                  already checked out by that worktree at operation start.
              - given: Dispatch is running from a checkout that does not itself have the integration target branch
                  checked out, and another otherwise eligible worktree has that target branch
                  checked out with tracked modifications, staged drift, an in-progress Git
                  operation, or untracked/ignored files that Git reports would be overwritten by the
                  required sync or push-side operation.
                id: ac-dirty-occupied-target-refusal-identifies-blocker
                then: Dispatch refuses before moving refs and reports the blocking unsafe worktree path with
                  guidance to clean, commit, stash, finish/abort the in-progress Git operation,
                  detach, or remove that checkout.
                when: Dispatch attempts an integration-target sync or push for that branch.
              - given: Dispatch is running from a checkout that does not itself have the integration target branch
                  checked out, and the target branch is checked out in a worker, reviewer, helper,
                  plan-scoped, detached review, or other dispatch-created auxiliary worktree.
                id: ac-auxiliary-target-checkout-refusal-identifies-blocker
                then: Dispatch refuses before moving refs, reports the auxiliary checkout path as a blocker or
                  cleanup candidate, and does not use that auxiliary worktree as the mutation
                  surface.
                when: Dispatch attempts an integration-target sync or push for that branch.
            tags: []
            created: 2026-03-19T21:22:11.124Z
            notes:
              - _ulid: 01KSREBBCTY62JR97C8N18YK28
                content: Approved direct spec tightening for branch-coherent occupied target mutation surfaces;
