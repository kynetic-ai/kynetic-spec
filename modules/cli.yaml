          maturity: draft
          implementation: implemented
      - _ulid: 01KHAP9PZ2WEMV9PRV037MC5Y8
        slugs: []
        title: Ralph wrap-up agent on loop exit
        type: requirement
        tags: []
        description: "When the ralph loop exits for any reason (no eligible tasks, agent signaled end-loop,
          max iterations reached, error), spawn a final wrap-up subagent before terminating. The
          wrap-up agent ensures the workspace is in a clean state: uncommitted changes are
          identified and handled (committed, stashed, or flagged), stale markers are cleaned up, and
          a brief exit summary is produced. Runs as a subagent like PR review, with a focused prompt
          and short timeout."
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        notes: []
        created: 2026-02-13T05:06:39.202Z
        acceptance_criteria:
          - id: ac-1
            given: Ralph loop exits for any reason (no tasks, end-loop signal, max iterations, error)
            when: exit sequence begins
            then: a wrap-up subagent is spawned before the process terminates
          - id: ac-2
            given: Wrap-up agent starts
            when: it inspects the working tree
            then: identifies uncommitted changes (staged, unstaged, untracked) and reports what they appear to
              relate to (task refs, file patterns)
          - id: ac-3
            given: Wrap-up agent finds uncommitted changes
            when: changes are present
            then: commits with appropriate message, stashes, or flags for human review depending on context;
              does not silently discard work
          - id: ac-4
            given: Wrap-up agent completes
            when: cleanup is done
            then: "produces a brief exit summary: what was cleaned up, final task states, any items flagged for
              human attention"
          - id: ac-5
            given: Wrap-up agent is running
            when: timeout is reached (default 2 minutes)
            then: agent is terminated and ralph exits without wrap-up; wrap-up must not block shutdown
              indefinitely
        status:
          maturity: draft
          implementation: implemented
