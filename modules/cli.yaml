      - _ulid: 01KKFY942D1S33SMNNFKS0EB1H
        slugs:
          - dispatch-runtime-bootstrap-contract
        title: Dispatch Runtime Bootstrap Contract
        type: requirement
        description: |
          The dispatcher performs bounded, reproducible bootstrap and dependency
          preparation for task workspaces so agents do not have to rediscover routine
          environment setup on every invocation.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits:
          - "@trait-error-guidance"
        acceptance_criteria:
          - given: |
              A task workspace is ready to use
            id: ac-1
            then: |
              The dispatcher resolves bootstrap configuration from explicit dispatch
              or agent configuration and runs the configured bootstrap workflow
              before delivering the prompt
            when: |
              Invocation preflight runs
          - given: |
              Bootstrap steps are configured for a workspace
            id: ac-2
            then: |
              The bootstrap contract explicitly distinguishes allowed environment or
              dependency provisioning from tracked source mutations, and tracked
              source mutations require explicit opt-in
            when: |
              The dispatcher executes them
          - given: |
              A reviewer invocation is prepared for a workspace that a worker already
              bootstrapped
            id: ac-3
            then: |
              The reviewer reuses recorded bootstrap state where valid and may rerun
              only idempotent or explicitly allowed bootstrap steps; it does not
              silently introduce new tracked source changes
            when: |
              Reviewer preflight runs
          - given: |
              Bootstrap state is cached for workspace reuse
            id: ac-4
            then: |
              The invalidation signals are explicit and testable, including recorded
              canonical branch head changes, bootstrap config changes, and failed
              prior bootstrap state
            when: |
              The dispatcher decides whether to reuse or rerun bootstrap
          - given: |
              A workspace has already completed bootstrap and no invalidation signal
              is present
            id: ac-5
            then: |
              The dispatcher reuses the prior bootstrap result instead of rerunning
              expensive setup blindly
            when: |
              A later invocation for that workspace is prepared
          - given: |
              Bootstrap fails because dependencies or runtime requirements cannot be
              satisfied automatically
            id: ac-6
            then: |
              The dispatcher records the failure with actionable detail and either
              blocks the task or marks the workspace unhealthy; it does not hand the
              agent an unexplained broken environment
            when: |
              The invocation would otherwise start
          - given: The dispatcher has selected a workspace for an invocation, whether newly provisioned or
              reused
            id: ac-7
            then: The dispatcher verifies that the selected workspace path exists, is accessible, and is
              runnable through a minimal side-effect-free executability probe
            when: Pre-invocation validation runs after workspace selection and before adapter handoff
          - given: Pre-invocation validation determines that the selected workspace is missing, inaccessible, or
              not runnable
            id: ac-8
            then: The dispatcher does not launch the agent against that workspace
            when: The invocation would otherwise be handed off to the adapter
          - given: Pre-invocation validation fails because the selected workspace state is not runnable and a
              trustworthy canonical workspace record exists
            id: ac-9
            then: The dispatcher attempts recovery and re-validates the workspace before launch
            when: The dispatcher can safely repair or recreate the selected workspace from that record
          - given: Pre-invocation validation fails and the dispatcher cannot produce a runnable workspace,
              either because recovery fails or because no trustworthy recovery path exists
            id: ac-10
            then: The dispatcher marks the workspace unhealthy or blocks the task with actionable task-linked
              diagnostics instead of delivering a broken environment to the agent
            when: The invocation cannot be prepared safely
          - given: The dispatcher executes bootstrap steps for a workspace
            id: ac-11
            then: The subprocess runs the command string as declared in the dispatcher's bootstrap configuration
              or the agent's bootstrap configuration, with no modification or addition to the
              command by the dispatcher
            when: The dispatcher spawns a subprocess for a bootstrap step
          - given: The dispatcher's own process environment contains values that configure the runtime mode of
              the dispatcher itself or of language runtimes the dispatcher invokes
            id: ac-12
            then: Those runtime mode configuration values are absent from the subprocess environment the
              dispatcher assembles for the step
            when: The dispatcher assembles the subprocess environment for a bootstrap step
          - given: The bootstrap configuration declares multiple step commands in a specific order
            id: ac-13
            then: The spawned subprocesses appear in the same relative order as the declared step commands
            when: The dispatcher spawns any of those step commands
        tags: []
        created: 2026-03-12T02:33:44.269Z
        notes: []
      - _ulid: 01KKFY947T52DYFSX45MGQNGB3
        slugs:
          - dispatch-role-workflow-entry-contract
        title: Dispatch Role Workflow Entry Contract
        type: requirement
        description: |
          Role-specific workflow entry is a dispatcher-owned contract separate from
          workspace orientation. The dispatcher selects and renders the correct work,
          review, PR-target, and manual merge guidance entrypoint for the adapter and
          role.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: |
              A worker or reviewer invocation is prepared
            id: ac-1
            then: |
              The dispatcher selects the configured workflow or skill entrypoint for
              that role independently from the orientation block
            when: |
              The dispatcher builds the actionable part of the invocation
          - given: |
              Worker and reviewer adapters or harnesses differ
            id: ac-2
            then: |
              The dispatcher renders adapter-appropriate invocation syntax and
              includes the publish path instructions against the recorded base branch,
              using the recorded publication mode for that workspace
            when: |
