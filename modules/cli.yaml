        when: the invocation produces text output
      - given: kspec agent run is used in interactive mode (not --json)
        id: ac-12
        then: text content streams to stdout as it is received, so the user sees the response live without
          waiting for completion
        when: the agent produces text output during the invocation
      - given: kspec agent dispatch watch is run while the daemon has active or future agent invocations
        id: ac-13
        then: Text output streams to stdout in real time grouped by speaker sections. The watch display
          renders [agent-id session-id] as a section marker when a stream becomes active, then
          streams that speaker's body text without repeating the marker on every line. A new marker
          is shown when output switches to a different stream. Explicit ACP boundary sentinels
          (empty chunks) insert spacing between logical sections for readability, and repeated
