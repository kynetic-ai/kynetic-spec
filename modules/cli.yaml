  - _ulid: 01KM5Z4JFESXSFWZ4MNTHBHQ1P
    slugs:
      - cli-input-type-safety
    title: CLI Input Type Safety
    type: feature
    description: |
      All CLI commands must validate their inputs against the defined type
      constraints before executing. This applies to both mutation commands
      (which persist data) and query commands (which filter data). When a
      command accepts an option or argument with a constrained type — an
      enum, a number within a range, a reference format, or any value with
      a schema-defined shape — it must reject invalid values with a clear
      error rather than passing them through unchecked.

      Mutation commands that accept invalid input cause data corruption:
      values are written to YAML and silently dropped on next read. Query
      commands that accept invalid filters silently return empty results,
      wasting the user's time debugging "missing" data.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits:
      - "@trait-type-safe-input"
      - "@trait-error-guidance"
      - "@trait-semantic-exit-codes"
    acceptance_criteria:
      - given: |
          A CLI mutation command accepts a typed option
        id: ac-1
        then: |
          The command exits with non-zero status and stderr describes the
          invalid value and lists what is valid, before any write occurs
        when: |
          The provided value does not match the option's type constraint
      - given: |
          A CLI query command accepts a typed filter option
        id: ac-2
        then: |
          The command exits with non-zero status and stderr describes the
          invalid value, rather than silently returning empty results
        when: |
          The provided value does not match the filter's type constraint
      - given: |
          A CLI command accepts a typed option
        id: ac-3
        then: |
          The command executes normally
        when: |
          The provided value satisfies the type constraint
      - given: |
          A CLI command option has a default value
        id: ac-4
        then: |
          The default value itself satisfies the type constraint
        when: |
          The default is applied
    tags: []
    created: 2026-03-20T15:52:01.262Z
    notes: []
  - _ulid: 01KMMB3SAX2KGDBAGRD3X8EJE4
    slugs:
      - cli-daemon-proxy
    title: CLI Daemon Proxy Mode
    type: feature
    description: |
      When a daemon is running, the CLI routes commands through it instead
      of operating directly on the shadow branch. This makes the daemon
      the single writer, eliminating coherence issues between CLI mutations
      and daemon state. The CLI auto-detects daemon availability and routes
      accordingly. Users can force either mode explicitly.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits:
      - "@trait-error-guidance"
      - "@trait-daemon-endpoint-consumer"
    acceptance_criteria:
      - given: The user runs a daemon-proxy-eligible kspec command
        id: ac-auto-detect
        then: The command is routed through the daemon API using the advertised connect_host and port
          instead of operating directly on the shadow branch
        when: Daemon connection metadata points to a running daemon and the current project can be
          registered or is already registered
      - given: |
          the user runs a kspec command
        id: ac-direct-fallback
        then: |
          the command operates directly on the shadow branch
        when: |
          no daemon is running or the daemon is unreachable
      - given: KSPEC_NO_DAEMON=1 is set
        id: ac-force-direct
        then: The command operates directly on the shadow branch and suppresses incidental daemon
          communication
        when: The user runs a non-daemon-management kspec command
      - given: |
          the user runs a kspec command with --daemon flag
        id: ac-force-proxy
        then: |
          the command fails with a clear error indicating no daemon is
          available
        when: |
          no daemon is running
      - given: |
          a command is routed through the daemon
        id: ac-transparent-output
        then: |
          the output format, content, and exit code are identical to
          direct mode
        when: |
          the command completes
      - given: |
          a CLI mutation is routed through the daemon
        id: ac-mutation-coherence
        then: |
          the daemon's entity cache reflects the change immediately and
          subsequent requests from any client see the updated data
        when: |
          the mutation succeeds
      - given: |
          a CLI read command is routed through the daemon
        id: ac-read-from-cache
        then: |
          the response is served from the daemon's cache
        when: |
          the daemon has cached data for the project
      - given: |
          the daemon responds to a health check but a routed read-only
          command does not complete within the timeout period
        id: ac-timeout-fallback
        then: |
          the CLI falls back to direct mode for the read-only command and
          emits a warning on stderr indicating the daemon is not responding
        when: |
          the timeout expires
      - given: |
          the daemon responds to a health check but a routed mutating
          command does not complete within the timeout period
        id: ac-timeout-mutation-error
        then: |
          the CLI returns an error instead of falling back to direct mode,
          because the daemon may still be processing the mutation
        when: |
          the timeout expires
      - given: KSPEC_NO_DAEMON=1 is set
        id: ac-force-direct-management-exception
        then: The command follows daemon lifecycle semantics rather than forcing direct shadow mode
        when: The user runs an explicit daemon management command such as kspec serve start, stop, status,
          or restart
      - given: Daemon proxying is suppressed for a command running inside a daemon command API request
        id: ac-daemon-internal-proxy-suppression-is-scoped
        then: They continue to follow the normal daemon detection, force-direct, and force-proxy rules
        when: Other CLI commands evaluate proxy mode outside that request
    tags: []
    requirements:
      - _ulid: 01KMMB3SK47YTSFKAPPQ0899BM
        slugs:
          - daemon-command-api
        title: Daemon Command API
        type: requirement
        description: |
          REST endpoint that accepts CLI command payloads and executes them
          within the daemon process, returning structured results. Serves as
          the server-side counterpart to CLI daemon proxy mode.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits:
          - "@trait-api-endpoint"
          - "@trait-localhost-security"
        acceptance_criteria:
          - given: |
              the daemon is running
            id: ac-command-endpoint
            then: |
              the daemon executes the command and returns the result with
              stdout, stderr, and exit code
            when: |
              a POST request is sent to the command execution endpoint with
              a command payload
          - given: |
              a command payload contains a mutating command
            id: ac-mutation-cache-update
            then: |
              the entity cache is updated before the response is sent and
              a WebSocket event is broadcast to connected clients
            when: |
              the command executes successfully
          - given: |
              a command payload contains a batch of commands
            id: ac-batch-support
            then: |
              all commands in the batch execute atomically and the cache
              is updated once after the batch completes
            when: |
              the batch is executed
          - given: |
              two command requests arrive concurrently with mutating commands
            id: ac-concurrent-mutations
            then: |
              mutations are serialized to prevent conflicts and both callers
              receive correct results
            when: |
              both attempt to modify shadow branch state
          - given: |
              a command is executed through the command API
            id: ac-response-parity
            then: |
              the response body contains the same stdout and stderr content
              that would be produced by direct CLI execution of the same
              command
            when: |
              the result is returned
          - given: A read-only command is executed via the command API and the entity cache has all required
              domains in ready state
            id: ac-read-cache-serving
            then: Data is served from the entity cache without reading files from disk
            when: The command resolves data
          - given: The daemon executes a CLI command via the command API
            id: ac-cache-context-propagation
            then: The entity cache for the target project is accessible to data loading functions throughout the
              command's async execution chain
            when: The command begins execution
          - given: A CLI command runs in direct mode without the daemon
            id: ac-no-cache-outside-daemon
            then: Data is loaded from disk and no cache lookup is attempted
            when: Data loading functions are called
          - given: The daemon command API is executing a CLI command inside the daemon process
            id: ac-no-recursive-command-proxy
            then: The command is executed directly in the current daemon request instead of posting back to the
              command API
            when: That command evaluates whether it should proxy through the daemon
        tags: []
        created: 2026-03-26T05:50:40.740Z
