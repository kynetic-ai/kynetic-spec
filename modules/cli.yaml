        id: ac-10
        then: "cross-skill references using {skill:foo} notation are rewritten to the adapter-appropriate
          invocation format before injection: /foo for claude-agent-acp (Claude Code slash
          commands), $foo for codex-acp (Codex CLI), and {skill:foo} left as-is for unknown
          adapters"
        when: skill content is injected into the prompt via buildPromptWithSkills
      - given: the ACP agent sends a request_permission or other JSON-RPC request during a tool call
        id: ac-11
        then: the ACP client request handler auto-approves the request by sending the appropriate response,
          so tool calls (Edit, Write, Bash) are never blocked waiting for human confirmation
        when: the invocation is running in autonomous dispatch mode
      - given: An agent subprocess is spawned by the dispatch engine or one-shot kspec agent run
        id: ac-12
        then: The spawner strips known host-environment variables (CLAUDECODE, CLAUDE_CODE_SESSION) from the
          inherited process.env before merging adapter.env and invocation env overrides, so the
          agent starts cleanly without inheriting the parent's session context
        when: The parent process environment contains variables that would interfere with agent startup
          (e.g. CLAUDECODE=1 causing nested-session detection)
      - given: An agent subprocess is spawned by dispatch or one-shot agent invocation
        id: ac-invocation-commands-do-not-proxy-to-supervising-daemon
        then: Those commands run without proxying through the supervising daemon
