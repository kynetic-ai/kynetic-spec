  - _ulid: 01KJP27657CZ9AJP5T0XBDEDVK
    slugs:
      - agent-dispatch-engine
    title: Agent Dispatch Engine
    type: feature
    description: |
      Core dispatch runtime that runs inside the daemon. Watches for task
      state changes via both file watcher events and direct API event
      emission from CLI commands. Matches state changes against agent
      dispatch rules, queues invocations, manages concurrency, and handles
      deduplication of events from dual sources. Serializes shadow branch
      mutations when multiple agents run concurrently.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits:
      - "@trait-error-guidance"
      - "@trait-task-readiness"
    acceptance_criteria:
      - given: |
          A task transitions to a state matching an agent's dispatch rule
        id: ac-1
        then: |
          The matching agent is queued for dispatch with the triggering
          task reference and event metadata
        when: |
          The state change is detected via file watcher or API event
      - given: |
          Multiple agent definitions match the same state change
        id: ac-2
        then: |
          Each matching agent is queued independently, creating separate
          sessions
        when: |
          Dispatch rules overlap
      - given: |
          An agent's max_concurrent limit is reached
        id: ac-3
        then: |
          The invocation is queued FIFO and dispatched when a slot opens
        when: |
          A new dispatch trigger fires for that agent
      - given: |
          The dispatch engine is running
        id: ac-4
        then: |
          The CLI posts a state change event to the daemon and the
          engine processes it
        when: |
          A CLI command mutates task state (e.g. kspec task submit)
      - given: |
          The dispatch engine is running
        id: ac-5
        then: |
          The engine diffs previous vs current task states and emits
          state change events for any transitions found
        when: |
          The file watcher detects a change in project.tasks.yaml
      - given: |
          A dispatch rule includes filters (automation status, tags)
        id: ac-6
        then: |
          The task is checked against all filters and the agent is only
          queued if every filter matches
        when: |
          A state change matches the event type
      - given: |
          The same state transition is detected by both the file watcher
          and a CLI API event
        id: ac-7
        then: |
          The dispatch engine deduplicates them using a (task_id,
          from_state, to_state) tuple with a time window, dispatching
          only once
        when: |
          Both events arrive within a short window
      - given: |
          The dispatch engine starts (daemon startup or explicit start)
        id: ac-8
        then: |
          The engine evaluates all current task states against dispatch
          rules and queues any matching agents (bootstrap/catch-up)
        when: |
          Tasks already exist in states matching dispatch rules
      - given: |
          The dispatch engine encounters a transient error during spawn
        id: ac-9
        then: |
          The invocation is retried up to the agent's configured retry
          count with exponential backoff
        when: |
          The error is an adapter timeout or process crash
      - given: |
          An agent definition's adapter reference cannot be resolved
        id: ac-10
        then: |
          An error is logged with the unresolvable adapter ID, the
          invocation is skipped, and a note is added to the task
        when: |
          The dispatch engine attempts to spawn the agent
      - given: |
          The dispatch engine is stopped (daemon shutdown or explicit stop)
        id: ac-11
        then: |
          Running agents receive graceful cancel signals and all sessions
          are closed before the engine reports shutdown complete
        when: |
          Active agent invocations exist
      - given: |
          Multiple agents are running concurrently (max_concurrent > 1)
        id: ac-12
        then: |
          The dispatch engine serializes shadow branch commit operations
          to prevent worktree corruption from concurrent git commits
        when: |
          Both agents attempt shadow branch mutations (e.g. kspec task note)
      - given: The dispatch engine builds a prompt for an agent invocation
        id: ac-13
        then: The prompt includes the task title and human-readable trigger context (new assignment, fix
          cycle, continuing work, or review)
        when: Task data is available on the state change
      - given: A task.needs_work trigger fires
        id: ac-14
        then: The last 3 task notes are included in the prompt, each truncated to 200 characters, so the
          agent can see reviewer feedback
        when: The dispatch engine builds the prompt
      - given: A task.pending_review trigger fires and the task has a review_url
        id: ac-15
        then: The prompt includes the review URL for the reviewer agent
        when: The dispatch engine builds the prompt
      - given: An agent definition has a prompt_template with {{variable}} placeholders
        id: ac-16
        then: Placeholders are interpolated with task_ref, task_title, trigger, and review_url values;
          unresolved placeholders pass through unchanged
        when: The dispatch engine builds the prompt
      - given: A queued dispatch entry is about to be spawned as an invocation
        id: ac-17
        then: The engine loads the task current state and verifies it still matches the dispatch rule
          trigger event; if the task has moved to a different state, the entry is discarded without
          spawning
        when: The dispatch engine dequeues the entry and prepares to run it
      - given: A CLI command transitions a task state while running inside a dispatched agent invocation
          (KSPEC_SESSION_ID is set)
        id: ac-18
        then: The event is suppressed to prevent self-triggering, since the file watcher will independently
          detect the change
        when: The CLI would normally post a state change event to the daemon
      - given: The dispatch engine is running and has been started
        id: ac-19
        then: The engine re-evaluates all current task states against dispatch rules (identical to bootstrap
          logic), enqueuing any tasks that match an agent's dispatch trigger but have no active or
          queued invocation, ensuring that missed or lost events are recovered automatically
        when: A configurable interval (default 60 seconds) elapses since the last reconciliation scan
      - given: The dispatch engine reconciliation interval is configured via DispatchEngineOptions
        id: ac-20
        then: The periodic reconciliation scan runs at the configured interval, and setting the interval to
          0 or null disables periodic reconciliation entirely
        when: The engine is created with a custom reconcileIntervalMs value (or the default of 60000ms)
      - given: a dispatch rule has no filter configured (filter is undefined or empty)
        id: ac-21
        then: "the engine defaults to requiring automation: eligible for task.ready and task.needs_work
          events — only automation-eligible tasks are dispatched unless the rule explicitly
          specifies a different automation filter value"
        when: a task state change matches the rule's event type
      - given: kspec setup creates default agent definitions (task-worker, pr-reviewer)
        id: ac-22
        then: "task-worker's task.ready and task.needs_work rules include filter: { automation: eligible }
          by default"
        when: the default dispatch rules are generated
      - given: the dispatch engine has just completed an agent invocation and is about to choose the next
          invocation to spawn
        id: ac-23
        then: the engine operates on a full and current view of all task states loaded from disk, not a
          stale or partial snapshot from prior queue entries alone
        when: the engine prepares to drain queues
      - given: an agent invocation completes (success or failure after retry exhaustion)
        id: ac-24
        then: the engine re-evaluates all current task states against dispatch rules (with skipIfActive
          deduplication) before draining, ensuring tasks that reached a dispatchable state during
          the prior invocation are visible to the drain loop
        when: the dispatch engine prepares to drain queues for the next invocation
      - given: the post-invocation re-evaluation (ac-24) fails due to a transient error (disk read failure,
          parse error, etc.)
        id: ac-25
        then: the failure is logged as a warning, and the drain still runs on pre-existing queue entries —
          re-evaluation failure does not block dispatch of already-queued work
        when: the dispatch engine proceeds to drain queues
      - given: A task state change matches an agent's dispatch rule
        id: ac-26
        then: At most one invocation may be active for a given task across all agents at any time;
          additional eligible invocations remain queued and are picked up automatically when the
          active invocation completes (whether successfully or after retry exhaustion) without
          requiring a new external event. Deferred entries are subject to the same staleness checks
          as any queued entry before spawn.
        when: Any agent — including a different agent — already has an active invocation for the same task
      - given: The dispatch engine enforces a per-agent max_concurrent limit
        id: ac-27
        then: max_concurrent is never exceeded — concurrent drain requests are serialized so that candidate
          selection and concurrency accounting for a given agent cannot race
        when: Multiple queue drain paths execute concurrently from any source (event-driven,
          post-invocation, retry wake-up, reconciliation, or bootstrap)
      - given: the dispatch engine performs internal bookkeeping (task notes, task blocking, git operations,
          workspace provisioning) within the daemon's Node.js event loop
        id: ac-28
        then: they use asynchronous APIs so the event loop remains available to serve HTTP and WebSocket
          requests concurrently
        when: those operations involve child process spawning or file I/O
      - given: A dispatch entry has been dequeued for spawn and the dispatch engine has marked the task
          in-flight, but no active invocation has been registered for that task yet.
        id: ac-inflight-spawn-refs-protect-cleanup
        then: The task reference is included in the cleanup protection input so the pre-active spawn window
          receives the same artifact protection as a registered active invocation.
        when: Startup, periodic, or post-event reconciliation invokes workspace artifact cleanup.
      - given: Periodic reconciliation is enabled and a reconciliation pass is still running
        id: ac-reconcile-non-overlap
        then: The dispatch engine does not start a second reconciliation pass before the running pass
          completes
        when: Another reconciliation interval elapses
      - given: The dispatch engine is stopping while one or more reconciliation passes are in flight
        id: ac-stop-awaits-reconciliation
        then: No in-flight reconciliation pass continues mutating dispatch state after stop has returned
        when: Stop completes
    tags: []
    features:
      - _ulid: 01KKFY93PW5HZ7V21GGJMMZENW
        slugs:
          - canonical-task-workspace-contract
        title: Canonical Task Workspace Contract
        type: feature
        description: |
          Each dispatchable task owns one canonical mutable branch lineage and one
          canonical workspace identity. Workers and fix-cycle workers attach to the
          mutable task branch, while reviewers attach to an isolated snapshot context
          anchored to that branch lineage.
        status:
          maturity: draft
          implementation: implemented
        depends_on: []
        implements: []
        relates_to: []
        tests: []
        traits: []
        acceptance_criteria:
          - given: |
              The dispatcher provisions workspace state for a task and the base
              branch has been resolved
            id: ac-1
            then: |
              One canonical task branch is created from the resolved base branch and
              the originating base commit is recorded
            when: |
              It establishes the task's code identity
          - given: |
              A worker invocation and a later needs_work fix-cycle invocation run for
              the same task
            id: ac-2
            then: |
              Both use the same canonical mutable task branch rather than creating a
              new branch per cycle
            when: |
              The dispatcher prepares their code context
          - given: |
              A reviewer invocation is prepared for a task with an existing canonical
              branch
            id: ac-3
            then: |
              The reviewer gets a separate isolated worktree materialized from the
              recorded canonical branch head in detached HEAD or equivalent read-only
              mode, and the dispatcher never attempts to check out the same local
              branch in two worktrees
            when: |
              The reviewer workspace is created
          - given: |
              A task transitions to needs_work after review
            id: ac-4
            then: |
              The worker resumes on the same canonical branch lineage instead of
              forking a new task branch
            when: |
              A follow-up worker invocation is prepared
          - given: |
              The dispatcher generates a canonical branch name for a task
            id: ac-5
            then: |
              The branch name follows the deterministic format
              `dispatch/task/<normalized-task-slug-or-task>/<short-task-ulid>` where
              the slug portion is normalized to kebab-case and the ULID suffix makes
              collisions impossible without relying on role-specific prefixes
            when: |
              The branch is first provisioned
          - given: |
              A task branch has been integrated into its recorded base branch or the
              task has been explicitly abandoned or reset
            id: ac-6
            then: |
              The canonical task branch becomes cleanup-eligible rather than
              remaining indefinitely active
            when: |
              The dispatcher reconciles the workspace lifecycle
        tags: []
        requirements:
          - _ulid: 01KKFY93SSX2FY5R38ZRQEC50A
            slugs:
              - dispatch-workspace-registry
            title: Dispatch Workspace Registry
            type: requirement
            description: |
              The dispatcher persists canonical workspace metadata in a first-party
              registry so branch, worktree, integration, and cleanup identity survive
              restarts and can be reused across worker, reviewer, and fix-cycle
              invocations.
            status:
              maturity: draft
              implementation: implemented
            depends_on: []
            implements: []
            relates_to: []
            tests: []
            traits:
              - "@trait-error-guidance"
            acceptance_criteria:
              - given: |
                  A canonical task workspace is provisioned
                id: ac-1
                then: |
                  A first-party workspace record is stored in kspec-managed metadata on
                  the shadow branch rather than existing only in daemon memory
                when: |
                  The dispatcher persists its identity
              - given: |
                  A task has an active canonical workspace
                id: ac-2
                then: |
                  At most one active canonical workspace record exists for that task
                when: |
                  The registry is validated
              - given: |
                  A workspace record exists
                id: ac-3
                then: |
                  The record includes at minimum workspace id, task ref, resolved base
                  branch, base head at branch point, canonical branch, canonical branch
                  head, per-role worktrees, bootstrap state, integration status, health
                  status, timestamps, and cleanup state
                when: |
                  It is stored in the registry
              - given: |
                  The daemon restarts or reloads dispatch state
                id: ac-4
                then: |
                  The dispatcher reloads workspace records from the registry and
                  reconciles them against the filesystem instead of losing
                  branch/worktree continuity
                when: |
                  It reconstructs active workspace state
              - given: |
                  A workspace record's referenced branch or worktree is missing,
                  unhealthy, or out of sync with its recorded state
                id: ac-5
                then: |
                  The record transitions to an explicit non-healthy state such as invalid
                  or stale, with actionable recovery data rather than silent fallback
                when: |
                  Reconciliation runs
              - given: |
                  A workspace record is tracked over time
                id: ac-6
                then: |
                  The transition states are explicit and behavioral: `provisioning`
                  during initial branch/worktree/bootstrap setup, `ready` after
                  provisioning/bootstrap with no running invocation, `active` while a
                  role invocation is attached, `stale` when reconciliation finds missing
                  or invalid recorded state, `integrating` when PR or manual merge-back
                  is pending or in progress, `closing` when merged or abandoned state
                  schedules cleanup, `cleanup_blocked` when cleanup safety checks fail,
                  and `closed` after tracked worktrees are removed and the record is
                  finalized
                when: |
                  Its lifecycle state changes
              - given: |
                  Integration or cleanup state changes over the life of the task
                id: ac-7
                then: |
                  Those transitions are durably persisted on the shadow branch for
                  restart recovery and later review workflows
                when: |
                  The registry is updated
              - given: The dispatch runtime writes workspace registry state such as provisioning, reconciliation,
                  bootstrap, integration, or cleanup updates into project.dispatch-workspaces.yaml
