        when: A watch speaker section marker is rendered
      - given: kspec agent dispatch watch is run and daemon subscribe handshake returns ack with
          success=false
        id: ac-18
        then: watch exits immediately with code 3 and prints an actionable error explaining the subscribe
          failure with guidance to verify daemon/logs or restart kspec serve
        when: the command receives the subscribe acknowledgement
