          - _ulid: 01KGR05MG2NNH5AVVC159HYQEN
            slugs:
              - batch-allowed-commands
            title: Batch Allowed Commands
            type: requirement
            description: >
              Defines which CLI commands are allowed in batch mode. Commands are classified as
              mutating or read-only based on whether they modify kspec state (YAML files in the
              shadow branch). All mutating commands are allowed. Read-only commands and meta/system
              commands are rejected during validation. The classification is determined by command
              metadata, not a hardcoded list.
            status:
              maturity: draft
              implementation: implemented
            depends_on: []
            implements: []
            relates_to: []
            tests: []
            traits: []
            acceptance_criteria:
              - given: A mutating command (item add, task start, derive, inbox promote, etc.)
                id: ac-allowlist
                then: Command is accepted and executed
                when: Used in batch
              - given: A non-mutating command (item get, task list, search, validate, etc.)
                id: ac-denylist
                then: Validation rejects with message explaining batch is for mutating operations only
                when: Used in batch
              - given: A batch command nested inside a batch
                id: ac-batch-itself
                then: Validation rejects with message that batch cannot be nested
                when: Used in batch
              - given: A path argument is provided (e.g. task set)
                id: ac-filter-by-path
                then: Only that command info is displayed with arguments, options, and description. Input is trimmed
                  before matching. Exact match only — partial paths do not match.
                when: kspec batch commands "task set" is run
              - given: A path argument is provided that matches no allowed command
                id: ac-filter-not-found
                then: "Exits with NOT_FOUND (3). Text mode shows error message. JSON mode outputs {commands: [],
                  total: 0, filter, error} on stdout."
                when: kspec batch commands "nonexistent" is run
            tags: []
            created: 2026-02-05T22:53:37.154Z
            notes: []
          - _ulid: 01KJQM85WKV636RTWZ5EB3WD5Z
            slugs:
              - batch-write-buffer
            title: Atomic isolation via write buffer
            type: requirement
            description: >-
              Atomic batch isolation is implemented via an in-memory write buffer (overlay), not a
              full directory copy to /tmp.


              The overlay intercepts file writes during batch execution, buffering them in memory.
              Reads check the buffer first (returning the pending write if present), then fall
              through to the real .kspec/ directory. On success, all buffered writes are flushed to
              disk atomically. On failure, the buffer is discarded — real .kspec/ is never touched.


              This replaces the current fs.cp(realSpecDir, tempDir) approach in batch-exec.ts, which
              copies the entire .kspec/ directory including sessions/blobs/ (potentially GBs of
              data) for every batch run.
            status:
              maturity: draft
              implementation: implemented
            depends_on: []
            implements: []
            relates_to: []
            tests: []
            traits: []
            acceptance_criteria:
              - given: atomic batch mode is active
                id: ac-1
                then: the write is stored in the in-memory buffer, not written to disk
                when: a command writes a file to .kspec/
              - given: command A writes a file and command B reads the same file in the same batch
                id: ac-2
                then: command B sees command A's buffered write (read-after-write consistency); this applies to ALL
                  read paths — readYamlFile, loadSpecFile, loadAllItems, loadAllTasks, and any other
                  function that reads .kspec/ files — not just the primary readYamlFile helper
                when: command B reads the file
              - given: all batch commands succeed
                id: ac-3
                then: only the buffered files (those actually written) are flushed to disk — files not touched by
                  the batch are unchanged
                when: batch commits
              - given: any batch command fails in atomic mode
                id: ac-4
                then: the buffer is discarded with no disk writes — .kspec/ state is identical to before the batch
                when: batch rolls back
              - given: a batch runs against a .kspec/ directory containing large sessions/blobs/ data
                id: ac-5
                then: .kspec/sessions/ is never copied to the temp location — only files actually written by batch
                  commands exist in the buffer
                when: batch executes in atomic mode
              - given: a batch is executing and has buffered writes not yet flushed
                id: ac-6
                then: the reading process sees the original pre-batch state (buffer is process-local and not visible
                  outside the batch process)
                when: another kspec process reads .kspec/ from disk
              - given: all batch commands succeed but writing the buffer to disk fails partway through the flush
                id: ac-7
                then: the error is reported and .kspec/ is left in a consistent pre-batch state — no partial writes
                  are silently committed
                when: flush encounters a write error
              - given: a new function or code path is added that reads files from .kspec/
                id: ac-8
                then: the read bypasses the write buffer, violating ac-2; all .kspec/ file reads MUST go through a
                  buffer-aware helper (e.g. readYamlFile or a shared readFileBufferAware) that
                  checks getActiveBatchBuffer() before falling back to disk
                when: the function uses fs.readFile or fs.readdir directly instead of a buffer-aware helper
              - given: two concurrent async operations each activate a write buffer within the same process
                id: ac-9
                then: each operation sees only its own buffer; writes from one operation are invisible to the other,
                  and discarding one buffer does not affect the other
                when: both operations are in progress simultaneously
            tags: []
            created: 2026-03-02T15:56:41.235Z
            notes: []
        created: 2026-02-05T22:53:37.029Z
        notes: []
    requirements:
      - _ulid: 01KEZCJPHWP32HK8MR38P2WSSJ
        slugs:
          - cli-structure
        title: Command Structure
        type: requirement
        description: |
          Commands follow consistent structure:

          kspec <resource> <action> [args] [flags]

          Resources: item, task, link, todo, etc.
          Actions: add, get, list, set, delete, etc.

          Examples:
          - kspec item add --type feature --title "Login"
          - kspec task start @impl-login
          - kspec tasks ready
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@cli-design"
        acceptance_criteria:
          - given: A documented kspec command is exposed to users.
            id: ac-1
            then: It follows the pattern `kspec <resource> <action> [args] [flags]` so the resource and action
              are explicit.
            when: The command syntax is shown in help text or examples.
      - _ulid: 01KEZCJPHWKVBFSAEP0MMH57DQ
        slugs:
          - cli-json-output
        title: JSON Output Mode
        type: requirement
        description: |
          All commands support --json flag for structured output:

          kspec tasks ready --json
          kspec item get @login --json

          JSON output includes:
          - success: boolean
          - data: The result
          - errors: Array of error objects (if any)
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@cli-design"
        acceptance_criteria:
          - given: A command is run with the `--json` flag.
            id: ac-1
            then: Stdout is valid JSON containing `success`, `data`, and `errors` fields for machine
              consumption.
            when: The command finishes successfully or with a handled failure.
      - _ulid: 01KEZCJPHWB81SAWT4ZGCV75FC
        slugs:
          - cli-exit-codes
        title: Semantic Exit Codes
        type: requirement
        description: |
          Exit codes are semantic, not just 0/1:

          - 0: Success
          - 1: General error
          - 2: Usage error (bad arguments)
          - 3: Not found
          - 4: Validation failed
          - 5: Conflict (already exists, etc.)

          Scripts can handle specific cases.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@cli-design"
        acceptance_criteria:
          - given: CLI codebase uses exit codes
            id: ac-exit-code-constants
            then: Uses named constants from a centralized EXIT_CODES object (e.g., EXIT_CODES.NOT_FOUND instead
              of magic number 3)
            when: Commands need to exit with specific code
          - given: User wants to script kspec commands
            id: ac-exit-codes-documented
            then: All exit codes are listed with their meanings and which commands may return them
            when: User runs kspec help --exit-codes or checks documentation
          - given: Multiple commands use exit codes
            id: ac-consistent-usage
            then: All commands use consistent exit codes for the same error types (e.g., all 'not found' errors
              exit 3, all validation errors exit 4)
            when: Commands exit with errors
        notes:
          - _ulid: 01KFADD1NW999DBZJHBDBSPFZM
            content: >-
              Enhancement: Formalize exit code implementation


              **Current state:** Exit codes are defined in spec but implementation uses magic
              numbers inconsistently.


              **Goals:**

              1. Centralized constants - single source of truth

              2. Documentation - help users script with kspec

              3. Consistency audit - ensure all commands follow the spec


              **Exit code definitions (from spec):**

              - 0: SUCCESS - Operation completed successfully

              - 1: ERROR - General/unexpected error

              - 2: USAGE - Bad arguments, invalid command usage

              - 3: NOT_FOUND - Referenced item doesn't exist

              - 4: VALIDATION - Spec validation failed

              - 5: CONFLICT - Item already exists, duplicate slug, etc.


              **New additions to consider:**

              - 6: PARTIAL - Some operations succeeded, some failed (for batch operations)


              **Documentation format:** Add to 'kspec help' or new 'kspec help --exit-codes'
              subcommand showing all codes with descriptions.
            supersedes: null
            author: "@claude"
            created_at: 2026-01-19T05:59:47.645Z
      - _ulid: 01KEZCJPHWBEEP2BYRP6YVNK9F
        slugs:
          - cli-agent-features
        title: Agent-Friendly Features
        type: requirement
        description: |
          Features for agent/script usage:

          - --json: Structured output
          - --no-prompt: Never prompt (KSPEC_NO_PROMPT=1)
          - --dry-run: Show what would happen
          - --if-not-exists: Idempotent creation
          - --quiet: Suppress non-essential output

          Agents should be able to use kspec without interaction.
        status:
          maturity: draft
          implementation: implemented
        implements:
          - "@cli-design"
        acceptance_criteria:
          - given: An agent runs a command in non-interactive automation mode.
            id: ac-1
            then: The command can complete without interactive input while honoring the requested
              machine-friendly behavior.
            when: It uses agent-oriented flags such as `--json`, `--dry-run`, `--if-not-exists`, `--quiet`, or
              disables prompting.
        requirements:
          - _ulid: 01KHA83NH88Q21QF947XXRDRBE
            slugs:
              - output-format-option
            title: Output Format Option
            type: requirement
            description: |
              Add a --format <json|yaml> global option with --json, --raw, and --yaml as
              shorthands. Agents frequently try --raw and --yaml flags expecting structured
              output. --raw is a shorthand for --format json (agents associate raw with
              give me the data). --yaml is a shorthand for --format yaml. --json remains
              as a shorthand for --format json. The --format option is extensible for
              future formats. This replaces the precedence model in @trait-json-output
              ac-6 with explicit format selection.
            status:
              maturity: draft
              implementation: implemented
            depends_on: []
            implements: []
            relates_to: []
            tests: []
            traits:
              - "@trait-json-output"
              - "@trait-semantic-exit-codes"
            acceptance_criteria:
              - given: User runs any command with --format json
                id: ac-format-json
                then: Output is identical to current --json behavior
                when: The format option is set to json
              - given: User runs any command with --format yaml
                id: ac-format-yaml
                then: Output contains the same data as --json but serialized as valid YAML
                when: The format option is set to yaml
              - given: User runs any command with --json
                id: ac-json-shorthand
                then: Equivalent to --format json (backward compatible, existing behavior preserved)
                when: The --json shorthand is used
              - given: User runs any command with --raw
                id: ac-raw-shorthand
                then: Equivalent to --format json (same data, JSON serialization)
                when: The --raw shorthand is used
              - given: User runs any command with --yaml
                id: ac-yaml-shorthand
                then: Equivalent to --format yaml
                when: The --yaml shorthand is used
              - given: User runs a command with conflicting format options (e.g. --json --yaml)
                id: ac-conflict-error
                then: Error message explains the conflict and exits non-zero
                when: Multiple format specifications are provided
              - given: User runs any command with --format yaml
                id: ac-yaml-no-ansi
                then: Output contains no ANSI escape codes (same contract as --json)
                when: YAML output is generated
              - given: User runs kspec task get @ref --yaml
                id: ac-yaml-references
                then: References include @ prefix (same contract as --json)
                when: Output contains reference fields
              - given: User runs any command that supports structured output with --format, --yaml, or --raw
                id: ac-global-scope
                then: The option works globally (same scope as --json)
                when: The option is used on any command
              - given: User runs --format csv or another unsupported format name
                id: ac-unsupported-format
                then: Error message lists valid formats (json, yaml) and exits non-zero
                when: An invalid format value is provided
            tags: []
            created: 2026-02-13T00:58:41.064Z
            notes: []
