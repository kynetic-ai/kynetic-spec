name: Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "packages/**"
      - "scripts/**"
      - "templates/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - ".github/workflows/test.yml"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: lint & format

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      # AC: @prepublish-runtime-verification ac-1
      # Test suite runs on the oldest supported Node.js major (20, from
      # package.json engines) and a newer major (24) as distinct runs.
      matrix:
        shard: [1, 2, 3]
        node-version: ["20", "24"]

    name: test (node ${{ matrix.node-version }}, shard ${{ matrix.shard }}/3)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for proper git operations

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --shard=${{ matrix.shard }}/3

      - name: Verify CLI functionality
        if: matrix.shard == 1
        run: |
          npm link
          kspec --version
          kspec --help

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: e2e (playwright shard ${{ matrix.shard }}/2)

    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E full suite shard
        run: npm run test:e2e:ci -- --shard=${{ matrix.shard }}/2
