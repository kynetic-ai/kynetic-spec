  - _ulid: 01KTS0A3X650FS3BZC3CA4QF2C
    content: "Fix cycle 1 changes per codex @01KTRYS2 + claude @01KTRZ06: (1) node-docs consistency test
      now derives the doc set dynamically (README.md, INSTALL.md, all docs/**.md) so all named
      user-facing docs and future docs are covered; (2) prepack task adds
      scripts/verify-clean-pack.cjs — real npm pack from a clean temp source copy with no build
      output, proving ac-4 behaviorally, run in publish workflow + locally; (3) CI matrix task adds
      a workflow_dispatch trigger and verifies via gh workflow run on the task branch (no PR
      needed); (4) audit-fix scope made precise: production advisories are the bar,
      semver-compatible dev side-effect bumps accepted, unfixed dev advisories go to inbox; (5)
      task-dedupe-web-ui-devdeps now depends_on task-audit-fix-production-deps (lockfile
      serialization); (6) CI task also replaces direct npx vitest with npm test -- --shard through
      scripts/test.cjs; (7) all four flagged Testing sections reworked to lint-clean mechanisms —
      npm pack --dry-run --json parsing, script exit codes via createTempDir, JSON module imports —
      with the sanctioned eslint-disable-with-reason escape hatch only where doc/LICENSE text is the
      contract; (8) specs reparented under new Release and Distribution module created in the Specs
      block (nests under @main at derive; tradeoff noted); (9) tests/release-packaging.test.ts
      single-owner (license task creates it, node-docs and workspace-private depend on it) and
      publish.yml edits serialized (CI matrix depends on prepack task); (10) prepublish ac-1
      rephrased to oldest supported major plus at least one newer major (deterministic; task pins
      20/24); (11) ac-2 universal quantifier closed by the dynamic doc-set test; (12)
      CONTRIBUTING/SECURITY kept spec-less as repo hygiene with reasoning recorded in Implementation
      Notes (incl. post-derive relates_to @docs-getting-started-section)."
    author: "@claude"
