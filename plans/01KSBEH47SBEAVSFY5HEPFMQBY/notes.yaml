  - _ulid: 01KSJNVQZYCEGEJJMPB6HP24PR
    content: >-
      - This is an existing-spec update plan. Do not materialize duplicate specs from the `## Specs`
      block.

      - The immediate product decision is: reviewer/manual_merge helpers may use temporary
      implementation-owned worktrees, but they must not require or leave persistent
      integration-target checkouts that block the dispatch root.

      - The root dispatch checkout remains the authoritative mutation surface for integration target
      sync/push unless it is itself on the integration target branch. Auxiliary worktrees are
      task/review/helper execution surfaces, not long-lived target locks.

      - The helper should be conservative around pre-existing occupied target checkouts. A clean
      occupied checkout owned by a human or previous agent should not be silently detached or
      overwritten unless a later explicit product decision scopes that behavior. The safe first fix
      is to refuse, identify the blocking worktree, and say how to free the branch.

      - No new @plan-branch-dispatch-target AC is needed for this plan: plan-branch target selection
      already exists; this plan hardens the shared integration-target mutation and remote-sync
      contracts that operate after a workspace has resolved its target branch.

      - Do all merge-helper and dispatch-regression testing in temp repos/fixtures. Do not run
      migration or destructive cleanup tests against `~/Projects/kynetic-spec` or
      `~/Projects/kynetic-spec-dispatch`.
    author: Jacob Chapel
    created_at: 2026-05-26T17:38:31.550Z
