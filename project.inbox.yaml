  - _ulid: 01KTSASPKGX69PXQJBPJSKS5GH
    text: "Dispatch engine reports healthy while reconcile permanently fails on ambiguous workspace
      records. Observed in hawse (2026-06-10): two legacy non-closed workspace registry records
      (slug-keyed dispatch-workspace-task-proposal-lifecycle and ULID-keyed
      dispatch-workspace-01KNNMF8...) resolved to the same canonical completed task.
      AmbiguousWorkspaceTaskError (workspace.ts ~1697, workspace-identity.ts ~108) is thrown by
      loadWorkspaceRecordForWorktreeRoot and fires inside reconcileDispatchWorkspaceRegistry, which
      runs at the top of BOTH engine start() and every 60s _reconcile() tick
      (src/agent-runtime/dispatch.ts) BEFORE _evaluateAllTasks. Effect: engine showed running:true,
      degraded:false, 0 queued for over an hour while every reconcile tick failed; newly derived
      eligible tasks were never evaluated, and the engine could not self-heal because the cleanup
      that would close the closing-state records sits behind the same throw. Manual recovery (delete
      the duplicate alias record from project.dispatch-workspaces.yaml) immediately unblocked
      bootstrap. Suggested fixes: (1) surface persistent reconcile failure in
      degraded/degraded_targets instead of silent console logging; (2) scope the ambiguity failure
      to the affected task so evaluation of unrelated tasks continues; (3) consider auto-coalescing
      duplicate alias records when the task is verifiably completed and the branch head is merged
      (legacy pre-canonical-identity data exists in the wild)."
    tags:
      - dispatch
      - bug
      - observability
      - canonical-identity
    added_by: "@claude"
    created_at: 2026-06-10T17:55:33.105Z
  - _ulid: 01KTSAV5RX6MCEBK82F93VD9PK
    text: "DispatchEngine.handleFileChange never emits events for newly created tasks. In
      src/agent-runtime/dispatch.ts ~1282, handleFileChange diffs each task's status against
      prevTaskStates and only pushes a TaskStateChange when prevStatus !== undefined && prevStatus
      !== currentStatus; brand-new tasks (prevStatus undefined, e.g. created by kspec plan derive or
      task add while the engine is running) are snapshot-recorded but never produce task.ready.
      Combined with the fact that direct-mode CLI mutations (KSPEC_NO_DAEMON=1) emit no daemon
      events, the only discovery paths for derive-created tasks are engine restart bootstrap or the
      60s reconcile - and reconcile can be silently dead (see related ambiguous-workspace-records
      item). Observed in hawse 2026-06-10: five tasks derived from an approved plan with automation
      eligible sat undiscovered. Suggested fix: treat prevStatus === undefined with a
      dispatch-eligible current status as a synthetic transition (emit task.ready for pending
      tasks), or have handleFileChange route new tasks through the same evaluation used by
      bootstrap/_evaluateAllTasks."
    tags:
      - dispatch
      - bug
      - events
      - derive
    added_by: "@claude"
    created_at: 2026-06-10T17:56:21.405Z
  - _ulid: 01KTSAWJNJSHWPX98HZ5DQHNA1
    text: "kspec event emit / event log resolve to the daemon default project instead of the cwd
      project. Observed in hawse 2026-06-10: with the hawse dispatch engine running (kspec agent
      dispatch status from hawse cwd showed running:true with hawse agents), kspec event emit
      task.ready failed with 'Dispatch engine is not running. Start it first with POST
      /api/agent/dispatch' and kspec event log showed 'No recent events'. The daemon (launched with
      --kspec-dir .../kynetic-spec-dispatch/.kspec) treats kynetic-spec-dispatch as the default
      project; project context for API requests comes from the X-Kspec-Dir header
      (packages/daemon/src/middleware/project-context.ts), and the emit route checks
      getDispatchEngine(projectContext.path) (routes/automation.ts ~294). Other commands (dispatch
      status/start) correctly scope to the cwd project, so the event CLI commands appear not to send
      X-Kspec-Dir (or send a different path form), landing on the default project whose engine was
      stopped. Effect: event emit/log are unusable and misleading in multi-project daemons - they
      report on the wrong project with no indication of which project they hit. Suggested fix: send
      X-Kspec-Dir from the event CLI like other project-scoped commands, and include the resolved
      project path in event log/emit output so mis-scoping is visible."
    tags:
      - daemon
      - cli
      - bug
      - events
      - multi-project
    added_by: "@claude"
    created_at: 2026-06-10T17:57:07.378Z
