  - _ulid: 01KPS6QFDNK06G4TAAR44VTMEJ
    text: "AC-style convention needs three more facets beyond the existing 'no compound conditions' rule
      (see related inbox item about compound conditions interpretation): (1) Standalone — each AC
      must stand alone with no cross-references to other ACs in the same or other specs; a future
      reader of any AC should be able to understand its contract without following links. (2)
      Timeless — AC text must not contain implementation-specific identifiers (file paths, env var
      names, function names, library names, version numbers) because those rot as code evolves; such
      identifiers belong in task bodies and test fixtures, not in the spec contract. (3) Abstract
      class terms — when an AC governs a set of values (e.g. runtime mode configuration env
      variables), the AC names the class behaviorally ('runtime mode configuration values') rather
      than enumerating concrete members ('NODE_ENV, BUN_ENV'); the concrete list lives in test
      fixtures so adding a new class member does not require amending the AC. Surfaced 2026-04-21
      during authoring of three new ACs on @dispatch-runtime-bootstrap-contract, where the user had
      to correct compound/cross-referencing/named-variable drafts across four revision cycles. Scope
      when triaged: codify these rules in the spec-authoring convention text so they are
      discoverable to authors and reviewers. Consider whether existing specs need a retroactive
      audit or whether going-forward-only is acceptable."
    tags:
      - spec
      - convention
      - ac-style
      - design
    added_by: "@claude"
    created_at: 2026-04-21T23:41:38.613Z
  - _ulid: 01KPS7HK9BHHFBNQM9ZK4WQ6E2
    text: "Gitignore backup files are not themselves gitignored. `ensureKspecGitignore` in
      `src/parser/gitignore.ts` creates a `.gitignore.backup-<timestamp>` sibling file when invoked
      with `--force` over an existing `.gitignore` that has no managed block (per
      `@trait-idempotent-file-scaffold ac-force-backs-up-before-overwrite`). The backup file sits at
      the project root and is not covered by the managed block the writer itself creates, so if ever
      written it would appear as untracked content and could slip into a commit. Likely not
      triggered in common flows but violates `@complete-auto-gitignore
      ac-no-untracked-after-common-commands` under the force path. Fix scope: either extend
      `buildKspecGitignoreEntries` to emit a `.gitignore.backup-*` pattern, or have the backup
      writer place the backup inside an already-ignored directory (e.g. `.kspec/backups/`). Surfaced
      2026-04-21 during review of the `.lock/` gitignore fix task."
