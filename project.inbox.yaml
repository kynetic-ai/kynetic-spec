    text: >-
      Unify the three daemon-spawn paths under a single helper. Currently three call sites spawn the
      same dist/daemon/index.js binary with three different lifecycle contracts:
      src/cli/commands/serve.ts:366 (--detach mode: detached+unref+stdio:ignore),
      src/cli/index.ts:194 (auto-start: detached+unref+stdio:ignore),
      tests/e2e/fixtures/test-base.ts:324 (e2e fixture: non-detached, parented in process group,
      child handle retained for explicit teardown). The asymmetry is the structural enabler of the
      daemon leak class fixed by @task-cli-serve-test-daemon-cleanup — three implementations of the
      same operation with three different cleanup contracts.


      Proposal: extract a single spawnKspecDaemon(opts) helper that encodes the lifecycle contract
      explicitly:

      - opts.lifecycle: 'detached' | 'parented'

      - opts.cleanupHook: required when lifecycle === 'parented' (returns the child process handle)

      - opts.runtime, opts.port, opts.kspecDir, opts.env: existing args

      - Helper enforces: detached implies unref+stdio:ignore; parented implies child handle returned
      + caller must register cleanup


      All three call sites migrate to use it. Production --detach behavior unchanged. Test fixtures
      get a single safe pattern. The architectural class of bug becomes structurally impossible
      because the unsafe-detached path doesn't exist outside one well-tested helper.


      Should land AFTER @task-cli-serve-test-daemon-cleanup and @task-lint-rule-test-daemon-cleanup
      so the test refactor has a clean target. Highest-leverage long-term fix for daemon lifecycle.
