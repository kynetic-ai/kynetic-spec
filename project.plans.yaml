          - `src/parser/shadow.ts` — new `shadowNeedsSync()` utility (~50 lines), new
          `spawnGitWithTimeout()` helper

          - `src/parser/shadow-sync-scheduler.ts` — add push after pull in `syncOnce()`; ensure
          fetch runs from worktree dir

          - `src/cli/index.ts` — propagate syncMode through preAction hook via module-level state

          - `src/cli/command-annotations.ts` — add `markAlwaysSync` / `getAlwaysSyncAnnotation`
          (mirrors existing `markMutating` pattern)

          - `src/cli/commands/session/commands.ts` — annotate session start AND `kspec context`
          alias with `markAlwaysSync`


          ### FETCH_HEAD location: worktree git dir, not common dir


          Codex experimentally verified: `git fetch` from a worktree writes FETCH_HEAD to the
          **worktree's git dir** (e.g. `.git/worktrees/-kspec/FETCH_HEAD`), NOT the common
          `.git/FETCH_HEAD`.


          Use `git rev-parse --git-path FETCH_HEAD` from the worktree dir to get the correct path.
          This returns the worktree-specific path automatically. Both the drift check stat and the
          fetch must use the same cwd (worktreeDir) to ensure they reference the same FETCH_HEAD
          file.


          **Important — fetch cwd alignment required:** Not all current fetch operations use the
          worktree dir:

          - `fetchRemote()` runs from `projectRoot` → writes `.git/FETCH_HEAD` (wrong for drift
          check)

          - `pullRebaseBeforePush` runs from `worktreeDir` → writes
          `.git/worktrees/-kspec/FETCH_HEAD` (correct)


          The drift check stats the worktree-specific FETCH_HEAD. For daemon periodic sync to
          freshen the same file, the `ShadowSyncScheduler` must change its fetch to run from
          `worktreeDir` (or use a worktree-aware fetch helper). This is a required change in
          `shadow-sync-scheduler.ts` and potentially in `shadowPullImpl` where it calls
          `fetchRemote(projectRoot, ...)`. The fetch cwd must be `worktreeDir` everywhere the drift
          check depends on FETCH_HEAD freshness.


          ### Drift detection: ahead vs behind vs diverged


          Use `git rev-list --left-right --count HEAD...@{u}` which returns `ahead\tbehind` in a
          single call. Only pull when `behind > 0` (behind or diverged). When `ahead > 0` but
          `behind == 0`, local is ahead-only — no pull needed, push will happen on next write or
          daemon sync.


          ### Cancellable git fetch with process kill


          `runGitAsync` wraps `execFileAsync` and returns only `{stdout, stderr}` — no child process
          handle. Cannot kill a process you don't hold a reference to.


          Create a new `spawnGitWithTimeout()` helper that uses `child_process.spawn` directly,
          retains the child handle, and kills it on timeout:


          ```typescript

          async function spawnGitWithTimeout(
            cwd: string,
            args: string[],
            timeoutMs: number,
          ): Promise<{ stdout: string; stderr: string }> {
            return new Promise((resolve, reject) => {
              const child = spawn('git', args, { cwd, stdio: ['ignore', 'pipe', 'pipe'] });
              let stdout = '', stderr = '';
              child.stdout.on('data', (d) => { stdout += d; });
              child.stderr.on('data', (d) => { stderr += d; });

              let promiseSettled = false;
              let processExited = false;
              const timer = setTimeout(() => {
                child.kill('SIGTERM');
                // Escalate to SIGKILL if process hasn't exited after grace period.
                // child.killed only means signal was sent, not that process exited.
                // Track actual exit via processExited flag set in 'close' handler.
                setTimeout(() => {
                  if (!processExited) child.kill('SIGKILL');
                }, 1000);
                promiseSettled = true;
                reject(new Error(`git ${args[0]} timed out after ${timeoutMs}ms`));
              }, timeoutMs);

              child.on('close', (code) => {
                processExited = true;
                clearTimeout(timer);
                if (promiseSettled) return; // Already rejected by timeout
                promiseSettled = true;
                if (code === 0) resolve({ stdout, stderr });
                else reject(new Error(`git ${args[0]} exited ${code}: ${stderr}`));
              });
            });
          }

          ```


          Use this for the drift check fetch only. Other git operations continue using
          `runGitAsync`.


          ### Drift check implementation sketch


          ```typescript

          async function shadowNeedsSync(
            worktreeDir: string,
            remoteName: string,
            thresholdMs: number,
          ): Promise<boolean> {
            // 1. Resolve FETCH_HEAD path for this worktree
            const { stdout: fetchHeadRaw } = await runGitAsync(
              worktreeDir, ['rev-parse', '--git-path', 'FETCH_HEAD']
            );
            const fetchHeadPath = path.resolve(worktreeDir, fetchHeadRaw.trim());

            // 2. Check freshness — if stale, fetch with timeout + process kill
            let fetchNeeded = true;
            try {
              const stat = await fs.stat(fetchHeadPath);
              fetchNeeded = (Date.now() - stat.mtimeMs) > thresholdMs;
            } catch {
              // No FETCH_HEAD — need to fetch
            }

            if (fetchNeeded) {
              try {
                await spawnGitWithTimeout(
                  worktreeDir,
                  ['fetch', remoteName],
                  5000,
                );
              } catch {
                // Network failure or timeout — proceed with local state
                return false;
              }
            }

            // 3. Check ahead/behind — only sync when behind or diverged
            try {
              const { stdout } = await runGitAsync(
                worktreeDir, ['rev-list', '--left-right', '--count', 'HEAD...@{u}']
              );
              const [, behind] = stdout.trim().split('\t').map(Number);
              return behind > 0;
            } catch {
              // No upstream ref exists — force sync as safer default
              return true;
            }
          }

          ```


          ### syncMode propagation: module-level state, not per-callsite args


          **Problem:** `initContext()` is called twice per command:

          1. `preAction` hook → `maybeAutoStartDaemon()` → `initContext()`

          2. Command action handler → `initContext()`


          Requiring every handler to pass `syncMode` is brittle. Instead, use module-level state set
          once in the preAction hook:


          ```typescript

          // src/cli/sync-mode.ts


          /** Controls pre-read sync behavior in initContext(). */

          type ShadowSyncMode =
            | 'drift-check'  // Default for reads: lightweight check, pull only if behind/diverged
            | 'always'       // Session start: unconditional shadowPull()
            | 'skip';        // Mutating commands: no pre-read sync (commitIfShadow handles it)

          let commandSyncMode: ShadowSyncMode | null = null;

          let commandId: number = 0; // Monotonic counter scoping consume-once to a command
          lifecycle

          let consumedForCommand: number = -1;


          /**
           * Set sync mode for the current CLI command lifecycle.
           * Called once in preAction. Increments commandId to scope consume-once.
           */
          export function setSyncMode(mode: ShadowSyncMode): void {
            commandSyncMode = mode;
            commandId++;
            consumedForCommand = -1;
          }


          /**
           * Consume sync mode for the current command.
           * Returns the real mode on first call per commandId, then 'skip' for
           * subsequent calls (prevents double-pull when preAction and action
           * handler both call initContext).
           *
           * Non-Commander callers (daemon, dispatch engine) that never call
           * setSyncMode() get null, signaling initContext to use its default
           * behavior (drift-check).
           */
          export function consumeSyncMode(): ShadowSyncMode {
            // Non-Commander caller — no preAction set syncMode
            if (commandSyncMode === null) return 'drift-check';

            // Already consumed for this command lifecycle
            if (consumedForCommand === commandId) return 'skip';

            consumedForCommand = commandId;
            return commandSyncMode;
          }

          ```


          In `preAction` (src/cli/index.ts):


          ```typescript

          .hook("preAction", async (thisCommand, actionCommand) => {
            const isMutating = getMutatingAnnotation(actionCommand);
            const isAlwaysSync = getAlwaysSyncAnnotation(actionCommand);

            if (isAlwaysSync) {
              setSyncMode('always');
            } else if (isMutating) {
              setSyncMode('skip');
            } else {
              setSyncMode('drift-check');
            }

            await maybeAutoStartDaemon();
          });

          ```


          `initContext()` calls `consumeSyncMode()` internally — no signature change needed. The
          existing `startDir?: string` parameter is unchanged.


          Consume-once is scoped to a command lifecycle via `commandId` counter (incremented by
          `setSyncMode`). This prevents:

          - Double-pull when `syncMode === 'always'` (session start): preAction initContext pulls,
          action handler initContext skips

          - Stale state for non-Commander callers (daemon, dispatch): `consumeSyncMode()` returns
          `'drift-check'` when `setSyncMode` was never called, since `commandSyncMode` starts as
          `null`

          - Cross-command bleed: each `setSyncMode` call resets the consume-once guard via new
          `commandId`


          This avoids:

          - Changing `initContext()` signature (many callers)

          - Per-command manual passing (brittle)

          - Process-global state leaking to non-CLI callers


          ### Existing spec ACs to update


          - `@shadow-sync ac-2` — currently says "session start pulls remote changes before showing
          session context." Rewrite to: "session start always performs a full shadowPull regardless
          of drift check freshness, ensuring the user sees latest remote state when beginning a work
          session."


          Note: `@config-shadow ac-11` is about write-path pull-rebase-before-push behavior — it
          remains accurate and does NOT need updating. The pre-read sync behavior change is fully
          captured in the new `@shadow-lazy-read-sync` spec.


          ### Spec dependencies


          - `@shadow-lazy-read-sync` is the core spec — defines drift check, syncMode, and fast path

          - `@shadow-write-sync` depends on `@shadow-lazy-read-sync` for the syncMode mechanism
          (explicit `depends_on`)

          - `@shadow-daemon-push-sync` is orthogonal — can be implemented independently. Its fetch
          freshens FETCH_HEAD which helps the CLI fast path, but the CLI works without it (falls
          back to its own fetch when stale)


          ### What stays the same


          - Fire-and-forget push after writes (`shadowPushAsync`)

          - In-flight promise dedup for `shadowPull()`

          - Merge driver for YAML conflicts

          - `KSPEC_NO_SYNC` escape hatch

          - `kspec shadow sync` explicit command

          - `@config-shadow ac-11` (write-path pull-rebase-before-push)


          ### Known limitations


          - TOCTOU: If daemon fetches while CLI stats FETCH_HEAD simultaneously, CLI may see an
          incomplete write. The window is sub-millisecond and the consequence is at most one stale
          read until the next check. Acceptable.

          - The daemon's fetch freshens FETCH_HEAD for CLI commands on the same machine. If no
          daemon is running, CLI falls back to its own fetch when FETCH_HEAD is stale.

          - Unrelated fetches (e.g., `git fetch` on main branch by the user) may update a different
          FETCH_HEAD (main repo's, not worktree's), so they do NOT interfere with the worktree drift
          check. This is a benefit of using the worktree-specific FETCH_HEAD path.
