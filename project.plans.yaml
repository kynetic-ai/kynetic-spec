    title: Review Version Auto-Derivation
    content: >
      # Review Version Auto-Derivation


      ## Problem


      Review verdicts and checks require callers to pass `applies_to_version` explicitly via
      `--version-base`/`--version-head` or `--version-hash` flags. This is wrong for two reasons:


      1. **Reviews are per-cycle snapshots.** A review's subject is frozen at creation time. Every
      verdict and check on that review applies to that same subject version. There is no reason for
      callers to specify a different version — the review already knows what it's reviewing.


      2. **Type mismatches corrupt disposition computation.** The reviewer agent creates
      task-subject reviews (entity_version) but stamps verdicts/checks with code_compare versions
      (from the branch it reviewed). The shared `computeDisposition` treats these as stale due to
      type mismatch, making every approved review appear as `changes_requested` in the web UI. The
      CLI masks this with a naive local `computeDisposition` that ignores staleness entirely.


      **Impact:** 76 of 110 reviews are approved per the CLI's naive calculation, but the daemon
      (using the correct shared logic) shows only 4 approved. The reviews index is effectively
      broken — approved work is invisible.


      ## Spec Changes


      ### @review-cli-mutation-commands


      **ac-2 (checks):** Currently says "with the current compare context" implying callers pass
      version info. Should say the version is auto-derived from the review's subject. The
      `--version-base`, `--version-head`, and `--version-hash` flags are removed. The review already
      knows its subject version.


      **ac-3 (verdicts):** Same issue — "compare context" language implies external version. Should
      say the verdict's `applies_to_version` is derived from the review subject automatically. No
      version flags accepted.


      **Reasoning:** The daemon API already auto-derives versions for both verdicts (line 162 of
      review-operations.ts) and checks (line 915 of reviews.ts routes). The CLI should match.
      Callers should never need to know or care about the version type of the subject they're
      reviewing.


      ### @review-verdicts-and-resolution-lifecycle


      **ac-1:** Says verdicts are recorded "with the applies_to_version context (base_commit and
      head_commit)". This incorrectly assumes code subjects. Should say `applies_to_version` is
      derived from the review's subject type — code_compare for code subjects, entity_version for
      task/plan/spec subjects. The caller does not provide this; the system derives it.


      **ac-5:** References "base_commit and head_commit for code subjects, or content_hash for
      entity subjects" — this is correct as documentation of the version types, but should clarify
      these are derived from the subject, not provided by the verdict submitter.


      **ac-7:** Staleness detection is correct as-is. The issue isn't the staleness logic — it's
      that mismatched version types were being created in the first place.


      ### @review-cli-commands


      **ac-2:** References "computed disposition" and "computed gate state" — these should use the
      shared library functions, not local naive reimplementations. The CLI has its own
      `computeDisposition` and `computeGateState` that ignore version staleness and gate evaluation.
      These must be replaced with the shared versions from `review-operations.ts` and `checks.ts`.


      ### @review-subject-bindings


      No changes needed. The subject binding and staleness specs are correct — the bug is in the CLI
      not respecting them.


      ## Tasks


