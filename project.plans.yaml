          ### Per-spec: @doctor-command


          **Severity model:** Each check gets `ok | warning | error`. Shadow broken = error. Setup
          missing = error. Daemon not running = warning. Staleness unknown = warning. Exit 0 when no
          errors (warnings are fine). Exit 1 when any error exists.


