      ## Tasks


      derive_from_specs: true


      ## Implementation Notes


      This plan extends kspec's skill management to support multi-platform rendering aligned with
      the Agent Skills open standard (agentskills.io). The architecture uses a dual-layer model:
      source SKILL.md files are body-only content (no frontmatter), all metadata lives in meta.yaml,
      and platform-specific renderers produce the final output with appropriate frontmatter and
      sidecar files.


      ### Task Dependency Order (CRITICAL)


      Tasks MUST be completed in this order due to dependencies:


      1. **@consolidate-skill-render** — PREREQUISITE for everything. Merges duplicate render code.

      2. **@extended-skill-schema** — Schema changes needed by all renderers.

      3. **@supporting-files-convention** — Directory handling used by renderers.

      4. **@platform-renderer-trait** — Trait defines contract (spec-only, no code, but specs
      reference it).

      5. **@claude-code-renderer-extended** — Refactors existing renderer to PlatformRenderer
      interface.

