    title: Multi-Platform Skill Rendering with Agent Skills Compatibility
    content: >
      # Multi-Platform Skill Rendering with Agent Skills Compatibility


      Kspec has a complete skill management pipeline (import, render, drift detection, CLI) but it's
      currently single-platform (Claude Code only), emits minimal frontmatter (name + description),
      and doesn't manage the 17 existing hand-authored skills. The Agent Skills spec
      (agentskills.io) is an emerging open standard adopted by Claude Code, OpenAI Codex, and
      OpenCode. This plan extends kspec to render skills for multiple platforms through a single
      management pipeline.


      ## Architecture Decisions


      | Decision | Choice |

      |----------|--------|

      | Schema model | **Dual-layer**: SKILL.md = content only. Meta.yaml = all metadata. Renderers
      merge both. |

      | Source SKILL.md | **Body-only** (no frontmatter). Frontmatter is render-time output. |

      | Field ownership | **Meta.yaml canonical**, mirrored to rendered frontmatter. |

      | Platform fields | **Nested `platform_config`** object: `platform_config.claude_code: {...}`,
      `platform_config.codex: {...}` |

      | Platform coupling | **Decoupled**: `platforms` array declares render targets.
      `platform_config` optional. |

      | Output directories | **Configurable with defaults**: Claude Code `.claude/skills/`, Codex
      `.agents/skills/` |

      | Renderer contract | **Kspec trait** (`@platform-renderer`) + TypeScript interface |

      | Supporting files | **Agent Skills convention**: `references/`, `scripts/`, `assets/` (with
      `docs/` backward compat) |

      | Initial platforms | **Claude Code + Codex** |


      ### Field Split


      **Portable (meta.yaml → rendered frontmatter):** name, description, license, compatibility,
      allowed_tools, metadata


      **Kspec-only (meta.yaml, NOT rendered):** _ulid, origin, version, platforms, depends_on, tags


      **Platform-specific (meta.yaml `platform_config.<platform>` → rendered per-platform):**

      - Claude Code: disable_model_invocation, user_invocable, context, agent, model, argument_hint

      - Codex: allow_implicit_invocation, display_name, short_description (rendered to
      `agents/openai.yaml` sidecar, NOT frontmatter)


      **Import command:** `kspec plan import ./plan.md --module @meta`


      **Note:** All `parent:` refs point to specs under `@meta` module (modules/meta.yaml). The
      trait goes at root level.


      ## Specs


      ```yaml

