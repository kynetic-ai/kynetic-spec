      ## Implementation Notes


      **Ordering matters.** The spec task must go first because the other tasks change behavior that
      the current ACs describe. The verdict and check tasks are independent of each other. The
      shared disposition task depends on the verdict task because it touches the same file. The
      skill docs task depends on the check task to avoid documenting flags that still exist. The
      data remediation runs last after both CLI commands are fixed.


      **parseVersionFromOptions** will have zero callers after the verdict and check tasks.
      Verified: `review refresh` has its own `--head`/`--base` flags with different semantics and
      does not use `parseVersionFromOptions`. Delete it unconditionally in the check task (last to
      remove a caller).


      **Test impact.** Any test that calls `kspec review verdict` or `kspec review check` with
      `--version-base`/`--version-head` will break. These tests should be updated to not pass
      version flags and instead verify the auto-derived version matches the review subject.


      **No schema changes.** The ReviewVerdict and ReviewCheck types still have `applies_to_version`
      — the field isn't removed, just auto-populated. The ReviewSubjectVersion union type is
      unchanged.


      **Gate state semantic change.** Replacing the local `computeGateState` with the shared
      `evaluateGates` changes behavior for reviews with zero required checks: gate_state goes from
      `"pending"` to `"passing"`. This is intentional — vacuous truth (no gates to fail = passing)
      is the correct semantics and matches the daemon. Tests asserting `"pending"` for check-less
      reviews should be updated.
