conventions:
  - _ulid: 01KF782ZSJCXRCGV0QJ8Y9AKN2
    domain: commits
    examples:
      - bad: Added login
        good: "feat: add user login flow"
      - bad: fixed bug
        good: "fix(auth): handle expired tokens"
    rules:
      - Use conventional commit format (feat, fix, docs, refactor, test, chore)
      - Reference task in commit body when applicable
      - Keep subject line under 72 characters
      - Include Co-Authored-By for AI contributions
  - _ulid: 01KF782ZSJ20FHWEXH93VB74Q5
    domain: notes
    examples:
      - bad: Done
        good: Implemented retry logic with exponential backoff. Chose 3 retries max based on API rate
          limits.
    rules:
      - Add notes when completing significant work
      - Include what was done, approach taken, and why
      - Note any deviations from plan or unexpected findings
      - Keep notes concise but informative for future context
      - Before resubmitting after a fix cycle, add a note summarizing what changed and why — this
        becomes a key activity timeline entry for reviewers
  - _ulid: 01KF782ZSJZB6HWGFS01TM2R0R
    domain: naming
    examples: []
    rules:
      - Use kebab-case for slugs (task-user-login, not taskUserLogin)
      - Prefix task slugs with 'task-' for clarity
      - Use descriptive names that indicate purpose
      - Keep slugs short but unambiguous
  - _ulid: 01KF782ZSJ6HS09DBK7SVX5RR0
    domain: tags
    examples: []
    rules:
      - Use lowercase tags
      - Standard tags include mvp, post-mvp, bug, feature, infra, design
      - Add domain tags like cli, schema, parser, tasks
      - Limit to 3-5 tags per item for focus
  - _ulid: 01KF8BNJPQS0TKAGRD9PPGW6CS
    domain: branching
    examples: []
    rules:
      - Use descriptive branch names that indicate the type and scope of work
      - "Use prefixes: feat/ for features, fix/ for bug fixes, refactor/ for refactoring, docs/ for
        documentation"
      - Keep branch names short but meaningful (e.g., feat/user-auth, fix/login-crash)
      - Use kebab-case for branch names
      - Before committing, verify current branch with git branch --show-current; never commit
        directly to main.
      - For task work (manual or automated), prefer kspec task branch @ref to create or resume the
        deterministic dispatch-compatible branch (dispatch/task/<slug>/<short-id>). This preserves
        dispatch reviewer and fix-cycle continuity.
      - The dispatch/task/ branch namespace is reserved for task-scoped branches. Do not manually
        create branches under dispatch/task/ — use kspec task branch to ensure the deterministic
        naming contract.
  - _ulid: 01KF8BNQXGBBFYRDJKYQHAEDCC
    domain: documentation
    examples: []
    rules:
      - Write clear, concise documentation that explains why, not just what
      - Include examples for non-trivial concepts
      - Keep documentation close to code (inline comments for complex logic, README for overview)
      - Update documentation when behavior changes
  - _ulid: 01KHYXJKYD2HREAGMY9XB9XEEG
    domain: testing
    examples: []
    rules:
      - ULIDs use Crockford base32 (excludes I, L, O, U) — invalid ULIDs cause SILENT test failures
      - Use testUlid() helper or kspec util ulid for valid test ULIDs
      - Never use JSON.stringify() for YAML — use template strings or yaml library stringify()
      - Playwright E2E tests excluded from vitest — run separately with npm run test:e2e
      - E2E fixtures are SEPARATE from unit test fixtures — never mix them
      - Use npm run test:shard1/shard2/shard3 for faster local dev runs (~50s vs ~150s). Full suite
        still required before PR.
      - testUlid(prefix) is deterministic unless you pass a sequence; use testUlids() or explicit
        sequences when tests need distinct IDs.
      - In tests that run git commit in temp repos, set git config user.name and git config
        user.email after git init.
      - Always use npm test (or npm run test:shard1/2/3 for faster dev runs) to run tests. Never
        invoke vitest or npx vitest directly — the test runner script (scripts/test.cjs) performs
        environment readiness checks before executing.
  - _ulid: 01KHYXJVNDVVFF6PR7K4X6545H
    domain: development
    examples: []
    rules:
      - Use node scripts/bootstrap.cjs for first-time setup or any session
      - Use kspec for all commands; only use npm run dev -- when testing uncommitted code changes
      - "Daemon default port 3456, health check: GET /api/health"
      - E2E tests manage their own daemon — do NOT start one manually
      - Web UI dev server on port 5173, connects to daemon on 3456
      - Regenerate kspec-agents.md (kspec agents generate) after changing conventions, workflows,
        skills, or agent template files (templates/agents-sections/)
      - For shadow branch issues, run kspec shadow status/repair/sync from project root; do not run
        manual git worktree commands inside .kspec/.
      - When command payloads include $, <, >, or multi-line text, use file-based payloads or quoted
        heredocs to avoid shell interpolation.
      - When running under dispatch (KSPEC_SESSION_ID is set), NEVER run kspec serve stop, kspec
        serve restart, or kspec serve start. The daemon is the host process — killing it kills the
        dispatch engine and the agent.
      - In web UI code, use goto() from $app/navigation for all URL query parameter changes. Never
        use replaceState, pushState, or window.history methods — they do not update $page.url and
        break reactive effects. See /svelte-5 skill for details.
      - After modifying skill sources (templates/skills/ or .kspec/skills/), run kspec skill render
        and commit the regenerated .agents/skills/ output alongside your changes.
      - API list endpoints must use pagination; clients must not fetch unbounded entity lists for
        derived data. Use server-resolved fields or the ref index for title resolution. Use
        server-side aggregation for computed statistics.
  - _ulid: 01KHYXJYDW2FWSYRVDR9J5A6XM
    domain: ci
    examples: []
    rules:
      - File watcher tests skip in CI — GitHub Actions does not support recursive fs.watch
      - E2E port hardcoded at 3456 — tests cannot run in parallel on same machine
      - GitHub Pages needs BASE_PATH=/kynetic-spec for local static builds; CI handles automatically
  - _ulid: 01KJ9BCWSFHEJFHW7024Y4K68Y
    domain: cli-lookups
    examples: []
    rules:
      - Use kspec CLI commands (item get, task get, search, trait list) instead of manually
        searching .kspec/ YAML files
      - When item get shows 'Inherited from @trait-slug', run kspec item get @trait-slug to resolve
        — do NOT grep YAML files
      - Use kspec search for keyword lookups instead of piping kspec item list through grep
      - Key skills include CLI Lookups tables — check those first for the right command to use
