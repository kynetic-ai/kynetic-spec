title: Auto-namespace plan slugs to prevent collision with spec slugs
type: task
description: "Plan import slug namespacing: kspec plan import auto-assigns slug from plan title,
  which can collide with spec slugs created by the same import (e.g. plan 'Gallery Home' gets slug
  'gallery-home', colliding with spec slug 'gallery-home'). Plans should auto-namespace their slug
  (e.g. 'plan-gallery-home') or detect collision and prompt for resolution. Related to 01KGGPSR but
  that covers item-to-item collision, not plan-to-item."
