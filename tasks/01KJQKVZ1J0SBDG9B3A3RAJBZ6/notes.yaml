  - _ulid: 01KJQKWACN8XCKZ71WZZK413M8
    content: >-
      Root cause: src/cli/batch-exec.ts:644 does fs.cp(realSpecDir, tempDir, { recursive: true })
      with no exclusions. This copies .kspec/sessions/ (including all blobs/) into /tmp. Sessions
      blobs are LLM response text stored per-event — a long ralph loop session can have thousands of
      15MB blob files. The 25G temp dir had one session with 6360 blobs at ~3.9MB avg.


      Two places need to exclude sessions/:

      1. Initial copy (line 644): add filter option to fs.cp to skip sessions/

      2. Copy-back clear (lines 690-703): skip sessions/ when clearing realSpecDir and when copying
      back from temp — sessions written during batch should not be overwritten.


      Batch operations never read or write session data, so sessions/ is completely irrelevant to
      the atomic copy. Same logic likely applies to skills/rendered output.


      The recursive grep explosion compound issue: when kspec search commands run inside the batch
      temp dir, they scan blob files, producing large output stored as new blobs, which grow
      exponentially in subsequent searches.
    supersedes: null
    author: "@claude"
    created_at: 2026-03-02T15:50:12.629Z
