title: Round-trip stability for plan record YAML writes
type: task
description: >-
  plans.ts savePlan, mutatePlanAtomically, and deletePlan all load project.plans.yaml through
  PlansFileSchema.safeParse() before writing back. This adds ~7 Zod defaults (slugs, content,
  status, derived_tasks, derived_specs, notes, created_at) to every plan record on each save.


  Apply the same raw-data-preservation pattern: load the raw YAML array without schema
  normalization, only schema-parse the target plan, merge onto raw data to suppress defaults.
  Non-target plans stay as raw data.


  Verify with tests: write a plans file, load and save one plan without changes, confirm file is
  byte-identical.
