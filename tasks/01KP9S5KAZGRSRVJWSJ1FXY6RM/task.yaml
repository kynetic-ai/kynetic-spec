title: Fix session store EACCES in cli-agent-commands tests
type: bug
description: "npm test currently fails in tests/cli-agent-commands.test.ts on both head 35e8acf2da1b
  and base 0501051eb49ee8db8faccedc035f1cb95cef85fc. The same 5 cases fail with EACCES: permission
  denied, mkdir '/tmp/.kspec-sessions/<session-id>' from src/sessions/store.ts:173. Reproduced with
  full suite and with filtered run 'npm test -- tests/cli-agent-commands.test.ts' on the base
  commit. Fix should make session directory resolution writable in test environments without
  regressing production session storage behavior, and add focused coverage for the one-shot agent
  and interactive/json command paths that currently fail."
