    content: "Registry persistence implemented on shadow branch with lifecycle/health reconciliation.
      Fixed dispatch timing regressions by starting invocations before registry activation
      completes, moving terminal event publication after cleanup, and tying started events to actual
      agent activity. Targeted tests green: dispatch-workspace-registry, dispatch-workspace-config,
      canonical-task-workspace-contract, agent-dispatch-engine, cli-serve."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-12T05:53:09.031Z
  - _ulid: 01KKGAR8RPS723ZCQYKQWYWMBA
    content: "[FIX_CYCLE: 1] Review findings: MUST-FIX review blockers from PR #800: started/completed
      event ordering regression, restart reconciliation does not derive cleanup/integration from
      current task state, registry parse failures can silently drop persisted workspace records, and
      AC-6 lifecycle coverage is incomplete."
    supersedes: null
