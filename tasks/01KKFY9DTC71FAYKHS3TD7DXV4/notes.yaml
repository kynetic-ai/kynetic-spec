    content: >-
      Execution context:

      - Background: persist canonical dispatch workspace identity across daemon restarts so
      worker/reviewer/fix-cycle flows reuse the same recorded branch/worktree state.

      - Scope: add first-party workspace registry storage, reload/reconciliation on startup, and
      tests covering lifecycle/health transitions for the registry contract.

      - Files: dispatch runtime/session state, parser/schema storage for registry records, and
      focused tests around dispatch workspace behavior.

      - Verification: targeted dispatch/unit tests, full npm test, and kspec validate before submit.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-12T05:26:11.774Z
  - _ulid: 01KKG932P9RC99WNFRHXKVJ3N7
    content: Implemented a first-party dispatch workspace registry in project.dispatch-workspaces.yaml
      and switched workspace persistence/reconciliation to use it. Dispatch startup now reloads and
      reconciles workspace records from the registry, invocation lifecycle updates persist
      active/integrating/closing states, and focused registry/config/canonical workspace tests are
      green.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-12T05:42:40.586Z
