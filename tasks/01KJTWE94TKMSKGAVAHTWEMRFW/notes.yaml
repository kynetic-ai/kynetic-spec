    content: >-
      Execution context:

      - Background: concurrent task mutations from parallel agent tool calls can lose updates and
      revert status.

      - Scope: serialize runtime task mutation writes so state transitions/notes are not clobbered.

      - Files: agent runtime/mutation code and corresponding tests.

      - Verification: targeted tests + full npm test + kspec validate.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-03T22:49:53.969Z
