  - _ulid: 01KJTYV1DY468DSKTXGRR1FQJ7
    content: >-
      Implemented atomic same-task mutation path:

      - Added parser helper mutateTaskAtomically() to run read-modify-write under one lock against
      latest on-disk task state.

      - Switched kspec task start and kspec task note to use atomic helper so concurrent status/note
      writes do not clobber each other.

      - Added regression tests in tests/task-mutation-serialization.test.ts for concurrent
      status+note and note+note mutations.

      Verification:

      - npx vitest run tests/task-mutation-serialization.test.ts
      tests/agent-invocation-lifecycle.test.ts

      - npx vitest run tests/task-budget-enforcement.test.ts
      tests/session-scoped-task-claiming.test.ts tests/note-supersession-filter.test.ts
      tests/task-needs-work.test.ts

      - npm test (3580 passed, 3 skipped)

      - kspec validate currently fails due pre-existing repo validation issues unrelated to this
      task (existing skill/ref/alignment warnings/errors).
