title: Prevent lost task state from concurrent task mutations in agent invocations
type: bug
description: "Session 01KJTV0B showed concurrent kspec subprocesses mutating the same task (task
  start + task note) can cause a lost update: note persists but status reverts to pending. Ensure
  agent/runtime mutation paths serialize per-task writes (or use optimistic concurrency with retry)
  so state transitions and notes cannot overwrite each other under parallel tool calls."
