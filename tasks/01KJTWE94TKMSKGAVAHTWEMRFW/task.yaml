closed_reason: "Merged in PR #649. Added mutateTaskAtomically and switched task start/note to
  latest-state atomic writes to prevent concurrent status/note lost updates; added regression tests
  for concurrent mutation races. AC coverage for @agent-invocation-lifecycle remains covered (with
  new ac-5 concurrency regression)."
