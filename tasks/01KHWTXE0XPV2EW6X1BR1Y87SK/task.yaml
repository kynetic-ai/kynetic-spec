description: >-
  Agents consistently skip trait ACs during implementation and review — 9% trait AC coverage in the
  config/doctor feature set vs 94% own-AC coverage.


  Review and update these skills to explicitly require trait AC coverage:


  1. task-work skill (.claude/skills/task-work.md): When implementing, the agent should check
  inherited trait ACs and write tests for them. Add explicit step or checklist item.


  2. pr-review skill (.claude/skills/pr-review/SKILL.md): The AC coverage check should explicitly
  call out trait ACs as requiring coverage, not just spec-specific ACs. The review agent should flag
  uncovered trait ACs as MUST-FIX.


  3. local-review workflow (@local-review): The AC coverage step should enumerate trait ACs
  separately and flag gaps.


  The goal is making trait ACs impossible to silently skip during the normal task-work and review
  flow.
