notes:
  - _ulid: 01KGFK9QXVZ907BEF0KGBR6HRF
    content: >-
      Bug analysis:


      The ralph loop gathers session context at iteration start, then processes pending_review tasks
      (which may complete blocking tasks), but then checks for ready tasks using the STALE context.


      Flow:

      1. gatherSessionContext() - blocking tasks are in pending_review, dependent tasks show as
      blocked

      2. processPendingReviewTasks() - subagents complete the blocking tasks  

      3. Check sessionCtx.ready_tasks - STALE! Still shows empty because context was gathered before
      completions


      Result: Loop exits with 'No automation-eligible tasks' even though tasks just became
      unblocked.


      Fix: Re-gather context (or re-check ready tasks) AFTER processPendingReviewTasks completes,
      before the early exit check at lines 1108-1116.


      Relevant code: src/cli/commands/ralph.ts lines 1080-1116
    supersedes: null
    author: "@claude"
    created_at: 2026-02-02T16:34:44.795Z
  - _ulid: 01KGFKBTNCDN0FJD6QVV0Q75D9
    content: >-
      Spec gap confirmed:


      AC-19 specifies WHAT to check (automation:eligible ready/in_progress tasks) but not WHEN
      relative to pending_review processing.


      AC-8 in @ralph-subagent-spawning specifies subagent spawning BEFORE main agent, but no AC
      specifies context refresh AFTER pending_review completes.


      Proposed AC for @cli-ralph:
        id: ac-context-refresh-after-pending-review
        given: processPendingReviewTasks completes during iteration
        when: checking for loop continuation
        then: uses freshly gathered task context (not stale from iteration start) to detect tasks that became ready due to dependency unblocking
    supersedes: null
    author: "@claude"
    created_at: 2026-02-02T16:35:53.132Z
  - _ulid: 01KGFKHNFK1FAE1Q9WFKQWMVSZ
    content: >-
      Fix implemented:


      Added context refresh after processPendingReviewTasks (AC-20). When pending_review tasks exist
      and are processed, context is re-gathered to detect tasks that became ready due to dependency
      unblocking.


      Changes:

      - src/cli/commands/ralph.ts: After processPendingReviewTasks, check if pending_review_tasks
      existed. If so, re-gather context before the ready task check. Use refreshed context for
      prompt building.


      All existing tests pass. Build succeeds.
    supersedes: null
    author: "@claude"
    created_at: 2026-02-02T16:39:04.435Z
