notes:
  - _ulid: 01KR77B48VF2DAZM7JZH5MKK1N
    content: "Investigation. Original full-suite hang (180s timeout) on tests/daemon-build.test.ts could
      not be reproduced locally on a clean run (took 794ms in full suite). Root cause analysis: (1)
      Test calls plain fetch() against the just-spawned daemon with no AbortSignal; if a daemon is
      alive but stops responding mid-request, fetch hangs forever and only the outer 180s vitest
      timeout breaks it. (2) runCommand uses spawnSync with timeout 120s, but on timeout/non-zero
      exit the assertion only checks status — stdout/stderr are silently discarded, so the hang
      yields no diagnostics. (3) Whole describe wraps both runtimes in one big block with no
      per-step bound. Plan: bound each fetch with AbortSignal.timeout, surface build stdout/stderr
      on any non-success, and add per-step diagnostics so a hang fails fast with actionable output
      (which runtime, which fetch, what the daemon stderr says). Tightens determinism without
      weakening fixture coverage — same ACs still verified, just bounded."
    supersedes: null
    author: "@claude"
    created_at: 2026-05-09T20:37:26.428Z
  - _ulid: 01KR782AWRT8MQ0B84MQTQ6A07
    content: "Implementation. tests/daemon-build.test.ts now bounds every HTTP probe with
      AbortSignal.timeout(5s) and dumps daemon stdout/stderr tails plus per-step labels (runtime,
      step, url) on any failure. The build subprocess fails fast with stdout/stderr-tail dumps on
      non-zero exit, signal-kill, or spawn error — previously expect(result.status).toBe(0)
      discarded all output so a wedged build produced no diagnostics. Unbounded fetches were the
      strongest hang candidate: with no AbortSignal, a daemon that bound but stopped responding
      mid-request would only break on the outer 180s vitest timeout. Verified: focused run passes
      2/2 in 862ms; full suite passes 8979 tests, daemon-build.test.ts ran in 791ms in heavy-serial
      pool. AC coverage unchanged — same fixture contract, runtime adapter, endpoint consistency,
      runtime selection, and mode boundary ACs remain annotated. No spec change needed: this is
      implementation hardening of an existing test, not new behavior."
    supersedes: null
    author: "@claude"
    created_at: 2026-05-09T20:50:06.872Z
