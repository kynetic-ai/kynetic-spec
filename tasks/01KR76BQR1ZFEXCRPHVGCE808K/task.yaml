title: Stabilize daemon build smoke timeout
type: bug
description: During review of @01KR6M77JA0S1EEVZX8KKRPY1V, the full review gate mise exec -- npm
  test -- --fresh timed out in tests/daemon-build.test.ts on the compiled daemon entrypoint smoke
  test after 180000ms. Immediate focused rerun with mise exec -- npm test -- --fresh
  tests/daemon-build.test.ts passed in 895ms, 2 of 2 tests. Classify this as flaky or pre-existing
  rather than introduced by the guardrail branch. Investigate why the build smoke can hang only in
  full-suite context, capture diagnostics from the daemon-build path, and make the test
  deterministic without weakening daemon fixture coverage.
