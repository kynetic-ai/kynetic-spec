    content: >-
      Fix cycle 2: Addressed both review blockers.


      1. JSON error handling (blocker): Replaced all bare console.error() calls after error() with
      the details parameter pattern — error(msg, {suggestion}). In JSON mode, guidance is now
      embedded in the structured error object instead of appended as plain text. Applied to all
      three error paths (no project found, no manifest, catch handler). Updated 2 existing tests to
      validate JSON error stream integrity and suggestion presence.


      2. Review-plan skill probe path (blocker): Corrected probe from
      .agents/skills/kspec-review-plan.md to .agents/skills/kspec-review-plan/SKILL.md matching the
      directory-based layout renderers actually produce. Added 1 new test verifying version
      inference with directory-based skill layout.


      Full test suite: 7939 passed, 5 skipped, 0 failures. Total 40 upgrade-command tests.
