  - _ulid: 01KKB3PHV7HT3R85BJ2WVXWS7G
    content: |
      Implementation notes:

      Use IntersectionObserver on a sentinel element at the bottom of the
      list. Track offset/limit/total in component state. Reset offset to 0
      when any filter changes. Append new pages to existing items array.
      WebSocket updates use the existing global subscription — no new
      connection management needed per-component.
    author: "@claude"
    created_at: 2026-03-10T05:32:15.079Z
  - _ulid: 01KKCRQY7TM5NS8SEXS8NRMH8C
    content: >-
      Implemented infinite scroll pagination on /sessions page. Key changes:

      1. Updated fetchSessions() in api.ts to accept offset/limit/trigger params, returning
      SessionListResponse with pagination fields.

      2. Rewrote sessions +page.svelte with IntersectionObserver on a sentinel element for automatic
      page loading.

      3. Server-side trigger filtering (delegates to daemon API instead of client-side filtering).

      4. WebSocket subscription on 'agents' topic to detect new sessions (agent_invocation with
      status=started).

      5. New sessions indicator button with refresh capability.

      6. Loading skeleton on initial load, spinner for subsequent page loads, end-of-list indicator.

      7. Updated E2E tests with pagination-aware mock route handler + new infinite scroll test
      cases.

      8. Fixed api-static.test.ts to match updated return shape.
    supersedes: null
    author: "@claude"
    created_at: 2026-03-10T20:59:15.066Z
