  - _ulid: 01KKD16VDRVYSW0GZE4Z4HZ004
    content: >-
      Fix cycle 2 addressed. Three issues resolved:

      1. Scroll container fix: The onscroll handler was on the page's root div, but the actual
      scroll container is the layout's <main class="overflow-auto">. Changed to find <main> via
      closest('main') at mount time and attach scroll listener via addEventListener. isAtTop now
      correctly reflects the user's actual scroll position.

      2. @ui-url-panel-state ac-4: Added proper N/A annotation in both the component (AC comment
      block) and E2E test file. Session filters use local component state (triggerFilter), not URL
      query parameters — goto() is not needed.

      3. cli-agent-commands.test.ts failures: Not reproducible — all 4 prompt_template tests pass on
      both main and the PR branch. Likely a stale build or flaky test environment in the reviewer's
      run.

      E2E test updates: Fixed scroll-down tests to target the correct scroll container
      (main.overflow-auto instead of parentElement of sessions-list).
    supersedes: null
    author: "@claude"
    created_at: 2026-03-10T23:27:12.313Z
