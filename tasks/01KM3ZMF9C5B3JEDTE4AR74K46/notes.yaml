notes:
  - _ulid: 01KM48R7NBFTMH7XV88X9XAFS6
    content: "Implementing shared-checkout drift repair by probing branch/index/worktree coherence in
      the integration-target mutation path. Plan: detect clean stale branch transitions by comparing
      the current index tree to recent reflog commits for the integration branch, auto-repair with a
      reset to current HEAD when the checkout is otherwise clean, and degrade with branch-specific
      guidance whenever repair would overwrite local tracked changes."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-20T00:01:33.868Z
  - _ulid: 01KM496TAY6HNEC9T78QPXD4TT
    content: Implemented shared-checkout drift detection in the integration-target mutation scope.
      Dispatch now inspects branch/index/worktree coherence before sync/push operations,
      auto-repairs clean stale branch transitions by resetting tracked state to the current
      integration-branch tip, and refuses destructive repair with branch-specific guidance when
      tracked local changes would be overwritten. Added regression coverage for clean drift repair
      during target sync and for degraded-state reporting when repair is unsafe. Full npm test
      passed; kspec validate still reports pre-existing unrelated reference/completeness issues in
      meta/spec coverage outside this task.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-20T00:09:31.742Z
