title: Migrate inbox and triage pages to TanStack Query
type: task
description: >-
  These pages share the same client-side join pattern (inbox + triage records) and should be
  migrated together using the merged endpoint.


  Pages: inbox/+page.svelte (use merged inbox endpoint, remove separate fetchTriageRecords call and
  O(n*m) client join, triage evidence_refs should use ref index for title resolution),
  triage/+page.svelte (same merged endpoint, card-by-card navigation stays as-is but data source
  changes).


  Both pages subscribe to inbox:updates and triage:updates — after migration, WS events invalidate
  the merged inbox query instead of triggering full reload.


  Acceptance gates (from @ui-data-freshness + @ui-api-aggregation): Inbox items include inline
  triage status, no client join (aggregation ac-3), WS events invalidate not full re-fetch
  (freshness ac-3).
