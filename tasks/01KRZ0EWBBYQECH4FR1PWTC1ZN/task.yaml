  task snapshot (full npm test and targeted npm test -- --run tests/cli-no-daemon.test.ts) and
  reproduced on integration-base commit f688b032ae42 with the same targeted command, so this is
  pre-existing/flaky rather than introduced by the reviewed branch. Investigate why the Bun-launched
  CLI writes a daemon PID that exits before ps observation, then update the test or daemon startup
  behavior so the runtime assertion is deterministic without relying on a process that may have
  already exited.'
