description: >-
  Auto-install default workflows during kspec setup / kspec init --setup.


  Current behavior: Core skills reference workflows (session-reflect, session-reflect-loop,
  task-work-session, local-review, etc.) but these workflows are not installed by default. Running
  kspec workflow start @session-reflect fails on a fresh project.


  Fix: Bundle default workflow definitions in templates/workflows/ (or similar). During setup,
  install them the same way core skills are installed via install-core. Add idempotent check to skip
  already-installed workflows. Update tests in tests/enhanced-setup.test.ts.
