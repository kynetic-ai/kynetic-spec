title: Shadow worktree cross-contamination guard
type: bug
description: >-
  Ensure kspec commands that create or repair the shadow worktree cannot mutate shadow state
  belonging to any other working tree of the same git repository, regardless of which working tree
  they are invoked from. When a user invokes a shadow-lifecycle command from a linked git worktree,
  the command must not touch the main working tree's shadow worktree and must tell the user where to
  run it instead.


  Closes 10 new ACs on @worktree-support: ac-init-linked-wt-unchanged, ac-init-main-wt-unchanged,
  ac-init-guidance-direction, ac-init-guidance-path, ac-setup-linked-wt-unchanged,
  ac-setup-main-wt-unchanged, ac-setup-guidance-direction, ac-setup-guidance-path,
  ac-shadow-ops-scoped-to-main, ac-shadow-ops-concurrent-safety.
