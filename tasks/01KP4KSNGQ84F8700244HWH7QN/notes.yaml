  - _ulid: 01KP4KSP6R7ZHWN91D86AVJ5E1
    content: >-
      WHY — incident context.


      On 2026-04-11 around 03:38 local time, two concurrent npm test runs inside dispatch-managed
      linked worktrees reached a shadow-lifecycle code path with the cwd set to the linked worktree.
      The operation succeeded — but succeeded against the main working tree's shadow worktree, not
      the linked one. The spec data on the kspec-meta branch was preserved (tip 4c9c302e6 intact),
      but the main repo's .kspec/ working tree and its worktree admin entry were destroyed. The
      failure was silent: the destructive command returned exit code zero with no output, and only
      surfaced later as every subsequent kspec CLI invocation breaking until manual recovery.


      The incident is reproducible from a clean repo using only native git commands — it does not
      require kspec to trigger. The underlying git behavior (a bare relative worktree name resolving
      across the shared worktree admin of all linked worktrees of the same repo via
      find_worktree_by_suffix in git's worktree.c) is documented and stable; kspec's guarantee must
      be built on top of it. The guarantee is product-level: kspec is the primary interface to spec
      data for every user of the project, and a silent path where concurrent automation destroys a
      user's spec state is a data-integrity regression.


      Recovery is straightforward once the user knows what happened — the shadow branch preserves
      all data and kspec shadow repair from the main repo rebuilds the worktree — but 'knows what
      happened' is a high bar for a silent failure. The fix needs to make the failure either
      impossible or loud.


      The secondary lesson is that the project's test helpers have a latent amplifier: a
      subprocess-spawning helper that silently inherits the vitest worker's cwd when a caller
      forgets to pass one, which is how an unrelated test reached the buggy code path without anyone
      writing a line of code targeting the shadow worktree. Enforcing explicit cwd at the test
      helper layer removes the amplifier and makes any future variant of the same class of bug fail
      loudly at its origin rather than silently in a shared directory.
    supersedes: null
    author: "@claude"
    created_at: 2026-04-13T23:45:59.512Z
  - _ulid: 01KP4KSPW2GFE2TXAYVW5QCYQJ
    content: >-
      HOW part 1 of 3 — code changes.


      Implementation details are owned by the task worker. The following are the known constraints
      and starting points; the worker is free to propose a different implementation if it closes the
      ACs more cleanly.


      1. Shadow-lifecycle operations must identify their target by absolute path. In
      src/parser/shadow.ts, each call to git worktree add or git worktree remove for the shadow
      directory currently passes the bare relative directory name (lines 2777, 2787, 2811, 2818,
      2958, 2978). Replace with the absolute path already computed at or near the top of each
      function (worktreeDir exists in repairShadow at line 2952; an equivalent should be computed
      once in initializeShadow). Audit createOrphanBranchFallback specifically to confirm it passes
      an absolute worktreeDir, not directoryName, to every git worktree invocation it makes. This
      single-mechanism change closes the cross-worktree vector for any correctly-routed caller.


      2. Add an entry guard to initializeShadow and repairShadow as defense-in-depth, not as the
      primary fix. At the top of each function, call a new helper assertMainWorkingTree(projectRoot)
      that uses a single git rev-parse --show-toplevel --git-common-dir invocation to detect whether
      projectRoot is a linked worktree. On detection, throw a ShadowError with an instructional
      message naming the main working tree's path (derived from the parent of the git common
      directory). No bypass flag. Framing: after step 3 lands, the common-path callers always pass
      mainRoot and the guard never fires — the guard exists to catch any future caller (or
      regression) that forgets to resolve, so that the destructive path cannot reopen.


      3. Correct kspec init's project root resolution. src/cli/commands/init.ts:155 currently calls
      getGitRoot(targetDir) directly, which returns the linked worktree root when invoked from a
      linked worktree. Replace with the same pattern src/cli/commands/shadow.ts:28 uses:
      resolveProjectRoots(targetDir)?.mainRoot ?? getGitRoot(targetDir). Then add explicit detection
      of the linked-worktree case before calling initializeShadow, and hard-error with instructional
      message naming the main working tree path. Hard error (non-zero exit) is the chosen
      implementation per the task's lean-toward-option-(b) direction.


      4. Audit kspec setup and other lifecycle entry points. Verify src/cli/commands/setup.ts:600
      and :617 pass projectRoot resolved via the worktree-aware path. Also audit
      src/cli/commands/shadow.ts end-to-end even though it already uses resolveCliProjectRoot().
      Apply the same hard-error pattern to any setup path that would invoke a lifecycle op from a
      linked worktree.


      5. Grep for every caller of initializeShadow( and repairShadow( in src/ — explicitly including
      src/cli/commands/init.ts, src/cli/commands/setup.ts, src/cli/commands/shadow.ts,
      src/parser/index.ts, and any daemon-side caller. Document the audit in a task note with
      per-caller verdict: resolves to main / resolves to linked and needs fix / N/A.
    supersedes: null
    author: "@claude"
