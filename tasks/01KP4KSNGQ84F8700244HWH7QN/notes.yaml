  - _ulid: 01KP4KST8AVP13B8K7ZRQ31P5M
    content: >-
      REPRODUCER (for worker reference).


      Minimal standalone repro in /tmp — does not involve kspec code at all, confirms the underlying
      git behavior the fix must guard against:

        cd /tmp && rm -rf gw-test && mkdir gw-test && cd gw-test
        git init -q
        git config user.email t@t.com && git config user.name t
        echo hi > x && git add x && git commit -qm init
        git checkout -q --orphan meta
        git rm -qrf . 2>/dev/null
        git commit -q --allow-empty -m meta
        git checkout -q main
        git worktree add .kspec meta -q
        git worktree add ./sub HEAD~0 -q
        cd sub
        git worktree remove .kspec --force    # exit 0, removes /tmp/gw-test/.kspec
        cd ..
        git worktree list                      # .kspec is gone

      The pre-fix kspec code hits the same pattern when initializeShadow/repairShadow is called from
      a cwd inside a linked worktree: it runs git worktree remove directoryName --force where
      directoryName is the bare string '.kspec'. Git's find_worktree_by_suffix matches the suffix
      across the shared worktree admin and finds the main working tree's shadow worktree.


      Post-fix, the same repro must leave the main .kspec/ intact — the test in
      tests/shadow-cross-worktree-isolation.test.ts should reproduce this scenario programmatically.
    supersedes: null
