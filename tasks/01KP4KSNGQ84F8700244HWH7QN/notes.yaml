  - _ulid: 01KP4KSRW3T201F9A25ZGQ1YR2
    content: >-
      NOT IN SCOPE.


      - Changing the shadow branch name, layout, or storage format.

      - Changing how the dispatch engine creates or manages its own worktrees — dispatch worktree
      lifecycle is owned by @dispatch-invocation-worktree-isolation and is unchanged by this task.

      - Adding mutation-lock coverage for shadow lifecycle operations.
      @scoped-dispatch-shadow-serialization already defines serialization for metadata mutations;
      this task is orthogonal and does not need new locks.

      - Broader refactoring of tests/helpers/cli.ts beyond the single required-cwd enforcement.

      - Retroactive forensics on the 2026-04-11 dispatch sessions — root cause is already proven and
      reproduced.

      - A dependency on @complete-auto-gitignore or its task — unrelated.

      - Feature-flagging the guard or adding a bypass environment variable. Any legitimate use case
      is better served by running from the main working tree.
    supersedes: null
