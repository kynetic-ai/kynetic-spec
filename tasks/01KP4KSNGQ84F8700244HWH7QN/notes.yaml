  - _ulid: 01KP4KSQHJYE75AJ41G51EV4HT
    content: >-
      HOW part 2 of 3 — test helper and convention rule.


      6. Test helper cwd enforcement. Change tests/helpers/cli.ts:111 so kspec() requires cwd:
      string. Delete the cwd ?? process.cwd() fallback at line 167. Run tsc --noEmit to find every
      caller that compile-fails; fix each by passing the correct per-test temp dir. Known offender:
      tests/clone-for-testing.test.ts:99 via import { kspecOutput as kspec } from ...


      7. Add the convention rule to the testing domain via:

         kspec meta set testing --add-rule "Test helpers that drive kspec CLI subprocesses must require an explicit cwd parameter. Never fall back to process.cwd() — a missing cwd is a test bug, not a default. A silent fallback caused a shadow worktree destruction incident on 2026-04-11."

      After adding the rule, run kspec agents generate to refresh kspec-agents.md and commit the
      regenerated file alongside the source changes.
