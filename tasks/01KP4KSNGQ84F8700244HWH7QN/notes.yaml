  - _ulid: 01KP4KSSHN2X8VKAZZCY8X8ASV
    content: >-
      SUCCESS CRITERIA.


      1. All six new regression tests pass after the fix and fail against the unfixed baseline
      (confirming they catch the bug — run in both directions as part of the fix verification).

      2. Full test suite passes including the pre-existing shadow/worktree/dispatch tests.

      3. Manual verification from a linked worktree: kspec init, kspec setup, and kspec shadow
      repair. First two hard-error and emit instructional output including the main working tree
      path. Third succeeds against main.

      4. Reproducing the /tmp/gw-test suffix-match scenario against a kspec-fixed build leaves the
      main shadow worktree intact.

      5. tsc --noEmit passes with the required-cwd signature on tests/helpers/cli.ts.

      6. The new convention rule appears in kspec-agents.md after kspec agents generate.

      7. Dispatch smoke test confirms read-side shadow commands (status, log, resolve, sync) still
      work from linked worktrees.

      8. Task note at completion includes: (a) the file/line changes made, (b) the list of ACs
      closed per test, (c) the before/after output of the /tmp/gw-test suffix-match repro, (d) the
      convention rule ID that was added, (e) the dispatch smoke-test verification result, (f) the
      grep audit from HOW step 5 with per-caller verdicts.
