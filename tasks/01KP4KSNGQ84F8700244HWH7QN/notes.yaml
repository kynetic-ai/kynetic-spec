  - _ulid: 01KP4KSR79N8K7ZHNW8YZ4ZDTS
    content: >-
      HOW part 3 of 3 — regression tests.


      All tests must use isolated temp dirs created via createTempDir() from tests/helpers/cli.ts
      and register cleanup via onTestFinished. None may touch the real project's .kspec/ or any path
      outside their own temp tree. Every test must include an // AC: @worktree-support ac-<id>
      annotation immediately above the test block for each AC it covers.


      Shared baseline fixture — 'main unchanged' assertion method. Before the operation under test,
      capture: (1) git worktree list --porcelain full output, (2) the SHA of the shadow branch tip
      via git rev-parse kspec-meta, (3) the target of readlink .kspec/.git (or fs.readFile on the
      .git file), (4) the mtime and inode of the .kspec/ directory. After the operation, re-capture
      all four and assert byte-equal on the first two and identity on the last two. This catches
      silent gitdir pointer mutations, worktree admin entry changes, and directory re-creation that
      a naive 'does .kspec/ exist' check would miss.


      Test files to add:


      a. tests/shadow-cross-worktree-isolation.test.ts — Low-level test calling initializeShadow() /
      repairShadow() directly with a linked worktree path as projectRoot. Asserts the guard throws
      with a message naming the main path. Closes ac-shadow-ops-scoped-to-main.


      b. tests/init-from-linked-worktree-existing-shadow.test.ts — Main has a healthy shadow. Linked
      worktree invokes kspec init. Assert baseline comparison on main (unchanged), linked worktree
      has no .kspec/ created, stdout/stderr contains the main working tree path, exit code is
      non-zero. Closes ac-init-linked-wt-unchanged, ac-init-main-wt-unchanged,
      ac-init-guidance-direction, ac-init-guidance-path.


      c. tests/init-from-linked-worktree-empty-main.test.ts — Main has NO shadow. Linked worktree
      invokes kspec init. Assert main still has no .kspec/, linked worktree has no .kspec/,
      stdout/stderr contains the main working tree path, exit code is non-zero. Closes the same four
      init ACs for the empty-main edge case.


      d. tests/setup-from-linked-worktree.test.ts — Analogous to (b) for kspec setup. Closes all
      four setup ACs.


      e. tests/repair-from-linked-worktree-broken-main.test.ts — Main's shadow is broken (worktree
      dir exists but .git pointer is invalid). Linked worktree invokes kspec shadow repair. Assert
      main's shadow is recovered (the command proceeds via resolveCliProjectRoot → mainRoot), linked
      worktree has no .kspec/ created, command exits successfully. Verifies ac-shadow-commands still
      holds and that the new guard does not over-fire on legitimate shadow ops. Closes
      ac-shadow-ops-scoped-to-main for the repair flow.


      f. tests/shadow-lifecycle-concurrent.test.ts — Spawn two kspec subprocesses concurrently: one
      from main running kspec shadow repair, one from a linked worktree running the same. Await
      both. Assert main's shadow is in a consistent state (kspec shadow status succeeds) and the
      linked-worktree invocation was refused cleanly (per the option (b) lean) while the main
      invocation ran to completion without damage. Closes ac-shadow-ops-concurrent-safety.


      8. Dispatch worker smoke test. After the guard lands, run a minimal dispatch invocation (a
      dry-run or a short task) to verify kspec shadow status, kspec shadow log, kspec shadow
      resolve, and kspec shadow sync all still function from within a dispatch-managed linked
      worktree — these commands should NOT go through initializeShadow/repairShadow and the guard
      should not fire. Document the verification in the task note. Per ac-dispatch-cwd, dispatch
      agents legitimately run from linked worktrees and must remain able to read shadow state.
