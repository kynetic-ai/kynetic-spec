    content: >-
      Created Plan and PlansFile schemas following task.ts patterns. Implemented:


      - PlanStatusSchema: draft, approved, active, completed, rejected (AC ac-3, ac-4)

      - PlanSchema: ULID, slugs, title, content (markdown), status, derived_tasks/specs arrays,
      source_path, timestamps (created_at, approved_at, completed_at), notes array

      - PlanInputSchema: for plan creation with optional fields

      - PlansFileSchema: collection schema (kynetic_plans version + plans array)


      Added 11 comprehensive tests covering all ACs:

      - Status validation 

      - Full plan structure (ac-1, ac-8)

      - Notes array (ac-9)

      - Approved_at timestamp (ac-3)

      - Input validation (ac-1, ac-2)

      - Plans file structure (ac-1)


      All 33 schema tests passing. Ready for parser implementation.
