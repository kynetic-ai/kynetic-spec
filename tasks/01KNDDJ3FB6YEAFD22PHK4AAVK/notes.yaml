    content: Implemented targeted task-domain cache patching for split-backend task.yaml and notes.yaml
      changes. The cache now updates only affected task summaries/details, removes deleted tasks
      without relying on index fallback, and falls back to full reload for monolithic task index
      changes. Verified with env -u NODE_ENV SKIP_BUILD=1 npm test -- daemon-entity-cache.test.ts
      and env -u NODE_ENV SKIP_BUILD=1 npm test.
