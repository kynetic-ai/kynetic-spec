  - _ulid: 01KNBPWR7XENTRYZZ3BV93CFZF
    content: "Fix cycle 1 complete: addressed the delayed-metadata race from review. SessionWatcher now
      keeps bounded per-session discovery retries after addDir so a session directory created before
      session.yaml still attaches once active metadata lands; retry state is cleared on
      attach/remove/stop to avoid timer leaks. Added a behavioral regression test covering directory
      creation followed by metadata arrival 500ms later. Verification: npm test --
      tests/session-watcher.test.ts tests/cli-serve.test.ts
      tests/daemon-api/websocket-protocol.test.ts passed (47 tests); kspec validate still returns
      only the repository's pre-existing warning debt."
