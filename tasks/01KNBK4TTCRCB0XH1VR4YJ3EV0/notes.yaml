notes:
  - _ulid: 01KNBNABT688VCQJ2FW4VWXHK3
    content: "Approach: refactor SessionWatcher into a depth-0 top-level watcher plus per-session
      watchers keyed by session root, reusing src/sessions/store.ts getSession() for status
      detection instead of adding a second YAML parser. Edge cases: sessionsDir missing at startup,
      addDir before session.yaml exists, daemon restart with pre-existing active sessions,
      active->terminal transitions needing one final callback plus watcher cleanup, and preserving
      retry/backoff for both top-level and per-session watcher failures. Test plan: behavioral
      coverage in tests/session-watcher.test.ts for startup active-only attachment, conditional
      watching of new sessions, unwatch on terminal status, blob/non-metadata ignores remaining
      intact, and FD usage staying tied to active session count rather than total sessions."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-04T07:11:33.702Z
  - _ulid: 01KNBP2D6XBMW2KJ3V3VC8HZVT
    content: "Implemented active-session-scoped session watching. SessionWatcher now keeps a depth-0
      top-level watcher on .kspec-sessions plus per-session watchers only for session.yaml files
      with status: active, retries addDir races where metadata arrives shortly after the directory,
      and tears down per-session watchers once status becomes non-active while still emitting one
      final invalidation callback. Updated tests/session-watcher.test.ts to use valid session
      metadata fixtures and cover startup active-only watching, conditional attach for new sessions,
      terminal unwatching, and FD usage staying tied to active sessions."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-04T07:24:41.565Z
  - _ulid: 01KNBP365B4J3321F1HE998GMT
