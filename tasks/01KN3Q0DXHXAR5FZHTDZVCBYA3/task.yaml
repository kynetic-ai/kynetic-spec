title: Fix workflows loading-state E2E failure blocking the full CI gate
type: bug
description: >-
  What: Fix the remaining workflows Playwright failure that still reproduces through all retries in
  the full E2E run. The currently failing test is tests/e2e/workflows.spec.ts: 'shows loading
  skeleton that transitions to content'.


  Why: Even a single persistent failure blocks promotion of the full E2E suite into CI. This
  workflows loading-state case guards the page's initial loading transition and needs to be green
  for the suite to be a trustworthy gate.


  How:

  1. Reproduce the failing case with a focused Playwright run against tests/e2e/workflows.spec.ts.

  2. Inspect trace and snapshots to determine whether the breakage is caused by the loading skeleton
  never appearing, disappearing too early, content failing to replace it, or the test waiting on the
  wrong signal.

  3. Compare current workflows page loading behavior with fixture timing and API responses.

  4. Fix the root cause in the page, data loading path, fixture timing, or the test expectation as
  appropriate.

  5. Re-run the focused workflows spec until the loading transition case passes consistently with
  retries enabled.


  Reviewer scope note: Reviewers should focus approval on the affected tests and the code needed to
  make those tests pass. Other known full-suite failures are intentionally split into sibling tasks
  and should not block approval for this task unless the changes here materially affect them.
  Sibling tasks covering the rest of the known failure set are: @task-fix-api-watcher-e2e-full-gate,
  @task-fix-observations-e2e-full-gate, @task-fix-review-detail-e2e-full-gate,
  @task-fix-review-interaction-e2e-full-gate, @task-fix-sessions-detail-filter-e2e-full-gate,
  @task-fix-sessions-live-update-e2e-full-gate, and @task-stabilize-full-gate-e2e-flakes.
