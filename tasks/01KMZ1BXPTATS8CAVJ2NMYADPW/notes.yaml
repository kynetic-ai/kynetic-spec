  - _ulid: 01KN2RG3CNFAZ7GZVX9R56W83V
    content: "Approach: validate current full Playwright suite viability before changing the gate, then
      update package.json and the CI workflow only if the full suite is green and runtime is
      acceptable. Edge cases: intentionally skipped specs, CI worker/retry behavior, and any
      Playwright job timeout drift. Test plan: run npm run test:e2e:full, run npx playwright test
      --workers=2 --retries=2 for CI-like timing, then run npm test and kspec validate after the
      workflow change."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-31T20:13:57.525Z
  - _ulid: 01KN2SD0DRQ4AFX5HHNBVKH1NC
    content: "Validation result: full Playwright gate is not ready. npm run test:e2e:full finished with
      450 passed, 22 failed, 38 skipped and also leaves the HTML report server running locally after
      completion. CI-like run npx playwright test --workers=2 --retries=2 took about 10m45s and
      still ended 449 passed, 19 failed, 4 flaky, 38 skipped. Persistent failures cluster in
      api-watcher, observations, review detail/interaction, sessions, and workflows; additional
      flake remains in navigation, plans, and session-context. Conclusion: do not switch CI off
      smoke lane yet."
    supersedes: null
