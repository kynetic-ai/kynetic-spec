    content: "Approach: validate current full Playwright suite viability before changing the gate, then
      update package.json and the CI workflow only if the full suite is green and runtime is
      acceptable. Edge cases: intentionally skipped specs, CI worker/retry behavior, and any
      Playwright job timeout drift. Test plan: run npm run test:e2e:full, run npx playwright test
      --workers=2 --retries=2 for CI-like timing, then run npm test and kspec validate after the
      workflow change."
