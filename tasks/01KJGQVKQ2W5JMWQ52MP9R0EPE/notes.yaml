    content: "Implementation: added same-version template drift detection to skill update by comparing
      template source tree to installed skill files. When drift is detected with matching version,
      update now reports explicit guidance to run kspec skill install-core (normal + dry-run + JSON
      reason/guidance fields). Added regression tests in tests/core-skill-update.test.ts for both
      normal and dry-run drift messaging. Verification: npm run build; npx vitest run
      tests/core-skill-update.test.ts tests/core-skill-install.test.ts; manual CLI scenario confirms
      guidance appears in both modes."
