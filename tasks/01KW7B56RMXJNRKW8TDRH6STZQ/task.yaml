  path were not changed by @01KW6Q03KGA93343F9SQJKSA0R, and the focused spec-detail test passed
  separately with npm run test:e2e -- tests/e2e/session-context.spec.ts -g 'spec detail lists
  related sessions'. Update the E2E assertion to match the accessible/user-visible status label or
  assert the status badge state directly, then run the affected Playwright file."
