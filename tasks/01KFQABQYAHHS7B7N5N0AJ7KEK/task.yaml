description: >-
  Implement ProjectContextManager for multi-project context caching.


  ## Implementation Notes

  - New class in packages/daemon/src/context-manager.ts

  - Define ProjectContext type: `{path: string, kspecContext: KspecContext, watcher: KspecWatcher,
  registeredAt: Date}`

  - Cache Map<normalizedPath, ProjectContext>

  - Thread-safe registration with Promise-based lock (prevent duplicate watchers on concurrent
  requests)

  - Stale detection: check if .kspec/ still exists before returning context


  ## Key Details

  - Use normalized paths as map keys (see ac-8 for normalization rules: resolve `.` segments, remove
  trailing slashes, do NOT resolve symlinks)

  - KspecWatcher takes kspecDir in constructor (see packages/daemon/src/watcher.ts line 43)

  - Each project needs its own watcher instance

  - On stale detection, remove from cache and close watcher


  ## AC Coverage

  ac-4, ac-14, ac-15, ac-16, ac-20


  ## Dependencies

  - Task: ProjectContextManager unit tests (tests first)

  - Task: Global PID/port file management
