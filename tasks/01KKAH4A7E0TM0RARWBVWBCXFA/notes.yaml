  - _ulid: 01KKAHDWR4BE8HGXPMP1SVY4G9
    content: Replaced 2 timeline tests that used 48 sequential CLI subprocess calls each (12 iterations
      × 4 task lifecycle calls) with direct YAML fixture seeding via seedCompletedTasks() helper.
      The helper reads existing project.tasks.yaml, appends completed task entries with staggered
      timestamps, and writes back. Tests no longer need the 30s timeout override. All 43 tests in
      the file pass.
    supersedes: null
