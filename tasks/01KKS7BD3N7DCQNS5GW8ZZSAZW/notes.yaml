      - Converted all 13 tests in session-start-inbox-triage.test.ts from CLI spawns to YAML seeding
      (~47 CLI spawns eliminated)

      - Converted 4 inbox/triage tests in session-start-computed-json.test.ts from CLI spawns to
      YAML seeding (~12 CLI spawns eliminated)

      - Preserved task CLI calls in computed-json tests (task_unlocks, recent_activity need real
      state transitions)

      - Removed 20s timeout overrides from inbox-triage tests (no longer needed)

      - Full test suite passes: 251 files, 5471 tests, 0 failures
