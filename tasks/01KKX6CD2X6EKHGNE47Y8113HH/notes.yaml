notes:
  - _ulid: 01KKYJZZBS89292SFWC57CNVDK
    content: "Applied raw-data-preservation pattern to dispatch workspace YAML writes. Key difference
      from task/inbox/review siblings: dispatch workspace records have deeply nested schema defaults
      (branch_provenance objects, roleStates, bootstrap.invalidationReasons, etc.) that required a
      recursive merge strategy. The mergeWorkspacePreservingRawShape function recursively descends
      into nested objects so that Zod defaults at any depth are suppressed for fields not in the
      original YAML. Also added read-only schema validation of existing registry content before
      writing to preserve the malformed-registry-rejection behavior. 5 new tests verify
      byte-identical round-trip stability, identity mutation stability, multi-workspace
      preservation, non-target pollution prevention, and multi-cycle stability."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-17T19:05:06.681Z
  - _ulid: 01KKYKZA1SKA5QY3WEP3MQX4JZ
    content: "[FIX_CYCLE: 1] Review verdict: changes_requested by pr-reviewer@kspec-dispatch"
