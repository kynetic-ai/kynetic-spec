  - _ulid: 01KKYKZYEQF24FEV74K315STE7
    content: "Review request_changes: The core dispatch workspace round-trip implementation is correct
      and well-tested (5 new tests, all passing). However, the commit includes out-of-scope changes:
      removal of 3 daemon API endpoints (verdict, check, lifecycle) from
      packages/daemon/src/routes/reviews.ts, deletion of tests/daemon-review-verdicts-api.test.ts
      (695 lines, 24 tests covering @review-records-daemon-api ac-6/7/8), and unexport of
      VALID_TRANSITIONS in review-operations.ts. These changes are unrelated to the task scope and
      reduce test coverage for spec-covered functionality. Fix: revert the daemon route changes and
      restore the deleted test file. The dispatch-workspaces.ts changes and
      yaml-round-trip-stability.test.ts additions are clean."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-17T19:22:34.327Z
  - _ulid: 01KKYNJ7EREXZ1P7X9G1RZNFD8
    content: "Fix cycle 1: The out-of-scope changes (daemon review API routes removal, deleted test
      file, unexported VALID_TRANSITIONS) were caused by the branch diverging from dev — the branch
      was created before those changes were merged to dev. Merged current dev into the branch to
      pick up the missing commits. The diff against dev now contains only the 2 in-scope files:
      src/parser/dispatch-workspaces.ts (round-trip stability changes) and
      tests/yaml-round-trip-stability.test.ts (5 new dispatch workspace tests). All 35 round-trip
      stability tests pass, all 31 daemon review verdict tests pass. One pre-existing failure in
      tests/review-cli.test.ts (examined_commit auto-populated when test expects null) is unrelated
      — file is untouched by this branch."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-17T19:50:01.945Z
  - _ulid: 01KKYQTG7XAZEK1T8ZWC4YETHB
    content: "[FIX_CYCLE: 2] Review findings: Review found two regressions in dispatch workspace YAML
      writes: mutateDispatchWorkspaceRecordAtomically no longer rejects malformed sibling records
      before rewriting the registry, and mergeWorkspacePreservingRawShape drops meaningful
      newly-added object fields like branch_provenance on legacy records. See review
      @01KKYQMEXCESSPYSD8FGZR1R65."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-17T20:29:30.237Z
  - _ulid: 01KKZ3P1C8B4PHPXCZJ16FR1A4
    content: "Fix cycle 2: Addressed both blocker threads from review @01KKYQMEXCESSPYSD8FGZR1R65. (1)
      Restored full registry schema validation in mutateDispatchWorkspaceRecordAtomically —
      malformed sibling records are now rejected before writing, matching the
      saveDispatchWorkspaceRecord behavior. (2) Fixed mergeWorkspacePreservingRawShape to
      distinguish Zod defaults from callback-set fields by passing the pre-mutation parsed record
      and using deep equality comparison — newly-added object fields like branch_provenance with
      real data are now persisted on legacy records. Added 2 regression tests covering both issues.
      All 7 dispatch workspace round-trip tests pass. 3 pre-existing failures unchanged (2 in
      agent-dispatch-engine.test.ts, 1 in review-cli.test.ts)."
