  - _ulid: 01KKZASNT6VGM94XFSHCWN417R
    content: >-
      Implemented all four review interaction controls for the detail page:


      1. **Add Comment (AC-3)**: 'Add Comment' button in threads section header opens a form with
      textarea for body and kind selector (blocker/question/nit). Uses createMutation with query
      invalidation on success. Form closes and resets after submission.


      2. **Reply (AC-4)**: Each thread (both unresolved and resolved) has a 'Reply' button that
      opens an inline reply form within the thread card. Reply textarea + submit/cancel buttons.
      Only one reply form open at a time.


      3. **Resolve/Reopen (AC-5)**: Blocker and question threads show a 'Resolve' button (when open)
      or 'Reopen' button (when resolved) in the thread header. Clicking immediately triggers the
      mutation and the thread moves between open/resolved sections after query invalidation.


      4. **Verdict Submission (AC-6)**: New 'Submit Verdict' section at the bottom of the page with
      decision selector (approve/request_changes/comment) and reviewer input field. Submission
      triggers query invalidation, updating disposition badge and verdicts list.


      All controls are gated by isInteractive (not archived, not static mode). Added 5 API mutation
      functions to api.ts. E2E tests cover all AC scenarios but cannot run in dispatch environment
      due to daemon guard (confirmed existing E2E tests have same limitation). Unit test suite
      passes (5811 pass, 1 pre-existing failure unrelated to this task).
