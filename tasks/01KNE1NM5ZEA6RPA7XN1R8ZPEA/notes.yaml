notes:
  - _ulid: 01KNEDHYEGW4AQJE1CT2EDE4JP
    content: "Approach: reuse existing HeartbeatManager and daemon runtime adapter tests, keep
      PubSubManager guards as-is, and add a small startup warning helper in the daemon server. Edge
      cases: ws without ping() must not arm lastPing/timeout state; missing pong callback on node
      must not reap idle sockets; node runtime should log the degradation warning once at startup
      only. Test plan: extend daemon-heartbeat tests for missing ping and no-timeout behavior, add
      daemon runtime/server test coverage for the node startup warning, and re-run daemon plus full
      suite coverage for @daemon-runtime-adapter ac-heartbeat-degradation,
      ac-backpressure-degradation, and ac-websocket-parity."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-05T08:53:36.849Z
  - _ulid: 01KNEDNNF1NNZKFD2MFZ4P34CK
    content: Implemented node-runtime websocket degradation handling. Heartbeat now skips sockets
      without ping() so missing crossws ping/pong support does not arm timeout closure, and daemon
      startup logs a runtime-specific heartbeat degradation warning on node. Added regression tests
      for missing ping(), no-timeout idle behavior, missing buffered-amount queries, and the
      node-only startup warning.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-05T08:55:38.722Z
