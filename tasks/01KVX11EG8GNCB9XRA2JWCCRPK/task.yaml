title: Fix shared package export baseline for typecheck
type: bug
description: "Review gate triage on @01KVVE0DG6ZG9NX5A2A86ZJQ63 found npm run typecheck and npm test
  failing during the build phase because root source imports exported members that
  @kynetic-ai/shared does not currently expose: BreadcrumbAncestor, ActorIdentityConfig,
  AgentIdentity, HumanIdentity, classifyActor, ClassifiedActor, and buildActorClassifier. The
  reviewed task branch does not change packages/shared, package lockfiles, TypeScript config, or the
  affected importer files, so this appears to be a pre-existing integration baseline issue.
  Reproduce from the project root with npm run typecheck; npm test also fails because its pre-test
  build fails for the same reason. Fix by restoring the shared package exports or updating the root
  imports to the current shared API, then rerun npm run typecheck and npm test."
