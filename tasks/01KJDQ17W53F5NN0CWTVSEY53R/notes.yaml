    content: "Implemented iteration-level timeout for ralph loop attempts. Added --iteration-timeout
      <minutes> (default 20), validated as positive numeric minutes, and applied timeout over full
      task-work+reflect attempt using Promise.race. On timeout, ralph now logs iteration.timeout
      events with iteration/attempt/timeout metadata, kills the stuck agent, and reuses existing
      retry/max-failure handling. Updated session event schema to include iteration.timeout and
      added regression tests in tests/ralph.test.ts for dry-run display, invalid value handling, and
      timeout event logging. Verification: npx vitest run tests/ralph.test.ts tests/sessions.test.ts
      (pass), npm test (pass). kspec validate still reports pre-existing project-level
      meta/reference/alignment/completeness issues unrelated to this change."
