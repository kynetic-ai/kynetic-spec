  - _ulid: 01KJK6YR76FMMN3EJK160JAX6T
    content: "[FIX_CYCLE: 4] Review findings: MUST-FIX: Floating runIterationPrompts() promise causes
      unhandled rejection crash in Node.js 22 when iteration times out. disposeSpawnedAgent() closes
      the framing layer, rejecting the pending session/prompt request. The runIterationPrompts()
      Promise rejects with no catch handler, crashing the process before session.end and wrap-up
      agent run. Fix: store the Promise and attach .catch(() => {}) before the Promise.race.
      SHOULD-FIX: --iteration-timeout feature has no spec ACs in @cli-ralph; tests/ralph.test.ts
      lines 230 and 313 have no // AC: annotations. Add ACs to spec and annotate tests. Review
      posted at PR #608."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-28T22:47:23.110Z
