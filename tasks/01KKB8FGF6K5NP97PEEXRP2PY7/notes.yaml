    content: "Spec scope rewritten from a one-time annotation sweep target into durable AC annotation
      coverage semantics. Task focus is now: (1) support explicit numeric or named ac-* ids, (2)
      require explicit ac-* mapping for specs/traits with acceptance criteria, (3) treat bare
      spec/trait refs as invalid coverage metadata that provide no completeness credit, and (4)
      clean up the blanket refs touched in this PR. Broader repo-wide own-coverage reduction stays
      out of this task and should be handled as follow-up debt-scope work."
    supersedes: null
