  - _ulid: 01KKAV4GZMRY8Z8GQ459SF8KYN
    content: "[FIX_CYCLE: 1] Review findings: Fix only cleared the URL query param but did not reset
      Svelte component state (selectedTaskRef, modalOpen). The modal closes visually but the
      reactive effect watching ?ref= reopens it. AC-7 has been updated to require clearing both
      component state AND URL param. Tests only checked URL so they passed — need tests that verify
      the modal actually stays closed."
