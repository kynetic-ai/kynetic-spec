  - _ulid: 01KKAJ81X8MK59XVYTTPKNJDVW
    content: >-
      Implementation guide: The specs page already has the correct pattern at
      packages/web-ui/src/routes/specs/+page.svelte — an $effect that watches for modal close and
      cleans up the URL:


      $effect(() => {
        if (!detailOpen && selectedRef) {
          selectedRef = null;
          const url = new URL(window.location.href);
          url.searchParams.delete('ref');
          window.history.pushState({}, '', url);
        }
      });


      Apply the same pattern to:

      1. packages/web-ui/src/routes/tasks/+page.svelte (list view, lines 115-121 clear internal
      state but not URL)

      2. packages/web-ui/src/routes/tasks/board/+page.svelte (board view, has no cleanup effect at
      all)


      For the board view, the cleanup goes in TaskDetailModal.svelte or in the board +page.svelte
      where modalOpen is bound. Verify with E2E or manual test: open modal via URL, close it,
      confirm ?ref= is gone and modal stays closed.
