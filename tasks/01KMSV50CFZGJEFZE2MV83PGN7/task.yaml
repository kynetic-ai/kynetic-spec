title: Fix cache domain state regression during reload
type: task
description: "What: loadDomain() sets store.state to loading before starting an async reload,
  causing API routes that gate on domain state to skip enrichment and return null data. Where:
  src/daemon/entity-cache.ts loadDomain() state transition (line ~800), doLoadDomain() index/detail
  population (lines 830-852). Downstream: packages/daemon/src/routes/sessions.ts task_title
  resolution guard (lines 597-632). Why: During active dispatch, frequent .kspec/ mutations trigger
  repeated domain reloads. Each reload flips state to loading, causing session detail endpoints to
  return null task_title. The UI renders the raw ULID, then re-fetches and gets the title back,
  visible as flickering. Fix by keeping state ready during reloads of already-populated domains and
  swapping in new data atomically on completion. Transition to degraded only on reload failure."
