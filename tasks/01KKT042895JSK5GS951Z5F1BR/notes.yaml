  - _ulid: 01KKT1K1KFRWXWS03RRKEE237E
    content: >-
      Implementation complete. PR #892 created.


      Changes:

      1. Added HooksConfigSchema to config.ts with checkpoint (default: false) and prompt_check
      (default: true) fields

      2. Wired hooks into KspecConfigSchema, ResolvedKspecConfig, resolveConfig(),
      getDefaultConfig()

      3. Updated installClaudeCodeHooks() in setup.ts to accept HooksPreferences and conditionally
      install/remove hooks

      4. runSetupPipeline() loads project config to pass hook preferences

      5. 20 new config tests + 8 new setup tests covering all 4 hooks ACs

      6. Updated 2 existing tests that assumed unconditional Stop hook installation


      All tests pass. TypeScript compiles cleanly.
