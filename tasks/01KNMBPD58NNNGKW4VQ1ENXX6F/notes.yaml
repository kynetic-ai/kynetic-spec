notes:
  - _ulid: 01KNMHHS1Y2BB5Z84C76J81EX3
    content: "Approach: mirror the existing cache-aware task loader pattern in src/parser/yaml.ts by
      checking AsyncLocalStorage entity cache context before the disk-backed loadAllItems() path.
      Edge cases: no cache context, non-ready items domain, and preserving direct CLI disk reads
      outside daemon execution. Test plan: add behavioral parser tests for cache hit returning
      getAllItemDetails() and cache miss falling through to manifest/module parsing. Covers
      @daemon-command-api ac-read-cache-serving and ac-no-cache-outside-daemon for the items domain
      path."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T17:58:52.222Z
  - _ulid: 01KNMJ07WJ9REC0RA70WZS867F
    content: "Implemented cache-aware item reads in loadAllItems(). When AsyncLocalStorage exposes a
      ready items domain, the loader now returns cache.getAllItemDetails() before any
      manifest/include traversal. Added parser coverage for cache hit, non-ready fallback, and
      no-cache direct mode fallback in tests/parser/entity-cache-context.test.ts. Verification: npm
      test -- --run tests/parser/entity-cache-context.test.ts, npm test, kspec validate (warnings
      only; existing project-wide warnings remain)."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T18:06:46.163Z
