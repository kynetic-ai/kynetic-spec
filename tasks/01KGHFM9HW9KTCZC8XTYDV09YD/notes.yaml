    content: |-
      Implementation complete:

      CREATED:
      - scripts/bootstrap.cjs - Zero-dependency Node.js script
        - Uses CommonJS (.cjs) to work regardless of package.json type
        - Detects: kspec CLI, .kspec/ dir, node_modules, dist/
        - Only runs steps that are needed
        - Reports actions taken with colored output
        - Ends with session start output

      UPDATED:
      - package.json - Added "bootstrap" npm script
      - CLAUDE.md - Added bootstrap as first step in Quick Start
      - AGENTS.md - Updated 'For New Contributors' and 'Starting a Session' sections
      - INSTALL.md - Added bootstrap option in 'From Source' section

      TESTED:
      - Verified bootstrap detects already-configured state (skips setup)
      - Verified npm run bootstrap works
      - Existing tests have unrelated timeout failures (not introduced by this change)
