      skills, Generate kspec-agents.md, Configure author)

      - ac-2: All hook entries present (UserPromptSubmit, Stop, PreToolUse with Bash matcher and
      guard scripts)

      - ac-3: Rendered skill files exist for each skill targeting claude-code

      - ac-4: kspec-agents.md exists after setup with freshness hash

      - ac-5: --skip-skills flag skips skill rendering

      - ac-6: --dry-run displays planned actions without changes

      - ac-7: --status reports current state including agent detected

      - ac-8: --status shows hooks status, skills rendered count, and agents.md freshness


      Created guard scripts (kspec-worktree-guard.sh, ralph-task-limit-guard.sh) that are installed
      to .claude/hooks/.

      Added 19 tests covering all acceptance criteria.
