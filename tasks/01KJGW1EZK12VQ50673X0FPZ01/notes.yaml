notes:
  - _ulid: 01KJGWH5P1JN13VH4V22380P41
    content: >-
      Execution context:

      - Background: ralph orchestrator retains per-iteration state/listeners and grows memory across
      loops.

      - Scope: listener cleanup before agent kill, prune iteration/session state, bound recent task
      refs, and add tests for these paths.

      - Files: src/cli/commands/ralph.ts, src/acp/client.ts, tests/ralph.test.ts, tests/acp.test.ts.

      - Verification: targeted vitest for ralph+acp, then full test suite if feasible.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-02-28T01:06:43.521Z
  - _ulid: 01KJGWPPND57PEAR88SVFSWBM5
    content: >-
      Implemented memory-leak mitigation in ralph loop:

      - Added explicit ACP session lifecycle cleanup () and now end each per-iteration session after
      reflect/error cleanup.

      - Added listener-safe agent disposal path that calls  before kill/close; used in restart path,
      error path, signal cleanup, and final cleanup.

      - Pruned sessionIterationMap to one active session via setSessionIteration() and switched
      update fallback iteration from 0 to latest iteration.

      - Bounded recentTaskRefs using dedupe+cap helper (limit 50) to prevent unbounded growth.

      - ACP client now clears session tracking on close.

      Verification:

      - npx vitest run tests/acp.test.ts tests/ralph.test.ts (pass; includes new 30-iteration
      restart test and helper/unit tests).

      - kspec validate completed schema/reference checks; repository has pre-existing
      alignment/completeness warnings unrelated to this task.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-02-28T01:09:44.749Z
  - _ulid: 01KJGWPYVVTZ5G7NBSQ3MGYVET
    content: >-
      Implemented memory-leak mitigation in ralph loop:

      - Added explicit ACP session lifecycle cleanup via endSession() and now end each per-iteration
      session after reflect/error cleanup.

      - Added listener-safe agent disposal path that calls removeAllListeners() before kill/close;
      used in restart path, error path, signal cleanup, and final cleanup.

      - Pruned sessionIterationMap to one active session via setSessionIteration() and switched
      update fallback iteration from 0 to latest iteration.

      - Bounded recentTaskRefs using dedupe+cap helper (limit 50) to prevent unbounded growth.

      - ACP client now clears session tracking on close.

      Verification:

      - npx vitest run tests/acp.test.ts tests/ralph.test.ts (pass; includes new 30-iteration
      restart test and helper/unit tests).

      - kspec validate completed schema/reference checks; repository has pre-existing
      alignment/completeness warnings unrelated to this task.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-02-28T01:09:53.147Z
