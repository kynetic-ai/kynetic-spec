      Intent:
      This is a manual planning task in the Spec Cruft Cleanup Program. It is not implementation work and should not directly edit specs/code except as needed to create, import, and review the downstream plan. The seed record is a non-derivable planning artifact; the output of this task should be a new clean derive-ready plan with slug `api-daemon-web-contract-split` (or an explicitly chosen replacement slug if scope is split).

      Source records to read first:
      - Program charter: @cruft-cleanup-program-charter
      - Seed plan: @cruft-05-api-daemon-web-contract-split-seed
      - Audit summary file: /home/chapel/Projects/kynetic-spec/plans/cruft-audit-2026-04-24.md

      Dependency/context:
      This task should be picked up after: @task-convert-cruft-01-spec-catalog-health-plan, @task-convert-cruft-03-trait-normalization-plan.

      Focus of the downstream plan:
      Plan splitting and rewriting oversized/stale API, daemon, WebSocket, cache, and Web UI specs into smaller behavior-level contracts.

      Include in the planning work:
      - @api-contract envelope/pagination/error/request-id rewrite.
  - WebSocket topic/data freshness normalization.

  - Splitting @daemon-server, @daemon-entity-cache, @multi-directory-daemon, @web-dashboard, and
  possibly @dispatch-remote-branch-sync.

  - Missing specs for shared API envelope, query invalidation, dashboard aggregation, and docs
  search safety as appropriate.

      Exclude from this planning task:
      - General CLI/schema rewrite.
  - Daemon mutation/cache safety refactors unless directly necessary for contract correctness.

  - Full Web UI redesign.

  - Generic test cleanup not tied to API/daemon/web behavior.

      Required process:
      1. Re-read the program charter and seed record via `kspec plan get` or `kspec plan export`; do not rely on chat history.
      2. Re-run the relevant discovery/validation commands named in the seed because audit counts may have changed.
      3. Check for overlap with existing plans/tasks before creating duplicate work.
      4. Write a normal kspec plan document with behavioral Specs and standalone Tasks, or split the seed into multiple smaller real plans if the seed is too broad.
      5. Parse/validate the plan document before import.
      6. Import the real plan as draft with a clean slug/title.
      7. Run `kspec agent run plan-reviewer` with the charter/seed/audit as background context only; the real plan itself must stand alone.
      8. Iterate until the real plan is review-ready or clearly blocked by a product/design decision.
      9. Add a note to @cruft-05-api-daemon-web-contract-split-seed linking to the real plan(s) created and summarizing any split/deferral decisions.

      Done when:
      - One or more draft implementation plans exist for API/daemon/web contract cleanup, split if needed for reviewability.
  - Each real plan has explicit non-goals and does not become a mega-plan itself.

  - The seed has a note linking to created plan(s).

