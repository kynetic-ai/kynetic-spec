description: >-
  Fix skill verify reporting drift/no-hash for plugin-provided core skills.


  The skill verify command in src/cli/commands/skill-diff.ts (lines ~1022-1050) has a switch
  statement handling skill statuses: in-sync, drifted, not-rendered, no-hash. It is missing a case
  for plugin-provided status. When plugin-provided skills are checked, they fall through without
  proper handling.


  Fix: Add a plugin-provided case to the switch statement that reports the appropriate status (these
  skills are managed by the plugin, not locally rendered, so drift detection does not apply). Update
  tests in tests/skill-rendering.test.ts.
