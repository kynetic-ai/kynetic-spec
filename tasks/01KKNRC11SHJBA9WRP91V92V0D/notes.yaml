  - _ulid: 01KKPR2B2DFYJN4S06T1DNW2EQ
    content: >-
      Submitted PR #853. Implementation adds:

      - src/review/checks.ts: Check recording factories (createCheck, createLocalCheck,
      mirrorExternalCheck) and gate evaluation engine (evaluateGates)

      - src/review/index.ts: Updated barrel export

      - tests/review-checks.test.ts: 38 tests covering all 6 ACs


      Key design decisions:

      - Checks are grouped by logical name for gate evaluation; latest fresh run per name determines
      gate state

      - Required flag uses 'any run required' semantics — if any run for a check name was marked
      required, the gate is required

      - Stale checks (applies_to_version mismatch) cause failing state for required gates, not
      pending

      - Skipped required checks are treated as satisfied (explicit skip is an acceptable outcome)

      - Running checks leave gates in pending state

      - Informational checks are always satisfied regardless of status

      - Reuses isVersionStale from subject-bindings.ts for staleness detection
