title: Add unfiltered_total to sessions API response to eliminate extra limit=0 request
type: task
description: >-
  Sessions page makes a separate limit=0 API call to get the unfiltered total for the filter count
  display ("12 of 731 sessions"). This defeats the purpose of infinite scroll pagination — the
  server already has all sessions cached.


  Fix: Add unfiltered_total field to the paginated sessions API response
  (sessionCache.getAll().length before filtering). Remove the separate unfilteredQuery from the UI
  and read unfiltered_total from the infinite query first page response.


  Spec: @session-filter-controls ac-filter-counts (updated to specify unfiltered total comes from
  same response)
