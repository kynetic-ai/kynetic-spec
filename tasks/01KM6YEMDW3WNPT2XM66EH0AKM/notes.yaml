  - _ulid: 01KM71YJ3CZFB43Q00ETKQCFXQ
    content: "Fix cycle 2: The foreground serve SIGINT test (cli-serve.test.ts:232) asserted
      exitCode===0, but on some systems/timings the SIGINT kills the node process before the
      graceful exit handler fires process.exit(0), leaving exitCode=null with signalCode='SIGINT'.
      Updated the assertion to accept either outcome — both represent valid Ctrl+C shutdown. All
      6704 tests pass."
    supersedes: null
