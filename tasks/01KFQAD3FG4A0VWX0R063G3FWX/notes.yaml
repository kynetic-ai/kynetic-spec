  - _ulid: 01KFRXE8FFHZ0HQTRC7DNYPXKJ
    content: >-
      Route migration completed:


      Applied project context middleware to server and updated all 5 route files to use
      request-scoped projectContext instead of closure-scoped kspecDir.


      Changes:

      - server.ts: Applied projectContextMiddleware, removed kspecDir from route factory calls

      - tasks.ts: Added projectContext param to all 4 handlers, derive kspecDir from
      projectContext.path

      - items.ts: Added projectContext param to all 3 handlers

      - inbox.ts: Added projectContext param to all 3 handlers

      - meta.ts: Added projectContext param to all 4 handlers

      - validation.ts: Added projectContext param to all 3 handlers


      All route handlers now follow the pattern:

      ```typescript

      async ({ projectContext, ...otherParams }) => {
        const kspecDir = join(projectContext.path, '.kspec');
        const ctx = await initContext(kspecDir);
        // ... rest of handler
      }

      ```


      Tests passing (232 total daemon tests, 1 pre-existing failure unrelated to this work).


      Covers AC-1, AC-2, AC-3, AC-24 from @multi-directory-daemon spec.
    supersedes: null
