  - _ulid: 01KFR82GCHGVHHD2HV6V35QBDZ
    content: >-
      Implementation notes (auto-generated from spec):


      Error handling specific to loop mode. Failures tracked via task notes with [LOOP-FAIL:N]
      prefix. N=3 triggers automation: needs_review.



      Acceptance Criteria:

      - ac-1: Given error during task work, when error caught, then note added with [LOOP-FAIL:N]
      prefix and error description

      - ac-2: Given non-fatal error occurs, when error handled, then workflow continues to next task

      - ac-3: Given task fails, when note added, then note includes [LOOP-FAIL:N] where N = previous
      count + 1

      - ac-4: Given task has prior [LOOP-FAIL:N] notes, when new failure occurs, then N is parsed
      from latest note and incremented

      - ac-5: Given task fails with N reaching 3, when threshold reached, then task marked
      automation: needs_review with summary

      - ac-6: Given task completes successfully, when workflow finishes, then no reset needed; count
      is per-task in notes

      - ac-7: Given workflow encounters error, when error evaluated, then failure = tests fail, PR
      blocked, exception, or agent reports cannot complete
    supersedes: null
    author: "@claude"
    created_at: 2026-01-24T14:56:01.425Z
