title: Add explicit generateCommitMessage cases for all shadow operations
type: task
description: >-
  generateCommitMessage() in shadow.ts has only 10 explicit switch cases but ~75 distinct operation
  strings are used across the codebase. The remaining ~65 fall through to the default case which
  produces 'operation @ref' — violating ac-2 (requires colon separator pattern). Add explicit cases
  for every operation string, following the 'Operation: @ref' pattern. Group related operations
  (e.g. all review-* ops, all plan-* ops, all meta-* ops) into shared formatting logic where
  appropriate.


  Operations needing cases: task-set, task-patch, task-start (already has one), task-submit,
  task-needs-work, task-block, task-unblock, task-cancel, task-reset, task-delete, spec-sync,
  review-add, review-comment, review-reply, review-check, review-verdict,
  review-verdict-task-transition, review-resolve, review-reopen, review-open, review-close,
  review-archive, review-refresh, review-task-link, plan-set, plan-note, plan-derive, plan-import,
  inbox-delete, inbox-set, inbox-note, triage-record, triage-act, triage-override, meta-observe,
  meta-observe-from-inbox, observation-promote, observation-resolve, meta-add-*, meta-set-*,
  meta-delete-*, skill-add, skill-set, skill-delete, skill-import, skill-render, skill-install-core,
  skill-update, trait-add, item-trait-add, item-trait-remove, item-note, item-patch, item-ac-add,
  item-ac-set, item-ac-remove, module-add, workflow-start, workflow-abort, workflow-complete,
  workflow-pause, workflow-resume, workflow-next, workflow-prune, session-compact, tasks-assess,
  dispatch-workspace-registry.
