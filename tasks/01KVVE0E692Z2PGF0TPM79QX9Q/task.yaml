title: Emit coverage-state events and targeted UI invalidation
type: task
description: >-
  Define and emit typed coverage-state events through the existing spec-item domain topic, and
  update generic client invalidation plumbing so coverage-state consumers can refresh precisely.


  Why: The mutation/event foundation reserved coverage-state events, but left payload semantics to
  this plan. Without typed events, coverage surfaces would fall back to broad delayed refreshes and
  stale badges.


  What:

  - Add typed event definitions for coverage-state changes on the spec-item domain topic
  (`items:updates`), using the reserved family from @mutation-event-naming and the existing daemon
  websocket protocol foundation. Payloads identify affected item ULIDs, AC ids when bounded, changed
  buckets/rollup scopes when known, and whether the client should refresh item detail, project
  summary, or unmapped-result summary. This plan owns coverage-state subscription payloads and
  refresh semantics; it does not reimplement connection lifecycle, heartbeat, close-code, or base
  reconnect mechanics.

  - Emit coverage-state events only after the coverage-state read model/cache has recomputed from
  ingestion evidence changes, verification stamp writes, spec/AC mutations, annotation file watcher
  invalidation, or other cache-affecting paths that change visible state. Existing ingestion
  evidence-changed events may remain minimal inputs; this task owns translation into fresh
  coverage-state reads plus coverage-state events.

  - Ensure event-after-cache ordering: a subscriber that re-fetches immediately sees the new state.

  - Coalesce events for one run or broad file change so the daemon does not send one websocket
  message per criterion.

  - Wire generic web client subscription/invalidation plumbing to refresh coverage-state consumers
  by exact item/summary scope when possible, with file-change fallback for out-of-band writes. Do
  not build the visible spec workspace, Validate matrix, coverage resolution UI, or other follow-on
  surfaces in this task.

  - Tests: typed topic/payload conformance, event-after-cache ordering after ingestion-triggered
  recompute, ingestion event coalescing, watcher fallback invalidation, and UI
  subscription/invalidation path without broad global reload.


  How: Extend packages/shared websocket/event types first, regenerate shared dist, then update
  daemon emitters and generic web client invalidation. Use the shared mutation pipeline event
  ordering for daemon-served mutations and explicit cache invalidation for watcher paths.


  Covers: @coverage-state-events ac-event-topic, ac-event-canonical-identity, ac-event-after-cache,
  ac-file-change-fallback, ac-no-event-storm. Also covers @mutation-event-naming ac-3 for the
  coverage-state reserved family. Covers @trait-websocket-protocol ac-2 and ac-3 only for
  coverage-state topic subscription and broadcast envelope conformance; ac-6 is covered only for
  coverage-state event coalescing/backpressure behavior.


  Non-applicable inherited cases: @trait-websocket-protocol ac-1, ac-4, ac-5, ac-7, and ac-8 are N/A
  for this coverage-state event-payload task unless the implementation actually changes base
  connection, heartbeat, close-code, or generic reconnect behavior. Implementation/review evidence
  should annotate those inherited ACs as N/A rather than reimplementing base websocket lifecycle
  behavior.
