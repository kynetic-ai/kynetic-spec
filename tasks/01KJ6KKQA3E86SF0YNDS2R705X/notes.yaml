  - _ulid: 01KJ73HYFTGFD97X3VSDSY5VGC
    content: Implemented session-scoped task claiming. Added session_id field to TaskSchema and
      TaskInputSchema (optional, nullable, backward compatible). Task start reads KSPEC_SESSION_ID
      env var and stamps task. Warns when task is claimed by another session. Session indicator
      shown in task list and details. session_id cleared on transitions to pending (unblock, reset)
      and needs_work. 13 integration tests covering all 6 ACs.
    supersedes: null
    author: "@claude"
