  - _ulid: 01KG5VSSRD6430BCW8BM82TC0N
    content: |-
      ## Scope

      Fix the E2E test infrastructure so daemon fixtures load reliably. Currently:
      - Daemon starts with --kspec-dir pointing to temp fixtures
      - Returns empty data instead of YAML content
      - Causes 2+ minute timeouts in E2E tests

      ## Related Observations
      - 01KFVPXS: E2E tests timeout after 2+ minutes
      - 01KFTGC4: E2E test verification blocked by daemon requirements
      - 01KFXVK5: dist/daemon/ can become stale without warning

      ## Approach Options
      1. Debug ContextManager code paths for temp directory handling
      2. Add verbose/debug mode to daemon startup for diagnosis
      3. Create minimal reproduction case
      4. Check if dist/daemon staleness is root cause

      ## Unblocks
      - @task-watcher-tests (P1) - AC-19 verification needs E2E
      - 01KFMMZW (P2) - API integration tests
    supersedes: null
