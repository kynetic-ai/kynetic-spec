title: Rewrite core skills for review-driven architecture
type: task
description: >-
  Restructure core kspec skills around kspec reviews as the primary review mechanism. Three core
  skill changes:


  1. Rewrite task-work skill: unified (no loop split), language-agnostic AC annotations,
  review-aware fix cycles via kspec review for-task

  2. Rewrite review skill: unified worker+reviewer perspective, baked-in review principles
  (adversarial investigation, bias countermeasures), AC coverage verification (own + trait), full
  review record interface, no GitHub dependency

  3. New merge skill: local git merge to dev/integration branch, disposition-based merge gate, merge
  commits for trailer traceability


  Also create two project-specific skills for kspec itself:

  4. work-gates (.kspec/skills/): MUST-FIX patterns, test rules, E2E preference extracted from
  current local-review

  5. review-gates (.kspec/skills/): severity classification, regression patterns extracted from
  current pr-review


  Then archive superseded project-local skills (local-review, pr-review, review-principles, pr) and
  update all references in workflows, conventions, AGENTS.md.


  Render with kspec skill render + kspec agents generate.
