  - _ulid: 01KQY0Z47BDZMP04W31B6888N0
    content: >-
      Fix cycle 1: addressed all 5 review blockers.


      Root cause: previous worker repointed annotations from the deleted ac-port-file-check to the
      renamed ac-connection-metadata-check / metadata-keyed ac-auto-detect / ac-health-timeout, but
      the underlying tests and source only exercise the legacy port-file path. The metadata-driven
      contract is not yet implemented (lands with @task-shared-daemon-endpoint-resolver,
      @task-daemon-startup-bind-host-metadata, @task-centralize-cli-daemon-clients).


      Changes:

      - src/cli/daemon-proxy.ts: replaced stale ac-port-file-check references with
      ac-legacy-port-file-fallback; dropped metadata-keyed ac-auto-detect/ac-health-timeout source
      annotations and added comments that metadata-driven coverage lands with the implementation
      tasks.

      - tests/cli-daemon-proxy.test.ts: re-annotated the four flagged tests (lines 135, 270, 744,
      825) to ac-legacy-port-file-fallback or removed the AC claim where the test bypasses
      detection. Updated the test header summary accordingly.

      - Added a behavioral E2E for ac-force-direct-management-exception: with KSPEC_NO_DAEMON=1 set
      and a live daemon.pid, kspec serve status --json reports running:true, proving daemon
      management commands ignore KSPEC_NO_DAEMON via {ignoreNoDaemon: true} and never enter the
      proxy short-circuit.


      Verified: rg ac-port-file-check → no matches. kspec validate --warnings-ok exits 0 with no new
      warnings on cli-daemon-proxy.ts or its tests. Full npm test → 2332 suites / 8547 passed (5
      skipped, all pre-existing watcher tests).
