notes:
  - _ulid: 01KGTZDHDVQBFJ0C52T43JTBVT
    content: "Implementation: Add two subcommands in src/cli/commands/inbox.ts. (1) inbox set @ref
      --content 'new text' — replaces item content, preserving ULID/timestamp/tags. (2) inbox note
      @ref 'appended context' — appends text to existing content with separator. Follow task note
      pattern for append. Find item by ref, modify content field, save via existing YAML writer. ~25
      lines + tests for both replace and append paths."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-07T02:38:10.876Z
  - _ulid: 01KGW37YH06JQNW3J6RXSNFF0C
    content: |-
      Implemented inbox set and inbox note commands:
      - inbox set @ref --content 'text' - replaces item content (AC-1)
      - inbox set @ref --tag newtag - adds tags, avoids duplicates (AC-2)
      - inbox set @ref --clear-tags - clears all tags before adding new ones
      - inbox note @ref 'text' - appends note with separator to existing content

      Added 8 tests covering both ACs and edge cases (tag dedup, multiple notes, tag preservation).
    supersedes: null
    author: "@claude"
    created_at: 2026-02-07T13:04:16.416Z
