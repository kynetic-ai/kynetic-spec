notes:
  - _ulid: 01KK6ECKGS2WV90H3265MSSKQ3
    content: "Fix: Added ws package as dependency and created src/cli/websocket.ts utility that checks
      globalThis.WebSocket at call time (Node 22+) with ws fallback (Node 18-21). The
      getWebSocketCtor() function returns the appropriate constructor, preserving vi.stubGlobal
      compatibility for tests. Updated agent.ts dispatch watch to use the utility. All 53 agent
      command tests pass including all 18 dispatch watch tests."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-08T10:02:51.289Z
  - _ulid: 01KK6FDH217WHKBFQ44Z976SNQ
    content: "[FIX_CYCLE: 1] Review findings: MUST-FIX: PR #709 does not actually test the Node <22
      WebSocket fallback path, so the Node 20 crash fix can regress undetected on the repo's Node 22
      CI."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-08T10:20:50.114Z
  - _ulid: 01KK6GFJZQGSGRAGEC3EK73GQJ
    content: "Fix cycle 1: Added explicit fallback-path tests. Tests now stub globalThis.WebSocket to
      undefined before calling getWebSocketCtor(), forcing the ws-package fallback path. Two new
      test cases: (1) verifies fallback returns a function when global is absent, (2) verifies
      fallback can establish a real WebSocket connection via ws. This ensures the Node 20 fix cannot
      regress on Node 22 CI."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-08T10:39:26.199Z
  - _ulid: 01KK6JK4XFQHM8831S3Z2Y7ASF
    content: "[FIX_CYCLE: 2] Review findings: MUST-FIX: PR #709 still fails local regression coverage
      after the fallback-path fix. In an isolated PR checkout, npm ci and npm run typecheck passed
      but npm test failed with dispatch watch regressions across AC-13, AC-14, AC-16, and AC-18
      (including readiness timeouts, leaked unmatched output under --agent filtering, and --retries
      0 not exiting with code 3)."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-08T11:16:20.015Z
  - _ulid: 01KK6N258W8GHGDKHVGN7A9BCE
    content: "Fix cycle 2: Root cause was two issues: (1) vi.stubGlobal(\"WebSocket\", FakeWs) is
      unreliable across module boundaries in vitest 4.0's vm-based module resolution, and (2)
      initContext() takes >500ms in environments without .kspec/ (clean clones, CI), exceeding the
      500ms waitFor timeout. Fix: replaced separate websocket.ts with injectable _setWebSocketCtor()
      in agent.ts, always use ws package instead of native WebSocket, and mock initContext() in
      dispatch watch tests. Verified all 50 agent tests pass in both working copy and isolated clean
      checkout with npm ci."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-08T11:59:29.053Z
