  - _ulid: 01KKHS6YH6Q9X53QMERE4TB56P
    content: "Fix cycle investigation: the reported dispatch-workspace-registry flake matches a real
      YAML persistence race. Registry/state readers can observe a file during in-place rewrite and
      parse null/partial content, and the cli-serve foreground shutdown assertion is also
      timing-sensitive. I am hardening parser YAML writes to use atomic temp-file rename semantics
      and tightening the serve foreground test shutdown wait before re-running repeated regression
      checks."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-12T19:43:39.046Z
  - _ulid: 01KKHSMBK7JX37C83A4X0PSTNF
    content: >-
      Fix cycle resolution:

      - Stabilized shared YAML persistence by switching parser YAML writes to atomic temp-file
      rename semantics so dispatch workspace registry/state readers cannot observe partially
      rewritten files.

      - Hardened the foreground daemon CLI test to wait deterministically for child exit after
      SIGINT, removing the timing-sensitive  failure mode seen in repeated full-suite review reruns.

      - Added regression coverage for atomic YAML temp-file cleanup.

      - Verification: npm test -- tests/yaml-atomic-write.test.ts
      tests/dispatch-workspace-registry.test.ts tests/cli-serve.test.ts; npm test (run 1: 221 files,
      4629 passed, 3 skipped); npm test (run 2: 221 files, 4629 passed, 3 skipped); kspec validate
      (warnings-only baseline, exit 6).
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-12T19:50:58.408Z
