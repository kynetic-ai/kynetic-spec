    content: Investigated triage record persistence mismatch. The YAML save path was already upserting
      correctly by inbox_ref and preserving the original triage record identity; the bug was in the
      CLI returning and committing against the transient pre-save ULID. Updated triage record/start
      flows to reload the persisted record after save and use that identity for success output and
      shadow commit metadata, plus added a regression test covering re-recording an already triaged
      inbox item.
