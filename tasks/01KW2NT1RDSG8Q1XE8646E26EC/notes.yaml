  - _ulid: 01KW30HY4J06AH7E0BYV0XPMZQ
    content: "Approach: add applyExplicitReverification in src/parser/coverage-resolution.ts using
      resolveCoverageTarget, resolveActorForContext, writeVerificationStampWithoutCommit, and
      invalidate/reload coverage-state read model. Preconditions: accept only re_verify criteria
      whose rule has positive evidence and no failed/errored latest mapped result; reject
      covered/not_yet/failing with specific guidance. Commit/session: stamp request commit when
      supplied, otherwise the best comparable source commit from current evidence; session_id maps
      to stamp session. Test plan: extend tests/coverage-resolution.test.ts with AC annotations for
      accepted write/replace and attribution, invalid preconditions, newer record-format refusal
      propagation, production read-model stale-cause clearing, and no test-run store writes."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-26T22:24:39.058Z
  - _ulid: 01KW31R8854GQNK16THEBJE4ED
    content: "Implemented explicit re-verification mutation in coverage-resolution service. Reuses
      resolveCoverageTarget/current read path, shared actor resolution,
      writeVerificationStampWithoutCommit, and coverage-state cache invalidation before reloading
      post-write state. Preconditions reject covered/not-yet/failing targets with guidance; accepted
      requests write re_verification stamps with mutation time, actor, optional commit/session.
      Verification: format:check, repo lint --quiet, focused oxlint, typecheck, focused
      coverage-resolution tests, full npm test (2914 suites / 11080 passed / 3 skipped), and kspec
      refs/alignment/completeness validations all passed with existing warning baselines."
