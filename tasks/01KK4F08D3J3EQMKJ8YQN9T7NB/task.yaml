title: Fix settings page showing shadow branch as unhealthy when it is healthy
type: task
description: "The settings page shows shadow branch status as 'Unhealthy' (yellow indicator) even
  when kspec shadow status reports it as healthy. The daemon endpoint GET /api/meta/shadow calls
  getShadowStatus() which checks branchExists, worktreeExists, and worktreeLinked. The UI shows
  unhealthy when enabled=true but healthy=false. Possible causes: (1) the daemon's initContext
  resolves a different project root than the CLI, (2) the project header is missing/wrong so the
  daemon checks the wrong directory, or (3) the getShadowStatus check fails for worktreeLinked in
  the daemon context."
