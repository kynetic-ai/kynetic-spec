    content: "Root cause: closeSession() in invocation.ts writes session files to disk but never calls
      shadowAutoCommit(). Added shadow commit after all 4 terminal event paths (completed,
      timed_out, aborted, failed). Also fixed shadowPull to stash/unstash around pull operations so
      dirty worktrees don't trigger false conflict warnings in the sync scheduler. Spec coverage:
      @session-events ac-7 already requires this. No spec gap for the primary fix."
    supersedes: null
