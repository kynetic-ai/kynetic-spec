title: Install TanStack Query, set up provider, and migrate dashboard as proof
type: task
description: >-
  Install @tanstack/svelte-query v6 (requires Svelte >= 5.25.0).


  Part 1 — Infrastructure: npm install, create query client factory with default config (staleTime
  for localhost daemon, retry config, gcTime), add QueryClientProvider to root layout, create query
  key factories directory, wire WebSocket connection store to queryClient.invalidateQueries()
  mapping broadcast topics to query key filters, wire project switch to queryClient.clear(), ensure
  static mode compatibility.


  Part 2 — Dashboard migration as proving ground: Migrate the dashboard (+page.svelte) from manual
  fetch to TanStack Query. The dashboard touches multiple data sources (tasks, inbox, observations,
  agent status, validation) and makes 5+ parallel API calls including fetchTasks({limit: 1000}).
  Migrating it proves the full pattern: query factories, WebSocket invalidation wiring,
  cache-then-revalidate navigation, static mode compatibility, and error handling.


  Acceptance gates (from @ui-data-freshness): Dashboard renders from cache on revisit without
  loading state (ac-1), WebSocket events invalidate dashboard queries (ac-3), static mode works
  (ac-6), daemon-unreachable shows appropriate error (ac-7), write operations invalidate related
  cache (ac-8).
