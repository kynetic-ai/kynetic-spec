    content: >-
      [FIX_CYCLE: 1] Addressed all review findings from PR #868:

      - MUST-FIX: Replaced queryClient.clear() with queryClient.resetQueries() in clearQueryCache().
      resetQueries() resets state AND triggers refetches of active queries, so mounted components
      fetch fresh data for the new project (ac-5).

      - MUST-FIX: Updated ac-5 test to verify resetQueries() is used and clear() is not.

      - SHOULD-FIX: Removed unused getProjectVersion import from +page.svelte.

      - Added ac-4 test annotation and dedicated test verifying event-driven (not polling)
      invalidation.

      All 5002 tests pass.
