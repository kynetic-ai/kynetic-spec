notes:
  - _ulid: 01KK5EPGT095GPRFVJYDVTGB3C
    content: "IMPORTANT: The fallback must NEVER modify the project working tree. The approach is: (1)
      create a temp dir in /tmp, (2) init a bare/empty repo there to create the orphan branch, (3)
      push that branch back to the project repo, (4) use standard 'git worktree add' (no --orphan)
      to attach. Do NOT use 'git checkout --orphan' in the project dir — that would blow away the
      user's working tree."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-08T00:49:01.760Z
  - _ulid: 01KK5WJ9GVQ0J2PRBRWZYJN1DR
    content: >-
      Execution context:

      - Background: kspec init currently assumes git worktree add --orphan exists, which breaks on
      Debian 12 / Ubuntu 22.04 era git.

      - Scope: add a backward-compatible fallback for shadow branch creation during init without
      modifying the project working tree.

      - Files: init/shadow git helpers and tests covering old-git behavior.

      - Verification: targeted tests for init/shadow setup plus full validation/test pass for
      touched areas.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-08T04:51:23.291Z
  - _ulid: 01KK5X6XT436HM7E0B3V86G7TR
    content: Reset from in_progress to pending
    supersedes: null
