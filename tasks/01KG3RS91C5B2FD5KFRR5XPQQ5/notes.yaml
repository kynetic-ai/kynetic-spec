notes:
  - _ulid: 01KG3RSTBFG3YMNG2XCWV858KB
    content: >-
      Root cause: Svelte 5 requires $state() runes for reactive variables. Plain 'let' declarations
      are NOT automatically reactive in Svelte 5.


      Affected pages (broken):

      - /inbox (packages/web-ui/src/routes/inbox/+page.svelte)

      - /observations (packages/web-ui/src/routes/observations/+page.svelte)


      Working pages use $state() correctly:

      - Dashboard, Tasks, Items all use: let loading = $state(true)


      Fix: Convert plain let declarations to $state() runes:

      - let items = $state<InboxItem[]>([])

      - let loading = $state(true)

      - let error = $state('')

      - etc.


      The data loads correctly but the UI never updates from 'loading' state because the variable
      assignment has no reactive effect.
    supersedes: null
    author: "@claude"
    created_at: 2026-01-29T02:20:01.264Z
  - _ulid: 01KG3T38D4AE2H3GSAMJBMN5M5
    content: |-
      Fixed both pages by converting plain let declarations to $state() runes:
      - inbox/+page.svelte: 9 variables converted
      - observations/+page.svelte: 3 variables converted

      Build succeeds. Changes ensure UI reactively updates when data loads.
