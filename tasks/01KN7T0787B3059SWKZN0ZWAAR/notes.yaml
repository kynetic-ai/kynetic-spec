    content: Stabilized the same-process contention regression by rewriting the test to assert the
      critical section never overlaps and that no force-reclaim diagnostic is emitted. This removes
      reliance on a single final counter value while still proving same-process waiters serialize
      even when each holder exceeds maxHoldMs.
