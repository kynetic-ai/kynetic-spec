notes:
  - _ulid: 01KXH8PHJJVWS8NTN0G90R02VS
    content: "Approach: add a strict version-1 dispatch-control schema and duplicate-aware YAML parser;
      reuse
      acquireFileLock/getDispatchShadowMutationLockPath/rollbackDirtyShadowWorktree/commitIfShadow
      for a shadow-lock-first transaction; publish only snapshots re-read from git show; coalesce
      watcher reloads by committed HEAD/token; notify cache listeners only after publication. Edge
      cases: missing file defaults stopped, unknown/malformed/duplicate/noncanonical records,
      stale/equal revisions, dirty external bytes, commit false/throw, post-commit verification
      mismatch, forced lock reclaim, watcher-before-commit/abort/rollback, self-event duplicates.
      Test plan: behavioral temp-git harness with annotated tests for the five owned ACs plus
      schema/lock/rollback barriers; focused daemon watcher/cache tests for committed-only
      invalidation."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-14T21:32:02.514Z
  - _ulid: 01KXHNFVNVYZJ6T2FCY8DDYVHE
    content: Implemented strict durable schema/parser, shadow-lock-first commit verification,
      committed-only store publication, watcher HEAD capture/coalescing, and post-publication cache
      invalidation. Hardened failure recovery so false/throw/verification rollback restores pre_head
      and reloads any newer valid pre-transaction snapshot; corrupt initial state remains
      degraded/stopped until a valid committed repair. Behavioral barriers now cover dirty external
      bytes, watcher-before-commit/abort/rollback, commit-before-watcher, duplicate events,
      stale/malformed commits, false commit, verification mismatch, monotonic revisions, and
      force-reclaim rollback.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-15T01:15:34.971Z
  - _ulid: 01KXHQ3CA0VQD70RYTMZ14FKTZ
    content: >-
      Reviewer handoff for commit 1716ac35c1.


      Commit and rollback table:

      - Successful write: shadow lock, parser file lock, atomic replace, one commitIfShadow call,
      committed-object byte/schema verification, then publication of revision plus commit_oid.

      - Commit false or transaction throw: reset and clean to pre_head; publish only the verified
      pre-transaction object before releasing the shadow lock.

      - Verification mismatch: reset to pre_head, retain or restore its verified publication, and
      mark control_store_degraded.

      - Force-reclaimed lock: rollbackDirtyShadowWorktree removes inherited staged, modified, and
      untracked state before inputs are read.


      Schema rejection table:

      - Missing file: safe stopped revision 0 with no controls.

      - Exact version 1: accepted.

      - Unknown version or fields, malformed YAML/schema, duplicate YAML/cleanup IDs, and
      noncanonical task or cleanup keys: rejected.

      - Pending cleanup forbids error_code; failed cleanup requires a closed mapped error_code;
      aggregate projection derives idle, pending, or failed while preserving per-entry status.


      Lock-order table:

      - Dispatch shadow mutation lock is always acquired first.

      - Parser atomic replacement acquires its per-file lock only inside that shadow transaction.

      - No dispatch admission, bootstrap scheduling, engine wait, process wait, or session wait is
      called by this implementation.


      Watcher barrier table:

      - Dirty watcher event: no publication.

      - Watcher before external commit: exactly one newer token after writer settlement.

      - Watcher before abort or rollback: prior token retained.

      - Commit before watcher and duplicate self event: one committed publication.

      - Stale or malformed committed revision: prior newer verified token retained.

      - Entity cache dispatch-control and agent-status invalidation occurs only from the publication
      listener.


      Verification:

      - Focused 192 tests pass.

      - Full suite: 2794 suites, 10606 passed, 3 skipped.

      - format, repo lint, focused lint errors, typecheck, alignment, completeness, and diff checks
      pass.

      - Reference validation is externally blocked by seven pre-existing duplicate-slug ambiguities
      for @observations and @spec-plan-import; observation @01KXHNHD records the systemic issue.


      Intentionally excluded: restart scheduling, canonical applied command identity, final-gate
      denial, invocation cancellation, and session cleanup.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-15T01:43:43.169Z
