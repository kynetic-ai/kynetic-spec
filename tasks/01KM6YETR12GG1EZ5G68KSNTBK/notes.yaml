    content: >-
      Implemented in-file activity timeline. Key changes:

      - Added historyToActivity(), notesToActivity(), assembleActivityFromFiles() to
      src/utils/activity.ts

      - Added getPreMigrationActivity() for per-directory git log fallback

      - Added ActivitySource type ('history'|'note'|'git_fallback'|'review') to ActivityEntry

      - Updated task.ts consumer to use in-file history as primary source with fallback chain

      - Added 16 tests covering all 3 ACs in tests/activity-in-file.test.ts

      - All 6911 tests pass, no regressions
