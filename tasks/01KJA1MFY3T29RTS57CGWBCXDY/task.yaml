title: Validate --limit option in gatherSessionContext to reject NaN
type: bug
description: >-
  In session.ts gatherSessionContext(), the --limit option is parsed with parseInt without NaN
  validation:

    const limit = parseInt(options.limit || "10", 10);

  If options.limit is "abc", limit becomes NaN which silently breaks downstream .slice(0, NaN) calls
  (returns empty arrays). Other handlers in the same file validate this properly.


  Fix: Add validation after parseInt. If NaN, either error with a helpful message or fall back to
  the default (10). Match the pattern used by sessionLogSearchAction which already validates this.
