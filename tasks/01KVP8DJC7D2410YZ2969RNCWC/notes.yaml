notes:
  - _ulid: 01KVP8K3B9Q60XV4RYGNZ554X1
    content: "Approach: reuse existing plan subject/revision primitives instead of adding a review
      schema field. Make CLI review subject parsing context-aware for plan subjects only: load the
      current plan, store the current shadow commit, and compute the content hash from the loaded
      plan content. Keep task/spec subject creation unchanged to avoid broadening behavior. Edge
      cases: published content should resolve to the matching plan revision ordinal; unpublished
      draft content should still store non-empty identity but resolve subject_revision to null;
      missing plan refs should fail instead of creating an unbound plan review. Test plan:
      behavioral CLI tests in tests/review-subject-revisions.test.ts for @review-subject-bindings
      ac-4, @plan-revisions ac-review-revision-binding, and @subject-revision-vocabulary
      ac-plan-subject-ordinal."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-21T23:34:58.153Z
  - _ulid: 01KVP9ET70DJ0WJ6W51Z7RET3C
    content: "Implemented CLI plan review subject binding. review add now loads plan subjects and stores
      the current shadow commit plus content hash from current plan content; task/spec review
      subject behavior remains unchanged. Added CLI-driven regression coverage for published plan
      revision resolution and unpublished draft plan content. Verification: npm test --
      tests/review-subject-revisions.test.ts --fresh; npm test -- tests/review-cli.test.ts --fresh;
      npm run build:shared && npm run typecheck; npm run format:check; npm run lint -- --quiet; npx
      oxlint src/cli/commands/review.ts tests/review-subject-revisions.test.ts; npm test;
      KSPEC_NO_DAEMON=1 kspec validate --refs --alignment --completeness --warnings-ok."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-21T23:50:06.304Z
