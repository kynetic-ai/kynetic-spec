    content: "Fixed invalidate() to also delete from knownSessionIds and liveEventCounts. Root cause
      confirmed: entries.delete() alone left a ghost in knownSessionIds, causing refresh() to skip
      re-reading the session. Added two regression tests: (1) invalidate then getAll() re-discovers
      session with updated status, (2) invalidate cleans up live event counter. All
      session-summary-cache tests pass. Pre-existing failures in agent-dispatch-engine and
      review-cli tests are unrelated."
