      2. Missing test coverage (blocker): Added 3 new test cases:
         - WebSocket project resolution → shadow sync starts (via resolveWebSocketProject + onProjectRegistered callback)
         - Watcher-permanent-failure → shadow sync stops (via ProjectContextManager.unregisterProject triggering unregisterCallback)
         - No-remote-tracking project → no scheduler created

      All 16 tests pass. Full suite (8032 tests) passes with no regressions. Re-verified all ACs
      (ac-13 through ac-17) against implementation.
