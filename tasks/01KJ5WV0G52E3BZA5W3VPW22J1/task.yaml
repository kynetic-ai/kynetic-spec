title: Fix ralph event logging iteration capture-by-value bug
type: task
description: "In ralph.ts:1573-1579, the streaming update event handler fires appendEvent() without
  await (fire-and-forget). The iteration variable is captured by closure reference, not by value. By
  the time the async callback executes, iteration has already been incremented in the for loop — so
  hundreds of tool_call events get tagged with the wrong iteration number. Fix: snapshot iteration
  into a const before the closure. One-line fix."
