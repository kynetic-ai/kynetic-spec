  - _ulid: 01KKSYEGWHKGA86F87YV9G55S6
    content: >-
      Implementation complete. Changes:


      1. SessionMetadataSchema (types.ts): Added optional event_count, iteration_count,
      tasks_completed fields

      2. closeSession() (store.ts): Now computes stats from events.jsonl via
      countEventLines/countIterations/countTaskCompletions and persists them in session.yaml before
      writing

      3. getSessionMetadataOnly() (store.ts): Reads persisted stats from metadata (event_count ?? 0)
      instead of hardcoding 0

      4. SessionSummaryCache (cache.ts): Added in-memory liveEventCounts Map with
      incrementEventCount(), discardLiveCounter(), getLiveEventCount() methods. The summaries()
      method overlays live counts on active sessions.

      5. InvocationOptions (invocation.ts): Added onEventAppended callback, called after each event
      write

      6. Dispatch engine (dispatch.ts): Wires onEventAppended to cache.incrementEventCount(), and
      discards live counter + invalidates cache entry after invocation completes


      Tests: 36 tests in session-summary-cache.test.ts covering all ACs (ac-persist-on-close,
      ac-live-counter, plus existing ACs). Full suite passes (5482 tests).
