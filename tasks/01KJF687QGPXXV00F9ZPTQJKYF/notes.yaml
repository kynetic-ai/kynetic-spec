  - _ulid: 01KJF6GD922YTTN9A75CAC5KCJ
    content: "Implemented bounded terminal/run capture in ralph: stdout/stderr now stream to
      .kspec/sessions/<session>/tool-output/<toolCallId>.{stdout,stderr}.log while responses return
      bounded previews plus metadata (stdout_path, stderr_path, stdout_bytes, stderr_bytes,
      preview_truncated). Wired request handler context for worker/subagent/wrap-up and added
      regression tests in tests/ralph.test.ts for artifact streaming + preview-only fallback.
      Verification: npm run build; npx vitest run tests/ralph.test.ts (116/116)."
    supersedes: null
    author: Jacob Chapel
