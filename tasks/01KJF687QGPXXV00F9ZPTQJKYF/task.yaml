title: "Ralph: Stream terminal/run output to session files and return bounded previews"
type: bug
description: >-
  Problem: terminal/run currently accumulates child stdout/stderr in unbounded in-memory strings,
  which can OOM long codex runs.


  Scope (steps 1-2):

  1) In terminal/run handler, stream stdout/stderr directly to per-session files (e.g.,
  .kspec/sessions/<id>/tool-output/<toolCallId>.stdout.log and .stderr.log).

  2) Keep only bounded in-memory preview (e.g., first N chars/lines and byte counters) for tool
  response + CLI display.

  3) Include metadata in tool response: stdout_path, stderr_path, stdout_bytes, stderr_bytes,
  preview_truncated.

  4) Preserve current UX by showing truncated preview in CLI while retaining full output on disk.


  Done when: reproducing command-heavy codex run no longer grows heap unbounded from terminal/run
  output, and full output is still retrievable from session artifacts.
