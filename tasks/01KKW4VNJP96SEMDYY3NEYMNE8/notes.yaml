notes:
  - _ulid: 01KKWT67VY9Z38BVFX2338E6HF
    content: "Implemented fix-cycle diff in reviewer orientation. Added findPriorExaminedCommit() to
      find the most recent closed review's examined_commit, computeDiffStat() to run git diff --stat
      between commits, and getFixCycleDiffSummary() to compose them. buildOrientationContext() now
      accepts optional fixCycleDiffSummary and includes it as a ## Fix-Cycle Diff section.
      _buildDispatchPrompt computes the diff for pending_review triggers. All error paths return
      null gracefully per ac-3."
