      Execution context:

      - Background: Task-oriented CLI output needs to expose active review linkage so automation can
      move between task workflow state and the corresponding durable review record.

      - Scope: (1) Add review lookup by task ref to parser, (2) Surface active review ref in task
      get output (human + JSON), (3) Add review list --task filter, (4) Ensure trait AC coverage for
      JSON output and exit codes.

      - Files: src/parser/reviews.ts, src/cli/commands/task.ts, src/cli/output.ts,
      src/cli/commands/review.ts (new or extend), tests/

      - Verification: tests covering both own ACs and trait ACs, npm test passes
