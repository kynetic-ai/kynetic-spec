    content: |-
      Implemented GET /api/refs/index endpoint.

      Files changed:
      - packages/shared/src/api.ts — Added RefIndexEntry and RefIndexResponse types
      - packages/daemon/src/routes/refs.ts — New route handler for /api/refs/index
      - packages/daemon/src/server.ts — Registered refs route
      - tests/daemon-refs-index.test.ts — 6 tests covering AC-4, AC-5, and trait ACs

      Design decisions:
      - Returns flat map keyed by both ULID and slug for O(1) lookup
      - For spec items, extracts implementation status from nested status object
      - Uses Promise.all to load tasks and items concurrently
      - No pagination since this is a complete index, not a list endpoint
      - Trait ACs ac-2/3/4/5 marked N/A (read-only index endpoint with no body/pagination/mutation)

      All 4959 tests pass, 0 regressions.
