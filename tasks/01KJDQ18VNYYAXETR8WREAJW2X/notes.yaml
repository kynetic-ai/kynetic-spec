    content: "Execution update: fixed batch input source selection so --commands uses inline mode when
      provided (including empty/whitespace values) by checking options.commands !== undefined in
      src/cli/commands/batch.ts. Added regression tests in tests/batch-exec-engine.test.ts that
      assert --commands '' and --commands '   ' return Invalid JSON and do not fall back to
      stdin-path error text. Verification: npm test -- tests/batch-exec-engine.test.ts (59 passed)
      and manual CLI check node dist/cli/index.js batch --commands '' exits 1 immediately with
      Invalid JSON."
