notes:
  - _ulid: 01KFR82AK21EPGCX8FJF092G9X
    content: >-
      Implementation notes (auto-generated from spec):


      Workflow for /reflect loop. Key differences from @session-reflect: high confidence capture
      only, MUST search existing before capturing, skip user decision step, lower volume higher
      quality. High confidence means agent-judged certainty, not quantitative threshold.



      Acceptance Criteria:

      - ac-1: Given agent identifies friction point, when before capturing, then agent MUST search
      observations, inbox, tasks for duplicates

      - ac-2: Given friction is vague or uncertain, when agent evaluates, then item NOT captured

      - ac-3: Given friction matches existing observation, when agent evaluates, then item NOT
      captured, existing reference noted

      - ac-4: Given friction is unique and high-confidence, when agent evaluates, then item IS
      captured

      - ac-5: Given workflow reaches decision step, when workflow continues, then decision step
      skipped

      - ac-6: Given workflow completes, when user interaction, then user NOT asked to confirm
      captures
    supersedes: null
    author: "@claude"
    created_at: 2026-01-24T14:55:55.490Z
  - _ulid: 01KFR84GPXMN15976ZS02D3SM4
    content: "Implementation notes: 6 ACs covering search-first, high-conf, unique, novel, skip-user,
      no-prompt. Key behavior: MUST search existing observations/inbox/tasks before capturing
      anything. High confidence means agent-judged certainty, not quantitative threshold. based_on:
      @session-reflect"
    supersedes: null
    author: "@claude"
    created_at: 2026-01-24T14:57:07.293Z
  - _ulid: 01KFRPVY6SSSV6001WN2V2379Y
    content: >-
      Created @session-reflect-loop workflow with 4 steps implementing all 6 ACs:

      - Step 1: MUST search observations/inbox/tasks BEFORE identifying (ac-1)

      - Step 2: Identify only high-confidence items (ac-2, ac-4 - concrete, systemic, clear
      cause/effect)

      - Step 3: Decision step evaluates against existing state - skips duplicates (ac-3), skips
      vague items (ac-2), captures unique high-confidence (ac-4). Added skip_user_prompt: true to
      skip user interaction (ac-5, ac-6)

      - Step 4: Automatic capture without user prompts (ac-5, ac-6)


      Workflow trigger: loop-iteration-end (for autonomous reflection in ralph loops)

      Based on: @session-reflect (interactive version)
    supersedes: null
    author: "@claude"
    created_at: 2026-01-24T19:14:34.842Z
