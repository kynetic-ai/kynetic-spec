  - _ulid: 01KPQ0QNSTDJR32FKANB48HX6P
    content: "Fix cycle 4: Addressed both blocker threads about out-of-tree .md links leading to 404s.
      Root cause: links like ../INSTALL.md from getting-started.md were left as-is in the rendered
      HTML, but those relative paths are meaningless in the built SPA. Fix: added
      resolveOutOfTreeHref() that computes the repo-root-relative path for links that escape the
      docs/ tree, and the markdown renderer now rewrites them to GitHub blob URLs (e.g.
      https://github.com/lepahc/kynetic-spec/blob/main/INSTALL.md). The repoUrl is configured in
      vite-plugin-docs and embedded in the virtual module manifest at build time. Rewritten links
      are marked as external (target=_blank). Added 6 new unit tests for resolveOutOfTreeHref and
      updated existing tests. All 8099 vitest tests pass, all 8 E2E tests pass, build succeeds.
      Re-verified all ACs."
    supersedes: null
    author: "@claude"
