  - _ulid: 01KPPSXZB9FEMD959AS1A6H6AC
    content: >-
      Fix cycle 1: Addressed all 3 review blockers.


      1. Source-scanning tests (blocker): Removed all existsSync/readFileSync-based tests that
      asserted on source file content. Replaced with behavioral tests: docs module interface tests
      (plugin pipeline e2e), filterSectionEntries tests (direct function calls with mock data),
      resolveDocsLink tests (direct function calls). Also fixed fragile JSON parsing that broke on
      semicolons in content.


      2. Sidebar showing all entries (blocker): Changed sidebar from static allEntries to reactive
      sectionEntries via getDocsSectionEntries(). Root pages see only root-level entries; nested
      pages see only same-section entries. Satisfies @docs-navigation-shape ac-1.


      3. Broken relative link resolution (blocker): Replaced naive regex with resolveDocsLink() that
      properly resolves ../ and ./ paths relative to the current doc's directory. Links outside docs
      tree return null. Extracted pure utilities into docs-utils.ts for testability.


      Re-verified all ACs (docs-reachability ac-1/2/3, docs-navigation-shape ac-1/2). All 8083 tests
      pass, build succeeds.
