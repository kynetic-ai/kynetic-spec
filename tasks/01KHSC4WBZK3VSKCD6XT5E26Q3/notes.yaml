  - _ulid: 01KHSC4WBRKJAGV9M0GD334RW8
    content: >-
      Implementation notes (auto-generated from spec):


      Make drift detection more comprehensive by including sidecar files in hash computation and
      adding a verify command for rendered skill integrity.



      Acceptance Criteria:

      - ac-1: Given a codex skill has platform_config.codex with custom settings, when
      checkPlatformSkillDrift runs for codex, then the sidecar YAML file (agents/openai.yaml)
      content is included in the drift hash

      - ac-2: Given a rendered skill file has been manually edited, when kspec skill verify runs,
      then it reports which skills have drifted from their source with actionable guidance
    supersedes: null
    author: "@claude"
    created_at: 2026-02-18T21:57:51.609Z
  - _ulid: 01KHSEF7Z1DXVC4D2P1R0H9GCJ
    content: >-
      Implementation complete:


      AC-1: Modified codex renderer in skill-render.ts to combine SKILL.md + sidecar content when
      computing drift hash. Updated both hash storage (during render) and hash checking
      (checkDrift). 3 new tests verify sidecar drift detection.


      AC-2: Added 'kspec skill verify' CLI command in skill.ts. Reports drifted skills with
      actionable guidance (render --force, diff commands). Exits non-zero when drift detected. JSON
      output supported. 3 new tests verify the command.


      Total: 6 new tests, all passing. Full suite: 2780/2780 tests pass (1 pre-existing failure in
      daemon-executable unrelated to this work).
