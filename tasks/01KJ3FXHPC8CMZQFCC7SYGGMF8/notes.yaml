  - _ulid: 01KJ3FXHPCXKGS393YJ3YK4TDW
    content: |
      Implementation notes:

      Create src/cli/commands/triage.ts following inbox.ts pattern.
      Register via registerTriageCommands(program).
      The act command dispatches on record.action: promote reuses inbox
      promote logic, delete reuses inbox delete logic, spec-gap creates
      observation, duplicate deletes inbox item, defer is a no-op transition.
      Interactive start mode uses readline prompts.
      Override subcommand updates existing record with override fields.
      Export subcommand delegates to shared formatter.
    author: "@claude"
    created_at: 2026-02-22T20:16:09.932Z
  - _ulid: 01KJ3S4ERBA3AJ4APZFKPFBYG2
    content: >-
      Implemented all triage CLI commands:


      **Commands created (src/cli/commands/triage.ts):**

      - `triage record <inbox-ref>` — Record a triage decision (ac-1, ac-11)

      - `triage list` — List triage records with filters (ac-2, ac-3)

      - `triage act <triage-ref>` — Execute triage decision (ac-4 through ac-8, ac-15, ac-16, ac-17)

      - `triage override <triage-ref>` — Override existing decision (ac-12)

      - `triage export` — Export as context markdown or JSON (ac-13, ac-14)

      - `triage start` — Interactive triage mode (ac-9, ac-10)

      - `triage get <triage-ref>` — Show record details


      **Action execution dispatch:**

      - promote: Creates task from item_snapshot

      - delete/duplicate: Deletes inbox item (prior authorization)

      - defer: No-op transition

      - spec-gap: Creates observation with item text + reasoning


      **Interactive mode:** Uses line-buffered readline for reliable piped stdin. Single rl
      interface for entire session.


      **Tests (35 passing):** All 17 ACs covered + trait ACs (json-output, error-guidance,
      filterable-list, shadow-commit, dry-run, semantic-exit-codes)


      Full test suite green (2 pre-existing failures unrelated).
    supersedes: null
    author: "@claude"
