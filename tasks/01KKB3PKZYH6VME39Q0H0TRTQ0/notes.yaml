      /sessions UI. Added GET /api/sessions/search, wired q= URL state with grouped match rendering,
      and extended CLI search to honor --status plus shared metadata narrowing before scanning
      events.jsonl. Verification: npm run build passed; npm test -- tests/session-log-search.test.ts
