  - _ulid: 01KK66DXJ7T4GQBCD7Y2B8C9E1
    content: >-
      [FIX_CYCLE: 5] Added behavior-level Playwright E2E regression test for AC-22. Two tests in
      sessions.spec.ts:

      1. 'session detail shows read-only message in static mode' — Forces static mode by
      intercepting health check (→503) and serving fake snapshot JSON. Navigates to /sessions/:id
      and verifies data-testid='session-static-message' is visible with text 'Session history is not
      included in the static export'.

      2. 'session detail does not attempt API calls in static mode' — Same static mode setup, plus
      tracks whether /api/sessions/** is ever called (proves loadSession() early-returns without
      fetching).

      These are true behavior-level tests: real SvelteKit app, real mode detection fallback, real
      route rendering in the browser.
    supersedes: null
    author: "@claude"
