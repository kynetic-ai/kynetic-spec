notes:
  - _ulid: 01KXNNC63AA7QNSQWPRSYHDP5Z
    content: "Approach: add one real-daemon cross-surface fixture using
      createTestDaemonProject/startTestDaemon with registered teardown, boundedDaemonFetch,
      explicit-cwd kspec, and captured lifecycle events. Reuse the existing public/shared schemas
      and CLI boundary rather than duplicating validators. Cover exact canonical global/task
      transitions, alias canonicalization, public snake-case versus internal/CLI hybrid rows,
      cleanup aggregate variants, scope gating, closed failures, prompt/session branches, and event
      correspondence; extend the existing focused files only where their owner-level matrices need a
      missing behavioral case. Edge cases: conditional cleanup error fields, canonical ULID
      ordering/uniqueness/counts, global versus task cleanup isolation, mutation success without
      admission, invalid transitions/retries, raw-field suppression. Test plan: focused integration
      file plus the three existing lifecycle suites, then all project gates. UI lifecycle conversion
      is owned by the pending UI task and is not yet present on the integration target;
      re-check/rebase before final verification."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-16T14:30:32.298Z
  - _ulid: 01KXNPP8PFENQ4JDZZXGQ5G4QM
    content: "Implemented the real-daemon API/CLI/event surface suite and found/fixed a missing public
      active_count projection. The fixture uses a real shadow worktree, ephemeral daemon endpoint,
      bounded fetch, explicit-cwd built CLI, and WebSocket events. It covers global/task
      transitions, alias canonicalization, idle/pending/failed/mixed cleanup rows, nested
      matching-task cleanup, unrelated-scope gating, exact public snake/internal-CLI hybrid casing,
      invalid transition/current status, injected commit failure, and sanitized event parity.
      Existing API/CLI/event suites now assert active_count and all 17 unique closed failure codes.
      Focused lifecycle slice: 138/138 passed. Full npm test and shard1 reported every selected file
      green but reproduced the separately tracked post-green runner teardown hang and required
      interruption; no test failure was reported. UI camel conversion remains owned by
      @task-ui-dispatch-lifecycle-controls, which is currently needs_work and absent from this
      integration target, so this branch does not import or duplicate that unreviewed converter."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-16T14:53:31.215Z
  - _ulid: 01KXNQJWHR8A4VPAS4JMRDPQZM
    content: "Verification complete. Cross-surface matrix: API global start => HTTP 200 + start_applied;
      CLI global pause/resume/stop => exit 0 + pause_applied/resume_applied/stop_applied; API task
      pause by slug => HTTP 200 with canonical task ID + task pause_applied; CLI task resume/stop =>
      exit 0 + task resume_applied/stop_applied; API invalid transition => HTTP 409 + failed
      invalid_transition; injected commit failure => HTTP 503 + failed control_commit_failed. Owner
      suites prove all 17 closed errors map uniquely through API responses, CLI exit 3, and
      failed-event error codes. Public status is snake_case, internal/CLI status preserves the
      documented hybrid casing, and cleanup aggregates were verified for all-pending, all-failed,
      mixed, nested matching, matching-task rejection, and unrelated-task allowance. Full CI suite:
      461 files passed, 10,853 tests passed, 31 skipped; all quality and kspec validation gates
      passed."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-16T15:09:09.048Z
