  - _ulid: 01KHSJBVB8HE36PBE5JGYQ6K6B
    content: >-
      Implementation complete:


      AC-1: skill.ts (2349 lines) split into:
        - skill-crud.ts (931 lines): list, add, get, set, delete, import + formatting/frontmatter helpers
        - skill-install.ts (495 lines): install-core, update + template loading/version helpers
        - skill-diff.ts (992 lines): render, status, diff, verify + related types/helpers
        - skill.ts (54 lines): thin orchestrator that imports and delegates

      AC-2: Extracted renderSkillBase() in skill-render.ts — shared logic for content loading,
      frontmatter stripping, idempotency check, file write, hash storage, and supporting dir copy.
      Both Claude Code and Codex renderers now use it via config objects, eliminating ~100 lines of
      duplication.


      AC-3: skill.ts re-exports all previously-exported symbols (getExpectedRenderedContent,
      generateUnifiedDiff, loadCoreSkillsManifest, loadCoreSkillContent, getKspecPackageVersion,
      isKspecManaged, KSPEC_MANAGED_MARKER, renderClaudeCodeSkill). All 221 skill tests pass.
      setup.ts imports still work.
    supersedes: null
    author: "@claude"
    created_at: 2026-02-18T23:46:31.400Z
