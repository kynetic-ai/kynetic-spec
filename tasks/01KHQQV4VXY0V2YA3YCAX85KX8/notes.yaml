    content: >-
      Implementation notes (auto-generated from spec):


      Split the 2365-line skill.ts monolith into focused modules and extract shared renderer logic
      to reduce duplication between platform renderers.



      Acceptance Criteria:

      - ac-1: Given the skill command implementation, when reviewing the file structure, then
      skill.ts is split into focused modules (skill-crud.ts, skill-install.ts, skill-diff.ts or
      similar)

      - ac-2: Given the Claude Code and Codex renderers, when reviewing skill-render.ts, then shared
      render logic (content loading, hash check, idempotency, file write) is extracted into a base
      function

      - ac-3: Given external code importing from skill.ts, when building the project, then
      re-exports maintain backward API compatibility
