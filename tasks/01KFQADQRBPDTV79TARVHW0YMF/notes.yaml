    content: >-
      Implementation analysis:


      WebSocket project binding requires:

      1. Add projectPath field to ConnectionData interface (types.ts)

      2. Extract X-Kspec-Dir from upgrade request headers in server.ts ws.open()

      3. Use ProjectContextManager.getProject() to validate/register project

      4. Handle default project fallback (ac-22) and rejection (ac-23)

      5. Store projectPath in ws.data for connection lifetime

      6. Update pubsub.broadcast() to filter by projectPath

      7. Update PubSubManager to track project→connections mapping


      Tests already exist in daemon-websocket.test.ts (ac-21, ac-21b, ac-22, ac-23, ac-18).


      Key challenge: Elysia WebSocket upgrade doesn't expose headers in open() hook - need to
      extract from underlying request during handshake. May need to use beforeHandle or headers
      property.
