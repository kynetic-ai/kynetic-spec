description: |-
  Implement WebSocket project binding during connection handshake.

  ## Implementation Notes
  - Read X-Kspec-Dir header during upgrade handshake
  - Store project path in connection state (PubSubManager session data)
  - Handle default project fallback
  - Reject connections without project when no default (close code 4000)

  ## Files to Modify
  - packages/daemon/src/websocket/handler.ts: Extract header during connection
  - packages/daemon/src/websocket/pubsub.ts: Add projectPath field to session state
  - WebSocket upgrade in Elysia provides access to request headers

  ## AC Coverage
  ac-21, ac-21b, ac-22, ac-23

  ## Dependencies
  - Task: ProjectContextManager implementation
  - Task: WebSocket connection binding tests (tests first)
