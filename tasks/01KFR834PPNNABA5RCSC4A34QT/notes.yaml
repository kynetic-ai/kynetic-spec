notes:
  - _ulid: 01KFR834PN2051ERSW65X2443X
    content: >-
      Implementation notes (auto-generated from spec):


      Ralph can spawn ACP subagents for dedicated tasks (e.g., PR review). Subagents are separate
      Claude Code processes with focused prompts. Subagents run sequentially (ralph waits for
      completion).



      Acceptance Criteria:

      - ac-1: Given ralph needs subagent, when spawn initiated, then new ACP process started with
      dedicated prompt

      - ac-2: Given subagent spawned, when prompt provided, then prompt includes task ref, skill to
      invoke (/pr-review @task), and context

      - ac-3: Given subagent running, when ralph behavior, then ralph waits for subagent completion
      before continuing

      - ac-4: Given subagent runs, when display, then subagent output rendered same as main agent
      (single stream)

      - ac-5: Given subagent completes, when signaling, then task status change
      (completed/needs_review) indicates outcome

      - ac-6: Given multiple pending_review tasks, when spawning, then processes one at a time
      sequentially

      - ac-7: Given subagent runs, when resource management, then respects ralph's --max-retries and
      failure limits
    supersedes: null
    author: "@claude"
    created_at: 2026-01-24T14:56:22.230Z
  - _ulid: 01KFR86FVWNH9072WQMETHJKXC
    content: "Implementation notes: 7 ACs covering spawn, prompt, sequential, output, task-signal,
      one-at-a-time, resource. True ACP subagent (separate Claude Code process). SEQUENTIAL
      execution - ralph WAITS for subagent completion before continuing. Output rendered in same
      stream as main agent (single display). Prompt includes /pr-review @task-ref to trigger skill
      invocation."
    supersedes: null
    author: "@claude"
