  - _ulid: 01KFT6V2XK59SZ7W37HFX9AFB0
    content: |-
      Implemented subagent spawning for ralph:

      1. Created src/ralph/subagent.ts with:
         - SubagentContext type (ac-10)
         - buildSubagentPrompt() - includes task ref, skill invoke, context
         - runSubagent() - spawns ACP process, handles timeout, waits for completion

      2. Added createPrefixedRenderer() to cli-renderer.ts (ac-11)

      3. Modified ralph.ts:
         - processPendingReviewTasks() - processes pending_review before main iteration (ac-8)
         - buildSubagentContext() - loads task/spec details
         - markTaskNeedsReview() - handles timeout case (ac-9)

      4. Added 10 unit tests for subagent module

      All 11 ACs covered by implementation.
