  - _ulid: 01KKCEFY92JAJKT9DJ5VFARHEF
    content: >-
      ## Implementation Guide


      ### Covers ACs: ac-daemon-identity, ac-dispatch-cwd, ac-dispatch-conflict


      ### 1. X-Kspec-Dir header migration in src/cli/commands/agent.ts


      Change ALL X-Kspec-Dir header assignments from ctx.rootDir to ctx.projectRoot:

      - Line ~455-456 (agent status)

      - Line ~553-554 (dispatch start)

      - Line ~609-610 (dispatch stop)

      - Line ~665-666 (dispatch status)

      - Line ~842 (dispatch watch WebSocket projectDir)


      Also add X-Kspec-Cwd header when in worktree:

      ```

      if (ctx.rootDir !== ctx.projectRoot) {
        headers["X-Kspec-Cwd"] = ctx.rootDir;
      }

      ```


      ### 2. X-Kspec-Dir migration in src/cli/commands/task.ts


      postDispatchEvent() at line ~60-90 builds headers from opts.projectPath.

      Change all 6 callers to pass ctx.projectRoot instead of ctx.rootDir:

      - Line ~1314 (task start)

      - Line ~1538 (task submit)

      - Line ~1694 (task block)

      - Line ~1772 (task reset)

      - Line ~1837 (task complete)

      - Line ~1896 (task cancel)


      ### 3. Batch root in src/cli/batch-exec.ts


      Line ~777: change process.env.KSPEC_BATCH_PROJECT_ROOT = ctx.rootDir to ctx.projectRoot


      ### 4. Hash path fix in src/cli/commands/agents.ts


      Line ~345: change path.join(ctx.rootDir, ".kspec", HASH_FILE) to path.join(ctx.specDir,
      HASH_FILE)


      ### 5. Daemon meta route in packages/daemon/src/routes/meta.ts


      Line ~205: change root_dir: ctx.rootDir to root_dir: ctx.projectRoot (or expose both)


      ### 6. Dispatch cwd support in packages/daemon/src/routes/agent-dispatch.ts


      Apply to BOTH start surfaces:

      - Legacy: POST /api/agent/dispatch/start (~line 136+)

      - Unified: POST /api/agent/dispatch with action: "start" (~line 170+)


      Read X-Kspec-Cwd header. Validate:

      - Must be absolute path

      - Must share same git-common-dir as the project

      - If engine already running with different cwd: return 409 Conflict


      Pass cwd to DispatchEngine constructor.


      ### Tests


      - Verify dispatch events from worktree use projectRoot for X-Kspec-Dir

      - Verify X-Kspec-Cwd is sent only when rootDir !== projectRoot

      - Verify 409 Conflict when dispatch start with different cwd than running engine

      - Verify agent cwd is the worktree root in spawned invocations
    supersedes: null
    author: "@claude"
