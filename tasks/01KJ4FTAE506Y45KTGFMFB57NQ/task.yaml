title: Redesign web UI holistically — interactive spec/design session
type: spike
description: "The current web UI has fundamental issues beyond individual bugs: sidebar nav links
  are dead buttons, SPA fallback routes must be manually maintained, daemon test coverage is
  static-only, types are duplicated between web-ui and schema. Before fixing piecemeal, do a
  holistic redesign session to: 1) Inventory what currently exists and works. 2) Define what the web
  UI should actually be. 3) Choose a component architecture that works. 4) Spec out the redesigned
  UI with acceptance criteria. 5) Create a plan with prioritized tasks. This should be an
  interactive session with the user."
