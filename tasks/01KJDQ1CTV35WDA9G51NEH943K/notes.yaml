  - _ulid: 01KJDQ9E2V7MF4XRKW0MQQC59X
    content: >-
      ENRICHMENT — Standalone context for this task:


      **What**: When agents start a task that has a `plan_ref` field, they should automatically
      retrieve the plan to get implementation notes, algorithm details, and design context.
      Currently the task-work skill and task-work-loop workflow do not mention checking plan_ref.
      Plans are the intended home for rich implementation context rather than cramming it into task
      descriptions or notes.


      **Where**: 

      - `templates/skills/task-work/SKILL.md` — Step 3 "Start Task" section (line 86-90) needs a
      substep: "If task has plan_ref, run `kspec plan get @plan-ref` to read implementation notes"

      - Task-work-loop workflow definition in `.kspec/` (the workflow YAML) — add the same step

      - `src/cli/commands/task.ts` — the `task get` output already shows `plan_ref` when present;
      the `task start` command could optionally print a hint like "This task has a plan: run `kspec
      plan get @plan-ref` for implementation context"


      **How**:

      1. Update `templates/skills/task-work/SKILL.md` step 3 to add: "If `kspec task get @ref` shows
      a `plan_ref`, run `kspec plan get @plan-ref` to read implementation notes and design context
      before starting work."

      2. Update the task-work-loop workflow to include the same check in its automated flow

      3. Optionally enhance `kspec task start` in `src/cli/commands/task.ts` to print an info
      message when the started task has a non-null plan_ref

      4. Run `kspec agents generate` after template changes


      **Done when**:

      - The task-work skill documents checking plan_ref when starting tasks

      - The task-work-loop workflow includes plan context retrieval

      - Agents following the skill will automatically get plan context when a task has plan_ref

      - `kspec agents generate` produces updated kspec-agents.md
    supersedes: null
    author: "@claude"
    created_at: 2026-02-26T19:37:23.804Z
