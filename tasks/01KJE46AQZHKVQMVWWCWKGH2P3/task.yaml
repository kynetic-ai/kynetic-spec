title: Make git root/shadow detection resilient to restricted runtimes
type: task
description: 'Issue: In the Codex execution runtime, Node shell-based git calls (execSync with
  string commands like "git rev-parse --show-toplevel") can fail with spawnSync /bin/sh EPERM even
  when git itself is available. Impact: getGitRoot() and related checks return false negatives,
  kspec treats repo as non-git/non-shadow, and writes can fall back to root-level files (for example
  project.tasks.yaml) instead of .kspec worktree paths. Findings: (1) kspec shadow status returned
  Not a git repository in this runtime while user environment returned healthy shadow JSON. (2)
  Running getGitRoot() through parser returned null before fix. (3) Task add created an untracked
  root project.tasks.yaml due to shadow detection failure. Why: the implementation depended on shell
  invocation semantics instead of direct process execution, which is fragile in sandboxed/restricted
  runtimes. Proposal: standardize git invocations in detection-critical paths to direct argv-based
  spawn/execFile style calls, add regression tests that simulate shell-unavailable execution
  behavior, and audit other shell-form git calls that can influence path resolution.'
