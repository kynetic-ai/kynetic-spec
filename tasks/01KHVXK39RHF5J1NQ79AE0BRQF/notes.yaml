  - _ulid: 01KHVXK39RNBWJ4C1YJKXGNASB
    content: |
      Implementation notes:

      Wire ctx.config.validation into ValidateOptions in src/parser/validate.ts.
      The validate command handler in src/cli/commands/validate.ts merges CLI flags
      over config values before calling validate(). Current ValidateOptions has boolean
      toggles — map strict_refs to the existing strictness behavior and add
      require_acceptance as a new check that promotes completeness warnings to errors.
    author: "@claude"
    created_at: 2026-02-19T21:41:12.121Z
  - _ulid: 01KHWEGVDQXCS1BF5H9AV9TX62
    content: >-
      Implementation complete. Changes:


      1. **Config schema updated** (src/parser/config.ts):
         - Changed validation config from strictness/warn_unknown_fields to strict_refs/require_acceptance
         - strict_refs defaults to true (preserves existing behavior - dangling refs are errors)
         - require_acceptance defaults to false (preserves existing behavior - missing AC is warning)

      2. **Validate function updated** (src/parser/validate.ts):
         - Added strictRefs and requireAcceptance to ValidateOptions
         - When strictRefs=false, demotes not_found ref errors to warnings
         - When requireAcceptance=true, promotes missing_acceptance_criteria warnings to errors

      3. **CLI wiring** (src/cli/commands/validate.ts):
         - Passes ctx.config.validation.strict_refs to validate()
         - Passes ctx.config.validation.require_acceptance to validate()
         - CLI --strict flag still overrides config for orphans/staleness

      4. **Tests added** (tests/parser/validate-config.test.ts):
         - 7 tests covering all 4 ACs
         - Tests for require_acceptance behavior (AC-1)
         - Tests for strict_refs behavior (AC-2, AC-3)
         - Tests for CLI override behavior (AC-4)
         - Tests for combined settings

      5. **Existing tests updated** (tests/parser/config.test.ts):
         - Updated to use new field names
         - Updated default assertions

      All 2885 tests pass (1 pre-existing failure in daemon-executable.test.ts unrelated to this
      change).
