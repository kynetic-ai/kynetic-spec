  - _ulid: 01KHJ13EHA9S9BJTFWS3GEP41A
    content: >-
      Implemented Multi-Platform Render CLI with all 7 ACs:


      1. AC-1: Skills with platforms [claude-code, codex] now render to both platforms

      2. AC-2: Skills with only codex platform render only to codex (not hardcoded to claude-code)

      3. AC-3: kspec skill status shows per-platform rows with Platform column

      4. AC-4: --output-dir flag overrides platform default output directory

      5. AC-5: --clean operates per-platform in each output directory

      6. AC-6: Render table output includes Platform column ([claude-code], [codex])

      7. AC-7: Unregistered platforms show warning and skip that platform


      Added 18 tests in tests/multi-platform-render-cli.test.ts covering all ACs plus edge cases
      (empty platforms, dry-run with multi-platform, force with drift on multi-platform).


      All 74 skill-rendering tests + 77 skill-cli tests continue to pass.
