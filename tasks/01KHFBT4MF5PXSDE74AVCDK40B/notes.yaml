  - _ulid: 01KHG3S7608E3XY04Z19NH4EEV
    content: |-
      Implemented kspec init --setup flag:

      - Added --setup option to init command in init.ts
      - Created runSetupPipeline function in setup.ts to orchestrate the full setup flow
      - When --setup is passed after successful shadow branch init:
        1. Core skills are installed (via installCoreSkillsForSetup)
        2. Hooks are installed (Claude Code only)
        3. Skills are rendered to .claude/skills/
        4. kspec-agents.md is generated

      - Without --setup, behavior is unchanged (shows next steps + tip about --setup)
      - Added 9 tests covering all 4 ACs in tests/init-setup-integration.test.ts
    supersedes: null
