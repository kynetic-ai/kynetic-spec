      Execution context:

      - Background: Prevent lost updates from stale object snapshots during plan/inbox writes.

      - Scope: Add atomic mutate helpers for plan and inbox item updates; migrate CLI/task write
      paths that currently replace full objects.

      - Files: parser/store and command/task mutation call sites related to plan/inbox updates.

      - Verification: targeted tests for stale-snapshot safety plus full test suite and kspec
      validate.
