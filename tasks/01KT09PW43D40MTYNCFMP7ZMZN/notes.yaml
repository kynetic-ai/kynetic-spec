  - _ulid: 01KT0BR1STMGKK9ZHYRW1MCQE2
    content: >-
      Root cause: the shared filesystem lock /tmp/kspec-test-daemon-port-start.lock (introduced in
      commit 6076c6f) had no stale-holder detection. A SIGKILL/OOM that killed a prior test runner
      mid-startup left the directory behind, and every subsequent acquirer blocked for the full
      PORT_START_LOCK_MIN_TIMEOUT_MS=120s default. With a vitest test timeout of 5s, the failures
      surfaced as deterministic timeouts in the two acquirePlaywrightFixtureResources setup-failure
      cases and the nine startTestDaemon cases — exactly the cluster reported in the review
      snapshot. Reproduced locally by 'mkdir /tmp/kspec-test-daemon-port-start.lock' + npm test (90s
      timeout, same two failures).


      Fix: switched from mkdir-based to file-based atomic acquisition (writeFileSync wx) with owner
      metadata (pid, hostname, startedAt). The contention loop falls into a bounded stale-recovery
      branch past a 100ms grace window: read the recorded owner, check process.kill(pid, 0), reclaim
      if dead. The recovery also handles legacy mkdir-only directory leftovers via rmSync(force,
      recursive). Best-effort exit/signal handlers release this process's held locks on normal
      teardown; SIGKILL still falls through to the recovery branch, but no longer blocks downstream
      runs.


      Added spec AC ac-shared-startup-lock-recovers-from-crashed-holder to
      @daemon-test-teardown-boundedness covering this contract. Three behavioral regressions in
      tests/helpers/daemon.test.ts pin the new behavior via an isolated __testLockPath seam (dead
      PID file → reclaim, legacy directory leftover → reclaim, live holder PID → timeout, never
      evict).


      Quality gates: format:check green, lint 0 errors, typecheck green, full npm test green (2665
      suites / 10156 tests). Repro'd that the originally failing tests pass under both 'no stale
      lock' and 'stale legacy directory leftover' starting states.
    supersedes: null
