      tooltips).

      - PASS: @web-dashboard completeness warnings resolved — ac-1, ac-2, ac-3, ac-11, ac-12, ac-13,
      ac-14 annotations added.

      - PASS: All tests pass (4029/4032, 3 pre-existing failures in codex config and session-start
      timeout).

      - PASS: No hardcoded Tailwind colors — uses design tokens correctly.

      - PASS: Svelte 5 patterns only ($state/$derived/$effect).

      - PASS: kspec validate shows no new warnings for this task's specs.
