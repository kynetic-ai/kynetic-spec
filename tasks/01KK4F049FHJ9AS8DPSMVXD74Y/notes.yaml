      the Start Task button entirely in read-only SPA mode, which conflicts with @gh-pages-export
      ac-16 (button should be disabled with explanatory tooltip).

      - MUST-FIX: `kspec validate --completeness -v --warnings-ok` reports warnings for
      @web-dashboard: uncovered ACs ac-1, ac-2, ac-3, ac-11, ac-12, ac-13, ac-14 (see
      /tmp/kspec-completeness.txt lines 363-364). Per review checklist, warnings for this spec are
      blocking.

      - Regression check: `npm test` (root) and `packages/web-ui npm test` both passed.
