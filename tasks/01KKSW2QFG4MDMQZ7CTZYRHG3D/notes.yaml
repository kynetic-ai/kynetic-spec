  - _ulid: 01KKSW9SECT2WB0E96YDG2BG99
    content: >-
      Execution context:

      - Background: The dispatch engine can violate max_concurrent because _drainQueues() is called
      directly from 5 call sites, bypassing _serializedDrain(). Only the coalesced timer path uses
      _serializedDrain().

      - Scope: Route all _drainQueues() calls through _serializedDrain() so drain execution is
      always serialized. The 5 call sites are: handleStateChange (line 844), _bootstrap (line 1008),
      _reconcile (line 1044), retry wake-up (line 2072), post-invocation re-eval (line 2165).

      - Files: src/agent-runtime/dispatch.ts, tests/agent-dispatch-engine.test.ts

      - Verification: Existing tests pass + new test proving concurrent drains are serialized
    supersedes: null
    author: "@claude"
    created_at: 2026-03-15T23:11:33.324Z
  - _ulid: 01KKSX1VH24QWTE5MC8H7J4DCC
    content: "Submitted PR #887. Fixed by routing all 5 direct _drainQueues() call sites through
      _serializedDrain(): handleStateChange (coalesceWindowMs=0), _bootstrap, _reconcile, retry
      wake-up setTimeout, and post-invocation re-evaluation. Added 4 tests covering AC-27 and AC-9.
      Full test suite passes (5475/5475)."
