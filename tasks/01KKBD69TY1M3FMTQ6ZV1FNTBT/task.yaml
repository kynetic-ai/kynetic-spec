description: >-
  Fix kspec agent run --task to respect agent prompt_template instead of injecting a hardcoded work
  prompt.


  Current behavior: agent run --task always uses a hardcoded task-work prompt, ignoring the agent
  definition prompt_template. This causes review agents to drift into implementation mode.


  Fix: In src/agent-runtime/invocation.ts or the agent run CLI handler, use the agent
  prompt_template when available, falling back to the default only when no template is defined. Also
  address adapter-safe prompt handling for codex-acp runs.
