title: Purge unrecoverable workspace records so non-terminal tasks can be re-provisioned
type: task
description: >-
  ## What


  The dispatch scheduler permanently blocks non-terminal tasks from being provisioned when a
  workspace registry record exists but is unrecoverable. The task is enqueued on every
  reconciliation cycle, evaluated for queue eligibility, found unhealthy, and discarded —
  indefinitely.


  ## Why


  Workspace provisioning is a two-phase operation: (1) write a registry record to the shadow branch,
  (2) create the canonical git branch and worktree. If the agent session fails between phases — for
  example, the spawned process crashes, times out, or hits a resource error before running `kspec
  task branch` — the registry record persists but the canonical branch never exists.


  The queue eligibility check in `_workspaceCandidateHealth` uses a binary branch: if a workspace
  record exists, eligibility requires `health.healthy === true`. If the record doesn't exist, the
  task is eligible for fresh provisioning. There is no third path for "record exists but is
  unrecoverable." The existing discovery fallback only runs for resumable task states (in_progress,
  pending_review, needs_work) — not for pending tasks entering the queue via task.ready events.


  This means any non-terminal task whose workspace was partially provisioned (record written, branch
  never created) is permanently stuck. Each reconciliation cycle re-enqueues and re-discards it,
  producing repeated log noise with no path to resolution.


  ## How


  When the scheduler evaluates queue eligibility for a task with an existing but unhealthy workspace
  record:


  1. After all recovery paths have been exhausted (local branch check, remote branch fallback,
  submission linkage adoption), and the workspace remains unrecoverable (health status invalid with
  missing canonical branch or equivalent).

  2. If the task is in a non-terminal state (not completed, not cancelled).

  3. Purge or reset the stale registry record so the task becomes eligible for fresh provisioning on
  the next dispatch cycle.


  The fix should be in the `_workspaceCandidateHealth` method or the reconciliation path that feeds
  it. The key invariant: a stale workspace record must not permanently prevent a live task from
  being dispatched. The existing ac-5 correctly detects the unhealthy state; this work closes the
  gap between detection and resolution.


  Spec coverage: @dispatch-workspace-registry ac-14.
