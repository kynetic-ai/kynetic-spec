  - _ulid: 01KNN557ZEEMM62WS24ZDM1AH5
    content: "Fix cycle 1: Addressed review blocker about text-mode response parity for review commands.
      Added CommandExitError re-throw guards to all 14 catch blocks in review.ts so intercepted
      daemon exits propagate cleanly without producing wrapper error lines (e.g. 'Failed to get
      review'). Added behavioral test verifying text-mode 'review get @does-not-exist' produces
      matching stderr between daemon API and direct CLI. All 7642 tests pass (2096 suites)."
    supersedes: null
