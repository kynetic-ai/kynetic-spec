notes:
  - _ulid: 01KNN2FD3AMEH0Q7RMR4DHACFT
    content: "Approach: replace the daemon command route's string-based process.exit sentinel with a
      typed error shared with command execution, following the existing BatchExitError pattern.
      Remove the review.ts rethrow shim once command catch blocks can safely re-emit typed exit
      errors. Edge cases: nested command catch blocks that call process.exit again, direct daemon
      command exits, and concurrent command requests using request-scoped async context. Test plan:
      extend daemon command API coverage for direct exits, review-command catch/re-exit behavior,
      and concurrent requests preserving independent exit codes/stderr."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T22:54:40.235Z
  - _ulid: 01KNN2PEHBXH1PN31NVFQMMW6D
    content: Implemented typed command-exit handling in the daemon route and removed the review.ts
      sentinel rethrow workaround. Rebuilt dist outputs so daemon tests exercise the new
      CommandExitError path instead of stale compiled code.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T22:58:31.083Z
  - _ulid: 01KNN2S1TK7RHCKV6TR7ZGJHBV
    content: Adjusted the daemon interceptor to preserve the first request-scoped exit code across
      nested catch/re-exit paths. This avoids touching every command file while still preventing
      helper-triggered NOT_FOUND/VALIDATION exits from collapsing to generic ERROR during daemon
      execution.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T22:59:56.371Z
