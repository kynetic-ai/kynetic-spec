  - _ulid: 01KNN2FD3AMEH0Q7RMR4DHACFT
    content: "Approach: replace the daemon command route's string-based process.exit sentinel with a
      typed error shared with command execution, following the existing BatchExitError pattern.
      Remove the review.ts rethrow shim once command catch blocks can safely re-emit typed exit
      errors. Edge cases: nested command catch blocks that call process.exit again, direct daemon
      command exits, and concurrent command requests using request-scoped async context. Test plan:
      extend daemon command API coverage for direct exits, review-command catch/re-exit behavior,
      and concurrent requests preserving independent exit codes/stderr."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T22:54:40.235Z
