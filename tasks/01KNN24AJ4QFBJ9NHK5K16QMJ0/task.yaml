title: Replace process.exit string sentinel with typed error class
type: task
description: >-
  The command API route intercepts process.exit via a global replacement at module load time that
  throws a string sentinel (__KSPEC_COMMAND_EXIT__:N). Only review.ts has a
  rethrowInterceptedProcessExit() guard. The 40+ other command files with catch (err) { error(...);
  process.exit(EXIT_CODES.ERROR) } swallow the sentinel, produce spurious stderr, and lose the
  original exit code.


  Why: The string sentinel is not identifiable by catch blocks that check err instanceof Error. The
  existing ALS-based approach (checking commandExecutionStorage.getStore() before throwing) is
  correct for concurrency — it is scoped to command execution context without global state swaps.
  The problem is solely that the thrown value is a string, which catch blocks treat as an unexpected
  error.


  What: Replace the string sentinel with a typed error class (e.g. CommandExitError extends Error)
  that carries the exit code. The module-level process.exit override stays — it is the correct
  concurrency-safe approach since it checks ALS context before acting. Only the thrown value changes
  from a string to a class instance. Update the catch block in executeCommand() to check err
  instanceof CommandExitError (matching the BatchExitError pattern). Remove the
  rethrowInterceptedProcessExit() workaround in review.ts since it is no longer needed — command
  catch blocks that do catch (err) { ... process.exit(...) } will trigger the exit override again,
  throwing another CommandExitError that propagates correctly.


  How: Define CommandExitError extending Error with a code: number field, either in
  src/cli/batch-context.ts alongside BatchExitError or as a new export. In the module-level
  process.exit override in packages/daemon/src/routes/command.ts, throw new CommandExitError(code)
  instead of the string sentinel. In executeCommand's catch block, add if (err instanceof
  CommandExitError) { exitCode = err.code; } alongside the existing BatchExitError check. Remove
  rethrowInterceptedProcessExit from src/cli/commands/review.ts. Add tests verifying: command that
  calls process.exit produces correct exit code, catch blocks in command handlers do not swallow
  CommandExitError, concurrent commands both get correct exit codes.
