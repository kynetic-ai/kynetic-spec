  - _ulid: 01KGTNVDT5V9PH6K0BK1HMSXQQ
    content: 'Add Common YAML Issues section to /spec-plan skill docs. Key gotcha: embedded double
      quotes in scalar values break the parser (e.g. when: "kspec foo" is run). Recommend avoiding
      quotes in AC given/when/then or using YAML block scalars. Could also improve
      parsePlanDocument() error message to suggest fixes. Encountered during session-log-analysis
      plan authoring.'
    supersedes: null
    author: "@claude"
