  - _ulid: 01KRCRZ78YM77YNEXXVTVHCA8E
    content: "Spec-only update for @daemon-test-guardrail-precision. Added five new ACs via kspec item
      ac add: ac-cleanup-operation-terminates-daemon (cleanup must terminate/stop the daemon),
      ac-cleanup-probes-do-not-count (liveness probes, docs, non-daemon helpers, and non-terminating
      signals do not satisfy cleanup), ac-cleanup-helper-origin-is-trusted (locally-defined helpers
      with daemon-cleanup-like names do not count), ac-cleanup-registration-is-test-scoped
      (process-lifecycle/global hooks are not per-test scoped cleanup), and
      ac-implicit-autostart-cleanup-before-observation (implicit auto-start via CLI followed by
      observation before cleanup is unsafe). Used exact behavioral wording from the task
      description; no file names or AST predicate names encoded in the ACs. Set status to
      in_progress with --no-cascade. Verified all five new AC IDs appear once via kspec item get.
      kspec validate --refs --warnings-ok passes (existing unrelated deprecated-ref warnings only).
      Implementation tasks live in the sibling derived tasks under
      @plan-daemon-test-cleanup-contract-hardening."
