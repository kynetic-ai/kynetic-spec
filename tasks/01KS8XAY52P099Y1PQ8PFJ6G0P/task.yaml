_ulid: 01KS8XAY52P099Y1PQ8PFJ6G0P
slugs:
  - task-folder-backed-plan-storage-manager-1
  - task-folder-backed-plan-storage-manager
title: Convert plan persistence to a folder-backed storage manager
type: task
description: >
  What:

  - Introduce a plan storage manager/backing layout using `.kspec/plans/<plan-ulid>/plan.md`,
  `plan.yaml`, optional `notes.yaml`, `resources.yaml`, and `resources/`.

  - Keep `.kspec/project.plans.yaml` as a lean index with ULID, slugs, title, status, source path,
  module, branch, derived refs, timestamps, and bounded resource summaries.

  - Keep `loadPlans`, `findPlanByRef`, `savePlan`, `mutatePlanAtomically`, and `deletePlan` consumer
  semantics stable while moving physical reads/writes behind the manager.

  - Preserve unknown files in plan directories and delete owned directories/resources when deleting
  a plan.

  - Add exactly `kspec plan rebuild-index` with `--dry-run`, `--repair`, `--force`, and `--json`
  flags. Default/no flag validates drift and exits nonzero if drift exists without writing.
  `--dry-run` prints the same drift summary and never writes. `--repair` rewrites
  `.kspec/project.plans.yaml` from plan folders. `--force` is accepted only with `--repair` and
  permits dropping stale index entries whose entity folders are missing; without `--force`, missing
  folders are a conflict and no files are written.

  - Define `kspec plan rebuild-index --json` output as `{ "domain": "plans", "status":
  "clean"|"drift"|"repaired"|"blocked", "dry_run": boolean, "repair": boolean, "force": boolean,
  "summary": { "folders": number, "index_entries": number, "added": number, "updated": number,
  "removed_stale": number, "conflicts": number }, "changes": [{ "kind":
  "add"|"update"|"remove_stale", "ref": string, "path": string }], "conflicts": [{ "code": string,
  "ref": string|null, "path": string|null, "message": string }] }`. JSON exit codes are 0 for
  `clean` or successful `repaired`, 1 for `drift` when not repaired, and 2 for `blocked` conflicts.

  - When the manager sees old/missing/partial storage markers, raise the shared entity-storage
  incompatibility errors from @task-entity-storage-version-compatibility-gates-1 instead of
  dual-reading or silently migrating.


  Why:

  - Plan markdown and supporting research artifacts will grow; storing all plan content and future
  resources inline in one YAML file makes list/cache operations heavier and makes resource ownership
  unclear.


  How:

  - Reuse the task split patterns: centralized path helpers, lean index projection, authoritative
  detail files, raw-shape migration helpers, buffer-aware writes, and single shadow commits for
  multi-file mutations.

  - Keep API/shared `PlanDetail.content` available by loading `plan.md` during detail reads.

  - Treat `plan.md` as authoritative when index/core metadata and document content disagree.


  Testing:

  - Add plan storage unit tests for create/list/detail/update/delete, owned resource cleanup on plan
  delete, unknown file preservation, content sidecar authority, index projection, rebuild drift
  detection, `--repair`, `--force` stale-entry handling, and incompatibility errors for old or
  partial layouts.

  - Run existing plan parser/import/derive tests to prove consumer semantics did not change.


  Covers: @folder-backed-plan-storage-1 ac-plan-document-sidecar-is-authoritative,
  ac-plan-metadata-sidecar-is-authoritative, ac-plan-index-has-bounded-projection,
  ac-plan-delete-removes-owned-folder, @trait-folder-backed-entity-1 ac-entity-has-ulid-directory,
  ac-index-excludes-heavy-detail-bytes, ac-unknown-files-preserved, ac-index-rebuilds-from-folders,
  @trait-entity-scoped-local-resources-1 ac-resource-delete-follows-owner-delete
