notes:
  - _ulid: 01KSB8RPWA3CRX4K5NMR30JM7W
    content: >-
      Approach:


      1. Layout: .kspec/plans/<plan-ulid>/{plan.yaml, plan.md, notes.yaml?, resources.yaml?,
      resources/?}; lean index at .kspec/project.plans.yaml.


      2. New module: src/parser/plan-storage-manager.ts implements folder-backed CRUD via the shared
      folder-backed-entity helpers (layout, listEntityDirs, mergePreservingRawShape,
      readIndexEntries/writeIndexEntries, rebuildEntityIndex). plan.md is authoritative for content;
      plan.yaml stores all other identity/metadata; notes.yaml is sidecar. resources.yaml/resources/
      are preserved as unknown sidecars by the manager (left to the resource model task).


      3. Dispatcher: plans.ts loadPlans/findPlanByRef/savePlan/mutatePlanAtomically/deletePlan check
      ctx.manifest.plan_storage?.format === "folder" and route to the folder manager. Otherwise fall
      through to existing monolithic implementation. Existing assertPlanStorageCompatible/Writable
      already gate partial/legacy cases. The folder manager calls assertPlanStorageCompatible on
      read and assertPlanStorageWritable on save/delete to raise the shared incompatibility errors
      (no dual-read/silent migrate).


      4. Index projection (bounded): _ulid, slugs, title, status, source_path, module_ref, branch,
      derived_tasks, derived_specs, created_at, approved_at, completed_at, notes_count,
      resource_summary (count + total_bytes when manifest is present). NOT in index: content, full
      notes, resource file bytes.


      5. plan rebuild-index command:
         - default: validate drift, exit 1 if drift, no writes
         - --dry-run: drift summary, never writes
         - --repair: rewrites .kspec/project.plans.yaml from folders
         - --force: only with --repair; permits dropping stale index entries whose folders are missing (without --force, stale entries are a conflict and no files are written)
         - --json: structured output with summary/changes/conflicts arrays, exit codes 0=clean/repaired, 1=drift, 2=blocked

      6. Tests: parser-plans-folder.test.ts covers create/list/detail/update/delete, owned resource
      cleanup on plan delete, unknown file preservation, content sidecar authority, index
      projection, rebuild drift detection, --repair, --force stale-entry handling, and
      incompatibility errors for partial layouts. Existing parser-plans.test.ts keeps testing
      monolithic (legacy path) and we add separate tests for folder mode.


      7. Existing assertPlanStorageWritable allows operating on consistent folder layouts via the
      in-place mutate path; for save/delete the folder manager routes through the new path (not the
      lenient gate), so the no-new-monolithic write rule still protects.
    supersedes: null
    author: "@claude"
    created_at: 2026-05-23T20:34:59.594Z
  - _ulid: 01KSBB4XVBVNX76AM4RKJ5MW50
    content: >-
      Implementation complete.


      Delivered:

      - src/parser/plan-storage-manager.ts — folder-backed manager (CRUD + index drift + repair),
      reuses folder-backed-entity helpers, calls requirePlanFolderStorage (read/write) and
      describeStrictManifestIncompatibility (rebuild-index manifest-only check). plan.md is
      authoritative for content; plan.yaml stores bounded metadata; notes.yaml is sidecar-only when
      notes exist; unknown files and unknown plan.yaml fields are preserved.

      - src/parser/plans.ts — dispatcher routes
      loadPlans/findPlanByRef/savePlan/mutatePlanAtomically/deletePlan to the folder manager when
      plan_storage.format=folder; legacy/monolithic path remains intact.

      - src/cli/commands/plan.ts — `kspec plan rebuild-index` with
      --dry-run/--repair/--force/--json, structured envelope { domain, status:
      clean|drift|repaired|blocked, dry_run, repair, force,
      summary{folders,index_entries,added,updated,removed_stale,conflicts}, changes[], conflicts[]
      }. Exit codes: 0 clean/repaired, 1 drift, 2 blocked. --force rejected without --repair. Repair
      commits via commitIfShadow.

      - tests/parser-plans-folder.test.ts (17 tests) — folder layout creation, lean index
      projection, content sidecar authority, notes sidecar emission only when present, findPlanByRef
      variants, atomic mutation, owned resource cleanup on delete, ENOENT on missing, unknown-file
      preservation, unknown-field preservation, drift detection (added/stale with and without
      --force), rebuild non-force, rebuild --force drops stale, partial-layout incompatibility
      rejection.

      - tests/plan-rebuild-index.test.ts (7 tests) — CLI envelope and exit-code contract for
      clean/drift/blocked/repaired/--dry-run/--force-without-repair.

      - tests/daemon-api/helpers.ts — materializeFolderShellsFor now splits monolithic plan records
      into plan.yaml/plan.md/notes.yaml sidecars so daemon API tests exercise the folder-backed read
      path.

      - tests/daemon-api/plans.test.ts — re-materialises shells after overwriting the monolithic
      index so the folder manager sees the new authoritative data.

      - tests/entity-storage-partial-layout-manager.test.ts — updates clean-state expectations:
      writes now succeed via the folder manager and no monolithic file is created.


      Validation:

      - Full vitest run: 9525 passed, 5 skipped, 0 failed (2507 test suites)

      - oxlint clean on changed files

      - tsc --noEmit clean

      - kspec validate: my spec @folder-backed-plan-storage-1 not in the missing-AC list
