  - _ulid: 01KHAP9ED6MDS0ANH3ZN71TG48
    content: Implements ac-21. Add --tasks @ref1,@ref2 flag to scope ralph to explicit tasks, preventing
      scope creep. Complements --focus (prompt instructions) with hard task filtering.
    supersedes: null
