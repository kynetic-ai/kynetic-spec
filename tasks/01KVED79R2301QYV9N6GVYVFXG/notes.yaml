notes:
  - _ulid: 01KVENXZVGFR6Q47G01Q5WP6NC
    content: "Approach: reuse review subject binding utilities and plan revision content resolution. Add
      computed subject revision helpers beside subject-bindings: non-plan subjects derive 1 +
      subject_refreshed event count; plan subjects resolve the referenced plan and match revision
      content hashes, using matching shadow_commit only to break duplicate-content ties. Surface the
      computed value as subject_revision on review get JSON/API detail and as a human-readable line.
      Edge cases: plan reviews with unpublished draft content return null; duplicate published
      content without a shadow-commit tie is ambiguous and returns null; external subjects report
      null. Test plan: CLI refresh test for @subject-revision-vocabulary ac-non-plan-derivation;
      shadow-backed plan review tests for @subject-revision-vocabulary ac-plan-subject-ordinal and
      @plan-revisions ac-review-revision-binding, including unpublished draft null."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-19T00:54:11.056Z
  - _ulid: 01KVEPYSXSM6HWYAW8A3JYDYY0
    content: "Implemented subject revision reporting. Added computed helpers for non-plan
      refresh-derived ordinals and plan revision binding by published revision content hash with
      shadow-commit tie-breaking. Surfaced subject_revision through review get JSON, human review
      get output, daemon review detail, and static export detail. Added behavioral tests covering
      code review refresh N+1, plan review binding to revision 2 despite refresh events, and
      unpublished draft plan content resolving to null. Verification: format:check, lint --quiet,
      changed-file oxlint (0 errors; pre-existing no-shadow warnings in review.ts), typecheck,
      focused review-subject-revisions tests, full npm test, and all three kspec validate gates
      passed."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-19T01:12:06.329Z
