  - _ulid: 01KN3RJFVT7FVBZPF63J278HXK
    content: "Approach: reproduce the four failing sessions Playwright cases in
      tests/e2e/sessions.spec.ts, compare them to the current sessions route/detail/static-mode
      implementation, and fix the underlying contract drift instead of loosening assertions. Edge
      cases: static mode must suppress detail/event API fetches entirely, navigation must hydrate
      detail view after list click, and date filters must keep URL/query state in sync. Test plan:
      rerun the targeted failing cases with retries, then rerun neighboring sessions coverage and
      validate the broader suite impact."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-01T05:34:30.267Z
  - _ulid: 01KN3RNAPVTZ810V8KS9C9SPRF
    content: Diagnosed the failure cluster into one real app bug and two contract-drift cases. Fixed
      sessions detail to bypass daemon session fetches in static mode so the static banner renders
      without spurious errors, normalized bits-ui select values before computing the since preset,
      and updated the stale list-route interception in the navigation test to match the current
      query-string request shape.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-01T05:36:03.291Z
  - _ulid: 01KN3RRQ3K6FYCTK2T0YC0RKBS
    content: "Final targeted failure was a false negative in the row-navigation test: Playwright's
      generic row click landed on the nested inline task reference, which intentionally routes to
      the task board. Updated the test to click the row's session-id content instead so it verifies
      session-row navigation rather than nested reference-link behavior."
    supersedes: null
    author: Jacob Chapel
