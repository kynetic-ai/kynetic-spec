      Fixed responsive layout for both kanban board and task list views:

      **Kanban board:**
      - Replaced flex+overflow-x-auto with CSS grid (grid-cols-1 sm:2 lg:3 xl:5)
      - Removed min-w-[260px]/max-w-[320px] from BoardColumn, replaced with min-w-0
