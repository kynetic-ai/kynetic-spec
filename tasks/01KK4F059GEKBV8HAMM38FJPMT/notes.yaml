      **Task list:**
      - Added table-fixed layout with percentage column widths (40%/12%/8%/15%/7%/18%)
      - Added overflow-hidden to table wrapper, truncate on title and spec ref cells
      - Added min-w-0 to page root container

      **Layout chain fix:**
      - Added min-w-0 to sidebar-inset and main element to prevent flex overflow
      - Reduced filter min-width from 200px to 140px for better narrow-screen wrapping

      All 168 web-ui tests pass. 2 pre-existing codex test failures unrelated to changes.
