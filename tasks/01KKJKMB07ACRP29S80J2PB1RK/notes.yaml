  - _ulid: 01KKM05KKG3TCZKR0M9QW97W4N
    content: "Fix cycle 3: Prevented idle marking from regressing terminal lifecycle states in
      markDispatchWorkspaceIdle. When an invocation completes and calls markDispatchWorkspaceIdle
      with a stale taskStatus (e.g. 'pending_review' from the original dispatch event), it could
      overwrite a 'closing' state set by a concurrent handleStateChange(completed) →
      reconcileDispatchWorkspaceLifecycle. Added early-return guard: if the existing record is
      already in a terminal state (closing/cleanup_blocked/closed), only clear active_role without
      recalculating lifecycle. Full suite passes: 4736 tests, 0 failures."
    supersedes: null
    author: "@claude"
