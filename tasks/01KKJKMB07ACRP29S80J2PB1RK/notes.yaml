  - _ulid: 01KKKTZJGFGVTYPV6JDKF6F9BH
    content: "Fix cycle: Fixed race condition in DispatchEngine.stop() where in-flight _reconcile()
      calls were not awaited before teardown. The setInterval callback fires _reconcile() as
      fire-and-forget, so stop() could return before reconciliation finished accessing temp dirs.
      Added activeReconcile promise tracking so stop() awaits the in-flight call. Reproduced the
      ENOTEMPTY failure under full-suite load, confirmed fix with 2 consecutive clean full-suite
      runs (4736 tests). The cli-serve foreground shutdown assertion was not reproducible in
      isolation or under load — likely a transient CI-only race."
    supersedes: null
    author: "@claude"
