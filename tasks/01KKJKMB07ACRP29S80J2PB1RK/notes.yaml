    content: "Fix cycle 5: Eliminated race condition in dispatch-workspace-registry lifecycle test. The
      pending_review invocation's post-completion chain (markDispatchWorkspaceIdle →
      cleanupReviewerDispatchWorkspace) runs AFTER activeInvocations is decremented, so the old
      activeInvocations poll loop could exit too early. Fix: stop/restart the engine between
      pending_review and completed transitions to fully drain invocation promises. Also disabled
      periodic reconciliation in all DispatchEngine test instances. Full suite passes: 4756 tests, 0
      failures across 2 consecutive runs."
    supersedes: null
    author: "@claude"
