  - _ulid: 01KKPRXGF35FAARGSNPZXKH2HJ
    content: >-
      Implementation complete. Created review CLI with three commands:

      - review add: Creates reviews with ref-backed subjects (task/plan/spec) or code subjects
      (base/head commits). Supports --slug, --author, --related-ref flags.

      - review get: Shows full review details including lifecycle state, computed disposition,
      computed gate state, threads, checks, verdicts, events, and notes.

      - review list: Lists reviews with filters (--status, --disposition, --subject, --reviewer,
      --tag, --limit, --offset, --count).


      All commands support --json output. 37 tests covering all 5 own ACs plus trait ACs for
      json-output, filterable-list, semantic-exit-codes, and shadow-commit.
    supersedes: null
    author: "@claude"
