title: Verify coverage-state compatibility, performance, and neutral-project gates
type: task
description: >-
  Manually run the cross-cutting verification pass that proves the completed coverage-state engine
  works as a reusable kspec system, not only for this repository. This task is intentionally
  manual_only and should be performed by Jacob with an assisting agent after the implementation
  tasks have completed.


  Why: The highest risk in this track is accidental coupling to kynetic-spec's own corpus and test
  setup. Completion must prove the generic behavior across temp projects, older/no-store projects,
  static snapshots, and large-ish corpora, but this final task should audit and roll up evidence
  rather than become late feature implementation.


  What:

  - Review the completed evidence-index, state-derivation, freshness-comparison, API/cache, and
  events work against the plan's general-system guardrails.

  - Verify temp-project integration coverage exists for at least two project shapes: one with no
  test-run store and bootstrap annotations only, one with normalized ingested runs from a
  differently named test framework or fake producer.

  - Verify no-store/backcompat behavior: existing projects with no verification/test-run store read
  as valid and do not materialize stores on read; stores materialize only on write/ingestion.

  - Verify static snapshot behavior and refused mutation/ingestion actions are implemented by the
  API/cache task rather than being deferred here.

  - Verify performance/cache evidence for corpus-level rollups over thousands of ACs, cache reuse,
  and avoiding one git/history call per AC where batching is possible.

  - Run focused coverage-state suites, relevant daemon route/websocket tests, static-export tests,
  and broad validation/build gates from the integration branch.

  - Add validation/readiness notes documenting remaining follow-ons: resolution mutations, spec
  workspace, Validate matrix, flakiness, and generated observations.


  How: This is a manual closure/rollup task, not a dispatch implementation task. If this audit finds
  missing behavior, create or reopen the appropriate implementation task instead of adding new
  feature work here. Run focused coverage-state suites first, then the relevant daemon
  route/websocket/static-export tests, then `kspec validate --warnings-ok`. For touched shared
  package types, ensure `packages/shared/dist` was generated before root `tsc`.


  Covers: @coverage-state-engine ac-total-state, ac-deterministic-precedence;
  @coverage-state-api-cache ac-performance-bounded, ac-static-snapshot; @coverage-evidence-index
  ac-framework-neutral-input; @coverage-record-compatibility ac-absent-store-no-behavior-change and
  ac-upgrade-without-rewrite as regression coverage for this new read model.
