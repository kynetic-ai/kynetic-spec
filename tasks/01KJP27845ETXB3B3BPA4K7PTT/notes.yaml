  - _ulid: 01KJQRYDFRBF7B8CSDP8J1M5DD
    content: >-
      Implemented kspec agent command family in src/cli/commands/agent.ts with subcommands: list,
      run, status, dispatch (start/stop/status). 


      Key design decisions:

      - agent list: supports --json, --count, --limit, --offset, --tag, --status filters
      (trait-filterable-list)

      - agent run: supports --dry-run (shows prompt), --adapter/--timeout/--budget overrides (AC-7)

      - agent dispatch start/stop/status: communicates with daemon via HTTP API, gracefully handles
      offline daemon

      - All commands use PidFileManager to detect daemon, consistent with serve.ts pattern

      - Registered as kspec agent (not kspec agents which is for instruction generation)

      - 9 CLI integration tests covering ACs 1-3, 7-10 and trait coverage
    supersedes: null
    author: "@claude"
    created_at: 2026-03-02T17:18:44.217Z
