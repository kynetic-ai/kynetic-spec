  - _ulid: 01KGVGSH49350X0MVF442ZVV10
    content: "Implementation: Two parts. (1) Add --depends-on flag to item set (may overlap with
      01KGTVH6 relationship flags task). (2) In derive handler, when creating a task from a spec
      that has depends_on, look up existing tasks with matching spec_ref for each dependency. If
      found, add to new task's depends_on. Design decisions needed: if dependency spec has no task
      yet, warn (don't block). Skip transitive deps — only direct. No circular detection needed if
      specs are acyclic (validate could check). Addresses #1 post-import friction from MEMORY.md."
    supersedes: null
    author: "@claude"
