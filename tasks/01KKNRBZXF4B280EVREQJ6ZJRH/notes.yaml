      against refreshed subject version, (4) AC-annotated tests covering all 5 ACs.

      - Files: src/review/subject-bindings.ts (new), tests/review-subject-bindings.test.ts (new)

      - Verification: npm test must pass, all 5 ACs covered with annotated tests.
