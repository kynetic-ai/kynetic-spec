title: Clarify and implement mixed Tasks-section precedence for derive_from_specs
type: task
description: >-
  Background:

  - The current `## Tasks` parser behavior is ambiguous when a plan contains both
  `derive_from_specs: true` and an explicit YAML task list under the same heading.

  - The current parser prefers the explicit YAML slugs, which can narrow the embed to a manual
  subset even when the section is marked to render derived tasks.


  Required behavior:

  - Follow `@plan-embedded-views` `ac-9`: when `derive_from_specs: true` is present in the Tasks
  section, embedded task rendering is driven by `plan.derived_tasks`; any adjacent manual YAML task
  list is ignored for embedding precedence and must not create duplicate or narrower task embeds.


  Scope:

  - Update the parser and tests to enforce deterministic precedence for mixed task sections after
  the live batch-loading regression is fixed.
