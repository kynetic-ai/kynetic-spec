  - _ulid: 01KNNB306JMNJZYMBJB7EQWM2A
    content: >-
      Fix cycle 3: addressed the blocker about captured process.stdout.write output being silently
      dropped from the batch API response.


      Root cause: the capture object was scoped inside dispatchMutex.run(), so after executeBatch()
      returned, the captured stdout/stderr chunks were inaccessible and the handler returned
      batchResult without them.


      Fix: moved capture outside the mutex scope. After batch execution, any captured
      process.stdout.write/stderr.write content is merged as top-level stdout/stderr fields on the
      batch response. Updated the test to assert the sentinel appears in body.stdout (not just that
      it didn't leak to _write).


      All 7649 tests pass, no regressions.
    supersedes: null
    author: "@claude"
    created_at: 2026-04-08T01:25:10.994Z
