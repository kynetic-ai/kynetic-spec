title: Fix no-op conditional assertions in session-start-format.test.ts
type: bug
description: >-
  Two assertions in tests/cli/session-start-format.test.ts are wrapped in `if
  (result.stdout.includes(...))` guards, making them pass vacuously when the condition is false:


  1. ~Line 203: `if (result.stdout.includes('untriaged'))` — the assertion for primer inbox stat
  line only runs when the section is present. Should unconditionally assert the section appears.


  2. ~Line 245: `if (result.stdout.includes('Inbox'))` — same pattern for full mode inbox section.


  Fix: Remove the if-guards so the assertions always run. If the test then fails, the underlying
  output is wrong and needs fixing in session.ts.
