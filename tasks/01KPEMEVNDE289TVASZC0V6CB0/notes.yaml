  - _ulid: 01KPGXG7CM5RJEC2NSHAHM3YWR
    content: >-
      Fix cycle 1: Addressed both blocker threads from review @01KPGVT79Z3DMQT6EHBHDXS5JN.


      1. ac-49 (branch preservation): Test now creates a real git branch, deletes the plan, and
      verifies the branch survives via git branch --list — proving the guarantee behaviorally.


      2. ac-48 (shadow commit): Replaced non-behavioral test with a dedicated describe block using a
      real shadow worktree (kspec init). Test inspects git log in the shadow worktree to verify the
      commit subject contains 'Delete Plan' and the plan slug.


      3. Also added missing plan-delete case to shadow commit message mapping in
      src/parser/shadow.ts — without this, deletion commits used the raw fallback format instead of
      'Delete Plan: @slug'.


      All 8047 tests pass, no regressions.
    supersedes: null
