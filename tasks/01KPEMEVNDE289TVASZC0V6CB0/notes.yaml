  - _ulid: 01KPGVNC1TR73GD9E8T8N1K56F
    content: >-
      Implementation complete. Summary of changes:


      1. **src/parser/plans.ts**: Refactored deletePlan() from Promise<boolean> to Promise<void>
      with ENOENT throw on not-found and error propagation on I/O failure.


      2. **src/cli/commands/plan.ts**: Added plan delete command (186 lines) with:
         - Ref resolution with structured not-found (ac-51)
         - Status gate: draft/rejected only (ac-41)
         - Derived work check via ReferenceIndex.resolve on derived_specs/derived_tasks (ac-42, ac-43)
         - Referencing tasks check via resolver-based plan_ref matching (ac-44)
         - All refusal reasons collected before emitting (ac-50)
         - Confirmation with --force, TTY, JSON detection (ac-45, ac-46)
         - ENOENT from concurrent deletion maps to not-found for idempotency (ac-53)
         - Shadow commit via commitIfShadow (ac-48)
         - No git branch deletion (ac-49)

      3. **src/strings/errors.ts**: Added deletePlan failure string.


      4. **tests/cli-plan-delete.test.ts**: 29 E2E tests covering all ACs.


      5. **tests/parser-plans.test.ts + yaml-round-trip-stability.test.ts**: Updated 3 existing
      deletePlan call sites for new Promise<void>/throws contract.


      Full test suite: 8047 passed, 5 skipped.
    supersedes: null
    author: "@claude"
    created_at: 2026-04-18T17:54:19.834Z
