title: "Fix: git subprocess interactive prompt hang in daemon/dispatch"
type: task
description: >-
  ## What


  When dispatch or the daemon's shadow sync scheduler runs on a cloned repo where the user lacks
  push/fetch credentials (e.g., a repo they don't own), git operations (fetch, push) trigger an
  interactive credential prompt (Username for https://github.com) instead of failing. This hangs the
  process indefinitely — the daemon and dispatch engine become unresponsive.


  ## Why


  The existing specs (@dispatch-remote-branch-sync ac-push-non-fatal, ac-transient-no-degrade)
  require that auth failures are caught and handled gracefully — logged as warnings, engine
  continues. However, the implementation spawns git subprocesses that inherit the default terminal
  prompt behavior. When no credential helper is configured (or it cannot authenticate), git blocks
  on stdin waiting for manual input. The error-handling code never executes because git never
  returns.


  Affected code paths:

  - Dispatch target sync: _syncTargetBranch() runs git fetch <remote> <branch> periodically and at
  startup

  - Dispatch branch push: pushDispatchBranch() runs git push after invocation completion

  - Integration target push: pushIntegrationTarget() runs git push after reviewer merges

  - Shadow sync scheduler: ShadowSyncScheduler.syncOnce() runs fetchRemote() periodically from the
  daemon


  ## How


  Set GIT_TERMINAL_PROMPT=0 in the environment for all git subprocesses spawned by the dispatch
  engine and shadow sync scheduler. This environment variable tells git to fail immediately with an
  auth error instead of prompting for credentials interactively. The existing error-handling logic
  (non-fatal warnings, transient failure tracking, degraded state escalation) then works as the
  specs intend.


  Specific locations to patch:

  - All spawnSync/execSync git calls in src/agent-runtime/dispatch.ts that touch remote (fetch,
  push, ls-remote)

  - The fetchRemote() call in src/parser/shadow-sync-scheduler.ts

  - Any shared git utility used by these paths (check if there is a central spawn wrapper)


  Prefer setting the env var at the lowest common layer (e.g., a shared git spawn helper if one
  exists) rather than at each individual call site.
