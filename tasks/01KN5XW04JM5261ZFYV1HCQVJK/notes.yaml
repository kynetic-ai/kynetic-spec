notes:
  - _ulid: 01KN65G266V2XWZW19530NKC6Y
    content: "Approach: update dispatch workspace base-branch resolution to read task.plan_ref, load the
      plan, and prefer a validated plan.branch before existing config/default fallback logic. Edge
      cases: missing plan ref falls through with warning, null branch falls through unchanged,
      deleted plan branch errors instead of silently defaulting, stale integration targets must
      prefer the resolved plan branch over config-level base branch changes. Test plan: add
      behavioral coverage for plan branch hit, null branch passthrough, no plan passthrough, missing
      plan warning fallback, missing branch failure, and stale target detection/update when a plan
      gains a branch."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-02T03:58:51.078Z
  - _ulid: 01KN66C4ADQ55P6XM27MYY0ES2
    content: "Implemented plan-aware dispatch base-branch resolution. Workspace provisioning now prefers
      a validated linked plan.branch, falls back cleanly when plan_ref/branch is absent, warns when
      a referenced plan is missing, and throws actionable errors when a configured plan branch no
      longer exists. Also extended stale integration target reconciliation so existing pending
      workspaces retarget when a linked plan later gains a branch. Verification: npm test --
      dispatch-workspace-config.test.ts, full npm test (7454 passed, 5 skipped), kspec validate
      (warnings only; existing project-wide warning debt unrelated to this task)."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-02T04:14:10.765Z
