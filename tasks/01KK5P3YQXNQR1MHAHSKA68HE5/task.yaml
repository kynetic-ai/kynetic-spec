title: Add dispatch filter UI and default automation eligibility
type: task
description: >-
  The dispatch engine feeds non-eligible tasks (manual_only, needs_review) to agents because:


  1. The AgentEditForm UI has no filter editing — dispatch triggers show only the event type, with
  no way to view or configure filter criteria (automation, tags, priority).


  2. addTrigger() creates rules as { on: event } with no filter, and the engine's _matchesFilter()
  returns true when filter is undefined.


  3. Default agent definitions (from kspec setup) lack filter: { automation: eligible } on their
  rules.


  Fix requires three changes:


  A) UI: Add filter editing per dispatch trigger row — automation dropdown (eligible/any), tag
  chips, priority threshold. Default automation to 'eligible' for task.ready and task.needs_work
  triggers. Show existing filters as badges.


  B) Engine: Default to automation: eligible for task.ready and task.needs_work events when no
  filter is specified. This is a safety net so even unconfigured agents don't pick up ineligible
  tasks.


  C) Setup: Update default agent definitions to include filter: { automation: eligible } on
  task-worker dispatch rules.


  See new ACs on @ui-agent-dispatch (ac-5 through ac-9) and @agent-dispatch-engine (ac-21, ac-22).
