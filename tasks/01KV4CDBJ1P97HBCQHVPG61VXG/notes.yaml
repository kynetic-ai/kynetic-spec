  - _ulid: 01KV5593M8ERPR8AMK8FKAK3ZX
    content: >-
      Approach: New plain-TS core under src/lib/shortcuts/ (no Svelte runes, so it is unit-testable
      in the node vitest env, mirroring src/lib/preferences/). Modules: types.ts, platform.ts
      (detectPlatform via navigator.platform + UA fallback), chord.ts
      (normalize/resolve/label/chordKey), reserved.ts (per-platform browser-reserved data +
      isReserved), registry.ts (ShortcutRegistry class), index.ts (singleton + exports).


      Resolution: chord declares platform-abstract primary modifier `mod` → meta on mac, ctrl on
      other. labelFor renders ⌘K (mac symbols) vs Ctrl+K. Reserved lists: mod+w/t/n (both), meta+q
      (mac), ctrl+tab (both). Registration: preferred reserved → walk fallbacks for first
      non-reserved/non-colliding; preferred colliding (non-reserved) → reject keeping existing
      (ac-4); no resolvable chord → unbound + diagnostic, never silently dropped (ac-5). Single
      document-level dispatcher in root layout via <svelte:window>; exactly-once firing;
      modifier-less chords (no platform primary modifier) suppressed while focus in
      input/textarea/contenteditable (ac-6). Enumeration list() returns active bindings (active
      contexts) with action label + resolved chord + rendered chordLabel (ac-2). Context activation
      tied to component lifecycle.


      Migration (unchanged user-visible behavior): CommandPalette Cmd/Ctrl+K (global), sidebar
      toggle Cmd/Ctrl+B (global), triage Arrow Left/Right under surface-scoped 'triage' context
      (preventDefault:false to preserve no-preventDefault behavior; central suppression replaces the
      local input guard). Remove the three ad-hoc listeners.


      Dispatch is platform-strict (resolved chord matched exactly), which is spec-correct (ac-3).
      The existing e2e 'opens with Cmd+K on Mac' test pressed Meta+k while running on Linux relying
      on the old lenient (meta||ctrl) handler; updated it to actually emulate macOS (override
      navigator.platform + reload) so it stays correct coverage.


      Tests: table-driven unit tests in tests/web-ui/shortcuts.test.ts for platform resolution,
      collision rejection, reserved fallback, text-entry suppression, enumeration, exactly-once
      dispatch.
    supersedes: null
    author: "@claude"
    created_at: 2026-06-15T08:09:59.688Z
  - _ulid: 01KV56HM82X4AG0CH5GWEFAA8Z
    content: >-
      Implemented and migrated. Summary of work delivered:


      New module src/lib/shortcuts/ (plain TS core, unit-testable in node vitest):

      - types.ts, platform.ts (detectPlatform), chord.ts
      (resolve/label/chordKey/eventToResolvedChord/hasPrimaryModifier), reserved.ts (per-platform
      browser-reserved data + isReserved), registry.ts (ShortcutRegistry), index.ts (singleton +
      exports).


      Behavior:

      - ac-1: single document-level dispatcher (root layout <svelte:window>), exactly-once firing;
      surface contexts shadow global; inactive-context bindings not dispatched; unregister stops
      dispatch.

      - ac-2: list() enumerates active-context bindings with action label + resolved chord +
      rendered chordLabel; subscribe() notifies reactive consumers.

      - ac-3: mod resolves to Cmd on mac / Ctrl on other; labelForChord renders ⌘K vs Ctrl+K; key
      normalization case-insensitive.

      - ac-4: collision within a context rejects and keeps existing binding; same chord in different
      context is not a collision.

      - ac-5 + @web-shell-platform-target ac-3: reserved lists (mod+w/t/n both, Cmd+Q mac-only,
      Ctrl+Tab both); preferred reserved falls through to first non-reserved/non-colliding fallback;
      no resolvable chord → reported unbound via console.warn, retained in unbound(), never silently
      dropped.

      - ac-6: modifier-less chords suppressed while focus in input/textarea/contenteditable (no
      action, no preventDefault); primary-modifier chords still fire inside text entry.


      Migration (unchanged user-visible behavior):

      - CommandPalette Cmd/Ctrl+K (global), sidebar toggle Cmd/Ctrl+B (global, reuses
      SIDEBAR_KEYBOARD_SHORTCUT), triage Arrow Left/Right (surface-scoped 'triage' context,
      preventDefault:false). Removed the three ad-hoc keydown listeners and
      SidebarState.handleShortcutKeydown.

      - Updated the mislabeled e2e 'opens with Cmd+K on Mac' test to actually emulate macOS
      (override navigator.platform + reload) since dispatch is now platform-strict.


      Tests: tests/web-ui/shortcuts.test.ts — 29 table-driven behavioral tests, all AC-annotated.


      Gates: format:check clean, repo lint 0 errors (0 new warnings in changed files), typecheck
      clean, svelte-check clean for touched files (pre-existing baseline errors in unrelated files
      untouched), full npm test suite 10743 passed / 3 skipped, kspec validate
      refs/alignment/completeness pass. Completeness confirms @ui-shortcut-registry ac-1..6 and
      @web-shell-platform-target ac-3 are covered.
