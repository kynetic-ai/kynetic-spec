  - _ulid: 01KGVWT7A7167A3N98152SY86G
    content: >-
      Implemented AC count display in derive output:

      - Added acCount field to DeriveResult interface

      - Count ACs in deriveTaskFromSpec function

      - Display '(N ACs)' in human-readable output for specs with ACs (hidden for 0 ACs)

      - Show complexity warning for >5 ACs: 'This spec has N ACs — consider splitting before
      implementing.'

      - Added ac_count to JSON output

      - Warning uses stderr (via warn() function) following UX conventions

      - 7 new tests covering AC count display, dry-run, JSON output, complexity warning, and zero-AC
      hiding
