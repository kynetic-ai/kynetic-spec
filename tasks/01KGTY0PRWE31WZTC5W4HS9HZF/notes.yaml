    content: "Implementation: In src/cli/commands/derive.ts, count ACs on the spec being derived. Always
      display count in output (e.g. 'Derived task from @spec (3 ACs)'). If >5 ACs, warn: 'This spec
      has N ACs — consider splitting before implementing.' ~15 lines, no new deps. Quick win from
      the derive-granularity research (01KGG6GY)."
