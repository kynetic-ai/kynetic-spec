      2. KSPEC_SESSION_ID: capture previousKspecSessionId before setting it, restore unconditionally
      in finally block (either restore old value or delete if was undefined)

      3. Corrected test that encoded incorrect behavior — now correctly expects pre-existing value
      to be restored

      All 28 tests pass. No regressions.
