title: Wire agent spawner into automation subsystem action executors
type: task
description: >-
  The automation subsystems (schedule engine, hook executor, join accumulator) can execute command,
  kspec, and notify actions, but agent actions fail immediately with zero duration. The action
  executors for these subsystems are created without the ability to spawn agent invocations. The
  task-dispatch path works because it uses a separate invocation mechanism that doesn't share this
  limitation.


  Any project that configures agent actions on schedules or hooks (e.g. stall-recovery schedules,
  post-review-complete hooks) gets silent immediate failures. The action.failed events are emitted
  but the error field is not included in the event bus payload, making this hard to diagnose from
  the event log or web UI.


  Deliverables:

  1. Provide the automation subsystem action executors with the ability to spawn agent invocations.
  Spawned invocations use the project root as working directory, resolve agent definitions from meta
  config, and return a trackable invocation ID.

  2. Include error and failure_reason fields in the action.failed event bus payloads for all three
  automation subsystem onActionRunEvent callbacks so failures are diagnosable.
