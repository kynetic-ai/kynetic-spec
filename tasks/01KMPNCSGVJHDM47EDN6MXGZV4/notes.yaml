  - _ulid: 01KMPPRD4E9BM41NCZCC06NC5S
    content: >-
      Approach: Two deliverables.


      Deliverable 1 — Wire agent spawner:

      - Create a createAutomationAgentSpawner() factory in agent-dispatch.ts (or a new module) that:
        (a) Resolves agent definitions from meta config via loadMetaContext()
        (b) Calls runInvocation() with projectDir as cwd, specDir from initContext()
        (c) Returns { invocation_id: session.id } matching the AgentSpawner type
      - Pass the spawner to ActionExecutor in startScheduleEngine, startHookExecutor,
      startJoinAccumulator


      Deliverable 2 — Error fields in action.failed events:

      - Add error and failure_reason from event.action_run to the event bus payload in all three
      onActionRunEvent callbacks (schedule, hook, join) when event.type is action.failed


      Test plan:

      - ac-1: Test schedule with agent action → spawner called, invocation succeeds

      - ac-2: Test hook with agent action → spawner called, invocation succeeds

      - ac-3: Test join accumulator with agent action → spawner called, invocation succeeds

      - ac-4: Test missing capability → action fails with descriptive error message

      - ac-5: Test action.failed event payload includes error and failure_reason fields
    supersedes: null
    author: "@claude"
    created_at: 2026-03-27T03:52:39.311Z
  - _ulid: 01KMPQ9HNNR7MJ0GEE4HSZ67QJ
    content: >-
      Implementation complete. Changes:


      1. Created createAutomationAgentSpawner() factory in agent-dispatch.ts that:
         - Resolves agent definitions from meta config via initContext/loadMetaContext
         - Calls runInvocation with projectDir as cwd
         - Returns { invocation_id: result.session.id } matching AgentSpawner type
         - Throws descriptive error when agent_id not found (lists available agents)

      2. Wired agentSpawner into all three startXxx functions:
         - startScheduleEngine (AC-1)
         - startHookExecutor (AC-2)
         - startJoinAccumulator (AC-3)

      3. Added error/failure_reason to event bus payloads in all three onActionRunEvent callbacks
      (AC-5):
         - Conditional spread: only includes fields when present on action_run
         - Covers all action types, not just agent actions

      Test coverage: 10 tests covering all 5 ACs.

      Pre-existing failure: agent-dispatch-engine.test.ts has a duplicate mockMetadata declaration
      (transform error) on the dev base branch — not related to this change.
