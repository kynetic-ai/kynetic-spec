  - _ulid: 01KJJ8N8V7F4TXA17GAYFAVZ1E
    content: "Implemented arg-key normalization for batch args to accept kebab-case, camelCase, and
      underscore variants via canonical kebab normalization. Updated unknown-arg validation,
      required-arg detection, and argv generation to use normalized keys, with fallback to command
      metadata for canonical flag emission. Added regression coverage for underscore keys in
      validateBatchCommands and buildCommandArgv. Verification: npm test --
      tests/batch-schema.test.ts; npm test -- tests/batch-exec-engine.test.ts; npm test; kspec
      validate."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-28T13:57:55.175Z
