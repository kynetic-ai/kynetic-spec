  - _ulid: 01KKXMY5YVKR1S7342PKAS7V00
    content: "Review cycle 1 (review @01KKXKZZ): request_changes. One blocker: verdict and check
      endpoints do not guard against mutations on archived (terminal-state) reviews.
      Approve/request_changes verdicts on archived reviews trigger an unhandled 500 error
      (transitionLifecycle throws for archived→closed). Comment verdicts silently succeed, mutating
      a terminal-state review. Fix: add lifecycle state validation before mutations — reject with
      400 if review is archived. Two nits (non-blocking): duplicated VALID_TRANSITIONS map, AC-9
      broadcast untested (follows codebase pattern). Tests pass (pre-existing review-cli.test.ts
      failure confirmed unrelated). AC coverage verified for ac-6,7,8,9,10. Trait ACs properly
      annotated N/A."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-17T10:19:50.619Z
  - _ulid: 01KKXP029ZXZFKFAC4YQTAHE06
    content: "Fixed blocker: added lifecycle state guard on verdict and check endpoints to reject
      mutations on archived (terminal-state) reviews with 400 and actionable error message.
      Previously approve/request_changes verdicts caused unhandled 500 (transitionLifecycle throws
      for archived→closed), and comment verdicts silently mutated immutable archived reviews. Also
      addressed nit by exporting VALID_TRANSITIONS from review-operations.ts and importing in the
      route handler, eliminating the duplication divergence risk. Added 3 tests covering
      archived-state guard for verdicts (approve + comment) and checks. All 31 route tests pass,
      full suite passes (pre-existing review-cli.test.ts failure unchanged)."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-17T10:38:20.991Z
