notes:
  - _ulid: 01KNMK0QY54ZCF8SPQ86E4S4FT
    content: "Approach: reuse the existing getEntityCacheContext preamble pattern from
      initContext/loadAllItems and add cache-backed fast paths in src/parser/yaml.ts for
      loadInboxItems() and loadTriageRecords(). Inbox can return cache.getInboxIndex() directly
      because that tier already stores full LoadedInboxItem records. Triage will aggregate full
      records from cache detail lookups keyed by the triage index so we only return cache-backed
      data when the triage domain is ready and every indexed record has detail data. Edge cases: no
      cache context, domain not ready, missing inbox file on disk, triage detail/index mismatch, and
      preserving current parse-error fallback behavior. Test plan: extend parser
      entity-cache-context coverage with behavioral hit/miss tests for inbox and triage loaders,
      including the non-ready and missing-detail fall-through paths."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T18:24:31.173Z
  - _ulid: 01KNMKDHFMN99P8F8J77MR2CNE
    content: Implemented cache-backed inbox and triage reads in src/parser/yaml.ts. loadInboxItems() now
      returns cache.getInboxIndex() when the inbox domain is ready, and loadTriageRecords() now
      resolves full records from the triage detail tier when the triage domain is ready with
      complete detail coverage, otherwise it falls through to disk. Verified with npm test -- --run
      tests/parser/entity-cache-context.test.ts, npm test, and kspec validate (warnings only from
      existing repo debt).
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T18:31:30.549Z
