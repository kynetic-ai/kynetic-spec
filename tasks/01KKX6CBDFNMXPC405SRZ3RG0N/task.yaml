title: Round-trip stability for meta manifest YAML writes
type: task
description: >-
  meta.ts loads kynetic.meta.yaml through MetaManifestSchema.safeParse() on every mutation
  (saveObservation, deleteObservation, agent/workflow/convention/skill CRUD). This adds ~7 top-level
  defaults (agents, workflows, conventions, observations, skills, includes, kynetic_meta) even when
  those sections are absent from the file.


  Apply the same raw-data-preservation pattern: read the raw YAML, only parse/normalize the section
  being mutated, preserve other sections as raw data.


  Verify with tests: write a meta manifest with only observations, mutate one observation, confirm
  agents/workflows/etc. sections are not added to the file.
