    content: "Applied raw-data-preservation pattern to meta.ts mutation functions (saveObservation,
      deleteObservation, saveMetaItem, deleteMetaItem). Key changes: (1) Added
      extractRawMetaManifest/writeRawMetaManifest/findRawMetaItemIndex/mergeMetaItemPreservingRawSh\
      ape helpers mirroring the review record pattern. (2) Mutation functions now read raw YAML
      without schema validation, modify only the target section/item, and write back preserving
      other sections as raw data. (3) Added withFileLock for TOCTOU safety. (4) The merge function
      filters empty arrays, null/undefined, and false from non-raw fields while preserving strings,
      numbers, true, and objects (which represent meaningful mutations like budget settings). (5)
      Added 8 round-trip stability tests covering saveObservation, deleteObservation, saveMetaItem
      update, saveMetaItem add, deleteMetaItem, and cross-section mutation scenarios."
