  - _ulid: 01KM6ZY93T298G8J88RBYGZ700
    content: "Implemented TaskDataManager module (src/parser/task-data-manager.ts) wrapping existing
      monolithic task I/O behind a clean interface. Methods: listTasks (with filters), getTask,
      createTask, mutateTask, mutateTasks, deleteTask, addNote. Exported via src/parser/index.ts.
      All 9 spec ACs covered with 28 tests (including trait-error-guidance ACs). Full suite passes
      (6732 tests, 0 regressions). AC-8 (split format) documented as future — the interface is
      designed to support it when the split backend is added."
    supersedes: null
    author: "@claude"
