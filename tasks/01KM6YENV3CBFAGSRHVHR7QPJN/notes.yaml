  - _ulid: 01KM74P1C4Y2B2WV0DCJPEVGXS
    content: "Fix cycle 4: Addressed both review blockers. (1) AC-2 recursive discovery: Replaced the
      inline non-recursive scanDir in loadAllTaskSummaries with the existing findTaskFiles() from
      yaml.ts, which does recursive directory traversal. Both listTasks and loadAllTasks now use the
      same discovery function, so tasks in subdirectories are no longer missed. New test creates a
      nested submodule/nested.tasks.yaml and verifies both loaders discover the same tasks. (2) AC-9
      cross-path serialization: MonolithicBackend.mutateTasks now acquires per-task mutex locks
      (sorted by ULID to prevent deadlocks) for all target tasks before delegating to
      mutateTasksAtomically. This ensures concurrent mutateTask and mutateTasks calls on the same
      task serialize properly, preventing lost updates. New test runs mutateTask (priority=1) in
      parallel with mutateTasks (add tag) on the same task and verifies both changes are present
      after reload. Full suite passes (6746 tests, 0 regressions)."
    supersedes: null
    author: "@claude"
