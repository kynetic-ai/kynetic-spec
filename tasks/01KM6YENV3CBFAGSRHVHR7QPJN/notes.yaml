    content: "Fix cycle 1: Addressed both review blockers. (1) ac-2: listTasks now returns TaskSummary[]
      with only index-level fields — detail fields (notes, todos, description, etc.) are projected
      away by toTaskSummary(). Two new tests verify detail fields are absent on listing results. (2)
      ac-8: Added StorageFormat type and constructor parameter to TaskDataManager. When 'split' is
      activated, all operations throw a descriptive TaskDataManagerError with suggestion. Three new
      tests cover activation path, guard on all methods, and property inspection. Full suite passes
      (6737 tests, 0 regressions)."
