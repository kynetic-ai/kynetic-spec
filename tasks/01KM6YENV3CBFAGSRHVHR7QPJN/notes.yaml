  - _ulid: 01KM75AE51BQT4YCAT5V8GCTQF
    content: "Fix cycle 5: Replaced TaskMutexMap with a FIFO chained queue to fix the AC-9 blocker. The
      previous implementation had all waiters await the current holder's promise, so 3+ concurrent
      same-task mutations could enter the critical section simultaneously. The new implementation
      chains each waiter onto the predecessor's promise (not the holder's), ensuring strict
      serialization. Added a three-writer same-task test that verifies exclusive execution windows
      and no lost updates. Full suite passes (6747 tests, 0 regressions)."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-21T02:59:19.329Z
