  - _ulid: 01KM73TQN9K73GMX09WEA6FGZD
    content: "Fix cycle 3: Addressed both review blockers. (1) AC-2: MonolithicBackend.listTasks now
      uses loadAllTaskSummaries() which reads raw YAML and extracts only index-level fields via
      rawToSummary() — TaskSchema.safeParse is never called during listing. New test spies on
      TaskSchema.safeParse and confirms zero calls. (2) AC-5: Replaced file-scoped locking with
      per-task in-memory locks (TaskMutexMap). mutateTask acquires a per-task lock, runs the
      mutation callback outside the file lock, then acquires file lock only for the brief
      re-read+merge+write phase. Non-overlapping mutations on different tasks proceed concurrently.
      New timing test proves callback execution windows overlap. Exported raw-level helpers from
      yaml.ts for the backend to use. Full suite passes (6744 tests, 0 regressions)."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-21T02:33:16.201Z
