  - _ulid: 01KM72PDCAZQV0Z5QM1EEYTVFP
    content: "Fix cycle 2: Addressed both review blockers. (1) AC-8: Replaced the
      ensureBackendAvailable() guard that threw unconditionally with a proper TaskStorageBackend
      interface + backend registry. MonolithicBackend wraps existing yaml.ts functions. When 'split'
      is requested, the manager looks up a registered backend via registerBackend() — if none
      registered, throws with guidance. This satisfies AC-8's routing requirement: the architecture
      actually routes to the split backend when one is registered, rather than blocking all
      split-format usage. (2) Mutation validation: Added validateMutationOutput() using
      TaskSchema.safeParse() to validate the callback output in both mutateTask and mutateTasks
      before the result reaches the YAML writer. Invalid records (empty title, out-of-range
      priority, etc.) throw TaskDataManagerError with field info. 5 new tests cover validation, and
      AC-8 tests now verify backend routing with a mock split backend. Full suite passes (6742
      tests, 0 regressions)."
    supersedes: null
    author: "@claude"
