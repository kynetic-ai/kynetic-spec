  - _ulid: 01KFXSH5097E9GCNTCSRD4W0D8
    content: >-
      Implementation approach for ac-7 (root-level array handling):


      **Problem:**

      `merge-driver.ts` casts all parsed content as `Record<string, unknown>` (line 183-187), but
      *.tasks.yaml and *.inbox.yaml files are root-level arrays, not objects. This corrupts the
      output structure.


      **Files to modify:**

      - `src/cli/commands/merge-driver.ts` - detect if root is array vs object

      - `src/merge/arrays.ts` - ensure `mergeUlidArrays` works at root level


      **Approach:**

      1. Before calling `mergeObjectsWithArrays`, check if all three versions are arrays

      2. If arrays with ULID items, call `mergeUlidArrays` directly

      3. If arrays without ULIDs, apply appropriate strategy based on file type

      4. Only fall through to object merge for actual object roots


      **Verification:**

      - Test with actual *.tasks.yaml merge scenario (base, ours, theirs all arrays)

      - Verify output preserves array structure

      - Verify ULID-based deduplication still works
    supersedes: null
    author: "@claude"
    created_at: 2026-01-26T18:37:19.242Z
  - _ulid: 01KFXSKWMA8W9VJ9ZW4RC24EBH
    content: >-
      **Background - Why this matters:**


      When merging kspec-meta branches (e.g., during git merge/rebase of shadow branches), the merge
      driver corrupts *.tasks.yaml files.


      **How to reproduce:**

      1. Have two branches with different task changes

      2. Attempt merge: `git merge other-branch`

      3. Observe: Output YAML has object keys instead of array items


      **Example of corruption:**


      Input (correct):

      ```yaml

      - _ulid: 01KEZFXCM3...
        title: Task A
      - _ulid: 01KEZG58FJ...
        title: Task B
      ```


      Output (corrupted):

      ```yaml

      "0":
        _ulid: 01KEZFXCM3...
        title: Task A
      "1":
        _ulid: 01KEZG58FJ...
        title: Task B
      ```


      The file is no longer valid kspec YAML - arrays become objects with numeric string keys.


      **Root cause:**

      `src/cli/commands/merge-driver.ts:183-187` casts `versions.base/ours/theirs` as
      `Record<string, unknown>`. When JavaScript iterates an array as an object, you get numeric
      keys ("0", "1", etc).
    supersedes: null
    author: "@claude"
    created_at: 2026-01-26T18:38:48.970Z
  - _ulid: 01KG1MD1ZJR62YAG337KSTMKN5
    content: >-
      Implemented fix for AC-7 (root-level array handling in merge driver).


      Changes to src/cli/commands/merge-driver.ts:

      - Added isRootArray() helper for type detection

      - Added mergeRootArrays() function with ULID-based deduplication and field-level conflict
      detection

      - Updated performSemanticMerge() to detect root arrays and route to appropriate merge function

      - Updated applyResolution() to handle [ulid].field paths for array roots


      Tests added to tests/merge-driver-cli.test.ts (4 new tests):

      - Merge root-level task arrays with additions from both sides

      - Empty base with root-level array additions  

      - Field conflicts within root-level array items

      - Non-conflicting field additions in root arrays


      All 91 merge-related tests pass. PR #257 created.
