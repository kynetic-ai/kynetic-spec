title: Add debug logging for malformed hook input in parseHookInput
type: task
description: >-
  parseHookInput() in session.ts (after refactor: likely session/checkpoint.ts or session/create.ts)
  silently swallows JSON parse errors:

    function parseHookInput(stdin: string | null): StopHookInput | null {
      if (!stdin) return null;
      try {
        return JSON.parse(stdin.trim()) as StopHookInput;
      } catch {
        return null;
      }
    }

  Malformed JSON from a hook is silently ignored. Add a debug log in the catch block (using
  KSPEC_DEBUG or the project's debug logging pattern) so hook integration issues can be diagnosed:

    catch (err) {
      debug('parseHookInput: failed to parse stdin as JSON:', err);
      return null;
    }

  Depends on: @01KJ9ZBT (session.ts refactor)
