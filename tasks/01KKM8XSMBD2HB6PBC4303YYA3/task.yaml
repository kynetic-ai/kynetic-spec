title: Add workspace working directory instruction to dispatch prompt
type: task
description: "The dispatch prompt tells agents their workspace path but never explicitly instructs
  them to USE it as their working directory. Agents (especially pr-reviewer) default to cd-ing to
  the project root, which causes vitest to pick up test files from other worktrees under
  .kspec-worktrees/. Fix: add a CRITICAL instruction in the autonomous preamble telling agents to
  run all commands from their assigned workspace. Also fix vitest.config.ts to exclude
  .kspec-worktrees/."
