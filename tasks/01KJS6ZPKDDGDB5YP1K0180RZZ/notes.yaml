  - _ulid: 01KJVZKJ4P8694CFR50BTK46ZW
    content: "Implemented ACP framing EPIPE handling at source: JsonRpcFraming now routes stdout write
      and emitted stream errors through handleOutputError(), treats EPIPE/ERR_STREAM_DESTROYED as
      clean connection close, and rejects pending requests via framing close instead of uncaught
      exceptions. Added regression coverage in tests/acp.test.ts for sync throw + emitted EPIPE
      error paths, and removed test-level process uncaughtException EPIPE suppression in
      tests/ralph/adapter-auto-approve.test.ts. Verification: npx vitest run tests/acp.test.ts
      tests/ralph/adapter-auto-approve.test.ts (pass), npm test (pass: 173 files / 3629 tests),
      kspec validate (fails due pre-existing repo meta/reference/alignment issues unrelated to this
      task)."
    supersedes: null
