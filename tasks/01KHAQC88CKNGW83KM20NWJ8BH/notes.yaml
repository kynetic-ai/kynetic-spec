    content: "Implemented actual update logic for plan import --update flag. Previously the code had a
      placeholder comment 'Update logic would go here - for now, skip' with no actual
      implementation. Now updateSpecItem() is called with description, type, traits, and
      acceptance_criteria from the plan spec. Added 2 new tests: one verifying AC updates work
      correctly (creates spec with AC, imports plan with different ACs, verifies ACs are replaced),
      one verifying trait updates work (verifies traits and type are updated). All 29 plan import
      tests pass."
