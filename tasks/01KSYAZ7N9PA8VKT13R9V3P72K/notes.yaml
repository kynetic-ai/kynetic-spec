    content: "Approach: tests/agent-runner-e2e.test.ts will thread the runner layer across boundaries
      using existing infrastructure (runInvocation + mock-acp, createTestApp/makeRequest, kspec CLI,
      runner-config loaders). Covers ten compatibility flows mandated by the task plus AC
      annotations for storage, resolver, env/secret boundary, process inputs, dispatch preflight,
      and operator-surface ACs. Web UI coverage already exists in tests/e2e/agents.spec.ts runner
      surfaces describe block; the new file will add a daemon-API-to-UI payload-shape regression
      test that asserts the daemon emits exactly the field set the Playwright mocks rely on (runner,
      resolved_adapter, runner_validation on agents; runner+resolved_adapter on active/queued
      invocations) so the two layers cannot silently diverge."
