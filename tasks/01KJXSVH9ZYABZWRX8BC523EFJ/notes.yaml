  - _ulid: 01KJZ0CNBXKXG7QF6XVTD3T8H7
    content: >-
      Fix cycle 1 complete. Addressed all 4 review findings:

      - MUST-FIX 1: Added aria-live='polite' on active-invocations-section for DOM changes, plus
      sr-only assertive aria-live region for WebSocket invocation lifecycle announcements
      (started/completed/failed)

      - MUST-FIX 2: Added actionable empty state when dispatch is running but no active invocations,
      with guidance to run 'kspec tasks ready --eligible'

      - MUST-FIX 3: Replaced documentary error-boundary test with real API failure test using
      page.route() interception returning 500 errors

      - SHOULD-FIX 4: Fixed loading-state test determinism by using page.route() to delay API
      responses 500ms, ensuring skeleton is reliably visible

      Also fixed API route patterns in E2E tests (definitions endpoint is /api/meta/agents not
      /api/agent/definitions). All tests pass: root 3748/3750 (2 pre-existing codex failures),
      web-ui 63/63.
    supersedes: null
    author: "@claude"
    created_at: 2026-03-05T12:43:32.094Z
