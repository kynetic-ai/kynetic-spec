  - _ulid: 01KJYZB266DZA2EDE1096SDV6W
    content: "Review findings: MUST-FIX 1) Active invocation updates are streamed via WebSocket but the
      live-updating region has no aria-live announcement path; screen readers won't be notified of
      invocation changes (packages/web-ui/src/routes/agents/+page.svelte:187). MUST-FIX 2) Active
      Invocations list has no empty state when dispatch is enabled but there are zero active
      invocations, violating the checklist requirement that collection views provide actionable
      empty guidance (packages/web-ui/src/routes/agents/+page.svelte:187). MUST-FIX 3) E2E
      error-boundary coverage is currently documentary/fluff: the test named 'error message displays
      on API failure' never induces failure and only asserts no error is shown; this does not
      validate the failure path (packages/web-ui/tests/e2e/agents.spec.ts:213). SHOULD-FIX 4)
      Loading-state test is nondeterministic because it passes if either loaded content or skeleton
      is visible, so it can pass without proving skeleton behavior
      (packages/web-ui/tests/e2e/agents.spec.ts:203). Validation/tests run: kspec validate (global
      pre-existing repo issues, none specific to @ui-agent-dispatch), npm test (root pass: 3750
      passed, 3 skipped), packages/web-ui npm test pass (63 passed)."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-05T12:25:11.110Z
