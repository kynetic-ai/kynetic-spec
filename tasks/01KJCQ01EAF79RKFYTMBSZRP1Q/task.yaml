title: Fix shadow branch remote detection in shallow clones
type: task
description: "remoteBranchExists() uses git show-ref which relies on locally-fetched refs. In
  shallow clones, kspec-meta refs are never populated, causing init to create a fresh orphan branch
  instead of attaching to the existing remote one. Fix: use git ls-remote to query remote directly.
  Also fix initializeShadow to fetch the branch before worktree creation, and update ralph-container
  entrypoint check."
