notes:
  - _ulid: 01KW33Q596N2P4MZTZ5E3X76BY
    content: "Approach: add parser-level dispatch-fix handling in src/parser/coverage-resolution.ts
      using resolveCoverageTarget, CoverageResolutionResponseSchema, and TaskDataManager.createTask
      rather than a new queue or schema field. The task body will carry a durable
      Coverage-Resolution-Key marker plus neutral normalized coverage evidence. Idempotency will
      search unresolved tasks for that marker and reuse unless allow_duplicate is set. Edge cases:
      covered targets reject by default, dry-run creates no task, changed issue fingerprint produces
      a different key, automation_eligible only sets existing task.automation. Test plan: add
      behavioral coverage-resolution tests for all five @coverage-dispatch-fix-request ACs across
      failing/not-yet/re-verify/covered/idempotent/neutral fixture cases."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-26T23:19:55.942Z
  - _ulid: 01KW34S6SX88CX17E6P4XQNV28
    content: "Implemented dispatch-fix in src/parser/coverage-resolution.ts. The action now validates
      current coverage state, rejects covered targets by default, creates ordinary kspec tasks via
      TaskDataManager, stores a Coverage-Resolution-Key marker in the task description for
      idempotent reuse, derives the key from a stable issue fingerprint, and uses existing
      automation=eligible when requested without invoking dispatch directly. Added behavioral tests
      covering task shape for failing/not-yet/re-verify, default covered rejection, idempotent
      reuse/duplicates/changed fingerprints, neutral generated body content across two fixture
      projects, and normal automation fields. Verification run: format:check pass; focused oxlint
      pass; repo lint --quiet pass with existing warning baseline only; typecheck pass; kspec
      validate refs/alignment/completeness --warnings-ok pass with existing warnings; focused
      coverage-resolution test pass; full npm test pass (2914 suites, 11085 passed, 3 skipped)."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-26T23:38:31.613Z
  - _ulid: 01KW35HKYHTCFK093Q4NVAMV2X
    content: "Final verification after adding explicit allow_covered support: dispatch-fix now defaults
      to rejecting covered criteria but can create ordinary task work when allow_covered is true.
      Final gate results: format:check pass; focused oxlint pass; repo lint --quiet pass with
      existing warning baseline only; typecheck pass; kspec validate refs/alignment/completeness
      --warnings-ok pass with existing warnings; focused coverage-resolution test pass (20 tests);
      full npm test pass (2914 suites, 11086 passed, 3 skipped)."
