title: Buffer agent output in Active Fleet cards to show sentence-level text instead of raw token chunks
type: task
description: "The Active Fleet row on the task board shows raw streaming token chunks from
  agent_text_chunk WebSocket events, resulting in incomplete fragments like 'driven\\nform\\n.'
  being displayed. The output should be buffered and displayed at sentence or line level. Fix: (1)
  accumulate incoming chunks into a text buffer, (2) only display complete lines (split on newline),
  (3) show the last N complete lines (e.g. 3), dropping partial trailing content until the next
  newline arrives, (4) apply same fix to the dashboard Active Fleet component if it shares the same
  pattern."
