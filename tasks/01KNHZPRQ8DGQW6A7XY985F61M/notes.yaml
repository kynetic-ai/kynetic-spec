  - _ulid: 01KNK3PCG6VB9CD4RE5ZAVMKGN
    content: "Completed implementation: switched daemon runtime defaults from bun to node in config
      resolution and E2E fixtures, updated parser/API/serve tests to assert node as the default
      runtime, and changed generic serve startup gates to use node availability instead of bun. Also
      fixed the published-package runtime path by adding @elysiajs/node to root dependencies so
      npm-installed default-node daemon startup succeeds. Verification: npm test -- --fresh
      tests/parser/daemon-config.test.ts tests/cli-serve.test.ts tests/daemon-api/server.test.ts
      passed; npm test -- --fresh passed full suite (2082 suites, 7556 passed, 5 skipped); kspec
      validate reports only existing project warnings."
