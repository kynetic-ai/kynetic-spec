closed_reason: "Merged in PR #710. Fixed dispatch active fleet cleanup ordering by moving
  activeCount decrement and activeInvocationDetails deletion into the shadowMutex runExclusive
  callback before queue drain, so completed or terminally failed invocations no longer appear active
  while the next invocation runs. Added regression coverage for success and retry-exhausted failure
  paths in tests/agent-dispatch-engine.test.ts. Task has no spec_ref, so AC coverage was not
  applicable; targeted local regression tests passed and PR CI was green on the merged HEAD."
