title: Fix active fleet showing completed agents as still active
type: task
description: "The dispatch engine shows completed invocations as still active. Root cause: in
  _spawnInvocation (dispatch.ts), the cleanup chain is
  shadowMutex.runExclusive(runInvocation).then(drainQueues).finally(cleanupActiveDetails). The
  .then() calls _drainQueues which spawns the NEXT invocation via shadowMutex.runExclusive — but
  .finally() only runs after .then() completes. This means the old invocation's
  activeInvocationDetails entry persists until the next invocation finishes. Evidence: agents page
  shows reviewer as '1 active' with 15m elapsed, but sessions page shows that reviewer session
  completed 12m ago — the cleanup is blocked behind the currently running worker invocation (which
  holds the shadowMutex). Fix: move activeInvocationDetails.delete and activeCount decrement into
  the .runExclusive callback (after emitting the event), BEFORE the drain step. The .then should
  only handle draining, and .finally should only handle abort controller cleanup."
