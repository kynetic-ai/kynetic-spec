title: Round-trip stability for review record YAML writes
type: task
description: >-
  reviews.ts saveReviewRecord, mutateReviewAtomically, and deleteReviewRecord all load
  project.reviews.yaml through ReviewRecordsFileSchema.safeParse() before writing back. This adds
  ~13 Zod defaults (kind, entries, threads, checks, verdicts, events, notes, external_links, etc.)
  to every review record on each save, even records not being modified.


  Apply the same raw-data-preservation pattern used in the task write path fix (extractRawTaskArray
  + mergeTaskPreservingRawShape): load the raw YAML array, only schema-parse the target review,
  merge the result onto raw data to suppress Zod defaults for fields not originally present.
  Non-target reviews must be preserved as raw data.


  Verify with tests: write a reviews file, load and save one review without changes, confirm file is
  byte-identical.
