title: Fix agent completed count always showing 0 — aggregate from session history
type: task
description: "Agent cards show Active: 0, Completed: 0 because the completed count is only tracked
  in ephemeral page state via WebSocket events — it resets on page reload and the API never provides
  initial counts. Fix: (1) In daemon GET /api/agent/status endpoint (agent-dispatch.ts), query
  session store to aggregate completed session counts by agent_id, (2) return per-agent counts in
  agent_definitions array (e.g. completed_sessions: number), (3) in agents page, pre-populate
  completedCounts from API response on load instead of starting from {}. The active count works
  because it derives from active_invocations — completed needs the same server-side source of
  truth."
