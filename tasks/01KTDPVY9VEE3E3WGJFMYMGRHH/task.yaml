title: Canonicalize dispatch task identity across scheduler and workspaces
type: task
description: >
  Implement `@dispatch-canonical-task-identity` so task aliases never create duplicate dispatch
  invocations, fork workspace identity, or bypass cleanup protection.


  Covers:

  - @dispatch-canonical-task-identity ac-event-ingress-canonicalizes-task-identity

  - @dispatch-canonical-task-identity ac-invalid-or-mismatched-task-ref-rejected

  - @dispatch-canonical-task-identity ac-missing-display-ref-normalizes-from-task-id

  - @dispatch-canonical-task-identity ac-scheduler-alias-dedupe

  - @dispatch-canonical-task-identity ac-cross-agent-exclusivity-uses-canonical-task

  - @dispatch-canonical-task-identity ac-workspace-registry-canonical-task-identity

  - @dispatch-canonical-task-identity ac-historical-workspace-records-normalize-or-stale

  - @dispatch-canonical-task-identity ac-workspace-lineage-stable-across-aliases

  - @dispatch-canonical-task-identity ac-cleanup-protection-uses-canonical-task

  - @dispatch-canonical-task-identity ac-session-and-event-payloads-separate-id-from-display-ref

  - @dispatch-canonical-task-identity ac-alias-canonicalization-diagnostics


  Scope:

  - Add a shared dispatch task identity normalization path that resolves task-scoped inputs to a
  full task ULID and canonical ref (`@<task-ulid>`), while retaining the original/display ref
  separately.

  - Normalize task identity at dispatch ingress for daemon `/api/agent/events`, CLI-emitted dispatch
  events, file-watcher changes, bootstrap/reconciliation synthetic changes, and any
  post-invocation/retry queue paths that construct task candidates.

  - Update dispatch scheduler state so active invocation details, in-flight spawn markers,
  queued/retry candidates, same-agent dedupe, cross-agent per-task exclusivity, coalescing, cleanup
  protection, and scheduler diagnostics use canonical task identity for task equality.

  - Update workspace provisioning and registry lookup/validation so workspace ids, short task ids,
  active workspace uniqueness, non-closed workspace lookup, foreign-open-workspace detection,
  artifact cleanup protection, and branch/worktree reuse are keyed by canonical task ULID rather
  than arbitrary raw task refs.

  - Backfill or interpret resolvable historical workspace records with canonical task ULID identity;
  classify unresolvable historical task_ref records as stale or invalid with recovery guidance and
  ensure they do not cause duplicate workspace provisioning for resolvable aliases.

  - Preserve human/operator readability by retaining display refs in prompts, logs, notes, and CLI
  command targeting where useful, but do not use display refs as identity keys.

  - Reject or skip unresolved, ambiguous, or mismatched task refs before
  scheduling/provisioning/cleanup/session creation; valid task_id-only events normalize to
  `@<task_id>` as the default display ref.

  - Preserve existing valid behavior for canonical `@ULID` task refs, slug task refs, unique
  short-ULID task refs, worker/reviewer/fix-cycle dispatch, existing workspace registry records, and
  submission-linkage branch adoption.


  Required tests:

  - For ac-event-ingress-canonicalizes-task-identity and
  ac-missing-display-ref-normalizes-from-task-id: add ingress coverage showing valid `task_id` +
  slug ref, valid `task_id` with no ref, watcher/reconcile canonical refs, and unique prefix refs
  all produce canonical task identity with display ref kept separately.

  - For ac-invalid-or-mismatched-task-ref-rejected: add coverage for unresolved single task_ref,
  ambiguous single task_ref, and `task_id` plus different-task task_ref; verify diagnostics and that
  no queue, active, in-flight, workspace, cleanup, session, or lifecycle payload state is created
  using the invalid raw ref as task identity.

  - For ac-scheduler-alias-dedupe: add dispatch-engine regression coverage proving an active
  reviewer recorded under a slug ref prevents periodic or post-invocation reconciliation from
  spawning a second reviewer for the same task under the canonical ULID ref, and add same-agent
  active/queued/in-flight dedupe coverage for slug, full ULID, and unique short-ULID aliases of the
  same task.

  - For ac-cross-agent-exclusivity-uses-canonical-task: add coverage proving a worker active or
  in-flight under one alias defers a reviewer candidate under another alias until the canonical
  task's active/in-flight invocation completes and stale checks pass.

  - For ac-workspace-registry-canonical-task-identity and
  ac-historical-workspace-records-normalize-or-stale: add registry/provisioning coverage proving an
  existing non-closed workspace record for one alias is reused by another alias, multiple non-closed
  records for aliases of the same canonical task are rejected or reported, resolvable historical
  records are backfilled/interpreted canonically, and unresolvable historical records become
  stale/invalid with recovery guidance.

  - For ac-workspace-lineage-stable-across-aliases: add workspace identity/naming coverage proving
  slug, full-ULID, unique-prefix, and changed-primary-slug references do not create different
  workspace ids, branch lineages, worktree paths, or workspace records for the same task.

  - For ac-cleanup-protection-uses-canonical-task: add artifact cleanup coverage proving active,
  in-flight, provisioning, stale/recoverable, and non-closed registry state under one alias protects
  artifacts discovered under another alias.

  - For ac-session-and-event-payloads-separate-id-from-display-ref: add invocation/session lifecycle
  coverage proving canonical task id/full ULID and display task ref are separate fields and identity
  consumers use the canonical field.

  - For ac-alias-canonicalization-diagnostics: add diagnostics/status coverage proving
  discard/defer/reuse/reject/preserve decisions include canonical task ULID when known, original raw
  ref when available, agent/workspace id when applicable, and the decision reason.


  Verification gates:

  - npm run format:check

  - npm run lint -- --quiet

  - focused oxlint for touched source and test files

  - npm run typecheck

  - focused dispatch/workspace tests, including agent-dispatch-engine,
  canonical-task-workspace-contract, dispatch-artifact-protection, and daemon dispatch route tests
  if touched

  - full npm test if focused suites pass

  - KSPEC_NO_DAEMON=1 kspec validate --schema --warnings-ok

  - KSPEC_NO_DAEMON=1 kspec validate --refs --warnings-ok

  - KSPEC_NO_DAEMON=1 kspec validate --alignment --completeness --warnings-ok


  Out of scope:

  - Do not stop, restart, or reconfigure the live daemon.

  - Do not cancel or stop existing duplicate sessions as part of this implementation task.

  - Do not change task slug resolution semantics outside dispatch identity normalization.

  - Do not remove slug/display refs from prompts, logs, status output, or CLI-facing text when they
  are not used as identity keys.

  - Do not change runner/adapters, ACP invocation semantics, or worker/reviewer prompt semantics
  except where task identity fields are carried separately from display refs.

  - Do not perform unrelated workspace cleanup or delete historical workspace records unless
  required to migrate/validate canonical task identity safely.
