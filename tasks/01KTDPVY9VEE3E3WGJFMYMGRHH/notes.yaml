  - _ulid: 01KTDVT6G8WN8F5EJGHY465XCN
    content: "Resumed after prior invocation timed out with uncommitted in-flight work. Rebased onto
      origin/dev (clean — dev's new commits were in src/agents/, no overlap). Ran full gate suite:
      format/typecheck/repo-lint(0 errors) green; focused oxlint surfaced one new warning
      (normalizeProtectionKey closure recreated per call) which I fixed by hoisting it to module
      scope in workspace.ts. Full npm test surfaced 10 failures in
      dispatch-workspace-cleanup{,-completion}.test.ts: these called
      reconcileDispatchWorkspaceArtifacts/reapDispatchWorkspace with the old activeTaskRefs option,
      which the canonical work renamed to activeTaskIds (canonical ULIDs), so protection was
      silently dropped and artifacts reaped. Fixed by (a) making reapDispatchWorkspace normalize
      protection keys via the shared normalizeProtectionKey (tolerates @-prefix/case, consistent
      with buildDispatchArtifactProtectionState) and (b) renaming the option at the test call sites
      to activeTaskIds. All cleanup suites now pass (41 tests); focused dispatch/workspace suites +
      new identity suites all green. Re-running full suite to confirm no other regressions before
      submit."
    supersedes: null
    author: "@claude"
