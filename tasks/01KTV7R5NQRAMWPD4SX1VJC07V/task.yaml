  an export named 'registerItemCommands' from dist/cli/commands/index.js. A rerun through the
  project runner with 'npm test -- tests/daemon-command-api.test.ts' passed all 38 tests, so this
  appears flaky or environment/order-dependent rather than caused by the docs-only change.
  Investigate why the full suite can observe stale or incompatible dist/cli command output and make
  the test deterministic."
