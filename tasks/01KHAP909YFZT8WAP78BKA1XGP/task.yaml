description: "Distinguish graceful exit from abort in task-work-loop: when the workflow exits
  because no eligible tasks exist, record as status:completed with result:no_work_available instead
  of status:aborted. Makes abort rate meaningful (actual failures) vs normal loop termination. Data:
  11 of 16 'aborts' were normal no-work exits, inflating abort rate to 69%."
