    content: "Infra fix: when loop exits because no eligible tasks exist, record status:completed with
      result:no_work_available instead of status:aborted. Currently 11/16 aborts are normal no-work
      exits, inflating abort rate to 69%."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-13T05:06:15.998Z
  - _ulid: 01KHD0XPCK04C9QVQVHWQ2K606
    content: "Added kspec workflow complete command with --result option. Supports success,
      no_work_available, early_exit results. Added result field to WorkflowRunSchema. 14 tests
      cover: completing runs with/without result, validation of invalid results, error handling for
      already-completed/aborted runs, completing paused runs."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-14T02:50:48.595Z
