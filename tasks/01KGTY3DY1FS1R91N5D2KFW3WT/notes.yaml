    content: "Implementation: In batch validation (batch-exec.ts), when unknown arg key is encountered,
      compare against CommandMeta positional names using string similarity or simple prefix
      matching. Format: 'Unknown arg \"content\" for \"inbox add\". Did you mean \"text\"? Run kspec
      batch commands for reference.' ~15 lines. Pairs with batch commands discoverability task."
