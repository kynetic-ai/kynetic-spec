    content: >-
      Implemented did-you-mean suggestions for batch validation errors:

      1. Added 'suggestion' field to BatchCommandResult type to propagate suggestions from
      validation

      2. Updated CLI output to show 'Did you mean: X?' when suggestions are available

      3. Added 'Run kspec batch commands' hint at the end of all validation errors

      4. Hint only appears in human-readable output, not JSON mode

      5. Added 4 new tests for suggestions and hint display
