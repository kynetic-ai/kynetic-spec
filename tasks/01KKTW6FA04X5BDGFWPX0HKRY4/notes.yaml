    content: "Implemented GET /api/reviews and GET /api/reviews/:id endpoints. Added ReviewSummary and
      ReviewDetail types in shared/src/api.ts following PlanSummary/PlanDetail patterns. Reviews
      route supports filtering by status (default: open), disposition, subject-type, reviewer,
      linked task, and branch. Pagination uses standard limit/offset pattern. Detail endpoint
