  - _ulid: 01KGVGZHRPM50MHRNSZ48T0EN8
    content: "Implementation: Needs design/spec work. Key decisions: (1) Lifecycle — kspec worktree
      create @task creates worktree on new branch, kspec worktree cleanup removes it. (2) Shadow
      branch — worktrees share the same .kspec/ (single source of truth for tasks), or each gets a
      read-only copy. Sharing is simpler but risks concurrent writes. (3) Naming — branch:
      agent/<task-slug>, worktree dir: .worktrees/<task-slug>. (4) Integration — ralph could
      auto-create worktree per task, merge back on completion. Start with manual create/cleanup, add
      ralph integration later."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-07T07:45:06.838Z
