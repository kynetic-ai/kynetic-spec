notes:
  - _ulid: 01KGVGY4W7Z0QCMW9Y1RT6QJCN
    content: "Implementation: Needs spec/design first. Core question: how does step tracking work
      without a run file? Options: (1) ephemeral field on workflow definition in meta YAML, (2)
      --ephemeral flag on workflow start, (3) both with override. Execution model: write run file to
      temp location (not .kspec/), auto-delete on completion. workflow next/show still work via temp
      file. No shadow commits during run. Not shown in workflow runs. This avoids rethinking the
      execution model while achieving the goal of no persistent noise. Affects: workflow start,
      next, show, runs commands."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-07T07:44:20.871Z
