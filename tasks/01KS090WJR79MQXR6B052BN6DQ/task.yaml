title: Stabilize cli-no-daemon auto-start process assertion
type: bug
description: "During review of @task-stabilize-bun-websocket-runtime-parity-startup-hook on
  2026-05-19, npm test -- --fresh failed in tests/cli-no-daemon.test.ts:145: 'KSPEC_NO_DAEMON
  auto-starts the daemon with the configured node runtime even when the CLI runs under bun'. The
  test waits for the auto-started daemon PID file, then immediately runs 'ps -p <pid> -o command=';
  the process was already gone, so ps exited 1. A focused fresh rerun of tests/cli-no-daemon.test.ts
  reproduced the same failure. The reviewed branch only changes
  tests/daemon-api/websocket-protocol.test.ts and has no diff in tests/cli-no-daemon.test.ts,
  src/cli, src/daemon, src/daemon-shared, or tests/helpers, so this is not introduced by that task.
  Investigate why the auto-started daemon exits before the assertion or make the test wait/assert
  against stable daemon state without masking real auto-start failures."
