title: "Spike: Validate claude-agent-acp 0.18.0 runtime compatibility"
type: spike
description: >-
  Cannot determine from code analysis alone whether the _meta.claudeCode.* fields survive the
  MCP-to-native-tools migration in PR #316. Needs runtime testing.


  ## Context


  PR zed-industries/claude-agent-acp#316 (merged 2026-02-18) removed the custom MCP server that
  proxied tools and switched to Claude Code's built-in tools. This changes how tool calls flow
  internally, which could affect the _meta structure on SessionUpdate events.


  ## What to validate


  1. Install claude-agent-acp@0.18.0 globally

  2. Run a ralph loop (single iteration, simple task) and capture events.jsonl

  3. Check events for these critical fields:


  _meta.claudeCode.toolName:

  - Still present on tool_call and tool_call_update events?

  - Value is bare name ("Bash") not MCP-prefixed ("mcp__acp__Bash")?

  - Our normalizeTool() already strips prefixes, so prefix change is safe — but field absence is NOT
  safe.


  _meta.claudeCode.toolResponse:

  - Still present on tool completion events?

  - Still has stdout/stderr structure?

  - Or has it moved to rawOutput / _meta.terminal_output.data?


  --dangerously-skip-permissions:

  - Still accepted as a CLI flag?

  - Still skips permission prompts?


  session/request_permission:

  - Still sends option.kind = "allow_always" / "allow_once"?

  - Still sends option.optionId field?


  4. Check the 0.14.0, 0.15.0, 0.16.0, 0.17.0 changelogs for any other breaking changes between our
  0.13.2 and target 0.18.0.


  ## Fallback paths already in our code


  extractToolName() has 4-level fallback: _meta.claudeCode.toolName -> _meta.toolName -> name ->
  title

  extractToolOutput() has 3-level fallback: rawOutput -> _meta.claudeCode.toolResponse -> output


  If fields moved but data is still present somewhere in the update, our fallbacks may already
  handle it. The spike should confirm.


  ## Outcome


  Document which fields changed (if any) and whether our existing fallback chains handle them. If
  changes needed, create follow-up tasks with specific field mapping updates.
