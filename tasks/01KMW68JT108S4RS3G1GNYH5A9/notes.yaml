  - _ulid: 01KMWCFE9VV9YJSQXJ1G99MTCJ
    content: "Fix cycle 3: addressed the blocker from review @01KMWABZ. The it.todo() stubs have been
      replaced with 4 behavioral tests that exercise the real ProjectEntityCache. Added a
      DomainReadyCallback type and optional onDomainReady parameter to the constructor — this is the
      hook point for wiring domain-ready events to PubSubManager broadcast in the server. Tests
      verify: (1) loading→ready fires callback, (2) degraded→ready fires callback, (3) event
      includes domain+projectPath+previousState, (4) reload of already-ready domain does NOT fire
      callback (respects ac-stale-during-reload). Full suite passes: 7092/7097 (5 skipped, 0
      failures)."
    supersedes: null
