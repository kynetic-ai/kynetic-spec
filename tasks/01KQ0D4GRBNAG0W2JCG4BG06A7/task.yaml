description: >-
  Convert seed plan @cruft-03-trait-normalization-seed into a proper reviewed implementation plan
  for: Convert cruft seed 03 into Trait Normalization plan.

      Intent:
      This is a manual planning task in the Spec Cruft Cleanup Program. It is not implementation work and should not directly edit specs/code except as needed to create, import, and review the downstream plan. The seed record is a non-derivable planning artifact; the output of this task should be a new clean derive-ready plan with slug `trait-normalization` (or an explicitly chosen replacement slug if scope is split).

      Source records to read first:
      - Program charter: @cruft-cleanup-program-charter
      - Seed plan: @cruft-03-trait-normalization-seed
      - Audit summary file: /home/chapel/Projects/kynetic-spec/plans/cruft-audit-2026-04-24.md

      Dependency/context:
      This task should be picked up after: @task-convert-cruft-01-spec-catalog-health-plan, @task-convert-cruft-02-backfill-process-retirement-plan.

      Focus of the downstream plan:
      Plan cleanup of broad, conflicting, or misapplied traits so inherited ACs become precise and safe to reuse before broad spec rewrites.

      Include in the planning work:
      - @trait-semantic-exit-codes vs @cli-exit-codes conflict.
  - Splitting broad list/API/WebSocket/markdown/input-boundary traits.

  - Inheritor audit and migration strategy.

  - Compound trait AC splits and Covers/annotation updates.

      Exclude from this planning task:
      - Full CLI/schema rewrite.
  - Full API/daemon/web contract split except trait definitions needed to unblock later plans.

  - Code changes unless required by trait behavior validation.

      Required process:
      1. Re-read the program charter and seed record via `kspec plan get` or `kspec plan export`; do not rely on chat history.
      2. Re-run the relevant discovery/validation commands named in the seed because audit counts may have changed.
      3. Check for overlap with existing plans/tasks before creating duplicate work.
      4. Write a normal kspec plan document with behavioral Specs and standalone Tasks, or split the seed into multiple smaller real plans if the seed is too broad.
      5. Parse/validate the plan document before import.
      6. Import the real plan as draft with a clean slug/title.
      7. Run `kspec agent run plan-reviewer` with the charter/seed/audit as background context only; the real plan itself must stand alone.
      8. Iterate until the real plan is review-ready or clearly blocked by a product/design decision.
      9. Add a note to @cruft-03-trait-normalization-seed linking to the real plan(s) created and summarizing any split/deferral decisions.

      Done when:
      - A new draft implementation plan exists for trait normalization, or the seed is split into narrower draft plans.
  - The plan includes exact current trait refs/inheritors and clear migration tasks.

  - The seed has a note linking to created plan(s).

      Automation:
      Manual-only. This task involves planning judgment, scope control, and review-loop decisions. Do not mark automation eligible without explicit human direction.
