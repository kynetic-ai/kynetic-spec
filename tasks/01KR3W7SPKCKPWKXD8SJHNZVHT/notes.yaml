      - localhost:${port} URL constructions outside the shared fixture — only: (a)
      tests/cli-daemon-proxy.test.ts (six in-test stub HTTP server URL parses on incoming req.url —
      not outgoing daemon requests), and (b) tests/cli-serve.test.ts:427,787 — both anchored with
      @cli-lifecycle-test-endpoint-consumption ac-direct-loopback-url-exception-is-endpoint-subject
      and @daemon-network-endpoint-contract ac-default-ipv6-fallback annotations; the literal IPv4
      URL is the test subject (binding host or IPv6-fallback negative proof). The remaining
      tests/cli-serve.test.ts hit (line 48) is the helper docstring describing the contract.

      - oxlint-disable comments naming no-leaky-test-daemon outside the lint suite — none. All
      disables are inside tests/lint-daemon-test-guardrails.test.ts as rule fixtures.


      Validation conclusion: every new spec AC has truthful behavioral coverage; every remaining
      guardrail suppression, direct daemon entrypoint reference, and direct loopback URL
      construction is either inside the lint rule's own fixtures or anchored to the behavior under
      test by an AC annotation that ties it to ac-direct-loopback-url-exception-is-endpoint-subject
      or to the immediately surrounding lifecycle/binding-host subject. No new daemon-testing spec
      metadata mismatches were introduced by this plan.
