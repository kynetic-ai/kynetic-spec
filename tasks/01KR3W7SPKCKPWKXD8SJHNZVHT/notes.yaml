      Source audit (remaining direct daemon entrypoint starts, detached lifecycle commands,
      localhost:port URLs, guardrail disables):

      - Direct daemon entrypoint references (dist/daemon/index.js) outside helpers — only:
      tests/cli-no-daemon.test.ts:148 (assertion-only on ps output of CLI-spawned daemon) and
