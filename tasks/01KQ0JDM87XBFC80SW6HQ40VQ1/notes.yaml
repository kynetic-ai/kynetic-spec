      REMAINING WARNING CATEGORIES AND CLEANUP OWNERSHIP:


      1. Missing own-AC coverage (234): Owned by @plan-completeness-warning-debt-reduction. This is
      the broad completeness backlog — not in scope for this validation-trust plan.


      2. Blanket-ref invalid annotations (36): These are annotations like '// AC: @cli-exit-codes'
      that name a spec but no specific AC id. The underlying tests DO cover behavior but the
      annotation format doesn't satisfy the scanner's ac-* pattern. Owned by
      @plan-completeness-warning-debt-reduction (annotation format upgrade pass).
         Affected refs: @cli-exit-codes (13), @cmd-clone-for-testing (7), @multi-ref-batch (7), @stale-status-detection (5), @cmd-log (4).

      3. Unresolved target annotations (2): @test-feature (E2E fixture) and @test-trait (inline test
      content). These are intentional test fixtures for the coverage scanner itself. Owned by
      completeness debt — could be excluded by tightening scan config or marked as intentional.


      4. Reference error (1): @cmd-derive on a completed task in kynetic.tasks.yaml. Historical
      stale ref. Owned by cleanup of legacy kynetic.tasks.yaml entries.


      5. Reference warnings (7): Deprecated item refs (@task-storage, @session-summary-cache,
      @task-activity-git-query) on historical tasks. Owned by general task metadata hygiene.


      6. Alignment warnings (35): 33 orphaned specs (no tasks) + 2 status mismatches. Pre-existing
      and stable. Owned by spec-task alignment sweep (future plan).


      7. Automation-eligible-no-spec (1): One task has automation eligible but no spec_ref. Owned by
      @task-triage-automation-eligible-missing-spec-ref.


      VALIDATION COMMANDS RUN:

      - kspec validate --refs --warnings-ok -v (exit 0 in worktree, exit 4 at root)

      - kspec validate --alignment -v (exit 6 — warnings)

      - kspec validate --completeness -v (exit 6 — warnings)


