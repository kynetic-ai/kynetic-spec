      - tests/validate-task-data-source.test.ts: 12/12 pass

      - tests/ac-annotation-validation.test.ts: 35/35 pass

      - tests/coverage-annotation-scope-boundaries.test.ts: 14/14 pass

      - tests/validate-integration.test.ts: 18/18 pass

      - tests/validate-exit-codes.test.ts: 15/15 pass

      - tests/validate-mode-selection.test.ts: 6/6 pass

      - tests/trait-ac-coverage.test.ts: 7/7 pass

      Total: 107/107 pass


      Note on worktree vs root validation: Task-aware validation (Tasks checked > 0) requires the
      shadow branch (.kspec/) to be present. The worktree at .kspec-worktrees/ does not have
      .kspec/, so Tasks checked: 0 there is expected. Root checkout validation correctly shows Tasks
      checked: 1444 after the task-data-manager-read-path fix.
