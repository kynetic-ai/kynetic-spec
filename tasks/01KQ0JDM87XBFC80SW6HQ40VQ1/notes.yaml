      DELTAS:

      | Metric | Before | After | Delta |

      |--------|--------|-------|-------|

      | Tasks checked | 0 | 1444 | +1444 (FIXED) |

      | Reference errors | 0 (false) | 1 | +1 (now visible) |

      | Reference warnings | 0 | 7 | +7 (now visible via task loading) |

      | Alignment warnings | 36 | 35 | -1 |

