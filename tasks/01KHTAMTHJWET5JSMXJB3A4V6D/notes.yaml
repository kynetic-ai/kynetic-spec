      Implementation complete. Changes:

      1. Added _type: z.literal('skill').default('skill') to SkillSchema

      2. Created isSkill() type guard function in src/schema/meta.ts

      3. Updated getMetaItemType() to use isSkill() instead of 'origin' in item check

