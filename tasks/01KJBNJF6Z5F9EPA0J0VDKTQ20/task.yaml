description: >-
  Replace tests/daemon-websocket.test.ts (591 lines, all static analysis) with Playwright E2E tests.


  Write: packages/web-ui/tests/e2e/api-websocket.spec.ts

  Using: daemon fixture from tests/fixtures/test-base.ts


  Note: existing connection.spec.ts tests WebSocket reconnection via the UI. These new tests should
  verify the WebSocket protocol directly using page.evaluate() to create raw WebSocket connections,
  or use Playwright's page.waitForEvent('websocket') API.


  Behaviors to test:

  - Connect to ws://localhost:3456/ws — receive 'connected' event with session_id (@api-contract
  ac-25)

  - Send subscribe command — receive ack response with matching command_id (@api-contract ac-26,
  ac-27)

  - Trigger a mutation (POST /api/tasks/:ref/note) — receive broadcast event via WebSocket
  (@api-contract ac-28 through ac-33)

  - Heartbeat: server sends ping, client responds pong (@trait-websocket-protocol ac-5)


  Note: existing E2E connection.spec.ts has a SKIPPED test for WebSocket task updates due to 'daemon
  WebSocket upgrade returns 200 instead of 101'. Investigate if this is still an issue. If WebSocket
  connections work in the fixture, the skip can be removed.


  After E2E tests pass, delete tests/daemon-websocket.test.ts.

  Run: npm test && npm run test:e2e to verify.
