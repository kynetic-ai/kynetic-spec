  - _ulid: 01KXNBTGV9AW28DDY02Y5HF6AF
    content: "Approach: reuse the shared strict DispatchLifecycleStatusSchema at the web API boundary,
      add deterministic camelCase conversion plus a centralized matching-scope lifecycle action
      model, and migrate every listed consumer to that model. Minimal dependency repair: the merged
      public status route omitted required active_count, so add that exact wire field rather than
      synthesize evidence in the client. Edge cases: legacy absent authority with active work,
      global versus unrelated task cleanup, mixed pending/failed cleanup, stale 409 refresh, static
      read-only controls, retry without auto-resume, canonical task identity, fixed sanitized
      failures, focus/live announcements, and active evidence during draining/cleanup. Test plan:
      behavioral API fetch/control requests and exact conversion/rejection fixtures; pure
      action-matrix coverage for all global/task states; rendered consumer/accessibility assertions
      where supported; agents-topic invalidation including automation events; existing fleet buffer
      regressions; all 16 @ui-agent-dispatch ACs annotated."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-16T11:43:36.297Z
  - _ulid: 01KXNDSS8CHMJ1CWTX5HJCX14D
    content: "Implemented the complete lifecycle UI migration. Consumer inventory: API boundary, agents
      route/status/active/queued/held rows, dashboard, task board fleet, automation
      triggers/status/event log, and centralized agents-topic invalidation. Fallbacks: exact stopped
      static model and legacy absent-authority false+active projection as Legacy unknown/stopping
      while preserving active evidence. Control matrix: global running pause/stop; paused
      resume/stop; stopped idle start; stopped matching global cleanup retry stop; task absent
      pause/stop, paused resume/stop, stopped idle resume, stopped matching cleanup retry stop.
      Accessibility: fixed hard-stop dialog copy, labelled controls, canonical held-task test IDs,
      polite atomic announcements, focus restoration, disabled static controls, and
      reduced-motion-safe loader. Invalidation: non-stream agents lifecycle/status events refresh
      agents.all and automation.events; invocation events also refresh sessions. Failures use the
      closed fixed copy map and retain returned evidence. Verification: focused UI 96 tests; daemon
      lifecycle 54 tests; full suite 10869 passed/3 skipped; format, repo lint, focused lint,
      typecheck, build, diff check, refs/alignment/completeness validations all green."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-16T12:18:09.293Z
