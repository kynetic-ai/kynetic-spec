  - _ulid: 01KM9GNAFRS8TCJXPSJWEA5583
    content: "Fix cycle 1: Addressed review blocker — guard now resolves shadow directory from
      kspec.config.yaml via loadProjectConfig() instead of using hardcoded SHADOW_WORKTREE_DIR
      constant. evaluateWorktreeGuard() accepts optional GuardOptions.shadowDirectory, CLI handler
      loads config and passes it. All detection helpers (isShadowWorktreePath, isCdToShadowWorktree,
      isInKspec) parameterized on shadowDir. Added 8 tests covering custom shadow directory
      scenarios including .specs as configured dir, substring prefix protection, and default
      fallback. All 64 guard tests pass."
