  - _ulid: 01KM5TK96QXGZEKM1V8R1DW9KB
    content: "[FIX_CYCLE: 1] Restored manifest daemon deprecation warnings under KSPEC_NO_DAEMON by
      moving the no-daemon gate to after context loading and warning emission in
      maybeAutoStartDaemon(). Tightened regression coverage so the warning test runs with the
      default KSPEC_NO_DAEMON=1 path, and made the explicit serve-status test deterministic by
      avoiding fake daemon HTTP probes. Verification: npm test passed (291 files, 6662 tests, 3
      skipped); kspec validate still reports pre-existing repo validation issues unrelated to this
      task."
