  - _ulid: 01KM5S7Z67A873QM62WVPGPZX3
    content: Implemented KSPEC_NO_DAEMON suppression in the CLI daemon probe path and auto-start hook.
      Explicit serve commands now bypass the suppression via an ignoreNoDaemon override, vitest
      defaults KSPEC_NO_DAEMON=1 to prevent incidental daemon traffic, E2E fixtures unset it for
      managed daemons, and daemon-dependent tests opt back in with KSPEC_NO_DAEMON=0 where needed.
    supersedes: null
