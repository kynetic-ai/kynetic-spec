title: Reload session.idle hook presence during dispatch reconciliation
type: task
description: >-
  What: Update the dispatch engine's _reconcile() method to reload _hasSessionIdleHooks from meta,
  not just during _loadAgents().


  Why: Currently _hasSessionIdleHooks is only set in _loadAgents() (dispatch.ts:1575), which runs on
  bootstrap and task state changes. If a user adds a session.idle hook while dispatch is running,
  invocations spawned before the next _loadAgents() call will use idleGracePeriodMs=0, causing
  sessions to close immediately after one turn instead of waiting for async prompt delivery. The
  session works correctly but silently ignores the new hook.


  How: In _reconcile() (or a periodic meta check), re-read meta.hooks and update
  _hasSessionIdleHooks. The simplest approach is to call the hook presence check in _reconcile()
  since it already runs periodically. Alternatively, extract the hook check into a shared helper
  called from both _loadAgents() and _reconcile(). Add a test: start dispatch with no session.idle
  hooks (verify grace=0), add a hook to meta, trigger reconciliation, verify subsequent invocations
  use DEFAULT_IDLE_GRACE_MS.
spec_ref: "@multi-turn-session-lifecycle"
meta_ref: null
