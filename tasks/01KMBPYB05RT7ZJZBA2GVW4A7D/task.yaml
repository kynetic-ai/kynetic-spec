closed_reason: Merged to dev. Extracted _updateSessionIdleHookPresence() helper called from both
  _loadAgents() and _reconcile(), ensuring hooks added while dispatch is running are picked up
  during periodic reconciliation. Test verifies grace period transitions from 0 to
  DEFAULT_IDLE_GRACE_MS after hook is added and reconciliation runs.
