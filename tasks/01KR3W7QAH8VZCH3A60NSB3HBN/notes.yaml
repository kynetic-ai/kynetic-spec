    content: "Approach: tighten detachWithoutCleanup() to require in-flow cleanup registration before
      next await/expect. Removing hasAncestorAfterEachCleanup() and the
      describeStack/hasTopLevelAfterEachCleanup machinery that supports it. Existing
      hasCleanupAfter() already enforces same-control-flow cleanup; in-try-with-finally cleanup also
      stays. Updating two stale lint-no-leaky-test-daemon tests that asserted ancestor afterEach was
      sufficient (the very pattern this task forbids). Unwrapping expectClassifierGap() wrappers in
      the 4 detached-cleanup-timing regressions so post-fix assertions stand. Auditing
      cli-serve.test.ts to confirm every detached start either captures pid+onTestFinished inline
      before any await/expect, or carries a local oxlint-disable-next-line with a behavior reason."
