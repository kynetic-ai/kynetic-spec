notes:
  - _ulid: 01KM4BQ340A2QWBTGYN5598G3H
    content: "Reproduced checkout dependency drift in the current repo: npm run build fails with TS2307
      for croner because node_modules/croner is absent even though package-lock.json includes it.
      Investigating dispatch bootstrap reuse and setup/bootstrap dependency freshness checks to
      force reinstall when package manifests drift from installed modules."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-20T00:53:22.176Z
  - _ulid: 01KM4C6HZBWQB8RMYCHH0H2BS7
    content: Hardened dependency freshness checks across bootstrap, test, and dispatch flows. Added
      manifest-aware direct dependency detection so new packages like croner invalidate stale
      node_modules, taught dispatch bootstrap to run an implicit npm ci repair step before prompt
      delivery when a worktree is missing declared deps, and added regression coverage for
      bootstrap/test runner detection plus dispatch workspace repair reuse. Verified with focused
      tests and full npm test.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-20T01:01:48.907Z
  - _ulid: 01KM4CZTKRGR3WAPWD7A97SKS0
    content: "[FIX_CYCLE: 1] Review verdict: changes_requested by jacob.chapel@gmail.com"
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-20T01:15:36.953Z
  - _ulid: 01KM4DEP85QHTAF5P25CX8CMZ4
    content: "[FIX_CYCLE: 2] Separated transient dependency-repair invalidation from the persisted
      bootstrap config hash. The implicit npm ci repair step still forces a rerun while dependencies
      are missing, but once the workspace is healthy the next bootstrap now reuses prior success
      instead of surfacing a synthetic bootstrap-config-changed rerun. Added a regression assertion
      that the post-repair run is reused."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-20T01:23:44.005Z
