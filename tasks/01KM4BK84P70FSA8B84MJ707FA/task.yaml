title: Fix dispatch checkout dependency drift after new npm deps
type: bug
description: "Dispatch and sibling checkouts can run with stale node_modules after new runtime
  dependencies are added. In /home/chapel/Projects/kynetic-spec-dispatch, node_modules/croner is
  missing even though package.json/package-lock.json require it. Current symptoms: npm run build
  fails with TS2307 for croner in src/agent-runtime/schedule-engine.ts and src/schema/schedules.ts,
  and the built CLI fails at runtime with ERR_MODULE_NOT_FOUND for croner before foreground serve
  tests can be trusted. Investigate why checkout/bootstrap/setup is not refreshing dependencies for
  dispatch worktrees and make the workflow detect or repair missing package installs before
  review/test runs."
