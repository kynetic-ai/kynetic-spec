notes:
  - _ulid: 01KN4481G2DKXD42WQCRMHGAQQ
    content: "Approach: reproduce the named navigation/plans/session-context flakes with focused
      Playwright reruns against the current dev-aligned branch, inspect the affected test helpers
      and route handlers, and keep fixes scoped to stable behavioral signals rather than timeout
      inflation. Edge cases: browser-history state settling after goBack/goForward, embedded plan
      batch failures racing against plan expansion/render fallback, and session-index/cache timing
      after writing fixture sessions during a live daemon test. Test plan: repeated targeted reruns
      for each named case, then a combined broader rerun of the affected specs and final npm test
      plus targeted e2e verification before submit."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-01T08:58:30.786Z
  - _ulid: 01KN44J42HXFQ9MZG4MPBCJP3V
    content: "Reproduced two distinct flakes. The navigation forward/back case was a Playwright history
      wait race ( aborting while the app swapped documents) and was stabilized by waiting on the URL
      transition explicitly. A second rerun surfaced the session-context API cases as cache/watch
      timing issues: the tests seed  after daemon startup, so the assertions need to wait for the
      daemon-backed related-session endpoints to observe the new directories before expecting
      non-zero totals."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-01T09:04:01.105Z
  - _ulid: 01KN452KDS878R5WK7KXZDHQQV
    content: "Root causes and verification: (1) tests/e2e/navigation.spec.ts forward/back was a
      Playwright browser-history race, stabilized by waiting on the back URL and using an explicit
      forward URL wait instead of relying on the default goForward load wait. (2) The
      session-context API and sessions-list cases exposed a stale-empty daemon read path when newly
      written .kspec-sessions data had not yet propagated into the warm session index. Fixed by
      adding disk-backed fallback reads for related-session and filtered session-list routes when
      cache-backed task/spec filtering returns zero results, and by making the E2E session-context
      tests wait for the daemon-backed related-session endpoints before asserting on downstream UI
      state. Verification: navigation target passed 30 repeat runs, plans embedded-batch-error
      target passed 20 repeat runs, session-context API targets passed 40 repeat runs after the
      route/test fixes, and the combined navigation/plans/session-context spec run passed 62/62.
      Full npm test still reports unrelated existing failures in claude-plugin-registry,
      core-skill-install, cross-platform-robustness, and daemon-api/agent-dispatch; no failures were
      introduced by this task."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-01T09:13:01.113Z
