title: Fix out-of-order agent_message_chunk streaming and duplicate session event seqs
type: bug
description: >-
  `kspec agent run` output is occasionally garbled (e.g. `**Also/ 38 ... for`) even though the
  canonical assistant message in `~/.claude/projects/<session>.jsonl` is well-formed. In
  `.kspec/sessions/<id>/events.jsonl`, many `session.update` events share duplicated seq values,
  indicating concurrent append races. Suspected root cause: `runInvocation()` update handler awaits
  `appendEvent()` before `onUpdate`, and async handlers are not serialized, so chunk writes can
  complete out of order. Fix by enforcing per-session ordered processing for updates and
  deterministic seq assignment.


  Done when:

  1) streamed stdout preserves chunk order for a prompt under injected append delays

  2) `events.jsonl` seq values are strictly monotonic and unique

  3) add regression tests for concurrent update bursts

  4) no behavior regression for `--json` mode
