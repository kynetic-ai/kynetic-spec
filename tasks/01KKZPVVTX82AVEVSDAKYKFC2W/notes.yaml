  - _ulid: 01KM0EK31F90CQX9KWZ1BQK2MM
    content: >-
      Implemented ScheduleEngine in src/agent-runtime/schedule-engine.ts. Key design decisions:

      - ScheduleLoader abstraction for testability (accepts injected config loader, defaults to
      loadMetaContext)

      - Per-schedule volatile runtime state (last_tick, next_tick, run_count, active_run_ids,
      buffered_tick)

      - Overlap enforcement against ActionRun status, not invocation status

      - Backfill uses croner previousRuns(1) heuristic (not previousRun which tracks actual
      executions)

      - Integrated with daemon routes: starts/stops alongside DispatchEngine

      - 22 tests covering all 11 ACs (6 entities + 5 runtime) plus trait-error-guidance N/A
      annotations

      - One pre-existing test failure in review-cli.test.ts (unrelated to schedule engine)
    supersedes: null
