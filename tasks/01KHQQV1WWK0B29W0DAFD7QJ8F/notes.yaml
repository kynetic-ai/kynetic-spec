notes:
  - _ulid: 01KHQQV1WV6WQ7Q9H6PDXCPF87
    content: >-
      Implementation notes (auto-generated from spec):


      Improve the experience of installing kspec on a new project by seeding agent configuration
      with useful starting context and handling platform drift detection comprehensively.



      Acceptance Criteria:

      - ac-1: Given kspec setup runs in a new project with Claude Code, when setup completes, then a
      permissions template or seed for common kspec operations is offered to the user

      - ac-2: Given kspec setup runs in a new project, when setup completes, then MEMORY.md is
      seeded with project-relevant starting notes (project name, key paths, conventions)

      - ac-3: Given a codex skill has platform_config.codex with custom settings, when
      checkPlatformSkillDrift runs for codex, then the sidecar YAML file (agents/openai.yaml)
      content is included in the drift hash

      - ac-4: Given a rendered skill file has been manually edited, when kspec skill verify runs,
      then it reports which skills have drifted from their source with actionable guidance
    supersedes: null
    author: "@claude"
