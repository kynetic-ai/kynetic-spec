      Approach: 

      1. Create five section directories under docs/: getting-started/, guides/, concepts/,
      troubleshooting/, release-notes/

      2. Each gets an index.md landing page with: H1 title, purpose paragraph, stub child-page list
      with links

      3. Add exclude option to vite-plugin-docs to filter out docs/history/ and contributor-only
