    content: "Approach: reuse the existing cleanupTempDir test helper for shadow sync temporary bare
      remotes instead of inventing per-test cleanup logic. Edge cases: transient
      ENOTEMPTY/EBUSY/EPERM during recursive removal of git object directories should be retried;
