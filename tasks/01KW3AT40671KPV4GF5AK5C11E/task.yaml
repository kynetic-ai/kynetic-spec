title: Stabilize shadow.test bare repo cleanup after shadowPushAsync
type: bug
description: "During review of @01KW2NT2528F5PYRHJYK2K804F, full npm test failed once in
  tests/shadow.test.ts: Shadow Branch > shadow sync > shadowPushAsync pull-rebase uses configured
  remote for integration. Failure: ENOTEMPTY while removing
  /tmp/kspec-push-specs-remote-1782522703603/objects/pack during cleanup. Immediate rerun with npm
  test -- tests/shadow.test.ts passed all 197 tests in the same workspace, so this appears flaky
  cleanup behavior rather than a regression from the coverage spec-text revert branch. Investigate
  cleanup/teardown for temporary bare repos used by shadowPushAsync tests and make deletion robust
  without masking real git failures."
