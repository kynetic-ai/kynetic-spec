  - _ulid: 01KP6S2B5RWPBA9C32CHK3V6CE
    content: >-
      Approach: 

      1. Parser (plan-document.ts): Make parsePlanDocument return a typed result with missing-title
      error, empty-plan warning, and AC shape mismatch errors with per-spec/per-AC context. Reuse
      existing AcceptanceCriterionSchema.

      2. Import command (plan-import.ts): Route new parser error/warning types to actionable human
      messages. Title missing = exit 1 with format guidance. Empty plan = success + warning. AC
      shape mismatch = exit 1 with field descriptions.

      3. Derive command (plan.ts): Add empty-plan guard at top before module resolution. Non-zero
      exit with guidance pointing to import command.

      4. Help text: Add runnable example to plan import command registration.

      5. Tests: CLI integration tests for each AC using kspecRun/kspecJson helpers.

      Edge cases: dry-run must produce same errors/warnings, JSON mode must include warnings in
      structured output.
    supersedes: null
    author: "@claude"
    created_at: 2026-04-14T19:56:34.873Z
  - _ulid: 01KP6TMVEQY1GHBF8ENZ51Z8JR
    content: >-
      Implementation complete. Changes across 3 source files and 3 test files:


      Parser (plan-document.ts):

      - parsePlanDocument now returns a warnings array alongside errors

      - Missing title produces a typed missing_title error (was silently "Untitled Plan")

      - AC shape mismatches produce typed ac_shape errors with spec slug, AC id/index, and required
      field descriptions

      - Empty plans (valid title, no derivable content) produce an empty_plan warning


      Import command (plan-import.ts):

      - Validates document structure via parsePlanDocument before saving

      - Missing title or AC shape errors fail with exit 2 and self-contained messages

      - Empty plans succeed with a warning in stderr and JSON warnings array

      - Help text includes a minimal copy-pasteable plan example

      - Dry-run produces identical errors/warnings to real import


      Derive command (plan.ts):

      - Empty-plan guard message improved to name both expected sections and point to import --into


      Tests: 22 new tests across 3 files (15 CLI import, 2 CLI derive, 5 parser unit).

      All 7773 tests pass (2121 suites).
    supersedes: null
    author: "@claude"
    created_at: 2026-04-14T20:24:09.943Z
