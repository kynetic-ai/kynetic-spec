notes:
  - _ulid: 01KNJ1J6FTEQFNYA20J5GE6BF1
    content: "Implemented incremental sessions-domain patching in ProjectEntityCache. Session
      invalidations now reload only the changed session, preserve sorted bounded index semantics,
      re-apply stale-session handling for active sessions, and drop deleted sessions plus any cached
      live counters. Added daemon cache regression tests for single-session update, new-session
      insertion, and deletion removal. Verification: npm test -- daemon-entity-cache; npm test."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-06T18:40:59.898Z
  - _ulid: 01KNJ21B3HER1J2W2T5RPC1PFZ
    content: "[FIX_CYCLE: 1] Review verdict: changes_requested by codex"
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-06T18:49:16.145Z
  - _ulid: 01KNJ32P1QRSF3XE5KA0EAFMA9
    content: "Approach: keep incremental session index patching, but preserve detail freshness by
      invalidating detail entries when watcher-driven metadata-only reloads occur instead of caching
      metadata summaries as details. Edge cases: active sessions with live event counters,
      stale-threshold transitions on incremental invalidation, deleted sessions, and sessions-root
      directory events that must fall back to full reload. Test plan: add behavioral regressions for
      stale-session rewrite during incremental invalidation and for active-session detail freshness
      after events-file changes, alongside the existing update/insert/delete coverage."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-06T19:07:28.695Z
  - _ulid: 01KNJ39WW682YZKYBW62HGQKCH
    content: "Fix cycle 1: addressed all review threads. Cleared metadata-only session detail entries
      during incremental watcher updates so active-session detail requests stay fresh via the
      live-count-adjusted index or on-demand reload. Added regressions for stale-session transition
      during incremental invalidation, active-session events-file freshness, and sessions-root
      fallback to full reload. Re-verified @daemon-incremental-cache ACs for single-entity patching,
      removal detection, index consistency, and fallback reload behavior."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-06T19:11:25.063Z
