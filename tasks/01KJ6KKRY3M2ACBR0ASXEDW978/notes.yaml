notes:
  - _ulid: 01KJ6KKRY3C5AGBKFYKJDFEGZ6
    content: |
      Port kspec-worktree-guard.sh logic to TypeScript as kspec guard worktree command.
      New file: src/cli/commands/guard.ts. Register in src/cli/index.ts. Reads
      PreToolUse hook JSON from stdin. Blocks: kspec-meta branch deletion,
      branch creation/checkout in .kspec/, dangerous git ops (reset, rebase, stash,
      clean) in .kspec/. Allows everything else.
    author: "@claude"
    created_at: 2026-02-24T01:18:27.267Z
  - _ulid: 01KJ8PVCTXQ5AADMJ6GT3WBEQM
    content: Implemented native kspec guard worktree command. New file src/cli/commands/guard.ts with
      evaluateWorktreeGuard() function containing the same guard logic as the old bash script
      (dangerous pattern blocking, kspec-meta deletion prevention, cd/.kspec detection, split-quote
      bypass protection). Updated setup.ts to install 'kspec guard worktree' as PreToolUse hook
      instead of bash scripts, with migration logic that replaces old entries and deletes old script
      files. 51 new tests across 2 test files (guard-worktree.test.ts, native-guard-setup.test.ts).
      Updated 4 tests in enhanced-setup.test.ts to match native command behavior.
    supersedes: null
    author: "@claude"
    created_at: 2026-02-24T20:53:31.613Z
