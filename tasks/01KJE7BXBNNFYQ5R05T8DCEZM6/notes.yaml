    content: "Investigation (2026-02-27): reproduced codex gap in this repo. kspec setup --dry-run
      --json (detected codex-cli high confidence) reports Render skills: 11 plugin-provided with no
      rendered skill IDs, and kspec skill render --json shows only claude-code plugin-provided
      skips. templates/skills/manifest.yaml currently marks all core skills as claude-code only.
      Because renderSkillsForSetup iterates skill.platforms, codex renderer is never invoked for
      core skills."
