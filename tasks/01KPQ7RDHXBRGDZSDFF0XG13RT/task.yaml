slugs: []
title: Make task reads immediately consistent after review verdict transitions
type: bug
description: After `kspec review verdict --decision request_changes` auto-transitions a linked task
  from pending_review to needs_work, an immediate `kspec task get` can still return stale
  pending_review state before a later read shows needs_work. This creates ambiguity for automated
  reviewer flows that verify transition completion immediately after submitting a verdict.
  Investigate review->task state propagation / shadow refresh timing and make post-verdict task
  reads immediately consistent.
