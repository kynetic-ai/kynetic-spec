      workspace lifecycle registry spec with a shared wait helper and longer poll budget so the
      closing-state assertion tracks the async transition reliably under full-suite load.
      Verification: npm test -- tests/dispatch-workspace-registry.test.ts tests/file-lock.test.ts;
      npm test; kspec validate (warnings-only baseline, exit 6)."
