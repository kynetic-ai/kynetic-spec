    content: "Fix cycle 7: Addressed blocker about dispatch engine unconditionally opting every
      invocation into 100ms idle grace period. Added _hasSessionIdleHooks field to DispatchEngine,
      updated on each _loadAgents() call. idleGracePeriodMs is now conditional:
      DEFAULT_IDLE_GRACE_MS when session.idle hooks exist, 0 otherwise. Added two dispatch engine
      tests verifying both paths (no hooks = immediate close, hooks present = grace period). All
      7045 tests pass (1 pre-existing flaky timeout in canonical-task-workspace-contract
      unrelated)."
