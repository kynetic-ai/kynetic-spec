  - _ulid: 01KMAGMRRT5TY4BC6ZZF36NR6Y
    content: "Fix cycle 2: Addressed blocker about sendPrompt() contract mismatch.
      SessionHandle.sendPrompt() was typed as Promise<void> but promptQueue.enqueue() threw
      synchronously on closed/full queues. Wrapped enqueue() in try/catch inside sendPrompt() to
      convert synchronous throws into rejected promises, matching the documented contract. Updated
      the overflow test (ac-17) to verify promise rejection via .catch() instead of synchronous
      try/catch. All 31 multi-turn tests pass."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-22T10:14:55.515Z
