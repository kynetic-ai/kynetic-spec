  - _ulid: 01KMACDQEBG63X98ETR7BQV200
    content: "Implemented multi-turn lifecycle in invocation.ts: PromptQueue (FIFO, max depth, close
      with discard), turn loop replacing linear flow, SessionHandle registration/unregister with
      registry, onIdle callback for session.idle events, turnCount tracking in InvocationResult.
      Added agent.turn_completed and session.prompts_discarded event types. Backward compatible:
      when no prompts are queued after onIdle, session closes immediately after one turn."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-22T09:01:10.476Z
  - _ulid: 01KMACNST33ZMFDFVK8KKWC961
    content: "Completed multi-turn invocation refactor. Replaced linear prompt-then-teardown flow with
      event-driven turn loop. Key components: PromptQueue (FIFO with max depth), SessionIdleContext
      (onIdle callback), session handle registered in SessionRegistry for external prompt delivery,
      turn loop state machine (prompting→idle→prompting). Added agent.turn_completed and
      session.prompts_discarded event types. Fixed PromptQueue waiter typing (was using unsafe
      cast). 30 new tests covering all assigned ACs (ac-1,2,3,4,8,9,10,15,16,17) plus registry
      integration and backward compatibility. All existing invocation tests pass. Pre-existing
      timeout failures in dispatch-runtime-bootstrap-contract and workspace tests are unrelated."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-22T09:05:35.044Z
