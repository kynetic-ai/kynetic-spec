    content: "Implemented multi-turn lifecycle in invocation.ts: PromptQueue (FIFO, max depth, close
      with discard), turn loop replacing linear flow, SessionHandle registration/unregister with
      registry, onIdle callback for session.idle events, turnCount tracking in InvocationResult.
      Added agent.turn_completed and session.prompts_discarded event types. Backward compatible:
      when no prompts are queued after onIdle, session closes immediately after one turn."
