  - _ulid: 01KMWMKD4MAA4WFNS7ABH2SXZZ
    content: >-
      Approach: The api.ts already has unwrapEnvelope() and unwrapPaginatedEnvelope() helpers, and
      most endpoints already use them. The remaining work is:


      1. Consolidate ~12 functions that use inline envelope.data access to use the helpers instead.

      2. Add a new helper for the SessionListResponse pattern (fetchSessions, fetchTaskSessions,
      fetchItemSessions) since they have an extra unfiltered_total field.

      3. Update static mode (api-static.ts) to wrap returns in envelope shape {data, meta:
      {cache_status: 'ready'}} so the unwrap path is identical.

      4. Endpoints that don't use the server envelope (hooks, schedules, events, compositions,
      mutations, diff, batch, health) are excluded per ac-envelope: 'Non-cache endpoints excluded
      from this contract.'


      Edge cases:

      - fetchSessions wraps data.items + data.unfiltered_total — needs a dedicated unwrap.

      - fetchValidation does normalize/default fields after unwrap — keep that logic.

      - fetchSessionEvents has nested data.events structure.
    supersedes: null
    author: "@claude"
    created_at: 2026-03-29T11:10:24.916Z
  - _ulid: 01KMWNBERCJ2DV6CZJX56Z39ZQ
    content: >-
      Implementation complete. Changes:


      1. Added 3 new envelope unwrap helpers in api.ts:
         - unwrapListEnvelope: for {items, total} list endpoints (plans, workflows, conventions, agents, mergedInbox)
         - unwrapSessionListEnvelope: for sessions list with unfiltered_total
         - unwrapSimpleSessionListEnvelope: for task/item session sub-endpoints
      2. Consolidated 12 inline envelope.data access patterns to use these helpers

      3. Updated api-static.ts: all static functions now return ApiResponse<T> envelope with
      cache_status: 'ready'
         - Added wrapEnvelope() and paginateEnvelope() helpers
         - Removed PaginatedResponse dependency from static module
      4. Updated api.ts static branches: all isStaticMode() branches now unwrap through the same
      helpers as the live path

      5. Updated api-static.test.ts: assertions updated to access .data and .meta instead of legacy
      .items/.total


      Non-envelope endpoints (hooks, schedules, events, compositions, mutations, diff, batch,
      health) left as-is per ac-envelope exclusion clause.


      All 7128 tests pass (5 skipped), build succeeds.
