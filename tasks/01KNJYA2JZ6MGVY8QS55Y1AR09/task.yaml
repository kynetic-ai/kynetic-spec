title: Stabilize parser integration test in detached review worktrees
type: bug
description: "Review evidence on 2026-04-07: full npm test on submitted snapshot
  58d872ce04698b021e6dd29ddfefd0f6016406a6 rebuilt missing build artifacts and finished with 2
  failed suites / 1 failed test. The concrete remaining failure is tests/parser.test.ts ->
  loadAllItems integration should load items from real spec files, which throws ShadowError:
  Worktree disconnected from git from src/parser/shadow.ts while running in a detached review
  worktree. The same failure reproduces on integration target dev commit
  34dd3d45c187a99ec1c4944bb4914e6549935f6d in a fresh temporary worktree, so it is pre-existing
  rather than introduced by task @01KNHZ5FH33G2C27BMG0SHPC74. Investigate why
  initContext(process.cwd()) / loadAllItems() treats detached review worktrees as disconnected
  shadow worktrees during test execution, decide whether the test should skip/adapt in this
  environment or shadow detection should accept the workspace shape, and restore a reliable
  full-suite pass in detached review worktrees."
