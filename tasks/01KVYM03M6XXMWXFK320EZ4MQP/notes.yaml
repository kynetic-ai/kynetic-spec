notes:
  - _ulid: 01KVZN5Y3VDB59AQB2Y119HDJX
    content: "Approach: preserve the existing pure/synchronous coverage-state builder for callers that
      already provide evidence, add a freshness-aware async production read-model builder that
      reuses compareCoverageFreshness and deriveCoverageState with attached findings, and route
      loadCoverageStateReadModel/getCachedCoverageStateReadModel/static export/API paths through
      that builder. Edge cases: stale AC text, stale annotation source, stale mapped test source,
      unknown comparison metadata, no positive evidence staying not-yet, no-store/static read-only
      behavior, cache reuse so repeated reads do not repeat comparison work. Test plan: add
      behavioral read-model tests with neutral temp projects and AC annotations for
      @coverage-state-api-cache plus regression coverage for @coverage-freshness-revision-comparison
      through the production read path; extend daemon/static API coverage where needed."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-25T15:08:08.187Z
  - _ulid: 01KVZP8KC744B0C254EC4QGJ45
    content: "Implemented freshness-aware production coverage-state reads. The evidence index now
      retains loaded spec items, the read-model cache/loader uses compareCoverageFreshness before
      final state derivation, and static export/daemon APIs now surface stale_spec_text,
      stale_annotation_or_mapping, stale_test_result, and unknown_freshness states from the same
      production path. Verification: focused coverage-state read-model/API suites passed; format,
      focused lint, repo lint, typecheck, all three kspec validation gates, and full npm test
      passed."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-25T15:27:04.071Z
