  - _ulid: 01KK3DFNW43T7BE2NA23J4NZZG
    content: >-
      Review findings:

      MUST-FIX 1) Raw Tailwind color classes violate design-token requirement in workflows page.
      `packages/web-ui/src/routes/workflows/+page.svelte:33-35` uses `text-emerald-500`,
      `text-blue-500`, `text-amber-500` instead of design-token classes.

      MUST-FIX 2) AC coverage gap for start action behavior. Spec AC says Start action initiates
      workflow (or fallback command path), but tests only verify button presence; no behavioral
      assertion for click/action. See `packages/web-ui/tests/e2e/workflows.spec.ts:79-87`.

      MUST-FIX 3) Fluff E2E test with no assertion.
      `packages/web-ui/tests/e2e/workflows.spec.ts:91-99` creates `loading` locator but never
      asserts visibility/count, so test passes regardless of loading state implementation.

      Validation/test status:

      - `npm test` passed.

      - `cd packages/web-ui && npm test` passed.

      - `kspec validate` reports repo-level schema/reference issues unrelated to this task; no
      spec-specific warnings found for `@ui-workflows-view`.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-07T05:49:20.132Z
