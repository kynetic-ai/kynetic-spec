description: During review of @task-catch-justification-comments, the full `npm test` run failed
  once in `tests/daemon-last-exit.test.ts > daemon termination paths > records a graceful exit when
  the daemon shuts down on SIGTERM` after 45005ms with STACK_TRACE_ERROR. The same file passed on
  immediate focused rerun via `npm test -- --fresh tests/daemon-last-exit.test.ts` (14/14, 1.6s).
  The reviewed branch only changed comments in src/agents/spawner.ts, src/cli/batch-write-buffer.ts,
  src/parser/entity-local-resources.ts, src/parser/file-lock.ts, and src/parser/shadow.ts, so this
  appears flaky rather than caused by that branch. Investigate why the graceful SIGTERM path
  occasionally times out in the full suite, especially interaction with daemon process cleanup,
  port/process contention, and test isolation. Fix should make the test deterministic without
  weakening the assertion.
