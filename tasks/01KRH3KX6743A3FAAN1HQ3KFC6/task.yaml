title: Add cleanup classification regression coverage
type: task
description: >
  What:

  - Add focused regression coverage in tests/dispatch-workspace-cleanup.test.ts for the clarified
  cleanup classifications.

  - Add a test proving a dispatch worktree with corrupt or unparseable
  .kspec-dispatch-workspace.json is removed when:
    - the workspace registry loads successfully;
    - no non-closed registry record protects the workspace;
    - no activeTaskRefs option protects the task; and
    - the artifact is under the configured dispatch worktree root.
  - Add a test proving an unknown file or directory directly under .kspec-worktrees is removed when
  registry/protection state is trusted and no protected workspace path contains or equals it.

  - Preserve or extend existing negative-control coverage proving registry/protection load failure
  still blocks blind deletion across destructive surfaces.

  - Preserve or extend existing positive protection coverage proving active, in-flight,
  provisioning, and non-closed registry-owned artifacts are not removed.

  - Add a recovery-path test in tests/agent-dispatch-engine.test.ts near the existing "reprovisions
  missing in_progress worker worktrees during dispatch bootstrap" coverage. The test must seed an
  automation-eligible non-terminal task, provision a dispatch workspace, corrupt or remove the
  artifact-local metadata/registry association enough for reconcileDispatchWorkspaceArtifacts to
  remove the artifact, then start DispatchEngine with a worker agent and a
  runInvocation/_spawnInvocation spy. Assert that the task remains dispatch-eligible, a fresh
  workspace is provisioned for the same task ref, and the task is not discarded solely because the
  corrupt artifact was cleaned.

  - If the current implementation does not satisfy the clarified ACs, update
  src/agent-runtime/workspace.ts and/or dispatch bootstrap recovery so classification distinguishes:
    - registry/protection state unavailable or untrusted => fail closed / preserve or block;
    - artifact-local metadata corrupt under trusted registry/protection state with no protected owner => cleanup-eligible;
    - unknown direct entries under the dispatch-owned worktree root with no protected owner => cleanup-eligible.
  - Once tests and implementation evidence pass, set @dispatch-workspace-cleanup-policy and
  @dispatch-workspace-registry implementation status to implemented only if no other direct pending
  tasks keep those specs reopened.


  Why:

  The audit probes showed the intended cleanup behavior exists but was not explicitly covered by
  spec-owned regression tests. The clarified policy should prevent future fixes from accidentally
  preserving corrupt metadata forever or treating dispatch-owned scratch entries as user data, while
  keeping the earlier in-flight protection fail-closed guarantees intact.


  How:

  - Reuse existing helpers in tests/dispatch-workspace-cleanup.test.ts such as seedRepo,
  provisionDispatchWorkspace, reconcileDispatchWorkspaceArtifacts, readRegistryWorkspaces, and
  activeTaskRefs options.

  - Keep test cases behavioral; do not add source-scanning tests.

  - Use deterministic temp repos and valid test ULIDs via testUlid/testUlids helpers.

  - When testing corrupt metadata, intentionally create or provision a workspace, remove or avoid
  the matching registry record, corrupt .kspec-dispatch-workspace.json, run
  reconcileDispatchWorkspaceArtifacts, and assert the workspace path no longer exists.

  - When testing unknown root entries, create a marker file and a marker directory directly under
  .kspec-worktrees, run reconcileDispatchWorkspaceArtifacts, and assert both are removed.

  - When testing task-state recovery after corrupt artifact cleanup, follow the existing dispatch
  bootstrap test pattern: create an automation-eligible non-terminal task and worker agent, remove
  the corrupt artifact through cleanup, start DispatchEngine, and assert the worker
  invocation/provisioning path still runs for the task ref.

  - Include explicit assertions that registry-load failure behavior remains fail-closed, either by
  extending the existing parse-failure test or adding a focused assertion in the same file.


  Testing:

  - npm test -- --fresh tests/dispatch-workspace-cleanup.test.ts

  - npm run typecheck

  - kspec validate --refs --warnings-ok

  - kspec validate --alignment --warnings-ok

  - kspec validate --completeness --warnings-ok


  Covers: @dispatch-workspace-cleanup-policy ac-corrupt-metadata-cleanup-eligible,
  ac-dispatch-root-unknown-entries-owned, ac-ambiguous-protection-blocks-blind-deletion,
  ac-active-inflight-provisioning-artifact-preserved,
  ac-protection-applies-to-every-destructive-surface; @dispatch-workspace-registry
  ac-task-state-drives-recovery-after-untrusted-artifact-cleanup,
  ac-partial-provisioning-classified-before-cleanup
