  - _ulid: 01KPVM174YYVNTZJCDJBP8E798
    content: >-
      Approach: Implement merge helper as a bash script at
      templates/skills/merge/files/detached-reviewer-merge.sh.


      Architecture:

      - Script reads dispatch env vars: KSPEC_DISPATCH_CANONICAL_BRANCH,
      KSPEC_DISPATCH_MERGE_TARGET, KSPEC_DISPATCH_CANONICAL_HEAD, KSPEC_DISPATCH_WORKTREE_ROOT

      - Uses git worktree list to find the occupied worktree for the integration target

      - Performs merge via git -C <occupied-worktree> merge --no-ff <canonical-branch>

      - This works because all worktrees share the same git repo


      Flow:

      1. Validate required env vars

      2. Find occupied worktree for integration target via git worktree list --porcelain

      3. Check if canonical head is already ancestor of integration target → no-op

      4. Check if occupied worktree has dirty state (tracked modifications or staged drift) → refuse
      with guidance

      5. Run git -C <occupied-worktree> merge --no-ff <canonical-branch> -m <message>

      6. On conflict: abort merge, report conflict guidance, exit non-zero

      7. On success: verify the occupied worktree matches the new tip


      Tests: E2E style using temp git repos with multiple worktrees.

      4 ACs to cover: occupied-target-clean-refresh, helper-no-op-merge,
      helper-refuses-dirty-target, helper-safe-conflict-exit.
    supersedes: null
    author: "@claude"
    created_at: 2026-04-22T22:12:38.174Z
  - _ulid: 01KPVMYXAMG7TPDNRCJN6JSG3P
    content: >-
      Implementation complete. Created:


      1. templates/skills/merge/files/detached-reviewer-merge.sh — Bash merge helper script that:
         - Validates KSPEC_DISPATCH_CANONICAL_BRANCH and KSPEC_DISPATCH_MERGE_TARGET env vars
         - Detects no-op (canonical already ancestor of target) and exits 0 cleanly
         - Locates occupied worktree for integration target via git worktree list --porcelain
         - Refuses merge if occupied worktree has dirty state (tracked mods or staged drift) with recovery guidance
         - Performs git merge --no-ff in the occupied worktree (single merge site means worktree is auto-refreshed)
         - On conflict: aborts merge, reports conflict guidance, exits 1 with unchanged target ref
         - Post-merge: verifies target ref advanced and worktree index is clean

      2. tests/detached-reviewer-merge.test.ts — 7 E2E tests covering all 4 in-scope ACs:
         - ac-occupied-target-clean-refresh: merge succeeds, ref advances, files appear in occupied worktree
         - ac-helper-no-op-merge: pre-merged canonical detected, no ref movement, clean exit
         - ac-helper-refuses-dirty-target: tracked modifications and staged drift both blocked with guidance
         - ac-helper-safe-conflict-exit: conflict aborted, ref unchanged, clean worktree state restored
         - Plus 2 env contract tests (missing vars)

      Full test suite: 8320 passed, 5 skipped, 0 failed.
    supersedes: null
    author: "@claude"
    created_at: 2026-04-22T22:28:51.156Z
