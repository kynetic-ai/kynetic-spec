      argument, modifies behavior

      - ac-2: Given skill has loop mode, when loop invoked, then skill uses @workflow-loop variant

      - ac-3: Given loop mode active, when confirmation point reached, then confirmation skipped

      - ac-4: Given loop mode encounters error, when error caught, then note added, workflow
      continues
