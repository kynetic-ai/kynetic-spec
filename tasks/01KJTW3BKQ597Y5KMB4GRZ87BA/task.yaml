title: Prevent cli-serve tests from killing unrelated running daemon
type: bug
description: tests/cli-serve.test.ts currently manipulates global ~/.config/kspec daemon state in
  beforeEach/afterEach (serve stop plus PID SIGTERM cleanup). This can terminate an already-running
  local daemon outside the test run. Update daemon-sensitive CLI tests to use isolated HOME/config
  and project-scoped daemon lifecycle so tests never stop or kill external daemon processes.
