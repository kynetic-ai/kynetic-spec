title: Fix dispatch shadow mutation lock contention and leak between daemon and agents
type: task
description: >-
  ## What


  The dispatch shadow mutation file lock (.kspec-dispatch-shadow-mutation) suffers from two related
  failures:


  1. **Lock leak**: The daemon process (workspace.ts withDispatchShadowMutationLock) acquires the
  lock for workspace lifecycle operations but can fail to release it. When this happens, the daemon
  PID remains alive, so the existing stale-lock detection (which only checks for dead PIDs) cannot
  reclaim the lock. All agent CLI mutations are blocked indefinitely.


  2. **Lock monopolization during reconciliation**: reconcileDispatchWorkspaceRegistry
  (workspace.ts:2153) acquires the file lock once for the entire batch of non-closed workspace
  records, then performs N git operations per record (refExists, resolveCommit,
  findExistingWorktreeForBranchUnderRoot, pathExists) plus conditional saves and a shadow branch
  commit. With multiple active workspaces this holds the lock for seconds, starving concurrent agent
  CLI mutations.


  Both failures produce the same symptom: reviewer (or worker) agents cannot run any mutating kspec
  command (review verdict, task complete, task note, etc.) and burn their entire session retrying.


  ## Why


  The dispatch engine, worker agents, and reviewer agents all compete for the same file lock:


  - The daemon acquires it during workspace reconciliation (every 60s), state change handling, and
  invocation lifecycle management (mark active/idle).

  - Worker agents acquire it for every mutating kspec CLI command (task note, task submit, etc.) via
  the preAction hook in cli/index.ts.

  - Reviewer agents acquire it for every mutating kspec CLI command (review verdict, task complete,
  etc.) via the same hook.


  The lock exists to serialize shadow branch writes and prevent concurrent commits from corrupting
  the worktree. This is correct. But the current implementation has no mechanism to:

  - Guarantee release if the holder gets stuck (ac-7)

  - Enforce a maximum hold duration (ac-8)

  - Yield between record evaluations during batch reconciliation (ac-9)

  - Reclaim from an alive-but-stuck holder (ac-10)


  Observed in dispatch session 01KMV580P5VCWH2WFYCJCD9B3H: 269 lock timeout errors over 16 minutes.
  The reviewer agent could not complete a single mutation. Lock holder was PID of the daemon
  process. A subsequent reviewer session (01KMV6PRTZEJYVPHKKW5S3DGQC) hit the same issue with a
  leaked lock held for 48+ minutes.


  ## How


  ### 1. Lock release guarantee (ac-7)

  Audit all acquireFileLock call sites. Ensure every acquisition is wrapped in try/finally that
  calls release(). The withDispatchShadowMutationLock wrapper already does this, but verify no code
  path acquires outside the wrapper. Add a safety timeout to the release() call itself so a failed
  release doesn't silently swallow the error.


  ### 2. Maximum hold duration ceiling (ac-8)

  Add a configurable max-hold-duration to the lock metadata (written alongside PID and timestamp in
  the lock directory). When a waiting process checks staleness, compare elapsed time against the
  ceiling. If exceeded, treat as reclaimable regardless of PID liveness. The existing stale
  detection in file-lock.ts (which checks process.kill(pid, 0)) becomes one of two reclamation
  paths: dead PID OR exceeded ceiling.


  ### 3. Reconciliation lock granularity (ac-9)

  Refactor reconcileDispatchWorkspaceRegistry to acquire/release the file lock per-record (or
  per-dirty-record-batch) rather than for the entire iteration. Each record that needs saving gets
  its own lock-acquire → save → commit → release cycle. This allows agent mutations to interleave
  between record evaluations. The shadowMutex (in-memory) can still serialize within the daemon
  process, but the file lock window shrinks from "entire reconciliation" to "single record
  save+commit".


  ### 4. Alive-but-stuck reclamation (ac-10)

  Extend the staleness check in acquireFileLock retry loop (file-lock.ts) to read the lock timestamp
  and compare against the max-hold-duration ceiling. If the lock has been held beyond the ceiling,
  reclaim it even if process.kill(pid, 0) succeeds. Log a diagnostic identifying the previous holder
  PID and hold duration.
