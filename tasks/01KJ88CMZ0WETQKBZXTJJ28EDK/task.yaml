title: Document N/A trait AC annotation format in testing convention
type: task
description: >-
  When a trait AC doesn't apply to a spec, the correct annotation format is:

  `// AC: @trait-slug ac-N N/A — reason`


  Not prose comments like `// @trait-slug ac-N: N/A — reason` or bullet lists in file headers.


  This came up in PR #503 where Codex flagged N/A trait ACs as MUST-FIX because they used prose
  instead of the // AC: prefix. The convention should be documented in the testing convention
  (templates/agents-sections/) so agents get it right the first time.


  Update:

  - templates/agents-sections/ testing section to include N/A annotation format

  - Regenerate kspec-agents.md after
