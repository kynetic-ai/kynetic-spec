  - _ulid: 01KKACP9FMTFPTKXJTMHP74498
    content: >-
      Fix cycle 2 addressed. Changes:

      1. Fixed CI failure: all git init calls now use -b main (initBareRepo, initRepo,
      spawnGitWithTimeout setup, fetch failure setup) to avoid master/main mismatch on GitHub
      Actions.

      2. Replaced all non-behavioral plumbing tests with real initContext() behavioral tests:
         - ac-session-start-always-pulls: sets up real shadow worktree with remote tracking, sets setSyncMode('always'), calls initContext(), verifies shadowPull called and shadowNeedsSync NOT called.
         - ac-no-sync-env: same setup, sets KSPEC_NO_SYNC=1 with syncMode='always', calls initContext(), verifies neither shadowPull nor shadowNeedsSync called.
         - Negative case: verifies sync runs when KSPEC_NO_SYNC is unset.
         - Drift-check comparison: verifies initContext uses shadowNeedsSync (not direct pull) for drift-check mode.
      All 22 tests in shadow-drift-check.test.ts pass. Full suite: 4259 passed, 2 pre-existing
      codex-related failures.
    supersedes: null
    author: "@claude"
    created_at: 2026-03-09T22:50:09.268Z
