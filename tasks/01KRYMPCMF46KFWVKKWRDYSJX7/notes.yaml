    content: "Fix cycle 1: addressed both blocker threads on review @01KRYT821PKEK2F5NQPVF4AJ4T. Added a
      dedicated annotated test pair in tests/dispatch-workspace-cleanup.test.ts — one for
      ac-preservation-diagnostics-quiet-by-default (clears KSPEC_DISPATCH_CLEANUP_DIAGNOSTICS,
      asserts preservation occurs AND no [dispatch-cleanup] diagnostic is emitted) and one for
      ac-preservation-diagnostics-opt-in (sets the env var, asserts the emitted line identifies
