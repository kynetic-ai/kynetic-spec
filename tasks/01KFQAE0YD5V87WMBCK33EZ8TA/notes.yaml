    content: >-
      Created comprehensive unit tests for PubSubManager.broadcast() filtering logic. Added 9 tests
      in tests/daemon-pubsub.test.ts:


      Coverage:

      - ac-18: Multiple tests for project-scoped broadcast filtering

      - Verifies only connections with matching projectPath receive events

      - Tests multi-project scenarios (project A events don't reach project B)

      - Tests subscription + project filtering combination

      - Tests legacy connections (no projectPath) don't receive scoped broadcasts

      - Tests broadcast without projectPath reaches all (legacy behavior)

      - Verifies message structure (seq, msg_id, timestamp, topic)

      - Tests sequence incrementing per connection


      All tests passing. These unit tests validate the core filtering logic without requiring
      WebSocket E2E infrastructure.
