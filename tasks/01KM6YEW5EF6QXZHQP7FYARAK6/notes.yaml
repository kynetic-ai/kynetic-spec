  - _ulid: 01KM7ZG74XADT6M0KCDSQJJ778
    content: Implemented kspec task rebuild-index CLI command. Scans .kspec/tasks/ for per-task
      directories, builds new index entries via toIndexEntry, compares against current index, and
      reports added/removed/changed entries. --repair overwrites the index, --dry-run previews
      changes. Uses split-mode TaskDataManager for per-task file loading. 19 E2E tests covering all
      4 own ACs + trait-dry-run (6 ACs) + trait-error-guidance (3 applicable ACs). Full test suite
      (6851 tests) passes.
