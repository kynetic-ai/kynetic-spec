slugs:
  - task-plan-review-folder-storage-migration-1
  - task-plan-review-folder-storage-migration
title: Implement plan and review storage migration plus upgrade integration
type: task
description: >
  What:

  - Add dry-run and executing migration steps to `kspec upgrade` for the 1.2 folder-backed
  plan/review/resource format.

  - For plans, move inline `content` into `.kspec/plans/<plan-ulid>/plan.md`, move bounded metadata
  into `plan.yaml`, move notes into `notes.yaml` when present, create empty `resources.yaml` when no
  resources exist, and write the lean `.kspec/project.plans.yaml` index with ULID, slugs, title,
  status, source path, module, branch, derived refs, timestamps, and bounded resource summaries
  only.

  - For reviews, move each full review record into `.kspec/reviews/<review-ulid>/review.yaml`,
  create empty `resources.yaml` when no resources exist, and write the lean
  `.kspec/project.reviews.yaml` index with ULID, lifecycle, subject summary, related refs,
  disposition, timestamps, and bounded resource summaries only.

  - Preserve these exact folder layouts: plan folders contain `plan.md`, `plan.yaml`, optional
  `notes.yaml`, `resources.yaml`, and `resources/`; review folders contain cohesive `review.yaml`,
  `resources.yaml`, and `resources/`.

  - Do not create inbox, triage, session, or broad meta folder migrations. Inbox is intentionally
  capped by triage, triage keeps using references to resources owned elsewhere unless its scope
  changes, sessions are only a blob-pointer precedent, and skills already have a supporting-file
  folder model.

  - Update the manifest to `kynetic: "1.2"`, `task_storage.format: split`, `plan_storage.format:
  folder`, `review_storage.format: folder`, and `resource_storage.format: entity_scoped` only after
  successful migration.

  - Detect already migrated and partially migrated layouts with clear reporting.

  - Report the previous shadow commit as rollback guidance instead of creating parallel backup
  files.

  - Add structured incompatibility errors for routes/commands that cannot safely operate on a stale
  or partial layout.

  - For all manual/exploratory upgrade runs, use an isolated temp project or an explicit disposable
  copy of fixture data. Do not run `kspec upgrade` or any executing migration command in
  `/home/chapel/Projects/kynetic-spec`, `/home/chapel/Projects/kynetic-spec-dispatch`, or their
  `.kspec` worktrees as part of this plan's implementation/testing.

  - Add a worker preflight/tripwire to this task's implementation checklist: before any manual
  non-dry-run migration command, print and verify `pwd`, the resolved project root, and the target
  `.kspec` path. If the target is one of the protected live paths above, abort without mutation.

  - If an implementation or review agent observes that either protected live project has been
  migrated during this plan's work (manifest `kynetic: "1.2"`, `plan_storage.format: folder`,
  `review_storage.format: folder`, or unexpected `.kspec/plans/`/`.kspec/reviews/` directories),
  block the current task, make no further writes to that project, and report the path plus observed
  marker. Jacob owns recovery; agents must not silently repair or continue.


  Why:

  - Existing projects must have a safe path from monolithic files to folder-backed storage, and
  daemon/API consumers need deterministic behavior during compatibility windows.


  How:

  - Follow `kspec task migrate` and `task rebuild-index` conventions: dry-run previews, best-effort
  preservation with warnings, one logical buffered mutation, shadow commit, rebuild/repair command,
  and upgrade pipeline integration.

  - Do not silently dual-write or opportunistically migrate during normal plan/review commands;
  migration is owned by `kspec upgrade`.

  - Build migration tests using temp project factories, copied fixtures, or scratch repositories
  whose paths are asserted not to be `/home/chapel/Projects/kynetic-spec` or
  `/home/chapel/Projects/kynetic-spec-dispatch` before writes begin.


  Testing:

  - Migration tests for empty files, valid records, invalid-but-preserved raw records, missing
  ULIDs, unknown fields, already migrated layouts, partial layouts, dry-run no writes, executing
  migration writes expected dirs/files/indexes, manifest 1.2 fields, previous-commit reporting, and
  upgrade integration.

  - Daemon compatibility tests for structured stale-layout errors.

  - Add at least one test/helper assertion proving executing migration fixtures are isolated from
  the protected live project paths. Manual test notes must name the temporary/disposable project
  path used, not either active repository path.


  Covers: @entity-folder-migration-and-compatibility-1 ac-upgrade-dry-run-previews-layout,
  ac-upgrade-executes-folder-migration, ac-migration-preserves-record-identity-and-unknown-fields,
  ac-unmigrated-projects-are-blocked-with-guidance, ac-partial-folder-layouts-are-blocked
