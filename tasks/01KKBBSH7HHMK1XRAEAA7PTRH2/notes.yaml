notes:
  - _ulid: 01KKBTX20S1JVHMVTXGAYGMJ4P
    content: >-
      Execution context:

      - Background: checkBudget() was enforcing budget limits without verifying session is active,
      causing false-positive blocks when a stale KSPEC_SESSION_ID env var was present from a
      previous completed/abandoned session.

      - Fix: Added getSession() call before budget enforcement. If session is missing or not in
      'active' status, skip budget check and return allowed.

      - Files changed: src/sessions/store.ts (checkBudget function), tests/session-budget.test.ts (4
      new tests)

      - Tests: 4 new unit tests covering: missing session, completed session, abandoned session,
      active session still blocks. All 485 session tests pass.
    supersedes: null
    author: "@claude"
    created_at: 2026-03-10T12:17:45.498Z
  - _ulid: 01KKBWCRS6EHF4DQ891XJ2GK7X
    content: "[FIX_CYCLE: 1] Review findings: MUST-FIX: PR #748 fails fresh CI on the merge ref. The new
      checkBudget() branch at src/sessions/store.ts:3512 treats missing sessions as allowed, which
      breaks existing task-budget-enforcement integration tests and lets budget-exhausted task
      starts succeed."
