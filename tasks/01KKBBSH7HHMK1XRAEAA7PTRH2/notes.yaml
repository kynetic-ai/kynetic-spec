  - _ulid: 01KKBXMPMGHZS36EEW6CHBPKMS
    content: "Fix cycle 1 resolution: Narrowed the stale session check from `\\!session ||
      session.status \\!== 'active'` to `session && session.status \\!== 'active'`. The original
      logic treated missing session metadata as stale (allow bypass), which broke integration tests
      that create budget files without session metadata. Now: missing metadata → proceed with normal
      budget checks; existing non-active session → skip enforcement. Added test for the
      missing-metadata-with-budget scenario. All 56 budget tests pass, integration tests pass."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-10T13:05:37.424Z
  - _ulid: 01KKBY7YERPTWPS8QTEW1MT2XJ
    content: "Fix cycle 1 addressed: Verified commit 58018ac (narrowed stale session check) passes all
      CI — 3/3 test shards + E2E + claude-review all green. Replied to MUST-FIX review comment
      explaining the fix and resolved the thread. The condition `session && session.status \\!==
      'active'` correctly: (1) falls through to normal budget checks when session metadata is
      missing, (2) skips enforcement for completed/abandoned sessions, (3) enforces for active
      sessions."
    supersedes: null
