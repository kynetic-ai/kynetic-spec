title: Task budget false-positive outside ralph loop when stale KSPEC_SESSION_ID is present
  (observed in co
type: task
description: >-
  Fix task budget false-positive when stale KSPEC_SESSION_ID is set outside a ralph loop.


  Location: checkBudget() in src/sessions/store.ts (lines ~3495-3524).


  Current behavior: checkBudget() validates (1) sessionId is set, (2) budget file exists, (3)
  started_this_cycle >= max_per_cycle. It does NOT check whether the session is actually active. A
  stale KSPEC_SESSION_ID from a completed/abandoned session causes false budget exhaustion errors.


  Fix: Add session status validation to checkBudget(). Before enforcing the budget limit, call
  getSession() or isSessionActive() to verify the session exists and is in active status. If the
  session is not active (completed, abandoned, or missing), skip budget enforcement and return
  allowed. Add a test case: set KSPEC_SESSION_ID to a non-existent or completed session, verify
  checkBudget() does not block task start.
