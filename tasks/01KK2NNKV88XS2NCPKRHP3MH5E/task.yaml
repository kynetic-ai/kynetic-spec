title: Fix session stream not rendering agent messages, tool calls, or thinking blocks
type: task
description: "The session stream view only shows SystemBlock events (Agent dispatched, Agent
  started, Agent completed). Agent messages, tool calls, and thinking blocks are missing. Root
  cause: parseEventsToBlocks() in session-utils.ts line ~142 reads data.update but the event
  structure stores the SessionUpdate directly as data (no .update nesting). Additionally, ACP event
  type names have changed — the parser checks for old names (assistant_text, assistant, thinking,
  assistant_thinking) instead of current ACP types (agent_message_chunk, agent_thought_chunk,
  tool_call_update). Fix: correct the data path and add handlers for current ACP SessionUpdate
  types."
