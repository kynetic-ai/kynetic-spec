    content: >-
      Directory created and gitignored. Remaining work is spec + documentation.


      ## Done

      - Created .kspec/artifacts/ directory

      - Added .kspec/.gitignore to exclude artifacts/ from shadow branch commits

      - Moved first artifact (triage-report-2026-02-22.html) there


      ## Remaining (needs spec)

      - Spec the convention: what goes in artifacts, naming patterns, lifecycle

      - Add to kspec setup: create artifacts/ dir during init

      - Document in AGENTS.md or template sections: when to use artifacts/ vs other locations

      - Consider: kspec artifacts list, kspec artifacts clean --older-than Nd

      - Consider: should agents auto-name artifacts with date prefix? (current:
      triage-report-2026-02-22.html)

      - Add to doctor command: check artifacts/ exists


      ## Design Questions

      - Should artifacts be purely ephemeral or optionally tracked?

      - Naming convention: <type>-<date>.ext? <type>-<session-id>.ext?

      - Max size/age policy?

      - Should kspec generate commands output to artifacts/ by default?
