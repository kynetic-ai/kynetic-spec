  - _ulid: 01KJ37TGWDEGXT1KHDRJNNYQVV
    content: >-
      Implementation complete for 6 of 8 ACs:


      - ac-init-creates: initializeShadow() creates artifacts/ dir (shadow.ts ~line 1708)

      - ac-gitignore-entry: .gitignore with artifacts/ written during init (shadow.ts ~line 1710)

      - ac-commits-exclude: Covered by gitignore — tested that git add -A doesn't stage artifacts

      - ac-setup-ensures: runSetupPipeline() creates artifacts/ if missing (setup.ts ~line 1542)

      - ac-doctor-checks: buildShadowSection() checks artifactsDirExists (doctor.ts ~line 257)

      - ac-repair-recreates: repairShadow() creates artifacts/ after worktree rebuild (shadow.ts
      ~line 1818)


      Convention-only ACs (no code enforcement):

      - ac-naming-convention: Documented pattern type-YYYY-MM-DD.ext — agents follow by reading spec

      - ac-empty-dir-persistence: Handled by init/setup/repair creating the dir (not via .gitkeep
      since gitignore excludes artifacts/)


      Tests added: 6 new tests across shadow.test.ts and doctor.test.ts. All 112+29 pass.
