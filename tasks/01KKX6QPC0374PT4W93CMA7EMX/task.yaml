title: Fix shadow commit call sites that omit entity refs
type: task
description: >-
  Several commitIfShadow() call sites violate ac-3 (commit message must include ULID prefix or
  primary slug):


  1. inbox-add (inbox.ts:108): passes ref=undefined. Fix: pass the newly created item's ULID after
  saveInboxItem returns it.

  2. workflow-* (workflow.ts:134,319,379,420,458,730,788,975): pass no ref at all. Fix: pass the
  workflow run ULID or workflow ID.

  3. setup skill-install-core (setup.ts:1182): passes ref='N core skills' which is a count, not a
  ref. Fix: either omit ref (batch-like operation) or pass a meaningful identifier.

  4. tasks-assess (tasks.ts:511): passes ref='automation' which is a label. Fix: pass the count as
  detail and omit ref, or list affected task refs.


  Each fix should ensure the commit message includes an entity ref when one exists, per
  @trait-shadow-commit ac-3.
