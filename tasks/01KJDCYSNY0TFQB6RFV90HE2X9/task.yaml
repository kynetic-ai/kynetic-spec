title: Implement Register codex-acp in adapter registry
type: task
description: >-
  Register codex-acp as a first-class adapter and enable Codex env injection.


  ## What to change


  1. **src/agents/adapters.ts** — Add codex-acp to the ADAPTERS registry with command npx, args
  ["codex-acp"], and autoApproveArgs (see below). Also add optional autoApproveArgs field to
  AgentAdapter interface.


  2. **src/sessions/store.ts** — Uncomment the codex-acp case in injectEnvForAdapter() and
  removeEnvForAdapter(). The injectCodexEnv() function is already implemented — just wire it into
  the adapter switch.


  ## Auto-approve args

  codex-acp uses config flags: -c approval_policy="never" -c sandbox_mode="danger-full-access" for
  yolo equivalent.

  claude-agent-acp uses: --dangerously-skip-permissions


  ## How to verify

  - resolveAdapter("codex-acp") returns a registered adapter (not ad-hoc npx fallback)

  - injectEnvForAdapter with codex-acp writes KSPEC_SESSION_ID to Codex config

  - removeEnvForAdapter with codex-acp restores previous config state

  - See tests/session-create.test.ts and tests/ralph.test.ts for patterns
