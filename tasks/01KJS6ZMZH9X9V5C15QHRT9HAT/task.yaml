closed_reason: "Merged in PR #648. Implemented shadow auto-push failure visibility in
  src/parser/shadow.ts by capturing detached push exit/error details, emitting warning output on
  failure, and escalating warning visibility after repeated consecutive failures while keeping local
  commits non-blocking. Added regression tests in tests/shadow.test.ts for single-failure warning
  and repeated-failure escalation. AC coverage confirmation: @shadow-sync ac-1 behavior is covered
  by tests with explicit annotations; existing @shadow-sync sync-path coverage (ac-4/ac-6/ac-8)
  remains intact."
