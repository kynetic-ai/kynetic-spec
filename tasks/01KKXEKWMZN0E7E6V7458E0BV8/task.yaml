title: Detect stale integration target when dispatch base branch config changes
type: task
description: >-
  ## What


  When `dispatch.base_branch` changes in `kspec.config.yaml` after workspaces have already been
  provisioned, the existing workspace records preserve the original `integration.target_branch`
  value. This causes agents to merge into the wrong branch (e.g., `main` instead of `dev`).


  ## Why


  A real dispatch run had the reviewer agent merge a task branch into `main` even though
  `dispatch.base_branch` was set to `dev`. The workspace record was originally created before the
  config was changed, and the stale `target_branch` was never updated. The dispatch prompt
  faithfully reported the stale value, so the agent acted correctly on wrong data.


  ## How


  1. During workspace re-provisioning (when an existing record is found), compare
  `existingRecord.integration.target_branch` against the currently resolved `baseBranch` from
  config.


  2. When a mismatch is detected and the workspace's integration state is still `pending` (no merge
  has happened yet):
     - Update the workspace record's `integration.target_branch` to match the current config.
     - Log/note the change so it's visible in workspace status.

  3. When a mismatch is detected but the workspace has active integration state (e.g., in-progress
  merge, or the canonical branch was forked from the old base):
     - Surface the conflict as an actionable warning or error during provisioning.
     - Do NOT silently use either value — let the operator decide.

  4. Add tests covering:
     - Workspace provisioned with base_branch=main, config later changed to dev, re-provision updates target.
     - Workspace with completed integration is NOT silently retargeted.
     - Dispatch prompt reflects the updated target after re-provisioning.

  ## Spec Coverage


  Implements @dispatch-workspace-configuration ac-6 and ac-7.
