      ac-na-marker-preserved); add depends_on @ac-coverage-applicability. (2-4) Reconcile
      @ac-annotation-integrity-reporting ac-valid-annotation-covers-target,
      @ac-annotation-identifier-format ac-valid-token-covers-ac, and @trait-validation ac-2 by
      narrowing given/when to coverage-claiming annotations (those without a not-applicable marker).
      (5) Verified @ac-coverage-applicability description already names N/A-counts-as-coverage
      incorrect and assigns repair to the coverage storage plan (this plan); no transition-boundary
      prose to amend, ac-1/ac-2 left untouched. Verify all five with kspec item get."
