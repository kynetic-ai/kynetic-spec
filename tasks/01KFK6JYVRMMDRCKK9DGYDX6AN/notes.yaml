  - _ulid: 01KFN0C7F0XYCVGY751HN2ST0K
    content: Fixed inconsistent cancelled task filtering in derive command. The getParentTaskRef()
      function was already filtering cancelled tasks (AC-15), but the existence check at line 279
      wasn't. This caused specs with only cancelled tasks to be unable to re-derive without --force.
      Added filtering at line 279 to match the behavior of getParentTaskRef(). Added comprehensive
      E2E test to prevent regression. All 1056 tests pass.
