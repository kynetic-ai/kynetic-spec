    content: >-
      Execution context:

      - Background: AC annotations in test files (// AC: @slug ac-N) can reference non-existent
      specs/traits or non-existent ACs. Need to validate these during kspec validate.

      - Scope: Add a new validation function that takes the set of AC annotations from
      scanTestCoverage and verifies each against the ReferenceIndex and loaded spec items.

      - Files: src/parser/validate.ts (new function + integration into checkCompleteness or
      validate), src/cli/commands/validate.ts (display), tests/ac-annotation-validation.test.ts

      - Verification: New test file + full test suite pass
    supersedes: null
    author: "@claude"
    created_at: 2026-03-10T14:05:20.723Z
  - _ulid: 01KKC1E83BS6CQRN7RXGDF8FAG
    content: |-
      PR created: https://github.com/kynetic-ai/kynetic-spec/pull/753

      Implementation summary:
      - Added scanACAnnotations() for structured AC annotation scanning (file/line info)
      - Added validateACAnnotations() to check @slug resolution and ac-N existence
      - Added 'invalid_ac_annotation' CompletenessWarningType
      - Integrated into validate() completeness checks (runs by default)
      - CLI displays invalid annotations in completeness warnings section
      - 15 tests covering resolution, AC existence, traits, and edge cases
      - Full test suite passes (198 files, 4352 tests)
