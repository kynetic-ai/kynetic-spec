  - _ulid: 01KKCA1WP1Z4CMQX5GCCERDGAC
    content: "Fix cycle 2 addressed: The AC annotation regex required // AC: prefix for every match, so
      secondary @ref groups on the same line (e.g. // AC: @spec-a ac-1, @spec-b ac-2) were never
      validated. Extracted parseACAnnotationLine() shared helper that splits the remainder after //
      AC: into individual @ref groups. Both scanDirForACAnnotations (coverage) and
      scanDirForACAnnotationsStructured (validation) now use this parser. Added 13 regression tests
      covering unit, scan, and validate layers. Full suite passes (198 files, 4376 tests). Rebased
      on latest main."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-10T16:42:32.513Z
