title: Fix review interaction E2E failures blocking the full CI gate
type: bug
description: >-
  What: Fix the remaining interactive review Playwright failures that still reproduce through all
  retries in the full E2E run. The currently failing tests are in
  tests/e2e/review-interaction.spec.ts: 'creates a new thread with body and kind selection',
  'reopens a resolved thread', 'verdict decision options include all three types', and the
  blocker/question-thread interaction case currently failing in this spec's resolve/reopen coverage.


  Why: The interactive review controls are still a persistent red cluster in the full suite. Until
  these tests pass, CI cannot reliably guard review-thread creation, reopen/resolve actions, and
  verdict submission UI behavior.


  How:

  1. Reproduce the failing interaction cases with focused Playwright runs against
  tests/e2e/review-interaction.spec.ts.

  2. Inspect traces, network traffic, and snapshots to determine whether the failure is in form
  state, select controls, thread mutation wiring, stale fixture data, or review lifecycle updates
  not reaching the UI.

  3. Compare the UI behavior against the review API contract and fixture setup used by the spec.

  4. Fix the root cause in the component logic, supporting API route, fixtures, or the test harness;
  do not patch symptoms with arbitrary waits.

  5. Re-run the focused interaction spec until all currently failing cases pass reliably under
  retries, then run neighboring review coverage to confirm the interaction flow is stable.
