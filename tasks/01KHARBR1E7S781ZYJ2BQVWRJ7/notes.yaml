  - _ulid: 01KHARBR1FJEF3R0E4P8QZ8DP5
    content: "During ralph loop, skip reflection if no substantive work done (no tasks completed, no
      PRs, no code changes). Data: 19% workflow time wasted on 31 consecutive empty reflection runs.
      Gate at the skill level — check session introspection before running full reflect workflow."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-13T05:42:42.991Z
  - _ulid: 01KHD2KA3DMW2CSDFX4FMYYRVC
    content: Added gating logic to reflect skill's Loop Mode section. The skill now instructs the agent
      to check session introspection data (recently_completed tasks, working_tree status,
      recent_commits) BEFORE starting the reflection workflow. If no meaningful session work is
      detected (no tasks completed, no code changes, no commits), the agent outputs a skip message
      and exits immediately without starting the workflow. This prevents wasted time on empty
      reflection runs during ralph loops.
    supersedes: null
    author: "@claude"
    created_at: 2026-02-14T03:20:05.485Z
