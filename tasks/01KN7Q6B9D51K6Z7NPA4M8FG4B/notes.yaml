notes:
  - _ulid: 01KN7YJANWSGT1C9BSDS1SR9MJ
    content: "Approach: extend ProjectContextManager with per-project watcher health state and explicit
      probe hooks, then add a WatcherHealthMonitor wired from daemon server startup/shutdown and
      surface the fields on /api/debug/cache-status. Edge cases: ignore stopped watchers, keep probe
      restarts project-scoped, avoid self-induced loops from sentinel writes, and reset failure
      counters only on successful probes. Test plan: manager tests for success/failure/restart
      isolation, debug-route tests for exposed timestamps/counters, plus watcher-aware coverage for
      synthetic probe callbacks within the debounce window."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-02T20:36:14.140Z
  - _ulid: 01KN7Z8AFZY0SFNCYYQDW7MQ30
    content: "Implemented watcher health verification in the daemon. Added a periodic
      WatcherHealthMonitor, per-project health state on ProjectContextManager, synthetic
      .kspec/.health-check probes that are ignored by normal invalidation/broadcast paths, automatic
      per-project watcher restart on timeout, and cache-status diagnostics for
      lastHealthCheckAt/consecutiveFailures. Verification: targeted daemon-context-manager +
      daemon-debug-routes tests passed, full npm test passed (2068 suites / 7489 tests), and kspec
      validate reported only the repository's existing warning set."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-02T20:48:14.848Z
