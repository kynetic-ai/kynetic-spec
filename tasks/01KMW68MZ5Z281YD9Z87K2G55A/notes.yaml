  - _ulid: 01KMWS55KAPYGA6J998SP8TK77
    content: >-
      Approach: 

      - Create a CacheWarmingBanner component for the timeout error state (30s ceiling reached) with
      a Retry button that calls queryClient.resetQueries() for the relevant key.

      - Create a shared utility isCacheWarming(query) to detect when a query is in cache-warming
      retry (isError + isCacheWarmingError(error) + failureCount < max).

      - Update 8 views: tasks board, tasks list, specs, inbox, sessions, plans, reviews, triage.

      - Pattern: when isCacheWarmingError(query.error) is true, show existing skeleton instead of
      error state; when failureCount >= CACHE_WARMING_MAX_RETRIES, show CacheWarmingBanner with
      retry.

      - Reuse existing skeleton patterns per view (BoardSkeleton for board, shimmer divs for lists,
      etc.).

      - Entity name per view passed to CacheWarmingBanner for personalized error message.

      - ACs covered: ac-warming-skeleton (skeleton during warming), ac-warming-timeout (error state
      + retry button).

      - Edge cases: static mode bypasses warming (no CacheWarmingError thrown), query.error may be
      null when successful.
