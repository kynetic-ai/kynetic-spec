  - _ulid: 01KFCWX6T7XDECT2V0TS1ZA8GJ
    content: "Fixed critical bug in loadSpecFile() that prevented loading multiple YAML documents. Tests
      were adding second trait using --- separator, which caused first trait to load but second one
      to be ignored. Root cause: YAML.parse() only reads first document. Solution: Use
      YAML.parseAllDocuments() to handle files with multiple documents. All 6 tests now pass. Ready
      to merge PR #102."
    supersedes: null
    author: "@claude"
    created_at: 2026-01-20T05:09:14.696Z
