notes:
  - _ulid: 01KQD5KY549EB7MZ2KFA0RKHTW
    content: "Approach: introduce packages/daemon/src/web-ui-entry.ts with a single exported helper
      serveWebUiEntry(webUiPath) that reads index.html at request time. Returns 200 with text/html +
      Cache-Control: no-cache when present, 503 with text/plain + Cache-Control: no-store when
      missing. Replace the readFileSync(indexHtmlPath) capture in server.ts and have every SPA
      fallback route call the helper. Tests: direct helper unit tests for bundle change, missing
      entry 503, recovery, content type and cache headers; plus an Elysia app integration test that
      registers SPA routes and exercises both / and /tasks via app.handle to prove app-route AC.
      Preserve API/WS precedence (already handled by registration order before SPA routes), static
      asset containment (untouched serveWebUiStaticAsset), and resolveWebUiPath behavior
      (untouched)."
    supersedes: null
    author: "@claude"
    created_at: 2026-04-29T17:47:02.692Z
  - _ulid: 01KQD6C5MRKARFJ3JHG8NF071X
    content: "Implementation complete. Created packages/daemon/src/web-ui-entry.ts with
      serveWebUiEntry(webUiPath) (reads index.html at request time; 200 + text/html + Cache-Control:
      no-cache on success; 503 + text/plain + Cache-Control: no-store when missing) and
      registerWebUiEntryRoutes(app, webUiPath) which iterates WEB_UI_ENTRY_ROUTES (the same SPA
      route list the daemon previously registered). server.ts now removes the
      readFileSync(indexHtmlPath) startup capture and calls registerWebUiEntryRoutes(app,
      resolvedWebUiPath); SPA registration order is unchanged so /api/* and /ws still take
      precedence. Bun static plugin and node serveWebUiStaticAsset are untouched, preserving asset
      path containment and resolveWebUiPath behavior. Added tests/daemon-web-ui-entry.test.ts (13
      tests) covering: bundle-change reflected on next response (helper + via Elysia for /, /tasks,
      /items, /plans, /reviews), text/html content type, revalidating cache headers, 503 when
      index.html missing or webUiPath null, no-store on 503, and recovery after the entry returns.
      Full suite: 8539 passed / 5 skipped (unchanged from main). Lint warnings reduced by one (fixed
      urlFor scoping in new test); pre-existing 13 errors untouched."
    supersedes: null
    author: "@claude"
    created_at: 2026-04-29T18:00:16.792Z
