title: Fix plans page progress bar using unreliable Tailwind arbitrary value classes
type: task
description: >-
  What: The plans page progress bar and status breakdown dots use
  bg-[var(--design-status-completed)] (Tailwind arbitrary value syntax) instead of the theme
  utilities (bg-status-completed) used by every other component. The arbitrary value form is not
  reliably generated by Tailwind v4's Oxide scanner in production builds, causing the progress bar
  to be invisible.


  Why: A recent rebuild produced CSS that no longer includes the bg-[var(--design-status-*)] rules,
  making all progress bars on the /plans page invisible — both the fill bar and the colored status
  dots in the breakdown. Every other component (TaskList, AgentCard, DispatchStatus, ItemDetail,
  etc.) uses bg-status-* theme utilities which are reliably generated. The plans page is the only
  place using the raw CSS variable form.


  How: In packages/web-ui/src/routes/plans/+page.svelte, replace the 5 occurrences of
  bg-[var(--design-status-*)] with their theme utility equivalents:

  - bg-[var(--design-status-completed)] → bg-status-completed

  - bg-[var(--design-status-in-progress)] → bg-status-in-progress

  - bg-[var(--design-status-pending)] → bg-status-pending

  - bg-[var(--design-status-blocked)] → bg-status-blocked

  Then rebuild dist/web-ui and verify the progress bars render.
