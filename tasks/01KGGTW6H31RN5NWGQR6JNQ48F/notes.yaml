      Created @plan-support feature spec under @cli module with 33 acceptance criteria covering:
      - Plan CRUD operations (AC-1 through AC-9)
      - Plan validation (AC-10)
      - Plan import with auto-generation (AC-11 through AC-29)
      - JSON output support (AC-30 through AC-32)
      - Error handling with recovery hints (AC-33)

