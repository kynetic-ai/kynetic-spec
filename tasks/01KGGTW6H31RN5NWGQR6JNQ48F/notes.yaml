      - 01KGKSSK: Schema definition
      - 01KGKSSP: Parser functions
      - 01KGKSSV: CLI CRUD commands
      - 01KGKSSY: Plan derive command
      - 01KGKST6: Task schema plan_ref field
      - 01KGKST8: Plan validation
      - 01KGKSTC: Plan document parser
      - 01KGKSTH: Plan import command
      - 01KGKSTS: AGENTS.md documentation
      - 01KGKSTX: /plan skill
      - 01KGKSV0: @plan-workflow meta definition

      All tasks are independent and can be implemented in any order.
