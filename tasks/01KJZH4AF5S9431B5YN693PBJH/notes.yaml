  - _ulid: 01KJZH4BDBX3TKDQHKTTEEQBG9
    content: >-
      Root cause: test-base.ts:24-58 cleanupExistingDaemon() uses lsof -ti :3456 to find and
      process.kill(pid, SIGTERM) every process on port 3456. Called at line 81 before every test
      fixture setup.


      Approach:

      1. Remove cleanupExistingDaemon() entirely

      2. Replace hardcoded DAEMON_PORT=3456 with ephemeral port via net.createServer on port 0

      3. Add HOME/config isolation (mirror createIsolatedKspecHome from tests/helpers/cli.ts)

      4. Update DaemonFixture interface to expose port

      5. All ~28 spec files already use daemon fixture — propagate port from fixture

      6. Teardown already uses scoped serve stop (good) — just remove the kill cleanup


      Prior art: tests/cli-serve.test.ts uses getAvailablePort(), createIsolatedKspecHome(),
      waitForStartup()
    supersedes: null
    author: "@claude"
