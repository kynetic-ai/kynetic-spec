  - _ulid: 01KJZJWNXQFXJ3M8H8SDSBQH60
    content: >-
      Implementation complete. Changes across 15 files:

      - test-base.ts: removed cleanupExistingDaemon(), added getAvailablePort() for ephemeral ports,
      HOME isolation via isolatedHome, baseURL fixture override for page.goto() relative URLs

      - playwright.config.ts: removed hardcoded baseURL and port 3456 comment

      - 13 spec files: replaced hardcoded DAEMON_URL/DAEMON_WS_URL/DAEMON_HTTP_URL/DAEMON_PORT
      constants with daemon.baseUrl/daemon.wsUrl/daemon.port from fixture

      - Helper functions (connectWebSocket, subscribeToTriageUpdates, rawHttpRequest) updated to
      accept dynamic URLs/ports

      - beforeEach hooks updated to destructure daemon fixture


      Smoke tests pass (5/5). api-server and api-tasks pass same as main (26/31 — 5 pre-existing
      failures unrelated to port isolation). Full suite running.
