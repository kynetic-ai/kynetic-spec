title: Fix E2E test daemon isolation regression
type: bug
description: "Playwright E2E test base (packages/web-ui/tests/fixtures/test-base.ts) has
  cleanupExistingDaemon() that kills any process on port 3456 via lsof/SIGTERM. This kills the
  user's dev daemon whenever E2E tests start. Same pattern was fixed for vitest in PR #658 but never
  applied to Playwright. Fix: remove cleanupExistingDaemon(), use ephemeral ports, add HOME
  isolation, propagate dynamic port to all fixtures. Prior art: PRs #658, #672, #673, #674."
