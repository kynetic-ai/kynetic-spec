  - _ulid: 01KM0YQ5VWSWNGK05GM6DC7SSG
    content: >-
      Migrated dispatch trigger editing from agents view to automation view.


      Changes:

      1. Spec update: Removed @ui-agent-dispatch ac-4 through ac-9 (superseded by
      @ui-automation-view ac-5). Added spec note explaining the migration.


      2. AgentEditForm.svelte: Removed all dispatch trigger editing (dispatch state, filter
      functions, trigger rows, add/remove buttons, tag chip UI, priority input, automation
      dropdown). Retained agent-only fields (name, description, adapter, capabilities, tools,
      skills, budget, concurrency, auto_approve, prompt_template). Added description text directing
      users to automation view for trigger editing.


      3. AgentCard.svelte: Added "Configure in Automation" link pointing to /automation. Kept
      read-only trigger badge display (event type, automation, tags, priority badges).


      4. DispatchTriggersSection.svelte: Upgraded from basic trigger editing to full-featured
      editing matching the former AgentEditForm quality — chip-style tag management with individual
      removal buttons, priority filter threshold input, automation defaults
      (task.ready/task.needs_work default to eligible), Select component for automation dropdown
      instead of native select.


      5. E2E tests: Moved trigger editing tests (ac-5 through ac-9 equivalents) from agents.spec.ts
      to new automation.spec.ts. Updated agents.spec.ts to test "Configure in Automation" link and
      removed trigger editing test sections.


      All 6510 unit tests pass (1 pre-existing failure in review-cli.test.ts unrelated to this
      work).
