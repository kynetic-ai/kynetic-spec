    content: "Implemented shared triage export formatter in src/export/triage.ts. Extracted duplicated
      formatTriageContext() from both CLI (src/cli/commands/triage.ts) and daemon
      (packages/daemon/src/routes/triage.ts) into shared module. Two export formats: context
      (markdown) and JSON. exportTriageRecords() returns typed union. 18 dedicated tests covering
      all 4 own ACs (context format, JSON format, overrides, empty state) plus trait-json-output ACs
      (no ANSI, all data included, @ prefix refs, ISO timestamps). Updated daemon static analysis
      tests to verify shared formatter integration. Full suite: 3148 passed, 2 failed (pre-existing
      doctor flaky)."
