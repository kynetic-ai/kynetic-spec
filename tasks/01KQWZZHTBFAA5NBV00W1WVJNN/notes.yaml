notes:
  - _ulid: 01KQYZBKR8BDPA3R37AWD2V9H8
    content: >-
      Approach: 


      1. Add a shared helper getRunningDaemonClient() in src/cli/daemon-client.ts. It returns a
      non-null DaemonClientEndpoint when (a) PidFileManager.isDaemonRunning() and (b)
      resolveDaemonClientEndpoint() returns a result. Otherwise returns null. This combines the
      duplicated 'check pid + resolve endpoint' guard.


      2. Replace the duplicate getDaemonUrl() helpers in agent.ts, event.ts, schedule.ts with
      imports of getRunningDaemonClient() from the shared helper. Switch call sites to read
      endpoint.apiUrl/endpoint.wsUrl directly off the endpoint object so we never re-derive URLs.


      3. Daemon-proxy.ts: Remove the legacy '127.0.0.1:port' fallback in proxyCommand (line 230)
      since callers always pass the resolved endpoint now. The detection cache test helper
      synthesizes a legacy endpoint so test compat stays intact.


      4. Serve.ts statusServer: Already reads endpoint.bindHost. Add reading endpoint.connectHost
      and endpoint.runtime, surface them in both human and JSON outputs. cli-serve-commands ac-6
      lists 'bind_host, connect_host, runtime'.


      5. Tests:
         - cli-daemon-proxy.test.ts: add tests proving daemon-proxy uses metadata's api_url verbatim (covers IPv6 bracketed URLs and custom connect_host), not a constructed URL from port.
         - cli-serve.test.ts: add tests for serve status JSON exposing bind_host, connect_host, runtime.

      6. KSPEC_NO_DAEMON: shared helper uses isDaemonRunning() which already honors KSPEC_NO_DAEMON;
      the lifecycle commands in serve.ts pass {ignoreNoDaemon: true} so they keep working when
      KSPEC_NO_DAEMON is set.


      7. --daemon flag clear error: shouldProxyCommand already returns 'daemon required but
      unavailable' when forceDaemon=true and detection fails. Existing behavior covered.


      Edge cases:

      - IPv6 bracketed api_url: detection.endpoint.apiUrl already has bracketed [::1] when daemon
      advertises IPv6, since metadata stores the formatted URL. No extra work; just need test proof.

      - Legacy port fallback: shared resolveDaemonClientEndpoint already handles this; no
      per-command logic needed.

      - The agent watch command needs daemonConn.wsUrl (not apiUrl) — keep wsUrl on the helper
      return type.
    supersedes: null
    author: "@claude"
    created_at: 2026-05-06T15:43:58.216Z
  - _ulid: 01KQZ0KQM2ZBFCB5N499RJ7M4Z
    content: >-
      Implementation complete:


      1. Added src/cli/daemon-client.ts exporting getRunningDaemonClient(): combines isDaemonRunning
      + resolveDaemonClientEndpoint into one helper. Honors KSPEC_NO_DAEMON via PidFileManager.


      2. Replaced duplicated getDaemonUrl() helpers in agent.ts, event.ts, schedule.ts with imports
      of getRunningDaemonClient. Switched call sites to use endpoint.apiUrl/endpoint.wsUrl directly
      so URL construction is purely metadata-driven.


      3. Updated task.ts postDispatchEvent and parser/daemon-status.ts to use shared helper. Removed
      redundant pidManager.readPort() fallback in daemon-status — the shared resolver already
      handles legacy port fallback.


      4. Daemon-proxy.ts proxyCommand: removed legacy '127.0.0.1:port' URL fallback; endpoint is now
      required so apiUrl is always read from metadata or synthesized legacy endpoint. Updated
      index.ts caller.


      5. Serve status command now reports bind_host, connect_host, and runtime in both text and JSON
      output (cli-serve-commands ac-6).


      6. Tests added:
         - tests/cli-daemon-client.test.ts (7 tests): getRunningDaemonClient covering pid gates, KSPEC_NO_DAEMON, metadata, IPv6, legacy port fallback, metadata-over-legacy precedence.
         - cli-daemon-proxy.test.ts: IPv6 metadata detection test, metadata-keyed health-check timeout, proxyCommand wildcard+custom-connect-host test (binds 127.0.0.2 and proves Host header matches advertised connect_host), proxyCommand IPv6 bracketed URL test.
         - cli-serve.test.ts: status JSON includes bind_host/connect_host/runtime; status text includes all three lines.
         - Updated existing proxyCommand tests to pass endpoint object instead of port (now required).

      Validation: typecheck passes, build passes, full test suite passes (8663 tests). 


      ACs covered:

      - @daemon-network-endpoint-contract ac-clients-use-metadata, ac-legacy-port-fallback

      - @cli-daemon-proxy ac-auto-detect, ac-force-direct, ac-force-direct-management-exception,
      ac-force-proxy

      - @daemon-proxy-detection ac-connection-metadata-check, ac-legacy-port-file-fallback,
      ac-health-timeout (now metadata-keyed)

      - @cli-serve-commands ac-6 (bind_host/connect_host/runtime in text + JSON)

      - @trait-daemon-endpoint-consumer ac-uses-reported-endpoint, ac-wildcard-not-destination
    supersedes: null
