title: Fix link commands that bypass generateCommitMessage
type: task
description: >-
  link.ts:125 and link.ts:394 pass raw human-readable strings as the operation parameter to
  commitIfShadow() instead of using a structured operation+ref+detail pattern:


  - link.ts:125: 'Add implements link: @from -> @to'

  - link.ts:394: 'Remove implements, depends_on link: @from -> @to'


  These bypass generateCommitMessage() entirely (fall through to default, which just emits the raw
  string). Fix: use structured operations like 'link-add' and 'link-remove' with the from-ref as the
  ref parameter and the relationship details as detail. Add corresponding cases to
  generateCommitMessage().
