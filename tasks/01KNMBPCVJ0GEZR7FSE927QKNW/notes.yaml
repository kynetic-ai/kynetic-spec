notes:
  - _ulid: 01KNMGR8M0RSVPG0PE8MBXPEEY
    content: "Approach: add a shared cache-aware preamble in TaskDataManager read paths by consulting
      getEntityCacheContext(), resolving the per-project cache, and short-circuiting
      listTasks/loadAllTasks/getTask only when the tasks domain is ready. Edge cases: direct CLI
      mode must never touch the cache, filtered listTasks still applies in-memory filters after a
      cached index hit, getTask must fall through on cache detail miss and populate the detail tier,
      and mutation methods remain disk-backed regardless of cache state. Test plan: behavioral
      TaskDataManager tests for cached list hit, cached loadAll hit, getTask detail miss populating
      cache, non-ready/no-context fallback to disk, and a mutation-path test proving cache
      availability does not bypass backend writes."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T17:44:56.192Z
  - _ulid: 01KNMHCM7Q0HG2Q3FQWSFR8ZTC
    content: "Implemented cache-aware task reads in TaskDataManager. listTasks/loadAllTasks now
      short-circuit to the ready tasks domain via AsyncLocalStorage cache context, and getTask
      resolves cached summaries, returns cached details on hit, or falls through once to disk and
      populates the detail tier on miss. Added AC-tagged behavioral coverage for cached list/loadAll
      hits, getTask detail-miss write-through, direct CLI fallback, and mutation methods staying on
      the backend write path. Verification: npm run typecheck passed; targeted npm test -- --run
      tests/task-data-manager.test.ts passed; npm test initially passed earlier in the session, then
      a later full-suite rerun hit unrelated/flaky failures in tests/cli-no-daemon.test.ts and
      tests/daemon-review-websocket.test.ts while a focused rerun of those files passed immediately
      afterward; kspec validate reported only the repo’s pre-existing warning set."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T17:56:03.447Z
