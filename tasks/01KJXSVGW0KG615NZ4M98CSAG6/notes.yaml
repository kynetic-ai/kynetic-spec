    content: "Review findings: MUST-FIX 1) Spec alignment defect for @ui-session-stream ac-3 threshold
      semantics. Spec says auto-scroll pauses when user is >100px from bottom and resumes when
      scrolled back; implementation pauses at exactly 100px because shouldAutoScroll uses '<
