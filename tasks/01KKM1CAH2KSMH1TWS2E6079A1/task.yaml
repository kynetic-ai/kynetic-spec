title: Implement inline registry purge for closed dispatch workspace records
type: task
description: >-
  The dispatch workspace registry (project.dispatch-workspaces.yaml) accumulates records
  indefinitely. Records transition through lifecycle states ending in 'closed' but are never removed
  from the file. Over time this causes unbounded growth.


  Implement inline purge logic in saveDispatchWorkspaceRecord (src/parser/dispatch-workspaces.ts)
  that removes closed records whose closed_at timestamp exceeds a retention threshold (default 7
  days). The purge runs inside the existing withFileLock scope so no new locking is needed. The
  shadow commit that follows registry writes already handles durability — purged records are simply
  fewer records in the same write.


  Key implementation details:

  - Add purge logic to saveDispatchWorkspaceRecord only (NOT mutateDispatchWorkspaceRecordAtomically
  — different semantics)

  - Filter out records where lifecycle_state === 'closed' AND timestamps.closed_at is older than 7
  days

  - The first write after shipping will purge the backlog of old records automatically

  - provisionDispatchWorkspace reads closed records (includeClosed: true) to reuse workspace
  identity (canonical branch, worktree paths) during re-provisioning. After purge, re-opened tasks
  beyond the retention window get fresh identities. This is acceptable since the worktree and branch
  are already reaped by cleanup

  - reconcileDispatchWorkspaceRegistry already filters to non-closed records (nonClosedRecords at
  ~line 1272) — no interaction

  - validateSingleOpenWorkspacePerTask only checks non-closed records — no interaction


  Spec: @dispatch-workspace-registry ac-9

  Files: src/parser/dispatch-workspaces.ts (purge logic in saveDispatchWorkspaceRecord), tests/ (new
  test file for purge behavior)

  Verification: npm test
