title: CLI mutation commands should show what changed (before → after) in output, especially for
  array fiel
type: task
description: >-
  Two related CLI mutation UX improvements:


  1. item set --trait should append by default (or provide --add-trait / --remove-trait flags).
  Current behavior silently REPLACES the entire traits array, causing data loss when users expect
  append semantics.


  2. All mutating CLI commands should display a diff of what changed (before/after) so silent
  overwrites are visible.


  Priority is (1) — the --trait replace behavior is a known footgun documented in MEMORY.md. Fix in
  src/cli/commands/item.ts. Consider backward compatibility.
