  - _ulid: 01KXVZ9HZQ9CVAQQAMKQM4F5JA
    content: "Approach: add only a /pagefind/* Node route and reuse serveWebUiStaticAsset so MIME,
      cache, byte reads, and bundle-root containment stay centralized. Guard the route to the
      Pagefind subtree and reject empty/non-matching paths. Remove the local Pagefind interception
      from docs E2E while retaining the isolated same-content parity fixture. Edge cases: missing
      entry, nested binary fidelity, direct traversal outside Pagefind/bundle, non-vacuous
      same-origin request observation, transport/non-2xx/browser errors. Test plan: first add
      behavioral route cases for @docs-search ac-2 and strengthen wide/narrow daemon-backed searches
      for ac-1/ac-2; retain canonical parity for ac-3; run focused failures before implementation,
      then all project gates."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-19T01:19:18.519Z
  - _ulid: 01KXW0D94CS98JS678W9TBFKY8
    content: "Implemented the narrow Node /pagefind/* route with decoded Pagefind-subtree containment
      while reusing existing static response semantics. Focused RED proved entry/nested assets were
      404 and traversal could reach a root bundle asset; GREEN covers JS MIME/cache, nested binary
      MIME/cache/exact bytes, missing 404, and bundle/outside traversal rejection. Removed the
      daemon-search Pagefind interception; wide/narrow E2E now observes successful same-origin
      Pagefind traffic and navigates all six docs. Canonical same-content public/local parity
      remains intact. Verification: focused daemon 7/7, docs-search unit 13/13, docs E2E 17/17, full
      suite 10,994 passed/3 skipped; format, repo/focused lint, typecheck, builds, diff check, and
      all kspec validations passed with existing warning baselines."
    supersedes: null
