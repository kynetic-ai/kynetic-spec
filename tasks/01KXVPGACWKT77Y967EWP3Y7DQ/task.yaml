title: Serve packaged Pagefind assets from the Node daemon for real local docs search
type: bug
description: >-
  ## Covers


  - `@docs-search ac-1`: real locally served searches return navigable matching docs pages.

  - `@docs-search ac-2`: local search loads its packaged index from the same-origin Node daemon,
  without a non-local request.

  - `@docs-search ac-3`: local and public indexes built from the same docs content return the same
  canonical result set.


  ## Defect


  The Node static routes in `packages/daemon/src/web-ui-static.ts` serve `/_app/*` and root-level
  assets, but not nested `/pagefind/*` assets. Pagefind entry and lazy index/chunk requests
  therefore fall through. `tests/e2e/docs.spec.ts` masks this production defect:
  `serveStaticPagefind()` intercepts `**/pagefind/**` and fulfills requests from
  `dist/web-ui/pagefind`, so the test does not prove that the real local daemon serves offline
  search assets. The separate synthetic public/local parity fixture does not replace that
  daemon-backed proof.


  ## Implementation


  1. Add a narrow Node-daemon route for generated files under `/pagefind/*`. Reuse the existing
  static response behavior and preserve the existing bundle-root path-containment boundary. The
  route must remain limited to the Pagefind subtree; do not introduce broad arbitrary nested-file
  serving.

  2. Preserve the existing missing-file behavior and cache policy. Serve a normal Pagefind entry
  asset with its correct content type, and preserve exact bytes plus an appropriate binary content
  type for a representative nested Pagefind index/chunk asset. Reject a direct
  traversal/path-containment attempt without exposing a file outside the permitted subtree. This is
  a focused regression boundary, not a general static-server security audit.

  3. In `tests/e2e/docs.spec.ts`, remove `PAGEFIND_BUILD`, `serveStaticPagefind()`,
  imports/constants used only by it, and local `page.route('**/pagefind/**')` fulfillment. The local
  proof must use the existing default Node-daemon fixture and packaged `dist/web-ui/pagefind`
  output.

  4. Run real searches for all six `DISPATCH_DOCS` at the existing wide and narrow viewports, verify
  each result is navigable and renders the expected heading, and make the network proof non-vacuous:
  collect observed Pagefind requests, Pagefind transport failures, non-2xx Pagefind responses, and
  requests to non-local origins; require at least one observed Pagefind request, require every
  observed Pagefind request to use the daemon origin, and require all failure/non-local collections
  to be empty. Keep console-error and uncaught page-error collections empty as well.

  5. Retain an honest `ac-3` canonical result-set parity check using local/public indexes generated
  from identical docs content. A synthetic parity fixture may remain for that comparison, but it
  must not be presented as the `ac-1`/`ac-2` real-daemon proof. Preserve deterministic
  generation/copying of the Pagefind bundle; change build scripts only if a real packaging defect is
  found and cover that change directly.


  ## Focused regression proof


  Use TDD: first capture a RED focused route test and interception-free E2E failure, then make them
  GREEN.


  The Node route coverage should use only representative cases:


  - a normal entry asset such as `/pagefind/pagefind.js`, including relevant content type and cache
  behavior;

  - one nested binary index/chunk asset, including byte-for-byte fidelity, appropriate content type,
  and cache behavior;

  - one missing Pagefind asset returning the existing not-found response;

  - at least one direct traversal/path-containment rejection proving the route cannot read outside
  its permitted subtree.


  Do not require a fixture for every emitted Pagefind extension or every conceivable encoded
  separator, malformed URL, directory, or traversal spelling. Keep machine-readable `// AC:
  @docs-search ac-N` annotations on tests that prove the corresponding behavior.


  ## Likely files


  - Modify `packages/daemon/src/web-ui-static.ts`.

  - Modify `tests/daemon-web-ui-startup-asset-coherence.test.ts`, or create a narrowly named
  adjacent Node static-route test if that is clearer.

  - Modify `tests/e2e/docs.spec.ts`.

  - Inspect as needed, but normally leave unchanged: `packages/daemon/src/server.ts`,
  `tests/e2e/fixtures/test-base.ts`, `scripts/build-docs-search.cjs`,
  `packages/web-ui/src/lib/components/DocsSearch.svelte`, `tests/web-ui-docs-search.test.ts`, and
  root `package.json`.

  - Treat `packages/web-ui/build/pagefind/**` and `dist/web-ui/pagefind/**` as generated
  verification output; do not hand-edit them.


  ## Verification


  Run the task-specific proof from the repository root:


  ```bash

  npm test -- tests/daemon-web-ui-startup-asset-coherence.test.ts

  npm run build:docs-search

  npm run build:web-ui

  npm run test:e2e -- tests/e2e/docs.spec.ts

  git diff --check

  ```


  If route tests move to a new focused file, run that exact file instead. Also run the
  project-defined work gates from the attached instructions.


  ## Out of scope


  - Broad nested static serving, catch-all filesystem serving, or unrelated Bun/static-route
  redesign.

  - Public search ranking, matching, content, canonical URL, or index-scope changes.

  - Using request interception, `route.fulfill`, an API mock, a synthetic-only index, or an
  alternate static server as evidence for the local Node-daemon path.

  - Unrelated docs, lifecycle, dispatch, daemon, or web UI cleanup; hand edits to generated outputs.
