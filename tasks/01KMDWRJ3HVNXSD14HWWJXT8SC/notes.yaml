    content: "Review complete (01KMDY7A). Verdict: request_changes. One blocker: when agent_id is absent
      from event context, adapterId remains undefined instead of defaulting to claude-agent-acp —
      {skill:...} tokens are left unrewritten. The test claims this default but does not verify
      reference rewriting. Fix: add else clause setting adapterId = claude-agent-acp, and add test
      assertion verifying {skill:task-work} is rewritten. All other aspects are solid — schema,
      skill resolution, error handling, AC coverage, tests all pass (7174/7174)."
