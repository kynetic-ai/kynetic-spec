title: Sanitize Active Fleet preview terminal output
type: bug
description: "What:

  - Improve the compact Active Fleet/task-board preview of running agent output so raw terminal
  control bytes do not render as mangled-looking text in fleet cards.

  - In `packages/web-ui/src/lib/components/board/fleet-buffer.ts`, sanitize completed display lines
  before they enter the compact `lines` array used by Active Fleet cards.

  - Strip ANSI/CSI terminal escape sequences from preview lines, normalize CRLF newlines to LF,
  treat bare carriage returns as terminal progress-line rewrites, apply backspace controls, and
  strip remaining non-printing terminal control characters.

  - Preserve the existing bounded preview behavior (`MAX_DISPLAY_LINES`) and line-buffering
  semantics.

  - Preserve split escape sequence handling by keeping incomplete buffered text raw until a newline
  completes the display line.


  Why:

  - Agent/CLI streams can contain color codes, cursor/progress rewrites, backspaces, and other
  terminal bytes that are meaningful in a terminal but confusing in the browser card preview.

  - The Active Fleet row promises the last few lines of output; those lines should be readable
  enough for status scanning without requiring users to open full logs.

  - This is separate from the CLI `[object Object]` error-formatting fix: this task only addresses
  web UI compact preview rendering of terminal-like streams.


  How:

  - Keep the sanitizer preview-only and pure; do not mutate backend event payloads, session event
  storage, canonical logs, or the session-event accumulator.

  - Implement small helper functions in `fleet-buffer.ts` rather than adding a full terminal
  emulator/xterm dependency.

  - Apply sanitization only when a line is complete; do not sanitize `state.buffer` while the line
  is still partial.

  - Treat remaining bare `\r` characters as terminal-style line rewrites after CRLF has been
  normalized.

  - Avoid broad product/UI changes outside
  `packages/web-ui/src/lib/components/board/fleet-buffer.ts` unless tests reveal the preview path
  requires them.

  - Fix any formatter issues in the existing exploratory edits before submitting the task for
  review.


  Testing:

  - Add/update `tests/web-ui/fleet-buffer.test.ts` coverage for:

  \  - stripping ANSI color/control sequences from completed display lines;

  \  - split ANSI sequences across chunks staying buffered until the line completes;

  \  - bare carriage returns keeping only the latest progress-line content;

  \  - CRLF normalization preserving distinct lines;

  \  - backspace controls applying before display.

  - Run:

  \  - `npm test -- --fresh --run tests/web-ui/fleet-buffer.test.ts`

  \  - `npx oxlint packages/web-ui/src/lib/components/board/fleet-buffer.ts
  tests/web-ui/fleet-buffer.test.ts`

  \  - `npm run format:check`

  \  - `npm run typecheck`

  - If implementation touches other web UI files, also run the smallest relevant additional web-ui
  test slice and include those commands in the task note.


  Covers:

  - `@ui-task-board ac-4`


  Out of scope:

  - Do not change `src/cli/output.ts`, plan-branch error formatting, CLI JSON/YAML/text output
  contracts, or exit-code semantics.

  - Do not change backend stream/event payloads, WebSocket event schema, session-event accumulation,
  stored session logs, or full-log rendering.

  - Do not attempt full terminal emulation, cursor positioning, alternate screen handling, or
  xterm-style rendering in fleet cards.

  - Do not change Active Fleet card layout, task ordering, dispatch status semantics, or
  `MAX_DISPLAY_LINES`.


  Proposal review:

  - Native `plan-reviewer` read-only review returned CLEAR before task creation.

  - Reviewer agreed existing `@ui-task-board ac-4` is sufficient coverage and noted optional extra
  coverage for non-SGR CSI sequences is not blocking.\n"
