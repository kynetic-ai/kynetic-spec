  - _ulid: 01KK003ZF1V8XEFB94507WKVCJ
    content: "[FIX_CYCLE: 1] Review findings: Review issues: unlabeled plans filter control; plans view
      does not refresh when task status changes because plans:updates is never emitted; wireframe
