  - _ulid: 01KK003YXNE758T82W0THN7XCK
    content: "Review findings: MUST-FIX 1) packages/web-ui/src/routes/plans/+page.svelte:149 adds the
      plans status filter as an unlabeled <select>; there is no visible label or aria-label, so
      screen-reader users get an unnamed combobox. This fails the accessibility gate in the review
      checklist. MUST-FIX 2) packages/web-ui/src/routes/plans/+page.svelte:61 subscribes to
      plans:updates, but the daemon never emits that topic (see
      packages/daemon/src/project-context.ts:96-103 and packages/daemon/src/server.ts:385-388). Plan
      progress is derived from task status, so task status changes will leave /plans stale until
      manual reload. SHOULD-FIX 3) The plans cards stop at metadata/progress and omit the per-plan
      navigation actions shown in the revamp wireframe ([View Specs] / [View Tasks]). Tests passed
      (npm test; cd packages/web-ui && npm test), and kspec validate showed no warnings specific to
      @ui-plans-view, but the issues above block approval."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-05T21:58:01.397Z
  - _ulid: 01KK01JKMC2CC5CWM581AGQT57
    content: "Fix cycle 1 addressed: (1) Added visible <label> element for plans status filter — fixes
      accessibility gate failure. (2) Changed WebSocket subscription from plans:updates to
      tasks:updates — plan progress is derived from task statuses, so task changes now trigger plan
      view refresh. (3) Added View Specs / View Tasks navigation buttons to plan cards per
      wireframe. (4) Added E2E tests for accessible label and navigation actions."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-05T22:23:29.932Z
  - _ulid: 01KK08MR69SX9ZAS8MD6A1756S
    content: 'Review findings: MUST-FIX 1) packages/web-ui/src/routes/plans/+page.svelte:285 and :297
      add plan-scoped "View Specs" / "View Tasks" links, but the destination pages ignore the plan
      query. /items only redirects to /specs preserving query
      (packages/web-ui/src/routes/items/+page.svelte:8-10), /specs only reads ref
      (packages/web-ui/src/routes/specs/+page.svelte:53-58), and /tasks only supports
      status/type/tag/assignee/automation filters
      (packages/web-ui/src/routes/tasks/+page.svelte:39-46; packages/web-ui/src/lib/api.ts:95-103).
      Clicking the new actions therefore lands on unfiltered lists, so the wireframe navigation
      action is still not implemented. SHOULD-FIX 2) packages/web-ui/tests/e2e/plans.spec.ts:185-202
      only asserts that the buttons are visible; it never verifies the href or filtered navigation
      behavior, which let this regression through. Tests passed (npm test; cd packages/web-ui && npm
      test), and kspec validate showed no warnings for @ui-plans-view.'
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-06T00:27:00.170Z
