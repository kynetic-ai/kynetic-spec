      daemon-entity-cache (36 suites / 161 tests passed); KSPEC_NO_DAEMON=1 kspec validate exited 6
      with only pre-existing repository warnings; NODE_ENV= npm test -- --fresh hit an unrelated
      flaky failure in tests/dispatch-target-sync.test.ts (STACK_TRACE_ERROR), and NODE_ENV= npm
      test -- --fresh dispatch-target-sync immediately passed in isolation (2 suites / 41 tests)."
