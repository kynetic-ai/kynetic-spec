  - _ulid: 01KNK6G8JK1CFXXZPCHV2D88VR
    content: "Fix cycle approach: serialize same-domain hinted write-throughs through the existing
      in-flight reload lane so concurrent task patches cannot overwrite each other. Added a
      regression test that stages two task file updates, runs Promise.all over hinted writeThrough
      calls, and verifies both cached task details survive the concurrent request-path refresh."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T05:26:33.811Z
  - _ulid: 01KNK6TW9G3X7RFDQVM1VZ3XDZ
    content: "[FIX_CYCLE: 1] Addressed the concurrent hinted task write-through race from review.
      Non-meta hinted writeThrough now queues behind the per-domain in-flight reload lane instead of
      applying cloned task maps in parallel, so two request-path task refreshes cannot overwrite
      each other. Added a regression test for Promise.all over hinted task writeThrough calls.
      Verification: npm test -- daemon-entity-cache (31/31 suites, 135/135 tests) after the final
      test cleanup; npm test -- --fresh (2070/2070 suites, 7553 passed, 5 skipped); kspec validate
      exited 6 with only pre-existing repository warnings."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T05:32:21.680Z
