notes:
  - _ulid: 01KN8WTV6Q8G7VD8KGR37SBAEC
    content: "Approach: add coverage around a unified active target set in DispatchEngine, then replace
      the split push-side integrationTargetBranch and pull-side _syncBaseBranch with
      _configuredBaseBranch + _activeTargets. Reuse
      loadDispatchWorkspaceRegistry/resolveDispatchWorkspaceConfig rather than reading raw files.
      Edge cases: empty registry still includes configured base branch; duplicate workspace targets
      dedupe; closed workspaces must not count; cleanup must never remove the configured base
      branch. Test plan: cover @dispatch-remote-branch-sync ac-active-target-includes-base,
      ac-active-target-rebuilt-on-start, ac-active-target-removed-on-cleanup, plus a regression test
      that push/pull callers read from the same _activeTargets source of truth."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-03T05:25:10.487Z
  - _ulid: 01KN8XDTREW4VRKFFERK3VEQ1W
    content: "Implemented unified active target state in DispatchEngine. Replaced split push/pull branch
      bookkeeping with _configuredBaseBranch + _activeTargets, rebuilt the set from open workspace
      registry records during sync initialization, added incremental add/remove helpers for
      provisioning and cleanup, and exposed activeTargets through getTargetSyncStatus(). Added
      AC-annotated dispatch sync tests for base-branch inclusion, registry rebuild dedupe/exclusion
      of closed workspaces, orphan cleanup removal, and shared source-of-truth resolution.
      Verification: npm test -- --fresh passed (2068 suites, 7495 tests, 5 skipped). kspec validate
      reports only pre-existing project warnings (orphaned skills/alignment/completeness debt), no
      new validation errors from this task."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-03T05:35:32.622Z
