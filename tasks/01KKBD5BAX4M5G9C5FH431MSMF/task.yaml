description: >-
  Harden kspec validate --json to output strict JSON with no trailing text.


  Current behavior: validate --json may append human-readable summary text after the JSON object,
  breaking jq pipelines and programmatic consumers.


  Fix: Ensure all output after the opening { goes through the JSON formatter. Check
  src/cli/commands/validate.ts for any console.log calls that bypass the JSON output mode. Add a
  test that pipes validate --json output through JSON.parse to catch regressions.
