  - _ulid: 01KM07XQRQRBAMMAGQ3S7Y163K
    content: "Fixed MUST-FIX blocker from review cycle 1: added _isTargetSyncStale() gate to
      _reconcile() sync guard (line 1211) so sync respects sync_interval instead of running every
      reconciliation pass. Updated ac-pull-target-periodic test to exercise _reconcile() path
      directly — verifies fresh timestamp skips sync, stale timestamp triggers it. Updated
      ac-pull-target-periodic-deferred test to backdate timestamp before reconcile calls. Also
      addressed suggestions: removed dead code (already-up-to-date check in non-zero exit path,
