  - _ulid: 01KK8MP874SDWDE4B0X2HQZCQZ
    content: "Fix cycle 1 — addressed all 3 MUST-FIX review findings: (1) Shadow repair early return:
      restructured to use if/else instead of early return so session branch repair runs regardless
      of kspec-meta health. (2) Daemon wiring: added SessionSyncScheduler import/init/stop in
      packages/daemon/src/server.ts, reads manifest YAML directly for session config, created
      session-sync.ts re-export. Independent error handling. (3) ac-sync test coverage: 5 new tests
      covering sessionBranchPull (no remote, with remote), SessionSyncScheduler lifecycle, disabled
      interval, and in-flight dedup independence. Full suite: 4233 passed, 0 regressions."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-09T06:31:27.716Z
  - _ulid: 01KK8N1TBGN27P6RM29T1GJKAH
    content: "[FIX_CYCLE: 2] Review findings: MUST-FIX: PR #723 still hardcodes the default shadow
      manifest path and origin remote for session sync, so ac-sync is incomplete for non-default
      configurations. Full local regression gate is also not clean (npm test: 3 failing tests)."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-09T06:37:46.736Z
  - _ulid: 01KK8PP29YJX12JVTMARHJSSGJ
    content: >-
      Fix cycle 2 — addressed both MUST-FIX findings:


      1. **Hardcoded manifest path (daemon server.ts)**: Replaced raw readFileSync + hardcoded
      '.kspec/kynetic.yaml' with loadProjectConfig() to derive specDir from config.shadow.directory.
      Also replaced inline branch name/worktree path resolution with resolveSessionBranchConfig()
      for consistency.


      2. **Hardcoded 'origin' remote (session-branch.ts)**: Added resolveRemoteName() helper that
      reads branch.<name>.remote from git config, falling back to 'origin' if unconfigured. Used in
      both initializeSessionBranch() and sessionBranchPullImpl(). Matches the pattern used by
      pullRebaseBeforePush() in shadow.ts.


      3. **New test**: Added 'sessionBranchPull resolves configured remote instead of hardcoding
      origin' — sets up a non-default remote ('upstream'), configures tracking, pushes from a clone,
      then verifies pull uses the configured remote.


      Full test suite: 4234 passed (23 session-branch tests), 2 pre-existing failures in codex
      platform detection (unrelated). 0 regressions.
    supersedes: null
    author: "@claude"
    created_at: 2026-03-09T07:06:18.814Z
