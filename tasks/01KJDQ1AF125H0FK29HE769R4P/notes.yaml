      detach-then-attach behavior in tests/ralph.test.ts. Verification: npm test --
      tests/ralph.test.ts (142 passed). kspec validate still reports pre-existing meta/reference
      issues unrelated to this task (@observations ambiguity, missing observations skill file)."
