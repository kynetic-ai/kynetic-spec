  - _ulid: 01KXM7REQAXW665DRYAMKHEDZ6
    content: "Approach: extend the canonical registry and both schema owners with the six
      dispatch_control identifiers and one strict discriminated payload schema; reuse the engine
      EventBus, lifecycle mutex, committed store results, existing text sanitizer semantics, task
      identity errors, shadow transaction errors, and cleanup errors. Add one exported closed error
      mapper and one typed outcome emitter, then wire lifecycle action success/failure paths only
      after durable mutation/cleanup settles and forward the typed event on the agents WebSocket
      callback. Edge cases: task/global identity exclusivity, failed-only closed error_code, Unicode
      code-point bounds, control/whitespace normalization, omission of all unapproved raw fields,
      commit/verification collapse to control_commit_failed, store corruption versus availability,
      and exactly-once emission after commit rather than retry observations. Test plan: write
      behavioral emitter fixtures first for four applied actions, noop, all 17 failures, commit
      barrier timing, full sanitizer/forbidden-field matrix, registry/payload cross-schema parity,
      EventBus delivery, shared schema parity, and agents callback publication; retain existing
      trait error-guidance coverage."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-16T01:13:19.850Z
  - _ulid: 01KXM8BQ21EF97YRYM0HVQ9WSK
    content: "Implemented the lifecycle audit pipeline: six registry identifiers, strict
      dispatch-control payload schema in core/shared owners, exhaustive 17-predicate closed mapper,
      Unicode/control-safe whitelist emitter, engine success/failure emission after durable action
      settlement, EventBus retention, and agents-topic callback wiring. The existing centralized
      agents invalidation already refreshes queryKeys.agents.all, while the automation page's agents
      listener refreshes its recent-event query, so no UI code change was needed. Focused event
      tests pass 190/190; broader global/task/stop lifecycle, daemon dispatch, and WebSocket
      invalidation regression slices pass 103/103."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-16T01:23:50.977Z
  - _ulid: 01KXM95M2B606RVC0PRHP01SBH
    content: "Quality gates complete. npm test passed all 2,810 suites / 10,748 tests (3 skipped);
      focused event slice passed 190/190 and lifecycle/WebSocket regression slice passed 103/103.
      format:check, repo lint --quiet (0 errors), focused oxlint (0 warnings/errors), typecheck, git
      diff --check, and refs/alignment/completeness validations all pass with warnings allowed.
      Reviewer tables: identifiers = start/pause/resume/stop applied -> matching
      dispatch_control.*_applied, noop -> dispatch_control.noop, failed -> dispatch_control.failed;
      sanitizer = reason 240/default operator request, actor 120/default dispatch-engine, task_ref
      200, Unicode-code-point truncation after control removal and whitespace collapse; durable
      result = one emission only after action/cleanup settles, failure code derived from the closed
      17-predicate mapper, raw inputs/errors never copied."
