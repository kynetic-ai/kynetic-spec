  - _ulid: 01KN437HCJ7WV72G2TC3TTY9GM
    content: "Approach: reproduce the two failing observations Playwright cases with trace output,
      compare test expectations against the observations page/API contract, then fix the root cause
      in the page, fixtures, or test. Edge cases: markdown rendering without a context object,
      unresolved-only filtering, and true empty unresolved state when resolved observations still
      exist. Test plan: focused coverage for the two failing observations cases first, then nearby
      observations/session-sidebar checks to guard regressions."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-01T08:40:45.714Z
  - _ulid: 01KN43JV6CZ305P01JQXTFBAE2
    content: "Root cause: observation context was present in the E2E fixture and consumed by the
      observations page, but ObservationSchema did not define context so the parser dropped it
      before the daemon/API response. Also fixed the observations Playwright spec to target the
      markdown-backed fixture item by content instead of list order and to mock an explicit empty
      unresolved response for the empty-state path."
    supersedes: null
    author: Jacob Chapel
