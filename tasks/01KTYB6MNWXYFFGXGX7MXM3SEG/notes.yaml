  - _ulid: 01KTYBZN9Y6CX41RYE32JJA5HB
    content: "Root cause analysis: the dedup test proxies the WS to the real fixture daemon, so real
      broadcasts (cache:status domain_ready, files:updates, tasks:updates) keep flowing during the
      measurement. Three noise paths can add /api/tasks responses after the settle window: (1)
      files:updates events schedule DELAYED invalidations at +650ms/+1500ms (ws-invalidation.ts
      FILE_WATCHER_INVALIDATION_DELAYS_MS) while the settle helper only requires 750ms stability — a
      1500ms timer can fire after settle returns, invalidate tasks.all, and produce extra responses
      in the 1s post-replay window (two timers = exactly the observed 4→6); (2) under full-suite
      load (10 workers), in-flight /api/tasks responses can take >750ms and land after settle
      returns since the helper counts responses, not in-flight requests; (3) late cache-warming
      domain_ready broadcasts invalidate tasks.all. Product dedup is correct (global
      lastSeqProcessed; post-injection real events have seq<<500 and are skipped). Fix is test-side:
      make the measurement hermetic by stopping server->client WS forwarding once the page is loaded
      (client heartbeat: none; daemon pong timeout 90s — safe), settle BEFORE establishing the
      baseline, track request initiation + in-flight requests instead of responses only, and raise
      the stability window above the 1500ms delayed-invalidation tail. Assert on request count
      (initiated client-side immediately on invalidation) rather than response count so the negative
      check is deterministic in both directions."
    supersedes: null
    author: "@claude"
    created_at: 2026-06-12T16:52:29.118Z
  - _ulid: 01KTYD5CG9PYC88DV1G37EAVGG
    content: "Implemented and verified. Changes (tests/e2e/connection.spec.ts only): (1) replaced the
      response-count settle helper with a trackTasksApi(page) tracker that counts request
      initiation, completion (finished+failed), and responses; settle() now requires no new requests
      AND zero in-flight requests for 2000ms (> the 1500ms delayed file-watcher invalidation tail in
      ws-invalidation.ts), timeout 15s. (2) Dedup test now cuts server->client WS forwarding after
      the task list loads, making the measurement hermetic — real daemon broadcasts cannot schedule
      invalidations during the check; verified safe (client manager has no heartbeat, daemon pong
      timeout is 90s). (3) Baseline is settled BEFORE the first injection so the post-injection
      waitForRequest is attributable to the injected seq=500 event; added explicit afterFirst >
      baseline assertion. (4) Final dedup assertion is on request COUNT INITIATED (synchronous on
      the client when invalidation fires) rather than responses received, deterministic in both
      directions under load. (5) Reconnect test adapted to the shared tracker (request-based waits);
      both timing-sensitive tests get 60s timeouts. Gates: oxlint changed file 0/0, format:check
      pass, typecheck pass, repo lint 0 errors, npm test 10567 passed, full npm run test:e2e 511
      passed/1 skipped (original flake reproduction condition), plus --repeat-each=8 stress on both
      WS tests passed. kspec validate refs/alignment/completeness pass with --warnings-ok. No
      product code changed — dedup behavior confirmed correct (per-connection seq starts near 0, so
      post-injection real events are skipped by the global lastSeqProcessed=500)."
