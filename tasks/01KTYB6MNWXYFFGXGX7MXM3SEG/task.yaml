type: bug
description: During review of @01KTY55GSE54FCQ5FVRW0JNXJF on 2026-06-12, full npm run test:e2e
  failed once in tests/e2e/connection.spec.ts:165, WebSocket Connection Handling > skips duplicate
  events by sequence number. The assertion at tests/e2e/connection.spec.ts:244 expected
  tasksApiResponseCount to stay at 4 after replaying a duplicate sequence event, but observed 6. Two
  focused reruns with npm run test:e2e -- tests/e2e/connection.spec.ts -g "skips duplicate events by
  sequence number" --workers=1 both passed, so treat this as an intermittent/full-suite-load E2E
  flake. Investigate why extra /api/tasks responses can occur after the duplicate-event replay and
  stabilize the test or product behavior based on root cause.
