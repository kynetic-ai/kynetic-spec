title: Enforce canonical field ordering in YAML serialization
type: task
description: >-
  toYaml() in src/parser/yaml.ts uses sortMapEntries: false, relying on JS object insertion order to
  keep _ulid first. This is fragile — any code path that reconstructs objects with different key
  order would silently break the convention.


  This matters because git log -L regex relies on _ulid being the first field of each entry to find
  block boundaries (e.g. /^- _ulid:/ for tasks, /^_ulid:/ for modules).


  Fix: Add a custom sortMapEntries comparator to toYaml() that enforces a canonical key order with
  _ulid always first, followed by slugs, title, type, then remaining keys alphabetically (or in a
  defined priority order).


  Applies to all .kspec/ YAML files: project.tasks.yaml, project.inbox.yaml, modules/*.yaml.
