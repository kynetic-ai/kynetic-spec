    content: "Implemented canonical key ordering in toYaml() via custom sortMapEntries comparator.
      Priority tiers: _ulid(0) > slugs(1) > title(2) > type(3) > description(10) > spec
      relationships(15-19) > status/state(20-23) > relationships(25-32) > work metadata(35-38) >
      vcs/review(40-44) > timestamps(60-70) > notes/todos(80-81) > automation(90). Unknown keys sort
      alphabetically at tier 50. Added 15 tests covering all 4 ACs."
