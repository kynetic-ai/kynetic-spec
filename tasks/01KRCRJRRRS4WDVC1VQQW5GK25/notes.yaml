  - _ulid: 01KRD6ESCKGGGN143BTDVDJ05A
    content: >-
      Approach: Add FAILING-BEFORE-FIX regressions for @daemon-test-teardown-boundedness
      ac-active-requests-do-not-block-teardown and ac-daemon-observations-are-bounded.


      Coverage plan (per task bullets):

      1) In-process mock daemon stop() with hanging request — clear regression: server.close() waits
      for active connections indefinitely. Use it.fails wrapping a stop() Promise.race against a
      small bound (~1.5s) and assert bounded outcome. Cancel the controller after the race so
      afterEach can drain.

      2) Child-process mock daemon stop() with hanging request — graceful SIGTERM handler calls
      server.close() which hangs; parent SIGKILL fallback at CHILD_GRACEFUL_KILL_MS (1500ms) bounds
      the outcome today. Lock as positive contract (plain it, ~3s bound).

      3) Daemon-facing HTTP probe helper — bounded AbortSignal.timeout pattern is the expected
      post-fix shape. Add positive contract test against in-process hang endpoint to lock in bounded
      observation pattern.

      4) Bare-fetch call site exposure — add a focused regression in tests/cli-serve.test.ts using
      the mock daemon hang mode that exercises a bare fetch(url) call shape against /api/health (the
      waitForDaemonHealth call site pattern). it.fails locks the gap and the fix task will replace
      bare fetches with a shared bounded helper.


      Test design notes:

      - Use it.fails for assertions that fail today and will pass after fix.

      - Use Promise.race with explicit timer for in-process and bare-fetch tests to keep the suite
      bounded.

      - For child case (already bounded via SIGKILL escalation), use plain it as a positive contract
      lock.

      - All hang-mode active requests are cancelled via AbortController before afterEach to prevent
      leaked sockets.

      - Annotate every test with AC: @daemon-test-teardown-boundedness
      ac-active-requests-do-not-block-teardown and/or ac-daemon-observations-are-bounded; plus
      @daemon-backed-test-fixture-contract ac-bounded-readiness.
    supersedes: null
    author: "@claude"
    created_at: 2026-05-12T04:17:24.371Z
  - _ulid: 01KRD7ERG45EAWMGEWFMFJ6560
    content: >-
      Implementation complete. 5 regression tests added across two files.


      tests/helpers/mock-daemon.test.ts (new 'active-request teardown contract' describe):

      - it.fails 'in-process stop() reaches a bounded outcome when an active request is hanging' —
      locks the server.close() hang gap. Promise.race against 1500ms timer bounds the suite; cleanup
      AbortController releases the simulated request so server.close() can finalize after
      assertions.

      - it 'child stop() reaches a bounded outcome when the child has an active hang request' —
      positive contract lock; today the parent SIGKILL fallback escalates at CHILD_GRACEFUL_KILL_MS
      (1500ms) so this passes within 3s bound. Locks the contract that the SIGKILL fallback must
      remain in place.

      - it 'AbortSignal.timeout-bounded fetch reaches a bounded outcome against a hang endpoint' —
      positive contract lock for the bounded-observation pattern.

      - it.fails 'bare fetch() against a hang endpoint reaches a bounded outcome within a focused
      test budget' — locks the bare-fetch gap. Uses /api/command POST (mock daemon hangs on this
      path).


      tests/cli-serve.test.ts (new regression next to existing waitForDaemonHealth):

      - it.fails 'bare fetch to /api/health reaches a bounded outcome when the endpoint stalls' —
      stands up a small inline http.createServer hang endpoint so the probe shape mirrors
      waitForDaemonHealth exactly. Hang server cleaned up with closeAllConnections() + close() in
      onTestFinished to prevent socket leakage.


      Results:

      - Target test run (mock-daemon, daemon helper, cli-serve): 71 passed | 3 expected fail (74),
      52.9s

      - Full suite: 9052 passed | 6 expected fail | 5 skipped (9063), 2035s — no regression in
      unrelated tests.


      The three new it.fails cases will flip and require conversion back to plain it(...) when
      @task-fix-active-request-teardown-and-observation-bounds lands (it depends on
      @task-implement-bounded-process-stop-primitives which is currently blocked).
    supersedes: null
