  - _ulid: 01KFSZVKE92JE74QT7EZ0FWAHP
    content: |-
      ## UPDATED INSTRUCTIONS - Supersedes previous notes

      ### Goal
      Implement error handling UI for API failures per @api-contract spec patterns.

      ### Acceptance Criteria to Implement
      - API errors display user-friendly messages
      - Network failures show appropriate state
      - Retry options where applicable
      - Error boundaries prevent full app crash

      ### Implementation Steps
      1. Create ErrorDisplay component for showing API errors
      2. Add error state handling to all API-consuming components
      3. Implement error boundaries at route level
      4. Add retry buttons for transient failures
      5. Show loading/error/success states consistently
      6. Add data-testid attributes for error states

      ### Required data-testid Attributes
      - error-display, error-message, error-retry-button
      - loading-indicator, loading-skeleton

      ### Definition of Done
      - [ ] API errors show user-friendly messages
      - [ ] Retry buttons work for transient failures
      - [ ] Error boundaries prevent crashes
      - [ ] All E2E tests pass - no skips
