    content: >-
      Fixed collapsed tool call header to enforce single-line layout:

      - Added overflow-hidden to the button container to prevent content overflow

      - Added flex-shrink-0 + whitespace-nowrap to chevron, timestamp, tool name badge, and status
      icons — these never shrink

      - Changed preview span from flex-1 to min-w-0 for proper truncation in flex context (truncate
      class already present)

      - Duration badge already had flex-shrink-0 and ml-auto — preserved as-is

      - Added AC annotation comment referencing @ui-session-stream ac-5

      - No E2E test needed — this is a CSS-only fix; ac-5 acceptance criteria is validated by visual
      inspection of the layout behavior
    supersedes: null
