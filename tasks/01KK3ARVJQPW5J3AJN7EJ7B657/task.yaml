title: Fix tool call rows in session stream — enforce single-line layout with truncation
type: task
description: "Collapsed tool call rows in the session stream break to multiple lines when the tool
  name or parameters are long, causing the expand chevron, timing badge, and status indicators to
  shrink or become hidden. Fix: (1) enforce single-line display on collapsed tool call rows with
  overflow-hidden and text-ellipsis, (2) the expand chevron (>), timestamp, tool icon, and
  timing/status indicators must always be visible at fixed sizes — never shrink, (3) only the tool
  name and parameter summary should truncate, (4) use flex-shrink-0 on control elements (chevron,
  timestamp, status icons) and min-w-0 + truncate on the content area."
