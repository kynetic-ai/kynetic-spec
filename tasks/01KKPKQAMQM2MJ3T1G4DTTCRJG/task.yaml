title: Fix agent spawn ENOENT by using absolute paths instead of PATH resolution
type: task
description: >-
  The daemon crashes with ENOENT when spawning agents via bunx/npx because PATH resolution fails in
  detached/nested Bun spawn chains. This was first seen with npx, and a prior fix switched to bunx
  under Bun — but bunx (a symlink managed by mise) suffers the same PATH loss.


  Root cause: When the daemon runs as a detached Bun process (kspec serve start -d), subsequent
  child_process.spawn calls with a custom env object can lose PATH resolution for commands like
  bunx/npx. This is likely a Bun quirk with mise-managed symlinks in detached spawn chains.


  Fix (two parts):

  1. Eliminate PATH dependency entirely — use process.execPath (absolute path to bun binary) with
  'x' subcommand instead of bunx. Under Node, resolve npx to absolute path at module load time. This
  makes spawn immune to any PATH changes or resolution failures.

  2. Add child.on('error') handler in spawner.ts — previously missing, so ENOENT crashed the daemon.
  Now spawn errors propagate cleanly through Promise.race against initialization.
