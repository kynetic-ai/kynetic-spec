  - _ulid: 01KNP0FA96CMA6VPHJ380PDVRR
    content: >-
      What: GET /api/tasks?plan=<ref> only returns tasks in the plan's derived_tasks array. The
      static export filter (api-static.ts) has the inverse bug — only checks task.plan_ref. Neither
      path uses bidirectional matching.


      Why: Follow-on tasks created after plan derivation reference the plan via plan_ref but aren't
      in derived_tasks. Plan progress (via getLinkedPlanSummaryTasks) correctly counts both,
      creating a mismatch between progress bar and filtered task list.


      How:

      1. Verify TaskSummary (or cached index tier) includes plan_ref. Extend if needed.

      2. Update plan filter in packages/daemon/src/routes/tasks.ts (~line 163) to match tasks by
      derived_tasks OR plan_ref, using getLinkedPlanSummaryTasks from src/lib/plan-summary.ts or
      equivalent logic.

      3. Update packages/web-ui/src/lib/api-static.ts (~line 177) to also check derived_tasks, not
      just plan_ref.

      4. Add test coverage in tests/daemon-api/tasks.test.ts for the plan filter: derived-only task,
      plan_ref-only task, plan not found, and interaction with status filters.


      Spec: @api-contract (ac-plan-filter-resolve, ac-plan-filter-derived, ac-plan-filter-ref,
      ac-plan-filter-not-found, ac-plan-filter-additive)
    supersedes: null
    author: "@claude"
    created_at: 2026-04-08T07:38:54.630Z
  - _ulid: 01KNPB8C3SKXYK8JYRC0CYSAZF
    content: >-
      Approach: Bidirectional plan filter fix


      Analysis confirmed: daemon tasks.ts only checks derived_tasks (forward link), api-static.ts
      filterTasks only checks task.plan_ref (reverse link). The plan-summary.ts
      getLinkedPlanSummaryTasks correctly does bidirectional matching — use its pattern as
      reference.


      Plan:

      1. Daemon tasks.ts (~line 163): After resolving plan, also check each task's plan_ref against
      the plan's ULID/slugs (like plan-summary.ts matchesPlanRef). TaskSummary already has plan_ref
      field.

      2. Static api-static.ts filterTasks (~line 176): After matching plan_ref, ALSO look up the
      plan in the snapshot and check its derived_tasks. Reuse findPlanByRef and normalizeRef already
      in that file.

      3. Tests: Add test cases to api-static.test.ts for bidirectional matching:
         - Task with plan_ref but NOT in derived_tasks (currently missed by daemon)
         - Task in derived_tasks but WITHOUT plan_ref (currently missed by static)
         - Task with both (should still match, no duplication)
         - Plan not found → empty array
         - Plan filter additive with other filters

      ACs covered: ac-plan-filter-resolve, ac-plan-filter-derived, ac-plan-filter-ref,
      ac-plan-filter-not-found, ac-plan-filter-additive
    supersedes: null
    author: "@claude"
    created_at: 2026-04-08T10:47:21.465Z
  - _ulid: 01KNPCKE5Z5DT74Q9M8TYBDZMV
    content: >-
      Implementation complete. Changes:


      1. Daemon tasks.ts: Plan filter now checks BOTH derived_tasks (forward) and task.plan_ref
      (reverse). Matches the bidirectional logic in plan-summary.ts getLinkedPlanSummaryTasks.


      2. Static api-static.ts: filterTasks plan filter now looks up the plan by ref and checks
      derived_tasks, in addition to matching plan_ref. Returns empty on plan-not-found.


      3. Test fixtures: Added test-task-planref-only — a task with plan_ref pointing to
      test-plan-active but NOT in derived_tasks. This exercises the reverse-link-only case.


      4. Test coverage (12 new tests):
         - Daemon API (7 tests): resolve by slug, ULID, derived_tasks forward, plan_ref reverse, bidirectional OR, not-found empty, additive with status
         - Static export (5 tests): derived_tasks-only, plan_ref-only, not-found, additive with status, ULID prefix resolution

      ACs covered: ac-plan-filter-resolve, ac-plan-filter-derived, ac-plan-filter-ref,
      ac-plan-filter-not-found, ac-plan-filter-additive


      All 761 related tests pass (203 suites). Full test suite had 7660/7661 passing with 1
      unrelated flaky failure in dispatch-runtime-bootstrap-contract.
