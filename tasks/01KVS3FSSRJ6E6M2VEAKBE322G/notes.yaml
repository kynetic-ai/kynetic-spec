notes:
  - _ulid: 01KVSH1N6BBBWP020W3E42Y8AC
    content: >-
      Approach: reuse ReferenceIndex from src/parser/refs.ts and loaded spec items from initContext
      to derive test-result mapping inside the parser/store boundary before persistence. Add a small
      adapter helper that extracts explicit AC tokens into the same {item_ref, ac_id} shape that
      normalized cases carry.

      Edge cases: malformed refs that fail schema shape, missing item refs, refs resolving to
      non-spec entities, missing AC ids, no refs, mixed valid/invalid refs, and one case mapped to
      multiple ACs without duplicating cases.

      Test plan: add behavioral tests for all six @test-result-ac-mapping ACs using neutral temp
      projects and writeTestRun/loadTestRun, including token-derived refs and a fixture whose
      project names/paths do not match kynetic-spec.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-23T06:00:27.083Z
  - _ulid: 01KVSJ306DXH36EYE1JWQ8PCZ1
    content: >-
      Implemented normalized test-result AC mapping in the parser/store boundary. writeTestRun now
      derives mapping from case refs against the loaded spec corpus via ReferenceIndex, records
      no-ref cases as unmapped, records malformed/missing item/missing AC refs as invalid, and keeps
      only valid refs in attributed mappings. Added adapter-boundary token extraction helper for
      'AC: @item ac-id' tokens.

      Verification: focused mapper suite passed; existing test-result-run-store suite passed;
      format:check passed; changed-file oxlint passed; typecheck passed; repo lint passed with
      existing warning baseline; kspec refs/alignment/completeness validation passed with
      --warnings-ok; full npm test passed (2897 suites, 11005 passed, 3 skipped).
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-23T06:18:39.693Z
