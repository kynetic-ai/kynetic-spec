    content: Implemented test-infrastructure hardening instead of product-code changes. kspec() test
      subprocesses now drop ambient agent-detection env markers and default to an isolated
      HOME/KSPEC_CLAUDE_HOME per cwd so setup status no longer depends on prior test files. Dispatch
      worktree tool-path helpers now resolve the real git binary from a clean system PATH, and
      enhanced-setup has a regression test that simulates leaked parent agent env.
