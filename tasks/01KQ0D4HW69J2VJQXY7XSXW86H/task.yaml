      Intent:
      This is a manual planning task in the Spec Cruft Cleanup Program. It is not implementation work and should not directly edit specs/code except as needed to create, import, and review the downstream plan. The seed record is a non-derivable planning artifact; the output of this task should be a new clean derive-ready plan with slug `cli-schema-spec-rewrite` (or an explicitly chosen replacement slug if scope is split).

      Source records to read first:
      - Program charter: @cruft-cleanup-program-charter
      - Seed plan: @cruft-04-cli-schema-spec-rewrite-seed
      - Audit summary file: /home/chapel/Projects/kynetic-spec/plans/cruft-audit-2026-04-24.md

      Dependency/context:
      This task should be picked up after: @task-convert-cruft-01-spec-catalog-health-plan, @task-convert-cruft-03-trait-normalization-plan.

      Focus of the downstream plan:
      Plan behavioral rewrites for command-help-shaped CLI specs and implementation-heavy schema/parser specs.

      Include in the planning work:
      - Bounded batch selection; do not attempt every CLI/schema spec if too broad.
  - Candidate command specs: @item-add, @task-add, @cmd-validate, @cmd-init, @cmd-setup, @cmd-log.

  - Candidate schema/parser specs: @alignment-index, @trait-index, @zod-schema, @manifest-discovery,
  @batch-write-buffer.

  - Strategy for preserving command option docs/help outside spec text.

      Exclude from this planning task:
      - Backfill/process retirement already handled by earlier plan.
  - API/daemon/web contract split.

  - Broad code refactors unless needed to satisfy rewritten specs.

      Required process:
      1. Re-read the program charter and seed record via `kspec plan get` or `kspec plan export`; do not rely on chat history.
      2. Re-run the relevant discovery/validation commands named in the seed because audit counts may have changed.
      3. Check for overlap with existing plans/tasks before creating duplicate work.
      4. Write a normal kspec plan document with behavioral Specs and standalone Tasks, or split the seed into multiple smaller real plans if the seed is too broad.
      5. Parse/validate the plan document before import.
      6. Import the real plan as draft with a clean slug/title.
      7. Run `kspec agent run plan-reviewer` with the charter/seed/audit as background context only; the real plan itself must stand alone.
      8. Iterate until the real plan is review-ready or clearly blocked by a product/design decision.
      9. Add a note to @cruft-04-cli-schema-spec-rewrite-seed linking to the real plan(s) created and summarizing any split/deferral decisions.

      Done when:
      - A new draft implementation plan exists for a bounded CLI/schema spec rewrite scope, or the seed is split into smaller real plans.
  - The real plan contains behavior-focused specs and standalone tasks.

  - The seed has a note linking to created plan(s).

