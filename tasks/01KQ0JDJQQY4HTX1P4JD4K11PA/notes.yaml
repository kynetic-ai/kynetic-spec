  - _ulid: 01KQ0WME23SW4P1M12M34YKRVW
    content: >-
      Fix cycle 1: addressed blocker — split-project task load errors were silently swallowed.


      Root cause: single try/catch wrapped both resolveTaskDataManager() and loadAllTasks(). When
      loadAllTasks() threw for a split project with unmigrated tasks, the catch fell through to the
      legacy findTaskFiles() path, causing validation to diverge from the canonical data source.


      Fix: separated into two independent try/catch blocks. resolveTaskDataManager() failure →
      legacy fallback (correct for kynetic <1.1). loadAllTasks() failure after successful TDM
      resolution → SchemaValidationError surfaced to user, no fallback.


      Added regression test for the exact scenario (split format + unmigrated task record + no
      per-task directory). All 8372 tests pass, 0 regressions.
    supersedes: null
    author: "@claude"
    created_at: 2026-04-24T23:19:08.612Z
