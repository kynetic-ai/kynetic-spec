  - _ulid: 01KQ113C6R0M07DKAZV3TYXFJT
    content: "Fix cycle 3: addressed blocker — validatePerTaskFiles() was gated behind runSchema, so
      malformed split per-task records were silently omitted when running validate --refs. Root
      cause: loadAllTasks() silently skips parse failures (catch block in split backend), and the
      compensating validatePerTaskFiles() only ran when runSchema was true. Fix: (1) removed
      runSchema guard so validatePerTaskFiles() always runs on canonical path, (2) for malformed
      tasks not loaded by loadAllTasks(), extract partial task records with ref fields so they
      participate in ref validation, (3) ensure slugs defaults to [] to prevent ReferenceIndex
      crash. Added regression test for exact reviewer scenario (validate --refs with malformed split
      task having spec_ref: @missing-spec). All 8374 tests pass, 0 regressions."
    supersedes: null
    author: "@claude"
    created_at: 2026-04-25T00:37:12.537Z
