  - _ulid: 01KQ0QWTP846HE4ZTYYA7GS2DF
    content: >-
      Approach: Replace bespoke task-loading in validate() (lines 2215-2251) with
      TaskDataManager.loadAllTasks().


      Current problem: validate() uses findTaskFiles(ctx.rootDir) which finds *.tasks.yaml files. In
      split storage, those files only contain lean index entries (notes_count instead of notes
      array), so TaskSchema.safeParse() fails and Tasks checked: 0.


      Plan:

      1. Replace the findTaskFiles + inline YAML parsing block with
      resolveTaskDataManager(ctx).loadAllTasks(ctx) plus a new validateTaskRecords() function for
      per-task schema errors

      2. For schema validation of per-task files: iterate listTaskDirs(ctx), read task.yaml raw,
      safeParse with TaskSchema, report errors with task ULID and file path

      3. For task loading (ref validation, orphan detection, completeness): use loadAllTasks()
      result directly, ensuring _sourceFile is populated

      4. For malformed task records (AC ac-task-load-errors-reported): create a new
      loadAllTasksWithErrors() helper or iterate per-task dirs in validate and report parse failures
      as SchemaValidationErrors

      5. Keep stats.tasksChecked accurate by counting successfully loaded tasks plus error'd ones


      Edge cases:

      - Split storage with notes.yaml missing (should still load, notes=[])

      - Malformed task.yaml (should produce schema error, not silently skip)

      - Empty tasks/ directory (should report 0 tasks, no errors)


      Test plan: 3 ACs × 2+ tests each

      - ac-all-persisted-tasks-included: split tasks loaded, multiple tasks counted

      - ac-task-references-checked: task spec_ref/depends_on contribute to ref validation findings

      - ac-task-load-errors-reported: malformed task.yaml produces validation finding
    supersedes: null
    author: "@claude"
    created_at: 2026-04-24T21:56:20.809Z
  - _ulid: 01KQ0TNQ63JKKND1J80WSZ5BMT
    content: >-
      Implementation complete.


      Changes:

      1. src/parser/validate.ts: Replaced bespoke findTaskFiles() + inline YAML parsing with
      TaskDataManager.loadAllTasks() for split storage projects. Added validatePerTaskFiles()
      function that iterates per-task directories (tasks/<ULID>/task.yaml) and reports schema errors
      for malformed records. Legacy kynetic <1.1 projects fall back to the original findTaskFiles
      path.


      2. tests/validate-task-data-source.test.ts: New test file with 9 behavioral tests covering all
      3 ACs:
         - ac-all-persisted-tasks-included (3 tests): split-storage tasks counted, human-readable output, zero-task case
         - ac-task-references-checked (3 tests): dangling spec_ref detected, dangling depends_on detected, valid refs resolve cleanly
         - ac-task-load-errors-reported (3 tests): malformed task.yaml produces schema errors, invalid YAML detected, valid tasks load alongside malformed ones

      3. tests/automation-eligibility.test.ts: Updated 5 tests that manually patched
      project.tasks.yaml (lean index only) to also patch per-task task.yaml, ensuring tests work
      with the canonical read path.


      Key design decisions:

      - Split storage projects use TaskDataManager.loadAllTasks() (canonical path)

      - Legacy projects (kynetic <1.1 without split format) use findTaskFiles fallback

      - validatePerTaskFiles() mirrors split backend assembly logic (task.yaml + notes.yaml, strip
      history) for schema validation

      - Malformed per-task records produce structured SchemaValidationError with file path and ULID
      context
    supersedes: null
