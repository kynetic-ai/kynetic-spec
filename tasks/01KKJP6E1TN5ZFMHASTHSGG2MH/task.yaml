title: Reconcile legacy dispatch workspaces and close upgrade-path spec gaps
type: bug
description: >-
  The dispatch runtime should recover sanely when a project has metadata-backed worktrees or
  partially adopted dispatch state from earlier iterations of the feature. Current failure mode:
  periodic reconciliation can enqueue pending_review work and then discard it as ineligible because
  the reviewer handoff only consults project.dispatch-workspaces.yaml, while some live dispatch
  worktrees still exist only on disk or on legacy/non-canonical branches.


  Scope:

  - audit the current dispatch reconciliation path against existing specs
  (@dispatch-workspace-cleanup-policy, @dispatch-workspace-registry,
  @dispatch-scheduling-priority-model) and add spec updates first if upgrade/legacy recovery or
  reviewer-prune observability is underspecified

  - teach reconciliation/startup to detect metadata-backed dispatch worktrees under the dispatch
  root that are missing from the registry and either reattach them to a canonical workspace record
  or clean/block them deterministically

  - define handling for legacy branch layouts (for example feat/* worker branches created during
  rollout) so they do not silently poison reviewer eligibility

  - improve dispatch discard diagnostics so logs identify which task refs were pruned and why,
  instead of only reporting aggregate counts per agent

  - add regression coverage for upgrade-path/legacy-project scenarios where dispatch state was
  created incrementally during feature rollout


  Outcome: upgrading projects and in-flight rollout states should converge onto the canonical
  registry/workspace model without making task-worker and pr-reviewer behavior look like a single
  collapsed queue.
spec_ref: "@dispatch-workspace-cleanup-policy"
