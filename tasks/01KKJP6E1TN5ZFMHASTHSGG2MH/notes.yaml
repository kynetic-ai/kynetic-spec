  - _ulid: 01KKJT1QVAAAV0471D3CJRH9WQ
    content: >-
      [FIX_CYCLE: 3] Hardened daemon watcher teardown for disappearing project roots.

      - Added a Bun fs.watch error listener so deleted project fixtures no longer crash shard 1 with
      an unhandled ENOENT under .kspec/modules.

      - When the watched .kspec root is gone, the watcher now reports the error once, stops cleanly,
      and skips exponential-retry timers instead of treating teardown like a recoverable watch
      failure.

      - Added regression coverage in tests/daemon-watcher-error-handling.test.ts for the
      deleted-root ENOENT path.

      Verification:

      - Passed: npm test -- tests/daemon-watcher-error-handling.test.ts
      tests/daemon-session-sync-multi-project.test.ts

      - Passed: the rerun of npm run test:shard1 progressed past
      tests/daemon-session-sync-multi-project.test.ts without the prior unhandled ENOENT; remaining
      shard failures were unrelated pre-existing backlog in this workspace.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-13T05:17:31.370Z
