  - _ulid: 01KKJQ4CCMYKDXY8TGN2HZR5SX
    content: >-
      Implemented legacy dispatch workspace recovery and discard diagnostics.

      - Reconciliation now rebuilds missing registry records from metadata-backed worktrees and
      normalizes rollout-era legacy worker branches onto canonical dispatch/task/* branches.

      - Queue pruning now logs task ref, agent, and exclusion reason for each discarded candidate.

      - Added regression coverage for metadata-backed legacy recovery plus task-linked discard
      diagnostics.

      Verification:

      - Passed: npm test -- tests/dispatch-workspace-cleanup.test.ts
      tests/agent-dispatch-engine.test.ts

      - kspec validate reports only pre-existing project warnings (exit 6).

      - Full npm test in this dispatch worktree hit shared .kspec-dispatch-shadow-mutation lock
      contention across unrelated suites; captured as observation @01KKJQ34.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-13T04:26:32.212Z
