  - _ulid: 01KKJRK11KWTGAMXRRDFE70VHY
    content: >-
      [FIX_CYCLE: 1] Addressed reviewer-snapshot recovery when worker registration is stale or
      missing.

      - Metadata-backed reviewer snapshots now reconstruct a stale registry record even when the
      worker worktree registration is gone, so pending_review pruning reports an unhealthy workspace
      instead of a missing one.

      - Added a regression that seeds reviewer-local metadata, removes the worker worktree, and
      verifies reconciliation persists a stale record with reason missing-worker-worktree.

      Verification:

      - Passed: npm test -- tests/agent-dispatch-engine.test.ts

      - kspec validate returned only the repository's existing warning backlog (exit 6).

      - Full npm test still fails on existing dispatch shadow mutation lock contention outside this
      task's scope (first failure in tests/triage-actions.test.ts).
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-13T04:52:00.691Z
