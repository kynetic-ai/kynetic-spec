    content: >-
      Execution context:

      - Background: reconcile legacy dispatch workspace state created during rollout so reviewer
      handoff and reconciliation converge on canonical workspace records.

      - Scope: audit current specs and implementation for orphaned/legacy workspace recovery,
      branch-layout normalization, and discard diagnostics; update spec first if behavior is
