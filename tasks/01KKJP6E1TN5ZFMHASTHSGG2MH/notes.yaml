  - _ulid: 01KKJPD1745HJ5ME7R3K2TSBHA
    content: >-
      Spec audit findings:

      - Existing cleanup AC covered generic orphan reattach/cleanup but not registry reconstruction
      from metadata-backed worktrees or rollout-era legacy branch layouts.

      - Scheduler spec did not require per-task discard diagnostics, only eligibility ordering.

      - Added ACs for metadata-backed reattachment, legacy branch normalization/retirement, and
      task-linked discard reasons before changing runtime behavior.
    supersedes: null
    author: Jacob Chapel
