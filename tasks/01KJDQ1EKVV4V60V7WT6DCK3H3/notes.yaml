  - _ulid: 01KJDQAHM5SX18W9F5V0ET02G6
    content: >-
      ENRICHMENT — Standalone context for this task:


      **What**: When `kspec triage act` executes a "promote" action, it creates a new task from the
      inbox item but leaves the original inbox item in the inbox. This requires a separate manual
      `kspec inbox delete` step to clean up, which is tedious and easy to forget. The inbox item's
      text is already preserved in the triage record's `item_snapshot` field, so the original is not
      needed for audit trail purposes.


      **Where**: 

      - `src/triage/actions.ts` lines 54-74 — the `promote` case in `executeTriageAction()`.
      Currently creates the task and returns, but never calls `deleteInboxItem()` for the promoted
      item.

      - `src/cli/commands/triage.ts` lines 235-289 — the `triage act` command handler. This is where
      the `--consume` flag would be parsed and passed to `executeTriageAction()`.

      - The `delete` and `duplicate` cases (lines 77-90, 117-130) already call `deleteInboxItem()` —
      the promote case can follow the same pattern.


      **How**: Two reasonable approaches:

      1. **Flag approach**: Add `--consume` flag to `kspec triage act` that deletes the inbox item
      after promote. Pass it through `ExecuteTriageActionOptions` to `executeTriageAction()`.

      2. **Default behavior**: Make deletion the default for promote (since the snapshot is
      preserved in the triage record), with a `--keep` flag to opt out.


      Recommendation: Option 2 (delete by default) is cleaner since every promoted item has its text
      preserved in `item_snapshot`. The `--keep` flag is the escape hatch. The `delete` and
      `duplicate` cases already delete inbox items as their default behavior, so promote doing the
      same is consistent.


      Implementation:

      1. Add `consume` option to `ExecuteTriageActionOptions` (default true for promote)

      2. In the `promote` case of `executeTriageAction()`, after creating the task, call
      `deleteInboxItem()` for `record.inbox_ref` unless consume is false

      3. Add `--keep` flag to `kspec triage act` command that sets `consume: false`

      4. Update dry-run output to mention deletion


      **Done when**:

      - `kspec triage act <ref>` on a promote record creates the task AND deletes the inbox item

      - `kspec triage act <ref> --keep` creates the task but preserves the inbox item

      - Dry-run output mentions that the inbox item would be deleted

      - The `item_snapshot` in the triage record still contains the original text for audit trail

      - Tests cover: promote with deletion (default), promote with --keep, dry-run output
    supersedes: null
    author: "@claude"
    created_at: 2026-02-26T19:38:00.197Z
