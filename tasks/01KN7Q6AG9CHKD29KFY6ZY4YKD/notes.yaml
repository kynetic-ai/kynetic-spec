  - _ulid: 01KN7S6WASG6CHE53TQ36CGFMV
    content: "Approach: update @multi-directory-daemon ac-19 via CLI to cover resource-bounded
      monitoring instead of only EMFILE/ENFILE watcher creation failures. Edge cases: detection
      during initialization and later health monitoring; failure must stay scoped to the affected
      project so other registered projects are not degraded. Test impact: no new behavioral tests in
      this task because this is a spec-first change; existing ac-19 annotations document current
      narrower behavior and follow-on implementation tasks in
      @plan-daemon-file-monitoring-reliability will bring runtime behavior and coverage into
      alignment."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-02T19:02:36.121Z
  - _ulid: 01KN7S7XS3XHX5ZAKYXF8DJMFT
    content: "Updated @multi-directory-daemon ac-19 to describe resource-bounded monitoring: it now
      covers excessive resource consumption caused by large directories or OS limits, allows
      detection during initialization or health monitoring, and requires the daemon to contain the
      impact to the affected project with actionable guidance. Verified the persisted AC text with
      'kspec item ac list @multi-directory-daemon'. Ran 'kspec validate'; it returned the
      repository's existing warning baseline only (exit 6, no new validation errors introduced by
      this task)."
    supersedes: null
