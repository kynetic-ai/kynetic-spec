  - _ulid: 01KN7TPHRH2716D9N0KKE7NVSV
    content: "Fix cycle 1 approach: narrow @multi-directory-daemon ac-19 back to the behavior proven
      today. Keep the broader resource-bounding framing (large directories or OS limits) but scope
      detection to monitoring initialization, require actionable error reporting, and require the
      affected project's monitoring/registration attempt to fail without promising later
      health-check detection or cross-project containment that belongs to @daemon-file-monitoring
      and @daemon-watcher-health. Re-verified existing ac-19 annotations in daemon watcher and
      session-sync tests before changing the spec."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-02T19:28:38.161Z
  - _ulid: 01KN7TWHC86ASX9PEM1TEQ0WPQ
    content: "Fix cycle 1: narrowed @multi-directory-daemon ac-19 so it matches the existing annotated
      coverage. The AC still covers resource pressure from large directories or OS limits, but now
      limits detection to monitoring initialization and requires actionable guidance plus refusal to
      start monitoring for the affected project; it no longer promises health-monitor detection or
      broader cross-project containment that belongs to follow-on specs. Replied to and resolved
      both review threads. Re-ran kspec validate and got the unchanged repository warning baseline
      only (exit 6, no new errors). Attempted npm test from this workspace; it launched node
      scripts/test.cjs and npm exec vitest run but hung without producing the expected result JSON,
      matching the existing test-runner hang tracked separately in the repo."
