    content: >-
      Execution context:

      - Background: implement the missing CLI orchestration for stale active session cleanup so
      candidate/metadata helpers are reachable from users.

      - Scope: add `kspec session stale close` command with targeting validation (<session-id> vs
      --refs vs --all), criteria flags, dry-run/apply modes, confirmation behavior, and JSON/human
