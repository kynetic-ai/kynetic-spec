      - Files: src/cli/commands/session/commands.ts, new src/cli/commands/session/stale-close.ts,
      and new CLI tests for stale close behavior/AC coverage.

      - Verification: targeted stale-close tests, full npm test, and kspec validate before submit.
    supersedes: null
    author: Jacob Chapel
