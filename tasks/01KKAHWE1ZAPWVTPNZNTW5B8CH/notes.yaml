notes:
  - _ulid: 01KKAHWRN13YXRYTM9KH4C6HWM
    content: "Design notes from user: Model after bootstrap.cjs — a script that ensures the environment
      is good for running tests and fixes gaps. All agents should run through this instead of raw
      test commands. Key features: (1) Check and build dist/web-ui/ if missing. (2) Verify
      node_modules are installed. (3) Ensure any other prerequisites are met. (4) Extensible hook
      points for future needs (pre-test setup, post-test cleanup). (5) Cleaner/less noisy output
      than raw vitest. (6) Could live at scripts/test.cjs or similar, invoked via npm run test
      wrapper. Convention update needed: agents should use this script instead of npx vitest or npm
      test directly."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-10T00:21:04.289Z
  - _ulid: 01KKAMBXXM0R5A32YD76BTZWHN
    content: >-
      Implementation complete:

      - Created scripts/test.cjs: test runner that checks node_modules + dist/cli/index.js, fixes
      gaps automatically, then runs vitest with pass-through args

      - Added npm run test:runner script for convenient invocation

      - Updated tests/global-setup.ts to respect SKIP_BUILD=1 env var (avoids redundant builds when
      test runner already ensured build)

      - Extensible via preTestHooks/postTestHooks arrays

      - Supports --dry-run to check environment without running tests

      - Supports --shard and vitest filters as pass-through args

      - Added 6 tests covering AC coverage for ac-5 and ac-6

      - All tests pass. 3 pre-existing failures on main (codex platform detection, web-ui bundle)
      confirmed unrelated.
    supersedes: null
    author: "@claude"
    created_at: 2026-03-10T01:04:18.356Z
