      behavioral coverage for routing and exact payloads, all lifecycle error codes,
      malformed/duplicate cleanup data, full task/held rows, prompt/force/non-TTY behavior, offline
      compatibility, and endpoint regressions. Verification: format, repo/focused lint, typecheck,
      full npm test (2823 suites; 10861 passed, 3 skipped), refs/alignment/completeness validation,
