notes:
  - _ulid: 01KRMEKW3KYD2N0EPMH3M5J24X
    content: Investigation started from production incident report. User clarified the OOM reproduces
      with the migrated dispatch project and appeared after a recent daemon/dispatch change; legacy
      task-storage errors in the same logs must be treated as possibly unrelated until
      project-specific evidence says otherwise. Initial daemon-backed task mutation timed out while
      the live daemon was sluggish, so this task was created in direct mode after verifying the slug
      was absent.
    supersedes: null
    author: Hermes
    created_at: 2026-05-14T23:54:40.627Z
  - _ulid: 01KRMES6Y92V6B18C3NKS4BD5N
    content: "Live daemon observation: PID 3032984 was serving both the main project and
      /home/chapel/Projects/kynetic-spec-dispatch with RSS around 307 MB. A project-aware GET
      /api/agent/status for the dispatch project reset the connection, and immediately afterward
      /api/health refused connections and kspec serve status reported running=false for PID 3032984.
      This reproduced a daemon crash/exit while interacting with the dispatch project, but no daemon
      log file has been located yet to confirm whether the exit was the V8 OOM signature or another
      fatal path."
    supersedes: null
    author: Hermes
    created_at: 2026-05-14T23:57:35.561Z
  - _ulid: 01KRMEVSPEERGS8XV1F9B0TGE8
    content: "Coredump verification: systemd-coredump recorded PID 3032984 (`node
      /home/chapel/Projects/kynetic-spec/dist/daemon/index.js --port 3456 --kspec-dir
      /home/chapel/Projects/kynetic-spec/.kspec --host 127.0.0.1`) aborting with Node/V8 OOM
      (`OOMErrorHandler`, `FatalProcessOutOfMemory`, `IneffectiveMarkCompact`). This confirms the
      live daemon exit reproduced the production OOM signature. Next step is a constrained-heap
      repro daemon with logs/monitoring so the retaining path can be isolated without consuming full
      host heap."
    supersedes: null
    author: Hermes
    created_at: 2026-05-14T23:59:00.302Z
  - _ulid: 01KRMEXTKQGHVK987AP24QYZ6G
    content: "Constrained repro achieved. Command: `node --max-old-space-size=512 --trace-gc --expose-gc
      dist/daemon/index.js --port 45678 --kspec-dir /home/chapel/Projects/kynetic-spec/.kspec --host
      127.0.0.1` with logs at /tmp/kspec-dispatch-oom-repro.log. Startup was healthy, then POST
      /api/agent/dispatch with `X-Kspec-Dir` and `X-Kspec-Cwd` set to
      /home/chapel/Projects/kynetic-spec-dispatch caused the daemon to disconnect and exit 134 in
      ~24s with V8 heap OOM. The only application log before the GC death spiral was `[dispatch]
      Target sync enabled for dev, main via origin (interval: 60s)`, so the next investigation
      target is dispatch start/bootstrap target sync, before periodic reconcile has time to matter."
    supersedes: null
    author: Hermes
    created_at: 2026-05-15T00:00:06.775Z
