  - _ulid: 01KRMEVSPEERGS8XV1F9B0TGE8
    content: "Coredump verification: systemd-coredump recorded PID 3032984 (`node
      /home/chapel/Projects/kynetic-spec/dist/daemon/index.js --port 3456 --kspec-dir
      /home/chapel/Projects/kynetic-spec/.kspec --host 127.0.0.1`) aborting with Node/V8 OOM
      (`OOMErrorHandler`, `FatalProcessOutOfMemory`, `IneffectiveMarkCompact`). This confirms the
      live daemon exit reproduced the production OOM signature. Next step is a constrained-heap
      repro daemon with logs/monitoring so the retaining path can be isolated without consuming full
      host heap."
    supersedes: null
