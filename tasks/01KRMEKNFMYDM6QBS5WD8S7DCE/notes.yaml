  - _ulid: 01KRMEXTKQGHVK987AP24QYZ6G
    content: "Constrained repro achieved. Command: `node --max-old-space-size=512 --trace-gc --expose-gc
      dist/daemon/index.js --port 45678 --kspec-dir /home/chapel/Projects/kynetic-spec/.kspec --host
      127.0.0.1` with logs at /tmp/kspec-dispatch-oom-repro.log. Startup was healthy, then POST
      /api/agent/dispatch with `X-Kspec-Dir` and `X-Kspec-Cwd` set to
      /home/chapel/Projects/kynetic-spec-dispatch caused the daemon to disconnect and exit 134 in
      ~24s with V8 heap OOM. The only application log before the GC death spiral was `[dispatch]
      Target sync enabled for dev, main via origin (interval: 60s)`, so the next investigation
      target is dispatch start/bootstrap target sync, before periodic reconcile has time to matter."
    supersedes: null
    author: Hermes
    created_at: 2026-05-15T00:00:06.775Z
  - _ulid: 01KRMGRHHF33ADEF1GC17N189B
    content: "Daemon dispatch OOM segmented probe update: with bootstrap intentionally skipped,
      constrained daemon still OOMs before task load. At dispatch start request, project middleware
      auto-registers the dispatch project and starts watcher/onProjectRegistered asynchronously. By
      the time DispatchEngine.start() begins, daemon baseline is already rss≈680MB heap≈249/527MB.
      _initTargetSync alone raises retained heap to ≈360/459MB; process then OOMs before
      initContext/loadAllTasks. This points to overlapping
      project-registration/entity-cache/session-shadow startup plus dispatch target sync, not just
      bootstrap/reconcile. The start route currently creates/starts a dispatch engine while
      registration-triggered entityCache.loadAll() and watcher work may still be running for the
      same project. Targeted fixes should serialize or defer heavy project registration loads during
      dispatch start, add non-overlap guards to dispatch reconciles, and keep legacy task-storage
      cache failures degraded/log-suppressed."
    supersedes: null
    author: Hermes
    created_at: 2026-05-15T00:32:10.799Z
  - _ulid: 01KRMJSXVMGMXSJGEX6KKPX6GB
    content: "Investigation update: confirmed three bounded hardening points from the dispatch/daemon
      retaining-path trace. (1) src/agent-runtime/dispatch.ts periodic reconcile previously allowed
      setInterval ticks to start another _reconcile while an earlier pass was still pending,
      retaining each pass promise/closure in inFlightReconciles until completion; added a
      non-overlap guard and a fake-timer regression test. (2) src/agent-runtime/workspace.ts cleanup
      preservation diagnostics can repeat for stable protected artifacts on every reconciliation;
      made [dispatch-cleanup] preservation logging opt-in via KSPEC_DISPATCH_CLEANUP_DIAGNOSTICS=1
      while preserving explicit diagnostic tests. (3) src/agent-runtime/invocation.ts spawned
      agent/failure-capture kspec calls now inherit KSPEC_NO_DAEMON=1 so daemon-owned dispatch work
      does not recursively proxy CLI calls back into the same daemon. Route-engine lifecycle maps
      were checked: stop paths delete schedule/hook/join/engine entries; project registration
      remains a plausible startup heap-pressure amplifier because middleware fires watcher +
      onProjectRegistered/loadAll asynchronously while dispatch start can begin target sync for the
      same newly registered project. Verification run passed: KSPEC_NO_DAEMON=1 node
      scripts/test.cjs --fresh tests/agent-dispatch-engine.test.ts
      tests/dispatch-workspace-registry.test.ts tests/dispatch-workspace-cleanup.test.ts
      tests/invocation-daemon-isolation.test.ts (196/196 tests)."
    supersedes: null
    author: Hermes
    created_at: 2026-05-15T01:07:53.332Z
  - _ulid: 01KRMKPHH1SCFAVE051VSA3YD8
    content: "Constrained verification after investigation tweaks: targeted regression slice passes
      under NODE_OPTIONS=--max-old-space-size=512 (196/196 tests). However, the full daemon
      constrained smoke still reproduces the OOM: started `node --max-old-space-size=512 --expose-gc
      dist/daemon/index.js --port 45679 --kspec-dir /home/chapel/Projects/kynetic-spec/.kspec --host
      127.0.0.1`, health was OK, then POST /api/agent/dispatch with
      X-Kspec-Dir/X-Kspec-Cwd=/home/chapel/Projects/kynetic-spec-dispatch and body {action:start}
      returned empty reply and the daemon exited with V8 `Reached heap limit` OOM shortly after
      `[dispatch] Target sync enabled for dev, main via origin`. This means the
      no-overlap/log-gating/direct-mode tweaks are valid hardening but not sufficient for the
      constrained startup OOM; remaining focus should be dispatch target sync plus concurrent
      project auto-registration/entity-cache/shadow/session startup for the dispatch project."
    supersedes: null
