title: Convert task-rebuild-index.test.ts to readTestOutput (10 calls)
type: task
description: >-
  Replace raw fs.readFile/readFileSync calls with readTestOutput/readTestOutputSync in
  tests/task-rebuild-index.test.ts.


  What: 10 file read calls need converting to the readTestOutput helper.

  Why: Standardize test file reads so the no-source-scanning lint rule can distinguish legitimate
  test output verification from the source-scanning anti-pattern.

  How:

  1. Add readTestOutput (and readTestOutputSync if sync reads used) to import from ./helpers/cli

  2. Replace await fs.readFile(path, "utf-8") with await readTestOutput(path)

  3. Replace readFileSync(path, "utf-8") with readTestOutputSync(path)

  4. Only convert reads of test-generated output — leave reads of project source files as-is

  5. Only remove fs/readFileSync import if no other fs functions remain (writeFile, stat, mkdir,
  etc.)

  6. Run npx vitest run tests/<file> to verify tests pass

  7. Run npx oxlint tests/<file> and confirm 0 no-source-scanning hits
