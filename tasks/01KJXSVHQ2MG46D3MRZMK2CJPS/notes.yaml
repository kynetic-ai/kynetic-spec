    content: >-
      Fix cycle 1 addressed:

      - MUST-FIX 1: Sort assertion corrected. Mock data now provided in most-recent-first order (Mar
      5, Mar 4, Mar 3) and assertions verify all three rows match via data-session-id attributes
      instead of using a single resolves.toBe check on first row.

      - MUST-FIX 2: AC-2 navigation test rewritten with three separate Playwright route handlers
