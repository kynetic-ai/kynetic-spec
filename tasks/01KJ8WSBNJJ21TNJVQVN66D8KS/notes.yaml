  - _ulid: 01KJ8WSSCFT27761HWH249M888
    content: >-
      ## Problem


      Codex PR review said 'No PR Task trailer was present, so spec/trait AC coverage checks were
      skipped per instructions' on PR #510. This defeats the purpose of spec-first development —
      reviewers should always validate against specs.


      ## Affected Skills


      ### 1. .claude/skills/codex/SKILL.md (line 128)

      Current: 'If no Task trailer exists, proceed with pure code review (skip AC checks).'

      Fix: Replace with instructions to dig deeper — check commit trailers, search tasks list, check
      AC annotations in changed files, then validate against found specs. Only fall back to pure
      code review if genuinely no spec coverage exists for the change.


      ### 2. .claude/skills/pr-review/SKILL.md

      Current: Requires task ref as a hard validation gate ('Task reference required. Error
      immediately.')

      Fix: Instead of erroring, dig for context the same way — commit trailers, task list search, AC
      annotations. The PR body trailer is a convenience, not a prerequisite.


      ### 3. .claude/skills/local-review/SKILL.md

      Current: AC coverage checks are unconditional (good), but only when spec context is already
      known.

      Fix: Add step to discover spec context if not explicitly provided — same dig-deeper pattern.


      ## Dig-Deeper Pattern (apply to all three)


      When no Task trailer in PR body:

      1. Check commit messages for Task: or Spec: trailers

      2. Search recent tasks: kspec tasks list — match by title/description to PR scope

      3. Check if changed files have // AC: @spec-ref annotations pointing to specs

      4. If a spec is found, validate AC coverage identically to trailer-present case

      5. Only skip AC validation if genuinely no spec exists for the changed behavior


      ## Principle

      Reviewers should be investigators, not form-checkers. The absence of a trailer is a signal to
      look harder, not permission to skip validation.
