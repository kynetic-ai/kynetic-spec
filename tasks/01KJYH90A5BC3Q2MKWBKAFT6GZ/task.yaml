title: Fix dispatch engine re-triggering workers on completed tasks
type: task
description: "The dispatch engine repeatedly spawns stale worker invocations for tasks that have
  already been completed. Root cause: (1) no staleness check at dequeue time - queue entries created
  from intermediate state transitions are never validated against the task's current state before
  spawning, (2) CLI postDispatchEvent self-triggers back into the same dispatch engine that spawned
  the current invocation, creating redundant queue entries for every state transition an agent makes
  during its work. Over 3 fix cycles this produced 4+ wasteful invocations that each spawn a full
  agent process only to discover the task is already completed."
spec_ref: "@agent-dispatch-engine"
