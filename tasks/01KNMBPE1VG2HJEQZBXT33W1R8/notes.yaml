    content: "Approach: mirror the existing cache-aware loader preamble used by
      initContext/loadAllItems/loadInboxItems so loadMetaContext() checks AsyncLocalStorage entity
      cache context, requires meta domain ready, and returns getMetaDetail() before disk parsing.
      Edge cases: no daemon cache context, meta domain not ready, ready domain without detail
      payload. Test plan: add AC-annotated tests proving cached meta is returned on ready-state hit
      and disk path still runs on no-context / not-ready fallback."
