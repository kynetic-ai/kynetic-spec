      duplicate watchers on retry. Added a regression test for that startup failure path.
      Verification: npm run typecheck; npm test -- tests/daemon-context-manager.test.ts
      tests/review-per-cycle-lifecycle.test.ts; npm test (290 files, 6657 tests passed, 3 skipped)."
