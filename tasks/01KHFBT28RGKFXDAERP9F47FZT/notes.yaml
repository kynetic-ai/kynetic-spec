  - _ulid: 01KHFSKJQDYYRAZVMFJ3BN65CH
    content: >-
      Implemented skill drift detection with all 5 acceptance criteria:


      - ac-1: Skills show as in-sync when rendered file matches stored hash

      - ac-2: Skills show as drifted when rendered file has been manually edited (hash mismatch)

      - ac-3: Drifted skills are skipped with warning when rendering without --force

      - ac-4: --force option overwrites drifted files and updates the hash

      - ac-5: Hash of rendered output is stored in .kspec/skills/<id>/.render-hash


      Implementation uses SHA256 hash for change detection. Added 16 new tests covering all ACs plus
      edge cases (legacy renders without hash, mixed drift states, etc).
    supersedes: null
    author: "@claude"
    created_at: 2026-02-15T04:40:40.430Z
