  - _ulid: 01KNEHCX71R8HKV9APP7JRE4S4
    content: "Fix cycle 1 plan: preserve the worker worktree’s unrelated edits, then fix the node
      runtime regression exposed by the E2E fixture. Root cause reproduced: under runtime=node the
      daemon serves web UI module assets without a Content-Type header, so Chromium rejects module
      imports and /tasks stays blank. I’m patching static asset serving for node parity, then
      re-running the node watcher and node UI E2E coverage before replying on the review threads."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-05T10:00:46.050Z
  - _ulid: 01KNEHRJPCNSBCC7RQ91ZH0GVW
    content: "Fix cycle 1: resolved the node-backed E2E UI regression uncovered by
      KSPEC_TEST_RUNTIME=node. Root cause was runtime-specific static asset serving: under node,
      @elysiajs/static served the SvelteKit bundle without usable JS MIME metadata in the isolated
      E2E fixture, so module imports were rejected and /tasks stayed blank. Fix: node runtime now
      serves /_app assets through an explicit content-type-aware handler while bun keeps the
      existing static plugin path. Verification: npm test -- daemon-build --fresh passed; npm run
      build:e2e passed; KSPEC_TEST_RUNTIME=node playwright checks for api-websocket sidebar connect
      and api-watcher file updates both passed; full npm test -- --fresh still reports
      unrelated/pre-existing failures (cli-daemon-proxy ENOTEMPTY cleanup, daemon-executable bun
      compile, meta context/skill-render)."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-05T10:07:08.492Z
