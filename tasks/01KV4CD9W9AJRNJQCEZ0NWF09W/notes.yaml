  - _ulid: 01KV5FY3WVHRQNGDFQTV6KDFJZ
    content: "Fix cycle 1: addressed both review blockers. Inline code-diff (DiffInlineThread) and
      structured-content (ContentInlineThread) review threads were still rendering recorded authors
      as raw strings. Threaded the shared actor classifier from reviews/[id] through both viewer
      chains — CodeDiffViewer → DiffFileView → DiffHunkView → DiffInlineThread, and
      StructuredContentViewer → ContentInlineThread (all 3 mount sites) — and now render thread
      header + entry authors through ActorDisplay. Same actor renders identically across all
      review-surface sites (@actor-display ac-1); static mode degrades to unknown (ac-2). Added
      behavioral SSR test tests/web-ui-inline-thread-actors.test.ts (5 tests: canonical render in
      each component, cross-surface identity match, no-classifier degradation). Re-verified
      ac-1..ac-4 against full implementation. Rebased onto feat/ui-redesign (clean). Gates:
      typecheck/format/lint(0 err)/svelte-check(no new errors, 61 pre-existing
      baseline)/refs/alignment/completeness all pass; full suite 10773 passed / 3 skipped / 0 fail."
