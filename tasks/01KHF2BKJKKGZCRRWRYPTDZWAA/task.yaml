description: "PR #369 added a wrap-up agent that runs on ralph loop exit. Retrospective flagged it
  as over-engineered but the intent is broader than simple cleanup: it ensures all work is
  completed, finds in-progress work where task state doesn't match reality, root-causes whether work
  is still needed, and does best-effort to get the project into a clean state (either continue the
  loop or put work on a branch with a task for the user). Too many possible states to rely on code
  alone — the agent approach is intentional. However: runWrapUpAgent() has zero integration tests
  (all 37 tests only check prompt strings and boolean helpers). Revisit AC coverage, add integration
  tests for the actual agent spawn/timeout/cleanup paths, and verify the prompt adequately covers
  the intended scenarios."
