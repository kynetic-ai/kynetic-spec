title: Harden Codex environment detection for setup and setup-status
type: task
description: >-
  Codex detection is currently brittle and inconsistent across setup paths.


  In this Codex environment, `kspec setup` falls back to unknown because setup detection in
  `src/cli/commands/setup.ts` only checks `CODEX_SANDBOX`, while active sessions can expose other
  stable markers such as `CODEX_THREAD_ID`.


  Separately, `src/parser/setup-status.ts` uses a different detector that does not recognize Codex
  at all, so setup and status/doctor can disagree.


  Scope:

  - Expand setup detection to treat `CODEX_THREAD_ID` as a primary high-confidence Codex signal,
  while keeping `CODEX_SANDBOX` support for backward compatibility.

  - Add additional Codex fallbacks/supporting signals if needed to improve robustness without
  increasing false positives.

  - Align setup-status/doctor detection with the same Codex signal model and confidence semantics.

  - Add tests that cover Codex detection when `CODEX_THREAD_ID` is present and `CODEX_SANDBOX` is
  absent, plus status/setup consistency checks.
