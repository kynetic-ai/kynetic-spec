  - _ulid: 01KJYECDM64377E2D8GGF75QTT
    content: "Fix cycle 2: Resolved MUST-FIX spec alignment warning. The calculateExpectedStatus() in
      alignment.ts only treated in_progress tasks as active work, so needs_work and pending_review
      tasks fell through to not_started — creating a persistent status mismatch. Fixed by expanding
      the active work check to include needs_work and pending_review states. Added 2 new tests
      covering both states. This fix was previously applied in commit 6a2f440f4 but reverted in
      022563ebe as out-of-scope for the design system task. Validation now shows 294/294 aligned, 0
      status mismatches."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-05T07:28:49.798Z
  - _ulid: 01KJYES2RBS2ZWXRB136S5DZRV
    content: "[FIX_CYCLE: 3] Review findings: Review issues: MUST-FIX AC annotation mismatch
      (tests/validate-alignment-no-task-policy.test.ts:128 uses @ui-app-shell ac-1 for non-app-shell
      behavior)."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-05T07:35:44.651Z
  - _ulid: 01KJYES21VETM35Z8AM02MY6VH
    content: "Review findings: MUST-FIX: AC annotation mismatch in
      tests/validate-alignment-no-task-policy.test.ts:128. The annotation '// AC: @ui-app-shell
      ac-1' is attached to an alignment-status test ('treats needs_work task as active work'), which
      does not validate app-shell navigation grouping behavior required by @ui-app-shell ac-1. AC
      annotations must map to the AC text they claim to cover; this creates false traceability in AC
      coverage checks."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-05T07:35:43.931Z
  - _ulid: 01KJYF2P491M1XFPJWRW00WNA9
    content: "Fix cycle 3: Corrected AC annotation mismatch. The test 'treats needs_work task as active
      work' at tests/validate-alignment-no-task-policy.test.ts:128 was annotated with '// AC:
      @ui-app-shell ac-1' (sidebar navigation grouping) but actually tests alignment status-mismatch
      behavior. Changed to '// AC: @alignment-warnings ac-2'. Also added missing annotation for the
      analogous pending_review test. All 63 web-ui tests pass, kspec validate shows no alignment
      warnings for @ui-app-shell."
    supersedes: null
