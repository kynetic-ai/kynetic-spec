    content: "Fix cycle 1: addressed both blockers in tests/cli-serve.test.ts. (1) line 669 body-form
      onTestFinished now returns the killPid(stalePid) promise (with explicit return undefined on
      the predicate-false branch). (2) line 1329 async onTestFinished now awaits killPid(pid) before
      cleanupTempDir(emptyTempDir). Both sites now keep the bounded stop sequence inside the
      teardown lifecycle so vitest cannot report complete until termination is observed. Also
      scanned every other onTestFinished call site that touches
      killPid/waitForChildExit/stopChildProcessBounded/stopPidBounded — the remaining call sites use
      single-expression arrow callbacks that implicitly return the promise, or async callbacks that
      already await, so no other drops exist. Verified: targeted slice (82/82 pass), full suite
      (9086 pass, 5 skipped, 0 fail, 2658s)."
