    content: Implemented all 6 AC endpoints for automation API. Created
      packages/daemon/src/routes/automation.ts with GET /api/hooks (AC-1), GET
      /api/schedules/:id/status (AC-2), POST /api/schedules/:id/trigger (AC-3), GET
