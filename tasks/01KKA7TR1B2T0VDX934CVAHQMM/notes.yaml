  - _ulid: 01KKAE124PQER1J1ZYTPBWW9R8
    content: >-
      Implementation complete. This task's ACs (ac-write-always-syncs, ac-write-skips-read-check)
      were already implemented by the syncMode mechanism from task 1
      (@implement-lazy-shadow-sync-on-reads). The work here was adding AC annotations to code and
      tests, plus 3 new behavioral tests:

      1. initContext skips all sync when syncMode is 'skip' (write commands)

      2. initContext skips sync on both calls within a mutating command lifecycle (consume-once)

      3. Mutating task command (task add) is annotated as mutating (triggers skip syncMode)


      Files changed:

      - src/cli/index.ts: AC annotation on preAction skip logic

      - src/parser/yaml.ts: AC annotation on initContext skip check

      - src/parser/shadow.ts: AC annotations on commitIfShadow and pullRebaseBeforePush

      - tests/shadow-drift-check.test.ts: 3 new tests for ac-write-skips-read-check

      - tests/shadow.test.ts: AC annotation on existing pull-rebase test

      - tests/sync-mode.test.ts: AC annotation on existing skip mode test
