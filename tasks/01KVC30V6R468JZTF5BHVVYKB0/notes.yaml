      creation, spec item create/change/remove, and plan resource add/replace/remove coverage. Added
      shared event vocabulary/reservations and web UI invalidation for plans:updates. Gates passed:
      npm run build, npm run format:check, npm run lint -- --quiet, focused oxlint, npm run
      typecheck, focused tests, npm test, and kspec refs/alignment/completeness validation with
      existing warnings accepted."
