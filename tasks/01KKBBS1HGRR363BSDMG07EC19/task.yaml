type: task
description: >-
  Fix failing test: core-skill-install.test.ts "should auto-detect codex platform when
  CODEX_THREAD_ID is present" (line ~280 in tests/core-skill-install.test.ts).


  Current failure: expects platform "codex" but gets "claude-code".


  Root cause: Agent detection in src/parser/agent-detection.ts checks CLAUDECODE (line 33) before
  CODEX_THREAD_ID (line 105). The test sets CLAUDECODE to empty string, but the parent shell may
  have CLAUDECODE=1 which leaks through env merging in the CLI test helper.


  Fix approach: Either (a) fix env isolation in the test so CLAUDECODE is properly unset (not just
  empty string), or (b) adjust detection priority so CODEX_THREAD_ID is checked before CLAUDECODE.
  Option (a) is safer. Check tests/helpers/cli.ts for how env vars are merged.
