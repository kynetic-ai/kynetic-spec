notes:
  - _ulid: 01KG2Z0HZ08VAMZD76N8BMFBNV
    content: "Issue: Tooltip.Trigger in tasks/+page.svelte uses Svelte 4 'let:builder' pattern which is
      incompatible with Svelte 5. This only affects pending tasks because the Tooltip is
      conditionally rendered only when panel.task.status === 'pending' AND isStaticMode(). Fix:
      Replace let:builder with bits-ui child snippet pattern."
    supersedes: null
    author: "@claude"
    created_at: 2026-01-28T18:49:19.072Z
  - _ulid: 01KG2Z3BN3HBY7DZGDX64YF7HT
    content: Fixed by replacing Svelte 4 'let:builder' pattern with Svelte 5 child snippet pattern in
      tasks/+page.svelte lines 415-426. Also documented this migration pattern in /svelte-5 skill
      under 'bits-ui Component Patterns' section.
    supersedes: null
    author: "@claude"
    created_at: 2026-01-28T18:50:50.916Z
