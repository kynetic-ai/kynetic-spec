  - _ulid: 01KJ6ABC15HHM9PSNPMETWRDFN
    content: "Implemented index-based iteration boundary counting. computeIterationSummaries() now finds
      prompt.sent events with phase: 'task-work' as boundaries, splits events by array index ranges.
      Legacy fallback preserved for sessions without boundaries. Added
      countIterationsBoundaryAware() for getSessionLogSummary() consistency. getSessionLogDetail()
      now derives iteration_count from summaries.length. 8 new test cases covering: boundary
      grouping, wrong data.iteration resilience, legacy fallback, pre-boundary merging, single
      iteration, mixed phases, malformed boundaries, duplicate seq values. All 35 session-log-show
      tests pass."
