notes:
  - _ulid: 01KMM71N9A0FY7R0YDZGNQBJ7N
    content: >-
      Approach: Move --status rejection check after initContext/task loading. Build context-aware
      error message with:

      1. Task's current status

      2. Specific transition command for requested target status

      3. Valid transitions from current state

      4. JSON mode support via error details object


      Files to modify:

      - src/strings/errors.ts: Add statusSetRejection() builder function

      - src/cli/commands/task.ts: Move rejection after task resolution, use smart error

      - tests/task-set-batch.test.ts: Update existing AC-3 test, add new tests for various states


      Edge cases:

      - No ref provided (neither positional nor --refs) — fall back to generic error without current
      state

      - Invalid ref (task not found) — fall back to generic error

      - Batch mode (--refs) — reject before loading since we can't show state for multiple refs

      - JSON mode — structured error with details object
    supersedes: null
    author: "@claude"
    created_at: 2026-03-26T04:39:36.491Z
  - _ulid: 01KMM7C45EHAMG5GYEGHDHVX7F
    content: Moved --status rejection AC from @spec-task-set-batch (batch-specific) to @task-set (base
      command). Also moved @trait-error-guidance trait to @task-set. The status rejection is a base
      task set concern, not batch-specific — the batch spec inherits the behavior.
    supersedes: null
    author: "@claude"
    created_at: 2026-03-26T04:45:19.406Z
  - _ulid: 01KMM7FRY9ER34NDVJQE855ZSP
    content: >-
      Implementation complete. Changes:


      1. src/strings/errors.ts: Added STATUS_TO_COMMAND and VALID_TRANSITIONS_FROM maps, plus
      statusSetRejection() builder that returns structured error with message, guidance text, and
      JSON details object.


      2. src/cli/commands/task.ts: Moved --status rejection after initContext/task loading. When a
      positional ref is provided, resolves the task to get current status for context-aware error.
      Falls back gracefully if resolution fails.


      3. tests/task-set-batch.test.ts: Updated existing AC-3 test and added 3 new tests:
         - Batch mode rejection (--refs with --status)
         - In-progress state transitions display
         - JSON mode structured error details

      AC coverage:

      - @spec-task-set-batch ac-3: Shows current state, specific command, valid transitions

      - @trait-error-guidance ac-1: Error describes what went wrong

      - @trait-error-guidance ac-2: Suggests specific command to resolve

      - @trait-error-guidance ac-4: Shows current state and valid next states

      - @trait-error-guidance ac-6: Structured details in JSON mode


      Full test suite passes (1 pre-existing timeout failure in agent-invocation-lifecycle.test.ts
      unrelated to this change).
    supersedes: null
    author: "@claude"
    created_at: 2026-03-26T04:47:18.985Z
