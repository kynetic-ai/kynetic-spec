  - _ulid: 01KG1TFBY79GA6D074JVRW599M
    content: |-
      Completed CI workflow implementation (Phase 5):

      **File created:**
      - .github/workflows/gh-pages.yml

      **Workflow details:**
      1. Triggers on push to kspec-meta branch (AC-8)
      2. Uses concurrency group with cancel-in-progress for debouncing (AC-10)
      3. Checks out main branch (code) and kspec-meta branch (data to .kspec/)
      4. Builds CLI and runs export with --include-validation
      5. Builds web UI and copies to output directory (AC-9)
      6. Deploys to gh-pages branch using peaceiris/actions-gh-pages@v4

      **ACs covered:**
      - ac-8: Trigger on kspec-meta push, runs export ✓
      - ac-9: Copies SPA assets alongside JSON ✓
      - ac-10: Debounce via concurrency group with cancel-in-progress ✓

      All 18 ACs for @gh-pages-export are now covered across the 4 tasks:
      - Phase 1: ac-1 through ac-7 (export command)
      - Phase 2: ac-11 through ac-13 (static data layer)
      - Phase 3: ac-14 through ac-18 (read-only mode UI)
      - Phase 5: ac-8 through ac-10 (CI workflow)
