title: Prevent dispatch agents from killing host daemon
type: task
description: >-
  Dispatch worker agents can accidentally kill the daemon hosting the dispatch engine by running
  kspec serve stop/restart. This happened in practice during fix cycle 4 of
  @implement-task-board-kanban — the agent tried to debug E2E failures by manually starting a
  daemon, which killed the dispatch daemon and severed the WebSocket connection.


  Fix requires two changes:

  1. Inject KSPEC_DAEMON_PID into spawned agent environment (in invocation.ts alongside
  KSPEC_SESSION_ID)

  2. Guard kspec serve stop/restart/start to refuse when KSPEC_DAEMON_PID is set, with clear error
  message


  Also update agent instructions to add convention: never run kspec serve stop/restart/start when
  running under dispatch.
