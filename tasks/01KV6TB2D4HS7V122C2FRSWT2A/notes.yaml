  - _ulid: 01KV7J84G5A6WXYEMGZ2P7X50N
    content: "Approach: New module src/parser/freshness-resolver.ts alongside coverage-cache.ts. Public
      API: resolveAcFreshness (default) returns recorded-or-bootstrap-or-absent;
      resolveAcFreshnessWithBoth (explicit both-provenances request) returns both labeled, never
      compares them. Bootstrap uses git blame per file (batched -L ranges when multiple annotations
      per file). Most-recent picks by committer-time ISO timestamp. No-history is detected when git
      blame reports the 00000000... SHA (uncommitted or not-yet-committed lines). Reuses
      scanACAnnotations-shaped locations (file+line) and readVerificationStamp from the store
      module. Spec: @ac-freshness-resolution."
    supersedes: null
    author: "@claude"
    created_at: 2026-06-16T06:35:08.165Z
  - _ulid: 01KV7K4V1QQGCR6VYVX80TWNWK
    content: "Implementation complete. New module src/parser/freshness-resolver.ts with three public
      functions: resolveAcFreshness (default precedence: recorded > bootstrap > absent),
      resolveAcFreshnessWithBoth (side-by-side, never compares), resolveAcBootstrap (pure helper).
      Bootstrap uses git blame per-file batched -L calls, parses porcelain for SHA+committer-time;
      uncommitted lines (000... SHA) contribute no value. 13 tests in
      tests/freshness-resolver.test.ts cover all 7 ACs plus helper coverage and the
      bootstrap-newer-than-stamp edge case. Quality gates green: format:check, lint --quiet (0
      errors), typecheck, full test suite (3200 tests pass via shard1), kspec validate --refs
      --warnings-ok."
    supersedes: null
    author: "@claude"
    created_at: 2026-06-16T06:50:48.759Z
