title: "Fix: auto-prefix @ on depends_on reference values"
type: task
description: "Bug: task set --depends-on and task add --depends-on store raw ID without @ prefix,
  breaking dependency resolution. When running 'kspec task set @foo --depends-on 01KH7XA9' (no @),
  the YAML stores 'depends_on: [01KH7XA9]' instead of '- @01KH7XA9'. This makes the task invisible
  to task get/tasks list because the dependency resolver can't find the reference. All working
  depends_on entries in the wild use @-prefixed slugs or ULIDs. Fix: either auto-prefix @ on
  depends-on values, or validate/reject bare IDs with a helpful error. Discovered in imgen project
  session 13."
spec_ref: "@rel-depends-on"
status: completed
blocked_by: []
closed_reason: "Merged in PR #353. Auto-prefixes @ on bare depends_on refs in task add, task set,
  and derive commands. 3 new tests confirm bare slugs and ULIDs are stored with @ prefix."
