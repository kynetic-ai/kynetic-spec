  - _ulid: 01KSYPT4YA8CAZD88D1AQP33CW
    content: "Fix cycle 1: addressed both review blockers. (1) agent run now consults the effective
      runner registry — when agent.runner resolves, its adapter wins over the legacy adapter field,
      satisfying ac-runner-precedence-over-adapter; --adapter CLI override still wins over both; an
      unresolved runner reference fails fast at invocation. (2) agent list now shows the
      runner-resolved adapter identity in both JSON and human-readable output, satisfying
      ac-agent-list-shows-runner. Added 8 behavioral tests covering: list+runner resolved (both
      fields, runner-only, human-readable), list legacy fallback, run --dry-run runner-resolved, run
      --adapter override, run unresolved-runner error, run --adapter unblocks unresolved. Full test
      suite (9984 pass) and all gates green."
