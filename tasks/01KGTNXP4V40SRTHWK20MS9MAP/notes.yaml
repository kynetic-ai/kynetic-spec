    content: "Add note to /spec-plan Trait Considerations section: plan documents need the full trait
      slug (e.g. trait-json-output not json-output). The import auto-prefix only adds @, not
      @trait-. Without this, trait refs resolve to nonexistent items. Caught by Codex review during
      session-log-analysis plan."
