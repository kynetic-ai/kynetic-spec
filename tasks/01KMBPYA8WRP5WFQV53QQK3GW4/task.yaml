title: Remove duplicate session handle registration in invocation runner
type: task
description: >-
  What: Remove the duplicate sessionRegistry.register() call at invocation.ts:633. The same handle
  is registered again at :680 after ACP session creation, which is the correct location (inside the
  try block, after session creation succeeds).


  Why: Artifact of merging two parallel multi-turn implementations (task-multi-turn-invocation and
  task-session-prompt-action). The first registration at :633 was added to ensure the finally
  block's unregister() always runs, but the second registration at :680 already handles this
  correctly. The duplicate is harmless (idempotent Map.set) but misleading — it suggests intentional
  double registration when it's just merge residue.


  How: Remove the sessionRegistry.register() block at :633 and its surrounding comment. Keep the
  registration at :680. Verify the finally block's unregister() still runs correctly in tests. No
  behavioral change expected.
