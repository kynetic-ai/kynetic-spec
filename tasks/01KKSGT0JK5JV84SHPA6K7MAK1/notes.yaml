      Implementation complete. PR #885 created.


      Key implementation decisions:

      - Added resultSeq to ToolCallBlock to fix on-demand output fetch targeting the
      tool_call_update/tool_result event instead of the tool_call start event

      - Used StreamingMarkdown component for live message rendering

      - WS-created blocks use seq=-1; on-demand fetch requires resultSeq >= 0 (set after HTTP
