description: >-
  Convert seed plan @cruft-01-spec-catalog-health-seed into a proper reviewed implementation plan
  for: Convert cruft seed 01 into Spec Catalog Health plan.

      Intent:
      This is a manual planning task in the Spec Cruft Cleanup Program. It is not implementation work and should not directly edit specs/code except as needed to create, import, and review the downstream plan. The seed record is a non-derivable planning artifact; the output of this task should be a new clean derive-ready plan with slug `spec-catalog-health-validation-trust` (or an explicitly chosen replacement slug if scope is split).

      Source records to read first:
      - Program charter: @cruft-cleanup-program-charter
      - Seed plan: @cruft-01-spec-catalog-health-seed
      - Audit summary file: /home/chapel/Projects/kynetic-spec/plans/cruft-audit-2026-04-24.md

      Dependency/context:
      None; this is the first cleanup-planning task.

      Focus of the downstream plan:
      Restore trust in validation and traceability: broken task spec refs, the live Test Trait artifact, invalid AC annotations, and any validation behavior needed to distinguish real coverage claims from examples/skipped tests.

      Include in the planning work:
      - Exact broken refs: @cmd-derive, @session-remove-shadow-commits, @session-branch-worktree.
  - Current validation output and changed counts.

  - Classification strategy for invalid AC annotations.

  - Clear separation between direct maintenance tasks and behavior-changing validation specs.

      Exclude from this planning task:
      - Backfill/process spec retirement beyond what is required for validation trust.
  - Broad trait normalization.

  - API/daemon/web contract rewrite.

  - Code-quality refactors not directly needed for validation trust.

      Required process:
      1. Re-read the program charter and seed record via `kspec plan get` or `kspec plan export`; do not rely on chat history.
      2. Re-run the relevant discovery/validation commands named in the seed because audit counts may have changed.
      3. Check for overlap with existing plans/tasks before creating duplicate work.
      4. Write a normal kspec plan document with behavioral Specs and standalone Tasks, or split the seed into multiple smaller real plans if the seed is too broad.
      5. Parse/validate the plan document before import.
      6. Import the real plan as draft with a clean slug/title.
      7. Run `kspec agent run plan-reviewer` with the charter/seed/audit as background context only; the real plan itself must stand alone.
      8. Iterate until the real plan is review-ready or clearly blocked by a product/design decision.
      9. Add a note to @cruft-01-spec-catalog-health-seed linking to the real plan(s) created and summarizing any split/deferral decisions.

      Done when:
      - A new draft implementation plan exists for Spec Catalog Health / Validation Trust, or the seed is intentionally split into smaller draft plans.
  - The new real plan has been reviewed or is ready for plan-reviewer with a self-contained prompt.

  - The seed plan has a note pointing to the real plan(s) and summarizing conversion decisions.

      Automation:
      Manual-only. This task involves planning judgment, scope control, and review-loop decisions. Do not mark automation eligible without explicit human direction.
