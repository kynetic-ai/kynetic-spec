title: Handle ACP permission requests in invocation — auto-approve tool calls in dispatch mode
type: task
description: >-
  Root cause of agent hanging on Edit/Write/Bash calls: invocation.ts only registers a
  client.on('update') handler but never registers a client.on('request') handler. When
  claude-agent-acp sends a request_permission (or similar JSON-RPC request) asking the client to
  approve a tool call, the kspec ACP client has no handler — the request sits unanswered, the agent
  waits forever, and after 5 minutes the session/prompt times out.


  The --dangerously-skip-permissions flag is irrelevant here — that is a Claude Code CLI flag. This
  adapter (claude-agent-acp) uses the Claude Agent SDK which has its own ACP-level permission
  protocol.


  Fix: In src/agent-runtime/invocation.ts, register a 'request' handler on the ACP client alongside
  the existing 'update' handler. Auto-approve all permission requests in dispatch mode
  (auto_approve=true). In non-auto-approve mode, either deny or surface the request to the caller
  via onUpdate.


  The ACPClient already has respondPermission(), respondReadTextFile(), respondWriteFile() methods —
  they just need to be wired up.


  Relevant files:

  - src/agent-runtime/invocation.ts — add client.on('request', handler) around line 309

  - src/acp/client.ts — respondPermission(), respond(), request event emission (line 99-100)

  - src/acp/types.ts — RequestPermissionRequest, RequestPermissionResponse types


  Verify fix: kspec agent run worker --task @some-eligible-task should now complete Edit operations
  without hanging.


  Spec AC: @agent-invocation-lifecycle ac-11
