notes:
  - _ulid: 01KNECBYJ1VQ8EGR0NWC0MEESM
    content: "Approach: reuse existing daemon.runtime config loading in serve and initContext in
      auto-start, but centralize runtime command/env selection so configured runtime wins over
      parent CLI runtime. Edge cases: node configured while CLI runs under bun, missing runtime
      binary on PATH, default bun behavior, auto-start remaining non-fatal on spawn errors. Test
      plan: behavioral CLI coverage for configured node/default bun/missing runtime cases, plus an
      auto-start regression test that proves runtime config is honored."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-05T08:32:51.777Z
  - _ulid: 01KNEDBVA4JYN2YN5MNM8M9YH4
    content: "Implemented runtime-aware daemon spawning. Serve now checks the configured runtime binary,
      spawns literal 'bun' or 'node', and reports runtime-specific install guidance when the
      configured runtime is missing. Auto-start now uses the configured runtime and shared child-env
      handling instead of inheriting process.execPath. Verification: npm test --
      tests/cli-serve.test.ts tests/cli-no-daemon.test.ts tests/parser/daemon-config.test.ts; npm
      test; kspec validate --warnings-ok."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-05T08:50:17.028Z
