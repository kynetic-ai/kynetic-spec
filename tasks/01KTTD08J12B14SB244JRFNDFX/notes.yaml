notes:
  - _ulid: 01KTW8550T48ZXWB03HPKN4CE4
    content: "Approach: add connect-host warning in startServer (uses configured daemon.connect_host)
      and statusServer (uses metadata connect_host) in src/cli/commands/serve.ts, gated on
      isExternallyReachable() — mirrors existing bind-host warning blocks. Key constraint
      discovered: resolveDaemonConnectHost() rejects a connect_host that differs from a non-wildcard
      bind, so a non-loopback connect_host in practice requires a wildcard bind. Test strategy: use
      connect_host: localhost with host: 0.0.0.0 — 'localhost' is deliberately NOT recognized as
      loopback by isLoopbackHost (no OS resolver dependency), yet resolves locally, so the daemon
      stays reachable for health checks and stop. Tests: start warning, status warning, and negative
      (loopback connect_host produces no connect warning) beside existing
      ac-external-binding-warning tests in tests/cli-serve.test.ts."
    supersedes: null
    author: "@claude"
    created_at: 2026-06-11T21:07:05.882Z
  - _ulid: 01KTW99XFWTQT6DV4XBEAK7TZM
    content: "Implemented connect-host warning in startServer (configured daemon.connect_host) and
      statusServer (metadata connect_host) in src/cli/commands/serve.ts, gated on
      isExternallyReachable(), mirroring the bind-host warning blocks. Three CLI-level tests added
      beside the existing ac-external-binding-warning tests in tests/cli-serve.test.ts: warning on
      detached start, warning on serve status, and negative case (loopback connect_host produces no
      connect warning on start or status). Tests use connect_host: localhost with a wildcard bind
      because isLoopbackHost recognizes only numeric loopback (no OS-resolver dependency), so a DNS
      name triggers the warning while staying locally reachable for health checks and stop. All
      gates green: format, lint (0 errors, 0 new warnings in changed files), typecheck, full suite
      (10534 passed / 0 failed), kspec refs/alignment/completeness validation. Commit b56d32163b."
    supersedes: null
    author: "@claude"
    created_at: 2026-06-11T21:27:10.588Z
