title: Add server-side title resolution to API responses
type: task
description: >-
  Add resolved title fields alongside existing ref fields on daemon API responses. The daemon
  already loads task/item data via ReferenceIndex on most routes.


  Endpoints to update:

  - GET /api/agent/status → active_invocations need task_title

  - GET /api/sessions → session summaries need task_title

  - GET /api/sessions/:id → session detail needs task_title

  - GET /api/tasks → task summaries need spec_title alongside spec_ref

  - GET /api/tasks/:ref → task detail needs spec_title, resolved depends_on and blocked_by entries
  with titles and status

  - Triage records → evidence_refs need resolved titles


  Add response types to @kynetic-ai/shared package for type safety. Frontend: consume the new fields
  instead of building per-page taskTitles lookup maps. Remove the fetchTasks({limit: 1000}) calls
  from agents page, sessions list, and session detail page.


  Acceptance gates (from @ui-api-ref-resolution): Single-valued refs include resolved title (ac-1),
  array refs include resolved title and status per entry (ac-2), invalid/deleted refs return null
  title, preserve raw ref (ac-3).
