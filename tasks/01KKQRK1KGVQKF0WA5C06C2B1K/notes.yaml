      lightweight ref index endpoint (ac-4/ac-5), (5) Write tests for all 5 ACs plus trait ACs

      - Files: packages/shared/src/api.ts, packages/daemon/src/routes/tasks.ts, sessions.ts,
      agent-dispatch.ts, triage.ts, new resolution utility, tests

      - Verification: npm test, all AC annotations present
