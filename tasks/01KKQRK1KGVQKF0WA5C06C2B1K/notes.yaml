      - Background: This task adds server-side title resolution to daemon API responses so the web
      UI doesn't need per-page taskTitles lookup maps or fetchTasks({limit: 1000}) calls.

      - Scope: (1) Create ref resolution utility, (2) Add resolved title fields to shared types in
