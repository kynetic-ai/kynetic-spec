  - _ulid: 01KKQTJG7CGMX45SYMK3M4MSSM
    content: >-
      Submitted PR #866. Implementation adds server-side title resolution to all specified daemon
      API endpoints:

      - GET /api/tasks: spec_title on summaries

      - GET /api/tasks/:ref: spec_title, plan_title, resolved_depends_on, resolved_blocked_by

      - GET /api/agent/status: task_title on active invocations

      - GET /api/sessions: task_title on session summaries

      - GET /api/sessions/:id: task_title on session detail

      - GET /api/triage: resolved_evidence_refs with titles

      - GET /api/refs: new lightweight index endpoint (ac-4, ac-5)


      Added ref-resolution utility, shared types (ResolvedRefEntry, RefIndexEntry,
      RefIndexResponse), and 19 tests covering all 5 spec ACs. Full test suite: 4972 passed, 0
      failures.
