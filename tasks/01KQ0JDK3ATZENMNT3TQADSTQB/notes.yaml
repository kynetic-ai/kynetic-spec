notes:
  - _ulid: 01KQ0X033YYAXHHJM6FVGM7D84
    content: >-
      Approach: The core validateACAnnotations function already handles all 5 AC cases correctly.
      The tightening work is:


      1. Add distinct subtypes to invalid_ac_annotation warnings so each category
      (unresolved_target, non_spec_target, missing_ac_id, blanket_ref) is machine-distinguishable.
      Currently all 4 categories share the same type with no subtype.


      2. Update CLI output formatting to group invalid annotations by subtype instead of lumping all
      255+ together, making the findings more actionable for repair.


      3. Add focused AC-annotated tests for each of the 5 spec ACs, asserting on the new subtypes
      and verifying the full pipeline including coverage computation.


      Edge cases: blanket refs on items WITHOUT ACs should NOT warn (current code already handles
      this). Valid annotations on nonexistent specs shouldn't provide false coverage (already
      correct since coverage matching is from the item side).


      Reusing: existing ReferenceIndex, existing setupProject test helper, existing
      CompletenessWarning type (extending subtype union).
    supersedes: null
    author: "@claude"
    created_at: 2026-04-24T23:25:30.622Z
  - _ulid: 01KQ0XSXK5J4R1GTTYTM4GVWEN
    content: >-
      Implementation complete. Changes:


      1. Added InvalidAnnotationSubtype union type (unresolved_target, non_spec_target,
      missing_ac_id, blanket_ref) to CompletenessWarning.subtype in src/parser/validate.ts

      2. Each validateACAnnotations warning now carries the appropriate subtype for
      machine-distinguishable categorization

      3. Message prefixes tightened: 'Unresolved target:', 'Invalid coverage target:', 'Blanket
      ref:', 'Missing AC:' — makes scanning output easier

      4. CLI output (formatCompletenessWarnings) groups by subtype with per-category counts and
      truncation

      5. Tests updated with subtype assertions and AC annotations for all 5 spec ACs


      AC coverage:

      - ac-unresolved-target-reported: 2 integration tests + 1 unit test

      - ac-non-spec-target-reported: 2 integration tests + 2 unit tests  

      - ac-missing-ac-id-reported: 2 integration tests + 1 unit test

      - ac-blanket-ref-does-not-cover: 1 integration test (verifies warning + coverage withheld)

      - ac-valid-annotation-covers-target: 1 integration test (verifies no invalid warning +
      coverage credited)


      Full suite: 2269 suites, 8362 tests pass, 0 failures.
    supersedes: null
    author: "@claude"
