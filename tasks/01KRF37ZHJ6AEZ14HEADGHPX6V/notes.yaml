  - _ulid: 01KRFRSJBGE7H60C6RJZXDSCD5
    content: >-
      Approach: Add behavioral cleanup tests in tests/dispatch-workspace-cleanup.test.ts (and
      tests/dispatch-workspace-registry.test.ts for the partial-provisioning classification case).


      Plan:

      1. Protected-case tests (per AC ac-active-inflight-provisioning-artifact-preserved,
      ac-protection-applies-to-every-destructive-surface):
         - active task refs preserve worktree + dispatch branch + reviewer snapshot (already covered, supplement);
         - in-flight refs supplied as options.activeTaskRefs (queue-to-spawn race) — covered;
         - registry record with lifecycle_state='provisioning' preserves all surfaces; same for stale/integrating/cleanup_blocked;
         - 'closing' record with active ref preserved from reaping (already covered as 'reap-candidate'); add closing+unresolved integration variant;
         - reviewer snapshot path preserved when its canonical record is non-closed registry record;
         - dispatch branches associated with non-closed registry records preserved during orphan-branch sweep;
         - root-directory candidate inside protected worker path preserved.

      2. Cleanup-positive (truly orphan): closed records reach reap to closed; truly orphan
      reviewer-snapshot dir removed; root-dir candidate outside any protected path removed; orphan
      dispatch branch (no record, no active ref) removed.


      3. Ambiguous-state: registry parse failure preserves dispatcher-managed artifacts under
      worktree root (already covered, add direct helper-level test for branches+paths); load failure
      protects branches via short-id mapping.


      4. Behavioral guardrail per surface: through reconcileDispatchWorkspaceArtifacts, exercise
      each of metadata-less-worktree / reap-candidate / reviewer-snapshot / root-directory /
      dispatch-branch with both protected and cleanup-eligible outcomes.


      5. Regression test: create bootstrap-like nested files (node_modules/<pkg>/bin/script,
      package.json) under a worker workspace, run
      reconcileDispatchWorkspaceArtifacts({activeTaskRefs:[taskRef]}) WITHOUT the metadata file and
      WITHOUT a registry record, assert the nested files and parent workspace dir survive. Mirrors
      @plan-dispatch-workspace-in-flight-cleanup-protection bootstrap race.


      Will assert via filesystem state + git branch presence + diagnostic stream. Tests must be
      behavioral (no source-scanning).
    supersedes: null
    author: "@claude"
    created_at: 2026-05-13T04:16:20.849Z
  - _ulid: 01KRFSXTGMS3W4EAZ7EJA9JGWD
    content: >-
      Implemented coverage. Targeted tests: tests/dispatch-workspace-cleanup.test.ts (29/29 passing)
      and tests/dispatch-workspace-registry.test.ts (29/29 passing). Full suite: 9128/9133 (5
      pre-existing skips). Typecheck clean.


      Test additions (700 lines total):

      - tests/dispatch-workspace-cleanup.test.ts (620 lines): new 'dispatch artifact cleanup
      protection (positive and regression cases)' describe block with 16 tests covering each AC
      bullet from the task plan.

      - tests/dispatch-workspace-registry.test.ts (80 lines): 2 partial-provisioning classification
      tests covering @dispatch-workspace-registry ac-partial-provisioning-classified-before-cleanup
      (preserved-provisioning + closing-reap-eligible).


      Coverage map:

      1. Protected cases — provisioning, stale/integrating/cleanup_blocked (parameterized),
      closing+unresolved-integration, non-closed orphan-branch-sweep preservation, reviewer-snapshot
      short-id basename match, root-dir-overlap with worker path.

      2. Cleanup-positive — truly orphan dispatch branch, truly orphan reviewer-snapshot, truly
      orphan root dir, closing+resolved-integration reaped to closed.

      3. Ambiguous-state — load-failed registry preserves canonical branch via no-blind-deletion
      with surface-labeled diagnostic; helper-level evaluateDispatchBranch/evaluateWorkspacePath
      assertions.

      4. Per-surface guardrail — single-pass diagnostic emission across metadata-less-worktree,
      reviewer-snapshot, root-directory, dispatch-branch.

      5. Regression — bootstrap-like nested files (package.json +
      node_modules/some-dep/{package.json,bin/tool.js}) under worker workspace;
      reconcileDispatchWorkspaceArtifacts({activeTaskRefs:[taskRef]}) preserves parent + every
      nested file + canonical branch.


      Adjusted two initial draft tests after first run:

      - Closing+unresolved-integration: corrected assertion — reap-candidate diagnostic IS expected
      (it labels why reap is skipped), changed to verify diagnostic presence + reason text.

      - Reviewer-snapshot path overlap: redesigned to exercise the active short-id basename match
      (the only path where the reviewer-snapshot surface consults the protection helper when the
      registry has no record), since recoverWorkspaceRecordFromMetadata routes worker entries
      through the registry-derived reviewerWorktreeDir and so my original 'edit metadata only' setup
      never exercised the reviewer-snapshot decision.
