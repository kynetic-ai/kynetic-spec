    content: >-
      Execution context:

      - Background: Queue pruning for pending_review and needs_work currently discards entries
      without healthy workspaces. Need to add discovery/recovery before discard.

      - Scope: Add workspace discovery layer in queue eligibility evaluation that tries registry
      state, metadata-backed worktrees, submission linkage, and remote/review locators before
      discarding. Emit diagnostics on failure. Implement precedence ordering.

      - Files: Dispatch engine queue evaluation, workspace registry, workspace health/recovery

      - Verification: Tests covering all 4 ACs plus trait ACs
    supersedes: null
