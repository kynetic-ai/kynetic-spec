title: Fix web UI pages not rendering on initial load
type: task
description: "Dashboard, agents, and automation pages don't show content on initial load but work
  after navigating away and back. Root cause: isStaticMode() in query enabled conditions creates an
  extra reactive dependency on the mode state that interferes with TanStack Query v6 effect-based
  subscription in Svelte 5. Fix: move static mode guards from query enabled into the API fetch
  functions (matching the pattern fetchTasks/fetchInbox/fetchPlans already use), so all queries use
  only enabled: isProjectInitialized()."
