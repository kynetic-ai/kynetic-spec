  - _ulid: 01KJ6VB9MD2MQBFJYNFFRYA7GS
    content: "Root cause: non-atomic read-modify-write in saveTask and other YAML mutation functions.
      When concurrent kspec processes write to the same file (common in ralph loop), second write
      can overwrite first. Fix: extracted advisory file lock (mkdir-based, with PID + timestamp
      stale detection) into src/parser/file-lock.ts. Applied to: saveTask, deleteTask,
      saveInboxItem, deleteInboxItem, saveTriageRecord, addChildItem, updateSpecItem,
      deleteSpecItem, savePlan, deletePlan. Consolidated duplicate lock in plans.ts. 7 unit tests
      for lock mechanism including concurrent write safety."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-24T03:33:38.061Z
