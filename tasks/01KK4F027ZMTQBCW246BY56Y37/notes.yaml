      - Fix: Updated dropdown to All/Eligible/Needs Review/Manual Only, added automation filtering
      to daemon route, fixed duplicate automation property in response

      - Files: packages/web-ui/src/lib/components/TaskFilters.svelte,
      packages/daemon/src/routes/tasks.ts
