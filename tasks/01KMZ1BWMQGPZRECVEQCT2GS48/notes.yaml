      spec/task refs and renders embedded cards, plus one test that returns unresolved refs and
      verifies the UI falls back to raw embedded YAML instead of crashing. Verified with npm run
      build:e2e && npx playwright test tests/e2e/plans.spec.ts (35 passed). kspec validate still
      exits 6 from pre-existing project warnings unrelated to this task.
