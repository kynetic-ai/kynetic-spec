  present (migrated to .claude/skills/kspec/help/). Project-specific skills in .claude/skills/ root
  are untouched — only origin:core skills get the kspec/ prefix. Test: kspec setup should create
  .claude/skills/kspec/help/SKILL.md, kspec skill install-core should install under kspec/ subdir."
