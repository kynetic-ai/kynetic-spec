title: Normalize reference displays across web UI — show titles and consistent linking
type: task
description: "References to tasks, specs, plans, and sessions are displayed inconsistently across
  the web UI. Some views show raw ULID prefixes, some show slugs, some show titles. Create a shared
  ReferenceLink component that: (1) accepts a ref type (task/spec/plan/session) and ID, (2) resolves
  and displays the title when available with the slug/ULID as secondary, (3) links to the
  appropriate detail view, (4) handles @ prefix normalization. Use this component in
  SessionContextPanel task_ref, session history task_ref, task card spec_ref, dashboard active work,
  and any other cross-reference display."
