  - _ulid: 01KK36ASVAQRYM3X8TD00CGJB1
    content: 'Review findings: MUST-FIX 1) Invalid nested anchors in session list row.
      packages/web-ui/src/routes/sessions/+page.svelte wraps each row in <a href="/sessions/{id}">
      (line 153), and now renders <ReferenceLink> for task_ref inside that row (line 169), which
      itself renders an <a>. Nested <a> is invalid HTML and causes conflicting/fragile click
      behavior and accessibility issues. Fix by rendering task_ref as non-link text in this context
      (linked={false}) or refactoring row container to avoid anchor nesting.'
    supersedes: null
    author: Jacob Chapel
