  - _ulid: 01KK32TD00PA9R0BMMKVSKQYQK
    content: "Review findings: MUST-FIX 1) @ui-reference-display ac-1 requires secondary text to be slug
      OR short ULID. Current implementation truncates all refs to 8 chars via shortRef()
      (packages/web-ui/src/lib/utils/reference.ts:25-27), and ReferenceLink always renders that
      truncated value when title is present
      (packages/web-ui/src/lib/components/ReferenceLink.svelte:58,72). This causes slug refs to
      display as shortened fragments (e.g., task-slu) instead of full slug. Tests currently encode
      this incorrect behavior (packages/web-ui/tests/reference.test.ts:35-46). Required fix: only
      shorten ULIDs; keep full slug in secondary text."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-07T02:42:57.152Z
  - _ulid: 01KK32TKJV54M2NHC5GPAJF6SK
    content: "[FIX_CYCLE: 2] Review findings: Review issues: @ui-reference-display ac-1 still violated
      because slug refs are truncated to 8 chars in title-present state (ReferenceLink uses shortRef
      for all refs). Must display full slug or short ULID."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-07T02:43:03.900Z
  - _ulid: 01KK34EED82HC8EVBBNXKYVN5A
    content: "Fix cycle 2: Root cause was shortRef() always truncating to 8 chars via slice(0,8), which
      destroyed slug readability. Added isUlid() helper with Crockford base32 regex to detect ULIDs.
      shortRef() now returns full normalized ref for slugs, only truncates ULIDs to 8 chars. Updated
      tests: replaced incorrect truncation assertion for slugs, added 4 isUlid tests. All 3916 tests
      pass (2 pre-existing codex failures unrelated)."
