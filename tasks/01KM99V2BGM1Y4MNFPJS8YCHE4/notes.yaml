  - _ulid: 01KM9AKVSMVV5Q5HM28607M3MM
    content: "Implemented fallback in SplitBackend.getTask() for missing per-task directories. When
      loadTaskFromDir() returns undefined for a ULID that exists in the index, the backend now reads
      the index entry, constructs a partial LoadedTask via TaskSchema.safeParse() (with empty
      notes/todos via schema defaults), and emits a stderr warning. Covers all lookup paths: full
      ULID, short ULID prefix, and slug-based refs. Added 10 new tests: 3 for AC-1 (normal detail
      loading via full ULID, slug, and short prefix) and 7 for AC-2 (fallback for full ULID, slug,
      short prefix, warning emission, no-throw guarantee, empty detail fields, and still-throws for
      truly non-existent tasks). All 72 split-backend tests pass. 2 pre-existing timeout failures in
      agent-invocation-lifecycle.test.ts are unrelated."
