    content: "Fix cycle 2: CI failure was ENOTEMPTY race in AC-20 reconciliation test
      (agent-dispatch-engine.test.ts). Root cause: DispatchEngine.stop() cleared the reconcile
      interval timer but did not await the in-flight _reconcile() promise, so temp-dir cleanup could
      race with async reconciliation work. Fixed by tracking inflightReconcile promise and awaiting
      it in stop(). All 96 dispatch engine tests and 95 skill CLI tests pass."
    supersedes: null
