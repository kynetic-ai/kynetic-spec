  - _ulid: 01KKKS93B6JZSNKF31BDHTQBWS
    content: >-
      Implemented droid skill import support. Changes:


      1. Added detectImportPlatform() function to skill-crud.ts that detects .factory/skills/ paths
      and returns 'droid' platform, defaulting to 'claude_code' for all other paths.


      2. Modified the import command's platform_config building to use the detected platform key
      instead of hardcoding 'claude_code'. For droid imports, the 'agent' field is excluded (droid
      doesn't use it, matching the renderer behavior).


      3. Added 6 tests: 3 unit tests for detectImportPlatform, 3 integration tests covering all 3
      ACs (droid import populates platform_config.droid, user_invocable=false works, existing
      claude_code behavior unchanged).


      All existing import tests continue to pass unchanged.
