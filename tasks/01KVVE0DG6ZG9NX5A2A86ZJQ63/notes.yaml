  - _ulid: 01KVX6AGCYC99NKEXXH6KN87KP
    content: "Fix cycle 2: addressed all review threads from @01KVX41B. Fixed run-only spec-text
      freshness by using ingested run completed_at timestamps for criterion history instead of
      treating producer code_revision as a shadow spec commit. Fixed source revision comparison by
      classifying diverged/unrelated histories as unknown_freshness rather than current. Added
      behavioral regressions for separate shadow/project git history and diverged source branches.
      Re-verified all six @coverage-freshness-revision-comparison ACs. Gates passed: format:check,
      focused oxlint, repo lint --quiet, typecheck, focused coverage freshness test, full npm test
      (2907 suites, 11042 passed, 3 skipped), and kspec refs/alignment/completeness validation with
      warnings-ok."
