notes:
  - _ulid: 01KR3XRFQAVFXD6D3FWA5HP1PN
    content: >-
      Added regression tests for detached cleanup timing in
      tests/lint-daemon-test-guardrails.test.ts under a new 'daemon test guardrail precision:
      detached cleanup timing' describe block.


      Test plan (3 unsafe + 2 allowed-narrow + 4 suppression = 9 cases):

      - UNSAFE (failing-before-fix per task spec):
        1. afterEach closes over let pid; runKspec serve --detach; expect; pid = readPidFromFile.
        2. afterEach closes over let pid; runKspec serve --detach; await waitForReady; pid = readPidFromFile.
        3. afterEach closes over let child; spawn(kspec,[serve,start,--detach]); await waitForReady; child = readChildFromPidFile.
      - ALLOWED narrow (continue to pass):
        4. runKspec serve --detach; const pid = readPidFromFile; onTestFinished(process.kill); expect.
        5. const child = spawn(kspec,[serve,start,--detach]); onTestFinished(child.kill); expect.
      - SUPPRESSION:
        6. per-line oxlint-disable-next-line WITH '-- reason' on the offending detached start (accepted).
        7. per-line oxlint-disable-next-line WITHOUT '-- reason' (rejected via localized-disable rule).
        8. file-wide oxlint-disable (rejected via localized-disable rule).
        9. oxlint-disable-next-line attached to an unrelated preceding statement (still flags the offending detached start — failing-before-fix).

      Verified current rule behavior with scratch lint runs before writing the assertions: cases 1-3
      and 9 fail today because the rule treats an ancestor afterEach with a process.kill/child.kill
      SIGTERM pattern as proof of cleanup; cases 4-8 pass today.


      After running the new file: Tests: 4 failed, 45 passed of 49. The 4 failures are exactly the
      documented regressions (1-3 and 9). lint-no-leaky-test-daemon.test.ts continues to pass
      (22/22). The dependent fix task (@task-fix-detached-cleanup-timing-analysis) is responsible
      for tightening the rule so these cases are reported.


      AC coverage on @daemon-test-guardrail-precision:
        ac-detached-cleanup-before-observation — cases 1-5
        ac-local-exception-is-local — cases 6, 8, 9
        ac-exception-reason-states-subject — cases 6, 7

      ac-direct-daemon-entry-invocations-flagged and ac-unrelated-subprocesses-not-reported are
      covered by the existing 'daemon test guardrail precision' describe block from
      @task-add-guardrail-classification-regressions and are not duplicated here.
