  - _ulid: 01KNK5JCBSN442WC3B432N83Q1
    content: "Approach: inspect post-invocation re-evaluation tests and dispatch completion path, then
      reproduce under full-suite load because the file passes in isolation. Edge cases: silent
      polling timeouts, async completion after engine.stop(), cross-file mock/env leakage, and
      provisioning/reconciliation races. Test plan: reproduce with full npm test -- --fresh, then
      add/adjust behavioral tests around the concrete race and rerun the full suite."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-07T05:10:14.650Z
  - _ulid: 01KNK5ZTVR5KYREP7E12QXS9W0
    content: "Stabilized post-invocation re-evaluation tests by replacing the 1s ad hoc polling with
      bounded waitForStartup-backed mock waits, adding an explicit wait before the re-evaluation
      warning assertion, and wrapping the dedup/provisioning tests in try/finally so
      DispatchEngine.stop() always runs even on assertion failure. Verification: npm test -- --fresh
      tests/agent-dispatch-engine.test.ts -t 'Post-invocation re-evaluation'; npm test -- --fresh
      tests/agent-dispatch-engine.test.ts. kspec validate still reports existing repository-wide
      warnings only."
    supersedes: null
    author: Jacob Chapel
