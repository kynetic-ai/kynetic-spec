title: kspec setup should work without CLAUDECODE=1 env var in non-interactive contexts. Either add
  a --age
type: task
description: "**What**: `kspec setup` requires the `CLAUDECODE=1` environment variable (or
  `CLAUDE_CODE_ENTRYPOINT` or `CLAUDE_PROJECT_DIR`) to detect the agent type as `claude-code`. In
  non-interactive contexts like containerized ralph runners, these env vars may not be available,
  causing `detectAgent()` to return `unknown` and setup to fail or print manual instructions instead
  of auto-configuring. **Where**: `src/cli/commands/setup.ts` — the `detectAgent()` function (line
  82-100) checks `process.env.CLAUDECODE`, `process.env.CLAUDE_CODE_ENTRYPOINT`, and
  `process.env.CLAUDE_PROJECT_DIR`. The `registerSetupCommand()` function (line 1638-1655) has
  options like `--dry-run`, `--author`, `--no-hooks` etc. but no `--agent` flag. The
  `getSetupStatus()` function (line 774) and the main setup action (line 1345) both call
  `detectAgent()`. **How**: Add an `--agent <type>` option to `kspec setup` that explicitly
  specifies the agent type, bypassing `detectAgent()`. Supported values: `claude-code`, `cline`,
  `cursor`, `windsurf`, `unknown`. When `--agent` is provided, skip detection and use the provided
  type directly. Also consider a fallback detection: if env vars are absent, check for `~/.claude`
  directory existence as a weaker signal for `claude-code`. The option should be threaded through to
  both `runSetup()` and `getSetupStatus()`. **Done when**: (1) `kspec setup --agent claude-code`
  works without any CLAUDECODE env var set. (2) `kspec setup --status --agent claude-code` reports
  correct status. (3) `detectAgent()` still works as before when `--agent` is not provided. (4)
  Invalid `--agent` values are rejected with a clear error. (5) Tests in
  `tests/enhanced-setup.test.ts` and `tests/setup-pipeline-unification.test.ts` updated."
