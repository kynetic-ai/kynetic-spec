  - _ulid: 01KGT5Q54EF33YJ9WCF374MJEB
    content: >-
      Implementation complete: batch command execution with two modes.


      **Atomic mode** (default): copies .kspec/ to temp dir, executes against copy, rolls back on
      failure, copies back + single shadow commit on success. Uses KSPEC_SPEC_DIR env var override
      in initContext() and setBatchMode() to suppress per-command shadow commits.


      **Immediate mode** (--no-atomic): executes against real .kspec/ state, per-command
      auto-commits via existing shadow machinery. No rollback on failure. --continue flag implies
      immediate mode.


      Key implementation details:

      - KSPEC_SPEC_DIR env var in initContext() for temp dir redirection

      - BatchExitError + exit interceptor to catch process.exit() calls

      - OutputCapture to intercept console.log/error/warn per command

      - resetCommandTree() to clear Commander state between dispatches

      - Auto-append --force for confirmation suppression

      - Strip ANSI via chalk.level=0 during dispatch

      - .git removed from temp copy to prevent worktree pointer leaks

      - Copy-back handles deletions by clearing real specDir first


      Files created: batch-context.ts, commands/batch.ts

      Files modified: batch-exec.ts, schema/batch.ts, parser/yaml.ts, parser/shadow.ts,
      cli/index.ts, commands/index.ts

      Tests: 39 tests (21 unit + 18 integration), all passing

      Full test suite: 1823/1824 pass (1 pre-existing bun compilation failure)
