  - _ulid: 01KGR05MRKC2P7MADTHFGB747E
    content: >-
      Implementation notes from plan:


      Architecture builds on existing infrastructure:


      1. **Command registry** — Extend `src/cli/introspection.ts` to produce a map of command paths
      to their handler functions and metadata, including a `mutating: boolean` annotation. This
      enables dynamic dispatch without Commander.js parsing overhead and drives the allow/deny
      classification.


      2. **Batch executor** (`src/cli/batch-exec.ts`) — New module:
         - `parseBatchInput(source)` — Reads from stdin/file/inline, parses JSON array
         - `validateBatch(commands, registry, context)` — Pre-validates all commands: known command, required args, ref resolution (including forward refs from earlier commands in batch)
         - `executeBatch(commands, registry, context, options)` — Executes validated commands sequentially, collects results, handles stop-on-error vs continue

      3. **Shadow commit batching** — Use a `context.batchMode` flag. When set, `commitIfShadow()`
      skips the commit. The batch executor issues a single commit after all operations complete (or
      after partial completion with `--continue`). The flag is set before execution and cleared
      after.


      4. **Forward reference resolution** — During pre-validation, track slugs that will be created
      by earlier commands. Build a "planned refs" set that the validator checks against when a ref
      doesn't exist yet. Only tracks creates, not deletes (documented limitation).


      5. **Confirmation suppression** — When `context.batchMode` is set, commands that check for
      `@trait-confirmation-prompt` behavior skip the prompt and proceed as if `--force` were passed.


      6. **Handler extraction** — Each command's `.action()` handler needs to be callable
      programmatically (not just via Commander.js parsing). Extract the core logic into importable
      functions that batch can call directly. Many commands already follow this pattern (e.g.,
      `resolveTaskRefForBatch()`).


      7. **Test approach** — Unit tests for parse/validate/execute phases. Integration test with a
      temp kspec project running a real batch payload end-to-end. Test the full matrix:
      stdin/file/inline × stop-on-error/continue × success/failure/partial.
    author: "@claude"
    created_at: 2026-02-05T22:53:37.427Z
  - _ulid: 01KGR1880314CP5YJAABQNX3MB
