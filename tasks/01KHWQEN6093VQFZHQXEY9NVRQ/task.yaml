title: Reconcile doctor command exit code with spec
type: task
description: >-
  The @doctor-command spec ac-exit-one says 'exit code is 1' when errors exist. The implementation
  uses EXIT_CODES.VALIDATION_FAILED which is 4. The test at doctor.test.ts line 500 asserts exitCode
  === 4.


  Also @trait-semantic-exit-codes ac-2 defines exit 1 for validation errors.


  Either:

  - Update the spec AC to say 'non-zero exit code' instead of 'exit code is 1', OR

  - Change the implementation to use exit code 1


  The spec should match reality. Since doctor is a health check (not a validation command), exit 1
  is more conventional for CLI health checks. Recommend changing implementation to exit 1.
