title: Skip kspec-agents.md regeneration when content unchanged
type: task
description: kspec agents generate currently always updates the timestamp in kspec-agents.md even
  when no actual content has changed. This creates unnecessary git diffs. Should compare the
  generated content (excluding the timestamp comment) against the existing file and skip writing if
  identical. The hash file (.kspec-agents-hash) already tracks meta hash for staleness — if the meta
  hash matches, the file content is the same and generation can be skipped entirely with a
  'kspec-agents.md is already up to date' message.
