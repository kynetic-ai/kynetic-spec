  - _ulid: 01KV4N7YG1JPETS6NE11F1AB5X
    content: >-
      Approach: New module packages/web-ui/src/lib/preferences/ with three files — backend.ts
      (PreferenceBackend interface, InMemoryBackend, LocalStorageBackend with detect-on-first-use +
      per-write quota degradation), define-preference.ts (definePreference accessor:
      get/set/subscribe + read pipeline parse→version-check→migrate→validate→default), index.ts
      (re-exports).


      Key decisions:

      - Storage key = APP_PREFIX(kspec):namespace:key (stable across versions). Schema version
      stored INSIDE a JSON envelope {v,value}, NOT in the key — required so AC-3 migration can find
      older-versioned values. Namespace+key in the key gives AC-2 isolation.

      - Browser detection via typeof guards (not $app/environment) so the module is testable in node
      vitest. LocalStorageBackend probes localStorage at construction; degrades to in-memory
      wholesale when unavailable and per-write on quota/security throw.

      - Validation supports a Zod-like schema (safeParse) OR a validate predicate.
      Invalid/foreign/newer-version values never propagate — return default.

      - First consumer: project store selected-project migrated to
      definePreference({namespace:project,key:selected,version:1}). One-time legacy read of
      kspec-selected-project seeds the pref then removes the legacy key.


      Test plan: tests/web-ui/preferences.test.ts — round-trip (ac-1), namespace isolation (ac-2),
      version migration + no-rule default (ac-3), validation fallback (ac-4), backend-agnostic
      semantics via injected backend (ac-5), unavailable-storage degradation (ac-6), plus
      client-preference-persistence ac-1 key-format assertion. Node env, in-memory backend + a
      throwing fake storage for degradation.
    supersedes: null
    author: "@claude"
    created_at: 2026-06-15T03:29:44.450Z
  - _ulid: 01KV4P61GXQARCC8CVVFG9HKKS
    content: >-
      Implemented in packages/web-ui/src/lib/preferences/ (backend.ts, define-preference.ts,
      index.ts) and migrated the project store as first consumer. AC coverage in
      tests/web-ui/preferences.test.ts (15 tests, all behavioral against in-memory +
      fake-throwing/quota storage):

      - ac-1 round-trip + default-when-empty

      - ac-2 namespace isolation (same key name, different namespace)

      - ac-3 version migration via declared rule, default when no rule, default for newer/foreign
      version

      - ac-4 validation fallback (predicate + zod schema + non-JSON), invalid value never propagates

      - ac-5 backend-agnostic identical semantics + subscribe/unsubscribe

      - ac-6 unavailable-storage degradation, all-writes-throw degradation, per-write quota fallback

      - @client-preference-persistence ac-1 shared key format kspec:namespace:key with versioned
      envelope {v,value}


      Gates: format:check, lint --quiet (0 errors), oxlint on changed files (0/0), root typecheck,
      full npm test (10616 passed / 3 skipped / 0 fail). web-ui svelte-check has 61 pre-existing
      errors in unrelated files; none in preferences/ or project.svelte.ts.


      Note for reviewer: e2e tests/e2e/project-selector.spec.ts:316 removes the legacy key
      kspec-selected-project to simulate 'no selection'. After migration the value lives under the
      new key; that test still asserts the first-registered-project default, which remains correct,
      so behavior is preserved. Not modified to avoid unverifiable Playwright changes in this
      dispatch.
    supersedes: null
