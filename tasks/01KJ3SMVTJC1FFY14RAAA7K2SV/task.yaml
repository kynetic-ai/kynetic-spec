title: Investigate flaky doctor test failures
type: task
description: >-
  Doctor tests (tests/parser/doctor.test.ts) have been reported as failing intermittently by agents
  during ralph loop sessions. The 29-test suite passes consistently in isolation but has been
  observed failing during automated runs.


  Investigation needed:

  - Reproduce the flaky failure (run test suite in loop or under load)

  - Check for timing/race conditions (daemon status checks, file system operations)

  - Check for test isolation issues (shared state between tests, temp dir cleanup)

  - Review recent ralph logs or session notes for specific error messages

  - Determine if related to daemon health check timeouts or mock reliability


  The doctor test covers: shadow health, setup status, daemon running/unreachable/not-running,
  overall verdict, JSON output, exit codes. Any of these could have timing sensitivity.
