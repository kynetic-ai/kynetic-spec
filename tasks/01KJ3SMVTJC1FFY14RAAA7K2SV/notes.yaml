  - _ulid: 01KJ44Y2EQV8NBMWK9GAFAZA3M
    content: "Root cause: getDaemonStatus() checks global PID file (~/.config/kspec/daemon.pid), not
      per-project. Tests asserting 'daemon not running' behavior failed when a real daemon was
      running on the host (e.g. during ralph loop sessions). Fix: Added vi.spyOn mocking of
      getDaemonStatus in 3 tests (ac-daemon-running, ac-daemon-not-running x2) to isolate from host
      environment, matching the pattern already used in the ac-daemon-unreachable test. Two
      consecutive full suite runs (3168 tests) pass cleanly."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-23T02:23:27.192Z
