  - _ulid: 01KSYHJVX03WVV5KKQS1KYBT1H
    content: "Fix cycle 1: addressed blocker on src/agents/runner-config.ts:238. Added adapter registry
      validation to SystemRunnerConfigSchema via z.string().min(1).refine() that calls getAdapter()
      at parse time, so unknown adapter ids are rejected at config load with a message listing
      registered adapters. Refine is evaluated per-parse so adapters registered later via
      registerAdapter() also validate. Re-verified ACs against the change:
      ac-effective-runner-kind-and-adapter-required now enforces 'adapter reference an existing
      registered adapter' end-to-end (schema rejects, loader propagates as issue). No regression to
      project-layer behavior or merge semantics. Added 4 behavioral tests covering schema rejection,
      all built-in adapters accepted, registerAdapter() integration, and loader-level rejection.
      Gates: typecheck pass, lint --quiet pass, oxlint changed files 0/0, format:check pass for
      changed files (templates/skills/merge/SKILL.md unrelated to this diff, same skip as prior
      review), npm test full suite passes (2599 suites / 9959 tests, 5 skipped, no new failures),
      kspec validate refs/alignment/completeness pass with existing warning baselines only."
    supersedes: null
