      token was the daemon entry, the launch was silently accepted (false negative). Reviewer probe
      exec("node --use-openssl-ca dist/daemon/index.js --port 0") returned 0 diagnostics.


      Audit method: ran node --help on Node v24, identified each entry as either standalone (no =...
      in usage) or value-consuming. Then ran bare-then-value probes (node --flag VALUE script.js) to
      confirm whitespace-form behavior.


      REMOVED (not whitespace-value-consuming): --use-openssl-ca, --tls-min-v1.0 (standalone
      booleans); --stack-trace-limit (only the =N form works; bare-then-value errors with bad
      option, and the bundled =N form is one token starting with - so the standalone-flag branch
      handles it correctly); --policy-integrity, --experimental-policy,
      --experimental-specifier-resolution (removed from current Node).


      KEPT (verified whitespace-value-consuming via probe): -r/--require, -C/--conditions,
      --input-type, --cpu-prof-{dir,interval,name}, --heap-prof-{dir,interval,name},
      --diagnostic-dir, --report-{dir,directory,filename,signal}, --snapshot-blob, --openssl-config,
      --max-http-header-size, --title, --unhandled-rejections, --tls-cipher-list, --tls-keylog,
      --redirect-warnings, --experimental-loader/--loader, --inspect-publish-uid, plus Bun --preload
      and --config.


