    content: >-
      Fix cycle 6: closed both precision blockers via two narrow predicate changes.


      Blocker 1 (line 727 — exec/execSync): the runtime form previously required the daemon entry to
      be at exactly tokens[1]. exec("node --enable-source-maps dist/daemon/index.js --port 0")
      therefore matched no rule and was silently accepted. Fix: in readDaemonEntryInvocation's
      exec/execSync branch, after confirming tokens[0] is a recognised runtime, walk forward
      skipping flag-shaped tokens (any token whose first char is `-`, including `--inspect=...`,
      `-r`, and the `--` separator) and pick the first non-flag token. Match only when that token is
      the daemon entry. Added isShellRuntimeFlagToken helper for the walk and updated the report
      pattern to surface the flag segment for the diagnostic.


      Blocker 2 (line 469 — process.execPath): isProcessExecPathExpression rejected all computed
      access — process["execPath"] resolves to the same property at runtime but was silently
      accepted. Fix: the predicate now accepts non-computed access with an Identifier-named property
      AND computed access with a string Literal or a no-substitution TemplateLiteral whose value is
      "execPath". Strictness preserved: dynamic property expressions, other property names, and
      computed access on unrelated objects remain unrecognised.


      Reviewer probes now emit diagnostics: exec("node --enable-source-maps dist/daemon/index.js
      --port 0") -> directDaemonSpawn; spawn(process["execPath"], [DAEMON_ENTRY, "--port", "0"]) ->
