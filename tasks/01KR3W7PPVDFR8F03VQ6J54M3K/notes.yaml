  - _ulid: 01KR4JRRPG1SNZ8ZT3JMWFBVP0
    content: >-
      Fix cycle 2: closed the exec/execSync shell-string blocker.


      Blocker (line 503): readDaemonEntryInvocation now also handles exec and execSync. The first
      argument is read via the existing literalString / templateLiteralRaw helpers and tokenised on
      whitespace; if any token names the daemon entry path (literal `dist/daemon/index.js` or any
      path ending in `/dist/daemon/index.js`), the call is reported with the directDaemonSpawn
      message. Two new helpers — `isDaemonEntryShellToken` and `shellCommandTokens` — encapsulate
      the token-shape check so the existing literal/template helpers stay reusable.


      Runtime detection: when the daemon entry is the leading shell token (direct-executable form),
      runtimeLiteral is null and the directDaemonSpawn message fires. When the daemon entry is
      preceded by a token, that prev token is the runtime; if prev is `bun` (or a path ending in
      `/bun`) the hardcodedBunRuntime message fires instead. Other prev tokens (e.g. `node`) route
      through the directDaemonSpawn message.


      Detached-serve preserved: the new exec/execSync direct-entry detector only matches when a
      daemon entry token is present, so `exec("kspec serve start --detach")` still has no daemon
      entry tokens and still routes through the existing detached-serve detector for the
      missingCleanup message. Verified by a new regression test that asserts the missing-cleanup
      message fires and the shared-fixture message does not.


