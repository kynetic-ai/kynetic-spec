notes:
  - _ulid: 01KMAE5YTC43XK1E7YJ673RG4J
    content: "Implemented session_prompt action type with full AC coverage. Schema
      (SessionPromptActionSchema) added to action.ts with prompt, prompt_template, and session_id
      fields. Used ZodObject for discriminated union compatibility with separate RefinedSchema for
      prompt/prompt_template requirement validation. ActionExecutor extended with
      executeSessionPrompt() method supporting: idle/prompting session states, event-context
      session_id resolution for session.idle hooks, explicit session_id for non-session events,
      template interpolation, and clear error messages. Added validateSessionPromptActions() in
      validate.ts to warn on session_prompt hooks without session_id on non-session events. Updated
      KNOWN_EVENT_FIELDS to include turn_count and stop_reason for session domain. All 31 new tests
      pass. Full suite passes (one pre-existing flaky test in canonical-task-workspace-contract
      unrelated to changes)."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-22T09:31:53.037Z
