      Implementation notes (auto-generated from spec):


      Remove dead code and deduplicate utilities across skill.ts, skill-render.ts, and agents.ts.
      Clears noise before larger refactors.



      Acceptance Criteria:

      - ac-1: Given the codebase, when building the project, then SkillRenderResult,
      SkillStatusResult types, and getSkillSyncStatus function are removed from skill.ts

      - ac-2: Given skill-render.ts, when reviewing dead code, then toKebabCase function is removed
      (zero callers)

      - ac-3: Given agents.ts, when reviewing dead code, then EXPECTED_TEMPLATES constant is removed
      (never referenced)

      - ac-4: Given skill.ts needs contentsEqual, directoriesEqual, or copyDirectory, when these
      functions are called, then they are imported from skill-render.ts, not duplicated locally

      - ac-5: Given the skill CLI add/set commands, when constructing input before schema parse,
      then redundant manual defaults for platform, tags, and depends_on are removed (schema provides
      them)
