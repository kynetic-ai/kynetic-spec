title: Fix daemon-executable bun build --compile failure
type: task
description: >-
  bun build --compile fails for the daemon package because route files use relative imports to
  parent packages (../../parser/index.js, ../../utils/grep.js, ../../parser/shadow.js). Bun's
  bundler cannot resolve these cross-package ESM imports.


  Affected route files:

  - packages/daemon/src/routes/items.ts (line 26)

  - packages/daemon/src/routes/validation.ts (lines 26, 33)

  - packages/daemon/src/routes/meta.ts (line 22)

  - packages/daemon/src/routes/tasks.ts (lines 30, 31)

  - packages/daemon/src/routes/inbox.ts (lines 27, 28)


  Test: tests/daemon-executable.test.ts - first test fails with exit code 1 (expected 0).

  Inbox item: 01KHHJ27CE4SNQXCZDZRJCFK4M

  Spec: @daemon-server ac-16


  Possible approaches:

  1. Configure Bun bundler with proper package resolution/externals

  2. Use workspace package imports (e.g., kynetic-spec/parser) instead of relative paths

  3. Add a pre-build step that resolves/bundles parent package dependencies


  The underlying issue is the monorepo structure - daemon lives in packages/daemon/ but imports from
  src/ at the repo root via relative paths.
