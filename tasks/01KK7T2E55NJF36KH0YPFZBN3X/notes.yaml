  - _ulid: 01KK8AMM7F0A9152W9HH2GNDZJ
    content: "Fix cycle 1: Extracted needsSessionsGitignore() and needsShadowSessionsGitignore()
      read-only check functions from shadow.ts. setup.ts now uses these in dry-run mode to detect
