      Coverage of the 5 spec ACs:

      - ac-plan-task-resource-refs-are-structured: PlanTask schema accepts resource_refs; derive
      validates them; plan-document + import + derive + plan-resource tests exercise the contract.

      - ac-derived-task-keeps-plan-resource-reference: derive records owner_type='plan' refs with no
