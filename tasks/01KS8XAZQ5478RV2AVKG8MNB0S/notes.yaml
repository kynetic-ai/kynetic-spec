      - ac-derived-task-records-resource-version: TaskResourceRef carries
      id/path/sha256/git_commit/git_path/recorded_at; verified in CLI tests.

      - ac-resource-drift-is-visible: task-resource-resolver compares recorded vs current hash; CLI
