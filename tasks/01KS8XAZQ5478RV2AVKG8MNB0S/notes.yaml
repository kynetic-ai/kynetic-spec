  - _ulid: 01KSENY7Z2H6WQM41174WQQJTZ
    content: >-
      Implementation complete.


      Delivered:

      - src/schema/resources.ts: added PlanResourceImportEntry/ManifestSchema,
      TaskResourceRefSchema, ResourceOwnerTypeSchema.

      - src/schema/task.ts: added optional resource_refs to TaskSchema/TaskInputSchema.

      - src/parser/plan-document.ts: added optional resource_refs to PlanTaskSchema.

      - src/parser/entity-local-resources.ts: added extractMarkdownResourceLinks helper for
      ./resources/<rel> link discovery (image, inline, reference-style).

      - src/parser/plan-resource-import.ts (new): sibling resources.yaml validation + persistence +
      plan-existing-resources link validation for set/--into paths. PlanImportResourceError carries
      structured code for each failure mode.

      - src/parser/task-resource-resolver.ts (new): resolves task resource_refs against current
      owning entity manifests; computes present/drift/missing/unresolved status for CLI/agent/API
      surfaces.

      - src/parser/index.ts: re-exports the new resolver module.

      - src/cli/commands/plan-resource.ts (new): plan resource add/list/get/remove with the exact
      JSON success/failure envelopes, --replace path-id semantics, interactive-cancel exit code 2,
      content_type inference + explicit-override storage, and entity-storage incompatibility mapping
      to exit 3.

      - src/cli/commands/plan.ts: wires registerPlanResourceCommands; adds --content-file to plan
      set with link validation; adds --materialize-resources to plan derive; validates resource_refs
      against plan manifest; records TaskResourceRef entries on derived tasks; copies bytes + writes
      task resources.yaml when materialized.

      - src/cli/commands/plan-import.ts: validates sibling resources.yaml before save, copies
      declared files into the new plan directory after save, validates --into re-import links
      against existing plan manifest.

      - src/cli/commands/task.ts + src/cli/output.ts: resolve resource_refs via the new helper; add
      formatted Resources section with OK/DRIFT/MISSING/UNRESOLVED labels; include
      resolved_resources in JSON.

      - src/agent-runtime/dispatch.ts: orientation block surfaces drift status to dispatched
      workers.


      Tests:

      - tests/cli-plan-resource.test.ts (23 tests): add/list/get/remove happy paths, all CLI failure
      envelopes, exit code contract (0/1/2/3), --replace + path-id conflicts.

      - tests/cli-plan-import-resources.test.ts (9 tests): sibling manifest enforcement
