    content: >-
      Implementation complete. Changes:

      1. legacy.ts: Removed all *WithFallback/*Merged functions (getSessionWithFallback,
      readEventsWithFallback, listSessionsMerged, getAllSessionLogSummariesMerged,
      resolveSessionIdWithFallback, searchSessionEventsWithFallback,
      computeToolUsageStatsWithFallback). Added countLegacySessions() and warnIfLegacySessions()
