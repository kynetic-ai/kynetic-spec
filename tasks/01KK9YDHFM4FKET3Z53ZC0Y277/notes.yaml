      4. Tests: Rewrote session-legacy-fallback.test.ts (29 tests) and session-legacy-cli.test.ts
      (18 tests) to verify detect-and-warn behavior. All 47 tests pass. Full suite: 4225 passed, 2
      pre-existing failures unrelated to this change.
