title: Prioritize pending_review over pending in dispatch scheduling
type: task
description: "Without git worktree isolation, dispatch serializes agents into a single slot. Current
  STATUS_PRECEDENCE ranks pending (2) above pending_review (3), so the worker picks up new tasks
  before the reviewer handles submitted work. This creates a bottleneck: completed work sits in
  review while more work piles up. Fix: swap pending_review above pending in STATUS_PRECEDENCE
  (pending_review: 2, pending: 3). Once worktree-based agent isolation lands and agents run
  concurrently in separate working copies, this ordering becomes moot — but until then it ensures
  the review-then-work cycle completes faster."
spec_ref: "@dispatch-in-progress-priority"
