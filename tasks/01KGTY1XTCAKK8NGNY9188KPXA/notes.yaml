notes:
  - _ulid: 01KGTY1XTDQXCJCSQMH648DXH9
    content: "Implementation: Add 'commands' subcommand to batch in src/cli/commands/batch.ts. Iterate
      CommandMeta entries, format each as 'inbox add <text> [--tag <tag...>]'. Include
      mutating/read-only classification from existing annotations. Support --json for
      machine-readable output. CommandMeta already has all the data — this is pure display. ~30
      lines + tests."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-07T02:14:21.773Z
  - _ulid: 01KGVXG9DGRGGSKDQVC485B8H4
    content: "Implemented 'kspec batch commands' subcommand that lists all mutating commands allowed in
      batch mode. Features: human-readable output with signatures (e.g., 'inbox add <text>
      [options]'), descriptions, and total count; JSON output with full metadata (arguments,
      options, required flags). 15 tests covering both output modes and edge cases. Backwards
      compatible - 'kspec batch' still works as before."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-07T11:23:58.256Z
