      Implemented consolidation of skill render implementations:


      1. Moved hash/drift functions to skill-render.ts:
         - computeContentHash, getRenderHashPath, readRenderHash, writeRenderHash, checkSkillDrift
         - All exported from skill-render.ts (AC-3)

