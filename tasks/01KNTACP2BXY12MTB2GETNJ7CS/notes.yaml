  - _ulid: 01KNTJKF9CNJZ3RDMBKPVAV9M0
    content: >-
      Approach: Following the existing oxlint jsPlugins pattern (no-daemon-ts-imports.js,
      no-source-scanning.js). 


      The rule detects two anti-patterns:

      1. String literals containing 'serve start' + '--detach' in test files without cleanup
      registration

      2. spawn() calls where first arg resolves to dist/daemon/index.js without cleanup registration


      Cleanup detection: onTestFinished(), try/finally with kill/stop, afterEach in same describe
      scope that calls kill/stop.


      Key design decision: False positives worse than false negatives — if cleanup can't be
      statically proven missing, pass.


      Test plan: 4+ positive cases (no cleanup variants) × 4+ negative cases (onTestFinished,
      afterEach, try/finally, non-daemon spawn). Using inline fixture strings like the existing
      test.


      Files to create:

      - tools/eslint-rules/no-leaky-test-daemon.js

      - tests/lint-no-leaky-test-daemon.test.ts


      Files to modify:

      - .oxlintrc.json (add plugin + rule)
    supersedes: null
    author: "@claude"
    created_at: 2026-04-10T02:12:42.924Z
  - _ulid: 01KNTKDT68P3E6J4XHAKXDT1AY
    content: >-
      Implementation complete. Created:

      - tools/eslint-rules/no-leaky-test-daemon.js — oxlint JS plugin rule

      - tests/lint-no-leaky-test-daemon.test.ts — 14 tests (5 positive, 8 negative, 1 codebase
      validation)

      - .oxlintrc.json — wired new rule into test file overrides

      - kspec-agents.md — regenerated after convention update


      Key design decisions:

      1. Spawns in named helper functions (function startDaemon, const startDaemon = ...) are exempt
      — callers manage cleanup

      2. Detection is string-based for template literals (joining quasis) to handle interpolated
      ports

      3. afterEach cleanup detection checks the text for kill/stop/SIGTERM/killPid patterns

      4. Rule passes against entire tests/ with zero violations (AC4)

      5. Testing convention updated with daemon cleanup pattern (AC5)


      All 2118 test suites pass (7737 tests, 5 pre-existing skips).
