  - _ulid: 01KKM7YV581A5HVB4WW7D4FW6N
    content: >-
      Execution context:

      - Background: Dispatch system needs to adopt existing task branches (from manual or external
      work) rather than creating fresh dispatch/task/* branches when no workspace record exists but
      submission linkage is available. This enables review and fix-cycle continuity for adopted
      branches.

      - Scope: Implement branch adoption logic in workspace provisioning, rehydration from remote
      locators, fix-cycle branch continuity, and explicit failure when no linkage exists.

      - Files: src/dispatch/ workspace and scheduler modules (to be confirmed after exploration)

      - Verification: Tests covering all 4 ACs + trait ACs, npm test passing
    supersedes: null
    author: "@claude"
    created_at: 2026-03-13T18:39:50.952Z
  - _ulid: 01KKM9ERCMBCE23SMPRQFZ7R8Z
    content: >-
      Implementation complete:

      - provisionDispatchWorkspace now accepts submissionLinkage and taskStatus parameters

      - When no workspace record exists, checks submission linkage for an adoptable branch (AC-1)

      - Rehydrates branches from remote when not present locally (AC-2)

      - Fix-cycle re-provisioning preserves adopted branch via existing workspace record (AC-3)

      - Throws DispatchWorkspaceError with recovery guidance for pending_review/needs_work without
      linkage (AC-4)

      - Dispatch engine passes submission_linkage from task data to provisioning

      - Queue eligibility updated to allow pending_review tasks with submission linkage through

      - 9 tests covering all 4 ACs plus edge cases (detached HEAD, unreachable branch, regular
      tasks)

      - Trait AC annotations for @trait-error-guidance included

      - Existing dispatch engine test updated to mock provisioning and bootstrap for reviewer
      guardrail test

      - Full test suite passes (4770 passed, 1 pre-existing flaky shadow test)
