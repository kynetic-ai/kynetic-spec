      Fix cycle work:

      - Reproduced full npm test failure on PR head.

      - Root causes found: (1) serve start --daemon returns before health endpoint is reachable,
      causing npm-installed-package startup race; (2) root Vitest run is discovering nested .review/
      test trees from local review artifacts, which contaminates regression runs.

      - Scope of fix: harden daemon readiness wait in src/cli/commands/serve.ts and exclude
      workspace-local review/worktree directories from root vitest config.
