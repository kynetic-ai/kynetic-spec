  - _ulid: 01KM02N8Q4PQ412ZDK2QXNE3EP
    content: "Implemented hook schema and meta manifest extension. Created src/schema/action.ts (shared
      ActionSchema with four action types as discriminated union), src/schema/hooks.ts (HookSchema,
      HookFilterSchema, HookEventTypeSchema, filter matching logic, and validation utilities),
      extended MetaManifestSchema with hooks array defaulting to []. Updated meta loading pipeline
      (parser/meta.ts) to parse and load hooks. Added hook-specific validation to validate.ts: agent
      action refs produce errors when referencing non-existent agents (ac-3), unknown filter fields
      produce warnings listing available fields (dispatch-hook-filter ac-3). 54 tests cover all ACs.
      Full test suite passes with only one pre-existing failure in review-cli.test.ts (unrelated to
      changes)."
