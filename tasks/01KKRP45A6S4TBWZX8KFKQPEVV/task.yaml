title: Remove process.cwd() web UI resolution from daemon
type: task
description: |-
  resolveWebUiPath() in packages/daemon/src/server.ts uses process.cwd() to find
  packages/web-ui/build (options 3 and 4). In multi-directory daemon mode, cwd is
  the project directory, not the daemon installation. If that project has its own
  stale web UI build, the daemon serves it instead of its own current build.

  Fix: Remove options 3 and 4 (process.cwd()-based resolution) from resolveWebUiPath().
  The resolution order should be:
  1. Explicit webUiDir option
  2. WEB_UI_DIR environment variable
  3. Bundled dist/web-ui/ relative to import.meta.url (the daemon's own module)

  This matches @daemon-web-ui-bundle ac-4 (updated) and ac-5 (new).

  The existing test in tests/daemon-web-ui-bundle.test.ts covers resolveWebUiPath —
  update it to verify cwd-based paths are NOT used.
