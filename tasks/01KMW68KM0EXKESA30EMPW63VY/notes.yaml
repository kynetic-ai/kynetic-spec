    content: "Fix cycle 4: Completed client-side envelope unwrapping for all affected web UI API
      functions. Added unwrapEnvelope() and unwrapPaginatedEnvelope() helpers to api.ts that extract
      data from the {data, meta} envelope before returning to callers. Updated ~30 client functions
      covering: list endpoints (fetchTasks, fetchItems, fetchInbox, fetchObservations,
      fetchTriageRecords, fetchReviews, fetchReviewsForTask, fetchItemTasks), detail endpoints
      (fetchTask, fetchItem, fetchReview, fetchPlanContent, fetchSession, fetchSessionContext,
      fetchProjectConfig, fetchShadowStatus), and aggregation/meta endpoints (fetchWorkflows,
      fetchConventions, fetchAgentDefinitions, fetchPlans, fetchMergedInbox,
      fetchValidationAggregation, fetchAlignment, fetchValidation, search, fetchSessions,
      fetchTaskSessions, fetchItemSessions). Updated E2E mocks in 6 spec files (dashboard, sessions,
      validate, reviews-detail, code-diff-viewer, smoke) to return envelope-wrapped responses. All
      7123 tests pass."
