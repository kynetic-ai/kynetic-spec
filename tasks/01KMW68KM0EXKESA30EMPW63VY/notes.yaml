  - _ulid: 01KMWAKM7FKHDYYYP1HR7HNNWW
    content: 'Approach: Migrate all cache-backed route handlers to use wrapResponse() envelope.
      Excluded: mutation responses, command, health/debug, session events (per ac-envelope:
      non-cache endpoints excluded). Loading responses use wrapResponse(emptyData,
      {cacheDomainState: "loading"}). Normal responses wrap existing payload in {data, meta}. Will
      update tests to expect new envelope shape.'
    supersedes: null
    author: "@claude"
