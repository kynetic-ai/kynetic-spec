  - _ulid: 01KNAR8WV79ZGQ9NN0AQF9VXPY
    content: "Approach: extend tests/dispatch-target-sync.test.ts using the existing bare-remote +
      tracked-branch helpers and direct integration-target git helpers instead of inventing a second
      harness. Edge cases: same-target concurrent reviewer merges must fail only for the stale
      second updater; successful first merge must still push remote; fix-cycle path should
      transition only the failed task to needs_work; trait-error-guidance is N/A because this file
      exercises internal dispatch engine sync rather than a user-facing CLI command. Test plan: add
      one behavioral concurrent-merge regression covering @dispatch-remote-branch-sync
      ac-concurrent-merge-same-target and ac-concurrent-merge-fix-cycle, add the missing
      ac-pull-no-merge-commits annotation to the existing ff-only test, and add standalone N/A
      annotations for @trait-error-guidance ac-1 through ac-6."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-03T22:43:56.904Z
  - _ulid: 01KNARMN38GVF90YMXK81F9QB7
    content: "Implemented the remaining workspace-scoped sync coverage in
      tests/dispatch-target-sync.test.ts. Added a concurrent same-target reviewer regression that
      proves one stale reviewer push is rejected after another reviewer updates the target, then
      exercised the standard fix-cycle path with a request_changes review verdict to move the
      affected task to needs_work. Also backfilled the missing ac-pull-no-merge-commits annotation
      and recorded @trait-error-guidance ac-1 through ac-6 as N/A for this internal engine sync test
      file. Verification: npm test -- dispatch-target-sync.test.ts passed; full npm test passed
      (2068 suites, 7512 tests, 5 skipped). kspec validate still reports the repo's existing global
      warning backlog, but no new blocker surfaced for this task."
