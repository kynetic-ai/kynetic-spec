  - _ulid: 01KJXMXMFMRKT7A6WQMKWHY2HA
    content: >-
      Codex review found two MUST-FIX issues, both addressed:


      1. No-task in_progress specs were silently unreported — extended orphaned_spec warning to also
      fire for in_progress (not just not_started). Policy clarified: not_started/in_progress + no
      tasks = warn; implemented/verified + no tasks = trust (baseline). Commit ae0864c.


      2. No test coverage for new suppression behavior — added
      tests/validate-alignment-no-task-policy.test.ts with 5 tests covering all four no-task status
      combinations. All pass.


      Also added @alignment-warnings ac-3 to spec to codify the baseline trust policy.


      SHOULD-FIX: @alignment-warnings AC-2 was already accurate (scoped to 'based on linked tasks').
      No spec update needed there.


      Final state: 24 orphaned spec warnings (24 legit future-work items, 7 previously silently
      missed in_progress ones now correctly surfaced), 0 status mismatches.
    supersedes: null
