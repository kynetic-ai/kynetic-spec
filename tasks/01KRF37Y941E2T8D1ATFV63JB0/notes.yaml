  - _ulid: 01KRFM0D900JG9B4RJ1YKN382Y
    content: >-
      Fix cycle 1: addressed blocker on src/agent-runtime/workspace.ts:3514 — active/in-flight task
      refs now protect the corresponding dispatch branch and worker/reviewer worktree basenames even
      when the registry has no record yet.


      Approach: derive activeOrInFlightShortIds via shortTaskId() (deterministic from the task ref)
      and consult it in evaluateDispatchBranch() and evaluateWorkspacePath(). Branches that match
      the canonical dispatch/task/<slug>/<short-id> layout and basenames that end with -<short-id>
      or -<short-id>-review under the configured worktreeRoot are preserved.


      Guardrails: non-canonical dispatch branches (wrong segment count) and out-of-tree paths are
      NOT over-protected by the derivation. Added explicit negative-case assertions.


      Re-verified all spec ACs against the implementation:

      - ac-active-inflight-provisioning-artifact-preserved: caller-supplied active/in-flight refs
      now cover branch+path surfaces in addition to task ref.

      - ac-protection-applies-to-every-destructive-surface: the protection state is still the single
      source of truth for all destructive surfaces in reconcileDispatchWorkspaceArtifacts.

      - ac-ambiguous-protection-blocks-blind-deletion: registry load-failed path unchanged; still no
      blind deletion.

      - @dispatch-workspace-registry ac-partial-provisioning-classified-before-cleanup: unchanged.


      Tests:

      - 2 new unit tests in tests/dispatch-artifact-protection.test.ts (queue-to-spawn protection +
      over-protection guardrails).

      - 1 new E2E regression in tests/dispatch-workspace-cleanup.test.ts that reserves a canonical
      dispatch branch with an empty registry and proves reconcileDispatchWorkspaceArtifacts does not
      delete it.


      Full suite: 9107 passed (5 pre-existing skipped). oxlint clean. tsc clean.
