          context: "Future consideration"
          resolved: false
      ```


      ## Step 5: Add data-testid Attributes


      Edit `packages/web-ui/src/lib/components/ConnectionStatus.svelte`:

      - Add `data-testid="connection-status"` to root element


      Edit `packages/web-ui/src/lib/components/Sidebar.svelte`:

      - Add `data-testid="sidebar-nav"` to nav container

      - Add `data-testid="nav-link-dashboard"`, `nav-link-tasks`, etc. to nav links

      - Add `data-testid="session-focus"` to focus display


      Edit `packages/web-ui/src/lib/components/TaskList.svelte`:

      - Add `data-testid="task-list"` to table container

      - Add `data-testid="task-row"` to each task row


      ## Step 6: Create .gitignore


      Create `packages/web-ui/.gitignore`:


      ```

      # Playwright

      test-results/

      playwright-report/

      playwright/.cache/

      ```


      ## Step 7: Create Smoke Test


      Create `packages/web-ui/tests/e2e/smoke.spec.ts`:


      ```typescript

      import { test, expect } from '../fixtures/test-base';


      test.describe('Smoke Tests', () => {
        test('page loads and connects to daemon', async ({ page, daemon }) => {
          await page.goto('/');

          // Sidebar is visible
          await expect(page.getByTestId('sidebar-nav')).toBeVisible();

          // Connection status shows connected
          const connectionStatus = page.getByTestId('connection-status');
          await expect(connectionStatus).toBeVisible();
          await expect(connectionStatus).toContainText(/connected/i);
        });

        test('can navigate to tasks page', async ({ page, daemon }) => {
          await page.goto('/');

          // Click tasks nav link
          await page.getByTestId('nav-link-tasks').click();

          // URL changed
          await expect(page).toHaveURL(/\/tasks/);

          // Task list is visible
          await expect(page.getByTestId('task-list')).toBeVisible();
        });

        test('task list shows test data', async ({ page, daemon }) => {
          await page.goto('/tasks');

          // Wait for task list to load
          const taskList = page.getByTestId('task-list');
          await expect(taskList).toBeVisible();

          // Should have task rows from test fixtures
          const taskRows = page.getByTestId('task-row');
          await expect(taskRows.first()).toBeVisible();
        });
      });

      ```


      ## Step 8: Update Root package.json (optional)


      Add to root `package.json` scripts:


      ```json

      {
        "scripts": {
          "test:e2e": "npm run test:e2e -w packages/web-ui"
        }
      }

      ```


      ## Verification Checklist


      1. [ ] `cd packages/web-ui && npm install` succeeds

      2. [ ] `npx playwright install chromium` succeeds

      3. [ ] `npm run build` succeeds (needed before preview)

      4. [ ] `npm run test:e2e` runs and passes:
         - Daemon starts on port 3456
         - Web UI loads at localhost:4173
         - Connection status shows connected
         - Navigation works
         - Task list displays test data
         - Daemon cleans up after tests

      ## CI Requirements (for documentation)


      CI workflow will need:

      1. Bun runtime: `curl -fsSL https://bun.sh/install | bash`

      2. Build before test: `npm run build -w packages/web-ui`

      3. Playwright browsers: `npx playwright install --with-deps chromium`

      4. Run tests: `npm run test:e2e -w packages/web-ui`


