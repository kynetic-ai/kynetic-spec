    content: >-
      ## Objective


      Set up Playwright E2E testing infrastructure for the web UI at `packages/web-ui/`. All other
      E2E test tasks depend on this setup.


      ## Critical Constraint: Port 3456


      The web UI has `API_BASE = 'http://localhost:3456'` hardcoded in `src/lib/api.ts`. The daemon
      fixture MUST use port 3456, not random ports. Tests run sequentially with `workers: 1`.


      ## Step 1: Install Playwright


      Edit `packages/web-ui/package.json`:


      ```json

      {
        "devDependencies": {
          "@playwright/test": "^1.50.0"
        },
        "scripts": {
          "test:e2e": "playwright test",
          "test:e2e:ui": "playwright test --ui",
          "test:e2e:headed": "playwright test --headed"
        }
      }

      ```


      Run:

      ```bash

      cd packages/web-ui

      npm install

      npx playwright install chromium

      ```


      ## Step 2: Create playwright.config.ts


      Create `packages/web-ui/playwright.config.ts`:


      ```typescript

      import { defineConfig, devices } from '@playwright/test';


      export default defineConfig({
        testDir: './tests/e2e',
        fullyParallel: false,
        forbidOnly: !!process.env.CI,
        retries: process.env.CI ? 2 : 0,
        workers: 1, // Required: daemon uses fixed port 3456
        reporter: process.env.CI ? 'github' : 'html',
        timeout: 30_000,

        expect: {
          timeout: 10_000,
        },

        use: {
          baseURL: 'http://localhost:4173',
          trace: 'on-first-retry',
          screenshot: 'only-on-failure',
          video: 'retain-on-failure',
          actionTimeout: 10_000,
        },

        webServer: {
          command: 'npm run preview',
          url: 'http://localhost:4173',
          reuseExistingServer: !process.env.CI,
          timeout: 60_000,
        },

        projects: [
          {
            name: 'chromium',
            use: { ...devices['Desktop Chrome'] },
          },
        ],

        outputDir: 'test-results',
      });

      ```


      ## Step 3: Create Test Fixtures


      Create `packages/web-ui/tests/fixtures/test-base.ts`:


      ```typescript

      import { test as base, expect } from '@playwright/test';

      import { execSync, spawnSync } from 'child_process';

      import { mkdirSync, cpSync, existsSync, readFileSync, rmSync } from 'fs';

      import { join } from 'path';

      import { tmpdir } from 'os';


      const DAEMON_PORT = 3456;

      const ROOT_FIXTURES = join(__dirname, '../../../../tests/fixtures');


      interface DaemonFixture {
        tempDir: string;
        kspecDir: string;
      }


      async function cleanupExistingDaemon(): Promise<void> {
        // Kill any daemon that might be running on port 3456
        try {
          const result = spawnSync('lsof', ['-ti', ':' + DAEMON_PORT], { encoding: 'utf-8' });
          if (result.stdout.trim()) {
            const pids = result.stdout.trim().split('\n');
            for (const pid of pids) {
              try { process.kill(parseInt(pid, 10), 'SIGTERM'); } catch { }
            }
            await new Promise(r => setTimeout(r, 1000));
          }
        } catch { }
      }


      async function checkBunAvailable(): Promise<boolean> {
        try {
          execSync('which bun', { stdio: 'ignore' });
          return true;
        } catch {
          return false;
        }
      }


      export const test = base.extend<{ daemon: DaemonFixture }>({
        daemon: async ({}, use) => {
          // Check Bun is available (daemon requires it)
          if (!await checkBunAvailable()) {
            throw new Error('Bun runtime required for daemon. Install: curl -fsSL https://bun.sh/install | bash');
          }

          // Clean up any existing daemon
          await cleanupExistingDaemon();

          // Create temp directory
          const tempDir = join(tmpdir(), 'kspec-e2e-' + Date.now());
          const kspecDir = join(tempDir, '.kspec');
          mkdirSync(kspecDir, { recursive: true });

          // Copy test fixtures
          cpSync(ROOT_FIXTURES, kspecDir, { recursive: true });

          // Initialize git repo (required for kspec)
          execSync('git init', { cwd: tempDir, stdio: 'ignore' });
          execSync('git config user.email "test@test.com"', { cwd: tempDir, stdio: 'ignore' });
          execSync('git config user.name "Test"', { cwd: tempDir, stdio: 'ignore' });

          // Start daemon
          const startResult = spawnSync('kspec', [
            'serve', 'start', '--daemon',
            '--port', String(DAEMON_PORT),
            '--kspec-dir', kspecDir
          ], { cwd: tempDir, encoding: 'utf-8' });

          if (startResult.status !== 0) {
            throw new Error('Failed to start daemon: ' + startResult.stderr);
          }

          // Wait for daemon to be ready
          await new Promise(r => setTimeout(r, 1000));

          // Provide fixture to test
          await use({ tempDir, kspecDir });

          // Cleanup: stop daemon
          spawnSync('kspec', ['serve', 'stop', '--kspec-dir', kspecDir], {
            cwd: tempDir,
            encoding: 'utf-8'
          });
          await new Promise(r => setTimeout(r, 1000));

          // Remove temp directory
          try {
            rmSync(tempDir, { recursive: true, force: true });
          } catch { }
        },
      });


      export { expect };

      ```


      ## Step 4: Create Test Data Fixtures


      Create `tests/fixtures/project.inbox.yaml`:


      ```yaml

      inbox:
        - _ulid: 01KTEST0JNBX00000000000001
          created_at: "2026-01-23T10:00:00Z"
          author: "@test"
          text: "Test inbox item 1"
          tags: [test]

        - _ulid: 01KTEST0JNBX00000000000002
          created_at: "2026-01-23T11:00:00Z"
          author: "@test"
          text: "Test inbox item 2 with different timestamp"
          tags: [test, priority]
      ```


      Add to `tests/fixtures/kynetic.meta.yaml` (or create if missing):


      ```yaml

      session:
        focus: "Working on E2E test infrastructure"
        threads:
          - "Setting up Playwright"
        questions:
          - "Should we add mobile viewport tests?"

      observations:
        - _ulid: 01KTEST0BS00000000000000001
          created_at: "2026-01-23T09:00:00Z"
          type: friction
          content: "Test friction observation"
          context: "During test setup"
          resolved: false

        - _ulid: 01KTEST0BS00000000000000002
          created_at: "2026-01-23T09:30:00Z"
          type: success
          content: "Test success observation"
          context: "Pattern that worked"
          resolved: false

        - _ulid: 01KTEST0BS00000000000000003
          created_at: "2026-01-23T10:00:00Z"
          type: question
          content: "Test question observation"
          context: "Open question"
          resolved: false

        - _ulid: 01KTEST0BS00000000000000004
          created_at: "2026-01-23T10:30:00Z"
