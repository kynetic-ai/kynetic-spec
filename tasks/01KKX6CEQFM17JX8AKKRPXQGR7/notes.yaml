    content: "Applied raw-data-preservation pattern to saveTriageRecord in src/parser/yaml.ts. Added 5
      helper functions (extractRawTriageArray, writeRawTriageArray, findRawTriageIndex,
      findRawTriageIndexByInboxRef, mergeTriagePreservingRawShape) following the same approach used
      for inbox/plan/review records. The key Zod default prevented is evidence_refs: [] which would
      otherwise pollute records that didn't originally have the field. Added 5 round-trip stability
      tests covering: single record save, non-target pollution prevention, multi-record stability,
      multiple save cycles, and new record addition. All 5783 passing tests remain passing (1
      pre-existing failure in review-cli.test.ts unrelated to this change)."
