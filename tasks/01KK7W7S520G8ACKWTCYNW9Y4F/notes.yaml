  - _ulid: 01KK7WTGCN4STSF0Z7VC8M9P07
    content: "Spec approach changed: instead of a standalone AC on @agent-dispatch-engine, created
      @trait-task-readiness (4 ACs: ac-status, ac-deps, ac-not-blocked, ac-composable). Trait bound
      to 6 specs: @agent-dispatch-engine, @query-ready, @query-next, @task-automation-eligibility,
      @ui-task-board, @api-contract. The dispatch fix should implement ac-deps and ac-composable —
      add areDependenciesMet() call to _matchesFilter() and verify it runs before consumer-specific
      filters."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-08T23:34:21.334Z
  - _ulid: 01KK7YRH5G5WF0DTN9G260H46M
    content: >-
      Implementation complete. Changes:

      1. dispatch.ts: Added areDependenciesMet import, extended _matchesFilter() with blocked_by and
      depends_on checks for task.ready/task.needs_work events (before consumer filters per
      ac-composable), added allTasks param. Updated handleStateChange to load allTasks for dep
      checking. Added readiness check in _drainQueues before spawning.

      2. Tests: 8 new tests covering ac-deps, ac-not-blocked, ac-composable across
      handleStateChange, bootstrap, drainQueues paths. Also verifies
      task.in_progress/task.pending_review are NOT affected.

      All 74 dispatch tests pass. 2 pre-existing codex test failures unrelated.
    supersedes: null
    author: "@claude"
