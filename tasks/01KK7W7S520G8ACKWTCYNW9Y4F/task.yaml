title: Fix dispatch engine to check depends_on before dispatching
type: task
description: "The dispatch engine _matchesFilter() in dispatch.ts only checks automation status,
  tags, and priority — it does not call areDependenciesMet() from yaml.ts. This causes tasks with
  unmet depends_on relationships to be dispatched. Fix: add dependency checking to _matchesFilter()
  or the dispatch evaluation path, reusing the existing areDependenciesMet() logic. Also applies to
  _evaluateAllTasks() (bootstrap/reconciliation) and _drainQueues()."
