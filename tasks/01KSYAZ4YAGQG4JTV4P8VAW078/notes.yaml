  - _ulid: 01KSZ1A3B72KMSD082P6WGSE1K
    content: "Fix cycle 2: addressed all three review blockers. (1) Dispatch role-entry: hoisted the
      runner preflight in _spawnInvocation so resolveRunnerInvocation runs BEFORE
      _buildDispatchPrompt; passed the resolved adapterId into _buildDispatchPrompt and through to
      buildRoleEntryContext so adapter-specific role-entry tokens match the runner's adapter, not
      the legacy agent.adapter. (2) Required secret bindings: added resolveSecretEnv to
      src/agents/runners.ts that inspects runner.env.secrets, supports the user_env source from
      hostEnv, and throws RunnerResolutionError('missing_secret') for required bindings that cannot
      be resolved; resolved values overlay env.set with highest precedence and are never written to
      diagnostics. (3) oxlint cleanup: switched the acp-mock.js prompt-capture write to a template
      literal so focused changed-file oxlint is clean. Coverage: added one dispatch behavioral test
      for runner-resolved role-entry and six resolver tests for secret-binding handling (required
      missing source throws, required user_env missing throws, user_env injected, optional silently
      omitted, secrets not in diagnostics, secret overlays env.set). Quality gates: format:check /
      lint --quiet (0 errors) / focused oxlint on all changed files (0 warnings) / typecheck / full
      test suite all green (10037 passed / 5 skipped / 0 failed)."
