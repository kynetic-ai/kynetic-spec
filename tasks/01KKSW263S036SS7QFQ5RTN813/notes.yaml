    content: >-
      Execution context:

      - Background: Dispatch engine allows concurrent invocations for the same task across different
      agents, causing conflicts

      - Scope: Add cross-agent exclusivity check in handleStateChange() and _selectNextCandidate()
      so at most one invocation is active per task

      - Files: src/agent-runtime/dispatch.ts, tests/agent-dispatch-engine.test.ts

      - AC: @agent-dispatch-engine ac-26

      - Verification: Tests proving cross-agent exclusivity, existing tests still pass
    supersedes: null
