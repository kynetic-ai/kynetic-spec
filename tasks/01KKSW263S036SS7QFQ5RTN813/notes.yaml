  - _ulid: 01KKSZ1XT0SBZ78TQ9CKABYD06
    content: >-
      Implementation complete. PR #889 created.


      Changes:

      1. Added _hasActiveInvocationForTask(taskRef) method that checks both activeInvocationDetails
      and inFlightTaskKeys across all agents for cross-agent exclusivity.

      2. Added guard in _selectNextCandidate() to skip candidates whose task already has an active
      invocation by any agent. Entries remain queued (not discarded) so post-invocation drain picks
      them up.

      3. Added 4 tests covering: worker-blocks-reviewer, dual-agent-same-event,
      different-tasks-concurrent, and staleness-check-on-deferred-entries.


      All 5475 tests pass with 0 failures.
