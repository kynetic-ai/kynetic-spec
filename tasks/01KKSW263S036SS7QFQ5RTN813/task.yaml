title: Implement cross-agent task dispatch exclusivity
type: task
description: >-
  The dispatch engine currently allows multiple agents to have active invocations for the same task
  simultaneously. For example, when a task-worker submits a task (transitioning to pending_review),
  the file watcher detects the state change and dispatches a pr-reviewer — even though the
  task-worker invocation is still running (e.g., waiting for CI). This results in two agents working
  on the same task concurrently, causing conflicts.


  Root cause: handleStateChange() in src/agent-runtime/dispatch.ts (around line 828-837) loops
  through agents, matches dispatch rules, and calls _enqueue() without checking if any agent already
  has an active invocation for that task. The existing _hasActiveOrQueuedInvocation() check (line
  1112) is per-agent (agentId + taskId) and only called during batch re-evaluation
  (_evaluateAllTasks with skipIfActive), never during live event processing.


  The helper _activeTaskRefs() (line 1137) already returns all task refs with active invocations
  regardless of agent type — this can be used as the basis for a cross-agent guard.


  Implementation approach: Before enqueueing in handleStateChange() and before spawning in
  _selectNextCandidate(), check if any agent (not just the current one) has an active invocation for
  the task. If so, the entry should remain queued (deferred), not discarded. The post-invocation
  re-evaluation (ac-24 path at line 2166) already re-evaluates all tasks after an invocation
  completes and drains queues, so deferred entries will be picked up naturally.


  Key constraint: Deferred entries must still be subject to staleness checks
  (_pruneIneligibleQueueEntries) before spawn — if the task state changed while deferred, stale
  entries should be discarded as usual.


  Files: src/agent-runtime/dispatch.ts (handleStateChange, _selectNextCandidate, possibly
  _hasActiveOrQueuedInvocation or a new cross-agent variant), tests/agent-dispatch-engine.test.ts.


  AC coverage: @agent-dispatch-engine ac-26.
