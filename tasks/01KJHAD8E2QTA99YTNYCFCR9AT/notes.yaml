notes:
  - _ulid: 01KJHAEBJXW166DHNWR5EMFZSF
    content: "Root Cause: Ralph prompts embed raw JSON.stringify() of task/spec/session data inline. For
      large payloads, the JSON-RPC line exceeds the Codex Rust binary read buffer causing parse
      failures. Approach: 32KB total prompt budget with largest-first truncation. Truncated sections
      show a blockquote notice with CLI fetch command and compact identity summary. Changes: (1)
      subagent.ts — SUBAGENT_PROMPT_MAX_BYTES, formatJsonSection(), truncatePromptIfNeeded(),
      compactSummary(). Updated buildSubagentPrompt(). (2) ralph.ts — Updated buildTaskWorkPrompt()
      with same helpers. (3) ralph/index.ts — Exported new helpers. (4) tests/ralph.test.ts — 14 new
      tests covering formatJsonSection, truncatePromptIfNeeded, and end-to-end buildSubagentPrompt
      truncation. (5) Spec ac-10 updated to reflect truncation behavior."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-28T05:09:51.326Z
