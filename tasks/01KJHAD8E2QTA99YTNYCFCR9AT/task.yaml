title: "Fix: Truncate oversized ACP prompt payloads"
type: task
description: "Ralph subagent and worker prompts embed raw JSON.stringify() of task/spec/session data
  inline. For large payloads (tasks with many notes, large specs), the resulting JSON-RPC line
  exceeds the Codex Rust binary read buffer, causing 'agent_client_protocol::rpc: failed to parse
  incoming message'. The parser receives a partial fragment and fails. Observed on the review
  subagent path, but the worker prompt has the same vulnerability."
