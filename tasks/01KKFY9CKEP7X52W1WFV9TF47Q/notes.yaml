    content: >-
      Implemented dispatch workspace config resolution:

      - Added dispatch.base_branch and dispatch.worktree_root to kspec.config.yaml parsing/defaults.

      - Added resolver that validates configured branches, falls back to remote HEAD/current
      branch/main deterministically, and resolves worktree roots against projectRoot.

      - Dispatch engine now loads and validates resolved workspace config at startup so unusable
      settings fail early with guidance.

      - Verified with targeted tests, full npm test, and kspec validate (warnings only; existing
      repo-wide warning debt remains).
    supersedes: null
    author: Jacob Chapel
