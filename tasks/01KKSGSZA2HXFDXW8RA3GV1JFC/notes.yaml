    content: >-
      Implementation complete. Key changes:

      - New SessionEventAccumulator class (src/agent-runtime/session-event-accumulator.ts) with
      per-session state, newline-boundary flushing, 8KB max buffer, and state transition detection

      - New typed event types in @kynetic-ai/shared (MessageStart/Progress/Complete,
      ThinkingStart/Progress/Complete, ToolCallStart/Complete)

      - dispatch.ts: replaced onTextChunk with onSessionEvent, wired accumulator into update handler
      and session end

      - agent-dispatch.ts: broadcasts typed events instead of agent_text_chunk

      - ws-invalidation.ts: completion events trigger session query invalidation, progress events
      skip invalidation

      - CLI watch: consumes new typed events, shows tool call start/complete status in terminal

      - Web UI: session-utils.ts and all pages updated to consume new event types (with backwards
      compat for agent_text_chunk)

      - All 5492 tests passing
