      escalating SIGKILL when a resistant descendant survives leader exit. (2) Exclude retained
      ownership after durable session closure so sequential global/task stop stays noop after
      completed cleanup. (3) Extend spawn initialization with an immediate spawned-handle callback
      and abort race, publish ownership before ACP initialize, and verified-reap rejecting or
      hanging initialization. (4) Propagate non-ENOENT /proc member-read failures so unverified
      groups are never signalled or completed. Re-verify all stop/recovery ACs and full project
      gates."
