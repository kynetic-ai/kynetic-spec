  - _ulid: 01KKDAT7KWJT976JHMS83H9JWJ
    content: >-
      Execution context:

      - Background: plan import currently materializes specs/tasks immediately, but this task shifts
      import to content-only storage for iterative editing.

      - Scope: update plan import behavior, CLI flags/output, and AC-annotated tests for draft
      default, optional/stored module, status override, content-only import, and ignored --update.

      - Files: src/cli/commands/plan-import.ts plus adjacent plan import tests and any shared
      helpers the command depends on.

      - Verification: targeted plan import tests, kspec validate, then full npm test before submit.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-11T02:15:04.573Z
  - _ulid: 01KKDBFFEDET2WNHX2YZGDPY9V
    content: >-
      Implemented content-only plan import.

      - Changed plan import to create only a plan record, defaulting status to draft unless --status
      overrides it.

      - Made --module optional and persisted it as module_ref on the plan record for later derive.

      - Made --update a warning-only no-op, updated plan get/export surfaces for module_ref, and
      replaced the legacy import tests plus batch import expectation with content-only coverage.

      - Verification: npm run build; npm test -- tests/cli-plan-import.test.ts; npm test --
      tests/batch-exec-engine.test.ts; kspec validate (warnings-only repo debt); full npm test
      passed.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-11T02:26:40.717Z
