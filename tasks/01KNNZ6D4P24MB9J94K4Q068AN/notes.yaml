notes:
  - _ulid: 01KNP35S6Q07G12N2123N4T6MG
    content: >-
      Approach: 

      1. Add coverage section to config schema: { scan_paths: string[] } defaulting to empty array

      2. Replace findTestFilesRecursive extension filter with scanning ALL files in configured
      paths, using extension-to-comment-prefix map

      3. AC_LINE_PREFIX becomes getACLinePrefix(ext) returning appropriate regex per language

      4. scanTestCoverage(rootDir) → scanTestCoverage(rootDir, scanPaths) - skip scanning when empty

      5. scanACAnnotations(rootDir) → scanACAnnotations(rootDir, scanPaths) - same

      6. Thread config through: checkCompleteness, coverage-cache, json.ts, task.ts

      7. Add unconfigured warning in checkCompleteness when scan_paths empty and completeness
      enabled

      8. Update kspec.config.yaml with coverage.scan_paths for self-hosting

      9. Write tests for all 6 ACs


      Edge cases: unrecognized extensions skipped, empty scan_paths = no scanning, backward compat
      via config.

      Test plan: 6 ACs × 1+ test each. Tests for .rs/.py files, unconfigured warning, skip
      unrecognized ext.
    supersedes: null
    author: "@claude"
    created_at: 2026-04-08T08:26:07.960Z
  - _ulid: 01KNP5WF4KEVAMQTBSXWYQVPJE
    content: >-
      Implementation complete. All 6 ACs covered with 33 new tests in
      tests/coverage-scan-config.test.ts.


      Key decisions:

      - scan_paths defaults to empty array (explicit opt-in, not implicit scanning)

      - When scan_paths is empty, no files are scanned AND no missing_test_coverage warnings are
      generated (can't claim uncovered when not scanning)

      - coverage_not_configured warning emitted during completeness to surface the inactive state

      - Comment prefix map keyed by extension, getACLinePrefix() exported for test use

      - parseACAnnotationLine() accepts optional prefix param (default stays JS/TS for backward
      compat)

      - Daemon routes use lazy getCtx() to access config for coverage calls

      - Updated existing tests (ac-annotation-validation, coverage-cache, trait-ac-coverage) to
      provide scan_paths

      - Self-hosting: kspec.config.yaml now has coverage.scan_paths for tests/ and
      packages/web-ui/tests/e2e/


      Full test suite: 2092 suites, 7589 tests pass.
    supersedes: null
    author: "@claude"
    created_at: 2026-04-08T09:13:28.468Z
