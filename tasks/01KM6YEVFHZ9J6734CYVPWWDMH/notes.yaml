notes:
  - _ulid: 01KM7X27M8ZG0P3PFSYH5G2531
    content: "Implemented withWriteBuffer() in TaskDataManager that wraps all task mutations
      (createTask, mutateTask, mutateTasks, deleteTask) in a write buffer scope. For split format,
      the manager activates a buffer before calling the backend, and the backend detects it via
      getActiveBatchBuffer() — reusing it instead of creating a local buffer. For monolithic format,
      buffer is skipped (single-file writes are atomic under file lock). When a batch buffer is
      already active, the manager reuses it. Added 12 tests across all 4 ACs covering: single buffer
      transaction for create/mutate/delete (ac-1), rollback on failure (ac-2), batch buffer reuse
      (ac-3), multi-task atomic operations (ac-4). Full test suite passes (6831 tests, 0
      regressions)."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-21T09:54:16.329Z
