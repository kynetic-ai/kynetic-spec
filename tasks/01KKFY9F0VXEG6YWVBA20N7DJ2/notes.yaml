  - _ulid: 01KKHHEP38FKCEVWXDHJQJ31WB
    content: >-
      Execution context:

      - Background: dispatch workspaces already persist canonical branch and base-branch identity,
      but they do not yet expose an explicit integration/publication contract to worker and reviewer
      invocations.

      - Scope: extend dispatch workspace metadata and runtime prompt/env wiring so integration
      target branch, branch-point commit, publication mode, and integration outcome are recorded and
      surfaced deterministically.

      - Files: src/agent-runtime/workspace.ts, src/agent-runtime/dispatch.ts, related dispatch
      workspace/orientation tests.

      - Verification: npm test -- tests/canonical-task-workspace-contract.test.ts
      tests/dispatch-workspace-config.test.ts tests/agent-dispatch-engine.test.ts and kspec
      validate.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-12T17:28:03.944Z
  - _ulid: 01KKHHNH0XVWDB04R4PP2MEMRH
