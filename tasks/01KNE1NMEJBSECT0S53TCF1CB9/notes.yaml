    content: "Approach: reuse the existing runtime already passed into packages/daemon/src/server.ts and
      expose it on the /api/health payload instead of re-resolving config in the route. Edge cases:
      keep bun default behavior intact, keep node/bun startup parity, and update any shared response
      schema/tests that parse the health payload. Test plan: add AC coverage by asserting health
      JSON includes the active runtime in daemon startup coverage, plus update direct health
      endpoint assertions that depend on the response shape."
