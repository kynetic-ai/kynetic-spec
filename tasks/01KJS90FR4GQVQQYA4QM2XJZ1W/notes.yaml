  - _ulid: 01KJV53DW3TSK6HJ5SRC8PC78Z
    content: >-
      Implemented adapter-aware skill token rewriting in buildPromptWithSkills.

      - Added adapterId-aware substitution of {skill:foo} for claude-agent-acp/claude-code-acp and
      codex-acp.

      - Mapping checks .agents/skills naming (kspec-* directories) so core skills become /kspec:<id>
      (Claude) and -<id> (Codex); non-core references become /<id> or $<id>.

      - Unknown adapters keep portable {skill:foo} tokens unchanged.

      - Passed adapterId from runtime invocation and CLI agent dry-run path.

      - Added AC-10 tests in tests/agent-invocation-lifecycle.test.ts for Claude, Codex, and unknown
      adapter behavior.

      Verification: npm test -- tests/agent-invocation-lifecycle.test.ts (pass), npm test (pass).
      kspec validate currently reports pre-existing repo-level validation failures unrelated to this
      task.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-04T00:48:54.659Z
