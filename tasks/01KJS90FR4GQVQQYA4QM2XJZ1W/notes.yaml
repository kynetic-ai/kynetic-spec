      - Files: src/agent-runtime/prompts.ts, src/agent-runtime/invocation.ts,
      src/cli/commands/agent.ts, tests/agent-invocation-lifecycle.test.ts.

      - Verification: npm test -- tests/agent-invocation-lifecycle.test.ts and targeted CLI dry-run
      checks via tests for prompt building.
