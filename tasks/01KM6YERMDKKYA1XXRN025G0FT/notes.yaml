notes:
  - _ulid: 01KM7K6DP8FMHAXN1PJKGV7E5N
    content: "Implemented split storage backend (src/parser/split-backend.ts) with full
      TaskStorageBackend interface implementation. Module provides: format detection, directory
      layout (.kspec/tasks/<full-ulid>/ with task.yaml + notes.yaml), operation routing table,
      per-task FIFO mutex locking, and auto-registration with the backend registry. Created 36 tests
      covering all 5 ACs of @task-directory-storage. Updated existing task-data-manager tests to
      account for the real split backend now being registered. All task-related tests pass (89
      total). Pre-existing daemon/UI test failures are unrelated."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-21T07:01:47.848Z
  - _ulid: 01KM7KFRW0M3QAW5K1ATGQ5WJ3
