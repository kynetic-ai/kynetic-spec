    content: >-
      Approach: 14 skipped e2e specs to migrate (api-triage.spec.ts excluded - NOT skipped, uses
      WebSocket/page fixture).


      Pattern: Create shared test helper in tests/daemon-api/helpers.ts with:

      - setupFixtures(): copies e2e fixture YAML files into temp dir structure

      - makeRequest(): wraps app.handle(new Request(...))

      - createApp(): assembles Elysia app with all route plugins + PubSubManager


      Each migrated test file: import shared helper, convert request.get/post/delete to makeRequest,
      convert Playwright expect to vitest expect (response.status() → response.status, etc.)


      Special cases:

      - api-server.spec.ts: uses raw HTTP for localhost security tests - will need raw request
      handling

      - api-projects.spec.ts: uses ProjectContextManager - needs special route setup  

      - api-sessions-*.spec.ts: create session directories at runtime

      - api-agent-dispatch.spec.ts: tests dispatch engine start/stop


      Test plan: 14 specs × behavioral tests each, all existing assertions preserved. Run full test
      suite to confirm no regressions.
