    content: >-
      Execution context:

      - Why: current dispatch cannot prioritize active in_progress work because no in_progress
      dispatch event exists and queueing is FIFO by arrival.

      - Scope:
        1) add/validate in_progress-compatible dispatch event semantics in schema/runtime mapping,
        2) apply deterministic status precedence with in_progress at top,
        3) include bootstrap handling for existing in_progress tasks,
        4) update built-in worker defaults from setup seeding if needed,
        5) add/adjust tests in dispatch engine and setup/agent-seeding coverage.
      - Candidate files: src/schema/meta.ts, src/agent-runtime/dispatch.ts,
      src/cli/commands/setup.ts, tests/agent-dispatch-engine.test.ts,
      tests/ralph-replacement.test.ts.

      - Verification: targeted dispatch tests + setup seeding tests + full npm test.
    supersedes: null
