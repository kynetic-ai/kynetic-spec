notes:
  - _ulid: 01KNE8FKDBM5S73MCDY0QMJD72
    content: "Approach: add a websocket connection state manager backed by WeakMap and thread it through
      server, pubsub, heartbeat, handler, and lifecycle while leaving framework-owned ws.data
      untouched for transient open/close context. Reuse existing pubsub stable session mapping and
      only fall back to transport subscriptions/context IDs when mapping is absent. Edge cases:
      close callbacks after connection state removal, broadcasts for sockets with missing state,
      heartbeat reads after disconnect, tests that currently assume mutable ws.data. Test plan: add
      manager unit coverage for init/get/remove and update websocket pubsub/handler/heartbeat/close
      tests to exercise behavior through connection state instead of ws.data mutation, covering
      @daemon-runtime-adapter ac-connection-state and ac-websocket-parity."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-05T07:24:57.131Z
  - _ulid: 01KNE8Z1ZRHWFRSJ3WAY3QHZY6
    content: "Implemented ConnectionStateManager-backed websocket state storage and threaded it through
      server open, pubsub, heartbeat, handler, and close cleanup so daemon-owned per-connection
      metadata no longer lives on ws.data. Verification: targeted daemon websocket tests passed
      (daemon-connection-state, pubsub, heartbeat, websocket-handler, websocket-close) and npm run
      typecheck passed. kspec validate returned only repo-wide pre-existing warnings. Full npm test
      was started uncached, continued executing green tests, and then exhibited the existing
      teardown-hang behavior tracked elsewhere rather than returning a final result."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-05T07:33:23.576Z
  - _ulid: 01KNE9D0EJKADS0Q6CQSCXZ2EB
