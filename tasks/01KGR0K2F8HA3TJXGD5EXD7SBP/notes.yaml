notes:
  - _ulid: 01KGR162P9SW7BPJV7M577377B
    content: "Additional plan import issue: derive_from_specs copies the full Implementation Notes
      section verbatim to ALL derived tasks. For batch-exec plan, all 3 tasks got identical 7-point
      architecture notes even though most points are only relevant to the parent feature task.
      Implementation Notes should either: (a) only go to the parent feature's task, (b) be scoped
      per-spec if the plan format supports it, or (c) be attached to the plan record only, not
      duplicated into tasks."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-05T23:11:20.265Z
  - _ulid: 01KGR2RQFJN9BH2S9RQZCMMK95
    content: "Additional issue: derive_from_specs doesn't infer task dependencies from spec hierarchy.
      When a feature has child requirements, the parent feature's task should depends_on the
      children's tasks (children are building blocks for the parent). Currently all derived tasks
      have empty depends_on and must be set manually."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-05T23:38:59.954Z
  - _ulid: 01KGR4J0T35FN8JFBN6BQVDP5T
    content: "Fixed: createSpecItem() in yaml.ts now includes acceptance_criteria in return object. Also
      fixed dry-run path in plan-import.ts to pass acceptance_criteria to createSpecItem(). Added
      unit tests (createSpecItem preserves/omits AC) and integration test (imported specs have ACs
      via item get --json). All 47 plan import tests pass."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-06T00:10:17.284Z
