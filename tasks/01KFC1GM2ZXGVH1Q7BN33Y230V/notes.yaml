    content: >-
      Implementation notes (auto-generated from spec):


      Validation checks that specs implementing traits have test coverage for all trait AC. Uses the
      existing completeness check infrastructure with test annotation scanning.



      Acceptance Criteria:

      - ac-1: Given spec implementing trait, when trait AC has no test annotation, then completeness
      warning emitted

      - ac-2: Given spec implementing trait, when trait AC has test annotation '// AC: @trait-ref
      ac-N', then no warning for that AC

      - ac-3: Given kspec validate run, when spec has traits, then trait AC coverage included in
      completeness check (no special flag needed)

      - ac-4: Given trait deleted, when spec still references it, then validation reports broken ref
      error
