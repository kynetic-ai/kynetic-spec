      Fix cycle 6: addressed the cycle-5 blocker on TS-wrapped null/undefined initializers in
      tools/eslint-rules/no-leaky-test-daemon.js. Root cause: isNullOrUndefinedInitializer only
      matched bare Literal null, Identifier undefined, and UnaryExpression void; TSAsExpression /
      TSSatisfiesExpression / TSNonNullExpression / TSTypeAssertion / TSInstantiationExpression /
      ParenthesizedExpression / ChainExpression around those nodes (e.g. const pid = undefined as
      number | undefined) escaped the placeholder check, so the declarator was treated as concretely
      value-producing and the cleanup closure was accepted even though the runtime value at
      registration time was still undefined.


      Fix: call unwrapTransparentExpression at the top of isNullOrUndefinedInitializer (same
      fixed-point loop the kill-target analysis uses) before the structural classification. The
      unwrap is shared between the declarator-init leg and the assignment-RHS leg of
      findConcreteBindingInStatements / inspectStatementsForBinding, so wrapped placeholders are
      caught regardless of whether the binding is initialised at declaration or reassigned later.
      The hoisted nested-function-declaration order keeps the call site valid even though
      unwrapTransparentExpression is defined later in the file.


