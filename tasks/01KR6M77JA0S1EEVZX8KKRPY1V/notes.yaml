      ac-approved-daemon-helper-boundary-explicit.


      Fix: when the walk encounters a FunctionExpression or ArrowFunctionExpression, the predicate
      now inspects its immediate parent and returns true for: Property whose value === function
      (object-property method bindings — shorthand and longhand), MethodDefinition whose value ===
      function (class instance/static methods), PropertyDefinition whose value === function
      (class-field arrows/functions), and plain '=' AssignmentExpression whose right === function
      and left is Identifier or MemberExpression (assignment-to-binding helpers like helper.start =
      function () {}). The path allowlist still gates rule entry, so the shared fixture
      (tests/helpers/daemon.ts, mock-daemon.ts, the rule itself, and the lint test files) stays
      exempt. The localWrapperUnsafe diagnostic message was updated from 'function/arrow' to
      'function, arrow, or method (object property, class method, or function reassigned to a
      binding)' so the message matches the AST shapes the predicate now covers.


