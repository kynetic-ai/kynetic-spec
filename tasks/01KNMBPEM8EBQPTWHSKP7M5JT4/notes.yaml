  - _ulid: 01KNMWX2M82C5YN396AYY5N4HH
    content: "Fix cycle 2: closed the remaining daemon structured-output regressions.
      isJsonMode()/isYamlMode() now read request-local output state, review command handlers rethrow
      the daemon's intercepted process-exit sentinel instead of formatting a second error payload,
      and added regression coverage for concurrent async-local mode isolation plus daemon-executed
      review get --json error parity. Re-verified with npm test --
      tests/output-format-option.test.ts, npm test -- tests/daemon-command-api.test.ts, npm test --
      --fresh, and kspec validate (warnings only: existing repo-wide validation debt)."
