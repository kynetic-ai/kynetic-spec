title: "Implement: ANSI Terminal Output Rendering"
type: task
description: >-
  Implement ANSI terminal color rendering in the web UI session stream.


  Spec: @ansi-terminal-rendering (8 ACs)


  Integration point: packages/web-ui/src/lib/components/session/ToolCallView.svelte (line ~112, the
  <pre> tag rendering outputText).


  Approach:

  1. Add ansi-to-html (or similar) package to packages/web-ui/

  2. Create a shared utility (e.g. lib/utils/ansi.ts) that converts ANSI SGR sequences to styled
  HTML spans

  3. In ToolCallView.svelte, pipe outputText through the ANSI parser before rendering with {@html}

  4. Support standard 16 colors, 256-color (38;5;N), and 24-bit true color (38;2;R;G;B)

  5. Define ANSI color palette as CSS custom properties using oklch, integrated with existing token
  system in tokens.css

  6. Handle graceful degradation: if ESC chars (0x1B) were stripped, detect orphaned CSI parameters
  like [32m and strip them for clean plain text

  7. HTML-escape all non-ANSI content before insertion (XSS safety) — DOMPurify already in codebase

  8. Strip non-SGR codes (cursor movement, clear screen) rather than rendering them

  9. Pipeline: ANSI parsing applies only to tool/bash output in <pre> blocks — never touches
  markdown-rendered agent text


  Data flow: events.jsonl → daemon API → session-utils.ts parseEventsToBlocks() →
  ToolCallView.svelte

  ANSI codes survive JSON serialization as UTF-8.
