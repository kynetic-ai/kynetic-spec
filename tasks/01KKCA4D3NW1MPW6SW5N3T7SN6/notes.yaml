  - _ulid: 01KKCSX77W6JD0ECQGKE0YXTBX
    content: "Fix cycle 3: Added safeTruncateAnsi() that strips trailing partial ESC sequences after
      slicing, so the 1000-char preview cutoff never leaves dangling ESC bytes. ToolCallView now
