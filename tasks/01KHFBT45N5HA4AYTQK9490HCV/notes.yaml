  - _ulid: 01KHG1G0GZWS7943C1ZSVVQX2E
    content: >-
      Implemented kspec skill update command with all 3 ACs:


      - ac-1: When core skill version differs from kspec package version, content and version are
      updated

      - ac-2: Core skills already at current package version are skipped

      - ac-3: Skills with origin custom/project are not touched (only origin 'core' processed)


      Added 17 tests in tests/core-skill-update.test.ts covering all ACs plus dry-run, JSON output,
      and edge cases.
    supersedes: null
