  - _ulid: 01KG61ZPW97H3XFT64EVDQQJNS
    content: >-
      Fixed CI re-verification enforcement in pr-review-merge and pr-review-loop workflows:


      1. Added CRITICAL note to pr-review-merge description: After ANY push, must re-verify CI from
      beginning

      2. Updated step 2 (CI passes) on_fail: Explicitly wait for CI to re-run completely before
      continuing

      3. Updated step 4 (feedback addressed) on_fail: Added 'RETURN TO STEP 1' instruction after
      pushing

      4. Added new FINAL CI VERIFICATION step before merge decision: Requires fresh CI check on
      current HEAD

      5. Updated pr-review-loop description with same CRITICAL note

      6. Updated pr-review-loop CI check step: Emphasized must execute EVERY time changes pushed,
      verify against current HEAD


      This prevents agents from barreling through the workflow after pushing fixes without
      re-checking CI status.
    supersedes: null
