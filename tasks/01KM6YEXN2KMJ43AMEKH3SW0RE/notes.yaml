notes:
  - _ulid: 01KM99T40NF3JSN3TQ5WYHVFGD
    content: "Audit finding (session eval, 2026-03-21): AC-4 has no implementation yet — no CLI command
      exists to persist the task_storage.format setting in kynetic.yaml. The schema field exists
      (ManifestSchema.task_storage.format), resolveTaskDataManager() reads it correctly, and
      ensureMigrated() validates migration completeness. What's missing is the command to flip the
      switch. This task needs to build that command as part of its scope. AC-2 also lacks a test
      annotation but is behaviorally covered by per-task-files.test.ts."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-21T22:56:16.405Z
  - _ulid: 01KM9FDF9B7T8NZGME66CXPQ4Q
    content: "Implemented AC-4: Added 'kspec task storage activate' CLI command. The command validates
      migration completeness (checks for unmigrated monolithic entries), persists
      task_storage.format=split in the manifest, and commits to shadow branch. Also added 'kspec
      task storage status' for inspecting the current format. AC-1,2,3,5 were already fully
      implemented in resolveTaskDataManager/ensureMigrated. Added 10 E2E tests covering: format
      persistence, next-operation effect, JSON output, idempotent re-activation, unmigrated
      rejection, post-migration activation, and status reporting."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-22T00:34:13.419Z
