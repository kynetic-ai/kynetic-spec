  - _ulid: 01KV4D28FAE06NJ84QM0WSPRE7
    content: |-
      Approach for @actor-identity-resolution ac-1..ac-5 + trait-api-endpoint ac-1, ac-6:

      Architecture:
      - Shared classifier in packages/shared/src/actor.ts (pure, no daemon deps) so the
        daemon endpoint, the write-time upgrade step (@task-actor-normalization-upgrade),
        and the web UI all consume one implementation.
        - classifyActor(actorString, config): { kind: human|agent|unknown, canonicalId,
          displayName, original }. Pure function of (string, config) -> deterministic (ac-5).
        - Recognition is data-driven + algorithmic: lowercase/trim, strip leading @,
          strip email domain (codex@openai.com -> codex), strip role suffix (codex-reviewer
          -> codex). Exact canonical/alias matches win before suffix stripping so canonical
          ids that end in -reviewer/-worker (pr-reviewer, task-worker) are not mangled.
        - Non-derivable aliases (e.g. pr-reviewer recorded as @dispatch/@kspec) are carried
          as per-identity `aliases` in the config so shared code stays project-neutral
          (no Kynetic agent names baked into shipped src).
        - Unknown strings preserve the original and never throw (ac-4).
      - Identity endpoint GET /api/identity (daemon route) returns the ActorIdentityConfig:
        human identity (author via getAuthor() chain per @config-author + optional
        display_name) and the canonical agent roster from meta agent definitions
        (id + display name). Single bounded response, no entity-list fan-out (ac-1).
        Envelope via wrapResponse; X-Request-Id via onTransform (trait ac-6).
      - Web UI: fetch /api/identity + re-export classifyActor as a shared lib utility fed
        by the payload (static-mode/web consumption).

      Variant table seeded from analysis.md section 4.6 measured inventory (codex >=7
      spellings, pr-reviewer 4 ways, @claude, Jacob Chapel human, Test User unknown) -
      used as the behavioral test corpus.

      Test plan: shared unit tests (ac-2..ac-5) over the measured strings; daemon-api
      integration test for /api/identity (ac-1, trait ac-1, trait ac-6 X-Request-Id).
      Trait ac-2/3/4/5 are N/A (no entity-ref param, no request body, not a list endpoint,
      read-only) - annotated with reasons.
    supersedes: null
    author: "@claude"
    created_at: 2026-06-15T01:06:49.450Z
  - _ulid: 01KV4EJDHSD1XNYWJ9NZQBE5A6
    content: |-
      Implemented and verified. Summary of changes:

      - packages/shared/src/actor.ts — pure actor classifier classifyActor(string,
        config) + buildActorClassifier(config) returning { kind, canonicalId,
        displayName, original }. Recognition: case/whitespace-insensitive, leading-@
        strip, email-suffix strip, role-suffix strip, plus explicit per-identity
        aliases for non-derivable spellings. Exact matches win before suffix
        stripping (pr-reviewer/task-worker not truncated). Never throws; unknown
        preserves original. Zod schemas for the wire payload.
      - packages/daemon/src/routes/identity.ts — GET /api/identity: bounded payload
        { human, agents } from getAuthor() chain + meta agent roster. wrapResponse
        envelope; X-Request-Id via onTransform. Registered in server.ts + test app.
      - src/parser/config.ts — optional identity.display_name + identity.aliases on
        the resolved config (defaults null / []).
      - web UI — fetchIdentity (daemon + static fetchIdentityStatic) and
        $lib/utils/actor re-export so the same classifier runs client-side fed by
        the identity payload. Static mode builds the roster from the snapshot
        (human null; documented limitation — no author in static export).

      Applied @trait-api-endpoint to @actor-identity-resolution.

      AC coverage:
      - ac-1: tests/daemon-api/identity.test.ts (endpoint shape) +
        tests/web-ui/api-static.test.ts (static payload) + config resolution test.
      - ac-2/3/4/5: tests/actor-classifier.test.ts, corpus seeded from analysis.md
        §4.6 (codex >=7 spellings, pr-reviewer aliases, @claude, human, Test User).
      - trait ac-1, ac-6: identity.test.ts (200 JSON, X-Request-Id).
      - trait ac-2/3/4/5: N/A annotations in identity.test.ts (no entity-ref param,
        no body, not a list, read-only).

      Gates: typecheck (src), build:shared, build:daemon, format:check, lint
      (0 errors), full suite (10595 passed / 0 failed), kspec validate
      refs/alignment/completeness all green.

      Scope note: spec ac-6/ac-7/ac-8 (write-time author resolution + canonical
      persistence/rejection) are owned by @task-review-author-resolution and
      @task-actor-normalization-upgrade, which reuse this shared classifier. The
      non-derivable agent aliases (e.g. pr-reviewer recorded as @dispatch/@kspec)
      are supported via config aliases and seeded by the upgrade task.
