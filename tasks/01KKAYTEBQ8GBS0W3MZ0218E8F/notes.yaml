  - _ulid: 01KKAZ1T25Q8VZTHAFF74H345B
    content: "Additional scope: Add a development convention or documentation reinforcing that all URL
      mutations in the web UI must use goto() from $app/navigation — never replaceState, pushState,
      or window.history methods. This prevents future regressions. Options: (1) Add a rule to the
      development or web-ui conventions via kspec meta, (2) Add a comment block at the top of a
      shared helper, (3) Both. The convention should explain WHY (replaceState/pushState don't
      update $page.url, causing stale reactive state) and reference the SvelteKit issue #10661."
