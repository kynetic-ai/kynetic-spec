  - _ulid: 01KTMWNWKFW2JV604D2514MZWX
    content: "Implemented. Added packages/web-ui/src/lib/utils/resource-links.ts as the shared
      project-aware rewrite core (./resources/<path> -> <base>/<encoded-id>/bytes, appends
      ?kspec_dir from the project store like reviewResourceBytesUrl). rewritePlanResourceLinks and
      rewriteTaskResourceLinks now delegate to it; plan rewrites all declared resources, task
      rewrites only status==='present' resolved resources so drift/missing/unresolved/unmatched refs
      stay raw. TaskDetailContent.svelte rewrites task.description via
      rewriteTaskResourceLinks(resolved_resources, resources_base_url) before renderMarkdown and
