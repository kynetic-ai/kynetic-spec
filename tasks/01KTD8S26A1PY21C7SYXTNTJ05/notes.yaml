      task-resource-links.test.ts (4), resource-url-project-context.test.ts plan group (2), and
      resource-url-browser-fetch-contract.test.ts (6); updated the stale no-kspec_dir plan guard to
      assert the project-scoped URL + project-B bytes. Added project-store mocks to the previously
      un-mocked plan rewriter tests (plan-resource-links, plan-embedded-content,
      plan-embedded-views) since the shared core imports the store. Gates: full suite 10343 passed /
      0 failed / 5 skipped; typecheck clean; svelte-check adds 0 new problems over the 61-error
      pre-existing baseline; format clean; lint 0 errors; kspec validate refs/alignment/completeness
      OK. All 9 covered ACs annotated."
