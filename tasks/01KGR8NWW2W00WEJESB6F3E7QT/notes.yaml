  - _ulid: 01KGR8P4M55NS4ZAVS48YJQFHR
    content: "AC-13 currently says: 'Implementation notes are added as initial note to all derived
      tasks.' After PR #320 (fix/plan-import-scope-implementation-notes), the actual behavior is:
      (1) per-spec implementation_notes fields go to their corresponding derived task only, (2)
      global ## Implementation Notes attach to the plan record, (3) tasks without per-spec notes get
      a reference: 'See plan @plan-ref for implementation notes'. The AC wording should be updated
      to match this new behavior."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-06T01:22:26.565Z
