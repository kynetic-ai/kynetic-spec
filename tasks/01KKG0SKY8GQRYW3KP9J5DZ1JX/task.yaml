title: Restore live embedded item loading on plans page
type: bug
description: >-
  Repro:

  - Open `/plans` in live daemon mode and expand
  `@plan-ui-wide-markdown-rendering-plan-embedded-views`, `@plan-session-storage-separation`, or
  `@plan-skill-system-portability`.

  - Observed: `GET /api/plans/:ref` succeeds, but the page never issues `POST /api/items/batch`; the
  content falls back to raw YAML code blocks with no embedded loading or error state.


  Scope:

  - Fix the plans-page embedded-content load path so expanding a plan with derived specs/tasks
  actually fetches batch summaries and hands them to the embedded renderer.

  - Preserve existing graceful fallback behavior when the batch request truly fails.

  - Add runtime coverage that exercises the real fetch path instead of only parser-level behavior or
  fully stubbed batch rendering.
