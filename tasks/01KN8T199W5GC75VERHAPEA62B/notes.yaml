    content: "Approach: update @dispatch-remote-branch-sync pull/sync ACs via one kspec batch, reusing
      the approved wording from @plan-workspace-scoped-integration-target-sync and matching the
      adjacent push-side spec style. Edge cases: startup sync must complete before bootstrap
      evaluation, periodic sync must defer only the busy target, staleness must remain isolated per
      target, and one target failure must not stop the remaining sync cycle. Test plan: spec-only
      task, so verification is kspec item get plus kspec validate to confirm the rewritten/new AC
      surface is present and structurally valid."
