title: Add AC schema field validation to detect drift
type: task
description: >-
  Check acceptance criteria for field references (item.field, status.field, etc.) that don't exist
  in the actual schema. Catches drift between spec prose and implementation reality.


  Research findings from @01KFBDQE:

  - ACs reference 'children' but SpecItem has no children field (hierarchy is parse-time only)

  - ACs reference 'spec_ref.children' but spec_ref is just a string

  - ACs describe cascade operations that aren't schema-queryable


  Implementation approach:

  - Add checkACSchemaReferences() function similar to checkStaleness()

  - Extract field patterns from AC then clauses

  - Validate against SpecItem/Task schema fields

  - Add --drift flag to validate command

  - Report CompletenessWarning with type 'ac_schema_field_mismatch'
