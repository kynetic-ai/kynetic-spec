  - _ulid: 01KHDPW293AV70B36GWSHH36GY
    content: >-
      Implemented AC schema drift detection with:

      - checkACSchemaReferences() function that extracts field patterns from AC given/when/then
      clauses

      - Validates against actual SpecItem and Task schema fields

      - Detects conceptual fields like 'children' and 'parent' that exist at parse-time but aren't
      queryable

      - Detects refs like 'spec_ref.field' where spec_ref is actually a string, not an object

      - Added --drift flag to validate command

      - File extension filtering to avoid false positives (spec.yaml, task.json, etc.)

      - 8 tests covering: invalid fields, ref strings, valid fields, status fields, flag presence,
      exit codes, multiple drift issues
    supersedes: null
    author: "@claude"
    created_at: 2026-02-14T09:14:23.907Z
