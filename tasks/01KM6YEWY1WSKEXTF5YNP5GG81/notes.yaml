  - _ulid: 01KM8VT0KQ6CGJD0YMANYMWBQ6
    content: "Fix cycle 4: Addressed both blockers. (1) AC-8 atomicity test now uses a real shadow
      branch with kspec init, writes monolithic tasks, runs migrate, and counts commits — asserts
      exactly 1 new commit and clean working tree. (2) Replaced comment-only trait AC claims with
      executable tests: @trait-dry-run ac-4 breaks the shadow worktree to trigger initContext error
      during dry-run and verifies no state change; @trait-error-guidance ac-1/ac-2 uses a read-only
      tasks directory to trigger EACCES during flush and verifies error description + suggestion;
      @trait-error-guidance ac-6 same with --json verifying structured error object. All 22
      migration tests pass. Full suite: 6916 passed, 1 pre-existing failure unrelated to this
      change."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-21T18:51:32.855Z
