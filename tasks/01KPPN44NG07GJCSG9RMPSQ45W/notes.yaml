  - _ulid: 01KPR439YKNHN97541FE6CTMR2
    content: >-
      Approach: Using Pagefind Node.js indexing API (addCustomRecord) to build a search index from
      the bundled docs manifest at build time. The SPA bundles docs markdown into JS via
      vite-plugin-docs — no pre-rendered HTML exists. Solution: 1) Post-build script reads the docs
      manifest, renders markdown to HTML, feeds each entry into Pagefind's addCustomRecord() with
      url/content/meta. 2) Search index written to build/pagefind/. 3) Svelte search component in
      docs layout lazily imports Pagefind client JS and provides search UI. 4) Index ships with
      static build — no network requests to non-local hosts. Works identically offline and on public
      deployment.

      Edge cases: Empty query, no results, special characters, base path handling for GitHub Pages.

      Test plan: 3 ACs × behavioral tests: ac-1 (search returns matching pages), ac-2 (offline/local
      — no non-local network requests), ac-3 (same results on public deployment = same index).
    supersedes: null
    author: "@claude"
    created_at: 2026-04-21T13:36:26.067Z
  - _ulid: 01KPR5NGYZD3TVX0VVFJ1AAARG
    content: >-
      Implementation complete. Added Pagefind-based docs search with:

      1. Post-build indexing script (scripts/build-docs-search.cjs) - scans docs dir, strips
      markdown to plain text, feeds into Pagefind Node.js API, writes self-contained search index to
      packages/web-ui/build/pagefind/

      2. DocsSearch.svelte component - search input in docs sidebar and landing page, lazily loads
      Pagefind client on first focus, debounced search, SPA navigation via goto()

      3. Build pipeline integration - build:docs-search chained into build:web-ui, both GH Pages
      workflows updated with BASE_PATH

      4. 20 tests covering all 3 ACs - index structure, base path handling, build pipeline wiring,
      component integration, real project indexing

      All 8318 tests pass (0 failures, 5 skipped).
    supersedes: null
    author: "@claude"
    created_at: 2026-04-21T14:03:51.647Z
