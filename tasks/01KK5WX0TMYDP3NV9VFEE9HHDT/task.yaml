title: Fix derive middleware setting 400 on static file responses
type: task
description: "The derive middleware in packages/daemon/src/middleware/project-context.ts runs on
  every request including static files. When no .kspec/ project is registered, it sets status 400 on
  all responses, breaking dynamic ES module imports in the web UI. Fix: skip project context
  resolution for non-API routes and /api/health. Also add / to SPA fallback routes. See GitHub issue
  #689."
