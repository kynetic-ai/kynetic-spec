title: Add platform override for skill install-core to support Codex .agents output
type: task
description: "What: `kspec skill install-core` currently relies on environment auto-detection and
  has no explicit platform selector. In Codex-misdetection scenarios, it installs/updates
  `.claude/skills` instead of `.agents/skills`, which blocks intended Codex skill delivery. Where:
  skill install-core command and platform resolution path used by core skill rendering/install. How:
  add `--platform <claude-code|codex>` (or equivalent explicit target) for install-core; when set to
  codex, force install to `.agents/skills` regardless of detection. Keep current auto-detect default
  for backward compatibility. Add tests for codex forced output path and default behavior. Done
  when: running `kspec skill install-core --platform codex` writes/updates `.agents/skills/*` and
  does not require Codex env detection to be correct."
