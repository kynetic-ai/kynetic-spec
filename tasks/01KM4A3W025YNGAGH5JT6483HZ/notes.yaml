    content: 'Reflection evidence from @task-test-result-ingestion-interface session: full npm test
      initially looked like a post-green hang while many suites had already printed PASS, but it was
      still draining slow session/dispatch/meta suites and eventually exited successfully after
      3168.7s (2899 suites passed, 11011 tests passed, 3 skipped). During the run, ps briefly showed
      a vitest worker and child CLI process (dist/cli/index.js meta observe success "Good thing")
      before later suites completed. This supports investigating both true teardown hangs and
      misleading long-tail/no-progress intervals after green-looking output.'
