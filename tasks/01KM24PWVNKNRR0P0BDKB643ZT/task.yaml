title: Fix DEFAULT_KSPEC_CLI_PATH pointing to nonexistent bin/kspec.cjs
type: bug
description: >-
  **What:** `DEFAULT_KSPEC_CLI_PATH` in `src/agent-runtime/invocation.ts:36-39` resolves to
  `../../bin/kspec.cjs` relative to the dist output, producing a path (`<root>/bin/kspec.cjs`) that
  has never existed. Fix it to point to `../cli/index.js` (resolving to `dist/cli/index.js`), which
  is the actual CLI entrypoint declared in `package.json` `"bin"`.


  **Why:** This breaks all `spawnSync(process.execPath, [kspecCliPath, ...args])` call sites:

  - `kspec` action type in ActionExecutor (`src/agent-runtime/action-executor.ts:693`) —
  schedules/hooks using kspec actions fail instantly

  - `_runKspecCommand` in DispatchEngine (`src/agent-runtime/dispatch.ts:2132`) — dispatch task
  notes (`[AGENT-TIMEOUT]`, `[AGENT-FAIL]`, `[DISPATCH-BOOTSTRAP]`) silently never written

  - `runKspecCli` in invocation.ts — timeout/failure notes lost


  Broken since the original invocation commit (027bcd31d); never caught because task state
  transitions and agent spawning use library calls, not CLI.


  **How:** Change the path in `DEFAULT_KSPEC_CLI_PATH` from `../../bin/kspec.cjs` to
  `../cli/index.js`. Verify by running a kspec schedule action with the daemon and confirming
  `action.completed` instead of `action.failed`.
