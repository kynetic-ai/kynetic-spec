title: Fix daemon dist module import failures in test runner
type: task
description: "npm test on snapshot 343472d01808d514accacb66d1bb86db4519b37f fails in
  tests/daemon-read-path.test.ts and tests/daemon-triage-write-through.test.ts because Vitest cannot
  import ../dist/daemon/server.ts and ../dist/daemon/middleware/project-context.ts after the test
  runner build step. Reproduce with: npm test and npm test -- tests/daemon-read-path.test.ts
  tests/daemon-triage-write-through.test.ts --fresh. Investigate why build output does not provide
  dist/daemon/* modules expected by these suites, then fix either the build output or the test
  imports so daemon suites run against valid compiled targets. This failure is present on the
  reviewed snapshot itself, which matches the integration target tip, so it is not introduced by
  task @01KNMBPC0GJ184YT6G3T43TNGB."
