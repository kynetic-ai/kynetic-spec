description: >-
  Full-suite review run for @01KR3W7Q0H2FVXHDJ51WCFAVNN on 2026-05-08 failed two tests that passed
  on immediate focused rerun and are not in the task delta from origin/dev.


  Observed failures:

  - tests/helpers/daemon.test.ts: startTestDaemon happy path spawns a Node daemon on a dynamic
