  but received loading at line 211.

  - tests/daemon-api/websocket-protocol.test.ts: daemon websocket protocol — runtime parity bun
  runtime logs documented heartbeat degradation behavior for the runtime. Failure surfaced from
  beforeEach at line 482 with STACK_TRACE_ERROR.


  Triage evidence:

  - npm test full run failed after 2403 suites passed / 5 failed suites reported, 2 failed tests,
  8813 passed, 5 skipped. Full log:
  /tmp/kspec-test-cache/01KR4A09P41PCQENX1KR0DCMRH/d20871c586d05f84.log

  - npm test -- --fresh tests/helpers/daemon.test.ts tests/daemon-api/websocket-protocol.test.ts
  immediately passed: 14 suites, 24 tests, duration 9.8s. Full log:
  /tmp/kspec-test-cache/01KR4A09P41PCQENX1KR0DCMRH/20624f290e3494b7.log

  - git diff --stat origin/dev..HEAD for those files was empty, so the review task did not modify
  them relative to current dev.


  Goal: identify and fix the flaky readiness/cache or runtime setup behavior so these tests are
  deterministic under full-suite load.
