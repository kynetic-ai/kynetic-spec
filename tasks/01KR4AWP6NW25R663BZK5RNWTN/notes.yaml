    created_at: 2026-05-08T20:22:01.684Z
  - _ulid: 01KR4QGPAXQDA7E39CSTXE1KTK
    content: >-
      Root cause: probeCacheReady polled /api/tasks for cache_status="ready", but the disk-fallback
      path returns "ready" when the entity cache is not yet registered (cacheDomainState=undefined →
      toCacheStatus → "ready"). Under full-suite load the daemon's startup-project registration is
      delayed (startSessionSyncForProject + startShadowSyncForProject yield before
      registerEntityCache runs), so the readiness probe matched during that window. After the probe
      matched, loadAll() flipped the tasks domain to "loading" before the test's assertion fetch
      could run — producing the observed flake.


      Fix: switched probeCacheReady to /api/debug/cache-status, which reports domains=null until
      registerEntityCache runs and reports actual per-domain state thereafter. The probe now rejects
      the premature-ready window and only accepts when the tasks domain has actually transitioned to
      "ready". Added an explicit assertion to the happy-path fixture test that verifies domains and
      tasks state via the same endpoint, so a regression to the buggy probe would fail
      deterministically.


      Verification: `npm test -- --fresh` (full suite) passed cleanly — 2410 of 2410 suites, 8827 of
      8832 tests, 5 skipped. Targeted runs of tests/helpers/daemon.test.ts,
      tests/daemon-api/websocket-protocol.test.ts, and tests/daemon-build.test.ts also passed when
      run together (16 suites, 26 tests, 10.4s).


      Out of scope: the daemon-build.test.ts 180s timeout reported in the supplemental note uses
      readiness mode "health" (not "health-and-cache"), so it does not exercise probeCacheReady.
      That single observation has no obvious failing assertion in the focused log; if it recurs
      after this fix lands, it will need separate investigation (likely a transient build/spawn
      issue under shared CI load).
    supersedes: null
    author: "@claude"
    created_at: 2026-05-08T21:22:22.686Z
