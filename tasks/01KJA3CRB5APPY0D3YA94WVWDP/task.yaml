title: Investigate and fix note limit 3x multiplier in gatherSessionContext
type: bug
description: >-
  In gatherSessionContext(), the note limit calculation has a potential bug:

    const noteLimitPerStatus = options.full ? limit : Math.ceil(limit / 3);

  In full mode, noteLimitPerStatus = limit. Then 3 separate arrays are created
  (in_progress/needs_work notes, pending_review notes, completed notes), each with up to `limit`
  items. When concatenated (~line 673), the result can be up to 3 * limit total notes.


  Other sections in the same function respect `limit` as a hard cap (e.g., ready tasks, blocked
  tasks, completed tasks all use .slice(0, limit)).


  Investigate: Is the 3x behavior intentional for full mode (more notes = more context)? Or should
  total notes be capped at `limit` across all statuses?


  If it's a bug: apply .slice(0, limit) to the concatenated notes array. If intentional: add a
  comment explaining why notes get 3x the limit.
