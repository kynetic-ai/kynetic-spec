    content: "Approach: build on the merged active-target-set work in dispatch.ts and thread the
      integration target branch explicitly through the push path instead of resolving a single
      global branch. Edge cases: post-merge pushes must use the workspace-specific target, periodic
      push must fan out across all active targets, and concurrent pushes must serialize per branch
      while allowing different targets to proceed concurrently. Test plan: behavioral engine tests
      for post-merge target selection, periodic multi-target push, same-branch serialization, and
      cross-branch concurrency; retain backward-compatible single-target behavior."
