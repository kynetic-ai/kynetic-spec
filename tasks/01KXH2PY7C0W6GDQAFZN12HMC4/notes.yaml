  - _ulid: 01KXP7JKX1S4K5EDVVFHPV1JWE
    content: "Approach: create only tests/e2e/dispatch-lifecycle.spec.ts, reusing the shared Playwright
      daemon fixture and local public-wire route helpers. Cover lifecycle
      authority/projection/action matrices, cleanup scope and retry behavior, canonical task
      identity, mapped errors, confirmation/focus/live-region keyboard behavior,
      dashboard/board/automation consumers, narrow viewport overflow, malformed wire rejection, and
      static read-only fallback. Edge cases: unrelated task cleanup must not block global start;
      global cleanup must not block task metadata controls; mixed failed/pending evidence; stale 409
      refresh; retry success remains stopped; retry failure retains evidence; mixed casing and
      malformed conditional rows fail closed. Test plan: behavioral browser assertions annotated
      against all 16 @ui-agent-dispatch ACs; record every console/page error; run the focused
      Playwright spec, required web-ui regression slice, typecheck/lint/format/full suite, and kspec
      validation."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-16T19:48:37.410Z
  - _ulid: 01KXP8ZV3PDRKYESQFSKEBWN94
    content: "Implemented focused browser regression in tests/e2e/dispatch-lifecycle.spec.ts only.
      Scenario matrix: desktop running/running, paused/paused, paused/draining, legacy
      false-with-active, stopped/idle, global pending, mixed global failed plus task pending,
      unrelated task cleanup, task stopped idle/failed; global retry failure/success and stale 409;
      task canonical-ref controls; global cleanup with task metadata mutation/no start;
      dashboard/board/automation consumers; 390x844 agents/board/automation with reduced motion and
      no overflow; malformed mixed-case/conditional wire rejection; static 503 snapshot
      fallback/read-only. Accessibility proof: Space and Enter activation, hard-stop dialog cancel
      sends zero requests, focus returns to replacement/invoking controls, global and task polite
      live regions update. Console/page-error outcome: zero unexpected errors; intentional 409 and
      503 resource logs are captured and asserted exactly. Verification: focused Playwright 12/12
      passed; required web UI slice 100/100 passed; full npm suite 10,926 passed with 3 skipped;
      format, changed-file/repo lint (0 errors), typecheck, diff check, and
      refs/alignment/completeness validation all pass (warnings only under --warnings-ok)."
    supersedes: null
