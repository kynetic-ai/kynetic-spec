title: Implement Per-adapter auto-approve arguments
type: task
description: >-
  Add per-adapter auto-approve args so --yolo works with any adapter.


  ## What to change


  1. **src/agents/adapters.ts** — Add optional autoApproveArgs: string[] to AgentAdapter interface.
  Set for each adapter:
     - claude-agent-acp: ["--dangerously-skip-permissions"]
     - codex-acp: ["-c", "approval_policy=never", "-c", "sandbox_mode=danger-full-access"]

  2. **src/cli/commands/ralph.ts** — Replace hardcoded --dangerously-skip-permissions logic (~line
  991) with adapter.autoApproveArgs. Apply per-role (worker gets worker adapter args, reviewer gets
  reviewer adapter args). When --no-yolo, skip autoApproveArgs entirely.


  3. **src/agents/spawner.ts** — Ensure spawn args are constructed from a fresh copy of adapter.args
  + autoApproveArgs to prevent cross-role leakage (adapter objects are registry-backed and mutable).


  ## How to verify

  - Claude adapter with --yolo passes --dangerously-skip-permissions (existing behavior preserved)

  - Codex adapter with --yolo passes -c approval_policy=never -c sandbox_mode=danger-full-access

  - --no-yolo passes no auto-approve args for any adapter

  - Worker and reviewer auto-approve args are independent (no leakage)
