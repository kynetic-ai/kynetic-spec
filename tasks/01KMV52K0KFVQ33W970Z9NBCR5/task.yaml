title: Fix workspace reconciliation cycle for completed task records
type: task
description: "What: Workspace reconciliation enters an infinite restore-delete cycle for completed
  tasks whose branches were cleaned up. Registry reconciliation (reconcileDispatchWorkspaceRegistry)
  calls reconcileWorkspaceHealth which unconditionally attempts tryRestoreBranchFromRemote when a
  canonical branch is missing locally. For terminal tasks (completed/cancelled with merged
  integration), this restores branches from remote tracking refs that serve no purpose. Artifact
  reconciliation (reconcileDispatchWorkspaceArtifacts) then deletes those same branches because they
  have no matching worktree, producing errors when timing misaligns. This repeats every
  reconciliation cycle, generating DispatchWorkspaceError noise for resolveCommit and
  deleteDispatchBranch failures. Where: src/agent-runtime/workspace.ts — reconcileWorkspaceHealth
  (tryRestoreBranchFromRemote call around line 1185), reconcileDispatchWorkspaceArtifacts (branch
  cleanup loop around line 2821), and deleteDispatchBranch. The two functions are called
  sequentially from dispatch.ts during periodic reconciliation. Why: reconcileWorkspaceHealth has no
  awareness of task terminal state or integration status — it treats every missing branch as needing
  recovery. reconcileDispatchWorkspaceArtifacts builds its tracked-branches set only from worktree
  entries with metadata, so registry-only records (no worktree on disk) are invisible to it. The two
  phases have no shared view of which branches should exist. Fix requires two changes: (1) health
  reconciliation must check task and integration status before attempting branch restoration
  (ac-12), (2) artifact reconciliation must consult the workspace registry when deciding whether an
  untracked-worktree branch is orphaned (ac-13)."
spec_ref: "@dispatch-workspace-registry"
