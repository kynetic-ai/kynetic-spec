notes:
  - _ulid: 01KN6GANEVGGM6PXJSMEPR3RGE
    content: "Approach: inspect prior full-suite failure logs plus dispatch bootstrap and daemon meta
      test helpers to identify shared-state or resource contention before rerunning expensive
      suites. Edge cases: leaked daemon/worktree state across suites, cross-test HOME/cache
      collisions, lingering timers/watchers, and teardown ordering under full-suite load. Test plan:
      reproduce with npm test -- --fresh if needed, add focused regression coverage around the
      identified leak/teardown path, then rerun the full suite and kspec validate before submit."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-02T07:08:08.539Z
  - _ulid: 01KN6GTEJNKNRC6FP162WN2TQ2
    content: "Identified the full-suite flake as resource leakage from daemon API app.handle() tests:
      createTestApp auto-registered each temp project and started .kspec/.kspec-sessions watchers
      that those tests never used, accumulating watchers/timers across the suite. Mitigation:
      disable watcher startup in the shared daemon API helper and add a regression test asserting
      the helper keeps watcherActive false for these request/response-only tests."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-02T07:16:45.792Z
