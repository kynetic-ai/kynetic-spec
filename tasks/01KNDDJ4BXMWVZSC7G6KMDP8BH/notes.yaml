  - _ulid: 01KNJZJWEHB9QD8HH108ZHV7MH
    content: "Fix cycle 1 approach: preserve the meta sub-domain split but route manifest/shadow/session
      refreshes through the existing meta in-flight reload slot so concurrent meta reload requests
      still deduplicate. Re-verify all four ACs and add a regression test for overlapping
      manifest-only invalidations."
