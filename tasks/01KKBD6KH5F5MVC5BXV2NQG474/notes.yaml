  - _ulid: 01KKCM84FNVANBA5758YBD8Y94
    content: >-
      Fix cycle 2 addressed: Wired WebSocket auto-registration into session-sync lifecycle. Changes:

      1. Added getOrRegisterProject() to ProjectContextManager — returns {context, wasRegistered} to
      unify the try-get-or-register pattern

      2. All three registration paths (middleware, projects API, WebSocket beforeHandle) now use the
      same shared onProjectRegistered callback

      3. WebSocket beforeHandle now calls onProjectRegistered(projectContext.path) when
      wasRegistered=true, starting session sync for WebSocket-registered projects

      4. Added 5 new tests for getOrRegisterProject covering: new registration, existing project,
      path normalization, double-register prevention, and callback-only-on-new-registration pattern

      5. Middleware also refactored to use getOrRegisterProject for consistency, and error log
      messages now use normalized projectContext.path

      All 12 tests in daemon-session-sync-multi-project.test.ts pass. Full suite green except
      pre-existing trait-retrospective failures.
    supersedes: null
    author: "@claude"
    created_at: 2026-03-10T19:40:42.869Z
  - _ulid: 01KKCNMZBES5W2K6RZ2NF2FGJZ
    content: "[FIX_CYCLE: 3] Review findings: MUST-FIX: DELETE /api/projects still passes an
      unnormalized path into session-sync teardown, so unregistering via a non-canonical path can
      leave an orphaned scheduler running. Also, PR #758 is not mergeable on March 10, 2026 because
      GitHub Actions test (shard 3/3) is failing on tests/file-lock.test.ts."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-10T20:05:12.175Z
  - _ulid: 01KKCQP27XWNYMB9CN8T6ZM5R5
    content: >-
      Fix cycle 3 addressed: Normalized path in DELETE /api/projects route before passing to
      onProjectUnregistered callback. Changes:

      1. DELETE handler now uses getProject(projectPath) to resolve normalized ProjectContext
      instead of passing raw decoded URL parameter

      2. All downstream calls (onProjectUnregistered, stopWatcher, unregisterProject) use
      context.path (normalized)

      3. Added regression test: DELETE with non-canonical path (projectA + '/./') verifies
      onProjectUnregistered receives normalized path

      4. file-lock.test.ts shard 3 failure is pre-existing race condition in CI (count: 4 vs count:
      5) — not related to this PR. Same failure reproduces on main.
    supersedes: null
    author: "@claude"
