  - _ulid: 01KG6CJQVPY003VNGCB5VDFMJM
    content: >-
      Implementation notes (auto-generated from spec):


      Limits how many tasks can be completed per iteration via --max-tasks flag. Default is 1
      (conservative), 0 means unlimited. Enforcement is soft (message injection) then hard
      (PreToolUse hook blocking task start). Counts only kspec task complete commands (not submit,
      which is status change to pending_review).



      Acceptance Criteria:

      - ac-flag: Given User runs kspec ralph, when --max-tasks flag is provided or defaults, then
      Parses N as positive integer (1-999) or 0 for unlimited; default is 1; invalid values exit
      with code 2

      - ac-detection: Given Agent completes a task (kspec task complete), when ACP update handler
      receives Bash tool call containing kspec task complete, then Ralph queries kspec for actual
      completion count since iteration start, not relying on pattern alone

      - ac-wrapup: Given N tasks completed this iteration (N equals max-tasks), when Detection
      triggers and count verified via kspec query, then Ralph writes marker file and injects wrap-up
      message telling agent to stop starting new tasks

      - ac-unlimited: Given --max-tasks 0 is specified, when Ralph runs iteration, then No task
      limit enforced (legacy behavior); no marker file written

      - ac-hook-block: Given Marker file exists at .claude/ralph-task-limit.json with active:true,
      when PreToolUse hook intercepts kspec task start command, then Hook blocks with message
      explaining task limit reached; allows other commands

      - ac-reset: Given New iteration begins, when Ralph starts iteration loop, then Counter resets
      to 0; stale marker files older than 1 hour are cleared

      - ac-marker-format: Given Task limit reached, when Marker file written, then File is JSON with
      active, since (ISO8601), max, completed, sessionId fields

      - ac-dryrun: Given --dry-run flag provided with --max-tasks N, when Ralph shows config, then
      Displays max-tasks configuration in dry-run output
    supersedes: null
