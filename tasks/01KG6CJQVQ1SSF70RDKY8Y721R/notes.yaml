         - Added flag validation (0-999 range)
         - Added info message with max-tasks configuration
         - Added dry-run output showing max-tasks
         - Added task limit marker file operations (write/read/clear/clearStale)
         - Added extractBashCommand() to detect Bash tool calls from SessionUpdate
         - Added detectTaskCompleteCommand() pattern matcher
         - Added task completion detection in ACP update handler
         - Added wrap-up message injection when limit reached
         - Added marker file cleanup in finally block

      2. **src/cli/commands/session.ts** - Stats query
         - Added IterationStats interface
         - Added getIterationStats(ctx, since) function for querying completions

      3. **.claude/hooks/ralph-task-limit-guard.sh** - New PreToolUse hook
         - Intercepts kspec task start commands
         - Checks marker file at .claude/ralph-task-limit.json
         - Blocks when marker exists with active:true
         - Provides helpful error message with limit info

      4. **.claude/settings.json** - Hook registration
         - Added ralph-task-limit-guard.sh to PreToolUse hooks array

      ### Tests Added
      - tests/ralph/task-limit.test.ts (11 tests)
      - tests/hooks/ralph-task-limit-guard.test.ts (9 tests)
      - tests/cli/session-iteration-stats.test.ts (3 tests)

