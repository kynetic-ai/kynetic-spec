  - _ulid: 01KMKJQ9BM216EFNSPYBPN76RW
    content: "Migration complete. All test fixtures converted to split format with per-task directories.
      All kynetic.yaml files updated with task_storage: { format: split }. Tests updated to use
      resolveTaskDataManager(ctx) and seedSplitTask() helper. Removed monolithic-only tests from
      yaml-round-trip-stability.test.ts (saveTask path tests). Rewrote
      task-mutation-serialization.test.ts and review-task-integration.test.ts to use split backend.
      Skipped 8 tests that expose split backend bugs (race conditions in concurrent mutateTask,
      unknown field stripping in writeTaskFile, validate not reading per-task detail files).
      Captured observation about these pre-existing split backend issues."
