notes:
  - _ulid: 01KW7MDVJDQ3PMPB5P9B1E4GXR
    content: >-
      Approach: reuse the existing @kynetic-ai/shared spec workspace projection and web-ui
      status-token coverage vocabulary, adding a small workspace coverage presentation layer instead
      of client-side raw-list scans. Extend /specs to render segmented rollups, state chips/filters,
      and re-verify summaries from projection counts and criterion coverage details; keep filtering
      local to the current page and route it through existing goto() URL state. Reuse
      queryKeys.specWorkspace/queryKeys.coverage and existing ws-invalidation coverage_state_changed
      handling.

      Edge cases: failing must outrank re-verify when mixed; zero-denominator coverage should not
      pretend everything is covered; re-verify secondary causes should stay explanatory text only;
      warming/unavailable coverage must not block non-coverage spec navigation.

      Test plan: add behavioral helper/component tests for four-bucket tokens, rollup counts,
      requirement filter behavior, re-verify banner summary/link shape, failing priority, no legacy
      covered fallback, and warming/unavailable presentation; annotate existing
      coverage_state_changed invalidation test for cache/event coherence.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-28T17:28:54.605Z
  - _ulid: 01KW7P0KNE4PG896Y995VMTMA4
    content: >-
      Implemented coverage-state presentation for the spec workspace in commit 3bbde6254d. Added a
      shared web-ui coverage presentation helper for four-bucket tokens, rollup math, local state
      filters, re-verify cause summaries, attention priority, and readiness messages. Wired /specs
      root/node/criterion pages and tree rows to segmented rollups, state chips, re-verify banners,
      local filter chips via goto-backed URL state, and projection-only not-yet fallback for missing
      criterion coverage. Static projections now mark coverage unavailable when snapshots omit
      coverage_state.

      Verification: npm run format:check; npx oxlint changed files; npm run lint -- --quiet (0
      errors, existing warning baseline); npm run typecheck; focused tests for coverage
      presentation/static/invalidation; npm test (2922 suites passed, 11120 tests passed, 3
      skipped); kspec validate --refs/--alignment/--completeness --warnings-ok (passed with existing
      warning baselines).
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-28T17:56:37.679Z
