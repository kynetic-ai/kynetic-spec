  change. Observed failures included tests/cli-no-daemon.test.ts timing out waiting for the
  auto-started daemon pid file, tests/dispatch-target-sync.test.ts failing with STACK_TRACE_ERROR,
  tests/test-runner.test.ts failing to unlink transient _trivial-* files when multiple suites were
  in flight, and tests/shadow.test.ts failing an orphan-branch temp-dir cleanup assertion on the
  base branch run. Investigate which failures are pre-existing versus flaky/environment-sensitive,
  make the full suite reliable in review worktrees, and document any tests that cannot run
  concurrently in the same workspace session.
