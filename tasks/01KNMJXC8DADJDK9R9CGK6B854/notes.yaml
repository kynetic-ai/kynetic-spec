  - _ulid: 01KNP1E0MFZE1R87DDGX0ZRANP
    content: >-
      Approach: Three tests fail under full-suite load but pass in isolation.


      1. cli-serve.test.ts:356 — Race condition: after 'serve stop' returns 'Daemon stopped',
      process.kill(pid, 0) finds process still in OS table. Fix: add retry loop with brief delays.

      2. dispatch-target-sync.test.ts:688 — Heavy test (git clones, merges, engine start/stop,
      workspace provisioning) times out at default 15s under load. Fix: increase timeout to 30s.

      3. enhanced-setup.test.ts:233 — kspec setup --dry-run takes >15s under load. Fix: increase
      timeout to 30s.


      All three pass reliably in isolation. The fixes are minimal: retry logic for the race
      condition, timeout bumps for resource contention.
    supersedes: null
    author: "@claude"
    created_at: 2026-04-08T07:55:40.559Z
  - _ulid: 01KNP29WKG8H4HSB5E0XNTCPEE
    content: >-
      Revised approach: Second full-suite run revealed 25 failures (all timeouts), not just the
      original 3. Machine load variance (first run: 6300s, second: 10600s) proves the 15s global
      timeout is simply too tight for full-suite concurrency.


      Changes:

      1. vitest.config.ts: Raise default testTimeout from 15s to 45s (above the 30s kspec CLI
      subprocess timeout)

      2. cli-serve.test.ts: Add retry loop for process.kill(pid,0) race condition after SIGTERM  

      3. Remove 3 stale explicit {timeout: 15000} overrides that now restrict below the new default
    supersedes: null
