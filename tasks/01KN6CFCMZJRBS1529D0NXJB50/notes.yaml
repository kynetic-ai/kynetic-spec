    content: "Approach: update plan derive CLI option to default task derivation on and use Commander
      negation for opt-out. Reuse existing derive implementation and only change option parsing,
      help text, guidance strings, and dry-run/reporting text. Edge cases: task-only plans,
      spec-only derive via --no-tasks, backward-compatible --tasks flag acceptance, empty-plan
      guidance, batch schema/help generation from Commander. Test plan: add behavioral CLI tests for
      default derive, --no-tasks opt-out, dry-run status text, and backward-compatible --tasks
      handling; then run full npm test plus kspec validate and kspec skill render."
