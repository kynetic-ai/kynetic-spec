title: Stabilize cli-agent-commands session-store tests under restricted /tmp permissions
type: bug
description: "npm test fails in tests/cli-agent-commands.test.ts with five deterministic EACCES
  errors while createSession() tries to mkdir under /tmp/.kspec-sessions. Reproduced during review
  of @01KNXYJ5JCR99F76N8N7265E0B on 2026-04-15. Failures: AC-2, AC-3, AC-11, and two AC-12 cases.
  Investigate why these tests use the global /tmp session root instead of an isolated writable path,
  then make the suite deterministic under environments where /tmp/.kspec-sessions is not writable."
