  - _ulid: 01KM7T1SVS9WE26D8960S1WJ3Z
    content: "Fix cycle 3: Resolved the notes_count/todos_count oscillation. The root issue was
      misclassifying counts as non-indexed data. AC-3 says note *content* is non-indexed (and indeed
      note text never enters the index). But notes_count is a derived indexed field used by list
      surfaces — when it changes, the index should update per AC-2. Removed the INDEX_CHANGE_FIELDS
      filter that excluded counts, so indexEntriesEqual now compares all INDEXED_FIELDS. Updated
      tests: the AC-3 test now verifies note content stays out of the index while the count updates;
      the staleness test was replaced with one asserting listTasks returns accurate counts
      immediately. Full suite passes (6814 tests)."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-21T09:01:36.505Z
