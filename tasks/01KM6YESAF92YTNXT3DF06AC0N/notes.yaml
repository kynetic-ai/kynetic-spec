  - _ulid: 01KM7QJ1TSGVJXSZNE90HRK7K3
    content: "Fix cycle 1: Addressed blocker — stale notes_count/todos_count in index after note
      mutations. Root cause: INDEX_CHANGE_FIELDS excluded notes_count and todos_count, so
      indexEntriesEqual() didn't detect count changes, and mutateTask() skipped the index write.
      Fix: removed the exclusion filter so all indexed fields (including counts) trigger index
      writes when they change. Updated the AC-3 test to verify note content stays out of the index
      while the count is updated. Added a regression test proving listTasks() returns accurate
      notes_count after multiple note additions. Full test suite passes (6814 tests, 0 failures)."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-21T08:18:03.226Z
