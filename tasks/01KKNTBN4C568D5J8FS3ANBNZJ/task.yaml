title: "Fix test isolation: core-skill-install tests stomp global plugin marketplace"
type: task
description: "core-skill-install.test.ts calls kspec skill install-core via CLI subprocess without
  KSPEC_CLAUDE_HOME isolation. This calls registerCorePluginMarketplace() which writes to the real
  ~/.claude/plugins/known_marketplaces.json. When tests run from dispatch worktrees,
  getPackagePluginDir() resolves import.meta.dirname to the worktree path, stomping the global
  marketplace to point at a worktree plugin/ directory that may get cleaned up. Confirmed by
  monitoring: session 01KKNSFHKED3PWYMF9J455BV4X (pr-reviewer running npm test in worktree)
  overwrote the marketplace at 09:06:59 UTC. Fix: set KSPEC_CLAUDE_HOME env var in
  core-skill-install.test.ts (and any other test that calls skill install-core or kspec setup
  without --dry-run) to a temp directory, matching the pattern in claude-plugin-registry.test.ts."
spec_ref: null
status: completed
