notes:
  - _ulid: 01KTMRB6PYCJ8KV8FPHSBWT9A9
    content: >-
      Approach: Add a new packages/daemon/src/routes/task-resources.ts plugin (prefix /api/tasks,
      mirroring plan-resources.ts + review-resources.ts which co-mount with their entity route file)
      exposing:

      - GET /:ref/resources -> { resolved_resources, resources_base_url } from
      projectResolvedTaskResources (reuses resolveTaskResources, same path as task detail).

      - GET /:ref/resources/:resourceId -> { resolved_resource } projection entry (carries
      drift/missing/unresolved status), structured 404 when no matching resource_ref id.

      - GET /:ref/resources/:resourceId/bytes -> serves bytes only when status==present; sets
      Content-Type/Content-Length/X-Kspec-Resource-Sha256 from current manifest entry. drift->409,
      missing/unresolved->404, each body names the exact status. Resolves plan-owned via
      findPlanByRef+getPlanDir, task-owned via getTaskDir, then getResourcesDir +
      loadResourceManifest + resolveResourcePath (symlink-safe; never raw-joins author paths).

      Mounted under projectContextMiddleware so kspec_dir query routing works without X-Kspec-Dir
      (selected-project context), same as review/plan resource bytes routes.

      Register in server.ts and tests/daemon-api/helpers.ts createTestApp.

      Tests (tests/daemon-api/task-resources.test.ts): present plan-owned bytes, present task-owned
      copy bytes, drift refusal, missing refusal, unresolved refusal, detail-route status reporting,
      list projection, and selected-project routing via real middleware + kspec_dir query.

      Note: markdown rewriter (rewriteTaskResourceLinks) + its FLIPPED-ON-FIX contract tests are
      owned by sibling @generalize-live-ui-resource-markdown-rewriting, NOT this task.
    supersedes: null
    author: "@claude"
    created_at: 2026-06-08T23:16:05.983Z
  - _ulid: 01KTMSMSE7TV6Q71CS0NN1AW5M
    content: >-
      Implemented in packages/daemon/src/routes/task-resources.ts (new plugin, /api/tasks prefix,
      co-mounted with createTasksRoutes), wired into server.ts and tests/daemon-api/helpers.ts
      createTestApp.


      Routes:

      - GET /:ref/resources -> { resolved_resources, resources_base_url }

      - GET /:ref/resources/:resourceId -> { resolved_resource } (carries drift/missing/unresolved
      status; 404 only when no matching resource_ref id)

      - GET /:ref/resources/:resourceId/bytes -> drift-safe: present streams bytes with
      Content-Type/Content-Length/X-Kspec-Resource-Sha256 from current owner-manifest entry;
      drift->409, missing/unresolved->404, each body names the exact status and never streams
      replacement bytes.


      Reuses resolveTaskResources + projectResolvedTaskResources (identical drift semantics to task
      detail / kspec task get --json / agent context). Plan-owned -> findPlanByRef+getPlanDir;
      task-owned -> getTaskDir; both via getResourcesDir + loadResourceManifest + symlink-safe
      resolveResourcePath (no raw path joins). Selected-project routing inherited from
      project-context middleware (kspec_dir query) — verified by multi-project test.


      Tests: tests/daemon-api/task-resources.test.ts (13 tests) — present plan-owned bytes, present
      materialized task-owned copy bytes, drift refusal, missing refusal, unresolved refusal,
      unknown id/task 404s, detail-route status reporting, list projection, selected-project +
      default routing.


      Scope note: markdown rewriter (rewriteTaskResourceLinks) and its FLIPPED-ON-FIX it.fails
      contract tests remain owned by sibling @generalize-live-ui-resource-markdown-rewriting —
      untouched.


      Gates: format:check clean, lint 0 errors, typecheck clean, daemon-api suite 501 passed, full
      npm test exit 0, kspec validate refs/alignment/completeness pass (pre-existing warnings only).
    supersedes: null
