title: Fix merge driver non-interactive flag and improve conflict resolution
type: task
description: >-
  **Background**: Shadow branch diverged (170 local vs 260 remote commits). During merge, the merge
  driver was registered without --non-interactive, causing it to hang on stdin when conflicts were
  detected. This left files unmerged (ours version only), silently losing 12 task completions,
  notes, and remote-side spec changes.


  **Already done (this session):**

  1. Diagnosed root cause: git config had `kspec merge-driver %O %A %B %P` but needed
  `--non-interactive` flag

  2. Fixed local git config to include --non-interactive

  3. Performed isolated rebase in /tmp worktree to produce correctly merged state

  4. Applied corrected data as patch commit on kspec-meta (no force push needed)

  5. Restored all 12 lost task completions with notes, verified 705 tasks intact

  6. Marked 37 stale active sessions as abandoned, compacted all sessions (383MB reclaimed)

  7. Created backup branches: kspec-meta-backup-2026-02-28 (pre-merge local), kspec-remote-pre-merge
  (pre-merge remote)


  **Still to do:**

  1. Fix shadow.ts registration — ensure kspec init/setup always registers driver with
  --non-interactive

  2. Add TTY detection fallback — merge driver should auto-detect when stdin is not a TTY and
  default to non-interactive mode (defense in depth)

  3. Fix exit code behavior — in non-interactive mode, exit 0 even with conflicts (they're
  auto-resolved with ours-defaults + comments). Exit 1 breaks git rebase.

  4. Improve notes array merging — when both sides modify notes, union by timestamp instead of
  picking one side. Notes are append-only logs.

  5. Resolve inbox item about .kspec-agents-hash auto-resolution (01KJDFFJ)

  6. Restore 8 lost notes on @01KJDQ11 (observations slug fix task) — local had detailed work log
  that was replaced by remote's 3 automated notes

  7. Consider timestamp-aware conflict resolution for status fields (task state has natural
  ordering)
