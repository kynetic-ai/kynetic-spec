    content: |-
      Implemented agent instruction generation with all 5 acceptance criteria:

      - ac-1: kspec agents generate creates kspec-agents.md in project root
      - ac-2: Output includes Finding Information table with row per skill
      - ac-3: Output includes conventions section listing rules by domain
      - ac-4: Output contains freshness comment with kspec version and timestamp
      - ac-5: kspec agents status reports stale when meta has changed since generation

      Also implemented @trait-dry-run support (ac-1 through ac-6).

      Added 22 tests covering all acceptance criteria and edge cases.
