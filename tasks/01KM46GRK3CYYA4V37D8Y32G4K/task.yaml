title: Implement cancelled-task exclusion in plan summary metrics
type: task
description: >-
  Implement the shared plan summary metric behavior defined by @plan-summary-metrics across all plan
  surfaces.


  What: Update plan summary aggregation so linked task counts, progress totals, and status breakdown
  metrics exclude cancelled tasks unless a metric explicitly reports cancelled-task status.


  Why: Current plan summaries count cancelled tasks against overall totals, which misrepresents plan
  progress and produces inconsistent results across UI, API, CLI, and export/static outputs.


  How: Update each code path that computes or serializes plan summary metrics to apply the
  @plan-summary-metrics rule consistently, then add coverage using plan/task fixtures that include
  cancelled linked tasks so the behavior stays aligned across surfaces.
