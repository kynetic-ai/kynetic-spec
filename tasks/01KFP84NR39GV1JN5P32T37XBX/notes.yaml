  - _ulid: 01KFZ3T4B2215TYF1YW78R72P0
    content: >-
      Session progress - Fixed daemon initContext bug (commit 4dbd28fa):


      **Root cause identified and fixed:**

      All daemon routes were calling `initContext(join(projectContext.path, '.kspec'))` but
      `initContext()` expects PROJECT ROOT, not the .kspec path. This would cause
      RUNNING_FROM_SHADOW errors on real projects with shadow worktrees. The bug was hidden in E2E
      tests because they use fake .kspec directories.


      **Changes made (10 files, -53 lines):**

      - 5 route files: Pass `projectContext.path` directly to `initContext()`

      - Fixed `commitIfShadow(ctx, ...)` → `commitIfShadow(ctx.shadow, ...)`

      - Fixed `getAuthor(ctx.root)` → `getAuthor()` (invalid parameter)

      - Updated 5 static analysis tests to reflect new patterns


      **Test status after fix:**

      - Unit tests: 1428 passed, 1 failed (pre-existing Bun build issue), 3 skipped

      - E2E tests: 60 passed, 57 failed (pre-existing UI issues)


