  - _ulid: 01KJZ25776Z5D6Z57PT18CSYS5
    content: >-
      Implemented enhanced inbox view:

      - AC-1: Each inbox item now shows triage status inline (Untriaged/Triaged/Acted On) with
      colored badge. Shows triage action type when present. Quick 'Triage' link for untriaged items
      navigates to triage view.

      - AC-2: Added filter controls for status (all/untriaged/triaged/acted_on), tags (dynamic from
      inbox items), and age (24h/7d/30d). Filters persist in URL params. Shows filtered count in
      summary.

      - Loading: Shimmer skeleton loaders (5 rows) while data fetches.

      - Empty state: Lucide Inbox icon with contextual message (no items vs no filter matches).

      - Error boundary: Destructive-colored alert with error message.

      - WebSocket: Subscribes to inbox:updates and triage:updates for real-time data refresh.

      - Migrated event handlers from Svelte 4 (on:click) to Svelte 5 (onclick) pattern.

      - E2E tests: 7 new tests covering AC-1 and AC-2, preserved all existing tests.
    supersedes: null
    author: "@claude"
    created_at: 2026-03-05T13:14:25.382Z
