  - _ulid: 01KJZ5P2WFSKC3BS1D39CFWZF5
    content: >-
      Fix cycle 1 resolution: Created clean branch feat/enhanced-inbox-view-v2 from feat/ui-revamp.
      Only 2 files changed (inbox page + inbox E2E tests) — no session history or other unrelated
      changes.


      Changes:

      - AC-1: Triage status badges (Untriaged/Triaged/Acted On) shown inline per item with colored
      status tokens. Quick triage link for untriaged items.

      - AC-2: Filter controls for status, tags, age. URL param persistence. Filtered count in
      summary.

      - Svelte 5 migration: on:click → onclick, on:keydown → onkeydown

      - WebSocket subscriptions for inbox:updates and triage:updates

      - Shimmer loading skeletons, contextual empty states, error boundary

      - 22 E2E tests (10 new for AC-1/AC-2, 12 preserved from original)


      Known issue: Daemon's loadTriageRecords returns empty for E2E fixtures (pre-existing bug —
      triage file exists and is valid but parse returns 0 records). UI correctly falls back to
      'Untriaged' when no triage data available. Triage-specific E2E tests are resilient to this
      limitation.
    supersedes: null
