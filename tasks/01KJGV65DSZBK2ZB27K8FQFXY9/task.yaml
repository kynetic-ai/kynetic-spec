title: Add integration test for config-aware init output messaging
type: task
description: >-
  The post-init 'Next steps' output now uses configurable directoryName and branchName from project
  config instead of hardcoded defaults. There are no tests asserting this config-aware behavior, so
  hardcoded regressions could slip back in.


  Add a focused integration test in tests/init-setup-integration.test.ts that:

  1. Creates a temp git repo with a kspec.config.yaml that sets custom shadow.directory and
  shadow.branch values (e.g. directory: .specs, branch: specs-meta)

  2. Runs kspec init --no-prompt in that repo

  3. Asserts the output contains the custom directory name (not .kspec) in the 'Note: Spec files
  live in' line

  4. Asserts the output contains the custom branch name (not kspec-meta) in the same line

  5. Asserts the next steps reference the custom directory name


  Use the existing test patterns in init-setup-integration.test.ts (createTempDir, initGitRepo,
  kspec helper). Reference AC: @init-setup-integration ac-4 since this is about the without-setup
  output path.
