notes:
  - _ulid: 01KHQQV7W5279WQ20S9ZB32C9N
    content: >-
      Implementation notes (auto-generated from spec):


      Improve guard script matching robustness and replace the hand-rolled unified diff with a
      proper implementation.



      Acceptance Criteria:

      - ac-1: Given a command like echo "git reset" or grep "git stash" README.md, when the worktree
      guard script evaluates it, then it is NOT blocked (guard checks command position or word
      boundaries, not substring)

      - ac-2: Given two files where one has a single line inserted, when generateUnifiedDiff
      compares them, then the diff shows only the insertion, not a cascade of all subsequent lines
      as changed

      - ac-3: Given async skill operations, when loading package version, manifest, or skill
      content, then async fs.readFile is used instead of readFileSync

      - ac-4: Given a skill update operation, when the update is about to save, then a copy of the
      skill object is mutated, not the loaded original (safe against partial save failure)
    supersedes: null
    author: "@claude"
    created_at: 2026-02-18T06:43:49.765Z
  - _ulid: 01KHSWRNB7H27FFE2ZKRMQ8YKN
    content: >-
      Completed all 4 items:

      1. ac-1: Guard script now strips quoted strings before matching dangerous patterns — echo "git
      reset" no longer blocked

      2. ac-2: Replaced hand-rolled generateUnifiedDiff with diff library's createTwoFilesPatch —
      fixes cascade bug on insertions

      3. ac-3 (task note): Converted getKspecPackageVersion, loadCoreSkillsManifest,
      loadCoreSkillContent from readFileSync to async readFile. Updated all callers in setup.ts,
      skill-install.ts. Also converted getKspecVersion in export/json.ts.

      4. ac-4 (task note): Added structuredClone before mutation in skill-crud.ts (skill set) and
      skill-install.ts (skill update) to prevent partial-save corruption.


      New test added: tests/skill-diff.test.ts for ac-2, plus guard execution test in
      enhanced-setup.test.ts for ac-1.
    supersedes: null
    author: "@claude"
    created_at: 2026-02-19T02:48:16.999Z
