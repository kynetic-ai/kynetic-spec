  - _ulid: 01KG2RQ5ENQF95MBDY105YE2Z6
    content: |-
      ## Fixes Applied

      ### 1. Race condition fix (daemon API requests)
      - Modified isStaticMode() to return true synchronously when BUILD_STATIC_MODE=true
      - This prevents API calls from running before async initMode() completes
      - Sidebar's onMount now correctly skips daemon API calls

      ### 2. SPA routing fix (404 on routes)
      - Changed adapter-static fallback from 'index.html' to '404.html'
      - GitHub Pages serves 404.html for missing routes, enabling SPA routing
      - Compatible with both GitHub Pages and local daemon serving

      ### Files changed
      - packages/web-ui/src/lib/stores/mode.svelte.ts
      - packages/web-ui/svelte.config.js

      ### Verification
      - Build succeeds with VITE_STATIC_MODE=true
      - 404.html created in build output
      - Unit tests pass (1457 passed)
