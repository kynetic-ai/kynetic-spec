  - _ulid: 01KJKEGTZ7T2Y7WDYK5XFYM6BG
    content: >-
      Implemented O(1) event seq assignment by replacing full-file line counting with tail-based
      last-seq lookup in src/sessions/store.ts (bounded tail read + fallback full parse only when
      tail is unparsable), and added bounded sequential backpressure queueing in
      createSessionUpdateLogger to prevent unbounded in-flight appendEvent promises during rapid
      update streams.


