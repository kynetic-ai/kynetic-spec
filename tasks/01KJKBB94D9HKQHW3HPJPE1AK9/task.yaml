title: Fix ralph loop OOM — O(1) seq assignment + event logging backpressure
type: bug
description: "Ralph loop hits 8GB heap OOM after ~133 minutes. Root cause: getEventCount reads
  entire events.jsonl on every appendEvent call (O(n) per append, O(n²) total), and session update
  logger fires appendEvent via Promise.resolve().then() with no backpressure — thousands of
  concurrent file reads/writes accumulate in flight."
spec_ref: "@cli-ralph"
meta_ref: null
