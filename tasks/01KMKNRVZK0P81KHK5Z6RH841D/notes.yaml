  - _ulid: 01KMKP7SXPXHFMS5W8KAECR7AP
    content: >-
      Approach: The bug is that SplitBackend.mutateTask/mutateTasks/deleteTask acquire per-task
      locks, but when called through TaskDataManager.withWriteBuffer, the buffer flush happens AFTER
      the backend method returns (and lock is released). Each concurrent TaskDataManager.mutateTask
      creates its own isolated buffer via AsyncLocalStorage.run(), so concurrent callers cannot see
      each other's buffered writes. This creates a TOCTOU race: Mutation B reads stale disk state
      after Mutation A has buffered writes but before A's buffer flushes.


      Fix plan:

      1. Remove per-task locking from SplitBackend.mutateTask, mutateTasks, deleteTask

      2. Remove SplitBackend's internal runWithBuffer calls (TaskDataManager.withWriteBuffer already
      provides the buffer)

      3. Add per-task lock acquisition in TaskDataManager.mutateTask, mutateTasks, deleteTask
      wrapping withWriteBuffer (only for split backend, monolithic already has its own file-level
      locking)

      4. This ensures the lock spans read → mutate → buffer-write → flush

      5. Unskip all 7 tests and verify they pass
    supersedes: null
    author: "@claude"
    created_at: 2026-03-25T23:45:52.054Z
  - _ulid: 01KMKPRWQHP2WQ9DYG6WY81AQK
    content: >-
      Fix complete. The root cause was that SplitBackend's per-task mutex only covered the buffering
      phase, not the flush. When called through TaskDataManager.withWriteBuffer, each concurrent
      mutation got its own isolated buffer (via AsyncLocalStorage.run), and the SplitBackend
      released the lock before the outer buffer flushed. This created a TOCTOU race: a second
      mutation would read stale disk state while the first mutation's writes were still in its
      buffer.


      Fix: Moved per-task lock from SplitBackend to TaskDataManager, wrapping withWriteBuffer so the
      lock spans read → mutate → buffer → flush. Removed the now-redundant SplitTaskMutexMap class
      from split-backend.ts.


      All 6 previously-skipped tests now pass. Full test suite: 6821 passed, 6 skipped (pre-existing
      unrelated), 1 flaky timeout (pre-existing, passes in isolation).
    supersedes: null
