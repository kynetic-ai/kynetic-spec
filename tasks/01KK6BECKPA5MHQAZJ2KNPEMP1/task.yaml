title: Implement bidirectional shadow branch sync
type: task
description: "Shadow branch sync is push-only: after each commit, shadowPushAsync fires a detached
  git push. But there is no pull — other clones sharing the same remote kspec-meta branch never
  receive updates until manual kspec shadow sync. This causes: (1) divergence between clones (tasks
  created in clone A are invisible to clone B), (2) frequent merge conflicts when both clones push,
  (3) manual intervention required to reconcile. Fix: (a) Change shadowPushAsync to pull-rebase
  before pushing (using the kspec merge driver for YAML conflict resolution), (b) Add periodic
  background pull in daemon mode (configurable interval, default 60s), (c) Ensure CLI commands also
  pull before read operations that depend on fresh state (e.g. task list, session start). The merge
  driver (kspec merge-driver) already handles YAML merges non-interactively."
spec_ref: "@config-shadow"
