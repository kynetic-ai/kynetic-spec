title: Round-trip stability for inbox item YAML writes
type: task
description: >-
  yaml.ts saveInboxItem, mutateInboxItemAtomically, and deleteInboxItem load project.inbox.yaml
  through InboxFileSchema.safeParse() before writing back. This adds at least tags: [] to inbox
  items missing that field.


  Apply the same raw-data-preservation pattern: load the raw YAML array without schema
  normalization, only schema-parse the target item, merge onto raw data. Non-target items stay as
  raw data.


  Verify with tests: write an inbox file, load and save one item without changes, confirm file is
  byte-identical.
