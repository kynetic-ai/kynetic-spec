  - _ulid: 01KFXSN1A5VT79A53JHAK2V7GC
    content: >-
      **Open design question (resolve before implementation):**


      The merge driver is invoked by git with just file paths - it doesn't have the full kspec
      context loaded. To normalize refs, we need to resolve @slug → @ULID.


      **Options:**

      1. **Lazy load index**: During merge, call `loadKspecContext()` to get ref resolution. Adds
      latency but works everywhere.


      2. **Best-effort**: Only normalize if running in a kspec project context. Document that
      normalization may not work in bare repos or outside project.


      3. **ULID-only comparison**: Skip slug resolution entirely. Only deduplicate exact string
      matches. Simpler but doesn't solve the original problem.


      **Recommendation:** Option 1 (lazy load) - the merge driver already reads YAML files, loading
      the index is similar overhead and provides correct behavior.


      This question should be answered before starting implementation.
    supersedes: null
    author: "@claude"
    created_at: 2026-01-26T18:39:26.534Z
  - _ulid: 01KFXSTHH9K21G8XZQWZB1GK3E
    content: >-
      **Design decision resolved:** Use Option 1 (lazy load index).


      During merge, load the kspec context to resolve refs to canonical ULIDs before comparison. The
      merge driver already does file I/O, so loading the index is acceptable overhead for correct
      behavior.


      Implementation:

      1. In `mergeSetArray` (or a wrapper), detect if array contains @ refs

      2. If refs detected, call `loadKspecContext()` or similar to get ref resolver

      3. Normalize all refs to ULIDs before Set comparison

      4. Output uses 'ours' format preference


      This removes the open question - task is now fully actionable.
    supersedes: null
    author: "@claude"
    created_at: 2026-01-26T18:42:26.985Z
