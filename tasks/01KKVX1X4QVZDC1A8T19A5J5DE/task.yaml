title: Ensure YAML round-trip stability
type: task
description: >-
  Verify and enforce that reading a YAML file and re-writing it without logical changes produces
  identical output. Without this, any kspec command that touches a file produces noisy diffs from
  formatting changes, polluting shadow branch git history.


  Covers ac-3 of @yaml-serialization-invariants. Separate from the field ordering work (ac-1, ac-2,
  ac-4) because round-trip stability touches all YAML write paths and may require auditing multiple
  serialization call sites.
