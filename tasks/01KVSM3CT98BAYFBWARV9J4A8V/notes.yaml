    content: "Approach: reproduce the full-suite flake with npm test -- --fresh, inspect runner/Vitest
      configuration and daemon-sensitive fixtures for cross-file contention, then make the smallest
      stabilization or diagnostics change that addresses the broad STACK_TRACE_ERROR hook-failure
      pattern. Edge cases: failures may be caused by concurrent CLI subprocess fan-out, daemon
      fixture cleanup leaks, or condensed runner output hiding the primary cause. Test plan: run
      focused affected slices if a specific path is changed, then required format/lint/typecheck/npm
      test and kspec validations before submit."
