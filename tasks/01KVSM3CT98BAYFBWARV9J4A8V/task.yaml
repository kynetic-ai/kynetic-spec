title: Stabilize full npm test flake after broad unrelated failures
type: bug
description: "During review of @01KVS3FSSRJ6E6M2VEAKBE322G, the first full npm test run failed with
  48 suites marked failed but only 21 individual tests failed. Most failures were STACK_TRACE_ERROR
  in unrelated beforeEach/afterEach hooks, plus isolated unrelated failures in batch stdin handling,
  daemon watcher propagation, and daemon fixture cleanup. The changed test-result suites passed in
  that run. A fresh rerun of every failed file passed: 153 suites, 593 tests. Investigate why the
  full runner can produce this broad one-off failure pattern and make the suite stable or improve
  diagnostics."
