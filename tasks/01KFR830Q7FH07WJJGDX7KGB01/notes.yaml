notes:
  - _ulid: 01KFR830Q77F54SJRQF9Z2D638
    content: >-
      Implementation notes (auto-generated from spec):


      Ralph prompt refactoring to delegate to skills. Ralph includes skill invocation as literal
      text in prompt; it does NOT detect or parse skill invocation from agent output.



      Acceptance Criteria:

      - ac-1: Given ralph iteration starts, when prompt built, then includes iteration N/M, session
      ID, no-human flag

      - ac-2: Given prompt built, when content examined, then does NOT contain step-by-step task
      work instructions

      - ac-3: Given prompt built, when content examined, then contains literal strings /task-work
      loop and /reflect loop

      - ac-4: Given agent output received, when ralph processes output, then ralph does NOT parse or
      detect skill invocation patterns

      - ac-5: Given iteration begins, when agent follows prompt, then invokes /task-work loop

      - ac-6: Given pending_review exists, when agent follows prompt, then spawns subagent with
      /pr-review @task-ref

      - ac-7: Given iteration ends, when agent follows prompt, then invokes /reflect loop
    supersedes: null
    author: "@claude"
    created_at: 2026-01-24T14:56:18.151Z
  - _ulid: 01KFR86BN0N4GEKEPPJBAVH2XD
    content: "Implementation notes: 7 ACs covering context, no-inline, literal-skill, no-detection,
      task-work, pr-review, reflect. Prompt includes iteration N/M, session ID, no-human-in-loop
      flag. Prompt includes LITERAL strings /task-work loop and /reflect loop (skill invocation via
      text). Ralph does NOT parse or detect skill invocation from agent output - skills are
      agent-side only. Prompt does NOT include step-by-step instructions."
    supersedes: null
    author: "@claude"
    created_at: 2026-01-24T14:58:07.648Z
