      ## COVERAGE GAPS IDENTIFIED


      ### Current Status

      3/5 ACs properly covered in daemon-context-manager.test.ts


      ### Weak Coverage: ac-14 (Re-registration After Restart)

      AC-14: Given daemon restarts, when first request for a project arrives, then project is
      re-registered automatically


      Issue: Current test checks independent registration but doesn't test the restart scenario.


      ### Weak Coverage: ac-15 (Empty Project List After Restart)

      AC-15: Given daemon running with registered projects, when daemon restarts, then registered
      project list is empty


      Issue: Tests listing but not persistence across restarts.


      ### What's Needed

      - ac-14: Test that simulates daemon restart, then verifies re-registration on first request

      - ac-15: Test that registers projects, simulates restart, verifies list is empty


