title: Fix session task counting for claude-agent-acp and codex-acp adapters
type: task
description: "countTaskCompletions() in src/sessions/store.ts:1654 and extractTaskTransitions() rely
  on rawInput.command being a plain string containing 'task complete'. Two ACP adapters break this:
  (1) claude-agent-acp sets rawInput to {} (empty) — command never recorded in rawInput.command, (2)
  codex-acp sets rawInput.command to an array like ['/usr/bin/bash', '-lc', 'kspec task complete
  @ref'] instead of a string. Result: kspec session log list shows Tasks=0 for all sessions since
  ~Feb 24. Fix: normalize command extraction to handle string, array, and _meta.claudeCode fallback
  formats. Affects both countTaskCompletions and extractTaskTransitions in store.ts."
spec_ref: "@session-log-list"
