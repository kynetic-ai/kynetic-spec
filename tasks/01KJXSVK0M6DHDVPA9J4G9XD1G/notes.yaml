  - _ulid: 01KK0WQWWF5BV0ENPQ5C6NJ1GB
    content: >-
      Fix cycle 2: Addressed all three MUST-FIX items from review.


      1. Valid Items count: Changed from using refErrors.ref (the broken target reference) to
      sourceUlid/sourceFile (the item containing the broken reference). This correctly identifies
      which items have validation errors instead of counting nonexistent targets.


      2. AC Coverage %: Replaced item-level approximation with actual AC-level computation. Now sums
      acceptance_criteria_count from the items API (total ACs = 20 in test data) and parses
      uncovered ACs from completeness warning details field. Coverage = (totalACs - uncoveredACs) /
      totalACs. Display also shows 'N/M ACs with tests' for transparency.


      3. Loading skeleton: Replaced all animate-pulse classes with ds-shimmer utility from
      lib/ds/animations.css, which provides proper shimmer animation with @media
      (prefers-reduced-motion: reduce) gating.


      Files changed:

      - packages/web-ui/src/routes/validate/+page.svelte — All three metric/skeleton fixes

      - packages/web-ui/tests/e2e/validate.spec.ts — Updated mock items with
      acceptance_criteria_count, adjusted AC coverage assertion from 90% to 95%
    supersedes: null
    author: "@claude"
    created_at: 2026-03-06T06:18:14.800Z
  - _ulid: 01KK1VV62AD9JK48BEZQEYS8KD
    content: "Review findings: MUST-FIX 1) AC Coverage is undercounting uncovered trait ACs. In
      packages/web-ui/src/routes/validate/+page.svelte:239-247, countUncoveredACs() only parses
      details matching '^Uncovered: ...', but trait coverage warnings are emitted as 'Uncovered
      trait ACs: ...' (src/parser/validate.ts:1050). This inflates displayed AC coverage whenever
      trait AC gaps exist. Add parsing for trait warning format and add an E2E assertion covering
      trait_ac warnings. 2) kspec validate still reports a warning for this spec: 'Validation and
      Alignment View status is in_progress but should be not_started' (kspec validate output lines
      52-53). Per review checklist, warnings for this spec are blocker-level and must be resolved
      before merge."
