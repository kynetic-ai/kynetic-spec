    content: >-
      Approach: Identified 6 categories of issues across e2e tests:


      1. Invalid ULID: task test-task-manual-only uses 01KG0RRHCC9N4YGP991WD7XSML (contains 'L', not
      valid Crockford base32). Fix: replace with 01KG0RRHCC9N4YGP991WD7XSMN across
