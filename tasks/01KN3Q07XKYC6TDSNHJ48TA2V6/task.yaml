slugs:
  - task-fix-api-watcher-e2e-full-gate
title: Fix API watcher E2E failures blocking the full CI gate
type: bug
description: >-
  What: Fix the remaining API watcher Playwright failures that still reproduce through all retries
  in the full E2E run. The currently failing tests are tests/e2e/api-watcher.spec.ts: 'file change
  via HTTP API mutation triggers watcher broadcast' and 'broadcasts sessions updates when a session
  file changes'.


  Why: The full Playwright gate cannot replace the current smoke-only CI gate while these watcher
  coverage tests remain persistently red. These tests validate daemon file watching, API mutation
  fanout, and session-update broadcasts, so leaving them red would keep a real regression hole in
  the CI signal.


  How:

  1. Reproduce only the failing watcher cases with focused Playwright runs against
  tests/e2e/api-watcher.spec.ts.

  2. Inspect the generated trace.zip, video.webm, and error-context.md artifacts to determine
  whether the failure is caused by missing broadcasts, wrong event payloads, debounce timing,
  fixture setup, or the E2E harness not observing the event stream.

  3. Check the daemon watcher implementation and the E2E fixture wiring used by this spec, then fix
  the root cause rather than widening waits blindly.

  4. Re-run the focused spec until both failing cases pass consistently under retries.

  5. Run the relevant broader E2E slice or full suite segment needed to prove the fix does not
  regress related watcher coverage.


  Reviewer scope note: Reviewers should focus approval on the affected tests and the code needed to
  make those tests pass. Other known full-suite failures are intentionally split into sibling tasks
  and should not block approval for this task unless the changes here materially affect them.
  Sibling tasks covering the rest of the known failure set are:
  @task-fix-observations-e2e-full-gate, @task-fix-review-detail-e2e-full-gate,
  @task-fix-review-interaction-e2e-full-gate, @task-fix-sessions-detail-filter-e2e-full-gate,
  @task-fix-sessions-live-update-e2e-full-gate, @task-fix-workflows-loading-e2e-full-gate, and
  @task-stabilize-full-gate-e2e-flakes.
