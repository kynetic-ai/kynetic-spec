    content: 'Original idea: Generic kspec batch command that accepts JSON array of CLI commands.
      Example: [{"cmd": "item ac add", "ref": "@spec-1", "given": "..."}]. Skills/scripts generate
      JSON, CLI executes. Supports --dry-run, --file/stdin input. Replaces need for command-specific
      bulk variants.'
