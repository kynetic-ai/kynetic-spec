title: Consolidate all tests under root tests/ directory
type: task
description: "Tests are split between packages/web-ui/tests/ (11 vitest unit tests + 44 playwright
  e2e specs) and tests/ (200+ vitest tests). This causes two problems: (1) the root test:e2e script
  uses npm link to make the built kspec binary globally available, which overwrites the system kspec
  — unsafe for dispatch agents; (2) agents working on tests miss common patterns because helpers and
  tests live in different package trees. Moving everything under tests/ eliminates npm link by using
  the existing CLI_PATH helper, and puts all tests in one discoverable location."
