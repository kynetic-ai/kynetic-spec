  - _ulid: 01KHWS1EV61C1WEDAVPBHWKCZD
    content: Added commentOnPRReviewIncomplete() function that uses 'gh pr list' to find the open PR on
      the current branch and posts a warning comment when the review subagent times out or fails.
      Called from both the timeout and failure paths in processPendingReviewTasks. The comment warns
      that the PR was not fully reviewed and recommends manual review before merging. This creates a
      visible GitHub-level marker that the check-unresolved-comments CI check can surface.
