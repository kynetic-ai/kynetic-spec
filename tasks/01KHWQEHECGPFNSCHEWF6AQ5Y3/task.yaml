title: Add merge blocker when review subagent times out
type: task
description: >-
  When a ralph review subagent times out, markTaskNeedsReview is called but the PR itself has no
  GitHub-level blocker. The next iteration's worker or CI auto-merge can merge the PR without any
  review having occurred.


  When a review subagent times out or fails:

  - Add a 'review-pending' label to the PR, OR

  - Post a comment noting the review was incomplete

  - Do not proceed to merge until a review subagent successfully completes


  This prevents the rubber-stamp pattern observed in session 01KHW4RP where all 10 PRs merged with
  zero reviews.
