notes:
  - _ulid: 01KHASR8CAMRSTZSBJ5537JF3W
    content: "Bug: noise phrases split across chunk boundaries (e.g. 'No onPostToolUse' + 'Hook found
      for tool use ID: toolu_...') both emit as streaming events. Need boundary-aware buffering in
      createTranslator. Also: stripped-to-whitespace should return null. Analysis from PR #345 Codex
      review."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-13T06:07:01.514Z
  - _ulid: 01KHD1W8Y1WM63K2FH6YTRDTXJ
    content: "Implemented boundary-aware buffering in createTranslator to handle noise patterns split
      across chunk boundaries. Key changes: (1) Added noiseBuffer to TranslatorState, (2) Created
      processChunkWithBuffer() that checks for partial noise patterns BEFORE stripping complete
      patterns, (3) Added getPartialNoiseLength() to detect when content ends with a potential
      partial noise pattern. 7 new tests covering split-chunk scenarios including partial at 'No
      onPostToolUse', partial tool IDs, multi-split patterns, and false-positive detection."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-14T03:07:30.625Z
