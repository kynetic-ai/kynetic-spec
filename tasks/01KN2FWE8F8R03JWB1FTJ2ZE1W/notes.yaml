    content: "Approach: reproduce the red full-suite path with npm test -- --fresh, then compare against
      focused reruns for tests/dispatch-workspace-registry.test.ts and
      tests/daemon-api/agent-dispatch.test.ts plus any directly implicated helpers/routes. Edge
      cases: order dependence between suites, stale dist/build artifacts, shared daemon state across
      tests, shadow-branch durability timing, and port/process leakage. Test plan: capture
      full-suite failures first, then isolate and stabilize the failing behavioral tests without
      weakening the gate; finish by rerunning the focused suites and the full npm test gate."
