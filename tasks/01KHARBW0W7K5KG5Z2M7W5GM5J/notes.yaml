    content: "When a PR has: (1) completed review by both agent and Claude, (2) CI green, (3) no open
      review threads, (4) no unaddressed comments — collapse steps 3-7 into single verification.
      Requires actual review completion, not just absence of comments. Data: p50 is 137s, mostly
      trivially-passing gates."
    supersedes: null
    author: "@claude"
    created_at: 2026-02-13T05:42:47.074Z
  - _ulid: 01KHD372PT3VK49SCH7FSS577X
    content: Added fast-path section to pr-review skill. When subagent detects clean PR state (CI green,
      no comments, no threads, no changes requested), it skips the full workflow and proceeds
      directly to merge. Updated examples to show both fast-path and full workflow flows. This is
      skill-level guidance change - no code implementation needed since it directs subagent
      behavior.
    supersedes: null
