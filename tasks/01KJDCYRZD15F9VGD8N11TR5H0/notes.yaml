  - _ulid: 01KJDY1P24K2AVEJPJNWTT9ZVT
    content: >-
      Implemented per-role adapter selection:


      1. Added --worker-adapter and --reviewer-adapter CLI options

      2. Resolve adapters with precedence: role flag > --adapter > default (claude-agent-acp)

      3. Validate both adapters at startup, deduplicating when same ID (via Set)

      4. Inject env for each unique adapter, track previous values per adapter in Map for cleanup

      5. Worker adapter used for main iteration spawn and wrap-up agent

      6. Reviewer adapter used for processPendingReviewTasks

      7. Dry-run output shows both adapter IDs

      8. Session start event records workerAdapter and reviewerAdapter

      9. Cleanup (both signal handler and finally block) restores env for all unique adapters


      Tests cover all 12 ACs. 2 pre-existing failures in session-budget-integration.test.ts (tracked
      by @01KJDSXE).
    supersedes: null
    author: "@claude"
