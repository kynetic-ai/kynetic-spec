notes:
  - _ulid: 01KK3Q1ETM9AG90MV4YDC5B3Q1
    content: "Fix applied: replaced onMount+$effect(version>0) data loading pattern across all 13 route
      pages with a single $effect gated on isProjectInitialized(). This is the same pattern used in
      the Sidebar fix (bf6611352). Pages fixed: dashboard, tasks list, task board, specs, inbox,
      observations, agents, sessions, workflows, plans, settings, validate, triage. The root cause:
      onMount() data loads could fire before the project store resolved the active project, causing
      API calls with wrong/missing X-Kspec-Dir header. The fix gates all initial data loads on
      isProjectInitialized(), ensuring the project context is established before any API calls."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-07T08:36:19.924Z
