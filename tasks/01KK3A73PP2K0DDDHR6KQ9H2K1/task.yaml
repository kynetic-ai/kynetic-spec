title: Fix kanban board and task views loading tasks from wrong project on initial page load
type: task
description: "The kanban board shows only 2 tasks in Backlog and 0 in Ready/In Progress, while the
  task list shows 27 pending and 1 in progress. The board is loading tasks from the wrong project
  context on initial page load — same root cause as the sidebar badge count bug (@01KK39QY). The
  fetchTasks() call in loadBoard() fires before the active project is resolved, so the X-Kspec-Dir
  header either points to the wrong project or is missing. Fix: ensure loadBoard() waits for the
  active project to be resolved before calling fetchTasks(). This likely affects ALL data-loading
  pages, not just the board — consider fixing the project context initialization centrally in the
  layout or API layer."
