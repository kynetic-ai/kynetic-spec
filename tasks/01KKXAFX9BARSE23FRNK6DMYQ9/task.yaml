title: Fix YAML.stringify anchor/alias crash when sortMapEntries reorders shared references
type: task
description: >-
  ## Problem


  `toYaml()` crashes with 'Unresolved alias (the anchor must be set before the alias): a1' when
  serializing objects that contain shared JS object references.


  ## Root Cause


  Commit c6138a963 added `sortMapEntries: canonicalKeyComparator` to `YAML.stringify()` in
  `toYaml()`. The `yaml` library detects shared JS object references (same object used in multiple
  places) and serializes them as YAML anchors (`&a1`) and aliases (`*a1`). When `sortMapEntries`
  reorders keys, it can place an alias before its anchor definition, producing invalid YAML.


  ## Reproduction


  ```typescript

  const shared = { status: 'not_run' };

  const data = { roleStates: { worker: shared, reviewer: shared } };

  YAML.stringify(data, { sortMapEntries: comparator }); // throws

  YAML.stringify(data, {});                              // works

  ```


  ## Where It Triggers


  Dispatch workspace registry records: Zod schema defaults create shared object instances (e.g. the
  same default `RoleBootstrapStateSchema` object is reused for both worker and reviewer). When
  `saveDispatchWorkspaceRecord()` calls `writeYamlFilePreserveFormat()` → `toYaml()`, the shared
  references trigger the anchor/alias crash.


  ## Bisect Evidence


  - Passes on main and on aa53ca909 (commit before canonical ordering)

  - Fails on c6138a963 (canonical ordering commit) and all subsequent commits

  - 7 of 8 tests fail in dispatch-runtime-bootstrap-contract.test.ts

  - 1 of 1 fails in dispatch-workspace-and-scheduler-flow.test.ts (cascading: bootstrap crash
  prevents invocations)


  ## Investigation Paths


  1. **Deep-clone before serialization**: `toYaml(structuredClone(obj))` breaks shared references so
  the yaml library won't generate anchors. Simple but adds overhead for every YAML write.

  2. **Set `yaml` library option to avoid anchors**: Check if `YAML.stringify` accepts an option
  like `anchorPrefix: false` or a custom `createNode` that avoids Alias nodes.

  3. **Deep-clone only in dispatch-workspaces.ts**: Narrower fix — clone the workspace data before
  saving. Targets only the known trigger.

  4. **Strip shared refs in Zod output**: Ensure Zod schema `.default()` calls return fresh objects
  (they should, but verify the dispatch workspace schema).


  Option 1 is the safest systemic fix since any Zod schema with shared defaults could trigger this.
