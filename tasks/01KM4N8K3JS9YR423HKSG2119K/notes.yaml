notes:
  - _ulid: 01KM4N8K3PX7JE0MP9G2TDT6V1
    content: "Validated and clarified on 2026-03-19: kspec setup should only remove or rewrite Stop hook
      entries that kspec previously installed. It must preserve unrelated user-defined Stop hooks in
      .claude/settings.json."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-20T03:40:12.790Z
  - _ulid: 01KM4SHAXAXRM3Q14PJ4X187H1
    content: Setup currently matches Stop hooks by command substring, which lets reconciliation treat
      user-owned entries as kspec-managed. Updating setup/status to recognize only the exact
      kspec-installed Stop entry shape, then adding a regression test that seeds a custom Stop hook
      and verifies setup preserves it when checkpoint is disabled.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-20T04:54:53.610Z
  - _ulid: 01KM4SX42ES95ZMW62NKMEJH50
    content: "Implemented Stop-hook reconciliation by extracting a helper for the exact kspec-managed
      checkpoint entry shape and reusing it in setup/status detection. Added regression coverage
      proving checkpoint disable removes only the managed entry and that setup still installs its
      own Stop hook alongside a user-defined Stop hook using the same command. Verification: npm
      test -- enhanced-setup passed. Full npm test still fails in unrelated plan-list coverage
      outside this task: tests/cli-plan.test.ts 'excludes cancelled tasks while preserving
      plan_ref-linked plan list counts' resolves an 8-character plan ULID prefix to a non-plan ref
      during task add."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-20T05:01:19.822Z
