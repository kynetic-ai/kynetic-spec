title: Add server-side aggregation endpoints
type: task
description: >-
  Three independent server-side endpoints. Can be implemented incrementally.


  1. Task status summary: Endpoint returning counts by status with dependency-aware ready vs blocked
  distinction.


  2. Validation/alignment stats: Extend validation/alignment response to include entity counts, AC
  counts, and orphan counts as pre-computed fields. Eliminates the fragile pattern of parsing
  free-text warning detail strings with regex for AC coverage calculation.


  3. Inbox/triage merge: Merged endpoint returning inbox items with inline triage status.


  Add response types to @kynetic-ai/shared package. Each must respect X-Kspec-Dir project scoping.


  Acceptance gates (from @ui-api-aggregation): Status counts with dependency-aware distinctions
  (ac-1), coverage stats as pre-computed fields (ac-2), inbox items with inline triage status
  (ac-3).
