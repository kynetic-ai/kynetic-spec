  - _ulid: 01KKNSERDS5HK800JNC52FAVHV
    content: >-
      Execution context:

      - Background: First task in the review records plan. Creates the foundational Zod schemas for
      the review record data model.

      - Scope: src/schema/review-records.ts (new file) + export from src/schema/index.ts.
      Schema-only — no parser, CLI, or storage layer (those are separate downstream tasks).

      - Files: src/schema/review-records.ts (new), src/schema/index.ts (1-line export),
      tests/review-records-schema.test.ts (new)

      - Verification: 75 schema validation tests passing, covering all 4 ACs


      Implemented all schemas from the plan:

      - ReviewLifecycleStateSchema (draft/open/closed/archived)

      - ReviewDispositionSchema (pending/approved/changes_requested) — computed, not stored

      - ReviewGateStateSchema (passing/failing/pending) — computed, not stored

      - ReviewSubjectSchema — discriminated union (code/plan/task/spec/external)

      - ReviewSubjectVersionSchema — discriminated union (code_compare/entity_version)

      - ReviewAnchorSchema — discriminated union (code/structured)

      - ReviewThreadSchema with kind (blocker/question/nit, default nit), entries, resolved state

      - ReviewCheckSchema with applies_to_version binding

      - ReviewVerdictSchema with role (default 'reviewer'), applies_to_version binding

      - ReviewEventSchema with event_type enum and payload

      - ReviewRecordSchema — full record with all arrays defaulting empty

      - ReviewRecordInputSchema — input variant with optional fields

      - ReviewRecordsFileSchema — collection wrapper with kynetic_reviews version key


      Followed existing patterns: imported UlidSchema/SlugSchema/RefSchema/DateTimeSchema from
      common.ts, NoteSchema from task.ts. Matches plan.ts and task.ts schema structure.
    supersedes: null
    author: "@claude"
