  - _ulid: 01KGK69CXAW00RZN2G31C93VK4
    content: >-
      Updated documentation in three files to clarify loop mode blocking pattern:


      1. **task-work/SKILL.md**: 
         - Rewrote Exit Conditions to emphasize 'no eligible tasks' means ALL tasks
         - Added 'Blocking vs End-Iteration' section with comparison table
         - Clarified that tasks must be ATTEMPTED before blocking
         - Added valid/invalid end-iteration reasons
         - Expanded 'What Is NOT an Exit Condition' with explicit guidance on what to do instead

      2. **AGENTS.md**:
         - Added 'Task Blocking in Loop Mode' section after Task States
         - Documents the attempt→block→check→continue pattern
         - Lists valid vs invalid blocking reasons
         - Example commands for proper blocking workflow

      3. **kspec/SKILL.md**:
         - Added cross-reference note in Blocking section pointing to /task-work for loop mode details
