notes:
  - _ulid: 01KR4K6TDQS02TP27VWDKKNRD0
    content: "Approach: documentation correction (no rename). createTestApp overclaims 'all API routes';
      production registers more route groups (projects, refs, diff, command, automation, debug,
      web-ui), inline /api/health, /ws WebSocket, CORS + localhostOnly, heartbeat/dispatch wiring,
      and onProjectRegistered (entity cache, shadow sync, session sync). Helper omits all of those
      and disables the file watcher. Plan: rewrite file header + createTestApp docstring to
      enumerate included route groups and excluded behaviors; add helpers.test.ts cases asserting
      boundary (/api/health 404, /api/projects 404, /api/debug 404, /ws 404, non-localhost Host
      accepted)."
    supersedes: null
    author: "@claude"
    created_at: 2026-05-08T20:07:04.887Z
  - _ulid: 01KR4M3VR9ZSFQDAH7CM2B7F1Y
    content: "Implementation complete. Modified helpers.ts to rewrite the file header and
      createTestApp() docstring with explicit boundary documentation (registered route groups,
      omitted production routes, omitted server-level wiring, helper selection guide). Added 7
      boundary tests in helpers.test.ts asserting that /api/health, /api/projects,
      /api/debug/cache-status, /api/diff, /api/refs, and /ws return 404 from the in-process app,
      that localhostOnly is not installed (non-loopback Host header is not 403), and that an
      in-scope route (/api/tasks) reaches a real handler. Annotated tests with both spec ACs
      (ac-helper-scope-is-explicit, ac-test-uses-helper-matching-behavior). Test suite results: 8826
      of 8832 passed (5 skipped); the lone failure in tests/daemon-api/websocket-protocol.test.ts >
      bun runtime > beforeEach was a real-daemon Bun cold-start timeout unrelated to my changes
      (that file does not import helpers.ts) and the test passes when re-run in isolation in 7.7s."
    supersedes: null
    author: "@claude"
    created_at: 2026-05-08T20:22:56.521Z
