  - _ulid: 01KKJ2GT1SNCP270QZ3VWTE98P
    content: "[FIX_CYCLE: 2] Rebased task branch onto main and fixed a workspace-registry mutation race
      introduced by narrowing the invocation lock. Dispatch now still overlaps invocation execution,
      but markDispatchWorkspaceActive/Idle re-enter the shadow mutex so lifecycle transitions cannot
      be overwritten back to pending. Verification: npm test passed on the rebased head; kspec
      validate still reports only the repository's existing warnings."
    supersedes: null
