  - _ulid: 01KJV3CEWQVE6VM10AT128AK4G
    content: >-
      Execution context:

      - Background: saveSpecItem currently forwards a full LoadedSpecItem into updateSpecItem, which
      risks stale-field clobbering under concurrent edits.

      - Scope: harden save/update flow so only explicit patch fields are written, and make update
      path robust when stored _path becomes stale.

      - Files: src/parser/yaml.ts and new/updated parser concurrency tests.

      - Verification: targeted vitest for spec-item concurrency coverage, then broader
      test/validation checks before submit.
    supersedes: null
    author: Jacob Chapel
