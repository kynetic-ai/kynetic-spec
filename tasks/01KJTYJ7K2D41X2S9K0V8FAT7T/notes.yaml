  - _ulid: 01KJV3PT6JW0RX9AAMHAA0Q8T5
    content: >-
      Implemented concurrency hardening for spec item writes:

      - saveSpecItem now requires an explicit patch payload and rejects empty updates, preventing
      stale full-object writeback.

      - updateSpecItem now validates patch shape and rejects LoadedSpecItem-style payloads (runtime
      metadata keys).

      - updateSpecItem now verifies _path target ULID and falls back to ULID lookup when path index
      becomes stale after concurrent structural edits.

      - Added regression tests in tests/spec-item-mutation-serialization.test.ts for stale _path
      fallback, patch-only save behavior, and guardrails.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-04T00:24:32.723Z
