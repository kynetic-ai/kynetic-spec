title: Implement cancelled-task dependency cleanup during task cancellation
type: task
description: >-
  What: Extend task cancellation so cancelling a task also removes that task from downstream
  depends_on arrays, records the cleanup on affected tasks, and leaves the task graph in a
  consistent post-cancellation state.


  Why: A cancelled prerequisite represents abandoned work, not completed work. Leaving downstream
  dependency links in place creates stale blocking state and forces operators to manually repair
  task graphs after routine cancellation decisions.


  How: Update the cancellation flow to discover downstream tasks that reference the cancelled task,
  remove those dependency refs, append clear audit notes on affected tasks, and persist the task
  cancellation plus downstream cleanup as one atomic shadow mutation. Preserve current ready
  semantics so only completed dependencies satisfy readiness; downstream tasks should become ready
  only because the cancelled dependency link was explicitly removed. Add direct test coverage for
  zero, one, and many downstream dependents, unchanged unrelated tasks, downstream readiness after
  cleanup, and no observable partial state after the command completes.
