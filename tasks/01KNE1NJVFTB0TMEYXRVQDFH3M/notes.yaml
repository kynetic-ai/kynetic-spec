  - _ulid: 01KNE7FPNV9X009NR3K4AMAXQZ
    content: "Fix cycle 1: addressed the review blocker by replacing the invalid-port shortcut test with
      a real daemon startup smoke that builds the daemon, boots it under isolated node and bun
      runtimes, and probes /api/health from temp fixtures. Implementation updates: installed
      @elysiajs/node (^1.4.5, compatible with the resolved elysia 1.4.22 peer range >=1.4.0),
      applied the node adapter at runtime, replaced Bun.file() SPA fallback serving with a Response
      backed by index.html bytes, and made shutdown work with both stop() and close(). Verification:
      npm test -- tests/daemon-build.test.ts, npm test -- tests/daemon-api/server.test.ts, npm test
      -- tests/daemon-diff-api.test.ts, npm test -- --fresh, and kspec validate (warnings only;
      repository-wide pre-existing warning debt)."
