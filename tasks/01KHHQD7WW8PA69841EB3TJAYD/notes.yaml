  - _ulid: 01KHJ1WWH7RMKMWGY4ZACVS85Y
    content: >-
      Implemented Skill Platform Config CLI with all 4 ACs:


      1. AC-1: --platform-config claude_code.key=value updates platform_config.claude_code in
      meta.yaml

      2. AC-2: --platform-config codex.key=value updates platform_config.codex in meta.yaml  

      3. AC-3: platform_config already included in JSON output (verified with test)

      4. AC-4: Validation errors show guidance on valid keys per platform (ClaudeCodeConfigSchema,
      CodexConfigSchema)


      Features:

      - Parses platform.key=value format

      - Converts true/false strings to booleans, otherwise string values

      - Deep merges into existing platform_config (doesn't replace entire object)

      - Multiple --platform-config options can be passed in single command

      - Schema validation catches invalid keys due to strict mode


      Added 12 tests in tests/skill-cli.test.ts covering all ACs plus edge cases (deep merge,
      multiple platforms, invalid format).
