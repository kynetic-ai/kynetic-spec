  - _ulid: 01KG2HYTMPR6CHT5C9GRRCAH7T
    content: >-
      ## Issue Summary


      GitHub Pages deployment tries to connect to WebSocket (ws://localhost:3456/ws) instead of
      using static JSON mode.


      ## Architecture (Working as Designed)


      The app has proper mode detection in `+layout.svelte`:

      1. `initMode()` called first - tries daemon health check with 2s timeout

      2. Falls back to loading `/kspec-snapshot.json` from static files

      3. Only initializes WebSocket if in daemon mode


      ## Key Files


      - `packages/web-ui/src/lib/constants.ts` - Hardcoded localhost:3456 URLs

      - `packages/web-ui/src/lib/stores/mode.svelte.ts` - Mode detection and fallback logic

      - `packages/web-ui/src/routes/+layout.svelte` - WebSocket conditional init

      - `.github/workflows/gh-pages.yml` - Builds and deploys snapshot


      ## Likely Root Causes


      1. **Static JSON not accessible**: `kspec-snapshot.json` may be missing or at wrong path due
      to BASE_PATH

      2. **Fallback defaults to daemon**: If static JSON fails to load, mode.svelte.ts line 63
      defaults to daemon mode

      3. **Base path mismatch**: JSON exported but not found at `/kynetic-spec/kspec-snapshot.json`


      ## Next Steps


      - Analyze spec coverage for static mode behavior

      - Identify gaps in mode detection/fallback logic

      - Plan fix for proper static mode on GitHub Pages
    supersedes: null
    author: "@claude"
    created_at: 2026-01-28T15:01:10.935Z
  - _ulid: 01KG2KN9GVR5Z6TX6GSKPWTFHY
    content: |-
      ## Implementation Approach

      ### Build-Time Static Mode Flag
      - Add VITE_STATIC_MODE env var check in mode.svelte.ts
      - When true, skip daemon detection entirely
      - Load static snapshot directly with base path prefix
      - If load fails, stay in static mode with error (never fall back to daemon)

      ### Files to Modify
      1. packages/web-ui/src/lib/stores/mode.svelte.ts
         - Import base from $app/paths
         - Add BUILD_STATIC_MODE constant from import.meta.env.VITE_STATIC_MODE
         - Add loadStaticSnapshot() helper with base path and error logging
         - Modify initMode() to check flag first

      2. .github/workflows/gh-pages.yml
         - Add VITE_STATIC_MODE: 'true' to build env

      3. packages/web-ui/src/lib/components/Sidebar.svelte
         - Import goto from $app/navigation
         - Replace window.location.href with goto()

      ### Spec Coverage
      - ac-19: Build flag skips daemon detection
      - ac-20: Base path prefix for snapshot URL
    supersedes: null
    author: "@claude"
