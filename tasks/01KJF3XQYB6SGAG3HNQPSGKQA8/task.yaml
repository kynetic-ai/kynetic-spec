title: Fix ralph adapter validation false-negative for codex-acp
type: bug
description: Ralph adapter startup validation currently probes adapters with 'npx --no-install <pkg>
  --version'. @zed-industries/codex-acp does not support --version and exits non-zero, causing a
  false 'Adapter package not found' error even when the package exists. Update validation to use an
  adapter-agnostic availability probe and keep the existing error behavior for truly missing
  packages. Add regression tests covering codex-acp-like CLIs that reject --version but support
  --help.
