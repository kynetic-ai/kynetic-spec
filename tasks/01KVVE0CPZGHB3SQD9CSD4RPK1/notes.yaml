notes:
  - _ulid: 01KVVEBZHE05C9HGZCGQJEC1PA
    content: "Approach: add a parser-layer coverage evidence index builder that can be called with
      preloaded items, structured AC annotations, resolved freshness, verification stamps, and
      normalized test-run records, plus a context wrapper that loads items, scans configured
      annotations, resolves freshness, and reads only run ids listed in
      coverage/test-runs/index.yaml. Reuse scanACAnnotations, ReferenceIndex,
      resolveAcFreshnessWithBoth, and test-result run schemas/store; do not derive coverage state or
      add daemon/UI APIs. Edge cases: criteria with no evidence still get one entry,
      malformed/blanket annotations do not create criterion evidence, N/A annotations remain labeled
      annotation evidence but not positive state, missing test-run index means no runs, latest
      mapped run is selected by completed_at then run id, and unmapped/invalid cases stay outside
      criterion entries. Test plan: behavioral unit tests for all six @coverage-evidence-index ACs,
      including two neutral project fixtures with different layouts and producers."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-23T23:52:08.494Z
  - _ulid: 01KVVER7NW1EXA2A190V19KA19
    content: Implemented initial coverage evidence index module and AC-annotated behavioral tests. The
      builder now creates one entry per live AC, labels annotation/bootstrap/verification/ingested
      evidence, selects latest mapped run evidence by completed_at plus run id, and exposes
      unmapped/invalid result evidence separately. Focused test passed before formatting; format and
      changed-file oxlint are clean.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-23T23:58:50.044Z
  - _ulid: 01KVVFJQXXT5952RCYCVG26TYM
    content: "Completed implementation in commit acc03f55d7. Added src/parser/coverage-evidence-index.ts
      with a pure evidence builder plus loadCoverageEvidenceIndex(ctx), which joins live ACs,
      structured annotations, bootstrap freshness, recorded verification stamps, and indexed
      normalized test runs. Added tests/coverage-evidence-index.test.ts covering all six
      @coverage-evidence-index ACs with neutral project fixtures and authoritative test-run index
      behavior. Verification passed: npm run format:check; npx oxlint
      src/parser/coverage-evidence-index.ts tests/coverage-evidence-index.test.ts; npm run
      typecheck; npm run lint -- --quiet (0 errors, existing warning baseline); npm test -- --run
      tests/coverage-evidence-index.test.ts; npm test (2903 suites passed, 11025 tests passed, 3
      skipped); kspec validate --refs --warnings-ok; kspec validate --alignment --warnings-ok; kspec
      validate --completeness --warnings-ok."
    supersedes: null
