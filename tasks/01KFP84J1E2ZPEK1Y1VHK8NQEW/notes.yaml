      ## UPDATED INSTRUCTIONS - Supersedes previous notes


      ### Goal

      Implement the Dashboard view to meet AC-1, AC-2, AC-3 from @web-dashboard spec.


      ### Acceptance Criteria to Implement

      - AC-1: Dashboard shows task overview with ready, in_progress, pending_review, blocked,
      completed counts

      - AC-2: Counts animate on WebSocket updates (no page refresh)

      - AC-3: Click task count badge → navigates to filtered task list


      ### Implementation Steps

      1. Review existing Dashboard page: packages/web-ui/src/routes/+page.svelte

      2. Create TaskCountCard component showing count per status

      3. Fetch task counts from API on load

      4. Subscribe to WebSocket for real-time count updates

      5. Add click handlers that navigate to /tasks?status=X

      6. Add data-testid attributes for each element


      ### Required data-testid Attributes

      - dashboard-counts, task-count-ready, task-count-in_progress, task-count-pending_review,
      task-count-blocked, task-count-completed


      ### Definition of Done

      - [ ] Dashboard displays task counts by status

      - [ ] Counts update via WebSocket without refresh

      - [ ] Clicking count navigates to filtered task list

      - [ ] E2E tests pass for all 3 ACs

      - [ ] No test.skip() in test file
