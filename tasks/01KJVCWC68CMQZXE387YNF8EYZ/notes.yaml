  - _ulid: 01KJVD7517XKYKXCDTEQ4646FP
    content: "Root cause isolated and reproduced: daemon websocket command handler rejected CLI
      subscribe frames, first as validation_error Invalid JSON (runtime payload not always plain
      string), then as not_found due wrapper sockets without sessionId in message callback. Fixed by
      robust payload decoding (string/typed-array/blob/object) and resolving session IDs via
      PubSubManager.getSessionIdBySocket with context fallback. Added dedicated daemon websocket
      handler regression tests for all payload forms and wrapper-session resolution. Verified
      end-to-end in isolated repro project: kspec agent dispatch watch now streams [agent session]
      text chunks in real time."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-04T03:10:45.287Z
