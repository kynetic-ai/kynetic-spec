title: Free budget for no-op task completions in ralph loop
type: spike
description: "When a task is completed as 'already implemented' (--skip-review) during a ralph loop
  iteration, it counts against --max-tasks budget. This wastes iterations. Proposed approach: track
  task starts and completes per iteration; if a complete happens without a corresponding start after
  iteration reset, treat it as free (don't count against budget). Needs design review for edge cases
  around fix cycles and skip-review completions."
