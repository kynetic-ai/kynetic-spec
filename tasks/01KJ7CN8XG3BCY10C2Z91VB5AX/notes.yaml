  - _ulid: 01KJN9PHY0HY9NESQPG05A8BX9
    content: "Implemented fix: needs_work→in_progress transitions now exempt from both budget check and
      budget increment. Two changes in task.ts: (1) skip checkBudget() for needs_work tasks so fix
      cycles aren't blocked by exhausted budget, (2) only call incrementBudget() when previous
      status was pending. Added AC ac-needs-work-no-increment to @task-budget-enforcement spec.
      Added 2 new integration tests covering both behaviors."
