title: Fix sidebar badge counts showing stale data from wrong project on initial load
type: task
description: "When switching projects or first loading the UI for a project, the sidebar badge
  counts (inbox, observations, pending review tasks) show numbers from the previous/default project
  rather than the active one. They eventually correct after the 30-second refresh interval. Root
  cause: Sidebar.svelte loads badge counts on mount but may fire before the project context is fully
  resolved, or the initial API calls don't include the correct X-Kspec-Dir header for the active
  project. Fix: (1) ensure loadCounts() waits for the active project to be resolved before fetching,
  (2) reload counts immediately on project change (not just on version change), (3) consider
  debouncing the project switch to avoid a flash of stale counts."
