  - _ulid: 01KK3KQF02MJAT1A923XJH8SK8
    content: "Fixed sidebar badge stale data bug. Root cause: Sidebar.svelte's onMount called
      loadCounts() immediately, racing against loadProjects() in the layout. The API calls could
      fire before the project store resolved the active project, causing wrong/missing X-Kspec-Dir
      headers. Fix: Replaced the eager onMount fetch with a $effect gated on isProjectInitialized(),
      so counts only load after the project store has resolved. The $effect also reacts to
      getProjectVersion() for project switches. Polling interval deferred until project ready. All
      42 web-ui-app-shell tests pass. Also improves static mode behavior — no longer makes useless
      failing API calls when no daemon is available."
