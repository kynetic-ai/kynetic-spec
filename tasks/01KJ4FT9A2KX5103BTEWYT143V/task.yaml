title: Fix web UI sidebar navigation links not clickable
type: bug
description: "SidebarMenuButton renders a <button> element, not an <a>. When Sidebar.svelte passes
  href, the href lands on a button (which browsers ignore). Result: Dashboard, Tasks, Items, Inbox,
  Triage links are all dead — only Observations works because it uses onclick with goto(). Fix:
  either use the child snippet pattern to render an <a> tag, or add onclick handlers with goto()
  like Observations does. Also add /triage to the spaRoutes array in packages/daemon/src/server.ts
  line 338 so the daemon serves index.html for the triage route."
