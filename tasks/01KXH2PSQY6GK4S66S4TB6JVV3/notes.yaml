      DispatchCleanupError while preserving exact pre-commit/internal/invalid rows. Added missing
      failure AC annotations plus behavioral matrices for no-engine transitions, unrelated cleanup
      scope, all cleanup codes, retry, native validation, count mismatch, and nested task cleanup.
      Gates: format/diff, focused lint, repo lint 0 errors, typecheck, focused 59/59, engine/API
