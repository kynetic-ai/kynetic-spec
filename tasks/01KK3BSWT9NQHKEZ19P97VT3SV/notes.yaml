notes:
  - _ulid: 01KK3SXTJJHR7JCKCBGA3RH8Z8
    content: >-
      Fixed collapsed-by-default behavior for tool calls in session stream.


      Root cause: ToolCallView.svelte initialized expanded state as $state(block.status ===
      'running'), causing running tool calls to auto-expand during live streaming.


      Fix: Changed to $state(false) so all tool calls start collapsed regardless of status.
      User-toggled expand state is naturally preserved across periodic refreshes because Svelte's
      keyed {#each} (keyed by block.seq) reuses component instances and their internal state when
      the same key appears in a re-rendered array.


      Added E2E tests covering:

      - Completed tool calls render collapsed

      - Running tool calls in live sessions render collapsed

      - Click toggle works (expand/collapse)

      - User-expanded state persists across periodic refresh cycles
    supersedes: null
    author: "@claude"
    created_at: 2026-03-07T09:26:46.610Z
