title: Tool calls in live session stream should render collapsed by default, not expanded
type: task
description: "When viewing a live agent session, new tool call entries often appear expanded
  (showing full input/output) as they stream in. They should always render collapsed by default and
  only expand when the user explicitly clicks to expand. The issue likely occurs because the
  ToolCallView component's expanded state defaults to true or gets set to true during the
  streaming/refresh cycle when new events arrive. Fix: (1) ensure ToolCallView initializes with
  expanded=false, (2) preserve user-toggled expand state across periodic structured refreshes (don't
  reset expanded state when the event list is re-rendered from events.jsonl refresh), (3) new tool
  call entries appearing during live streaming should always start collapsed."
