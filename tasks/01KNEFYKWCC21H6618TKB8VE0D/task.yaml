title: Stabilize web UI build prep before npm test
type: bug
description: >-
  First `npm test` in the detached review workspace failed before executing any tests because the
  runner triggered `npm run build` and the web UI build errored with `ENOENT: no such file or
  directory, open "packages/web-ui/.svelte-kit/output/server/manifest-full.js"` during build prep. A
  second `npm test` run in the same workspace passed completely without code changes (2077/2077
  suites passed, 7539/7544 tests passed, 5 skipped).


  Why this needs investigation: the failure appears flaky or order-dependent in build preparation,
  which can create false negatives during review and CI-like local verification.


  Expected outcome: identify why the first build sometimes cannot read
  `.svelte-kit/output/server/manifest-full.js`, reproduce deterministically if possible, and make
  the build/test bootstrap reliable on the first run.
