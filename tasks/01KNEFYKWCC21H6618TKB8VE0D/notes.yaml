notes:
  - _ulid: 01KNEGWZ8788FE7C88ENEHDGHG
    content: "Approach: harden first-run web UI build prep by running SvelteKit sync before the packaged
      web UI build, and tighten test-runner build readiness checks so partial build state is not
      treated as healthy after a failed bootstrap. Edge cases: detached workspaces with only a
      partial .svelte-kit tree, root build failures after some artifacts are updated, workspace
      package dependencies not yet built. Test plan: exercise clean-state npm run build, validate
      npm test build-prep behavior from a scrubbed workspace, and cover the new readiness invariants
      with automated tests where feasible."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-05T09:52:03.847Z
  - _ulid: 01KNEH5ASWJXXWYXQW65CM8MNA
    content: "Implemented two reliability fixes for first-run npm test bootstrap: packages/web-ui build
      now runs svelte-kit sync before vite build so detached workspaces do not depend on leftover
      .svelte-kit state, and scripts/test.cjs now treats packages/shared/dist/index.js plus
      packages/web-ui/.svelte-kit/output/server/manifest-full.js as required build artifacts so a
      partial failed build is not mistaken for a healthy environment on the next run. Verification:
      packages/web-ui npm run build passed from the updated self-syncing path, npm test --
      tests/test-runner.test.ts passed (24 tests), and full npm test passed (2069 suites, 7518
      tests, 5 skipped)."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-05T09:56:37.821Z
