  - _ulid: 01KNEGWZ8788FE7C88ENEHDGHG
    content: "Approach: harden first-run web UI build prep by running SvelteKit sync before the packaged
      web UI build, and tighten test-runner build readiness checks so partial build state is not
      treated as healthy after a failed bootstrap. Edge cases: detached workspaces with only a
      partial .svelte-kit tree, root build failures after some artifacts are updated, workspace
      package dependencies not yet built. Test plan: exercise clean-state npm run build, validate
      npm test build-prep behavior from a scrubbed workspace, and cover the new readiness invariants
      with automated tests where feasible."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-05T09:52:03.847Z
