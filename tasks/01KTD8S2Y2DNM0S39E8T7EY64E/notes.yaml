notes:
  - _ulid: 01KTN434T5PTMXPZPGCMQ62GX5
    content: >-
      Approach: Documentation task covering @resource-docs-ui-task-markdown-behavior (4 ACs).
      Verified implemented behavior against source:

      - Task bytes route: GET /api/tasks/:ref/resources/:resourceId(/bytes); resources_base_url =
      /api/tasks/<ulid>/resources; bytes URL = <base>/<id>/bytes.

      - Task detail exposes resolved_resources (owner_type, owner_ref, id, path, content_type,
      byte_size, status, recorded/current sha256, recorded/current git_commit, message) with status
      enum present|drift|missing|unresolved.

      - Browser project context: element fetches cannot send X-Kspec-Dir header, so rendered
      <img>/<a> URLs carry ?kspec_dir=<path> query param (daemon project-context middleware reads
      header OR query).

      - Static export: present task resources copied to
      assets/resources/task/<task-ulid>/<relative-path> alongside existing plan/review layouts.

      - No task-owned resource upload CLI exists; task-owned copies only come from `kspec plan
      derive --materialize-resources`. Release notes must not claim upload commands.


      Plan: edit docs/concepts/local-resources.md (task markdown resolution, drift, task export
      path), docs/guides/working-with-local-resources.md (task API routes, browser kspec_dir context
      note, task export path, exact temp-project e2e steps that keep one daemon running),
      RELEASE_NOTES.md Unreleased (UI/static fixes). Add behavioral docs test
      tests/resource-ui-task-markdown-docs.test.ts asserting published-doc surfaces per AC,
      mirroring tests/folder-backed-resource-docs.test.ts. Annotate ACs in test + markdown.
    supersedes: null
    author: "@claude"
    created_at: 2026-06-09T02:41:24.805Z
  - _ulid: 01KTN55271ZQQNS41VA8F6HZTH
    content: >-
      Completed. Documented live UI / task-markdown resource behavior across four ACs:


      - ac-docs-name-task-resource-markdown: concept page + guide describe task-description
      ./resources/<relative-path> resolution through the task resolved_resources projection,
      covering both plan-owned references and materialized task-owned copies, with the task-scoped
      resources_base_url and GET /api/tasks/:ref/resources/:resourceId/bytes contract. Release notes
      mirror this without claiming a task resource upload command (none exists; upload is
      plan/review only).

      - ac-docs-name-task-resource-drift: documented present/drift/missing/unresolved status enum +
      message; drifted/missing/unresolved surface status instead of silently serving replacement
      bytes; bytes route refuses mismatched bytes; unmatched refs stay raw.

      - ac-docs-name-browser-project-context: guide explains <img>/<a> element fetches cannot send
      X-Kspec-Dir, so rewritten resource URLs carry ?kspec_dir=<project-path>; daemon middleware
      reads header-or-query.

      - ac-docs-name-temp-project-e2e-steps: added an end-to-end temp-project walkthrough (two
      projects: default refs + a separate clean materialized project) exercising CLI storage, daemon
      bytes routes (incl. kspec_dir selected-project routing), live UI image/link rendering, and
      static-export asset existence (assets/resources/task|plan/...), all against one
      continuously-running daemon (start once, never stop/restart).


      Also updated the static-export sections to include the task asset layout
      (assets/resources/task/<task-ulid>/<relative-path>).


      Tests: added tests/resource-ui-task-markdown-docs.test.ts (7 behavioral docs tests, one
      describe per AC, // AC: annotations) reading the published markdown + RELEASE_NOTES.md. All 4
      ACs annotated.


      Gates green: format:check, oxlint (0/0 on changed file), typecheck, full suite (10363 passed /
      5 skipped), kspec validate --refs/--alignment/--completeness (exit 0; only pre-existing
      unrelated warnings).
