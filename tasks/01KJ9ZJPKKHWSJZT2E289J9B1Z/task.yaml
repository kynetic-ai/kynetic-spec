title: Fix removeAllListeners() in readStdinIfAvailable to use named handlers
type: bug
description: >-
  In src/cli/commands/session.ts, the readStdinIfAvailable() function (~line 1669-1696) calls
  process.stdin.removeAllListeners() in its timeout handler. This removes ALL stdin listeners, not
  just the ones this function added, which could break other code with stdin listeners.


  Fix: Replace with named handler functions and use process.stdin.removeListener(event, handler) to
  only clean up the specific handlers this function registered.


  Current pattern:
    process.stdin.removeAllListeners()

  Should be:
    const onData = (chunk) => { ... };
    const onEnd = () => { ... };
    process.stdin.on('data', onData);
    process.stdin.on('end', onEnd);
    // In cleanup:
    process.stdin.removeListener('data', onData);
    process.stdin.removeListener('end', onEnd);
