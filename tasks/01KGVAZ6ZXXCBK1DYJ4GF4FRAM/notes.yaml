  - _ulid: 01KGW6PQP7Z3WN0V476PWQQFVZ
    content: "Known limitation: Split-chunk noise during streaming cannot be fully suppressed because
      text is emitted before the complete pattern is known. The fix ensures final accumulated
      content is clean at finalization. Streaming output is ephemeral and scrolls away, so this is
      acceptable."
