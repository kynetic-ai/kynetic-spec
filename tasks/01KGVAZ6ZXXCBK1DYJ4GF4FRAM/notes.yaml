  - _ulid: 01KGW5M9FFRTW507CG7MKWFSYW
    content: "Fixed by changing suppression strategy from skip-entire-chunk to strip-patterns. The
      stripNoise function now removes noise patterns from content while preserving surrounding text.
      This handles the observed bug where hook warnings were concatenated directly with agent
      messages (no newline). Added tests for: standalone noise suppression, embedded noise
      stripping, multiple patterns in same chunk, and accumulation across chunks."
    supersedes: null
