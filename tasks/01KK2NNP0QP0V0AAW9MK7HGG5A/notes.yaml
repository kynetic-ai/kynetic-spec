  - _ulid: 01KK305NGQMKKXJHHVHG8Y4J5G
    content: "Review findings: MUST-FIX
      packages/web-ui/src/lib/components/session/SessionContextPanel.svelte:37-47 fetches task title
      in a  that reruns whenever session is refreshed. In
      packages/web-ui/src/routes/sessions/[id]/+page.svelte:67-69 session metadata is refreshed
      every 3s for live sessions, so this causes repeated /api/tasks/:ref requests even when task_id
      is unchanged. Cache last fetched task_id (or guard by task_id change) before calling
      fetchTask."
