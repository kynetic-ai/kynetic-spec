title: Purge deprecated spec references
type: task
description: >-
  Remove all references to deprecated specs @task-storage, @task-storage-alongside, and
  @task-storage-separate from tests and fixtures.


  Why: These specs are deprecated (superseded by @task-directory-storage and @task-data-manager).
  Stale AC annotations pointing to them are misleading and break traceability.


  What to do for each location:


  1. tests/task-system-ac-backfill.test.ts
     - Lines 46-48: Spec ref list includes @task-storage, @task-storage-alongside, @task-storage-separate. Remove these three entries from the array.
     - Line 418: AC annotation @task-storage ac-1. This test ("loads tasks from project.tasks.yaml alongside the spec manifest") verifies legacy format backward compatibility. The behavior is covered by @task-data-manager ac-1 (callers do not know or care about the underlying storage format). Re-point to @task-data-manager ac-1.
     - Line 419: AC annotation @task-storage-alongside ac-1. Same test. Re-point to @task-data-manager ac-1.
     - Line 457: AC annotation @task-storage-separate ac-1. Test ("loads tasks from separate backlog and active task files") also exercises legacy format. Re-point to @task-data-manager ac-1.

  2. tests/fixtures/task-system-ac-backfill.snapshot.json
     Entries referencing @task-storage-alongside and @task-storage-separate should be removed from the snapshot to match the updated spec ref list from step 1.

  Verification: After all changes, run the affected test files (npm test task-system-ac-backfill) to
  confirm no test failures. Grep for @task-storage, @task-storage-alongside, and
  @task-storage-separate to confirm zero remaining references.


  Note: The @task-activity-git-query references in src/utils/activity.ts and its tests are tracked
  separately — that code is still actively used as a pre-migration fallback and requires its own
  investigation.
