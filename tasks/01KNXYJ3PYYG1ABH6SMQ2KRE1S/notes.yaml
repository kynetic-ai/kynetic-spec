      3. Blocker (trait AC coverage): Converted block-comment annotations to standalone line
      comments. All 4 @trait-idempotent-file-scaffold ACs covered by individual tests.
      @trait-error-guidance ac-1/2/5/6 covered by fail-loudly tests, ac-3/4 N/A-annotated.


