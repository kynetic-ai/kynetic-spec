    content: >-
      Implemented all three changes per task description:


      1. src/parser/file-lock.ts — acquireFileLock(): when timeoutMs is 0 or Infinity, sets deadline
      to Infinity so the retry loop never triggers the timeout throw. Stale PID detection and 50ms
      retry interval continue normally.


      2. src/cli/index.ts — maybeAcquireDispatchMutationLock(): changed default timeout from
      undefined (which fell through to DEFAULT_TIMEOUT_MS=5000) to 0 (wait indefinitely). The
      explicit env var override still works.


      3. src/agent-runtime/workspace.ts — resolveDispatchMutationLockTimeoutMs(): returns 0 instead
      of undefined when KSPEC_SHADOW_MUTATION_LOCK_TIMEOUT_MS is unset.


      Added tests covering ac-4, ac-5, ac-6. All 6854 tests pass (1 pre-existing flaky timeout in
      agent-invocation-lifecycle.test.ts unrelated to these changes).
