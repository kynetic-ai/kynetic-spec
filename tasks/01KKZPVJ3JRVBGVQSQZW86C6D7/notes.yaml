notes:
  - _ulid: 01KM010CYN9Y4FH80MD3272GTN
    content: "Implemented shared action model: ActionExecutor with execute(action, eventContext)
      returning ActionRun. All four action types (command, kspec, agent, notify) supported.
      Command/kspec actions spawn async child processes with timeout support and PID tracking. Kspec
      actions inject KSPEC_CORRELATION_ID for causal chain propagation. Agent actions delegate to
      configurable AgentSpawner and track invocation_id. Notify actions broadcast via configurable
      NotifyBroadcast. Template interpolation uses existing interpolateTemplate() from prompts.ts
      with unresolved placeholders passing through unchanged (ac-8). Action failure isolation via
      Promise.allSettled in executeAll() (ac-9). Template validation utilities
      (validateActionTemplates, extractActionTemplates) provide building blocks for kspec validate
      integration (ac-7). 49 tests covering all 9 spec ACs with annotations. Trait ACs
      (error-guidance) annotated as N/A since ActionExecutor is a library, not a CLI command.
      Pre-existing review-cli test failure unrelated to changes."
    supersedes: null
    author: "@claude"
