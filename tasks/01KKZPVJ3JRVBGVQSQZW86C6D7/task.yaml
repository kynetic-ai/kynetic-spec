closed_reason: "Merged to dev. Implements shared action model with ActionExecutor class executing
  all four action types (command, kspec, agent, notify). Each execution produces an ActionRun
  tracking record with ULID, status, duration, and type-specific fields (PID/exit_code for
  command/kspec, invocation_id for agent). Template interpolation uses existing interpolateTemplate
  with unresolved placeholders passing through unchanged. Template validation utilities provide
  building blocks for kspec validate integration. Failure isolation via Promise.allSettled in
  executeAll. 49 tests cover all 9 spec ACs. Two non-blocking nits recorded: potential double event
  emission on spawn failure, and simple whitespace-based kspec command splitting."
