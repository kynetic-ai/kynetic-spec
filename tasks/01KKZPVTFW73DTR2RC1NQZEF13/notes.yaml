    content: "Implemented ScheduleSchema in src/schema/schedules.ts with croner-based cron validation.
      Schema fields: _ulid, id, name, cron (5-field only via CronExpressionSchema), timezone
      (default UTC), action (shared ActionSchema), overlap_policy (skip|buffer_one|allow, default
      skip), backfill (default false), enabled (default true). Extended MetaManifestSchema with
      schedules array (defaults to empty). Added LoadedSchedule type and schedule loading in
      parser/meta.ts. Added validateScheduleAgentRefs in parser/validate.ts for cross-ref agent
      validation. 33 tests cover all 4 ACs. Full test suite passes (1 pre-existing failure in
      review-cli.test.ts unrelated to changes)."
