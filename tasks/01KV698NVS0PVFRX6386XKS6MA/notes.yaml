notes:
  - _ulid: 01KV6D10M8JRGMKYHK32D0SS53
    content: "Approach: The detached-reviewer-merge.sh helper tests git-operation marker paths from 'git
      -C $wt rev-parse --git-path <marker>'. For the PRIMARY repo worktree git returns a
      worktree-relative path (.git/MERGE_HEAD); the helper then evaluates [ -e .git/MERGE_HEAD ]
      from the helper process cwd (detached reviewer snapshot), checking the wrong location. Linked
      worktrees return absolute paths and work today. Fix: add
      resolve_worktree_git_path()/worktree_marker_path() helpers that preserve absolute paths and
      anchor relative paths under $wt; reuse for preflight in-progress detection and post-merge
      MERGE_HEAD detection. Also (2) always 'git -C MERGE_SURFACE merge --abort' once a merge has
      started before any failure return, and (3) after aborting in an existing checkout, verify
      HEAD==PRE_MERGE_TARGET_HEAD, clean tracked status, and MERGE_HEAD absent; emit a SEVERE
      cleanup-failed error naming the checkout if not. Tests: primary-target conflict regression +
      primary-target preexisting-in-progress-merge refusal regression; keep linked/temp coverage.
      Then kspec skill render + verify, build:plugin, focused test, validate --refs."
    supersedes: null
    author: "@claude"
    created_at: 2026-06-15T19:44:37.512Z
  - _ulid: 01KV6ENWCA6K5Z4HWDD5PFCM2M
    content: >-
      Implemented and verified. Changes:

      - detached-reviewer-merge.sh: added resolve_worktree_git_path()/worktree_marker_path() to
      anchor relative 'git -C $wt rev-parse --git-path <marker>' results (e.g. .git/MERGE_HEAD from
      a PRIMARY checkout) under $wt instead of the helper cwd; reused for preflight in-progress
      detection AND post-merge MERGE_HEAD detection. On any nonzero merge after a merge has started,
      now always 'git -C MERGE_SURFACE merge --abort' before returning (capturing conflict state
      first). Added verify_existing_checkout_cleanup(): after aborting in an existing checkout,
      asserts HEAD==PRE_MERGE_TARGET_HEAD, clean tracked status, and MERGE_HEAD absent (via
      corrected helper); prints a SEVERE cleanup-failed error naming the checkout if not.

      - Regenerated tracked rendered copies (.agents + .factory) byte-identical; npm run
      build:plugin regenerates plugin output identically.

      - Tests: added 2 regression tests (primary-target conflict abort+guidance; primary-target
      preexisting in-progress merge refusal). Proven genuine guards: both PASS on fix and FAIL on a
      reverted-marker variant ('error: merge failed' vs 'merge conflict detected'; 'uncommitted
      changes' misclassification vs 'with an in-progress merge operation'). Behavioral assertions
      only (git status/diff --check/rev-parse MERGE_HEAD), no source-content scanning. Existing
      linked-worktree and temp-worktree conflict tests still pass.

      Gates: format:check, lint (0 errors), typecheck, full npm test (10569 passed/3 skipped), kspec
      validate --refs --warnings-ok all green.
    supersedes: null
    author: "@claude"
    created_at: 2026-06-15T20:13:29.866Z
