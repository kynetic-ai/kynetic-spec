title: Implement entity storage version and incompatibility gates
type: task
description: >
  What:

  - Define manifest version `kynetic: "1.2"` for folder-backed plans/reviews/resources. This version
  gate applies only to plan storage, review storage, and entity-scoped local resources; do not
  convert inbox, triage, sessions, or broad meta storage in this task.

  - Extend manifest parsing and initialization so new projects write `task_storage.format: split`,
  `plan_storage.format: folder`, `review_storage.format: folder`, and `resource_storage.format:
  entity_scoped`.

  - Add deterministic storage incompatibility errors for plan/review/resource domains with top-level
  code `entity_storage_incompatible` and domain-specific codes: `legacy_plan_storage_removed`,
  `legacy_review_storage_removed`, `missing_plan_folder_storage`, `missing_review_folder_storage`,
  and `partial_entity_storage_layout`.

  - Permit `kspec upgrade`, `kspec doctor`, and read-only compatibility diagnostics to run on old
  layouts; block commands/routes that need folder-backed plan, review, or resource behavior until
  upgrade succeeds.

  - Add daemon mapping so incompatible plan/review/resource reads return HTTP 409 with error, code,
  suggestion, domain, and cache-domain state rather than 404 or unhandled 500.

  - Treat `/home/chapel/Projects/kynetic-spec` and `/home/chapel/Projects/kynetic-spec-dispatch` as
  protected live projects during this plan's implementation. Do not run executing upgrade/migration
  commands in those directories or against their `.kspec` worktrees while developing or manually
  testing this feature.

  - If this task detects either protected live project already declares `kynetic: "1.2"`,
  `plan_storage.format: folder`, `review_storage.format: folder`, or has `.kspec/plans/` or
  `.kspec/reviews/` created by this plan's migration work, stop the current task before further
  writes and report the detected path/state so Jacob can repair it. Do not attempt an automated
  rollback or cleanup of the live project.


  Why:

  - Storage managers and UI/API work need a stable compatibility contract before they start touching
  folder-backed data. Workers must not decide ad hoc whether to dual-read, hard-fail, or rewrite
  stale layouts.


  How:

  - Model this after task storage activation and `task_storage_incompatible`, but use
  `entity_storage_incompatible` because the new gate covers plans, reviews, and resources.

  - Guidance should say: run `kspec upgrade` to migrate the project, or use a kspec version
  compatible with the current manifest if upgrade is not desired.


  Testing:

  - Manifest tests for new-project defaults and 1.2 fields.

  - CLI tests for old manifests, missing storage fields, and partial layouts.

  - Daemon tests for 409 `entity_storage_incompatible` responses and cache-domain context.

  - Run compatibility-gate and migration-shape tests only against temp directories, checked-in
  fixtures, or disposable copies created for the test. Never use the active
  `/home/chapel/Projects/kynetic-spec` or `/home/chapel/Projects/kynetic-spec-dispatch` repositories
  as the migrated fixture.

  - `kspec validate --warnings-ok`.


  Covers: @entity-folder-migration-and-compatibility ac-new-projects-declare-folder-storage,
  ac-unmigrated-projects-are-blocked-with-guidance, ac-partial-folder-layouts-are-blocked,
  ac-daemon-returns-structured-conflict
