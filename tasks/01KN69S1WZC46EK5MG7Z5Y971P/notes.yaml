    content: "Approach: keep the fix localized to safelyRemoveDispatchWorktree by reusing existing
      findWorktreeByPath and pathExists helpers. Edge cases: registered worktree path already
      deleted from disk, normal registered worktree removal, and unregistered directories still
      removed via fs.rm. Test plan: add a behavioral dispatch workspace cleanup regression that
      deletes the worktree directory before artifact reconciliation and verifies reconciliation
      prunes the stale registration instead of failing."
