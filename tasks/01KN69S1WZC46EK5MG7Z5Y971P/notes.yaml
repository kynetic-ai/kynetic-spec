notes:
  - _ulid: 01KN6A1DX7MP1E324R0T0T8ZA0
    content: "Approach: keep the fix localized to safelyRemoveDispatchWorktree by reusing existing
      findWorktreeByPath and pathExists helpers. Edge cases: registered worktree path already
      deleted from disk, normal registered worktree removal, and unregistered directories still
      removed via fs.rm. Test plan: add a behavioral dispatch workspace cleanup regression that
      deletes the worktree directory before artifact reconciliation and verifies reconciliation
      prunes the stale registration instead of failing."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-02T05:18:14.440Z
  - _ulid: 01KN6AKXP7JB8Q35D73M7Y9057
    content: "Implemented stale dispatch worktree cleanup fix in safelyRemoveDispatchWorktree. When git
      still reports a registered worktree but the directory is already gone, cleanup now runs git
      worktree prune instead of git worktree remove --force. Added a behavioral reconciliation
      regression test covering a missing on-disk dispatch worktree with a stale git registration.
      Verification: npm test -- tests/dispatch-workspace-cleanup.test.ts passed; npm test --
      tests/daemon-api/meta.test.ts passed. Full npm test hit unrelated timeout failures in
      tests/daemon-api/meta.test.ts during one run before the isolated rerun passed."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-02T05:28:20.424Z
