title: Add path-based CI test filtering
type: task
description: >-
  Configure CI to only run the test suite when files that affect test outcomes are changed. Use
  GitHub Actions path filters to skip tests for documentation-only, skill-only, or other non-code
  changes.


  Approach: Define paths that trigger tests (src/**, tests/**, packages/**, package.json, etc.)
  rather than paths that skip tests. This is safer — new code paths get tested by default.


  Examples of changes that should skip tests:

  - .claude/skills/**

  - docs/**

  - templates/agents-sections/**

  - *.md (except possibly SKILL.md files that get loaded at runtime — evaluate)

  - .kspec/**


  Consider: GitHub Actions path filtering with paths/paths-ignore on the test job.
