title: Separate validate exit codes for errors vs warnings
type: task
description: "kspec validate exit code: validate returns exit code 1 for alignment warnings
  (orphaned specs, missing test coverage) even when there are zero errors. On fresh projects with
  specs but no code, this is the expected state. Consider: separate exit codes (0=clean, 1=errors,
  2=warnings-only), or --errors-only / --severity flags to filter output and control exit behavior."
