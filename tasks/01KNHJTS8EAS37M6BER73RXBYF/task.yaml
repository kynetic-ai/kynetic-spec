title: Fix auto-start racing with explicit daemon management
type: bug
description: When running kspec serve start in foreground mode, the daemon auto-start logic races
  with the explicit start command. The preAction hook calls maybeAutoStartDaemon() before serve
  subcommands execute, spawning a background daemon that grabs the PID file. The foreground start
  then fails with 'Daemon already running'. The root cause is that the auto-start skip list checks
  the leaf command name (e.g. 'start') via Commander's actionCommand.name() rather than resolving
  the top-level parent command ('serve'). The fix should resolve the top-level command from the
  command chain so that all serve subcommands are correctly excluded from auto-start.
