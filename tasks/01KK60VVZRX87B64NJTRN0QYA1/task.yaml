title: Sanitize inherited env vars in agent spawner
type: task
description: "The agent spawner (src/agents/spawner.ts) passes process.env directly to child
  processes. When the daemon runs inside a Claude Code session, CLAUDECODE=1 leaks into spawned
  agents, triggering nested-session detection and failing all dispatch invocations. Fix: strip known
  host-environment variables (CLAUDECODE, CLAUDE_CODE_SESSION) from inherited env before spawning.
  Must include unit test verifying env sanitization to prevent regression. See GitHub issue #700.
  Community PR #702 has the right approach but needs tests."
