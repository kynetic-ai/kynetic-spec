  - _ulid: 01KKA9P29M3MD35JYWFKCYTCYB
    content: >-
      Implementation complete:


      - Added isAheadOfUpstream() exported utility to shadow.ts — uses git rev-list --left-right
      --count HEAD...@{u}

      - Updated ShadowSyncScheduler.syncOnce() in shadow-sync-scheduler.ts:
        1. Calls fetchRemote(worktreeDir) before shadowPull() to freshen FETCH_HEAD in the worktree git dir (ac-daemon-freshens-fetch-head)
        2. After pull, checks isAheadOfUpstream() and pushes via pushShadowBranch() if ahead (ac-periodic-push)
        3. Push failure is non-fatal — logged as warning, does not throw
        4. Push is skipped if pull had a conflict
      - Added 4 new tests covering both ACs:
        - Push when ahead of upstream
        - No push when not ahead
        - Push failure is non-fatal
        - FETCH_HEAD freshened in worktree git dir
    supersedes: null
    author: "@claude"
