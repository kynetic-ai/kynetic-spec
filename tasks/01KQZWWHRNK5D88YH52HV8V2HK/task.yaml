title: Clean daemon endpoint affected-file lint findings
type: infra
description: >
  ## What


  Fix the focused oxlint failures introduced or exposed in daemon endpoint contract files so the
  endpoint plan can be closed with a clean affected-file lint gate.


  Current focused lint fails with 4 errors and 2 warnings across these files:


  ### `packages/daemon/src/server.ts`


  - Remove unused import `buildDaemonUrls` from `./endpoint.js`.

  - Remove unused import `createShadowSyncOnPullHandler` from `./shadow-sync-manager.js`.

  - Rename the inner `kspecDir` callback parameter in:

    ```ts
    projectContextManager.setCacheInvalidationCallback((projectPath, kspecDir, file, content) => ...)
    ```

    so it does not shadow the outer `kspecDir` option variable.

  ### `tests/web-ui/dev-server-daemon-endpoint.test.ts`


  - Remove unused `mkdirSync` from `node:fs` import.


  ### `tests/cli-daemon-endpoint-regression.test.ts`


  - Replace:

    ```ts
    formatUrl("ws", mock.bindHost, mock.port) + "/ws"
    ```

    with a template-literal or other lint-compliant construction.

  - Address `no-source-scanning(no-source-file-reads)` for `readRecordedRequests(recordPath)`.

    This function reads a temp output file generated by the mock daemon during the test, not a project source file. Use `readTestOutputSync` from `tests/helpers/cli.ts` for the generated output read so the test records that it is reading intentional test output rather than scanning project source.

  The task must not change daemon endpoint behavior. It should be a minimal cleanup of unused
  imports, a shadowed variable name, a string construction warning, and the generated-test-output
  read handling.


  ## Why


  The endpoint plan’s behavior and targeted tests pass, but the affected-file lint gate is red.
  Leaving these findings makes the plan administratively unclean and hides whether future endpoint
  changes introduce real lint regressions.


  The `no-source-scanning` finding is especially important because kspec explicitly prefers
  behavioral tests over source inspection; the test should make clear that it is reading generated
  mock-daemon output, not scanning project source.


  ## How


  1. Reproduce the focused lint failure:

     ```bash
     npx oxlint      packages/daemon/src/server.ts      tests/web-ui/dev-server-daemon-endpoint.test.ts      tests/cli-daemon-endpoint-regression.test.ts      src/daemon-shared/endpoint.ts      src/cli/daemon-proxy.ts      src/cli/daemon-client.ts      packages/web-ui/vite.config.ts
     ```

  2. Make only the minimal cleanup edits listed in What.


  3. Re-run the focused lint command and require it to report zero errors. Prefer zero warnings for
  the listed files as well.


  4. Run targeted behavioral tests under the project toolchain:

     ```bash
     mise exec -- npm test --      tests/cli-daemon-endpoint-regression.test.ts      tests/web-ui/dev-server-daemon-endpoint.test.ts      tests/cli-daemon-client.test.ts      tests/cli-daemon-proxy.test.ts      tests/cli-serve.test.ts
     ```

  5. If `@task-retag-localhost-security-ac-annotations` has already landed, also run:

     ```bash
     kspec validate --warnings-ok -v
     ```

     to confirm the lint cleanup did not disturb AC annotations.

  6. Add a task note with the focused lint command/output summary and targeted test summary.


  ## Acceptance / done criteria


  - The focused oxlint command exits successfully with zero errors for the listed endpoint files.

  - The generated-output read in `tests/cli-daemon-endpoint-regression.test.ts` is routed through
  `readTestOutputSync` from `tests/helpers/cli.ts`; it is not left as unexplained source scanning.

  - Targeted daemon endpoint/client/web-ui tests pass under `mise exec`.

  - No daemon endpoint behavior, metadata shape, bind/connect resolution, or external-warning
  semantics are changed by this cleanup.
