      ### Changes Made


      1. **src/ralph/subagent.ts** (buildSubagentPrompt)
         - Added step 5: Complete the task with PR reference
         - Added CRITICAL note requiring task completion
         - Updated exit conditions: 'PR merged AND task completed successfully'
         - Added ac-12 to AC annotation

      2. **src/cli/commands/ralph.ts** (processPendingReviewTasks)
         - Added verifyTaskCompleted() helper function
         - Updated success path to verify task was completed
         - If task still pending_review after subagent success, marks needs_review with note

      3. **.claude/skills/pr-review/SKILL.md**
         - Replaced 'Integration' section with 'Task Completion' section
         - Removed guidance about caller completing task
         - Added CRITICAL note that subagent MUST complete task

      4. **.kspec/kynetic.meta.yaml** (spec)
         - Added ac-12: 'subagent must complete the task; ralph verifies task is completed after subagent success'

      ### Testing

      - Build succeeds

      - ralph tests pass (11 tests)

      - @pr-review-loop workflow unchanged (already correct)
