  - _ulid: 01KHHQD6CM3Y09M88W5DGRCGR2
    content: >
      Implementation notes:


      File: src/schema/meta.ts


      Add after existing SkillSchema fields (line ~182):

      - license: z.string().optional()

      - compatibility: z.string().optional()

      - allowed_tools: z.array(z.string()).default([])

      - metadata: z.record(z.string(), z.unknown()).optional()

      - platform_config: PlatformConfigSchema.optional()


      Define new schemas:

      - ClaudeCodeConfigSchema: z.object({ disable_model_invocation, user_invocable, context, agent,
      model, argument_hint }).strict()

      - CodexConfigSchema: z.object({ allow_implicit_invocation, display_name, short_description,
      icon_small, icon_large, brand_color, default_prompt }).strict()

      - PlatformConfigSchema: z.object({ claude_code: ..., codex: ... }).passthrough()


      All fields optional booleans/strings. Export types.

      Tests: tests/skill-schema.test.ts
    author: "@claude"
