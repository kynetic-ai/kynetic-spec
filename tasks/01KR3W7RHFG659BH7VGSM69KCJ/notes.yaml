  - _ulid: 01KR45FC9XNGY5EFX5N7G3NAZK
    content: >-
      Implementation complete:


      - Added three failing-before-fix contract tests to tests/helpers/mock-daemon.test.ts (each
      marked it.fails so npm test stays green; dependent fix task removes .fails when helper passes
      them):
        1. malformed first stdout line — child must be stopped (ac-owned-child-stopped-after-startup-failure)
        2. startup timeout without stdout — child must be stopped (ac-owned-child-stopped-after-startup-failure)
        3. ambient daemon-control + KSPEC_SESSION_ID — must not leak into child env (ac-child-env-sanitized)
      - Added minimal test seams: __testInjectArgs and __testStartupTimeoutMs on
      StartMockDaemonOptions (production callers must not pass them); --break, --pid-file,
      --env-record flags in mock-daemon.cjs.

      - Verified the new tests fail as expected (locally flipped it.fails -> it; all three failed
      with assertion errors that exactly match the missing behavior — child still alive after
      malformed-stdout and timeout, KSPEC_DAEMON_PID still '999999' in child env). Restored to
      it.fails.

      - Full npm test suite: 8809 passed / 5 skipped / 0 failed across 2406 suites (1949s).


      Existing mock-metadata-fidelity coverage (tests at lines 87 and 365) still passes — no new
      test for that AC.


      ac-process-launch-failure-diagnosed and ac-cleanup-registered-before-readiness-wait are out of
      scope for this task per the task description (they apply to startTestDaemon, not
      startMockDaemon, and were covered by sister task @task-add-real-daemon-startup-failure-tests).
