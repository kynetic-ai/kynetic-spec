  - _ulid: 01KN0CSH5K600PYCN0EYP54G7V
    content: "Approach: replace raw browser WebSocket protocol assertions with behavioral Playwright
      coverage for connection state, live task/inbox/dashboard updates, and move protocol-only
      assertions to daemon-side vitest using a real daemon + WebSocket client. Edge cases: initial
      connection readiness before assertions, reconnection after daemon restart, streaming output
      visibility, and preserving AC coverage for both @api-contract ac-25..31 and
      @trait-websocket-protocol ac-1..5 plus @daemon-server ac-4. Test plan: add a new UI websocket
      spec with AC annotations for user-visible behaviors, add a daemon websocket protocol test file
      for command/ack/subscription/close-code/heartbeat coverage, then delete or rewrite the old
      api-websocket Playwright protocol tests."
    supersedes: null
    author: Test User
    created_at: 2026-03-30T22:10:54.772Z
  - _ulid: 01KN0DD9DXYRCRWDVSPQE6YPDG
    content: "Rewrote tests/e2e/api-websocket.spec.ts to cover browser-visible WebSocket behavior only:
      connection indicator, live task list mutation, live inbox badge/list updates, and daemon
      stop/start reconnection via the isolated Playwright daemon fixture. Added
      tests/daemon-api/websocket-protocol.test.ts for real-daemon protocol coverage (connected
      event, command ack/nack, subscription+broadcast payloads, graceful close). Extended
      tests/e2e/fixtures/test-base.ts with start/stop helpers for restart scenarios and updated
      neighboring N/A annotations to point at the new protocol test location. Verification: npm run
      build:e2e; npm test -- --fresh tests/daemon-api/websocket-protocol.test.ts; npx playwright
      test tests/e2e/api-websocket.spec.ts; kspec validate (warnings-only exit 6 from pre-existing
      repo debt)."
