title: Enforce canonical task pause and resume
type: task
description: >
  ### Covers


  - ac-task-control-uses-canonical-identity

  - ac-task-paused-work-does-not-start

  - ac-task-pause-allows-active-completion

  - ac-task-pause-keeps-active-session-open

  - ac-task-control-preserves-unrelated-task-control

  - ac-task-control-preserves-global-authority

  - ac-task-resume-obeys-global-authority

  - ac-task-pause-is-idempotent

  - ac-task-resume-is-idempotent


  ### Required context


  Absent task record means running subject to global. For canonical task T, task transitions inspect
  only `scope:"task",task_id:T`; global and other-task cleanup entries do not change T's record
  transition. Pause absent creates paused; pause paused is no-op; pause stopped is invalid. Resume
  removes paused and removes stopped only when matching nested cleanup is idle; resume from matching
  stopped/pending-or-failed is invalid_transition with no mutation/start; resume absent is no-op.
  Task metadata mutations remain allowed during global cleanup, but no released task starts unless
  global authority is running and global-scope cleanup is empty. Identity is canonical ULID, never a
  slug alias; aggregate arrays/counts are observability only.


  ### Deliverable


  Task scope applies at every scheduling ingress without changing another task/global authority.


  ### Implementation


  Resolve a submitted ref to its canonical ULID before any control lookup or successful write; the
  applied response/event uses that ULID. Apply task authority at enqueue, coalesced expiry,
  dequeue/retry, bootstrap/reconcile, event/watcher, and post-invocation. Filter cleanup by matching
  canonical task before pause/resume/stop decisions; never use aggregate entries/counts, global
  entries, or another task's entry as the task-record predicate. Guard task resume on matching
  nested cleanup idle and leave matching pending/failed records unchanged; stop recovery later owns
  retry/removal. Held task work resumes from current state only if the independent global
  authority/global-cleanup gate permits it; active task work/session completes naturally.


  ### Files


  - Create: tests/dispatch-task-lifecycle.test.ts

  - Modify: src/agent-runtime/dispatch.ts

  - Modify: src/agent-runtime/task-identity.ts

  - Modify: tests/dispatch-canonical-task-identity-integration.test.ts

  - Modify: tests/dispatch-task-identity.test.ts


  ### Behavioral tests


  In tests/dispatch-task-lifecycle.test.ts create `createTaskLifecycleHarness`, `holdTaskIngress`,
  and `recordTaskStart`. Use task A/B plus A's slug and ULID: apply pause with the slug, assert one
  durable key/returned canonical A ULID, then release each
  enqueue/coalesced-expiry/dequeue-retry/bootstrap-reconcile/event-watcher/post-invocation barrier
  and assert A never starts while B follows its independent control/global authority. Race repeated
  pause/resume calls at `holdTaskIngress`, verify one canonical active A at most, and prove an
  active A session remains open after pause. Repeat resume while global paused and stopped and
  observe no start. Seed stopped/idle and stopped/pending-or-failed task records: idle resume
  removes only A; pending/failed resume returns invalid_transition, preserves A's record, records
  zero A starts, and leaves B unchanged.


  ### Verification


  - npm test -- tests/dispatch-task-lifecycle.test.ts
  tests/dispatch-canonical-task-identity-integration.test.ts tests/dispatch-task-identity.test.ts

  - npm run typecheck

  - npm run lint

  - git diff --check


  ### Reviewer handoff


  Provide A/B ingress and canonicalization evidence; hard stop is excluded.
