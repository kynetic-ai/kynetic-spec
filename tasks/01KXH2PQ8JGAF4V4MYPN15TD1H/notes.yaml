notes:
  - _ulid: 01KXJCQWMWKNSME8QG4SNV0Q7A
    content: "Approach: extend the existing committed lifecycle store/mutex with task pause/resume
      transitions, using task-identity's resolver to canonicalize a submitted slug/ref before any
      snapshot lookup or write. Reuse the existing global and per-task scheduling gates at
      enqueue/coalesced drain/dequeue/retry/bootstrap/reconcile/post-invocation, and trigger
      current-state evaluation on task release without clearing unrelated queues. Edge cases:
      aliases resolving to one ULID, A/B isolation, global paused/stopped or global cleanup during
      task resume, paused/stopped/absent task records, matching pending/failed cleanup,
      concurrent/repeated calls, and active session/invocation preservation. Test plan: create the
      specified task lifecycle harness with behavioral coverage for all nine assigned ACs, plus
      focused identity tests for strict canonical control resolution."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-15T08:01:55.356Z
  - _ulid: 01KXJDS5SPAVJS3Z9XK2149TXR
    content: "Implemented canonical task pause/resume on the committed lifecycle store. Task refs are
      strictly resolved to ULIDs before lookup/write; matching task transitions are serialized and
      scoped cleanup is enforced; resume reconstructs current candidates only through the
      independent global/global-cleanup gate; external committed task releases also reconcile.
      Behavioral coverage proves A/B isolation, event/coalesced/reconcile/retry-style/post-drain
      admission, active invocation/session preservation, global paused/stopped/cleanup gating,
      stopped cleanup transitions, invalid aliases/transitions, and concurrent idempotency.
      Verification: focused lifecycle/identity suites 40/40 passed; focused oxlint 0
      warnings/errors; full npm test 10,643 passed and 3 skipped; format, repo lint (0 errors),
      typecheck, refs, alignment, completeness, and git diff checks passed."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-07-15T08:20:06.071Z
