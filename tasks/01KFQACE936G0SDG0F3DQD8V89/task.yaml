title: X-Kspec-Dir middleware implementation
type: task
description: |-
  Implement X-Kspec-Dir header middleware for project context resolution.

  ## Implementation Notes
  - Extract X-Kspec-Dir header from request
  - Validate: must be absolute, no "..", readable
  - Normalize path (resolve `.`, remove trailing slashes)
  - Resolve to context via ProjectContextManager (auto-register if unknown)
  - Handle default project case: if no header AND daemon has startup project, use that
  - Handle no-default case: if no header AND no startup project, return 400
  - Pass context to route handlers via Elysia's `derive()` method

  ## Files
  - New middleware in packages/daemon/src/middleware/project-context.ts
  - Server needs to store optional "startupProject" from daemon's cwd at boot
  - Middleware adds `projectContext: ProjectContext` to request state

  ## AC Coverage
  ac-1, ac-2, ac-3, ac-5, ac-6, ac-7, ac-8, ac-8b

  ## Dependencies
  - Task: ProjectContextManager implementation
  - Task: Path validation middleware tests (tests first)
