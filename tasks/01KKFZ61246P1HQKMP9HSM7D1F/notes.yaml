    content: >-
      Execution context:

      - Background: plan derive currently auto-creates per-spec implementation tasks even when a
      plan explicitly sets derive_from_specs: false.

      - Scope: fix derive behavior so false suppresses auto per-spec tasks while preserving
      plan-defined additional tasks and task linkage/dependency mapping.

      - Files: expected changes in plan derive command/parser logic and regression tests around plan
      import/derive.

      - Verification: targeted tests for plan derive false path, then full npm test and kspec
      validate.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-12T23:21:05.942Z
  - _ulid: 01KKJ5XWSJ2FD2HZHFZX2RGSBH
    content: "Implemented derive_from_specs gating in plan derive. Auto per-spec task creation now
      defaults on but is skipped when the parsed plan explicitly sets derive_from_specs: false.
      Added regression coverage proving manual tasks still materialize with preserved plan/spec
      links and without inventing @implement-* dependencies."
    supersedes: null
