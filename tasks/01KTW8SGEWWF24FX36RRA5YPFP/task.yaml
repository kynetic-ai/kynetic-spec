title: Stabilize intermittent upgrade folder storage test
type: bug
description: During review of @task-workspace-packages-private on 2026-06-11, a full npm test run
  reported one failure in tests/upgrade-folder-storage.test.ts (24 tests, 1 failed) before the
  overall runner later hung in the Vitest parent process. A focused retry with npm test --
  tests/upgrade-folder-storage.test.ts --fresh passed 24/24 in 57.7s. The reviewed branch only
  changed workspace package.json private flags and tests/release-packaging.test.ts, so this appears
  intermittent or unrelated to the manifest change. Investigate the failed assertion path in
  tests/upgrade-folder-storage.test.ts under full-suite conditions, reproduce with repeated fresh
  runs if needed, and make the test deterministic without weakening its coverage.
