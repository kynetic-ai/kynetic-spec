description: >-
  The skill table in kspec-agents.md is redundant — agent runtimes auto-inject skill content when
  invoked. The table wastes context window space for no benefit.


  Changes needed:

  1. Update kspec agents generate to skip the skill table section

  2. Ensure skill descriptions are in the skill frontmatter (SKILL.md metadata) so runtimes can use
  them for discovery/matching

  3. Port any useful description text from the table entries to the skill metadata if not already
  there

  4. Verify agent runtimes still have enough context to discover and invoke skills without the table
