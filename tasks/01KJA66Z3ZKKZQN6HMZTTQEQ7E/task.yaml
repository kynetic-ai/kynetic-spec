title: Add local test sharding support for faster dev runs
type: task
description: >-
  CI already shards tests into 3 with `npx vitest run --shard=N/3`. Add npm scripts so developers
  can do the same locally for faster feedback:


  Add to package.json scripts:
    "test:shard1": "vitest run --shard=1/3",
    "test:shard2": "vitest run --shard=2/3",
    "test:shard3": "vitest run --shard=3/3"

  Or a single parameterized script:
    "test:shard": "vitest run --shard"
    Usage: npm run test:shard -- --shard=1/3

  Also consider documenting this in the testing convention (kspec meta) so agents know they can run
  a subset of tests for faster iteration during development. Full suite is still required before PR.


  Current full suite time: ~150s. Each shard would be ~50s.
