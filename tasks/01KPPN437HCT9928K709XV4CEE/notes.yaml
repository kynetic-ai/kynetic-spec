  - _ulid: 01KPQJBNXM8QE4YS8623W30MJP
    content: >-
      Implementation complete. Created six Getting Started pages:

      1. overview.md — what kspec is and who it is for

      2. installation.md — npm install, Node >=20, verify with --version and --help

      3. initializing-a-project.md — kspec init, setup, shadow branch (kspec-meta), .kspec/
      directory, shadow status/repair, do-not-edit-by-hand warning

      4. connecting-your-agent.md — Claude Code primary, cline/cursor/windsurf alternatives, verify
