      5. your-first-action.md — full spec-to-task cycle: item add, ac add, derive, task start,
      implement, commit with trailers, submit, complete

      6. where-to-go-next.md — pointers to Guides and Concepts sections, useful commands,
      troubleshooting


      Updated index.md to list all six pages plus tutorial in reading order. Each non-last page ends
      with a **Next:** link to the following page.


