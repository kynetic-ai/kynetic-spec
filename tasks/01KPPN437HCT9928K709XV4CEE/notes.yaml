      Action shows item add/derive/task start/submit.

      - ac-2: Each non-last page links to the next page via relative .md link. Links verified in
      reading order. Last page has no Next marker. Landing page links all six pages in order.

      - ac-3: Initializing page names kspec-meta branch, .kspec/ directory, kspec shadow status,
      kspec shadow repair, and instructs not to manually edit.


