notes:
  - _ulid: 01KTV2S4YMKHSJCAX6DYBQKKH2
    content: "Approach: replace both silent .catch(() => {}) restore calls in
      initializeShadow/repairShadow with a shared helper restoreStashedWorktreeDirAfterFailure()
      that attempts the restore and returns the final error string. On restore success it appends a
      'prior shadow state restored' note to the rebuild error (item 3). On restore failure it builds
      a combined message: rebuild error + restore error + absolute backup path + actual state of the
      worktree location (stat'd at failure time, so the empty-after-rm case from the
      restoreStashedWorktreeDir audit is reported accurately) + recovery steps (mv backup back,
      re-run kspec shadow repair). Folding into the error string per task guidance — CLI handlers
      (init/shadow repair/setup) all print result.error directly, no interface widening needed.
      discardStashedWorktreeDir untouched (success-path-only). Tests: new
      tests/shadow-restore-failure.test.ts with vi.mock('node:fs/promises') delegating to actual
      except rename of .repair-backup-* sources (the restore direction) when a flag is set; rebuild
      failure forced via corrupted .git file + competing worktree checked out on kspec-meta (same
      pattern as existing ac-preserve-on-failure test). Covers repairShadow + initializeShadow,
      double-failure and restore-succeeds paths, annotated with both ACs."
    supersedes: null
    author: "@claude"
    created_at: 2026-06-11T10:13:55.284Z
  - _ulid: 01KTV3NESRKNR3DPYBJ2NP3461
    content: "Implementation complete on dispatch/task/task-shadow-restore-loud-failure/01kttd0y
      (7388f96a21). Replaced both silent .catch(() => {}) restore calls (initializeShadow +
      repairShadow catch blocks) with restoreStashedWorktreeDirAfterFailure(): on double failure the
      error string now reports rebuild error + restore error + absolute backup path + actual
      worktree-location state (stat at failure time, covering the rm-before-rename empty case from
      the restoreStashedWorktreeDir audit) + recovery steps (mv backup back, re-run kspec shadow
      repair); backup never deleted on failure paths (discardStashedWorktreeDir untouched,
      success-path-only). On restore success the rebuild error gains a prior-state-restored note.
      Detail folded into the error string — all CLI consumers (init, shadow repair, setup) print
      result.error directly, no interface widening. Tests: tests/shadow-restore-failure.test.ts (4
      tests) covers double-failure and restore-success for both functions via vi.mock of
      node:fs/promises rename (fails only the restore direction), annotated with AC:
      @broken-shadow-safety ac-preserve-on-failure and ac-restore-failure-reports-state. Gates:
      format:check, lint --quiet (0 errors), oxlint on changed files (0 warnings), typecheck, full
      npm test (10440 passed / 5 skipped / 0 failed), kspec validate refs/alignment/completeness all
      green."
    supersedes: null
