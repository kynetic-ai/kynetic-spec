title: Optimize gatherSessionContext to use single-pass task bucketing
type: task
description: >-
  gatherSessionContext() in session.ts (after refactor: session/context.ts) filters allTasks 14
  times:

  - .filter(in_progress) for stats

  - .filter(needs_work) for stats

  - .filter(pending_review) for stats

  - getReadyTasks(allTasks) (full pass)

  - .filter(blocked) for stats

  - .filter(completed) for stats

  - .filter(in_progress || needs_work) for active tasks

  - .filter(pending_review) for review tasks

  - .filter(in_progress || needs_work) again for notes

  - .filter(pending_review) again for notes

  - .filter(completed && completed_at) for completed notes

  - getReadyTasks(allTasks) again

  - .filter(blocked) again

  - .filter(completed && completed_at) again


  Replace with a single pass that buckets tasks by status into a Map<status, LoadedTask[]>, then use
  the buckets for stats, summaries, and notes. getReadyTasks() result should be cached.


  Depends on: @01KJ9ZBT (session.ts refactor — do this after the split so you're editing the focused
  context.ts file)
