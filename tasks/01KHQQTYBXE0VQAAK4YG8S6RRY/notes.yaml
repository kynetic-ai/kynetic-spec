notes:
  - _ulid: 01KHQQTYBW5VGW4RY9NJ9XMMGC
    content: >-
      Implementation notes (auto-generated from spec):


      Fix cross-platform parsing issues and version detection reliability so kspec works correctly
      on Windows and reliably detects when updates are needed.



      Acceptance Criteria:

      - ac-1: Given a SKILL.md file with CRLF line endings, when parseFrontmatter is called (in
      validate-skills.ts or skill.ts), then frontmatter is correctly parsed (handles both LF and
      CRLF)

      - ac-2: Given a SKILL.md file with CRLF line endings, when stripFrontmatter is called, then
      frontmatter is correctly stripped

      - ac-3: Given getKspecPackageVersion cannot resolve the package version, when skill install or
      update runs, then the version is reported as null or an error, not silently treated as a valid
      version string

      - ac-4: Given kspec-agents.md exists with a hash file, when kspec setup --status is run after
      skills or templates changed, then agents.md status is reported as stale (content hash
      comparison, not just hash file existence)

      - ac-5: Given a skill file with a base directory line, when normalizeBaseDirectory is called,
      then the line is matched case-insensitively and with common wording variations
    supersedes: null
    author: "@claude"
    created_at: 2026-02-18T06:43:40.028Z
  - _ulid: 01KHRX2Z627RN2X4879M74KD0M
    content: >-
      Implemented all 5 ACs:

      - AC-1/2: CRLF-safe frontmatter parsing/stripping in skill.ts and validate-skills.ts (regex
      updated to /^---\r?\n/)

      - AC-3: getKspecPackageVersion returns null instead of 'unknown', all 3 callers updated with
      conditional spread

      - AC-4: getSetupStatus now loads meta context and compares computeMetaHash against stored hash

      - AC-5: normalizeBaseDirectory regex now case-insensitive with for/of + optional 'this'
      wording

      - 14 new tests in cross-platform-robustness.test.ts, all passing

      - Full suite: 128/129 test files pass (1 pre-existing bun compile failure)

      - Added inbox note for skill-render.ts LF-only regex hardening follow-up
    supersedes: null
