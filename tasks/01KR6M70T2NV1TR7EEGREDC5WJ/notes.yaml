  - _ulid: 01KR6YSQDAZCAB6SF3DQHBKV59
    content: >-
      Implementation complete (commit 07488494e):


      Fix in tests/helpers/daemon.ts:712-741:

      - Wrapped opts.registerCleanup(stop) in try/catch.

      - On caller-provided hook throw: await stop() (bounded via killChildScoped → SIGTERM, 5s
      grace, SIGKILL).

      - Rethrow the original registration error directly so the caller diagnoses the misuse, not a
      wrapper.

      - If stop() itself throws, append secondary failure context to the registration error's
      message; never replace the primary cause.

      - Bail before the readiness try/catch, so we never enter the readiness/launch race once
      registration has failed (no unhandled-rejection risk).


      Test update in tests/helpers/daemon.test.ts:

      - Removed the staged-failure expectCleanupRegistrationLeak wrapper as instructed by its own
      'STAGED REGRESSION CLOSED' message.

      - Inlined the post-fix contract assertions: captured child terminated (exitCode/signalCode
      set) AND endpoint unreachable via bounded fetch.

      - Kept the safety-net SIGKILL block in finally so any future regression cannot strand a
      daemon.


      Verification:

      - mise exec -- npm test -- --fresh tests/helpers/daemon.test.ts → 10/10 pass.

      - mise exec -- npm test -- --fresh tests/e2e-fixture-daemon-cleanup.test.ts → 3/3 pass.

      - mise exec -- npm test → 2418/2418 suites, 8979/8984 tests pass (5 skipped, 0 failed).

      - mise exec -- kspec validate --refs --warnings-ok → exit 0 (only pre-existing deprecated-ref
      warnings).

      - mise exec -- kspec validate --completeness --warnings-ok → exit 0 (only pre-existing
      malformed_ac_token warnings).


      Existing behavior preserved: launch errors (ENOENT) still surface via the launch/readiness
      race and the readiness try/catch's stop() call still runs on timeout / probe failure / launch
      error. Successful startup unchanged. The new failure path is reached only when the
      caller-provided hook throws.
