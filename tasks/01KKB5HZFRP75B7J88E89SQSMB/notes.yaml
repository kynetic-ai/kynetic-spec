  - _ulid: 01KKDZ2HX9EDNPYRF3MQ004F5Q
    content: "Implemented POST /api/items/batch in the daemon items routes. The endpoint resolves mixed
      spec/task refs with existing findItemByRef/findTaskByRef logic, returns normalized summary
      objects plus an unresolved array, validates missing refs input, and rejects batches over 100
      refs with a 400 validation_error response. Verification: npm test passed (208 files / 4515
      tests). npm run typecheck passed. kspec validate returned only existing repository warnings.
      Playwright E2E could not run in dispatch mode because the shared fixture attempts to start the
      daemon via kspec serve, which is explicitly blocked when KSPEC_SESSION_ID is set."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-11T08:09:08.777Z
