  - _ulid: 01KKB5N5WJYZCFCE5P3NX9XH4P
    content: >-
      Execution context:

      - Background: Plan embedded views need to resolve multiple spec/task refs in a single request
      to avoid N+1 API calls

      - Scope: Add POST /api/items/batch route. Accept { refs: string[] }, return { items: [],
      unresolved: [] }. Max 100 refs.

      - Files: packages/daemon/src/routes/items.ts (add batch route), use existing initContext +
      item/task loading patterns (findItemByRef/findTaskByRef)

      - Has trait: @trait-api-endpoint — must satisfy trait ACs (JSON response, error handling,
      request ID header)

      - Verification: curl POST to /api/items/batch with valid refs returns summaries. Empty refs
      returns empty arrays. >100 refs returns 400. Invalid refs appear in unresolved array.
    supersedes: null
    author: "@claude"
    created_at: 2026-03-10T06:06:27.219Z
  - _ulid: 01KKDYQ2KMHANNHPQMV55K354A
