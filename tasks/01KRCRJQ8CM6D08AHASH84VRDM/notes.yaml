  - _ulid: 01KRG2EHY6ECBC62HXEFNYVGYT
    content: 'Fix cycle 2: addressed the blocker on tests/lint-no-leaky-test-daemon.test.ts:1079. The
      cycle-1 child-handle boundary probe used spawn("node", [DAEMON_ENTRY, ...]), which the
      direct-daemon-entry guardrail reports unconditionally — so the boundary classifier was never
      the sole rejector and the probe would have passed even if process.on("exit", ...) were still
      credited as scoped cleanup. Switched the daemon-start to spawn("kspec", ["serve", "start",
      "--detach", "--port", "3456"]) so the start routes through isDetachCallExpression and the only
      path to a report is the cleanup classifier. Child handle preserved for the
      child.kill("SIGTERM") effect-classifier accept the comment described. Verified by stashing
      tools/eslint-rules/no-leaky-test-daemon.js: the probe fails without the rule fix (no warnings)
      and passes with it (no-leaky-test-daemon reported). Re-read all spec ACs and confirmed the
      other six boundary-isolating probes (process.on exit/beforeExit/SIGTERM, process.once exit,
      process.on message, onTestFinished+process.on allow-case) already use runKspec("serve start
      --detach ...") which goes through the detach path — no equivalent defect. Targeted suite
      (lint-no-leaky-test-daemon + lint-daemon-test-guardrails) green at 394 tests; kspec validate
      Schema OK / References OK; full npm test green at 9199 passed / 5 skipped of 9204 across 2433
      suites. Commit: e8b400acd.'
    supersedes: null
    author: "@claude"
