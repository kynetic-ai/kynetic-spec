  - _ulid: 01KNEBNWWYQMAK554QB2YFJC4K
    content: "Fix cycle 1 progress: updated serve start to resolve daemon.runtime from the project
      behind --kspec-dir, spawn node via process.execPath when configured, and clear cross-runtime
      env leakage so node children get NODE_ENV without inheriting BUN_ENV. Added an end-to-end CLI
      regression covering daemon.runtime=node with Bun removed from PATH, plus child-env coverage.
      Re-verified this task's adapter/shutdown coverage with targeted runtime tests, full npm test,
      and kspec validate (warnings only, no new task-specific issues)."
