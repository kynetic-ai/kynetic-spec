notes:
  - _ulid: 01KNEA7QE9JMKYE56AF9B84TVK
    content: "Approach: fix the Elysia node adapter wiring by passing an explicit runtime from the
      daemon entrypoint into createServer instead of auto-detecting from process. Reuse existing
      daemon build/startup tests and add focused behavioral tests around createServer adapter
      selection, SPA fallback serving from memory, and runtime-aware shutdown handling. Edge cases:
      node adapter version must match Elysia 1.1.x, startup under node must not rely on Bun globals,
      and shutdown must tolerate either stop() or close(). Test plan: cover @daemon-runtime-adapter
      ac-http-parity with adapter-selection plus SPA fallback behavior, and ac-graceful-shutdown
      with runtime-aware server stop/close behavior; also re-run daemon build/startup coverage under
      node and bun."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-05T07:55:36.265Z
  - _ulid: 01KNEAEJ06TG8NK6KS9NEMVN7N
    content: "Verified package pairing via npm metadata: @elysiajs/node has no 1.1.x release line;
      published versions start at 1.2.x, and even 1.2.6 requires elysia >= 1.2.7. Updated the
      project to elysia ^1.4.28 with @elysiajs/node ^1.4.5 and @elysiajs/cors ^1.4.1 so the adapter
      peer dependencies are satisfied in both the root workspace and packages/daemon package
      metadata."
    supersedes: null
