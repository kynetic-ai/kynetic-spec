    content: Implementation complete. Added loadAllTasksWithHistory() as optional method on
      TaskStorageBackend interface, implemented in SplitTaskBackend (reuses
      loadTaskFromDirWithHistory in bulk loop), delegated through TaskDataManager with fallback for
      backends without it. Updated entity-cache doLoadDomain(tasks) to use bulk method instead of
      per-task loop. Per-task loadTaskWithHistory() preserved for incremental updates. All 7642
      tests pass (5 CI-skipped).
