    content: "Approach: Add loadAllTasksWithHistory() as optional method to TaskStorageBackend interface
      (same pattern as loadTaskWithHistory). Implement in SplitTaskBackend reusing
      loadTaskFromDirWithHistory() in the same bulk loop as loadAllTasks(). Add delegation in
      TaskDataManager. Update entity-cache doLoadDomain(tasks) to call loadAllTasksWithHistory()
      instead of per-task loop. Tests: 1) SplitTaskBackend.loadAllTasksWithHistory returns both task
      and history, 2) Entity cache uses bulk loading (verified by behavior, not mocks), 3)
      Incremental updates still use per-task loading."
