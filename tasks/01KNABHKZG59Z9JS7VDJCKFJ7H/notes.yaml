notes:
  - _ulid: 01KNABMJYBBGB65DCYHZNV4C5F
    content: "Approach: inspect file-lock contention behavior and stabilize the same-process regression
      test without weakening the same-process no-reclaim guarantee. Reuse src/parser/file-lock.ts
      as-is unless reproduction shows a real logic bug. Edge cases: event-loop delay,
      release/reacquire races between same-process waiters, warning-path assertions under prolonged
      contention. Test plan: reproduce the existing regression under repeated runs, then replace
      timing-sensitive overlap detection with deterministic ownership/serialization assertions and
      re-run targeted plus full test suite."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-03T19:03:08.491Z
  - _ulid: 01KNABPHSJG2J8WPAXEJV6GSN8
    content: Replaced the flaky same-process reclaim assertion with a direct waiter-blocking check. The
      old test inferred overlap from a 25ms sleep boundary; under full-suite load that
      scheduler-dependent checkpoint could run after a legitimate release/reacquire. The new test
      holds the first lock past maxHoldMs, verifies a same-process waiter stays blocked with no
      reclaim warning, then confirms the waiter acquires only after release.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-04-03T19:04:12.851Z
