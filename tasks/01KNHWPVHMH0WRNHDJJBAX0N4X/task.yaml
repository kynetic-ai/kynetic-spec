  plan/plan-granular-cache-invalidation/01kndbmk and the reviewed snapshot. Investigate why
  scripts/dependency-health.cjs still sees those root direct dependencies as absent in
  dispatch/review worktrees, determine whether npm ci is omitting them or the check is looking in
  the wrong place, and restore a reliable bootstrap path for npm test.
