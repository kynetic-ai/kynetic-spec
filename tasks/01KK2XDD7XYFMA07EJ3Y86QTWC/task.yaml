title: Dispatch engine should poll for eligible pending tasks on start and periodically
type: task
description: "The dispatch engine is event-driven: it only picks up tasks when a trigger event fires
  (task.ready, task.in_progress, etc.). Tasks created before dispatch starts, or created without an
  explicit state transition event, are never picked up. Fix: (1) On dispatch start, sweep all
  pending+eligible tasks and emit synthetic task.ready events for them, (2) Add a periodic poll
  (e.g. every 60s) to catch any tasks that fell through without events, (3) Ensure task add with
  automation=eligible also emits a dispatchable event when dispatch is running."
