      - ac-new-projects-declare-folder-storage: tests/init-folder-storage-declarations.test.ts +
      tests/entity-storage-compatibility.test.ts (schema).

      - ac-unmigrated-projects-are-blocked-with-guidance: tests/entity-storage-compatibility.test.ts
      (strict/lenient describe/assert) +
      tests/daemon-api/entity-storage-incompatibility-routes.test.ts.

      - ac-partial-folder-layouts-are-blocked: tests/entity-storage-compatibility.test.ts
