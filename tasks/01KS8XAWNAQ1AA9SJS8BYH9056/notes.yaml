  - _ulid: 01KSAH16PKH0DYKMW9TSFFNGHN
    content: >-
      Implementation complete and ready for review.


      Scope delivered:

      - kynetic 1.2 manifest version with folder/entity_scoped storage declarations.

      - src/parser/entity-storage-compatibility.ts: lenient and strict gates, deterministic error
      codes (legacy_plan_storage_removed, legacy_review_storage_removed,
      missing_plan_folder_storage, missing_review_folder_storage, partial_entity_storage_layout),
      EntityStorageCompatibilityError carrying domain/cache_domain/field/suggestion, partial-layout
      detector.

      - src/cli/commands/init.ts and src/parser/shadow.ts: new projects declare kynetic 1.2 with
      folder/entity_scoped storage.

      - src/cli/commands/upgrade.ts: probe-based version detection recognises 1.2 while keeping
      1.0/1.1 caps intact.

      - src/cli/commands/doctor.ts and src/parser/doctor.ts: read-only Entity Storage diagnostics
      that surface declared formats without raising.

      - packages/daemon/src/routes/entity-storage-error.ts: 409 helper attaching
      entity_storage_incompatible + domain + field + suggestion + cache_domain/state.

      - Daemon routes (plans/reviews/tasks/items/refs/aggregation) catch storage-incompatibility
      errors and surface structured 409 instead of 404/500.

      - packages/shared/src/api.ts: ErrorResponse gains optional domain.

      - Parser plans.ts/reviews.ts: gated at loadPlans/savePlan/mutate/delete (and review
      equivalents) for unmigrated projects.


