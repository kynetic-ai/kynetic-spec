  - _ulid: 01KMR6JSEM1MKN6H5GEMS22GHV
    content: >-
      Fix cycle 4: Addressed all 4 blocker threads (2 root causes).


      Root cause 1 — Response parity (ac-response-parity): executeCommand was stripping output via
      .replace(/\n$/, '') on stdout and .trim() on stderr. Removed both — API now returns
      stdout/stderr verbatim, exactly matching direct CLI execution. The BatchExitError filter also
      preserves whitespace. Updated tests to verify stdout contains trailing newline and is not
      trimmed.


      Root cause 2 — X-Request-Id on validation errors (trait-api-endpoint ac-6): Header was set in
      onBeforeHandle, but Elysia runs body validation between onTransform and onBeforeHandle, so
      validation failures never triggered onBeforeHandle. Moved header assignment to onTransform
      which runs before validation. Added test verifying header is present on validation error
      responses.


      All 6965 tests pass (1944 suites), 5 pre-existing skips, no regressions. Re-verified all 5
      spec ACs and trait ACs.
    supersedes: null
