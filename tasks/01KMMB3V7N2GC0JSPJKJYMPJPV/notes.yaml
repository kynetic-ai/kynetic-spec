  - _ulid: 01KMR864XSX3Z3PV0HGS2F7DCK
    content: >-
      Fix cycle 5: Addressed blocker — YAML output mode leaking between requests.


      Root cause: executeCommand() called setJsonMode(false) to reset output format between
      dispatches, but setJsonMode(false) only clears the format when it's currently "json"
      (output.ts:76-78). When a --yaml request set globalOutputFormat to "yaml", subsequent requests
      never reset it back to "text". One caller's --yaml flag would leave the daemon stuck in YAML
      mode for all subsequent callers.


      Fix: Replaced setJsonMode(false) with setOutputFormat("text") which unconditionally resets
      globalOutputFormat to the default, regardless of whether the current format is json, yaml, or
      any future format.


      Added regression test: runs validate --yaml then task get --json sequentially, verifies the
      second request produces valid JSON (not leaked YAML). All 6966 tests pass (1 pre-existing
      flaky file-lock test, 5 pre-existing skips). Re-verified all 5 spec ACs.
    supersedes: null
