      tests/review-cli.test.ts passed; npm test -- tests/cli-serve.test.ts passed on retry after a
      full-suite run exposed a likely unrelated foreground-shutdown flake in that file; kspec
      validate still reports pre-existing repository-wide reference/completeness issues unrelated to
      this task."
