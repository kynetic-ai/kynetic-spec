title: Implement daemon roster persistence (multi-directory-daemon ac-15)
type: task
description: "Implement the restart-restore behavior promised by @multi-directory-daemon ac-15:
  persist the registered-project roster (project paths and registration metadata) in the daemon
  configuration directory, and restore it on daemon startup without client involvement. Restored
  entries whose project metadata is no longer valid must be surfaced and removed via the existing
  invalid-project handling (ac-20, ac-34) rather than poisoning the roster. Preserve ac-14
  request-time auto-registration. Add behavioral tests proving roster restore (write roster,
  restart, assert roster restored) and add the ac-15 coverage annotation there. Covers
  @client-preference-persistence ac-2 at the implementation layer. Carved out of the respec task
  @task-respec-daemon-project-roster-persistence, which only updated the spec text;
  ProjectContextManager.listProjects() currently holds in-memory runtime state only and does not
  restore from config."
