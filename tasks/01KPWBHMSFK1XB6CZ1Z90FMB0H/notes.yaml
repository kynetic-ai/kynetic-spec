    content: >-
      Approach: The contradiction is in the merge helper script (detached-reviewer-merge.sh) lines
      168-171 — the conflict handling section gives two options: (1) resolve simple/textual
      conflicts inline and re-run, and (2) submit MUST-FIX review for complex/semantic conflicts.
      But the dispatch prompt (dispatch.ts:318) and merge skill (SKILL.md:70,76) both clearly state:
      detached reviewers must NOT resolve conflicts inside the snapshot and must always move task to
      needs_work.


      The fix:

      1. Update the merge helper script conflict stderr to remove the inline resolution option and
      instead instruct the reviewer to move the task to needs_work with conflict details — matching
      the policy established in dispatch.ts and SKILL.md.

      2. Audit dispatch.ts and SKILL.md — these already enforce the correct policy, so minimal/no
      changes needed.

      3. Extend tests to assert the conflict path stderr does NOT instruct inline resolution and
      DOES instruct needs_work.

      4. Regenerate skill artifacts.


      Test plan: 5 ACs total, but this task covers ac-helper-path-in-reviewer-guidance and
      ac-helper-safe-conflict-exit. Test the conflict stderr for correct guidance wording. Verify
      dispatch prompt behavioral test still passes.
