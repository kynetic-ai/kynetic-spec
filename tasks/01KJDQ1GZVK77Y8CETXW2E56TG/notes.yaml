  - _ulid: 01KJM2R4EQV8T6WJV405GP3XWQ
    content: >-
      Implemented WebSocket reconnect-stability fix in packages/web-ui/src/lib/websocket/manager.ts
      and added regression tests in tests/websocket-manager.test.ts.


      What changed:

      - Added stale-socket guards in connect() event handlers so late events from old sockets are
      ignored and cannot null out the active connection.

      - Added intentionalDisconnect tracking so manual disconnects do not schedule reconnect
      attempts.

      - Updated disconnect() to detach current socket reference before close, preventing
      close-handler races with new connections.

      - Added regression tests for:
        1) old-socket close after project switch does not disrupt active socket,
        2) intentional disconnect does not auto-reconnect,
        3) unexpected disconnect still triggers reconnect.

      Verification:

      - npx vitest run tests/websocket-manager.test.ts (3 passed)

      - npm test (fails on pre-existing baseline issues unrelated to this change):
        - tests/cli-serve.test.ts "should show No projects registered when no projects exist"
        - tests/cli/session-note-limit.test.ts timeout failures (2 cases)
      - kspec validate (pre-existing project-wide schema/reference/alignment/completeness issues)
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-01T06:53:06.391Z
