  - _ulid: 01KJM2DPN621APMNNFFZCX3RN5
    content: >-
      Execution context:

      - Background: Web UI websocket manager can enter reconnect churn due to stale onclose handlers
      from prior sockets and reconnect attempts after intentional disconnect.

      - Scope: stabilize client connection lifecycle for intentional close and project-switch
      reconnects; add focused regression tests for stale-close and manual-disconnect behavior.

      - Files: packages/web-ui/src/lib/websocket/manager.ts, tests/web-ui/websocket-manager.test.ts
      (new).

      - Verification: run targeted vitest for websocket manager tests and relevant existing
      connection-related tests, then run full npm test before submit.
    supersedes: null
