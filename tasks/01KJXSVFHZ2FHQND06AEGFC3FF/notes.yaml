      alignment.ts only checked for in_progress tasks — needs_work and pending_review fell through
      to not_started. Fixed by treating needs_work, pending_review, and in_progress as active work
      states that map to spec in_progress. Added 3 new alignment tests. All 3706 tests pass (3
      pre-existing codex failures unrelated). kspec validate confirms 294/294 aligned (was
      293/294)."
