  - _ulid: 01KFRBVNA5D3Z9SQ1BN72AX69D
    content: |-
      Implementation complete:

      1. Schema changes (src/schema/meta.ts):
         - Added WorkflowModeSchema enum: 'interactive' | 'loop'
         - Added mode field (optional, defaults to 'interactive')
         - Added based_on field (optional RefSchema)
         - Added tags field (optional string array)

      2. CLI changes (src/cli/commands/meta.ts):
         - Added --tag filter to 'kspec meta workflows' command
         - Updated formatWorkflows() to show Mode column
         - Updated formatWorkflowsVerbose() to show mode and based_on
         - Added --mode, --based-on, --tag options to 'kspec meta add workflow'
         - JSON output includes new fields

      3. Tests (tests/meta.test.ts):
         - 9 new tests covering all 3 ACs:
           - AC-1: --tag loop filtering (includes mode: loop fallback)
           - AC-2: mode: loop validation, invalid mode rejection
           - AC-3: based_on in meta get and verbose output
         - Uses testUlid() helper for valid ULIDs
