title: Rework detached reviewer merge helper to use an ephemeral target worktree
type: task
description: >
  What:

  - Update `templates/skills/merge/scripts/detached-reviewer-merge.sh` so it no longer requires
  `KSPEC_DISPATCH_MERGE_TARGET` to be checked out in any pre-existing worktree.

  - When the target branch is free, create a helper-owned temporary worktree for
  `KSPEC_DISPATCH_MERGE_TARGET`, run the merge there, capture the merge result, and remove the
  temporary worktree in an EXIT/finally trap on every path.

  - The helper must preserve the pinned-head behavior: merge `KSPEC_DISPATCH_CANONICAL_HEAD`, not an
  advanced task branch tip.

  - On no-op, report success without creating persistent worktree state or moving refs.

  - On conflict, abort the merge in the temporary worktree, remove the temporary worktree, leave the
  integration target ref unchanged, and keep the existing needs_work/conflict guidance.

  - If `git worktree add` fails because the target branch is already checked out elsewhere, fail
  before moving refs with guidance to detach/free the existing checkout; do not say to check out the
  target branch somewhere else.

  - Edit the source skill script in `templates/skills/merge/scripts/detached-reviewer-merge.sh`,
  then run `kspec skill render` so generated
  `.agents/skills/kspec-merge/scripts/detached-reviewer-merge.sh` receives the same behavior. Only
  run `kspec agents generate` if agent instruction text also changes.


  Why:

  Reviewers are running from detached snapshots. Requiring a separate persistent target checkout
  creates a branch lock that blocks dispatch's safe integration-target mutation guard and stalls
  queued plan tasks.


  How:

  - Use `mktemp -d` or a deterministic helper scratch path under the dispatch worktree root only for
  the helper-owned target worktree; always remove it with `git worktree remove --force` and
  directory cleanup in a trap.

  - Use `git worktree list --porcelain` before and after to detect target branch occupancy.

  - Keep all mutation in the helper-owned target worktree. Do not run `git checkout` in the detached
  reviewer snapshot.

  - Keep errors explicit and actionable, but avoid recovery text that tells agents to create a
  persistent integration-target checkout.


  Testing:

  - npm test -- --fresh tests/detached-reviewer-merge.test.ts

  - npm test -- --fresh tests/supporting-file-references.test.ts tests/setup-builtin-agents.test.ts

  - npm run typecheck

  - kspec validate --refs --warnings-ok


  Covers: @detached-reviewer-merge-helper ac-helper-uses-ephemeral-target-worktree,
  ac-helper-leaves-no-target-branch-lock,
  ac-helper-occupied-target-refuses-with-free-branch-guidance, ac-helper-no-op-merge,
  ac-helper-refuses-dirty-target, ac-helper-safe-conflict-exit
