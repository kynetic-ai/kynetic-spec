    content: "Approach: add a read-only /api/spec-workspace projection family backed by existing item
      ancestry, AlignmentIndex linked tasks, plan derived_specs, session-related lookup,
      coverage-state read model, shared envelopes, and static snapshot helpers. Edge cases: bounded
      root/child pagination, missing nodes/criteria, invalid pagination fields, absent static
      snapshot/dynamic linked-work classes, and read endpoints creating no commits. Test plan:
