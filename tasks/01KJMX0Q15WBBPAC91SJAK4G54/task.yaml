title: Surface subagent process exit code and signal in failure errors
type: task
description: When a subagent process dies unexpectedly, the error only says JsonRpcFraming closed
  with no indication of why. The spawner exit handler (spawner.ts:89) discards (code, signal) from
  the child process exit event. Capture exit code/signal in the spawner and propagate it through the
  ACP client close path so the error message in ralph says something like Subagent process exited
  with signal SIGKILL or Subagent process exited with code 1 instead of the opaque framing error.
