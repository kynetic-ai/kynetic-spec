  - _ulid: 01KNRSE9J8F54GJD6B0ZYBFMZP
    content: >-
      Completed all changes across 4 files:


      1. tasks.spec.ts: Replaced 4 hardcoded count assertions — Active filter uses behavioral check
      (no completed/cancelled + at least one visible), All Statuses verifies completed badge
      appears, switch-back verifies completed badges disappear, automation filter spot-checks
      eligible badge via detail panel.


      2. file-watcher.spec.ts: Replaced 2 absolute count assertions — watcher-add test captures
      count before mutation and asserts before+1, second-project test snapshots full task title list
      and compares after mutation.


      3. test-base.ts: Added getFixtureTaskCounts() helper that parses split per-task YAML files
      (canonical for format:split) and derives {total, byStatus} counts. Falls back to
      project.tasks.yaml if split dir doesn't exist. Exported for use by dashboard contract test.


      4. dashboard.spec.ts: API contract test now calls getFixtureTaskCounts() and asserts API
      response matches fixture-derived counts bidirectionally (every expected status present, no
      unexpected statuses).


      All 53 e2e tests in scope pass. Full unit suite (7723 tests) also passes.
