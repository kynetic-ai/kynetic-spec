title: "Fix flaky tests: canonical-task-workspace-contract and agent-dispatch-engine"
type: task
description: >-
  Two test files pass when run individually but fail intermittently in the full suite due to timing
  sensitivity:


  1. tests/canonical-task-workspace-contract.test.ts — 'persists cleanup eligibility into canonical
  workspace metadata during runtime reconciliation' (1 of 6 tests)

  2. tests/agent-dispatch-engine.test.ts — 'should include worker completion guardrails for
  task.ready triggers' (1 of 123 tests)


  Both are integration tests with real git operations and async dispatch logic. Likely causes:
  shared state between test files, port conflicts, or insufficient timeouts in concurrent execution.


  Investigate root cause and fix — either isolate the shared state, increase timeouts, or
  restructure the tests to be hermetic.
