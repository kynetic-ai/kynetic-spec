  - _ulid: 01KKSW6YW2ZXFBPFHQ6A4HF63H
    content: "Implemented fix: replaced unconditional 'main' default return in
      resolveDispatchWorkspaceConfig (workspace.ts:1358-1363) with validation via
      resolveBranchStartPoint. Now throws DispatchWorkspaceError with actionable guidance when no
      base branch can be resolved. Added two tests: one for the error case (non-main repo, detached
      HEAD, no remote) and one for the valid default fallback (main exists, detached HEAD). All 5473
      tests pass."
