  - _ulid: 01KKD3C01B657ZNHHTFXDQB99E
    content: >-
      Fix cycle 1 completed:

      - Replaced single-value status handling with repeated status URL params and multi-select
      status chips.

      - Changed time-range URL contract from date_range to spec-compliant since=<iso-date> while
      keeping Today/7d/30d UX.

      - Added dedicated E2E AC coverage for agent_id, agent_type, repeated status params, since URL
      state, clear filters, and URL persistence.

      - Verification: npm test passed (199 files, 4409 tests, 3 skipped). kspec validate reported
      only existing project warning debt. Targeted Playwright sessions.spec could not run in
      dispatch because its fixture attempts kspec serve start, which is disallowed when
      KSPEC_SESSION_ID is set.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-11T00:04:58.027Z
  - _ulid: 01KKD4M5VZG1S5HYR8FW069WQP
    content: "[FIX_CYCLE: 2] Review findings: MUST-FIX: sessions page still fetches the full session
      dataset to populate filter controls, which defeats the new infinite-scroll pagination design
      and regresses initial load scalability."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-11T00:26:54.719Z
  - _ulid: 01KKD5XSN7HZC8YN9Q8XK388NB
    content: >-
      Fix cycle 2 addressed:

      - Removed the sessions page's unfiltered limit=total fetch for filter control hydration.

      - Filter options now seed from the first unfiltered page and grow from already-loaded
      paginated data, preserving infinite-scroll scalability.

      - Kept active agent/agent-type controls visible even when only the selected value is currently
      known.

      - Added E2E regression coverage that asserts filter-control seeding never requests more than
      the page size.

      - Verification: kspec validate returned only existing project warning debt. npm test still
      fails in inherited CLI suites (tests/session-log-list.test.ts,
      tests/session-legacy-cli.test.ts, tests/session-model-evolution.test.ts) that are already
      tracked under the separate session-list infinite-scroll fix cycle and are unrelated to this
      web-ui patch.
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-11T00:49:38.472Z
