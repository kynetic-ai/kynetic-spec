  - _ulid: 01KKCXCSXWYCM4AY8DXTJD4JCS
    content: >-
      Execution context:

      - Background: Add comprehensive filter controls to sessions page following the
      TaskFilters.svelte URL-state pattern

      - Scope: SessionFilters component, update FetchSessionsParams, update sessions page to use
      URL-derived filters and pass all params to API

      - Key ACs: status, agent_id, agent_type, trigger, date (since), clear filters, filter counts

      - Trait ACs: @ui-url-panel-state ac-4 (use goto() for URL mutations)

      - Files: packages/web-ui/src/routes/sessions/+page.svelte, packages/web-ui/src/lib/api.ts, new
      SessionFilters.svelte component

      - Verification: npm test, manual AC review
    supersedes: null
    author: "@claude"
