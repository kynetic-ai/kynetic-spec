    content: >-
      Review: request_changes (2 blockers).


      1. MUST-FIX: Dispatch workspace round-trip stability regression. The commit removes the
      raw-data-preservation pattern from dispatch-workspaces.ts (~200 lines of helpers deleted) and
      reverts saveDispatchWorkspaceRecord/mutateDispatchWorkspaceRecordAtomically to schema-parsing
      all workspaces via loadRegistryFile. This re-introduces Zod default pollution
      (branch_provenance, roleStates, etc.) on every write. The 7 dispatch workspace round-trip
      tests are also deleted. These must be restored.


      2. MUST-FIX: Out-of-scope deletions (~1850 lines). The commit removes the review detail page,
      shared API types, daemon route filters, E2E tests, and fixtures unrelated to workflow runs
      YAML stability. These deletions affect @review-records-web-ui and @review-records-daemon-api
      AC coverage and must be reverted.


      The workflow runs implementation itself (meta.ts changes + new tests) is correct and
      well-tested.
