  - _ulid: 01KJTDAQ7VYQDV957RQAX5422J
    content: "Spec work: Added ac-13..ac-16 to @cli-agent-commands for kspec agent dispatch watch
      command. Added ac-8 to @daemon-agent-dispatch for WebSocket text chunk broadcasting. The
      dispatch watch feature requires two implementation pieces: (1) daemon broadcasts
      agent_text_chunk events via existing WebSocket PubSub when dispatch engine text arrives, (2)
      new kspec agent dispatch watch subcommand that connects to daemon WS and tails output. Will be
      a separate task."
    supersedes: null
