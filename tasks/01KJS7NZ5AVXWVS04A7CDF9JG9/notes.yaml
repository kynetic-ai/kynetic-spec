  - _ulid: 01KJTE14Z9CNQCMHQFPVK0S7AY
    content: "[FIX_CYCLE: 1] Review findings: AC-11 test does not exercise the CLI-level isJsonMode()
      branch. The collected array is declared but never populated — onUpdate: undefined means
      nothing fills it, so expect(collected).toHaveLength(0) is trivially true. The test should call
      kspec('agent run <agent> prompt --json', testDir) via the CLI runner and assert stdout is
      valid JSON with no streaming text, similar to the dry-run --json test at line 609. The
      isJsonMode() conditional in agent.ts is currently untested at the CLI level."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-03T18:05:42.761Z
  - _ulid: 01KJTEG2P14VC6GRKZ3ZP1E137
    content: "Fix cycle 1: replaced false-positive ac-11 test. Old test passed onUpdate:undefined
      manually and asserted empty collected array (trivially true). New test uses
      setJsonMode(true)+isJsonMode() to replicate agent.ts decision logic, then asserts
      expect(onUpdate).toBeUndefined(). Combined with ac-12 (proves mock sends chunks when onUpdate
      is real), the pair is non-trivially true."
    supersedes: null
