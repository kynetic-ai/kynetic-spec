title: Stream agent text output to stdout in kspec agent run
type: task
description: >-
  kspec agent run currently calls runInvocation() without an onUpdate callback, so the agent's text
  response is never printed to the terminal. The user sees nothing until completion, when only the
  session ID and outcome are shown.


  Fix: In src/cli/commands/agent.ts (around line 363), pass an onUpdate handler to runInvocation
  that prints text content blocks to stdout as they arrive. In --json mode, suppress streaming. At
  the end, still output the session summary.


  Implementation details:

  - runInvocation accepts onUpdate?: (update: SessionUpdate) => void

  - SessionUpdate events with content arrays contain text blocks (type: 'text')

  - In interactive mode: process.stdout.write(block.text) for each text block

  - In --json mode: skip the onUpdate handler entirely

  - SessionUpdate type is imported from src/acp/index.ts


  Relevant files:

  - src/cli/commands/agent.ts — add onUpdate to runInvocation call (line ~363)

  - src/agent-runtime/invocation.ts — runInvocation signature with onUpdate

  - src/acp/index.ts — SessionUpdate type definition


  Test: E2E or integration test that runs kspec agent run and verifies stdout contains agent text
  output.


  Spec ACs to cover: @cli-agent-commands ac-12 (interactive streaming), ac-11 (JSON suppression)
