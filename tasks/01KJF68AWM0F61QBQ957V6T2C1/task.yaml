title: "Session events: Add oversized payload guardrails with externalized blob pointers"
type: bug
description: >-
  Problem: large ACP updates can inflate JSONL event lines and memory pressure. We need safety
  limits without losing auditability.


  Scope (steps 3-4):

  1) Add framing/event safety caps (line/payload size) to prevent single-message heap blowups.

  2) For oversized payload fields (toolResponse stdout/stderr, rawOutput, large chunk text), write
  full content to session blob files under .kspec/sessions/<id>/blobs/.

  3) Store compact pointer objects in events.jsonl (path, bytes, sha256, truncated=true, preview).

  4) Update session log show/search behavior to surface previews by default and optionally resolve
  blob content on demand.


  Non-goal: silently dropping payloads. If payload is externalized, events must keep enough metadata
  to reconstruct/audit.
