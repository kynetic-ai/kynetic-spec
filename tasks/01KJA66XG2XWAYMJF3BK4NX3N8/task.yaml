title: Fix shadow merge driver test to use project binary instead of global kspec
type: bug
description: >-
  tests/shadow.test.ts line 280-329 (AC: @yaml-merge-driver ac-12) silently skips when kspec isn't
  in PATH. It uses `execSync('which kspec')` to check, but in CI publish runs (and any env without
  global install), kspec isn't in PATH even though the project binary is available.


  Fix: Use the project's own binary instead of requiring a global install. Options:

  1. Use `path.resolve('node_modules/.bin/kspec')` to get the local binary path

  2. Or call initializeShadow with a kspecPath option if available

  3. Or use `npx kspec` which resolves the local binary


  The test should also use vitest `test.skipIf()` or `test.runIf()` instead of a silent early return
  — the current pattern makes it invisible in test output that coverage is being skipped.


  File: tests/shadow.test.ts:280-329
