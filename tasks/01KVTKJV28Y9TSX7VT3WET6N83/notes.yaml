notes:
  - _ulid: 01KVTKWSXMPPEZV946M5E9APN6
    content: "Approach: add a shared submission-linkage fallback resolver in the task CLI path and pass
      its result into captureSubmissionLinkage for both task submit and task set
      --submission-linkage. Precedence: real git upstream remains inside captureSubmissionLinkage;
      fallback resolves active .kspec-dispatch-workspace.json only when it matches the task/current
      checkout, then an available owning plan branch using local/remote branch checks, then
      dispatch.base_branch. Edge cases: unrelated or stale workspace metadata is ignored,
      missing/null plan branches preserve existing behavior, remote-only plan branches are accepted
      like dispatch provisioning. Test plan: add behavioral CLI regressions for submit and repair
      with manual_merge plan metadata/plan branch, keep existing git-upstream and non-plan
      dispatch.base_branch coverage, and add recovery/adoption evidence if inspection finds a gap."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-06-23T16:09:28.245Z
  - _ulid: 01KVTMXPXJY5H054ZAMP2W3R5G
    content: "Implemented submission-linkage fallback resolution for plan-scoped dispatch work. Both
      task submit and task set --submission-linkage now pass a resolved fallback upstream ref into
      captureSubmissionLinkage: matching active workspace metadata first, available owning plan
      branch second, dispatch.base_branch last. Git upstream tracking still takes precedence inside
      captureSubmissionLinkage. Added CLI regressions for manual_merge workspace target submit and
      plan-branch repair/backfill, plus adoption coverage proving submitted branch recovery keeps
      the plan branch integration target. Verification: focused linkage/workspace tests passed;
      format:check passed; lint --quiet passed with existing warning baseline; typecheck passed;
      kspec refs/alignment/completeness validations passed with warnings-ok; full npm test passed
      (10572 passed, 3 skipped)."
