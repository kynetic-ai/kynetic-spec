      activeTaskRefs from _activeTaskRefs(), which only returns registered active invocations
      (src/agent-runtime/dispatch.ts:986, 1364, 1586-1594). The pre-active spawn window tracked via
      inFlightTaskKeys is NOT included in cleanup protection input — confirms the AC describes new
      required behavior, not existing behavior. Held @agent-dispatch-engine implementation status at
      in_progress with --no-cascade to reflect the unimplemented AC."
