      Reviewer note: Failing tests on this branch are INTENTIONAL per the plan
      @plan-daemon-test-fixture-hardening. The dependent fix task
      @task-fix-guardrail-daemon-command-classification will make them pass. The plan deliberately
      splits regressions and rule fixes so an implementation cannot silently weaken the rule while
      keeping existing examples passing.
