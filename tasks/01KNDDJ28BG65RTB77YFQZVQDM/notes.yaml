    content: "Fix cycle 2: tightened debounce-window scoping in src/daemon/entity-cache.ts so
      currentReloadCycle is released when the window closes, even if that window's reloads are still
      in flight. Added overlapping-window coverage in tests/daemon-entity-cache.test.ts to prove
      manifest-triggered meta+items reloads still share one initContext() within a window while a
      later task-domain invalidation starts a fresh initContext() call. Re-verified with npm test --
      --fresh tests/daemon-entity-cache.test.ts, full npm test, and kspec validate (warnings only;
      same pre-existing repo-wide warning set)."
