    content: "Fix cycle 2 approach: narrow debounce-cycle context reuse so a reload cycle stops
      accepting new domains as soon as its debounce window closes, even if earlier reloads are still
      in flight. Test plan: keep the manifest meta+items reuse coverage and add an
      overlapping-window regression proving a later invalidation starts a fresh initContext() call
      instead of inheriting the prior cycle promise."
