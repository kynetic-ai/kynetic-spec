  - _ulid: 01KJR9KVAQSWCH131FS3MM9NKJ
    content: "[FIX_CYCLE: 4] Review findings: MUST-FIX (AC-11): Daemon shutdown does not stop active
      dispatch engines. The engines map in packages/daemon/src/routes/agent-dispatch.ts is never
      iterated on SIGTERM/SIGINT, so active invocations do not receive graceful cancel signals.
      AC-11 specifies 'daemon shutdown or explicit stop' — the explicit-stop path is correct but
      daemon shutdown is missing. Need to add stopAllEngines() export and call it from server.ts
      shutdown handler. Posted as inline comment on PR #634 (review 3878949264)."
    supersedes: null
