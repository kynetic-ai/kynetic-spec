  - _ulid: 01KKKAVCQ9D8G5V9G4FAPWFSXK
    content: "Fix cycle 3 resolution: restructured dispatch registry persistence so ALL registry writes
      happen inside the shadow mutation lock (withDispatchShadowMutationLock). Key changes: (1)
      split old commitWorkspaceRegistryIfShadow into withDispatchShadowMutationLock (lock wrapper) +
      commitWorkspaceRegistryToShadow (commit-only helper), (2) persistWorkspaceRecord now acquires
      lock → writes → commits atomically, (3) reconcileDispatchWorkspaceRegistry wraps all record
      saves + final commit in a single lock, (4) provisionDispatchWorkspace moves git worktree ops
      before the lock, then wraps provisioning + final record write + commit inside the lock, (5)
      test now asserts registry file is NOT modified when lock blocks the operation. All 142
      dispatch tests pass."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-13T10:11:09.161Z
