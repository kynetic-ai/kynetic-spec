  - _ulid: 01KKKSZGY5YEZEAEVBYJAMGH2T
    content: "Fix cycle 9 resolution: The ENOTEMPTY during temp-dir teardown was caused by engine.stop()
      returning while _reconcile() was still running. The setInterval callback fired _reconcile() as
      fire-and-forget, so stop() didn't wait for in-flight reconciliation to complete its file
      writes (registry saves, artifact cleanup). Fix: track the in-flight reconciliation promise and
      await it in stop() after clearing the interval timer. Verified with 2 consecutive full-suite
      runs (228/228 files, 4733/4733 tests, 0 failures)."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-13T14:35:33.189Z
  - _ulid: 01KKKT9E8F65DQC9VFJCGM9NMT
    content: "[FIX_CYCLE: 10] Review findings: MUST-FIX: DispatchEngine.stop() only awaits the most
      recently scheduled _reconcile() promise on PR #820, so overlapping reconciliation intervals
      can still leave registry/artifact mutations running after stop() returns."
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-13T14:40:58.127Z
  - _ulid: 01KKKVFRDTGDTX2397MYEKF8G1
    content: "Fix cycle 10 resolution: The inFlightReconcile field was a single Promise|null that only
      held the most recently scheduled _reconcile() promise. When reconciliation intervals
      overlapped (a new _reconcile fires before the previous one completes), earlier promises were
      silently dropped and stop() only awaited the latest one. Fix: replaced with a
      Set<Promise<void>> so every in-flight reconciliation is tracked and stop() uses
      Promise.allSettled to await them all before returning. Verified with full npm test (228 files,
      4733 tests, 0 failures)."
    supersedes: null
    author: "@claude"
    created_at: 2026-03-13T15:01:53.722Z
