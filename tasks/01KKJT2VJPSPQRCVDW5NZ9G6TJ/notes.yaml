  - _ulid: 01KKKJAW84A4Z2EVCA5WRHY0RG
    content: "Fix cycle 5 resolution: The dispatch-workspace-and-scheduler-flow test failure was a
      timing flake — the waitFor assertion budget (120 attempts * 10ms = 1.2s) was too tight for 4
      sequential workspace provisions under full-suite I/O contention. The engine produces all 4
      invocations correctly but sometimes exceeds 1.2s under load. Fix: increased waitFor to 500
      attempts * 20ms = 10s and test timeout from 15s to 30s. Verified with 5 consecutive full-suite
      runs (226/227 pass, only pre-existing droid detection failure remains)."
    supersedes: null
    author: "@claude"
