title: Durably shadow-commit dispatch workspace registry writes
type: bug
description: >-
  Dispatch workspace registry updates are currently written into
  .kspec/project.dispatch-workspaces.yaml by runtime code, but that path does not explicitly perform
  a shadow auto-commit afterward. This leaves a gap between writing registry state and durably
  persisting it on the shadow branch.


  Scope:

  - update the dispatch workspace registry/runtime write path so successful registry mutations
  trigger the correct shadow-branch commit flow

  - ensure the commit path respects dispatch shadow-mutation serialization instead of introducing a
  second unsynchronized write channel

  - add regression coverage proving provisioning/reconciliation registry writes survive restart as
  committed shadow state rather than only as a dirty worktree file

  - document any resulting runtime error behavior when the registry write succeeds but the shadow
  commit cannot be completed


  Outcome: dispatch workspace state becomes durably persisted at write time, not merely present in
  the local shadow worktree until some unrelated later commit happens.
