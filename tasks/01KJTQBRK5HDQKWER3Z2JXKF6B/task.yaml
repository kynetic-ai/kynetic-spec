title: Suppress non-actionable rate_limit_event noise in agent run output
type: bug
description: '`kspec agent run` currently prints adapter stderr lines like `Unexpected case:
  {"type":"rate_limit_event",...}` even when invocation succeeds. Investigation shows this
  originates from `@zed-industries/claude-agent-acp` unreachable logging and is surfaced because our
  spawner inherits stderr (`src/agents/spawner.ts`: stdio ["pipe","pipe","inherit"]). Add
  filtering/handling so informational rate-limit events do not pollute normal CLI output, while
  preserving actionable adapter errors.'
spec_ref: "@cli-agent-commands"
