  - _ulid: 01KJVAH9X9D3G35KKPPF232WJ5
    content: >-
      [FIX_CYCLE: 2] Addressed review MUST-FIX findings:

      - AC-1: Added integration E2E coverage in packages/web-ui/tests/e2e/api-websocket.spec.ts
      verifying /api/health.connections decrements after one of two active WebSocket clients
      disconnects.

      - AC-2: Added dedicated close-handler regression test in tests/daemon-websocket-close.test.ts
      for code 1006 ensuring cleanup removes tracked session and disconnect log contains session id
      (not undefined).

      Implementation hardening:

      - Added websocket lifecycle helper (packages/daemon/src/websocket/lifecycle.ts) and switched
      server close callback to use it.

      - Extended PubSubManager with context-id session tracking (from Elysia ws context id) plus
      existing socket/subscription fallbacks so close callbacks can resolve session identity even
      when ws.data is framework context.

      Verification:

      - npm test -- tests/daemon-pubsub.test.ts tests/daemon-heartbeat.test.ts
      tests/daemon-websocket-close.test.ts (pass)

      - Playwright targeted E2E: npx playwright test tests/e2e/api-websocket.spec.ts --grep "api
      health connection count decrements" (pass).
