  - _ulid: 01KJV9KEX4MQSP9MKNHKPGYFYG
    content: >-
      Execution context:

      - Background: daemon close events can lose session identity (seen as undefined) and leave
      stale tracked sockets.

      - Scope: make disconnect cleanup resilient to ws.data/session races, keep health connections
      accurate, and ensure heartbeat no longer pings disconnected clients.

      - Files: packages/daemon/src/server.ts, packages/daemon/src/websocket/pubsub.ts,
      tests/daemon-pubsub.test.ts, tests/daemon-heartbeat.test.ts.

      - Verification: targeted vitest for daemon websocket/pubsub/heartbeat plus repo validation
      (kspec validate).
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-04T02:07:34.308Z
  - _ulid: 01KJV9NQTQSHEA7BXWAG7WD9VN
    content: >-
      Implemented disconnect lifecycle cleanup:

      - Added stable socket->session tracking in PubSubManager via WeakMap and new
      removeConnectionBySocket()/getSessionIdBySocket().

      - Updated daemon WebSocket close handler to remove by socket identity and log resolved session
      id (prevents undefined session ids when ws.data races).

      - Added regression tests:
        - tests/daemon-pubsub.test.ts covers ac-1 (connection count accuracy) and ac-2 (abnormal-close-style cleanup with missing ws.data.sessionId).
        - tests/daemon-heartbeat.test.ts covers ac-3 (removed/disconnected sessions are not pinged on subsequent heartbeat tick).
      Verification:

      - npm test -- tests/daemon-pubsub.test.ts tests/daemon-heartbeat.test.ts (pass)

      - kspec validate currently fails due pre-existing project meta/reference issues unrelated to
      this task (duplicate @observations + missing observations skill file).
    supersedes: null
    author: Jacob Chapel
    created_at: 2026-03-04T02:08:48.983Z
