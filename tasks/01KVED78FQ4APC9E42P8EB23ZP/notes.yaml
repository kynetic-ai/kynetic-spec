    content: "Approach: extend the existing review anchor union with a plan_text schema; add a pure
      parser-side markdown sectioning utility; reuse resolvePlanRevisionContent and plan loading for
      creation-time validation in CLI and daemon write surfaces. Edge cases: duplicate headings,
      preamble-only content, negative offsets, empty quote, non-positive or missing revision
      ordinal, non-plan review subjects, absent sections, quote mismatches, and code-point offsets
      with CJK plus emoji before the span. Test plan: behavioral tests for all six
      @review-plan-text-anchors ACs via schema round-trip, pure sectioning, CLI mutations against
      published plan revisions, and daemon thread creation; also keep @review-spec-ac-anchors
      ac-anchor-variant-guidance covered by accepted anchor-type feedback."
    supersedes: null
    author: Jacob Chapel
