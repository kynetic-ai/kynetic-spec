  - _ulid: 01KHFRJXEG8FM0YEZFGTM4A1ZV
    content: >-
      Implemented renderClaudeCodeSkill library function in src/parser/skill-render.ts:


      - ac-1: renderClaudeCodeSkill creates .claude/skills/<id>/SKILL.md with YAML frontmatter

      - ac-2: Generated YAML frontmatter has name and description fields with proper delimiters

      - ac-3: Skill body content from source appears verbatim below frontmatter (strips source
      frontmatter)

      - ac-4: Rendered files written to disk as unstaged changes (no git commit)


      Additional features:

      - Dry run support via options.dryRun

      - Idempotent rendering (returns unchanged when content matches)

      - kspec-managed marker for identifying managed skills

      - Docs directory copying


      Added 15 tests covering all 4 acceptance criteria plus library behavior tests.
    supersedes: null
    author: "@claude"
