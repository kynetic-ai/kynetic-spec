title: Add CI lint to prevent static analysis test pattern
type: task
description: >-
  Add a vitest test that fails if any test file reads source code files — the static analysis
  anti-pattern this project is migrating away from.


  The pattern to detect: test files under tests/ that use readFile/readFileSync on paths containing
  src/ or packages/*/src/. These read implementation source code and assert on string patterns
  instead of testing behavior.


  Approach: Write tests/lint/no-static-analysis.test.ts that:

  1. Globs all tests/**/*.test.ts files

  2. Parses each file looking for readFile/readFileSync calls where the path argument references
  src/ (using simple regex)

  3. Fails with a clear error message: "Test file X reads source file Y. Tests should exercise
  behavior (import functions, call CLI, make HTTP requests) not scan source code for string
  patterns."


  No allowlist needed — there are no valid exceptions.


  This should run as part of npm test so it catches new static analysis tests before they merge.


  Note: The project uses Biome (not ESLint), and Biome doesn't support custom rules. A vitest lint
  test is the right approach — it's the same pattern used for other convention enforcement (see
  tests/convention-validation.test.ts).


  This task is blocked on all E2E migration and deletion tasks completing first.
