  - _ulid: 01KJAYTVN52T2MZW7R9RNAQPG9
    content: Implemented session-scoped filtering in checkpoint.ts. When KSPEC_SESSION_ID is set,
      checkpoint only warns about tasks belonging to the current session or unclaimed tasks. Tasks
      owned by other active sessions are excluded. Orphaned tasks (closed/missing session) are
      included via fail-safe. Session lookups use a per-checkpoint cache to avoid redundant
      filesystem reads. 10 integration tests added in tests/cli/session-checkpoint-scoping.test.ts,
      all passing. 160 existing CLI tests pass with no regressions.
