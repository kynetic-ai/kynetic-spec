description: >-
  Replace tests/daemon-watcher.test.ts (163 lines, all static analysis) with Playwright E2E tests.


  Write: packages/web-ui/tests/e2e/api-watcher.spec.ts

  Using: daemon fixture from tests/fixtures/test-base.ts


  Behaviors to test:

  - Modify a YAML file in the fixture's .kspec/ directory — verify daemon detects the change and
  updates data (visible via subsequent GET request or WebSocket event) (@daemon-server ac-4)

  - Verify debounce: rapid successive file changes result in a single reparse (@daemon-server ac-5)

  - Verify YAML parse errors don't crash the watcher — modify file to invalid YAML, then fix it
  (@daemon-server ac-6)


  Note: CI (GitHub Actions) does not support recursive fs.watch — file watcher tests are skipped in
  CI. Add the same skip condition used by other watcher tests. Check the convention in
  kspec-agents.md: 'File watcher tests skip in CI'.


  After E2E tests pass, delete tests/daemon-watcher.test.ts.

  Run: npm test && npm run test:e2e to verify.
