title: Address systemic trait AC testing gap
type: task
description: >-
  Trait ACs are inherited by specs but rarely tested. In the config/doctor feature set, only ~4/44
  trait ACs (9%) had test coverage. Traits like @trait-error-guidance (6 ACs), @trait-json-output (6
  ACs), and @trait-semantic-exit-codes (8 ACs) define expectations that inheriting specs silently
  ignore in tests.


  Options:

  1. Add a kspec validate check that warns when a spec inherits trait ACs but no test files contain
  // AC: @spec ac-N annotations for them

  2. Add guidance to the spec skill and task-work skill about testing trait ACs

  3. Generate a trait AC coverage report in /local-review


  This is a systemic issue, not specific to one spec. The trait inheritance model promises coverage
  that isn't being delivered.
