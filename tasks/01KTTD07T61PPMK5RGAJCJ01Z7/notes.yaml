notes:
  - _ulid: 01KTVJ43B9HT40SRTETQWHVYT0
    content: "Approach: follow the task's prescribed design. (1)
      DEFAULT_DAEMON_COMMAND_TIMEOUT_MS=120000 in src/daemon-shared/endpoint.ts, re-exported via
      packages/daemon/src/pid.ts shim (same pattern as DEFAULT_DAEMON_LOG_MAX_SIZE_BYTES). (2)
      daemon.command_timeout_ms in DaemonConfigSchema + ResolvedKspecConfig +
      defaults/resolution/getDefaultConfig in src/parser/config.ts. (3) serve.ts forwards
      --command-timeout argv like --log-max-size; daemon index.ts parses it and threads
      commandTimeoutMs into createServer -> createCommandRoutes. (4) command.ts: module-scope
      activeDispatch registry with exported getCommandDispatchHealth(); shared dispatchWithTimeout
      helper inside createCommandRoutes that races dispatchMutex.run(...).then(completionEffects)
      against a timer, sets per-request timedOut flag inside the setTimeout callback (queued-discard
      check happens inside the mutex fn), attaches .catch to abandoned executions logging via plain
      console.warn, clears timer in finally. Completion side effects (write-through + broadcast)
      move into the execution promise for both single and batch paths; response shaping (status,
      batch capture merge) stays in the handler and only applies pre-timeout. 504 via errorResponse
      {error: command_timeout, message, suggestion}. (5) Health: server.ts exports
      buildHealthResponse() including command_dispatch from getCommandDispatchHealth(); /api/health
      uses it; top-level status stays 'ok' to avoid breaking existing consumers, degradation
      reported in command_dispatch sub-object. Tests: extend tests/daemon-command-api.test.ts with
      50ms timeouts via new commandTimeoutMs route option; wedge stubs resolved at test end. Edge
      cases: timer cleared on normal completion; discarded queued commands skip completion effects;
      abandoned rejection must not crash (fatal-handlers unhandledRejection)."
    supersedes: null
    author: "@claude"
    created_at: 2026-06-11T14:42:02.729Z
  - _ulid: 01KTVKQE2V2B9864SRJ3712Y60
    content: "Implementation complete in commit 7685936801. All 5 ACs covered with annotated behavioral
      tests in tests/daemon-command-api.test.ts (route built with 50ms commandTimeoutMs, wedge stubs
      resolved at test end). Key decisions: (1) error helper polyfill — Elysia 1.4 does not provide
      the error context function under app.handle() in Node, so the test app polyfills it exactly
      like tests/daemon-api/helpers.ts does; production routes already rely on errorResponse so the
      route uses the same pattern. (2) Health: top-level status stays ok to avoid breaking existing
      /api/health consumers; degradation is reported in a new command_dispatch sub-object {status,
      stuck_command, running_for_ms, limit_ms}. buildHealthResponse() is exported from server.ts so
      tests exercise the production health shape without booting the full server. (3) The pid.ts
      shim and scripts/build-daemon.cjs hardcoded re-export list both needed the new
      DEFAULT_DAEMON_COMMAND_TIMEOUT_MS constant added. (4) The timer sets the per-request timed-out
      flag synchronously inside the setTimeout callback so a queued dispatch cannot start in the
      microtask gap between timer fire and race settle. Gates: format ✓, lint --quiet 0 errors ✓ (6
      remaining focused-lint warnings are pre-existing lines), typecheck ✓, FULL suite 10504 passed
      / 3 skipped ✓, kspec validate refs/alignment/completeness ✓."
    supersedes: null
    author: "@claude"
    created_at: 2026-06-11T15:10:04.891Z
