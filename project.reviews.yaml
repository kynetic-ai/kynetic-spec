    threads:
      - _ulid: 01KKWEE2S9HCBVWTMFWWB1FAJV
        anchor:
          type: code
          commit: ""
          line_end: 450
          line_start: 443
          path: src/utils/activity.ts
          side: head
        entries:
          - _ulid: 01KKWEE2S9FRNAT2SAWBKYNVCP
            author: "@claude"
            body: '**Dead code: submission_linkage case never fires.** In real YAML diffs, `submission_linkage:`
              is a map header (no scalar value), so parseDiffChanges never returns `{ field:
              "submission_linkage" }`. The nested child fields (review_url, branch, captured_at,
              etc.) are each captured as separate field_updated entries instead. Not a functional
              problem — submission commits always include a status change that gets correctly
              detected — but this case is unreachable and misleading.'
            created_at: 2026-03-16T23:06:57.193Z
        kind: nit
      - _ulid: 01KKWEECXPE7YHX3VHW5YE8FCY
        anchor:
          type: code
          commit: ""
          line_end: 349
          line_start: 348
          path: src/utils/activity.ts
          side: head
        entries:
          - _ulid: 01KKWEECXQSYWXXKZBB6E4MVZA
            author: "@claude"
            body: "**Nested map fields leak into scalar tracking.** parseDiffChanges has no general nesting
              awareness — only notes gets special-cased. Fields nested under submission_linkage
              (review_url, branch, captured_at, commit, remote, remote_url, upstream_ref) are
              treated as top-level task fields, producing misleading field_updated activity entries.
              Low impact for now since submission commits always have a high-signal status change,
              but worth noting if more nested map fields are added to the task schema."
            created_at: 2026-03-16T23:07:07.575Z
        kind: nit
      - _ulid: 01KKWEERM53HNGR625K67RG3BG
        anchor:
          type: code
          commit: ""
          line_end: 277
          line_start: 217
          path: src/utils/activity.ts
          side: head
        entries:
          - _ulid: 01KKWEERM6TBE0MCVNEVEPYV8C
            author: "@claude"
            body: "**Missing patterns for review-* commit messages.** The MESSAGE_PATTERNS array covers
              task-lifecycle operations but not review operations (review-add, review-open,
              review-check, review-close, review-comment, review-verdict, review-task-link). These
              fall through to \"unknown\". For task-scoped activity this is acceptable — most
              review-* commits don't touch the task's YAML block (exception: review-task-link sets
              review_ref, caught by diff path). But if this parser is ever used for general shadow
              branch activity, the gap would matter. Could add a catch-all `review-` prefix pattern
              mapped to a \"review_activity\" type."
            created_at: 2026-03-16T23:07:19.558Z
        kind: nit
