        anchor:
          type: code
          commit: ""
          line_end: 1213
          line_start: 1211
          path: src/agent-runtime/dispatch.ts
          side: head
        entries:
          - _ulid: 01KM07DEKKXS46Y4SW47WY1AYQ
            author: "@claude"
            body: >-
              MUST-FIX: _reconcile() does not gate sync on _isTargetSyncStale() — violates
              ac-pull-target-periodic


              The periodic sync in _reconcile() (line 1211) checks:
                if (this._remoteSyncEnabled && !this._hasActiveReviewerInvocation())

              But it does NOT check _isTargetSyncStale(). This means the sync runs on EVERY
              reconciliation pass, not just when the configured sync_interval has elapsed.


              ac-pull-target-periodic says: "When the configured sync interval elapses" — the
              implementation must respect the sync interval.


              If reconcileIntervalMs is 5s and sync_interval is 60s, the git fetch would run every
              5s instead of every 60s, which is wasteful and doesn't match spec.


              The before-provision path (line 2022) correctly uses _isTargetSyncStale(). The
              reconcile path should do the same:
                if (this._remoteSyncEnabled && this._isTargetSyncStale() && !this._hasActiveReviewerInvocation())

              The test for ac-pull-target-periodic (line 186) calls _syncTargetBranch() directly
              rather than going through _reconcile(), so it does not catch this bug.
            created_at: 2026-03-18T10:21:14.227Z
        kind: blocker
      - _ulid: 01KM07DRB8MGG7PYH1MXBKC1C9
        anchor:
          type: code
          commit: ""
          line_end: 2565
          line_start: 2563
          path: src/agent-runtime/dispatch.ts
          side: head
        entries:
          - _ulid: 01KM07DRB88541NRMDBM2327Z2
            author: "@claude"
            body: >-
              SUGGESTION: No explicit branch verification before git merge --ff-only


              _syncTargetBranch() runs git merge --ff-only in this.projectDir but does not verify
              that HEAD is on _syncBaseBranch. It relies on the implicit invariant that the project
              directory has the base branch checked out.


              The dispatch engine architecture guarantees this (task work happens in worktrees), so
              this is not a correctness bug in practice. However, a defensive check like:
                git symbolic-ref --short HEAD === this._syncBaseBranch
              before the merge would prevent silent corruption if the invariant ever breaks.


              Not blocking — the invariant holds in the dispatch model.
            created_at: 2026-03-18T10:21:24.200Z
        kind: nit
      - _ulid: 01KM07E0TGNEW8Z86T7WCHKYQT
        anchor:
          type: code
          commit: ""
          line_end: 2588
          line_start: 2582
          path: src/agent-runtime/dispatch.ts
          side: head
        entries:
          - _ulid: 01KM07E0TGKM9J9JBAZ15EDAH8
            author: "@claude"
            body: >-
              SUGGESTION: Dead code — "Already up to date" check on non-zero exit path


              Lines 2582-2588 check for "Already up to date" when mergeResult.status !== 0. However,
              git merge --ff-only exits 0 (success) when already up to date. The non-zero path only
              triggers on actual failures (divergence). This check is unreachable dead code.


