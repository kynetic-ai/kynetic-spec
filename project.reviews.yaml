              arrays for absent sections (agents, workflows, conventions, skills, includes), and
              then writes the full manifest back. The withFileLock concurrency guard was also
              removed from saveObservation, deleteObservation, saveMetaItem, and deleteMetaItem.


              This is especially concerning because dev HEAD is literally 'Merge
              dispatch/task/round-trip-stability-for-meta-manifest-yaml-writes/01kkx6cb into dev' —
              the immediately preceding merge added the round-trip stability guarantees that this
              commit reverts.


