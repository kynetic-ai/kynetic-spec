        entries:
          - _ulid: 01KM0251RRZ5JKH0MPV88A33AR
            author: "@claude"
            body: >-
              SHOULD-FIX: Missing _eventBus.clear() in DispatchEngine.stop()


              The stop() method (dispatch.ts:1045-1091) clears all engine state — queues,
              recentEvents, activeCount, invocationAbortControllers, activeInvocationDetails,
              coalesceTimers — but does NOT call this._eventBus.clear(). After stop(), the event bus
              retains: all subscribers, ring buffer contents (~500 events), task dedup entries,
              chain depth tracking, and pending delivery promise chains.


              This is inconsistent with the cleanup pattern of every other piece of state in stop()
              and represents a resource leak in test teardown or daemon restart scenarios where
              DispatchEngine instances are created/destroyed.


              Fix: Add this._eventBus.clear() at the end of stop().
            created_at: 2026-03-18T08:49:16.056Z
        kind: nit
      - _ulid: 01KM025A5W2D4QJ922EKQCNM1X
        anchor:
          type: code
          commit: ""
          line_end: 291
          line_start: 237
          path: src/agent-runtime/event-bus.ts
          side: head
        entries:
          - _ulid: 01KM025A5W7848EJQZ2WBMWPHB
            author: "@claude"
            body: >-
              SHOULD-FIX: Chain depth counter incremented before dedup check in emit()


              In event-bus.ts emit(), line 253 increments chainDepths.set(correlation_id, newDepth)
              BEFORE the task dedup check at lines 270-291. If a task event with a correlation_id
              passes the chain depth check but is then rejected by dedup, the depth counter has been
              incremented for an event that was never actually emitted.


              This is currently latent — all DispatchEngine callers either use skipDedup: true for
              task events or emit non-task events (invocation.*) that bypass the dedup path — but
              the public API contract is incorrect. Future direct EventBus users could hit false
              positives on chain depth limits.


              Fix: Move the task dedup check before the chain depth check, or decrement the counter
              on dedup rejection.
            created_at: 2026-03-18T08:49:24.669Z
        kind: nit
      - _ulid: 01KM025DK9DJPDJENWPJJ5B77C
        anchor:
