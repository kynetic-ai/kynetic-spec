        resolved_by: "@claude"
      - _ulid: 01KKZT1QCZ136ZR7RPK64RSJTA
        anchor:
          type: structured
          field: ac-transient-fetch-failure
          ref: "@dispatch-remote-branch-sync"
          section: acceptance_criteria
        entries:
          - _ulid: 01KKZT1QCZS7ZXRZ6G07QSCSRK
            author: "@claude"
            body: "Missing edge case: What happens when the remote is configured but requires authentication
              that has expired or is missing? The current ACs cover 'no remote' (ac-no-remote) and
              'transient fetch failure' (ac-transient-fetch-failure), but an auth failure is neither
              transient nor 'no remote' — it's a persistent, recoverable-by-operator failure mode.
              Should it be classified as transient (retried, eventually escalated) or should it
              trigger degraded state? The plan description says 'transient error (network
              unreachable, DNS failure, connection timeout)' which doesn't cover auth failures.
              Consider either: (1) adding an AC for auth/permission failures, or (2) explicitly
              stating in the description that auth failures are classified as transient failures for
              the purposes of the retry/escalation logic."
            created_at: 2026-03-18T06:27:38.527Z
          - _ulid: 01KKZV58XEFGZEXA12MXEWQTAV
            author: "@claude"
            body: Auth failures are classified as transient (same as network errors). The
              ac-repeated-transient-escalation AC covers the case where auth failures persist — the
              escalated warning signals the operator. No special auth handling needed.
            created_at: 2026-03-18T06:47:03.339Z
        kind: question
        resolved_at: 2026-03-18T06:47:05.977Z
        resolved_by: "@claude"
      - _ulid: 01KKZT23FWWWJZRZB0GM3QFJZK
        anchor:
          type: structured
          field: ac-pull-target-before-provision
          ref: "@dispatch-remote-branch-sync"
          section: acceptance_criteria
        entries:
          - _ulid: 01KKZT23FW0ZZPSTAPTE0KEV0Z
            author: "@claude"
            body: "Missing interaction: ac-pull-target-periodic says sync is deferred when a reviewer invocation
              is active, but there is no AC for what happens when a reviewer is active AND the
              target is stale AND a new workspace is about to be provisioned
              (ac-pull-target-before-provision). Does the before-provision sync also defer if a
              reviewer is active? The before-provision AC has no reviewer-active guard, which could
              mean it syncs the target branch while a reviewer is mid-merge — potentially causing
              the reviewer's merge to conflict with a concurrently updated target. Clarify the
              interaction between reviewer-active guards and the before-provision sync."
            created_at: 2026-03-18T06:27:50.908Z
          - _ulid: 01KKZV5ECK4MQHSE1N1K5W609Y
            author: "@claude"
            body: "Clarified in implementation notes: before-provision sync checks lastSyncTimestamp staleness,
              NOT reviewer activity. Safe because provision creates a new worktree from HEAD, not
              interfering with reviewer merge. Periodic sync skips during reviewer to avoid moving
              target mid-merge."
            created_at: 2026-03-18T06:47:08.947Z
        kind: question
        resolved_at: 2026-03-18T06:47:11.539Z
        resolved_by: "@claude"
      - _ulid: 01KKZT2EQRTQR2MNF6J08DENZN
        anchor:
          type: structured
          field: ac-push-target-periodic
          ref: "@dispatch-remote-branch-sync"
          section: acceptance_criteria
        entries:
          - _ulid: 01KKZT2EQRE1JTSAPGKV8XEW1P
            author: "@claude"
            body: ac-push-target-periodic's given clause says 'the local integration target branch is ahead of
              its remote tracking ref (has unpushed merge commits)' — but this check
              (isAheadOfUpstream) itself requires a fetch to have current remote ref info. The AC
              doesn't specify whether the periodic sync does fetch-then-check-ahead-then-push or
              just checks local ref state. If it only checks local refs without fetching first, it
              might attempt a push when remote has advanced (e.g., another developer pushed to the
              target), which would fail. The fetch is covered by ac-pull-target-periodic for the
              pull side, but the ordering dependency (fetch first, then check ahead, then push) is
              implicit. Consider making this explicit or noting that the push happens after the
              periodic fetch.
            created_at: 2026-03-18T06:28:02.424Z
          - _ulid: 01KKZV5KMKQNPM6T7E53T8CY0R
            author: "@claude"
            body: Simplified given clause to 'has commits not yet on the remote' — removed the parenthetical
              implementation detail.
            created_at: 2026-03-18T06:47:14.323Z
        kind: nit
        resolved_at: 2026-03-18T06:47:16.959Z
        resolved_by: "@claude"
      - _ulid: 01KKZT2WV4A05C8ABR6VW4AX07
        anchor:
          type: structured
          field: task-dispatch-target-sync
          ref: "@dispatch-remote-branch-sync"
          section: tasks
        entries:
          - _ulid: 01KKZT2WV4V30J1AZPG8EMG3XS
            author: "@claude"
            body: "task-dispatch-target-sync covers 10 ACs, which is very heavy for a single task. Compare with
              the reference plan where tasks typically cover 3-6 ACs. The degraded state surface
              area alone (detection, no-provision, status across 3 surfaces, auto-recovery,
              transient handling, escalation) is enough for its own task. Consider splitting into:
              (1) task-dispatch-target-sync — core sync logic (ac-pull-target-on-start,
              ac-pull-target-periodic, ac-pull-target-before-provision, ac-no-remote) and (2)
              task-dispatch-degraded-state — degraded state machine and surfaces
              (ac-divergence-detection, ac-degraded-no-provision, ac-degraded-status,
              ac-degraded-auto-recover, ac-transient-fetch-failure, ac-repeated-transient-failures).
              This mirrors how the reference plan separates @task-event-bus (core runtime) from
              @task-event-schema (structural definitions)."
            created_at: 2026-03-18T06:28:16.868Z
          - _ulid: 01KKZV5RFCQVW1YHXJBJE02GRA
            author: "@claude"
            body: "Split into task-dispatch-target-sync (7 ACs: sync mechanics) and task-dispatch-degraded-state
              (9 ACs: state machine + status surfaces). Degraded state depends on target sync."
            created_at: 2026-03-18T06:47:19.276Z
        kind: blocker
        resolved_at: 2026-03-18T06:47:21.788Z
        resolved_by: "@claude"
      - _ulid: 01KKZT39DKWVJ7B2ARE19PSSWD
        anchor:
          type: structured
          field: task-dispatch-branch-push
          ref: "@dispatch-remote-branch-sync"
          section: tasks
        entries:
          - _ulid: 01KKZT39DK2G0BS01VF35JMRJX
            author: "@claude"
            body: "task-dispatch-branch-push similarly covers 8 ACs spanning push lifecycle, stale ref handling,
              cleanup, and serialization. The remote branch cleanup (ac-cleanup-remote-branch) is a
              workspace lifecycle concern that could be its own small task or grouped with the merge
              conflict task. The serialization AC (ac-integration-push-serialization) is
              cross-cutting infrastructure. Consider: (1) task-dispatch-branch-push — core push
              lifecycle (ac-push-first-invocation, ac-push-after-invocation,
              ac-push-target-after-merge, ac-push-target-periodic, ac-remote-branch-stale,
              ac-no-remote push side) and (2) fold ac-cleanup-remote-branch and
              ac-integration-push-serialization into the merge conflict task or a separate small
              task."
            created_at: 2026-03-18T06:28:29.747Z
          - _ulid: 01KKZV5XE673628VB0R3AJ5F32
            author: "@claude"
            body: Kept as one task — the ACs are cohesive (all push lifecycle). Added ac-push-non-fatal as a
              shared AC reducing per-push duplication. 9 ACs but they form a single concern.
            created_at: 2026-03-18T06:47:24.358Z
        kind: question
        resolved_at: 2026-03-18T06:47:26.914Z
        resolved_by: "@claude"
      - _ulid: 01KKZT3MFBSCXD24FHCVE65RD7
        anchor:
          type: structured
          field: task-dispatch-merge-conflict-handling
          ref: "@dispatch-remote-branch-sync"
          section: tasks
        entries:
          - _ulid: 01KKZT3MFCNK5NF68RFSD8E5N7
            author: "@claude"
            body: "task-dispatch-merge-conflict-handling's description acknowledges an open design question:
              'who owns the merge — the agent or the dispatcher?' The task says to start with
              post-hoc detection but notes dispatcher-owned merge is the long-term direction. This
              is fine as a pragmatic approach, but the AC (ac-task-merge-conflict) is written as if
              the dispatcher detects the conflict directly ('a reviewer agent attempts to merge...
              the merge produces conflicts'). If the agent owns the merge, the dispatcher only knows
              about it after the fact by inspecting state. The AC should be rewritten to match the
              chosen detection mechanism, or the description should commit to one approach and defer
              the other. An AC that doesn't match the implementation approach will confuse the
              implementing agent."
            created_at: 2026-03-18T06:28:41.068Z
          - _ulid: 01KKZV62QSSX56CFHMGQZXHBH3
            author: "@claude"
            body: Committed to post-hoc detection approach. Updated spec description and task description to
              remove ambiguity. Dispatcher-owned merge noted as future direction in design
              decisions.
            created_at: 2026-03-18T06:47:29.785Z
        kind: question
        resolved_at: 2026-03-18T06:47:32.575Z
        resolved_by: "@claude"
      - _ulid: 01KKZT3ZRFVB59V8EPCCG63SZN
        anchor:
          type: structured
          field: ac-push-first-invocation
          ref: "@dispatch-remote-branch-sync"
