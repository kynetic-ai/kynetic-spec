          side: head
        entries:
          - _ulid: 01KM0M2S4Z9Q2HATW5X9AKHFJV
            author: "@claude"
            body: AC-3 specifies 4 trigger outcomes (accepted, buffered, queued, skipped) but only 3 are
              implemented. The 'queued' outcome (agent concurrency limit reached) is missing from
              the type union and logic. The schedule engine's triggerSchedule doesn't surface agent
              concurrency, so this may require upstream work. At minimum, add 'queued' to the
              outcome type and map any future concurrency-rejected results, or document in code
              comments that 'queued' is deferred pending agent concurrency tracking.
            created_at: 2026-03-18T14:02:36.063Z
