            body: >-
              **Out-of-scope deletions: review detail page, shared API types, daemon route filters,
              E2E tests, and fixtures.** This commit deletes ~1850 lines of code unrelated to the
              task "Round-trip stability for workflow runs YAML writes":


              - `packages/web-ui/src/routes/reviews/[id]/+page.svelte` (617 lines) — entire review
              detail page

