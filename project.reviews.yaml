        entries:
          - _ulid: 01KKYQNEYT3QGHND7KT3EQDDF5
            author: Jacob Chapel
            body: This atomic mutate path no longer validates sibling records before writing. Before this
              change,  schema-validated the entire registry, so a malformed non-target workspace
              blocked the mutation. Now we only parse , so the mutation succeeds, rewrites the file,
              and leaves an invalid sibling behind. I reproduced it against the built parser by
              writing one valid workspace plus a second with ;  succeeded, and only a later reload
              failed with . That is a behavior regression from the previous implementation and
              breaks the stated malformed-registry rejection guarantee.
            created_at: 2026-03-17T20:26:45.084Z
          - _ulid: 01KKYQP93HKJG30JW8W17PA9K2
            author: Jacob Chapel
            body: "Repro details: I wrote a registry with two workspaces, where the non-target sibling had
              integration.target_branch as the number 123. Calling
              mutateDispatchWorkspaceRecordAtomically on the valid workspace succeeded and rewrote
              the file. A subsequent loadDispatchWorkspaceRegistry then failed with
              'workspaces.1.integration.target_branch: Expected string, received number'. The
              previous implementation loaded the full registry through loadRegistryFile before
              mutating, so this write should have been rejected up front."
            created_at: 2026-03-17T20:27:11.857Z
        kind: blocker
      - _ulid: 01KKYQNFR0GKD5RRJSZB9F6XHE
        anchor:
          type: code
