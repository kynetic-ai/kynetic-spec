          path: packages/daemon/src/routes/automation.ts
          side: head
        entries:
          - _ulid: 01KM0M2ETNYGVPGCZF0W5QKQ77
            author: "@claude"
            body: "timeout_remaining_ms calculation is inverted: computes elapsed time (Date.now() -
              first_run_at) instead of remaining time (timeout_ms - elapsed). The GroupState doesn't
              carry timeout_ms from the composition config, so the remaining time cannot be
              computed. Currently returns elapsed time labeled as 'timeout_remaining_ms'. Impact:
              clients using this field get wrong values — they'd see timeout_remaining growing over
              time instead of shrinking."
            created_at: 2026-03-18T14:02:25.493Z
        kind: blocker
      - _ulid: 01KM0M2S4Y9C9H7E89HTHHRKHP
        anchor:
          type: code
