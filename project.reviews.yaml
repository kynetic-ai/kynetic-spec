            body: >-
              **Missing: no AC for review detail page URL routing pattern.**


              The web UI spec doesn't specify what the URL structure looks like. Existing patterns:
              /tasks, /tasks/board, /plans, /inbox, /sessions, /sessions/[id]. The review pages
              would presumably be /reviews (list) and /reviews/[id] (detail), but this isn't stated.


