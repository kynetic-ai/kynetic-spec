            author: "@claude"
            body: "**Regression: dispatch workspace round-trip stability removed.** This commit removes the
              raw-data-preservation pattern from `dispatch-workspaces.ts` — the functions
              `normalizeLegacyWorkspaceRaw`, `extractRawWorkspaceArray`, `writeRawWorkspaceArray`,
              `findRawWorkspaceIndex`, `mergeWorkspacePreservingRawShape`, `deepEqual`,
              `isTrivialDefault`, `isRawClosedBeyondRetention`, and
              `validateSingleOpenWorkspacePerTaskRaw` are all deleted. The
              `saveDispatchWorkspaceRecord` and `mutateDispatchWorkspaceRecordAtomically` functions
              now use `loadRegistryFile` which schema-parses ALL workspaces through
              `DispatchWorkspaceRegistryFileSchema.safeParse()`, re-introducing Zod defaults (e.g.
              `branch_provenance`, `roleStates`) on every write. The tests covering dispatch
              workspace round-trip stability (7 tests) are also deleted. This is a direct regression
              against ac-3 of @yaml-serialization-invariants for the dispatch workspace path, which
              was the subject of a prior completed task."
            created_at: 2026-03-18T00:23:43.167Z
        kind: blocker
