      - _ulid: 01KKTVR1XNKPF715NGARH06V3G
        entries:
          - _ulid: 01KKTVR1XNA2VZ150A5ZK7X36K
            author: "@claude"
            body: >-
              **BLOCKER: Diff API route pattern `/:base..:head` is not valid Elysia routing**


              The plan specifies `GET /api/diff/:base..:head` but Elysia (the daemon's HTTP
              framework) uses standard route params like `/:ref`. The `..` literal between two
              params is not a valid Elysia route pattern — it would be interpreted as a single param
              or fail to match.


              **Options:**

              1. Use query params: `GET /api/diff?base=abc&head=def`

              2. Use two path segments: `GET /api/diff/:base/:head`

              3. Use a single param and parse server-side: `GET /api/diff/:range` where range is
              `abc..def`


              Option 3 is closest to the git convention but requires manual parsing. Option 2 is
              cleanest for Elysia. The same issue applies to `GET /api/diff/:base..:head/:path` and
              `GET /api/diff/:base..:head/context`.


              This affects: review-content-diff-api ac-1, ac-2, ac-3 and task-diff-api.
            created_at: 2026-03-16T08:21:06.613Z
        kind: blocker
      - _ulid: 01KKTVRE9NBER2D85VPVMRD3VE
        entries:
          - _ulid: 01KKTVRE9P68AYHD4W7STS971J
            author: "@claude"
            body: >-
              **BLOCKER: Revision selector query assumes `subject-ref` filter but code reviews have
              no `ref`**


              The revision selector (ac-11) and task-review-detail-page both say to query `GET
              /api/reviews?subject-ref=X` to find sibling reviews. However, the review schema uses a
              discriminated union for the subject:


              - **plan/task/spec reviews** have `subject.ref` (e.g., `@plan-review-records-web-ui`)

              - **code reviews** have NO `ref` — they have `base_commit`, `head_commit`,
              `base_branch`, `head_branch`


              The plan says to match code reviews by "same base-branch/head-branch" but the API spec
              (review-records-daemon-api ac-1) only lists `subject-ref` as a filter, not
              `base-branch`/`head-branch`.


              **Fix needed:**

              1. Add `base-branch` and `head-branch` as query filters to review-records-daemon-api
              ac-1

              2. Specify in ac-11 exactly which fields to match for each subject type

              3. Consider: should `subject-ref` filter also search `related_refs`?
            created_at: 2026-03-16T08:21:19.286Z
        kind: blocker
      - _ulid: 01KKTVRR31F3408SRDYCT4Q6T0
        entries:
          - _ulid: 01KKTVRR31JE2HFM6T2804XH6G
            author: "@claude"
            body: >-
              **QUESTION: Context expansion route conflicts with single-file diff route**


              The task-diff-api description specifies:

              - `GET /api/diff/:base..:head/:path` — single-file diff (lazy loading)

              - `GET /api/diff/:base..:head/context` — expanded context lines


              If `:path` is a wildcard param, then `context` would be matched as a path value, not
              as a literal route segment. These two routes conflict.


              **Suggestion:** Use a query param approach for context expansion instead: `GET
              /api/diff/:range/:path?expand=true&start=N&end=N`, or use a distinct route prefix like
              `GET /api/diff/:range/expand-context?path=X&start=N&end=N`.
            created_at: 2026-03-16T08:21:29.313Z
        kind: blocker
      - _ulid: 01KKTVS3JBQB956MEDG81RTV72
        entries:
          - _ulid: 01KKTVS3JBHP97KJRDCKRH012E
            author: "@claude"
            body: >-
              **NIT: npm package verification — both packages exist and are viable**


              Verified:

              - `@git-diff-view/svelte` — exists on npm (from MrWangJustToDo/git-diff-view repo).
              Provides native Svelte diff components with widget system, split/unified views, syntax
              highlighting. The plan's description of `renderWidgetLine`, `onAddWidgetClick`, and
              `extendData` APIs is accurate per the repo docs.

              - `parse-git-diff` — exists on npm (v0.0.19). Zero-dependency parser for raw git diff
              output. MIT licensed.


              Both packages are appropriate choices for the specified use case.
            created_at: 2026-03-16T08:21:41.067Z
        kind: nit
      - _ulid: 01KKTVSEVZA1VSY52ASDJWQXEX
        entries:
          - _ulid: 01KKTVSEW08HZ5M5BH7KGCGM6Z
            author: "@claude"
            body: >-
              **QUESTION: review-content-diff-api ac-2 "context expansion" — where do path/start/end
              params come from?**


              ac-2 says "the request includes path, start line, and end line" but doesn't specify
              the endpoint URL or whether these are query params vs path params. The task
              description uses `GET /api/diff/:base..:head/context` which doesn't include
              path/start/end in the URL pattern.


              Should this AC specify the exact request format? E.g.: `GET
              /api/diff/:range/context?path=src/foo.ts&start=10&end=30&commit=abc1234`


              Also: the AC says "at the specified commit" — but the route uses base..head range.
              Which commit should the context be resolved against? Presumably `head` for new-side
              context and `base` for old-side, but the AC is ambiguous. Consider specifying a `side`
              or `commit` query param.
            created_at: 2026-03-16T08:21:52.640Z
        kind: question
      - _ulid: 01KKTVSS64ZWH9MHZRF924902S
        entries:
          - _ulid: 01KKTVSS64F6JQ0DA7RBH5E14X
            author: "@claude"
            body: >-
              **QUESTION: Should review-records-web-ui use a /reviews/[id] dynamic route?**


              The existing web UI routes use flat page patterns (e.g., `/tasks`, `/plans`,
              `/sessions/[id]`). Only `sessions/[id]` uses a dynamic route param. The plan proposes
              `/reviews/[id]` which follows the sessions pattern — this is consistent.


              However, the current task detail and plan detail pages don't appear to use dynamic
              routes — they seem to use URL query params or in-page expansion. Is the intent to
              introduce a new dynamic route pattern for reviews, or should the detail view follow
              the existing expansion/modal pattern used by tasks and plans?


              This is non-blocking — either approach works — but worth confirming the UX intent
              matches the existing app patterns.
            created_at: 2026-03-16T08:22:03.204Z
        kind: question
