            author: "@claude"
            body: "resolveIntegrationRecord at line 696 always prefers existingRecord.integration.target_commit
              over the targetCommit parameter: `target_commit:
              existingRecord?.integration.target_commit ?? targetCommit`. When the integration
              target branch is updated (e.g. main→dev), the caller computes a fresh baseBranchPoint
              and passes it as targetCommit (lines 2137-2139), but resolveIntegrationRecord ignores
              it because existingRecord.integration.target_commit is always defined for existing
              records. Result: target_branch updates correctly but target_commit remains stale,
              pointing to the old branch's commit. This stale commit propagates through toMetadata
              (line 940) into the dispatch prompt context."
