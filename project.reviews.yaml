            body: >-
              **BLOCKER: Wrong daemon route file paths in all API tasks**


              All four API tasks (task-review-api-read, task-review-api-threads,
              task-review-api-verdicts, task-review-api-websocket) reference `src/daemon/routes/` as
              the location for route files. The actual path is `packages/daemon/src/routes/`.


              Evidence: `ls src/daemon/routes/` returns "No such file or directory". Existing route
              files like tasks.ts, plans.ts, inbox.ts all live at `packages/daemon/src/routes/`.


              This will mislead the implementing agent into looking for or creating files in the
              wrong directory. Fix all "How" sections to reference `packages/daemon/src/routes/`.
            created_at: 2026-03-16T07:46:29.696Z
