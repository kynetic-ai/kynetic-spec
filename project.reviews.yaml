    threads:
      - _ulid: 01KKXG51H3D0MJME4T5BC9EY9E
        anchor:
          type: code
          commit: bb450d490918
          line_end: 43
          line_start: 34
          path: packages/daemon/src/routes/diff.ts
          side: head
        entries:
          - _ulid: 01KKXG51H31X4NH7XS4MCNCQTG
            author: "@claude"
            body: >-
              **MUST-FIX: Command injection in git helper functions**


              All three git helper functions (`runGitDiff`, `getFileAtCommit`, `isValidGitRef`)
              construct shell commands by string-interpolating user-supplied HTTP query parameters
              directly into `execSync` calls:


              - Line 36: `git diff ${base}..${head}${pathArg}` — `base` and `head` from query params

              - Line 50: `git show ${commit}:${filePath}` — both from query params  

              - Line 66: `git rev-parse --verify ${ref}` — from query params


              A request like `GET /api/diff?base=abc&head=def;id` would execute `git diff
              abc..def;id` — running the `id` command. Since `isValidGitRef` is also vulnerable, the
              injection happens during validation itself.


              **Fix:** Use `execFileSync` (array form, no shell) instead of `execSync` (string form,
              shell), e.g.:

              ```ts

              execFileSync('git', ['diff', `${base}..${head}`], { cwd, ... })

              ```


              While the daemon is localhost-only (limiting attack surface), this is still a command
              injection vulnerability per OWASP top 10. Any local process can exploit it.
            created_at: 2026-03-17T08:56:12.580Z
        kind: blocker
      - _ulid: 01KKXG5CW9QT64HQGAS2QVNN9W
        anchor:
          type: code
