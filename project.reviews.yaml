            body: >-
              **MUST-FIX: No test coverage for ac-4 (GET /api/reviews/:id/content)**


              The review content endpoint (lines 297-533) handles 5 subject types (plan, spec, code,
              task, external) with ~230 lines of logic including entity loading, reference
              resolution, and structured content assembly. It has zero test coverage — no test
              annotations for ac-4 exist in the test file.


              This is the most complex handler in the submission and the one most likely to have
              bugs (it loads review records, resolves references, constructs structured section
              arrays, handles optional fields like notes/traits/ACs). Unit tests should cover at
              minimum:


              1. Plan subject → returns sections with content, derived_specs, derived_tasks, notes

              2. Spec subject → returns description, acceptance_criteria, traits, metadata

              3. Task subject → returns description and notes

              4. Code subject → returns diff_params redirect

              5. Not-found cases for each subject type

              6. Review not found → 404
