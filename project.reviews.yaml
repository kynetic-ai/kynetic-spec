            body: "Potential double action.failed event emission: Both the 'error' and 'close' event handlers on
              the child process emit action.failed events independently. When a process fails to
              spawn (e.g., ENOENT), Node.js fires both events. The promise resolve is idempotent
              (second call is a no-op), so the return value is correct, but onActionRunEvent fires
              twice with action.failed for the same action_run_id. Event consumers counting or
              logging failures would see duplicates. Same pattern exists in executeKspec. Fix: add a
              'settled' boolean guard to prevent duplicate event emission after the first terminal
              event."
