            body: >-
              **Missing: no AC for review detail page URL routing pattern.**


              The web UI spec doesn't specify what the URL structure looks like. Existing patterns:
              /tasks, /tasks/board, /plans, /inbox, /sessions, /sessions/[id]. The review pages
              would presumably be /reviews (list) and /reviews/[id] (detail), but this isn't stated.


              More importantly, the plan doesn't specify how deep-linking to specific threads works.
              If a user clicks a thread notification or link, they should land on the review detail
              page scrolled to that thread. This is a common pattern that's easy to miss and hard to
              retrofit.


              Recommendation: Add an AC for URL structure and deep-linking to threads (e.g.,
              /reviews/:id?thread=:threadId or /reviews/:id#thread-:threadId).
