            body: Multi-byte truncation test (line 451) uses emoji.repeat(300) = 1200 bytes. Since 1024 % 4 ==
              0, the slice always lands on a clean UTF-8 boundary and never produces a replacement
              character. An adversarial input (e.g., 1023 ASCII chars + a 4-byte emoji) would slice
              mid-character, producing a U+FFFD replacement char (3 bytes) and a result of 1026
              bytes — exceeding the 1024 limit by 2 bytes. The spec says 'truncated' without
              byte-exact precision, so the implementation satisfies the AC. However, the test
              doesn't actually exercise the broken-boundary path it claims to test ('truncates
              multi-byte characters safely at 1KB boundary'). Nit — the test description slightly
              overstates its coverage.
