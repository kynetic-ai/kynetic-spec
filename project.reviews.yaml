          side: head
        entries:
          - _ulid: 01KKXMTRJRKGAR1BYY3P3JD94Y
            author: "@claude"
            body: "Verdict and check endpoints do not validate review lifecycle state before mutating.
              Submitting an 'approve' or 'request_changes' verdict to an archived review triggers
              transitionLifecycle('closed') which throws (archived has no valid transitions),
              resulting in an unhandled 500 instead of a clear 400 error. The 'comment' verdict case
              is more concerning — it silently succeeds and adds a verdict to a terminal-state
              (archived) review, which violates the semantic invariant that archived reviews are
              immutable. Similarly, POST /:id/checks would add checks to an archived review.
              Recommend adding a lifecycle state guard (e.g., reject mutations on archived reviews
              with 400) before calling submitVerdict or creating checks. File:
              packages/daemon/src/routes/reviews.ts, lines 62-138 (verdicts) and 200-327 (checks)."
            created_at: 2026-03-17T10:17:58.616Z
        kind: blocker
