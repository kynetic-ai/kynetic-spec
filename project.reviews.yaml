      - _ulid: 01KKTTFWDN9JQWEC19ZW5NP095
        entries:
          - _ulid: 01KKTTFWDN2ZKXHT34A7EK06SH
            author: "@claude"
            body: >-
              **AC-9 (code anchor display): Missing fallback behavior.** The AC says 'a code context
              snippet from the referenced lines is displayed alongside the comment' but doesn't
              address what happens when the code context is unavailable (commit not present locally,
              file deleted in HEAD, referenced lines out of range). The daemon API returns anchor
              metadata but may not have the actual file content to serve a snippet. Two sub-issues:


              1. **Where does the snippet come from?** The daemon API spec (ac-2) returns the full
              review record which includes the code anchor fields (path, line-start, line-end, side,
              commit), but there is no API endpoint or AC for actually resolving those fields into
              source code content. The web UI AC assumes a snippet exists but nothing produces it.


              2. **Graceful degradation:** When snippet resolution fails, the AC should specify the
              fallback — e.g., show the file path and line range without the snippet, with a note
              that the source is unavailable.
            created_at: 2026-03-16T07:59:10.261Z
        kind: blocker
      - _ulid: 01KKTTG8AFCAC7NCM309T27AVS
        entries:
          - _ulid: 01KKTTG8AFH2HC57H7A349F87S
            author: "@claude"
            body: "**AC-10 (structured anchor display): Good, minor clarification needed.** The AC correctly
              specifies showing section/field context with a navigable link. The example format
              ('acceptance_criteria > ac-3 on @spec-ref') is helpful. However, 'navigable link' is
              ambiguous — does it navigate to the spec detail page in the web UI, or is it a
              conceptual reference? Since the web UI has /specs or /items routes, clarify whether
              the link targets an existing route (and what happens if that route doesn't exist yet)
              or just renders as a styled reference badge."
            created_at: 2026-03-16T07:59:22.447Z
        kind: question
      - _ulid: 01KKTTGHHBSR8EPC61RGZ1RQG9
        entries:
          - _ulid: 01KKTTGHHBGGXQXMRYSQQ8MPA6
            author: "@claude"
            body: "**AC-11 (check evidence display): Well-aligned with core spec.** The staleness indicator
              requirement directly maps to @review-checks-and-gate-evaluation ac-5 and ac-6
              (applies_to_version matching). The AC correctly requires runner name, status badge,
              and staleness — all fields available from the check record schema. Testable via E2E.
              No issues."
            created_at: 2026-03-16T07:59:31.884Z
        kind: nit
      - _ulid: 01KKTTGXHWEF1S4J3XF68WQV4W
        entries:
          - _ulid: 01KKTTGXHWF3MCAZMK8Q2XR9DH
            author: "@claude"
            body: "**AC-12 (verdict body rendering): Testable but assumption gap.** The AC says 'a verdict has a
              body or notes' but the review verdict schema (from kspec review verdict CLI) only
              accepts --decision, --reviewer, and --version fields — there is no --body or --notes
              parameter. If verdict bodies are not yet part of the schema, this AC is specifying UI
              rendering for data that cannot be produced. Either the verdict schema needs extending
              (separate spec work) or this AC should be deferred until verdict bodies exist."
            created_at: 2026-03-16T07:59:44.188Z
        kind: blocker
      - _ulid: 01KKTTHAQW2Y96GPFN3JVQYSSH
        entries:
          - _ulid: 01KKTTHAQXPMRQJKMWC35N1NSK
            author: "@claude"
            body: >-
              **Task scoping: detail page task covers too many rendering concerns.** Task
              @task-review-detail-page now covers ac-2, ac-8, ac-9, ac-10, ac-11, ac-12 — six ACs
              spanning layout, markdown rendering, code snippet resolution, structured anchor
              navigation, check staleness logic, and verdict formatting. This is a lot of distinct
              rendering work.


              Consider splitting: ac-8 + ac-12 (markdown rendering) could be a shared component task
              since both are 'render markdown body' with the same library/approach. ac-9 (code
              anchor display) involves snippet resolution which has its own data-fetching complexity
              (see blocker on AC-9). ac-10, ac-11 are lighter and fit naturally in the detail page
              task alongside ac-2.


              Recommendation: Split ac-9 into its own task (it requires solving the snippet data
              source problem first), keep the rest in the detail page task. Markdown rendering
              (ac-8, ac-12) could stay in the detail page task since the shared component is an
              implementation detail, not a separate deliverable.
            created_at: 2026-03-16T07:59:57.693Z
        kind: question
      - _ulid: 01KKTTHR74ZWBTAT568053N07S
        entries:
          - _ulid: 01KKTTHR7466Q2AM63QFY1T5C3
            author: "@claude"
            body: >-
              **Remaining content rendering gaps:**


              1. **Event timeline rendering** — The detail page task description mentions 'Event
              timeline (collapsible)' but no AC covers it. Events are part of the review record
              (visible in kspec review get output). If the timeline is in scope, add an AC. If it's
              an implementation detail of ac-2, that's fine, but ac-2's then-clause doesn't mention
              events explicitly despite the task description including them.


              2. **Empty states** — No AC covers what happens when a review has zero threads, zero
              checks, or zero verdicts. The list page task description mentions 'Empty state when no
              reviews exist' but again no AC for it. Empty states are important for UX — a blank
              section with no explanation is confusing. Consider adding at minimum an AC for the
              empty review list state.


              3. **Thread entry author/timestamp display** — ac-2 says 'All threads are displayed
              with their entries' but doesn't specify that each entry shows author and timestamp.
              The task description says 'entries with timestamps' but the AC should be the source of
              truth.


