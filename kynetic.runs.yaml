        completed_at: 2026-02-26T13:42:36.480Z
        notes: >-
          High-confidence items identified (searched, none duplicated):


          FRICTION (systemic, concrete):

          1. new Date(invalid) JS gotcha: new Date('bad-string') returns Invalid Date but does NOT
          throw. Any test using expect(() => new Date(x)).not.toThrow() or try/catch around new
          Date() will always pass even with malformed timestamps. Fix: always use isNaN(new
          Date(x).getTime()). This is a repeatable E2E testing pitfall.


          2. CI check-unresolved-comments timing race: When Codex posts inline PR comments and we
          then push a fix commit, CI triggers immediately on the push BEFORE we manually resolve
          threads. The check-unresolved-comments job then fails on the new commit. Requires manual
          workflow re-run after resolving threads. Pattern: push -> CI triggers -> resolve threads
          -> CI already done. Mitigation: resolve threads BEFORE pushing fix commit, or configure
          check to skip on fix commits.


          SUCCESS (concrete pattern that worked):

          3. window.__testWs pattern: Storing WebSocket in window.__testWs via page.evaluate() and
