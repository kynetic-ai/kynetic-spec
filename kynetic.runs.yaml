  - _ulid: 01KJJH3K0KAH0JHTCZ698KTHW4
    status: completed
    current_step: 5
    initiated_by: "@claude"
    step_results:
      - status: completed
        step_index: 0
        started_at: 2026-02-28T16:25:32.948Z
        completed_at: 2026-02-28T16:25:57.522Z
        notes: >-
          What worked well:


          1. Backup-first approach — Creating kspec-meta-backup-2026-02-28 before any destructive
          operation saved us. We referenced it throughout to diagnose and extract correct state.

          2. Isolated worktree for rebase — /tmp/kspec-rebase-test let us experiment freely with
          zero consequences on failure.

          3. Incremental diagnosis — Methodically compared remote vs local vs current to identify
          exactly what was lost (12 task completions, notes) instead of blindly retrying.

          4. Patching instead of force-push — Applying corrected state as new commit avoided branch
          protection issues entirely.

          5. kspec session compact — Handled the 260MB session file perfectly. Having this
          infrastructure already built was critical.
      - status: completed
        step_index: 1
        started_at: 2026-02-28T16:25:57.522Z
        completed_at: 2026-02-28T16:26:12.702Z
        notes: >-
          Friction points:


          1. **Merge driver missing --non-interactive was a silent disaster** — No error, no
          warning, just hangs and leaves files unmerged. The driver should never hang regardless of
          how it's invoked. stdin TTY detection is basic defense-in-depth that was missing.


          2. **Exit code 1 from merge driver breaks git rebase** — In non-interactive mode, the
          driver auto-resolves conflicts but still exits 1, causing git to stop at every conflicted
          commit. Had to use "; true" hack to work around it. The spec (ac-10) already says exit 0
          but the code doesn't match.


          3. **kspec session compact can't target a different spec dir** — When working in a /tmp
          worktree, we couldn't run compact against it — it always reads from the project's .kspec.
          Had to rsync compacted sessions from the real .kspec instead.


          4. **Many stale active sessions accumulate silently** — 37 sessions were stuck in "active"
          status with no mechanism to detect or clean them up. The stale session criteria task
          exists but isn't implemented yet.


          5. **Worktree guard blocks legitimate operations** — git reset --soft in .kspec was
          blocked by the guard hook even though it was an intentional recovery operation. Had to run
          it manually outside the agent.


          6. **Notes array conflict picks one side instead of unioning** — The spec says notes never
          conflict (ac-5), but when both sides have different notes arrays, the merge driver treats
          it as a scalar conflict and picks ours. Lost 8 detailed notes from one task.
      - status: completed
        step_index: 2
        started_at: 2026-02-28T16:26:12.702Z
        completed_at: 2026-02-28T16:26:33.106Z
        notes: >-
          Coverage check:


          1. Merge driver --non-interactive + TTY detection + exit code + notes union — ALL covered
          by new task @01KJJGJ1, linked to spec @yaml-merge-driver. Spec ac-5 (notes union) and
          ac-10 (exit 0 in non-interactive) already describe correct behavior.


          2. Compact can't target different specDir — NOT TRACKED. Minor friction, workaround exists
          (rsync). Low priority.


          3. Stale session accumulation — TRACKED: task @implement-stale-session-candidate-criteria
          (pending), spec @session-stale-criteria. Full coverage.


          4. Worktree guard blocking legitimate ops — PARTIALLY TRACKED: spec
          @guard-script-and-diff-quality exists but doesn't cover escape hatch for intentional
          recovery. Could add an AC for --force or similar override.


          5. Notes conflict (picks one side) — TRACKED in @01KJJGJ1 item 3, and spec ac-5 already
          says correct behavior.


          Summary: Most friction already tracked. Only untracked item is compact specDir portability
          (low priority) and worktree guard escape hatch (minor).
      - status: completed
        step_index: 3
        started_at: 2026-02-28T16:26:33.106Z
        completed_at: 2026-02-28T16:26:42.082Z
        notes: >-
          Proposed improvements for untracked items:


          1. **Worktree guard escape hatch** (small) — Add a way for users to bypass the guard for
          intentional recovery operations. Could be an env var (KSPEC_GUARD_OVERRIDE=1) or a
          --force-dangerous flag on the guard command. The guard correctly blocks accidental
          destructive ops, but during recovery scenarios like we had today, it blocks the human too.


          2. **Compact portability** (small, low priority) — Allow kspec session compact to accept a
          --spec-dir flag to target a different .kspec directory. Useful when working in isolated
          worktrees. Workaround (rsync) is fine for now.


          Both are small scope. The guard escape hatch is more impactful since recovery scenarios
          are exactly when you need to do dangerous things intentionally.
      - status: completed
        step_index: 4
        started_at: 2026-02-28T16:26:42.082Z
        completed_at: 2026-02-28T16:29:12.058Z
        notes: >-
          User feedback:

          1. Guard escape hatch — approved, but use a deliberately long name like
          KSPEC_GUARD_OVERRIDE_DONT_USE to discourage agents from reaching for it when blocked. The
          point is humans-only for recovery.

          2. Compact portability — KSPEC_SPEC_DIR env var already exists for batch mode but isn't
          wired through to compact. Probably not worth a separate item, just a minor wiring fix.
          Skip capturing.
      - status: completed
        step_index: 5
