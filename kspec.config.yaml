dispatch:
  publication_mode: manual_merge
  base_branch: dev
  bootstrap:
    steps:
      - run: npm ci --ignore-scripts=false
        name: install-workspace-dependencies
        idempotent: true
        allow_tracked_changes: false
        reviewer_rerun_allowed: true
      - run: npm run build
        name: build-workspace-artifacts
        idempotent: true
        allow_tracked_changes: false
        reviewer_rerun_allowed: true
daemon:
  runtime: node
agent:
  skills:
    pr_review: "{skill:pr-review}"
coverage:
  scan_paths:
    - tests/
    - packages/web-ui/tests/e2e/
  exclude_patterns:
    - "tests/ac-annotation-validation.test.ts"
    - "tests/coverage-cache.test.ts"
    - "tests/coverage-scan-config.test.ts"
