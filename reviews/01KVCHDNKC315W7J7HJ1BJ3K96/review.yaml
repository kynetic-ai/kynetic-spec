threads:
  - _ulid: 01KVCJCHX963BD2875V5509SN1
    anchor:
      type: code
      commit: bfde105acd982fb9424afb538d18769e20e1d64e
      line_end: 588
      line_start: 565
      path: packages/daemon/src/routes/triage.ts
      side: head
    entries:
      - _ulid: 01KVCJCHX9ARWEZH7J5WG2RBXC
        author: Jacob Chapel
        body: "MUST-FIX: `executeTriageAction(record, ctx)` performs the promote/delete/spec-gap side
          effects before this route enters `runRouteMutation`; the pipeline `apply` only saves the
          triage record. That means the shared service is not actually performing the full apply ->
          commit -> cache -> broadcast sequence for triage act. If the later `saveTriageRecord`
          apply step, shadow commit, or write-through fails, task/inbox/meta mutations from
          `executeTriageAction` have already changed disk state outside the pipeline and can be left
          uncommitted and unrefreshed. This violates @shared-mutation-pipeline ac-1/ac-5/ac-6 and
          the task requirement to migrate triage act onto the shared pipeline. Move the full triage
          action plus record status update into the pipeline apply stage, with one commit and
          post-apply descriptors derived from the resulting mutation."
        created_at: 2026-06-18T05:13:45.129Z
    kind: blocker
  - _ulid: 01KVCJCMTMGK51W7SXQBN8T0ZJ
    anchor:
      type: code
      commit: bfde105acd982fb9424afb538d18769e20e1d64e
      line_end: 340
      line_start: 321
      path: packages/daemon/src/routes/review-resources.ts
      side: head
    entries:
      - _ulid: 01KVCJCMTM5T4KHVQN9P58ZHC4
        author: Jacob Chapel
        body: "MUST-FIX: review resource upload is not migrated onto the pipeline. `addReviewResource()`
          copies bytes, updates `resources.yaml`, and re-saves the review before `runRouteMutation`
          is called, then the pipeline receives `apply: () => undefined`. A failure in the later
          commit/cache/broadcast stages now reports after the resource mutation already happened
          outside the shared service, and the service cannot enforce or test the requested apply ->
          commit -> cache -> broadcast sequence for this route. The DELETE path has the same shape
          with `removeReviewResource()` before a no-op apply. Put the resource add/remove operation
          itself inside the pipeline apply callback and derive the commit/write-through/event
          descriptors from its result."
        created_at: 2026-06-18T05:13:48.116Z
    kind: blocker
  - _ulid: 01KVCJCQS810D3P5AV65X3V5MX
    anchor:
      type: code
      commit: bfde105acd982fb9424afb538d18769e20e1d64e
      line_end: 552
      line_start: 517
      path: packages/daemon/src/routes/plan-resources.ts
      side: head
    entries:
      - _ulid: 01KVCJCQS84BQJP2764Z0F5034
        author: Jacob Chapel
        body: "MUST-FIX: plan resource upload still performs material mutation work before the pipeline owns
          apply. The route renames uploaded bytes into the plan resource tree and may remove the
          previous file before calling `runRouteMutation`; the pipeline apply only writes the
          manifest. DELETE has the same issue at the file removal before its pipeline call. These
          file changes are part of the logical entity mutation, so a later
          manifest/commit/cache/broadcast failure can leave file state changed outside the shared
          service. This does not satisfy the task requirement that migrated entity routes call one
          shared apply -> shadow-commit -> cache-write-through -> broadcast pipeline. Move the file
          mutation and manifest update into the pipeline apply operation (or a helper called from
          it) so plan resources are migrated as a single operation."
        created_at: 2026-06-18T05:13:51.145Z
    kind: blocker
  - _ulid: 01KVCJCTMMMJXEHG9V7XZ1VFMC
    entries:
