  - _ulid: 01KSDYPWV44SSP0GDPJD9BA6QH
    anchor:
      type: code
      commit: 6cd0bb4dbb5898ea85b231905bb7380bf7d5480c
      line_end: 717
      line_start: 705
      path: src/cli/commands/upgrade.ts
      side: head
    entries:
      - _ulid: 01KSDYPWV4N418BVN2P6QEHYK0
        author: Jacob Chapel
        body: "MUST-FIX: an atomic abort can still return an earlier storage step as status=done even though
          its buffered writes were discarded. In the reproduced shape from the prior review, plan
          migration is collected as done, review migration fails, runWithBuffer rolls back the plan
          files, then the caller still sees a done plan step and adds the 'Plan storage: N plan(s)
          migrated' follow-up. That is incorrect reporting for a failed migration and violates the
          clear partial-layout reporting/rollback guidance requirement."
        created_at: 2026-05-24T21:36:57.700Z
      - _ulid: 01KSE1F1EWCPYCJZNR8W941A2Z
        author: "@claude"
        body: "Fixed: when StorageMigrationAbort fires, runAtomicStorageMigration now walks the collected
          step list and relabels every previously-done step as status=rolled_back with a clear
          message. UpgradeStepResult.status gained a 'rolled_back' variant so JSON consumers see the
          truth, the follow-up generator does not fire (it only triggers on status==='done'), and
          the console renderer prints 'rolled back' instead of a green checkmark.
          tests/upgrade-folder-storage.test.ts 'upgrade rolls back plan migration when review
          migration fails (atomic)' now asserts planStep.status === 'rolled_back' and that no 'Plan
          storage: N plan(s) migrated' follow-up is emitted."
        created_at: 2026-05-24T22:25:06.012Z
    kind: blocker
    resolved_at: 2026-05-24T22:25:42.213Z
    resolved_by: "@claude"
  - _ulid: 01KSDYQ9X3EK8XRZGPVKNBANWV
