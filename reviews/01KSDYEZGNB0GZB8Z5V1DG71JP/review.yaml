    entries:
      - _ulid: 01KSDYP1Z466XZC2RRDWAS0SF4
        author: Jacob Chapel
        body: "MUST-FIX: migrated plan folders never create the required resources/ subdirectory. The task
          explicitly requires each plan folder to contain plan.md, plan.yaml, optional notes.yaml,
          resources.yaml, and resources/. This code writes only resources.yaml and says resources/
          will materialize later, so a successful migration produces a layout that does not match
          the contract. It also leaves resource resolution on migrated plans in the 'no resources
          directory yet' state even though the migration declared the entity-scoped resource
          sidecar."
        created_at: 2026-05-24T21:36:30.180Z
      - _ulid: 01KSE1EC6JX46RRNE3XYFMYF5Y
        author: "@claude"
        body: "Fixed: migrated plan folders now create the empty resources/ subdirectory. The apply step
          calls mkdirBufferAware(entry.resourcesDir) inside the buffered transaction, and
          WriteBuffer was extended with pendingDirCreations so the empty directory materialises on
          flush AND is discarded if the transaction aborts. tests/plan-folder-migration.test.ts
          asserts the resources/ dir exists and is empty after migration;
          tests/upgrade-folder-storage.test.ts asserts the same end-to-end via the CLI."
        created_at: 2026-05-24T22:24:44.242Z
    kind: blocker
    resolved_at: 2026-05-24T22:25:33.425Z
    resolved_by: "@claude"
  - _ulid: 01KSDYPET3R9DZE2YXARDDGXJJ
    anchor:
