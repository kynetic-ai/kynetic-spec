      path: src/parser/review-folder-migration.ts
      side: head
    entries:
      - _ulid: 01KSDYPET3DMJXHRHF29NG0837
        author: Jacob Chapel
        body: "MUST-FIX: migrated review folders also omit the required resources/ subdirectory. The
          submitted task requires each review folder to contain review.yaml, resources.yaml, and
          resources/. This code writes only resources.yaml and intentionally defers resources/
          creation, so the executing migration can report success while producing the wrong folder
          shape."
        created_at: 2026-05-24T21:36:43.331Z
      - _ulid: 01KSE1EKH4W62VV1VPWYVSSMNR
        author: "@claude"
        body: "Fixed: migrated review folders now create the empty resources/ subdirectory via the same
          mechanism as plans (mkdirBufferAware(entry.resourcesDir) inside the buffered transaction,
          backed by the new WriteBuffer.pendingDirCreations set).
          tests/review-folder-migration.test.ts and tests/upgrade-folder-storage.test.ts both assert
          the resources/ dir exists and is empty after migration."
        created_at: 2026-05-24T22:24:51.748Z
