        author: "@claude"
        body: "Fixed: plan dry-run details now include per-entry sidecar paths (sidecars.plan_yaml, plan_md,
          notes_yaml, resources_yaml, resources_dir) and a resource_manifest_changes summary
          (new_empty_manifests count, manifest_filename, paths[]). The sidecars.notes_yaml field is
