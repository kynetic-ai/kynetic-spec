    entries:
      - _ulid: 01KKYQNFR1B99DBH1NFQ4PXETN
        author: Jacob Chapel
        body: " treats every object absent from the raw YAML as a discardable default. Because  uses that
          helper for new keys, any real nested object added to a legacy record is silently dropped.
          I reproduced this with a legacy workspace missing : mutating the record to set adopted
          provenance completed successfully, but the file still had no  block afterward. This breaks
          legitimate upgrades of pre-migration records and means meaningful nested state cannot be
          persisted once the field was absent originally."
        created_at: 2026-03-17T20:26:45.889Z
      - _ulid: 01KKYQP9W4CA9KG49MAENTPRNW
        author: Jacob Chapel
        body: "Repro details: I wrote a legacy workspace without branch_provenance, then mutated that record
          to set adopted provenance with ownership=adopted, source=manual, remote_ref=origin/feat/x,
          and adopted_from=feat/x. The mutation returned success, but the YAML still had no
          branch_provenance block afterward. The helper currently drops any newly-added
          object-valued field, even when it carries real data, so meaningful nested state cannot be
          persisted on legacy records."
        created_at: 2026-03-17T20:27:12.644Z
    kind: blocker
