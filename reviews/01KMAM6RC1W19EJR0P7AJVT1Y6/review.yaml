    entries:
      - _ulid: 01KMAMDWZNGF2QHQ7C4QC75Z8W
        author: Test User
        body: "`requestClose()` does not prevent a prompt that has already been dequeued from starting
          another turn. After idle waiting resolves, the loop only breaks on `nextPrompt === null`;
          it never re-checks `closeRequested` before assigning `currentPromptText = nextPrompt`. In
          the race where one source enqueues a follow-up prompt and another immediately closes the
          session, the queued prompt still runs as an extra turn before the close is honored.
          Impact: shutdown/close requests can execute additional agent work after the session was
          asked to stop, which violates the close contract and defeats the intended prompt discard
          behavior."
        created_at: 2026-03-22T11:21:04.757Z
    kind: blocker
