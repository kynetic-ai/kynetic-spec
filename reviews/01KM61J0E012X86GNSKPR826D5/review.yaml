    entries:
      - _ulid: 01KM61SYD9JQH6AVE19PD47E23
        author: Jacob Chapel
        body: "This formatter reads the invalid value from issue.input, but Zod v3 enum issues expose it as
          issue.received instead. The result is warnings like automation=undefined even when the bad
          YAML value was 'ineligible', so the new read-side warning still fails to identify the
          field/value that broke validation. That violates the task's own guidance requirement and
          makes the warning materially less useful for repair. Repro: z.object({ automation:
          z.enum(['eligible','needs_review','manual_only']) }).safeParse({ automation: 'ineligible'
          }) returns an issue with received='ineligible', and the full test suite emitted that exact
          automation=undefined warning."
        created_at: 2026-03-20T16:38:38.761Z
      - _ulid: 01KM62N1N6YDM90NYKEMWKF2XZ
        author: Jacob Chapel
        body: "Fixed in commit 4a87401ef: read-side warnings now prefer Zod issue.input and fall back to
          issue.received, so invalid enum values like automation='ineligible' are reported instead
          of undefined. Added a regression test covering the enum issue shape."
        created_at: 2026-03-20T16:53:26.822Z
    kind: blocker
    resolved_at: 2026-03-20T16:53:29.122Z
    resolved_by: Jacob Chapel
