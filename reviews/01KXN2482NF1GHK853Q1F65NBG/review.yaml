    entries:
      - _ulid: 01KXN365RJZ4DXXRJSFF2TAARZ
        author: Jacob Chapel
        body: "MUST-FIX: Engine initialization is published as ready before startup settles.
          ensureDispatchEngine stores the new engine in engines, and a concurrent caller immediately
          receives it via the existing fast path without awaiting engine.start or the
          schedule/hook/join startup chain. In a deterministic real-shadow probe, the first
          canonical start was held inside DispatchEngine.start; a second POST
          /api/agent/dispatch/control returned HTTP 200 with outcome=applied while
          engine.getStatus().running was false. When the held startup was then forced to fail, the
          first request returned 500, the engine map was empty, but committed global authority
          remained running. Thus one request reports success for an engine whose startup later
          fails, violating the canonical success/failure and cold-start rollback guarantees; stop or
          task controls can race the same unready object, and all three canonical/unified/start
          aliases share this helper. Make initialization single-flight per project (concurrent
          callers must await the same readiness result, including rollback on failure) and add a
          behavioral concurrent-start/failure regression."
        created_at: 2026-07-16T09:12:40.978Z
    kind: blocker
