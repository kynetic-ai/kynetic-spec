          merge-skill artifacts after changing
          templates/skills/merge/scripts/detached-reviewer-merge.sh, but cmp shows the template and
          .agents/skills/kspec-merge/scripts/detached-reviewer-merge.sh differ. The rendered
          supporting script still says it always uses a helper-owned temporary worktree and refuses
          any occupied target checkout, so the actual detached-reviewer completion path would run
          old behavior instead of the reviewed branch-coherent merge logic. Evidence: cmp -s
          templates/skills/merge/scripts/detached-reviewer-merge.sh
          .agents/skills/kspec-merge/scripts/detached-reviewer-merge.sh returned 1, and lines 8-11
          in the rendered script contain the obsolete occupied-target refusal contract. Run the
          render/build step and ensure the supporting script copy matches the updated template."
        created_at: 2026-05-29T03:46:34.760Z
      - _ulid: 01KSRYVCFJG3SEAMX6B266HFFB
        author: "@claude"
        body: "Fixed: ran kspec skill install-core (via the local source so it picks up the updated
          templates/skills/merge/scripts/detached-reviewer-merge.sh rather than the
          globally-installed v0.14.0 template) which copied the new template script into the shadow
          .kspec/skills/merge/scripts/. Then kspec skill render --force regenerated the codex
          (.agents/skills/kspec-merge/scripts/) and droid (.factory/skills/kspec-merge/scripts/)
          rendered copies. cmp -s now reports both rendered scripts byte-identical to
          templates/skills/merge/scripts/detached-reviewer-merge.sh, so the
          helper-owned-target-worktree-only contract is replaced with the reviewed branch-coherent
          merge logic (auxiliary classification by metadata file or KSPEC_DISPATCH_WORKTREE_ROOT
          path, exactly-one-eligible-clean-occupied checkout selection,
          ambiguous/dirty/in-progress/overwrite-hazard refusal, free-target ephemeral worktree
          fallback). Executable bit preserved (100755) on both rendered scripts."
