        author: Jacob Chapel
        body: "MUST-FIX: the submitted ACs are not covered by machine-linked behavioral tests. The spec now
          includes @agent-dispatch-engine ac-reconcile-non-overlap and
          ac-stop-awaits-reconciliation, but  finds no test annotations for either ID. The only new
          test here is annotated as ac-19/ac-20, and it covers non-overlap indirectly while never
          exercising the stop guarantee: it calls  before , so stop is not proven to wait while
          reconciliation is still blocked. Add/retag behavioral tests for ac-reconcile-non-overlap
          and ac-stop-awaits-reconciliation; the stop test should call stop while the reconcile
          promise is still unresolved and assert stop does not resolve until the pass is released."
        created_at: 2026-05-19T00:04:08.636Z
      - _ulid: 01KRYRSDQ5NC5KDKKQCH8EXXP7
        author: Jacob Chapel
        body: "Correction to the evidence text: git grep for ac-reconcile-non-overlap and
          ac-stop-awaits-reconciliation returns no matches in tests or src. The new test calls
          releaseReconcile before await engine.stop, so it does not prove stop waits while a
          reconciliation promise is still unresolved."
        created_at: 2026-05-19T00:04:52.581Z
      - _ulid: 01KRYX68NE0ZBY8559F8SK2B8R
        author: "@claude"
        body: "Fixed in commit b83adf6c8c. Retagged the non-overlap test with ac-reconcile-non-overlap.
          Added a new ac-stop-awaits-reconciliation test that calls engine.stop() while the
          reconcile gate is still held, drains microtasks plus 100ms of fake timers, asserts stop
          has NOT resolved, then releases the gate and asserts stop resolves AND the reconcile body
          finished before stop returned. Both AC ids now have machine-linked behavioral coverage.
          Focused suite: 135/135 pass. Full npm test: 9280/9280 pass (cli-no-daemon failure was
          unrelated to this task and is already fixed on dev via 08b8716238)."
        created_at: 2026-05-19T01:21:47.693Z
