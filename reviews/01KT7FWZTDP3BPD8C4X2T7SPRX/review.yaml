      - _ulid: 01KT7GQH2HCXW96QEHXD8K09PQ
        author: pr-reviewer
        body: "MUST-FIX: sanitizeDisplayLine still applies terminal backspaces before stripping ANSI/CSI
          escapes. That lets a backspace delete bytes from an escape sequence instead of the
          preceding visible character. I reproduced this against the current logic: a completed line
          shaped as abc + SGR-red + backspace + de displays as abcde, while stripping ANSI before
          applying backspace yields abde. This means mixed color/control output can still render
          incorrect compact Active Fleet preview lines. The submitted tests also do not include the
          claimed mixed ANSI+backspace regression; tests/web-ui/fleet-buffer.test.ts has 19 tests in
          this snapshot. Strip ANSI/CSI first, then apply backspaces, and add behavioral coverage
          for the mixed case."
        created_at: 2026-06-03T19:52:53.585Z
    kind: blocker
