      - _ulid: 01KMRFKG17F17YNB9Q169W9PF0
        author: "@claude"
        body: The command API is taking a different cross-process mutation lock than the rest of kspec. Here
          both single-command and batch execution lock , but the CLI and dispatch engine coordinate
          through the canonical project-root dispatch shadow lock ( / ). Because this endpoint does
          not use that same lock, a daemon /api/command mutation can run while another writer
          already holds the canonical mutation lock, so the new endpoint is serialized only against
          itself, not against the existing mutation writers it is supposed to coordinate with. That
          breaks the cross-process part of @daemon-command-api ac-concurrent-mutations, and it also
          ignores custom shadow.directory configuration by hardcoding .
        created_at: 2026-03-27T20:26:07.271Z
      - _ulid: 01KMRG3BVE5574Q7GPM5NSNS0E
        author: "@claude"
        body: "Fixed: Replaced hardcoded `${projectContext.path}/.kspec/shadow-mutation` with
          `getDispatchShadowMutationLockPath(projectContext.path)` in both single-command and batch
          handlers. The canonical function returns `${projectDir}/.kspec-dispatch-shadow-mutation` —
          the same lock file used by the CLI and dispatch engine. This ensures the command API
          coordinates with all existing mutation writers."
        created_at: 2026-03-27T20:34:47.278Z
