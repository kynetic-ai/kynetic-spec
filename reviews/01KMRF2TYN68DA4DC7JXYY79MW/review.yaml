    entries:
      - _ulid: 01KMRFM4EJB0QRRM6QQTDRAD14
        author: "@claude"
        body: The command API is taking a different cross-process mutation lock than the rest of kspec. Here
          both single-command and batch execution lock
          `${projectContext.path}/.kspec/shadow-mutation`, but the CLI and dispatch engine
          coordinate through the canonical project-root dispatch shadow lock
          (`KSPEC_SHADOW_MUTATION_LOCK_FILE` / `getDispatchShadowMutationLockPath(projectDir)`).
          Because this endpoint does not use that same lock, a daemon /api/command mutation can run
          while another writer already holds the canonical mutation lock, so the new endpoint is
          serialized only against itself, not against the existing mutation writers it is supposed
          to coordinate with. That breaks the cross-process part of @daemon-command-api
          ac-concurrent-mutations, and it also ignores custom shadow.directory configuration by
          hardcoding `.kspec`.
        created_at: 2026-03-27T20:26:28.178Z
      - _ulid: 01KMRG3Q97GBKQKN4N7XRBGZ0N
        author: "@claude"
        body: "Fixed: Same change as thread above — both single-command (line 329) and batch (line 450)
          handlers now use `getDispatchShadowMutationLockPath()` from `agent-runtime/workspace.ts`
          instead of the hardcoded `.kspec/shadow-mutation` path. This also respects any custom
          shadow.directory configuration since the canonical function resolves the path at project
          root, not inside the shadow worktree."
        created_at: 2026-03-27T20:34:58.983Z
