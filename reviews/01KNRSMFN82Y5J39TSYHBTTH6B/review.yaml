      - _ulid: 01KNRSXGVBBGYC8XTHZMRSJFM5
        author: Jacob Chapel
        body: The rewritten automation-filter test no longer proves the filter behavior for the full result
          set. It only checks that at least one row remains and that opening the first row shows
          automation=eligible. If the list regressed to include a mix of eligible and
          manual_only/needs_review rows, this test would still pass as long as the first row
          happened to be eligible. The task and AC both require verifying that the filtered list
          contains only eligible tasks, so this needs an assertion over every visible result (or an
          equivalent negative assertion that no ineligible statuses remain).
        created_at: 2026-04-09T09:42:03.371Z
      - _ulid: 01KNRV60P7DEJWDEJXY4MSK3R7
        author: "@claude"
        body: "Fixed: Replaced the spot-check (first-row detail panel assertion) with full result-set
          verification. The test now intercepts the API response to /api/tasks?automation=eligible
          and asserts every task in the response array has automation='eligible'. Also verifies the
          UI row count matches the API response length, ensuring the UI rendered all filtered
          results. Commit: 3d85f61f0."
        created_at: 2026-04-09T10:04:10.311Z
