  - _ulid: 01KKZT1QCZ136ZR7RPK64RSJTA
    anchor:
      type: structured
      field: ac-transient-fetch-failure
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KKZT1QCZS7ZXRZ6G07QSCSRK
        author: "@claude"
        body: "Missing edge case: What happens when the remote is configured but requires authentication
          that has expired or is missing? The current ACs cover 'no remote' (ac-no-remote) and
          'transient fetch failure' (ac-transient-fetch-failure), but an auth failure is neither
          transient nor 'no remote' — it's a persistent, recoverable-by-operator failure mode.
          Should it be classified as transient (retried, eventually escalated) or should it trigger
          degraded state? The plan description says 'transient error (network unreachable, DNS
          failure, connection timeout)' which doesn't cover auth failures. Consider either: (1)
          adding an AC for auth/permission failures, or (2) explicitly stating in the description
          that auth failures are classified as transient failures for the purposes of the
          retry/escalation logic."
        created_at: 2026-03-18T06:27:38.527Z
      - _ulid: 01KKZV58XEFGZEXA12MXEWQTAV
        author: "@claude"
        body: Auth failures are classified as transient (same as network errors). The
          ac-repeated-transient-escalation AC covers the case where auth failures persist — the
          escalated warning signals the operator. No special auth handling needed.
        created_at: 2026-03-18T06:47:03.339Z
    kind: question
    resolved_at: 2026-03-18T06:47:05.977Z
    resolved_by: "@claude"
  - _ulid: 01KKZT23FWWWJZRZB0GM3QFJZK
    anchor:
      type: structured
      field: ac-pull-target-before-provision
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KKZT23FW0ZZPSTAPTE0KEV0Z
        author: "@claude"
        body: "Missing interaction: ac-pull-target-periodic says sync is deferred when a reviewer invocation
          is active, but there is no AC for what happens when a reviewer is active AND the target is
          stale AND a new workspace is about to be provisioned (ac-pull-target-before-provision).
          Does the before-provision sync also defer if a reviewer is active? The before-provision AC
          has no reviewer-active guard, which could mean it syncs the target branch while a reviewer
          is mid-merge — potentially causing the reviewer's merge to conflict with a concurrently
          updated target. Clarify the interaction between reviewer-active guards and the
          before-provision sync."
        created_at: 2026-03-18T06:27:50.908Z
      - _ulid: 01KKZV5ECK4MQHSE1N1K5W609Y
        author: "@claude"
        body: "Clarified in implementation notes: before-provision sync checks lastSyncTimestamp staleness,
          NOT reviewer activity. Safe because provision creates a new worktree from HEAD, not
          interfering with reviewer merge. Periodic sync skips during reviewer to avoid moving
          target mid-merge."
        created_at: 2026-03-18T06:47:08.947Z
    kind: question
    resolved_at: 2026-03-18T06:47:11.539Z
    resolved_by: "@claude"
  - _ulid: 01KKZT2EQRTQR2MNF6J08DENZN
    anchor:
      type: structured
      field: ac-push-target-periodic
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KKZT2EQRE1JTSAPGKV8XEW1P
        author: "@claude"
        body: ac-push-target-periodic's given clause says 'the local integration target branch is ahead of
          its remote tracking ref (has unpushed merge commits)' — but this check (isAheadOfUpstream)
          itself requires a fetch to have current remote ref info. The AC doesn't specify whether
          the periodic sync does fetch-then-check-ahead-then-push or just checks local ref state. If
          it only checks local refs without fetching first, it might attempt a push when remote has
          advanced (e.g., another developer pushed to the target), which would fail. The fetch is
          covered by ac-pull-target-periodic for the pull side, but the ordering dependency (fetch
          first, then check ahead, then push) is implicit. Consider making this explicit or noting
          that the push happens after the periodic fetch.
        created_at: 2026-03-18T06:28:02.424Z
      - _ulid: 01KKZV5KMKQNPM6T7E53T8CY0R
        author: "@claude"
        body: Simplified given clause to 'has commits not yet on the remote' — removed the parenthetical
          implementation detail.
        created_at: 2026-03-18T06:47:14.323Z
    kind: nit
    resolved_at: 2026-03-18T06:47:16.959Z
    resolved_by: "@claude"
