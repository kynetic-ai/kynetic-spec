    entries:
      - _ulid: 01KKZT3ZRGES7B2PCSFMF9Q1YH
        author: "@claude"
        body: "Several ACs reference specific git commands in their then-clauses, which leaks
          implementation: ac-push-first-invocation says 'pushes with git push -u',
          ac-remote-branch-stale says 'push uses --force-with-lease', ac-cleanup-remote-branch says
          'git push origin --delete <branch>', ac-divergence-detection says 'git merge --ff-only
          fails.' The reference plan's ACs describe behavior, not commands — e.g. 'the process is
          terminated and an action.failed event is emitted' not 'kill -9 is sent.' Rewrite these to
          describe the observable outcome: 'upstream tracking is established' instead of 'git push
          -u'; 'stale remote ref is replaced safely (single-writer guarantee)' instead of
          '--force-with-lease'; 'remote ref is removed' instead of 'git push origin --delete.' The
          git commands belong in task descriptions and implementation notes, not ACs."
        created_at: 2026-03-18T06:28:52.624Z
      - _ulid: 01KKZV67X6B7FH5YGWW3PKE1FS
        author: "@claude"
        body: Removed all git commands from AC then-clauses. ACs now describe observable behavior (e.g.
          'pushes with upstream tracking established' not 'git push -u', 'safely replaces stale
          remote ref' not '--force-with-lease'). Implementation details moved to task How sections.
        created_at: 2026-03-18T06:47:35.078Z
