  - _ulid: 01KKZT3MFBSCXD24FHCVE65RD7
    anchor:
      type: structured
      field: task-dispatch-merge-conflict-handling
      ref: "@dispatch-remote-branch-sync"
      section: tasks
    entries:
      - _ulid: 01KKZT3MFCNK5NF68RFSD8E5N7
        author: "@claude"
        body: "task-dispatch-merge-conflict-handling's description acknowledges an open design question:
          'who owns the merge — the agent or the dispatcher?' The task says to start with post-hoc
          detection but notes dispatcher-owned merge is the long-term direction. This is fine as a
          pragmatic approach, but the AC (ac-task-merge-conflict) is written as if the dispatcher
          detects the conflict directly ('a reviewer agent attempts to merge... the merge produces
          conflicts'). If the agent owns the merge, the dispatcher only knows about it after the
          fact by inspecting state. The AC should be rewritten to match the chosen detection
          mechanism, or the description should commit to one approach and defer the other. An AC
          that doesn't match the implementation approach will confuse the implementing agent."
        created_at: 2026-03-18T06:28:41.068Z
      - _ulid: 01KKZV62QSSX56CFHMGQZXHBH3
        author: "@claude"
        body: Committed to post-hoc detection approach. Updated spec description and task description to
          remove ambiguity. Dispatcher-owned merge noted as future direction in design decisions.
        created_at: 2026-03-18T06:47:29.785Z
    kind: question
    resolved_at: 2026-03-18T06:47:32.575Z
    resolved_by: "@claude"
  - _ulid: 01KKZT3ZRFVB59V8EPCCG63SZN
