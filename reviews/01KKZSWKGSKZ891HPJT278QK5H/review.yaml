threads:
  - _ulid: 01KKZSYZV5J3W4D118AS03YDME
    anchor:
      type: structured
      field: ac-divergence-detection
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KKZSYZV66A39WW82D2950NHK
        author: "@claude"
        body: "ac-divergence-detection bundles two distinct behaviors in one AC: (1) detecting that ff-only
          merge fails and entering degraded state, and (2) producing a log message that
          distinguishes between 'local has unpushed merges' vs 'remote was force-pushed.' These are
          independently testable: one test for the degraded state transition, another for the log
          message classification. Split into ac-divergence-enters-degraded (ff-only fails → degraded
          state, no merge created) and ac-divergence-diagnosis (degraded log message distinguishes
          local-ahead vs remote-force-pushed). Compare: the reference plan's
          @dispatch-event-envelope ac-5 tests one thing — cycle detection rejection — not cycle
          detection plus different log message formats."
        created_at: 2026-03-18T06:26:08.870Z
      - _ulid: 01KKZV01K7Y29VS1D52KPZMD69
        author: "@claude"
        body: Split into ac-divergence-enters-degraded (state transition) and ac-divergence-log-guidance
          (log message classification). Each is independently testable.
        created_at: 2026-03-18T06:44:12.007Z
    kind: blocker
    resolved_at: 2026-03-18T06:44:14.599Z
    resolved_by: "@claude"
  - _ulid: 01KKZSZAQG5FP9VP15B6FQRMYC
    anchor:
      type: structured
      field: ac-degraded-status
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KKZSZAQG2V1QPJXM6NBCGEKT
        author: "@claude"
        body: "ac-degraded-status bundles three observation surfaces and a display concern into one AC: (1)
          CLI output, (2) REST API response, (3) WebSocket broadcast, and (4) CLI display formatting
          with resolution steps. Each surface could independently regress and deserves its own test.
          The reference plan keeps each output surface as a separate AC — e.g.
          @dispatch-event-payload has per-domain ACs (ac-1 through ac-5), each testing one payload
          shape. Split into: ac-degraded-status-api (REST response includes degraded
          flag/reason/timestamp), ac-degraded-status-cli (CLI shows warning with resolution steps),
          ac-degraded-status-ws (WebSocket broadcast includes degraded state)."
        created_at: 2026-03-18T06:26:20.016Z
      - _ulid: 01KKZV0NQCXTTTWN3K7A95NC6D
        author: "@claude"
        body: Split into ac-degraded-status-api (CLI/API query response) and ac-degraded-status-broadcast
          (WebSocket state transition events). Display formatting removed from ACs.
        created_at: 2026-03-18T06:44:32.620Z
    kind: blocker
    resolved_at: 2026-03-18T06:44:35.206Z
    resolved_by: "@claude"
  - _ulid: 01KKZSZPY4HKP15905ENDD6E51
    anchor:
      type: structured
      field: ac-degraded-auto-recover
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KKZSZPY4PTFT77YZ0MR4F99X
        author: "@claude"
        body: "ac-degraded-auto-recover packs four assertions into the then-clause: (1) exits degraded
          state, (2) logs recovery, (3) broadcasts recovery event on WebSocket, and (4) resumes
          dispatch including draining queued tasks. These are distinct behaviors. Recovery logging
          and WebSocket broadcast are independently testable from the state transition and queue
          drain. Split into at least: ac-degraded-recovery (sync succeeds → exits degraded state,
          resumes provisioning), ac-degraded-recovery-drain (queued tasks are dispatched after
          recovery), ac-degraded-recovery-broadcast (recovery event broadcast on agents topic). The
          log assertion can fold into the recovery AC as a natural side-effect."
        created_at: 2026-03-18T06:26:32.516Z
      - _ulid: 01KKZV0TYFEYG34S596CXHYW72
        author: "@claude"
        body: Split into ac-degraded-auto-recover (exit degraded + resume dispatch) and
          ac-degraded-recovery-logged (log recovery with duration). Broadcast covered by
          ac-degraded-status-broadcast. Queue drain is part of 'resume normal dispatch operations.'
        created_at: 2026-03-18T06:44:37.967Z
    kind: blocker
    resolved_at: 2026-03-18T06:44:40.759Z
    resolved_by: "@claude"
  - _ulid: 01KKZT03TJ9A868GW1W7950BAW
    anchor:
      type: structured
      field: ac-repeated-transient-failures
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KKZT03TJTTPYR3DR4RB4H7Y1
        author: "@claude"
        body: "ac-repeated-transient-failures has a dense then-clause: (1) escalated warning logged, (2)
          warning is distinct from per-failure warning, (3) includes failure count and duration, (4)
          engine does NOT enter degraded state, (5) operator signal about durability guarantees.
          Items 1-3 can stay together (they describe one log message's content). But the 'does not
          enter degraded state' assertion is a separate behavioral guarantee — it should be its own
          AC or merged into ac-transient-fetch-failure with a clause like 'transient failures never
          trigger degraded state regardless of count.' The conceptual split:
          ac-repeated-transient-escalation (escalated warning with count/duration after N
          consecutive failures) and fold the 'no degraded state' guarantee into
          ac-transient-fetch-failure's then-clause."
        created_at: 2026-03-18T06:26:45.714Z
      - _ulid: 01KKZV10BBF8220QKNPJXYMHJ2
        author: "@claude"
        body: Split into ac-repeated-transient-escalation (escalated warning with count/duration) and
          ac-repeated-transient-no-degrade (no degraded state for transient failures). Each
          independently testable.
        created_at: 2026-03-18T06:44:43.499Z
    kind: blocker
    resolved_at: 2026-03-18T06:44:46.069Z
    resolved_by: "@claude"
  - _ulid: 01KKZT0EAYZ9HK62N4693BR9JJ
    anchor:
      type: structured
      field: ac-task-merge-conflict
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KKZT0EB26JHDFCBD54QS9Y5K
        author: "@claude"
        body: "ac-task-merge-conflict bundles four actions: (1) task blocked with reason listing conflicting
          files, (2) dispatch branch pushed to remote, (3) engine continues dispatching, (4) engine
          does NOT enter degraded state. These are orthogonal behaviors. The push-on-conflict
          behavior is a durability concern independent of the blocking behavior. The 'no degraded
          state' is a negative assertion about engine scope. Split into:
          ac-merge-conflict-blocks-task (conflict → task blocked with file list and branch names),
          ac-merge-conflict-push (conflict → branch pushed for human access),
          ac-merge-conflict-engine-continues (engine continues without degraded state). The
          reference plan keeps action-scope and engine-scope effects in separate ACs — see
          @dispatch-action-model ac-9 (failure isolation) vs individual action ACs."
        created_at: 2026-03-18T06:26:56.482Z
      - _ulid: 01KKZV15BAGHCFM4PGX35VKPMJ
        author: "@claude"
        body: Split into ac-merge-conflict-blocks-task (block with reason), ac-merge-conflict-pushes-branch
          (push to remote), ac-merge-conflict-engine-continues (engine not degraded). Three
          independent assertions.
        created_at: 2026-03-18T06:44:48.617Z
    kind: blocker
    resolved_at: 2026-03-18T06:44:51.087Z
    resolved_by: "@claude"
  - _ulid: 01KKZT0RHJB35N3XNZF9SHX0WD
    anchor:
      type: structured
      field: ac-remote-branch-stale
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KKZT0RHJKDN83WNNPQ4JQE5A
        author: "@claude"
        body: "ac-remote-branch-stale bundles the initial push behavior with a subsequent-push constraint:
          (1) first push uses --force-with-lease, (2) subsequent pushes use normal push. These two
          behaviors have different test setups (stale remote ref present vs normal tracking). Split
          into: ac-stale-remote-ref-overwrite (stale remote branch exists → initial push uses
          --force-with-lease, succeeds) and modify ac-push-after-invocation's given to clarify it
          covers the normal (non-force) push case. This keeps the 'why force-with-lease is safe
          (single-writer)' rationale in the stale-ref AC where it belongs."
        created_at: 2026-03-18T06:27:06.930Z
      - _ulid: 01KKZV1A7AY9NSZMF8SK3HYHXQ
        author: "@claude"
        body: "Split into ac-first-push-sets-tracking (establishes upstream) and
          ac-first-push-replaces-stale-ref (safely replaces stale remote ref). Subsequent push
          behavior is its own AC: ac-subsequent-push."
        created_at: 2026-03-18T06:44:53.609Z
    kind: blocker
    resolved_at: 2026-03-18T06:44:56.369Z
    resolved_by: "@claude"
  - _ulid: 01KKZT12ZNFM0GQYG2ZVZREAB7
    anchor:
      type: structured
      field: ac-integration-push-serialization
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KKZT12ZNETAQG8BZTJA30PCS
        author: "@claude"
        body: ac-integration-push-serialization's then-clause describes both the serialization mechanism AND
          the skip-if-in-flight optimization. The skip behavior is a distinct optimization on top of
          serialization. A pure serialization AC would just say 'at most one push runs at a time;
          the second waits.' The skip-if-in-flight is an additional behavior (the second operation
          skips because the in-flight push delivers same-or-newer state). These could be one AC if
          the skip semantics are considered intrinsic to the serialization design, but if you want
          to test serialization independently from the skip optimization, split them.
        created_at: 2026-03-18T06:27:17.621Z
      - _ulid: 01KKZV5178RR1R870SNAQJPXKR
        author: "@claude"
        body: "Renamed to ac-target-push-serialization. Simplified to one behavior: second operation skips.
          No ambiguity."
        created_at: 2026-03-18T06:46:55.464Z
    kind: question
    resolved_at: 2026-03-18T06:46:58.101Z
    resolved_by: "@claude"
