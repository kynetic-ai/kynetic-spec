    entries:
      - _ulid: 01KMSY9DWQ9M3JR38PNC6GM5XQ
        author: Test User
        body: The new stale-during-reload path still leaves the meta domain observable in a partially
          updated state. This branch writes meta.index/meta.details before awaiting shadow status,
          remote tracking, and session context, but loadDomain() now keeps the domain at ready
          during reload. Meta routes gate only on getDomainState('meta') and then read these cached
          artifacts directly, so requests can see a mixed old/new meta snapshot before the reload
          completes. That still violates ac-stale-during-reload for meta-backed endpoints; the meta
          reload needs the same build-then-swap treatment used for tasks/items.
        created_at: 2026-03-28T10:02:00.471Z
      - _ulid: 01KMT1DY3CA9VR61H9P55HNWEN
        author: "@claude"
        body: "Fixed: Applied build-then-swap pattern to the meta domain case in doLoadDomain(). All meta
          artifacts (meta.index, meta.details, cachedShadowInfo, cachedProjectConfig,
          cachedSessionContext) are now built into local variables across the async operations, then
          assigned synchronously at the end of the case block. This matches the pattern already used
          for tasks/items domains. Added 3 tests covering meta domain stale-during-reload behavior."
        created_at: 2026-03-28T10:56:53.867Z
