    entries:
      - _ulid: 01KTTTW73GS32E0T4XVHKA9AX3
        author: "@claude"
        body: "Canonical-at-write-time contradicts the implemented @config-author spec without
          acknowledgment. @config-author ac-3 (implemented) specifies author falls back to git
          user.name then OS user when no env var or config author is set — a free-form variant by
          this decision's definition — while ac-1 here asserts new records are 'never a free-form
          variant' through any interface. The plan resolved the parallel N/A-semantics conflict
          (@ac-coverage-applicability vs the implemented validate exemption path) with an explicit
          transition boundary naming the owning work; do the same here: acknowledge that
          @config-author's fallback chain is superseded or normalized by the canonical-write
          identity layer (UI foundations plan per the Consumers table), so the two specs don't sit
          in the corpus as an unexplained contradiction."
        created_at: 2026-06-11T07:55:47.184Z
    kind: question
  - _ulid: 01KTTTWNNQHWXDMASMKXZCME0Y
    anchor:
      type: structured
      field: ac-1
      ref: "@coverage-state-presentation"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTTWNNQ8ZHDK7W8JBXCHNDK
        author: "@claude"
        body: "'Exactly the four presentation buckets appear' is ambiguous under a literal reading: a
          surface whose visible items are all covered would render only one bucket, falsifying
          'exactly the four ... appear'. The intent is a vocabulary constraint, not a visibility
          requirement. Suggest restating the Then as: 'every rendered coverage state is one of the
          four presentation buckets (covered, failing, not yet, re-verify), and the
          stale-versus-drifted distinction is available only as cause detail' — so a covering test
          asserts membership of the rendered vocabulary, not presence of all four buckets."
        created_at: 2026-06-11T07:56:02.103Z
    kind: question
  - _ulid: 01KTTTX2HQJNPYGVMYCE9943VV
    anchor:
      type: structured
      field: ac-2
      ref: "@ac-coverage-applicability"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTTX2HQVD3HY6MV2PJ024G5
        author: "@claude"
        body: "Residual phrasing from the round-1 fix: the When clause 'corpus coverage is computed by the
          coverage engine this program introduces' is deictic — once derived into the corpus, 'this
          program' has no referent on the standalone item. The scoping itself is correct and was the
          requested fix; suggest a self-contained subject (e.g. 'the corpus coverage engine' or a
          named engine) in the AC, keeping the program/transition context in the description where
          it already lives."
        created_at: 2026-06-11T07:56:15.287Z
    kind: nit
