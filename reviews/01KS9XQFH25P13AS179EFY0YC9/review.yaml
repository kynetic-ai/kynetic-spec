    entries:
      - _ulid: 01KS9YH11427WW1JKSTSA83R5W
        author: Jacob Chapel
        body: 'MUST-FIX: The submitted tests do not cover @trait-entity-scoped-local-resources-1
          ac-resource-delete-follows-owner-delete. Evidence: `rg -n
          "ac-resource-delete-follows-owner-delete" tests src` returned no matches, and `kspec
          validate --completeness -v` reports the trait itself has this uncovered own AC. This task
          is linked to the trait spec, so every own AC needs behavioral coverage or an explicit,
          justified spec/task split before approval.'
        created_at: 2026-05-23T08:16:47.652Z
      - _ulid: 01KS9ZZ0Z5MMWDFD6Y3VJB71NT
        author: "@claude"
        body: 'Fixed: added a new removeOwnerResources helper and four behavioral tests under
          describe("removeOwnerResources (cascade with owner delete)") in
          tests/entity-local-resources.test.ts. Each test carries the AC annotation `// AC:
          @trait-entity-scoped-local-resources-1 ac-resource-delete-follows-owner-delete`. Coverage:
          (1) removeOwnerResources cleans the resources/ subtree AND resources.yaml manifest in one
          mutation; (2) it is idempotent (safe to re-run); (3) topology guarantee —
          getResourcesDir/getResourcesManifestPath both return paths strictly under the owning
          entity directory; (4) recursive rm of the entity directory cascades to all
          declared/undeclared resource files. kspec validate --completeness no longer reports the
          trait as having uncovered own ACs.'
        created_at: 2026-05-23T08:41:54.913Z
    kind: blocker
    resolved_at: 2026-05-23T08:41:59.091Z
    resolved_by: "@claude"
  - _ulid: 01KS9YHG2YXDS9WTZY3568CE12
    anchor:
      type: code
      commit: 5a2b68024f62f82b4394f898bc146d58e66a610c
      line_end: 640
      line_start: 636
      path: src/parser/entity-local-resources.ts
      side: head
    entries:
      - _ulid: 01KS9YHG2YHXPYWHT20WHTBZXG
        author: Jacob Chapel
        body: 'MUST-FIX: `loadResourceManifest` catches every error from `readYamlFile` and returns an empty
          manifest, so a syntactically invalid existing `resources.yaml` is silently treated as no
          resources. Evidence: I wrote `resources:\n  - id: x\n    path: [unterminated` to a
          manifest and `loadResourceManifest` returned `{"resources":[]}`. Missing manifests can
          default empty, but parse/read errors for an existing manifest need to surface as
          validation failures so resource metadata is actually loaded and corrupt manifests are not
          masked.'
        created_at: 2026-05-23T08:17:03.070Z
      - _ulid: 01KS9ZZ933AHSSN8E87CR6YVYN
        author: "@claude"
        body: "Fixed: loadResourceManifest now distinguishes ENOENT (missing file → empty manifest, callers
          may pre-create resources) from any other read or YAML parse failure (corrupt manifest →
          throws with the manifest path and cause). Added two regression tests: (a) unterminated
          flow sequence in resources.yaml now throws an Error mentioning the manifest path, and (b)
          replacing the manifest path with a directory raises a non-ENOENT IO error that is
          propagated rather than swallowed. ZodError from ResourceManifestSchema.parse continues to
          propagate normally (already covered)."
        created_at: 2026-05-23T08:42:03.235Z
    kind: blocker
    resolved_at: 2026-05-23T08:42:07.238Z
    resolved_by: "@claude"
  - _ulid: 01KS9YHX6M3AXXGKYDSK9ZZ13K
    anchor:
      type: code
      commit: 5a2b68024f62f82b4394f898bc146d58e66a610c
      line_end: 397
      line_start: 374
      path: src/parser/entity-local-resources.ts
      side: head
    entries:
      - _ulid: 01KS9YHX6M3BT7BMNQ251W8BJA
        author: Jacob Chapel
        body: "MUST-FIX: `resolveResourcePath` validates containment but never verifies the candidate is a
          regular file. A declared directory path therefore resolves successfully even though the
          trait is for local resource files, and `copyResourceForStaticExport` later throws an
          unstructured `EISDIR` from `fs.copyFile` instead of rejecting with actionable guidance.
          Evidence: with manifest path `folder` where `resources/folder/` is a directory,
          `resolveResourcePath` returned `ok: true`, then static export threw `EISDIR`. Reject
          non-file candidates before returning a resolved resource location."
        created_at: 2026-05-23T08:17:16.500Z
      - _ulid: 01KS9ZZH2R6Y3H6WNY8RCZ6DT6
        author: "@claude"
        body: "Fixed: resolveResourcePath now stats the realpath-resolved candidate and rejects when
          !candidateStat.isFile() with actionable guidance (\"does not point to a regular file under
          the owning entity's resources/ directory; resources must be files, not directories or
          other non-regular entries\"). The new check runs after symlink-containment validation, so
          directories — declared directly or reached via a directory-targeting symlink — are
          rejected before the resource flows into static export, hashing, preview, or the API. Added
          two regression tests: (a) directory resource resolution returns ok:false with the new
          message, and copyResourceForStaticExport propagates the same actionable rejection (no
          EISDIR leak, export root left untouched), and (b) a symlink in resources/ pointing at an
          external directory is rejected (covered by either the symlink-escape or non-regular-file
          path)."
        created_at: 2026-05-23T08:42:11.415Z
    kind: blocker
    resolved_at: 2026-05-23T08:42:15.609Z
    resolved_by: "@claude"
