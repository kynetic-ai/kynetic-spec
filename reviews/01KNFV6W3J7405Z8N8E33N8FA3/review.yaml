        body: " is cleared only after pending domains and active reloads both reach zero, so  reuses the
          existing cycle for later invalidations even after the original 100ms debounce window has
          already closed. I reproduced this by starting a manifest-triggered reload, waiting 150ms,
          starting a task-file invalidation while the first reload was still delayed, and
          observing  called once instead of twice. That violates , which scopes reuse to one
          debounce window, and it can carry stale initialization into a later watcher cycle."
        created_at: 2026-04-05T22:16:11.883Z
      - _ulid: 01KNFVYMCBDRX4N1B5YDAEFTXZ
        author: Jacob Chapel
        body: "Fixed: the debounce-scoped reload cycle now stops accepting new domains as soon as each
          domain timer fires, so later invalidation windows cannot reuse the prior cycle's
          initContext() promise while earlier reloads are still in flight. Added a behavioral
          regression in tests/daemon-entity-cache.test.ts that holds the first window mid-reload,
          starts a second window, and verifies initContext() is called twice overall (once per
          debounce window)."
