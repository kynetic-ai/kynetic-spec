      - _ulid: 01KW3GS2CW56XG5ENDEEVQ8WZM
        author: Jacob Chapel
        body: "MUST-FIX: the CLI reverify success path calls applyExplicitReverification directly, but that
          service writes the verification stamp via writeVerificationStampWithoutCommit and the CLI
          never creates the surrounding shadow commit. I reproduced this in a temp project: 'kspec
          --json coverage resolve reverify --item @coverage-api-widget --ac ac-covered --actor
          neutral-operator' exited 0 with stored:true/effect:wrote_stamp, while 'git status --short'
          in the spec dir showed '?? coverage/verifications/'. This violates the stored mutation
          contract because the command reports a durable stored effect while leaving the record
          uncommitted and easy to lose; make the CLI path commit the reverify write, or route it
          through the same mutation pipeline semantics as the daemon."
        created_at: 2026-06-27T03:08:10.012Z
    kind: blocker
