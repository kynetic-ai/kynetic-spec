    entries:
      - _ulid: 01KSZBSK4ERBZWPGT7F6RYRT8H
        author: Jacob Chapel
        body: "MUST-FIX: Bare-command preflight treats an absent PATH as an empty search path, but Node
          spawn does not. With env.inherit=none and no PATH in the contract env, spawnSync('sh',
          ['-c','exit 0'], { env: {} }) succeeds on this host, while preflightExecutable('sh', {
          searchPath: '' }) returns { spawnable: false, reason: 'not_found' }. This means a
          runner-configured executable that Node can actually spawn is rejected as unspawnable
          before the prompt is built, violating ac-existing-executable-reference-resolves. Preserve
          the distinction between PATH unset and PATH explicitly set to empty, and mirror
          child_process.spawn lookup behavior for the unset case."
        created_at: 2026-05-31T15:52:42.894Z
    kind: blocker
