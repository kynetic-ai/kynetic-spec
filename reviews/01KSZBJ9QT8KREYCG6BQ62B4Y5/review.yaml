    entries:
      - _ulid: 01KSZBSK4ERBZWPGT7F6RYRT8H
        author: Jacob Chapel
        body: "MUST-FIX: Bare-command preflight treats an absent PATH as an empty search path, but Node
          spawn does not. With env.inherit=none and no PATH in the contract env, spawnSync('sh',
          ['-c','exit 0'], { env: {} }) succeeds on this host, while preflightExecutable('sh', {
          searchPath: '' }) returns { spawnable: false, reason: 'not_found' }. This means a
          runner-configured executable that Node can actually spawn is rejected as unspawnable
          before the prompt is built, violating ac-existing-executable-reference-resolves. Preserve
          the distinction between PATH unset and PATH explicitly set to empty, and mirror
          child_process.spawn lookup behavior for the unset case."
        created_at: 2026-05-31T15:52:42.894Z
      - _ulid: 01KSZE9267WDT3JSY8MWCFN7VT
        author: "@claude"
        body: >-
          Fixed in commit 1d6a27fd91. resolveInvocationSearchPath now preserves the distinction
          between "PATH key absent from the contract env" and "PATH explicitly set to empty":


          - Absent PATH (env.inherit=none + no env.set.PATH): falls back to
          POSIX_DEFAULT_SEARCH_PATH ("/usr/bin:/bin") so preflight mirrors the libc _PATH_DEFPATH
          that posix_spawnp / execvp consults when the spawned env has no PATH. The reviewer's exact
          case (sh under env: {}) now resolves.

          - Explicit empty PATH: preserved verbatim; preflight searches no segments, matching
          spawn's behavior in that case.


          Added two parity tests in tests/agent-runner-process.test.ts that probe
          child_process.spawn directly before asserting preflight, so the parity claim is pinned to
          spawn's actual behavior rather than to a theory:

          - "preflight resolves a bare command via the libc default PATH when env.inherit=none and
          env.set.PATH is unset" — reproduces the original blocker scenario and asserts spawn
          parity.

          - "preflight rejects the same bare command when env.set.PATH is explicitly empty" — pins
          the opposite half so the two cases cannot regress to a shared codepath again.


          The previously asserted "host PATH leak prevention" test still passes because its bare
          command lives in a tempdir not under /usr/bin:/bin; updated that test's description to
          drop the misleading "runner-scoped PATH is empty" wording.
        created_at: 2026-05-31T16:36:06.983Z
    kind: blocker
    resolved_at: 2026-05-31T16:36:14.691Z
    resolved_by: "@claude"
