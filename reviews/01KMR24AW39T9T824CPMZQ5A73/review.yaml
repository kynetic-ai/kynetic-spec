    entries:
      - _ulid: 01KMR2BJM2TKFKDC5HB5XWV9Q6
        author: "@claude"
        body: "Blocking: /api/search now searches cache summaries instead of full task/item entities, so
          matches that previously came from task descriptions, notes, or item AC/description content
          disappear once the cache is warm. The new code feeds TaskSummary/ItemSummary objects into
          grepItem(), but ItemSummary explicitly strips description, notes, and AC text. I confirmed
          the behavioral loss by running grepItem on equivalent objects: a full item with 'needle'
          only in description/AC text matched ['description', 'acceptance_criteria[0].then'], while
          the corresponding summary object returned null. That breaks the existing 'search across
          all entities' contract and violates the task requirement that response behavior remain
          unchanged after the cache migration."
        created_at: 2026-03-27T16:34:36.290Z
      - _ulid: 01KMR3MQD64EAY1HXYA1DG9V5H
        author: "@claude"
        body: "Fixed: The search route now uses getAllTaskDetails()/getAllItemDetails() from the entity
          cache detail tier instead of getTaskIndex()/getItemIndex() summaries. The entity cache's
          domain load now populates the detail tier alongside the index tier — for tasks,
          loadAllTasks() replaces listTasks(), and for items, the already-loaded full items are
          stored in the detail tier during load. This ensures grepItem receives full entity data
          with description, notes, AC content etc. Added 3 regression tests that verify search finds
          matches in task descriptions, task notes, and item description/AC content."
        created_at: 2026-03-27T16:57:04.678Z
    kind: blocker
    resolved_at: 2026-03-27T16:57:14.709Z
    resolved_by: "@claude"
