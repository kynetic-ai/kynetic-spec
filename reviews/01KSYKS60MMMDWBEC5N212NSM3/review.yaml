  - _ulid: 01KSYMJN0V0YSA0NE8SFC410PA
    anchor:
      type: code
      commit: 985493b66cdf0a68e94620dd0418b00c5d580dde
      line_end: 309
      line_start: 309
      path: src/cli/commands/agent.ts
      side: head
    entries:
      - _ulid: 01KSYMJN0V704STHKF92Q5FMWQ
        author: Jacob Chapel
        body: "MUST-FIX: Runner-backed agents are still invoked through the legacy adapter field. The task
          and @agent-runner-configuration ac-runner-precedence-over-adapter require runner to
          determine the resolved adapter/execution harness when both fields exist, but this path
          computes adapterId from opts.adapter ?? agentDef.adapter ?? default and never consults
          agentDef.runner. I confirmed behavior with a temporary project: an agent with runner:
          named-runner and adapter: legacy-adapter produced dry-run JSON with adapter:
          legacy-adapter. That means the new runner metadata can be stored while actual manual
          invocations ignore it."
        created_at: 2026-05-31T09:06:58.203Z
      - _ulid: 01KSYPTQHPWFV9YCA8TA3Z6NZN
        author: "@claude"
        body: "Fixed: agent run now loads the effective runner registry via resolveEffectiveRunners and
          computes the adapter via a new resolveAgentAdapter helper. When agentDef.runner resolves
          in the registry, registry[runner].adapter is used (satisfying
          ac-runner-precedence-over-adapter), so an agent with { runner: named-runner, adapter:
          legacy-adapter } now invokes the runner-resolved adapter. --adapter CLI override still
          wins over both. If runner is set but does not resolve and no --adapter override is
          provided, the command fails fast with VALIDATION_FAILED and a remediation hint. Behavioral
          tests cover all four cases: runner-resolved, --adapter override, unresolved-runner error,
          --adapter unblock."
        created_at: 2026-05-31T09:46:20.081Z
    kind: blocker
    resolved_at: 2026-05-31T09:46:34.329Z
    resolved_by: "@claude"
  - _ulid: 01KSYMJQBRWGCZQ3JT37XXXP0C
    anchor:
      type: code
      commit: 985493b66cdf0a68e94620dd0418b00c5d580dde
      line_end: 205
      line_start: 201
      path: src/cli/commands/agent.ts
      side: head
    entries:
      - _ulid: 01KSYMJQBSQYBB33A1VRP5VWJZ
        author: Jacob Chapel
        body: "MUST-FIX: The list JSON reports the raw/default adapter instead of the runner-resolved
          adapter identity for runner-backed agents. @runner-operator-surfaces
          ac-agent-list-shows-runner says each entry shows the runner name when present and its
          resolved adapter identity. This code emits a.adapter ?? default even when a.runner is
          present, so a runner-only agent is displayed as claude-agent-acp regardless of the named
          runner's effective adapter, and an agent with both fields shows the legacy adapter rather
          than the runner-selected one."
        created_at: 2026-05-31T09:07:00.601Z
      - _ulid: 01KSYPTWHHJ01STE63T8VM1ZA3
        author: "@claude"
        body: "Fixed: agent list now loads the effective runner registry and emits the runner-resolved
          adapter identity via the shared resolveAgentAdapter helper. JSON output's adapter field is
          now registry[agent.runner].adapter when the runner resolves (satisfying
          ac-agent-list-shows-runner), and falls back to agent.adapter for legacy adapter-only
          agents (ac-adapter-field-backcompat). Human-readable rendering uses the same resolved
          adapter on the agent header line. Behavioral tests cover: dual-field runner-resolved,
          runner-only resolved, human-readable runner-resolved, and legacy adapter-only fallback."
        created_at: 2026-05-31T09:46:25.193Z
    kind: blocker
    resolved_at: 2026-05-31T09:46:39.195Z
    resolved_by: "@claude"
