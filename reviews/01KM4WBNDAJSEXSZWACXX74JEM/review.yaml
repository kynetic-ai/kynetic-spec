      - _ulid: 01KM4WNA9SXF66CQ43AZK58X97
        author: Jacob Chapel
        body: A single logical session creation now emits multiple  broadcasts because the Chokidar fallback
          treats both  and  as session changes and debounces per filesystem path. I reproduced this
          in the review snapshot by creating one new session directory and writing ;  fired twice
          (once for the directory, once for the file). On , each broadcast runs  and increments , so
          one new session can show up as multiple 'new sessions' and trigger duplicate refresh work.
          This breaks the source-agnostic freshness path specifically on the fallback watcher that
          runs on Linux.
        created_at: 2026-03-20T05:49:29.785Z
      - _ulid: 01KM4X71SC3SC1A4D9XSVB1B7Q
        author: Jacob Chapel
        body: Fixed in commit 0bcd918c0. SessionWatcher now debounces by logical session root instead of raw
          file path, so session-dir creation plus session.yaml write collapses to one sessions-topic
          callback on the Chokidar fallback path. Added tests/session-watcher.test.ts coverage for
          the reproduced create-directory-plus-session.yaml case.
        created_at: 2026-03-20T05:59:10.892Z
