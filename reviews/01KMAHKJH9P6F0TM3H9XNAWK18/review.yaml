      side: head
    entries:
      - _ulid: 01KMAHZ8WEY8Y95CMTWMWHT6NB
        author: Test User
        body: This fix threads a SessionRegistry into ActionExecutor, but it still never makes real sessions
          visible to that registry. executeSessionPrompt() can only succeed via
          sessionRegistry.get(sessionId), yet there is no production SessionRegistry.register(...)
          call anywhere under src/ or packages/, and DispatchEngine still invokes
          runInvocation(options) without any registry or session-handle hook. In production that
          leaves the registry empty, so a session_prompt action against a live idle session still
          falls through the "was never registered" failure path instead of delivering the follow-up
          prompt.
        created_at: 2026-03-22T10:38:08.270Z
    kind: blocker
