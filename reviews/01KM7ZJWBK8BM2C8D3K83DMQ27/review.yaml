      - _ulid: 01KM7ZWEXEPGBHWC1A3VZ353P1
        author: Jacob Chapel
        body: The CLI advertises '--force' as 'skip confirmation', but this command never implements any
          confirmation path before the repair write. The only repair branch goes straight from
          '--repair' to 'splitManager.rebuildIndex()' and 'commitIfShadow()', without reading
          'options.force' at all. That means 'kspec task rebuild-index --repair' mutates shadow
          state immediately even though the help text promises a confirmation gate unless '--force'
          is supplied.
        created_at: 2026-03-21T10:43:32.911Z
    kind: blocker
