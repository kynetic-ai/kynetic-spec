      - _ulid: 01KVD6BTYGFRF2ZPKX9GZ6VQAQ
        author: Jacob Chapel
        body: "Corrected finding text: MUST-FIX: buildTaskMutationEvent still drops task mutations whenever
          callers use skipCommit true or omit commit metadata, but several real task mutations are
          intentionally outer-committed. For example, linkReviewToTasks sets review_ref with
          skipCommit true, handleVerdictTaskTransition transitions pending-review tasks to
          needs_work with skipCommit true, and plan resource materialization patches a task
          resource_refs field without commit metadata. None of those paths has a surrounding
          tasks:updates task_updated event, so subscribers miss successful task mutations through
          non-task interfaces, violating @mutation-event-coverage ac-1/ac-5. Evidence: rg shows
          these call sites in src/parser/review-task-integration.ts:85,
          src/parser/review-task-integration.ts:185, and src/cli/commands/plan.ts:700, while the
          review verdict daemon route only broadcasts reviews:updates verdict_submitted."
        created_at: 2026-06-18T11:02:53.136Z
      - _ulid: 01KVD8CSZCRJQ8BT2KM2F8M5D8
        author: Jacob Chapel
        body: "Fixed in 6467dcc8fa: TaskDataManager now records task_updated descriptors for
          collector-backed task mutations even when callers use skipCommit true or omit commit
          metadata. Added explicit review_linked and needs_work actions for review-link/verdict
          outer commits, plus a generic changed fallback for metadata-free field patches such as
          resource_refs materialization. Behavioral coverage now asserts skipCommit, metadata-free,
          review add/link, and request_changes verdict transition events."
        created_at: 2026-06-18T11:38:22.060Z
