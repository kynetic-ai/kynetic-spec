threads:
  - _ulid: 01KXQV3BMNESQ24X38653GW0RS
    anchor:
      type: code
      commit: 7c2bc80a30fb9a4f726938960bf1dc60224195d9
      line_end: 68
      line_start: 68
      path: docs/guides/configuring-dispatch-workspaces.md
      side: head
    entries:
      - _ulid: 01KXQV3BMNPS0AXS1YP7YM84J2
        author: pr-reviewer
        body: "MUST-FIX: This sentence says an absolute worktree root is outside the repository, but that is
          not an enforced invariant. resolveDispatchWorkspaceConfig preserves any absolute path and
          ensureUsableWorktreeRoot rejects only paths under .kspec; the submitted behavioral test at
          tests/dispatch-operator-docs.test.ts:1464-1470 deliberately accepts an absolute root
          inside projectDir. buildKspecGitignoreEntries nevertheless omits every absolute root from
          the managed block. Impact: an operator can choose a supported absolute in-repository root
          and, based on this guide, miss that it receives no managed ignore entry, leaving dispatch
          worktrees visible as unignored repository content. State that absolute roots receive no
          managed repository-relative ignore entry and recommend placing them outside the
          repository, without claiming they necessarily are outside."
        created_at: 2026-07-17T10:49:03.381Z
    kind: blocker
  - _ulid: 01KXQV3F0PZM46DCWQK48A789R
    anchor:
      type: code
      commit: 7c2bc80a30fb9a4f726938960bf1dc60224195d9
      line_end: 151
      line_start: 151
      path: docs/guides/configuring-dispatch-workspaces.md
      side: head
    entries:
      - _ulid: 01KXQV3F0PRRPJH48T7DRASDFD
        author: pr-reviewer
        body: "MUST-FIX: The universal statement that remote failures are reported as degraded target state
          contradicts the remote-sync contract. DispatchEngine._syncTarget classifies
          fetch/connectivity failures as transient_failure, logs a warning, and explicitly does not
          enter degraded state; tests/dispatch-target-sync.test.ts covers this under
          @dispatch-remote-branch-sync ac-transient-no-degrade. Degradation applies to unsafe target
          mutation or divergence, not every remote failure. Impact: operators will look for degraded
          status fields that legitimately never appear during transient fetch failures. Qualify
          which failures degrade and distinguish transient warnings from degraded topology/state
          failures."
        created_at: 2026-07-17T10:49:06.839Z
    kind: blocker
  - _ulid: 01KXQV3JV8B0QG36PJAHNCFQGM
    entries:
      - _ulid: 01KXQV3JV8X032KGM4YXG8DV7H
        author: pr-reviewer
        body: "Review evidence log — Files read: all four changed-file diffs; full new workspace guide;
          surrounding runner-guide examples; changed docs-test helpers/cases; inventory
          fixture/gate; docs Vite plugin; config/default resolution; workspace target/root/ownership
          code; bootstrap schema/runtime; gitignore setup/upgrade paths; publication resolution;
          target-sync runtime/tests; prior-cycle review and task/spec/plan context. Commands run:
          exact base/head diff and commits; task/spec/plan/prior-review lookups; AC searches;
          tracked Markdown count; source fact searches; git diff --check; format; repo/focused lint;
          typecheck; refs/alignment/completeness validation; focused docs/config/inventory tests;
          docs-search build; fresh full suite. Claims verified: prior blocker is fixed (141 tracked
          Markdown files and inventory 17/17); worker full-suite claim independently reproduced
          (2,835 suites, 10,967 passing, 3 expected skips); examples parse and docs publish.
          Categories searched: correctness, edge cases, recovery/error handling,
          security/output-tail warning, test quality, integration, discoverability, lifecycle
          separation, and additional issues after the first finding. Shared-guidance neutrality: no
          listed package/shared guidance surface changed; public prose was still checked for
          universal Kynetic-only policy, with no new leak. Direction 2 and generated-artifact
          refresh are not applicable. Findings: two source-alignment blockers; no additional issue
