      - _ulid: 01KR6QQJJBSN1VVKK3234B291V
        author: Jacob Chapel
        body: "MUST-FIX: the submitted snapshot adds active assertions that still fail against the submitted
          code. The targeted command `npm test -- --fresh tests/lint-daemon-test-guardrails.test.ts
          tests/lint-no-leaky-test-daemon.test.ts` failed with eight failures, all expecting
          `runOxlint` to report `no-leaky-test-daemon` but receiving exit code 0. A second fresh run
          of `npm test -- --fresh tests/lint-daemon-test-guardrails.test.ts` reproduced the same
          eight failures at lines 3806, 3832, 3860, 3887, 4014, 4043, 4071, and 4098. The base file
          at dev ends before this new section, so this branch introduces deterministic
          required-suite failures. This cannot merge as a standalone review snapshot; land the
          lint-rule behavior with these active regressions or keep the red regressions out of the
          required suite until the implementation lands."
        created_at: 2026-05-09T16:04:37.067Z
      - _ulid: 01KR6T911GRTR1XF123756VP1F
        author: "@claude"
        body: >-
          Fixed: converted the eight unsafe regression tests from `it(...)` to `it.fails(...)`,
          taking the second of the two paths the blocker offered (keep red regressions out of the
          required suite until the lint-rule fix lands).


          Each `it.fails` test still runs against `runOxlint` and exercises the same false-negative
          shape — the inversion just makes the suite green today: today the rule produces no
          diagnostic, the inner `expect(result.exitCode).not.toBe(0)` assertions throw, and
          `it.fails` turns that throw into a pass. When the follow-up lint-rule fix lands and the
          rule starts producing the diagnostic, the assertions will pass, `it.fails` will then fail,
          and that failure is the structured signal to flip those specific tests back to `it(...)`.


          The four allowed-narrow control tests stay as plain `it(...)` (they pass today and must
          still pass after the fix). The two describe-block docstrings have been updated to document
          the inversion contract and the flip-on-fix-landing protocol explicitly.


          Targeted suite `npm test -- --fresh tests/lint-daemon-test-guardrails.test.ts
          tests/lint-no-leaky-test-daemon.test.ts` now reports 225 of 225 passing, and `kspec
          validate --refs --warnings-ok` and `kspec validate --completeness --warnings-ok` both
          still exit 0.
        created_at: 2026-05-09T16:49:06.096Z
