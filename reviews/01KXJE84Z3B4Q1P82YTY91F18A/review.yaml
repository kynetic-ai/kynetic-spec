      path: tests/dispatch-task-lifecycle.test.ts
      side: head
    entries:
      - _ulid: 01KXJFA7WD60RNDMJD55T0YBVV
        author: Jacob Chapel
        body: "MUST-FIX: This does not prove ac-task-control-preserves-unrelated-task-control. Task B is
          pending when engine.start runs, so B is recorded as started before task A is paused. The
          final toContain(B) assertion therefore passes even if pausing A also pauses B. Make B
          become eligible after A is paused and assert a post-pause B start, or directly verify B
          has no control record in addition to behavioral admission."
        created_at: 2026-07-15T08:46:53.837Z
    kind: blocker
  - _ulid: 01KXJFAB2KB1DVY7957YNF22DV
    anchor:
      type: code
