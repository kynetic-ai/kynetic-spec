    entries:
      - _ulid: 01KXJFA1EWPMG0VJC3S6RK77ZB
        author: Jacob Chapel
        body: "MUST-FIX: This concurrency test assumes the slug call deterministically acquires the
          lifecycle mutex first. Both calls perform independent asynchronous identity loads before
          locking, so Promise.all preserves result positions but does not establish lock order. The
          fresh full suite observed the task-id call win, making first=noop and failing line 219; it
          can also change which reason metadata is durable. Assert one applied plus one noop without
          assigning the winner, and test sanitization separately or establish an explicit ordering
          barrier. Evidence: focused runs passed, while npm test -- --fresh failed here with first
          outcome noop."
        created_at: 2026-07-15T08:46:47.260Z
    kind: blocker
  - _ulid: 01KXJFA4MEW84FNZX288C7WPCP
    anchor:
      type: code
      commit: 3e6af27320ee523bb85af7ff332fc4bc96916a5e
