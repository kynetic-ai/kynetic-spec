        body: "MUST-FIX: The test title and task handoff claim bootstrap, retry, and post-invocation
          coverage, but this body never starts with a precommitted task pause, runs a failed
          invocation retry timer, or crosses a post-invocation barrier. Repeated direct calls to
          _serializedDrain only prove the common end-state drain. A regression in any named caller
          could still pass. Add the deterministic per-ingress barrier cases required by the task
          handoff, including bootstrap, retry wake-up, and post-invocation re-evaluation."
        created_at: 2026-07-15T08:46:50.510Z
      - _ulid: 01KXJGRG3992YGFEW36C1N0TAY
