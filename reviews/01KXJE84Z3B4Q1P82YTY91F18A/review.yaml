      side: head
    entries:
      - _ulid: 01KXJFAB2KZFFBS0WCRVSF7W2G
        author: Jacob Chapel
        body: "MUST-FIX: The ac-task-pause-allows-active-completion annotation is not behaviorally proven.
          Manually inserting activeCount and activeInvocationDetails creates bookkeeping, not an
          abortable running invocation; the immediate count assertion would still pass if pause
          aborted real work. Run an invocation behind a completion barrier, pause its canonical
          task, then release the barrier and prove completion. The existing registered-session
          assertion can continue to cover the session-open AC."
        created_at: 2026-07-15T08:46:57.107Z
    kind: blocker
