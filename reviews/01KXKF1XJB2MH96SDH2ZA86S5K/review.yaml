  - _ulid: 01KXKG43X3FVQ2E51MCKY6K2Y5
    anchor:
      type: code
      commit: eabcdee53e8b85a12365f154ecb903e3670f95b9
      line_end: 757
      line_start: 750
      path: src/agent-runtime/invocation.ts
      side: head
    entries:
      - _ulid: 01KXKG43X39V688BEWMX0KE3MZ
        author: Jacob Chapel
        body: "MUST-FIX — normal finalization proves only the ACP leader exited, not that the owned process
          group exited. reapSpawnedAgent returns as soon as waitForSpawnedAgentExit observes the
          leader, so SIGKILL is skipped when a descendant survives group SIGTERM; the caller can
          then persist exited_at, which recovery treats as terminal evidence. Reproduction: a
          detached leader spawned a SIGTERM-ignoring descendant; after group SIGTERM,
          leaderExited=true while descendantAlive=true and groupAlive=true. Impact: cleanup can
          complete and later discard recovery evidence while the owned group remains live, violating
          ac-live-group-prevents-cleanup-completion and the cancellation guarantees. Verify
          process-group extinction and escalate surviving members before publishing exited_at; cover
          a resistant descendant behaviorally."
        created_at: 2026-07-15T18:20:16.163Z
      - _ulid: 01KXKHYA4BNF83QZGNWZ2V8BR9
        author: Jacob Chapel
        body: "Fixed in 0898f3a8e0: dispatch-owned finalization now polls the entire spawned process group,
          escalates SIGKILL when any descendant survives the graceful window, and publishes
          exited_at only after the group is empty. Added a real same-group SIGTERM-resistant
          descendant regression."
        created_at: 2026-07-15T18:52:03.040Z
    kind: blocker
  - _ulid: 01KXKG4A9AYNJV077EV5FHNAT7
    anchor:
      type: code
      commit: eabcdee53e8b85a12365f154ecb903e3670f95b9
      line_end: 1862
      line_start: 1852
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXKG4A9AV28YWW4K9804VNNX
        author: Jacob Chapel
        body: "MUST-FIX — a completed stop is not idempotent while the invocation owner remains in
          activeInvocationOwnership. After the first cleanup removes its pending entry,
          _collectStopTargets re-adds the retained owner; stopped authority plus a nonempty target
          list makes the next stop create a fresh cleanup and report applied. Reproduction against
          DispatchEngine: sequential global stops returned applied at revisions 5 and 9, with one
          signal and idle cleanup after each. The second call must be a no-op or the same pending
          retry, and the task-scoped collector has the same issue. Impact: repeated stop duplicates
          cleanup lifecycle side effects and violates both stop-idempotency ACs. Preserve
          completed-cleanup knowledge or exclude already-verified retained ownership, and add
          sequential tests with a real activeInvocationOwnership entry."
        created_at: 2026-07-15T18:20:22.698Z
    kind: blocker
  - _ulid: 01KXKG4GQ0Y1ZDE95GH3W2Z1C1
    anchor:
      type: code
      commit: eabcdee53e8b85a12365f154ecb903e3670f95b9
      line_end: 1133
      line_start: 1115
      path: src/agent-runtime/invocation.ts
      side: head
    entries:
      - _ulid: 01KXKG4GQ0B0DNXP8YQ4WJXYFX
        author: Jacob Chapel
        body: "MUST-FIX — the spawned process handle is unavailable when ACP initialization rejects or
          hangs. This assignment completes only after spawnAndInitialize returns; on initialize
          failure that helper issues best-effort SIGTERM and throws without awaiting leader/group
          exit, leaving state.agent null so invocation cleanup cannot perform verified reaping or
          publish recoverable ownership. Reproduction: an ACP adapter returned an initialize error
          and ignored SIGTERM; runInvocation rejected while the captured child PID remained alive. A
          hung initialize also leaves stop waiting indefinitely on the ownership reservation. This
          violates the post-spawn durability-failure and spawn-win stop guarantees. Retain/register
          the handle immediately after spawn, make initialization cancellable by stop, and
          verified-reap initialization failures; add rejecting and hanging initialization tests."
        created_at: 2026-07-15T18:20:29.280Z
    kind: blocker
  - _ulid: 01KXKG4PXC7274PNRZ6HV1WJQA
    anchor:
      type: code
      commit: eabcdee53e8b85a12365f154ecb903e3670f95b9
      line_end: 912
      line_start: 905
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXKG4PXCQX37J026CYJC621G
        author: Jacob Chapel
        body: MUST-FIX — process-group enumeration converts every per-PID /proc stat failure into an absent
          process. The catch at line 910 suppresses EACCES, EIO, and parse failures as well as
          disappearance; verification can therefore accept the incomplete member set, signal a group
          containing an unverified member, and waitForProcessGroupExit can report empty while that
          member is live. This contradicts the required cleanup_identity_unverifiable outcome for
          unreadable evidence and the prohibition on signaling unverified members. Only tolerate the
          ENOENT disappearance race already represented by readLinuxProcessEvidence returning null;
          propagate other evidence failures and add a behavioral runtime test for rejected member
          reads.
        created_at: 2026-07-15T18:20:35.628Z
    kind: blocker
  - _ulid: 01KXKG5HJ5EEXJVWT78BFV1QXB
    entries:
      - _ulid: 01KXKG5HJ7QNQK2FFH5B81KPNT
        author: Jacob Chapel
        body: "Review evidence log — Files read: every changed file (src/agent-runtime/dispatch.ts,
          invocation.ts, session-registry.ts; src/schema/dispatch-control.ts; src/sessions/store.ts
          and types.ts; all 13 changed test/mock files), plus surrounding src/agents/spawner.ts and
          prior-cycle review records. Commands run: git status/log/diff/diff-check; kspec
          task/item/review queries; AC-annotation searches; kspec validate
