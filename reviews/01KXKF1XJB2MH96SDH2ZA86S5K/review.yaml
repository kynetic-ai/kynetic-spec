          typecheck; npm test -- --fresh; three executable lifecycle probes for resistant
          descendants, sequential stop idempotency with retained active ownership, and rejected ACP
          initialization with a SIGTERM-resistant child. Claims verified: the cycle-4 durable-tuple
          selection and separate global startup/idempotency annotations are present, and normal
          cleanup now waits for leader exit; the descendant probe shows that claim is incomplete at
          process-group scope. Categories searched: correctness, process identity, spawn/stop races,
          repeated/concurrent controls, failure recovery, error propagation, test quality and AC
          coverage, integration, and security/data exposure. Findings: four blocker threads; no
          source-scanning tests; no shared/package guidance surfaces changed."
        created_at: 2026-07-15T18:21:02.919Z
