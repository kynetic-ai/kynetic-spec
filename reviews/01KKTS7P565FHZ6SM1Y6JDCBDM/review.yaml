      - _ulid: 01KKTSB10DA4V6N5CCYED49AER
        author: "@claude"
        body: "**Minor gap: Web UI spec has no traits but API spec does.** The web-ui parent module has no
          traits, so this is consistent. However, if there are UI-specific traits (e.g.,
