  - _ulid: 01KKTS9WE7YHN19XJ7DGFT8HMT
    entries:
      - _ulid: 01KKTS9WE7CC0AFKGT098JH66S
        author: "@claude"
        body: "**Blocker 1 (API ac-3 too broad) — RESOLVED.** Original ac-3 that lumped all mutations has
          been split into ac-3 (create thread), ac-4 (reply), ac-5 (resolve/reopen), ac-6
          (verdicts), ac-7 (checks), ac-8 (lifecycle). Each endpoint now has its own testable AC
          with distinct request shape and expected behavior. Good granularity."
        created_at: 2026-03-16T07:38:25.095Z
    kind: nit
  - _ulid: 01KKTS9YYRWSMBJCTGRAHEY4EC
    entries:
      - _ulid: 01KKTS9YYST86SA85SBJPC4EFR
        author: "@claude"
        body: '**Blocker 3 (no error handling ACs) — RESOLVED.** ac-10 added covering invalid data (missing
          fields, invalid ref, invalid state transition) returning 400 with actionable error
          messages. Combined with @trait-error-guidance inheritance from traits, this provides
          adequate error coverage. The trait ACs cover specifics like "suggests checking ref" and
          "indicates current state and valid next states."'
        created_at: 2026-03-16T07:38:27.673Z
    kind: nit
  - _ulid: 01KKTSA19PHGNX2MF1M8FK2SD7
    entries:
      - _ulid: 01KKTSA19PFWTZKW4F24V96NQC
        author: "@claude"
        body: "**Blocker 4 (Web UI ac-3 too broad) — RESOLVED.** Split into ac-3 (create thread with kind
          selection), ac-4 (reply to thread), ac-5 (resolve/reopen toggle), ac-6 (submit verdict
          with disposition update). Each interaction is now independently testable."
        created_at: 2026-03-16T07:38:30.070Z
    kind: nit
  - _ulid: 01KKTSA3GJK4G0A4QTAM62Z4FP
    entries:
      - _ulid: 01KKTSA3GJ593EGJFF1361WMAK
        author: "@claude"
        body: '**Blocker 5 (filtering underspecified) — RESOLVED.** API ac-1 now explicitly says "linked
          task (via subject-ref or related-refs)" which clarifies the semantics. Sort parameter
          support is also mentioned. This addresses both the filter ambiguity and the missing sort
          parameter.'
        created_at: 2026-03-16T07:38:32.338Z
    kind: nit
  - _ulid: 01KKTSA65T072TW885F02YHJGV
    entries:
      - _ulid: 01KKTSA65VGT8Q1GV08K3VHGQV
        author: "@claude"
        body: "**Blocker 8 (no traits) — RESOLVED.** API spec now references @trait-json-output,
          @trait-error-guidance, @trait-localhost-security, and @trait-websocket-protocol. This
          matches the daemon-server parent's traits minus @trait-shadow-commit (correctly excluded
          since the daemon API delegates to library functions that handle shadow commits
          internally). The web UI spec has no traits, consistent with the @web-ui parent module
          having none."
        created_at: 2026-03-16T07:38:35.067Z
    kind: nit
  - _ulid: 01KKTSADNF6TETZBY7A217021X
    entries:
      - _ulid: 01KKTSADNF2CQZZAS06JQR5BPS
        author: "@claude"
        body: "**Question 6 (task-to-review navigation) — RESOLVED.** Web UI ac-7 added: when a user views a
          task detail page with linked reviews, reviews are shown with disposition badge and link to
          review detail. This covers the use case."
        created_at: 2026-03-16T07:38:42.735Z
    kind: nit
  - _ulid: 01KKTSAFX333M71FZ6WJRV0E25
    entries:
      - _ulid: 01KKTSAFX4AXDT3X45WBTTV6P1
        author: "@claude"
        body: '**Nit 7 (WebSocket topic naming) — RESOLVED.** ac-9 specifies "reviews topic" and
          implementation notes list specific event types: review_created, review_updated,
          thread_created, thread_updated, verdict_submitted, check_recorded. This gives implementers
          clear guidance.'
        created_at: 2026-03-16T07:38:45.028Z
    kind: nit
  - _ulid: 01KKTSAJFHT6XMJWN1ZPP8EKHN
    entries:
      - _ulid: 01KKTSAJFHF79S9ERTXWT4DSC4
        author: "@claude"
        body: '**Question 11 (URL routing) — RESOLVED.** Description now states "Routes follow existing
          patterns: /reviews for list, /reviews/[id] for detail." Deep-linking to specific threads
          was not addressed, but this is an enhancement that can be added later — the core routing
          is specified.'
        created_at: 2026-03-16T07:38:47.665Z
    kind: nit
  - _ulid: 01KKTSANERBG5PMMCKWAC6VD6X
    entries:
      - _ulid: 01KKTSANER0E9YJ1BBN8DZXHMR
        author: "@claude"
        body: "**Question 2 (shared types) — ACCEPTABLE.** Implementation notes still don't explicitly
          mention shared types in @kynetic-ai/shared, but \"follow existing daemon API patterns\" is
          sufficient guidance. The implementer will see PlanSummary/PlanDetail imports in the plans
          route and follow the same pattern. Not a gap worth blocking on."
        created_at: 2026-03-16T07:38:50.712Z
    kind: nit
  - _ulid: 01KKTSAXHM2RH8V3049VJ1WGSV
    entries:
