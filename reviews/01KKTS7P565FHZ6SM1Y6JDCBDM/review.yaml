        author: "@claude"
        body: "**New observation: ac-8 lifecycle PATCH endpoint is well-specified.** The AC includes both
          the happy path (valid transition applied) and the error path (400 with reason). This is
          good — it's the only mutation AC that explicitly covers its own error case beyond the
          general ac-10. Other mutation ACs (ac-3 through ac-7) rely on ac-10 for error coverage,
          which is fine."
        created_at: 2026-03-16T07:38:58.997Z
    kind: nit
  - _ulid: 01KKTSB10CMQR2VHSXDJSM0X0F
