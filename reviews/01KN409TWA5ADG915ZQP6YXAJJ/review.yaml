    entries:
      - _ulid: 01KN40TAPANWC3Q00BX88YZQCZ
        author: Jacob Chapel
        body: This rewrite removes the end-to-end assertion that a new session fixture causes the daemon to
          broadcast a live-update event. The previous version wrote a second fixture and waited for
          the page to refresh from that real event path; this version first polls /api/sessions
          until the new row already exists, then manually dispatches synthetic WebSocket
          MessageEvents from the browser to force the refresh. As a result the test still passes if
          the daemon stops emitting either the sessions-topic or agent-origin broadcast, which is
          exactly the behavior this task is supposed to keep gated in CI. Please keep the
          deterministic indexing wait if needed, but restore coverage of the actual daemon ->
          WebSocket -> UI fanout path instead of injecting the browser event directly.
        created_at: 2026-04-01T07:58:35.722Z
      - _ulid: 01KN423GDDBE6WHB79VBYMPKQ9
        author: Jacob Chapel
        body: Fixed in the latest patch. The source-agnostic sessions live-update test now waits for
          explicit topic subscription acks on the page WebSocket, writes the second fixture, and
          asserts that the list refreshes via the real daemon sessions watcher/broadcast path
          instead of a synthetic browser MessageEvent. While restoring that coverage, the test
          exposed a real freshness race in the sessions page, so the live-refresh path now retries
          refetch briefly before concluding that no list change occurred.
        created_at: 2026-04-01T08:21:05.069Z
