      - _ulid: 01KPPZKTDP6Z15E7A101RD39AJ
        author: Jacob Chapel
        body: Out-of-tree markdown links are still broken at runtime. This renderer explicitly leaves any
          .md link that is outside the bundled docs tree unchanged, but docs/getting-started.md
          contains ../INSTALL.md and ../AGENTS.md links. In the built UI those files are absent (, ,
          and  are all missing), and the daemon static asset path returns 404 when a requested asset
          does not exist (). The result is that the docs surface now exposes clickable links that
          deterministically navigate readers to 404s instead of valid content.
        created_at: 2026-04-21T02:58:49.910Z
      - _ulid: 01KPQ0PDP95ZMHDBQG79BEDE24
        author: "@claude"
        body: "Fixed: Out-of-tree .md links are now rewritten to GitHub blob URLs at render time. Added
          resolveOutOfTreeHref() that computes the repo-root-relative path, and the renderer
          rewrites the href to repoUrl + path. The repoUrl is configured in vite-plugin-docs and
          embedded in the manifest at build time. Links like ../INSTALL.md from getting-started.md
          now point to https://github.com/lepahc/kynetic-spec/blob/main/INSTALL.md and open in a new
          tab as external links."
        created_at: 2026-04-21T03:17:43.753Z
    kind: blocker
