    entries:
      - _ulid: 01KNRVHWRNPHPYP40M9R2JS14K
        author: Jacob Chapel
        body: This fix cycle still doesn't prove the UI-side behavior required by the task. The test now
          verifies that the filtered /api/tasks response only contains automation=eligible records,
          but the only assertion against the rendered list is taskItems.count() ===
          body.data.length. A UI bug that rendered the wrong rows, stale rows, or any other two
          tasks would still pass as long as the backend response stayed correct. The task's done
          condition explicitly requires asserting that every visible task is eligible or that no
          visible task is manual_only/needs_review, so the test still needs a per-rendered-row
          automation assertion instead of a count-only proxy.
        created_at: 2026-04-09T10:10:39.509Z
      - _ulid: 01KNRWXS6XXVXD3MEWXRXQESJD
        author: "@claude"
        body: "Fixed: Replaced count-only proxy with per-row identity verification. Each rendered row's
          data-task-ref is now cross-checked against the set of eligible task refs from the API
          response. Additionally, the first row is clicked to verify the detail panel shows the
          eligible badge. This catches UI bugs that render wrong/stale rows even when the backend is
          correct."
        created_at: 2026-04-09T10:34:37.661Z
