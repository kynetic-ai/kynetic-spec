    entries:
      - _ulid: 01KW78EE7V003JQYJ1MTT6J06Z
        author: Jacob Chapel
        body: "MUST-FIX: The replacement workspace no longer exposes the spec related-sessions section or
          the spec-filtered 'View all sessions' navigation. @task-spec-session-context
          ac-spec-detail-sessions and ac-session-list-spec-filter require spec detail views to list
          related sessions and let users navigate to /sessions?spec_ref=@spec-slug. Because /items
          now redirects to /specs, this route is the active spec detail surface, but
          linkedWorkSection only renders generic per-session rows and no item-related-sessions
          section or view-all affordance. I verified the regression by running npm run test:e2e --
          tests/e2e/session-context.spec.ts -g 'spec detail lists related sessions': it fails at
          tests/e2e/session-context.spec.ts:194 because
          getByTestId('spec-detail-panel').getByTestId('item-related-sessions') is not found.
          Impact: users lose the existing spec-to-sessions workflow after the route replacement.
          Restore the Sessions section/view-all behavior in the workspace, and update tests only if
          the selectors intentionally change while preserving the behavior."
        created_at: 2026-06-28T13:59:30.811Z
    kind: blocker
