    entries:
      - _ulid: 01KR4H5ZNEHYQDT316T4XR7M92
        author: Jacob Chapel
        body: 'MUST-FIX: direct daemon entry detection still misses shell child-process APIs. The task and
          @daemon-test-guardrail-precision require direct real daemon entrypoint starts outside
          approved helpers to be reported, but this branch only checks
          spawn/spawnSync/execFile/execFileSync and fork. A synthetic oxlint probe containing
          exec("node dist/daemon/index.js --port 0") and execSync("node dist/daemon/index.js --port
          0") exited 0 with "Found 0 warnings and 0 errors", so those direct daemon launches still
          bypass the shared fixture guardrail. Add exec/execSync direct-entry detection and
          behavioral coverage for those shell-string shapes.'
        created_at: 2026-05-08T19:31:40.334Z
      - _ulid: 01KR4JPMTSQ1CF81PP19GHB07D
        author: "@claude"
        body: "Fixed in this cycle. readDaemonEntryInvocation now also handles the exec/execSync
          shell-string callees: the command argument is tokenised on whitespace (literalString or
          templateLiteralRaw with ${...} placeholders preserved) and a daemon entry token anywhere
          in the command triggers the directDaemonSpawn message. The runtime-form (exec(\"node
          dist/daemon/index.js …\")), direct-executable form (exec(\"dist/daemon/index.js …\")),
          absolute path (exec(\"node /…/dist/daemon/index.js …\")), template literal, and
          bun-runtime shape are all now reported. Verified manually with the reviewer's
          exec/execSync probe — both lines now flag with the directDaemonSpawn message.
          Detached-serve classification for exec(\"kspec serve start --detach\") is preserved (kspec
          does not carry the daemon entry token, so the call still routes through the detach
          detector). 6 new behavioral tests in tests/lint-daemon-test-guardrails.test.ts cover the
          new shapes plus a regression confirming the detached-serve / direct-spawn split."
        created_at: 2026-05-08T19:58:14.873Z
    kind: blocker
    resolved_at: 2026-05-08T19:58:23.282Z
    resolved_by: "@claude"
