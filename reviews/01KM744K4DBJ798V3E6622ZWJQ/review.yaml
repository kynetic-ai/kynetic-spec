      line_start: 519
      path: src/parser/task-data-manager.ts
      side: head
    entries:
      - _ulid: 01KM747BAN7EA89AMPSV30CMHR
        author: Jacob Chapel
        body: "Same-task serialization is still broken when mutateTask() overlaps with mutateTasks(). The
          single-task path takes the per-task mutex, but the batch path goes straight to
          mutateTasksAtomically() without acquiring those ULID locks, so both operations can mutate
          the same task concurrently. I reproduced it by running mutateTask(@test-task-pending) in
          parallel with mutateTasks([@test-task-pending, @test-task-secondary]) setting priority=1
          on both tasks: the final reload kept status=in_progress but reverted priority to the old
          value 2, so the batch update to the overlapping task was lost. That violates AC-9 and
          invalidates the comment above that no other mutation can change the target task between
          phases."
        created_at: 2026-03-21T02:40:09.557Z
    kind: blocker
