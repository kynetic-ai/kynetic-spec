        body: " no longer discovers the same task files as the existing loader, so valid tasks can disappear
          from listings.  reimplements discovery with a non-recursive , while  uses recursive  in .
          I reproduced this by copying the fixture  to :  returned 8 tasks, but  still returned 4.
          That breaks the manager's read surface for any repo that stores task files below the top
          level."
        created_at: 2026-03-21T02:39:35.196Z
    kind: blocker
  - _ulid: 01KM747BANWKDN72XRTE6FQXXA
    anchor:
      type: code
