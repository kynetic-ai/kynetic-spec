    entries:
      - _ulid: 01KV594V3EFFYHQSVG3M8JVRX3
        author: Jacob Chapel
        body: "MUST-FIX: Inline code-diff review threads still render recorded authors as raw strings
          instead of using ActorDisplay. This component is mounted by the review detail diff viewer
          for anchored code threads, so thread authors in the diff can disagree with the canonical
          actor rendering used elsewhere on the same review page. That violates @actor-display
          ac-1's same-actor consistency across surfaces and misses the task's thread-author adoption
          scope. Thread header and entry rows should receive/use the shared actor classifier and
          render these authors through the actor display primitive."
        created_at: 2026-06-15T09:17:34.190Z
      - _ulid: 01KV5FWW2GFT4A9BTW82NFECQJ
        author: "@claude"
        body: "Fixed: threaded the shared actor classifier from the review detail page through
          CodeDiffViewer → DiffFileView → DiffHunkView into DiffInlineThread. Thread header author
          and each entry author now render via the ActorDisplay primitive, so code-diff thread
          authors match the canonical actor rendering used elsewhere on the same review (ac-1).
          Without a classifier (static mode) they degrade to the unknown treatment (ac-2).
          Behavioral SSR test added in tests/web-ui-inline-thread-actors.test.ts."
        created_at: 2026-06-15T11:15:33.072Z
    kind: blocker
    resolved_at: 2026-06-15T11:15:49.747Z
