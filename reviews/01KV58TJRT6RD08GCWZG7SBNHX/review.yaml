        body: "MUST-FIX: Inline code-diff review threads still render recorded authors as raw strings
          instead of using ActorDisplay. This component is mounted by the review detail diff viewer
          for anchored code threads, so thread authors in the diff can disagree with the canonical
          actor rendering used elsewhere on the same review page. That violates @actor-display
          ac-1's same-actor consistency across surfaces and misses the task's thread-author adoption
          scope. Thread header and entry rows should receive/use the shared actor classifier and
          render these authors through the actor display primitive."
