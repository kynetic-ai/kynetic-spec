          strings instead of using ActorDisplay. This component is mounted by
          StructuredContentViewer on the review detail page for anchored review threads, so the same
          thread author can render canonically in the main Threads section but as the original
          string here. That violates @actor-display ac-1's same-actor consistency across surfaces
          and misses the task's thread-author adoption scope. Thread header and entry rows should
          receive/use the shared actor classifier and render these authors through the actor display
          primitive."
        created_at: 2026-06-15T09:17:37.848Z
