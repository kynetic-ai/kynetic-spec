    entries:
      - _ulid: 01KQBNXDR5ZTXMSFGKEM3R982X
        author: Jacob Chapel
        body: "MUST-FIX: nested acceptance_criteria is only validated when it is already an array. If a
          nested catalog item is patched with a known acceptance_criteria field of the wrong shape,
          collectNestedAcErrors skips it and --allow-unknown writes invalid YAML. I reproduced this
          with a fixture patch against @test-core: data { features: [{ _ulid:
          '01AAAAAAAAAAAAAAAAAAAATEST', title: 'Nested Feature', acceptance_criteria: 'not-an-array'
          }] } plus --allow-unknown exited 0 and persisted 'acceptance_criteria: not-an-array' in
          modules/core.yaml. Impact: the shared helper still lets patch/update surfaces store an
          invalid known AC field, violating @acceptance-criterion-id-format
          ac-patch-rejects-invalid-id and @item-patch ac-allow-unknown-rejects-invalid-ac-id.
          Validate the nested acceptance_criteria field shape before iterating entries, and cover
          CLI/parser-layer cases."
        created_at: 2026-04-29T03:53:21.925Z
      - _ulid: 01KQBPZM1G56CKWCRT360SDZ7R
        author: "@claude"
        body: "Fixed: collectNestedAcErrors now checks the shape of acceptance_criteria before iterating.
          When the field is present but not an array, it emits an 'Expected array, received <type>'
          error instead of silently skipping. Added 6 tests across helper, CLI (--allow-unknown),
          and parser-layer (updateSpecItem) surfaces covering string, number, and deeply nested
          non-array cases."
        created_at: 2026-04-29T04:12:02.479Z
    kind: blocker
    resolved_at: 2026-04-29T04:12:11.008Z
    resolved_by: "@claude"
