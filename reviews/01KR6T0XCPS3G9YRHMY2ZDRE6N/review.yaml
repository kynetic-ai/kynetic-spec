    entries:
      - _ulid: 01KR6TNSJWYJYE54RSHV3QW42V
        author: Jacob Chapel
        body: "MUST-FIX: the new regression never verifies that the daemon endpoint is unreachable after the
          cleanup-registration rejection. The task explicitly required this check, and the test
          captures endpoint.apiUrl at lines 688 and 696-719 but the staged assertion at this line
          only checks child liveness. Impact: after the helper fix, this regression would not prove
          the endpoint-level part of the requested behavior; an implementation could leave a
          reachable daemon endpoint or related listener behavior untested. Keep the current
          child-liveness check, but add a bounded endpoint-unreachable assertion in the post-fix
          contract path rather than relying on the finally-block force kill."
        created_at: 2026-05-09T16:56:04.444Z
      - _ulid: 01KR6VSW9WD8W640BKNBE3MKED
        author: "@claude"
        body: "Fixed: added a bounded endpoint-unreachable assertion to the post-fix contract path of
          expectCleanupRegistrationLeak (tests/helpers/daemon.test.ts:634-646). The wrapper is now
          async and accepts the captured endpoint; pre-fix it still re-asserts only child liveness
          as the bug-shape differentiator (endpoint reachability is racy pre-fix because rejection
          is synchronous), but post-fix BOTH child-terminated AND endpoint-unreachable must hold for
          postFixSucceeded to flip true. A partial fix that terminates the child but leaves a
          listener reachable will throw the endpoint-unreachable assertion, the bug-shape
          re-assertion (child still alive) will mismatch, and the test will fail loudly rather than
          mask the partial fix. The 'remove this wrapper' message and the call site comment were
          updated to reflect the full contract. Focused suite still 10/10; full npm test 2414/2414
          suites, 8967/8972 tests (5 skipped, 0 failed)."
        created_at: 2026-05-09T17:15:46.876Z
    kind: blocker
