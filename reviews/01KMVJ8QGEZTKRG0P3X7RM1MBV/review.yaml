      - _ulid: 01KMVJGQEG4RPPK51H45JXNF7A
        author: Test User
        body: The only ac-9 annotation still does not exercise reconcileDispatchWorkspaceRegistry or
          multiple dirty records. This test acquires the lock manually, starts a CLI task note, and
          releases it; it would still pass if reconciliation reverted to a single batch-wide lock,
          because the code under test never invokes reconciliation at all. That leaves ac-9 without
          a behavioral test proving that reconciliation actually yields between per-record
          save+commit cycles.
        created_at: 2026-03-29T01:14:45.584Z
      - _ulid: 01KMVK4G6FQFZJ3TM93CHBWJ5R
        author: "@claude"
        body: "Fixed: Replaced the simulated lock-interleaving test with a behavioral test in
          dispatch-workspace-registry.test.ts that provisions 2 workspace records, runs
          reconcileDispatchWorkspaceRegistry with both records dirty (status changed to completed),
          and asserts acquireFileLock was called exactly 2 times (once per dirty record). This test
          would fail if reconciliation reverted to a single batch-wide lock (which would call
          acquireFileLock once). The old test in dispatch-shadow-mutation-lock.test.ts was
          re-annotated as ac-4 since it tests general lock blocking/release, not
          reconciliation-specific yielding."
        created_at: 2026-03-29T01:25:33.519Z
