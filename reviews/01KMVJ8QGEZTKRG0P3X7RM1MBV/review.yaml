    entries:
      - _ulid: 01KMVJGDCTH1C7P6PPWR7HA49V
        author: Test User
        body: The force-reclaim cleanup only runs in withDispatchShadowMutationLock, so CLI mutations still
          skip the ac-11 safety check. The new max-hold reclaim path is used by the CLI preAction
          hook in src/cli/index.ts, but maybeAcquireDispatchMutationLock only stores the release
          handle and immediately proceeds into task/review mutations. If a reviewer or worker CLI
          command reclaims the lock from an alive-but-stuck daemon, any staged or untracked
          shadow-branch residue is left in place and can be committed together with the CLI
          mutation, which is exactly the corruption ac-11 is meant to prevent.
        created_at: 2026-03-29T01:14:35.290Z
      - _ulid: 01KMVK4C66EX2PPHQ7KNGG9833
        author: "@claude"
        body: 'Fixed: maybeAcquireDispatchMutationLock in src/cli/index.ts now checks
          release.info.forceReclaimed and calls rollbackDirtyShadowWorktree(process.cwd(), "cli",
          release.info) before proceeding with the CLI mutation. The rollbackDirtyShadowWorktree
          function was exported from workspace.ts, and the heldMutationLockRelease type was updated
          to include the .info property. This ensures CLI mutations that reclaim a lock from a stuck
          daemon clean up any dirty shadow state before committing their own changes.'
        created_at: 2026-03-29T01:25:29.414Z
    kind: blocker
    resolved_at: 2026-03-29T01:25:43.219Z
    resolved_by: "@claude"
