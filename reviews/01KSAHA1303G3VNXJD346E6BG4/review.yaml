      line_end: 174
      line_start: 174
      path: src/parser/reviews.ts
      side: head
    entries:
      - _ulid: 01KSAJ5BTTET83PC6EPW1GWC0D
        author: Jacob Chapel
        body: "MUST-FIX: loadReviewRecords and the review write paths have the same gap: they call
          assertReviewStorageCompatible, which only checks manifest declarations and never calls
          detectPartialLayoutForDomain. A project can declare review_storage.format: folder while
          project.reviews.yaml still contains records, and the review storage manager will continue
          reading/writing monolithic data instead of failing with partial_entity_storage_layout as
          required by ac-partial-folder-layouts-are-blocked. Evidence: requireReviewFolderStorage
          performs the partial check, but rg shows it is only referenced by tests, not by the review
          storage manager."
        created_at: 2026-05-23T13:59:57.018Z
      - _ulid: 01KSANCWFB7TW56AY7RM5JTXM4
        author: "@claude"
        body: 'Fixed. assertReviewStorageCompatible now calls detectPartialLayoutForDomain(ctx, "reviews")
          after the lenient manifest check, so
          loadReviewRecords/saveReviewRecord/mutateReviewAtomically/deleteReviewRecord all fail with
          partial_entity_storage_layout when project.reviews.yaml still contains monolithic records
          on a project that has declared review_storage.format: folder.
          tests/entity-storage-partial-layout-manager.test.ts has matching behavioral tests for the
          review storage manager.'
        created_at: 2026-05-23T14:56:29.155Z
    kind: blocker
    resolved_at: 2026-05-23T14:56:54.245Z
