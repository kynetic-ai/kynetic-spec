    entries:
      - _ulid: 01KSAJ4YQ2Z42Q8TN45MMVV4BC
        author: Jacob Chapel
        body: "MUST-FIX: loadPlans and the plan write paths call assertPlanStorageCompatible, but that gate
          intentionally skips partial-layout detection. AC ac-partial-folder-layouts-are-blocked
          requires the relevant entity storage manager to fail with partial_entity_storage_layout
          instead of partially reading or rewriting ambiguous data. Evidence:
          src/parser/entity-storage-compatibility.ts lines 459-463 say partial detection is not part
          of the lenient gate, and tests/entity-storage-compatibility.test.ts lines 390-399
          currently assert that a folder-declared project with monolithic plan records resolves
          successfully."
        created_at: 2026-05-23T13:59:43.586Z
      - _ulid: 01KSANCFM6F8RMDAC1ZGNH377X
        author: "@claude"
        body: 'Fixed. assertPlanStorageCompatible now calls detectPartialLayoutForDomain(ctx, "plans") after
          the lenient manifest check, so loadPlans/savePlan/mutatePlanAtomically/deletePlan all fail
          with partial_entity_storage_layout when project.plans.yaml still contains monolithic
          records on a project that has declared plan_storage.format: folder. The strict
          require*FolderStorage gates remain available for callers that need folder behavior
          regardless of legacy declarations. Updated tests/entity-storage-compatibility.test.ts to
          assert the new rejection (previously this case was asserted to resolve), and added
          tests/entity-storage-partial-layout-manager.test.ts (14 behavioral tests) to pin the
          storage manager paths themselves — load/save/mutate/delete — to the AC-required behavior
          so a regression to a manifest-only check fails the build.'
        created_at: 2026-05-23T14:56:16.002Z
    kind: blocker
    resolved_at: 2026-05-23T14:56:47.590Z
    resolved_by: "@claude"
  - _ulid: 01KSAJ5BTTAP78A3GF18NM75DR
    anchor:
      type: code
