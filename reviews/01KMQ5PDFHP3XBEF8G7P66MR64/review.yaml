threads:
  - _ulid: 01KMQ6BN6VZ6Y5H2CPKP3KP6C6
    anchor:
      type: code
      commit: c96e530ea4df135b240af245f6e4f838d7c21c82
      line_end: 551
      line_start: 548
      path: packages/daemon/src/routes/items.ts
      side: head
    entries:
      - _ulid: 01KMQ6BN6WYY8KCR1WWAC3HEBP
        author: "@claude"
        body: "GET /api/items/:ref/tasks still bypasses the cache entirely: it calls initContext(),
          loadAllItems(), and loadAllTasks() unconditionally before resolving the ref. I reproduced
          this with a warm in-memory tasks/items cache and the backing project files removed; the
          request failed instead of serving the linked-task summary from cache. That leaves this
          summary endpoint outside ac-serve-from-memory and reintroduces disk work on hot reads."
        created_at: 2026-03-27T08:25:18.812Z
      - _ulid: 01KMQ7F4ZXTAKCTXJZ6HV32NKA
        author: "@claude"
        body: "Fixed: GET /api/items/:ref/tasks now checks entity cache for task/item indexes when both
          domains are ready, falling back to initContext/loadAllItems/loadAllTasks only when cache
          is unavailable. Uses the same pattern as /:ref/sessions. The response mapping handles both
          TaskSummary (notes_count/todos_count fields) and LoadedTask (notes/todos arrays)."
        created_at: 2026-03-27T08:44:41.853Z
    kind: blocker
    resolved_at: 2026-03-27T08:45:03.232Z
    resolved_by: "@claude"
  - _ulid: 01KMQ6BPKJ71TSTCFCWFM30TV0
    anchor:
      type: code
      commit: c96e530ea4df135b240af245f6e4f838d7c21c82
      line_end: 495
      line_start: 487
      path: packages/daemon/src/routes/sessions.ts
      side: head
    entries:
      - _ulid: 01KMQ6BPKJADK4K04E13Z288A4
        author: "@claude"
        body: GET /api/sessions/:id still performs disk-backed ID resolution before consulting the ready
          session cache. Even when the detail/index tiers are warm, resolveSessionId() scans
          .kspec-sessions first; with a warm cache and the sessions directory removed, the request
          failed before the cached detail could be used. That violates the hot-read path promised by
          ac-serve-from-memory for cached session detail.
        created_at: 2026-03-27T08:25:20.242Z
      - _ulid: 01KMQ7F8RGSGC0PT2QY9Z66MF3
        author: "@claude"
        body: "Fixed: When sessions domain is ready, session ID resolution now uses the cached session index
          (exact match then prefix match) instead of disk-based resolveSessionId(). Falls back to
          disk resolution only when the cache is not ready or when the index is null."
        created_at: 2026-03-27T08:44:45.712Z
    kind: blocker
    resolved_at: 2026-03-27T08:45:06.665Z
    resolved_by: "@claude"
  - _ulid: 01KMQ6BR0NKSGZAS5BHSPT5P46
    anchor:
      type: code
      commit: c96e530ea4df135b240af245f6e4f838d7c21c82
      line_end: 960
      line_start: 885
      path: src/daemon/entity-cache.ts
      side: head
    entries:
      - _ulid: 01KMQ6BR0NG02RMFK0TK3JS9V4
        author: "@claude"
        body: "writeThrough() marks the domain to skip the next watcher invalidation before it knows whether
          the reload succeeded, and invalidateDomain() consumes that flag unconditionally. I
          reproduced this by forcing loadDomain() to fail once: the cache entered degraded state,
          then the subsequent invalidateDomain() performed zero reloads because the watcher event
          was dropped. A failed write-through can therefore leave the cache stale/degraded until
          some later unrelated change re-invalidates the domain."
        created_at: 2026-03-27T08:25:21.685Z
      - _ulid: 01KMQ7FC57YR7NNQPZ0K15KJJR
        author: "@claude"
        body: "Fixed: writeThrough() now calls loadDomain() first and only sets markWriteThrough() after it
          succeeds. If loadDomain() fails (throws), the skip flag is never set, so the subsequent
          watcher invalidation proceeds normally and can recover the domain from degraded state."
        created_at: 2026-03-27T08:44:49.191Z
    kind: blocker
    resolved_at: 2026-03-27T08:45:11.136Z
    resolved_by: "@claude"
  - _ulid: 01KMQ6BSDHDZ38D3KB1BGFHSF1
    anchor:
      type: code
      commit: c96e530ea4df135b240af245f6e4f838d7c21c82
      line_end: 43
      line_start: 43
      path: scripts/test.cjs
      side: head
    entries:
      - _ulid: 01KMQ6BSDHTJNC9MXGZACNFRQ2
        author: "@claude"
        body: The test runner still treats only dist/daemon/index.ts as the daemon build artifact, but this
          snapshot adds a new required file at dist/daemon/entity-cache.ts and the new cache-route
          test imports it directly. I reproduced runner.checkBuild() returning {"ok":true} after
          temporarily removing dist/daemon/entity-cache.ts, so npm test can now reuse an incomplete
          dist/ instead of forcing a rebuild. That makes the verification pipeline unsound for this
          change set.
        created_at: 2026-03-27T08:25:23.121Z
      - _ulid: 01KMQ7FFR0PZHWHBWDMZQSEVAY
        author: "@claude"
        body: "Fixed: Added dist/daemon/entity-cache.ts to BUILD_ARTIFACTS in scripts/test.cjs. Updated the
          two test-runner.test.ts test cases (succeeds-when-all-present and stale-build-detection)
          to include the new artifact in their fixture setup. All tests pass."
        created_at: 2026-03-27T08:44:52.864Z
    kind: blocker
    resolved_at: 2026-03-27T08:45:14.505Z
