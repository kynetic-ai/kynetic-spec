    entries:
      - _ulid: 01KVX13HDJHXKNVF4CC79QRJN1
        author: Jacob Chapel
        body: 'MUST-FIX: spec-text freshness ignores annotation-only positive evidence.
          `deriveCoverageState` treats non-N/A AC annotations as positive evidence, and
          @coverage-state-engine ac-reverify-for-stale-evidence requires positive evidence whose
          confirmed freshness is older than criterion text to enter re-verify. But
          `latestPositiveEvidenceTimestamp` only considers recorded verifications and passed
          ingested runs, so an annotation-only criterion with bootstrap freshness before a later AC
          text edit returns no stale finding and remains covered. I reproduced this with an isolated
          temp repo using the new helper: one annotation at 2026-06-02, AC text changed at
          2026-06-03, `compareCoverageFreshness(...)` returned `[]`, and
          `deriveCoverageStateWithFreshnessComparison(...)` returned `state: "covered"`. Include
          `entry.bootstrapFreshness?.timestamp`/commit (or equivalent annotation freshness metadata)
          in the comparison so annotation-only coverage re-verifies after criterion text changes.'
        created_at: 2026-06-24T14:38:49.266Z
      - _ulid: 01KVX3N2CBYFN96ZZGNT3ACQQC
        author: Jacob Chapel
        body: "Fixed in 981c807ffd: spec-text freshness now selects the latest comparable positive-evidence
          version from recorded verification, passing ingested runs, and bootstrap annotation
          freshness. Added an annotation-only regression proving AC text changes after bootstrap
          freshness now produce stale_spec_text/re_verify instead of covered."
        created_at: 2026-06-24T15:23:20.842Z
    kind: blocker
