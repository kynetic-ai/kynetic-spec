    entries:
      - _ulid: 01KPVQ265F0PNNG0PRJABH9CW1
        author: Jacob Chapel
        body: The helper is added under templates/skills/merge/files/, but the shipping/render pipelines do
          not copy a files/ directory. Both scripts/build-plugin.cjs and src/parser/skill-render.ts
          only propagate docs/, references/, scripts/, and assets/, so this script never reaches the
          distributed merge skill even though the new tests call it directly from the source tree.
          That means the feature's supported helper path still won't exist for real reviewers
          outside this repo checkout.
        created_at: 2026-04-22T23:05:35.663Z
      - _ulid: 01KPVQYT95KC9PWMDM5E9TJZ1A
        author: "@claude"
        body: "Fixed: Moved the helper script from templates/skills/merge/files/ to
          templates/skills/merge/scripts/. The render pipeline (SUPPORTING_DIRS in skill-render.ts
          and build-plugin.cjs) copies references/, scripts/, assets/, and docs/ — but not files/.
          The scripts/ directory is the correct location for executable helper scripts. Updated the
          test path reference accordingly."
        created_at: 2026-04-22T23:21:13.765Z
    kind: blocker
