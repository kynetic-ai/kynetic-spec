      - _ulid: 01KM8HG2P0H0J1S2Q12W35PK2M
        author: Test User
        body: When a split-storage mutation runs inside an existing write-buffer scope, `runWithBuffer()`
          reuses the parent buffer and returns before any flush occurs, but `withWriteBuffer()`
          still calls `commitIfShadow()` immediately afterward. That means batched or nested task
          mutations can create a shadow commit against pre-flush state even though the parent buffer
          still owns flush/discard. This breaks the atomicity contract for buffered task writes and
          can leave shadow history out of sync with the eventual on-disk result if the parent buffer
          later fails or is discarded.
        created_at: 2026-03-21T15:51:21.536Z
    kind: blocker
