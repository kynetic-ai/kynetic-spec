    entries:
      - _ulid: 01KR6Y2XHA5225G66XZHRP14B5
        author: Jacob Chapel
        body: "MUST-FIX: the cleanup-binding check treats any non-null initializer as a valid daemon cleanup
          target. That proves the closure has some value, but not that it owns the pid/child/stop
          handle for the detached daemon that was just started. I verified this with an oxlint
          probe: a test containing  exits 0 with no no-leaky-test-daemon report. That violates
          @daemon-test-guardrail-precision ac-detached-cleanup-bound-before-observation and the task
          requirement that cleanup be associated with the just-started daemon, because this cleanup
          can kill an unrelated process while the new detached daemon leaks."
        created_at: 2026-05-09T17:55:40.202Z
      - _ulid: 01KR6Y6H8NHY33X1PSDKV49HRK
        author: Jacob Chapel
        body: 'Probe sample details omitted by shell quoting in the initial body: const pid = 12345;
          runKspec("serve start --detach --port 3456"); onTestFinished(() => process.kill(pid,
          "SIGTERM")); expect(true).toBe(true); The one-off oxlint run for that sample returned
          exit=0 / Found 0 warnings and 0 errors.'
        created_at: 2026-05-09T17:57:38.708Z
      - _ulid: 01KR70AM8V0904D6QKBGJPSNN8
        author: "@claude"
        body: >-
          Fixed by adding an ownership leg to cleanupCallbackBindingStatus. The previous
          concretely-bound check accepted any non-null/non-undefined initializer; the new check
          additionally requires the captured identifier's most recent concrete value-producing
          binding to end at or after the detached-start position. Parameters, class declarations,
          function declarations, and undeclared/global identifiers are treated as not owned (they
          cannot represent the daemon this test just started).


          The reviewer's probe `const pid = 12345; runKspec("serve start --detach --port 3456");
          onTestFinished(() => process.kill(pid, "SIGTERM")); expect(true).toBe(true);` now flags
          via cleanupClosureUnbound, identifying `pid` as the offender. Verified through a one-off
          oxlint run on a temp project (exit 1, message reproduced verbatim).


          The canonical safe shapes still pass:

          - `runKspec(...); const pid = readPidFromFile(); onTestFinished(() => process.kill(pid,
          ...))` (declarator ends after the detached start).

          - `const child = spawn("kspec", ["serve", "start", "--detach"]); onTestFinished(() =>
          child.kill("SIGTERM"))` (declarator's range encompasses the spawn — the binding's
          initializer IS the detached start).

          - `let pid; runKspec(...); pid = readPidFromFile(); onTestFinished(() => process.kill(pid,
          ...))` (assignment after the detached start re-binds).


          Three new regression tests were added in tests/lint-daemon-test-guardrails.test.ts to lock
          the fix in place: literal-pid-bound-before-start,
          unrelated-spawn-child-handle-bound-before-start, and imported-pid (pre-existing module
          binding cannot represent the just-started daemon). detachedStartNode is threaded through
          subtreeContainsDaemonCleanupCall, statementContainsCleanup, hasCleanupAfter,
          isInTryWithFinallyCleanup, findUnboundCleanupClosure, and scanForUnboundCleanupCallback so
          the ownership comparison runs at every existing binding-check call site.


          Validation: focused lint suites pass (225 → 228 tests with the 3 new regressions). Full
          npm test passes (8982 passed, 5 pre-existing skipped, 1996.7s). kspec validate --refs
          --warnings-ok and --completeness --warnings-ok both pass.
        created_at: 2026-05-09T18:34:50.011Z
