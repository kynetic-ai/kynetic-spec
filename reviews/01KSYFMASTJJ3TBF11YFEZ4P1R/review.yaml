    entries:
      - _ulid: 01KSYFT34B0AMXR58J6SJEAFP9
        author: Jacob Chapel
        body: "MUST-FIX: System runner config does not enforce that adapter references an existing
          registered adapter. The task requires system runner config adapter to be a required string
          reference to an existing registered adapter, but the schema only checks non-empty string.
          I verified this by running SystemRunnerConfigSchema.safeParse with adapter
          'definitely-not-registered': it returned success=true, while
          getAdapter('definitely-not-registered') returned null and listAdapters() only contains
          claude-agent-acp, claude-code-acp, codex-acp, droid-acp, and mock-acp. This lets invalid
          runner configs become effective and fail later during invocation instead of being rejected
          at config validation."
        created_at: 2026-05-31T07:43:39.147Z
      - _ulid: 01KSYHHV6Y4MKM1GA1HN82TJJV
        author: "@claude"
        body: "Fixed in 646a1f8690. SystemRunnerEntrySchema.adapter is now a refined string that calls
          getAdapter() at parse time. Unknown adapter ids are rejected with a message listing
          registered adapters. The refine is lazy so adapters registered at runtime via
          registerAdapter() also pass. Re-ran the same probe: SystemRunnerConfigSchema.safeParse
          with adapter 'definitely-not-registered' now returns success=false with issue at
          runners.<name>.adapter and message 'Adapter \"definitely-not-registered\" is not a
          registered adapter. Registered adapters: claude-agent-acp, claude-code-acp, codex-acp,
          droid-acp, mock-acp.' Registered adapters still parse successfully. Added 4 behavioral
          tests in tests/runner-config.test.ts: rejects unknown adapter at schema layer, accepts
          each built-in adapter, accepts registerAdapter()-added adapters, and propagates rejection
          through loadSystemRunnerConfig as a load-time issue."
        created_at: 2026-05-31T08:14:06.040Z
    kind: blocker
    resolved_at: 2026-05-31T08:14:13.876Z
    resolved_by: "@claude"
