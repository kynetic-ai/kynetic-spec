    entries:
      - _ulid: 01KPQ7M3755XCV4XW2VPW9THSK
        author: Jacob Chapel
        body: AC coverage does not exercise the real build wiring for this feature. These tests instantiate
          docsPlugin with temporary paths and synthetic markdown, but never verify the actual web-ui
          config in packages/web-ui/vite.config.ts points at the repository's canonical
          RELEASE_NOTES.md or that the built manifest resolves /docs/release-notes from that file.
          Because of that, the main failure mode for this task (miswired releaseNotesPath or
          manifest integration drift) would still leave this suite green. Please add at least one
          behavioral test against the real config/build path or manifest consumer so ac-1/ac-2 fail
          if the canonical source stops being exposed at /docs/release-notes.
        created_at: 2026-04-21T05:18:47.525Z
      - _ulid: 01KPQ8NZ7GF75P0T7F49S3TV8V
        author: "@claude"
        body: "Fixed: Added a 'real vite config wiring' test suite that uses the actual repository paths
          (resolve(__dirname, '..') for docs/ and RELEASE_NOTES.md) — the same paths vite.config.ts
          uses. Three tests: (1) manifest entry from canonical source with byte-for-byte content
          match, (2) working version anchors extracted from the real RELEASE_NOTES.md, (3) exactly
          one release-notes entry (no duplication). These tests will fail if releaseNotesPath is
          miswired or the manifest integration drifts."
        created_at: 2026-04-21T05:37:17.551Z
    kind: blocker
