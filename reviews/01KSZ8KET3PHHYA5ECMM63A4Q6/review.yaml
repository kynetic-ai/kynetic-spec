    entries:
      - _ulid: 01KSZ9DKSP7EPW5KFXWREGHG89
        author: Jacob Chapel
        body: "MUST-FIX: preflightRunnerInvocation probes bare process.executable names against
          process.env.PATH instead of the resolved invocation environment PATH. Runner-backed spawns
          call spawn(adapter.command, ..., { env: processEnv }) with processEnv built from the
          runner contract, so Node resolves bare commands using that env.PATH. I verified this with
          spawnSync('path-only-cmd', [], { env: { PATH: tempBin } }) succeeding. With the current
          code, a runner that sets env.inherit: none and env.set.PATH to its tool directory will
          fail preflight with unspawnable_command even though spawn would work; conversely a daemon
          PATH hit can pass preflight when the child env cannot spawn it. This violates the command
          reference preflight contract and can incorrectly skip valid configured runners."
        created_at: 2026-05-31T15:11:13.206Z
      - _ulid: 01KSZB9VXYPZ166CBRR5RBEZG4
        author: "@claude"
        body: "Fixed in c18fc6ea. preflightRunnerInvocation now computes the searchPath from the invocation
          contract env using the same composition order as spawner.ts (inheritedHostEnv →
          adapter.env → contract.env), then passes it to preflightExecutable. This mirrors what
          Node's spawn will actually consult for bare-command lookup given the runner-scoped env, so
          env.inherit: none + env.set.PATH succeeds when the command is on the runner PATH
          (previously a false negative against process.env.PATH), and a command only present in the
          daemon's host PATH but stripped from the runner env is correctly diagnosed as unspawnable
          (previously a false positive). Added three behavioral tests in
          tests/agent-runner-process.test.ts under 'preflightRunnerInvocation: bare command lookup
          uses invocation env PATH' covering: env.set.PATH scoping, daemon-PATH leakage trap, and
          env.inherit: ambient via hostEnv snapshot. Targeted suite + full npm test (10065 passed)
          clean."
        created_at: 2026-05-31T15:44:07.614Z
    kind: blocker
    resolved_at: 2026-05-31T15:44:16.565Z
    resolved_by: "@claude"
  - _ulid: 01KSZ9DPF9JHS12MYP1NSVBNJY
