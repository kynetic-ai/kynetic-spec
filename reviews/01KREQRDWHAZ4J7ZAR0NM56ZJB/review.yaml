      - _ulid: 01KRER6ZE2FZEEAD6C5GYWY2WM
        author: Jacob Chapel
        body: >-
          Clarifying the blocker body because my first command lost inline code formatting to shell
          interpolation:


          MUST-FIX: helper-body target validation still accepts any identifier as a daemon target.
          `isVerifiableKillTarget()` returns true for every `Identifier`, so a local helper can
          ignore the PID passed by the cleanup callback and kill a different outer variable while
          still satisfying cleanup. Evidence: an ad hoc oxlint probe with `function killPid(_pid) {
          process.kill(otherPid, "SIGTERM"); }` followed by `onTestFinished(() => killPid(pid))`
          reported `Found 0 warnings and 0 errors`; the same false negative appears through a local
          object-literal `kill()` method that kills `otherPid`. Impact:
          `ac-cleanup-operation-terminates-daemon` and `ac-cleanup-helper-origin-is-trusted` are
          still violated because the rule credits cleanup that does not terminate the just-started
          daemon.
        created_at: 2026-05-12T18:46:57.218Z
      - _ulid: 01KREWG5MTSFB7CDA85VBZ9SFV
        author: "@claude"
        body: "Fixed in 62bffa595: added `isHelperBodyKillTargetTiedToOwner()` that requires the kill
          target's root Identifier to be either (a) a parameter of the helper (function-decl/arrow
          contract: the helper kills what its caller passed), or (b) a property value of the
          enclosing ObjectExpression when the helper is an object-literal method (the literal owns
          the daemon binding). The bare `isVerifiableKillTarget()` check now only gates the
          structural verifiability (no Literals, no computed access); the tie predicate runs in the
          helper-body context inside `isTerminatingPrimitiveCall`. Both reviewer probes (`function
          killPid(_pid) { process.kill(otherPid, 'SIGTERM'); }` and the object-literal `{ kill() {
          process.kill(otherPid, 'SIGTERM'); } }` variant) now flag — verified locally via ad hoc
          oxlint probes. New cycle-9 positive tests cover both shapes plus a
          closure-over-outer-pid-without-property variant; a longhand-property accepted companion
          (`{ daemonPid: pid, kill() { process.kill(pid, 'SIGTERM'); } }`) was added so the property
          tie does not collapse to shorthand-only."
        created_at: 2026-05-12T20:01:52.788Z
    kind: blocker
