threads:
  - _ulid: 01KREPS6YAF5PVPM7DWWB4F1QJ
    anchor:
      type: structured
      ref: "@plan-dispatch-workspace-provisioning-lease-protection"
      section: specs
    entries:
      - _ulid: 01KREPS6YAJHNADH9VW13R1FNW
        author: Hermes
        body: "The plan puts “Updates to Existing Spec” entries in the structured ## Specs block for
          @dispatch-workspace-registry, @dispatch-runtime-bootstrap-contract, and
          @agent-dispatch-engine. Derivation materializes ## Specs entries as new spec items, with
          collision suffixing, rather than applying AC updates to the existing specs. As written,
          approving/deriving this plan risks creating duplicate specs and redirecting task spec_refs
          to derived duplicates. Fix by either removing the structured Specs block and making Phase
          1 tasks explicitly update the existing refs, or intentionally model these as new child
          specs instead."
        created_at: 2026-05-12T18:21:57.578Z
    kind: blocker
  - _ulid: 01KREPSE0E83Z9058FJP6JX2Y8
    anchor:
      type: structured
      ref: "@task-add-dispatch-workspace-provisioning-lease-acs"
      section: tasks
    entries:
      - _ulid: 01KREPSE0F3FFV9TTXFQR3E2FN
        author: Hermes
        body: The Phase 1 spec-update tasks say to add ACs “exactly as drafted in this plan” but do not
          embed the full Given/When/Then AC payloads in the task descriptions. If the structured
          Specs block is removed to avoid duplicate derivation, an agent executing the derived task
          from kspec task get would not have the exact AC text. Make each spec-update task
          standalone by including the exact AC payloads or precise batch/CLI payloads.
        created_at: 2026-05-12T18:22:04.815Z
    kind: blocker
  - _ulid: 01KREPSMXTJCEN5ZFT08ETYW6T
    anchor:
      type: structured
      field: ac-expired-provisioning-lease-recovery
      ref: "@dispatch-workspace-registry"
      section: acceptance_criteria
    entries:
      - _ulid: 01KREPSMXVNV37612SR81DXJX9
        author: Hermes
        body: The lease owner/liveness recovery contract is underspecified. The plan requires an owner
          process identity and says cleanup should check whether a live dispatcher process still
          owns an expired lease, but the schema only defines owner:string and does not specify
          daemon instance identity, pid/start marker, spawn attempt/session id, or exact
          post-restart liveness rules. This is central to safe cleanup recovery; define the owner
          identity and abandoned-vs-live recovery rule explicitly.
        created_at: 2026-05-12T18:22:11.899Z
    kind: blocker
  - _ulid: 01KREPSVTHXYMJNQPAJFWFM7HK
    anchor:
      type: structured
      field: ac-provisioning-lease-recorded
      ref: "@dispatch-workspace-registry"
      section: acceptance_criteria
    entries:
      - _ulid: 01KREPSVTHY0ABW1BP0VBF1FY2
        author: Hermes
        body: This AC bundles many phases, fields, and lifecycle constraints into one criterion. Consider
          splitting field recording, lifecycle protection, success finalization, failure
          finalization, and abandoned recovery into smaller testable ACs so implementation and
          regression tests can map cleanly.
        created_at: 2026-05-12T18:22:18.961Z
    kind: question
  - _ulid: 01KREPT3A6HWFV90S25H3KMGF6
    anchor:
      type: structured
      ref: "@task-add-dispatch-workspace-provisioning-lease-schema"
      section: tasks
    entries:
      - _ulid: 01KREPT3A6TCVDQWY0JFTCYWYE
        author: Hermes
        body: The AC says the lease includes workspace id “when known,” but the schema task omits a
          workspace_id field. If the containing workspace record is intended to provide the id, say
          that explicitly; otherwise add workspace_id to the lease schema.
        created_at: 2026-05-12T18:22:26.631Z
    kind: question
