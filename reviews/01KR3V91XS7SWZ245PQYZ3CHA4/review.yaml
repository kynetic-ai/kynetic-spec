        author: Jacob Chapel
        body: The AC is written for any daemon test helper that starts a child process, but the task
          coverage only adds/fixes mock-daemon environment hygiene. The existing real-daemon fixture
          already has env stripping in tests/helpers/daemon.ts and tests/helpers/daemon.test.ts, yet
          this plan does not tell any task to add the new spec annotation or otherwise make that
          existing coverage part of this plan. Either narrow the AC to mock daemon children, or add
          explicit real-fixture validation/annotation work so the plan is standalone and the AC is
          fully covered.
        created_at: 2026-05-08T13:10:29.400Z
    kind: blocker
