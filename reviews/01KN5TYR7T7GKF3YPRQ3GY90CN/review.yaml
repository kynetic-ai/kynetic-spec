threads:
  - _ulid: 01KN5TZCZ7RC0RD0EEWVCWDNET
    anchor:
      type: structured
      ref: "@plan-branch-creation"
      section: traits
    entries:
      - _ulid: 01KN5TZCZ75EW36398ME96XX2Z
        author: "@claude"
        body: "plan-branch-creation is a CLI command that creates branches and updates shadow state, but has
          no traits. It should have: trait-json-output (ac-reports-result mentions output),
          trait-semantic-exit-codes (error cases need exit code semantics), trait-error-guidance
          (remote fetch failures, invalid refs), and trait-shadow-commit (updates plan record on
          shadow branch). Compare with @deterministic-task-branch-helper which has all three of
          json-output, semantic-exit-codes, and error-guidance."
        created_at: 2026-04-02T00:54:59.303Z
    kind: blocker
  - _ulid: 01KN5TZHE113CSFPZVKDK45SVP
    anchor:
      type: structured
      ref: "@plan-branch-association"
      section: traits
    entries:
      - _ulid: 01KN5TZHE1BG15MZWDS55F01NG
        author: "@claude"
        body: plan-branch-association is a data model spec for plan set --branch, which mutates shadow
          state. Should it carry trait-shadow-commit? The parent @plan-support already has it, but
          the child requirement doesn't inherit parent traits — each spec must declare its own. The
          plan set command for status already exists under @plan-crud, so if --branch is just
          another plan set flag, the trait coverage may come from @plan-crud's existing trait
          bindings. Clarify whether this spec describes new command behavior or just schema.
        created_at: 2026-04-02T00:55:03.873Z
    kind: question
  - _ulid: 01KN5TZWWS08CH6X1Y46WE6Y5M
    anchor:
      type: structured
      field: ac-stale-target-detection
      ref: "@plan-branch-dispatch-target"
      section: acceptance_criteria
    entries:
      - _ulid: 01KN5TZWWTK2M30TJDK9KYEZX0
        author: "@claude"
        body: "ac-stale-target-detection has a compound then-clause: 'the stale integration target is
          detected AND the workspace record is updated.' These are two distinct verifiable behaviors
          — detection and remediation. Split into two ACs: one for detecting the mismatch, one for
          updating the target. This also mirrors @dispatch-workspace-configuration ac-6 which
          already covers config-change-driven stale detection — clarify how plan-branch stale
          detection interacts with or supersedes that existing AC."
        created_at: 2026-04-02T00:55:15.610Z
    kind: blocker
  - _ulid: 01KN5V017XHVDXK1BS4ZYDDYJD
    anchor:
      type: structured
      ref: "@plan-branch-dispatch-target"
      section: acceptance_criteria
    entries:
      - _ulid: 01KN5V017XS6SHDF848NY68S0A
        author: "@claude"
        body: "Overlap with @dispatch-workspace-configuration: ac-6 on that existing spec already describes
          'when the operator changes dispatch.base_branch, the dispatcher detects the mismatch and
          updates or surfaces the conflict.' This plan's ac-stale-target-detection describes the
          same pattern but for plan branches. Both specs describe stale integration target behavior
          in the same function (resolveDispatchWorkspaceConfig). The plan needs to clarify how these
          interact — does plan-branch override config-change detection? Do they compose? Should
          ac-stale-target-detection reference @dispatch-workspace-configuration ac-6 as a
          foundation?"
        created_at: 2026-04-02T00:55:20.062Z
    kind: blocker
  - _ulid: 01KN5V0CHE05GEE4A6E7HD1EQZ
    anchor:
      type: structured
      field: ac-plan-branch-missing
      ref: "@plan-branch-dispatch-target"
      section: acceptance_criteria
    entries:
      - _ulid: 01KN5V0CHEACX97CT6T9K025XW
        author: "@claude"
        body: ac-plan-branch-missing says the dispatcher 'attempts to fetch the branch from configured
          remotes before failing.' What happens after failing? The AC doesn't describe the failure
          behavior. Should the task be blocked? Should it fall through to the default integration
          branch? Should it surface an error to the operator? Compare with
          @dispatch-workspace-configuration ac-4 which specifies 'fails with actionable guidance.'
          The then-clause needs the observable outcome.
        created_at: 2026-04-02T00:55:31.630Z
    kind: question
  - _ulid: 01KN5V0GS530568K37ZTA4TH4W
    anchor:
      type: structured
      field: ac-deterministic-name
      ref: "@plan-branch-creation"
      section: acceptance_criteria
    entries:
      - _ulid: 01KN5V0GS54MDCJKRV4X9ZBF0V
        author: "@claude"
        body: ac-deterministic-name includes 'plan/<normalized-slug>/<short-ref>' — this is the naming
          convention, which is fine for a spec. But the task description goes further and specifies
          the exact normalization algorithm. That's task-level detail and belongs only there, which
          it does. The AC is borderline — consider whether 'a branch is created using a
          deterministic naming convention derived from the plan identity' is cleaner, leaving the
          exact pattern to implementation. Minor — the current form is acceptable.
        created_at: 2026-04-02T00:55:35.973Z
    kind: nit
  - _ulid: 01KN5V0VZBMTJDYP08T2X0WJKN
    anchor:
      type: structured
      ref: "@plan-branch-lifecycle-guidance"
      section: specs
    entries:
      - _ulid: 01KN5V0VZBA3MH2FYS1098JWRS
        author: "@claude"
        body: plan-branch-lifecycle-guidance has only 2 ACs (derive-hint and derive-existing), both about
          derive output. The spec title says 'Lifecycle Guidance' which implies broader awareness —
          what about plan completion? When a plan completes, should the user be informed the plan
          branch can be merged/deleted? What about plan get showing branch status? If the scope is
          intentionally narrow (derive-only), the title/description should match — e.g., 'Plan
          Branch Derive Guidance' instead of 'Lifecycle.'
        created_at: 2026-04-02T00:55:47.435Z
    kind: question
  - _ulid: 01KN5V10A6RGCQEMKPJB0TWZCD
    anchor:
      type: structured
      ref: "@plan-branch-dispatch-target"
      section: specs
    entries:
      - _ulid: 01KN5V10A64KY781E52ZBFZJZS
        author: "@claude"
        body: "Parent placement: plan-branch-dispatch-target is under @dispatch-workspace-configuration,
          while the other three specs are under @plan-support. This makes sense conceptually
          (dispatch behavior lives under dispatch config), but it means a single plan's specs span
          two module subtrees. Verify this is intentional — it creates a cross-module dependency
          where dispatch specs reference plan data. The alternative would be placing all four under
          @plan-support with a depends_on to @dispatch-workspace-configuration."
        created_at: 2026-04-02T00:55:51.878Z
    kind: question
  - _ulid: 01KN5V19W8HNG4VNCFC84EE0ZJ
    anchor:
      type: structured
      ref: "@plan-branch-creation"
      section: description
    entries:
      - _ulid: 01KN5V19W86Q0CEQBFSMXKCBDT
        author: "@claude"
        body: "Description says 'paralleling how task branches are created for tasks' — this is
          comparative/justification language. The description should stand on its own: 'A dedicated
          command creates or resumes a branch for a plan using a deterministic naming convention.'
          Drop the comparison clause."
        created_at: 2026-04-02T00:56:01.672Z
    kind: nit
  - _ulid: 01KN5V1E3C8S2TMVDM6NH30TRH
    anchor:
      type: structured
      ref: "@plan-branch-dispatch-target"
      section: description
    entries:
      - _ulid: 01KN5V1E3CB5RN33RWPFXRSJK3
        author: "@claude"
        body: "Description says 'instead of the project's default integration branch' — this comparative
          framing describes what doesn't happen rather than what does. Simplify to: 'When the
          dispatch engine provisions a workspace for a task that belongs to a plan with an
          associated branch, the plan branch is used as the task's integration target.' The fallback
          behavior is already covered by ac-no-plan-ref-passthrough and ac-null-branch-passthrough."
        created_at: 2026-04-02T00:56:05.996Z
    kind: nit
