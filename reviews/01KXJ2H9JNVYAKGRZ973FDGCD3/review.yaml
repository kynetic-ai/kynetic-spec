    entries:
      - _ulid: 01KXJ3H4MQXM97DQB31RSMHTD3
        author: Jacob Chapel
        body: 'MUST-FIX — A committed pause can lose to a drain that already passed the entry check.
          `_drainQueues` checks global authority only before awaiting task loading/pruning, while
          its dequeue loop is conditioned only on `this.running`; it therefore selects and starts a
          queued candidate after authority changes to paused. Impact: paused global authority does
          not reliably prevent new invocation starts at the task-owned
          dequeue/coalesced/retry/reconcile barriers. Evidence: I held
          `_pruneIneligibleQueueEntries`, published paused authority, released the barrier, and
          observed `{authority:"paused", starts:[taskId], queueDepth:0}`. Add a current-authority
          check at the serialized dequeue/admission point (preserving the later task’s final
          pre-spawn ownership) and a behavioral barrier test that fails on any recorded candidate
          start.'
        created_at: 2026-07-15T05:20:56.983Z
    kind: blocker
  - _ulid: 01KXJ3H7W4QF2394CN44H23VSB
    anchor:
      type: code
      commit: d5d15f65da86478548640f87d028f1b869a2db6b
      line_end: 1500
      line_start: 1470
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXJ3H7W4134V31BWK4FC058B
        author: Jacob Chapel
        body: 'MUST-FIX — The transition matrix is evaluated from the cached publication before the store
          transaction, then the precomputed `next` authority is written over whatever committed
          snapshot `mutate` actually loads. If an external commit advances running → stopped before
          publication delivery, a concurrent pause applies paused over stopped instead of returning
          `invalid_transition`. Impact: a durable stop can be overwritten by a stale lifecycle
          action, so committed authority is not authoritative under watcher/publication lag.
          Evidence: with engine publication at running and the mutation callback receiving committed
          revision 2/stopped, `applyGlobalLifecycleAction("pause")` returned applied and committed
          paused. Evaluate cleanup and the transition matrix against the transaction callback’s
          `snapshot` (and return the transaction-derived outcome), with a deterministic
          stale-publication/concurrent-commit test.'
        created_at: 2026-07-15T05:21:00.292Z
    kind: blocker
  - _ulid: 01KXJ3HB1VKDCK2BKC145GZGR0
    entries:
