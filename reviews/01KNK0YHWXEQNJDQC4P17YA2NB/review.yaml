    entries:
      - _ulid: 01KNK0ZSEV6D9VP0M00PY5DZAY
        author: Jacob Chapel
        body: 'Concurrent meta reloads can now drop requested sub-domain refreshes. When a
          manifest-triggered reload is already in flight, loadMetaDomain() just awaits the existing
          promise and returns without merging the new subdomains. I confirmed this with a runnable
          repro against the multi-dir fixture: pausing a manifest invalidation and then calling
          refreshMetaShadowInfo() produced {"manifestCalls":1,"shadowCalls":0}, so the requested
          shadow refresh never ran and /api/meta/shadow can stay stale until a later trigger.'
        created_at: 2026-04-07T03:50:11.163Z
      - _ulid: 01KNK268WW54E1CJCC1WWCRF2B
        author: Jacob Chapel
        body: "Fixed in a75610606: the meta in-flight gate now tracks active sub-domains separately from
          pending ones. Duplicate manifest invalidations stay deduplicated, but a concurrent shadow
          refresh is queued and runs after the in-flight manifest reload instead of being
          swallowed."
        created_at: 2026-04-07T04:11:12.156Z
    kind: blocker
