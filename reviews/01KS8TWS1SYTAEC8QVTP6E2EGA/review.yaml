      ref: "@task-update-plan-review-storage-specs"
      section: tasks
    entries:
      - _ulid: 01KS8TXWXY1FFASGHPAP373KDH
        author: Jacob Chapel
        body: Task edits existing specs but does not specify final implementation status for any touched
          spec. The review requirement asks for exact spec refs, AC IDs, final wording/status, and
          verification. The task names @plan-crud ac-1/ac-2, @review-record-storage-and-identity
          ac-3, and @daemon-entity-cache ac-folder-backed-entity-directory-invalidation with wording
          and verification, but it never says whether @plan-crud remains implemented,
          @review-record-storage-and-identity remains implemented, and @daemon-entity-cache remains
          in_progress or changes to another status after the edit. Add explicit final status
          instructions for each touched existing spec.
        created_at: 2026-05-22T21:54:40.703Z
    kind: blocker
  - _ulid: 01KS8TY88GJ3DBSH9JY53TH9SW
    anchor:
      type: structured
      field: covers
      ref: "@task-plan-resource-api-ui-static"
      section: tasks
    entries:
      - _ulid: 01KS8TY88GQNKHH34NA15V1CGV
        author: Jacob Chapel
        body: The plan adds @daemon-entity-cache ac-folder-backed-entity-directory-invalidation, but no
          implementation task claims that AC in its Covers line. This task says it updates
          .kspec/plans/ directory invalidation, and @task-review-screenshot-resource-ui says it
          updates .kspec/reviews/ invalidation, but neither Covers the new cache AC. A derived
          worker could complete all claimed ACs while the newly added cache requirement remains
          untracked. Add explicit Covers ownership for @daemon-entity-cache
          ac-folder-backed-entity-directory-invalidation, with the plan/review split stated on the
          relevant task(s), or create a dedicated cache task.
        created_at: 2026-05-22T21:54:52.304Z
    kind: blocker
  - _ulid: 01KS8TYKS4WDB21MNWCBVAGDFN
    anchor:
      type: structured
      field: description
      ref: "@task-entity-local-resource-model"
      section: tasks
    entries:
      - _ulid: 01KS8TYKS4AS4JNXQQ5H8XRWV4
        author: Jacob Chapel
        body: Resource content type derivation is still ambiguous. The shared model requires
          ResourceMetadata.content_type to be a string, while plan/review CLI and API tasks make
          --content-type/content_type optional. No task states what value is stored when callers
          omit it during CLI add, multipart POST, plan import from a sibling resources.yaml, or
          explicit materialize copy. Implementation agents could choose filename sniffing, multipart
          MIME, application/octet-stream, text/plain, or null, producing incompatible manifests and
          API payloads. Define the exact precedence/default rule in the shared resource task and
          require the plan/review CLI/API/import tests to cover omitted content type.
        created_at: 2026-05-22T21:55:04.100Z
    kind: blocker
