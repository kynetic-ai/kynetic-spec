    entries:
      - _ulid: 01KVEWHPBP9Z9N2HWQ877NG49R
        author: codex-reviewer
        body: "MUST-FIX: `headingSectionId` only counts duplicate slug bases, so the sectioning utility can
          emit duplicate section identifiers. Reproduced against this snapshot:
          `sectionPlanMarkdown('Lead\\n# Preamble\\nBody\\n')` returns two sections with id
          `preamble`; `sectionPlanMarkdown('# Intro-2\\nA\\n# Intro\\nB\\n# Intro\\nC\\n')` returns
          `intro-2`, `intro`, `intro-2`. Because `validatePlanTextAnchorForReview` later resolves a
          section with `.find(...)`, an anchor using a duplicated id addresses the first matching
          section rather than the containing section, so the exact span is not recoverable from
          section+offset+quote+revision. This violates the plan-text anchor contract and leaves
          ordinary headings like `# Preamble` or suffix-shaped headings unable to be anchored
          reliably. Make generated section ids globally unique within the document, including
          collisions with the fixed preamble id and already-suffixed heading slugs, and add
          behavioral coverage for these collisions."
        created_at: 2026-06-19T02:49:48.150Z
      - _ulid: 01KVEXQRCBNTVBXV12YB37TC85
        author: Jacob Chapel
        body: "Fixed in cc27b4d: sectionPlanMarkdown now assigns heading ids from a document-wide used-id
          set seeded with the fixed preamble id, so headings cannot collide with preamble or
          already-emitted suffix-shaped ids. Added behavioral coverage for Lead + # Preamble and #
          Intro-2/# Intro/# Intro collisions."
        created_at: 2026-06-19T03:10:35.402Z
    kind: blocker
    resolved_at: 2026-06-19T03:10:38.561Z
    resolved_by: Jacob Chapel
