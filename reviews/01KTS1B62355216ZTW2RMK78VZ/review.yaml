threads:
  - _ulid: 01KTS1D16FWR3GPBCE576G2TZ3
    anchor:
      type: structured
      ref: "@task-command-dispatch-timeout"
      section: dependencies
    entries:
      - _ulid: 01KTS1D16F59TS707VB1FY0F0N
        author: codex
        body: "The command-timeout task now requires logging late abandoned-command rejections through the
          daemon log-capture logger, but it still only depends on
          @task-update-daemon-reliability-specs. That lets @task-command-dispatch-timeout run before
          @task-daemon-log-capture has created the required logger, making the task non-standalone
          or forcing it to expand into another task's scope. Add a dependency on
          @task-daemon-log-capture, or change the task to use an already-existing logging surface
          instead. Evidence: current task text says the .catch must log through the
          task-daemon-log-capture logger; @task-daemon-log-capture is the task that creates that
          logger."
        created_at: 2026-06-10T15:11:20.783Z
    kind: blocker
  - _ulid: 01KTS1D3W7V9B9BSZH5SN2Y128
    anchor:
      type: structured
      ref: "@task-command-dispatch-timeout"
      section: description
    entries:
      - _ulid: 01KTS1D3W8KJ40D8J9PDA2869E
        author: codex
        body: The timeout How races dispatchMutex.run(...) at the existing route-handler call sites and only
          calls out a .catch for late abandoned-command rejections. In the current code,
          mutating-command cache write-through and WebSocket broadcast happen after await
          dispatchMutex.run(...) (packages/daemon/src/routes/command.ts:646-670; batch path
          811-837). If a mutating command times out for the caller but later completes successfully,
          that post-completion path will not run unless the task explicitly moves those side effects
          into the abandoned execution path. That would leave the daemon cache stale and skip the
          command_executed/batch_executed broadcast despite the underlying mutation succeeding,
          contradicting the existing @daemon-command-api ac-mutation-cache-update contract. Update
          the task to preserve cache write-through/broadcast for timed-out executions that later
          succeed, or explicitly define a different spec contract.
        created_at: 2026-06-10T15:11:23.528Z
    kind: blocker
