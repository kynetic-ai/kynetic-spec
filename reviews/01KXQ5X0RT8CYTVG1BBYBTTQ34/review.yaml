        author: Jacob Chapel
        body: "MUST-FIX — Markdown records are exact only by path; their classification and audit/authority
          metadata are not gated. The validator accepts any nonempty classification and
          source_of_truth, never checks Markdown source authorities exist, and ignores audit_topics,
          audit_status, and disposition. For example, README.md can be changed from active-public to
          historical with an exclusion reason, pointed at an arbitrary source string, and have its
          audit fields cleared while every inventory test still passes. Impact: the Task 7 audit
          scope and ownership/disposition evidence can silently drift even though the manifest
          claims deterministic closure. Evidence: lines 287-302 perform only nonempty/reason/pairing
          checks, whereas complete-record comparison is applied only to non-file kinds. Enforce the
          plan-defined path-specific classifications and complete required metadata, with negative
          mutations proving those fields cannot drift."
