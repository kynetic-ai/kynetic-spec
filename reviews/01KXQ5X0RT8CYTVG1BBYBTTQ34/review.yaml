          merge base between this snapshot and the advanced target becomes e7dedf15 rather than the
          frozen pre-task commit; any later documentation merge has the same effect, and deletion or
          incomplete fetching of that remote ref makes the test throw. Impact: the full-suite gate
          that is explicitly meant to remain satisfiable through Tasks 2-7 becomes red after normal
          integration even when no lifecycle fact changed. Evidence: current commands show
          merge-base HEAD with the frozen origin target is 8f871993, while merge-base HEAD with the
          canonical task branch is e7dedf15; the merge target will contain that canonical head.
          Validate immutable commit ancestry/freshness without requiring a mutable remote branch to
          stay at the freeze point."
