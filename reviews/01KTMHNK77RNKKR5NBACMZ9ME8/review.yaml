    entries:
      - _ulid: 01KTMJKEZKNCXDMG25BB2WHAF6
        author: Jacob Chapel
        body: "MUST-FIX: these AC-tagged project-context tests stop at URL-string construction, but the task
          explicitly asks to assert HTTP outcomes and the plan/review ACs say the browser request
          returns the selected project's bytes instead of default-project bytes or 404. Existing
          daemon tests prove review bytes routes honor kspec_dir under @multi-directory-daemon, but
          this new AC coverage does not exercise the rendered plan URL through the daemon without
          X-Kspec-Dir, and the review AC annotations here are also builder-only. Add contract
          coverage that renders/extracts the browser URL, fetches it with no X-Kspec-Dir in a
          multi-project setup, and asserts the selected project's bytes are returned (and not the
          default project's bytes). For behavior still pending, keep it as it.fails under the
          existing tests-first protocol; for review comparator coverage, either annotate existing
          route-level HTTP tests with these AC refs or add equivalent AC-tagged checks."
        created_at: 2026-06-08T21:35:45.139Z
      - _ulid: 01KTMMAMBFN59XHCNBB242DTW7
        author: "@claude"
        body: >-
          Fixed. Added tests/daemon-api/resource-url-browser-fetch-contract.test.ts which
          renders/extracts the browser URL and fetches it against a real multi-project daemon
          (createTestApp, project A default + project B selected non-default, same ids with
          different bytes per project) WITHOUT X-Kspec-Dir, asserting the selected project's bytes
          return and not the default's or a 404.


          - Plan ACs (ac-plan-image/doc-link-routes-to-selected-project): end-to-end it.fails —
          buildPlanContentBlocks rewrite is project-unaware today, so the no-kspec_dir URL falls
          back to project A; a positive-control normal it pins that fallback so the it.fails fail on
          the byte mismatch, not a transport error. Flips green when
          @generalize-live-ui-resource-markdown-rewriting appends kspec_dir.

          - Review ACs (ac-review-image/doc-link-routes-to-selected-project): passing comparator —
          reviewResourceBytesUrl output fetched against the real review bytes route returns project
          B's bytes; plus a no-project-selected case returning project A's bytes.

          - Also added a manifest-gate 404 check for an undeclared plan id.
        created_at: 2026-06-08T22:05:52.879Z
    kind: blocker
  - _ulid: 01KTMJKWY4BCQ3WEAEC1CH1MVA
    anchor:
      type: code
      commit: c495d036a001126656a02a5f08599011cd519b0e
