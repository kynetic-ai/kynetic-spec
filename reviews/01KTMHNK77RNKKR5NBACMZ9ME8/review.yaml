    entries:
      - _ulid: 01KTMJKWY5595AHBM3G8095TBM
        author: Jacob Chapel
        body: "MUST-FIX: the task markdown AC tests assert only that markdown is rewritten to a task-scoped
          URL string. The task description also required owner/status metadata and HTTP outcomes,
          and these ACs' Then clauses require the browser to display/receive the recorded plan-owned
          bytes or copied task-owned bytes from the selected project. Because task resource
          APIs/routes land in later tasks, this can be staged as it.fails contract coverage, but it
          still needs to exist: construct or simulate the resolved task detail/resource route
          contract, assert plan-owned vs task-owned owner/status projection is used, and verify
          fetching the produced URL without X-Kspec-Dir returns the expected bytes rather than just
          checking the string contains ?kspec_dir=. Without that, the tests can pass after a
          string-only rewrite even if the daemon cannot serve the bytes or serves the wrong owner's
          content."
        created_at: 2026-06-08T21:35:59.429Z
