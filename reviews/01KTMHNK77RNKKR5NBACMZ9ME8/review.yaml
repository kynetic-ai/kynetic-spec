        author: Jacob Chapel
        body: "MUST-FIX: these AC-tagged project-context tests stop at URL-string construction, but the task
          explicitly asks to assert HTTP outcomes and the plan/review ACs say the browser request
          returns the selected project's bytes instead of default-project bytes or 404. Existing
          daemon tests prove review bytes routes honor kspec_dir under @multi-directory-daemon, but
          this new AC coverage does not exercise the rendered plan URL through the daemon without
          X-Kspec-Dir, and the review AC annotations here are also builder-only. Add contract
          coverage that renders/extracts the browser URL, fetches it with no X-Kspec-Dir in a
          multi-project setup, and asserts the selected project's bytes are returned (and not the
          default project's bytes). For behavior still pending, keep it as it.fails under the
          existing tests-first protocol; for review comparator coverage, either annotate existing
          route-level HTTP tests with these AC refs or add equivalent AC-tagged checks."
        created_at: 2026-06-08T21:35:45.139Z
    kind: blocker
