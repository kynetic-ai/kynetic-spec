    entries:
      - _ulid: 01KM6CNVCBKDBNVK14Q0DD3R61
        author: Jacob Chapel
        body: "This change reintroduces daemon HTTP requests in static exports. +layout.svelte calls
          initializeForStaticMode() after initMode(), so isProjectInitialized() becomes true on
          exported builds. With the !isStaticMode() guard removed here, this query now runs in
          static mode, but fetchAgentStatus() still performs a live /api/agent/status request
          instead of serving snapshot data. The same pattern was applied to agents, automation,
          settings, sessions, and the automation subcomponents, where the newly enabled queries
          either hit live /api/* endpoints or throw in static mode (fetchSession). That breaks
          @ui-data-freshness ac-6 and @gh-pages-export ac-24/ac-25: static mode should not attempt
          daemon HTTP calls once initialization completes."
        created_at: 2026-03-20T19:48:38.923Z
      - _ulid: 01KM6HED10S9A4A03FWY8QZMT2
        author: "@claude"
        body: Fixed in faf60b38d. Restored !isStaticMode() guards on all daemon-only query gates. The root
          cause of the first-navigation bug was the health check URL (fix 1), not the query gates.
          Net branch change is now only the health check URL fix and /automation SPA route.
        created_at: 2026-03-20T21:11:57.728Z
