        author: Jacob Chapel
        body: "MUST-FIX: This test is annotated for @coverage-resolution-mutation-interface
          ac-current-state-boundary, but it only passes an injected loadReadModel and asserts the
          injection was called. That does not prove the production resolver default uses
          getCachedCoverageStateReadModel or prevents buildCoverageStateReadModel from being used by
          resolution handlers. A regression that changed the default path to the raw builder would
          still pass this test because the default path is never exercised here. Please replace or
          supplement this with a behavioral boundary check that exercises the production default
          read path (or an equivalent route/CLI boundary once those handlers exist) and would fail
          if resolution production code bypasses the cached freshness-comparison read model."
