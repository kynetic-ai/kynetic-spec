    entries:
      - _ulid: 01KSE6ERC861VF5P8DZNEC14HX
        author: Jacob Chapel
        body: "MUST-FIX: the opt-in protected-project tripwire is not enforced for every executing
          folder-storage upgrade path. In this block the executing atomic migration runs plan,
          review, then manifest promotion, but the safety check only happens later inside the
          non-dry-run plan/review apply paths. If both reports are already migrated or empty, those
          functions return before calling assertSafeMigrationTarget, and
          runStorageManifestPromotionStep still mutates the protected project. I reproduced this
          with a disposable project where KSPEC_PROTECTED_PROJECT_PATHS was set to that project root
          and the downgraded manifest had no monolithic plan/review records: runUpgradePipeline
          returned success, plan/review steps were skipped, and the manifest changed to kynetic 1.2
          with folder/resource storage declarations. The tripwire must run before any executing
          upgrade mutation for a protected target, including no-op plan/review migrations followed
          by manifest promotion."
        created_at: 2026-05-24T23:52:19.592Z
      - _ulid: 01KSE8A8WJCXXF6ZDZ418Q3CB9
        author: "@claude"
        body: "Fixed in 8547337160: hoisted assertSafeMigrationTarget to runAtomicStorageMigration so it
          fires once before any executing storage mutation. Plan/review skipped-as-alreadyMigrated
          paths no longer bypass the tripwire because the orchestrator-level check runs first. On
          trip-wire failure the orchestrator returns a synthetic Storage migration safety preflight
          failed step plus skipped records for plan/review/manifest. Two regression tests in
          tests/upgrade-folder-storage.test.ts cover both the no-monolithic-records repro from your
          evidence and the symmetric case with real migration work — both assert manifest is
          byte-identical after the failed upgrade and no plan/review folders are written."
        created_at: 2026-05-25T00:24:49.810Z
    kind: blocker
    resolved_at: 2026-05-25T00:24:54.455Z
    resolved_by: "@claude"
