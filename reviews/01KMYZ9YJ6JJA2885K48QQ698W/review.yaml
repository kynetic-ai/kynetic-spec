threads:
  - _ulid: 01KMYZB9EA1CMF73J35Q7KYPES
    anchor:
      type: structured
      ref: "@task-fix-query-loading-state"
      section: tasks
    entries:
      - _ulid: 01KMYZB9EB2ZHRPE7ACSXFAKYE
        author: Jacob Chapel
        body: This plan is framed as e2e test-suite cleanup, but this task is a product bug investigation
          and implementation task in TanStack Query/web UI runtime code rather than test cleanup.
          Deriving it from this plan will mix app-behavior repair with test maintenance, making
          scope, ownership, and completion criteria ambiguous. Split this into a separate bug-fix
          plan/task, and keep this plan focused on test cleanup work that starts after the
          underlying UI bug is already fixed or explicitly accepted as a prerequisite outside the
          plan.
        created_at: 2026-03-30T08:56:42.187Z
    kind: blocker
  - _ulid: 01KMYZB9GHTPN5KNMJJTPK98NR
    anchor:
      type: structured
      ref: "@task-rewrite-websocket-e2e"
      section: tasks
    entries:
      - _ulid: 01KMYZB9GJPS5PDHYTT7PNECNW
        author: Jacob Chapel
        body: "This goes beyond cleanup into net-new behavioral coverage design. Rewriting protocol-level
          coverage into new UI behavioral tests is a legitimate follow-on effort, but it is not
          cleanup of the existing failing suite. Keeping expansion work in the same plan obscures
          the real exit condition for the cleanup effort. Split cleanup from coverage expansion:
          this plan should stop at restoring and restructuring the current suite, while new
          behavioral coverage should live in a later plan."
        created_at: 2026-03-30T08:56:42.258Z
    kind: blocker
  - _ulid: 01KMYZB9HBRZ9QG1M2M2DMCYPS
    anchor:
      type: structured
      ref: "@task-add-filewatcher-e2e"
      section: tasks
    entries:
      - _ulid: 01KMYZB9HBZVA595723CKCYGBA
        author: Jacob Chapel
        body: This is also net-new coverage, not cleanup. Adding missing file-watcher UI tests enlarges the
          scope from 'make the existing e2e suite healthy' to 'design new e2e coverage areas'. That
          should be proposed after the cleanup effort is complete, not mixed into the same
          derivation set.
        created_at: 2026-03-30T08:56:42.283Z
    kind: blocker
  - _ulid: 01KMYZB9JANCTTRKKYW07GCYCX
    anchor:
      type: structured
      ref: "@task-ci-full-e2e"
      section: tasks
    entries:
      - _ulid: 01KMYZB9JA9A88DDCKDGZ1Z8RM
        author: Jacob Chapel
        body: "The CI-gate expansion task is downstream operational rollout rather than cleanup of the suite
          itself. If you keep it, make the dependency and success criteria explicit: it should only
          derive after the cleanup tasks establish a stable passing set and a measured runtime
          budget. Otherwise consider moving CI rollout into a separate follow-up plan."
        created_at: 2026-03-30T08:56:42.314Z
    kind: question
