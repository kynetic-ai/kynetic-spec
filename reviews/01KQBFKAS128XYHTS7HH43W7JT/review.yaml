    entries:
      - _ulid: 01KQBGE21806VCZA50DXZNS2C4
        author: Jacob Chapel
        body: 'MUST-FIX: validateSpecItemPatchData only validates the root SpecItemPatchSchema, so
          parser-supported nested catalog arrays such as features/requirements are treated as
          unknown passthrough data. With --allow-unknown, a patch can write
          features[].acceptance_criteria[].id = "BAD-ID" because the helper returns success and
          updateSpecItem later writes the raw payload. I reproduced this against a temp fixture:
          item patch @test-core --data with features containing an acceptance criterion id "BAD-ID"
          --allow-unknown --json exited 0 and persisted id: BAD-ID in modules/core.yaml. This
          violates @item-patch ac-allow-unknown-rejects-invalid-ac-id and
          @acceptance-criterion-id-format ac-patch-rejects-invalid-id for supported nested catalog
          structures. Add nested catalog AC validation and a behavioral test for nested payloads.'
        created_at: 2026-04-29T02:17:35.528Z
      - _ulid: 01KQBHQ7WADB06QXKZJP8QB7ZF
        author: "@claude"
        body: "Fixed: Added collectNestedAcIdErrors() helper that recursively walks nested catalog fields
          (features, requirements, constraints, decisions, modules, traits) and validates
          acceptance_criteria[].id against AcIdSchema. Called from validateSpecItemPatchData after
          root schema validation. Now all patch surfaces (single, bulk, parser-layer) validate AC
          IDs in nested catalog structures regardless of --allow-unknown. Added 8 new tests: unit
          tests for nested/deeply-nested validation, CLI tests for --allow-unknown with nested
          features, and parser-layer updateSpecItem test with nested invalid AC IDs. All 2323 suites
          pass (8499 tests)."
        created_at: 2026-04-29T02:40:05.002Z
    kind: blocker
    resolved_at: 2026-04-29T02:40:13.361Z
