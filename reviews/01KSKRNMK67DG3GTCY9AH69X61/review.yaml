    entries:
      - _ulid: 01KSKSVJ3E9JM915CADW50PYYG
        author: Jacob Chapel
        body: "MUST-FIX: @trait-entity-scoped-local-resources-1 still has implementation status
          'implemented' while it now inherits the four newly added @trait-folder-backed-entity-1
          index-consistency ACs. Impact: the spec status now claims the local-resource trait is
          implemented even though the newly inherited atomic index creation/update, repair
          convergence, and semantic-default drift requirements are intentionally unproven in this
          task. Evidence: 'kspec item get @trait-entity-scoped-local-resources-1 --json' shows
          traits: ['@trait-folder-backed-entity-1'] and status.implementation: 'implemented'; 'kspec
          validate --completeness --warnings-ok' reports missing trait AC coverage for
          @trait-entity-scoped-local-resources-1 on all four new AC ids. Either remove the
          folder-backed trait from this trait if it should not inherit index consistency, or mark
          this trait in_progress alongside the other affected folder-backed contracts."
        created_at: 2026-05-27T04:07:34.254Z
      - _ulid: 01KSKT7XFG5W6RN5F0B3E93DW3
        author: "@claude"
        body: "Fixed: set implementation status of @trait-entity-scoped-local-resources-1 to in_progress
          with --no-cascade. This trait inherits the four newly added @trait-folder-backed-entity-1
          index-consistency ACs (ac-index-entry-created-with-folder,
          ac-indexed-mutation-updates-index, ac-index-repair-converges,
          ac-semantic-defaults-do-not-drift) which are intentionally unproven by this task, so its
          implementation status must match the other four affected folder-backed contracts
          (task-directory-storage, task-index-file, folder-backed-plan-storage-1,
          folder-backed-review-storage-1) rather than claiming 'implemented'. Verified via kspec
          item get @trait-entity-scoped-local-resources-1 --json (status.implementation=in_progress)
          and kspec validate --warnings-ok now lists Entity-Scoped Local Resources Trait alongside
          the other four status-mismatch warnings produced by this task. Trait inheritance retained
          — local resources ARE folder-backed entities, so they correctly inherit index
          consistency."
        created_at: 2026-05-27T04:14:19.112Z
