        body: "Fixed: same root cause as the first thread. buildKspecGitignoreEntries() now accepts
          worktreeRoot as 2nd parameter. All callers (setup.ts, init.ts via shadow.ts) pass
          config.dispatch.worktree_root through. Projects with custom dispatch.worktree_root will
          now gitignore the correct directory."
