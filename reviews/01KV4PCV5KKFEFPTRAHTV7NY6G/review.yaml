    entries:
      - _ulid: 01KV4PKWGXTWY1TAEJ0EAA7T77
        author: Jacob Chapel
        body: "MUST-FIX: After a write-time degradation, remove() no longer removes values that were
          successfully persisted before degradation. LocalStorageBackend.get() still consults
          persistent storage even when degraded, but remove() returns before calling
          storage.removeItem() once degraded is true. Repro: persist preference A, trigger quota
          degradation with preference B, call A.remove(), then A.get() still returns the old
          persisted value. This violates the backend remove contract and the public
          Preference.remove() contract that subsequent reads return the default, so degraded mode is
          not functionally equivalent for the accessor surface."
        created_at: 2026-06-15T03:53:44.221Z
      - _ulid: 01KV4RWSVQVVFM2D3Z54J9ASQ8
        author: "@claude"
        body: 'Fixed in b85672dd5e. remove() is now symmetric with get(): it clears persistent storage
          whenever this.storage exists, regardless of the degraded flag. The degraded flag only
          gates set() (writes can hit quota); removeItem frees quota rather than consuming it, so it
          is always safe to attempt. Added a regression test ("removes a value persisted before a
          write-time degradation") that reproduces the exact repro — persist A, quota-degrade on B,
          A.remove(), then A.get() returns the default. Full suite green.'
        created_at: 2026-06-15T04:33:33.559Z
    kind: blocker
    resolved_at: 2026-06-15T04:33:38.610Z
    resolved_by: "@claude"
