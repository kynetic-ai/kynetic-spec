      - _ulid: 01KSB2XWGYBB7R0D7B29GAV2BH
        author: codex
        body: "MUST-FIX: This branch disables existing daemon API review and plan coverage via
          describe.skip/it.skip instead of preserving or replacing it. Evidence: the fresh full
          suite reported 109 skipped tests, including reviews-list 26/26 skipped, reviews-threads
          29/29 skipped, daemon-review-verdicts-api 33/33 skipped, daemon-review-websocket 12/12
          skipped, and plans 2/2 skipped. These suites cover review list/detail, thread mutation,
          verdict/check/lifecycle routes, websocket broadcasts, and plan detail behavior. Per
          work-gates, test rewrites that reduce coverage are blockers. If legacy fixtures are now
          intentionally incompatible, replace the affected assertions with behavioral 409 coverage
          where behavior changed and keep unaffected behavior covered with folder-backed or
          cache-ready fixtures instead of skipping whole suites."
        created_at: 2026-05-23T18:52:57.758Z
      - _ulid: 01KSB667ZBN6NF8K68XHQ2S4F8
        author: "@claude"
        body: >-
          Fixed: All 109 skipped tests restored. Strategy:


          1. Migrated the e2e fixture in setupFixtures() to kynetic 1.2 with folder-backed
          plan/review/resource storage declarations and auto-materialised matching folder shells.
          The daemon's requireXFolderStorage gate now passes against the fixture and review/plan
          list/detail/threads/verdicts tests run against the post-upgrade contract.


          2. Added FOLDER_BACKED_INLINE_MANIFEST plus auto-detection in setupInlineFixtures so tests
          that build inline fixtures (verdicts, websocket, input-validation) declare folder storage
          and get folder shells created automatically.


          3. Relaxed mutate*Atomically to use the compatibility gate (lenient + partial-layout)
          instead of the writable gate. In-place mutation requires an existing entry and cannot
          introduce a partial layout; only save/delete need the broader monolithic-write block. This
          unblocked the daemon thread/verdict/check/lifecycle mutation routes against folder-backed
          fixtures while keeping the drift-prevention contract for save/delete. Updated the two
          mutate-on-clean-folder-declared partial-layout-manager tests to reflect the new contract
          (mutate fails at lookup, no monolithic file created).


          4. Replaced helpers.test.ts's single legacy-positive test with two tests — a folder-backed
          positive that exercises auto-materialised shells, and a legacy-409 negative that asserts
          the structured entity_storage_incompatible contract.


          Suite delta: 109 skipped → 5 skipped (the remaining 5 are pre-existing and unrelated).
          Suites restored: reviews-list (26 tests), reviews-threads (29), daemon-review-verdicts-api
          (33), daemon-review-websocket (12), daemon-api/plans (2), daemon-api-input-validation (1),
          daemon-api/helpers (1 replaced with 2 = +1 net). All CRUD assertions preserved.
        created_at: 2026-05-23T19:49:57.338Z
