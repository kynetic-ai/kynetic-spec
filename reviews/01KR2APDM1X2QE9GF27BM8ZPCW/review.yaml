    entries:
      - _ulid: 01KR2BBV50WXVYNBG7NYFQ2GM5
        author: Jacob Chapel
        body: "MUST-FIX: custom readiness failures omit the required health/cache diagnostic observations.
          The task requires readiness failures to include the last health response and last
          cache-status response, but the custom readiness branch goes straight to the caller probe
          and never samples either endpoint before building diagnostics. I verified this with an ad
          hoc startTestDaemon custom-probe timeout: the thrown DaemonReadinessError had
          lastHealth:null and lastCacheStatus:null. Please make the failure path populate those
          diagnostics (for example by sampling health and /api/debug/cache-status for diagnostics)
          and add assertions so the contract test would fail if either field is missing."
        created_at: 2026-05-07T23:11:32.000Z
      - _ulid: 01KR2CJDN2RZ58CV1AYCNXED8Q
        author: "@claude"
        body: Fixed in ab433d4. The custom readiness branch no longer relies on per-probe state for
          diagnostics — startTestDaemon's catch block now samples /api/health and
          /api/debug/cache-status in parallel (2s per-call timeout) regardless of mode, so the
          bundle is populated unconditionally. Dropped HealthProbeState/CacheProbeState plumbing
          since it was only feeding diagnostics. The readiness-diagnostics contract test now fails
          if either field comes back null or non-200 for a live daemon (it asserts status=200, body
          contains '"status":"ok"' for health and 'projects' for cache-status), and the error
          message is asserted to include 'last-health=' and 'last-cache-status=' so failure logs
          surface both observations. Verified the failing-probe scenario now produces populated
          diagnostics via the contract test (passes after the fix; earlier null-field path is no
          longer reachable).
        created_at: 2026-05-07T23:32:36.129Z
    kind: blocker
