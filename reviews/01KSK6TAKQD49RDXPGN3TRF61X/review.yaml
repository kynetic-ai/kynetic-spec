    entries:
      - _ulid: 01KSK6X8T9H9T9188PCPN9F797
        author: Jacob Chapel
        body: "MUST-FIX: these AC annotations overclaim what the regression proves. The test keeps asserting
          that no worktree has the plan target checked out, then runs ; it never creates an occupied
          target checkout, verifies dispatch refusal, checks blocking-worktree guidance, or runs a
          periodic sync cycle. That means  and  are not behaviorally proven by this test. Either
          extend the regression to exercise those scenarios or change the annotations to ACs
          actually covered by this clean manual_merge push path."
        created_at: 2026-05-26T22:36:27.337Z
      - _ulid: 01KSK6Y7PNPGQG03GV79XPJ6YB
        author: Jacob Chapel
        body: 'Clarification: the omitted identifiers in the previous entry are
          _pushIntegrationTargetAsync(planTarget, "post-merge"),
          @dispatch-integration-mutation-scope ac-occupied-target-refusal-identifies-blocker, and
          @dispatch-remote-branch-sync ac-push-target-periodic. The finding is that the regression
          proves the clean lock-free manual_merge push path, but those two annotations describe an
          occupied-target refusal and a periodic sync cycle that this test does not execute.'
        created_at: 2026-05-26T22:36:58.965Z
      - _ulid: 01KSK8W47SPYE1YNKJH12YJZ2A
        author: "@claude"
        body: >-
          Fixed: extended the regression to behaviorally cover the two ACs the prior version
          overclaimed.


          The test now drives three phases against the same plan-scoped task in one temp repo:


          Phase A — clean lock-free path: helper runs, no aux worktree holds the plan target, then
          drivePeriodicSyncPush() (which calls _pushActiveTargetsAsync('periodic-sync')) pushes the
          post-merge plan target ref. This is the real periodic-sync push trigger, not a manual
          post-merge call, so @dispatch-remote-branch-sync ac-push-target-periodic is exercised
          end-to-end.


          Phase B — occupied refusal: a foreign worktree is added on the plan target outside
          .kspec-worktrees, the plan target is advanced via the occupant so periodic sync does NOT
          take the no-commits-to-push early return, then drivePeriodicSyncPush() is called again.
          The test asserts: local and remote plan target refs unchanged (refusal-before-mutation),
          getDegradedState() contains an entry with kind='occupied-checkout' whose reason contains
          the occupant worktree path AND 'Check out a different branch' guidance, dev is not
          degraded (scoped degradation), and the status API mirrors the same. This is the behavioral
          proof for @dispatch-integration-mutation-scope
          ac-occupied-target-refusal-identifies-blocker.


          Phase C — recovery without restart: the occupant is removed, drivePeriodicSyncPush() runs
          again. The previously-unpushed commits from Phase B now appear on origin and the degraded
          entry for the plan target is cleared, proving @dispatch-remote-branch-sync
          ac-occupied-checkout-degraded-recovery operationally (no engine restart).


          Full test log shows all three phases firing in order ('Pushed integration target ...
          (periodic-sync)' → 'DEGRADED ... currently checked out in worktree ... Resolution: Check
          out a different branch in ...' → 'Pushed integration target ... (periodic-sync)' +
          'Recovered from degraded state ... after 0s'). The five claimed AC annotations now each
          have a behavioral assertion.
        created_at: 2026-05-26T23:10:47.033Z
