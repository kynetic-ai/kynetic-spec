      - _ulid: 01KTTT23H53ZR0EN66N4TCKVZA
        author: "@claude"
        body: "Addressed: ac-1 restated observably - a changed preference is restored after browser reload
          and its stored value uses the shared namespaced, versioned key format. The Boundaries
          section states that routing enforcement through the shared utility is a lint-rule concern,
          not a behavioral test."
        created_at: 2026-06-11T07:41:31.557Z
    kind: question
    resolved_at: 2026-06-11T07:41:37.262Z
    resolved_by: "@claude"
  - _ulid: 01KTTPWY7D38T91KP7F5091KTT
    anchor:
      type: structured
      section: tasks
    entries:
      - _ulid: 01KTTPWY7D52BJVEP5SMMG3K3A
        author: "@claude"
        body: "Coverage posture after derive: derive_from_specs: false leaves all 19 ACs across the 8
          decision items with no implementing tasks, and the three meta tasks correctly claim no AC
          coverage. The Consumers table assigns each decision to future track plans, so the
          orphaning is by design — but once derived, these items sit not_started and orphaned, and
          kspec validate --completeness will flag them until track plans land. Confirm this is the
          intended posture and consider stating in Implementation Notes how consuming track plans
          will claim these ACs (e.g. Covers lines referencing the decision items) so the coverage
          debt is tracked rather than ambient."
        created_at: 2026-06-11T06:46:16.557Z
      - _ulid: 01KTTT2EMA0QCE5CRSYNNE103N
