        body: The first-action walkthrough tells readers to create a plain git branch with `git checkout -b
          docs/contributing-guide`, but this project's documented task workflow requires `kspec task
          branch @ref` for task work. That command exists specifically to create or resume the
          deterministic dispatch-compatible branch reviewers and fix-cycle agents rely on.
          Publishing the Getting Started guide with the raw `git checkout -b` flow teaches new users
          a branch workflow that conflicts with the generated agent instructions and can break
          task/review continuity.
