      side: head
    entries:
      - _ulid: 01KP9FP3ZX4184F9JM1Y5VG10H
        author: Jacob Chapel
        body: 'The source-version fallback never checks whether the positive probes are mutually consistent;
          it only keeps the highest lower bound. In a hand-edited/skewed project this reports an
          approximate version instead of the required unknown fallback. I reproduced this with a
          synthetic project whose manifest advertised old state (`kynetic: "1.0"`) while
          `kspec.config.yaml` advertised newer state: `upgrade --dry-run --json` returned
          `source_version: "0.11.0", confidence: "approximate"` instead of treating the shape as
          unrecognizable. That makes the reported source version unreliable in exactly the scenario
          the task description calls out.'
        created_at: 2026-04-15T21:10:20.413Z
      - _ulid: 01KP9JMGN9S5PNRE8TRAG35PPP
        author: "@claude"
        body: "Fixed: same fix as duplicate thread above — ProbeResult range intersection detects
          contradictions."
        created_at: 2026-04-15T22:01:53.577Z
    kind: blocker
    resolved_at: 2026-04-15T22:02:33.900Z
    resolved_by: "@claude"
  - _ulid: 01KP9FPF07D4AZ69Q92JKZSKXY
    anchor:
      type: code
      commit: 2954ef826857c2ec41850cba22ae384ab50c3e0f
      line_end: 724
      line_start: 640
      path: src/cli/commands/upgrade.ts
      side: head
    entries:
      - _ulid: 01KP9FPF08EBBT7MBSYJMF4CHR
        author: Jacob Chapel
        body: "The dry-run path is not surfacing execution errors that would occur on a real upgrade. I
          reproduced this by replacing `.agents/skills` with a regular file: `upgrade --force
          --json` failed the `Re-render skills` step with ENOTDIR and exited 3, but `upgrade --force
          --dry-run --json` reported that same step as `done` and exited 0. That violates
          `@trait-dry-run ac-4`, which requires dry-run to show the error a real run would hit while
          still avoiding writes."
        created_at: 2026-04-15T21:10:31.688Z
      - _ulid: 01KP9JMNSDGAQZEVC022B9M9MJ
        author: "@claude"
        body: "Fixed: added pre-flight check that runs for both dry-run and real-run. Before rendering, each
          platform's output directory is stat'd — if it exists but is not a directory, the error is
          collected and the step reports failure immediately. Test added that replaces
          .agents/skills with a regular file and asserts dry-run reports the same failure as
          real-run."
        created_at: 2026-04-15T22:01:58.828Z
    kind: blocker
    resolved_at: 2026-04-15T22:02:38.922Z
    resolved_by: "@claude"
  - _ulid: 01KP9FPV3S14FVFTKW0YG2APXG
    anchor:
      type: code
      commit: 2954ef826857c2ec41850cba22ae384ab50c3e0f
      line_end: 855
      line_start: 801
      path: src/cli/commands/upgrade.ts
      side: head
    entries:
      - _ulid: 01KP9FPV3SMZXAC1YHM0RY3PWF
        author: Jacob Chapel
        body: "The dry-run preview for agent regeneration is inaccurate because the up-to-date/hash check
          only runs in the non-dry-run branch. On a freshly initialized project I reproduced
          `upgrade --force --json` returning `Regenerate agent instructions: skipped` while `upgrade
          --force --dry-run --json` reported `would regenerate kspec-agents.md` and added a
          follow-up entry. That means the preview can claim work will happen even when the real
          upgrade would skip the step."
        created_at: 2026-04-15T21:10:44.089Z
      - _ulid: 01KP9JMTP7R4Z8145A3VK2S9YP
        author: "@claude"
        body: "Fixed: moved the metaHash computation, stored hash read, and file existence check outside the
          if(\\!dryRun) branch. Now both dry-run and real-run perform the same up-to-date check.
          When the hash matches and the output file exists, both paths return 'skipped'. Test added
          that runs upgrade once (populating hash), then verifies both dry-run and real-run agree on
          'skipped'."
        created_at: 2026-04-15T22:02:03.847Z
    kind: blocker
    resolved_at: 2026-04-15T22:02:43.900Z
    resolved_by: "@claude"
  - _ulid: 01KP9FQ78P0DQJZXTWFZ0DXP1G
    anchor:
