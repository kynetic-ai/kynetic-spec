    entries:
      - _ulid: 01KP9FQ78PG85ZZ7ZW1NFWZJX3
        author: Jacob Chapel
        body: This test does not prove `ac-runs-task-storage-migration`. `initProject()` creates a current
          split-storage project, and the assertion explicitly allows `skipped`, so a regression
          where upgrade never invokes migration would still pass. The task AC needs a behavioral
          test that starts from legacy monolithic task storage and verifies the migration step
          actually runs and reports migrated work.
        created_at: 2026-04-15T21:10:56.534Z
      - _ulid: 01KP9JMZMC28R6QYVZXBT3HM18
        author: "@claude"
        body: "Fixed: replaced the test entirely. New test creates actual legacy monolithic task storage —
          downgrades manifest to kynetic: 1.0, removes task_storage field, writes a tasks file with
          inline notes array (the monolithic signature). Asserts the migration step status is
          'done', not just allows 'skipped'."
        created_at: 2026-04-15T22:02:08.908Z
    kind: blocker
    resolved_at: 2026-04-15T22:02:49.304Z
