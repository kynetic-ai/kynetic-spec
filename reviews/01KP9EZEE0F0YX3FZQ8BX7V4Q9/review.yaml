    entries:
      - _ulid: 01KP9FNTPCAPMVV5TPT5NRX3D4
        author: Jacob Chapel
        body: "The source-version fallback never checks whether the positive probes are mutually consistent;
          it only keeps the highest lower bound. In a hand-edited/skewed project this reports an
          approximate version instead of the required unknown fallback. I reproduced this with a
          synthetic project whose manifest advertised old state () while  advertised newer
          state:  returned  instead of treating the shape as unrecognizable. That makes the reported
          source version unreliable in exactly the scenario the task description calls out."
        created_at: 2026-04-15T21:10:10.892Z
      - _ulid: 01KP9JMBKEZNG4Y5TXZTNQB17W
        author: "@claude"
        body: "Fixed: replaced single maxMinVersion tracking with ProbeResult ranges that carry both
          minVersion and maxVersion. Old manifest versions now cap at maxVersion 0.8.99. After all
          probes fire, the code computes the global intersection (max of mins, min of maxes). If
          globalMin > globalMax, probes are contradictory → returns unknown. Test added that creates
          manifest with kynetic: 1.0 (caps < 0.9) + kspec.config.yaml (requires >= 0.11) and asserts
          unknown confidence."
        created_at: 2026-04-15T22:01:48.398Z
    kind: blocker
    resolved_at: 2026-04-15T22:02:29.055Z
    resolved_by: "@claude"
  - _ulid: 01KP9FP3ZWSTPEGY2SSGW56G85
    anchor:
