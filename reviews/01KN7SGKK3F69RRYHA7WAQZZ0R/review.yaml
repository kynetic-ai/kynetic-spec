    entries:
      - _ulid: 01KN7T0J0AS7Q69PB9VKEB8T2J
        author: Jacob Chapel
        body: The new ac-19 text now promises detection during health monitoring and containment so one
          project's monitoring cannot degrade other registered projects, but the existing annotated
          coverage still only proves startup-time watcher failures. The three ac-19 tests in
          tests/daemon-watcher-multi-project.test.ts:249-313 only mock EMFILE/ENFILE or a generic
          start() failure, and the ac-19 test in
          tests/daemon-session-sync-multi-project.test.ts:550-579 only proves WebSocket registration
          rejects when startWatcher() fails. None of those tests exercises the new health-monitoring
          path or verifies that other registered projects remain unaffected, so ac-19 now has false
          coverage.
        created_at: 2026-04-02T19:16:37.514Z
      - _ulid: 01KN7TQ8Z0YJD4J7J00VS94TPZ
        author: Jacob Chapel
        body: Fixed by narrowing @multi-directory-daemon ac-19 to the behavior currently covered by the
          existing annotated tests. The AC still frames resource pressure in terms of large
          directories or OS limits, but it now scopes detection to monitoring initialization and
          requires actionable guidance plus refusal to start monitoring for the affected project,
          instead of promising later health-monitor detection or broader cross-project containment.
        created_at: 2026-04-02T19:29:01.920Z
    kind: blocker
    resolved_at: 2026-04-02T19:29:04.161Z
    resolved_by: Jacob Chapel
