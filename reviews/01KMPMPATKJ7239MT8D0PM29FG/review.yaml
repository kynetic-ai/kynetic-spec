      path: src/daemon/entity-cache.ts
      side: head
    entries:
      - _ulid: 01KMPMYYHWEAGD40B040FNB5Y6
        author: "@claude"
        body: "Warmup state is still incorrect for domains later in the progressive load order. `loadAll()`
          only calls `loadDomain()` sequentially, and untouched domains remain `\"unloaded\"` until
          their turn starts, but every route treats only `\"loading\"` as the signal to return
          `_cache_status: \"loading\"`. The repo's own route-level test documents this mismatch
          (`tests/daemon-entity-cache.test:974-979` expects the route check to see `\"unloaded\"`
          before `loadAll()`), so requests for plans/reviews/triage/etc. during registration warmup
          will still fall back to disk instead of returning the required loading response. That
          breaks `@daemon-entity-cache` `ac-warming-availability` and undermines
          `ac-progressive-loading` for not-yet-started domains."
        created_at: 2026-03-27T03:21:16.604Z
      - _ulid: 01KMPP6QQZ3XAWX0SA3K8F6BRX
        author: "@claude"
        body: "Fixed: loadAll() now sets all domains to 'loading' upfront before starting sequential loads.
          This ensures routes see 'loading' (not 'unloaded') for not-yet-started domains and return
          _cache_status: 'loading' instead of falling through to disk. Added a test that verifies
          all domains show 'loading' or 'ready' after loadAll() starts."
        created_at: 2026-03-27T03:43:00.351Z
    kind: blocker
    resolved_at: 2026-03-27T03:43:03.741Z
    resolved_by: "@claude"
  - _ulid: 01KMPMZ23ZZ66YXSVAYQQJGVP8
    anchor:
      type: code
      commit: ea11de060b7e709735e4d74f9a686a48a8fde614
      line_end: 715
      line_start: 688
      path: src/daemon/entity-cache.ts
      side: head
    entries:
      - _ulid: 01KMPMZ2448JC705TJM6BCHEDZ
        author: "@claude"
        body: "The cache still eagerly preloads full plan/review/triage records during index loads. In
          `doLoadDomain()` the `plans`, `triage`, and `reviews` branches all load every full record
          and immediately populate `details`, so these domains are no longer \"detail on demand\" in
          any meaningful sense. I verified this against the snapshot with `bun --eval ...`: after
          `loadDomain(\"plans\")`, `loadDomain(\"reviews\")`, and `loadDomain(\"triage\")`,
          `getPlanDetail/getReviewDetail/getTriageDetail` all returned non-null before any detail
          request
          (`{\"planDetailPreloaded\":true,\"reviewDetailPreloaded\":true,\"triageDetailPreloaded\":\
          true}`). That violates the task's two-tier storage requirement and `@daemon-entity-cache`
          `ac-detail-on-demand` by keeping the heavy content hot in memory up front."
        created_at: 2026-03-27T03:21:20.261Z
      - _ulid: 01KMPP758PC0WVGEPEYYZRV8TY
        author: "@claude"
        body: "Fixed: Removed eager detail preloading from doLoadDomain() for plans, reviews, and triage.
          Index loading now only populates the index tier with summaries and clears the detail
          cache. Full records are loaded on demand when accessed by ID via the route-level
          get*Detail/set*Detail pattern. Added 3 behavioral tests that verify detail tier is null
          after loadDomain for each of these domains."
        created_at: 2026-03-27T03:43:14.198Z
    kind: blocker
    resolved_at: 2026-03-27T03:43:17.637Z
    resolved_by: "@claude"
