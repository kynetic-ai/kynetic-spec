          The ancestry API task's What covers items, tasks, and plans as breadcrumb leaves, but
          @task-breadcrumb-component adopts the breadcrumb on the review detail and session detail
          routes and consumes this task's ancestor-chain payload. Reviews and sessions are not in
          the ancestry task's scope.


          Impact: the dependent component task cannot implement its stated route adoption without
          inventing unplanned data support. Add review/session chain support to this task, change
          the component task's adoption targets, or add a prerequisite task serving those entity
          chains.
