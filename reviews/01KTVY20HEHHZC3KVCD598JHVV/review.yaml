threads:
  - _ulid: 01KTVY2ZC7AEQSWW8ES8FK7WQP
    anchor:
      type: structured
      ref: "@plan-web-ui-foundations"
      section: dependencies
    entries:
      - _ulid: 01KTVY2ZC8BX2Y32N9QV14XVRF
        author: "@claude"
        body: >-
          RE-RAISED from round 1 (thread 01KTVXBEGNMFE1YPQA1QNG3AJN) — unaddressed, no author reply,
          plan content unchanged since import.


          Cross-reference validation still fails for this plan as stored:
          @web-shell-platform-target, @client-preference-persistence, and @actor-identity-model are
          referenced in spec depends_on fields but do not exist in the spec catalog (re-verified
          this round: kspec item get fails for all three). They exist only inside
          @plan-ui-redesign-global-decisions, which remains draft and underived. Additionally noted
          this round: @coverage-state-presentation, referenced in this plan's implementation notes,
          is also catalog-absent for the same reason.


          Impact: approving/deriving this plan now produces broken refs. Either derive/approve the
          upstream decision plan first (the plan's own "Approval ordering" note acknowledges this
          constraint — but the constraint is currently unmet), or make this plan self-contained.
        created_at: 2026-06-11T18:11:08.808Z
    kind: blocker
  - _ulid: 01KTVY3HQPVGWEYBDYJJ6BERES
    anchor:
      type: structured
      field: What
      ref: "@task-breadcrumb-ancestry-api"
      section: tasks
    entries:
      - _ulid: 01KTVY3HQPAAZY78VCH0C8KCXX
        author: "@claude"
        body: >-
          RE-RAISED from round 1 (thread 01KTVXBHANSNSRJF8WHWW8J3X1) — unaddressed.


          The ancestry API task's What covers items, tasks, and plans as breadcrumb leaves, but
          @task-breadcrumb-component adopts the breadcrumb on the review detail and session detail
          routes and consumes this task's ancestor-chain payload. Reviews and sessions are not in
          the ancestry task's scope.


          Impact: the dependent component task cannot implement its stated route adoption without
          inventing unplanned data support. Add review/session chain support to this task, change
          the component task's adoption targets, or add a prerequisite task serving those entity
          chains.
        created_at: 2026-06-11T18:11:27.606Z
    kind: blocker
  - _ulid: 01KTVY3QR1R6VBJ3D2H7TAZV6A
    anchor:
      type: structured
      field: ac-3
      ref: "@actor-display"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTVY3QR1Q5PPNZMQJ7327MPY
        author: "@claude"
        body: >-
          RE-RAISED from round 1 (thread 01KTVXBMAHTC8P169DFJPM7AJM) — unaddressed.


          ac-3 is not deterministic as written. The Given provides only a review's lifecycle state
          and disposition, but the Then requires producing a specific identity (the reviewing
          identity, or the identity that authored the work under review). Those identities are not
          derivable from lifecycle + disposition alone — two reviews with identical
          state/disposition but different reviewers/authors satisfy the same Given yet require
          different outcomes. The spec description makes the same underdetermined claim ("derives,
          from a review's lifecycle state and disposition, which identity the review awaits"), and
          ac-4's "both present the same identity" depends on it.


          Fix: include the reviewer and work-author inputs in the Given (and description), or change
          the Then to yield a role/category (reviewer role / work-author role / none) rather than a
          concrete identity.
        created_at: 2026-06-11T18:11:33.761Z
    kind: blocker
  - _ulid: 01KTVY4D78V7J8CFV2TCKDMKXW
    anchor:
      type: structured
      field: Covers
      ref: "@plan-web-ui-foundations"
      section: tasks
    entries:
      - _ulid: 01KTVY4D79JQPVN1C80ZHB7EFR
        author: "@claude"
        body: >-
          RE-RAISED from round 1 (thread 01KTVXBQ6ZV1B640R0W60YJA6W) — unaddressed, and EXTENDED
          this round with an additional unclaimed row.


          @plan-ui-redesign-global-decisions makes its claim table binding on track plans: "a track
          plan that implements a decision's behavior claims the relevant criteria with task Covers:
          lines referencing the decision item directly." Re-verified against that table this round;
          rows assigned to this plan's work that no task here claims:


          - @web-shell-platform-target ac-3 → "keyboard registry plan" — this plan's
          @task-shortcut-registry implements exactly this (central platform mapping,
          browser-reserved avoidance) but covers only @ui-shortcut-registry.

          - @client-preference-persistence ac-1 → "UI foundations plan (preference utility)" —
          @task-preference-utility covers only @ui-preference-store.

          - @actor-identity-model ac-2 → "data upgrade plan (one-time migration)" —
          @task-actor-normalization-upgrade implements the one-time migration but covers only
          @actor-history-normalization. (If "data upgrade plan" means a different plan, state that
          in the implementation notes.)

          - NEW this round: @coverage-state-presentation ac-2 → "UI foundations plan (shared state
          tokens)" — @task-view-header-status-tokens builds the shared status-token module the table
          points at, and the plan's own design notes discuss the relationship to
          @coverage-state-presentation, but no Covers line claims ac-2.


          Impact: after the decision specs materialize, these decision ACs remain orphaned even
          though this plan implements their behavior, and the program cannot close while table rows
          are unclaimed. Add the Covers entries or adjust the upstream consumer mapping before
          approval.
        created_at: 2026-06-11T18:11:55.753Z
    kind: blocker
  - _ulid: 01KTVY56CPJF03R43997WT85VB
    anchor:
      type: structured
      field: What
      ref: "@task-review-author-resolution"
      section: tasks
    entries:
      - _ulid: 01KTVY56CP3QEVNP7Y01JWPA7K
        author: "@claude"
        body: >-
          RE-RAISED from round 1 (thread 01KTVXBSWDR8P1VDNSGNCH2BAZ) — unaddressed.


          The upstream claim table assigns @actor-identity-model ac-1 to "UI foundations plan
          (canonical-write identity layer)". That decision requires every newly written actor field,
          through any interface, to be a canonical agent identifier or the configured human identity
          — never a free-form variant. This task only replaces the ten anonymous fallbacks in the
          review routes (count re-verified this round) and explicitly passes caller-supplied actor
          values through unchanged; the getAuthor() chain it adopts ends in git/OS fallbacks that
          the decision itself classifies as free-form-variant-producing. This plan's
          @actor-identity-resolution ac-6 codifies that chain, so the plan as written can complete
          while new mutations still persist free-form variants, leaving ac-1 unsatisfied with no
          other claimant.


          Fix: add canonical-write work that covers @actor-identity-model ac-1, narrow the upstream
          consumer mapping, or state explicitly that this plan defers that criterion (and where it
          lands).
        created_at: 2026-06-11T18:12:21.526Z
    kind: blocker
  - _ulid: 01KTVY5D2GG2ZN0AHARHKJ8TR8
    anchor:
      type: structured
      ref: "@actor-identity-resolution"
      section: traits
    entries:
      - _ulid: 01KTVY5D2GVAC3J7Q63AVPBGNA
        author: "@claude"
        body: >-
          RE-RAISED from round 1 (thread 01KTVXBWJ0KNQY8EKG4QFE2V30) — unaddressed.


          The implementation notes defer applying @trait-api-endpoint to the identity endpoint as a
          post-derive manual step, but the plan neither declares the trait in spec metadata nor
          gives any task a Covers claim for the inherited trait ACs (re-verified:
          @trait-api-endpoint exists in the catalog with its own ACs).


          Impact: the API endpoint contract can be silently skipped after derive — nothing in the
          materialized work enforces the inherited criteria. Put the trait in the spec block if
          derivation supports it, or fold the trait application plus inherited-AC coverage into
          @task-identity-endpoint-classifier's What/Covers.
        created_at: 2026-06-11T18:12:28.368Z
    kind: blocker
  - _ulid: 01KTVY5KAT2C63655GEAXVT1N5
    anchor:
      type: structured
      field: ac-1
      ref: "@ui-view-header"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTVY5KATC4DG0N37YR10HTKV
        author: "@claude"
        body: >-
          RE-RAISED from round 1 (thread 01KTVXBZ85V04WJG3GKMR4THSW) — unaddressed.


          @ui-view-header ac-1's Given is "any entity detail view", but
          @task-view-header-status-tokens adopts the header only on the review detail and session
          detail pages while its Covers line claims ac-1. Other entity detail surfaces exist today
          (e.g. the item detail view whose getStatusColor this same task replaces).


          Impact: the Covers claim is broader than the work — ac-1's universal guarantee is left
          unimplemented for the remaining entity detail views with no other claimant. Either scope
          the AC to the intended initial surfaces, or expand/add tasks so every entity detail view
          the spec covers receives the standard header.
        created_at: 2026-06-11T18:12:34.778Z
    kind: blocker
  - _ulid: 01KTVY61V7V6DYZCSWJEW25QYQ
    anchor:
      type: structured
      ref: "@ui-shortcut-registry"
      section: description
    entries:
      - _ulid: 01KTVY61V8KPW3SGC8D8CHHNSN
        author: "@claude"
        body: >-
          NEW this round. The ACs rely on a context/scope concept — ac-1 "active in the current
          context", ac-4 "already bound in the same context" — but the spec description never
          introduces it; it describes the registry as one flat inventory. The task's What does
          define context/scope, so the concept exists only at implementation level.


          Suggestion: add a sentence to the description establishing that shortcuts are scoped to
          activation contexts and that collision detection applies within a context.
        created_at: 2026-06-11T18:12:49.640Z
    kind: nit
