    entries:
      - _ulid: 01KM0B4D9MM08MD7QJFGCEZ5ME
        author: "@claude"
        body: The _classifyDivergence method receives _mergeOutput (underscore-prefixed = unused parameter)
          but uses git rev-list counting instead. The docstring says 'based on the git merge
          --ff-only error output' which is misleading since the parameter is ignored. Rename to
          mergeOutput or remove it since the rev-list approach is actually more reliable.
        created_at: 2026-03-18T11:26:12.276Z
    kind: nit
  - _ulid: 01KM0B4RD2GKA5TM3TN1EY18NW
    anchor:
      type: code
      commit: 8f12b6fdd9df
      line_end: 207
      line_start: 201
      path: tests/dispatch-degraded-state.test.ts
      side: head
    entries:
      - _ulid: 01KM0B4RD2V5SQWKPV1RJPZ3QC
        author: "@claude"
        body: "Case 1 (localAhead > 0, remoteAhead === 0) and Case 2 (localAhead === 0, remoteAhead > 0) in
          _classifyDivergence are effectively unreachable when called from the divergence path:
          ff-only merge only fails when both sides have diverged (localAhead > 0 AND remoteAhead >
          0). Having the cases is reasonable as defensive code, but the test comment at line 201
          ('Case 1: Local has unpushed commits') is misleading — createDivergence creates mutual
          divergence hitting Case 3, which happens to contain 'unpushed merges' in its text.
          Similarly, createRemoteRewrite also produces mutual divergence (Case 3) rather than Case
          2. Not a correctness issue since the messages are appropriate for all divergence
          scenarios."
        created_at: 2026-03-18T11:26:23.650Z
    kind: nit
