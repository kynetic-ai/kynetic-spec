threads:
  - _ulid: 01KNDG8Q73JEXN4VB269WGEHPQ
    anchor:
      type: structured
      ref: "@task-elysia-node-adapter"
      section: tasks
    entries:
      - _ulid: 01KNDG8Q748476DWH774WXQSHS
        author: "@claude"
        body: "CRITICAL: ws.data property not supported under crossws. The plan identifies ws.ping() and
          ws.getBufferedAmount() as Bun-specific APIs, but misses that ws.data is itself a Bun
          ServerWebSocket feature. Under the Elysia node adapter, WebSockets are crossws Peer
          instances that do NOT have a mutable .data property. The daemon uses ws.data extensively
          across 5 files (server.ts, heartbeat.ts, handler.ts, pubsub.ts, lifecycle.ts) to store
          ConnectionData (sessionId, topics, seq, lastPing, lastPong, projectPath). This is the
          primary mechanism for per-connection state. Without ws.data, connection tracking,
          heartbeat, pub/sub, and multi-project routing all break. The plan needs a task to abstract
          per-connection state — likely using a WeakMap<WebSocket, ConnectionData> or similar
          pattern that works on both runtimes."
        created_at: 2026-04-05T00:21:45.828Z
    kind: blocker
  - _ulid: 01KNDG8S8XGKSK5N17QWKW3MCJ
    anchor:
      type: structured
      ref: "@task-elysia-node-adapter"
      section: tasks
    entries:
      - _ulid: 01KNDG8S8XV517MFH4HJD1C53C
        author: "@claude"
        body: The pong(ws) handler in server.ts:524 is a Bun-specific WebSocket lifecycle hook. Under
          crossws, pong is not one of the mapped events (only open, message, close, error are). The
          plan mentions this in the Implementation Notes (item 4 in the Bun-specific surface area
          list) but no task addresses it. Task task-ws-degradation-node mentions crossws event
          mapping but only guards ws.ping() — it does not handle the missing pong handler. Without
          pong reception, heartbeat tracking is fully broken on node, not just degraded. This should
          be explicitly called out and the heartbeat task should document that on node, both ping
          sending AND pong receiving are unavailable.
        created_at: 2026-04-05T00:21:47.933Z
    kind: blocker
  - _ulid: 01KNDG8VA9MRJ76GJKW5J63S64
    anchor:
      type: structured
      ref: "@task-elysia-node-adapter"
      section: tasks
    entries:
      - _ulid: 01KNDG8VAAFH45QJNNDBZ2W54E
        author: "@claude"
        body: 'tsconfig types and moduleResolution are unaddressed. The daemon tsconfig.json has "types":
          ["bun-types"] and "moduleResolution": "bundler". When running under node with tsx: (1)
          bun-types provides global type declarations (Bun.file, ServerWebSocket, etc.) that will
          type-check but not exist at runtime — this creates false safety; (2) moduleResolution
          bundler may cause import resolution differences under tsx/node. The plan needs a task to
          either make the tsconfig conditional, create a separate tsconfig for node builds, or at
          minimum document these as known type-check-only gaps. The ServerWebSocket type import used
          in 5+ files will need a runtime-agnostic type alias.'
        created_at: 2026-04-05T00:21:50.026Z
    kind: blocker
  - _ulid: 01KNDG9MSTNYP2VB0P8WMR6VVB
    anchor:
      type: structured
      ref: "@task-daemon-spawn-runtime"
      section: tasks
    entries:
      - _ulid: 01KNDG9MSTZP2QYQ5DQZKJS9GY
        author: "@claude"
        body: tsx is a devDependency (package.json line 96). The plan acknowledges this in Implementation
          Notes ("tsx needs to be a regular dependency or found via npx") and the task says to use
          npx tsx. However, npx tsx has meaningful overhead on every daemon spawn — it resolves the
          package, potentially downloads it, then runs it. For auto-start (which happens on every
          kspec CLI invocation when auto_start is true), this adds latency to every command. Should
          tsx be promoted to a regular dependency, or should the plan specify building the daemon to
          JS (eliminating the tsx requirement for node)? The plan mentions this tangentially ("the
          build pipeline needs to compile to .js — addressed separately if needed") but it should be
          a deliberate decision, not a deferred one.
        created_at: 2026-04-05T00:22:16.122Z
    kind: question
  - _ulid: 01KNDG9PQHYT90XWS86NQCRES6
    anchor:
      type: structured
      ref: "@daemon-runtime-adapter"
      section: specs
    entries:
      - _ulid: 01KNDG9PQH7F2HVQFJ94A9DME5
        author: "@claude"
        body: The spec has no AC for the ws.publish() / topic broadcast mechanism. Under bun,
          ws.publish(topic, message) is the native pub/sub broadcast. Under crossws,
          subscribe/unsubscribe are no-ops (the plan notes this), which means ws.publish() also does
          not work — messages do not reach subscribers because there are no transport-level
          subscriptions. The pubsub.ts broadcastToTopic() at line 148+ likely iterates connections
          and calls ws.send() directly, which would work. But if any code path uses ws.publish(), it
          will silently fail on node. This needs verification and an AC if the behavior differs.
        created_at: 2026-04-05T00:22:18.097Z
    kind: question
  - _ulid: 01KNDG9RN00GK5KSSAKREDQX5M
    anchor:
      type: structured
      ref: "@task-elysia-node-adapter"
      section: tasks
    entries:
      - _ulid: 01KNDG9RN0P6GBX1ACNQE9RNJK
        author: "@claude"
        body: No version compatibility verification for @elysiajs/node. The task says "Check version
          compatibility with the current elysia version (^1.1.31). The node adapter versioning
          typically tracks the main Elysia version." This is a hope, not a verified fact. The Elysia
          node adapter (@elysiajs/node) was released later and may have different version
          constraints. If the adapter requires elysia ^1.2 or ^2.0, the plan needs to account for an
          Elysia upgrade or pin to a specific adapter version. This should be verified before the
          plan is approved — check npm for the adapter version range.
        created_at: 2026-04-05T00:22:20.064Z
    kind: question
  - _ulid: 01KNDG9TG9NZA4BJX7HF6SP8ZD
    anchor:
      type: structured
      section: dependencies
    entries:
      - _ulid: 01KNDG9TGA06NDP2Y6E7QV013E
        author: "@claude"
        body: "Priority inversion: task-scope-ws-heartbeat-acs (P1) is documentation-only and has no
          dependents. It could be P2 or P3 without affecting any other task. Meanwhile,
          task-ws-degradation-node (P2) is functionally critical — if the daemon runs on node
          without the heartbeat guard, ws.ping() will throw and crash the heartbeat interval,
          killing all connection monitoring. Consider swapping priorities or at least making
          task-ws-degradation-node P1."
        created_at: 2026-04-05T00:22:21.962Z
    kind: question
  - _ulid: 01KNDGABYSQ1AQZ4CYD3G486QS
    anchor:
      type: structured
      field: description
      ref: "@daemon-runtime-adapter"
      section: specs
    entries:
      - _ulid: 01KNDGABYTEYYXES94A20SCXSB
        author: "@claude"
        body: 'Description mentions "runtime adapter for HTTP and WebSocket handling" — this leaks
          implementation detail (Elysia adapter pattern). Behavioral alternative: "the server uses
          runtime-appropriate mechanisms for HTTP and WebSocket handling."'
        created_at: 2026-04-05T00:22:39.834Z
    kind: nit
  - _ulid: 01KNDGADW3XZ7AN98EJ0FYRNWJ
    anchor:
      type: structured
      field: ac-node-http
      ref: "@daemon-runtime-adapter"
      section: acceptance_criteria
    entries:
      - _ulid: 01KNDGADW33GNAEC0FDEVYYX62
        author: "@claude"
        body: ac-node-http says "All routes serve identical responses as when running on bun" — this is a
          strong claim that may be violated by subtle differences (e.g., response header ordering,
          content-type casing). Consider "All routes serve functionally equivalent responses" or be
          explicit about what identical means (status codes, response bodies, content types).
        created_at: 2026-04-05T00:22:41.795Z
    kind: nit
