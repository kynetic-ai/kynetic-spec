    entries:
      - _ulid: 01KS9SYX2T1MQN6EMFWA4ZMEXZ
        author: Jacob Chapel
        body: 'MUST-FIX: resolveResourcePath treats the realpath of ownerResourcesDir as the trusted
          resource root. If <entity>/resources is itself a symlink to an outside directory, every
          declared file under that outside target is accepted as entity-owned. I confirmed this by
          running a temp fixture where entity/resources -> /tmp/outside and resolveResourcePath({
          relativePath: \"secret.txt\", manifest: declared secret.txt }) returned ok:true with
          absolutePath outside the entity. This violates ac-resource-reference-resolves-within-owner
          and ac-path-escape-rejected because a declared resource can read files outside the owning
          entity tree. Reject a symlinked resources root or verify the real candidate remains under
          the lexical entity resources directory, not just under the symlink target.'
        created_at: 2026-05-23T06:56:59.482Z
      - _ulid: 01KS9VABQZE4Y1NMXEDZTMBVJK
        author: "@claude"
        body: "Fixed: resolveResourcePath now lstat()s the ownerResourcesDir up-front and rejects when it is
          a symbolic link (before any realpath-based containment check). A new regression test
          creates entity/resources -> /tmp/outside, declares a manifest entry there, and asserts
          both resolveResourcePath and copyResourceForStaticExport reject with actionable guidance
          while the outside file is untouched. The existing per-file symlink-escape check still
          handles symlinks at any inner subdirectory level.
          src/parser/entity-local-resources.ts:342-362."
        created_at: 2026-05-23T07:20:43.510Z
    kind: blocker
    resolved_at: 2026-05-23T07:20:53.247Z
    resolved_by: "@claude"
  - _ulid: 01KS9SZ9PJY57Y77X5YVKS1NTS
    anchor:
      type: code
      commit: 5f4503684e7447da5fb464255d4b3b7785aafcc5
      line_end: 69
      line_start: 65
      path: src/schema/resources.ts
      side: head
    entries:
      - _ulid: 01KS9SZ9PKP599PGEJ6ZV6PMFH
        author: Jacob Chapel
        body: "MUST-FIX: ResourceMetadataSchema validates path only as a non-empty string, so resources.yaml
          accepts paths that the trait says must be rejected. I confirmed
          ResourceMetadataSchema.safeParse succeeds for path values /etc/passwd, ../secret.txt, and
          a backslash-separated path. Because this schema is the shared resources.yaml contract,
          invalid paths can be loaded and exposed through list/detail/API/static-export metadata
          before any resolver call gets a chance to reject them. Reuse the resource relative-path
          validation in the schema or manifest load path so absolute paths, traversal, and
          backslashes are rejected at the metadata boundary."
        created_at: 2026-05-23T06:57:12.403Z
      - _ulid: 01KS9VB46WM03A7JPJDYRBCT0H
        author: "@claude"
        body: "Fixed: hoisted the relative-path predicate (checkResourceRelativePath) into
          src/schema/resources.ts and applied it via a ResourcePathSchema superRefine on
          ResourceMetadataSchema.path. The schema now rejects absolute paths, parent traversal,
          backslashes, empty paths, redundant '.' segments, '//' empty segments, and trailing '/' at
          the manifest boundary. The runtime validator validateResourceRelativePath delegates to the
          same predicate so both layers reject identical shapes. Regression tests:
          ResourceMetadataSchema.safeParse against /etc/passwd, ../secret, a\\\\b\\\\c.png, '',
          logs/../escape, a/./b, a//b, a/, and loadResourceManifest rejects resources.yaml entries
          declaring /etc/passwd or ../escape paths. src/schema/resources.ts:37-101, 131-141."
        created_at: 2026-05-23T07:21:08.572Z
    kind: blocker
    resolved_at: 2026-05-23T07:21:18.134Z
    resolved_by: "@claude"
