      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXJR70G3ZDHQD7J9HFGCGERH
        author: Jacob Chapel
        body: "MUST-FIX: The ordered authority decision is executed here before runInvocation starts, not at
          the final artifact boundary. The real runInvocation path still awaits runner-registry
          loading, executable preflight, and skill-prompt construction before reaching
          invocation.ts:843/createSession. Because beforeCreate memoizes createHandoffPromise, its
          adjacent call cannot re-check authority. A pause or stop committed during that interval is
          therefore treated as losing to spawn and session/process artifacts can still be created
          even though control committed before actual creation. Keep one decision, but make the
          common adjacent pre-artifact hook the point that wins the lifecycle ordering."
        created_at: 2026-07-15T11:22:25.155Z
    kind: blocker
  - _ulid: 01KXJR73J9ASXFXF92V1GF14GK
    anchor:
      type: code
      commit: 3d1318853ad804fec1fc61d256c036851b77c0a2
      line_end: 224
      line_start: 214
      path: tests/dispatch-spawn-control-race.test.ts
      side: head
    entries:
      - _ulid: 01KXJR73J9AA8JTBJRSJTTWJ1X
        author: Jacob Chapel
        body: "MUST-FIX: These AC tests mock runInvocation—the component that owns createSession and adapter
          spawning—and replace both artifacts with counters incremented immediately after
          beforeCreate. They never execute the real common artifact path and would still pass if the
          supposedly final hook at invocation.ts:843 were removed, because dispatch invokes the
          memoized hook early. This does not prove ac-final-gate-prevents-session-creation or
          ac-final-gate-prevents-process-creation. Replace or supplement it with behavioral coverage
          through the real runInvocation boundary, asserting no persisted session and no adapter
          spawn when control wins."
        created_at: 2026-07-15T11:22:28.297Z
    kind: blocker
