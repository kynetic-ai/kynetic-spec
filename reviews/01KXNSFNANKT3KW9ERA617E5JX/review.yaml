    entries:
      - _ulid: 01KXNTSSV3TFMTH3PBQ2TMM0FX
        author: Jacob Chapel
        body: 'MUST-FIX — Preserve invalid-project recovery before strict lifecycle-envelope parsing. Both
          fetchAgentStatus (line 1325) and controlDispatchLifecycle (line 1505) send every non-2xx
          body here, but project-context middleware returns a 400 body shaped as { error: "Invalid
          kspec project ..." }. This function requires error to be an object, so it throws an
          envelope/type error and never calls isInvalidProjectError/clearInvalidSelection. The base
          status/control paths used handleResponseError, which did clear the stale selected project.
          Impact: @multi-directory-daemon ac-36 regresses for the agents status fetch and lifecycle
          controls; localStorage keeps the deleted/invalid project selected and the user sees an
          unrelated fixed lifecycle-health failure instead of recovering. Evidence:
          tests/daemon-path-validation-middleware.test.ts:288-298 proves the actual 400/string
          response shape; project.svelte.ts:190-211 defines the required clearing behavior; the
          fresh full suite passes only because tests/web-ui/dispatch-lifecycle-controls.test.ts
          mocks isInvalidProjectError to false and has no invalid-project integration case. Detect
          this response using the HTTP status plus parsed message before applying strict canonical
          lifecycle parsing, and add a behavioral regression test that observes
          clearInvalidSelection.'
        created_at: 2026-07-16T16:05:21.379Z
    kind: blocker
  - _ulid: 01KXNTSZN8V7HNKTY6ZM79AYSA
    anchor:
      type: code
      commit: ccdbdbf1576a4b84197652909759850dff01cc5c
      line_end: 73
      line_start: 64
      path: packages/web-ui/src/lib/components/agents/HeldTaskRow.svelte
      side: head
    entries:
      - _ulid: 01KXNTSZN8TR3MER8E7F1SVTCE
        author: Jacob Chapel
        body: "MUST-FIX — Emit task lifecycle updates from a live region that survives a successful
          row-removing transition. runAction waits for onAction and only then writes liveStatus, but
          the mutation's onSuccess replaces the cached status first. A successful Resume task can
          remove the task from both heldTasks and taskControls, so the keyed HeldTaskRow at
          agents/+page.svelte:287/298 is unmounted before this row-local live region is populated;
          the page-level live region tracks invocation WebSocket events only. Impact:
          @ui-agent-dispatch ac-lifecycle-live-update and the task's requirement that lifecycle
          status changes use a polite atomic live region are not met for successful task
          resume/removal. The 50-test agents browser run covers only the persistent global
          dispatch-live-status case (agents.spec.ts:369-410), not a successful task transition that
          removes its row. Move/forward task lifecycle announcements to a persistent parent live
          region and add a browser behavioral test for this removal path."
        created_at: 2026-07-16T16:05:27.337Z
    kind: blocker
  - _ulid: 01KXNTV4PVK79SWPT0701A2RD7
    entries:
