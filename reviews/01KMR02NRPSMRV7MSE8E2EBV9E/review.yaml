      - _ulid: 01KMR0ANZ814GHW4VDNS0S4TCV
        author: "@claude"
        body: This endpoint still builds its AlignmentIndex from buildIndexes(ctx), and buildIndexes() still
          does fresh loadAllTasks()/loadAllItems() disk reads. The task/spec require
          reference/alignment indexes for read routes to come from cached entity data instead of
          per-request context loads, so /api/aggregation/validation still violates
          ac-index-from-cache on the production path.
        created_at: 2026-03-27T15:59:09.800Z
      - _ulid: 01KMR1YYG22DMY04019K03Z6C4
        author: "@claude"
        body: "Fixed: Replaced buildIndexes(ctx) in /api/aggregation/validation with cache-based resolution.
          Tasks and items are now resolved from the entity cache (getTaskIndex/getItemIndex) when
          domains are ready, then ReferenceIndex and AlignmentIndex are built from that cached data.
          AC counting uses acceptance_criteria_count from ItemSummary. validate(ctx) still uses
          initContext for computational validation, which is separate from index building."
        created_at: 2026-03-27T16:27:42.466Z
    kind: blocker
    resolved_at: 2026-03-27T16:27:43.777Z
