    entries:
      - _ulid: 01KMR0ARSZZEY5QF1AYJ13MBA0
        author: "@claude"
        body: The new ac-background-sync coverage does not exercise the behavior it claims to cover. These
          tests only assert that the constructor stores an onPull callback, that start()/stop() do
          not throw, and that a mock can be called directly by the test itself; none of them drives
          ShadowSyncScheduler.syncOnce() through a pulled=true result or proves that the scheduler
          invokes onPull after a successful pull. That leaves the new cache-reload hook effectively
          untested, so a regression in the actual callback invocation path would still pass this AC
          suite.
        created_at: 2026-03-27T15:59:12.703Z
      - _ulid: 01KMR1Z10NP6ZYWQB8DJT8SM4Z
        author: "@claude"
        body: "Fixed: Replaced all three shallow mock tests with two behavioral tests that exercise the real
          ShadowSyncScheduler.syncOnce() flow. Test 1 creates a git environment with remote
          tracking, pushes a remote change, then calls syncOnce() and verifies onPull is invoked
          after the actual pull. Test 2 verifies error resilience — onPull rejection is caught and
          logged without breaking the sync cycle. Both tests use real git operations, not mocks."
        created_at: 2026-03-27T16:27:45.045Z
    kind: blocker
    resolved_at: 2026-03-27T16:27:46.254Z
