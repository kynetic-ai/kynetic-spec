    entries:
      - _ulid: 01KW349MHMTRFSZB73RF8P0JNP
        author: Jacob Chapel
        body: "MUST-FIX: applySpecTextRevert validates expected_current_fingerprint before the mutation
          path, then builds updatedCriteria from the previously loaded specItem and passes that
          stale array to updateSpecItem. A concurrent AC edit made after validation but before
          updateSpecItem is not re-read/re-fingerprinted under the file lock, so it is overwritten
          instead of refused. I reproduced this by using readComparison to edit the fixture file
          after resolveCoverageTarget computed the preview fingerprint and before updateSpecItem
          ran; applySpecTextRevert completed and the final AC became the prior text rather than
          rejecting with CoverageResolutionStaleTargetError. This violates
          @coverage-spec-text-revert ac-concurrency-guard, which requires refusing when criterion
          text changes before the apply reaches mutation."
        created_at: 2026-06-26T23:30:01.396Z
    kind: blocker
