      - _ulid: 01KPPAGD0GTEHP430S62FTRZQD
        author: Jacob Chapel
        body: The new coverage only exercises POST /api/projects, middleware auto-registration, and DELETE
          unregistration. This task explicitly required all four registration paths plus both
          unregistration paths, but there is still no behavioral test for WebSocket project
          resolution and no test for watcher-permanent-failure cleanup. Because the implementation
          relies on a shared callback/unregister hook to cover those code paths, omitting them
          leaves the main regression surface unverified.
        created_at: 2026-04-20T20:49:57.776Z
      - _ulid: 01KPPBJ73CNHRCWF1P7J0YJRZ6
        author: "@claude"
        body: "Fixed: Added behavioral tests for WebSocket project resolution (via resolveWebSocketProject
          with onProjectRegistered callback that calls startShadowSyncForProject) and
          watcher-permanent-failure cleanup (via ProjectContextManager.unregisterProject triggering
          the unregisterCallback that calls stopShadowSyncForProject). All four registration paths
          and both unregistration paths are now covered."
        created_at: 2026-04-20T21:08:25.835Z
    kind: blocker
    resolved_at: 2026-04-20T21:08:40.417Z
    resolved_by: "@claude"
  - _ulid: 01KPPAGFXHXD1S6TMN79GGXQW5
    anchor:
      type: code
      commit: 0159843c6e04c7088b536b8185d100e86c91e380
      line_end: 80
      line_start: 63
      path: src/daemon/shadow-sync-manager.ts
      side: head
    entries:
      - _ulid: 01KPPAGFXHY4XBESDYSE9TTJWY
        author: Jacob Chapel
        body: startShadowSyncForProject still creates a scheduler whenever sync_interval > 0, even when the
          project has no shadow remote tracking configured. In this workspace kspec.config.yaml has
          no shadow.remote, but running 'node --import tsx -e "import { startShadowSyncForProject,
          stopShadowSyncForProject, shadowSyncSchedulers } from
          './src/daemon/shadow-sync-manager.ts'; const project = process.cwd(); await
          startShadowSyncForProject(project, { broadcast() {} }, () => undefined);
          console.log(shadowSyncSchedulers.has(project), shadowSyncSchedulers.size);
          stopShadowSyncForProject(project);"' printed that a scheduler was started and added to the
          map. That violates @config-shadow ac-13/ac-14, and it also misses task case (e), which
          requires projects without remote tracking to avoid scheduler creation entirely.
        created_at: 2026-04-20T20:50:00.753Z
      - _ulid: 01KPPBK0E1YRZEJYYQN8ANR76S
        author: "@claude"
        body: "Fixed: Added config.shadow.remote guard to the scheduler creation condition (line 66:
          syncInterval > 0 && config.shadow.remote). Projects without shadow remote tracking
          configured no longer get a scheduler. Added a dedicated test case verifying that
          setupConfigMock({ hasRemote: false }) results in no scheduler being created."
        created_at: 2026-04-20T21:08:51.777Z
    kind: blocker
    resolved_at: 2026-04-20T21:09:00.160Z
