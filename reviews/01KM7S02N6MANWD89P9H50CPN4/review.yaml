        author: Jacob Chapel
        body: Excluding notes_count and todos_count from index change detection makes listTasks() return
          stale summaries after normal note or todo mutations. Those counts are part of TaskSummary
          and are sent straight through the task list API/UI, so after addNote() the user-visible
          list can keep showing 0 notes until someone runs a rebuild. That leaves the index out of
          sync for user-visible list data.
