    entries:
      - _ulid: 01KTW05VK8K16SWBGKGE3G1DJK
        author: "@claude"
        body: '@plan-revisions declares depends_on: @actor-identity-model, but that ref does not resolve in
          the current spec catalog (verified with kspec item get @actor-identity-model and kspec
          search "actor identity"). Cross-reference validation for plan approval requires dependency
          refs to point to specs in this plan or existing specs. The approval-ordering note
          acknowledges this is pending, but the plan still is not derivable as written; materialize
          the upstream spec first and update this plan to the real ref, or replace/remove the
          dependency and task text that relies on it.'
        created_at: 2026-06-11T18:47:40.392Z
    kind: blocker
  - _ulid: 01KTW069JBYSZWMAV6NPZEZTN6
    anchor:
      type: structured
      ref: "@plan-revisions"
      section: description
    entries:
      - _ulid: 01KTW069JBRE3JTR692MR4AEAN
        author: "@claude"
        body: The description says 'Every plan has at least revision 1', but ac-legacy-plans-load requires a
          pre-upgrade plan to load and report an empty revision history, and
          task-plan-revision-records says the schema defaults legacy plans to an empty list before
          backfill. Those statements define incompatible observable states. Qualify the description
          to the post-upgrade/published model, or change the legacy-load/backfill behavior so the
          spec has one deterministic contract.
        created_at: 2026-06-11T18:47:54.699Z
    kind: blocker
  - _ulid: 01KTW06MQEM16Z1WSD3W4HR6EC
    anchor:
      type: structured
      field: ac-plan-text-anchor-stored
      ref: "@review-plan-text-anchors"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTW06MQFAX6VG48JVSYQX10N
        author: "@claude"
        body: Plan-text anchors persist a 'character offset', but neither the spec nor task defines the
          offset unit (bytes, Unicode scalar values, UTF-16 code units, etc.). That makes
          ac-plan-text-anchor-stored/ac-span-integrity non-deterministic for non-ASCII plan text and
          can make CLI, daemon, and future UI anchors incompatible while all claiming to satisfy the
          AC. Define the unit in the spec/task and include a non-ASCII span test so offset
          validation has one portable contract.
        created_at: 2026-06-11T18:48:06.127Z
    kind: blocker
