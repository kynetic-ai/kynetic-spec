threads:
  - _ulid: 01KTW05VK8600AF54YTPCQW64G
    anchor:
      type: structured
      field: depends_on
      ref: "@plan-revisions"
      section: dependencies
    entries:
      - _ulid: 01KTW05VK8K16SWBGKGE3G1DJK
        author: "@claude"
        body: '@plan-revisions declares depends_on: @actor-identity-model, but that ref does not resolve in
          the current spec catalog (verified with kspec item get @actor-identity-model and kspec
          search "actor identity"). Cross-reference validation for plan approval requires dependency
          refs to point to specs in this plan or existing specs. The approval-ordering note
          acknowledges this is pending, but the plan still is not derivable as written; materialize
          the upstream spec first and update this plan to the real ref, or replace/remove the
          dependency and task text that relies on it.'
        created_at: 2026-06-11T18:47:40.392Z
      - _ulid: 01KTW3KZ8MCA000WHKPBCT99ES
        author: "@claude"
        body: "Addressed in re-import: removed the structured depends_on from plan-revisions entirely.
          Revision-author attribution now reuses the existing actor attribution (same vocabulary as
          review records and notes), centralized in one resolution helper per
          task-plan-revision-records. The implementation note Actor-identity sequencing documents
          how the helper adopts the P0a canonical identity spec when it materializes. The plan now
          carries no unresolved cross-plan references and is derivable as written."
        created_at: 2026-06-11T19:47:48.628Z
    kind: blocker
    resolved_at: 2026-06-11T19:59:54.200Z
    resolved_by: "@claude"
  - _ulid: 01KTW069JBYSZWMAV6NPZEZTN6
    anchor:
      type: structured
      ref: "@plan-revisions"
      section: description
    entries:
      - _ulid: 01KTW069JBRE3JTR692MR4AEAN
        author: "@claude"
        body: The description says 'Every plan has at least revision 1', but ac-legacy-plans-load requires a
          pre-upgrade plan to load and report an empty revision history, and
          task-plan-revision-records says the schema defaults legacy plans to an empty list before
          backfill. Those statements define incompatible observable states. Qualify the description
          to the post-upgrade/published model, or change the legacy-load/backfill behavior so the
          spec has one deterministic contract.
        created_at: 2026-06-11T18:47:54.699Z
      - _ulid: 01KTW45Y3MFRC2ETCZGRCGZ5AS
        author: "@claude"
        body: "Addressed in re-import: the description is now qualified to the post-upgrade model — once the
          revision data upgrade has run, every plan has at least revision 1; a plan persisted before
          revision support and not yet upgraded loads with an empty revision history until the
          upgrade or its first publish records one. This matches ac-legacy-plans-load and the schema
          default in task-plan-revision-records, so there is one deterministic contract."
        created_at: 2026-06-11T19:57:37.267Z
    kind: blocker
    resolved_at: 2026-06-11T20:00:00.974Z
    resolved_by: "@claude"
  - _ulid: 01KTW06MQEM16Z1WSD3W4HR6EC
    anchor:
      type: structured
      field: ac-plan-text-anchor-stored
      ref: "@review-plan-text-anchors"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTW06MQFAX6VG48JVSYQX10N
        author: "@claude"
        body: Plan-text anchors persist a 'character offset', but neither the spec nor task defines the
          offset unit (bytes, Unicode scalar values, UTF-16 code units, etc.). That makes
          ac-plan-text-anchor-stored/ac-span-integrity non-deterministic for non-ASCII plan text and
          can make CLI, daemon, and future UI anchors incompatible while all claiming to satisfy the
          AC. Define the unit in the spec/task and include a non-ASCII span test so offset
          validation has one portable contract.
        created_at: 2026-06-11T18:48:06.127Z
      - _ulid: 01KTW47BCVZY77035M90XNZT19
        author: "@claude"
        body: "Addressed in re-import: the offset unit is now defined as Unicode code points counted from
          the start of the section content — never bytes and never UTF-16 code units — in the spec
          description and in ac-plan-text-anchor-stored. task-plan-text-anchors documents the unit
          on the schema field and its test list gains a non-ASCII span case with multi-byte and
          surrogate-pair characters (CJK and emoji) preceding the span, proving code-point
          counting."
        created_at: 2026-06-11T19:58:23.642Z
    kind: blocker
    resolved_at: 2026-06-11T20:00:12.894Z
    resolved_by: "@claude"
  - _ulid: 01KTW06ZESX5V02Q6T2Z80DYQQ
    anchor:
      type: structured
      ref: "@task-idea-thread-kind"
      section: tasks
    entries:
      - _ulid: 01KTW06ZETGQ9MR96P8CWNNSDA
        author: "@claude"
        body: The plan adds idea as a thread kind 'alongside blocker, question, and nit' and says idea
          threads behave like every other kind, but the existing @review-records-web-ui ACs still
          specify blocker/question/nit badges and kind selection, while this task updates only type
          unions and explicitly leaves rendering changes to later plans. Should idea be
          available/rendered in existing review UI in this plan, or should
          @review-idea-threads/task-idea-thread-kind explicitly scope supported write/render
          interfaces to CLI/API for now and add a follow-up spec for UI behavior?
        created_at: 2026-06-11T18:48:17.114Z
      - _ulid: 01KTW48PFGDG6E8DRZHQG4PBZ2
        author: "@claude"
        body: "Answered in re-import by taking the minimal-respec path: task-idea-thread-kind now also
          respecs review-records-web-ui ac-2 and ac-3 so the kind-badge and kind-selection
          enumerations include idea, with the matching enumeration-level change in the shipped
          review detail page (badge map entry plus kind option). The shipped UI therefore has
          specified treatment for idea threads as soon as write surfaces accept them; redesigned
          review surfaces remain with later plans."
        created_at: 2026-06-11T19:59:07.760Z
    kind: question
    resolved_at: 2026-06-11T20:00:20.381Z
    resolved_by: "@claude"
