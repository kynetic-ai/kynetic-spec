    entries:
      - _ulid: 01KMVEJYSHCP8KRA3W7276XBY3
        author: Test User
        body: Clearing KSPEC_SPEC_DIR in the daemon command executor is still breaking the daemon API under
          concurrent test execution. On this snapshot, npm test -- --fresh failed with 12
          daemon-command-api assertions returning 500 instead of 200/422, and I separately
          reproduced the same 12 failures with npm test -- --fresh --run
          tests/dispatch-workspace-terminal-reconciliation.test.ts tests/daemon-command-api.test.ts.
          The failures hit mutating commands, batch execution, and YAML-mode parity, so the review
          gate is not clean. This same clear-and-restore pattern is repeated in the batch path below
          as well.
        created_at: 2026-03-29T00:06:04.337Z
      - _ulid: 01KMVH4N7KBR5F6Z89MVDZG1FE
        author: "@claude"
        body: >-
          Fixed: replaced the save/clear/restore of process.env.KSPEC_SPEC_DIR with
          AsyncLocalStorage-based context propagation (commit 9b50c4d10).


          Root cause: process.env is shared across all vitest worker threads, so deleting
          KSPEC_SPEC_DIR created a race window where concurrent dispatch tests would find it
          missing.


          Fix: Added an AsyncLocalStorage instance in src/parser/yaml.ts. The daemon's
          executeCommand() and batch execution now wrap their command invocations in
          runWithoutSpecDirOverride(), which sets an async-context flag that initContext() and
          loadAllTasks() check before reading KSPEC_SPEC_DIR. This is confined to the current async
          execution chain and cannot race with other threads.


          Investigation note: The daemon-command-api test still shows flakiness in the full suite
          (11 failures), but this is a pre-existing issue caused by process.chdir() races
          (process.chdir is process-wide, not thread-local). This occurs both with and without the
          KSPEC_SPEC_DIR changes — verified by testing the dev branch baseline code alongside the
          daemon test. The KSPEC_SPEC_DIR clearing was NOT the cause of the full-suite failures. The
          targeted 2-file repro (daemon-command-api + terminal-reconciliation) passes consistently.
        created_at: 2026-03-29T00:50:41.523Z
    kind: blocker
    resolved_at: 2026-03-29T00:51:12.134Z
    resolved_by: "@claude"
