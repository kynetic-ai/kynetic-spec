    entries:
      - _ulid: 01KR5JTSF7JA9ZHXSE7V2DTPPD
        author: Jacob Chapel
        body: "MUST-FIX: detached-serve classification still matches non-daemon kspec commands by
          substring.  returns true when any string contribution contains  plus , so a command
          like  or  is reported as a detached daemon start even though the kspec subcommand is , not
          . This violates @daemon-test-guardrail-precision ac-unrelated-subprocesses-not-reported
          and the task's requirement that detached-serve detection be tied to a kspec daemon
          lifecycle command. Evidence: a synthetic oxlint probe against this snapshot exited 1 with
          two no-leaky-test-daemon diagnostics on those two non-daemon search calls."
        created_at: 2026-05-09T05:19:45.128Z
      - _ulid: 01KR5JVZ9CVFQT91GK3A2722MY
        author: Jacob Chapel
        body: 'Corrected details for the blocker above: argListResolvesToDetachedServe returns true when any
          string contribution contains the substring serve start plus --detach. That means
          non-daemon kspec commands such as exec("kspec search \"serve start --detach\"") and
          spawn("kspec", ["search", "serve start --detach"]) are reported as detached daemon starts
          even though the subcommand is search, not serve start. This violates
          @daemon-test-guardrail-precision ac-unrelated-subprocesses-not-reported and the task
          requirement that detached-serve detection be tied to a kspec daemon lifecycle command.
          Evidence: a synthetic oxlint probe against this snapshot exited 1 with two
          no-leaky-test-daemon diagnostics for those two search calls.'
        created_at: 2026-05-09T05:20:23.852Z
      - _ulid: 01KR5MGTJEHAHCQJGTWBX1W6SH
        author: "@claude"
        body: 'Fixed in 5222b9c23. Replaced the substring-based argListResolvesToDetachedServe with a
          positional-aware tokensResolveToDetachedServe that requires the FIRST TWO non-flag
          positionals after the kspec executable to be exactly `serve` then `start` (and `--detach`
          to appear as a flag token). All three call shapes were updated in lockstep: exec/execSync
          now tokenises the shell string quote-aware and slices off the leading `kspec`, then walks
          the rest; spawn/spawnSync/execFile/execFileSync walks each argv element as one OS argv
          slot (no whitespace re-split); runKspec/kspec gathers per-arg tokens via a helper that
          reuses the same shell tokeniser for strings and per-element semantics for arrays. Both
          reviewer reproductions (`exec("kspec search \"serve start --detach\"")` and
          `spawn("kspec", ["search", "serve start --detach"])`) now exit 0 with 0 errors against a
          synthetic oxlint probe. Added five behavioral regression tests under
          @daemon-test-guardrail-precision ac-unrelated-subprocesses-not-reported covering
          exec/spawn/execFile/runKspec false-positive shapes plus a free-form `kspec inbox add`
          shape whose body text mentions the lifecycle words. Targeted suite: 182 tests passed. Full
          suite: 8935 tests passed (5 added). Changed-file oxlint: 0 errors, 25 warnings (all
          pre-existing style; one fewer than cycle 11 because the old collectArgStringContributions
          helper is now unused and was removed).'
        created_at: 2026-05-09T05:49:15.726Z
    kind: blocker
    resolved_at: 2026-05-09T05:49:19.022Z
    resolved_by: "@claude"
