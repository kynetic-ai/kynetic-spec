      side: head
    entries:
      - _ulid: 01KRFNPQ6SV5Q5BVE80PKP3WEZ
        author: Jacob Chapel
        body: "MUST-FIX: approved helper imports are trusted even when the binding is type-only. The loop
          accepts any ImportSpecifier from an approved helper path and never checks stmt.importKind
          or spec.importKind, so a test with  plus  receives no no-leaky-test-daemon diagnostic.
          Type-only imports are erased at runtime, so the cleanup callback would throw instead of
          terminating the just-started daemon. Evidence: an ad hoc oxlint fixture with that exact
          import exited 0 and only reported no-unused-vars, with no no-leaky-test-daemon error.
          Reject type-only helper imports before returning true here."
        created_at: 2026-05-13T03:22:21.785Z
      - _ulid: 01KRFNW32W4AGGVR7XY6MX1W34
        author: Jacob Chapel
        body: "Clarification for the stripped examples in the blocker above: the failing fixture used a
          type-only import of killPid from ./helpers/daemon and then registered onTestFinished with
          a callback that calls killPid(pid). Oxlint exited 0 with only a no-unused-vars warning and
          no no-leaky-test-daemon diagnostic, proving the helper import trust path treats type-only
          imports as runtime cleanup."
        created_at: 2026-05-13T03:25:17.787Z
      - _ulid: 01KRFR45XJBFYZA7G3NDXQ2710
        author: "@claude"
        body: Fixed in f471dc1dc. isHelperNameImportedFromApprovedPath now rejects type-only imports at both
          the declaration level (stmt.importKind === "type", e.g. import type { killPid } from
          "./helpers/daemon") and the specifier level (spec.importKind === "type", e.g. import {
          type killPid } from "./helpers/daemon") before the recogniser credits the binding as
          approved cleanup. Verified by ad-hoc oxlint probes against both shapes — both now exit 1
          with a no-leaky-test-daemon error. Added two AC-annotated regression tests in
          tests/lint-no-leaky-test-daemon.test.ts (declaration-level and specifier-level type-only
          approved helper imports).
        created_at: 2026-05-13T04:04:39.985Z
    kind: blocker
    resolved_at: 2026-05-13T04:04:50.520Z
    resolved_by: "@claude"
  - _ulid: 01KRFNVBT1EV6BGZA7MHHP8Z0R
    anchor:
      type: code
      commit: 493ede939a32cbd9a28e66adea498ac5a08143bf
      line_end: 1387
      line_start: 1380
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KRFNVBT2AHH5N7BSZGA7B8XK
        author: Jacob Chapel
        body: "MUST-FIX: approved shared cleanup primitives have the same type-only import trust gap.
          isSharedCleanupPrimitiveImported accepts a type-only import of stopPidBounded from
          ./helpers/process-stop, so a local killPid helper that calls stopPidBounded is classified
          as terminating even though that primitive binding is erased at runtime. Evidence: an ad
          hoc oxlint fixture using import type for stopPidBounded exited 0 with only a
          no-unused-vars warning and no no-leaky-test-daemon diagnostic. This violates the
          cleanup-effect contract because helper-body trust must prove a runtime terminating
          primitive, not a type-only name."
        created_at: 2026-05-13T03:24:53.954Z
      - _ulid: 01KRFR4XKS035JGS0HJ48F7WYC
        author: "@claude"
        body: 'Fixed in f471dc1dc. isSharedCleanupPrimitiveImported applies the same type-only import
          filter: stmt.importKind === "type" (e.g. import type { stopPidBounded } from
          "./helpers/process-stop") and spec.importKind === "type" (e.g. import { type
          stopPidBounded } from "./helpers/process-stop") are both skipped before the recogniser
          credits the primitive binding as runtime cleanup. Verified by ad-hoc oxlint probes against
          both shapes wrapping a local killPid helper that calls the (erased) primitive — both now
          exit 1 with a no-leaky-test-daemon error. Added two AC-annotated regression tests in
          tests/lint-no-leaky-test-daemon.test.ts (declaration-level and specifier-level type-only
          shared primitive imports).'
        created_at: 2026-05-13T04:05:04.249Z
    kind: blocker
    resolved_at: 2026-05-13T04:05:15.049Z
    resolved_by: "@claude"
