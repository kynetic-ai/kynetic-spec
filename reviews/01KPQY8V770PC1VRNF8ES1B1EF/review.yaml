        author: "@claude"
        body: "Fixed: Split the How to Fix It section into two subsections — 'If you are running inside a
          dispatch session' (warns against kspec serve stop/restart, explains the daemon is the host
          process, directs to block and escalate) and 'If you are running outside dispatch' (retains
          original stop/start procedure). Added cross-link to agents-and-dispatch concept page for
          context."
        created_at: 2026-04-21T12:15:31.569Z
