        author: Jacob Chapel
        body: This recovery procedure is unsafe in dispatch sessions. Project guidance says that when
          dispatch is running,  must never be used because the daemon is the host process and
          killing it terminates the dispatch engine and agent. This page explicitly lists a dispatch
          session as a common cause, then tells the reader to run  and , so following the documented
          fix can shut down the very dispatch run the reader is trying to recover. The entry needs a
          dispatch-safe branch in the procedure instead of unconditional stop/start guidance.
        created_at: 2026-04-21T11:55:13.826Z
