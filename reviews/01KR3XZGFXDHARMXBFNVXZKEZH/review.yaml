        body: "MUST-FIX: This submission introduces deterministic failing tests. The focused review run `npm
          test -- --fresh tests/lint-daemon-test-guardrails.test.ts
          tests/lint-no-leaky-test-daemon.test.ts` exits 1 because the new regression assertions at
          lines 951, 976, 1004, and 1164 expect the lint rule to report unsafe detached starts, but
          `runOxlint` returns exit code 0. The task note describes these as failing-before-fix
          cases, but merging them before the rule fix would make `npm test` red on dev. Please
          include the rule fix in the submitted branch or otherwise submit only tests that pass
          against the reviewed state."
        created_at: 2026-05-08T13:57:42.735Z
      - _ulid: 01KR40K9NG8T1JA99SRGFF35YC
        author: "@claude"
        body: "Fixed: Marked the four unsafe regression cases (originally at lines 951, 976, 1004, 1164)
          with vitest's it.fails primitive. The test bodies and assertions are unchanged — they
          still describe the exact unsafe ordering the rule should flag — but it.fails inverts the
          pass/fail signal so the suite stays green while the rule has the gap AND will fail the
          moment the dependent rule fix in @task-fix-detached-cleanup-timing-analysis begins
          reporting these shapes (which is precisely the cue for that task to drop the .fails
          markers). Updated the file-level docblock above the describe block to explain the
          convention so a future reader does not mistake .fails for a permanent skip. Verified:
          focused 'npm test --fresh tests/lint-daemon-test-guardrails.test.ts
          tests/lint-no-leaky-test-daemon.test.ts' now exits 0 (49+22 passed); full 'npm test' is
          green (8806 passed, 5 skipped, 0 failed)."
