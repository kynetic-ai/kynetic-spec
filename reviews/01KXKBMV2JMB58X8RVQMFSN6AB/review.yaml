      path: src/agent-runtime/invocation.ts
      side: head
    entries:
      - _ulid: 01KXKCP0TC38C9HRX0FM4K5C06
        author: pr-reviewer
        body: "MUST-FIX — Normal invocation cleanup records exited_at without observing process exit.
          disposeAgent only sends best-effort SIGTERM and destroys streams, but lines 1792-1797
          immediately persist exited_at. Recovery then treats that field as authoritative at
          dispatch.ts:2178-2180 and returns before reading or signalling the process group. I
          reproduced this with the submitted resistant ACP mock: runInvocation returned success,
          session metadata was completed with exited_at, and process.kill(pid, 0) still proved the
          child alive. A second engine probe with that live group returned an applied global stop,
          emitted zero signals, and removed cleanup as idle. This violates
          ac-stop-cancels-active-work and ac-live-group-prevents-cleanup-completion and can orphan
          an adapter permanently. Persist exited_at only after observed exit (with bounded
          escalation/recovery semantics), and add a normal-completion resistant-child stop
          regression."
        created_at: 2026-07-15T17:20:08.524Z
      - _ulid: 01KXKEDHHG2Y95CRVCZMG569KG
        author: Jacob Chapel
        body: "Fixed in eabcdee53e: dispatch-owned normal finalization now uses the same bounded SIGTERM
          then process-group SIGKILL reap and waits for the actual child exit event before
          persisting exited_at. Added a real resistant ACP normal-completion regression that proves
          the OS process is gone before durable exit evidence appears."
        created_at: 2026-07-15T17:50:27.888Z
    kind: blocker
  - _ulid: 01KXKCP42WT6KHB2BZ1Q9W72VP
    anchor:
      type: code
      commit: 29569d9efb5bc4674f7a7e830f6aa7f1c36fe716
      line_end: 1865
      line_start: 1851
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXKCP42WGV17W7W78AT6E9NP
        author: pr-reviewer
        body: "MUST-FIX — Stop collection can freeze a stale ownership tuple during natural completion.
          activeInvocationOwnership is populated only from the initial publication, while later
          group-member refreshes replace only the durable session/local ownership. After
          runInvocation closes the session and stamps exit, dispatch awaits workspace-idle work
          before deleting the active map entry; during that real window lines 1851-1860 seed the
          stale tuple, and line 1865 skips the newer durable tuple because the session is
          closed/exited. The immutable target then differs in group_members and every recovery
          attempt fails cleanup_ownership_mismatch. I reproduced this state with an initial active
          tuple containing the leader and a closed durable tuple containing a late verified child:
          global stop persisted failed owned cleanup with cleanup_ownership_mismatch. Prefer the
          latest verified durable tuple for retained active ownership even after session closure, or
          keep the active map synchronized, and add the completion/late-child race regression."
        created_at: 2026-07-15T17:20:11.868Z
    kind: blocker
  - _ulid: 01KXKCP78KKM52ARC32YVMGVV2
    anchor:
      type: code
      commit: 29569d9efb5bc4674f7a7e830f6aa7f1c36fe716
      line_end: 523
      line_start: 479
      path: tests/dispatch-stop-recovery.test.ts
      side: head
    entries:
      - _ulid: 01KXKCP78KTWM27CZT6S2DMFS0
        author: pr-reviewer
        body: MUST-FIX — The test annotated for ac-interrupted-stop-recovers-on-startup does not exercise
          global pending-cleanup recovery. Its fixture sets global authority to stopped but creates
          only pending_cleanup[taskA] and a stopped task record, so every recovered phase is
          task-scoped; only the task AC is proved. Project review policy requires each own AC
          annotation to be attached to a test that actually proves that AC. Add or correctly
          annotate a global-key pending-cleanup startup case that asserts global scheduling remains
          stopped while the matching phase resumes.
        created_at: 2026-07-15T17:20:15.123Z
    kind: blocker
  - _ulid: 01KXKCPAG9ZVKDRHZEG43XBNE0
    anchor:
      type: code
      commit: 29569d9efb5bc4674f7a7e830f6aa7f1c36fe716
      line_end: 566
      line_start: 547
      path: tests/dispatch-stop-recovery.test.ts
      side: head
    entries:
      - _ulid: 01KXKCPAG91X0NW001XYGDAK2D
        author: pr-reviewer
        body: MUST-FIX — The test annotated for ac-global-stop-is-idempotent never invokes global stop.
          Despite the title claiming both scopes, lines 557 and 560 call applyTaskLifecycleAction
          twice, so the task case is proved but the global AC is not. Add a global
          repeated/concurrent stop case (or attach the annotation to a test that fully asserts the
          global one-cleanup/one-success-plus-retry behavior) rather than claiming both scopes from
          this task-only test.
        created_at: 2026-07-15T17:20:18.441Z
    kind: blocker
