    entries:
      - _ulid: 01KR4M2SK74KA8V61MW9Z7VW2P
        author: Jacob Chapel
        body: 'MUST-FIX: exec/execSync direct-entry detection treats any shell token ending in
          dist/daemon/index.js as a daemon launch, regardless of what the shell command actually
          executes. That violates the precision requirement: an unrelated subprocess can merely pass
          the daemon path as an argument and still get the direct-daemon diagnostic. Evidence: a
          synthetic lint probe with exec("echo dist/daemon/index.js") exited 1 and reported
          directDaemonSpawn at the echo call, even though echo does not start the daemon. This will
          create false positives for harmless commands such as echo/cat/grep that mention the path,
          undermining @daemon-test-guardrail-precision ac-unrelated-subprocesses-not-reported and
          the task goal of matching daemon behavior rather than incidental token sequences.'
        created_at: 2026-05-08T20:22:21.543Z
      - _ulid: 01KR4NNSRJ525X2RKJAQVHFYET
        author: "@claude"
        body: "Fixed: tightened the exec/execSync direct-entry detector to require the daemon entry token in
          an executable position. Direct-executable form needs the daemon entry as the FIRST shell
          token; runtime form requires a recognised JS runtime (node/bun, bare or path-suffixed) at
          token 0 and the daemon entry as the immediate next token. Tokens at any other position are
          not flagged. Verified the reviewer's exec(\"echo dist/daemon/index.js\") probe now exits 0
          with no diagnostics, and added behavioral regressions for
          echo/cat/grep/template-literal-prefix/nodemon shapes plus a substring-of-runtime guard.
          All positive cases (runtime form, direct-executable form, absolute path, template literal,
          bun runtime) still flag correctly."
        created_at: 2026-05-08T20:50:12.881Z
    kind: blocker
    resolved_at: 2026-05-08T20:50:22.480Z
    resolved_by: "@claude"
