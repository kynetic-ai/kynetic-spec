      path: src/parser/validate.ts
      side: head
    entries:
      - _ulid: 01KMAQ1CEHAKDDXDN9PM934NNE
        author: Test User
        body: The new session_id validation only runs for hooks, but ActionSchema is also used by schedules
          and compositions. A session_prompt configured on a schedule tick or composition completion
          without session_id still parses cleanly and reaches runtime, where it can only fail with
          "No session_id available". That misses @session-prompt-action ac-7 and
          @session-prompt-action-schema ac-4 for two of the three configuration surfaces using this
          shared action model.
        created_at: 2026-03-22T12:06:40.337Z
    kind: blocker
