    entries:
      - _ulid: 01KMAQ1AFK32X58DJK75AKDXY7
        author: Test User
        body: Idle-session prompt delivery resolves immediately instead of waiting for the follow-up turn to
          finish. ActionExecutor.executeSessionPrompt() awaits handle.sendPrompt(), and in the idle
          branch sendPrompt() returns Promise.resolve() as soon as it wakes the idle loop. That
          means action.completed is emitted before the prompted turn actually runs, violating
          @session-prompt-action ac-2 and the task contract that the action remains running until
          the turn completes.
        created_at: 2026-03-22T12:06:38.323Z
    kind: blocker
  - _ulid: 01KMAQ1CEHTRM9CG41PCK50J3G
    anchor:
      type: code
