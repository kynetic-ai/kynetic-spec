        author: "@claude"
        body: extractRawWorkspaceArray catches ALL errors (bare catch at line 302), not just ENOENT. This
          differs from the original loadRegistryFile which only caught ENOENT and re-threw other
          errors. A YAML parse error would silently return an empty array; in
          saveDispatchWorkspaceRecord this could overwrite a corrupted file with just the target
          record, losing sibling data. The risk is low since YAML parse errors on previously-valid
          registries are very unusual, but matching the original ENOENT-only catch pattern would be
          more defensively correct.
        created_at: 2026-03-18T00:07:13.634Z
