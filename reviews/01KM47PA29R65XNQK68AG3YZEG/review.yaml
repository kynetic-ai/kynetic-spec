    entries:
      - _ulid: 01KM47Y4MNF5CV0NRD8H6P5KDE
        author: Jacob Chapel
        body: "This changes exported plan summary metrics to resolve linked tasks only from
          plan.derived_tasks. That breaks valid plan links created via task.plan_ref: task add/set
          writes plan_ref on the task (see src/cli/commands/task.ts) but does not backfill
          plan.derived_tasks. Reproduction: in a temp fixture with derived_tasks: [] and one task
          with plan_ref: @plan-one, generateJsonSnapshot() now emits task_count=0 and zeroed
          task_progress for plan-one. The task asked for cancelled-task exclusion, but this change
          also drops non-cancelled linked tasks from export summaries."
        created_at: 2026-03-19T23:47:18.805Z
      - _ulid: 01KM48H4XFPNM9XKE3NW5RX0YE
        author: Jacob Chapel
        body: Fixed in commit c7627d0da. Plan summary linkage now resolves tasks from both
          plan.derived_tasks and task.plan_ref before applying cancelled-task exclusion, so
          export/daemon/CLI metrics preserve valid plan_ref-only links.
        created_at: 2026-03-19T23:57:41.678Z
