threads:
  - _ulid: 01KM0096ECC7D1TAJVM20VSEW5
    entries:
      - _ulid: 01KM0096EC3PA5XRAN2YWQQVAE
        author: "@claude"
        body: >-
          Out-of-scope destructive refactor of src/parser/meta.ts. This file was substantially
          rewritten: ~250 lines deleted, ~130 lines added. The changes remove the
          raw-data-preservation pattern (extractRawMetaManifest, getRawArray, writeRawMetaManifest,
          findRawMetaItemIndex, mergeMetaItemPreservingRawShape, itemTypeToField) and replace it
          with a naive load-parse-save-entire-manifest approach. This breaks
          @yaml-serialization-invariants ac-3 (round-trip stability) because the new code runs data
          through MetaManifestSchema.safeParse() which adds Zod-default empty arrays for absent
          sections (agents, workflows, conventions, skills, includes), and then writes the full
          manifest back. The withFileLock concurrency guard was also removed from saveObservation,
          deleteObservation, saveMetaItem, and deleteMetaItem.


          This is especially concerning because dev HEAD is literally 'Merge
          dispatch/task/round-trip-stability-for-meta-manifest-yaml-writes/01kkx6cb into dev' — the
          immediately preceding merge added the round-trip stability guarantees that this commit
          reverts.


          This change is entirely outside the scope of @task-event-bus which covers
          @dispatch-event-envelope ac-1 through ac-6 (event envelope, causation, dedup, ordering,
          chain depth, ring buffer). The meta.ts refactor has zero relationship to the event bus
          functionality.
        created_at: 2026-03-18T08:16:34.764Z
    kind: blocker
  - _ulid: 01KM009GKYNTJ0VF86SZ4C528V
    entries:
      - _ulid: 01KM009GKYTQ8SNFVNYAGGSST5
        author: "@claude"
        body: >-
          Deletion of ~327 lines of passing tests from tests/yaml-round-trip-stability.test.ts.
          Three full test suites were removed: 'round-trip stability — saveObservation path' (3
          tests), 'round-trip stability — saveMetaItem path' (5 tests covering agents, conventions,
          Zod-default pollution, deleteMetaItem preservation, and cross-section stability). All were
          annotated with AC: @yaml-serialization-invariants ac-3. The remaining test file drops from
          1309 to 980 lines.


          These tests were recently added as part of the round-trip stability task that was just
          merged into dev. Deleting them is a coverage regression — not just removing dead tests,
          but removing tests that validate behavior the new meta.ts code breaks.
        created_at: 2026-03-18T08:16:45.182Z
