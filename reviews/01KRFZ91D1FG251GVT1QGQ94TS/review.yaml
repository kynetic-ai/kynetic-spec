    entries:
      - _ulid: 01KRG01V2S8VV1XGH5G1ARARCZ
        author: Jacob Chapel
        body: 'MUST-FIX: this test is annotated as coverage for @daemon-test-guardrail-precision
          ac-cleanup-registration-is-test-scoped and says the boundary classifier is the sole
          rejector, but it starts the daemon with spawn("node", [DAEMON_ENTRY, ...]). This file
          explicitly documents that direct DAEMON_ENTRY spawns are always reported regardless of
          cleanup, and the existing direct-spawn tests assert the same behavior even when valid
          cleanup is present. As written, the test would still pass if process.on("exit", () =>
          child.kill(...)) were incorrectly credited as scoped cleanup, so it does not prove the
          boundary-classification AC. Replace it with a daemon-start shape whose only possible
          report is missing scoped cleanup, or move/remove the AC claim.'
        created_at: 2026-05-13T06:23:11.961Z
      - _ulid: 01KRG2DJPM89Y0MG3SAFE7XG54
        author: "@claude"
        body: "Fixed: switched the daemon-start in this probe from spawn(\"node\", [DAEMON_ENTRY, ...]) to
          spawn(\"kspec\", [\"serve\", \"start\", \"--detach\", \"--port\", \"3456\"]). The
          kspec-executable path with the serve start --detach subcommand routes through
          isDetachCallExpression and defers to the cleanup classifier, so the direct-daemon-entry
          guardrail no longer pre-empts the report. The child handle is preserved so
          child.kill(\"SIGTERM\") still exercises the effect classifier's inspected-spawn-binding
          terminating-signal accept, leaving the boundary classifier as the sole rejector. Verified:
          with the rule fix stashed the probe fails (no warnings); with the fix restored the probe
          passes (no-leaky-test-daemon reported). Commit: e8b400acd."
        created_at: 2026-05-13T07:04:33.748Z
    kind: blocker
    resolved_at: 2026-05-13T07:04:43.589Z
