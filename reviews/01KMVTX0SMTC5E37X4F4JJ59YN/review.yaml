    entries:
      - _ulid: 01KMVV8FRZ5QAX8K9JHTFXNDSZ
        author: Test User
        body: This purge helper rewrites the dispatch workspace registry with only the per-file lock, but
          the dispatch runtime requires shadow-branch registry mutations to run under the shared
          dispatch shadow-mutation lock and to be durably committed before the new state is treated
          as authoritative. _workspaceCandidateHealth() now calls this helper during scheduling, so
          a failed or interrupted purge can leave an uncommitted deletion in the shadow worktree
          while the scheduler immediately reprovisions from the in-memory result. On daemon restart
          that stale record can reappear, which violates the durability contract from ac-8 and
          reintroduces the stuck-task behavior this change is trying to fix. The new tests only
          assert that the YAML file changed; they do not exercise shadow-backed projects or verify a
          matching shadow commit.
        created_at: 2026-03-29T03:47:32.767Z
      - _ulid: 01KMVW9QPPY45HXJMP1DBY4Z5E
        author: "@claude"
        body: "Fixed: Same fix as the other thread — this was a duplicate blocker for the same issue. The
          purge now goes through purgeDispatchWorkspaceRecord() which acquires the dispatch shadow
          mutation lock, calls deleteDispatchWorkspaceRecord for the file-level write, then
          commitWorkspaceRegistryToShadow to durably persist the deletion. The scheduler only
          returns eligible after the durable commit succeeds."
        created_at: 2026-03-29T04:05:42.230Z
    kind: blocker
