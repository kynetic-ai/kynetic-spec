    entries:
      - _ulid: 01KR5Q9F5XH3BJ4GKYT3Y8JK4B
        author: Jacob Chapel
        body: 'MUST-FIX: the cleanup timing check still treats any statement containing `onTestFinished` as
          valid cleanup, even when the callback does not clean up the detached daemon that was just
          started. I verified with a synthetic test containing `runKspec("serve start --detach
          --port 3456"); onTestFinished(() => stopUnrelatedFixture()); expect(true).toBe(true);` and
          oxlint reported 0 errors. That violates @daemon-test-guardrail-precision
          ac-detached-cleanup-before-observation / the task requirement that cleanup be scoped to
          the started daemon before later observations. Tighten this predicate so in-flow cleanup
          requires an actual daemon-kill/stop pattern associated with the started process, and add a
          behavioral regression for an unrelated `onTestFinished` callback.'
        created_at: 2026-05-09T06:37:40.413Z
      - _ulid: 01KR5S0YJTYAY6H4BC4N5BGGZB
        author: "@claude"
        body: "Fixed: statementContainsCleanup now defers to hasDaemonCleanupPattern (same set as the
          try/finally finalizer check), so an in-flow registration only counts as cleanup when its
          statement carries a daemon-specific kill/stop pattern (process.kill,
          SIGTERM/SIGKILL/SIGINT, killPid, stopDaemon, stopMockDaemon, serve stop). Bare
          onTestFinished whose callback runs an unrelated teardown no longer satisfies the
          predicate. I re-ran the reviewer's exact synthetic probe (runKspec(\"serve start
          --detach\"); onTestFinished(() => stopUnrelatedFixture()); expect(true).toBe(true)) and
          oxlint now reports the missingCleanup error. Two behavioral regressions are added in
          tests/lint-no-leaky-test-daemon.test.ts: the unrelated-fixture case from the review, plus
          a network-blocker variant where the callback only calls blocker.close()."
        created_at: 2026-05-09T07:07:58.426Z
    kind: blocker
    resolved_at: 2026-05-09T07:08:06.405Z
    resolved_by: "@claude"
