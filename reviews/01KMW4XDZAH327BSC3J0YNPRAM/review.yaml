    entries:
      - _ulid: 01KMW4YPA0WKECD77RARX720BM
        author: Jacob Chapel
        body: The proposed ac-envelope says any endpoint returns the normalized {data, meta} envelope, but
          the task graph only migrates read/query fetch paths. Existing daemon endpoints such as
          /api/projects, /api/health, /api/command, and POST mutation actions are outside the
          planned migration, so this AC would either be unimplemented or force a much larger
          contract change than the tasks describe. Narrow the AC/design decision to
          cache-warming-sensitive read endpoints, or add explicit tasks covering non-read endpoints
          and the corresponding client contract updates.
        created_at: 2026-03-29T06:36:57.536Z
    kind: blocker
  - _ulid: 01KMW4YPAWT82VQ687EN95NSQG
    anchor:
      type: structured
      ref: "@task-ui-unwrap-envelope"
      section: description
    entries:
      - _ulid: 01KMW4YPAX7HF8AQCKQYS602WG
        author: Jacob Chapel
        body: "This task still leaves the static-mode migration unresolved: it says the static data helpers
          should either return envelope-compatible shapes or the unwrapping should handle both
          formats. That leaves the worker without a single contract to implement or test. Pick one
          compatibility strategy and state where the normalization lives."
        created_at: 2026-03-29T06:36:57.565Z
    kind: question
  - _ulid: 01KMW4YPD1CND6MDT3YJ3F5ZP6
    anchor:
      type: structured
      section: context
    entries:
      - _ulid: 01KMW4YPD126EGKTDFYBPZDVFJ
        author: Jacob Chapel
        body: "The plan context currently says that after project registration, restart, or
          watcher-triggered reload, list endpoints return empty loading data. That is no longer true
          for watcher-triggered reloads: @daemon-entity-cache already has ac-stale-during-reload,
          and the implementation in src/daemon/entity-cache.ts keeps ready domains serving prior
          cached data during reload instead of regressing to loading. Leaving the current wording in
          place mis-scopes the work toward a behavior the system intentionally no longer has.
          Rewrite the context to target initial registration/restart or otherwise explain the
          specific remaining failure mode."
        created_at: 2026-03-29T06:36:57.633Z
    kind: blocker
