    entries:
      - _ulid: 01KSS35TJTATFKASM7QZ5TJK5Q
        author: Jacob Chapel
        body: "MUST-FIX: `detectUntrackedOverwriteHazards` only intersects exact path names, so it misses
          Git directory/file overwrite hazards. I reproduced a sync where remote `origin/dev` adds
          `conflict-dir/remote.txt` while the eligible occupied target checkout has an untracked
          file named `conflict-dir`. The preflight returned the checkout as eligible because
          `changedSet.has('conflict-dir')` is false, but the actual `git merge --ff-only origin/dev`
          failed with `untracked working tree files would be overwritten by merge: conflict-dir`.
          Dispatch then classified the failure as `divergence` and produced reset/remote-rewrite
          guidance instead of the required occupied-checkout cleanup guidance. This violates
          @dispatch-integration-mutation-scope ac-dirty-occupied-target-refusal-identifies-blocker
          and @dispatch-remote-branch-sync ac-unsafe-occupied-checkout-degraded-recovery for
          untracked/ignored hazards that Git reports at a parent or child path, not just exact file
          path matches."
        created_at: 2026-05-29T05:26:39.962Z
      - _ulid: 01KSS4HWA7PW63261ETBEEFN0W
        author: "@claude"
        body: >-
          Fixed: detectUntrackedOverwriteHazards (src/agent-runtime/workspace.ts) now compares paths
          as Git tree entries, not as raw strings. New pathsCollideAsTreeEntries helper returns true
          on exact match, untracked-file-is-ancestor-of-changed-path (your conflict-dir /
          conflict-dir/remote.txt repro), and untracked-file-is-descendant-of-changed-path (the
          directory-vs-file inverse). The "/" boundary check prevents false positives like config vs
          config.yaml. I reproduced your exact scenario against the updated build and the resolver
          now throws DispatchWorkspaceError with code occupied-checkout naming "conflict-dir" before
          any merge attempt, so dispatch classifies degraded.kind as occupied-checkout with
          remove/stash/commit/detach guidance, not divergence with reset/remote-rewrite guidance.


          The shell helper grep was also extended
          (templates/skills/merge/scripts/detached-reviewer-merge.sh, mirrored in .agents/ and
          .factory/ rendered copies) from "would be overwritten by merge" to also match "would lose
          untracked files" — Git emits the second wording for the directory-vs-file case.


          Regression coverage in tests/dispatch-target-sync.test.ts: "refuses a sync when the
          occupied checkout has an untracked file blocking a directory the incoming commit creates"
          (your repro), "refuses a sync when the occupied checkout has an untracked directory
          blocking a file the incoming commit creates" (inverse direction), and "does not refuse a
          sync when an untracked file is only a string prefix of a changed path (not a path-segment
          prefix)" (proves the / boundary check). Helper coverage added in
          tests/detached-reviewer-merge.test.ts: "refuses when the required merge would lose
          untracked files in a directory at a path the merge would write" (directory-variant of the
          existing exact-path test).
        created_at: 2026-05-29T05:50:43.527Z
    kind: blocker
