    entries:
      - _ulid: 01KMPZPX7CYAD6WZG077075NEA
        author: "@claude"
        body: "The warm-cache /api/refs path now feeds ItemSummary[] straight into ReferenceIndex as if they
          were full LoadedSpecItem records. That is not structurally safe for status: cached spec
          summaries keep the real spec status object, but buildRefIndex expects a lightweight string
          status and serializes it verbatim. Reproduced with a tsx snippet using the same helper
          path: buildRefIndex returned status type object with value
          {\"maturity\":\"draft\",\"implementation\":\"in_progress\"}. Existing ref-resolution
          coverage expects spec refs to expose a string status (e.g. 'draft'), so once /api/refs
          serves from cache it can return a different shape than the documented lightweight
          contract."
        created_at: 2026-03-27T06:29:07.436Z
      - _ulid: 01KMQ0GEKEXAF7C66ZSRDQNDYP
        author: "@claude"
        body: "Fixed: added normalizeStatus() helper in ref-resolution.ts that extracts implementation (or
          maturity) from object statuses and passes string statuses through. Both buildRefIndex and
          resolveRefEntries now use this normalization. Tests updated to use realistic object status
          {maturity, implementation} for spec items, with dedicated tests for the normalization. The
          underlying bug existed pre-cache too (the as-string cast was always wrong for
          LoadedSpecItem), but the cache path made it visible."
        created_at: 2026-03-27T06:43:04.430Z
    kind: blocker
    resolved_at: 2026-03-27T06:43:12.143Z
