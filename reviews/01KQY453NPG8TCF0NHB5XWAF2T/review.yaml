    entries:
      - _ulid: 01KQY4RSBG4PHX90X2F57HX746
        author: Jacob Chapel
        body: "MUST-FIX: daemon startup still writes only daemon.pid and legacy daemon.port; it never writes
          daemon.connection.json. The task and AC @daemon-network-endpoint-contract
          ac-connection-metadata require successful daemon startup to persist pid, port, bind_host,
          connect_host, api_url, ws_url, and runtime. The new metadata writer is only exercised by
          unit tests and is not called from the lifecycle path."
        created_at: 2026-05-06T07:59:18.384Z
      - _ulid: 01KQY7MCP3VY5WV1JHAFY18X4X
        author: "@claude"
        body: "Fixed: createServer now writes daemon.connection.json on startup via
          PidFileManager.writeConnectionMetadata, alongside the legacy daemon.pid and daemon.port
          files. Metadata fields (pid, port, bind_host, connect_host, api_url, ws_url, runtime) come
          from a single resolveDaemonEndpoint() call so they cannot drift from what the daemon
          actually binds. Added a behavioral test in tests/cli-serve.test.ts that starts the daemon
          detached and asserts the metadata file exists with the expected fields plus a 127.0.0.1
          health check that proves the bind host is the resolved address."
        created_at: 2026-05-06T08:49:20.067Z
    kind: blocker
    resolved_at: 2026-05-06T08:49:23.223Z
    resolved_by: "@claude"
  - _ulid: 01KQY4S05TBHYZQ8S74AV8G7NV
    anchor:
      type: code
      commit: 65bfbcb012624d11b50d350ce353d2161ca0d9da
      line_end: 642
      line_start: 634
      path: packages/daemon/src/server.ts
      side: head
    entries:
      - _ulid: 01KQY4S05TEABA0S288HA4F91H
        author: Jacob Chapel
        body: "MUST-FIX: the daemon still binds with hostname localhost instead of the resolved endpoint.
          DEFAULT_CONFIG now says 127.0.0.1 and the task requires all daemon binding code to use the
          shared resolver, but createServer hardcodes localhost and logs localhost URLs. That means
          default startup still depends on OS hostname resolution and configured daemon.host values
          cannot affect the actual listener."
        created_at: 2026-05-06T07:59:25.370Z
      - _ulid: 01KQY7MKQYXEVVHZF0WRXRWRG0
        author: "@claude"
        body: "Fixed: app.listen() now binds to the resolved bind host (DEFAULT_BIND_HOST = 127.0.0.1 by
          default, configured value otherwise) instead of the literal string 'localhost'.
          createServer accepts bindHost/connectHost in ServerOptions and routes them through
          resolveDaemonEndpoint() before binding. The daemon binary (packages/daemon/src/index.ts)
          gained --host/--connect-host CLI flags, and serve.ts forwards config.daemon.host /
          config.daemon.connect_host on every spawn (foreground and detached). Startup logs now show
          the resolved api_url and emit a visible warning when the bind host is non-loopback
          (ac-external-binding-warning). Behavioral coverage: tests/cli-serve.test.ts directly
          fetches http://127.0.0.1:<port>/api/health to prove the daemon is bound on the numeric
          IPv4 address rather than via OS hostname resolution."
        created_at: 2026-05-06T08:49:27.294Z
    kind: blocker
    resolved_at: 2026-05-06T08:49:30.343Z
    resolved_by: "@claude"
  - _ulid: 01KQY4SK9SJHR0CQ8WFST0WXQS
    anchor:
      type: code
      commit: 65bfbcb012624d11b50d350ce353d2161ca0d9da
      line_end: 95
      line_start: 78
      path: src/cli/daemon-proxy.ts
      side: head
    entries:
      - _ulid: 01KQY4SK9SGKW545Q49XJPMA4C
        author: Jacob Chapel
        body: "MUST-FIX: daemon clients still ignore the new connection metadata and derive URLs from the
          legacy port file. detectDaemon reads daemon.port and fetches
          http://127.0.0.1:<port>/api/health directly; other command paths similarly construct
          http://localhost:<port>. This violates the task requirement that command files receive or
          read a resolved endpoint object and AC @daemon-network-endpoint-contract
          ac-clients-use-metadata; a daemon advertising a different api_url or ws_url will not be
          used."
        created_at: 2026-05-06T07:59:44.953Z
      - _ulid: 01KQY7MSRAYMR9C66DPDCPG225
        author: "@claude"
        body: "Fixed: introduced resolveDaemonClientEndpoint() in src/daemon/endpoint.ts that reads
          daemon.connection.json first and only falls back to the legacy daemon.port file when
          metadata is absent. detectDaemon() and ensureProjectRegistered() / proxyCommand() now
          consume the resolved endpoint object (apiUrl, wsUrl) instead of synthesizing
          http://127.0.0.1:<port>. The DaemonDetectionResult type was extended with an endpoint
          field so command files receive a fully resolved endpoint, never a port number alone. The
          four duplicated getDaemonUrl() helpers in commands/agent.ts, event.ts, schedule.ts, and
          the ws URL in agent.ts now resolve via the shared helper, as does the postDispatchEvent
          path in commands/task.ts, the kspec serve status fetches in commands/serve.ts, and the
          doctor health probe in parser/daemon-status.ts. Behavioral tests in
          tests/cli-daemon-proxy.test.ts stand up an in-process server and prove detectDaemon (a)
          uses the metadata-advertised api_url when present and (b) falls back to the legacy port
          file when metadata is absent. tests/daemon-endpoint.test.ts adds round-trip coverage for
          resolveDaemonClientEndpoint including the metadata-over-legacy precedence."
        created_at: 2026-05-06T08:49:33.450Z
    kind: blocker
    resolved_at: 2026-05-06T08:49:36.513Z
    resolved_by: "@claude"
