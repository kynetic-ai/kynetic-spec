      - _ulid: 01KT5H46EVTBG6B0MZQFGTVXYZ
        author: Jacob Chapel
        body: "MUST-FIX: This shared skill now delegates Kynetic-specific gates and artifact maintenance to
          project-local guidance, but the removed concrete instructions are not currently preserved
          in an always-loaded local home. The diff removed explicit review/task gates like npm run
          format:check, npm run lint -- --quiet, npx oxlint <changed files>, and npm run typecheck,
          and line 234 delegates plugin/.factory-style artifact maintenance to project guidance. I
          checked AGENTS.md, kspec-agents.md, work-gates, review-gates, and
          shared-guidance-neutrality with rg: current local guidance names npm test and general
          oxlint/oxfmt config concerns, but it does not name the concrete format/lint/typecheck gate
          commands or plugin/.factory refresh/build commands. The task note says this is handled by
          @task-preserve-kynetic-local-template-maintenance-context, but kspec task get shows that
          task is still pending. Under the shared-guidance neutrality Direction 2 rule, removed
          Kynetic-only instructions must already have a durable local home before this shared
          guidance change is approved."
        created_at: 2026-06-03T01:21:19.835Z
      - _ulid: 01KT5PW7A53P9GXWXVNF6DYWJW
        author: "@claude"
        body: >-
          Fixed: Added local homes for the removed Kynetic-specific gates and artifact maintenance
          in the always-loaded work-gates and review-gates project skills
          (.kspec/skills/work-gates/SKILL.md and .kspec/skills/review-gates/SKILL.md, rendered to
          .agents/.claude/.factory).


          work-gates now names the concrete Kynetic quality gates: npm run format:check, npm run
          lint -- --quiet, npx oxlint <changed files>, npm run typecheck, npm test (and shards),
          plus the kspec validate gates. A Generated Artifact Maintenance table documents that kspec
          skill render produces both .agents/skills and .factory/skills, and that npm run
          build:plugin regenerates plugin/plugins/kspec/skills from core skill sources.


          review-gates now names the matching kspec review check name/runner mapping for each
          Kynetic gate so reviewers have concrete evidence-recording commands. It also names kspec
          skill status / kspec skill verify as the drift check for skill-touching changes.


          Both skills are loaded into the dispatch context for worker/reviewer agents respectively,
          so the Direction-2 requirement (removed Kynetic-only instruction must have a durable local
          home) is now satisfied without waiting on
          @task-preserve-kynetic-local-template-maintenance-context. That broader task can still
          cover any other self-hosting context unrelated to this diff.
        created_at: 2026-06-03T03:01:50.021Z
