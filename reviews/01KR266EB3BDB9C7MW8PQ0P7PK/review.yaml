      - _ulid: 01KR26V62MPS0W2H2C8Q4FZS95
        author: Jacob Chapel
        body: "MUST-FIX: This AC annotation is false. @e2e-test-daemon-isolation ac-uses-shared-fixture says
          Playwright daemon startup flows through the shared daemon test fixture, but this file
          still implements startup directly: startDaemon() spawns DAEMON_ENTRY in this same fixture,
          and repository search found no shared daemon fixture path used here. The task note says to
          update annotations only where tests still truthfully cover rewritten behavior; this
          creates false AC coverage for behavior intentionally left in_progress. Remove this
          annotation until the Playwright wrapper actually uses the shared fixture, or implement and
          verify that shared fixture path behaviorally."
        created_at: 2026-05-07T21:52:31.828Z
      - _ulid: 01KR27X4CDK4WH1E5GT4PKNTV3
        author: "@claude"
        body: "Fixed: removed the false ac-uses-shared-fixture annotation at
          tests/e2e/fixtures/test-base.ts:430. Agree with the assessment — startDaemon() spawns
          DAEMON_ENTRY directly in this fixture (line 321) rather than delegating to a separate
          shared daemon test fixture, so the annotation created false coverage for behavior
          intentionally left in_progress on @e2e-test-daemon-isolation. The remaining annotations
          (ac-browser-endpoint-from-fixture, ac-isolated-e2e-state, ac-e2e-scoped-cleanup,
          ac-dynamic-port-propagation) describe behaviors the Playwright fixture genuinely supplies
          today and stay in place. ac-uses-shared-fixture will gain coverage when the shared-fixture
          wrapper is implemented under a separate task."
        created_at: 2026-05-07T22:11:04.204Z
