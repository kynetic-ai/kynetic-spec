    entries:
      - _ulid: 01KTW95A013XAG7M7DPCG2QMKE
        author: "@claude"
        body: "Post-upgrade plan-creation gap (new, narrower successor to the resolved round-1/2 revision-1
          blocker): the description says 'Once the revision data upgrade has run, every plan has at
          least revision 1', but no minting path covers plan creation. ac-publish-mints-revision
          covers explicit publish, ac-import-mints-revision covers re-import into an EXISTING plan,
          and the backfill runs via the explicit upgrade command. A plan created after the upgrade
          has run (plan add or a fresh import) therefore observably carries an empty revision
          history until its first publish or re-import — contradicting the universal claim.
          Practical effect: plan-text anchors validate against revision ordinals, so they are
          unusable on freshly created draft plans until first publish; the implementation notes
          already tolerate revisionless states ('resolves to no revision rather than a wrong one'),
          so this looks intended rather than broken. Suggest either (a) qualifying the sentence to
          plans that existed when the upgrade ran and stating the creation-path contract explicitly
          (new plans start with an empty revision history until first publish), or (b) specifying
          that plan creation / initial import mints revision 1. Non-blocking: the plan is derivable
          and AC-level behavior is self-consistent under either resolution, but the contract should
          be pinned before implementation of task-plan-revision-records."
        created_at: 2026-06-11T21:24:39.554Z
      - _ulid: 01KTWBE83JP2MVJ7QQTYVC9QD6
        author: "@claude"
        body: "Fixed via option (a), which matches decision 16 (revisions are intentional publishes;
          creation is not an enumerated minting event). The plan-revisions description now says the
          upgrade gives every plan that existed when it ran at least revision 1, states plan
          creation mints nothing, and pins the creation-path contract: plans created after the
          upgrade (directly or via initial import) start with an empty revision history until first
          publish or re-import mints revision 1. Added ac-created-plans-start-empty to verify it,
          covered by task-plan-revision-records (Do-NOT-mint list, tests, and Covers updated).
          Implementation notes record the anchor consequence: plan-text anchors are unavailable on
          fresh plans until first publish, which the binding resolver already tolerates."
        created_at: 2026-06-11T22:04:29.682Z
    kind: question
  - _ulid: 01KTW95D866NAASM2KMVSNRSSF
    anchor:
      type: structured
      field: ac-span-integrity
      ref: "@review-plan-text-anchors"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTW95D86FCXM0H155HWK2RP8
        author: "@claude"
        body: Trailing consequence clause in the then-text — '..., so every stored plan-text anchor resolves
          to its quoted text within the revision it was created against' — is rationale, not an
          assertion; per the AC-purity rule it belongs in the description (which already states the
          equivalent recoverability invariant). Same pattern appears in @review-idea-threads
          ac-idea-never-blocks ('— unresolved idea threads never prevent approval'). Cosmetic only;
          no behavior ambiguity.
