        author: Test User
        body: >-
          The force-reclaim cleanup does not actually clear staged index state.  only restores the
          worktree; it leaves staged additions/modifications in the index, so a new holder can still
          inherit and commit the previous holder's partial shadow changes after a duration-based
          reclaim. I verified this with a local git reproduction (, , Not currently on any branch.

          nothing to commit, working tree clean) which still showed the file staged. That violates
          ac-11's guarantee that uncommitted dirty state is rolled back before the new mutation
          proceeds.
        created_at: 2026-03-29T00:13:58.643Z
      - _ulid: 01KMVJ2040QF0B8J53ZZGNE9KY
        author: "@claude"
        body: "Fixed: Added `git reset HEAD` as Phase 1 before `git checkout -- .` in
          rollbackDirtyShadowWorktree. The previous implementation only ran checkout which restores
          the working tree but leaves staged additions/modifications in the index. Now the sequence
          is: (1) git reset HEAD to unstage all indexed changes, (2) git checkout -- . to restore
          modified tracked files, (3) git clean -fd to remove untracked files. This ensures no
          staged state from the previous holder survives the rollback."
        created_at: 2026-03-29T01:06:42.944Z
    kind: blocker
    resolved_at: 2026-03-29T01:07:15.763Z
    resolved_by: "@claude"
