    entries:
      - _ulid: 01KTWDRPNS0H3Z0R7XEEJXPS55
        author: Jacob Chapel
        body: "MUST-FIX: The submitted lock does not actually eliminate the full-suite dist/ rewrite race it
          is meant to stabilize. Evidence: a fresh full suite run via 'npm test -- --fresh' failed
          in tests/workflow-runs.test.ts with the same class of built-CLI ESM mismatch
          ('./upgrade.js' did not provide registerUpgradeCommand) while a test-spawned
          'dist/cli/index.js' was starting. The targeted original file passed, but this proves
          another CLI-spawning test can still observe a partially rewritten dist/ during the same
          locked test run. An isolated fresh rerun of tests/workflow-runs.test.ts passed 88/88,
          confirming the failure is full-suite concurrency rather than deterministic workflow
          behavior. The lock/reentrancy design needs to cover nested build/test runner paths without
          allowing a build to rewrite dist while Vitest is executing."
        created_at: 2026-06-11T22:45:09.433Z
      - _ulid: 01KTWGBWFC5P5SAQKKZ9389X4V
        author: "@claude"
        body: "Fixed. Root cause of the residual race: the reentrancy marker (KSPEC_BUILD_TEST_LOCK_HELD) is
          inherited by every subprocess the suite spawns, so a build triggered from INSIDE the test
          run bypassed the lock entirely. Two such paths existed: (1) tests/cli-serve.test.ts ran
          'npm pack' without --ignore-scripts, so the prepack hook ran the full tsc build mid-suite
          — this rewrites all of dist/cli/ and matches your workflow-runs crash ('./upgrade.js' did
          not provide registerUpgradeCommand) exactly; (2) tests/daemon-build.test.ts ran 'npm run
          build:daemon' against the live dist/daemon/ (rm + re-emit). Fixes: lock reentrancy is now
          label-aware — same-kind nested runs stay reentrant, but a build nested inside a running
          test run (or vice versa) fails fast with a diagnostic instead of silently racing
          (KSPEC_BUILD_TEST_LOCK_HELD_LABEL); the runner's own pre-vitest build is explicitly
          re-labelled (vitest not yet running); cli-serve packs with --ignore-scripts (runner's
          build hook already guarantees dist/ freshness — same pattern as
          release-packaging.test.ts); daemon-build builds into an isolated output root (new
          KSPEC_DAEMON_BUILD_DIST_ROOT override) and build-daemon.cjs acquires the lock when
          targeting the real dist/. New unit + integration tests cover the cross-kind fail-fast.
          ac-7 updated to the new semantics. Verification: full fresh suite ('npm test -- --fresh')
          passes 10552/0 failed (2784 suites)."
        created_at: 2026-06-11T23:30:35.116Z
    kind: blocker
  - _ulid: 01KTWDRTFDE940W89NAYY3BVP5
    anchor:
