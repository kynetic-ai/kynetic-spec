      - _ulid: 01KTWDRPNS0H3Z0R7XEEJXPS55
        author: Jacob Chapel
        body: "MUST-FIX: The submitted lock does not actually eliminate the full-suite dist/ rewrite race it
          is meant to stabilize. Evidence: a fresh full suite run via 'npm test -- --fresh' failed
          in tests/workflow-runs.test.ts with the same class of built-CLI ESM mismatch
          ('./upgrade.js' did not provide registerUpgradeCommand) while a test-spawned
          'dist/cli/index.js' was starting. The targeted original file passed, but this proves
          another CLI-spawning test can still observe a partially rewritten dist/ during the same
          locked test run. An isolated fresh rerun of tests/workflow-runs.test.ts passed 88/88,
          confirming the failure is full-suite concurrency rather than deterministic workflow
          behavior. The lock/reentrancy design needs to cover nested build/test runner paths without
          allowing a build to rewrite dist while Vitest is executing."
        created_at: 2026-06-11T22:45:09.433Z
    kind: blocker
  - _ulid: 01KTWDRTFDE940W89NAYY3BVP5
    anchor:
      type: code
      commit: 5decaf10680757ae541fe2ec5b718952a8f7be1f
      line_end: 81
      line_start: 68
      path: scripts/test.cjs
      side: head
    entries:
      - _ulid: 01KTWDRTFEPQSZ5B842P2VRBYD
        author: Jacob Chapel
        body: "MUST-FIX: The test cache key omits the new files that now affect test runner behavior.
          scripts/test.cjs now requires scripts/build-test-lock.cjs, and the new tests exercise
          scripts/build.cjs, but TEST_INPUT_PATHS still hashes only scripts/test.cjs,
          scripts/test-progress-reporter.cjs, and scripts/dependency-health.cjs. As a result, future
          edits to the lock/build wrapper can be hidden by a stale cached 'npm test' result even
          though those files directly control test scheduling and are part of the tested behavior.
          Add the new test-affecting scripts to the cache input set and cover that expectation."
        created_at: 2026-06-11T22:45:13.326Z
    kind: blocker
