        body: The node-only static serving path only registers /_app/*, so root-level web UI assets stop
          working under node. The built UI head still requests /favicon.ico, /favicon-32.png, and
          /favicon-192.png from packages/web-ui/src/routes/+layout.svelte, but with this server
          change GET /favicon.ico returns 404 on node while the same build returns 200 on bun. I
          reproduced that directly after npm run build:e2e by starting the built daemon under both
          runtimes and curling the asset. That violates @daemon-runtime-adapter ac-http-parity, and
          the new tests miss it because they only cover /_app/... assets and SPA routes.
        created_at: 2026-04-05T18:01:00.320Z
