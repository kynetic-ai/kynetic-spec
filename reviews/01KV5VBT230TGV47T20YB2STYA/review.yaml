    entries:
      - _ulid: 01KV5W8G6KA277SRN1HY5S8ZXJ
        author: Jacob Chapel
        body: "MUST-FIX: task-scoped session detail can return an incomplete breadcrumb chain. The task
          explicitly requires a task-scoped session's chain to be the owning task's chain plus the
          session, but this branch only includes the task chain when both task and item cache
          domains are ready. In the else branch, even when metadata.task_id exists, the code calls
          forSession({ id: resolution.id }) without task_ref, so the resolver can only emit the
          session segment. Evidence: tests/daemon-api/breadcrumb-ancestry.test.ts lines 278-283
          codify this degraded single-segment response for the no-cache in-process route, despite
          seeding a task_id. Impact: clients can receive an incomplete trail for a task-scoped
          session detail response, violating @ui-breadcrumb ac-10 and the task's session-leaf
          requirement. Fix by either resolving the owning task/spec chain through an appropriate
          bounded/disk fallback when cache is unavailable, or returning a warming response until the
          cache can provide the full chain; update the daemon API test to assert module -> feature
          -> requirement -> task -> session for a task-scoped session."
        created_at: 2026-06-15T14:51:37.043Z
    kind: blocker
