    entries:
      - _ulid: 01KSG153SCBWEMWX0Q416XK4E5
        author: Jacob Chapel
        body: 'MUST-FIX: Plan resource routes only call requirePlanFolderStorage(), so a kynetic 1.2 project
          with folder-backed plans but no resource_storage.format: entity_scoped is accepted. The
          resource API is part of the entity-scoped local resource contract and should surface the
          shared entity_storage_incompatible 409 envelope for incompatible resource storage.
          Evidence: I reproduced GET /api/plans/@test-plan/resources against a folder-backed project
          missing resource_storage and it returned HTTP 200 {"resources":[]} instead of a 409
          resource-storage incompatibility.'
        created_at: 2026-05-25T16:58:09.580Z
      - _ulid: 01KSG384HS7QYEG82JHWV99SX5
        author: "@claude"
        body: "Fixed: `resolvePlanForResources` now calls `requireResourceFolderStorage(ctx)` in addition to
          `requirePlanFolderStorage(ctx)`. A 1.2 project with folder-backed plans but no
          `resource_storage.format: entity_scoped` now surfaces the shared 409
          `entity_storage_incompatible` envelope with `domain: 'resources'` and `field:
          'resource_storage.format'`. New tests in `tests/daemon-api/plan-resources.test.ts`
          (\"missing resource_storage declaration\" describe block) cover GET list, GET single, GET
          bytes, POST, and DELETE on a folder-backed plan project that omits the resource storage
          declaration."
        created_at: 2026-05-25T17:34:45.816Z
    kind: blocker
    resolved_at: 2026-05-25T17:34:55.995Z
    resolved_by: "@claude"
  - _ulid: 01KSG15AFBMQSS730QFQJGE8TM
    anchor:
      type: code
      commit: 58df2d14fb652674f714e9bbd14bea9318431ccb
      line_end: 142
      line_start: 138
      path: src/export/json.ts
      side: head
    entries:
      - _ulid: 01KSG15AFBVP9JG5B57MA9824V
        author: Jacob Chapel
        body: "MUST-FIX: exportPlanResources swallows copyResourceForStaticExport failures and silently
          omits the resource. That violates ac-path-escape-rejected for static export: symlink
          escapes must reject the operation with actionable guidance, not produce a successful
          snapshot with the resource missing and the original ./resources link left unresolved.
          Evidence: I generated a static snapshot for a plan whose declared resource path traversed
          a symlinked resources/screenshots directory to an outside folder;
          generateJsonSnapshot(..., { assetsOutputDir }) returned ok with resources: [] and
          unchanged markdown instead of failing."
        created_at: 2026-05-25T16:58:16.427Z
      - _ulid: 01KSG38XTV2KX2MSJHH9T53KMY
        author: "@claude"
        body: "Fixed: `exportPlanResources` no longer swallows `copyResourceForStaticExport` failures. A new
          `PlanResourceExportError` carries the plan ULID, the failing relative path, the resolver's
          reason, and an actionable suggestion to fix the manifest or resources layout. The error is
          exported from `src/export/index.ts` so CLI callers can identify and surface it. Symlink
          escapes, intermediate symlinks, undeclared paths, and missing files all abort the export
          with a single structured failure rather than producing a snapshot that silently omits the
          resource while leaving the rewritten markdown pointing at a missing asset path. New tests
          in `tests/export/plan-resources.test.ts` reproduce the symlink-escape scenario you
          described and assert: (a) `generateJsonSnapshot` rejects with `PlanResourceExportError`,
          (b) no bytes are written to the would-be exported path, and (c) the error carries plan
          ULID, resource path, and reason."
        created_at: 2026-05-25T17:35:11.707Z
    kind: blocker
    resolved_at: 2026-05-25T17:35:21.728Z
    resolved_by: "@claude"
  - _ulid: 01KSG16YWFDTBRV3BN988YFV1W
    anchor:
      type: code
      commit: 58df2d14fb652674f714e9bbd14bea9318431ccb
      line_end: 435
      line_start: 430
      path: packages/daemon/src/routes/plan-resources.ts
      side: head
    entries:
      - _ulid: 01KSG16YWGEE1T96RNESN0J70Z
        author: Jacob Chapel
        body: "MUST-FIX: the POST upload path writes the temporary upload file under resourcesDir before
          calling assertSafeResourceMutationPath(). If the owning plan resources/ directory is
          already a symlink to an outside directory, fs.mkdir(..., {recursive:true}) accepts it and
          fs.writeFile(tempPath, buffer) writes uploaded bytes outside the owning entity tree before
          the later safety check rejects the destination and tries to clean up. This violates
          ac-path-escape-rejected, which requires no file outside the owning resource tree to be
          written. Validate the resources root/final mutation path before materialising upload
          bytes, or stage the temp file somewhere not reachable through the untrusted resources/
          tree."
        created_at: 2026-05-25T16:59:10.096Z
      - _ulid: 01KSG39ZBQEZ2P1837G9HVRC0A
        author: "@claude"
        body: 'Fixed: the POST upload path now validates the resource mutation safety BEFORE materialising
          any bytes. `assertSafeResourceMutationPath` (which lstat-walks the resourcesDir and
          intermediate segments, rejecting pre-existing symlinks) is called first; only after it
          passes do we mkdir/write. Additionally, the temp upload file is now staged in `planDir`
          directly, not under `resourcesDir` — even if a TOCTOU race swapped `resources/` for a
          symlink between the check and the rename, the bytes still land inside the kspec-owned plan
          directory rather than escaping the entity tree. New test in
          `tests/daemon-api/plan-resources.test.ts` ("POST symlink safety" describe block)
          reproduces the symlinked-`resources/`-root scenario: the POST returns 400
          `invalid_resource_path`, the error message mentions "symlink", AND the outside directory
          the symlink targets remains empty — proving no bytes were written before the safety gate
          fired.'
        created_at: 2026-05-25T17:35:46.039Z
    kind: blocker
    resolved_at: 2026-05-25T17:35:58.310Z
    resolved_by: "@claude"
