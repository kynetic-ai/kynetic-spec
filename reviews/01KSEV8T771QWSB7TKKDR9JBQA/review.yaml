      path: src/cli/commands/plan-resource.ts
      side: head
    entries:
      - _ulid: 01KSEW6ZD46NDN4FZMZTF42JGT
        author: Jacob Chapel
        body: "MUST-FIX: `plan resource add` writes through symlinked directories already present under the
          plan resources tree. I reproduced this by creating `.kspec/plans/<plan>/resources/sub` as
          a symlink to an outside temp directory, then running `plan resource add
          @plan-resource-plan <source> --id leak --path sub/leak.txt --json`; the command exited 0
          and created `outside/leak.txt`. This violates the shared resource contract that symlink
          escapes are forbidden and lets a manifest path that appears plan-owned write bytes outside
          `.kspec/plans/<plan>/resources/`. Validate the destination path with symlink-safe
          containment before copying, including existing intermediate directories and the resources
          root."
        created_at: 2026-05-25T06:12:33.316Z
      - _ulid: 01KSEZG5JV0DYP4TZMQEPA5YYA
        author: "@claude"
        body: "Fixed in 7e8ff3aeec. Added shared assertSafeResourceMutationPath helper in
          src/parser/entity-local-resources.ts that walks the textual chain segment-by-segment with
          lstat before any disk mutation. runPlanResourceAdd now calls it on both the new
          destination AND the previous --replace path before fs.copyFile/fs.rm touches disk. The
          helper rejects: (a) a symlinked resources/ root, (b) any symlinked intermediate directory
          along the path, and (c) a symlinked or non-regular destination leaf. Rejection surfaces as
          invalid_resource_path so the existing CLI error contract is preserved. Two regression
          tests cover this: the exact reviewer reproduction (sub → outside, baseline.png pre-seeded)
          plus a defence-in-depth case where the resources/ root itself is a symlink. Both verify
          the outside file is never written."
        created_at: 2026-05-25T07:10:00.283Z
    kind: blocker
    resolved_at: 2026-05-25T07:10:09.914Z
    resolved_by: "@claude"
  - _ulid: 01KSEW74GDZAC9E0Q17D8FVBKR
    anchor:
      type: code
      commit: d31b3df0546b893caf3746c64c4aa91a4661e3e9
      line_end: 600
      line_start: 598
      path: src/cli/commands/plan-resource.ts
      side: head
    entries:
      - _ulid: 01KSEW74GDK591KCTVYTWD8X8H
        author: Jacob Chapel
        body: "MUST-FIX: `plan resource remove` deletes through the same unchecked joined path. With the
          escaped resource above in the manifest, `plan resource remove @plan-resource-plan leak
          --force --json` exited 0 and removed the outside file behind the `resources/sub` symlink.
          `remove` must resolve the declared resource path through the same symlink-safe containment
          rules before deleting, otherwise a task-owned manifest entry can delete arbitrary local
          files reachable through an existing symlink under `resources/`."
        created_at: 2026-05-25T06:12:38.541Z
      - _ulid: 01KSEZGKW2Y27KCYXXC48VK8AR
        author: "@claude"
        body: "Fixed in 7e8ff3aeec. runPlanResourceRemove now calls the same assertSafeResourceMutationPath
          helper on the manifest entry's path BEFORE either the confirmation prompt or fs.rm runs.
          Doing the symlink gate before the prompt avoids a 'yes, delete' answer becoming an
          outside-file deletion. Rejection surfaces as invalid_resource_path. Regression test
          reproduces the reviewer scenario by editing the manifest directly (since the add fix now
          refuses to create such an entry through the CLI): create plan, add a baseline file, plant
          a sub symlink to an outside dir containing leak.txt, append a poisoned 'leak' entry
          pointing at sub/leak.txt, then run plan resource remove --force --json. Test asserts exit
          1 with invalid_resource_path and verifies the outside leak.txt bytes are untouched."
        created_at: 2026-05-25T07:10:14.914Z
    kind: blocker
    resolved_at: 2026-05-25T07:10:19.913Z
    resolved_by: "@claude"
