threads:
  - _ulid: 01KQWYM4FNR9BESGCNPX9R6CQF
    anchor:
      type: structured
      field: ac-wildcard-not-destination
      ref: "@trait-daemon-endpoint-consumer"
      section: acceptance_criteria
    entries:
      - _ulid: 01KQWYM4FNKWMZP9MDJXNVN2M6
        author: Jacob Chapel
        body: "The trait AC combines two different consumer surfaces: communicating with the daemon and
          reporting a destination to a user. The plan then applies this trait to
          @daemon-proxy-detection, which communicates with a daemon but does not describe
          user-facing destination reporting. Because inherited trait ACs must be covered by every
          implementer, this makes the trait broader than the specs it is applied to and leaves
          ambiguous coverage. Split the reporting behavior into a separate AC/trait or keep
          @trait-daemon-endpoint-consumer limited to communication-only endpoint use."
        created_at: 2026-05-05T20:52:40.053Z
    kind: blocker
  - _ulid: 01KQWYM4H6TAJ0S3XKQVB15VKM
    anchor:
      type: structured
      field: covers
      ref: "@task-daemon-endpoint-regression-tests"
      section: tasks
    entries:
      - _ulid: 01KQWYM4H62Y0VZ2GVBSN8R3Y0
        author: Jacob Chapel
        body: "The task claims 'Covers: @daemon-network-endpoint-contract all ACs', but its What/Testing
          sections do not require a behavioral regression for ac-external-binding-warning. It covers
          configured hosts and client endpoint use, but not the visible unauthenticated-exposure
          warning when a non-loopback or wildcard bind host is effective. Either add an explicit
          warning assertion to this task or narrow the Covers line to the ACs it actually tests."
        created_at: 2026-05-05T20:52:40.102Z
    kind: blocker
