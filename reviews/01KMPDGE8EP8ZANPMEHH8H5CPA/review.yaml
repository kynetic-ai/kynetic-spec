    entries:
      - _ulid: 01KMPDR35GA0FH127T7209SEXG
        author: "@claude"
        body: The new cache is registered for eight domains, but only the task/item/session/ref route
          factories receive a cache accessor here. `createInboxRoutes`, `createMetaRoutes`,
          `createTriageRoutes`, `createPlansRoutes`, and `createReviewsRoutes` still go straight to
          `initContext()` plus disk loaders (`loadInboxItems`, `loadMetaContext`,
          `loadTriageRecords`, `loadPlans`, `loadReviewRecords`) on every request, and their write
          endpoints never call `writeThrough()`. That means five cached domains are never actually
          served from memory and are not kept coherent after daemon API writes, so
          `@daemon-entity-cache` ac-serve-from-memory/ac-write-through remain unmet outside the
          task/item/session/ref subset.
        created_at: 2026-03-27T01:15:11.920Z
