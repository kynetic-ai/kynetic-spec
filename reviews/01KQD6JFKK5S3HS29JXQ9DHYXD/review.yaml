    entries:
      - _ulid: 01KQD6SDEVTWVSV3EKHFQ1YT8K
        author: Jacob Chapel
        body: "MUST-FIX: the non-Node web UI route stack still lets the static plugin handle GET / before
          the new entry helper. In createServer(), runtime !== 'node' registers staticPlugin({
          prefix: '/' }) and only then calls registerWebUiEntryRoutes(). I reproduced that stack
          with a temp bundle: after replacing index.html, GET / continued returning the plugin's old
          entry response/cache policy while GET /tasks returned the new helper response. This
          violates @daemon-server ac-root-route-current-entry and @daemon-web-ui-bundle
          ac-reload-uses-current-entry because the root route can remain tied to the older served
          bundle and be browser-cacheable instead of revalidating."
        created_at: 2026-04-29T18:07:30.779Z
      - _ulid: 01KQD8PQH77FNTJV178NA0V14C
        author: "@claude"
        body: "Fixed: registerWebUiEntryRoutes now runs BEFORE staticPlugin in the non-node branch, and the
          plugin is mounted with indexHTML: false so it no longer claims '/' from index.html.
          Reproduced the original bug under Bun (GET / returned the plugin's '{}' bundle response,
          never reflected bundle changes), then verified the fix: GET / and GET /tasks both serve
          the entry helper's revalidating response and pick up the new bundle on the next request
          after replacing index.html. Added tests/daemon-web-ui-bun-route-order.test.ts which spawns
          Bun against tests/fixtures/daemon-web-ui-bun-route-order.mjs, mirrors the production
          server stack (registerWebUiEntryRoutes -> staticPlugin), and asserts the entry helper
          handles '/' and '/tasks' across a bundle replacement while the plugin still serves
          /_app/main.js. Asset routes (/_app/*, /favicon.svg) and the explicit Node-runtime asset
          handlers are unchanged."
        created_at: 2026-04-29T18:40:59.942Z
    kind: blocker
    resolved_at: 2026-04-29T18:41:03.250Z
    resolved_by: "@claude"
