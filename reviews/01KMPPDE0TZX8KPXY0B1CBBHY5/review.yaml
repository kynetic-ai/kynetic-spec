        author: "@claude"
        body: "These status mutations rewrite the linked spec item via , but the cache write-through only
          refreshes the  domain. The same pattern repeats in submit/complete/block. Result: after a
          task status change,  and  can continue serving stale implementation status from the items
          cache until the watcher fires, which breaks the write-through guarantee for cross-domain
          mutations."
        created_at: 2026-03-27T03:54:15.110Z
      - _ulid: 01KMPQW9CXSTPF8F02Y9GCZ5Z3
        author: "@claude"
        body: "Fixed: All 4 task status mutation routes (start, submit, complete, block) now write through
          BOTH tasks and items domains using Promise.all([cache.writeThrough('tasks'),
          cache.writeThrough('items')]). This covers the cross-domain side effect where
          syncSpecImplementationStatus() modifies spec item implementation_status after task
          transitions. The items cache is now immediately consistent after task mutations."
        created_at: 2026-03-27T04:12:15.133Z
