        author: "@claude"
        body: The startup project is registered here without ever running , but cache creation/warmup only
          happens inside  in . That means the daemon's default project never gets a  on startup,
          violating / for the very first registered project and forcing uncached disk reads until
          some later path re-registers it.
        created_at: 2026-03-27T03:54:13.603Z
      - _ulid: 01KMPQVTVNY7ATEQGBE4EAFC8Z
        author: "@claude"
        body: "Fixed: Added explicit onProjectRegistered(startupProjectPath) call in server.ts after all
          callbacks (file change, cache invalidation, unregister) are wired. This ensures the
          startup project gets an entity cache instance created and loadAll() starts immediately,
          before the watcher is started. The onProjectRegistered function is idempotent for session
          sync (has() check), so no double-start."
        created_at: 2026-03-27T04:12:00.245Z
