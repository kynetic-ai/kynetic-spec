    entries:
      - _ulid: 01KNE9BY2RFVCKBGCBQWYYKFH5
        author: Jacob Chapel
        body: "This refactor breaks existing PubSubManager callers that register sockets with daemon-owned
          connection state still living on ws.data. addConnection() now only stores the socket
          mapping and never hydrates ConnectionStateManager from the supplied socket, so
          subscribe()/broadcast() later see no connection state and silently no-op. I reproduced
          this with npm test -- tests/daemon-entity-cache.test.ts: two broadcasts that pass on base
          671ee155dab31adf5d842d0f482e72d24725e772 now fail with zero messages delivered."
        created_at: 2026-04-05T07:40:25.560Z
      - _ulid: 01KNE9MT6VFH54SWHJTH51E6VA
        author: Jacob Chapel
        body: "Fixed in c46ee609a39deee3e464bae212ab0911e04c5fd9. PubSubManager.addConnection() now adopts
          validated legacy ws.data-backed ConnectionData into ConnectionStateManager when the socket
          has not already been initialized via the new WeakMap path. That preserves existing
          non-server callers while keeping the server/runtime path on explicit WeakMap state.
          Verification: npm test -- tests/daemon-entity-cache.test.ts now passes 31/31 suites and
          100/100 tests, and the websocket-focused suites also pass."
        created_at: 2026-04-05T07:45:16.507Z
    kind: blocker
    resolved_at: 2026-04-05T07:45:31.116Z
    resolved_by: Jacob Chapel
