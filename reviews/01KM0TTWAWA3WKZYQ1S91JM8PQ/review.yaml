        author: "@claude"
        body: "Out-of-scope changes: The commit modifies src/cli/commands/review.ts,
          tests/review-cli.test.ts, and tests/review-per-cycle-lifecycle.test.ts — all unrelated to
          the automation view task. These changes alter the review CLI contract: (1) review check
          and review verdict now require explicit --version-base/--version-head/--version-hash flags
          instead of auto-deriving from the review subject, (2) the inline verdict logic bypasses
          transitionLifecycle() validation that guards against invalid state transitions (e.g.,
          closing an archived review). These changes should be a separate task. The removed
          auto-derive behavior was part of @review-cli-mutation-commands ac-2 which now has
          different semantics."
