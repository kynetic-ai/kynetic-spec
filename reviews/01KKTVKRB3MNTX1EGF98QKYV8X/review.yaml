      - _ulid: 01KKTVSEW08HZ5M5BH7KGCGM6Z
        author: "@claude"
        body: >-
          **QUESTION: review-content-diff-api ac-2 "context expansion" — where do path/start/end
          params come from?**


          ac-2 says "the request includes path, start line, and end line" but doesn't specify the
          endpoint URL or whether these are query params vs path params. The task description uses
          `GET /api/diff/:base..:head/context` which doesn't include path/start/end in the URL
          pattern.


          Should this AC specify the exact request format? E.g.: `GET
          /api/diff/:range/context?path=src/foo.ts&start=10&end=30&commit=abc1234`


          Also: the AC says "at the specified commit" — but the route uses base..head range. Which
          commit should the context be resolved against? Presumably `head` for new-side context and
          `base` for old-side, but the AC is ambiguous. Consider specifying a `side` or `commit`
          query param.
        created_at: 2026-03-16T08:21:52.640Z
    kind: question
  - _ulid: 01KKTVSS64ZWH9MHZRF924902S
    entries:
      - _ulid: 01KKTVSS64F6JQ0DA7RBH5E14X
        author: "@claude"
        body: >-
          **QUESTION: Should review-records-web-ui use a /reviews/[id] dynamic route?**


          The existing web UI routes use flat page patterns (e.g., `/tasks`, `/plans`,
          `/sessions/[id]`). Only `sessions/[id]` uses a dynamic route param. The plan proposes
          `/reviews/[id]` which follows the sessions pattern — this is consistent.


          However, the current task detail and plan detail pages don't appear to use dynamic routes
          — they seem to use URL query params or in-page expansion. Is the intent to introduce a new
          dynamic route pattern for reviews, or should the detail view follow the existing
          expansion/modal pattern used by tasks and plans?


          This is non-blocking — either approach works — but worth confirming the UX intent matches
          the existing app patterns.
        created_at: 2026-03-16T08:22:03.204Z
    kind: question
