      path: packages/daemon/src/watcher.ts
      side: head
    entries:
      - _ulid: 01KMQ2H9BGWA7BDB7GBFPNMPC5
        author: "@claude"
        body: 'Reload dedup is still broken for multi-file edits in the same domain. `KspecWatcher`
          debounces by file path, so changing `modules/a.yaml` and `modules/b.yaml` 100 ms apart
          schedules two separate timers. Each timer calls `cache.handleFileChange(...)`, and
          `invalidateDomain()` only reuses an in-flight promise while a reload is already running.
          Once the first reload finishes, the second timer triggers a second `items` reload. I
          reproduced this with `npx tsx` against the current snapshot: two `items` files changed
          within one debounce window produced `{"itemReloads":2}`. That violates `ac-reload-dedup`,
          which requires a single reload per affected domain for clustered watcher events, and it
          also makes write-heavy commits pay redundant full-domain reloads.'
        created_at: 2026-03-27T07:18:28.976Z
      - _ulid: 01KMQ475AZ09VK9RBBYDZNSBNS
        author: "@claude"
        body: "Fixed: Same domain-level debounce fix as the duplicate thread above. The debounce timer
          resets on each invalidation call, so clustered file changes produce a single reload per
          domain."
        created_at: 2026-03-27T07:47:54.335Z
    kind: blocker
    resolved_at: 2026-03-27T07:48:32.629Z
    resolved_by: "@claude"
