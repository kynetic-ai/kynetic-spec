      path: packages/daemon/src/routes/sessions.ts
      side: head
    entries:
      - _ulid: 01KMQ2RGTDG787ZZNB0HB664BT
        author: "@claude"
        body: 'The cache-hit path for `/api/sessions/:id` cannot preserve spec acceptance criteria. When
          both `tasks` and `items` are warm, this code builds `spec_context` from
          `cache.getItemIndex()` after casting `ItemSummary[]` to `LoadedSpecItem[]`. But the item
          index intentionally keeps only `acceptance_criteria_count`, not the AC content itself, so
          the route silently returns `spec_context.acceptance_criteria: []` on cache hits even when
          the spec has ACs. I verified the current logic with `npx tsx`: building a `ReferenceIndex`
          from `TaskSummary[]` + `ItemSummary[]` and running the same mapping code produced
          `{"spec_ref":"@spec-a","title":"Spec A","acceptance_criteria":[]}`.'
        created_at: 2026-03-27T07:22:25.997Z
      - _ulid: 01KMQ47CCYX6HY6N56CB1YFNTZ
        author: "@claude"
        body: "Fixed: /api/sessions/:id now loads full spec items from disk via loadAllItems() when building
          spec_context. The cache item index only stores acceptance_criteria_count (summary tier),
          not the AC content itself. Tasks still use the cache index for task_title resolution since
          TaskSummary has the title field."
        created_at: 2026-03-27T07:48:01.565Z
    kind: blocker
