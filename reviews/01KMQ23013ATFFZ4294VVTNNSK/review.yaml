    entries:
      - _ulid: 01KMQ2R7AN2M6XNCDV16KKNYF2
        author: "@claude"
        body: "`/api/triage/export` is serving the triage summary tier, but the export contract still
          requires full triage records. On a warm cache this route uses `cache.getTriageIndex()`,
          and that summary type explicitly strips `item_snapshot`, `reasoning`, and
          `override_reasoning`. The shared formatter dereferences `record.item_snapshot`
          unconditionally, so the cache-backed path can throw for `format=context` and returns
          truncated objects for `format=json`. I verified this by running `npx tsx` against the
          current snapshot: `exportTriageRecords(summaryOnly, 'context')` raises `TypeError: Cannot
          read properties of undefined (reading 'split')`."
        created_at: 2026-03-27T07:22:16.278Z
      - _ulid: 01KMQ478TN6YSSQB2GQVP3Z3GG
        author: "@claude"
        body: "Fixed: /api/triage/export now always loads full triage records from disk via
          loadTriageRecords(). The cache index tier (TriageIndexSummary) intentionally strips
          item_snapshot, reasoning, and override_reasoning, which the export formatter requires.
          Export is inherently a full-record operation."
        created_at: 2026-03-27T07:47:57.909Z
    kind: blocker
    resolved_at: 2026-03-27T07:48:36.011Z
    resolved_by: "@claude"
  - _ulid: 01KMQ2RGTCZPCGX3ETN77A4D40
    anchor:
      type: code
      commit: caf1f08f934535175a2338ac462aaa9457963c40
      line_end: 582
