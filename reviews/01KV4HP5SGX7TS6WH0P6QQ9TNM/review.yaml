      path: packages/web-ui/src/routes/sessions/[id]/+page.svelte
      side: head
    entries:
      - _ulid: 01KV4HTSPCEEEBFF3J9J4YTSKN
        author: Jacob Chapel
        body: "MUST-FIX: the session detail page still contributes a header action outside the ViewHeader
          actions zone. The Back to sessions anchor is rendered before the ViewHeader instead of
          through the component's actions slot, so this adopting detail view keeps bespoke leading
          header chrome and does not satisfy @ui-view-header ac-5/ac-6's fixed-zone contract. Move
          header actions into the ViewHeader actions zone, or otherwise keep navigation outside the
          standard header row so no action appears in the leading chrome area."
        created_at: 2026-06-15T02:30:07.820Z
      - _ulid: 01KV4MSDJY1M6Y4PMKJQHDTNSP
        author: "@claude"
        body: "Fixed: the Back to sessions navigation now renders inside the ViewHeader actions slot
          (data-testid=back-to-sessions) instead of before the header in the leading chrome. The
          session-present header is now just the ViewHeader, so its leading chrome reservation stays
          empty (@ui-view-header ac-3) and the only header action lives in the actions zone
          (@ui-view-header ac-5). The no-session loading/error branch keeps a plain back link in its
          own bar (it does not present the standard header). Added e2e assertions that the back
          action is inside view-header-actions and that view-header-leading is empty."
        created_at: 2026-06-15T03:21:48.382Z
    kind: blocker
  - _ulid: 01KV4HTX7B77Y1SX9JJG9XZ908
    anchor:
