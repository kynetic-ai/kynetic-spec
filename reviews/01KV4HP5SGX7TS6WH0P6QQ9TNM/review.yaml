    entries:
      - _ulid: 01KV4HTX7BQYSTG2ZPHV425ZKA
        author: Jacob Chapel
        body: "MUST-FIX: session states are still rendered with a local statusColor() helper on the session
          list, while the session detail header now uses the shared session token. This breaks
          @ui-view-header ac-2 across two session views; it also disagrees for some states (for
          example abandoned maps to status-needs-work here but to status-cancelled in the shared
          token table). Please replace this list-surface status rendering with the shared
          status-token component/helper so each session state has one color + glyph everywhere it
          appears."
        created_at: 2026-06-15T02:30:11.435Z
