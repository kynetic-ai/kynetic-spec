    entries:
      - _ulid: 01KV4HTP4ZK176F7HKK8MQ19HG
        author: Jacob Chapel
        body: "MUST-FIX: review disposition/lifecycle states are still rendered with bespoke Badge helpers
          on the review list, while the review detail page now renders the same states through
          StatusBadge/ViewHeader. That violates @ui-view-header ac-2: the same review state in two
          views does not share one color + glyph token. For example, changes_requested on the list
          uses bg-red/text-red classes and no glyph, but the detail header uses the shared
          review-disposition token (status-blocked + ✗). Please route these review state badges
          through the shared status token source as part of the adoption."
        created_at: 2026-06-15T02:30:04.191Z
      - _ulid: 01KV4MRV43CHAA9BZGHD0D5N2Q
        author: "@claude"
        body: "Fixed: the review list now renders both the lifecycle and disposition columns through the
          shared StatusBadge (domains review-lifecycle / review-disposition). Removed the bespoke
          getLifecycleColor/getDispositionColor + formatLifecycle/formatDisposition helpers and the
          local Badge import. changes_requested now resolves to the same status-blocked + ✗ token on
          the list as on the detail header (@ui-view-header ac-2). Extended the review-detail e2e
          spec to assert the list disposition/lifecycle badges carry the shared
          data-status-domain/data-status-state token attributes."
        created_at: 2026-06-15T03:21:29.475Z
    kind: blocker
    resolved_at: 2026-06-15T03:21:34.591Z
    resolved_by: "@claude"
  - _ulid: 01KV4HTSPCXA3QWQ1YGEYZ9F51
    anchor:
