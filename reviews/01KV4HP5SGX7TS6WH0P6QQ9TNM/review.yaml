      - _ulid: 01KV4HTP4ZK176F7HKK8MQ19HG
        author: Jacob Chapel
        body: "MUST-FIX: review disposition/lifecycle states are still rendered with bespoke Badge helpers
          on the review list, while the review detail page now renders the same states through
          StatusBadge/ViewHeader. That violates @ui-view-header ac-2: the same review state in two
          views does not share one color + glyph token. For example, changes_requested on the list
          uses bg-red/text-red classes and no glyph, but the detail header uses the shared
          review-disposition token (status-blocked + ✗). Please route these review state badges
          through the shared status token source as part of the adoption."
        created_at: 2026-06-15T02:30:04.191Z
    kind: blocker
