    entries:
      - _ulid: 01KXKQ8XD8008HS976EW5RXVGX
        author: Jacob Chapel
        body: 'MUST-FIX: stop target collection performs fallible durable ownership refresh before
          committing stopped authority. I added a temporary behavioral probe with a verified late
          group member and made the session directory unwritable so the refresh could not persist.
          applyGlobalLifecycleAction("stop") rejected, emitted no signal, but global authority
          remained running. The task requires commit-first stop and stopped authority after cleanup
          failure; once the mutex releases, this result permits new work after an operator stop
          failed. The task-scoped path has the same ordering at line 2061. Commit the matching scope
          stopped and materialize/report failed pending cleanup even when target-proof collection or
          refresh persistence fails.'
        created_at: 2026-07-15T20:25:13.384Z
      - _ulid: 01KXKRJ5TVGGN79N4PZFNSP8AB
        author: Jacob Chapel
        body: "Fixed in 601531c687: late-member proof persistence failures now freeze the last durable
          ownership tuple instead of escaping target collection, so global and task stop authority
          commits first, recovery persists failed cleanup, and the unproved member is never
          signalled. Added behavioral coverage for both scopes with an unwritable session
          directory."
        created_at: 2026-07-15T20:47:45.499Z
    kind: blocker
    resolved_at: 2026-07-15T20:47:51.347Z
    resolved_by: Jacob Chapel
