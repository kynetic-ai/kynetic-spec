        author: Jacob Chapel
        body: "MUST-FIX: failures while observing process-group exit after SIGTERM are not mapped to the
          required closed identity error. A temporary behavioral probe injected EACCES from
          waitForProcessGroupExit after initial ownership verification; the stop correctly remained
          stopped/failed, but rejected and persisted error_code=internal_error instead of
          cleanup_identity_unverifiable. The task explicitly maps unreadable /proc evidence to
          cleanup_identity_unverifiable, and callers rely on closed failure classes. Catch
          evidence-read failures from the wait phase and map them without reporting cleanup
          success."
        created_at: 2026-07-15T20:25:16.713Z
