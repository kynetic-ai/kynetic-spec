        body: "MUST-FIX: the explicitly required leaderless-empty-group recovery branch has no behavioral
          coverage. The two leaderless tests keep a live member and assert failure; the other
          no-signal recovery test pre-populates exited_at and returns before this `members.length
          === 0` path. The task's behavioral-test contract specifically requires recorded leader
          absent + recorded PGID empty to progress pending cleanup to idle/removal. Add a durable
