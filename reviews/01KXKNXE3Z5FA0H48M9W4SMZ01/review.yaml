    entries:
      - _ulid: 01KXKQ93T5ZBNWGTAGCMRJ44BG
        author: Jacob Chapel
        body: "MUST-FIX: the new publication-admission fixtures construct cleanup entries without the
          required targets array (also at lines 538-549). DispatchControlSchema rejects this exact
          shape with `pending_cleanup.global.targets: Required`, but AdmissionControlStore.commit
          bypasses schema validation. During engine.start, `_recoverPendingCleanups` then throws on
          `targets.length`; start swallows that recovery error, so the annotated test stays green
          while exercising an impossible persisted state and aborted recovery. Replace these with
          schema-valid cleanup records (and preferably validate memory-store commits) so the
          reconstruction assertions prove behavior against the production contract."
        created_at: 2026-07-15T20:25:19.941Z
      - _ulid: 01KXKRJWCABEQWBZN3RTJH9V6M
        author: Jacob Chapel
        body: "Fixed in 601531c687: every publication-admission cleanup fixture now includes a schema-valid
          targets array, and AdmissionControlStore.commit parses through DispatchControlSchema so
          impossible persisted states fail the test immediately."
        created_at: 2026-07-15T20:48:08.586Z
    kind: blocker
