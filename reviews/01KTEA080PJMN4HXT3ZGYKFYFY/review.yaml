    entries:
      - _ulid: 01KTEAV5AN7ZWG8HY3V6GQEQP4
        author: Jacob Chapel
        body: "MUST-FIX: session log --task still misses the standard canonical ref spelling when task_id is
          stored as a bare ULID and task_ref is a slug/display ref. The task scope says to preserve
          CLI command targeting where useful, and this branch added this filter specifically so
          session logs can be found by either canonical identity or display ref. However the
          implementation compares the raw option only to s.task_id and s.task_ref, so --task @<ULID>
          does not match s.task_id=<ULID> unless task_ref also happens to be @<ULID>. Evidence:
          running filterSessions on a session with task_id=01HZPAYLOAD0000000000000AA and
          task_ref=@task-payload returned {bare:1, at:0, slug:1}. Impact: operators who use the
          normal @ULID task ref cannot find canonicalized dispatch sessions once the display ref
          differs from the canonical id; normalize the filter forms or resolve through the same
          identity rules before comparing."
        created_at: 2026-06-06T11:24:42.198Z
    kind: blocker
  - _ulid: 01KTEAVKH5EJT0EWBGZY3YBC8S
    entries:
