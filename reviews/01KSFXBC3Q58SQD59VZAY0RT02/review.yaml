threads:
  - _ulid: 01KSFY3N27J10NKNK7GHK5HFH7
    anchor:
      type: code
      commit: 0aa596716c847ea0e4bbff89e42039aad8d2322c
      line_end: 361
      line_start: 361
      path: packages/shared/src/api.ts
      side: head
    entries:
      - _ulid: 01KSFY3N2754SVE8JWQCYBG4B5
        author: Jacob Chapel
        body: "MUST-FIX: PlanResourceMetadata adds bytes_url inside the resource metadata object, and the
          resource routes return that shape for GET /api/plans/:ref/resources, GET
          /api/plans/:ref/resources/:resourceId, and POST responses. The task contract explicitly
          required every plan resource API response to use the exact ResourceMetadata shape
          {id,label,path,content_type,bytes,sha256,git_commit,git_path,description}. Extra fields
          break exact-shape clients and make the tests prove a different contract than the task
          requested. Keep ResourceMetadata exact and expose safe fetch URLs outside the metadata
          object, such as a sibling/base URL field."
        created_at: 2026-05-25T16:04:56.007Z
      - _ulid: 01KSG0GEVEHNNFCZ3FMW5BMHC1
        author: "@claude"
        body: "Fixed: PlanResourceMetadata is now the strict 9-field shape mirrored from ResourceMetadata —
          bytes_url no longer leaks into individual resource entries. Safe fetch URLs live outside
          the metadata object on PlanDetail.resources_base_url (sibling), the new daemon helper
          buildResourcesBaseUrl(planUlid). All four surfaces (daemon API, CLI, static export, agent
          context) now see an identical resource record. Tests assert resources do not carry
          bytes_url / base_url / url / exported_path properties, and the UI link rewriter accepts
          resources_base_url as an explicit parameter so consumers construct
          `${base}/${encodeURIComponent(id)}/bytes` themselves."
        created_at: 2026-05-25T16:46:52.781Z
    kind: blocker
    resolved_at: 2026-05-25T16:46:56.724Z
    resolved_by: "@claude"
  - _ulid: 01KSFY439AQ6HRQRT55RKPPX1F
    anchor:
      type: code
      commit: 0aa596716c847ea0e4bbff89e42039aad8d2322c
      line_end: 228
      line_start: 221
      path: packages/daemon/src/routes/plans.ts
      side: head
    entries:
      - _ulid: 01KSFY439AFJF92773TKX72K0T
        author: Jacob Chapel
        body: "MUST-FIX: The cache-ready /api/plans path drops all resource summary information. When the
          plans cache domain is ready, canLoadResources is false and every plan is returned with
          resources: [] even if the plan index contains resource_summary. The task specifically
          required the list route to stay fast by using index/resource summaries, but the production
          cache-hit path neither preserves resource_summary in PlanIndexSummary nor returns it. This
          makes resource-bearing plans look resource-free on the normal cached list endpoint. Add
          the bounded resource summary to the cache/index API projection and cover the cache-ready
          route in tests."
        created_at: 2026-05-25T16:05:10.570Z
      - _ulid: 01KSG0GPKHDENNGYN43K1NSF7P
        author: "@claude"
        body: "Fixed: the bounded resource_summary {count, total_bytes} is now plumbed through the cache
          index. PlanIndexSummary carries resource_summary; loadPlanFromDir reads the resources.yaml
          sidecar and attaches the summary to LoadedPlan; toPlanIndexSummary projects it through.
          The list route now always returns PlanSummary.resource_summary (cache-ready and
          disk-fallback paths) and never returns the full resources array on /api/plans — full
          metadata stays on the detail route and the dedicated /resources endpoints. Two new daemon
          tests cover the cache-ready path: one asserts the route projects {count:2, total_bytes:8}
          when the PlanIndexSummary carries resource_summary, and one asserts {count:0,
          total_bytes:0} when the summary is absent."
        created_at: 2026-05-25T16:47:00.721Z
    kind: blocker
    resolved_at: 2026-05-25T16:47:04.606Z
    resolved_by: "@claude"
