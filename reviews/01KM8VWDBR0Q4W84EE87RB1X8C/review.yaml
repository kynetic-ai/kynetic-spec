      side: head
    entries:
      - _ulid: 01KM8W7DJ46YX89HK49XD3D7Z3
        author: Test User
        body: "This AC-4 test never loads the migrated data through `TaskDataManager`; it only reparses
          `task.yaml` and `notes.yaml` directly from disk. Because of that, the test would still
          pass if the migration wrote files that look right here but fail under the actual
          split-manager load path the spec names. In this repo that is a MUST-FIX coverage gap: the
          acceptance criterion is about TaskDataManager-visible behavior, but the test asserts a
          lower-level surrogate."
        created_at: 2026-03-21T18:58:52.100Z
    kind: blocker
