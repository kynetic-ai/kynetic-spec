        body: >-
          Files read: src/cli/commands/task.ts, src/parser/split-backend.ts, src/parser/yaml.ts,
          src/parser/shadow.ts, src/cli/batch-write-buffer.ts, tests/task-migrate.test.ts,
          scripts/test.cjs.

          Commands run: kspec task get, kspec item get, kspec review for-task/get, git diff/stat,
          grep AC annotations, kspec validate, focused migration test suite, full npm test, and a
          live CLI repro with malformed monolithic data.

          Claims verified: prior blocker fixes for atomic shadow commit and executable
