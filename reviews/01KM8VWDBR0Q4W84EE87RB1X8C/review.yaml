    entries:
      - _ulid: 01KM8W79K7KW7DZJFN33SETRGS
        author: Test User
        body: "Rows are treated as monolithic only when `notes` is an array. A legacy row with malformed or
          missing `notes` is therefore misclassified as already-lean, skipped by migration, and can
          even trigger the 'Already migrated' success path. I reproduced this with a temp
          `.kspec/project.tasks.yaml` containing `notes: bad`: `task migrate` exited 0, printed
          'Already migrated — no monolithic tasks to process.', and left the monolithic row
          untouched. That violates AC-5, which requires invalid tasks to be migrated with a warning
          rather than skipped."
        created_at: 2026-03-21T18:58:48.039Z
    kind: blocker
  - _ulid: 01KM8W7CM1B0MV9XXR1D82KAG1
    entries:
      - _ulid: 01KM8W7CM1ER9VWWQPT0R1XBZX
