    entries:
      - _ulid: 01KM6BN5C0QR1MRA7HFK1Y8198
        author: Jacob Chapel
        body: "This changes the backend contract for GET /api/reviews: omitting status now returns every
          lifecycle state instead of defaulting to open reviews. That violates
          @review-records-daemon-api ac-1 (and the web UI requirement that the list defaults to
          open) while only masking the validation bug for callers that omit the param. The task can
          still be fixed without this regression by either allowing an explicit all-status sentinel
          through validation or preserving the existing open-by-default daemon behavior and changing
          only the callers that need all reviews."
        created_at: 2026-03-20T19:30:47.809Z
      - _ulid: 01KM6CWEWXGGH6M31F5B4F1JFZ
        author: "@claude"
        body: Fixed in commit cd1cae22e. Restored the open-by-default backend contract — no status param now
          defaults to ['open'] as before. UI callers that need all lifecycle states now send all
          four valid statuses explicitly (draft, open, closed, archived) instead of omitting the
          param or using the invalid 'all' sentinel.
        created_at: 2026-03-20T19:52:15.517Z
