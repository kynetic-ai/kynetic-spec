      side: head
    entries:
      - _ulid: 01KXQ3FW4K5VREXYJXBF89E0B0
        author: Jacob Chapel
        body: "MUST-FIX — The fact-drift gate still self-validates several required API, event, and safety
          leaves instead of binding them to exported schemas or observable behavior.
          `control_error_includes_current_status`, canonical event task identity, the
          closed/no-raw-error event contract, interactive confirmation, host-stop rejection,
          dispatch-owned-only targeting, and failed-cleanup authority are compared only with
          duplicated booleans or prose literals. `EVENT_PAYLOAD_SCHEMAS` is used only to enumerate
          names, route introspection checks only method/path, and the black-box stop test covers
          only noninteractive/JSON `--force`. Impact: those production contracts can change while
          the frozen fixture and this comparison remain unchanged, so downstream documentation
          consumes stale facts. Evidence: lines 890-952 contain the literal comparisons; the fresh
          focused and full suites both pass without exercising these fixture claims. This is the
          same source-binding class as the prior blocker and must be fixed at the same MUST-FIX
          severity. Bind every retained required leaf to a schema/helper/executed failure path
          (including the current-status error envelope and event payload constraints), rather than
          to another hand-written literal."
        created_at: 2026-07-17T03:56:27.667Z
    kind: blocker
  - _ulid: 01KXQ3FZ8ZH9P6HA307DWVVABX
    anchor:
      type: code
      commit: ed901155061c87d9ef17684aacea4e959afff8ee
      line_end: 111
      line_start: 82
      path: tests/public-documentation-inventory.test.ts
      side: head
    entries:
      - _ulid: 01KXQ3FZ8ZARCP1EZHK5CTBPGA
        author: Jacob Chapel
        body: "MUST-FIX — The non-file inventory is exact only over a lossy per-kind signature, so required
          record identity and authority metadata are not gated. `nonFileSignature` discards stable
          IDs for API/UI/scaffold/generated/documentation-test records and `validateInventory` never
          validates their classification or complete source-of-truth set; the UI universe is also a
          hand-written two-string list. For example, changing `scaffold:setup-project-config` to an
          arbitrary unique id, or clearing an API record classification while retaining its surface
          string, still satisfies every comparison. Impact: the declared public inventory can
          silently drift in stable IDs, classification, ownership evidence, or required UI
          membership while tests stay green, contrary to the deterministic independently-derived
          manifest contract. Evidence: lines 82-111 reduce each record to one field, while the
          metadata checks later apply only to Markdown and generated pairings; all 14 inventory
          tests pass without a negative mutation for these fields. Compare independently derived
          complete record identities/required metadata (or validate each kind with an explicit
          schema and source authority), not only one signature."
        created_at: 2026-07-17T03:56:30.879Z
    kind: blocker
  - _ulid: 01KXQ3G2FRF1C8E6MNHQVCCPY2
