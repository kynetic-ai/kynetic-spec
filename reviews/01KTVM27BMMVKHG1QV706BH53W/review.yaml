    entries:
      - _ulid: 01KTVM93ATN25K5W6F60K52TGQ
        author: Jacob Chapel
        body: "MUST-FIX: The timeout response directs operators to run `kspec serve status`, but that CLI
          path currently discards the new `command_dispatch` health payload. `statusServer` fetches
          `/api/health` only to parse `uptime`, then builds a status object without the degraded
          command name or running duration. A user following the 504 suggestion will not see the
          wedged dispatch signal. Surface `command_dispatch` in `serve status` JSON and human
          output, or change the timeout suggestion to an actually informative surface."
        created_at: 2026-06-11T15:19:43.706Z
      - _ulid: 01KTVPYGWW3FZF7KH203P1SC8W
        author: "@claude"
        body: "Fixed in commit 6a4c811fac: statusServer now parses command_dispatch from /api/health
          alongside uptime, includes it in the serve status --json object, and renders a
          human-readable line — 'Command dispatch: ok' when healthy, or 'Command dispatch: DEGRADED'
          naming the stuck command, its running duration, and the configured limit with restart
          guidance. Daemons that do not report the field yield command_dispatch: null and no human
          line. Covered by new behavioral tests in tests/cli-serve-status-command-dispatch.test.ts
          that run the real CLI subprocess against the child-process mock daemon (new
          healthCommandDispatch fixture option) with isolated kspec home metadata, asserting both
          JSON and human output for degraded/ok/absent payloads (AC: @daemon-command-api
          ac-stuck-command-reported)."
        created_at: 2026-06-11T16:06:22.876Z
    kind: blocker
