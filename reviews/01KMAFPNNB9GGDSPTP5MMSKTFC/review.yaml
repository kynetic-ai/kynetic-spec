    entries:
      - _ulid: 01KMAFY4RZBRHJ9JSY5AQWN9GQ
        author: Test User
        body: "SessionHandle.sendPrompt() is documented and typed as a promise-returning API, but this
          implementation can throw synchronously when promptQueue.enqueue() hits a closed/full
          queue. That turns an AC-17 rejection into a fatal exception path for ordinary onIdle
          callers: an uncaught overflow/closed-queue send now fails the whole invocation instead of
          just rejecting the extra prompt. The new overflow test only passes because it catches a
          synchronous throw, which confirms the contract mismatch rather than the intended rejection
          behavior."
        created_at: 2026-03-22T10:02:34.144Z
    kind: blocker
