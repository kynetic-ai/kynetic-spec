        author: Test User
        body: The production idle-hook path still races prompt delivery. At
          [src/agent-runtime/invocation.ts](/home/chapel/Projects/kynetic-spec-dispatch/.kspec-worktrees/task-session-prompt-action-01kma74e-review/src/agent-runtime/invocation.ts#L676)
          you set  and emit  before installing  at line 702.  only queues subscribers asynchronously
          and returns immediately, so a  hook can call  while the handle is already  but still has
          no resolver. That path falls into the  rejection at lines 523-527 instead of queueing the
          follow-up. In practice this breaks the core  flow on the real dispatch path, so ACs 1 and
          3 are not reliably satisfied. The resolver needs to exist before the idle event is
          emitted, or the idle-state send path needs to queue even when the wake callback has not
          been installed yet.
