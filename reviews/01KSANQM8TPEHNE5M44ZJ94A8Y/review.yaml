      path: src/parser/entity-storage-compatibility.ts
      side: head
    entries:
      - _ulid: 01KSAQCPX8JPP8YJNJ060HHTM8
        author: Jacob Chapel
        body: "MUST-FIX: The lenient manifest gate explicitly returns success for legacy projects with no
          plan_storage/review_storage declarations. Because daemon plan/review routes reach this
          gate through loadPlans/loadReviewRecords, tests now assert GET /api/plans and GET
          /api/reviews return 200 for a kynetic 1.1 project without storage declarations
          (tests/daemon-api/entity-storage-incompatibility-routes.test.ts:177-199). That contradicts
          the task/AC requirement that unmigrated plan/review reads fail with
          entity_storage_incompatible guidance and a 409 instead of serving legacy monolithic data.
          Use the strict gate for daemon routes/callers that require folder-backed behavior, or
          otherwise ensure old layouts produce legacy_plan_storage_removed /
          legacy_review_storage_removed with the structured 409 response."
        created_at: 2026-05-23T15:31:20.616Z
      - _ulid: 01KSAWDSF2JWNPDCD6YJC754N8
        author: "@claude"
        body: "Fixed: daemon plan and review routes now call the strict requirePlanFolderStorage /
          requireReviewFolderStorage gates at every entry (list, detail, mutation, plus the reviews
          onError handler). On a legacy project (kynetic < 1.2, no plan_storage / review_storage
          declaration) the gate raises legacy_plan_storage_removed / legacy_review_storage_removed
          and the entityStorageIncompatibilityResponse helper turns it into a structured 409 with
          code, domain, field, suggestion, and cache_domain.
          tests/daemon-api/entity-storage-incompatibility-routes.test.ts now asserts that GET
          /api/plans, GET /api/plans/:ref, and GET /api/reviews on a legacy 1.1 project (with
          project.plans.yaml / project.reviews.yaml present and empty) return 409
          entity_storage_incompatible with legacy_*_storage_removed instead of 200 — exactly the
          contract the prior fix violated."
        created_at: 2026-05-23T16:59:18.876Z
    kind: blocker
    resolved_at: 2026-05-23T16:59:38.390Z
    resolved_by: "@claude"
  - _ulid: 01KSAQF6WZ75ADJ89T49Z4XCVH
    anchor:
      type: code
      commit: 990d24115785a42e739cf439605a63530c652069
      line_end: 445
      line_start: 436
      path: src/parser/entity-local-resources.ts
      side: head
    entries:
      - _ulid: 01KSAQF6WZG8AP4JB6FD5987E2
        author: Jacob Chapel
        body: "MUST-FIX: The resource-storage compatibility gate is only defined, not enforced on resource
          reads. `rg` shows assertResourceStorageCompatible/requireResourceFolderStorage are
          referenced only in entity-storage-compatibility.ts and tests; the resource entry point
          here takes only ownerEntityDir/relativePath, loads resources.yaml, and resolves the
          resource without any KspecContext/manifest check. That leaves the resource domain outside
          the task contract: an unmigrated or missing `resource_storage.format: entity_scoped`
          project can still read entity-local resources without an entity_storage_incompatible
          409/guidance path. Wire the resource gate into the resource manager/callers that need
          resource behavior, or add an explicit compatibility boundary with tests for the resource
          domain."
        created_at: 2026-05-23T15:32:42.527Z
      - _ulid: 01KSAWEX4PV882XAKSQFJQENH6
        author: "@claude"
        body: "Fixed: resolveResourceReference now takes a required ctx: KspecContext and calls
          requireResourceFolderStorage(ctx) before loadResourceManifest / resolveResourcePath. The
          signature change is enforced by the type system so any future caller is forced to thread
          the project context. Legacy projects (kynetic < 1.2 without resource_storage) raise
          legacy_plan_storage_removed with domain: 'resources'; 1.2 projects missing or declaring a
          non-entity_scoped resource_storage raise missing_plan_folder_storage with domain:
          'resources'. tests/entity-local-resources.test.ts adds three new behavioural tests against
          resolveResourceReference that exercise each of those project states and assert
          EntityStorageCompatibilityError with the correct code, domain, and field. The daemon
          resource error mapping was already in entityStorageIncompatibilityResponse, so callers
          that thread the resolver into route handlers will automatically get the 409 contract."
        created_at: 2026-05-23T16:59:55.413Z
    kind: blocker
    resolved_at: 2026-05-23T17:00:05.203Z
    resolved_by: "@claude"
  - _ulid: 01KSAQFNYB5EPPX0C805A7HVNC
    anchor:
      type: code
      commit: 990d24115785a42e739cf439605a63530c652069
      line_end: 309
      line_start: 280
      path: src/parser/plans.ts
      side: head
    entries:
      - _ulid: 01KSAQFNYB7DQAD8E084Q9EN3Q
        author: Jacob Chapel
        body: "MUST-FIX: A clean folder-declared project can still be written through the monolithic plan
          store. New projects now declare `plan_storage.format: folder`, but savePlan first calls
          the lenient gate, which passes when there are no existing monolithic records, and then
          writes `project.plans.yaml`. The CLI plan add/import paths still call savePlan
          (src/cli/commands/plan.ts:748-749 and src/cli/commands/plan-import.ts:236-252), so a fresh
          1.2 project can create legacy monolithic plan data under a folder-storage manifest. That
          immediately creates the partial layout this task is supposed to prevent, and the branch
          works around it by downgrading several plan integration fixtures to legacy storage. Plan
          writes for folder-declared projects need to route to folder-backed storage or fail with
          structured incompatibility until that storage manager is available; they must not create
          monolithic files under a 1.2 folder manifest."
        created_at: 2026-05-23T15:32:57.931Z
      - _ulid: 01KSAWFREZJHMSGBC19E1NBPM4
        author: "@claude"
        body: "Fixed: introduced assertPlanStorageWritable / assertReviewStorageWritable as the
          storage-manager write gate. They run the lenient manifest check + partial-layout detector
          (same as the read gate) PLUS describeMonolithicWriteIncompatibility, which rejects any
          write whenever the manifest declares folder/entity_scoped storage — even when the on-disk
          layout is currently clean. savePlan, mutatePlanAtomically, deletePlan and the review
          equivalents now call the new writable gate, so a fresh kynetic 1.2 project cannot create a
          monolithic project.plans.yaml / project.reviews.yaml beneath a folder manifest.
          tests/entity-storage-partial-layout-manager.test.ts pins this behaviour: on a clean
          folder-declared project, savePlan rejects with partial_entity_storage_layout (domain:
          plans) BEFORE any file is created (asserted via fs.access raising ENOENT after the
          rejection). Same coverage for the review side. The plan integration fixtures that
          previously used a folder-declared manifest now call downgradeManifestToLegacyStorage with
          an inline comment noting the dependency on the sibling folder-backed plan storage manager
          task — those tests exercise the legacy storage path that still works on legacy manifests,
          not the folder-declared write path the gate rejects."
        created_at: 2026-05-23T17:00:23.386Z
    kind: blocker
    resolved_at: 2026-05-23T17:00:34.889Z
    resolved_by: "@claude"
