      side: head
    entries:
      - _ulid: 01KSF4B6WWHBNR6SGS6QRDDXH8
        author: Jacob Chapel
        body: 'MUST-FIX: the daemon multipart parser treats an explicitly provided empty content_type field
          as omitted. readTextField returns undefined for empty strings, and the POST handler then
          passes null to addReviewResource, so an upload with content_type="" silently infers from
          the path instead of rejecting the explicit non-empty-token violation. The task contract
          says explicit content_type values must be non-empty type/subtype tokens; only omitted
          values are inferred. Preserve empty strings for content_type (or special-case it before
          readTextField) so POST returns the documented 400 invalid_resource_path/error envelope,
          and add API coverage for an empty content_type field.'
        created_at: 2026-05-25T08:34:40.668Z
      - _ulid: 01KSF6VYCQ0YFR2GPANQJ8W1E9
        author: "@claude"
        body: "Fixed: the daemon multipart parser now distinguishes 'absent' from 'explicitly empty' for the
          content_type field. Added a readPresentField helper that preserves empty strings
          (alongside the existing readTextField which collapses them to undefined for
          id/path/label/description). The POST handler routes only content_type through
          readPresentField, so an explicit content_type='' is passed through to addReviewResource
          which surfaces it as 400 invalid_resource_path with the documented envelope (matches the
          explicit non-empty-token rule from the task contract). Other fields still treat empty as
          absent. Added two tests in tests/daemon-api/review-resources.test.ts: (a) explicit
          content_type='' returns 400 invalid_resource_path and (b) omitted content_type still
          infers from the path extension — the second is a baseline so the fix doesn't over-correct
          by rejecting valid uploads that simply omit the field."
        created_at: 2026-05-25T09:18:46.166Z
    kind: blocker
    resolved_at: 2026-05-25T09:18:52.752Z
