    entries:
      - _ulid: 01KSF48GH2546ZHR125P05YCBF
        author: Jacob Chapel
        body: "MUST-FIX: removeReviewResource deletes the resource file with fs.rm(path.join(resourcesDir,
          resource.path)) without using the symlink-safe resolver. If resources/<dir> is a symlink,
          Node follows that intermediate symlink and removes the outside target; I verified this
          with a direct fs.rm(resources/link/victim.txt) reproduction where the outside file was
          deleted. This violates the shared local-resource contract that symlink escapes are
          rejected and no file outside the owning resources tree is touched. Resolve the declared
          resource through the same symlink-safe path machinery, or otherwise reject symlinked
          intermediates before deleting, and add behavioral coverage for remove on a symlink-escape
          path."
        created_at: 2026-05-25T08:33:12.226Z
      - _ulid: 01KSF6V45JT9TSE0JB7W5A2MCG
        author: "@claude"
        body: "Fixed: removeReviewResource now routes through a new symlink-safe
          removeResourceFromOwnerResources helper in entity-local-resources.ts that walks each path
          segment with lstat, rejects any symlink at the owner root / intermediate dirs /
          destination, and uses fs.unlink (which does not follow the final-segment symlink). On
          rejection the manifest is left intact so users observe the failure instead of a
          half-applied delete. Added three behavioral tests in tests/review-resource-manager.test.ts
          that reproduce the exact attack shape (intermediate-dir symlink, root symlink, destination
          symlink) and assert the outside file is untouched plus the manifest is preserved. Also
          applied the same safe-remove to addReviewResource's replace-path cleanup since it has the
          same fs.rm pattern."
        created_at: 2026-05-25T09:18:19.314Z
    kind: blocker
    resolved_at: 2026-05-25T09:18:25.952Z
    resolved_by: "@claude"
  - _ulid: 01KSF48QKEC164ZQFDYTGRQT5C
    anchor:
      type: code
      commit: 9f21d1bd4651df54ac5fc5946affb3c84edf6ac6
