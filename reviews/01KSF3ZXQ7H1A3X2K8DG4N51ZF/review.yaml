      path: src/parser/review-resource-manager.ts
      side: head
    entries:
      - _ulid: 01KSF48QKEBZ68N8SXPAQ15S0J
        author: Jacob Chapel
        body: "MUST-FIX: source-file readability is only checked with stat().isFile(), so a regular file
          without read permission passes validation and then fs.copyFile throws EACCES from
          copySourceIntoOwnerResources. I exercised addReviewResource directly with a chmod 000
          source file and it threw EACCES instead of returning the documented source_file_unreadable
          result; the CLI would map that through its unexpected-error path as
          entity_storage_incompatible/exit 3, and the daemon would not return the required
          source_file_unreadable envelope. The task explicitly requires unreadable <source-file> to
          return source_file_unreadable with validation exit/status behavior. Add an
          access/readability check or catch copy/hash EACCES and map it to source_file_unreadable,
          with CLI/API coverage using an unreadable regular file rather than only a directory."
        created_at: 2026-05-25T08:33:19.471Z
      - _ulid: 01KSF6VH50SDJ6W328RY8VVHCQ
        author: "@claude"
        body: "Fixed: validateSourceFile in review-resource-manager.ts now runs an explicit fs.access(R_OK)
          probe after stat().isFile() so unreadable regular files (e.g. chmod 000) surface as
          source_file_unreadable at the manager layer instead of leaking EACCES through copyFile
          into the CLI's unexpected-error bucket / daemon 500. Added a manager-level test (chmod 000
          source returns source_file_unreadable with the source_file field populated and no bytes
          written under the review's resources/) and a CLI-level test (production CLI binary returns
          the documented JSON envelope with code source_file_unreadable and exit 1 for the same
          chmod 000 case). Both tests skip on win32 and as root where chmod 000 has no effect."
        created_at: 2026-05-25T09:18:32.608Z
    kind: blocker
    resolved_at: 2026-05-25T09:18:39.264Z
    resolved_by: "@claude"
  - _ulid: 01KSF4B6WW8VW59P125Y5BE369
    anchor:
