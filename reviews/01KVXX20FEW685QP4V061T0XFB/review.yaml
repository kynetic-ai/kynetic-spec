    entries:
      - _ulid: 01KVXXXB32FZKNFC12047N1H0X
        author: Jacob Chapel
        body: "MUST-FIX: daemon-served spec/AC mutations still do not emit a typed coverage-state event
          after the cache write-through. This completion path writes through all affected domains
          and then only broadcasts the collected mutation events, which for spec item writes are
          `spec_item_changed` from `src/parser/yaml.ts`. There is no `coverage_state_changed` event
          synthesized after the recomputed coverage read model for item/AC changes. Adding
          client-side coverage invalidation for `spec_item_changed` helps the current UI, but it
          does not satisfy @coverage-state-events `ac-event-topic` / `ac-event-after-cache`: a
          coverage-state-affecting spec/AC mutation should produce the reserved coverage-state
          family event on `items:updates` after the cache/read model reflects the change. Consumers
          that subscribe to typed coverage-state events still miss spec/AC mutations."
        created_at: 2026-06-24T23:02:14.882Z
    kind: blocker
  - _ulid: 01KVXXXX29P5F2GDN2WC2RBS9F
