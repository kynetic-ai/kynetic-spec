    entries:
      - _ulid: 01KQB7F7EJC3DCHWM7CBGTQTE0
        author: Jacob Chapel
        body: The proposed AC includes 'lower-level catalog item update' in the When clause. That is an
          implementation/API path rather than observable behavior for this spec, and it mixes a
          user-supplied patch with an internal update path. Move parser-layer/updateSpecItem
          coverage into task instructions/tests, or split/reword the AC as a behavioral guarantee
          for supported item mutation paths without naming internals.
        created_at: 2026-04-28T23:40:56.658Z
    kind: blocker
  - _ulid: 01KQB7FAN2SD0D5ZT3N4S37BZK
    anchor:
      type: structured
      field: ac-bulk-invalid-operation-isolated
      ref: "@item-patch"
      section: acceptance_criteria
    entries:
      - _ulid: 01KQB7FAN24TRNXPHZ16X5NA8T
        author: Jacob Chapel
        body: "The Then clause combines three independently verifiable outcomes: the invalid operation is
          not written, a later valid operation is applied, and the command exits with a failure
          status. Split this into atomic ACs or merge the exit-status assertion into an existing
          bulk error/status AC so each criterion has one observable outcome."
        created_at: 2026-04-28T23:40:59.938Z
    kind: blocker
  - _ulid: 01KQB7FDWNGRXW7G2HQ7N7A4G9
    anchor:
      type: structured
      field: ac-valid-delimiters-preserved
      ref: "@ac-annotation-identifier-format"
      section: acceptance_criteria
    entries:
      - _ulid: 01KQB7FDWNJHK89ZJT38ZT7KHS
        author: Jacob Chapel
        body: This AC uses 'supported delimiters such as whitespace or commas', which leaves the accepted
          delimiter set open-ended and harder to verify. Please state the exact delimiters the
          contract requires, or move non-exhaustive examples into task guidance.
        created_at: 2026-04-28T23:41:03.253Z
