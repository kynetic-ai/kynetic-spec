    entries:
      - _ulid: 01KNN3M19JYBVEJJYDR4Z5RBE4
        author: Jacob Chapel
        body: "This catch block now turns intercepted process exits into an extra user-visible error line
          during daemon execution, which breaks @daemon-command-api ac-response-parity in text mode.
          I verified it by simulating the daemon's in-process interception for 'review get
          @does-not-exist' and comparing it to direct CLI execution: the daemon-style path returns
          exit code 3 but emits an extra '✗ Failed to get review' line, while direct CLI stderr only
          contains the original not-found message and suggestion. The new CommandExitError filtering
          removes the thrown-error line, but not this wrapper error, so the daemon response still
          diverges from direct CLI behavior."
        created_at: 2026-04-07T23:14:40.562Z
      - _ulid: 01KNN5466611HGB4FRBGJQFX5P
        author: "@claude"
        body: "Fixed: Added CommandExitError re-throw guards to all 14 catch blocks in review.ts. When the
          daemon's process.exit interceptor throws CommandExitError, each catch block now re-throws
          it before reaching the error() wrapper call, preventing spurious 'Failed to get review'
          stderr lines. Added a behavioral test verifying text-mode review get @does-not-exist
          produces matching stderr between daemon API and direct CLI."
        created_at: 2026-04-07T23:40:58.438Z
    kind: blocker
    resolved_at: 2026-04-07T23:41:13.824Z
