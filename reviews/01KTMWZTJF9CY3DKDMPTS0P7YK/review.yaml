      - _ulid: 01KTMXR6PZD2KVYTTDDTTGVV0E
        author: Jacob Chapel
        body: "MUST-FIX: @live-task-resource-markdown-rendering
          ac-unmatched-task-resource-reference-stays-raw requires the live task modal to leave an
          unmatched ./resources reference visible and show actionable guidance. The only guidance
          data computed here is unhealthyResources from task.resolved_resources filtered to
          non-present statuses, so a description reference with no matching resolved resource path
          has no entry and the Resources needing attention section never renders. I also executed a
          markdown rendering probe for ![gone](./resources/screens/missing.png); marked renders it
          as an img tag with the path only in src, so the raw ./resources/... authoring reference is
          not visible as text. The current tests prove rewriteTaskResourceLinks leaves unmatched
          markdown raw, but they do not prove the live modal guidance required by the AC. Add
          unmatched-reference detection/guidance in the modal and behavioral coverage for that UI
          path."
        created_at: 2026-06-09T00:50:34.847Z
    kind: blocker
