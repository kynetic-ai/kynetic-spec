threads:
  - _ulid: 01KM8JDSZAV0P13QWMCFYAVHEQ
    anchor:
      type: code
      commit: ""
      line_end: 331
      line_start: 311
      path: packages/daemon/src/routes/tasks.ts
      side: head
    entries:
      - _ulid: 01KM8JDSZA423V0XM8X7SN296H
        author: Test User
        body: These API transition routes now pass commit metadata into mutateTask(), which makes
          TaskDataManager auto-commit the task change, and then they call commitIfShadow() again
          after spec sync. That splits one logical transition into two shadow commits and can leave
          the task state already committed if the later sync/commit step fails. The routes need the
          same skipCommit-style outer commit boundary used in other multi-step flows.
        created_at: 2026-03-21T16:07:35.659Z
    kind: blocker
  - _ulid: 01KM8JF2YSE69V7CYTBEWS5CMQ
    anchor:
      type: code
      commit: ""
      line_end: 1088
      line_start: 1074
      path: src/cli/commands/review.ts
      side: head
    entries:
      - _ulid: 01KM8JF2YSDQXVFB280NZ2ZW3A
        author: Test User
        body: "The same commit-order problem exists on request_changes: review verdict is committed before
          handleVerdictTaskTransition() runs, and that helper now mutates each task with per-task
          auto-commits. A mid-loop failure leaves a closed review on disk with only some
          pending_review tasks moved to needs_work, which breaks review/task lifecycle consistency."
        created_at: 2026-03-21T16:08:17.625Z
    kind: blocker
  - _ulid: 01KM8JF3Y71QM1KW5C9313Q9DV
    anchor:
      type: code
      commit: ""
      line_end: 1069
      line_start: 1034
      path: src/parser/split-backend.ts
      side: head
    entries:
      - _ulid: 01KM8JF3Y895ANCAJTQ7GHY4AZ
        author: Test User
        body: Split mode now allows unrelated tasks to mutate concurrently, but index updates still do an
          unlocked read-modify-write of shared project.tasks.yaml. Two concurrent mutations on
          different tasks can both start from the same index snapshot here, and the later flush
          overwrites the earlier task's entry change, leaving listTasks stale until a rebuild. The
          concurrency tests currently only assert the returned tasks, not the persisted index.
        created_at: 2026-03-21T16:08:18.632Z
    kind: blocker
  - _ulid: 01KM8JF4YPFP9R8GBCF0JACZTA
    anchor:
      type: code
      commit: ""
      line_end: 533
      line_start: 523
      path: src/cli/commands/review.ts
      side: head
    entries:
      - _ulid: 01KM8JF4YPX7E4D6DK0CTPS4JM
        author: Test User
        body: review add now commits the new review before task linkage runs, but linkReviewToTasks mutates
          each task with commit metadata of its own. If one of those task updates fails partway
          through, the review is already committed and only a prefix of linked tasks gets review_ref
          updated. Carry the history metadata without per-task auto-commits here, then commit once
          after the whole linkage pass succeeds.
        created_at: 2026-03-21T16:08:19.670Z
    kind: blocker
  - _ulid: 01KM8JF5Y89QPZMR5QYJYRKZB6
    anchor:
      type: code
      commit: ""
      line_end: 1145
      line_start: 1116
      path: src/parser/split-backend.ts
      side: head
    entries:
      - _ulid: 01KM8JF5Y82EWQ34HZE99WJTAS
        author: Test User
        body: rebuildIndex() bypasses the migration gate. With split mode enabled on an unmigrated repo, the
          normal read paths correctly stop with migration guidance, but this method will scan an
          empty tasks/ directory and rewrite project.tasks.yaml to an empty index instead of
          refusing the operation. That can destroy the remaining monolithic task records.
        created_at: 2026-03-21T16:08:20.680Z
    kind: blocker
