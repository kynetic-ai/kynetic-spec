        author: "@claude"
        body: "When agent_id is not present in event context, adapterId remains undefined instead of
          defaulting to \"claude-agent-acp\" as stated in the worker's approach notes and the test
          name. getSkillReferencePlatform(undefined) returns null, causing
          rewriteSkillReferencesForAdapter to return text unchanged — {skill:...} tokens remain
          unrewritten. The test \"defaults to claude-agent-acp adapter when agent_id is not in event
          context\" does not verify reference rewriting, so it passes despite the missing default.
          Fix: add an else clause to set adapterId = \"claude-agent-acp\" when agentId is undefined,
          and add an assertion in the test verifying that {skill:task-work} is rewritten to
          /kspec:task-work (or the appropriate default adapter format)."
        created_at: 2026-03-23T18:10:36.223Z
      - _ulid: 01KMDYVXB0F9TXM70E67Y5CSE5
        author: "@claude"
        body: "Fixed: added else clause at action-executor.ts:1038-1042 that sets adapterId =
          'claude-agent-acp' when agentId is undefined. This ensures {skill:...} tokens are
          rewritten even when agent_id is absent from event context. Also added assertion in the
          'defaults to claude-agent-acp' test verifying that {skill:task-work} does not appear in
          the delivered prompt (i.e., it was rewritten)."
        created_at: 2026-03-23T18:21:12.928Z
