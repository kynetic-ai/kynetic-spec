    entries:
      - _ulid: 01KV4F2BGEMGSFDF3MX3E99ZA6
        author: Jacob Chapel
        body: "MUST-FIX: The identity payload emitted here only includes each agent's canonical id and
          display name, so the classifier config produced by the real endpoint cannot resolve the
          non-derivable measured agent aliases this task explicitly calls out (for example
          @dispatch/@kspec/@kspec-dispatch for pr-reviewer). The classifier tests only pass those
          aliases through a hand-built test config; the daemon endpoint never supplies them.
          Evidence: running classifyActor('@dispatch', { human: null, agents: [{ canonicalId:
          'pr-reviewer', displayName: 'PR Reviewer' }] }) returns kind unknown, while @pr-reviewer
          resolves. This breaks the required web consumption path because fetchIdentity() feeds this
          endpoint payload to the shared classifier. Add a production alias/variant source to the
          identity config/payload and cover the endpoint/static payload behavior, not just the pure
          classifier with a synthetic config."
        created_at: 2026-06-15T01:41:49.710Z
