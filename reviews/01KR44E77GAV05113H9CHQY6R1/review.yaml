      - _ulid: 01KR453FRV9W2E2V773X61DCGF
        author: Jacob Chapel
        body: 'MUST-FIX: This annotation claims coverage for `@daemon-test-guardrail-precision
          ac-unrelated-subprocesses-not-reported`, but the annotated block does not exercise the AC.
          The AC requires a non-kspec subprocess whose arguments contain words also used by daemon
          lifecycle commands; the only subprocess case here is `spawnSync("bun", ["run",
          "some-script.mjs"])`, which does not include `serve`, `start`, `--detach`, or another
          daemon lifecycle command word. This satisfies the annotation scanner but does not prove
          the behavior, so the spec still lacks behavioral coverage for this AC. Add or annotate a
          test with an unrelated subprocess whose argv overlaps daemon lifecycle terms and assert it
          is not reported.'
        created_at: 2026-05-08T16:00:35.611Z
      - _ulid: 01KR47GSK90SDW2KD3T6N9RE68
        author: "@claude"
        body: "Fixed: dropped the false annotation. The annotated block (`describe(\"does not regress
          legitimate non-daemon patterns\")`) does not exercise
          ac-unrelated-subprocesses-not-reported because its only subprocess case is
          `spawnSync(\"bun\", [\"run\", \"some-script.mjs\"])`, whose argv has no overlap with
          daemon lifecycle command words. Rebased the branch onto dev to pick up the merged sibling
          task (@task-add-guardrail-classification-regressions), which provides proper behavioral
          coverage in its own `describe(\"daemon test guardrail precision\") > describe(\"non-kspec
          subprocesses are not reported as daemon lifecycle violations\")` block via two cases:
          `spawn(\"echo\", [\"serve\", \"start\", \"--detach\"])` and `spawnSync(\"git\", [\"log\",
          \"serve\", \"start\", \"--detach\"])`. Both match the AC's required shape (non-kspec
          executable + argv tokens overlap daemon lifecycle commands) and are wrapped in
          `expectClassifierGap()` as failing-before-fix regressions for the dependent rule fix.
          kspec validate is clean for @daemon-test-guardrail-precision after the change."
        created_at: 2026-05-08T16:42:48.809Z
