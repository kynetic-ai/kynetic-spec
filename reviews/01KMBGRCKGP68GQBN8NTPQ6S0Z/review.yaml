    entries:
      - _ulid: 01KMBH0SAB3KKAF34W5PMYDGZF
        author: "@claude"
        body: Tests labeled as 'dispatch integration' do not instantiate DispatchEngine or exercise the
          dispatch.ts terminal payload construction code path (lines 2690-2696). The
          runAndEmitTerminalEvent() helper builds the payload from scratch instead of going through
          the dispatch engine's spread-and-augment pattern. This means the actual production code
          change (adding turn_count to the terminal payload via invocationResult?.turnCount ?? 1)
          has no direct test coverage from the new test file. The tests verify that runInvocation()
          returns correct turnCount values and that the schema validates correctly, but they do not
          verify that the dispatch engine passes turnCount into the emitted event. Consider adding
          at least one test that instantiates DispatchEngine (or extends the existing
          agent-dispatch-engine.test.ts) to verify the terminal event payload includes turn_count
          from a real dispatch code path.
        created_at: 2026-03-22T19:40:43.723Z
