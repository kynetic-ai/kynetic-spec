          incremental cache work from the unmerged plan branch. commit
          8fda82f5accc0aa0563322520735f3c0eb1c4df7

          Author: Jacob Chapel <jacob.chapel@gmail.com>

          Date:   Wed Apr 8 03:40:55 2026 -0700

              fix(test): use .js extensions for dist/daemon imports in test suites
              The daemon build uses esbuild which only produces .js files (no .d.ts).
              Value imports using .ts extensions fail with ERR_MODULE_NOT_FOUND because
              Node's ESM resolver cannot find .ts files in dist/daemon/. Changed all
              dist/daemon/ imports in daemon-read-path.test.ts and
              daemon-triage-write-through.test.ts to use .js extensions.
