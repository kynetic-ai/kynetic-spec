    entries:
      - _ulid: 01KMQ80VHN95032HRY556KT6RK
        author: "@claude"
        body: "When the sessions domain is ready, GET /api/sessions/:id resolves the requested ID only
          against the bounded in-memory index and returns not_found if it is absent there. That
          breaks ac-session-bounded-index's explicit requirement that sessions outside the retained
          window remain accessible on demand by ID. I reproduced this with
          ProjectEntityCache(maxIndexSize: 1): the cache kept only ['session-2'], resolveSessionId()
          on disk still found 'session-0', but the route-resolution logic here returned { ok: false,
          error: 'not_found' }. This needs a disk fallback when a ready cache misses the requested
          ID/prefix."
        created_at: 2026-03-27T08:54:22.005Z
      - _ulid: 01KMQ8YM2EC513PP305N6VWWAG
        author: "@claude"
        body: "Fixed: Added disk fallback when the bounded index misses the requested session ID. Now when
          the in-memory index doesn't contain the ID (because it's outside the retained N most
          recent), the route falls through to resolveSessionId(sessionsDir, params.id) which scans
          the full sessions directory on disk. Added test verifying fileToDomain with
          source='sessions' correctly maps non-ULID paths."
        created_at: 2026-03-27T09:10:37.390Z
    kind: blocker
    resolved_at: 2026-03-27T09:10:44.688Z
    resolved_by: "@claude"
  - _ulid: 01KMQ80YA6W64FFD5EY8JYP2E6
    anchor:
      type: code
      commit: 4893ca5183e4b193cc808f3f61fe778ada10e017
      line_end: 331
      line_start: 325
      path: src/daemon/entity-cache.ts
      side: head
    entries:
      - _ulid: 01KMQ80YA6NKCHGZ70RDTJDCEA
        author: "@claude"
        body: Session invalidation is still keyed to ULID-shaped directory names only, but session IDs in
          this codebase are plain strings (SessionMetadataSchema uses z.string(),
          createSessionWithBudget accepts any string, and existing tests create directories like
          'session-123'). SessionWatcher broadcasts the session root directory name verbatim; for a
          non-ULID path such as 'session-123/events.jsonl', fileToDomain() returns null, so the
          sessions cache never reloads after writes to that session. I verified this directly by
          evaluating fileToDomain('session-123/events.jsonl') -> null while a ULID-shaped path maps
          to ['sessions'].
        created_at: 2026-03-27T08:54:24.838Z
      - _ulid: 01KMQ8ZDE49NEWZ8T9HMJYV2RB
        author: "@claude"
        body: "Fixed: Added a 'source' parameter to fileToDomain() — when source is 'sessions' (detected by
          handleFileChange when kspecDir ends with .kspec-sessions), ALL paths map to the sessions
          domain regardless of ID shape. This handles arbitrary session IDs (plain strings like
          'session-123', not just ULIDs). ULID matching is preserved as a legacy path for backward
          compat when source is not specified. Added 3 new tests covering non-ULID session path
          mapping and invalidation."
        created_at: 2026-03-27T09:11:03.364Z
    kind: blocker
    resolved_at: 2026-03-27T09:11:27.284Z
    resolved_by: "@claude"
