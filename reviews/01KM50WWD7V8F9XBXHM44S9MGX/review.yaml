    entries:
      - _ulid: 01KM50Y1CQ2YZMDCKZPCMCZ7BD
        author: Jacob Chapel
        body: The new ac-live-update-source-agnostic Playwright case injects its event through
          window.__test_ws_instances, but this test never installs the addInitScript proxy that
          populates that array. In this file the surrounding live-update tests all set that hook up
          first; here injected will stay false and the test will fail as soon as the E2E suite
          actually runs. That means the claimed regression coverage for source-agnostic freshness is
          currently broken rather than proving the behavior.
        created_at: 2026-03-20T07:04:09.879Z
      - _ulid: 01KM51EBFTP3T2N1P4VD6CJ30R
        author: Jacob Chapel
        body: Fixed in commit f72a88e05. The source-agnostic Playwright case no longer depends on
          window.__test_ws_instances; it now writes real session fixture files under the daemon temp
          project so the update flows through the session watcher and shared query invalidation
          layer.
        created_at: 2026-03-20T07:13:04.505Z
    kind: blocker
