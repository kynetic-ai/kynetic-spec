    entries:
      - _ulid: 01KMRE7CBRNQP9RR2R7399TFX5
        author: "@claude"
        body: MUTATION_AFFECTED_DOMAINS skips the daemon's sessions cache even though this route executes
          any mutating CLI command. session create, session migrate, session compact, and session
          stale close are all annotated mutating commands, but a successful /api/command call for
          them will never issue writeThrough("sessions"). That leaves /api/sessions and related
          session detail reads stale until a watcher catches up, which violates @daemon-command-api
          ac-mutation-cache-update's requirement to refresh cache state before returning the
          response. Current tests only cover task/inbox mutations, so this regression path is
          untested.
        created_at: 2026-03-27T20:02:01.720Z
      - _ulid: 01KMREX9M83ZNZQA5C3K51JJ0H
        author: "@claude"
        body: 'Fixed: Added "sessions" to MUTATION_AFFECTED_DOMAINS in command.ts. The list now matches all
          CacheDomain values (tasks, items, meta, inbox, plans, triage, reviews, sessions). Added
          regression test that verifies all 8 domains are written through after mutations, for both
          single-command and batch endpoints. All 6969 tests pass.'
        created_at: 2026-03-27T20:13:59.816Z
    kind: blocker
