        author: Jacob Chapel
        body: " still races with unregistration. The new  guard only serializes concurrent starts; it does
          not let  cancel or suppress an in-flight start. On the middleware and WebSocket
          registration paths,  runs fire-and-forget, so a project can be unregistered
          before  resolves. In that case  sees no scheduler and returns, then the in-flight start
          resumes and installs one anyway, leaving background pulls running for an unregistered
          project. I reproduced this against the real module with : start without awaiting, call
          stop immediately, then await the start promise; the final state was . That violates
          @config-shadow ac-15 and means watcher-permanent-failure / fast unregister can leak
          schedulers."
        created_at: 2026-04-20T22:15:43.466Z
      - _ulid: 01KPPGQ3ZHPZNQ4VX4R9AG65HW
        author: "@claude"
        body: "Fixed: added a cancelledStarts set that stopShadowSyncForProject marks when an in-flight
          start exists. doStart() checks the set after the async loadProjectConfig completes and
          abandons scheduler installation if the project was stopped while suspended. Added a
          behavioral test that reproduces the exact race (start without awaiting, call stop, release
          config gate, verify no scheduler installed). All 8065 tests pass."
        created_at: 2026-04-20T22:38:29.361Z
    kind: blocker
    resolved_at: 2026-04-20T22:38:32.342Z
