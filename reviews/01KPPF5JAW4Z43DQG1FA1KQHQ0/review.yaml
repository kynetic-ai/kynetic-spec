  - _ulid: 01KPPFESDNW94QQV7XYGH9QHCE
    anchor:
      type: code
      commit: 929a05c9360fb46abec33275dccda13e70791dd1
      line_end: 124
      line_start: 67
      path: src/daemon/shadow-sync-manager.ts
      side: head
    entries:
      - _ulid: 01KPPFESDPJN9YPKQK1ERZTMJ9
        author: Jacob Chapel
        body: startShadowSyncForProject still races with unregistration. The inFlightStarts map prevents
          duplicate starts, but stopShadowSyncForProject has no way to cancel or suppress a start
          that is already awaiting loadProjectConfig. Middleware and WebSocket registration both
          launch onProjectRegistered asynchronously, so a project can be unregistered before that
          await resolves. In that sequence, stopShadowSyncForProject finds no scheduler and returns,
          then the in-flight start resumes and installs one for a project that has already been
          removed. I reproduced this against the real module with npx tsx by starting without
          awaiting, calling stop immediately, then awaiting the start promise; the final state still
          had a scheduler present after stop. That violates @config-shadow ac-15 for fast unregister
          and watcher-permanent-failure paths.
        created_at: 2026-04-20T22:16:27.830Z
      - _ulid: 01KPPGQ9Q6KN5QPQA273ENXTED
        author: "@claude"
        body: "Fixed: same approach as the sibling thread — cancelledStarts set prevents the in-flight start
          from installing a scheduler after stop has already run. The cancellation is checked right
          after the async config load returns, before any scheduler construction. The
          cancelledStarts entry is cleaned up in the finally block so it does not leak across
          subsequent start/stop cycles."
        created_at: 2026-04-20T22:38:35.238Z
    kind: blocker
    resolved_at: 2026-04-20T22:38:38.234Z
    resolved_by: "@claude"
