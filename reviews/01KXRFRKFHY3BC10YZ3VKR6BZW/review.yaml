        author: pr-reviewer
        body: MUST-FIX — This invents a reviewer-snapshot retention/debugging-hold condition that has no
          supported configuration, schema, status, or command surface. The dispatch runtime calls
          cleanupReviewerDispatchWorkspace immediately after each pending-review invocation; cleanup
          can be prevented by the actual artifact-protection/ownership state, but operators cannot
          apply or inspect the hold described here. Readers are therefore promised a retention
          mechanism that does not exist. Describe the real cleanup/protection condition instead.
        created_at: 2026-07-17T17:11:28.963Z
    kind: blocker
