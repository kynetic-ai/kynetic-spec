      - _ulid: 01KXRGZPRA8BX2EHR3VY72JE4K
        author: pr-reviewer
        body: MUST-FIX — Configured auto publication is environment-based selection, not an automatic
          publication path. resolvePublicationMode maps auto to pull_request only when gh and a
          GitHub remote are available, otherwise to manual_merge; the durable workspace publication
          schema stores only pull_request or manual_merge. This wording tells operators that kspec
          can automatically publish/merge through a third path that does not exist. Rewrite this to
          describe manual merge, pull request, and auto selection accurately.
        created_at: 2026-07-17T17:11:32.362Z
