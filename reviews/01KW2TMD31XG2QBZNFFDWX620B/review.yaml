      - _ulid: 01KW2TVWW7GXXQ1RWXMA883KTH
        author: Jacob Chapel
        body: 'MUST-FIX: The target contract accepts both item_ref and item_ulid, but resolveCoverageTarget
          resolves only target.item_ref when it is present and ignores a conflicting item_ulid.
          Runtime confirmation: CoverageResolutionRequestSchema parses { item_ref: "@wrong-target",
          item_ulid: "01ARZ3NDEKTSV4RRFFQ69G5FAV", ac_id: "ac-1" }. That makes the shared mutation
          target ambiguous and can validate/apply an action against the ref item while the caller
          supplied a different canonical item id. The shared target validation should reject
          conflicting identifiers or enforce exactly one target identifier before action handlers
          use it.'
        created_at: 2026-06-26T20:45:13.991Z
    kind: blocker
