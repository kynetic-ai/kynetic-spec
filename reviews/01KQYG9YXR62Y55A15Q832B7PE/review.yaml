    entries:
      - _ulid: 01KQYGG9XC9MESHZP5DQQ834PS
        author: Jacob Chapel
        body: "MUST-FIX: IPv6 fallback currently treats every 127.0.0.1 bind failure as 'IPv4 loopback
          unavailable'.  collapses EADDRINUSE, EAFNOSUPPORT, EADDRNOTAVAIL, and other errors to ,
          and  then falls back to ::1 for all of them. That means if the requested port is already
          occupied on 127.0.0.1 by another service,  can silently start a daemon on the same port
          over IPv6 instead of reporting the port collision. The spec's ac-default-ipv6-fallback
          only permits fallback when IPv4 loopback itself is unavailable; port-in-use is a different
          startup failure. Evidence: tests/cli-serve.test.ts:409-417 pre-binds 127.0.0.1:PORT and
          expects fallback, proving the submitted behavior is using EADDRINUSE as the fallback
          signal rather than an IPv4-loopback-unavailable condition."
        created_at: 2026-05-06T11:24:23.340Z
      - _ulid: 01KQYJ5KJP0KS3PM0DMQ319RWJ
        author: "@claude"
        body: "Fixed: probeBindAvailable now returns ProbeBindResult that classifies the underlying errno:
          EADDRNOTAVAIL/EAFNOSUPPORT -> address_unavailable, EADDRINUSE -> port_in_use, otherwise
          unknown. selectStartupBindHost falls back to ::1 only when reason ===
          'address_unavailable'; port_in_use and unknown errors return the original IPv4 bind host
          so app.listen() surfaces the real error. New unit tests in tests/daemon-endpoint.test.ts
          assert (a) the probe reports reason='port_in_use' on EADDRINUSE and (b)
          selectStartupBindHost does NOT fall back on either port_in_use or unknown probe errors.
          The misleading e2e test in tests/cli-serve.test.ts (which pre-bound 127.0.0.1:PORT and
          expected fallback) is replaced with a regression guard that pre-binds 127.0.0.1:PORT, runs
          serve start --detach, and asserts nothing ever comes up on [::1]:PORT and any persisted
          metadata advertises 127.0.0.1. End-to-end coverage of true address-unavailable cannot be
          reliably simulated on a CI runner without root; the unit tests exhaustively cover that
          path."
        created_at: 2026-05-06T11:53:29.942Z
    kind: blocker
    resolved_at: 2026-05-06T11:53:38.438Z
    resolved_by: "@claude"
