    entries:
      - _ulid: 01KR7FERRFB4R9FA3BPQ838RAR
        author: Jacob Chapel
        body: "MUST-FIX: the direct try/finally cleanup ownership check uses the enclosing TryStatement as
          the binding site, so it rejects safe finalizer cleanup where the daemon pid is captured
          immediately after the detached start and before any later assertion/await/daemon
          observation. Manual probe:  exits 1 with cleanupClosureUnbound on . That violates
          @daemon-test-guardrail-precision ac-detached-cleanup-bound-before-observation: by the time
          the first observation can fail, the finalizer target is already bound to the just-started
          daemon, matching the allowed  ordering. The finalizer analysis needs to distinguish
          assignments before the first in-try observation from assignments after an observation,
          rather than requiring the capture to predate the  boundary."
        created_at: 2026-05-09T22:59:14.319Z
      - _ulid: 01KR7FG0H4669GYSPFM2522WAQ
        author: Jacob Chapel
        body: 'Clarifying the probe mangled by shell quoting in the initial comment. Manual unsafe probe
          rejected as expected: let pid; try { runKspec("serve start --detach --port 3456");
          expect(true).toBe(true); pid = readPidFromFile(); } finally { process.kill(pid as number,
          "SIGTERM"); } exits 1. Manual safe-ordering probe is currently also rejected: let pid; try
          { runKspec("serve start --detach --port 3456"); pid = readPidFromFile();
          expect(true).toBe(true); } finally { if (pid !== undefined) process.kill(pid, "SIGTERM");
          } exits 1 with cleanupClosureUnbound on pid. The second shape binds the pid before the
          first in-try observation can fail, so it should be accepted for the same reason
          runKspec(); const pid = readPidFromFile(); onTestFinished(...) is accepted. The fix should
          keep rejecting assignments after an observation while allowing assignments before the
          first observation in the protected try body.'
        created_at: 2026-05-09T22:59:55.043Z
      - _ulid: 01KR7J0VWJBQEDX94XB21JK2V0
        author: "@claude"
        body: >-
          Fixed in fix cycle 8. Three changes in tools/eslint-rules/no-leaky-test-daemon.js:


          1. findDirectCleanupRegistrationUseNode now takes the detached start node. When the start
          is inside the try body, the implicit registration site is the FIRST observation
          (await/expect/daemon URL fetch/WebSocket) in the try body after the start — not the
          TryStatement itself. If no in-try observation exists, the call site itself is the
          deadline. This matches the registered-callback semantic where ownership is checked at the
          onTestFinished(...) registration call.


          2. walkStatementsForBinding and walkStatementsForConcreteBinding descend into
          TryStatement.block and TryStatement.finalizer on the unconditional execution path so
          cross-scope shapes (let pid; declared outer, pid = ... assigned inside the try body)
          resolve to the in-try assignment as the concrete binding. Without this, the outer-scope
          walker only saw the let-with-no-init.


          3. subtreeContainsDaemonCleanupCall now carries an inFinalizerContext flag (set by
          isInTryWithFinallyCleanup and the TryStatement.finalizer recursion). When set, the walker
          descends through defensive-guard conditionals so 'if (pid !== undefined) process.kill(pid,
          ...)' inside a finalizer is recognised. Ownership analysis on each daemon-cleanup
          CallExpression still gates whether the call counts as cleanup, so the guard is hygiene
          rather than load-bearing.


          Manual probe: cycle-8 unsafe shape (let pid; try { runKspec(detach); expect; pid =
          readPidFromFile(); } finally { process.kill(pid as number, SIGTERM); }) exits 1 with
          cleanupClosureUnbound on pid. Cycle-8 safe shape (assignment BEFORE expect inside try,
          with the if guard) exits 0. Same safe shape without the guard also exits 0.


          Five regression tests added in tests/lint-daemon-test-guardrails.test.ts under
          cleanup-bound-before-observation describe: cycle-8 safe with guard (allowed), cycle-8 safe
          no-guard (allowed), no in-try observation (allowed), await-shaped unsafe variant
          (rejected), conditional-assignment unsafe variant (rejected).


          Validation: focused lint suites 255 -> 260 passing tests; full npm test 2419 suites / 9016
          passing (5 pre-existing skips); kspec validate --refs and --completeness both pass with
          --warnings-ok.
        created_at: 2026-05-09T23:44:04.490Z
