    entries:
      - _ulid: 01KNBPKBWGHYC767GKCYN88G7B
        author: Jacob Chapel
        body: New-session attachment only checks session.yaml once plus a single 200ms retry after addDir. I
          reproduced this by starting SessionWatcher, creating the session directory, waiting 500ms,
          then writing session.yaml/events.jsonl and appending another event; onSessionChange stayed
          empty (changes=[]), so sessions whose metadata lands slightly after directory creation are
          never watched. That violates @daemon-file-monitoring ac-7 and
          ac-new-session-conditional-watch because the daemon permanently misses later metadata
          writes for those active sessions.
        created_at: 2026-04-04T07:33:57.264Z
      - _ulid: 01KNBPWNZ5VQJDCZ2EZX16CYZ4
        author: Jacob Chapel
        body: "Fixed in 6dc8783a7: new-session attachment now retries for a bounded discovery window after
          addDir when session.yaml is not yet present, instead of giving up after one 200ms retry.
          Added a behavioral regression test that creates the session directory, waits 500ms, then
          writes session.yaml/events.jsonl and verifies onSessionChange fires for that session."
        created_at: 2026-04-04T07:39:02.501Z
    kind: blocker
    resolved_at: 2026-04-04T07:39:15.217Z
    resolved_by: Jacob Chapel
