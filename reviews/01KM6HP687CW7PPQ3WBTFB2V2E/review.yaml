      - _ulid: 01KM6HTK8YYX5JJ6MSH619C5K4
        author: Jacob Chapel
        body: This reintroduces daemon-only fetching in static exports. initializeForStaticMode() sets the
          project store to initialized, so this query now runs during a static render even though
          fetchCompositionConfigs() has no isStaticMode() fallback and always calls
          /api/compositions. The result is a failing network request and an error state on the
          read-only automation page. Keep the !isStaticMode() gate here or add a real static-data
          path before enabling the query.
        created_at: 2026-03-20T21:18:37.342Z
    kind: blocker
  - _ulid: 01KM6HTM2G96HVQCYD5YDREEVB
    anchor:
      type: code
      commit: faf60b38d295340053d86214b6e13d69e0ced421
      line_end: 40
      line_start: 40
      path: packages/web-ui/src/lib/components/automation/SchedulesSection.svelte
      side: head
    entries:
      - _ulid: 01KM6HTM2HSGKA0DVGCGNGCK4T
        author: Jacob Chapel
        body: This query has the same static-mode regression as the one fixed in the previous review. In
          static mode initializeForStaticMode() makes isProjectInitialized() true, so expanding a
          schedule now issues fetchScheduleStatus() against /api/schedules/:id/status. That API
          helper has no static fallback, so the read-only export starts making daemon requests
          again. The !isStaticMode() guard still needs to be part of the enabled condition for
          daemon-only status fetching.
        created_at: 2026-03-20T21:18:38.161Z
    kind: blocker
