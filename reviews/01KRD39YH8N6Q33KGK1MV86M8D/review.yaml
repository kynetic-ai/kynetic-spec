      side: head
    entries:
      - _ulid: 01KRD441X63BSARAJ36SC17N5G
        author: Jacob Chapel
        body: "MUST-FIX: Unapproved imported cleanup helpers are still trusted by name.
          `isTrustedHelperByOrigin` checks approved import paths, checks local function
          declarations, then falls through to `true`. A visible import from an unapproved module is
          neither approved nor locally inspectable, but it is currently treated as a free helper. I
          verified this with an oxlint probe containing `import { killPid } from './fake-cleanup'`
          and `onTestFinished(() => killPid(pid))`; the rule returned 0 errors. That violates
          `@daemon-test-guardrail-precision ac-cleanup-helper-origin-is-trusted` because a helper
          that is not one of the approved cleanup primitives can still satisfy cleanup by name
          alone."
        created_at: 2026-05-12T03:36:35.494Z
      - _ulid: 01KRD5TNZD29C2771GMRHGBJZ4
        author: "@claude"
        body: "Fixed: Added isHelperNameImported as the unapproved-import detector. isTrustedHelperByOrigin
          now evaluates four paths: (1) approved-path import → trust, (2) any-other-path import →
          reject, (3) local definition → require terminating primitive in body, (4) free identifier
          → conservative trust. The probe import { killPid } from './fake-cleanup';
          onTestFinished(() => killPid(pid)) now reports missingCleanup. Also covered with new
          regression tests for named-import (killPid and stopDaemon names) and default-import shapes
          against an unapproved source, plus the approved-import companion to prove the
          implementation cannot satisfy the rejected case by banning the name outright. Verified
          ad-hoc with the reviewer's exact probe via npx oxlint — produces the missingCleanup error
          at the runKspec call."
        created_at: 2026-05-12T04:06:25.517Z
    kind: blocker
    resolved_at: 2026-05-12T04:06:47.822Z
    resolved_by: "@claude"
  - _ulid: 01KRD445ARG2EN4FN1KYXK80PM
    anchor:
      type: code
      commit: 8450ce07dd2c02ef2786561e0c03f524655893ec
      line_end: 592
      line_start: 589
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KRD445ARRXTXVGHH4S9JZEE1
        author: Jacob Chapel
        body: "MUST-FIX: The child-handle branch accepts any non-`process` `.kill()` call with no signal,
          without proving the receiver is a ChildProcess or otherwise terminates the daemon. Because
          `isTerminatingKillSignalArg(undefined, null)` returns true, a local no-op object such as
          `const fake = { kill() { console.log('noop'); } }; onTestFinished(() => fake.kill())`
          satisfies cleanup. I verified that fixture with oxlint and it produced 0 errors. This
          reintroduces callee-shape credit instead of terminating cleanup and violates
          `@daemon-test-guardrail-precision ac-cleanup-operation-terminates-daemon` /
          `ac-cleanup-probes-do-not-count`."
        created_at: 2026-05-12T03:36:39.001Z
      - _ulid: 01KRD5TVWTMWCPBMS35HJE4EXK
        author: "@claude"
        body: "Fixed: Added isChildHandleReceiverTrusted that mirrors the helper-body inspection used for
          trusted helper names. The <expr>.kill(<signal>?) branches in both
          isDaemonCleanupCallExpression and isTerminatingPrimitiveCall now invoke this receiver
          check after the signal check passes. The check rejects when the receiver Identifier
          resolves to a local ObjectExpression literal with a literal kill property whose function
          body contains no terminating primitive call. The probe const fake = { kill() {
          console.log('noop'); } }; onTestFinished(() => fake.kill()) now reports missingCleanup.
          Receivers that are non-Identifier (agent.process.kill(), result.child.kill()), free
          identifiers, parameter-bound, alias-bound, or initialized from a CallExpression (const
          child = spawn(...)) all fall through unchanged — the receiver check fires only on
          directly-resolved literal-with-no-op-kill shapes, the strict mirror of how the local-no-op
          helper rejection works. Added regression tests for the shorthand-method, longhand-arrow,
          and logger-only kill shapes plus an accepted companion (literal whose kill body invokes
          process.kill SIGTERM) and the spawn-result child handle."
        created_at: 2026-05-12T04:06:31.578Z
    kind: blocker
    resolved_at: 2026-05-12T04:06:53.977Z
    resolved_by: "@claude"
