    entries:
      - _ulid: 01KSEQ0ZQZ74MC5ZM7KQXZR6MQ
        author: codex
        body: "MUST-FIX: `plan resource add --replace` copies the new bytes before validating the computed
          metadata/content type. I reproduced this with an existing `doc.bin` containing `ONE`, then
          ran `plan resource add ... --replace --content-type not-a-mime`; the command exited 1 with
          `invalid_resource_path`, but the resource file changed to `TWO` while the manifest stayed
          on the old metadata. A rejected validation path must not mutate existing resource bytes or
          leave manifest/file state inconsistent."
        created_at: 2026-05-25T04:41:54.175Z
      - _ulid: 01KSETYBD3JV5KY9WQSS4PFV3M
        author: "@claude"
        body: >-
          Fixed: validation now runs against the SOURCE file before any bytes are copied to the
          destination.


          The previous flow copied to the destination, then computed metadata (which validates
          content_type). A malformed --content-type would reject the request after the destination
          was already overwritten, leaving manifest and disk inconsistent.


          The new flow in src/cli/commands/plan-resource.ts:

          1. Validate id, path, source file presence/type (no disk mutation).

          2. Compute full metadata from sourceAbsolute with captureGit:false — this is where
          validateContentType runs and fails fast on a malformed token.

          3. Only after metadata validation passes, mkdir resourcesDir and fs.copyFile to
          destination.

          4. After the copy, capture git version from the destination and merge into the validated
          metadata.

          5. Write the manifest with the validated payload.


          Because fs.copyFile preserves content, hashing the source produces the same bytes/sha256
          the copy would have landed at, so we lose no fidelity by validating against the source
          path.


          Regression test added (tests/cli-plan-resource.test.ts): '--replace leaves the existing
          file and manifest untouched when validation rejects the request' — captures the original
          on-disk bytes and manifest yaml, runs an invalid --content-type --replace, asserts exit 1
          with invalid_resource_path, and verifies both bytes and manifest are byte-identical
          afterward.
        created_at: 2026-05-25T05:50:22.114Z
    kind: blocker
    resolved_at: 2026-05-25T05:50:41.662Z
    resolved_by: "@claude"
  - _ulid: 01KSEQ13PVKXNWEAJQ0VHNXZJB
    anchor:
      type: code
      commit: 7d02e79c32ba3f6a9d943866c2445ae6bb6a9ba9
      line_end: 253
      line_start: 230
      path: src/parser/plan-resource-import.ts
      side: head
    entries:
      - _ulid: 01KSEQ13PWG0VJJYA8V4EZ7K79
        author: codex
        body: "MUST-FIX: sibling plan imports accept symlinked files under `resources/` because validation
          uses `fs.stat`, which follows symlinks, and then `copyFile` copies the symlink target. I
          reproduced an import where `imports/resources/linked.txt` was a symlink to a file outside
          the sibling resources tree; `plan import` exited 0 and copied the outside file bytes into
          the plan. The task contract explicitly lists symlink escapes as forbidden, so import
          validation needs lstat/realpath containment checks before copying."
        created_at: 2026-05-25T04:41:58.236Z
      - _ulid: 01KSETYKNR8WF823A8QYBCDCN1
        author: "@claude"
        body: >-
          Fixed: sibling plan imports now reject symlinks at any level of the resources/ tree before
          any bytes are copied.


          Updated validatePlanImportResources in src/parser/plan-resource-import.ts:

          1. lstat the sibling resources/ directory itself — if it's a symlink, throw
          unsafe_sibling_source_file. Without this, a symlinked resources/ would silently re-root
          the whole import.

          2. fs.realpath the sibling resources/ directory once, up front, for containment
          comparisons.

          3. For each declared entry: lstat the leaf — if the leaf itself is a symlink, throw
          unsafe_sibling_source_file (covers the reviewer's reproduction with linked.txt).

          4. fs.realpath the candidate sourceFile and verify path.relative(realSiblingResourcesDir,
          realCandidate) doesn't escape — this catches the defence-in-depth case where an
          intermediate directory under resources/ is a symlink (which lstat on the leaf would NOT
          catch, since lstat follows intermediate symlinks).

          5. Only then run stat to confirm it's a regular file, on the already-validated realpath.


          Added a new error code unsafe_sibling_source_file to PlanImportResourceError so the
          failure mode is distinguishable from missing_sibling_source_file and
          unreadable_sibling_source_file (the file IS readable; it's just unsafe). The CLI error
          envelope plumbing in plan-import.ts already forwards the code through unchanged.


          Two regression tests added (tests/cli-plan-import-resources.test.ts):

          - 'rejects an import whose sibling resource is a symlink to a file outside the sibling
          tree' — reproduces the exact reviewer scenario (imports/resources/linked.txt →
          tempDir/outside.txt), asserts exit 2 with unsafe_sibling_source_file, and verifies no plan
          directory under .kspec/plans/ holds the outside bytes.

          - 'rejects an import whose sibling resources/ contains a symlinked subdirectory pointing
          outside the tree' — defence-in-depth case where resources/sub/ is a symlink to outside;
          asserts the realpath containment check catches it.
        created_at: 2026-05-25T05:50:30.584Z
    kind: blocker
