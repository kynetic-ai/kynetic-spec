    entries:
      - _ulid: 01KVD4JB46ZV7CFBCKQYTP9AB4
        author: Jacob Chapel
        body: 'MUST-FIX: Task creation events are still limited to the `task add` command path.
          `buildTaskCreatedEvent` returns null unless `commitOpts.operation === "task-add"`, but
          successful task creation also happens through `kspec derive` (`operation: "derive"`),
          inbox promotion, plan task derivation, and triage promotion. Those paths either pass a
          non-`task-add` operation or no commit options, so `recordTaskCreatedEvent` records no
          `tasks:updates` `task_updated` event for them. This violates @mutation-event-coverage ac-1
          because task creation through those interfaces succeeds without a typed task-domain event;
          it also leaves subscribers relying on broad cache/file fallback instead of the entity
          event. Evidence: src/cli/commands/derive.ts:336 passes operation `derive`;
          src/cli/commands/inbox.ts:276, src/cli/commands/plan.ts:1946, and src/triage/actions.ts:80
          call `createTask` without create-event commit metadata.'
        created_at: 2026-06-18T10:31:29.158Z
      - _ulid: 01KVD5QT5X5RBBAH6TEGB82M7K
        author: Jacob Chapel
        body: "Fixed: task creation event recording now skips only explicit skipCommit calls instead of
          requiring operation=task-add, so derive and createTask callers without commit metadata can
          record task_updated created events. Added behavioral coverage for derive via /api/command
          and for metadata-free createTask calls through the mutation event collector."
        created_at: 2026-06-18T10:51:56.989Z
    kind: blocker
    resolved_at: 2026-06-18T10:52:05.639Z
    resolved_by: Jacob Chapel
