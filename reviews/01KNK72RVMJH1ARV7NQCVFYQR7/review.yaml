        author: Jacob Chapel
        body: " no longer reloads entity domains after a successful shadow pull.  requires pulled data to
          invalidate and reload the entity cache, but this branch changed the callback
          from  to  only. That updates shadow status metadata while leaving tasks/items/reviews/etc.
          at their old snapshots, so daemon read routes can continue serving stale data after remote
          shadow updates until some unrelated local invalidation happens."
        created_at: 2026-04-07T05:47:12.153Z
      - _ulid: 01KNK8GHBTGNCGHNABJ1RS2E38
        author: Jacob Chapel
        body: "Fixed in 6391877ed: restored the daemon shadow-sync onPull callback to reload the full entity
          cache after successful pulls instead of refreshing only cached shadow metadata. Added a
          regression test in tests/daemon-read-path.test.ts that asserts the server callback calls
          cache.loadAll() for the startup project. Verification: NODE_ENV= npm test -- --fresh
          daemon-read-path daemon-entity-cache (36/36 suites, 161/161 tests); kspec validate exits 6
          with only pre-existing repository warnings; the full suite hit an unrelated
          dispatch-target-sync STACK_TRACE_ERROR, and NODE_ENV= npm test -- --fresh
          dispatch-target-sync passed immediately in isolation (2/2 suites, 41/41 tests)."
