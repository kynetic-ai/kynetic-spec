        body: "MUST-FIX: this snapshot still does not unblock the full CI gate. I ran npm test against
          4eed9f6cc2f321ae17abc46f1a25766b8f489b78 and the suite completed with 3 failing assertions
          in tests/agent-dispatch-engine.test.ts (around lines 5659, 5721, and 5878). Because the
          task goal is to clear the full gate, a snapshot that still leaves npm test red cannot
          advance even though the review-detail E2Es now pass."
        created_at: 2026-04-01T06:14:22.786Z
      - _ulid: 01KN3Y6MHMZ4766W2KXT9N8SF2
        author: Jacob Chapel
        body: "Addressed. The full-gate failure was caused by two issues: (1) three post-invocation dispatch
          assertions were timing out under full-suite load before cleanup finished, which left
          cascading suite failures; those tests now use bounded condition waits and always stop the
          engine in finally blocks, and (2) the daemon accepted stale WEB_UI_DIR directories that
          existed without index.html, so review-detail E2E could boot against a deleted worktree
          build path. The daemon now requires index.html before selecting explicit/env/bundled UI
          paths, with coverage in daemon-web-ui-bundle tests. Verification on this branch: npm test
          passed (2082/2082 suites, 7522/7527 tests, 5 skipped) and review-detail Playwright
          coverage passed (29/29)."
        created_at: 2026-04-01T07:12:53.300Z
