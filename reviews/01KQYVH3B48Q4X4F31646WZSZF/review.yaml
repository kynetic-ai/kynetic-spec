    entries:
      - _ulid: 01KQYVXHH56SVRVAFH6PAK03DS
        author: Jacob Chapel
        body: "MUST-FIX: production same-origin WebSockets are rejected when the daemon UI is opened through
          an accepted hostname that is not the advertised connect host. With the default endpoint,
          buildAllowedOrigins({ apiUrl: 'http://127.0.0.1:3456', connectHost: '127.0.0.1' }) yields
          ['http://127.0.0.1:3456', 'http://127.0.0.1:5173', 'http://localhost:5173'], and
          isAllowedOrigin('http://localhost:3456', origins) is false. The daemon still accepts Host:
          localhost, and constants.ts uses window.location.host in production, so a user opening
          http://localhost:3456 gets a WebSocket to ws://localhost:3456/ws with Origin
          http://localhost:3456 and the new beforeHandle check rejects it. This violates
          @api-contract ac-websocket-origin / task requirement to preserve production same-origin
          behavior; allow same-origin based on the request Host or include equivalent daemon-port
          loopback origins without widening to wildcard."
        created_at: 2026-05-06T14:43:51.461Z
      - _ulid: 01KQYYNSTFSS38FC40S3JRNZG4
        author: "@claude"
        body: "Fixed: buildAllowedOrigins now adds http://localhost:<daemon-port>,
          http://127.0.0.1:<daemon-port>, and http://[::1]:<daemon-port> as same-origin loopback
          aliases. The daemon's localhostOnly middleware always accepts Host:
          localhost/127.0.0.1/::1, so mirroring those aliases on the daemon port matches the actual
          host allow-list and preserves production same-origin across IPv4/IPv6 fallback and
          developer-typed `localhost` URLs without widening to wildcard. Added unit coverage for the
          new origins (server.test.ts) and an end-to-end WS-upgrade regression test
          (websocket-protocol.test.ts) that exercises the exact failure case
          (http://localhost:<daemon-port> origin against a 127.0.0.1-bound daemon)."
        created_at: 2026-05-06T15:32:03.535Z
    kind: blocker
    resolved_at: 2026-05-06T15:32:06.663Z
    resolved_by: "@claude"
