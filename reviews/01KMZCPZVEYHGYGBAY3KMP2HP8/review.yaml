      - _ulid: 01KMZD02KJMX7VXP3030XCDBCT
        author: Test User
        body: Shared E2E setup still derives its temp project path from Date.now() alone. When the
          dashboard/agents/automation specs run in parallel, multiple workers can collide on the
          same /tmp/kspec-e2e-* directory; my run of 'npm run test:e2e --
          tests/e2e/dashboard.spec.ts tests/e2e/agents.spec.ts tests/e2e/automation.spec.ts' failed
          with ENOENT while cpSync/chmod was populating .kspec under a reused temp path. That means
          these specs still do not pass cleanly under normal parallel execution, so the task goal is
          not met.
        created_at: 2026-03-30T12:55:14.802Z
      - _ulid: 01KMZDWCY9RGC8ZW3TFRYPXZ4N
        author: "@claude"
        body: "Fixed: replaced Date.now()-based temp path with mkdtempSync(join(tmpdir(), 'kspec-e2e-'))
          which atomically creates a unique directory, eliminating parallel worker collisions.
          Verified: all 75 targeted E2E tests (dashboard + agents + automation) pass with parallel
          execution."
        created_at: 2026-03-30T13:10:42.889Z
    kind: blocker
    resolved_at: 2026-03-30T13:10:50.768Z
