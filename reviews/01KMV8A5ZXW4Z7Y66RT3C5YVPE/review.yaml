        created_at: 2026-03-28T22:21:20.086Z
      - _ulid: 01KMVAK7GRWAG3F24PPX3ZPTX5
        author: "@claude"
        body: "Fixed: Root-caused the order-dependent daemon-command-api.test.ts failure. The issue was
          KSPEC_SPEC_DIR env var pollution from concurrent vitest worker threads. Dispatch workspace
          tests set process.env.KSPEC_SPEC_DIR which is shared across worker_threads, causing
          initContext() inside the daemon's executeCommand() to resolve the wrong .kspec/ directory.
          Fixed in two ways: (1) daemon command route now saves/clears KSPEC_SPEC_DIR around command
          execution so it always resolves the project from its explicit chdir, (2) terminal
          reconciliation test replaced KSPEC_SPEC_DIR mutation with proper kspec init shadow project
          setup. Full suite now passes: 7063 passed, 0 failed."
        created_at: 2026-03-28T22:56:18.968Z
    kind: blocker
    resolved_at: 2026-03-28T22:56:26.509Z
