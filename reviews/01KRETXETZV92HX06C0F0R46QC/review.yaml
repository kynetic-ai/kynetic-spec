threads:
  - _ulid: 01KRETZ60H3P9P6GHQCHBD2QDS
    anchor:
      type: structured
      ref: "@task-make-artifact-reconciliation-lease-aware"
      section: tasks
    entries:
      - _ulid: 01KRETZ60JSQPH56C3Y6K3E2HS
        author: Jacob Chapel
        body: "MUST-FIX: The cleanup contract does not say what happens when the workspace registry cannot
          be read or is partially corrupt. The artifact-reconciliation task says to load the
          registry and build protected sets, but it does not require cleanup to fail closed if that
          load fails; the current implementation has a catch path that falls back to branch deletion
          when registry parsing/loading fails. Because the lease is registry-backed, an unreadable
          registry would erase the only durable protection signal and could allow cleanup to delete
          branches or root directories for work that is actually in provisioning/bootstrap. Add an
          explicit contract/task requirement that registry-unavailable/corrupt cleanup preserves
          dispatch artifacts or otherwise blocks destructive cleanup with diagnostics until the
          registry state is recoverable."
        created_at: 2026-05-12T19:35:07.538Z
    kind: blocker
  - _ulid: 01KRETZQ7JG53HT4RCSXYEP052
    anchor:
      type: structured
      ref: "@task-implement-dispatch-workspace-provisioning-lease-helpers"
      section: tasks
    entries:
      - _ulid: 01KRETZQ7JH6T24CNBSDDDHNCB
        author: Jacob Chapel
        body: "MUST-FIX: The plan records an owner tuple, but it never defines the write-side ownership
          rules for non-expired leases owned by a different daemon/spawn. The helper task only says
          repeated start/renew calls for the same owner are idempotent; an implementation could
          still satisfy the written ACs while allowing a second daemon or retry path to overwrite,
          renew, clear, or mark abandoned another owner’s non-expired lease. That breaks the product
          contract the owner metadata implies and can reintroduce cleanup/provisioning races through
          stale or stolen ownership. Define compare-and-swap semantics: start/renew/clear/finalize
          should either require the current owner tuple to match or follow an explicit
          abandoned/recovery path, and different-owner non-expired leases should be treated as a
          conflict/protected condition rather than silently replaced."
        created_at: 2026-05-12T19:35:25.170Z
    kind: blocker
  - _ulid: 01KREV06G8RC7W47EZSRCD3Y93
    anchor:
      type: structured
      section: dependencies
    entries:
      - _ulid: 01KREV06G8SKAQ0E5343N1AMC5
        author: Jacob Chapel
        body: "SHOULD-FIX: The task ordering enables lease producers before the cleanup consumer exists.
          `task-mark-workspace-provisioning-before-mutation` and
          `task-record-bootstrap-in-progress-terminal-states` can land before
          `task-make-artifact-reconciliation-lease-aware`, because the latter depends on both
          producers. In the normal per-task merge lifecycle, that partial state can write durable
          leases/bootstrap in_progress states while artifact reconciliation still ignores them, so
          the cleanup/provisioning race remains possible after tasks that appear to have implemented
          the protective signal. Consider moving lease-aware cleanup earlier after schema/helper
          support, or grouping producer + cleanup consumer changes so no merged intermediate state
          claims durable protection without honoring it."
        created_at: 2026-05-12T19:35:40.808Z
    kind: question
  - _ulid: 01KREV11W9A9ADY2FH0Y8B84V3
    anchor:
      type: structured
      field: ac-expired-provisioning-lease-recovery
      ref: "@dispatch-workspace-registry"
      section: acceptance_criteria
    entries:
      - _ulid: 01KREV11W9M4HGJ2XG5RVYMMYQ
        author: Jacob Chapel
        body: "SHOULD-FIX: The abandoned-lease lifecycle is ambiguous enough to permit either cleanup
          starvation or too-fast deletion. The AC says an expired lease is marked abandoned before
          any later cleanup can delete artifacts, and the helper task says abandonment records
          diagnostics and avoids deleting artifacts itself, but no later contract defines when
          abandoned artifacts become cleanup-eligible, whether abandoned status is protected if
          `expires_at` is still present, or what bounded retention/retry/reset path moves the
          workspace out of abandoned. An implementation could preserve abandoned non-closed records
          forever, leaking worktrees/branches, or delete on the next cycle before an operator can
          inspect diagnostics. Define the abandoned state’s cleanup eligibility, retention bound,
          and fresh-provisioning path explicitly."
        created_at: 2026-05-12T19:36:08.841Z
    kind: question
  - _ulid: 01KREV1GZ6MXQ3WTB0EX4EBY2Y
    anchor:
      type: structured
      ref: "@task-validate-provisioning-lease-protection"
      section: tasks
    entries:
      - _ulid: 01KREV1GZ6W72FW6KG1NJCPT2A
        author: Jacob Chapel
        body: "SHOULD-FIX: The plan records owner, phase, expiry, and health diagnostics, but it does not
          require an operator-visible inspection surface or structured cleanup-skip reason. Future
          failures involving stale owner metadata, false liveness, or cleanup starvation will be
          hard to diagnose if the only evidence is buried in the registry file or generic health
          text. Add a small observability contract to the validation or implementation tasks:
          status/debug output should expose current lease status, owner daemon/spawn, phase,
          expires_at, abandoned reason, and why cleanup preserved or skipped each protected
          artifact."
        created_at: 2026-05-12T19:36:24.294Z
    kind: question
