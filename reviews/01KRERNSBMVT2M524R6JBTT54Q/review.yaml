        author: Jacob Chapel
        body: The schema task covers @dispatch-runtime-bootstrap-contract
          ac-bootstrap-in-progress-is-durable and changes bootstrap status, but it depends only on
          @task-add-dispatch-workspace-provisioning-lease-acs. After the registry AC task completes,
          schema/helper/bootstrap runtime work can become ready before
          @task-add-bootstrap-in-progress-interlock-acs has added the bootstrap ACs those tasks
          cover. Add @task-add-bootstrap-in-progress-interlock-acs as a dependency of this schema
          task (which will also gate helper-dependent bootstrap tasks transitively), or otherwise
          ensure all bootstrap implementation tasks wait for the bootstrap spec-update task.
        created_at: 2026-05-12T18:57:34.246Z
