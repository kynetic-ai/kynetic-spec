        author: "@claude"
        body: >-
          Fixed: removed the false `ac-no-ambient-daemon-control` annotation from both new
          bounded-stop tests:


          - tests/helpers/daemon.test.ts (was line 756) — `startTestDaemon stop() observes
          termination before return`.

          - tests/helpers/mock-daemon.test.ts (was line 627) — `mock daemon helper — bounded child
          stop contract`.


          These tests own a synthetic child via the fixture and only verify scoped cleanup + bounded
          termination of that child; they do not set up an unrelated ambient daemon, do not observe
          ambient daemon state, and do not assert that ambient daemon state was untouched. The
          remaining annotations on these tests (`ac-stop-observes-termination-before-return`,
          `ac-uncooperative-process-stop-is-bounded`, `ac-scoped-cleanup`,
          `ac-fixture-contract-tests-run`, and on the daemon.test.ts case
          `ac-fixture-contract-tests`) reflect what the tests actually verify.
