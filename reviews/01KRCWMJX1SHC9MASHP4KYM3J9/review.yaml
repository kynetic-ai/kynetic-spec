    entries:
      - _ulid: 01KRCXDX6CJ56MFAGZ5ARQJYY4
        author: Jacob Chapel
        body: "MUST-FIX: these staged regression tests are active red tests, so this task cannot merge
          independently. Both the focused slice (`npm test -- --fresh tests/helpers/daemon.test.ts
          tests/helpers/mock-daemon.test.ts tests/cli-serve.test.ts`) and the full suite fail only
          because the five new contract assertions are plain `it(...)` tests. That violates the
          merge gate and would make `dev` red before @task-implement-bounded-process-stop-primitives
          runs. Stage the regressions using the repo pattern (selective expected-failure wrapper
          preferred, or `it.fails` where sufficiently selective) so the suite stays green pre-fix
          and intentionally fails after the implementation closes the bug and the wrapper needs
          removal."
        created_at: 2026-05-12T01:39:38.316Z
      - _ulid: 01KRCYVVPJ5V3K8X1FDCFNJBJS
        author: "@claude"
        body: >-
          Fixed: converted all 5 staged regressions from plain `it(...)` to the selective
          expected-failure pattern (per @01KR431R, the validated repo convention). Each test now
          uses a local `expect*` helper that runs the post-fix assertion and, on the expected
          pre-fix throw, re-asserts the EXACT current bug shape:


          - tests/helpers/daemon.test.ts: `expectKillChildScopedMissesExitObservation(child)` —
          pre-fix shape is BOTH exitCode AND signalCode null on the handle after stop() returns.

          - tests/helpers/mock-daemon.test.ts: `expectMockDaemonStopLeaksPid(pid)` — pre-fix shape
          is `isProcessAlive(pid) === true` after stop() returns.

          - tests/cli-serve.test.ts: three helpers —
          `expectWaitForChildExitMissesObservation(child)`,
          `expectWaitForChildExitMissesSignalFastPath(elapsed)` (window [500ms, 7000ms]),
          `expectKillPidIsFireAndForget(pid)`.


          An unrelated failure mode (different exit timing, child crashed in setup, etc.) re-throws
          and fails the test, preserving selectivity. Post-fix the wrapper throws an explicit
          "STAGED REGRESSION CLOSED — remove this wrapper" sentinel so the next implementation task
          (@task-implement-bounded-process-stop-primitives) is forced to inline the assertion and
          delete the helper.


          Verified: focused slice green (`mise exec -- npm test -- --fresh
          tests/helpers/daemon.test.ts tests/helpers/mock-daemon.test.ts tests/cli-serve.test.ts` —
          74 tests pass), and the full suite is green (9033 passed, 5 skipped, 0 failed).


          `it.fails(...)` was rejected per @01KR3ZR8 because any thrown assertion satisfies the
          marker; the selective wrapper enforces the bug-shape contract.
        created_at: 2026-05-12T02:04:44.114Z
    kind: blocker
