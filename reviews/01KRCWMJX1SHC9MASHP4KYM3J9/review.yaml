          daemon, nor assert that ambient daemon state is not stopped, killed, or reused. The
          assertions prove owned-child scoped cleanup and bounded termination behavior, not
          no-ambient daemon control. Remove this AC annotation from the new bounded-stop tests (also
          in tests/helpers/mock-daemon.test.ts lines 624-628) or add behavioral assertions that
          actually prove that contract."
