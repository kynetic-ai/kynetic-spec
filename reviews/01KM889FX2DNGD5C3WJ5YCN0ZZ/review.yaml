      - _ulid: 01KM88MX9YFH129Y0HDNE402V5
        author: Jacob Chapel
        body: The daemon still reads task review subjects through the legacy loadAllTasks(ctx) path here. In
          split storage, that helper only scans *.tasks.yaml / project.tasks.yaml entries and never
          loads tasks/<ulid>/task.yaml or notes.yaml (see src/parser/yaml.ts:839-872), so this
          response is assembled from the lean index instead of the real per-task files. The
          immediate regression is that reviewed task content loses split-only detail such as
          description and notes, and the same raw loader is still used in multiple daemon routes
          (tasks.ts, items.ts, sessions.ts, etc.). The CLI was switched to
          resolveTaskDataManager(ctx).loadAllTasks(ctx), but the daemon/web surface is still
          incomplete in this snapshot.
        created_at: 2026-03-21T13:16:42.686Z
    kind: blocker
