      ref: "@daemon-test-harness-guardrails"
      section: acceptance_criteria
    entries:
      - _ulid: 01KR20790X0JJBV1WAVK2P6072
        author: Jacob Chapel
        body: AC ac-direct-daemon-spawn-flagged names the concrete build artifact path dist/daemon/index.js
          in the Given clause. That makes the spec depend on the current daemon launcher layout
          rather than the durable behavior being guarded. Rewrite this AC to describe direct daemon
          executable/startup outside approved helpers, and keep exact paths such as
          dist/daemon/index.js in the task implementation details or lint-rule examples. Also review
          the same spec for command-level implementation wording so the ACs remain behavioral and
          timeless.
        created_at: 2026-05-07T19:56:48.029Z
    kind: blocker
  - _ulid: 01KR2083RCP53F7WJGC73PAAT4
    anchor:
      type: structured
      field: ac-resolved-endpoint-source
      ref: "@daemon-test-endpoint-consistency"
      section: acceptance_criteria
    entries:
      - _ulid: 01KR2083RCAH1W4TTPSRC4WEGJ
        author: Jacob Chapel
        body: AC ac-resolved-endpoint-source exposes fixture field names (api_url/ws_url) in the Then
          clause, and ac-mock-metadata-fidelity names daemon.connection.json. Per the spec language
          rules, ACs should describe the observable endpoint behavior, not internal field or file
          names. Rewrite these to say the request uses the fixture-provided HTTP API endpoint or
          WebSocket endpoint, and mock metadata follows the canonical daemon connection metadata
          contract; keep exact field/file names in task How/What details.
        created_at: 2026-05-07T19:57:15.404Z
    kind: blocker
  - _ulid: 01KR208EBXSXQS03C2QRZCYHYY
    anchor:
      type: structured
      field: ac-readiness-diagnostics
      ref: "@daemon-backed-test-fixture-contract"
      section: acceptance_criteria
    entries:
      - _ulid: 01KR208EBX8JHPFMZKC0DHRJAN
        author: Jacob Chapel
        body: "AC ac-readiness-diagnostics has a compound Then clause that requires several independently
          verifiable diagnostics: endpoint, runtime, process state, recent stdout, recent stderr,
          and last readiness observation. The review objective requires no compound Then clauses.
          Split this into atomic ACs, or rewrite it as one observable diagnostic-bundle behavior and
          move the required field list into task implementation/testing guidance."
        created_at: 2026-05-07T19:57:26.269Z
    kind: blocker
