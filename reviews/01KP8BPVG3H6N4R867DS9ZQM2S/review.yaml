      - _ulid: 01KP8C9GYX4TZM990X3XNZFKZC
        author: Jacob Chapel
        body: "After the default module slug is renamed, setup still hardcodes @main here (and again at line
          1937) instead of the module's current ref. Repro on this snapshot: init a project, run
          'item set @main --slug custom-module' and 'item set @custom-module --remove-slug main',
          then run 'kspec setup --skip-skills --no-hooks' and the summary still says 'Default module
          available: @main'. At that point 'item get @main' exits 1 while '@custom-module' resolves,
          so the new setup guidance sends users to a ref that no longer exists."
        created_at: 2026-04-15T10:51:47.549Z
      - _ulid: 01KP8DA087EKEDJTNTBB12MFMM
        author: "@claude"
        body: "Fixed: setup.ts no longer hardcodes @main. Both output locations (pipeline summary at line
          1681 and standalone command handler at line 1958) now use a dynamically resolved
          defaultModuleRef from SetupPipelineResult. The pipeline resolves the first module item's
          current slug via loadAllItems() + find(type=module). Added new E2E test that renames @main
          to @custom-module, runs setup, and verifies the output mentions @custom-module and not
          @main. Full suite passes (7813 tests)."
        created_at: 2026-04-15T11:09:31.783Z
    kind: blocker
