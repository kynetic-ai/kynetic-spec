  - _ulid: 01KTTPHEQ9T4JMZSXFKV71CS4K
    anchor:
      type: structured
      field: coverage-mapping
      ref: "@plan-ui-redesign-global-decisions"
      section: tasks
    entries:
      - _ulid: 01KTTPHEQ9ZE06XVXDMX8FG8SC
        author: "@claude"
        body: derive_from_specs is false and the only manual tasks are cleanup/disposition tasks with no
          spec_ref or Covers lines, so none of the 22 ACs across the nine proposed decision specs is
          claimed by executable work. After derive these decision specs would enter the corpus as
          orphaned behavior contracts with no implementation path. Either add explicit tasks/Covers
          for the decision ACs, or make the plan define how specific future track tasks will claim
          each AC before derivation.
        created_at: 2026-06-11T06:40:00.233Z
    kind: blocker
  - _ulid: 01KTTPHESSFS6BAGA7M9Z5HBDN
    anchor:
      type: structured
      field: ac-1
      ref: "@client-preference-persistence"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTPHEST4HVTMYTZ0JDX8VFP
        author: "@claude"
        body: The Then clause verifies an implementation mechanism ('shared preference utility' vs ad-hoc
          storage calls) rather than observable behavior. Move the utility requirement to
          implementation notes/tasks and rewrite the AC around user-visible persistence,
          namespacing/version behavior, or recovery semantics.
        created_at: 2026-06-11T06:40:00.314Z
    kind: blocker
  - _ulid: 01KTTPHERE1DCKNHZKNHBYV1RM
    anchor:
      type: structured
      field: ac-1
      ref: "@web-shell-platform-target"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTPHERFJY485KS40S75AZTG
        author: "@claude"
        body: "This AC is not deterministic enough to test: 'any shell capability' plus 'full functionality
          is available' is an unbounded assertion over the whole application. Split it into
          observable shell capabilities or define the bounded capability set whose browser-only
          behavior must be verified."
        created_at: 2026-06-11T06:40:00.271Z
    kind: blocker
  - _ulid: 01KTTPJ008G1QW5FS6YPG77ZC1
    anchor:
      type: structured
      field: ac-2
      ref: "@ac-coverage-applicability"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTPJ009A6WBSBMKS1HC624G
        author: "@claude"
        body: The AC declares that in-code not-applicable annotations neither cover nor exempt criteria, but
          current project/agent guidance still treats N/A trait AC annotations as a valid exemption
          convention. The plan notes that retiring this convention is future work, so the spec as
          written would introduce a conflicting corpus rule before the replacement task-coverage
          metadata exists. Add a transition boundary or defer this AC to the future
          coverage-metadata work.
        created_at: 2026-06-11T06:40:17.929Z
    kind: blocker
  - _ulid: 01KTTPJ027GTK287VC4D6RP4HE
    anchor:
      type: structured
      ref: "@task-record-overlapping-plan-dispositions"
      section: tasks
    entries:
      - _ulid: 01KTTPJ02824EE7QJMGJE74MCF
        author: "@claude"
        body: The disposition task depends on future track plans named only in prose ('sessions track
          controls plan', 'session entity plan', 'cross-project track', 'shell track'). Those
          records do not exist in the current plan catalog, so the worker cannot write durable
          disposition notes that point at actual successors. Add concrete successor
          refs/dependencies, or split this into a later task that runs after those track plans are
          imported.
        created_at: 2026-06-11T06:40:17.992Z
    kind: blocker
  - _ulid: 01KTTPJ037SN6QY353RR040JXN
    anchor:
      type: structured
      ref: "@task-fold-agent-dashboard-design-task"
      section: tasks
    entries:
      - _ulid: 01KTTPJ037B5G1A58F548RD754
        author: "@claude"
        body: "This task is not standalone-deterministic: it tells the worker to cancel the task or re-point
          it at an owning plan 'whichever the owner prefers at execution time', and the referenced
          cross-project owning plan is not identified by ref. A fresh worker cannot know which path
          to take. Choose one required outcome, or add an explicit dependency/reference to the
          owning plan and specify the re-pointing command."
        created_at: 2026-06-11T06:40:18.023Z
    kind: blocker
  - _ulid: 01KTTPJC3FP05PGJ43Z8B8EP3F
    anchor:
      type: structured
      field: ac-2
      ref: "@actor-identity-model"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTPJC3F0MNTY36J5YTXCPVW
        author: "@claude"
        body: The description says ambiguous historical actor values resolve through assisted review or
          declared defaults, but ac-2 only requires unresolvable values to map to declared defaults.
          Should assisted-review outcomes be an observable branch of this AC, or is the intended
          contract that all ambiguous/unresolvable values collapse to defaults during upgrade?
          Clarify so upgrade tasks do not choose different migration semantics.
        created_at: 2026-06-11T06:40:30.319Z
    kind: question
