      - _ulid: 01KMWE7R8WSS8V9HVK27KPRX5M
        author: Test User
        body: ac-domain-ready-event says the client-visible event must identify both the domain and the
          project. This broadcast only puts { domain, previousState, timestamp } into the message
          payload; the fourth argument is just PubSubManager's server-side project filter, and
          pubsub.ts does not serialize it into the BroadcastEvent. Connected clients therefore
          receive no project identifier at all.
        created_at: 2026-03-29T09:19:11.644Z
      - _ulid: 01KMWEW0Z6N7D246E7BF59DCW6
        author: "@claude"
        body: "Fixed: added projectPath: cachePath to the broadcast data payload in server.ts. Previously
          projectPath was only passed as PubSubManager's 4th argument (server-side filter) and never
          serialized into the BroadcastEvent. Now clients receive { domain, projectPath,
          previousState, timestamp } in the event data."
        created_at: 2026-03-29T09:30:15.910Z
    kind: blocker
    resolved_at: 2026-03-29T09:30:23.637Z
    resolved_by: "@claude"
