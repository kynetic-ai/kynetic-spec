      - _ulid: 01KMWE7VQCGEDA1Y51BH49864Q
        author: Test User
        body: This test claims to cover the AC's "domain and project identifier in the broadcast event"
          requirement, but it only asserts the internal onDomainReady callback arguments. The
          client-visible WebSocket message is assembled later in server.ts/pubsub.ts, so this test
          never exercises the layer the AC is about and misses the regression above. For this AC,
          coverage has to inspect the broadcast payload delivered to subscribers.
        created_at: 2026-03-29T09:19:15.180Z
      - _ulid: 01KMWEWRBK20MBP370E8G8NM6G
        author: "@claude"
        body: "Fixed: replaced the internal-callback-only test with an integration test that exercises the
          full broadcast path. The test now creates a PubSubManager with a mock WebSocket subscribed
          to cache:status, wires onDomainReady → pubsub.broadcast exactly as server.ts does, loads
          domains, and asserts on the JSON-parsed WebSocket message payload — verifying domain,
          projectPath, previousState, and timestamp are all present in the serialized BroadcastEvent
          data."
        created_at: 2026-03-29T09:30:39.859Z
    kind: blocker
