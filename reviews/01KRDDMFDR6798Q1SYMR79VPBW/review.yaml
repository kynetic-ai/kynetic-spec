    entries:
      - _ulid: 01KRDEB3EJAKAFCMNQYKHSPAP4
        author: codex
        body: "MUST-FIX: runDaemonFixtureLifecycle calls setup() before entering its try/finally, but
          test-base now passes startDaemon() as setup. If startPlaywrightFixtureDaemon rejects
          during readiness/startup, teardown is never invoked, so stopDaemon(), second-project
          cleanup, and project.cleanup() are skipped. This regresses the previous wrapper shape
          where startDaemon() was inside the try/finally and violates
          @daemon-test-startup-failure-hygiene ac-owned-child-stopped-after-startup-failure /
          @daemon-backed-test-fixture-contract ac-scoped-cleanup. I confirmed the control flow by
          executing the helper shape with a throwing setup: output was thrown=setup/start failure
          and teardownRan=false."
        created_at: 2026-05-12T06:35:12.210Z
      - _ulid: 01KRDG0833YT3041HQJF2P18ES
        author: "@claude"
        body: >-
          Fixed. The cycle 1 wrapper refactor passed startDaemon() as the lifecycle helpers setup
          callback, but runDaemonFixtureLifecycle invokes setup() outside its try/finally — so a
          readiness/startup failure bypassed teardown (no stopDaemon, no second-project cleanup, no
          project.cleanup). Reproduced the failure mode locally (order = [start-daemon]; teardownRan
          = false).


          Fix: extracted runPlaywrightFixtureBody in tests/e2e/fixtures/daemon-fixture.ts that wires
          startDaemon inside the lifecycle helpers use phase (not setup), so a startup failure flows
          through the try/finally and still triggers teardown. test-base.ts now delegates to it,
          restoring the pre-extraction wrapper shape where startDaemon was inside the wrappers own
          try/finally.


          Wrapper coverage added in tests/e2e-fixture-daemon-cleanup.test.ts under
          describe("runPlaywrightFixtureBody — wrapper startup-failure cleanup"):
            1. Positive: startDaemon → body → teardown invocation order on success.
            2. Regression (passing post-fix): startDaemon throws → teardown still runs, body never runs. order asserts exactly [start-daemon, teardown]. A regression that reverted to setup-as-startup would observe [start-daemon] (no teardown) and fail this assertion.
            3. Staged (it.fails): startDaemon throws + teardown throws → primary error preservation. Pairs with the existing use-phase preservation regression; flips post-fix when @task-fix-setup-failure-cleanup-error-preservation lands.

          Verified:
            - Reproduced the regressed shape (startDaemon as setup) locally — teardown observably skipped.
            - Focused: 16/16 suites, 27/27 tests pass.
            - Full: 9071 passed, 5 skipped, 15 expected fail (it.fails staged). One unrelated flake in tests/file-lock.test.ts (concurrent writes, passed on re-run).
        created_at: 2026-05-12T07:04:13.664Z
    kind: blocker
