      path: tests/dispatch-workspace-config.test.ts
      side: head
    entries:
      - _ulid: 01KKZ6GFSFGTKXE6VBVNYP9HPD
        author: "@claude"
        body: No test verifies that target_commit is updated when the integration target branch changes. The
          auto-update test (line 465) checks target_branch and resolved_base_branch but not
          target_commit. A test asserting secondRecord.integration.target_commit points to the dev
          branch tip (not the original main branch tip) would catch the bug in the previous finding.
        created_at: 2026-03-18T00:46:10.735Z
