    entries:
      - _ulid: 01KM4CXT7BBHM7YE9H04Q6H699
        author: Jacob Chapel
        body: "MUST-FIX: dependency repair is folded into the persisted bootstrap config hash, so a
          workspace that bootstrapped once while node_modules was missing is permanently considered
          config-changed on the next healthy run. Reproduced with a temp repo: first
          ensureWorkspaceBootstrap returns workspace-dependencies-missing and persists the synthetic
          npm ci step; the next run with the same sources but healthy node_modules returns
          bootstrap-config-changed and reused=false even though no dispatch/bootstrap config
          changed. That forces an unnecessary second bootstrap cycle after every repair and can
          re-run non-idempotent steps."
        created_at: 2026-03-20T01:14:31.019Z
      - _ulid: 01KM4DEXQCAXQ1SAV253V49A9C
        author: Jacob Chapel
        body: "Fixed in follow-up commit: configHash now hashes only persisted dispatch/agent bootstrap
          configuration, while workspace-dependencies-missing remains a transient invalidation
          signal. Added a regression assertion that the first healthy run after dependency repair
          reuses bootstrap state instead of forcing a synthetic bootstrap-config-changed rerun.
          Verified with tests/dispatch-runtime-bootstrap-contract.test.ts and full npm test."
        created_at: 2026-03-20T01:23:51.659Z
