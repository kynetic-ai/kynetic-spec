      - _ulid: 01KMACXTRGTM5M58TQTRNBXM22
        author: Test User
        body: The new idle loop closes the prompt queue after a single microtask when nothing was enqueued
          synchronously in onIdle. That means any asynchronous follow-up source (for example an
          event-bus hook, timer, or external action that resolves after the callback returns) loses
          the session before it can use the registry handle, so the session is not actually kept
          open/capable of receiving follow-up prompts while idle. This violates the task goal and
          @multi-turn-session-lifecycle ac-2/ac-4 for any non-inline prompt source.
        created_at: 2026-03-22T09:09:58.160Z
