      - _ulid: 01KXPV0J1MEQWT5N7A0ZPWWDSG
        author: Jacob Chapel
        body: "MUST-FIX — The operator-facts drift gate validates only a fraction of the fixture. The source
          matrix check proves that files exist, not that their behavior supports the frozen claims,
          and many required fields are never compared to an exported schema/helper or exercised
          behavior: integration_target_at_freeze, base-target/bootstrap semantics, transitions and
          durability/admission, held/task-control/cleanup field sets, compatibility API and wire
          mapping, static/accessibility behavior, stop safety, evidence preservation, and the actual
          limitation set. Impact: downstream prose can consume a stale or arbitrarily corrupted fact
          while this suite remains green. Evidence: validateFacts ends with
          existence/non-empty/boolean checks for those groups; the full and focused suites pass
          despite no assertion binding these fixture leaves. Add source-bound behavioral/schema
          checks and negative mutations for the required fact groups."
        created_at: 2026-07-17T01:28:17.204Z
    kind: blocker
  - _ulid: 01KXPV0NDYF9AGW08Q75A1ZZ3E
    anchor:
      type: code
