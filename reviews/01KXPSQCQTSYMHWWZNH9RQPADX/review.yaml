    entries:
      - _ulid: 01KXPV0VX14WSE1TN2BQA416SJ
        author: Jacob Chapel
        body: MUST-FIX — The tests annotated for @auto-cli-docs ac-3 and ac-4 do not prove a complete help
          reference/tree. The --all test checks only ten lifecycle command substrings, and the JSON
          test reduces output to command paths; neither verifies every exported command nor options,
          arguments, and descriptions. A regression that drops a non-lifecycle command from --all or
          strips metadata from --json still passes. Existing help.test coverage uses synthetic
          Commander nodes and only checks that real JSON has object fields, so it does not close
          this gap. Assert the full exported command metadata against both observable help modes.
        created_at: 2026-07-17T01:28:27.297Z
    kind: blocker
