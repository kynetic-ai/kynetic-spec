    entries:
      - _ulid: 01KXPV0RMFGP76GAD2WY57WN01
        author: Jacob Chapel
        body: "MUST-FIX — The AC-2 assertion discards link order by sorting the landing-page links before
          comparison, while sectionChildPaths independently sorts filenames. Reordering a landing
          page into the wrong reading sequence therefore still passes. Impact:
          @docs-section-taxonomy ac-2 is not behaviorally proved for each section. Existing web
          rendering coverage also does not disprove this: its reading-order test only checks that
          getting-started contains tutorial.md. Compare the observed link sequence against an
          independently defined navigation/reading order without sorting it."
        created_at: 2026-07-17T01:28:23.951Z
    kind: blocker
