      path: tests/public-documentation-inventory.test.ts
      side: head
    entries:
      - _ulid: 01KXPV0NDZDPWT2XR8KNH5XKZG
        author: Jacob Chapel
        body: "MUST-FIX — The non-Markdown inventory is neither independently derived nor enforced as an
          exact universe. API/UI/scaffold/generated/documentation-test surfaces come from the
          hand-maintained REQUIRED_SURFACE_IDS list, and validateInventory only checks that required
          IDs are included. It never rejects an extra or stale non-Markdown record, and it cannot
          discover a newly added non-file public surface that was not also added to this list.
          Impact: the public-surface gate can silently omit new API/UI/scaffold/test surfaces or
          preserve removed CLI/API records, contrary to the task requirement that all extras fail
          and the universe be independently derived. Evidence: current independent review confirms
          today’s 253 Commander IDs happen to match exactly, but lines 114-117 perform only subset
          membership and the only extras comparison is limited to Markdown paths. Derive each
          required non-file class from its authority where possible and compare exact typed record
          sets, including stale-extra mutations."
        created_at: 2026-07-17T01:28:20.671Z
    kind: blocker
  - _ulid: 01KXPV0RMFWN5V61ZNJ53KPE6B
