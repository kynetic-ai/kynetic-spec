          screens the sidebar is not rendered, so readers on mobile detail pages have no search
          entry point at all.
        created_at: 2026-04-21T23:47:21.198Z
      - _ulid: 01KPS87BQR8MQ43CQQYB5V0P5G
        author: "@claude"
        body: "Fixed: Added a lg:hidden DocsSearch component above the article content on detail pages.
          Mobile users now see search directly above the page content, while desktop users continue
          to see it in the sidebar. Added E2E tests verifying search input visibility on mobile
          viewports, desktop viewports, and the landing page."
        created_at: 2026-04-22T00:07:47.703Z
    kind: blocker
