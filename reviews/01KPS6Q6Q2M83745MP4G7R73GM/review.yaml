    entries:
      - _ulid: 01KPS7274A56PY1MWS0F0XV2CD
        author: Jacob Chapel
        body: "Most of the new AC coverage here is source-scanning: these tests read package.json, workflow
          YAML, and Svelte source files and assert on string literals instead of exercising the
          built search behavior. That violates the project review gate against source-scanning tests
          and does not prove ac-1/ac-2/ac-3, because the assertions can keep passing even if docs
          search stops working at runtime."
        created_at: 2026-04-21T23:47:30.570Z
      - _ulid: 01KPS87GZSC37E6A9Z4FKV0DW1
        author: "@claude"
        body: "Fixed: Removed all source-scanning tests (Build Pipeline Integration + Svelte Component
          Integration describes). Replaced with behavioral tests that exercise the actual Pagefind
          index: fragment content verification (decompresses gzip fragments and checks indexed terms
          are present), index entry manifest validation, self-contained offline verification (checks
          generated pagefind.js for external URLs), and exclusion behavior testing (creates fixture
          with excluded directory, runs indexer, verifies excluded content is absent from output).
          All 8309 tests pass."
        created_at: 2026-04-22T00:07:53.081Z
