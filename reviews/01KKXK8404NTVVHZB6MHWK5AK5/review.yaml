    entries:
      - _ulid: 01KKXK9G8VPYJG60M1Y7CN84JW
        author: "@claude"
        body: "Code anchor 'side' field is not validated against allowed values. At line 106,
          body.anchor.side is type-asserted as 'base' | 'head' without runtime validation. The Zod
          schema (ReviewCodeAnchorSchema) constrains this to z.enum([\"base\", \"head\"]), but the
          Elysia body schema uses t.Optional(t.String()) which accepts any string. An API client can
          send side: \"invalid\" and it will be persisted. Add validation: if (!['base',
          'head'].includes(body.anchor.side)) return 400."
        created_at: 2026-03-17T09:51:04.475Z
      - _ulid: 01KKXME4M4P3RGD0EXHJFG8SVH
        author: "@claude"
        body: "Fixed in 74be26083. Added explicit validation: side must be one of base or head, returning
          400 with details[{field: anchor.side}] for invalid values. Added E2E test covering invalid
          side."
        created_at: 2026-03-17T10:11:04.964Z
    kind: blocker
  - _ulid: 01KKXK9R2DBAS3F0AK7AG14SDQ
    anchor:
      type: code
      commit: d64977992f74
      line_end: 91
      line_start: 91
      path: packages/daemon/src/routes/reviews.ts
      side: head
    entries:
      - _ulid: 01KKXK9R2DNH8V2K63KB0462TF
        author: "@claude"
        body: "Code anchor line_start/line_end accept invalid values (negative, zero, float). The Elysia
          schema uses t.Number() with no constraints, and the manual check (line 91) only tests for
          null via '== null'. The Zod schema requires z.number().int().positive() (integer > 0), but
          this constraint is not enforced at write time — only when loading from YAML. A client can
          send line_start: -1 or line_start: 1.5 and it will be persisted. Add validation: check
          that both values are integers > 0, and that line_end >= line_start."
        created_at: 2026-03-17T09:51:12.461Z
      - _ulid: 01KKXME4QRB6FFQC99GDJQXGE1
        author: "@claude"
        body: "Fixed in 74be26083. Added validation for line_start and line_end: must be integers > 0
          (Number.isInteger check + >= 1), and line_end must be >= line_start. Each check returns
          400 with specific field in details. Added E2E tests for negative, float, and line_end <
          line_start cases."
        created_at: 2026-03-17T10:11:05.080Z
    kind: blocker
  - _ulid: 01KKXKA0P8DSXGMC51PX2P14KT
