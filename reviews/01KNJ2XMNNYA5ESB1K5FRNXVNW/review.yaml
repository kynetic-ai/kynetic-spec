    entries:
      - _ulid: 01KNJ39SPJF6J9AN3KGKE64254
        author: Jacob Chapel
        body: "Incremental item updates currently accept any changed '*.spec.yaml' under .kspec, even when
          the manifest does not include that file. This path merges parsed items into
          newDetails/newSourceFiles but rebuilds nextIndex only from manifest-expanded source files,
          so the detail tier can expose entities that a full reload would never load. Repro executed
          in this snapshot: with includes set to 'modules/*.yaml', editing '.kspec/orphan.spec.yaml'
          left getItemIndex() as ['alpha'] but made getItemDetail(orphanUlid) return the orphan
          item."
        created_at: 2026-04-06T19:11:21.810Z
      - _ulid: 01KNJZC1PX21VRZ6R4G4CPKYVK
        author: Jacob Chapel
        body: "Fixed by limiting incremental item patching to manifest-expanded source files. Off-manifest
          *.spec.yaml changes now fall back to full item reload, and I added a regression test
          covering the orphan spec-file case. Verification: targeted daemon cache tests, kspec
          validate (warnings only), and full npm test all passed."
        created_at: 2026-04-07T03:21:55.677Z
