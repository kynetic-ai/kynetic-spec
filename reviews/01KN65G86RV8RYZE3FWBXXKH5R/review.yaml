    entries:
      - _ulid: 01KN665WYKGZQJ1PJA7RY0S7JJ
        author: Jacob Chapel
        body: The extracted branch helper now feeds plan  values straight into shell-interpreted  strings.
          Because  accepts an arbitrary branch name, a value like  executes the trailing shell
          command before Git rejects the ref. I reproduced that behavior in a temp repo and
          observed  being created, so this is an arbitrary command execution bug on a new
          user-controlled input path. These helper calls need to switch to argv-safe process APIs
          (or equivalent escaping/validation) before the command can ship.
        created_at: 2026-04-02T04:10:46.611Z
      - _ulid: 01KN66PJX08HYXN8FPZ39G7FRD
        author: Jacob Chapel
        body: "Fixed: src/cli/branch-helper.ts now runs git via argv-safe spawnSync calls instead of
          shell-interpreted execSync strings, so custom plan/task branch names are treated as
          literal git ref arguments. Added a regression test in tests/plan-branch-helper.test.ts
          that passes a metacharacter branch name and verifies no side-effect file is created."
        created_at: 2026-04-02T04:19:53.376Z
