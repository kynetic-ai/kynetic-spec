      - _ulid: 01KSEYNNPX4NGP0B8FXPV52VQA
        author: Jacob Chapel
        body: "MUST-FIX: The task's testing contract explicitly calls for review-resource route coverage of
          shared-envelope 409 entity_storage_incompatible responses and cache/WebSocket
          invalidation. This file covers basic CRUD and several error envelopes, but it never
          exercises an incompatible manifest against the /api/reviews/:ref/resources routes, and it
          never uses createTestApp({ getEntityCache }) or captureBroadcasts to prove POST/DELETE
          call cache.writeThrough('reviews') and broadcast resource_changed. As written, regressions
          in the evidence refresh path or storage incompatibility envelope would pass the suite."
        created_at: 2026-05-25T06:55:32.061Z
      - _ulid: 01KSF0RA7TXWGW9Y1CGDK5F1SG
        author: "@claude"
        body: >-
          Fixed: added three new describe blocks to tests/daemon-api/review-resources.test.ts
          covering exactly the gaps you called out.


          1. Entity storage incompatibility — five tests exercise GET list, GET single, GET bytes,
          POST, and DELETE on the review-resource routes against a project with a legacy 1.1
          manifest that does not declare folder-backed review storage. Each asserts the shared 409
          envelope (entity_storage_incompatible) with code legacy_review_storage_removed, domain
          reviews, cache_domain reviews, and the kspec upgrade suggestion. This closes the
          regression path where the onError mapping or requireReviewFolderStorage propagation could
          have escaped as 404 or 500.


          2. Cache write-through — three tests use createTestApp({ getEntityCache }) with a mock
          RouteEntityCache (capturing writeThrough calls in an array, same pattern as
          daemon-triage-write-through.test.ts). POST add, POST replace, and DELETE each assert that
          writeThroughEntries contains a reviews-domain entry. Negative cases (validation failure on
          POST, missing resource on DELETE) assert the writeThrough array is empty.


          3. WebSocket broadcasts — the same three success tests also use captureBroadcasts(pubsub)
          and assert pubsub.broadcast("reviews:updates", "resource_changed", { review_ulid,
          resource_id, action }) is called with action: added | replaced | removed. The negative
          cases also assert broadcastSpy was not called.


          Full test suite: 9700 passed (10 new tests), 5 skipped, 0 failed.
        created_at: 2026-05-25T07:31:55.770Z
    kind: blocker
