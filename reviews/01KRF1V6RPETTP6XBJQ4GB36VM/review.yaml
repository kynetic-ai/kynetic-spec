    entries:
      - _ulid: 01KRF1XPGG7HBXJ3DD2ZK30X4X
        author: Jacob Chapel
        body: "MUST-FIX: The `closing` cleanup-eligible wording still conflicts with the existing
          dispatch-branch preservation contract unless the plan explicitly confines branch deletion
          for `closing` records to scheduled reaping. Existing @dispatch-workspace-registry ac-13,
          its implementation comments in `reconcileDispatchWorkspaceArtifacts()`, and
          `tests/dispatch-workspace-terminal-reconciliation.test.ts` require artifact reconciliation
          to preserve dispatch branches for any non-closed registry record, including `closing`;
          only `closed` records are eligible for branch-pruning deletion. This task says `closing`
          is not protected once cleanup prerequisites are met and step 5 allows dispatch branches to
          be deleted after cleanup classification determines they are safe, which leaves
          implementers free to delete a `closing` record's branch in the orphan-branch pruning pass
          before `reapDispatchWorkspace()` has completed and persisted `closed`. Impact: this can
          violate @dispatch-workspace-registry ac-13, bypass the cleanup-completion ACs that mark
          records closed after physical reap, or produce tests that encode a behavior opposite the
          existing regression. Fix: state the precedence explicitly: active/in-flight/provisioning
          and unclassified records are preserved; `closing` records may proceed through
          `reapDispatchWorkspace()` when terminal and unprotected; the standalone dispatch-branch
          pruning surface must continue preserving non-closed registry branches until the record
          reaches `closed`, unless this plan also updates @dispatch-workspace-registry ac-13 and its
          tests. Add a negative-control test proving a cleanup-eligible `closing` workspace is
          reaped through the scheduled cleanup path, and a regression preserving a `closing`
          registry branch encountered only by branch pruning."
        created_at: 2026-05-12T21:36:38.928Z
    kind: blocker
  - _ulid: 01KRF1XT38ANZXGK3P2Z3TBFBE
    anchor:
      type: structured
      field: description
      ref: "@task-add-cleanup-protection-maintenance-guardrails"
      section: tasks
    entries:
      - _ulid: 01KRF1XT38CT89M67XMH9V6MTX
        author: Jacob Chapel
        body: "SHOULD-FIX: The guardrail task remains hard to distinguish from
          @task-test-cleanup-protection-positive-and-regression-cases. Both tasks still require
          protected and cleanup-eligible coverage for every destructive surface through
          `reconcileDispatchWorkspaceArtifacts()` or equivalent behavior. Impact: two implementers
          can produce duplicate test matrices or split the same AC coverage ambiguously. Fix: either
          fold this task into the main regression task, or make its distinct responsibility
          explicit, such as a small helper-contract matrix for the centralized policy while the main
          test task owns public reconciliation/regression coverage."
        created_at: 2026-05-12T21:36:42.600Z
