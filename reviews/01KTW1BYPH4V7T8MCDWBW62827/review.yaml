        body: "RE-RAISED from round 1 (thread 01KTW05VK8600AF54YTPCQW64G) — plan content unchanged since
          that review. @plan-revisions declares depends_on: @actor-identity-model, and
          task-plan-revision-records and task-plan-revision-backfill both rely on it for author
          resolution, but the ref still does not resolve (verified: kspec item get
          @actor-identity-model returns Item not found). The plan's own Approval ordering note
          acknowledges the P0a dependency, but the plan is not derivable as written. Either
          materialize the upstream P0a spec first and keep the ref, or remove/replace the dependency
          and the task text that leans on it."
        created_at: 2026-06-11T19:09:48.343Z
      - _ulid: 01KTW4CA7ANK9HJ2JGQKNJG7HA
        author: "@claude"
        body: "Addressed in re-import: removed the structured depends_on from plan-revisions entirely.
          Revision-author attribution now reuses the existing actor attribution (same vocabulary as
          review records and notes), centralized in one resolution helper per
          task-plan-revision-records; task-plan-revision-backfill records its system/upgrade author
          through the same helper. The implementation note Actor-identity sequencing documents how
          the helper adopts the P0a canonical identity spec (register #21) when it materializes. The
          plan now carries no unresolved cross-plan references and is derivable as written."
        created_at: 2026-06-11T20:01:06.282Z
    kind: blocker
  - _ulid: 01KTW1EFKG5HBS9P1XESDM6DRJ
    anchor:
      type: structured
      ref: "@plan-revisions"
      section: description
    entries:
      - _ulid: 01KTW1EFKG979Z0R1AJ7ZW6AFY
        author: "@claude"
        body: RE-RAISED from round 1 (thread 01KTW069JBYSZWMAV6NPZEZTN6) — unchanged. The description states
          'Every plan has at least revision 1', but ac-legacy-plans-load requires a pre-upgrade plan
          to load and report an empty revision history, and task-plan-revision-records defaults
          legacy plans to an empty list. These define incompatible observable states for the same
          entity. Qualify the description to the post-upgrade model (e.g. 'after the data upgrade,
          every plan has at least revision 1'), or change the legacy-load contract — one
          deterministic contract, not two.
        created_at: 2026-06-11T19:09:51.600Z
    kind: blocker
  - _ulid: 01KTW1EJPMWYYY0RA4MKM5ZMHG
    anchor:
      type: structured
      field: ac-plan-text-anchor-stored
      ref: "@review-plan-text-anchors"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTW1EJPMDCEGY3SX1PA9BGQ1
        author: "@claude"
        body: RE-RAISED from round 1 (thread 01KTW06MQEM16Z1WSD3W4HR6EC) — unchanged. Plan-text anchors
          persist a 'character offset', but neither the spec nor task-plan-text-anchors defines the
          offset unit (bytes, Unicode scalar values, or UTF-16 code units). For non-ASCII plan text
          this makes ac-plan-text-anchor-stored and ac-span-integrity non-deterministic, and CLI,
          daemon, and future UI writers can disagree while each claims AC compliance. Define the
          unit in the spec (description and/or AC text) and add a non-ASCII span case to the task's
          test list.
        created_at: 2026-06-11T19:09:54.772Z
    kind: blocker
  - _ulid: 01KTW1ENTYCKA2CBTQPJH5BDME
    anchor:
      type: structured
      ref: "@task-idea-thread-kind"
      section: tasks
    entries:
      - _ulid: 01KTW1ENTYWYT7GWBZN9T55MT2
        author: "@claude"
        body: RE-RAISED from round 1 (thread 01KTW06ZESX5V02Q6T2Z80DYQQ) — unchanged. @review-idea-threads
          says idea threads 'behave like every other kind' and the supported write interfaces accept
          them, but the existing @review-records-web-ui ACs still specify blocker/question/nit
          badges and kind selection, while this task updates only type unions and defers rendering
          to later plans. Once the schema accepts idea, the shipped UI will encounter idea threads
          it has no specified treatment for. Should @review-idea-threads / task-idea-thread-kind
          explicitly scope supported write/render surfaces to CLI/API for this plan (with a
          follow-up for UI), or should the existing web-ui spec get a minimal respec in this plan
          the way ac-11 does for review passes?
        created_at: 2026-06-11T19:09:57.982Z
    kind: question
  - _ulid: 01KTW1ERY70EQ8TKRNWD6GB75E
    anchor:
      type: structured
      ref: "@task-plan-text-anchors"
      section: dependencies
    entries:
      - _ulid: 01KTW1ERY8M43Q6NQ3841N737X
        author: "@claude"
        body: "NEW in round 2. Sequencing gap between plan-text anchors (P1) and revision backfill (P2):
          creation-time validation requires the anchor's revision ordinal to exist on the subject
          plan and resolves span integrity against that revision's content. Legacy plans report an
          empty revision history until task-plan-revision-backfill (P2) runs or someone publishes,
          so in the shipped order plan-text anchors are unusable on every pre-existing plan (93 in
          this project alone) — precisely the draft-plan reviews this feature targets. Consider
          making task-plan-text-anchors depend on task-plan-revision-backfill, or raising backfill
          to P1. Relatedly, the nonexistent-ordinal rejection is asserted only in task text —
          consider an explicit AC on @review-plan-text-anchors for a creation revision that does not
          exist on the subject plan, since ac-plan-text-anchor-validation covers only shape-level
          failures (negative offset, empty quote, non-positive ordinal)."
        created_at: 2026-06-11T19:10:01.160Z
    kind: question
  - _ulid: 01KTW1EW5SWA12F605QZHY938S
    anchor:
      type: structured
      field: ac-deterministic-sectioning
      ref: "@review-plan-text-anchors"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTW1EW5SE4G80V40Z5B5EQ86
        author: "@claude"
        body: "NEW in round 2. The when-clause 'the document is divided into sections on the server side'
          carries an architectural term into AC text. The observable contract is the deterministic
          sectioning itself, not where it executes; 'on the server side' belongs in the description
          or implementation notes (where it already appears via decision #19). Suggest: when 'the
          document is divided into sections'."
        created_at: 2026-06-11T19:10:04.473Z
    kind: nit
