    entries:
      - _ulid: 01KM89MQ87E8XQXZJR08SWPWZG
        author: Test User
        body: 'Split-format write buffering is still process-global instead of operation-scoped.
          withWriteBuffer() reuses any active buffer, and activateBatchBuffer() stores that buffer
          in the module singleton _activeBuffer. In a normal concurrent workload, a second
          mutateTask() on a different task will join the first mutation buffer even though no batch
          is in progress. I reproduced this with two concurrent split mutations where task A throws
          after 50ms and task B succeeds after 5ms: Promise.allSettled returned one rejection and
          one fulfillment, but getTask("@b") still returned the old priority because task A
          discarded the shared buffer. That silently loses successful writes whenever a sibling
          operation fails, violating the atomicity/concurrency guarantees for non-overlapping task
          mutations.'
        created_at: 2026-03-21T13:34:05.064Z
    kind: blocker
