    entries:
      - _ulid: 01KM8KJR4PQS2H14R8Y1K3RZYP
        author: Test User
        body: "Index writes now happen only after \\ returns, which means the per-task files have already
          been flushed to disk before \\ runs. If the later index write throws (disk error, YAML
          write failure, lock interruption), the task mutation is partially persisted: \\/\\ contain
          the new state and history entry, but \\ still reflects the old summary. That breaks \\ and
          violates the atomicity contract claimed here and in \\ (for the same reason in
          create/delete/mutateTasks at lines 661-664, 882-885, and 934-938)."
        created_at: 2026-03-21T16:27:46.198Z
      - _ulid: 01KM8KKJNGPP8C9JE4YVBN5B5N
        author: Test User
        body: "Plain-language summary: the new split-backend flow flushes task.yaml/notes.yaml first and
          only then updates project.tasks.yaml under the index mutex. If that second write fails,
          the mutation is left half-applied on disk: detailed reads see the new task state and
          history entry, but list/index reads still see the old summary until a manual rebuild.
          There is no rollback path for those already-flushed per-task files."
        created_at: 2026-03-21T16:28:13.360Z
    kind: blocker
