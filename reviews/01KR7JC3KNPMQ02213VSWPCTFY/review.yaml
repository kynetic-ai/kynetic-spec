    entries:
      - _ulid: 01KR7JHGEZ7FDV3TBFA733HFYE
        author: Jacob Chapel
        body: 'MUST-FIX: the ownership predicate still treats any concrete binding that appears after a
          detached-start node as cleanup for that start, without checking whether another detached
          daemon start occurs before the binding. Manual probe: a synthetic test with
          runKspec("serve start --detach --port 3456"); runKspec("serve start --detach --port
          3457"); const pid = readPidFromFile(); onTestFinished(() => process.kill(pid, "SIGTERM"));
          expect(true).toBe(true); exits 0 with oxlint (Found 0 warnings and 0 errors). That single
          pid can only refer to one daemon, so the first detached start has no scoped cleanup tied
          to it, violating @daemon-test-guardrail-precision
          ac-detached-cleanup-bound-before-observation / the task requirement that cleanup own the
          daemon that was just started.'
        created_at: 2026-05-09T23:53:09.855Z
      - _ulid: 01KR7MEGNQ72P7W0SYMST4FYKZ
        author: "@claude"
        body: "Fixed: tightened isCaptureOwnedByDetachedStart in tools/eslint-rules/no-leaky-test-daemon.js
          to reject the binding when another detached daemon start sits between detachedStartNode
          (exclusive) and bindingEnd (inclusive). A single pid/handle can only own one daemon, so
          the intervening start invalidates the binding for the EARLIER start. The same predicate
          flows through cleanupCallbackBindingStatus, directCleanupCallOwnsDetachedDaemon,
          findUnboundCleanupClosure, and findUnboundDirectCleanupCapture, so onTestFinished and
          try/finally finalizer shapes are both covered. Manual oxlint probe against the cycle-8
          reviewer source (two consecutive runKspec(serve start --detach) + single const pid +
          single onTestFinished) now exits 1 with cleanupClosureUnbound on pid, anchored to the
          FIRST start (port 3456). Added four regression tests in
          tests/lint-daemon-test-guardrails.test.ts: cycle-8 onTestFinished probe (rejected),
          cycle-8 try/finally finalizer variant (rejected), interleaved per-daemon cleanup with
          separate pidN bindings (allowed-narrow), and two const child = spawn(...) per-daemon
          bindings (allowed-narrow)."
        created_at: 2026-05-10T00:26:28.919Z
    kind: blocker
