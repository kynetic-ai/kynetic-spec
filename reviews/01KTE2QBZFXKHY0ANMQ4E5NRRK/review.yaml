  - _ulid: 01KTE3HZ29M2K8T3MTDWG4S1D0
    anchor:
      type: code
      commit: 0e1896826ae024c59148daf1820f1f7a122145b1
      line_end: 786
      line_start: 780
      path: src/agent-runtime/invocation.ts
      side: head
    entries:
      - _ulid: 01KTE3HZ29WYJ1C5CJWBT2YC33
        author: pr-reviewer
        body: "MUST-FIX: Session metadata persistence still records the display task ref as task_id.
          Dispatch normalizes TaskStateChange to canonical taskId plus display taskRef, but
          _spawnInvocation passes only taskRef into runInvocation, and InvocationOptions has no
          canonical task id field. createSession() then persists task_id: taskRef here, and the
          session event history paths in this file do the same. For a valid slug display ref such as
          @task-session-payload, the persisted session metadata/event history gets
          task_id=@task-session-payload instead of the canonical full ULID, violating
          @dispatch-canonical-task-identity
          ac-session-and-event-payloads-separate-id-from-display-ref. The new integration test does
          not catch this because it mocks runInvocation and asserts only DispatchEngine
          event-bus/onInvocationEvent payloads, not the real persisted SessionMetadata returned by
          runInvocation."
        created_at: 2026-06-06T09:17:20.841Z
    kind: blocker
