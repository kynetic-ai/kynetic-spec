  - _ulid: 01KTRZV1D5083S8FMX7X38ZNJ9
    anchor:
      type: structured
      ref: "@task-daemon-log-capture"
      section: description
    entries:
      - _ulid: 01KTRZV1D5CHZAJ13WC8SE8N2W
        author: "@claude"
        body: >-
          The How section's model of the command-route console interception is factually wrong, and
          following it literally produces the exact double-logging failure the task warns against.


          Claim in the task: the interception in packages/daemon/src/routes/command.ts 'wraps
          process.stdout/stderr.write and console methods during command execution', and the tee
          should be installed 'early in packages/daemon/src/index.ts before createServer()' so it
          sits 'beneath that interception'.


          Actual code: command.ts installs the interceptors ONCE at module load (lines 89-165:
          originalConsoleLog/originalStdoutWrite captured at import time, console.log/warn/error and
          process.stdout/stderr.write permanently replaced) and routes per-call via
          commandExecutionStorage (AsyncLocalStorage). There is no wrap/unwrap per command
          execution.


          Consequence: index.ts statically imports server.js (index.ts:10), which statically imports
          command.js (server.ts:46), so the interceptors are already installed before ANY index.ts
          body code runs. A tee that wraps console.* 'before createServer()' is therefore installed
          ABOVE the interception — every console call hits the tee first, including calls made
          during command execution, so captured command output IS double-logged into the daemon log.


          Fix the How: to get the tee beneath the interception, the logger module must be loaded
          BEFORE command.ts captures the originals — e.g. a side-effect import of the logger as the
          first import in index.ts (above the server.js import), or wrap only
          originalStdoutWrite-equivalent targets, or make the tee skip when a command-execution
          capture store is active (requires exporting an is-capturing check from command.ts). The
          current instruction cannot achieve the stated goal.
        created_at: 2026-06-10T14:44:02.597Z
    kind: blocker
  - _ulid: 01KTRZV3VPN07XZTXGH3QA9NCF
    anchor:
      type: structured
      ref: "@task-command-dispatch-timeout"
      section: description
    entries:
      - _ulid: 01KTRZV3VP98ZT5PQGPGNJJ662
        author: "@claude"
        body: >-
          The How section instructs: 'On timeout: restore the intercepted globals exactly as the
          normal finally path does.' No such restore path exists — this directs the implementer to
          replicate a mechanism that is not in the code.


          Actual code: the console/stdout/stderr/process.exit interceptors in
          packages/daemon/src/routes/command.ts are permanent module-load installs routed per-call
          via AsyncLocalStorage (commandExecutionStorage); executeCommand (lines 231-316) has no
          finally that restores globals. The working directory is also ALS-scoped
          (runWithWorkingDirectory in src/parser/yaml.ts:91 uses workingDirectoryStorage.run — no
          process.chdir, nothing to restore). The DispatchMutex doc comment claiming executeCommand
          'mutates process-global state (process.cwd(), ...)' is itself stale relative to the ALS
          implementation.


          The good news is the design is simpler than the task fears: on timeout there is nothing to
          restore — releasing the mutex slot is sufficient for global state, and the ALS capture
          store already keeps late writes scoped (as the task correctly says to verify with a test).
          Rewrite the How to describe the actual model so an implementing agent is not sent hunting
          for a nonexistent restore sequence.
        created_at: 2026-06-10T14:44:05.110Z
    kind: blocker
  - _ulid: 01KTRZV660447RRZ8S90A65C20
    anchor:
      type: structured
      field: ac-command-timeout
      ref: "@task-update-daemon-reliability-specs"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTRZV660ZCAQR0RD98RGXG12
        author: "@claude"
        body: >-
          The proposed ac-command-timeout promises 'commands submitted afterward still execute
          normally', but the design in @task-command-dispatch-timeout does not deliver that for
          mutating commands after a hung MUTATING command.


          Mutating commands run inside withFileLock within the mutex slot (command.ts:638-643).
          Promise.race releases the mutex slot on timeout, but the abandoned execution still holds
          the cross-process file lock until it actually completes — which for a genuinely hung
          command is never. Subsequent mutating commands will then block on lock acquisition and
          fail with a lock timeout (src/parser/file-lock.ts DEFAULT_TIMEOUT_MS), which is not
          'execute normally'.


          Either scope the AC (e.g. 'subsequently submitted commands are accepted and read commands
          execute normally', or limit the guarantee to non-mutating commands), or have the design
          address lock abandonment explicitly. As written, an honest test of this AC with a hung
          mutating command would fail.
        created_at: 2026-06-10T14:44:07.488Z
    kind: question
  - _ulid: 01KTRZV8FG1N19JE9P4XCSCS6H
    anchor:
      type: structured
      field: ac-bounded-rotation
      ref: "@daemon-log-capture"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTRZV8FGVSXV4AHF7Y6XTEMF
        author: "@claude"
        body: >-
          ac-bounded-rotation asserts the combined size of retained log files 'never exceeds twice
          the configured maximum size', but @task-daemon-log-capture's How prescribes 'check size
          before each append and rotate synchronously when the limit is reached'. With
          check-before-append, the active file can exceed the limit by up to one write (the write
          that lands when size is just under the limit), so active + one retained generation can
          exceed 2x by up to one write's length — a strict test of the AC as worded can fail.


          Either soften the AC bound (e.g. 'never exceeds twice the configured maximum plus one
          write') or change the guidance to rotate before a write that would cross the limit. Pick
          one so the AC and the prescribed mechanism agree.
        created_at: 2026-06-10T14:44:09.840Z
    kind: question
  - _ulid: 01KTRZVAWP9KX5G5P1A3ZVDBDS
