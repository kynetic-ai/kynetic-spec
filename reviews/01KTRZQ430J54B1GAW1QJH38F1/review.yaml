          daemon.port/host/connect_host/auto_start) lives in src/parser/config.ts; new daemon config
          keys belong there. Same correction applies to @task-command-dispatch-timeout's
          daemon.command_timeout_ms mention.
        created_at: 2026-06-10T14:44:12.310Z
    kind: nit
