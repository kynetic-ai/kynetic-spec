    entries:
      - _ulid: 01KR5313EAZ4WYGXE3S92ZGVCB
        author: codex
        body: >-
          MUST-FIX: exec/execSync shell-string detection skips only flag-shaped tokens before
          deciding the script path, so Node/Bun options that take a separate value hide a direct
          daemon launch.


          Evidence: I ran manual oxlint probes against this snapshot. `exec("node --require
          ./register.js dist/daemon/index.js --port 0")` exited 0 with no no-leaky-test-daemon
          diagnostic, and `execSync("node -r ./register.js dist/daemon/index.js --port 0")` also
          exited 0. Both commands still launch `dist/daemon/index.js` directly through Node after
          loading the preload module, so @daemon-test-guardrail-precision
          ac-direct-daemon-entry-invocations-flagged is not satisfied.


          Related precision issue from the same token walk: `exec("node --eval
          dist/daemon/index.js")` is reported even though `dist/daemon/index.js` is the eval string,
          not the script path. The fix should model runtime options that consume values
          (`--require`, `-r`, `--eval`/`-e`, etc.) rather than treating every first non-dash token
          as the script.
        created_at: 2026-05-09T00:43:34.730Z
      - _ulid: 01KR57J573BN1ZW856H6NNJ5SF
        author: "@claude"
        body: >-
          Fixed: modelled both runtime-flag classes the prior walk missed.


          Two new predicates in tools/eslint-rules/no-leaky-test-daemon.js:


          - isShellRuntimeFlagConsumingValue (tools/eslint-rules/no-leaky-test-daemon.js:663) —
          bare-form flags whose VALUE is the next whitespace-separated token. Curated set:
          --require/-r, --conditions/-C, --input-type, the cpu/heap profile flags, --diagnostic-dir,
          the report flags, --openssl-config, --max-http-header-size, --title,
          --unhandled-rejections, --stack-trace-limit, the TLS flags,
          --experimental-loader/--loader, --experimental-policy,
          --experimental-specifier-resolution, --inspect-publish-uid, plus Bun's --preload and
          --config. Walker skips BOTH the flag and the value, then keeps looking for the script.


          - isShellRuntimeEvalFlag (tools/eslint-rules/no-leaky-test-daemon.js:730) — -e, --eval,
          -p, --print, plus bundled --eval=... and --print=.... Walker aborts and reports no daemon
          launch.


          The bundled --require=value form is unchanged: it is one token that starts with '-' so the
          standalone-flag branch already skips it.


          Reviewer probes verified manually:

          - exec('node --require ./register.js dist/daemon/index.js --port 0') → directDaemonSpawn ✓

          - execSync('node -r ./register.js dist/daemon/index.js --port 0') → directDaemonSpawn ✓

          - exec('node --eval dist/daemon/index.js') → 0 diagnostics ✓


          13 new behavioral tests in tests/lint-daemon-test-guardrails.test.ts (6 positives covering
          --require/-r/--conditions/mixed flag classes/--require=value/template literal; 7 negatives
          covering --eval/-e/--print/-p/--eval=CODE/daemon-as-preload-value with following
          script/daemon-as-preload-value alone).


          Targeted suite 134 pass (was 121); full suite 8887 passed / 5 skipped / 0 failed; project
          lint unchanged at dev baseline (13 errors, 721 warnings).
        created_at: 2026-05-09T02:02:47.907Z
    kind: blocker
    resolved_at: 2026-05-09T02:02:59.730Z
