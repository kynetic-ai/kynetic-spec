        body: "Fixed in 8d1c789e0d. Added explicit vi.fn type parameters to the hoisted mockState.
          resolveTaskDataManager now has the data-manager factory signature (vi.fn<(...args:
          unknown[]) => { loadAllTasks: (...args: unknown[]) => Promise<MockTask[]> }>());
          initContext/loadMetaContext are typed (...args: unknown[]) => Promise<unknown>;
          runInvocation keeps an any[] arg signature so the captured InvocationOptions (including
          optional env) stay inspectable in assertions. npx oxlint
          tests/daemon-automation-spawner-wiring.test.ts now reports 0 warnings/0 errors; typecheck
          and the 12 spawner tests still pass."
