    entries:
      - _ulid: 01KNJ154828PPZFZMWFKSSE7JG
        author: Jacob Chapel
        body: "When two module files are invalidated in the same debounce window, this insertion-offset
          logic reorders later changed files behind untouched files. I reproduced it against the
          snapshot with a throwaway project containing modules a/b/c: after changing a.yaml and
          b.yaml together, cache.getItemIndex() became a:A2,c:C1,b:B2 instead of preserving the
          original a,b,c file order. That violates the index consistency/full-reload equivalence
          expected for batched item updates and is not covered by the new tests, which only exercise
          single-file invalidations."
        created_at: 2026-04-06T18:33:51.618Z
      - _ulid: 01KNJ2GW0BC3F8D2SVX0NS8E72
        author: Jacob Chapel
        body: Fixed in commit 89a854716. Incremental item patching now rebuilds the item index by manifest
          include order instead of reinserting changed-file slices with offset math, so batched
          changes to multiple module files preserve the same file ordering as a full reload. Added a
          regression test that updates alpha.yaml and beta.yaml in one debounce window and verifies
          the resulting index order remains alpha, beta, gamma.
        created_at: 2026-04-06T18:57:44.971Z
    kind: blocker
    resolved_at: 2026-04-06T18:57:51.085Z
    resolved_by: Jacob Chapel
