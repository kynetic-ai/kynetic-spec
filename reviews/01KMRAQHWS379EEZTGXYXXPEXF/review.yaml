    entries:
      - _ulid: 01KMRB6E540589YTB50DKTXEDR
        author: "@claude"
        body: "Unknown commands bypass Commander entirely here, so the API no longer returns the same stderr
          that direct CLI execution produces. `node dist/cli/index.js nonexistent-command` prints
          `error: unknown command 'nonexistent-command'` followed by `Run 'kspec help' to see
          available commands`, but this branch returns only `Unknown command:
          \"nonexistent-command\"`. That breaks @daemon-command-api ac-response-parity for invalid
          commands and drops the standard help/suggestion path."
        created_at: 2026-03-27T19:09:05.060Z
      - _ulid: 01KMRDK69TW1XXV38BZ6M783NT
        author: "@claude"
        body: "Fixed: Removed the early findCommand() bail-out that bypassed Commander for unknown commands.
          Now unknown commands flow through to parseAsync() where Commander's 'command:*' handler
          fires, producing the exact same stderr output (error message + help suggestion) as direct
          CLI execution. The exit interceptor converts process.exit() to BatchExitError, and stderr
          is captured by the console.error interceptor. Added regression test comparing API stderr
          against CLI subprocess output for unknown commands."
        created_at: 2026-03-27T19:51:00.154Z
    kind: blocker
