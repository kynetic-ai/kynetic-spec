        author: Test User
        body: "This narrows the agents topic too far: the daemon also broadcasts sync_state on that topic
          when dispatch enters or exits degraded mode, but this new fallback returns no invalidation
          for anything except agent_invocation. The automation page reads queryKeys.agents.status()
          and relies on centralized queryKeys.agents.all invalidation for those status changes, so
          degraded or recovered state will stop appearing until some unrelated agent lifecycle event
          happens. Evidence: packages/daemon/src/routes/agent-dispatch.ts broadcasts event.type on
          the agents topic, src/agent-runtime/dispatch.ts defines that type as sync_state, and
          packages/web-ui/src/routes/automation/+page.svelte does not manually invalidate agent
          status on agents events."
        created_at: 2026-03-30T23:40:03.759Z
      - _ulid: 01KN0JS17JVGK5J6T7ZD5C70KR
        author: Test User
        body: Fixed in 5bc377fbb. The agents-topic handler now treats non-session status broadcasts like
          sync_state as agents-cache invalidations, while keeping
          message_complete/thinking_complete/tool_call_complete scoped to sessions-only
          invalidation. I also added focused tests proving sync_state refreshes agents.all without
          touching sessions.all.
        created_at: 2026-03-30T23:55:29.906Z
