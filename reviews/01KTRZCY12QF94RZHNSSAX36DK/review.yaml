threads:
  - _ulid: 01KTRZG1VEZGKY5DF90HXHV1VZ
    anchor:
      type: structured
      ref: "@task-format-version-ceiling"
      section: tasks
    entries:
      - _ulid: 01KTRZG1VE9A0ZGRM0V7NKYEDK
        author: "@claude"
        body: "The task says to add the format ceiling check in initContext after the manifest is parsed,
          but in the current shadow-mode path initContext can run pre-read shadow sync before it
          finds/parses the manifest. Evidence: src/parser/yaml.ts:783-836 may call
          hasRemoteTracking/shadowNeedsSync/shadowPull, while manifest lookup/parsing happens later
          at src/parser/yaml.ts:838-845. That conflicts with @data-format-forward-compatibility
          ac-newer-version-refused/ac-daemon-structured-error, which require refusal before
          reads/mutations and no project data modification. The plan needs to explicitly require an
          early manifest read/check before shadow sync or otherwise prove sync cannot modify project
          data for newer-than-supported manifests."
        created_at: 2026-06-10T14:38:02.606Z
    kind: blocker
  - _ulid: 01KTRZG4GZRRECWREP39GVBJY3
    anchor:
      type: structured
      field: Covers
      ref: "@task-shadow-restore-loud-failure"
      section: tasks
    entries:
      - _ulid: 01KTRZG4GZWPNC9XQZFZVK8VGH
        author: "@claude"
        body: The task claims coverage for @broken-shadow-safety ac-restore-failure-reports-state, but that
          AC is not present on the existing spec today (`kspec item get @broken-shadow-safety` shows
          only ac-preserve-on-failure, ac-bootstrap-reuses-repair, ac-context-fails-fast, and
          ac-no-root-fallback), and the plan Specs section does not carry the @broken-shadow-safety
          delta as spec content. This fails cross-reference validation for the Covers line and
          leaves the new behavioral contract reviewable only as task prose. Move the AC delta into
          the plan's spec changes for @broken-shadow-safety, or otherwise make the plan's
          spec-update mechanism explicit enough that the referenced AC exists before
          implementation/testing annotations rely on it.
        created_at: 2026-06-10T14:38:05.343Z
    kind: blocker
  - _ulid: 01KTRZG73Q7GHC0C1611HZWXHC
    anchor:
      type: structured
      field: ac-dynamic-values-discrete-args
      ref: "@subprocess-argument-literalness"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTRZG73Q7ZVF3GSH0FS60HH3
        author: "@claude"
        body: "This AC asserts the internal launch mechanism: dynamic values are passed as discrete argument
          elements rather than shell-parsed strings. That is an implementation detail, not an
          observable behavior, and it risks driving source-scanning or spawn-argument tests instead
          of behavioral tests. Keep the args-array requirement in the task How section, but rewrite
          the spec AC around observable safety outcomes, such as metacharacters in
          branch/remote/revision/timestamp values being treated literally with no command execution
          or command-shape change."
        created_at: 2026-06-10T14:38:07.991Z
    kind: question
  - _ulid: 01KTRZGATY5CBTYEBC5JFVM0AJ
    anchor:
      type: structured
      field: Testing
      ref: "@task-format-version-ceiling"
      section: tasks
    entries:
      - _ulid: 01KTRZGATYBS3TB604BYMJYQH0
        author: "@claude"
        body: "The testing guidance says to annotate with `AC: @data-format-forward-compatibility ac-N for
          each`, but this plan defines explicit AC IDs like ac-newer-version-refused and
          ac-daemon-structured-error, not ac-1/ac-2 numbering. Replace the placeholder with the
          exact IDs so a fresh worker does not create invalid or non-resolving AC annotations."
        created_at: 2026-06-10T14:38:11.806Z
    kind: question
