    entries:
      - _ulid: 01KVX46HF6D9KV4P4F2JM1JQQM
        author: Jacob Chapel
        body: "MUST-FIX: run-only positive evidence uses the producer code revision as the prior spec-text
          commit. `latestPositiveEvidenceVersion()` attaches `result.codeRevision` as `atCommit`,
          and `readCriterionFreshnessComparison()` prefers `atCommit` over `atTimestamp`. In real
          kspec projects, spec source lives in the shadow metadata repo while producer
          `code_revision` is the project code revision; the project commit object may be visible in
          the shared object store but it does not contain shadow paths (`git -C
          /home/chapel/Projects/kynetic-spec-dispatch/.kspec show
          981c807ffdee79f72422c1d3d85dc114c11337af:project.tasks.yaml` fails with
          path-not-in-commit). That means passing ingested evidence can be reported as
          `unknown_freshness` for AC text even when the timestamp could resolve the correct
          shadow-history version, so current evidence is sent to re-verify incorrectly."
        created_at: 2026-06-24T15:32:53.351Z
      - _ulid: 01KVX67AEE89WG7HRZKFZPXFVA
        author: Jacob Chapel
        body: "Fixed in f91fb3e401: latest ingested run evidence now contributes only its completed
          timestamp to spec-text freshness, so project producer code_revision is not used as a
          shadow spec commit. Added a regression with spec metadata in a separate git repo proving
          run-only evidence remains covered when timestamp comparison resolves the shadow criterion
          text."
        created_at: 2026-06-24T16:08:16.078Z
    kind: blocker
  - _ulid: 01KVX46NJNHEDB8A6S3H7QKQW9
    anchor:
      type: code
      commit: 981c807ffdee79f72422c1d3d85dc114c11337af
      line_end: 241
      line_start: 237
      path: src/parser/coverage-freshness-comparison.ts
      side: head
    entries:
      - _ulid: 01KVX46NJP04SAN12XETKFYWAQ
        author: Jacob Chapel
        body: "MUST-FIX: incomparable source revisions are classified as current. `git merge-base
          --is-ancestor <runRevision> <currentBlameCommit>` returning exit 1 only proves the run
          revision is not an ancestor of the current blamed line; it also covers diverged/unrelated
          revisions where the project cannot compare the run to the current source history. The task
          requires absent or unresolvable comparison metadata to degrade to re-verify with an
          unknown-freshness cause, but this branch returns `current` and can mark the criterion
          covered."
        created_at: 2026-06-24T15:32:57.558Z
    kind: blocker
