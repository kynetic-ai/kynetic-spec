    entries:
      - _ulid: 01KQYE4S4FHXNY0PPADPYK3QJ1
        author: Jacob Chapel
        body: "MUST-FIX: the CLI now imports its shared PID/endpoint implementation from
          ../daemon/endpoint.js, which compiles to dist/cli/pid-utils.js importing
          dist/daemon/endpoint.js. scripts/build-daemon.cjs deletes dist/daemon during npm run
          build:daemon, so any concurrent CLI subprocess can fail while that directory is absent.
          Impact: the full test suite now has a race where unrelated CLI tests crash with
          ERR_MODULE_NOT_FOUND for dist/daemon/endpoint.js, and installed/runtime CLI commands can
          hit the same missing module during a daemon rebuild. Evidence: npm test -- --fresh failed
          in tests/task-unblock-prior-status.test.ts with Cannot find module
          'dist/daemon/endpoint.js' imported from dist/cli/pid-utils.js; the isolated rerun of that
          test passed, which matches a concurrent build/delete race. scripts/build-daemon.cjs:49-50
          removes dist/daemon before rebuilding it."
        created_at: 2026-05-06T10:43:08.559Z
      - _ulid: 01KQYFTWND20SRVK8RJVARRCZ8
        author: "@claude"
        body: "Fixed in cycle 3 commit 3ef22cbfd by moving the shared module out of dist/daemon's path.
          src/daemon/endpoint.ts → src/daemon-shared/endpoint.ts, so its tsc output is
          dist/daemon-shared/endpoint.js — owned exclusively by tsc. dist/daemon/ is now owned
          exclusively by scripts/build-daemon.cjs's esbuild stage; deleting and rebuilding
          dist/daemon/ no longer affects any CLI subprocess. src/cli/pid-utils.ts and
          packages/daemon/src/pid.ts re-export from the new path; packages/web-ui/vite.config.ts,
          tests/daemon-endpoint.test.ts, tests/web-ui/dev-server-daemon-endpoint.test.ts, and
          scripts/build-daemon.cjs's endpointSource constant updated to match. Verified empirically:
          deleted dist/daemon/ and confirmed dist/cli/pid-utils.js still resolves all four exports
          through dist/daemon-shared/endpoint.js. Full fresh test suite (npm test --fresh):
          2359/2359 suites pass, 8640 tests pass (5 skipped, 0 failures); the previously racy
          tests/task-unblock-prior-status.test.ts run is now stable under the same parallel test
          concurrency."
        created_at: 2026-05-06T11:12:41.644Z
    kind: blocker
    resolved_at: 2026-05-06T11:13:07.001Z
