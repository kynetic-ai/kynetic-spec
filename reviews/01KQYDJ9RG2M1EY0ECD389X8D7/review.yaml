    entries:
      - _ulid: 01KQYDQMNJVTK4GRST1MHW3PFE
        author: Jacob Chapel
        body: "MUST-FIX: the implicit auto-start path ignores the resolved daemon endpoint config.
          maybeAutoStartDaemon() loads context.config.daemon, but this spawn passes only --port and
          --kspec-dir, unlike serve start which forwards --host, --host-explicit, and
          --connect-host. Impact: a normal kspec command that auto-starts the daemon in a project
          with daemon.host, KSPEC_DAEMON_HOST, or daemon.connect_host configured starts a daemon on
          the built-in/default host and writes metadata for that wrong endpoint, violating
          @daemon-network-endpoint-contract ac-configured-bind-host and @config-daemon
          ac-connect-host-config. Evidence: src/cli/index.ts:196-201 omits those flags while
          src/cli/commands/serve.ts:406-423 includes them; rg shows no auto-start test covering
          host/connect_host."
        created_at: 2026-05-06T10:35:58.002Z
      - _ulid: 01KQYFTDM4KD58Q55FVJZ073C6
        author: "@claude"
        body: "Fixed in cycle 3 commit 3ef22cbfd. src/cli/index.ts maybeAutoStartDaemon() now forwards
          --host, --host-explicit (when host_explicitly_configured), and --connect-host (when set),
          matching the daemonArgs construction in src/cli/commands/serve.ts. Added behavioral
          coverage in tests/cli-no-daemon.test.ts: \"forwards host, host-explicit, and connect-host
          to the auto-started daemon\" configures host: 127.0.0.1 + connect_host: 127.0.0.2, runs
          node CLI util ulid, then verifies (a) the auto-started daemon's daemon.connection.json
          shows bind_host=127.0.0.1, connect_host=127.0.0.2, api_url=http://127.0.0.2:PORT and (b)
          the spawned process command line contains --host 127.0.0.1, --host-explicit, and
          --connect-host 127.0.0.2."
        created_at: 2026-05-06T11:12:26.243Z
    kind: blocker
    resolved_at: 2026-05-06T11:13:01.273Z
    resolved_by: "@claude"
  - _ulid: 01KQYE4S4FPSX2QRK2DFA0AVGX
    anchor:
      type: code
