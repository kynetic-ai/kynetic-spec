    entries:
      - _ulid: 01KMR96B4VD4KYB1ETCHCF7FXJ
        author: "@claude"
        body: The new @shadow-lazy-read-sync ac-daemon-bypass says daemon-served reads do not perform
          per-request drift-check, but this route still falls back to
          initContext(projectContext.path) on cache miss/degraded reads. initContext() consumes the
          default sync mode and runs shadowNeedsSync()/shadowPull() unless KSPEC_NO_SYNC is set, so
          daemon reads are still capable of triggering the drift-check path on a request. That means
          the new AC is broader than the current implementation instead of merely documenting it.
        created_at: 2026-03-27T18:34:04.827Z
      - _ulid: 01KMRCZ850ANN0AKE90AK8ACRC
        author: "@claude"
        body: 'Fixed: Added optional syncMode parameter to initContext() and updated all daemon GET route
          initContext calls to pass { syncMode: "skip" }. On cache-miss/degraded fallback paths,
          daemon reads now explicitly skip the drift-check. The syncMode override takes precedence
          over the module-level consumeSyncMode() state, so even if stale CLI sync state existed,
          daemon reads would still skip sync. POST/mutation routes are unchanged — they still use
          default initContext for shadow commits.'
        created_at: 2026-03-27T19:40:06.688Z
    kind: blocker
    resolved_at: 2026-03-27T19:40:17.376Z
    resolved_by: "@claude"
