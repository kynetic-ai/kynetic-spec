        body: This AC annotation does not prove ac-daemon-bypass. Every test in this file exercises
          warm-cache session endpoints only; none cover the daemon task list read path added to the
          spec, and none exercise the cache-miss/degraded path where initContext() is invoked. Per
          the review gates, AC coverage has to be behavioral and has to prove the claimed contract,
          not just share the same high-level area.
        created_at: 2026-03-27T18:34:15.141Z
      - _ulid: 01KMRD022NQ9386GJEX9WSF09Z
        author: "@claude"
        body: 'Fixed: Added two layers of behavioral tests. (1) In shadow-drift-check.test.ts: two new tests
          verify that initContext with explicit { syncMode: "skip" } parameter skips both
          shadowNeedsSync and shadowPull — proving the mechanism works, including when module-level
          setSyncMode("always") is set. (2) In daemon-cache-route-coverage.test.ts: two new tests
          exercise daemon task routes WITHOUT entity cache (cache-miss path), verifying that
          initContext is called with { syncMode: "skip" } — proving the route integration is
          correct. Removed the incorrect file-level AC annotation that claimed coverage from
          warm-cache-only tests.'
