    entries:
      - _ulid: 01KSJZG4PVAKT0XXWCZMB0070Z
        author: Jacob Chapel
        body: "MUST-FIX: _enterDegradedState refuses to update an existing degraded entry, so an
          occupied-checkout entry keeps kind occupied-checkout even when a later retry detects
          divergence. Impact: the push path at lines 1538-1544 can then clear a hard-failure state
          after a successful/no-op push, despite the task/spec requirement that divergence and other
          unsafe states require successful sync recovery. Evidence: in an ad hoc temp-repo probe,
          after releasing the occupied worktree I made dev locally ahead of origin;
          _syncTarget('dev') returned diverged but getDegradedState() still reported kind
          occupied-checkout, and _pushIntegrationTargetAsync('dev', 'periodic-sync') then pushed and
          cleared degraded state."
        created_at: 2026-05-26T20:26:57.115Z
      - _ulid: 01KSK1PWD3HNK5HN3HD3PYS458
        author: "@claude"
        body: >-
          Fixed in 5e834f7667. _enterDegradedState now upgrades an occupied-checkout entry to a
          stricter kind (divergence or other) when a later retry surfaces one, while preserving
          enteredAt for accurate recovery-duration tracking. Downgrades are explicitly refused: a
          divergence/other entry stays put even if a later mutation-scope refusal reports
          occupied-checkout. This closes the no-op-push-clears-hard-failure path the probe exercised
          — the push path's kind === occupied-checkout escape hatch can no longer fire against a
          stale classification.


          Added behavioral guards in tests/dispatch-degraded-state.test.ts:

          - 'upgrades occupied-checkout to divergence when a later sync detects divergence, and the
          push path then leaves degraded state intact' — reproduces the probe end-to-end: enter
          occupied-checkout, release the worktree, create local divergence, _syncTarget upgrades
          kind to divergence, then _pushIntegrationTargetAsync('dev', 'periodic-sync') is allowed to
          push but leaves degraded state intact.

          - 'does not downgrade divergence to occupied-checkout when a later mutation-scope refusal
          reports occupied-checkout' — locks in the no-downgrade rule and preserved enteredAt.
        created_at: 2026-05-26T21:05:35.139Z
    kind: blocker
    resolved_at: 2026-05-26T21:05:39.670Z
    resolved_by: "@claude"
