          ────────────────────────────────────────

          ULID:      01KMMB3S2ST4PH6VDGQ6PP067S

          Slugs:     daemon-entity-cache

          Type:      feature

          Maturity:  draft

          Implementation: in_progress


          ─── Description ───

          Server-side in-memory cache for entity data served by the daemon API.

          The cache uses a two-tier model: index data (summaries, counts,

          references) is kept hot in memory, while detail data (full content,

          notes, event logs) is loaded on demand when accessed. The file watcher

          drives cache invalidation — when shadow branch files change, affected

          data is selectively reloaded. Data domains load progressively so

          high-priority data is available before the full cache is ready.



          ─── Acceptance Criteria ───
            [ac-load-on-register]
              Given: a project is registered with the daemon

              When: the project's shadow branch directory is accessible

              Then: index-tier entity data is loaded into memory and available for
          serving

            [ac-serve-from-memory]
              Given: a project's index data has been loaded into the cache

              When: an API list or summary request arrives for that project

              Then: the response is served from the in-memory cache without reading
          files from disk or running git operations

            [ac-detail-on-demand]
              Given: a request arrives for a single entity's full detail

              When: the detail data is not in the cache

              Then: the detail is loaded from disk, served, and optionally retained
          in cache until the next invalidation

            [ac-watcher-invalidation]
              Given: the file watcher detects a change to a shadow branch file

              When: the changed file belongs to a registered project

              Then: the affected data domain is reloaded from disk and the cache is
          updated before any subsequent request is served

            [ac-granular-reload]
              Given: a file change affects only one data domain

              When: the cache processes the invalidation

              Then: only the affected domain is reloaded, not unrelated domains

            [ac-write-through]
              Given: a write operation mutates entity data through the daemon API

              When: the mutation succeeds and is committed to the shadow branch

              Then: the cache is updated with the new state before the response is
          sent, without waiting for the file watcher to detect the change

            [ac-concurrent-reads]
              Given: multiple API requests arrive concurrently for the same project

              When: the cache is populated

              Then: all requests are served from the same cached data without
          blocking on each other or triggering redundant loads

            [ac-reload-dedup]
              Given: multiple file changes arrive within a short window

              When: the cache processes the invalidation events

              Then: only a single reload is performed for each affected data domain,
          not one per file change event

            [ac-graceful-degradation]
              Given: the cache encounters an error loading entity data

              When: an API request arrives

              Then: the request falls back to direct file reading and the error is
          logged, rather than failing the request entirely

            [ac-project-isolation]
              Given: multiple projects are registered with the daemon

              When: one project's cache is invalidated

              Then: other projects' cached data is not affected or reloaded

            [ac-unregister-cleanup]
              Given: a project is unregistered from the daemon

              When: the project context is removed

              Then: all cached data for that project is released from memory

            [ac-session-bounded-index]
              Given: a project has more sessions than the configured retention window

              When: the session index is loaded or refreshed

              Then: only the most recent sessions (up to the configured limit) are
          retained in the index; older sessions are accessible on demand

          but not held in the cache

            [ac-session-stale-exclusion]
              Given: a session has active status but exceeds the stale session
          criteria (age and inactivity thresholds)

              When: the session index is loaded or refreshed

              Then: the session is not treated as active in the cached index

            [ac-warming-availability]
              Given: a project is registered and cache loading is in progress

              When: an API request arrives before loading completes

              Then: the request receives a response indicating the data is still
          loading rather than blocking until the full cache is ready

            [ac-progressive-loading]
              Given: a project begins cache loading on registration

              When: high-priority data domains finish loading before others

              Then: requests for loaded domains are served from cache immediately
          while remaining domains continue loading, Review entity cache tiered storage and watcher
          invalidation

