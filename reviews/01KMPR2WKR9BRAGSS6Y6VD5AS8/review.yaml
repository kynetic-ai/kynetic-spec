        author: "@claude"
        body: "This detail endpoint still calls initContext() before checking the detail tier, and then
          unconditionally falls back to loadAllItems() / loadPlans() for response enrichment.
          initContext() is not a cheap no-op here: it loads project config, detects shadow state,
          and may run shadow sync checks (src/parser/yaml.ts:512-610). That means a cache-hit
          task-detail request still performs disk/git work on every hit, which breaks the same
          ac-serve-from-memory / ac-detail-on-demand contract that cycle 5 fixed for list routes.
          The same eager-context pattern is still present in
          packages/daemon/src/routes/items.ts:397-463, so cached item-detail reads also miss the
          optimization target."
