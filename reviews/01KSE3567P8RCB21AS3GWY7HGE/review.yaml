      side: head
    entries:
      - _ulid: 01KSE3B6RW3DGCJK6RWJSKATWC
        author: Jacob Chapel
        body: 'MUST-FIX: `runUpgradePipeline` runs the plan/review/manifest storage migration block even
          after `runTaskStorageMigrationStep` has recorded a failed task migration. Because
          `runStorageManifestPromotionStep` only gates on the plan/review results, a failed task
          migration can still write `kynetic: "1.2"` and `task_storage.format: split` to the
          manifest. I reproduced this in a temp project by making `.kspec/tasks` a regular file so
          `task migrate --force` fails with ENOTDIR; `kspec upgrade --json` exited 3 but still
          returned `Storage manifest (kynetic 1.2)` as `done`, and the manifest on disk was promoted
          to 1.2. That violates the task requirement to update the 1.2 manifest only after
          successful migration and leaves a rerun in a misleading split/folder-declared state.'
        created_at: 2026-05-24T22:57:57.532Z
      - _ulid: 01KSE5GWK71YFWR1CENA4XZMCV
        author: "@claude"
        body: >-
          Fixed in 27cdba765e. `runUpgradePipeline` now captures the task migration step's status as
          `taskMigrationOk` and forwards it to `runAtomicStorageMigration`. When the task step
          fails, the orchestrator returns synthetic `skipped` step records for Plan storage folder
          migration, Review storage folder migration, and Storage manifest (kynetic 1.2) — the
          manifest writer is never called, so kynetic stays at 1.1 / task_storage.format unchanged.
          The dry-run path applies the same gate to `priorOk` so previews do not advertise a 1.2
          promotion the executing run would refuse.


          Regression: tests/upgrade-folder-storage.test.ts "upgrade leaves manifest at 1.1 when task
          storage migration fails" reproduces the reviewer's scenario (seeded monolithic task +
          `.kspec/tasks` replaced with a regular file → `task migrate --force` ENOTDIR) and asserts
          the manifest stays at 1.1 with no plan/review/resource declarations.
        created_at: 2026-05-24T23:36:00.871Z
    kind: blocker
    resolved_at: 2026-05-24T23:36:47.650Z
    resolved_by: "@claude"
  - _ulid: 01KSE3BNKXNN4MAP808D0KGTTT
    anchor:
      type: code
      commit: 1a6e365048c8cce438d0644aff4edfafe7925fbe
      line_end: 322
      line_start: 313
      path: src/parser/plan-folder-migration.ts
      side: head
    entries:
      - _ulid: 01KSE3BNKX6ABKJAD1WNMG3QVD
        author: Jacob Chapel
        body: 'MUST-FIX: `computePlanMigrationReport` only sets `partialLayout` when there are monolithic
          entries, and sets `alreadyMigrated` whenever there are no monolithic records. It never
          checks that preserved lean plan index entries have matching plan folders. I reproduced a
          legacy project with `project.plans.yaml` containing a lean `notes_count` entry but no
          `.kspec/plans/<ulid>/` folder; `kspec upgrade --json` succeeded, skipped plan migration as
          "no monolithic plans", promoted the manifest to 1.2, and then `kspec plan list --json`
          failed with `partial_entity_storage_layout`. Upgrade must detect/refuse or repair that
          partial layout before promoting the manifest.'
        created_at: 2026-05-24T22:58:12.733Z
      - _ulid: 01KSE5H6NJYGR92JN9F0XJZYGH
        author: "@claude"
        body: >-
          Fixed in 27cdba765e. `computePlanMigrationReport` now splits non-monolithic lean entries
          into `preservedLeanEntries` (folder exists on disk) and a new `orphanedLeanEntries`
          (folder missing) bucket. `partialLayout` is true whenever orphans exist; `alreadyMigrated`
          is false in that case. Without `--force` the apply step throws
          `partial_entity_storage_layout` (so the upgrade fails the plan step and the manifest stays
          at 1.1); with `--force` the rewritten index drops the orphans. Apply also no longer
          short-circuits on `entries.length === 0` when `partialLayout` is set, so the orphan-only
          remediation actually runs.


          Regression: tests/plan-folder-migration.test.ts "detects stale lean entries with no
          matching folder as partial layout" covers the module-level contract;
          tests/upgrade-folder-storage.test.ts "upgrade fails on stale lean plan index entry with no
          matching folder" reproduces the reviewer's scenario at the CLI surface.
        created_at: 2026-05-24T23:36:11.186Z
    kind: blocker
    resolved_at: 2026-05-24T23:36:52.117Z
    resolved_by: "@claude"
  - _ulid: 01KSE3C3A60VMJK86TV8E5P09Y
    anchor:
      type: code
      commit: 1a6e365048c8cce438d0644aff4edfafe7925fbe
      line_end: 273
      line_start: 264
      path: src/parser/review-folder-migration.ts
      side: head
    entries:
      - _ulid: 01KSE3C3A6HY4VRZNQES7PWFNH
        author: Jacob Chapel
        body: "MUST-FIX: the review migration has the same false already-migrated path as plans. Lean review
          index entries are classified as preserved, but `partialLayout` ignores preserved entries
          and `alreadyMigrated` becomes true when no monolithic review records remain. A stale
          `project.reviews.yaml` lean entry without `.kspec/reviews/<ulid>/review.yaml` would be
          promoted to `review_storage.format: folder`; subsequent review reads then fail with
          `partial_entity_storage_layout` instead of the upgrade detecting the broken layout up
          front."
        created_at: 2026-05-24T22:58:26.758Z
      - _ulid: 01KSE5HHB6X1R36YWZ15GVAWVV
        author: "@claude"
        body: >-
          Fixed in 27cdba765e. Symmetric fix to plan migration: `computeReviewMigrationReport` now
          splits lean entries into `preservedLeanEntries` (folder present) and `orphanedLeanEntries`
          (folder missing). The orphan case sets `partialLayout: true`, clears `alreadyMigrated`,
          and the apply step throws `partial_entity_storage_layout` without `--force`. With
          `--force` the rewritten review index drops the orphans.


          Regression: tests/review-folder-migration.test.ts "detects stale lean entries with no
          matching folder as partial layout" and tests/upgrade-folder-storage.test.ts "upgrade fails
          on stale lean review index entry with no matching folder".
        created_at: 2026-05-24T23:36:22.118Z
    kind: blocker
    resolved_at: 2026-05-24T23:36:56.623Z
    resolved_by: "@claude"
  - _ulid: 01KSE3CGVH6ZTXVSD7NH27RSGK
    anchor:
      type: code
      commit: 1a6e365048c8cce438d0644aff4edfafe7925fbe
      line_end: 40
      line_start: 37
      path: src/parser/migration-safety.ts
      side: head
    entries:
      - _ulid: 01KSE3CGVHRYD66A4RKZX6W8EH
        author: Jacob Chapel
        body: "MUST-FIX: production code now hardcodes developer-machine absolute paths under
          `/home/chapel/Projects/...`. This violates the project work-gate that hardcoded absolute
          paths are always must-fix, and it also ships local review-process policy into the CLI: any
          real project under those path prefixes can never run an executing folder-storage upgrade
          because `assertSafeMigrationTarget` refuses it even with `--force`. The task needed
          worker/test preflight protection for this plan; that should not be encoded as permanent
          product behavior with machine-specific paths."
        created_at: 2026-05-24T22:58:40.625Z
      - _ulid: 01KSE5HW0CK8H8HNCX4H4HJWH4
        author: "@claude"
        body: >-
          Fixed in 27cdba765e. `PROTECTED_LIVE_PROJECT_PATHS` is removed. The new
          `getProtectedLiveProjectPaths()` reads `KSPEC_PROTECTED_PROJECT_PATHS`
          (path-delimiter-separated absolute paths) from the environment. When the variable is unset
          or empty — the default — the tripwire is a no-op and every executing migration target is
          treated as safe, so real projects under any path prefix can run `kspec upgrade` normally.
          Workers / test harnesses that want preflight protection set the env var; the dispatch
          wrapper or test fixtures can configure it without baking developer-machine paths into
          product code.


          tests/migration-safety.test.ts now drives the tripwire from the env var (unset → empty
          list; configured → blocks matching root, nested worktree, and specDir-only). The
          protected-paths assertions in tests/plan-folder-migration.test.ts /
          tests/review-folder-migration.test.ts / tests/upgrade-folder-storage.test.ts remain —
          those are test-only isolation asserts proving fixtures live under `os.tmpdir()`, not
          production code.
        created_at: 2026-05-24T23:36:33.036Z
    kind: blocker
    resolved_at: 2026-05-24T23:37:00.990Z
    resolved_by: "@claude"
