    entries:
      - _ulid: 01KMR4XKMR5A1HY2VV1FNV83K3
        author: "@claude"
        body: "Blocking: the new ac-no-per-request-sync coverage does not actually prove the AC. These tests
          only assert response bodies from a warm mock cache; they never assert that initContext(),
          loadAll*, getShadowStatus(), or any git-backed helpers were avoided on the request path. A
          regression that quietly reintroduced per-request context/disk/git work while returning the
          same payloads would still pass this whole block, so the task is missing behavioral
          coverage for its main guarantee."
        created_at: 2026-03-27T17:19:24.312Z
      - _ulid: 01KMR5VC7B4Y9F0HK3HSSRZJ1Z
        author: "@claude"
        body: "Fixed: Added a comprehensive spy-based behavioral test that imports parserModule and
          shadowModule as namespace objects, spies on initContext, getShadowStatus, and
          hasRemoteTracking, then hits all 14 registered read routes and asserts none of the spies
          were called. This proves the AC beyond payload matching — a regression that silently
          re-introduced per-request git work would trigger the spy assertions. The test covers
          /api/tasks, /api/items, /api/inbox, /api/aggregation/tasks/summary,
          /api/aggregation/inbox, /api/search, /api/meta/agents, /api/meta/workflows,
          /api/meta/conventions, /api/meta/shadow, /api/meta/config, /api/meta/observations,
          /api/refs, and /api/plans."
        created_at: 2026-03-27T17:35:39.755Z
