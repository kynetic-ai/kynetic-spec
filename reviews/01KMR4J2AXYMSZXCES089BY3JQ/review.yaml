        author: "@claude"
        body: "Blocking: GET /api/meta/shadow is still a read endpoint in a route file explicitly named by
          this task, but it performs per-request shadow status and remote-tracking checks. This
          handler calls getShadowStatus() and hasRemoteTracking() on every request, and both helpers
          shell out to git/config checks in src/parser/shadow.ts. That still violates
          @daemon-read-path ac-no-per-request-sync for this endpoint and leaves one of the declared
          read-route migrations unfinished."
        created_at: 2026-03-27T17:19:22.760Z
      - _ulid: 01KMR5V9CT9BVK8Z3XTXV2AKVQ
        author: "@claude"
        body: "Fixed: /api/meta/shadow now serves from cached shadow info computed during meta domain load.
          getShadowStatus() and hasRemoteTracking() are called once at cache load time and stored as
          CachedShadowInfo. The route checks cache.getShadowInfo() before falling back to
          initContext. Same treatment applied to /api/meta/config via CachedProjectConfig.
          Behavioral spy test confirms neither initContext nor getShadowStatus nor hasRemoteTracking
          is called during read requests with warm cache."
        created_at: 2026-03-27T17:35:36.858Z
    kind: blocker
