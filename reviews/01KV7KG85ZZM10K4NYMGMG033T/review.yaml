    entries:
      - _ulid: 01KV7N4VSPX4RMN8XPMMRGGV1B
        author: Jacob Chapel
        body: "MUST-FIX: parseBlamePorcelain assumes git blame --line-porcelain records are separated by
          blank lines, but actual batched blame output for multiple -L ranges is contiguous: one
          header/metadata/source-line block is immediately followed by the next header. I verified
          this with a temp git repo using git blame --line-porcelain -L 1,1 -L 2,2; there was no
          blank separator between the first line's source content and the next commit header.
          Because this loop splits only on \"\\n\\n\", a same-file batch returns only the first
          blamed line and pads the rest with null. That violates @ac-freshness-resolution
          ac-multi-annotation-most-recent for multiple annotations in the same file: if line 2 was
          touched more recently than line 1, the resolver still picks line 1; if the first requested
          line is uncommitted, later committed annotations in the same file can be ignored as
          no-history. The new tests cover multi-annotation cases across separate files, but not
          several annotation lines in one file."
        created_at: 2026-06-16T07:25:46.678Z
    kind: blocker
