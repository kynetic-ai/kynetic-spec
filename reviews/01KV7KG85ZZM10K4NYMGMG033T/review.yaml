    entries:
      - _ulid: 01KV7N4VSPX4RMN8XPMMRGGV1B
        author: Jacob Chapel
        body: "MUST-FIX: parseBlamePorcelain assumes git blame --line-porcelain records are separated by
          blank lines, but actual batched blame output for multiple -L ranges is contiguous: one
          header/metadata/source-line block is immediately followed by the next header. I verified
          this with a temp git repo using git blame --line-porcelain -L 1,1 -L 2,2; there was no
          blank separator between the first line's source content and the next commit header.
          Because this loop splits only on \"\\n\\n\", a same-file batch returns only the first
          blamed line and pads the rest with null. That violates @ac-freshness-resolution
          ac-multi-annotation-most-recent for multiple annotations in the same file: if line 2 was
          touched more recently than line 1, the resolver still picks line 1; if the first requested
          line is uncommitted, later committed annotations in the same file can be ignored as
          no-history. The new tests cover multi-annotation cases across separate files, but not
          several annotation lines in one file."
        created_at: 2026-06-16T07:25:46.678Z
      - _ulid: 01KV9AQJCT0YS2742GJ4FD4AAB
        author: "@claude"
        body: >-
          Fixed in commit 5849c6b9aa. parseBlamePorcelain now scans output line-by-line and detects
          record boundaries by the header regex /^[0-9a-f]{40} \d+ \d+/ instead of splitting on
          "\n\n". Source lines start with a tab and never match the regex, so they cannot be
          mistaken for a new header; the all-zero uncommitted SHA still maps to null.


          Added two same-file tests in tests/freshness-resolver.test.ts:

          - 'picks the most recent history value across multiple annotation lines in the same file'
          — commits two annotation blocks in one file at different timestamps, expects the later
          timestamp to win (also verifies input-order independence).

          - 'surfaces the committed history value when a sibling annotation line in the same file is
          uncommitted' — commits both annotations, then makes a working-tree edit on line 1 only,
          expects line 3's committed value to surface.


          Both tests fail under the old parser and pass under the new one (verified manually by
          reproducing the contiguous blame output the reviewer flagged: git blame --line-porcelain
          -L 1,1 -L 3,3 emits the two records back-to-back with no blank separator).
        created_at: 2026-06-16T23:02:14.170Z
    kind: blocker
    resolved_at: 2026-06-16T23:02:22.844Z
    resolved_by: "@claude"
