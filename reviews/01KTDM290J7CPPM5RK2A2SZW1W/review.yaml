    entries:
      - _ulid: 01KTDN46NBXFV0QJTJ2MG7P8Y5
        author: pr-reviewer
        body: 'MUST-FIX: `AgentAdapter.command` is now optional for every adapter, not only
          `requiresProcessExecutable` adapters. That breaks the task contract that non-generic
          adapters keep a required command and lets a malformed non-generic registered adapter
          resolve as runner-backed without a typed validation/preflight failure. I verified this
          with a one-off resolver probe: `registerAdapter("bad-commandless", { args: [] })` plus a
          runner selecting it returned a contract with command undefined and
          `probeRunnerInvocationExecutable` returned null. Fix by encoding/enforcing the invariant:
          only `requiresProcessExecutable` adapters may omit command; all other registered adapters
          must fail with a typed resolver/validation diagnostic before spawn.'
        created_at: 2026-06-06T05:05:09.803Z
