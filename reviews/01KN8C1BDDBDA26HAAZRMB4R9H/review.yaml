threads:
  - _ulid: 01KN8C2JZY5GRWK40F2TJGJCT8
    anchor:
      type: structured
      field: ac-pull-target-periodic-deferred
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KN8C2JZYPWGZG6XDY0T6522Y
        author: "@claude"
        body: The plan rewrites ac-pull-target-periodic for per-target sync, but it leaves
          ac-pull-target-periodic-deferred unchanged. That untouched AC still says the whole
          periodic sync is deferred whenever any reviewer invocation is active, which directly
          conflicts with the proposed per-target behavior of skipping only the busy target and
          continuing to sync the others. Update or retire this AC and add a Covers reference for the
          task that changes it, otherwise the spec will contain incompatible contracts after
          derivation.
        created_at: 2026-04-03T00:32:18.430Z
    kind: blocker
  - _ulid: 01KN8C2K0DBH0JT68R12QHSZSX
    anchor:
      type: structured
      field: ac-divergence-log-guidance
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KN8C2K0DA6D6G97Q3Z2QJ8AV
        author: "@claude"
        body: The degraded-state rewrite leaves ac-divergence-log-guidance in its pre-multi-target form.
          After this plan, divergence is tracked per integration target, so the guidance log also
          needs to identify which target branch diverged; otherwise operators cannot tell which
          branch is blocking which queued work. Add this AC to the degraded-state rewrite task and
          to the implementation coverage, or the spec change is incomplete.
        created_at: 2026-04-03T00:32:18.445Z
    kind: blocker
  - _ulid: 01KN8C2K1BWFJGV3EAYSRAFYTB
    anchor:
      type: structured
      field: ac-unified-target-resolution
      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KN8C2K1BBVPN1SARZV39NN35
        author: "@claude"
        body: The proposed ac-unified-target-resolution is an implementation-structure assertion, not
          behavioral contract language. 'Push and pull paths resolve targets from the same active
          integration target set' and 'no independent per-path target state exists' describe
          internal architecture that a user cannot observe directly. Move this requirement into the
          spec description or implementation notes, and replace the AC with an observable outcome if
          you need testable coverage.
        created_at: 2026-04-03T00:32:18.475Z
    kind: blocker
  - _ulid: 01KN8C2K3G75T4FQRHEK82HG79
    anchor:
      type: structured
      ref: "@task-impl-active-target-set"
      section: dependencies
    entries:
      - _ulid: 01KN8C2K3GRNWWR55F0012Y6J6
        author: "@claude"
        body: "Dependency ordering is misaligned here: @task-impl-active-target-set is P1 but depends on
          @task-sync-unified-state-ac, which is P2. Either raise the spec-update task to P1 or lower
          the implementation task so the priority order matches the dependency graph."
        created_at: 2026-04-03T00:32:18.544Z
    kind: question
