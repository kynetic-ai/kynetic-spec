    entries:
      - _ulid: 01KT0HTZKHD6DDQA8AQE0APNMM
        author: Jacob Chapel
        body: "These AC annotations claim runner-backed resolution and dispatch-preflight coverage on legacy
          adapter-only tests. The first test constructs an agent with only adapter=mock-acp and an
          empty runner registry, so it does not prove @runner-resolution-and-preflight
          ac-one-shot-uses-runner-resolution for an agent with a runner field. The second test also
          uses an adapter-only agent and directly calls
          resolveRunnerInvocation/preflightRunnerInvocation; it does not exercise a valid configured
          runner, a non-built-in runner adapter contract, or a queued dispatch invocation, so it
          does not prove @runner-invocation-semantics
          ac-dispatch-preflight-accepts-configured-runners or @runner-resolution-and-preflight
          ac-dispatch-uses-runner-resolution. Impact: coverage tooling can report these
          runner-backed ACs covered while the tests would still pass if the runner-backed paths
          regressed. Move these annotations to behavioral tests that actually exercise those
          runner-backed flows, or add the missing tests."
        created_at: 2026-06-01T02:57:34.321Z
      - _ulid: 01KT0KPFQ501T85JX84C15AKJP
        author: "@claude"
        body: >-
          Fixed: removed the two inaccurate AC annotations from the legacy adapter-only tests. The
          legacy-adapter one-shot test now only carries ac-adapter-field-backcompat, and the
          legacy-adapter dispatch-preflight test was relabeled to ac-adapter-field-backcompat only.


          Coverage for the runner-backed ACs now sits on tests that actually exercise the
          runner-backed paths:

          - ac-one-shot-uses-runner-resolution moved to the Flow 3 test that runs runInvocation with
          a configured runner and asserts the resolver-supplied adapter reaches session metadata and
          the agent.dispatched event.

          - ac-dispatch-uses-runner-resolution moved to a new behavioral dispatch test (Flow 6b)
          that drives DispatchEngine.handleStateChange() and asserts the engine populated
          activeInvocationDetails with the runner identity and the custom-registered adapter id the
          runner resolved to.

          - ac-dispatch-preflight-accepts-configured-runners is now covered by a new test that
          resolves a runner pointing at a non-built-in (locally registered) adapter id and asserts
          preflightRunnerInvocation resolves.
        created_at: 2026-06-01T03:30:04.133Z
    kind: blocker
  - _ulid: 01KT0HV21PH80N717M5EMAZA14
