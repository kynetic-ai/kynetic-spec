    entries:
      - _ulid: 01KT0HV21PX12NWRTD6GA1EEEN
        author: Jacob Chapel
        body: "This annotation claims @runner-resolution-and-preflight
          ac-unknown-runner-blocks-before-spawn, but the test configures a known runner named gated
          and asserts a missing_secret failure. That is a different behavior from an unknown runner.
          Impact: the AC coverage record is inaccurate and could mask missing unknown-runner
          coverage. Remove this annotation or replace it with an annotation on a test that actually
          references an absent runner."
        created_at: 2026-06-01T02:57:36.822Z
    kind: blocker
  - _ulid: 01KT0HV4J70TGTZHTG56W1K7KF
    anchor:
      type: code
      commit: dacb75e03421617863403ed36dcfc31c0d8551e2
      line_end: 682
      line_start: 655
      path: tests/agent-runner-e2e.test.ts
      side: head
    entries:
      - _ulid: 01KT0HV4J7VDQJSM6M7YXM18G7
        author: Jacob Chapel
        body: "The task requires covering a runner-backed dispatch invocation that queues and starts with
          runner diagnostics visible through daemon status, but this test fabricates both
          activeInvocationDetails and queues by mutating dispatch-engine internals. The dispatch
          engine never selects an eligible task, resolves the runner contract, queues the
          invocation, or starts it. Impact: regressions in the actual dispatch queue/start path for
          runner-backed agents would not fail this end-to-end suite; only status serialization of
          injected data is tested. Please replace or supplement this with a behavioral dispatch
          setup that drives the daemon/dispatch engine through its public path until a runner-backed
          invocation is queued/active and then asserts the status payload."
        created_at: 2026-06-01T02:57:39.399Z
    kind: blocker
