    entries:
      - _ulid: 01KR736TP4PZ2M8QA6D0Y7DCD6
        author: Jacob Chapel
        body: 'MUST-FIX: cleanupCallbackBindingStatus skips any kill target that is declared inside the
          cleanup callback, so an unsafe callback-local value counts as scoped cleanup. I verified
          with a probe where a test does runKspec("serve start --detach --port 3456"), registers
          onTestFinished(() => { const pid = 12345; process.kill(pid, "SIGTERM"); }), then calls
          expect(true).toBe(true); oxlint exited 0 with no no-leaky-test-daemon diagnostic. That
          cleanup can only kill a stale literal, not the just-started daemon, so the detached start
          still violates ac-detached-cleanup-bound-before-observation. Callback-local cleanup
          targets need ownership validation too, or non-owned local values must not satisfy
          cleanup.'
        created_at: 2026-05-09T19:25:11.236Z
      - _ulid: 01KR7545Y4ZA9RF5Q77MJDPTNH
        author: "@claude"
        body: "Fixed: tightened callbackLocalKillTargetIsDynamic. The cleanup-binding analysis no longer
          skips callback-local kill targets unconditionally — it walks every VariableDeclarator and
          AssignmentExpression in the callback body that targets `name`, applies the new
          `isStaticLiteralExpression` classifier (which unwraps transparent wrappers), and rejects
          the binding when every value source is literal-only. Parameters of the callback are also
          rejected because the cleanup framework passes no useful arguments. The cycle-3 reviewer
          probe (`onTestFinished(() => { const pid = 12345; process.kill(pid, ...); })`) now
          produces `cleanupClosureUnbound`. Three regression tests lock this in: callback-local
          const literal, callback-local let + literal assign, and callback-local TS-asserted
          literal. The legitimate runtime-read shape (`const pid = readPidFromFile()` inside the
          callback) is preserved and covered by an allowed-narrow test."
        created_at: 2026-05-09T19:58:41.604Z
    kind: blocker
    resolved_at: 2026-05-09T19:58:44.997Z
    resolved_by: "@claude"
  - _ulid: 01KR736YG7ZNC1AZZVK78K1TT2
    anchor:
      type: code
      commit: 875a81d78c4b0c702a3d24d08789482c973d1584
      line_end: 847
      line_start: 837
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KR736YG7XNBWYRTWAC7ACHJQ
        author: Jacob Chapel
        body: 'MUST-FIX: extractRootCaptureIdentifierName treats transparent TypeScript wrappers as
          unverifiable kill targets. A safe pattern that captures the pid before cleanup, then uses
          a type assertion in the callback, is currently rejected: runKspec("serve start --detach
          --port 3456"); const pid = readPidFromFile() as number; onTestFinished(() =>
          process.kill(pid as number, "SIGTERM")); expect(true).toBe(true). I ran that oxlint probe
          and it exited 1 with cleanupClosureUnbound for <unverifiable kill target>. This violates
          the requirement to preserve safe cleanup cases; TSAsExpression/TSNonNullExpression and
          similar transparent wrappers should be unwrapped before falling back to
          UNVERIFIABLE_KILL_TARGET.'
        created_at: 2026-05-09T19:25:15.143Z
      - _ulid: 01KR754CG8F9E80M2K40ZA8B4N
        author: "@claude"
        body: 'Fixed: extracted `unwrapTransparentExpression` and threaded it through
          `extractRootCaptureIdentifierName`. The fixed-point loop now strips ChainExpression,
          ParenthesizedExpression, TSAsExpression, TSSatisfiesExpression, TSNonNullExpression,
          TSTypeAssertion, and TSInstantiationExpression at every step of the descent — both before
          and between MemberExpression unwraps. The cycle-3 reviewer probe (`onTestFinished(() =>
          process.kill(pid as number, "SIGTERM"))` with `const pid = readPidFromFile() as number`
          after the start) now passes oxlint clean. Five regression tests cover: TS as-cast, TS
          non-null assertion, stacked `((pid as number)!)`, the safe shape kept, and TS-cast on a
          member-expression target rooted in a pre-start binding (still rejected via the recovered
          root identifier).'
        created_at: 2026-05-09T19:58:48.328Z
    kind: blocker
    resolved_at: 2026-05-09T19:58:52.602Z
    resolved_by: "@claude"
