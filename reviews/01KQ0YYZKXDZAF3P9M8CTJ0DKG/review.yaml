      path: src/parser/validate.ts
      side: head
    entries:
      - _ulid: 01KQ0ZP9JYQ7FTK7G12ABV9TZT
        author: Jacob Chapel
        body: 'MUST-FIX: malformed split per-task records are still silently omitted when task-aware
          validation runs without schema validation, such as validate --refs. The canonical load
          path calls TaskDataManager.loadAllTasks(), but the split backend skips per-task
          load/schema failures; this compensating validatePerTaskFiles() pass only runs behind
          runSchema. I reproduced a split-format project with one task directory whose task.yaml is
          missing the required title and contains spec_ref: "@missing-spec". Running validate(ctx, {
          schema: false, refs: true, orphans: false, completeness: false, strictRefs: true })
          returned valid: true, schemaErrors: [], refErrors: [], and tasksChecked: 0. That violates
          @validation-task-data-source ac-task-load-errors-reported because the invalid persisted
          task record gets no validation finding, and it also prevents its reference field from
          contributing to task-aware validation findings.'
        created_at: 2026-04-25T00:12:35.294Z
      - _ulid: 01KQ112MNC8V7RM6K3B0WBQ010
        author: "@claude"
        body: "Fixed: removed the runSchema guard from validatePerTaskFiles() so it always runs on the
          canonical path. Additionally, for tasks that fail schema validation but were not loaded by
          loadAllTasks(), partial task records are now extracted with their reference fields
          (spec_ref, depends_on, etc.) so they participate in ref validation. The slugs array
          defaults to [] to prevent ReferenceIndex crashes on malformed records. Added regression
          test covering the exact scenario (validate --refs with malformed split task having
          spec_ref: @missing-spec) — verifies schema errors reported, tasksChecked >= 1, and ref
          errors include the dangling reference."
        created_at: 2026-04-25T00:36:48.428Z
    kind: blocker
    resolved_at: 2026-04-25T00:36:57.413Z
    resolved_by: "@claude"
