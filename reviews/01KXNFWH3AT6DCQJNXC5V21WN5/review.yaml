    entries:
      - _ulid: 01KXNH1MCABB8P751PNCVC0FRD
        author: Jacob Chapel
        body: "MUST-FIX — The internal status validator is not fail-closed: invocations and queued accept
          arbitrary values and the top-level schema uses passthrough. Both JSON status commands then
          spread the parsed object, so daemon-supplied paths or raw error text are emitted verbatim.
          Impact: this violates the exact internal-status contract and the task guarantee that
          response paths, cwd values, and raw daemon errors never cross the CLI boundary. Evidence:
          an executable status probe returned exit 0 and printed injected fields cwd=/secret/raw and
          error=raw daemon detail. Define and preserve the known existing status fields explicitly,
          reject unknown/malformed fields, and add a regression proving both status commands map
          such a response to the closed internal_error envelope without rendering the injected
          values."
        created_at: 2026-07-16T13:14:52.170Z
    kind: blocker
  - _ulid: 01KXNH1QNRTAQCCMAJ4GMAAB8C
