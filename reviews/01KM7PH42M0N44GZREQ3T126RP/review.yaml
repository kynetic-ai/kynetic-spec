      - _ulid: 01KM7PHTQDEZ3RXR7FY71EC1JZ
        author: Jacob Chapel
        body: "`listTasks()` now returns stale `notes_count`/`todos_count` values after note-only mutations.
          `INDEX_CHANGE_FIELDS` explicitly excludes those counters, so `mutateTask()` skips the
          index write when notes change, but split-mode listing still reads the counters from the
          index via `rawToSummary()`. That means adding a note updates `notes.yaml` while task
          summaries continue to report the old counts until a manual rebuild, which is a
          user-visible regression in any list/session output that shows note counts."
        created_at: 2026-03-21T08:00:27.373Z
    kind: blocker
