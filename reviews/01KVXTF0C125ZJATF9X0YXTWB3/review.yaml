    entries:
      - _ulid: 01KVXVDCFBKMZHV8H1MVXE6D8F
        author: Jacob Chapel
        body: "MUST-FIX: daemon-served spec/AC mutations can still leave coverage-state views stale.
          @coverage-state-events applies to coverage-state-affecting mutations, and the task
          explicitly includes spec/AC mutations. Route-driven item changes record only
          `spec_item_changed` (`src/parser/yaml.ts:2068-2077`), while command-route write-through
          suppresses the watcher fallback; this handler then invalidates only item detail/list and
          validation keys for `spec_item_changed`, with no `queryKeys.coverage.*` refresh and no
          typed `coverage_state_changed` payload. Adding/removing/changing an AC through the daemon
          can change coverage denominators/rows, but open coverage consumers will not refetch until
          some later broad refresh. The existing `spec_item_changed` UI test asserts this stale key
          set, so the gap is untested."
        created_at: 2026-06-24T22:18:34.859Z
      - _ulid: 01KVXWPDRQV140KTAAD3BCMJHF
        author: Jacob Chapel
        body: "Fixed in 40669a5a9a: spec_item_changed now invalidates coverage summary, the affected
          coverage item by canonical item ULID, and an item-scoped coverage criterion prefix so
          daemon-served spec/AC mutations refresh coverage consumers even when watcher fallback is
          suppressed. The ws-invalidation behavioral test now asserts those coverage keys for item
          mutations."
        created_at: 2026-06-24T22:40:59.671Z
    kind: blocker
    resolved_at: 2026-06-24T22:41:09.737Z
