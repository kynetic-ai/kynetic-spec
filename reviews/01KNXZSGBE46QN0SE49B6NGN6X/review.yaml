      - _ulid: 01KP5KKXTA8BG1YZ49465NJ9JR
        author: "@claude"
        body: "Fixed: scaffoldProjectConfig() now throws on validation failure instead of returning a
          validationError field. On fresh creation the broken file is deleted; on force overwrite
          the original is restored from backup. The setup and init command handlers check
          specifically for scaffold step failure and exit non-zero. Other non-critical step failures
          (like plugin marketplace) remain non-fatal to avoid breaking existing test contracts."
