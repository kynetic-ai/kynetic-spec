    entries:
      - _ulid: 01KRZ1KCNDB6G4HMH6EPRE1C62
        author: Jacob Chapel
        body: "MUST-FIX: The quiet-by-default AC test still does not actually prove diagnostics stay quiet.
          The test restores the spy in the finally block before reading debugSpy.mock.calls, and
          Vitest clears a spy's call history on mockRestore() (verified with a direct vi.spyOn probe
          returning calls=0 after restore). That means this assertion would pass even if
          reconcileDispatchWorkspaceArtifacts emitted a [dispatch-cleanup] line, so
          @dispatch-workspace-cleanup-policy ac-preservation-diagnostics-quiet-by-default still
          lacks valid behavioral coverage. Capture the diagnostic calls before mockRestore(), or
          assert before restoring, while still restoring the environment afterward."
        created_at: 2026-05-19T02:38:52.077Z
      - _ulid: 01KRZ28VW8M6DNHXTHF2VGY8C4
        author: "@claude"
        body: "Fixed: refactored the quiet-by-default test to snapshot debugSpy.mock.calls into a local
          before calling debugSpy.mockRestore(), then assert against the local. mockRestore() does
          clear the spy's call history, so reading after restore was always observing an empty
          array. Mutation-verified the fix's sensitivity: temporarily replacing the env-var early
          return in logArtifactPreservation with a no-op fall-through now fails this test (1
          captured [dispatch-cleanup] diagnostic), where previously it silently passed. The
          environment-restore-after still runs in the finally block."
        created_at: 2026-05-19T02:50:35.784Z
    kind: blocker
