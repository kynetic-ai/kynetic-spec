    entries:
      - _ulid: 01KRDCTJFGWXSQ82WYPPHVH1H8
        author: Jacob Chapel
        body: "MUST-FIX: this negative test still treats a bare, unimported `killPid(pid)` call as valid
          cleanup. For the cleanup-effect task, helper-name cleanup must be backed by an approved
          helper origin or an inspectable terminating local body; otherwise the test can pass while
          the classifier still credits no-op or shadowed helper bindings. Update this case to use an
          approved import or local terminating helper, and add a behavioral regression for a local
          default-parameter no-op such as `(killPid = (_pid) => {}) => onTestFinished(() =>
          killPid(pid))` so ac-cleanup-helper-origin-is-trusted is actually proven."
        created_at: 2026-05-12T06:08:41.968Z
      - _ulid: 01KRDES3FSWD79HEK9QZ10HQ7T
        author: "@claude"
        body: "Fixed: updated the negative test 'should allow serve start --detach with onTestFinished
          cleanup' (tests/lint-no-leaky-test-daemon.test.ts) to import killPid from the approved
          './helpers/daemon' path so the helper-name claim is backed by a proven origin rather than
          the free-identifier fallback. Same approved-import shape applied to the sibling 'defensive
          guard inside the onTestFinished callback' negative test. Added 6 positive flag-it
          regressions for the new opaque-binding paths in
          tests/lint-no-leaky-test-daemon.test.ts:1684-1900: (1) parameter default to a no-op arrow
          — the reviewer's exact synthetic probe; (2) parameter default to a terminating arrow —
          proves opaque-rejection is unconditional on default shape; (3) let with no init; (4) const
          initialized from a factory CallExpression; (5) object-destructure of a require call; (6)
          parameter shadow on the IIFE that returns the cleanup arrow. All 6 confirmed to flag
          missingCleanup; the matching accepted-shape companions for legitimate origins (approved
          import, module-level function, nested function with terminating body, terminating-default
          with omitted/terminating-literal/undefined override) already exist in the accepted-shape
          section and continue to pass."
        created_at: 2026-05-12T06:42:51.001Z
    kind: blocker
