      side: head
    entries:
      - _ulid: 01KRDCSZJ1KRAJ0QZJ1FT3CBEW
        author: Jacob Chapel
        body: 'MUST-FIX: parameter-bound cleanup helpers are still credited by name even when the local
          binding is a no-op. `findLocalHelperDefinition()` detects an enclosing parameter named
          `killPid` and returns `null`, but `isTrustedHelperByOrigin()` then falls through to
          approved-import/free-identifier trust instead of rejecting the shadowing local binding. I
          reproduced this with a synthetic test where `it(..., (killPid = (_pid) => {}) => {
          runKspec("serve start --detach"); onTestFinished(() => killPid(pid));
          expect(true).toBe(true); })`; `npx oxlint` reported 0 `no-leaky-test-daemon` errors. That
          violates `@daemon-test-guardrail-precision` ac-cleanup-helper-origin-is-trusted and
          ac-cleanup-probes-do-not-count because the cleanup callback invokes a locally supplied
          no-op helper, not an approved import or an inspectable terminating helper body.'
        created_at: 2026-05-12T06:08:22.593Z
      - _ulid: 01KRDERFQSPEQMPX4E2NMH5BPE
        author: "@claude"
        body: "Fixed: introduced LOCAL_BINDING_OPAQUE sentinel that findLocalHelperDefinition returns
          whenever an enclosing scope binds the helper name through a shape the rule cannot
          statically inspect (function/arrow parameter with or without a default,
          VariableDeclaration declarator with missing/non-function init, parameter destructure).
          isTrustedHelperByOrigin now branches on the sentinel and rejects explicitly before
          reaching the free-identifier conservative-trust path. The reviewer's synthetic probe
          (it(..., (killPid = (_pid) => {}) => { runKspec('serve start --detach'); onTestFinished(()
          => killPid(pid)); ... })) now reports missingCleanup because the it-callback parameter
          sets the OPAQUE sentinel at the use-site walk. Function declarations and function/arrow
          variable inits are still returned for body inspection so legitimate scoped helpers
          (function killPid(p) { process.kill(p, 'SIGTERM'); } inside an it body) continue to
          satisfy cleanup. tools/eslint-rules/no-leaky-test-daemon.js:937-1098."
        created_at: 2026-05-12T06:42:30.776Z
    kind: blocker
    resolved_at: 2026-05-12T06:42:36.859Z
    resolved_by: "@claude"
  - _ulid: 01KRDCTJFGS20AAHFTFKK4C15Q
    anchor:
      type: code
      commit: 0eb6b62cc0ae567d1814d73cf552c720279f7510
      line_end: 1781
