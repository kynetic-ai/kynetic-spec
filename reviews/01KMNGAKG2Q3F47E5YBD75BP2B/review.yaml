    entries:
      - _ulid: 01KMNGZ8Q1PXSTS5TRBSG5NG9S
        author: Test User
        body: task migrate returns before upgrading the manifest when project.tasks.yaml is empty or already
          lean-index-only. In a legacy kynetic 1.0 project, that leaves task_storage.format unset
          even though the command reports success, so the new resolveTaskDataManager() gate
          continues rejecting every task command and the user has no remaining activation path. I
          reproduced this by creating a legacy .kspec/kynetic.yaml plus an empty project.tasks.yaml,
          running KSPEC_SPEC_DIR=... kspec task migrate --force, and observing that the manifest
          stayed at 1.0 with no task_storage block. The early already_migrated returns need to
          perform the manifest upgrade too.
        created_at: 2026-03-26T16:52:18.273Z
      - _ulid: 01KMNJ1D0E0H29CH7X0KMXZ6K4
        author: "@claude"
        body: "Fixed: extracted the manifest upgrade into an upgradeManifestToSplit() helper function and
          called it from both early-return paths (empty tasks file and all-lean-index entries). The
          helper is now invoked in all three success paths: (1) rawTasks.length === 0, (2)
          toMigrate.length === 0 && alreadyMigrated.length === 0, and (3) the normal migration path.
          Added three new tests in legacy-format-detection.test.ts: one for empty tasks file
          manifest upgrade, one for all-lean entries manifest upgrade, and one confirming dry-run
          does NOT modify the manifest. All pass."
        created_at: 2026-03-26T17:10:56.782Z
    kind: blocker
    resolved_at: 2026-03-26T17:11:00.220Z
