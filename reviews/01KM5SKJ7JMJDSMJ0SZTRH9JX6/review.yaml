      - _ulid: 01KM5SNG7113J67V2DZMJSJMVA
        author: Jacob Chapel
        body: "This early return suppresses the manifest daemon deprecation warning whenever KSPEC_NO_DAEMON
          is set. That warning is not incidental daemon communication, and @config-daemon ac-4 still
          requires the CLI to emit it. Repro: in a temp project with a manifest daemon block,
          'validate' prints the warning with no env var, but prints nothing on stderr with
          KSPEC_NO_DAEMON=1."
        created_at: 2026-03-20T14:16:24.546Z
      - _ulid: 01KM5TM9PWABHJVQBK9YRQDB68
        author: Jacob Chapel
        body: Fixed in commit 7bc399755. maybeAutoStartDaemon() now loads context and emits the manifest
          daemon deprecation warning before honoring KSPEC_NO_DAEMON, so @config-daemon ac-4 still
          holds while incidental daemon communication stays suppressed.
        created_at: 2026-03-20T14:33:13.692Z
