    entries:
      - _ulid: 01KMWC40PWSYHJ07RN94CKZXVA
        author: Test User
        body: GET /api/search still has a reachable legacy response branch when q is omitted. The route
          schema makes q optional, and lines 92-97 return {results,total} directly instead of the
          unified {data,meta} envelope used by the loading and success paths. That breaks the
          contract this task is supposed to make universal for cache-backed read handlers and gives
          clients an inconsistent shape depending on whether the query string is present.
        created_at: 2026-03-29T08:42:12.060Z
      - _ulid: 01KMWCZP7ZPZ6WDSTTQ7GEEWX4
        author: "@claude"
        body: "Fixed: Wrapped the empty-q early return in wrapResponse() to match the envelope contract. The
          branch now returns {data: {results: [], total: 0, showing: 0}, meta: {cache_status:
          'ready'}} consistent with the loading and success paths."
        created_at: 2026-03-29T08:57:18.847Z
    kind: blocker
