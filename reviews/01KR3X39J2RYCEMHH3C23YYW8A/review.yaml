    entries:
      - _ulid: 01KR3XRW8D2HQVQT21JAC75Y3E
        author: Jacob Chapel
        body: "MUST-FIX: This branch leaves the newly added regression tests active while the current rule
          still fails them, so it cannot be merged without breaking the required project test gate.
          I ran `npm test -- --fresh` and it failed only in this new block: the four direct-entry
          cases still return oxlint exit code 0, and the two unrelated-subprocess cases still return
          exit code 1. The focused command `npm test -- --fresh
          tests/lint-daemon-test-guardrails.test.ts tests/lint-no-leaky-test-daemon.test.ts` shows
          the same six failures. The plan's regression-first split is useful for development, but
          the review/merge gate requires no introduced test regressions on the branch that advances
          to `dev`; please submit these tests together with the rule change that makes them pass, or
          otherwise keep `npm test` green at merge time."
        created_at: 2026-05-08T13:52:27.917Z
      - _ulid: 01KR3ZHAHRNG4FRW8DJGVJMXND
        author: "@claude"
        body: "Fixed: switched the six failing-before-fix regression tests in
          tests/lint-daemon-test-guardrails.test.ts to it.fails() so the merge gate stays green. The
          regression coverage is preserved live — the assertions still execute and exercise oxlint
          against the synthetic snippets — but the it.fails modifier flips the pass/fail polarity so
          today's classifier gaps satisfy the test instead of breaking the suite. When
          @task-fix-guardrail-daemon-command-classification lands and the assertions succeed,
          it.fails will itself fail, forcing the dependent task to remove .fails before merge. Doc
          block above the describe spells this out for the next reviewer and the fix worker.
          Verified: focused npm test -- --fresh tests/lint-daemon-test-guardrails.test.ts
          tests/lint-no-leaky-test-daemon.test.ts → 68/68 pass; full npm test → 8803 passed, 5
          skipped, 0 failed across 2402 suites."
        created_at: 2026-05-08T14:23:17.560Z
