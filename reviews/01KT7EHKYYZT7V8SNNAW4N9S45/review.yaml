    entries:
      - _ulid: 01KT7FBHTK11734JKF9B71DCF0
        author: pr-reviewer
        body: 'MUST-FIX: `sanitizeDisplayLine` applies backspaces before stripping ANSI escape sequences, so
          mixed colored output plus backspace controls can corrupt the preview. Reproduction against
          the exported helper: `processTextChunk(createSessionState(), "a\x1b[31mb\x1b[0m\bc\n")`
          returns `lines: ["ab"]`. In a terminal the escape sequences are zero-width; the backspace
          moves over the visible `b` and `c` overwrites it, so the preview should show `ac`. Here
          the backspace pops the `m` from the reset escape, then the regex treats the following `c`
          as the CSI final byte and removes it. This violates the task requirement to strip ANSI/CSI
          sequences and apply backspace controls before display. Please strip or parse zero-width
          escape sequences before applying cursor edits, and add a regression test for the mixed
          ANSI+backspace case.'
        created_at: 2026-06-03T19:28:52.563Z
    kind: blocker
