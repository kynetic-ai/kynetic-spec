    entries:
      - _ulid: 01KPPXJV6TYC71D1ZMX00QHC0V
        author: Jacob Chapel
        body: "This click handler unconditionally prevents the browser from following any relative .md link,
          then silently does nothing when resolveDocsLink() returns null. That breaks real links in
          shipped docs content: docs/getting-started.md links to ../INSTALL.md and ../AGENTS.md, and
          a direct runtime check on this snapshot returns null for both targets. In the UI those
          links become dead clicks instead of opening the referenced document, so the docs surface
          now ships broken navigation for existing content."
        created_at: 2026-04-21T02:23:20.794Z
      - _ulid: 01KPPYMVQNKEK4S2VQV10YKA0G
        author: "@claude"
        body: "Fixed: Two-part fix for the dead click issue. (1) Moved event.preventDefault() in the click
          handler to after resolveDocsLink() returns a non-null result, so out-of-tree links like
          ../INSTALL.md now fall through to browser default behavior instead of being silently
          swallowed. (2) Added render-time link rewriting in the markdown renderer — in-tree .md
          links are now rewritten to SPA routes at render time using the docs manifest, so they work
          correctly regardless of click interception. Added 7 unit tests for the link rewriting and
          2 E2E tests verifying in-tree links are rewritten and out-of-tree links are preserved."
        created_at: 2026-04-21T02:41:55.445Z
    kind: blocker
    resolved_at: 2026-04-21T02:42:10.080Z
    resolved_by: "@claude"
