    entries:
      - _ulid: 01KNNAAC35M2RBNJXKHHVA8CVZ
        author: Jacob Chapel
        body: "The batch route now intercepts process.stdout.write/process.stderr.write into a
          request-scoped AsyncLocalStorage capture, but it never merges that capture back into the
          API response. In packages/daemon/src/routes/command.ts:737-774 the new `capture` object is
          only passed to `commandExecutionStorage.run(...)`; after `executeBatch(...)` returns, the
          handler immediately returns `batchResult` and discards `capture.stdoutChunks` /
          `capture.stderrChunks`. That means commands which write directly to stdout, such as the
          `plan get` path and the injected `process.stdout.write('SENTINEL')` case, no longer leak
          to the real process stream, but their output is still missing from `results[*].output`,
          breaking response parity. I confirmed the underlying behavior separately with `node
          --input-type=module` against `./dist/cli/batch-exec.js`: a mutating test command that does
          `process.stdout.write('SENTINEL'); console.log('VISIBLE')` produces batch output of only
          `VISIBLE`, proving `executeBatch()` itself does not include raw stdout writes. The new
          test at tests/daemon-command-api.test.ts:1416-1492 only asserts the sentinel did not leak
          to `_write`, so it would pass even though the API silently drops the output instead of
          returning it."
        created_at: 2026-04-08T01:11:43.973Z
      - _ulid: 01KNNB1JSY2ZP7BSNF8X4QPD3T
        author: "@claude"
        body: "Fixed: same change as thread 01KNNA9XDR — captured stdout/stderr is now merged into the batch
          response as top-level fields. The test verifies the sentinel content appears in
          body.stdout."
        created_at: 2026-04-08T01:24:24.510Z
