    entries:
      - _ulid: 01KVCZEG9YW4SHAXAPSJ0Q2YE0
        author: Jacob Chapel
        body: "MUST-FIX: This AC-tagged test does not prove @mutation-event-coverage ac-1. The AC requires
          typed task events for creation, any state transition, and field changes, with prior/new
          status on transitions. This test only runs task add, task set with a title change, and
          task note, then asserts created/set/note_added payloads; it never executes a state
          transition through the command route. The task scope specifically calls out all
          transitions, including cancel, reset, and unblock, and those newly mapped actions would
          not fail this test if they stopped emitting events. Add behavioral command-route coverage
          for the transition actions in scope, at minimum the newly added cancel/reset/unblock
          mappings, and assert old_status/new_status on the resulting task_updated events."
        created_at: 2026-06-18T09:02:00.510Z
    kind: blocker
