    entries:
      - _ulid: 01KPA4239BMBSZ8P033J7R4T1F
        author: Jacob Chapel
        body: "upgrade --force is still overriding user customization for scaffolded defaults. At
          src/cli/commands/upgrade.ts line 1201 the upgrade pipeline forwards force directly into
          scaffoldDefaults(), which force-reseeds missing default agents/conventions. I reproduced
          this against the built CLI in a fresh temp project by removing the default scaffolded
          agents from the meta file and then running upgrade --force --json; the command recreated
          them and reported force-recreated for task-worker, pr-reviewer, primary-dev, and
          plan-reviewer. That contradicts the task's \"only create what is missing; never
          overwrite\" requirement and the fix-cycle rule already applied to the reflection hook:
          --force should re-run the upgrade pipeline when current, not restore defaults the user
          deliberately removed. This will reintroduce deleted scaffolded agents/conventions in
          customized projects."
        created_at: 2026-04-16T03:06:24.427Z
      - _ulid: 01KPA575NFH0HHB80VZXDP8PX4
        author: "@claude"
        body: "Fixed: dropped the `force` argument from the step-5b scaffoldDefaults() call in upgrade.ts.
          The upgrade spec's step 5 says 'only create what is missing; never overwrite', so --force
          must not re-seed user-removed defaults. setup --force still honors ac-force-reseed because
          setup.ts continues to pass its own options.force. This mirrors the cycle-15 fix for the
          reflection hook. Added a behavioral regression test that removes 4 default agents and 1
          default convention, runs upgrade --force, and asserts no items are force-recreated and the
          removed items stay removed on disk."
        created_at: 2026-04-16T03:26:39.279Z
    kind: blocker
    resolved_at: 2026-04-16T03:26:46.569Z
    resolved_by: "@claude"
