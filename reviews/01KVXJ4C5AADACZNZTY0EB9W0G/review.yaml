    entries:
      - _ulid: 01KVXK43AK85772BH6RZ5CZC9Y
        author: Jacob Chapel
        body: >-
          MUST-FIX: coverage-state reads can stay stale after source annotation files change.
          getCachedCoverageStateReadModel returns an existing model for the same root/scan-path key
          without reloading evidence, and the daemon invalidation paths added here only cover .kspec
          items/meta changes plus the ingestion route. The project watcher is constructed for
          .kspec, so edits under configured scan paths such as tests/*.ts do not trigger
          invalidateCoverageStateReadModelCache. I verified the cache behavior with an in-process
          reproduction: after changing the loader from no annotation evidence to covered annotation
          evidence without explicit invalidation, the second read returned the original not_yet
          counts and same:true. Impact: this violates @coverage-state-api-cache
          ac-cache-invalidation for source annotation file changes; /api/coverage/state/summary and
          detail endpoints can serve stale state until an unrelated .kspec/ingestion invalidation or
          daemon restart. Please add an invalidation path for configured annotation scan file
          changes, or make the cache key/validation account for source annotation freshness before
          returning a cached model.


          Evidence log: Files read: kspec-agents.md; packages/daemon/src/routes/coverage.ts;
          packages/shared/src/api.ts; packages/web-ui/src/lib/api-static.ts;
          src/daemon/entity-cache.ts; src/export/json.ts; src/export/types.ts;
          src/parser/coverage-state-read-model.ts; src/parser/coverage-evidence-index.ts;
          src/parser/coverage-state.ts; tests/coverage-state-api.test.ts;
          tests/coverage-state-read-model.test.ts; watcher/project-context code. Commands run: kspec
          task get; kspec item get @coverage-state-api-cache; kspec item get @trait-api-endpoint;
          git diff/log/status; rg AC annotations; npm run format:check; npm run lint -- --quiet;
          focused npx oxlint changed files; npm run typecheck; npm test; kspec validate
          --refs/--alignment/--completeness --warnings-ok; reproduction via npx tsx. Claims
          verified: worker gate claim verified by commands; AC annotations verified by rg and test
          inspection; stale-cache finding verified by code path plus reproduction. Categories
          searched: correctness, cache invalidation, error handling, static mode, pagination, test
          quality, integration. Shared guidance neutrality: not applicable; no shared/package
          guidance prose surfaces changed.
        created_at: 2026-06-24T19:53:41.972Z
      - _ulid: 01KVXMNEC5A61NYB0BN7AJVE9N
        author: Jacob Chapel
        body: "Fixed: added a coverage scan-path watcher for configured coverage.scan_paths so source
          annotation add/change/unlink events outside .kspec are forwarded to cache invalidation.
          The entity cache now treats project-root watcher events as coverage-state-only
          invalidation and evicts the read-model cache. Added regression coverage for watcher
          forwarding and read-model cache eviction."
        created_at: 2026-06-24T20:20:38.916Z
