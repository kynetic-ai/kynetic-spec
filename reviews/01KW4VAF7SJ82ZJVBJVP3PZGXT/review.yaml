      - _ulid: 01KW4VFCN1EPP88SEKRB40V8J5
        author: Jacob Chapel
        body: The stored plan has no Branch in `kspec plan get`, but the plan's own Branch gate says
          imported work must stay on `feat/ui-redesign`. If approved/derived as-is, derived tasks
          can target the default integration branch instead of the shared redesign stack. Set the
          plan branch metadata before approval, or revise the gate to match the intended lifecycle.
        created_at: 2026-06-27T15:34:21.601Z
    kind: blocker
  - _ulid: 01KW4VFFMZ86CJ5KFPPTT7BB7C
    anchor:
      type: structured
      field: traits
      ref: "@unified-spec-workspace-data-projection"
      section: traits
    entries:
      - _ulid: 01KW4VFFMZW78Y2WCYRZJT4ZDY
        author: Jacob Chapel
        body: "`@unified-spec-workspace-data-projection` declares `@trait-api-endpoint` and
          `@trait-error-guidance`, but the task coverage mapping only claims the spec's own eight
          ACs. Inherited trait ACs would be orphaned or silently untested after derive. Add a trait
          applicability table plus Covers entries for applicable inherited ACs, with explicit N/A
          rationale for non-applicable cases, or remove the traits if the spec will not implement
          them."
        created_at: 2026-06-27T15:34:24.671Z
    kind: blocker
  - _ulid: 01KW4VFJHNX7J7DP4EDDVWPCDN
    anchor:
      type: structured
      field: ac-coverage-source-of-truth
      ref: "@unified-spec-workspace-data-projection"
      section: acceptance_criteria
    entries:
      - _ulid: 01KW4VFJHNEWT7F3PK8408V8E9
        author: Jacob Chapel
        body: This AC says displayed coverage values use `covered/failing/not_yet/re_verify`, while existing
          `@coverage-state-presentation` defines rendered buckets as `covered`, `failing`, `not
          yet`, and `re-verify`. That mixes API enum spelling into a UI-facing AC and contradicts
          the existing presentation decision. Use the canonical presentation labels here, and keep
          enum spellings only in implementation notes or API-field wording if needed.
        created_at: 2026-06-27T15:34:27.637Z
    kind: blocker
  - _ulid: 01KW4VFNEW8K0JYY3ARTD67R48
    anchor:
      type: structured
      field: ac-four-bucket-tokens
      ref: "@spec-workspace-coverage-state-presentation"
      section: acceptance_criteria
    entries:
      - _ulid: 01KW4VFNEWJZKVR7YZVNM5M9N8
        author: Jacob Chapel
        body: This AC names `stale/drifted/spec-code` causes, but the completed coverage-state and
          resolution specs expose backend secondary causes such as stale spec text, stale
          annotation/mapping, stale test result, and unknown freshness. Please align the wording
          with the backend-provided cause classes, or state it generically as backend secondary
          re-verify causes, so the UI task does not invent an unsupported cause vocabulary.
        created_at: 2026-06-27T15:34:30.620Z
    kind: question
