    entries:
      - _ulid: 01KR79124XJE95A5VJFAMGGW7D
        author: Jacob Chapel
        body: "MUST-FIX: build timeouts still drop the stdout/stderr tails. Evidence: Node spawnSync with a
          timeout returns error.code=ETIMEDOUT and signal=SIGTERM while preserving captured stdout,
          but this branch checks result.error before the signal branch. That means
          describeCommandFailure returns only the ETIMEDOUT message and never reaches the
          stdout-tail/stderr-tail formatting for the exact timeout path this task is hardening.
          Impact: a wedged npm run build:daemon still lacks the diagnostics needed to debug the
          hang. Handle timeout/signal before generic result.error, or include tails in the error
          branch."
        created_at: 2026-05-09T21:06:53.725Z
      - _ulid: 01KR7ASAQ6DTR4F4ZC675J8ZN2
        author: "@claude"
        body: "Fixed: describeCommandFailure now classifies failures with tails always emitted. The new
          logic detects ETIMEDOUT (or any error+signal combo) explicitly and prepends a `timed out
          (... code=ETIMEDOUT)` summary while still appending stdout-tail and stderr-tail in every
          non-success path. Added a behavioral regression test in tests/daemon-build.test.ts that
          runs a real spawnSync against a 200ms timeout with a node child that prints markers and
          sleeps 30s, then asserts describeCommandFailure includes both marker-stdout-line and
          marker-stderr-line in the diagnostic message."
        created_at: 2026-05-09T21:37:37.509Z
    kind: blocker
    resolved_at: 2026-05-09T21:37:41.006Z
    resolved_by: "@claude"
  - _ulid: 01KR7915VY0FPGSSENXDX2MSXA
    anchor:
      type: code
      commit: ca08b2f2a2e706eaa17eac7be21d48536a2c6407
      line_end: 217
      line_start: 210
      path: tests/daemon-build.test.ts
      side: head
    entries:
      - _ulid: 01KR7915VY7EV3HGCEB5MJWC89
        author: Jacob Chapel
        body: "MUST-FIX: the smoke test still has an unbounded readiness fetch before the new bounded probes
          run. This startTestDaemon call uses health readiness; in the shared helper, probeHealth
          awaits fetch(.../api/health) and response.text() without an AbortSignal, and
          waitForStartup awaits probe() directly. If the daemon binds but stops responding during
          readiness, this test can still wait for the outer 180s Vitest timeout before any of the
          new boundedFetch diagnostics execute. Evidence: a never-settling probe using the same
          waitForStartup shape stayed pending past its configured timeout. Impact: the original
          full-suite hang class remains possible in the daemon-build path. Bound the readiness probe
          or make waitForStartup race each probe against the remaining timeout."
        created_at: 2026-05-09T21:06:57.534Z
      - _ulid: 01KR7ASHENDM8AKMJN483TQJ31
        author: "@claude"
        body: Fixed in two complementary ways. (1) probeHealth and probeCacheReady in
          tests/helpers/daemon.ts now route their fetch+text through a new boundedProbeFetch helper
          that uses AbortController with a 2s per-probe budget; an unresponsive daemon will surface
          as a `health fetch error=...` observation rather than a hung probe. (2) waitForStartup in
          tests/helpers/cli.ts now races each probe call against the remaining wait budget — if a
          future probe forgets to bound itself the wait still fails within timeoutMs with `probe did
          not settle within Nms remaining`. Added a behavioral regression test in
          tests/cli-agent-commands.test.ts (AC-3 describe block) that calls waitForStartup with a
          probe that resolves after 60s and asserts the wait throws within ~5s with the new
          diagnostic. Verified focused tests pass and full suite still green (2419 suites, 8981
          passed).
        created_at: 2026-05-09T21:37:44.405Z
    kind: blocker
    resolved_at: 2026-05-09T21:37:47.752Z
    resolved_by: "@claude"
