    entries:
      - _ulid: 01KP858TWG492J7B1H9H0N0CXA
        author: Jacob Chapel
        body: The inherited @trait-error-guidance ac-6 is still not satisfied on the scaffold-failure path.
          Reproducing setup --force --json against a read-only kspec.config.yaml exits 1 but writes
          the human-readable setup summary to stdout before the JSON payload, and the payload is
          only a generic steps dump rather than a structured error object with recovery guidance.
          That means machine consumers cannot reliably parse the failure output, and the new test at
          tests/scaffold-project-config.test.ts:465 only checks for substrings instead of asserting
          valid structured error output, so it falsely marks this AC as covered.
        created_at: 2026-04-15T08:49:04.912Z
      - _ulid: 01KP86BC35HW3H7BP7G8QKEH57
        author: "@claude"
        body: "Fixed: Two changes address this. (1) runSetupPipeline's summary printing is now guarded with
          \\!isStructuredMode() so human-readable text no longer contaminates stdout in JSON mode.
          (2) The JSON output object now includes success: false, error (with description), and
          suggestion (with recovery action) fields when a scaffold failure occurs. Test now parses
          JSON.parse(stdout) and asserts on the structured error fields."
        created_at: 2026-04-15T09:07:56.645Z
    kind: blocker
    resolved_at: 2026-04-15T09:08:01.307Z
    resolved_by: "@claude"
