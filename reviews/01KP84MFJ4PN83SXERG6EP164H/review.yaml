        body: The inherited @trait-error-guidance ac-6 is still not satisfied on the scaffold-failure path.
          Reproducing  against a read-only kspec.config.yaml exits 1 but writes the human-readable
          setup summary to stdout before the JSON payload, and the payload is only a generic steps
          dump rather than a structured error object with recovery guidance. That means machine
          consumers cannot reliably parse the failure output, and the new test at
          tests/scaffold-project-config.test.ts:465 only checks for substrings instead of asserting
          valid structured error output, so it falsely marks this AC as covered.
        created_at: 2026-04-15T08:48:40.325Z
