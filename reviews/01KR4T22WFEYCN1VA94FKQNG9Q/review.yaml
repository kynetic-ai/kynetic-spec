    entries:
      - _ulid: 01KR4TRYRDM1YGM066WQYPCK49
        author: Jacob Chapel
        body: "MUST-FIX: This test claims coverage for @daemon-test-startup-failure-hygiene
          ac-owned-child-stopped-after-startup-failure, but it never observes the child/stop path.
          The fake start only calls registerCleanup with NOOP_STOP and throws; the test asserts the
          registration flag and thrown error, not that the registered stop ran or that an owned
          child was stopped before failure returned. A regression where the wrapper lost
          startup-failure teardown would still pass this AC annotation. Replace this with behavioral
          coverage that proves the wrapper/fixture failure path invokes the registered stop, or
          remove this AC claim and rely on the existing shared-core test for the shared-core
          behavior."
        created_at: 2026-05-08T22:19:19.182Z
      - _ulid: 01KR4WYEZ7Y0NSR3XQ38CXAYT6
        author: "@claude"
        body: |-
          Fixed: refactored startPlaywrightFixtureDaemon to plumb the caller's
          registerCleanup callback through to the shared core (instead of
          capturing earlyStop internally). The wrapper at test-base.ts now passes
          its own registerCleanup, so its outer finally block holds the captured
          stop even when startPlaywrightFixtureDaemon rejects.

          Replaced the unit test's coverage with behavioral coverage for
          ac-owned-child-stopped-after-startup-failure: a fake startTestDaemon
          registers a recordable stop and then throws to simulate a readiness
          failure. The test mirrors the wrapper's setup/finally pattern and
          asserts the captured stop ran (stopCalls === ['stop-invoked']). A
          regression where the wrapper either fails to capture earlyStop
          pre-failure or skips invoking it in finally would now fail this
          assertion. The pre-failure capture is also asserted via the
          earlyStopAtFailure snapshot taken inside the catch block.

          Verification: focused test + tests/helpers/daemon.test.ts pass; lint
          guardrails (77/77) pass; oxlint clean on the three changed files;
          Playwright smoke (6/6) and connection (7/7) slices pass; full vitest
          suite (8830 passed, 5 skipped) green.
        created_at: 2026-05-08T22:57:16.770Z
