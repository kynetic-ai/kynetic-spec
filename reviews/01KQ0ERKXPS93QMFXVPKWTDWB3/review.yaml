threads:
  - _ulid: 01KQ0EVH15A0WVZFHCNHPH1N8B
    anchor:
      type: structured
      field: automation
      ref: "@plan-spec-catalog-health-and-validation-trust"
      section: tasks
    entries:
      - _ulid: 01KQ0EVH15A99NF8G0C5C8D404
        author: Jacob Chapel
        body: "The task YAML relies on automation: manual_only, and the implementation notes say all tasks
          are marked manual_only, but plan derive does not support that field for manual tasks.
          PlanTaskSchema only accepts title, slug, priority, description, tags, spec_ref, and
          depends_on, and buildTaskPlans does not pass automation into created tasks. The derived
          tasks would be unassessed, so the plan metadata promise is not derivable. Fix by adding
          supported derive behavior before approval, or remove the unsupported field and add an
          explicit post-derive batch/update step that sets manual_only."
        created_at: 2026-04-24T19:18:20.965Z
    kind: blocker
  - _ulid: 01KQ0EVM35TQFCMVZD9R8Z7GS0
    anchor:
      type: structured
      ref: "@task-validation-trust-final-gate"
      section: description
    entries:
      - _ulid: 01KQ0EVM35JJFA94JMRZZSS2V5
        author: Jacob Chapel
        body: "The final task makes seed and conversion-task linkage part of the implementation work: it
          requires notes on @cruft-01-spec-catalog-health-seed and
          @task-convert-cruft-01-spec-catalog-health-plan. Those are planning artifacts, not
          validation-trust behavior, and they make the derived task depend on background context
          instead of standing alone. Remove this linkage from the derived implementation task;
          perform any historical cross-linking outside the standalone plan or as a separate
          non-derived administrative step."
        created_at: 2026-04-24T19:18:24.101Z
    kind: blocker
