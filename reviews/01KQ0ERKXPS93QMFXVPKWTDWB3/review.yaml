        author: Jacob Chapel
        body: "This AC has a compound Then: skipped annotation-like text must produce neither coverage
          credit nor invalid annotation findings. Those are two independently testable outcomes and
          the review objective requires no compound Then clauses. Split this into separate ACs, then
          update the task Covers line so both new AC ids are explicitly covered."
        created_at: 2026-04-24T19:18:27.269Z
    kind: blocker
  - _ulid: 01KQ0EVTBFKFP8MGFEXGR26BQR
