      ref: "@task-validation-trust-final-gate"
      section: dependencies
    entries:
      - _ulid: 01KQ0EVTBFZ7GDSY7WJ38P0XRF
        author: Jacob Chapel
        body: The final gate is priority 1 but depends on @task-ac-annotation-repair-wave-one, which is
          priority 2 and depends on other priority 2 work. The dependency order is acyclic, but the
          priority ordering is inconsistent with execution order. Either lower the final gate
