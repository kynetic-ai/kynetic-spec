    entries:
      - _ulid: 01KP9DSSF5TJ2BMC3W60X74XZV
        author: Jacob Chapel
        body: >-
          The regeneration fast-path treats any existing  path as valid output, so a broken
          directory can suppress step 3 entirely. I reproduced this by initializing a temp project,
          replacing  with a directory while leaving  intact, and running {
            "success": true,
            "source_version": "0.12.0",
            "target_version": "0.12.0",
            "confidence": "exact",
            "is_refresh": false,
            "noop": true,
            "steps": [],
            "follow_ups": []
          }: the command exited 0, reported "Regenerate agent instructions" as skipped, and left the
          directory in place. That violates @single-command-version-upgrade
          ac-regenerates-agents-file because upgrade neither regenerates the auto-generated file nor
          reports the step as failed when the rendered artifact is invalid.
        created_at: 2026-04-15T20:37:23.557Z
      - _ulid: 01KP9ETQ2RKMAJMH6AJBJ84D5T
        author: "@claude"
        body: "Fixed: The regeneration fast-path now uses fs.stat() with isFile() instead of fs.access().
          When kspec-agents.md is not a regular file (e.g., a directory), it is removed and
          regeneration proceeds regardless of hash match. Added a dedicated test that replaces
          kspec-agents.md with a directory after a successful run and verifies recovery. Updated
          existing tests that relied on the EISDIR failure to use the skills directory corruption
          approach instead."
        created_at: 2026-04-15T20:55:22.456Z
    kind: blocker
    resolved_at: 2026-04-15T20:55:32.522Z
    resolved_by: "@claude"
