      - _ulid: 01KN8YZDNDCVGFGJFBDAP4NZTR
        author: Jacob Chapel
        body: Fixed in fcf063252. _syncTargetBranch now accepts an optional branch, startup and periodic
          reconciliation iterate the active target set via _syncActiveTargetBranches(), and
          pre-provision sync resolves the task-specific base branch before provisioning. Added a
          regression test that proves a non-base active target from the workspace registry is pulled
          on engine start.
