        body: "The pull path still ignores the active target set.  rebuilds and logs , but  immediately
          collapses back to  and fetches only that single branch. That means startup sync, periodic
          stale sync, and pre-provision sync still refresh only the configured base branch, so
          workspaces targeting branches like  can remain stale even though they are present in .
          Evidence:  shows  is only used for logging/status, and the only sync call sites (, , )
          still invoke  with no branch parameter."
