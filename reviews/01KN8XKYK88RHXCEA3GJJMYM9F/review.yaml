        author: Jacob Chapel
        body: "The push path also remains base-branch-only.  serializes one global push and resolves the
          target with , so periodic retry and post-merge push still operate only on the configured
          base branch rather than the active integration target that actually received the merge.
          This breaks the task's stated goal of a shared push/pull source of truth: non-base targets
          can be added to  but are never pushed. The current tests only assert helper/state
          exposure, not that a non-base active target is actually pushed."
