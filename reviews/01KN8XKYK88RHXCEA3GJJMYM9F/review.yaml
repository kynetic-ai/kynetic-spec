        body: Fixed in fcf063252. _pushIntegrationTargetAsync now accepts a target branch, uses per-branch
          in-progress serialization, reviewer post-merge pushes target
          workspace.metadata.integrationTargetBranch, and periodic reconciliation pushes every
          branch in _activeTargets. Added a regression test that proves plan/alpha is actually
          pushed during periodic reconciliation.
