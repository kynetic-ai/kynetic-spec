        author: Jacob Chapel
        body: "MUST-FIX: This AC is implementation-facing instead of behavioral. It requires the endpoint to
          be produced by the shared daemon endpoint resolver and lists internal CLI code categories,
          so the spec would test a mechanism rather than an observable contract. Move the
          shared-resolver requirement into implementation tasks, and rewrite the AC to require that
          CLI, status, scheduled, agent, event, task-event, and web UI development clients connect
          using the advertised daemon endpoint metadata/URLs rather than independently derived
          localhost defaults."
        created_at: 2026-05-05T19:58:59.868Z
    kind: blocker
