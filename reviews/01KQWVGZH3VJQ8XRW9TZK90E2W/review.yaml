    entries:
      - _ulid: 01KQWVJAE7J9P76ADQ1VKTM31Q
        author: Jacob Chapel
        body: "MUST-FIX: The task explicitly asks for a negative regression that scans production CLI source
          files for hardcoded URL strings. Project review rules reject source-scanning tests as
          invalid AC coverage because they inspect implementation text rather than exercising
          behavior. Replace this with behavioral coverage that proves all production client call
          paths use metadata, for example by seeding non-default or IPv6 metadata and exercising
          proxy, serve status, agent, event, schedule, task-event, and web UI dev endpoint paths. If
          a lint/static rule is desired, make it a separate non-AC quality guard, not AC coverage."
