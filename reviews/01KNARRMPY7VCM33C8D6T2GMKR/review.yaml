    entries:
      - _ulid: 01KNAS0YZ8PWSWDVEJ9SRH9ZJM
        author: Jacob Chapel
        body: The new ac-concurrent-merge-fix-cycle coverage never exercises the dispatch reviewer path
          described by the spec. After the stale push is rejected, this test creates a brand-new
          task/review and drives needs_work by calling kspec review verdict request_changes
          directly, so it would still pass if the reviewer invocation stopped handing a failed
          concurrent merge back into the normal fix-cycle flow. That leaves the AC unproven and can
          hide regressions in the real concurrent-merge recovery path.
        created_at: 2026-04-03T22:57:05.512Z
      - _ulid: 01KNASVEGJWPAGDBBNFXGF1382
        author: Jacob Chapel
        body: "Fixed in tests/dispatch-target-sync.test.ts. The regression now drives the actual reviewer
          invocation path: it creates a plan-scoped pending_review task targeting plan/alpha,
          provisions the canonical worker branch, forces a competing reviewer merge to advance
          origin/plan/alpha, leaves the local target on the stale second merge, then runs
          DispatchEngine._spawnInvocation() with a reviewer verdict inside the invocation. The
          assertion now proves the same task transitions to needs_work while the automatic
          post-merge push rejects non-fast-forward, so the AC is covered through the dispatch
          reviewer flow instead of a disconnected follow-up review command."
        created_at: 2026-04-03T23:11:33.394Z
