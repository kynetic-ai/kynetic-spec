      - _ulid: 01KVX9ZRH559ZZNY9AM6TE1BP0
        author: Jacob Chapel
        body: "MUST-FIX: annotation-only positive evidence with absent freshness metadata is silently marked
          covered. In compareCriterionTextFreshness(), latestPositiveEvidenceVersion() returns null
          when an entry has only annotation evidence and no recorded/bootstrap/run timestamp, and
          this early return emits no unknown_freshness finding. A behavioral probe using
          buildCoverageEvidenceIndex() with one AC annotation and no freshness inputs produced
          state=covered/presentation=covered, even though @coverage-freshness-revision-comparison
          ac-unknown-comparison-degrades-to-reverify requires positive evidence with absent or
          unresolvable comparison metadata to enter re_verify with unknown_freshness instead of
          being silently covered."
        created_at: 2026-06-24T17:14:02.661Z
    kind: blocker
