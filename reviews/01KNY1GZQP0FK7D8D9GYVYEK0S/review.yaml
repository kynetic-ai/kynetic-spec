              fix: use ULID-based tracking for agent rename detection
              Replace greedy consumed-set approach with per-item ULID tracking for
              agent rename detection, matching the approach already used for
              conventions. Each scaffolded agent's ULID is recorded in the state
              file at creation time. On subsequent runs, a missing agent is checked
              by looking up its original ULID in the current meta — if an agent
              with that ULID exists under a different ID, it's a rename; if no
              agent has that ULID, it's a deletion.
              This fixes the order-dependent bug where renaming pr-reviewer and
              deleting task-worker would incorrectly consume pr-reviewer's scaffold
              tag for task-worker, causing both to be recreated on force reseed.
              Task: @task-default-agents-and-conventions
