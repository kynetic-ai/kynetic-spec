              feat: add per-file progress output to test runner non-verbose mode
              Add a custom vitest reporter (test-progress-reporter.cjs) that emits one
              line per completed test file to stderr via a prefixed marker protocol.
              The parent process (test.cjs) strips the prefix and forwards progress
              lines to the terminal while routing all other vitest output to the log
              file only.
              This solves the "is it stuck?" problem: users can now see test files
              completing in real time without the full verbose stream (~200 lines
              for the full suite vs ~9000+ in verbose mode).
              Output format:
                PASS tests/parser.test.ts (66 tests, 350ms)
                FAIL tests/foo.test.ts (5 tests, 2 failed, 800ms)
              - Progress shown only in non-verbose mode (verbose already streams all)
              - Suppressed with KSPEC_TEST_PROGRESS=0
              - Uses PASS/FAIL markers with green/red ANSI matching existing conventions
              - Final summary, exit code, cache behavior, and log contents unchanged
              Task: @task-test-runner-progress-output
