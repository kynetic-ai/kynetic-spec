          ULID:      01KMMB3SAX2KGDBAGRD3X8EJE4

          Slugs:     cli-daemon-proxy

          Type:      feature

          Maturity:  draft

          Implementation: implemented


          ─── Description ───

          When a daemon is running, the CLI routes commands through it instead

          of operating directly on the shadow branch. This makes the daemon

          the single writer, eliminating coherence issues between CLI mutations

          and daemon state. The CLI auto-detects daemon availability and routes

          accordingly. Users can force either mode explicitly.



          ─── Acceptance Criteria ───
            [ac-auto-detect]
              Given: the user runs a kspec command

              When: a daemon is running and reachable for the current project

              Then: the command is routed through the daemon's API rather than
          operating directly on the shadow branch

            [ac-direct-fallback]
              Given: the user runs a kspec command

              When: no daemon is running or the daemon is unreachable

              Then: the command operates directly on the shadow branch

            [ac-force-direct]
              Given: KSPEC_NO_DAEMON=1 is set

              When: the user runs a kspec command

              Then: the command operates directly on the shadow branch, bypassing
          daemon routing

            [ac-force-proxy]
              Given: the user runs a kspec command with --daemon flag

              When: no daemon is running

              Then: the command fails with a clear error indicating no daemon is
          available

            [ac-transparent-output]
              Given: a command is routed through the daemon

              When: the command completes

              Then: the output format, content, and exit code are identical to
          direct mode

            [ac-mutation-coherence]
              Given: a CLI mutation is routed through the daemon

              When: the mutation succeeds

              Then: the daemon's entity cache reflects the change immediately and
          subsequent requests from any client see the updated data

            [ac-read-from-cache]
              Given: a CLI read command is routed through the daemon

              When: the daemon has cached data for the project

              Then: the response is served from the daemon's cache

            [ac-timeout-fallback]
              Given: the daemon responds to a health check but a routed read-only
          command does not complete within the timeout period

              When: the timeout expires

              Then: the CLI falls back to direct mode for the read-only command and
          emits a warning on stderr indicating the daemon is not responding

            [ac-timeout-mutation-error]
              Given: the daemon responds to a health check but a routed mutating
          command does not complete within the timeout period

              When: the timeout expires

              Then: the CLI returns an error instead of falling back to direct mode,
          because the daemon may still be processing the mutation



