threads:
  - _ulid: 01KQ8QCF40ZHS9HX38JJC34P6J
    anchor:
      type: structured
      ref: "@session-idle-hook-promptability"
      section: specs
    entries:
      - _ulid: 01KQ8QCF41SECKTVS78RDBRGMP
        author: Jacob Chapel
        body: "The proposed specs are placed under @agent-definitions even though the plan itself says the
          behavior is owned by existing specs: @multi-turn-session-lifecycle for idle grace and
          promptability, @default-project-agents-and-conventions for default agent scaffolding,
          @default-session-reflection-hook for first-idle reflection, and
          @single-command-version-upgrade for upgrade parity. Creating new requirements here
          duplicates or misplaces those contracts and leaves future implementers choosing between
          competing specs. Revise the plan to update or explicitly extend the owning specs, or move
          any genuinely new requirement under the owning feature with a clear non-overlap
          statement."
        created_at: 2026-04-28T00:21:20.129Z
    kind: blocker
  - _ulid: 01KQ8QCJH8512D5079HYP7VC5C
    anchor:
      type: structured
      field: ac-upgrade-hook-matches-setup
      ref: "@default-reflection-scaffold-parity"
      section: acceptance_criteria
    entries:
      - _ulid: 01KQ8QCJH8ACZFF53F12YVF3CY
        author: Jacob Chapel
        body: "This AC has a compound Then: trigger, filter, action, and enabled-state semantics are
          separate verifiable outcomes. It also describes hook shape rather than one observable
          behavior. Split this into atomic criteria or rewrite it as a single behavioral parity
          guarantee, with implementation fields left to the task notes."
        created_at: 2026-04-28T00:21:23.624Z
    kind: blocker
  - _ulid: 01KQ8QCQDDCHQ6CSZ8BXV9M4VK
    anchor:
      type: structured
      field: ac-default-reflection-has-prompt-window
      ref: "@session-idle-hook-promptability"
      section: acceptance_criteria
    entries:
      - _ulid: 01KQ8QCQDDVSJE0XW8NAZ1HCYE
        author: Jacob Chapel
        body: The phrase sufficient for the default reflection prompt is not an observable outcome. A
          behavioral AC should state the result directly, for example that the default reflection
          prompt is accepted for the same session before automatic close. This needs a concrete pass
          or fail condition before derivation.
        created_at: 2026-04-28T00:21:28.621Z
    kind: blocker
  - _ulid: 01KQ8QCTTMHC0QE3HJ5Y3RS0RC
    anchor:
      type: structured
      ref: "@task-default-session-reflection-reliability"
      section: tasks
    entries:
      - _ulid: 01KQ8QCTTM4RAWWARPPB8PTPZY
        author: Jacob Chapel
        body: The task requires explicit session blocks on scaffolded default dispatch agents and metadata
          tests for those blocks, but the proposed ACs only require an effective prompt window. The
          runtime fallback alone could satisfy that behavior, so the task currently asks for a
          specific scaffolded config guarantee that no spec covers. Either add or update an AC on
          the default-agent scaffolding spec requiring dispatch-capable defaults to expose this
          session configuration, or remove the explicit session-block work and generated-metadata
          test from scope.
        created_at: 2026-04-28T00:21:32.116Z
    kind: blocker
  - _ulid: 01KQ8QCYKS9X379GBXA1FRKKJ4
    anchor:
      type: structured
      ref: "@task-default-session-reflection-reliability"
      section: tasks
    entries:
      - _ulid: 01KQ8QCYKSH601EPKXMBM06YVC
        author: Jacob Chapel
        body: "The task includes conditional normalization of an existing default-session-reflect hook when
          it appears to be the unmodified default, plus manual-review reporting when it is
          customized. That is a risky migration behavior, but no AC covers patching existing hooks
          or reporting unchanged customized hooks, and the requested tests only cover a customized
          hook not being overwritten. Either remove existing-hook migration from this task, or add
          behavioral ACs and tests for the full matrix: missing hook created, unmodified existing
          default patched, customized existing hook preserved and reported, and previously removed
          hook not recreated."
        created_at: 2026-04-28T00:21:35.993Z
    kind: blocker
