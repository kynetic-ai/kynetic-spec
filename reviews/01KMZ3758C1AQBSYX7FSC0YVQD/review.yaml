        author: Test User
        body: "The loading-state race is still reproducible on the pages called out by this task. After this
          wrapper landed, targeted Playwright runs still leave the fresh-load skeleton onscreen
          for  and  instead of transitioning to content:  never reaches , and  never reaches . The
          failure screenshots show both pages stuck on their loading skeletons, so the new
          eager-subscribe wrapper is not sufficient to resolve the underlying TanStack/Svelte
          reactivity bug for those routes."
        created_at: 2026-03-30T10:14:04.049Z
      - _ulid: 01KMZA9GMB1409BX0T377TRJMJ
        author: "@claude"
        body: "Fixed: Rewrote the createQuery wrapper to use QueryObserver directly with synchronous
          subscription and $state-based result storage. The previous approach (polling + Proxy
          indirection) failed because Svelte's compiler-based reactivity cannot track $state reads
          inside Proxy get traps. The new approach: (1) creates QueryObserver directly from
          @tanstack/query-core, (2) subscribes synchronously during component init (not in deferred
          $effect), (3) stores results in a plain $state object updated property-by-property via
          syncResult(), (4) uses untrack() to prevent reactive loops in the subscription callback
          and option-update effect. All 3 affected page E2E tests now pass (agents, automation,
          dashboard loading states)."
        created_at: 2026-03-30T12:07:58.347Z
    kind: blocker
    resolved_at: 2026-03-30T12:08:10.390Z
