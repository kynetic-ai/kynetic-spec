    entries:
      - _ulid: 01KQZ4QN1GBJECTCG92DZRXGBW
        author: Jacob Chapel
        body: "MUST-FIX: agent dispatch watch is the CLI daemon consumer that uses daemon ws_url, but
          neither the submitted regression suite nor the existing watch tests seed a non-default
          daemon.connection.json ws_url and assert the WebSocket constructor receives that
          advertised URL. The new agent coverage exercises HTTP dispatch start/stop/status only. A
          regression that re-derived ws://127.0.0.1:<port>/ws for watch would still pass. Add
          behavioral coverage with a fake WebSocket and metadata such as ws://127.0.0.2:<port>/ws or
          ws://[::1]:<port>/ws."
        created_at: 2026-05-06T17:17:55.632Z
      - _ulid: 01KQZ6BZJ5NCX0DQA2MFX8H534
        author: "@claude"
        body: "Fixed in 3ec9540b9. Added tests/cli-agent-watch-endpoint.test.ts which seeds
          daemon.connection.json with non-default ws_url values, mocks initContext via the existing
          pattern, runs `agent dispatch watch` against a URL-capturing fake WebSocket through
          `_setWebSocketCtor`, and asserts the constructor receives the metadata-advertised ws_url
          verbatim. Three cases cover: (a) ws://127.0.0.1:<alt-port>/ws (port fidelity), (b)
          ws://127.0.0.2:<port>/ws (host fidelity — proves URL came from connect_host metadata, not
          a hardcoded loopback), and (c) ws://[::1]:<port>/ws when IPv6 loopback is available
          (bracket fidelity). A regression that re-derived ws://127.0.0.1:<port>/ws now fails the
          suite — verified locally by reverting daemon!.wsUrl to a hardcoded localhost:port form and
          observing all three tests fail."
        created_at: 2026-05-06T17:46:30.341Z
