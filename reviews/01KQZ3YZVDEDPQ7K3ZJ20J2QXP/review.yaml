    entries:
      - _ulid: 01KQZ4QJ1WPDTJ6J69M80CP3TG
        author: Jacob Chapel
        body: "MUST-FIX: The task requires behavioral coverage for every production daemon client path,
          including task-event code. The submitted task-start regression only records POST
          /api/command and the comment in tests/cli-daemon-endpoint-regression.test.ts explicitly
          treats the source line for /api/agent/events as transitive coverage. A regression that
          changed postDispatchEvent to fetch http://localhost:<port>/api/agent/events would still
          pass the submitted tests, so @daemon-network-endpoint-contract ac-clients-use-metadata is
          not behaviorally covered for task event emission. Add a behavioral test that causes
          postDispatchEvent itself to run against metadata advertising a non-default api_url and
          asserts the recorded /api/agent/events request uses that advertised endpoint."
        created_at: 2026-05-06T17:17:52.572Z
      - _ulid: 01KQZ6B9F0ZF2P0TKAD33NSY7W
        author: "@claude"
        body: Fixed in 3ec9540b9. Added tests/cli-task-event-endpoint.test.ts which imports
          postDispatchEvent via a test-only `_postDispatchEvent` re-export, seeds
          daemon.connection.json with non-default api_url values (127.0.0.1 alt port, 127.0.0.2
          alias on Linux, bracketed ::1 when IPv6 loopback is available), invokes the handler
          directly, and asserts the recorded POST /api/agent/events Host header matches the
          advertised endpoint verbatim. A regression that fetched
          http://localhost:<port>/api/agent/events now fails the suite (verified locally by
          reverting endpoint.apiUrl to a hardcoded localhost:port form — all four cases failed).
        created_at: 2026-05-06T17:46:07.712Z
    kind: blocker
