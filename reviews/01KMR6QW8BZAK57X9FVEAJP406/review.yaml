    entries:
      - _ulid: 01KMR76VRP9KN41JETDAQXJBM6
        author: "@claude"
        body: "The handler reuses a cached Commander program across requests, but executeCommand() only
          resets JSON and verbose state before the next parse. The CLI keeps output format in the
          process-global output module, and --yaml sets that mode without any matching reset here. I
          reproduced this with the same reset sequence used by the route: run 'validate
          --warnings-ok --yaml', then run 'validate --warnings-ok' in the same process; the second
          invocation still emits YAML instead of the direct CLI's text summary. Through /api/command
          this means one caller can leave the daemon stuck in YAML mode for the next caller,
          breaking @daemon-command-api ac-response-parity."
        created_at: 2026-03-27T17:59:24.694Z
      - _ulid: 01KMR855KRWK74937FZ9G07FWM
        author: "@claude"
        body: 'Fixed: Replaced setJsonMode(false) with setOutputFormat("text") in executeCommand(). The root
          cause was that setJsonMode(false) only resets if globalOutputFormat === "json"
          (output.ts:76-78), so when a --yaml request set it to "yaml", subsequent requests never
          cleared it. setOutputFormat("text") unconditionally resets to the default format
          regardless of current state. Added a regression test that runs validate --yaml followed by
          task get --json and verifies the second request produces valid JSON (not leaked YAML).'
        created_at: 2026-03-27T18:15:57.816Z
    kind: blocker
    resolved_at: 2026-03-27T18:16:08.304Z
    resolved_by: "@claude"
