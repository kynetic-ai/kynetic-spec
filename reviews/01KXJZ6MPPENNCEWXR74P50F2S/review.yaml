      path: src/agent-runtime/invocation.ts
      side: head
    entries:
      - _ulid: 01KXK0CK6P50BSFQ6JHZKXBE8G
        author: pr-reviewer
        body: MUST-FIX — A failure appending agent.dispatched strands the stop ownership reservation. The
          session/create handoff has already been created, but this await is outside the try whose
          catch invokes onOwnershipFailed; only createSession failure and failures after line 1002
          release it. _collectStopTargets awaits every reservation promise, so an append I/O failure
          leaves global and task hard-stop waiting forever before they can commit or recover
          cleanup. Add failure release/cleanup for this boundary and a behavioral fault-injection
          test.
        created_at: 2026-07-15T13:45:16.758Z
    kind: blocker
  - _ulid: 01KXK0CS5GV6TT1WAQRR1Q03NS
    anchor:
      type: code
      commit: 3a9909c4870a49f5f3ac174716edfca067852055
      line_end: 1549
      line_start: 1545
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXK0CS5GJF5J1Z5TV9724YZ5
        author: pr-reviewer
        body: MUST-FIX — Graceful engine shutdown suppresses every verified global-stop failure. After this
          catch, stop continues by aborting all invocation controllers and waiting for invocation
          finally blocks, whose disposeAgent calls agent.kill without the durable tuple/birth/group
          verification required by hard stop; stop then resolves successfully. An ownership
          mismatch, unreadable evidence, signal failure, or closure failure can therefore both take
          an unverified termination path and be reported as successful daemon shutdown, violating
          graceful-shutdown hard-stop semantics and the no-failure-reports-success guarantee.
          Propagate/retain the hard-stop failure and test engine.stop with an injected recovery
          failure.
        created_at: 2026-07-15T13:45:22.864Z
    kind: blocker
  - _ulid: 01KXK0CYMN9Z5FX9VQYTD6G2CX
    anchor:
      type: code
      commit: 3a9909c4870a49f5f3ac174716edfca067852055
      line_end: 2049
      line_start: 2044
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXK0CYMNPQNZ4JGHMJEH0YPA
        author: pr-reviewer
        body: MUST-FIX — Recovery requires deep equality with the immutable cleanup target even though the
          live invocation mutates that same durable tuple by adding exited_at in its finally block.
          If the process exits after owned is committed but before signals_sent is committed
          (including a daemon crash or timeout race), retry/startup sees the legitimate exited_at
          addition as cleanup_ownership_mismatch and can never advance the durable cleanup. The
          phase-crash tests keep session ownership unchanged and miss this real transition. Make the
          allowed exit observation recoverable without weakening identity checks and cover an
          owned-phase crash after the invocation records exited_at.
        created_at: 2026-07-15T13:45:28.469Z
    kind: blocker
  - _ulid: 01KXK0D4FCEBJ2KQVFN5EMGT8K
    anchor:
      type: code
      commit: 3a9909c4870a49f5f3ac174716edfca067852055
      line_end: 1040
      line_start: 1033
      path: src/agent-runtime/invocation.ts
      side: head
    entries:
      - _ulid: 01KXK0D4FCAN4ZJN6N51Y986F3
        author: pr-reviewer
        body: MUST-FIX — Process-group ownership is captured only once before active publication and is
          never transactionally refreshed while the live owner can bind later child additions,
          despite the binding plan requirement. The only later ownership write adds exited_at. Any
          adapter child created after publication is therefore unproved; hard stop observes it in
          the PGID, returns cleanup_group_unverifiable, and refuses to signal ordinary live work
          indefinitely. Implement the live-owner member-proof refresh and add a behavioral
          late-child stop test.
        created_at: 2026-07-15T13:45:34.444Z
    kind: blocker
