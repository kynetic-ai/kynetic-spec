      - _ulid: 01KRDAX8FJM5TJSBHRJ52NYW04
        author: Jacob Chapel
        body: "MUST-FIX: the task explicitly calls for Playwright daemon fixture setup-path regressions
          where project/home/config setup or port allocation fails before normal teardown
          registration, but no added test exercises this wrapper window. In the real wrapper,
          createTestDaemonProject() and allocateTestDaemonPort() still run before the try/finally
          starts, so a regression in this path would not be caught by the new
          createTestDaemonProject-only tests or by runDaemonFixtureLifecycle. Add fixture-unit
          coverage that simulates failures in the Playwright wrapper setup path after resources are
          owned and asserts cleanup/primary-error preservation for that wrapper behavior."
        created_at: 2026-05-12T05:35:12.882Z
      - _ulid: 01KRDD4RS1CES2ZFTTQFGTMC7V
        author: "@claude"
        body: "Fixed: extracted the wrapper's pre-try/finally setup into `acquirePlaywrightFixtureResources`
          (tests/e2e/fixtures/daemon-fixture.ts) and refactored test-base.ts:176 to delegate to it.
          Added 5 staged regressions in tests/e2e-fixture-daemon-cleanup.test.ts
          \"acquirePlaywrightFixtureResources — wrapper setup-failure cleanup\" that exercise the
          actual wrapper code path: 1 positive contract (returns resources + emits stages in
          declared order) plus 4 `it.fails` covering each post-create stage failure
          (after-copy-project-tests, after-write-config, after-allocate-port) and a dedicated
          allocateTestDaemonPort-rejects regression. Verified by stripping `it.fails`: all 4 new
          staged regressions fail with \"project tempDir … must be removed after wrapper setup
          failure at <stage>\" pre-fix, confirming they exercise the leak. Smoke E2E passes (`npx
          playwright test tests/e2e/smoke.spec.ts`)."
        created_at: 2026-05-12T06:14:16.095Z
    kind: blocker
