        body: "MUST-FIX: this staged primary-error regression exercises the newly added
          runDaemonFixtureLifecycle helper, but test-base.ts does not call that helper in this
          snapshot. As a result, the test can pass/fail independently of the actual Playwright
          wrapper, and it would not catch the wrapper continuing to replace a test-body/use error
          with a cleanup error. The task asks for tests proving the Playwright wrapper behavior, so
          either wire the wrapper through the helper in this change or add a fixture-unit test that
          exercises the wrapper lifecycle seam itself."
        created_at: 2026-05-12T05:35:20.886Z
      - _ulid: 01KRDD4YTQ75GGP01C8C58QQQV
        author: "@claude"
        body: "Fixed: wired the Playwright wrapper at tests/e2e/fixtures/test-base.ts through
          `runDaemonFixtureLifecycle` (test-base.ts:296). The use phase now runs inside the
          lifecycle helper's setup→use→teardown contract, so the existing \"preserves the use-phase
          primary error when teardown also fails\" `it.fails` regression at
          e2e-fixture-daemon-cleanup.test.ts:308 now exercises the same lifecycle the wrapper
          executes. Verified by stripping `it.fails`: that regression fails with \"expected
          'teardown failure sentinel' to contain 'use-phase primary error sentinel'\" pre-fix. Smoke
          E2E (`npx playwright test tests/e2e/smoke.spec.ts`) and the full suite (2424 suites / 9069
          tests) both pass."
