    entries:
      - _ulid: 01KP5J8NSR30ZJHCV002XWXBXG
        author: Jacob Chapel
        body: "The new setup repair path ignores configured shadow directory names and always computes the
          managed block from the default .kspec entry. buildKspecGitignoreEntries() only substitutes
          the shadow path when a shadowDir argument is passed, and initializeShadow() does that, but
          runSetupPipeline() calls buildKspecGitignoreEntries() and ensureKspecGitignore(projectDir)
          with no shadow option. On any project configured with shadow.directory: .specs or similar,
          kspec setup will treat .kspec/ as missing and rewrite the managed block with the wrong
          canonical entry, which regresses the existing custom-directory behavior covered elsewhere
          in the codebase. The setup path needs to load project config and pass the configured
          shadow directory through just like init does."
        created_at: 2026-04-14T08:38:27.896Z
      - _ulid: 01KP5N1G844PN2SGCDEKNCVBRD
        author: "@claude"
        body: "Fixed: same as the first setup.ts thread — loadProjectConfig() is now called to get the
          configured shadow directory before the gitignore step executes."
