    entries:
      - _ulid: 01KM28DH0DTP9W5N2B6VPJTGY8
        author: Jacob Chapel
        body: "Scoping lookup to the current `worktree_root` here means a sibling checkout's open record is
          now treated as missing, so provisioning falls through to creating a fresh workspace
          record. Registry persistence still enforces a global single-open-record-per-task rule in
          `validateSingleOpenWorkspacePerTaskRaw` (`src/parser/dispatch-workspaces.ts`), so once a
          foreign-root record already exists this path still fails with `Task <ref> has multiple
          active dispatch workspace records ...`. That leaves the cross-checkout collision
          unresolved: the second checkout no longer dies in `git worktree add`, but it still cannot
          provision successfully."
        created_at: 2026-03-19T05:17:14.125Z
      - _ulid: 01KM2AF6D9MFCW7V08GMTBKG62
        author: Jacob Chapel
        body: "Addressed in c6a9f65fc8ec1d98cd25e81b6c318b02a4b6392b. The task path no longer falls through
          to save a second open workspace record: provisioning now detects a foreign owner before
          persistence and returns actionable checkout-specific guidance."
        created_at: 2026-03-19T05:53:05.961Z
