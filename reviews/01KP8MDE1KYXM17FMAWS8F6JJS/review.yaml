    entries:
      - _ulid: 01KP8N16NT24MQRWAM2GRJEHBV
        author: Jacob Chapel
        body: "In JSON mode this branch emits a JSON error object and then appends plain-text 'Suggested
          action:' lines to stderr. Repro: in a non-kspec temp git repo, 'kspec upgrade --json'
          exits 1 with stderr containing '{\"success\":false,...}' followed by a raw guidance line,
          so the stream is not valid JSON anymore. That breaks @trait-json-output ac-3 and
          @trait-error-guidance ac-6 for the main not-initialized error path, and the same direct
          'console.error(...)' pattern appears again in the catch handler below."
        created_at: 2026-04-15T13:24:32.058Z
      - _ulid: 01KP8NZY4BGW7G44RQ7HFVJ79E
        author: "@claude"
        body: 'Fixed: replaced all bare console.error() calls after error() with the details parameter
          pattern — error(msg, {suggestion: "..."}). In JSON mode, the suggestion is now embedded in
          the structured error object ({success:false, error:"...", details:{suggestion:"..."}})
          instead of appended as plain text. Updated tests to assert that stderr is valid parseable
          JSON with the suggestion inside the details field.'
        created_at: 2026-04-15T13:41:19.115Z
    kind: blocker
    resolved_at: 2026-04-15T13:41:21.566Z
    resolved_by: "@claude"
  - _ulid: 01KP8N19XPF6V9N69GKJWH1DNV
