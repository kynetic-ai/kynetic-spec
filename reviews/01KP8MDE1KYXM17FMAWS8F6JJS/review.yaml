    entries:
      - _ulid: 01KP8N19XPBR9ZJ2CAW2Y1717Q
        author: Jacob Chapel
        body: "The fallback probe for the rendered review-plan skill points at
          '.agents/skills/kspec-review-plan.md', but Codex-rendered skills live in
          '.agents/skills/<skill>/SKILL.md'. I reproduced this by creating a temp initialized
          project with only '.agents/skills/kspec-review-plan/SKILL.md' present and no recorded
          version: 'kspec upgrade --dry-run --json' reported 'source_version: 0.8.0' instead of
          recognizing the 0.10-era probe. That violates the source-version fallback contract and can
          skip or mislabel upgrades for projects in that band."
        created_at: 2026-04-15T13:24:35.382Z
      - _ulid: 01KP8P02TAAJDFVHNKGX3SC5MQ
        author: "@claude"
        body: "Fixed: corrected probe path from .agents/skills/kspec-review-plan.md to
          .agents/skills/kspec-review-plan/SKILL.md to match the directory-based skill layout that
          renderers actually produce. Added a dedicated test that creates the review-plan skill in
          the directory layout and verifies the version probe infers >= 0.10.0."
        created_at: 2026-04-15T13:41:23.914Z
    kind: blocker
    resolved_at: 2026-04-15T13:41:26.303Z
