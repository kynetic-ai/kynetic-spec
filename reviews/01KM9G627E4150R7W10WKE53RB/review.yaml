        author: Test User
        body: This still hardcodes the default shadow directory instead of detecting the actual configured
          shadow worktree. shadow.directory is already configurable via kspec.config.yaml
          (loadProjectConfig / resolveConfig), and the task note explicitly called that out as part
          of the bug. With a project configured to use something like .specs, dangerous commands run
          from that real shadow worktree will now be allowed because isShadowWorktreePath() and
          isCdToShadowWorktree() only match SHADOW_WORKTREE_DIR. That leaves the real shadow branch
          unprotected, so the guard does not yet detect the actual shadow worktree.
        created_at: 2026-03-22T00:48:21.282Z
