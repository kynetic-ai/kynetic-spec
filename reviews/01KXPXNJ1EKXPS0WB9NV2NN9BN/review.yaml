        body: "MUST-FIX — The resolved fact-drift blocker remains only partially source-bound. This block
          compares config keys, path/target precedence, bootstrap order/scope/reviewer behavior, and
          rule keys to a second hand-written literal rather than the exported schema or observable
          dispatcher behavior; the same pattern continues for durability ordering/final admission,
          accessibility/static behavior, and limitations later in validateFacts. The separate
          bootstrap test observes only loadCommitted and the first startup-order label, not cleanup
          retry before scheduling or both final admission rechecks. Impact: production can change
          while the fixture and duplicated literals remain unchanged, leaving this drift gate green
          and downstream documentation stale. Evidence: the group mutation test only proves
          self-consistency against these literals, and the fresh focused/full suites still pass.
          Bind every retained claim to an exported schema/helper or executed behavior, or remove
          claims that cannot be source-bound."
        created_at: 2026-07-17T02:35:26.518Z
