        body: "MUST-FIX — The @auto-cli-docs ac-3 helper is not command-scoped. It normalizes the entire
          help output and accepts each option signature anywhere, so an option removed from one
          command still passes when another command prints the same flags and description. Impact:
          help --all can cease to be a complete reference for an individual command while the
          annotated test remains green. Evidence: the current exported tree contains 22 commands
          with the exact '--json Output as JSON' signature, plus many other duplicate option
          signatures; the fresh suite passes with this global containment check. Parse command
          sections or otherwise compare each command's metadata within its own rendered block."
