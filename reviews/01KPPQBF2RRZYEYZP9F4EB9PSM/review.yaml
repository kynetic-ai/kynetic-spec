    entries:
      - _ulid: 01KPPQEF0TBS8NZ0M8BQJATSN7
        author: Jacob Chapel
        body: "Several new tests in tests/web-ui-docs-rendering.test.ts validate docs reachability by
          reading source files and asserting on strings or file existence instead of exercising the
          web UI behavior. Examples include existsSync checks for route files at lines 280-296,
          readFileSync against Sidebar.svelte and MobileNav.svelte at lines 305-319, and a
          readFileSync assertion against vite.config.ts at lines 331-339. This is a MUST-FIX in this
          repo: these tests would still pass if navigation/rendering were broken as long as the
          strings stayed in the source, so they do not provide valid AC coverage."
        created_at: 2026-04-21T00:36:05.786Z
      - _ulid: 01KPPSVX2XW2947WCEN753BK91
        author: "@claude"
        body: "Fixed: Replaced all source-scanning tests (existsSync, readFileSync assertions at lines
          280-339) with behavioral tests. Route structure/nav integration tests are now replaced by:
          (1) docs module interface tests that exercise the actual plugin pipeline end-to-end, (2)
          section filtering tests that call filterSectionEntries directly, (3) link resolution tests
          that call resolveDocsLink directly. Also fixed the naive JSON parsing (replace semicolons)
          that was fragile with code-containing content."
        created_at: 2026-04-21T01:18:23.324Z
    kind: blocker
    resolved_at: 2026-04-21T01:18:32.630Z
    resolved_by: "@claude"
  - _ulid: 01KPPQEJ96V1QZ3Q7J1KWP6096
    anchor:
      type: code
      commit: ca0646762730b23edeb709229513354dae9acf45
      line_end: 24
      line_start: 23
      path: packages/web-ui/src/routes/docs/[...slug]/+page.svelte
      side: head
    entries:
      - _ulid: 01KPPQEJ96K2D6JTCZFSTYXMMV
        author: Jacob Chapel
        body: The docs page sidebar renders every docs entry, not the current section's pages required by
          @docs-navigation-shape ac-1. The implementation binds  and iterates that list directly for
          the sidebar, so a page under  will still show unrelated root pages like  instead of only
          pages from . That mismatches the spec's page-shape contract and makes section navigation
          noisier as the docs set grows.
        created_at: 2026-04-21T00:36:09.127Z
      - _ulid: 01KPPSWJ5J97ZV80HEBBZT27ND
        author: "@claude"
        body: "Fixed: Sidebar now shows only the current section's pages instead of all docs entries. Added
          getDocsSectionEntries() which delegates to filterSectionEntries() — for root-level pages
          it shows only root pages, for nested pages (e.g. history/design) it shows only pages in
          the same top-level directory. The sidebar binding changed from a static const allEntries
          to a reactive $derived sectionEntries that updates when the slug changes."
        created_at: 2026-04-21T01:18:44.914Z
    kind: blocker
    resolved_at: 2026-04-21T01:18:54.261Z
    resolved_by: "@claude"
  - _ulid: 01KPPQENHW0GATY88GCENJAT2M
    anchor:
      type: code
      commit: ca0646762730b23edeb709229513354dae9acf45
      line_end: 46
      line_start: 42
      path: packages/web-ui/src/routes/docs/[...slug]/+page.svelte
      side: head
    entries:
      - _ulid: 01KPPQENHWNJ5T8115E1FQ4TB1
        author: Jacob Chapel
        body: Relative Markdown links that walk up a directory are rewritten to the wrong in-app
          path.  strips only a leading  or  and then prefixes , so links like  and  from
          docs/getting-started.md become  and  rather than a resolvable target. This breaks
          inter-page navigation for existing authored docs content, which the task description
          explicitly calls out as client-side docs navigation.
        created_at: 2026-04-21T00:36:12.476Z
      - _ulid: 01KPPSX7ZV4RRDGAGSYYWKF9ZM
        author: "@claude"
        body: "Fixed: Relative Markdown links are now resolved correctly using resolveDocsLink(), which
          resolves href paths relative to the current doc's directory within the docs tree. Handles
          ../, ./, and bare filenames. Links that walk outside the docs tree (e.g. ../INSTALL.md
          from a root doc) return null and are not navigated. Tests cover sibling links, nested
          links, parent traversal, out-of-bounds, and non-markdown links."
        created_at: 2026-04-21T01:19:07.259Z
    kind: blocker
    resolved_at: 2026-04-21T01:19:15.973Z
    resolved_by: "@claude"
