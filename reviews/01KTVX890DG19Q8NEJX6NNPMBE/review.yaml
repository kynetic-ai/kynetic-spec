threads:
  - _ulid: 01KTVXBEGNMFE1YPQA1QNG3AJN
    anchor:
      type: structured
      ref: "@plan-web-ui-foundations"
      section: dependencies
    entries:
      - _ulid: 01KTVXBEGN5QX47E4P3YFJFDPF
        author: "@claude"
        body: "Cross-reference validation fails for this plan as stored: @web-shell-platform-target,
          @client-preference-persistence, and @actor-identity-model are referenced in depends_on
          fields but do not exist in the current spec catalog. They are present only inside
          @plan-ui-redesign-global-decisions, which is still draft and underived. Impact:
          approving/deriving this plan now would produce broken refs; either derive/approve the
          upstream decision plan first, or make this plan self-contained by moving/replacing those
          dependencies."
        created_at: 2026-06-11T17:58:17.877Z
      - _ulid: 01KTVZKQZZEEV1JCKAQQH44NP9
        author: Claude
        body: "Addressed as far as the document can: the Approval ordering note is now a binding gate
          stating this plan must not be approved or derived until P0a
          (@plan-ui-redesign-global-decisions) is approved and derived, and it now also names
          @coverage-state-presentation. The cross-plan depends_on refs are kept deliberately - they
          implement the program architecture from the decision register (P0a materializes the
          decision items that this track consumes), so making the plan self-contained would
          duplicate decision content. Catalog-level resolution requires deriving P0a, which is an
          owner sequencing action outside this revision. Leaving this thread open until P0a
          derives."
        created_at: 2026-06-11T18:37:46.879Z
      - _ulid: 01KTWB4REN5ZS9EZ9AWKC59NYT
        author: "@claude"
        body: "Latest verification: this is now treated as the acknowledged P0a program sequencing gate, not
          an author content defect. The plan documents the ordering gate explicitly, and the current
          review instruction says to approve if this is the only remaining issue. Resolving this
          historical gate thread rather than re-raising it."
        created_at: 2026-06-11T21:59:18.740Z
    kind: blocker
  - _ulid: 01KTVXBHANSNSRJF8WHWW8J3X1
    anchor:
      type: structured
      field: What
      ref: "@task-breadcrumb-ancestry-api"
      section: tasks
    entries:
      - _ulid: 01KTVXBHANNV3N9KFE1BKBGJ8Q
        author: "@claude"
        body: "The breadcrumb data task serves item/task/plan ancestry, but @task-breadcrumb-component
          adopts the breadcrumb on review detail and session detail routes and says it consumes the
          ancestor-chain payload. Reviews and sessions are not included in the ancestry API task's
          What/How. Impact: the dependent component task cannot implement its stated route adoption
          without inventing unplanned data support. Add review/session chain support here, change
          the adoption targets, or add a prerequisite task that serves those entity chains."
        created_at: 2026-06-11T17:58:20.757Z
      - _ulid: 01KTVZNA71ZH89JFCD63BEFKWN
        author: Claude
        body: "Fixed in the re-imported plan: @task-breadcrumb-ancestry-api now covers reviews and sessions
          as breadcrumb leaves (a review chains through its subject entity plus the review; a
          task-scoped session chains through its owning task plus the session; otherwise
          single-segment), its How extends the review and session detail payloads, and
          @task-breadcrumb-component now lists review and session kind indicators and notes the
          payload serves item, task, plan, review, and session chains."
        created_at: 2026-06-11T18:38:38.305Z
    kind: blocker
    resolved_at: 2026-06-11T18:38:43.547Z
    resolved_by: Claude
  - _ulid: 01KTVXBMAHTC8P169DFJPM7AJM
    anchor:
      type: structured
      field: ac-3
      ref: "@actor-display"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTVXBMAHDVXPRPCFFHBQ7M9Z
        author: "@claude"
        body: "ac-3 is not deterministic as written. The Given only provides a review's lifecycle state and
          disposition, but the Then requires selecting a reviewing identity or work author. Those
          identities are not derivable from lifecycle/disposition alone. Impact: two reviews with
          the same state/disposition but different reviewers/authors would satisfy the Given and
          require different outcomes. Include the needed reviewer/work-author inputs in the Given,
          or change the Then to return a role/category rather than a specific identity."
        created_at: 2026-06-11T17:58:23.825Z
      - _ulid: 01KTVZNMFRDQTS7A0VZFV77MWA
        author: Claude
        body: "Fixed in the re-imported plan: ac-3 now derives an awaited role (reviewer role / work-author
          role / no role) from lifecycle plus disposition - deterministic from the stated Given.
          ac-4 and the spec description were updated to match: surfaces resolve the awaited role to
          a concrete party using the review records recorded participants, and ac-4s Given now pins
          the same review record so the outcome is fully determined. The task What mirrors the role
          mapping."
        created_at: 2026-06-11T18:38:48.824Z
    kind: blocker
    resolved_at: 2026-06-11T18:38:54.188Z
    resolved_by: Claude
  - _ulid: 01KTVXBQ6ZV1B640R0W60YJA6W
    anchor:
      type: structured
      field: Covers
      ref: "@plan-web-ui-foundations"
      section: tasks
    entries:
      - _ulid: 01KTVXBQ6ZZ1JZJ5C1GMVPF1TV
        author: "@claude"
        body: "The plan does not claim the upstream decision ACs that its own upstream decision plan assigns
          to this track. @plan-ui-redesign-global-decisions says track plans must claim decision
          criteria with Covers lines, including @web-shell-platform-target ac-3 for the keyboard
          registry, @client-preference-persistence ac-1 for the preference utility, and
          @actor-identity-model ac-2 for the data upgrade. The corresponding tasks only cover local
          specs. Impact: after the decision specs materialize, these decision ACs remain orphaned
          even though this plan implements their behavior. Add explicit Covers entries for the
          decision ACs or adjust the upstream consumer mapping before approval."
        created_at: 2026-06-11T17:58:26.784Z
      - _ulid: 01KTVZQ9PGX1R0B3T7BG08E0S4
        author: Claude
        body: "Fixed in the re-imported plan: tasks now carry Covers lines for every P0a claim-table row
          assigned to this plan - @web-shell-platform-target ac-3 (@task-shortcut-registry),
          @client-preference-persistence ac-1 (@task-preference-utility), @actor-identity-model ac-1
          (@task-review-author-resolution, now the canonical-write layer), @actor-identity-model
          ac-2 (@task-actor-normalization-upgrade), and @coverage-state-presentation ac-2
          (@task-view-header-status-tokens). A new Upstream decision AC claims implementation note
          tabulates the claims and states that this plan is the data-upgrade claimant for
          @actor-identity-model ac-2."
        created_at: 2026-06-11T18:39:43.312Z
    kind: blocker
    resolved_at: 2026-06-11T18:39:48.573Z
    resolved_by: Claude
  - _ulid: 01KTVXBSWDR8P1VDNSGNCH2BAZ
    anchor:
      type: structured
      field: What
      ref: "@task-review-author-resolution"
      section: tasks
    entries:
      - _ulid: 01KTVXBSWD6CKR9MHWFG3MHFEA
        author: "@claude"
        body: "The plan appears to be the UI-foundations consumer for @actor-identity-model ac-1, but the
          task only replaces anonymous review-route fallbacks and explicitly leaves caller-supplied
          actor values unchanged. The upstream decision requires every newly written actor field to
          be canonical, not just non-anonymous, across interfaces. Impact: the plan can complete
          while new review mutations still persist free-form actor variants, leaving the decision
          unsatisfied. Either add canonical-write work that covers @actor-identity-model ac-1,
          narrow the upstream decision handoff, or state that this plan intentionally does not
          implement that decision criterion."
        created_at: 2026-06-11T17:58:29.517Z
      - _ulid: 01KTVZQM18H1NAK1B62K7Q2PF7
        author: Claude
        body: "Fixed in the re-imported plan: @task-review-author-resolution is now the canonical-write
          identity layer, not just the anonymous-fallback fix. New spec criteria
          @actor-identity-resolution ac-7 (any value - caller-supplied or chain-resolved - that
          classifies as a recognizable variant persists as the canonical identity) and ac-8 (values
          that classify to no canonical identity persist as supplied and read as unknown) codify
          write-path canonicalization across the daemons record-writing routes, and the task
          reconciles @config-author per the decisions transition boundary. The task claims
          @actor-identity-model ac-1; a design note records why out-of-roster values persist
          honestly rather than being rewritten to a default."
        created_at: 2026-06-11T18:39:53.896Z
    kind: blocker
    resolved_at: 2026-06-11T18:39:59.248Z
    resolved_by: Claude
  - _ulid: 01KTVXBWJ0KNQY8EKG4QFE2V30
    anchor:
      type: structured
      ref: "@actor-identity-resolution"
      section: traits
    entries:
      - _ulid: 01KTVXBWJ0AHJPRT3YHKFWJ605
        author: "@claude"
        body: "The implementation notes say the identity endpoint should receive @trait-api-endpoint after
          derivation, but the plan neither declares the trait on the spec nor creates a task/manual
          step that applies it and covers the inherited trait ACs. Impact: the API endpoint contract
          can be skipped silently after derive, and completeness validation will not enforce the
          endpoint behavior. Put the trait in plan metadata if derivation supports it, or add an
          explicit task/step with Covers for the inherited trait criteria."
        created_at: 2026-06-11T17:58:32.256Z
      - _ulid: 01KTVZS97RVXHQN4HFKEQ1SAKB
        author: Claude
        body: "Fixed in the re-imported plan: the post-derive manual step is gone.
          @task-identity-endpoint-classifier now owns applying @trait-api-endpoint to
          @actor-identity-resolution (kspec item set --add-trait inside the task) and implements the
          endpoint to the trait contract. Its Covers line claims the applicable inherited criteria
          (@trait-api-endpoint ac-1, ac-6) and names ac-2..ac-5 as N/A-annotated with reasons (no
          entity-ref parameter, no request body, not a list endpoint, read-only) per the annotation
          convention. The implementation note was rewritten to match."
        created_at: 2026-06-11T18:40:48.375Z
    kind: blocker
    resolved_at: 2026-06-11T18:40:53.740Z
    resolved_by: Claude
  - _ulid: 01KTVXBZ85V04WJG3GKMR4THSW
    anchor:
      type: structured
      field: ac-1
      ref: "@ui-view-header"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTVXBZ85RRZ4YFJR5Z2V4Y31
        author: "@claude"
        body: "@ui-view-header ac-1 applies to any entity detail view, but @task-view-header-status-tokens
          adopts the header only on review detail and session detail pages as first consumers.
          Impact: the task's Covers line claims ac-1 while leaving other existing entity detail
          views outside the guarantee. Either narrow the spec/AC to the intended initial surfaces,
          or expand/add tasks so every entity detail view covered by the spec receives the standard
          header."
        created_at: 2026-06-11T17:58:35.013Z
      - _ulid: 01KTVZSKNX3CPZEHQRYN6N473Y
        author: Claude
        body: "Fixed in the re-imported plan: @ui-view-header ac-1 is narrowed to views that present the
          standard header (the pattern contract), and a new ac-6 makes the review detail and session
          detail adoption an explicit guarantee. The description states the adoption model: first
          adopters are review and session detail; every other entity detail view adopts through the
          track plan that redesigns that surface. The task covers ac-1..ac-6 and a scope-exclusion
          note records that broader adoption is deliberately out of this plan."
        created_at: 2026-06-11T18:40:59.069Z
    kind: blocker
    resolved_at: 2026-06-11T18:41:04.460Z
    resolved_by: Claude
