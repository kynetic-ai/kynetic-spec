    entries:
      - _ulid: 01KSZQQB31PD9C3BTC9YWRQPM9
        author: Jacob Chapel
        body: 'MUST-FIX: Runner validation does not validate a configured process.cwd. The new validate path
          only probes the executable when process.executable has an origin, then marks the runner
          valid when no issue was added. I reproduced this through the CLI with a runner whose
          process.cwd points at a nonexistent directory and whose process.executable is an existing
          absolute executable; `kspec agent runners validate --json` exited 0 and returned `ok:
          true`, `status: "valid"`, and empty diagnostics. That violates the task requirement that
          invalid process cwd errors include actionable guidance, and it can let operators believe a
          runner is spawnable even though the actual child process will fail before startup. Add cwd
          validation for runner.process.cwd (including a behavioral CLI test) and report an
          invalid_cwd diagnostic/non-zero validate exit when the directory cannot be used.'
        created_at: 2026-05-31T19:21:12.033Z
    kind: blocker
