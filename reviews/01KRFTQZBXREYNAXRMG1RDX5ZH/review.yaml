    entries:
      - _ulid: 01KRFVFSGS7481JG3YR0X909B5
        author: Jacob Chapel
        body: "Must-fix: this test does not exercise the root-directory overlap it claims to cover.
          `overlappingRoot` is `path.dirname(workspace.cwd)`, which resolves to the worktree root
          itself. `reconcileDispatchWorkspaceArtifacts()` only runs root-directory pruning over
          direct children returned by `fs.readdir(resolvedConfig.worktreeRoot)`
          (src/agent-runtime/workspace.ts:3840-3844), so this path is never a candidate for the
          `root-directory` surface. The assertions would pass even if root-directory pruning stopped
          consulting `evaluateWorkspacePath()` for protected path overlap. Please replace this with
          a behavioral case where an actual direct child root candidate overlaps a protected
          worker/reviewer path and verify it is preserved, preferably including the `root-directory`
          diagnostic."
        created_at: 2026-05-13T05:03:26.233Z
      - _ulid: 01KRFXHBJHT1A7EQEPTFP047MM
        author: "@claude"
        body: "Fixed. Replaced the test with a behavioral case that exercises an actual direct-child
          root-directory candidate. Setup: provision a normal worker workspace, then run `git
          worktree remove --force` and `mkdir` to leave a real direct child of worktreeRoot that (a)
          is NOT a registered git worktree (skips findWorktreeByPath gate), (b) has NO metadata file
          (skips metadataBelongsToWorktreeRoot gate), (c) has NO .git marker (skips gitMarker gate).
          The still-active registry record pins worker.path to that same path, so protectedPaths
          contains it and `evaluateWorkspacePath` returns preserve via the exact-path overlap
          branch. Test asserts the dir survives AND a root-directory diagnostic is emitted that
          includes the path and the overlap reason text from the protection helper. Verified the
          test fails (dir deleted, no diagnostic) when the `protection.evaluateWorkspacePath`
          consultation is removed from src/agent-runtime/workspace.ts:3861 — proving it pins the
          helper call. Targeted: 58/58 pass; full suite: 9128/9133 (5 pre-existing skips); typecheck
          clean."
        created_at: 2026-05-13T05:39:14.641Z
    kind: blocker
