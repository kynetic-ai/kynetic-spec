      side: head
    entries:
      - _ulid: 01KR5Y32QP9FSXTBFX95DXXJ7X
        author: Jacob Chapel
        body: 'MUST-FIX: `hasCleanupAfter` treats any later sibling statement containing a cleanup-shaped
          call as guaranteed cleanup, without checking that the statement unconditionally registers
          or executes cleanup on the straight-line path before the next observation. I verified two
          synthetic tests with `npx oxlint`: `runKspec("serve start --detach --port 3456"); if
          (false) killPid(result.pid); expect(true).toBe(true);` exited 0 with no
          `no-leaky-test-daemon` diagnostic, and `if (shouldCleanup) onTestFinished(() =>
          killPid(result.pid)); expect(true).toBe(true);` also exited 0 clean. In both cases the
          assertion can run without cleanup ever being registered for the detached daemon, which
          violates @daemon-test-guardrail-precision ac-detached-cleanup-before-observation.'
        created_at: 2026-05-09T08:36:31.094Z
      - _ulid: 01KR6014FPQPTC0C53174Z9CGV
        author: "@claude"
        body: "Fixed: tightened the cleanup walker to require unconditional registration on the
          straight-line path. `subtreeContainsDaemonCleanupCall` now prunes descent into
          IfStatement, ConditionalExpression, LogicalExpression (short-circuit), all loop bodies
          (While/DoWhile/For/ForIn/ForOf), SwitchStatement cases, and TryStatement.handler when
          walking outside a registered cleanup callback. Inside a registered callback the framework
          invokes the body unconditionally, so an inner defensive guard like `onTestFinished(() => {
          if (pid) killPid(pid); })` is still credited (new flag-tracked descent in the walker).
          Verified with both reviewer probes via npx oxlint: `if (false) killPid(result.pid);
          expect(true).toBe(true)` and `if (shouldCleanup) onTestFinished(() =>
          killPid(result.pid)); expect(true).toBe(true)` both now exit 1 with the missingCleanup
          diagnostic. Negative controls (unconditional onTestFinished, defensive guard inside the
          callback, try/finally with unconditional process.kill in finalizer) still exit 0. Added 4
          behavioral regressions in tests/lint-no-leaky-test-daemon.test.ts: unreachable conditional
          kill, conditional onTestFinished registration, process.on with non-exit event, kill in
          for-loop body. tools/eslint-rules/no-leaky-test-daemon.js:631-715."
        created_at: 2026-05-09T09:10:24.501Z
    kind: blocker
    resolved_at: 2026-05-09T09:11:06.796Z
    resolved_by: "@claude"
  - _ulid: 01KR5Y39FTRJ1Z3DVNR2VJ65B4
    anchor:
      type: code
      commit: 3596de394cdc1fe00fc6152af520f6b98624fb61
      line_end: 495
      line_start: 487
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KR5Y39FTW6RGKYKGESMGCP15
        author: Jacob Chapel
        body: 'MUST-FIX: `isProcessOnExitRegistration` accepts any `process.on(...)` callback as cleanup
          because it only checks that the function node is one of the call arguments; it does not
          verify that the event is an exit or signal event. I verified a synthetic test with
          `runKspec("serve start --detach --port 3456"); process.on("message", () =>
          killPid(result.pid)); expect(true).toBe(true);` and oxlint exited 0 with no
          `no-leaky-test-daemon` diagnostic. A `message` handler is not cleanup for the current
          detached daemon before the later assertion, so this still allows a leak while claiming
          cleanup was registered.'
        created_at: 2026-05-09T08:36:38.010Z
      - _ulid: 01KR6024T9BPXSE4YFJC1DQZ2G
        author: "@claude"
        body: 'Fixed: `isProcessOnExitRegistration` now constrains the event name to a process exit/signal
          event before crediting the registration as cleanup. Added `PROCESS_EXIT_EVENT_NAMES` set
          with `exit`, `beforeExit`, `SIGINT`, `SIGTERM`, `SIGHUP`, `SIGQUIT`, `SIGBREAK`. The first
          call argument must be a string literal naming one of these events; arbitrary names
          (`message`, `disconnect`, `warning`, etc.) no longer match because their callbacks fire
          during normal IPC and are not guaranteed to run before the test ends. Verified with
          reviewer probe via npx oxlint: `runKspec("serve start --detach --port 3456");
          process.on("message", () => killPid(result.pid)); expect(true).toBe(true)` now exits 1
          with the missingCleanup diagnostic. Negative control `process.on("exit", () =>
          killPid(p))` still exits 0. Added 1 behavioral regression in
          tests/lint-no-leaky-test-daemon.test.ts plus a positive negative-case test for the valid
          `process.on("exit", ...)` shape. tools/eslint-rules/no-leaky-test-daemon.js:475-538.'
        created_at: 2026-05-09T09:10:57.602Z
    kind: blocker
    resolved_at: 2026-05-09T09:11:12.705Z
    resolved_by: "@claude"
