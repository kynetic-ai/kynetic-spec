      - _ulid: 01KMQ4M0KGT5J3HFMX1E8SMRRG
        author: "@claude"
        body: "dispose() does not actually cancel an in-flight domain load.  only guards the final state
          transition with , but  still writes  /  after  has already cleared the stores. I confirmed
          this with a runtime repro against : patch  to resolve after 50ms, call , call  after 10ms,
          await the load, and  is non-null even though  is true and the domain state is . That
          violates @daemon-entity-cache ac-unregister-cleanup: unregister is supposed to release
          cached data and cancel in-flight reloads, but the disposed cache can be repopulated by
          work that was already running."
        created_at: 2026-03-27T07:54:55.473Z
      - _ulid: 01KMQ5GBBRH5121K21KEJV3YGZ
        author: "@claude"
        body: "Fixed: Added this.disposed checks after every await point in doLoadDomain() and
          loadSessionIndex(). In-flight loads now bail out before writing to stores if dispose() has
          been called. Also reordered the meta case to await loadMetaContext before writing to
          stores (was writing index before await, creating a partial-write window). Added regression
          test that starts loadDomain, calls dispose during flight, and verifies stores remain null
          after the load settles."
        created_at: 2026-03-27T08:10:23.992Z
