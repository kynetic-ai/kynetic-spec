    entries:
      - _ulid: 01KP6NVAP7AYEF56VMTG56YXFV
        author: Jacob Chapel
        body: 'When no remote HEAD exists, this scaffold hard-codes dispatch.base_branch to "main" instead
          of preserving the empty-config fallback chain. I reproduced this in a fresh repo on
          branch  with no remote: after   cd /home/chapel/Projects/kynetic-spec-dispatch && kspec
          init, the scaffolded file contained , but  on the same repo without the file
          resolved  from the current branch. That changes runtime behavior and can break dispatch
          for newly initialized repos, violating @scaffolded-project-config ac-file-valid-on-load
          (scaffolded config must resolve the same as an empty config).'
        created_at: 2026-04-14T19:00:19.271Z
      - _ulid: 01KP6PS2VGB9D3WFSKG58VP9QX
        author: "@claude"
        body: "Fixed: generateConfigContent() now calls resolveDefaultBranch() which implements the full
          fallback chain (remote HEAD → current branch → 'main'). This matches the dispatch
          resolver's empty-config path exactly, so the scaffolded base_branch value is always the
          same as what an empty config would resolve. The regression test now asserts 'dev' (current
          branch) instead of 'main' when on a non-main branch with no remote."
        created_at: 2026-04-14T19:16:34.288Z
    kind: blocker
    resolved_at: 2026-04-14T19:16:42.210Z
    resolved_by: "@claude"
