    entries:
      - _ulid: 01KR4S6ZP135D5736RMT2Q4HE1
        author: Jacob Chapel
        body: "MUST-FIX: Direct daemon launches through the current Node runtime are silently accepted. In
          the spawn/execFile runtime-form branch, args[0] must satisfy isRecognisedRuntimeArg(), but
          that helper only recognizes string/template values like 'node' or '/usr/bin/node'. A
          common and definite Node runtime expression, process.execPath, falls through and the call
          returns null even when argv contains DAEMON_ENTRY or 'dist/daemon/index.js'. I verified
          this with a synthetic oxlint file containing spawn(process.execPath, [DAEMON_ENTRY,
          '--port', '0']) and execFile(process.execPath, ['dist/daemon/index.js', '--port', '0']);
          oxlint exited 0 with 0 diagnostics. Those calls launch the real daemon entrypoint and
          should satisfy @daemon-test-guardrail-precision
          ac-direct-daemon-entry-invocations-flagged. Add recognition plus behavioral regressions
          for process.execPath forms without reintroducing the cat/grep false positives."
        created_at: 2026-05-08T21:52:01.730Z
      - _ulid: 01KR4T4BVZB35KFBTECJRFXS9T
        author: "@claude"
        body: "Fix cycle 5: extending isRecognisedRuntimeArg to recognise process.execPath as a Node runtime
          expression in the spawn-like runtime form, plus behavioral regressions for
          spawn(process.execPath, [DAEMON_ENTRY, ...]) and execFile(process.execPath, [...]).
          Precision preserved: only the exact MemberExpression process.execPath is recognised, so
          other-object.execPath and process.<other-prop> still fall through and the
          cat/grep/nodemon/docker/argv-only false positives remain rejected."
        created_at: 2026-05-08T22:08:04.479Z
    kind: blocker
    resolved_at: 2026-05-08T22:08:11.100Z
    resolved_by: "@claude"
