      side: head
    entries:
      - _ulid: 01KXMSR9GRN0Z8SHQWBNG71BP0
        author: Jacob Chapel
        body: "MUST-FIX: The public status adapter hard-codes every degraded lifecycle store to
          control_store_unavailable, so the required corrupt-store status is unreachable; the
          internal status adapter has the same hard-coded mapping at line 1263. A real committed
          version: 99 fixture produced HTTP 503 control_store_unavailable from both GET
          /api/agent/status and GET /api/agent/dispatch/status. The frozen contract distinguishes
          unavailable from corrupt and requires control_store_corrupt for malformed committed data.
          Use the same reliable classification on both status surfaces and add deep-equal
          corrupt/unavailable cases."
        created_at: 2026-07-16T06:27:48.888Z
    kind: blocker
