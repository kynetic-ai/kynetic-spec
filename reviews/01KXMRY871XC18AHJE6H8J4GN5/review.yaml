threads:
  - _ulid: 01KXMSR2V0CJB6HB1JT87JPS9H
    anchor:
      type: code
      commit: 224ff0ef123337050be9107fab0dafa7d90ecfcf
      line_end: 1150
      line_start: 1145
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXMSR2V0DV63ZH0C07PRMSYV
        author: Jacob Chapel
        body: "MUST-FIX: Matching task cleanup does not gate both non-stop task actions. The contract
          requires task pause and resume to return 409 invalid_transition whenever cleanup for that
          canonical task is pending or failed, independent of the current task-control row. This
          guard only rejects resume when the current mode is stopped and never rejects pause solely
          for cleanup. A direct probe with a schema-valid paused task plus matching pending cleanup
          printed pause:ALLOWED and resume:ALLOWED; resume can therefore delete the paused control
          while cleanup is still outstanding. Reject either action whenever the matching cleanup
          projection is non-idle, preserve unrelated-scope behavior, and add behavioral route cases
          for paused or absent control rows with matching cleanup."
        created_at: 2026-07-16T06:27:42.048Z
    kind: blocker
  - _ulid: 01KXMSR62R55W3J0QJZ71QFPDF
    anchor:
      type: code
      commit: 224ff0ef123337050be9107fab0dafa7d90ecfcf
      line_end: 304
      line_start: 300
      path: packages/daemon/src/routes/agent-dispatch.ts
      side: head
    entries:
      - _ulid: 01KXMSR62RV88D8AWKQER03J9K
        author: Jacob Chapel
        body: "MUST-FIX: Canonical mutation errors misclassify a corrupt committed control store as
          control_store_unavailable. DispatchControlStore records the real parser diagnostic with
          capitalized text such as Invalid dispatch-control.yaml, but this classifier performs
          case-sensitive lowercase substring checks. In a real shadow fixture committed with
          version: 99, POST /api/agent/dispatch/control returned HTTP 503 with code
          control_store_unavailable instead of the frozen control_store_corrupt code. Classify
          corruption robustly from the degraded state or a typed failure and add a corrupt-store
          control regression test."
        created_at: 2026-07-16T06:27:45.368Z
    kind: blocker
  - _ulid: 01KXMSR9GR34BM9521SAAE60P5
