        body: MUST-FIX —  creates both generated search fixtures under  () instead of an isolated system
          temp directory, and the cleanup  begins only after both builds return. If the first or
          second Pagefind build throws, the checkout is left with an untracked docs/build tree;
          while the test runs, those repository-local trees can also interfere with concurrent
          git-sensitive tests and content-hash checks. This violates the project test-isolation rule
          that tests run in temp directories outside the kspec repository. The fresh
          focused/full/E2E runs passed only because both builds and final cleanup succeeded. Move
          the fixture roots outside the checkout and arrange cleanup so a failure during either
          build cannot leak the first root.
        created_at: 2026-07-18T06:22:53.609Z
