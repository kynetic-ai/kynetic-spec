      side: head
    entries:
      - _ulid: 01KR5DTX22S97NJQKM49YVHGB2
        author: Jacob Chapel
        body: "MUST-FIX: shellCommandTokens still tokenizes shell strings with a plain whitespace split, so
          a direct daemon launch is missed whenever a value-consuming runtime flag has a quoted
          value containing whitespace. Evidence: a synthetic oxlint file with exec(\"node --require
          './pre load.js' dist/daemon/index.js --port 0\") exits 0 with no no-leaky-test-daemon
          diagnostic, even though the shell runs node with the quoted require value and then
          executes dist/daemon/index.js. Impact: @daemon-test-guardrail-precision
          ac-direct-daemon-entry-invocations-flagged is not satisfied for a valid direct
          daemon-entry invocation shape."
        created_at: 2026-05-09T03:52:25.922Z
      - _ulid: 01KR5FF1NCQVCSJZECFSG6TXAM
        author: "@claude"
        body: "Fixed: replaced the plain-whitespace shellCommandTokens split with a quote-aware
          state-machine tokeniser (tokenizeShellCommand) that keeps `'...'` and `\"...\"` pairs
          whole. The reviewer's failing probe `node --require './pre load.js' dist/daemon/index.js
          --port 0` now tokenises to [node, --require, ./pre load.js, dist/daemon/index.js, --port,
          0] (after stripShellQuotes), the value-consuming-flag walk advances past the quoted
          preload value, and the daemon entry is reported. Same tokeniser is used by
          shellCommandLeadsWithKspec for the kspec-CLI detection path. Tests added: single-quoted,
          double-quoted, and template-literal-with-interpolated-value variants in
          tests/lint-daemon-test-guardrails.test.ts."
        created_at: 2026-05-09T04:20:54.572Z
    kind: blocker
    resolved_at: 2026-05-09T04:20:57.870Z
    resolved_by: "@claude"
  - _ulid: 01KR5DV08MNMYMTZA7QJ5387AE
    anchor:
      type: code
      commit: f779610e0ae94922f64ca11cb04814507f8a6754
      line_end: 910
      line_start: 897
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KR5DV08M9FTXF8ZR4Q7S8PEE
        author: Jacob Chapel
        body: 'MUST-FIX: the no-script flag classifier omits parse-only Node forms such as --check/-c, so
          the rule reports a daemon launch for commands that only syntax-check the file and never
          execute it. Evidence: a synthetic oxlint file with execSync("node --check
          dist/daemon/index.js") exits 1 and reports Direct daemon entry launch, but node --check
          only parses the script. Impact: the classifier no longer matches daemon-starting behavior
          and creates a false positive contributors would need to suppress for a non-daemon
          subprocess.'
        created_at: 2026-05-09T03:52:29.204Z
      - _ulid: 01KR5FF8309MAH6E0592JM1RM7
        author: "@claude"
        body: "Fixed: extended isShellRuntimeNoScriptFlag to recognise --check, --syntax-check, and -c as
          parse-only flags so `node --check dist/daemon/index.js` aborts the walk and reports no
          launch. The short form -c is gated on runtime === \"node\" because Bun treats -c as
          `--config <path>` (value-consuming) — silently accepting that as no-script would create
          the symmetric false negative. New runtimeTagForToken/runtimeTagForArg helpers thread the
          runtime classification from the leading shell token / args[0] through both the
          exec/execSync walker and findScriptPositionInArgvArray. Bun's -c is also added to the
          value-consuming set so `bun -c bunfig.toml dist/daemon/index.js` is correctly reported (it
          was a latent false negative pre-fix). Tests added: shell-string and argv-array forms of
          --check, -c (Node parse-only), --syntax-check, process.execPath -c, and the Bun -c
          bunfig.toml positive regression."
        created_at: 2026-05-09T04:21:01.152Z
    kind: blocker
    resolved_at: 2026-05-09T04:21:04.400Z
    resolved_by: "@claude"
