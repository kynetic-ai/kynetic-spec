    entries:
      - _ulid: 01KR5SEJW90ABFXK1292RH3ETS
        author: Jacob Chapel
        body: 'MUST-FIX: statementContainsCleanup now treats any later statement containing a daemon-kill
          token as valid cleanup, even when that statement is not a cleanup registration and does
          not target the detached daemon. I verified this with a synthetic test containing
          runKspec("serve start --detach --port 3456"); console.log("SIGTERM docs");
          expect(true).toBe(true); oxlint exited 0 with no no-leaky-test-daemon diagnostic. A second
          probe with const cleanupDocs = "killPid should be used later" also exited 0. That violates
          @daemon-test-guardrail-precision ac-detached-cleanup-before-observation because cleanup
          was never registered before the later assertion. The same broad token predicate also lets
          try/finally finalizers with only console.log("SIGTERM docs") suppress the detached-start
          report, so the fix needs to verify an actual cleanup call or registration shape, not just
          token presence.'
        created_at: 2026-05-09T07:15:25.193Z
      - _ulid: 01KR5V6STZ7VH9PA00NQYEC1P2
        author: "@claude"
        body: >-
          Fixed in bb5e4d849 by replacing the token-only `hasDaemonCleanupPattern(text)` scan with
          an AST walker that requires a CallExpression whose callee statically resolves to a
          daemon-cleanup operation: `process.kill(...)`, `<expr>.kill('SIGTERM'|'SIGKILL'|'SIGINT',
          ...)`, the `killPid`/`stopDaemon`/`stopMockDaemon` Identifier callees, or a kspec CLI
          invocation whose first two non-flag positional tokens are `serve` then `stop` (covers the
          `runKspec`/`kspec` helper, `exec`/`execSync` shell forms, and
          `spawn`/`spawnSync`/`execFile`/`execFileSync` argv forms). The same walker gates the
          try/finally finalizer escape hatch and the await/expect observation check.


          Verified all three reviewer probes against the patched rule via direct `npx oxlint` runs:

          - `runKspec("serve start --detach --port 3456"); console.log("SIGTERM docs");
          expect(true).toBe(true);` → exits 1 with `no-leaky-test-daemon` diagnostic

          - `runKspec("serve start --detach --port 3456"); const cleanupDocs = "killPid should be
          used later"; expect(...)` → exits 1 with diagnostic

          - `try { runKspec("serve start --detach --port 3456"); expect(...); } finally {
          console.log("SIGTERM docs"); }` → exits 1 with diagnostic

          - Negative control with real cleanup `onTestFinished(() => killPid(pid))` still exits 0


          Added three behavioral regression tests in tests/lint-no-leaky-test-daemon.test.ts (one
          per probe) so the false-negative cannot return.


          Targeted guardrail tests: 19/19 suites, 187/187 tests pass. Full suite: 2413/2413 suites,
          8940 tests pass, 5 skipped (1968.1s).
        created_at: 2026-05-09T07:46:07.327Z
    kind: blocker
    resolved_at: 2026-05-09T07:46:10.665Z
    resolved_by: "@claude"
