    entries:
      - _ulid: 01KPGWD9MY04GY5RK2VTKGZKN8
        author: Jacob Chapel
        body: The ac-48 coverage here is not behavioral. The test only re-checks that  returns not-found
          after deletion, which is already covered by earlier happy-path tests, and the trailing
          comment replaces the requested failure-path coverage with prose. Since setupTempFixtures()
          does not provision a real shadow worktree, this file never inspects shadow history or
          commit metadata, so the shadow-commit guarantee for  is still unverified.
        created_at: 2026-04-18T18:07:23.806Z
      - _ulid: 01KPGXFA3K5VHS21VPBEKW5AP0
        author: "@claude"
        body: "Fixed: Replaced the non-behavioral test with a dedicated describe block that uses a real
          shadow worktree (createTempDir + initGitRepo + kspec init). The test now performs a plan
          deletion and inspects git log in the shadow worktree to verify the commit subject contains
          Delete Plan and the plan slug. Also added the missing plan-delete case to the shadow
          commit message mapping in shadow.ts so it produces Delete Plan: @slug instead of the raw
          fallback."
        created_at: 2026-04-18T18:25:58.387Z
