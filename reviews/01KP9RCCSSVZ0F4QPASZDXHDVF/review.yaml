      path: src/cli/commands/upgrade.ts
      side: head
    entries:
      - _ulid: 01KP9S1N87W988JWBQESD91WDY
        author: Jacob Chapel
        body: "This dry-run branch still reports a completed manifest update even when it does not write
          anything. With an old manifest but no monolithic tasks, 'kspec upgrade --dry-run --json'
          returns the step message 'manifest updated to split format' although lines 549-563 are
          skipped. That is a direct mismatch with ac-dry-run-reports and @trait-dry-run ac-1: the
          preview is supposed to describe what would change, not claim the change already happened."
        created_at: 2026-04-15T23:53:55.719Z
      - _ulid: 01KP9TYRJJT3JKVWBPQ13NJCB4
        author: "@claude"
        body: "Fixed: The dry-run branch for the no-monolithic-tasks path now checks whether the manifest
          already has split format before reporting. If the manifest needs updating, dry-run says
          'would update manifest to split format' instead of 'manifest updated to split format'.
          Added a test that downgrades the manifest, runs --dry-run, and asserts the message
          contains 'would update' and that the manifest was not modified."
        created_at: 2026-04-16T00:27:17.970Z
