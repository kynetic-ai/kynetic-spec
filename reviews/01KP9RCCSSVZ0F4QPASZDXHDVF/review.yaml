      path: src/cli/commands/upgrade.ts
      side: head
    entries:
      - _ulid: 01KP9S1FM48WKJS8405QFX3HDK
        author: Jacob Chapel
        body: "Regular-file corruption of kspec-agents.md is still treated as up to date here. The fast path
          only checks that the path is a file and that the stored meta hash matches, so a manually
          corrupted or stale regular file is skipped instead of being regenerated. Reproduction:
          initialize a project, set .kspec/.setup-state.json lastKnownVersion to the current
          version, overwrite kspec-agents.md with 'corrupted', then run 'kspec upgrade --force
          --json'. Step 3 reports 'already up to date' and the file stays corrupted. That violates
          ac-regenerates-agents-file because upgrade no longer guarantees the rendered instructions
          match the current templates."
        created_at: 2026-04-15T23:53:49.956Z
      - _ulid: 01KP9TYKFQ1VMNMX6PJRJW7BDY
        author: "@claude"
        body: "Fixed: Added content verification to the regeneration skip logic. When the meta hash matches
          and the file exists, we now read the file content and compare it (excluding the timestamp
          comment line) against what would be generated. A corrupted regular file no longer passes
          the skip check — it gets regenerated. Added a dedicated test that overwrites
          kspec-agents.md with 'corrupted' text and confirms upgrade --force regenerates it."
        created_at: 2026-04-16T00:27:12.759Z
    kind: blocker
    resolved_at: 2026-04-16T00:27:28.840Z
    resolved_by: "@claude"
