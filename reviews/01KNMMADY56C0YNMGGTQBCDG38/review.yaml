    entries:
      - _ulid: 01KNMMMBAV7N3PR4E8XR3D21PK
        author: Jacob Chapel
        body: "This cache-hit branch can return an incomplete plan list. The plans domain is intentionally
          index-only on initial load, and individual plan details are populated on demand, so a
          ready domain may have only some details cached. Here the loader maps the full index
          through getPlanDetail() and returns any non-null subset as soon as at least one detail
          exists. I reproduced that state against the submitted code with two plans on disk and only
          one cached detail: loadPlans() returned 1 plan from cache while disk held 2. List-style
          callers of loadPlans() will silently drop uncached plans instead of falling back to disk
          unless the detail tier is complete."
        created_at: 2026-04-07T18:52:42.204Z
      - _ulid: 01KNMNRYVHT5Z533BBH4AXTNJ8
        author: Jacob Chapel
        body: "Fixed in 2723f2529: loadPlans() now uses cached plan data only when getPlansIndex() returns a
          real index and every indexed plan has a populated detail record. Partial-detail and
          null-index states now fall through to disk, and parser coverage includes both
          regressions."
        created_at: 2026-04-07T19:12:41.841Z
    kind: blocker
    resolved_at: 2026-04-07T19:13:04.822Z
    resolved_by: Jacob Chapel
  - _ulid: 01KNMMMFS578K2JA5X66Z1APWK
    anchor:
      type: code
      commit: 7e7d977f1ee9fa6b316d425babd9ba06eab87328
      line_end: 188
      line_start: 183
      path: src/parser/reviews.ts
      side: head
    entries:
      - _ulid: 01KNMMMFS6GTE0J1QAZ00NA139
        author: Jacob Chapel
        body: "The same partial-detail bug exists for reviews. Reviews also load index first and keep detail
          records on demand, but this code returns whatever subset of review details happens to be
          cached once the domain is ready. I reproduced it with two review records on disk and a
          cache that exposed both index entries but only one detail: loadReviewRecords() returned 1
          review instead of 2. Any review list/read path that relies on loadReviewRecords() can
          therefore hide uncached reviews after a single detail fetch unless this branch verifies
          the detail tier is complete before returning cached data."
        created_at: 2026-04-07T18:52:46.758Z
      - _ulid: 01KNMNS1F7AN0C7TEKRTMZVFEX
        author: Jacob Chapel
        body: "Fixed in 2723f2529: loadReviewRecords() now requires a real reviews index plus complete
          detail coverage before returning cache data. Partial-detail and null-index cache states
          fall through to disk, with matching regression tests added."
        created_at: 2026-04-07T19:12:44.519Z
    kind: blocker
