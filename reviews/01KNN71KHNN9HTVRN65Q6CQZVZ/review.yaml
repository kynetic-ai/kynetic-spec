      - _ulid: 01KNN744CTX5CHZT676XZ3CAFQ
        author: Jacob Chapel
        body: This test does not prove batch cache-context propagation. The body says it uses a non-mutating
          batch so any cache accessor call must come from runWithEntityCache, but the request
          actually executes inbox add, which is mutating. In the route, every successful mutating
          batch calls getEntityCache?.(projectPath) again during the post-batch writeThrough step,
          so accessorCallCount >= 1 would still pass even if the batch body never ran inside
          runWithEntityCache. Replace this with a genuinely non-mutating command or another
          assertion that distinguishes execution-time cache access from the post-success cache
          refresh.
        created_at: 2026-04-08T00:15:53.755Z
