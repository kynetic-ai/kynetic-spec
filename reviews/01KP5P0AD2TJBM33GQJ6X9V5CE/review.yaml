          Slugs:     scaffolded-project-config

          Type:      requirement

          Maturity:  draft

          Implementation: in_progress


          ─── Description ───

          When a project is initialized with full setup, a project config

          file is scaffolded at the project root with placeholder values

          for the knobs that real projects are expected to customize.

          The scaffolded file uses only documented config keys, is valid

          on first load, and marks itself visibly as a template that the

          user should review.



          ─── Acceptance Criteria ───
            [ac-file-scaffolded]
              Given: A project has no project config file at its root

              When: The project is initialized with full setup

              Then: A project config file is created at the project root

            [ac-file-valid-on-load]
              Given: A scaffolded project config file has just been written

              When: The config is loaded by any kspec command

              Then: The file parses successfully and produces the same resolved
          configuration as an empty config would, so scaffolding does

          not change runtime behavior

            [ac-placeholder-publication-mode]
              Given: A scaffolded project config file is written

              When: The file contents are inspected

              Then: The dispatch publication mode key is present with a
          default value and an adjacent comment naming the other

          accepted values

            [ac-placeholder-base-branch]
              Given: A scaffolded project config file is written

              When: The file contents are inspected

              Then: The dispatch base branch key is present with a resolved
          value taken from the current repository's default branch

            [ac-placeholder-coverage]
              Given: A scaffolded project config file is written

              When: The file contents are inspected

              Then: The coverage scan paths key is present as a commented-out
          example with sample paths, so users know the knob exists

          without forcing a choice at init time

            [ac-file-exists-preserved]
              Given: A project already has a project config file at its root

              When: The project is re-initialized or setup is re-run without
          the force flag

              Then: The existing file is preserved byte-for-byte

            [ac-file-force-overwrites]
              Given: A project already has a project config file and setup is
          invoked with the force flag

              When: Setup runs

              Then: The existing file is replaced with a freshly scaffolded
          template

            [ac-file-force-backup]
              Given: A project already has a project config file and setup is
          invoked with the force flag

              When: Setup overwrites the existing file

              Then: The previous content is preserved as a sibling backup
          file whose path is reported in the setup output



