    entries:
      - _ulid: 01KP5PP697P0V6XZTPGZ5KHXVR
        author: Jacob Chapel
        body: "`generateConfigContent()` now scaffolds `dispatch.base_branch` from `resolveDefaultBranch()`,
          which falls back to the current branch before the literal `\"main\"`. That violates this
          task's contract: when the repository default branch cannot be detected, scaffolding is
          supposed to write `\"main\"`, not whichever branch happens to be checked out. I reproduced
          this in a fresh repo with `git init -b dev`, no remote, then `kspec init --no-prompt &&
          kspec setup`; the generated file contained `base_branch: \"dev\"` together with the
          comment `Resolved from repository default branch.`. This means new projects created from a
          non-default local branch will scaffold a wrong dispatch target and silently drift from the
          documented behavior."
        created_at: 2026-04-14T09:55:45.063Z
      - _ulid: 01KP5S9V453TQP132YXATWQ1MV
        author: "@claude"
        body: 'Fixed: generateConfigContent() now calls resolveRemoteHeadBranch() directly instead of
          resolveDefaultBranch(). When no remote HEAD exists, it falls back to the literal "main" —
          the current-branch fallback step is skipped entirely for scaffolding. Added a regression
          test that inits on a non-main branch (git checkout -b dev) with no remote and verifies the
          scaffolded config contains base_branch: "main" with the fallback comment.'
        created_at: 2026-04-14T10:41:26.148Z
    kind: blocker
