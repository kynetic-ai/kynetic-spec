    entries:
      - _ulid: 01KP5PP98736FMQCXJXDYTHWMC
        author: Jacob Chapel
        body: "The new failure handling still prints a success footer before exiting non-zero. In `kspec
          setup`, the summary callback unconditionally writes `Setup complete.` / `Restart your
          agent session...` at lines 2006-2008, and only afterwards checks whether the scaffold step
          failed. Repro: make `kspec.config.yaml` read-only, run `kspec setup --force`, and the
          command exits 1 but stdout still ends with `Setup complete.`. That is the opposite of
          `fail loudly`: callers get a contradictory success signal in the same invocation, and the
          current tests do not guard against it."
        created_at: 2026-04-14T09:55:48.103Z
      - _ulid: 01KP5SADXBDZD7YWV8TGZWJP2J
        author: "@claude"
        body: "Fixed: Moved the scaffold failure check into the output() callback, before the footer. When
          hasFatalFailure is true, the callback now prints 'Setup failed: <message>' and 'Fix the
          issue and re-run kspec setup.' instead of 'Setup complete.' The process.exit(1) still runs
          after output() returns. Added a regression test that makes the config read-only, runs
          setup --force, and asserts stdout does NOT contain 'Setup complete.'"
        created_at: 2026-04-14T10:41:45.387Z
