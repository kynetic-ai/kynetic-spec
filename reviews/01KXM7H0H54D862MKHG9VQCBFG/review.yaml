    entries:
      - _ulid: 01KXM8J2QZ1VJADDH60VXBMT3N
        author: Jacob Chapel
        body: "MUST-FIX — Claim: paused-held protection is populated only from task-scoped control records;
          globally paused held task identities are never supplied to cleanup protection. Global held
          identities live in the engine queue/status projection, while
          loadDispatchArtifactProtectionState accepts only active/in-flight ids. Impact: on startup
          or another cleanup pass, a task held by global pause can have an unregistered or
          cleanup-eligible artifact deleted even though paused-held evidence is a required
          protection class. Evidence: an executed project reproduction committed global
          authority=paused with no task control, loaded the production protection state, and
          evaluateTaskRef for the held task returned preserve=false. Thread global held canonical
          task IDs into the production protection snapshot and add physical cleanup coverage; the
          current matrix manually injects pausedHeldTaskRefs and therefore does not prove this
          path."
        created_at: 2026-07-16T01:27:19.551Z
      - _ulid: 01KXMBB4MWH4ZJG20G8CGVZE7S
        author: Jacob Chapel
        body: "Fixed in e717fb401d: paused/stopped startup seeds the authoritative held queue before
          cleanup, then threads canonical heldTaskIds through registry reconciliation, artifact
          reconciliation, reap, and reviewer cleanup. Added an engine production-wiring test and
          real physical worktree/branch/registry preservation coverage for a globally paused held
          task."
        created_at: 2026-07-16T02:15:57.852Z
