        author: Jacob Chapel
        body: "MUST-FIX — Claim: closing-record protection compares the raw record identity directly against
          canonical controlled keys and bypasses the alias-to-canonical map used by the other
          evaluators. Impact: a historical slug-only closing record for a canonically paused or
          stopped-pending-cleanup task can be physically reaped, and terminal reconciliation can
          self-heal it to completed/closed, destroying the evidence this task must preserve.
          Evidence: an executed builder reproduction with a normalized registry snapshot preserved
          evaluateTaskRef(@task-alias), but evaluateClosingRecordForReap(raw slug-only record)
          returned preserve=false; supplying task_id made the same closing decision preserve=true.
          Use the mapped canonical key here and add behavioral reap plus terminal-reconciliation
          coverage for a historical alias-only record."
        created_at: 2026-07-16T01:27:14.005Z
      - _ulid: 01KXMBAYGXNTHBFWX9YKRR5WJX
        author: Jacob Chapel
        body: "Fixed in e717fb401d: closing-record reap now resolves the raw alias through the normalized
          registry alias-to-canonical map. Added real physical reap and terminal self-heal
          regressions for historical slug-only records controlled by canonical task ID."
