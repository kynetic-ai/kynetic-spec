      - _ulid: 01KM83THTMZN5W5JSRMC6BVH42
        author: Jacob Chapel
        body: Setting task_storage.format=split now unconditionally switches every read/write path to the
          split backend, but there is still no migration gate. resolveTaskDataManager() returns the
          split manager solely from the manifest flag, and split loadAllTasks() only scans per-task
          directories. On a project that flips the setting before migration, existing tasks in
          project.tasks.yaml will disappear instead of producing the spec-required error that
          migration must run first (@task-storage-activation ac-3).
        created_at: 2026-03-21T11:52:24.660Z
