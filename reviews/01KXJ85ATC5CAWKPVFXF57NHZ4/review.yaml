  - _ulid: 01KXJ9695ATWJBVCNHNZEP2VNA
    anchor:
      type: code
      commit: b0a8a2e844526cf3cdf5ba9d85c596f1d6ac9b5f
      line_end: 4159
      line_start: 4155
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXJ9695A11GK8EWWJZXKVJQC
        author: Jacob Chapel
        body: "MUST-FIX — External paused/stopped-to-running publication reconstruction is launched with a
          void expression and no rejection handler. If _reconstructCurrentCandidates() fails while
          loading current tasks/meta or draining, the rejection escapes the synchronous store
          listener and terminates Node as an unhandled rejection. Evidence: an exact tsx
          reproduction constructed the engine with a lifecycle store, published paused then running,
          forced _reconstructCurrentCandidates() to reject, and the process exited 1 with the stack
          at dispatch.ts:4157 and Mutex.runExclusive. Impact: a valid externally committed
          resume/start can crash the dispatch daemon instead of containing and reporting a
          reconstruction failure. Track/handle this promise with deterministic error reporting and
          add a behavioral regression that forces reconstruction failure on an external running
          publication."
        created_at: 2026-07-15T06:59:52.618Z
      - _ulid: 01KXJAVQMNMGESD0AM258P1DTN
        author: Jacob Chapel
        body: "Fixed in commit 5f9dd78187: external lifecycle reconstruction is now owned in a tracked
          promise set, rejects through a stable dispatch error report, and is awaited during
          shutdown. Added a behavioral paused-to-running external publication regression that forces
          reconstruction failure and verifies containment/reporting."
        created_at: 2026-07-15T07:29:04.149Z
    kind: blocker
    resolved_at: 2026-07-15T07:29:07.522Z
    resolved_by: Jacob Chapel
