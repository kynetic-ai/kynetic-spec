    entries:
      - _ulid: 01KXJ9695A11GK8EWWJZXKVJQC
        author: Jacob Chapel
        body: "MUST-FIX — External paused/stopped-to-running publication reconstruction is launched with a
          void expression and no rejection handler. If _reconstructCurrentCandidates() fails while
          loading current tasks/meta or draining, the rejection escapes the synchronous store
          listener and terminates Node as an unhandled rejection. Evidence: an exact tsx
          reproduction constructed the engine with a lifecycle store, published paused then running,
          forced _reconstructCurrentCandidates() to reject, and the process exited 1 with the stack
          at dispatch.ts:4157 and Mutex.runExclusive. Impact: a valid externally committed
          resume/start can crash the dispatch daemon instead of containing and reporting a
          reconstruction failure. Track/handle this promise with deterministic error reporting and
          add a behavioral regression that forces reconstruction failure on an external running
          publication."
        created_at: 2026-07-15T06:59:52.618Z
    kind: blocker
  - _ulid: 01KXJ96C610Q9JKG3AK5HV5X3K
    entries:
      - _ulid: 01KXJ96C61D3Q2N7V0MAN69H9C
        author: Jacob Chapel
        body: "Review evidence log (informational; no separate worker action). Files read: every changed
          production/test file; surrounding scheduler, queue, invocation, store, bootstrap, schema,
          task/spec/plan, and both prior reviews. Commands run: complete base-to-head and fix-cycle
          diffs, task/item/plan/review lookups, AC annotation searches, focused source/context
          reads, focused 215-test run, uncached full npm test, format, repo/focused lint, typecheck,
          diff check, three kspec validation modes, and an exact external-publication rejection
          reproduction. Claims verified: all three cycle-2 blocker fixes; committed authority
          bootstrap; stale/current reconstruction; complete named ingress and transition coverage;
          worker full-suite count. Categories searched: correctness/concurrency, lifecycle matrix
          and edge cases, error handling, security/sanitization, test quality/AC proof, and
          scheduler/store integration. Finding: one production error-path blocker above.
          Shared/package guidance surfaces were not touched, so shared-guidance neutrality checks
