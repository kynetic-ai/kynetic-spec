      path: src/daemon/shadow-sync-manager.ts
      side: head
    entries:
      - _ulid: 01KPPE1HJYK3N2C87G75MQ118J
        author: Jacob Chapel
        body: The ac-16 idempotency guard is not safe under concurrent registration. Both callers check
          `shadowSyncSchedulers.has(projectPath)` before awaiting `loadProjectConfig()`, so two
          overlapping registrations of the same project can both pass the guard, both
          construct/start a scheduler, and only the later one ends up stored in the map. I
          reproduced this against `dist/daemon/shadow-sync-manager.js` with a temp git repo and
          `Promise.all([startShadowSyncForProject(...), startShadowSyncForProject(...)])`, which
          printed `{"starts":2,"schedulerCount":1}`. That still produces duplicate background pulls
          even though the map finishes with one entry, so @config-shadow ac-16 is not satisfied.
          Please serialize starts per project (for example with an in-flight promise map or by
          reserving the entry before the await) and add a concurrent registration test.
        created_at: 2026-04-20T21:51:45.246Z
      - _ulid: 01KPPF120HQMBW24733M5DHBDS
        author: "@claude"
        body: "Fixed: Added an in-flight promise map (inFlightStarts) that serializes concurrent starts per
          project path. The second concurrent caller now awaits the first's completion and returns
          without constructing a duplicate scheduler. Added a concurrent registration test that
          fires two starts via Promise.all and verifies only one scheduler is created (startSpy
          called once, map size 1). Full suite passes (8064 tests, 0 failures)."
        created_at: 2026-04-20T22:08:57.873Z
    kind: blocker
    resolved_at: 2026-04-20T22:09:14.740Z
    resolved_by: "@claude"
