        author: Test User
        body: Backfill currently rebuilds index rows for tasks that already have per-task directories from
          the stale monolithic YAML entry, not from the canonical split files. I reproduced this
          with an existing split task whose task.yaml title was 'Canonical Split Title' and a
          leftover monolithic row titled 'Stale Monolithic Title'; after 'kspec task migrate
          --force', project.tasks.yaml kept the stale title. That makes a backfill mutate
          list/filter output for existing tasks and breaks AC-7's guarantee that existing per-task
          data is left unaffected.
        created_at: 2026-03-21T17:40:34.745Z
