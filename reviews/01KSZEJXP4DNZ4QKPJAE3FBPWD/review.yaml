threads:
  - _ulid: 01KSZEVC0V42FTMJW161NFKH3F
    anchor:
      type: code
      commit: 1d6a27fd910eb070cda8dfe163783b1f94bff99e
      line_end: 486
      line_start: 477
      path: src/cli/commands/agent.ts
      side: head
    entries:
      - _ulid: 01KSZEVC0VPNQ1RH9Y2WP3A64K
        author: Jacob Chapel
        body: 'MUST-FIX: agent run --dry-run still reports only the runner-resolved adapter id and prompt;
          it never resolves or reports the runner process invocation contract. I reproduced a runner
          with process.executable=/tmp/review-runner-command, process.args, and process.cwd: `kspec
          agent run dry --dry-run --json` exited 0 with JSON containing adapter:"codex-acp" and no
          command reference, process origin metadata, cwd source, args source, or env policy. This
          violates the task requirement that process.executable be resolved into the command
          reference reported by dry-run and the AC requiring diagnostics to identify
          command/cwd/args/env sources without exposing secrets.'
        created_at: 2026-05-31T16:46:06.875Z
      - _ulid: 01KSZH8MHSHJ2Y4KBXVFR9DRE3
        author: "@claude"
        body: "Fix cycle 3: agent run --dry-run now resolves the runner invocation contract and emits a
          typed runner_invocation block alongside the existing dry-run JSON. The block surfaces
          runner name, source layer, resolved adapter, command + command_source, cwd + cwd_source,
          runner_args + runner_args_source, env_policy (inherit policy, pass keys, set keys with
          per-key origin, secret keys, secret source), overrides, and a typed preflight outcome.
          Implementation lives in summarizeRunnerInvocation() in src/agents/runners.ts:1080+; the
          CLI wiring is src/cli/commands/agent.ts:464-510 (buildDryRunInvocationSummary +
          renderDryRunInvocationSummary). Env values and secret values are never carried into the
          diagnostic surface — only key names. Four new behavioral tests in tests/cli-agent.test.ts
          cover the runner-backed happy path, an unspawnable preflight diagnostic, the
          implicit/legacy path, and the auto-approve/runner-args split."
        created_at: 2026-05-31T17:28:18.745Z
    kind: blocker
    resolved_at: 2026-05-31T17:28:32.713Z
    resolved_by: "@claude"
  - _ulid: 01KSZEVF9MCGWRD107MQEV2N4C
    anchor:
      type: code
      commit: 1d6a27fd910eb070cda8dfe163783b1f94bff99e
      line_end: 2773
      line_start: 2766
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KSZEVF9MQ9GFZB4DSYVYS2V5
        author: Jacob Chapel
        body: "MUST-FIX: dispatch preflight resolves the runner contract but never calls the new executable
          preflight, so a runner with a missing/non-executable process.executable is accepted past
          dispatch preflight. The typed unspawnable_command error is only thrown later inside
          runInvocation, where the dispatch catch path treats it as an invocation failure and
          retries it instead of reporting the preflight diagnostic/skip path. This leaves the
          preflight surface out of sync with the new contract and can retry deterministic runner
          configuration errors."
        created_at: 2026-05-31T16:46:10.228Z
      - _ulid: 01KSZH8SQ2CGEAPMRAAR63KN14
        author: "@claude"
        body: "Fix cycle 3: dispatch preflight now calls preflightRunnerInvocation immediately after
          resolving the runner contract (src/agent-runtime/dispatch.ts:2789-2818). An unspawnable
          runner-configured command surfaces as a typed RunnerResolutionError('unspawnable_command')
          at the dispatch preflight gate, lands in the AGENT-SKIP path (skip + task note, no retry),
          and never reaches runInvocation. The retry path is no longer triggered for deterministic
          runner configuration errors. Also refactored preflightRunnerInvocation to share its
          env-aware PATH-resolution helper with a new non-throwing probeRunnerInvocationExecutable()
          used by the dry-run summary. A new behavioral test in tests/agent-dispatch-engine.test.ts
          under 'Dispatch runner resolution preflight' asserts that with a runner config pointing at
          a missing binary, _spawnInvocation returns false, runInvocation is never called,
          entry.retryCount stays at 0, and both the error log and AGENT-SKIP task note contain
          'unspawnable_command' plus the missing executable path."
        created_at: 2026-05-31T17:28:24.034Z
    kind: blocker
    resolved_at: 2026-05-31T17:28:37.430Z
    resolved_by: "@claude"
  - _ulid: 01KSZFGJ6YFMZ9C6TCKB80XNG9
    entries:
