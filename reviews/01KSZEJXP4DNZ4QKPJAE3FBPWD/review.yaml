    entries:
      - _ulid: 01KSZEVC0VPNQ1RH9Y2WP3A64K
        author: Jacob Chapel
        body: 'MUST-FIX: agent run --dry-run still reports only the runner-resolved adapter id and prompt;
          it never resolves or reports the runner process invocation contract. I reproduced a runner
          with process.executable=/tmp/review-runner-command, process.args, and process.cwd: `kspec
          agent run dry --dry-run --json` exited 0 with JSON containing adapter:"codex-acp" and no
          command reference, process origin metadata, cwd source, args source, or env policy. This
          violates the task requirement that process.executable be resolved into the command
          reference reported by dry-run and the AC requiring diagnostics to identify
          command/cwd/args/env sources without exposing secrets.'
        created_at: 2026-05-31T16:46:06.875Z
    kind: blocker
  - _ulid: 01KSZEVF9MCGWRD107MQEV2N4C
    anchor:
      type: code
      commit: 1d6a27fd910eb070cda8dfe163783b1f94bff99e
      line_end: 2773
      line_start: 2766
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KSZEVF9MQ9GFZB4DSYVYS2V5
        author: Jacob Chapel
        body: "MUST-FIX: dispatch preflight resolves the runner contract but never calls the new executable
          preflight, so a runner with a missing/non-executable process.executable is accepted past
          dispatch preflight. The typed unspawnable_command error is only thrown later inside
          runInvocation, where the dispatch catch path treats it as an invocation failure and
          retries it instead of reporting the preflight diagnostic/skip path. This leaves the
          preflight surface out of sync with the new contract and can retry deterministic runner
          configuration errors."
        created_at: 2026-05-31T16:46:10.228Z
    kind: blocker
