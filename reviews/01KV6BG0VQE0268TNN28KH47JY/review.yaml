      path: src/parser/actor-field-inventory.ts
      side: head
    entries:
      - _ulid: 01KV6CR06HF3W4AT756Y7P3PSW
        author: Jacob Chapel
        body: "MUST-FIX: split-task history authors are omitted from the actor inventory and migration. The
          task inventory lists only notes[].author, todos[].added_by, and assignee for task storage,
          while the migration loads tasks through manager.loadAllTasks(), which strips the task.yaml
          history array before rewriting. I confirmed behavior with a real temp project containing
          an existing task.yaml history entry `{ author: \"@codex\", command: \"task-set\" }`: after
          runActorNormalization, visible task actor fields were canonicalized but
          `history[0].author` remained `@codex`. `HistoryEntry.author` is explicitly documented as
          an author identity in src/parser/task-data-manager.ts, so leaving it out violates
          @actor-history-normalization ac-6's exhaustive actor/author-field inventory and means
          historical task author records are not normalized."
        created_at: 2026-06-15T19:39:42.161Z
    kind: blocker
