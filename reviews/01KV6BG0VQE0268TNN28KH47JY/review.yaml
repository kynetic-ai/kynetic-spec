          Commands run: kspec task get; kspec review for-task/get; kspec item get
          @actor-history-normalization and @actor-identity-model; git diff/log/merge-base; rg
          searches for actor fields and AC annotations; two focused npx tsx behavioral probes for
          task history; kspec validate refs/alignment/completeness with --warnings-ok; npm run
          format:check; npm run lint -- --quiet; npx oxlint on changed TS/test files; npm run
          typecheck; npm test.


          Claims verified: prior dry-run blocker is fixed by running actor preview before storage
          readiness skips; prior operator-map target blocker is fixed by canonicalizing/rejecting
          targets before writes; AC annotations exist for @actor-history-normalization ac-1..ac-6
          and @actor-identity-model ac-2; tests are behavioral rather than source-scanning.


          Categories searched: correctness, edge cases, error handling, test quality, integration,
          and docs. Shared-guidance neutrality did not apply: changed docs were under docs/guides,
          not package-shipped guidance surfaces.
        created_at: 2026-06-15T19:39:28.421Z
