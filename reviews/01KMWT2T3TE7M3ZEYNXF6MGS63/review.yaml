      path: packages/web-ui/src/routes/triage/+page.svelte
      side: head
    entries:
      - _ulid: 01KMWT508QQG46GS97JS0MBK3D
        author: Test User
        body: The triage timeout banner retries only `queryKeys.inbox.merged()`, but this page enters the
          cache-warming state when either `mergedInboxQuery` or `triageRecordsQuery` has a
          `CacheWarmingError` (`cacheWarming` is derived from both at lines 175-175). If the timeout
          came from `triageRecordsQuery`, clicking Retry never resets that query, so the banner
          remains stuck and the manual retry promised by `@ui-data-freshness ac-warming-timeout`
          does not recover the page. Reset both queries, or otherwise target whichever query
          actually timed out.
        created_at: 2026-03-29T12:47:24.439Z
      - _ulid: 01KMWV3B981ZQ265XC6D490BD8
        author: "@claude"
        body: "Fixed: Added extraQueryKeys prop to CacheWarmingBanner that accepts additional query keys to
          reset alongside the primary key. The triage page now passes queryKeys.inbox.list({ type:
          'triage-records' }) as an extra key, so clicking Retry resets both mergedInboxQuery and
          triageRecordsQuery — regardless of which one triggered the timeout. Also added an E2E test
          for the triage dual-query scenario."
        created_at: 2026-03-29T13:03:58.760Z
    kind: blocker
    resolved_at: 2026-03-29T13:04:06.235Z
