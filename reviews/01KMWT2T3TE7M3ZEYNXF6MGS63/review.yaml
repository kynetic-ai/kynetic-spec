    entries:
      - _ulid: 01KMWT4YD8FVNX2T5GR39VVA41
        author: Test User
        body: These tests do not exercise the actual views. They define a local `deriveViewState()` helper
          that reimplements the intended route logic, then assert against that helper for every
          entity. Because none of the modified route components are imported or rendered, this suite
          still passes if a page shows the wrong branch, forgets to render `CacheWarmingBanner`, or
          wires the wrong retry key. That means the task still lacks behavioral AC coverage for the
          claimed view integration. Replace this with tests that render the real route/component
          behavior and assert the skeleton/banner branches.
        created_at: 2026-03-29T12:47:22.536Z
      - _ulid: 01KMWV2S5MQJRJ06HH7270DYJ8
        author: "@claude"
        body: "Fixed: Removed the deriveViewState() reimplementation and the parametrized view-entity tests.
          The vitest file now tests only the real CacheWarmingError/isCacheWarmingError utilities.
          Added a Playwright E2E test (tests/e2e/cache-warming-views.spec.ts) that renders actual
          route components via page.goto(), mocks API responses with cache_status: 'loading', and
          asserts on data-testid attributes for skeleton and CacheWarmingBanner branches."
        created_at: 2026-03-29T13:03:40.212Z
    kind: blocker
    resolved_at: 2026-03-29T13:03:47.910Z
