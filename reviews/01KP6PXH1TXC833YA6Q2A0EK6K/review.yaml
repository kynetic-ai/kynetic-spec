              feat(lint): add no-leaky-test-daemon rule for daemon cleanup enforcement
              Custom oxlint rule that detects daemon-spawning patterns in test files
              lacking cleanup registration (onTestFinished, afterEach with kill/stop,
              or try/finally). Catches two anti-patterns:
              1. Calls with "serve start --detach" without cleanup
