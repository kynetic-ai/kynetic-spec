              fix(lint): use daemon-specific patterns in afterEach and try/finally checks
              Extracted hasDaemonCleanupPattern() to share daemon-specific detection
              across isAfterEachWithCleanup() and isInTryWithFinallyCleanup(). Now
              recognizes process.kill(), .kill("SIG*"), SIGTERM/SIGKILL/SIGINT,
              killPid, stopDaemon, stopMockDaemon, and 'serve stop' as valid cleanup.
              Previously afterEach only matched SIGTERM/killPid/stopDaemon/'serve stop',
              so afterEach(() => process.kill(child.pid)) was a false positive. And
              isInTryWithFinallyCleanup used generic 'kill'/'stop' substrings, so
              finally { stopUnrelatedFixture() } was a false negative.
              Added 3 new test cases: afterEach with process.kill (negative),
              afterEach with child.kill("SIGTERM") (negative), try/finally with
              unrelated teardown (positive). All 2118 suites pass (7743 tests).
              Task: @task-lint-rule-test-daemon-cleanup
              Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>

