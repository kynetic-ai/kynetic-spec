          commit 5eee12c46238f0ab1f1dc65df02b4db6d9246e14

          Author: Jacob Chapel <jacob.chapel@gmail.com>

          Date:   Mon Apr 13 17:37:11 2026 -0700

              fix(shadow): guard shadow-lifecycle ops against linked-worktree cross-contamination
              Closes the 2026-04-11 incident where a kspec command routed through a
              linked-worktree cwd silently destroyed the main working tree's shadow
              worktree via git's shared worktree admin (find_worktree_by_suffix).
              Three-layer defense:
              1. Absolute paths — initializeShadow, repairShadow, and
                 createOrphanBranchFallback now pass the absolute worktreeDir to every
                 `git worktree add/remove` invocation, so git's suffix matcher cannot
                 reach across linked-worktree admin entries.
              2. Function-level guard — new assertMainWorkingTree() uses
                 resolveProjectRoots to refuse initializeShadow/repairShadow calls
                 whose projectRoot is a linked worktree. Defense-in-depth for future
                 callers that forget to resolve mainRoot.
              3. Command-level hard-error — kspec init and kspec setup detect linked
                 worktrees via resolveProjectRoots at entry and exit non-zero with
                 instructional guidance identifying the main working tree path.
                 shadow status/repair/log/sync continue to work correctly from linked
                 worktrees because they already resolve to mainRoot via
                 resolveCliProjectRoot.
              Test-helper contract: tests/helpers/cli.ts `kspec()` now requires an
              explicit cwd at runtime; the silent `cwd ?? process.cwd()` fallback was
              the amplifier that let an unrelated test reach the buggy code path.
              Added a testing convention rule documenting the new requirement.
              Regression coverage: six new test files using a baseline fixture method
              (worktree list porcelain, shadow tip SHA, .kspec/.git pointer, mtime,
              inode) to detect silent mutations that a naive existence check would
              miss. Closes 10 new ACs on @worktree-support:
                ac-init-linked-wt-unchanged, ac-init-main-wt-unchanged,
                ac-init-guidance-direction, ac-init-guidance-path,
                ac-setup-linked-wt-unchanged, ac-setup-main-wt-unchanged,
                ac-setup-guidance-direction, ac-setup-guidance-path,
                ac-shadow-ops-scoped-to-main, ac-shadow-ops-concurrent-safety.
              Task: @task-shadow-worktree-cross-contamination-guard
              Spec: @worktree-support
              Co-Authored-By: Claude Opus 4.6 (1M context) <noreply@anthropic.com>

