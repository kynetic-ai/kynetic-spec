          Author: Jacob Chapel <jacob.chapel@gmail.com>

          Date:   Tue Apr 14 02:40:47 2026 -0700

              fix(setup): restore dispatch fallback chain for stale remote HEAD
              The fix cycle 1 refactor extracted resolveDefaultBranch as a shared
              helper, but resolveDispatchWorkspaceConfig started committing to
              whatever resolveDefaultBranch returned first. When remote HEAD points
              to a nonexistent branch (stale refs/remotes/origin/HEAD), this caused
              "No base branch could be resolved" instead of falling through to the
              current branch.
              Restored the original three-step fallback in resolveDispatchWorkspaceConfig
              where each candidate is independently verified via resolveBranchStartPoint
              before committing. The shared resolveDefaultBranch helper remains available
              for setup scaffolding where commit-to-first-answer semantics are correct.
              Task: @task-scaffold-project-config
              Spec: @scaffolded-project-config
              Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>

