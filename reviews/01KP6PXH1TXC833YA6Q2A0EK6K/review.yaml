          aa54a59e81afbe4563b663a6a13c28fc5d644f8a

          Author: Jacob Chapel <jacob.chapel@gmail.com>

          Date:   Tue Apr 14 12:16:04 2026 -0700

              fix(setup): use full fallback chain for scaffold base_branch resolution
              generateConfigContent() now calls resolveDefaultBranch() (remote HEAD →
              current branch → "main") instead of resolveRemoteHeadBranch() alone.
              This ensures the scaffolded config's base_branch matches what the
              empty-config fallback chain would resolve, satisfying ac-file-valid-on-load.
              Previously, repos with no remote but on a non-main branch would scaffold
              base_branch: "main" while the empty-config path would resolve to the
              current branch, changing runtime dispatch behavior.
              Task: @task-scaffold-project-config
              Spec: @scaffolded-project-config
              Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>

          commit 790807a3a50347a166477c2f42f1a0a43cfad703

          Author: Jacob Chapel <jacob.chapel@gmail.com>

          Date:   Tue Apr 14 03:40:51 2026 -0700

              fix(setup): use remote-HEAD-only fallback for scaffold base_branch and fix success footer
              Two review blockers addressed:
              1. generateConfigContent() previously called resolveDefaultBranch() which
                 falls back to the current branch before "main". For scaffolding, this is
                 wrong — a feature branch checkout should not leak into the config. Now
                 calls resolveRemoteHeadBranch() directly and falls back to "main" only.
              2. The setup command unconditionally printed "Setup complete." before checking
                 for scaffold failures, producing contradictory output (success message +
                 exit 1). Moved the failure check into the output callback so the footer
                 shows "Setup failed:" instead when the scaffold step fails.
              Added regression tests for both issues.
              Task: @task-scaffold-project-config
              Spec: @scaffolded-project-config
              Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>

