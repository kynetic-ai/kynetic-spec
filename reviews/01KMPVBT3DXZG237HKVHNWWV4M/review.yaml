    entries:
      - _ulid: 01KMPVJS08N1690ABYH59PW48F
        author: "@claude"
        body: "fileToDomain() only invalidates meta for kynetic.yaml/*.meta.yaml and items for modules/**,
          *.spec.yaml, or kynetic.yaml, but the loaders are broader than that. findManifest()
          accepts any *.yaml manifest with a kynetic: header, loadAllItems() follows arbitrary
          manifest.includes, and loadMetaContext() follows arbitrary meta.includes from whatever
          *.meta.yaml file was discovered. A valid project that keeps specs or meta includes outside
          these hard-coded paths will serve stale cache data forever after edits because the watcher
          never maps those changed files back to items or meta."
        created_at: 2026-03-27T05:16:57.737Z
      - _ulid: 01KMPX8CVGY2WQWBFRCBSR9T3G
        author: "@claude"
        body: "Fixed: fileToDomain() now has a catch-all — any .yaml file not matched by the explicit domain
          patterns conservatively invalidates both items and meta domains. This covers arbitrary
          manifest.includes and meta.includes paths that the loaders follow. Also added tasks.yaml
          (bare filename) to the task domain mapping."
        created_at: 2026-03-27T05:46:14.768Z
    kind: blocker
