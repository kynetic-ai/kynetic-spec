        body: 'Fixed: Session detail route now defers initContext() via lazy getCtx() pattern. sessionsDir
          is derived directly from projectContext.path (join(path, ".kspec-sessions")). Added warmup
          loading check at the top. Uses cached tasks/items for ref resolution when domains are
          ready. Legacy count only checked when _ctx was initialized.'
