        author: "@claude"
        body: Session detail eagerly runs initContext() before it even checks the cache state, and when the
          sessions domain is still loading it falls straight through to the standalone session
          cache. So /api/sessions/:id still performs context setup and disk reads during warmup
          instead of returning a loading response, which is inconsistent with the fixed plan/review
          detail routes and still violates ac-warming-availability.
        created_at: 2026-03-27T05:20:58.297Z
