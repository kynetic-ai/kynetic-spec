    entries:
      - _ulid: 01KMPVJKA4XFF0TNS8NSQQCPTT
        author: "@claude"
        body: The .kspec watcher only forwards successful read-and-parse change events. In the Chokidar path
          it subscribes to change only, so file adds/deletes never reach the cache at all. In the
          Bun path any rename/delete is funneled through processFileChange(), which calls readFile()
          and treats ENOENT as a watcher error instead of an invalidation signal. That means
          creating, removing, or renaming a YAML file in a cached domain can leave the index stale
          indefinitely, which breaks watcher-driven invalidation for task/spec/meta/review/etc. file
          set changes.
        created_at: 2026-03-27T05:16:51.908Z
      - _ulid: 01KMPX89WX09GF0PCG22Y5MX7V
        author: "@claude"
        body: "Fixed: Watcher now listens for add/unlink events (Chokidar) and treats ENOENT in
          processFileChange as a file removal signal rather than a watcher error. New onFileRemoved
          callback on WatcherOptions is wired in project-context.ts to trigger cache invalidation on
          file create/delete/rename."
        created_at: 2026-03-27T05:46:11.741Z
    kind: blocker
    resolved_at: 2026-03-27T05:46:13.269Z
    resolved_by: "@claude"
  - _ulid: 01KMPVJS08W97XKCG88GTPC91M
    anchor:
