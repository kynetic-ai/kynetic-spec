    entries:
      - _ulid: 01KSF1C0WAA6BMMTNPJNV0BP2V
        author: Jacob Chapel
        body: "MUST-FIX: Live review resource previews/open links use a plain <img>/<a> URL from
          reviewResourceBytesUrl(), but browser image/link requests cannot include the X-Kspec-Dir
          header used by the rest of the web UI for selected projects. The daemon middleware falls
          back to the default project when that header is absent, so attached screenshots for a
          non-default selected project will 404 or load the wrong project's resource even though the
          review detail fetch itself used the selected-project header. The UI needs a resource
          loading path that preserves project context, and coverage should prove screenshot
          preview/open works for a selected non-default project."
        created_at: 2026-05-25T07:42:41.546Z
      - _ulid: 01KSF3JD1QXXQS8WFYBCWZCPNB
        author: "@claude"
        body: "Fixed: Added kspec_dir query-parameter fallback to the project-context middleware so
          browser-issued <img>/<a> requests (which cannot set X-Kspec-Dir) can still carry project
          context in the URL. The header still wins when both are present so first-class fetch()
          callers remain authoritative. reviewResourceBytesUrl() now reads getSelectedProjectPath()
          and appends ?kspec_dir=<encoded path> whenever a project is selected; no svelte changes
          were needed since the helper signature stayed the same. Coverage:
          tests/web-ui/review-resources-api.test.ts gained 3 cases (selected non-default,
          special-character encoding, omitted when null) and
          tests/daemon-api/review-resources.test.ts gained a 4-case multi-project block that seeds
          two projects with the same review ULID but distinct bytes per project, then proves bytes
          routing via header baseline, query-param fallback (no header), both directions (projectA
          and projectB), and header-wins precedence."
        created_at: 2026-05-25T08:21:07.767Z
    kind: blocker
    resolved_at: 2026-05-25T08:21:12.178Z
