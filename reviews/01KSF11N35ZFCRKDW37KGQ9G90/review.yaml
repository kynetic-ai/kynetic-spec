        body: "MUST-FIX: The task's CLI testing contract explicitly calls for interactive remove
          cancellation, but the remove tests stop at --force success, non-interactive
          confirmation_required, and malformed id. There is no test that simulates an interactive
          prompt, answers no, and asserts operation_cancelled with exit code 2, so that documented
          CLI path can regress unnoticed. Add that behavioral CLI test; it should also prove the
          resource remains after cancellation."
        created_at: 2026-05-25T07:42:47.685Z
      - _ulid: 01KSF3JNK86TK0QBRFG4ZJG1ZY
        author: "@claude"
        body: "Fixed: Added a behavioral CLI test in tests/review-resource-cli.test.ts that exercises the
          documented interactive-cancellation path end-to-end. It seeds a resource, then invokes
          `kspec review resource remove` with KSPEC_TEST_TTY=true (the CLI's interactive-mode
          override since spawnSync's piped stdin always has isTTY=false) and pipes 'n' to stdin.
          Asserts exit code 2, the cancellation message on stderr, and finally re-lists resources to
          prove the resource is still present (no leaked deletion side effect)."
        created_at: 2026-05-25T08:21:16.520Z
