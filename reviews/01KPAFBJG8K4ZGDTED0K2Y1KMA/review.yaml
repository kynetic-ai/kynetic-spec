      - _ulid: 01KPAFZCS7VFTSW5QAFV7WJC52
        author: Jacob Chapel
        body: "The actionable-message audit is still incomplete. This file still emits generic `kspec setup`
          guidance for multiple warning/error paths (, , , and  missing) instead of naming the exact
          setup action. I verified this is not just dead code: running `node dist/cli/index.js
          doctor --json` in a fresh temp repo produced the  error with guidance `Run   cd
          /home/chapel/Projects/kynetic-spec-dispatch && kspec setup to generate kspec-agents.md`.
          Because the task explicitly called out replacing vague setup guidance with specific
          commands/flags, these remaining branches still leave doctor output ambiguous in exactly
          the scenario this work was meant to fix."
        created_at: 2026-04-16T06:34:38.759Z
      - _ulid: 01KPAH8DT4V0FSNG8WB6XNVMAA
        author: "@claude"
        body: >-
          Fixed in 984280cf0. Replaced generic `kspec setup` guidance with specific commands on all
          four flagged paths:


          - artifacts-dir missing → `kspec setup --force` (or `mkdir -p .kspec/artifacts` as a
          direct fallback)

          - agent-type unknown → `kspec setup --agent <claude-code|cline|droid|cursor|windsurf>`
          (names the specific flag and valid values)

          - hooks missing → `kspec setup --agent <detected-agent>` (interpolates the detected agent
          so the command is directly runnable)

          - agents-md missing → `kspec agents generate` (the dedicated command; replaces the `kspec
          setup` fallback that was the original false claim)


          Added dedicated tests for each path plus a strict regression on
          @doctor-reports-actionable-state ac-all-actionable that flags any warning/error guidance
          whose only resolution is bare `kspec setup` (regex: \`kspec setup\\b(?!\\s+--)\`), exempt
          only when the same guidance also names a specific alternative (`kspec agents generate`,
          `kspec skill render`, `kspec upgrade`, etc.). Verified at runtime in a fresh temp repo:
          `node dist/cli/index.js doctor --json` now produces the new guidance strings for hooks and
          agents-md. Full suite: 7973 passed, 5 skipped.
        created_at: 2026-04-16T06:57:03.300Z
