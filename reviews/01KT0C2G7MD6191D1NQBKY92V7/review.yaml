    entries:
      - _ulid: 01KT0D0EQGHSPGA51V4TW8NVHT
        author: Jacob Chapel
        body: "MUST-FIX: The new signal cleanup handlers call process.kill(process.pid, signal) without
          first removing/restoring the signal handler. In Node, installing a signal listener
          suppresses the default termination behavior for that signal, so re-sending
          SIGTERM/SIGINT/SIGHUP re-enters this same handler instead of exiting. I reproduced the
          pattern in a subprocess: after SIGTERM it printed the handler repeatedly until I killed
          it. Any test runner that has acquired the port-start lock can now hang on termination
          rather than reaching a bounded terminal outcome, which violates this task's daemon
          teardown boundedness contract. Fix by restoring default behavior before re-raising, using
          process.once with listener removal, or otherwise exiting with the signal-appropriate
          behavior after releasing locks."
        created_at: 2026-06-01T01:33:10.768Z
      - _ulid: 01KT0EFMWSE9YC12NQN8VJN5NG
        author: "@claude"
        body: >-
          Fixed. The signal handler is now a named function that removes itself from
          process.listeners(signal) before re-raising via process.kill(process.pid, signal). With
          our listener gone the re-raise hits default disposition (process exit) unless another
          listener (e.g. the host test runner) owns termination semantics — in which case that
          listener takes over. Source: tests/helpers/daemon.ts:463-489.


          Extracted the handler factory as exported __createPortStartLockSignalHandler so two
          regressions can pin the contract behaviorally:


          1. In-process unit test ("removes itself from process listeners and calls release exactly
          once before re-raising") — installs the actual factory output on a benign SIGUSR2
          listener, invokes it, asserts (a) it removed itself from process.listeners, (b) release
          ran exactly once, (c) reRaise was called with the same signal. Pre-fix the handler had no
          removal step, so process.listeners would still contain it after invocation and the
          assertion would fail.


          2. Subprocess end-to-end test ("a subprocess that mirrors the registration pattern reaches
          a bounded terminal outcome under SIGTERM") — spawns a Node subprocess that installs the
          same remove-then-re-raise shape, sends SIGTERM, asserts it exits within 5s with signalCode
          === 'SIGTERM'. Pre-fix this subprocess would loop and only die from the test's SIGKILL
          safety net.


          Both tests are annotated against ac-uncooperative-process-stop-is-bounded under
          @daemon-test-teardown-boundedness. Focused daemon tests (22/22) pass; full suite re-run in
          progress.
        created_at: 2026-06-01T01:58:57.177Z
    kind: blocker
    resolved_at: 2026-06-01T01:59:07.361Z
    resolved_by: "@claude"
