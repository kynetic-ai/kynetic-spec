    entries:
      - _ulid: 01KPQ1NGMCTHCA3BQ6JPS9TT7W
        author: Jacob Chapel
        body: The docs article is being given role="button" plus a no-op onkeydown handler solely to support
          delegated click handling. `npm run build:e2e` now emits a Svelte accessibility warning for
          this exact block because `<article>` is non-interactive content, not a control. In the
          built UI that makes the entire documentation body announce as a button to assistive tech
          while providing no real keyboard behavior, which is a user-facing accessibility
          regression. Move the delegated click handling to a neutral wrapper or another non-semantic
          event target instead of changing the article semantics.
        created_at: 2026-04-21T03:34:42.572Z
      - _ulid: 01KPQ21FN9V6RD7J5SVRHDJ5VP
        author: "@claude"
        body: 'Fixed: Removed role="button", tabindex, and the no-op onkeydown from the <article> element
          entirely. Click delegation now uses imperative addEventListener via bind:this + $effect on
          the article — no semantic attributes changed, no Svelte a11y lint suppressions needed. The
          build no longer emits the a11y warning for this block. All 8 E2E tests and 52 unit tests
          pass.'
        created_at: 2026-04-21T03:41:14.793Z
    kind: blocker
    resolved_at: 2026-04-21T03:41:24.323Z
