      - _ulid: 01KN48R6HFK1KRYPPJ6Z8TP63Z
        author: Jacob Chapel
        body: The pull_request path filter still omits playwright.config.ts, so a PR that changes only
          Playwright test selection/retries/workers will skip this workflow entirely. That undercuts
          the full-suite CI gate this task is introducing, because the gate can be weakened or
          broken without any E2E job running. Please add playwright.config.ts to pull_request.paths
          so configuration-only changes are covered.
        created_at: 2026-04-01T10:17:14.543Z
      - _ulid: 01KN490RZ8JTM7S31JM638AJYK
        author: Jacob Chapel
        body: "Fixed in commit 0235550eb: added playwright.config.ts to pull_request.paths in
          .github/workflows/test.yml, so PRs that only adjust Playwright workers/retries/test
          selection still trigger the full E2E workflow."
        created_at: 2026-04-01T10:21:55.560Z
