    entries:
      - _ulid: 01KM84SNS4EJGXVNKZCCPB4FFA
        author: Jacob Chapel
        body: These API status transitions call TaskDataManager.mutateTask() without commit metadata, so
          split-storage history entries record command='unknown' instead of the triggering API
          operation. The same omission is repeated in the submit/complete/block handlers below. That
          violates @task-core-data-file ac-3 for any task mutated through the daemon API, even
          though the CLI paths were fixed in earlier cycles.
        created_at: 2026-03-21T12:09:24.516Z
    kind: blocker
