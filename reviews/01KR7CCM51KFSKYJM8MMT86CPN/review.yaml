    entries:
      - _ulid: 01KR7CK9ZECWEWME2XAM0GGTSE
        author: Jacob Chapel
        body: "MUST-FIX: direct cleanup calls in try/finally finalizers bypass the new ownership
          check.  only calls  after entering a cleanup-registration callback, then line 1535 accepts
          any  directly. Manual oxlint probe:  exits 0 with no report. If the assertion throws
          before  is assigned, the finalizer runs with an undefined kill target and the detached
          daemon leaks, violating @daemon-test-guardrail-precision
          ac-detached-cleanup-bound-before-observation's requirement that cleanup own the
          just-started daemon before an intervening observation can fail."
        created_at: 2026-05-09T22:09:17.294Z
      - _ulid: 01KR7CMY40DWMC18PH5CRW63YV
        author: Jacob Chapel
        body: 'Clarification with shell-safe formatting: `subtreeContainsDaemonCleanupCall` only calls
          `cleanupCallbackBindingStatus(...)` after entering a cleanup-registration callback, but
          direct cleanup calls in a `finally` block reach `if (isDaemonCleanupCallExpression(node))
          return true;` without any binding or ownership validation. Manual probe that passed
          unexpectedly: `let pid; try { runKspec("serve start --detach --port 3456");
          expect(true).toBe(true); pid = readPidFromFile(); } finally { process.kill(pid as number,
          "SIGTERM"); }`. That exits 0 under the rule, even though a thrown assertion before
          assignment leaves the finalizer with no concrete kill target for the just-started daemon.'
        created_at: 2026-05-09T22:10:10.688Z
      - _ulid: 01KR7EW087XMQ5MSKP98BPHEBP
        author: "@claude"
        body: >-
          Fixed in commit ede9e8e18. Root cause: subtreeContainsDaemonCleanupCall only invoked
          cleanupCallbackBindingStatus when descent crossed a registered-callback boundary, so a
          direct daemon-kill in a try/finally finalizer (or any other position outside a registered
          callback) reached `if (isDaemonCleanupCallExpression(node)) return true;` on shape alone.


          Fix in tools/eslint-rules/no-leaky-test-daemon.js: the direct-cleanup branch now calls the
          new directCleanupCallOwnsDetachedDaemon helper, which mirrors
          cleanupCallbackBindingStatus' rules — every captured outer identifier must be concretely
          bound at the implicit registration site AND own the just-started daemon (binding range[1]
          >= detachedStart). The "use position" is the enclosing TryStatement (control crosses that
          boundary before any in-try throw can fire the finalizer); when there is no enclosing try,
          the call itself is the registration. UNVERIFIABLE_KILL_TARGET still rejects
          non-Identifier-rooted kill targets up front.


          Diagnostic precision: extended findUnboundCleanupClosure with a parallel scanner
          findUnboundDirectCleanupCapture so cleanupClosureUnbound names the offending capture for
          the finalizer case too (matches the registered-callback path's wording). Program:exit now
          consults both scanners before falling back to the generic missingCleanup message.


          Manual oxlint probe against the cycle-6 reviewer source:
            let pid; try { runKspec("serve start --detach --port 3456"); expect(true).toBe(true); pid = readPidFromFile(); } finally { process.kill(pid as number, "SIGTERM"); }
          exits 1 with cleanupClosureUnbound on `pid` (was 0/no warnings before the fix).


          Six new regression tests in tests/lint-daemon-test-guardrails.test.ts cover the cycle-6
          probe, undeclared finalizer pid, stale pre-start literal, MemberExpression root predating
          the start, and the two safe alternatives (pid bound after start before try, const child =
          spawn before try). The pre-existing tests/lint-no-leaky-test-daemon.test.ts case "should
          allow serve start --detach in try/finally with cleanup" used an undeclared free `pid`;
          updated it to capture pid into a const between the start and the try block (the canonical
          safe shape) since the cycle-6 ownership leg correctly rejects undeclared captures.


          Validation: focused lint suites 249 -> 255 passing tests with --fresh; full npm test 9011
          passing tests (5 pre-existing skips, 2001.2s); kspec validate --refs and --completeness
          both pass with --warnings-ok (warnings unchanged from pre-existing repository debt).
        created_at: 2026-05-09T22:48:59.398Z
