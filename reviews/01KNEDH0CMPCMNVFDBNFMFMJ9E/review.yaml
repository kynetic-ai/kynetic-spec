    entries:
      - _ulid: 01KNEDWT2DNCC8K5WHPXV5F46B
        author: Jacob Chapel
        body: This test is annotated for @daemon-runtime-adapter ac-auto-start-runtime, but it never
          exercises auto-start behavior. It only asserts that getDaemonRuntimeCommand() returns its
          input after mutating process.execPath. If maybeAutoStartDaemon() regressed to spawning
          process.execPath again in src/cli/index.ts, this test would still pass, so the AC remains
          unproven. Replace it with a behavioral test that triggers a non-serve CLI command, lets
          auto-start run, and verifies the spawned daemon process/runtime comes from daemon.runtime
          config.
        created_at: 2026-04-05T08:59:32.813Z
      - _ulid: 01KNEEEZF4G9P3CF1SCAMVC4QW
        author: Jacob Chapel
        body: "Fixed: replaced the helper-level assertion with a behavioral auto-start test. The test now
          runs the CLI under bun, configures daemon.runtime=node, strips leaked
          KSPEC_NO_DAEMON/session env, triggers a non-serve command so maybeAutoStartDaemon
          executes, waits for the daemon pid file, and verifies the spawned process command contains
          node and dist/daemon/index.js."
        created_at: 2026-04-05T09:09:28.164Z
