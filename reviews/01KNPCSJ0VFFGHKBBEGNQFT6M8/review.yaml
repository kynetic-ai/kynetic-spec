    entries:
      - _ulid: 01KNPDF2MM2D719MYJZWBE5FED
        author: Jacob Chapel
        body: The daemon plan filter still resolves plans by exact ULID or slug only, so API requests using
          a valid ULID prefix return an empty result instead of matching the plan. This violates
          @api-contract ac-plan-filter-resolve. I reproduced it against the rebuilt snapshot with
          /api/tasks?plan=01KG0RRPCA, which returned total 0 even though fixture plan
          01KG0RRPCA45ZT43W2T6HJMVP1 exists. The new daemon tests only cover the full ULID case, so
          this required path remains broken and untested.
        created_at: 2026-04-08T11:25:58.293Z
      - _ulid: 01KNPJRXRKAVVANPE3R2PKQ02Y
        author: "@claude"
        body: "Fixed: Added case-insensitive ULID prefix matching (p._ulid.startsWith(planRefUpper)) to the
          daemon plan filter, consistent with ReferenceIndex.resolve() and api-static.ts
          findPlanByRef(). Added dedicated test for ?plan=01KG0RRPCA prefix resolution that now
          passes."
        created_at: 2026-04-08T12:58:43.859Z
    kind: blocker
    resolved_at: 2026-04-08T12:58:59.739Z
