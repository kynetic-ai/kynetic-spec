  - _ulid: 01KTTVGSMYSWPX2BZS6KMGFP5N
    anchor:
      type: structured
      ref: "@coverage-record-compatibility"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTVGSMYVREP5FYN7NXBG8JQ
        author: "@claude"
        body: The plan promises and tasks require an older tool version without verification-store support
          to ignore the sidecar when reading a project that has one, but
          @coverage-record-compatibility has no AC for that behavior. Its ACs cover absent store
          behavior, no upgrade rewrite, first write materialization, newer record-format refusal,
          and unknown-field roundtrip only. Add an AC for older-tool sidecar tolerance, or remove
          the older-tool guarantee/test from the plan so the spec and task scope match.
        created_at: 2026-06-11T08:07:01.534Z
      - _ulid: 01KTVVE7HFW0JE7X1S2QZ6Y6JH
        author: plan-author
        body: "Added ac-older-tool-ignores-sidecar to @coverage-record-compatibility: a project whose
          metadata contains the store remains fully operable by a tool version predating it, and the
          store contents are neither read nor modified. The description states the additive
          guarantee, and @task-coverage-record-compatibility covers the AC with a testable framing —
          unrecognized sidecar directories in shadow state are ignored by readers, and store
          creation is purely additive."
        created_at: 2026-06-11T17:24:51.886Z
    kind: blocker
  - _ulid: 01KTTVGSNK0HAWXGBJZXWAKSAG
    anchor:
      type: structured
      field: ac-recorded-supersedes-bootstrap
      ref: "@ac-freshness-resolution"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTVGSNMNNXQY06YX14ER8PR
        author: "@claude"
        body: This AC says a recorded stamp suppresses bootstrap even when the annotation location history
          is newer than the stamp. That is deterministic, but it means a stale recorded verification
          can mask a newer annotation edit at the storage-read layer. Is that intentionally deferred
          to the later coverage-state engine, and should the spec or implementation notes say that
          consumers must compare stamp freshness against annotation/code revisions elsewhere?
        created_at: 2026-06-11T08:07:01.556Z
      - _ulid: 01KTVVED23D616DBW0G92AR6WW
        author: plan-author
        body: "Yes — intentionally deferred, and the spec now says so explicitly: resolution returns
          recorded stamps verbatim, never compares them against annotation history, and keeps the
          bootstrap-derived value separately retrievable (new AC ac-both-provenances-retrievable),
          so consumers that assess staleness have both values in hand. Staleness classification is
          the coverage-state engine plan. New Implementation Notes subsection: Storage reads do not
          assess staleness."
        created_at: 2026-06-11T17:24:57.539Z
    kind: question
  - _ulid: 01KTTVGSSCHYX5BKJ5YMV9SS24
    anchor:
      type: structured
      ref: "@ac-freshness-resolution"
      section: description
    entries:
      - _ulid: 01KTTVGSSC5S1TAC4WE2TEV8W9
        author: "@claude"
        body: The description says freshness resolves "across two provenance classes" but then names
          bootstrap plus three recorded provenance classes. Consider wording this as two provenance
          sources, with recorded stamps carrying one of the recorded classes, to avoid confusing
          source count with stored provenance enum values.
        created_at: 2026-06-11T08:07:01.676Z
      - _ulid: 01KTVVEJGD8ADXKAF4F95J96FH
        author: plan-author
        body: Reworded everywhere as two provenance sources — bootstrap-derived and recorded — with recorded
          stamps carrying a provenance class drawn from the recorded enum (validation, ingestion,
          re_verification). Updated the spec description, the freshness ACs, the compatibility AC,
          and the Provenance vocabulary section of Implementation Notes.
        created_at: 2026-06-11T17:25:03.117Z
    kind: nit
