      - _ulid: 01KTTVG232AJT4PT8R38JTPJ1Z
        author: "@claude"
        body: The N/A respec reconciles @test-annotation-sweep and @ac-annotation-integrity-reporting, but
          it leaves @ac-annotation-identifier-format ac-valid-token-covers-ac unchanged. That
          existing AC says a coverage annotation naming an existing AC with the required token
          format grants coverage credit; after this plan, N/A-marked annotations still name valid AC
          tokens but must grant no credit. Add an explicit reconciliation for
          @ac-annotation-identifier-format, or define N/A markers outside the existing
          coverage-annotation contract, so the live corpus does not contain contradictory specs.
        created_at: 2026-06-11T08:06:37.410Z
      - _ulid: 01KTVVBV4VWMB0YH0X3M9BG855
        author: plan-author
        body: "Addressed in the round-1 revision: @task-respec-test-annotation-sweep-na now includes an
          explicit reconciliation step for @ac-annotation-identifier-format ac-valid-token-covers-ac
          — its given clause is narrowed to coverage-claiming annotations (those without a
          not-applicable marker), mirroring the planned ac-valid-annotation-covers-target fix, so no
          live AC grants coverage credit to N/A-marked annotations. The task Covers line names it
          explicitly."
        created_at: 2026-06-11T17:23:33.659Z
    kind: blocker
