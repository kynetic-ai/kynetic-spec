  - _ulid: 01KTTVG2323NE18R3185B7RMTD
    anchor:
      type: structured
      field: what
      ref: "@task-respec-test-annotation-sweep-na"
      section: tasks
    entries:
      - _ulid: 01KTTVG232AJT4PT8R38JTPJ1Z
        author: "@claude"
        body: The N/A respec reconciles @test-annotation-sweep and @ac-annotation-integrity-reporting, but
          it leaves @ac-annotation-identifier-format ac-valid-token-covers-ac unchanged. That
          existing AC says a coverage annotation naming an existing AC with the required token
          format grants coverage credit; after this plan, N/A-marked annotations still name valid AC
          tokens but must grant no credit. Add an explicit reconciliation for
          @ac-annotation-identifier-format, or define N/A markers outside the existing
          coverage-annotation contract, so the live corpus does not contain contradictory specs.
        created_at: 2026-06-11T08:06:37.410Z
    kind: blocker
  - _ulid: 01KTTVG28FXDNNGF8Z45VWXT7F
    anchor:
      type: structured
      field: covers
      ref: "@task-na-annotation-coverage-exclusion"
      section: tasks
    entries:
      - _ulid: 01KTTVG28FKRS462NJM80KHHAE
        author: "@claude"
        body: This task also cannot be coverage-verified because its Covers line references "the three
          not-applicable ACs added by @task-respec-test-annotation-sweep-na" rather than concrete AC
          IDs. Once the respec task assigns stable IDs, this implementation task needs to list those
          exact @test-annotation-sweep AC IDs so derivation/review can prove every claimed behavior
          is implemented.
        created_at: 2026-06-11T08:06:37.583Z
    kind: blocker
  - _ulid: 01KTTVG27PD36FXNTEZ8D0TK7X
    anchor:
      type: structured
      field: covers
      ref: "@task-respec-test-annotation-sweep-na"
      section: tasks
    entries:
      - _ulid: 01KTTVG27PXYD3A6HST09ESHS9
        author: "@claude"
        body: 'The Covers line is not verifiable: it claims "@test-annotation-sweep (description update plus
          the three new not-applicable ACs defined above)" instead of exact AC IDs. The plan also
          does not assign IDs to those three new ACs. Give the new ACs stable IDs in the plan text
          and make this Covers line reference those IDs explicitly, plus the exact existing
          @ac-annotation-integrity-reporting AC it updates.'
        created_at: 2026-06-11T08:06:37.558Z
    kind: blocker
  - _ulid: 01KTTVGSMYSWPX2BZS6KMGFP5N
    anchor:
      type: structured
      ref: "@coverage-record-compatibility"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTVGSMYVREP5FYN7NXBG8JQ
        author: "@claude"
        body: The plan promises and tasks require an older tool version without verification-store support
          to ignore the sidecar when reading a project that has one, but
          @coverage-record-compatibility has no AC for that behavior. Its ACs cover absent store
          behavior, no upgrade rewrite, first write materialization, newer record-format refusal,
          and unknown-field roundtrip only. Add an AC for older-tool sidecar tolerance, or remove
          the older-tool guarantee/test from the plan so the spec and task scope match.
        created_at: 2026-06-11T08:07:01.534Z
    kind: blocker
  - _ulid: 01KTTVGSNK0HAWXGBJZXWAKSAG
    anchor:
      type: structured
      field: ac-recorded-supersedes-bootstrap
      ref: "@ac-freshness-resolution"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTVGSNMNNXQY06YX14ER8PR
        author: "@claude"
        body: This AC says a recorded stamp suppresses bootstrap even when the annotation location history
          is newer than the stamp. That is deterministic, but it means a stale recorded verification
          can mask a newer annotation edit at the storage-read layer. Is that intentionally deferred
          to the later coverage-state engine, and should the spec or implementation notes say that
          consumers must compare stamp freshness against annotation/code revisions elsewhere?
        created_at: 2026-06-11T08:07:01.556Z
    kind: question
  - _ulid: 01KTTVGSSCHYX5BKJ5YMV9SS24
    anchor:
      type: structured
      ref: "@ac-freshness-resolution"
      section: description
    entries:
      - _ulid: 01KTTVGSSC5S1TAC4WE2TEV8W9
        author: "@claude"
        body: The description says freshness resolves "across two provenance classes" but then names
          bootstrap plus three recorded provenance classes. Consider wording this as two provenance
          sources, with recorded stamps carrying one of the recorded classes, to avoid confusing
          source count with stored provenance enum values.
        created_at: 2026-06-11T08:07:01.676Z
    kind: nit
