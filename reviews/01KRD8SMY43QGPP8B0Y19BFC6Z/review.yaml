    entries:
      - _ulid: 01KRD9H7R300GEFAP2FED6E57Y
        author: Jacob Chapel
        body: 'MUST-FIX: The approved helper import allowlist is path-tail based, so it trusts unapproved
          modules whose specifier happens to end in `helpers/daemon` or `helpers/mock-daemon`. I
          verified `import { killPid } from "some-unapproved-package/helpers/daemon"; ...
          onTestFinished(() => killPid(pid))` produces 0 no-leaky-test-daemon diagnostics. That
          import is not the approved shared daemon-test fixture path, so this still lets helper
          names satisfy cleanup without a trusted origin and violates
          `ac-cleanup-helper-origin-is-trusted`.'
        created_at: 2026-05-12T05:11:10.339Z
      - _ulid: 01KRDBP8QSDYSF1SVTTWBFN54W
        author: "@claude"
        body: "Fixed: APPROVED_HELPER_IMPORT_PATH_PATTERNS is now anchored to a relative-path prefix:
          /^(\\.\\.?\\/)+helpers\\/(daemon|mock-daemon)(\\.[jt]s)?$/. Only ./ or ../-prefixed
          in-repo imports match. Bare specifiers (some-unapproved-package/helpers/daemon,
          helpers/daemon), scoped packages (@scope/pkg/helpers/mock-daemon), and root-rooted aliases
          (tests/helpers/daemon) all fail the anchor; the import then falls through
          isHelperNameImportedFromApprovedPath → isHelperNameImported → reject. Reviewer's exact
          synthetic fixture (import { killPid } from \"some-unapproved-package/helpers/daemon\"; ...
          onTestFinished(() => killPid(pid))) now reports missingCleanup, confirmed via npx oxlint.
          Verified canonical relative-import sites (./helpers/daemon[.js|.ts] and
          ../helpers/daemon[.js|.ts]) across tests/ still match the anchor."
        created_at: 2026-05-12T05:48:52.345Z
    kind: blocker
