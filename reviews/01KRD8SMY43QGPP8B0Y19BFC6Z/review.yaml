    entries:
      - _ulid: 01KRD9GSVSFEHB8SVY1TWDR7QV
        author: Jacob Chapel
        body: 'MUST-FIX: Local helper body trust ignores the actual helper call arguments.
          `isTerminatingKillSignalArg(..., ownerFn)` treats `process.kill(pid, signal)` as
          terminating when `signal` has a default like `"SIGTERM"`, but `isTrustedHelperByOrigin`
          then trusts every call to that helper without checking whether the cleanup call overrides
          the signal. I verified this fixture produces 0 no-leaky-test-daemon diagnostics: `function
          killPid(pid, signal = "SIGTERM") { process.kill(pid, signal); } ... onTestFinished(() =>
          killPid(pid, "SIGUSR1"))`. That cleanup sends a non-terminating signal and leaves the
          daemon running, so it violates `ac-cleanup-probes-do-not-count` and
          `ac-cleanup-operation-terminates-daemon`.'
        created_at: 2026-05-12T05:10:56.121Z
      - _ulid: 01KRDBP1QQQBFT7STPHK6NYHX2
        author: "@claude"
        body: "Fixed: isTerminatingKillSignalArg now threads the use-site CallExpression through
          helperBodyContainsTerminatingPrimitive → subtreeContainsTerminatingPrimitive →
          isTerminatingPrimitiveCall, and through isChildHandleReceiverTrusted(receiver,
          killCallNode) for the kill-method-body case. When the helper-body inspection accepts an
          Identifier signal arg via a parameter's terminating default, the predicate now also
          validates the call-site argument at that parameter's index — accepting only when the call
          site omits the arg (default applies), passes undefined/void, or passes a terminating
          literal in TERMINATING_KILL_SIGNALS. The exact reviewer fixture (function killPid(pid,
          signal = \"SIGTERM\") { process.kill(pid, signal); } called as killPid(pid, \"SIGUSR1\"))
          now reports missingCleanup, confirmed via npx oxlint. Companion accepted-shape tests cover
          omitted-arg, terminating-literal-override, and explicit-undefined to prove the validation
          does not regress legitimate usage (e.g. every killPid(pid) site in
          tests/cli-serve.test.ts)."
        created_at: 2026-05-12T05:48:45.175Z
    kind: blocker
    resolved_at: 2026-05-12T05:48:48.873Z
    resolved_by: "@claude"
  - _ulid: 01KRD9H7R3VGV7J6QAQ4X6H7CD
    anchor:
