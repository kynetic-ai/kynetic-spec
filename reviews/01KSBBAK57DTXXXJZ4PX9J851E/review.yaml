    entries:
      - _ulid: 01KSBC05DDSZH6DE65TRWVJM4Y
        author: Jacob Chapel
        body: "MUST-FIX: clearing a plan's notes does not clear the authoritative notes sidecar. Both
          save/update paths only write notes.yaml when the new notes array is non-empty, so an
          existing notes.yaml survives when the mutation returns notes: []. Evidence: a one-off
          execution saved a plan with one note, called mutatePlanAtomically(... notes: []), then
          loadPlans() still returned that stale note. Impact: plan.yaml/index can say notes_count=0
          while detail reads continue exposing deleted notes, violating
          ac-plan-metadata-sidecar-is-authoritative and creating index drift."
        created_at: 2026-05-23T21:31:29.581Z
      - _ulid: 01KSBG287PHES254KMDA7H42G4
        author: "@claude"
        body: "Fixed in 984af0c. Both savePlanToFolder and mutatePlanInFolder now call
          removeNotesFileIfPresent when the new notes array is empty, so the authoritative notes
          sidecar is dropped in the same buffered transaction as the rest of the write. Added tests
          asserting that re-saving with notes: [] (savePlan) and mutating to notes: []
          (mutatePlanAtomically) both delete notes.yaml and that loadPlans returns notes: []."
        created_at: 2026-05-23T22:42:32.310Z
    kind: blocker
    resolved_at: 2026-05-23T22:42:46.887Z
    resolved_by: "@claude"
  - _ulid: 01KSBC09GT3YN6AC47SNJNYRJW
    anchor:
      type: code
      commit: c81ed98ce2337fdd426aec3da370bb73d29d4b6f
      line_end: 292
      line_start: 286
      path: src/parser/plan-storage-manager.ts
      side: head
    entries:
      - _ulid: 01KSBC09GTEB3651SYVF44T96K
        author: Jacob Chapel
        body: 'MUST-FIX: a missing plan.md is silently treated as an empty document. The folder layout
          requires plan.md as the authoritative plan document, and the task requires missing/partial
          storage markers to raise the shared incompatibility errors instead of silently loading bad
          state. Evidence: after saving a folder-backed plan and deleting only plan.md, loadPlans()
          returned the plan with content: "" rather than reporting a partial layout or unloadable
          folder. Impact: corrupted or partially migrated plans can lose all visible content without
          any error or rebuild conflict.'
        created_at: 2026-05-23T21:31:33.786Z
      - _ulid: 01KSBG2X5PJFXK6Q5Y336K5ES3
        author: "@claude"
        body: Fixed in 984af0c. readPlanDocument now returns undefined only on ENOENT (other I/O errors
          propagate); loadPlanFromDir raises EntityStorageCompatibilityError with code
          partial_entity_storage_layout and domain plans when plan.yaml exists but plan.md is
          missing. computePlanIndexDrift catches that error per-folder and surfaces it as a
          structured conflict so rebuild-index reports it cleanly. Added tests asserting loadPlans
          rejects with the matching code/domain and that computePlanIndexDrift produces the expected
          conflict entry.
        created_at: 2026-05-23T22:42:53.750Z
    kind: blocker
    resolved_at: 2026-05-23T22:43:00.795Z
    resolved_by: "@claude"
