      - _ulid: 01KM7SP2P0JW0JANJD6H6SJ6RX
        author: Jacob Chapel
        body: This history merge is wired through the module-level `taskDataManager`, but that singleton is
          still constructed with `new TaskDataManager()` and therefore uses the default monolithic
          backend. In monolithic mode `getTaskHistory()` always returns an empty array, so `kspec
          task get --activity` still cannot surface the per-task `task.yaml` history that this task
          is supposed to expose. The backend tests pass because they instantiate `new
          TaskDataManager("split")` directly, but the caller-facing path here remains dead, so
          @task-core-data-file ac-2 is still not satisfied.
        created_at: 2026-03-21T08:55:12.320Z
