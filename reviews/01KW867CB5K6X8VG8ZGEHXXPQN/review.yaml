    entries:
      - _ulid: 01KW8735DEPKFB2YX7G5KCVXAM
        author: Jacob Chapel
        body: "MUST-FIX: stale-target conflicts are explained but not refreshed. When applyResolution
          catches a CoverageResolutionApiError, recordResolutionError only stores the
          message/suggestion/current fingerprint. A stale spec-text revert conflict is a failed
          mutation, so the daemon does not emit coverage_state_changed, and this catch path does not
          call criterionQuery.refetch(), nodeQuery.refetch(), or rootQuery.refetch(). That violates
          ac-spec-text-revert-action's requirement to handle stale-target conflicts by refreshing
          and explaining that the criterion changed."
        created_at: 2026-06-28T22:55:07.182Z
      - _ulid: 01KW88E0FWKVN9383QGPGZZCCR
        author: Jacob Chapel
        body: "Fixed in 7fd9003b36: applyResolution now records the stale-target error and then refetches
          the root, node, and focused criterion workspace queries via Promise.allSettled so the UI
          both explains the changed criterion and refreshes after the failed mutation path that
          emits no coverage_state_changed event."
        created_at: 2026-06-28T23:18:31.163Z
    kind: blocker
    resolved_at: 2026-06-28T23:19:02.629Z
    resolved_by: Jacob Chapel
  - _ulid: 01KW873JA5GC8Y58S9PZ8TGBHT
    anchor:
      type: code
      commit: 9ba0efbbd15db6303fae955a58757c9f50af9972
      line_end: 130
      line_start: 115
      path: packages/web-ui/src/lib/query/ws-invalidation.ts
      side: head
    entries:
      - _ulid: 01KW873JA6X2QW7RQDA9CPCXBY
        author: Jacob Chapel
        body: "MUST-FIX: coverage_state_changed events do not invalidate the parameterized spec workspace
          root/node queries used by /specs. This code emits queryKeys.specWorkspace.root() and
          queryKeys.specWorkspace.node(ref), but the route's active queries are
          queryKeys.specWorkspace.root({ limit: WORKSPACE_PAGE_SIZE, plan }) and
          queryKeys.specWorkspace.node(ref, { limit: WORKSPACE_PAGE_SIZE }). TanStack Query partial
          matching does not match the same-length key when the parameter slot is undefined in the
          invalidation key and an object in the active key. Criterion detail pages may refresh
          because criterion keys match exactly, but root pages, filtered rollups, and inline panels
          on node pages will not refresh for coverage_state_changed events from the CLI or another
          daemon consumer, violating ac-resolution-event-refresh."
        created_at: 2026-06-28T22:55:20.390Z
      - _ulid: 01KW88FK7FH13HZHWTDHRWDQ3W
        author: Jacob Chapel
        body: "Fixed in 7fd9003b36: spec workspace query keys now expose root/node prefix keys,
          coverage_state_changed invalidation uses those prefixes, and the regression test verifies
          the prefixes match the parameterized /specs root and node query keys used by the route."
        created_at: 2026-06-28T23:19:23.119Z
    kind: blocker
    resolved_at: 2026-06-28T23:19:32.767Z
    resolved_by: Jacob Chapel
