    entries:
      - _ulid: 01KW8735DEPKFB2YX7G5KCVXAM
        author: Jacob Chapel
        body: "MUST-FIX: stale-target conflicts are explained but not refreshed. When applyResolution
          catches a CoverageResolutionApiError, recordResolutionError only stores the
          message/suggestion/current fingerprint. A stale spec-text revert conflict is a failed
          mutation, so the daemon does not emit coverage_state_changed, and this catch path does not
          call criterionQuery.refetch(), nodeQuery.refetch(), or rootQuery.refetch(). That violates
          ac-spec-text-revert-action's requirement to handle stale-target conflicts by refreshing
          and explaining that the criterion changed."
        created_at: 2026-06-28T22:55:07.182Z
    kind: blocker
