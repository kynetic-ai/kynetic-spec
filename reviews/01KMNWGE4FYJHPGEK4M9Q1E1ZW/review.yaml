        body: This fix cycle changes `scripts/test.cjs` to repair the two prior verbose-mode regressions,
          but it still adds no behavioral test that exercises those paths.
          `tests/test-runner.test.ts` only covers the non-verbose runner path (`spawnSync(...,
          [runnerScript, "--reporter=dot", ...])`); there is still no test that runs `node
          scripts/test.cjs --verbose ...`, verifies that a live verbose run leaves a log artifact
          behind, or proves that a cached `--verbose` invocation replays the full log instead of
          falling back to condensed output. That means the exact two blockers from the previous
          review can regress again without any test failure.
