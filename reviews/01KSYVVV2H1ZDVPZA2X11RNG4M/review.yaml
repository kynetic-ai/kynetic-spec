    entries:
      - _ulid: 01KSYWNF3NRADKWTGN09QR50CF
        author: Jacob Chapel
        body: "MUST-FIX: task-covered ACs are missing behavioral test coverage. `rg` found no test
          annotation for `AC: @runner-resolution-and-preflight ac-dispatch-uses-runner-resolution`
          and no test annotation for `AC: @runner-invocation-semantics
          ac-skill-formatting-uses-resolved-adapter`. The header says skill formatting is covered
          \"via adapterId field\", but checking the resolver's `adapterId` does not prove
          `runInvocation` builds a prompt with adapter-specific skill formatting from the resolved
          runner. Source comments in dispatch/invocation are not behavioral tests. Add tests that
          exercise the dispatch preflight path using a configured runner and tests that build/send a
          prompt with skills through a runner whose resolved adapter has distinct formatting."
        created_at: 2026-05-31T11:28:19.061Z
      - _ulid: 01KSYYJEP9Y5QG3E6CS4T9W4XM
        author: "@claude"
        body: >-
          Fixed: added behavioral coverage for both missing ACs.


          ac-dispatch-uses-runner-resolution (tests/agent-dispatch-engine.test.ts "Dispatch runner
          resolution preflight"):

          - Drives DispatchEngine._spawnInvocation directly with an agent that references an unknown
          runner.

          - Asserts the dispatch path skips the spawn (runInvocation never called) and surfaces the
          resolver's typed unknown_runner reason in console error + the AGENT-SKIP task note. Only
          possible if dispatch routes through the same resolveRunnerInvocation contract as one-shot
          agent run — a generic adapter-resolution check would not produce that reason code.


          ac-skill-formatting-uses-resolved-adapter (tests/agent-invocation.test.ts "runInvocation:
          skill formatting uses the resolved adapter"):

          - Two tests that drive runInvocation end-to-end with a SKILL.md containing a portable
          {skill:other-helper} reference.

          - Positive: agent has runner="codex-runner" (resolves to codex-acp) AND
          agent.adapter="claude-agent-acp" intentionally mismatched. Captures the prompt sent to the
          spawned (mocked) adapter via the new MOCK_ACP_VERIFY_PROMPT_FILE option and asserts the
          prompt contains the codex-style invocation ($other-helper) and NOT claude-style
          (/other-helper). The token itself must also be absent (no skipped rewrite).

          - Negative (legacy path): runner=undefined, adapter=claude-agent-acp. Asserts the prompt
          contains /other-helper and NOT $other-helper.


          Together these prove buildPromptWithSkills receives the resolved adapter id, not the
          legacy agent.adapter field. The previous adapterId-field check has been replaced with this
          end-to-end behavioral coverage.
        created_at: 2026-05-31T12:01:37.480Z
