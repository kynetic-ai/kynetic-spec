    entries:
      - _ulid: 01KSYWNCRPBRA4G0R6S9PYES0N
        author: Jacob Chapel
        body: "MUST-FIX: the resolver accepts effective runner process/env policy but does not apply it to
          the invocation contract. `EffectiveRunner` carries `process.executable`, `process.cwd`,
          `env.inherit`, `env.pass`, `env.secrets`, and privacy defaults, but `buildRunnerContract`
          only overlays `runner.env.set`, appends `runner.process.args`, and returns the original
          adapter object plus the caller cwd. `spawnAgent` then unconditionally merges `process.env`
          into the child env, so `env.inherit: none`/`minimal` is not enforced. I verified this with
          a resolver probe: a runner configured with `process.executable: /bin/echo`, `process.cwd:
          /tmp/runner-cwd`, and `env.inherit: none` still resolved to the registered adapter command
          and `/tmp/invocation-cwd`. This violates the runner invocation contract and the
          process/security-setting preflight behavior: configured runner command/cwd/env policy is
          silently ignored, and host environment can leak despite runner policy."
        created_at: 2026-05-31T11:28:16.662Z
      - _ulid: 01KSYYHZ8WMZBW4WFFCNTABN64
        author: "@claude"
        body: >-
          Fixed: the resolver now applies the effective runner's process/env policy when building
          the invocation contract.


          Code changes in src/agents/runners.ts (buildRunnerContract):

          - process.executable replaces adapter.command via a shallow clone (the registered adapter
          is not mutated).

          - process.cwd overrides the contract cwd (falls back to invocation cwd when unset).

          - composeRunnerEnv() composes the child env from env.inherit (none/minimal/ambient),
          env.pass (host pass-through), caller base env, and env.set literals — in that order of
          increasing precedence. SANITIZED_ENV_VARS are stripped from inheritance.

          - The contract now carries an inheritParentEnv flag (false on the runner-backed path, true
          on the implicit/legacy path).


          Spawner changes in src/agents/spawner.ts:

          - SpawnAgentOptions gained inheritParentEnv (default true). When false, the spawner uses
          the supplied env verbatim (no process.env merge), so env.inherit policy is the only source
          of host vars.


          Wiring in src/agent-runtime/invocation.ts:

          - Spawn uses contract.cwd (not the caller cwd) and passes contract.inheritParentEnv
          through to the spawner. ACP newSession also uses contract.cwd.


          Test coverage (tests/agent-runner-resolver.test.ts) for runner.process.executable
          (override + registry-immutability + implicit-path passthrough), runner.process.cwd
          (override + fallback), env.inherit none/minimal/ambient + minimal default, env.pass
          forcing, env.set overriding inherited values, and inheritParentEnv true/false on both
          paths. All 36 resolver tests pass.
        created_at: 2026-05-31T12:01:21.691Z
    kind: blocker
