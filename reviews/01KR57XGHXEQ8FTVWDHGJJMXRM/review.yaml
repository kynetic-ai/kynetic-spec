      - _ulid: 01KR58HC1MEBWDC0RN4T1369PX
        author: Jacob Chapel
        body: 'Corrected evidence for the blocker, after shell quoting mangled the initial entry: MUST-FIX:
          the value-consuming flag table includes --use-openssl-ca, but Node treats that as a
          standalone option. I verified with a temp script that node --use-openssl-ca probe.js
          prints script-ran, so the next token is still the script path. A matching oxlint probe
