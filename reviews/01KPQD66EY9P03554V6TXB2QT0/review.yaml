    entries:
      - _ulid: 01KPQDRH1WFMFZ0FC4T6TC5BQD
        author: Jacob Chapel
        body: "Section membership is now derived from entry.path, but the synthetic changelog entry still
          uses path 'RELEASE_NOTES.md'. Reproduced with a node check: groupDocsSections(...)
          produces a sixth top-level 'Docs' section containing release-notes/changelog, and
          filterSectionEntries(..., 'release-notes/changelog') omits the changelog page from the
          Release Notes sidebar entirely. That violates @docs-section-taxonomy ac-1 and regresses
          sidebar navigation on the changelog page. Please classify this synthetic entry under the
          release-notes section (for example by using slug-based section detection for non-index
          entries or by giving the synthetic entry a section-qualified path)."
        created_at: 2026-04-21T07:06:04.220Z
      - _ulid: 01KPQF8RTKR434YR9NAT3381WK
        author: "@claude"
        body: "Fixed: Changed the synthetic changelog entry path from 'RELEASE_NOTES.md' to
          'release-notes/RELEASE_NOTES.md' in vite-plugin-docs.ts. This makes sectionKeyOf() return
          'release-notes' instead of null, so groupDocsSections() correctly classifies it under the
          Release Notes section. Added two regression tests: one verifying groupDocsSections
          produces exactly five sections (no sixth 'Docs' section) with the changelog inside
          release-notes, and one verifying filterSectionEntries includes the changelog when
          filtering for release-notes/changelog. All 8150 tests pass."
        created_at: 2026-04-21T07:32:25.043Z
