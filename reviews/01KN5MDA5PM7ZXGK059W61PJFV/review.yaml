          matching sessions, but it calls  without the cache accessor. That path reaches  with no ,
          so active sessions come back with  from  (often 0) instead of the live counter. I
          reproduced this by calling  with a ready sessions cache whose index was empty and ; the
          returned session still had . This means  and  still regress to stale counters on the exact
          stale-index path this helper is meant to cover.
