        body: "Fixed in f9baca482: the ready-but-stale related-session fallback no longer re-enters
          getAllSessionSummaries() and reuses the empty ready-cache index. It now forces a
          disk-backed session summary read with the current ProjectEntityCache instance so
          active-session live event counters are preserved on the stale-index path as well. Added
          regression coverage in tests/session-related-routes.test.ts for
          getRelatedSessionsForTask() with a ready sessions domain, empty cached index, and live
          counter overlay. Verification: npm test -- --run tests/session-related-routes.test.ts
          tests/daemon-cache-route-coverage.test.ts passed."
