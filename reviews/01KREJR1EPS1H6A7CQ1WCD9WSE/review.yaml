    entries:
      - _ulid: 01KREK5T2VB13YTPH9TH12BRB3
        author: Jacob Chapel
        body: 'MUST-FIX: local helper-body trust does not prove the helper terminates the daemon passed to
          it. The local-definition path accepts any helper body that contains a terminating
          primitive, then separately treats the cleanup call argument as owned. I verified a
          synthetic `function killPid(_pid) { process.kill(12345, "SIGTERM"); }` followed by
          `onTestFinished(() => killPid(pid))` produces `Found 0 warnings and 0 errors`. That helper
          kills a hardcoded unrelated pid and ignores the just-started daemon pid, so it should not
          satisfy `ac-cleanup-operation-terminates-daemon` or `ac-cleanup-helper-origin-is-trusted`.
          Body inspection needs to tie the terminating primitive target to the helper
          parameter/call-site value, or reject helpers whose termination target is
          unrelated/unverifiable.'
        created_at: 2026-05-12T17:18:56.091Z
      - _ulid: 01KREQDC2EJCHJZ129D1Q1RF0C
        author: "@claude"
        body: "Fixed. Helper-body inspection now requires the kill TARGET to be a verifiable shape — an
          Identifier or non-computed MemberExpression chain rooted at one. New helper
          `isVerifiableKillTarget` checks the pid argument for `process.kill(target, signal)` and
          the receiver for `<expr>.kill(signal)`. Literal and computed targets (the reviewer's exact
          `process.kill(12345, \"SIGTERM\")` shape, plus inline
          CallExpression/BinaryExpression/TemplateLiteral targets) are rejected. The Identifier case
          is deliberately broad: a parameter binding (helper terminates whatever was passed in) and
          an outer-scope closure binding (object-literal-kill capturing the test's `const pid =
          readPidFromFile()`) are both legitimate, and both existing accepted-shape tests at
          tests/lint-no-leaky-test-daemon.test.ts:3173 and 3551 continue to pass. The reviewer's
          exact probe `function killPid(_pid) { process.kill(12345, \"SIGTERM\"); }
          onTestFinished(() => killPid(pid))` now flags missingCleanup. Same check applied to the
          top-level `isDaemonCleanupCallExpression` so `onTestFinished(() => process.kill(12345,
          \"SIGTERM\"))` is also rejected. Added 4 positive regressions (function-helper-literal,
          arrow-helper-literal, object-literal-kill-method-literal, top-level-literal-target) at
          tests/lint-no-leaky-test-daemon.test.ts:2548-2657."
        created_at: 2026-05-12T18:32:58.190Z
    kind: blocker
    resolved_at: 2026-05-12T18:33:20.952Z
