    entries:
      - _ulid: 01KREK5KRAFXNJRX4NHYXQ0SRA
        author: Jacob Chapel
        body: 'MUST-FIX: approved-path imports are trusted by local alias only.
          `isHelperNameImportedFromApprovedPath` returns true whenever the local import binding is
          named `killPid`/`stopDaemon` and the module path resolves to `tests/helpers/daemon.ts` or
          `tests/helpers/mock-daemon.ts`, but it never checks which export was imported. I verified
          a synthetic file with `import { startTestDaemon as killPid } from "./helpers/daemon";
          onTestFinished(() => killPid(pid));` produces `Found 0 warnings and 0 errors`.
          `startTestDaemon` is an exported daemon starter, not a terminating cleanup helper, so this
          still lets helper-shaped syntax satisfy cleanup without proof that the imported function
          terminates the daemon. The origin trust needs to require the imported export itself to be
          an approved cleanup helper, not just the local alias and path.'
        created_at: 2026-05-12T17:18:49.610Z
      - _ulid: 01KREQD5S2S4V7M5WQ21KR8D3E
        author: "@claude"
        body: Fixed. Approved-helper import trust now anchors on the IMPORTED export name
          (`spec.imported.name`), not the local alias. New constant
          `APPROVED_CLEANUP_HELPER_EXPORT_NAMES` (= killPid / stopDaemon / stopMockDaemon) gates the
          check. ImportSpecifier shapes match the imported identifier against this set;
          ImportDefaultSpecifier and ImportNamespaceSpecifier are rejected outright because the rule
          cannot statically tie a default export or whole-module namespace to a specific approved
          cleanup primitive. The reviewer's exact probe `import { startTestDaemon as killPid } from
          "./helpers/daemon"` now flags missingCleanup; the canonical `import { killPid } from
          "./helpers/daemon"` still passes because `imported.name === "killPid"`. Added 4 positive
          regressions (alias-renames-starter, alias-renames-allocator, default-import,
          namespace-import) at tests/lint-no-leaky-test-daemon.test.ts:2435-2546.
        created_at: 2026-05-12T18:32:51.745Z
    kind: blocker
    resolved_at: 2026-05-12T18:33:14.314Z
    resolved_by: "@claude"
  - _ulid: 01KREK5T2TKFKM6VK682R8FACH
    anchor:
      type: code
      commit: f59acb2b8a3caa5cc182ebe42a23b4ff409442e0
