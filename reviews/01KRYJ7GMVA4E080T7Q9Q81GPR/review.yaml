threads:
  - _ulid: 01KRYJ8HJ1ZC3812S5MAQDBDGG
    anchor:
      type: structured
      ref: "@task-standardize-task-storage-incompatibility-api"
      section: tasks
    entries:
      - _ulid: 01KRYJ8HJ203335AGK9SX1FFAC
        author: Jacob Chapel
        body: The task-storage API response work is duplicated and attached to the wrong owner.
          @api-contract already owns this behavior through
          ac-task-storage-incompatibility-conflict-status,
          ac-task-storage-incompatibility-error-code, ac-task-storage-incompatibility-guidance,
          ac-task-storage-incompatibility-not-not-found, and context ACs;
          @task-daemon-api-task-storage-incompatibility-errors is already in_progress for that
          scope. Do not add ac-task-storage-incompatibility-conflict-response to @daemon-command-api
          or create a parallel implementation task. Retarget this plan to reference the existing
          @api-contract ACs/task, or explicitly depend on/validate that existing task.
        created_at: 2026-05-18T22:10:48.002Z
    kind: blocker
  - _ulid: 01KRYJ8ZAFTW37KFDWAEVF195P
    anchor:
      type: structured
      field: ac-task-storage-incompatibility-conflict-response
      ref: "@daemon-command-api"
      section: acceptance_criteria
    entries:
      - _ulid: 01KRYJ8ZAFJHXC8Y4C652XD5DG
        author: Jacob Chapel
        body: "The proposed AC is compound and mis-scoped: it combines HTTP status, error code, and recovery
          guidance, and @daemon-command-api owns /api/command parity rather than task route
          responses. The existing @api-contract already splits these into atomic ACs. Remove this AC
          addition and use the existing @api-contract task-storage incompatibility AC ids in
          Covers/validation."
        created_at: 2026-05-18T22:11:02.095Z
    kind: blocker
  - _ulid: 01KRYJ9BYPYYCNF1ZF91ATA6HS
    anchor:
      type: structured
      ref: "@task-validate-daemon-dispatch-oom-hardening-slice"
      section: tasks
    entries:
      - _ulid: 01KRYJ9BYQPEP7FYDD4VCG4DHV
        author: Jacob Chapel
        body: "The Covers line is not machine-checkable and includes non-existent or shorthand references:
          '@daemon-entity-cache task-storage incompatibility ACs', '@agent-invocation-lifecycle
          daemon-proxy isolation ACs', '@dispatch-workspace-cleanup-policy preservation diagnostic
          ACs', and @daemon-command-api ac-task-storage-incompatibility-conflict-response. Covers
          lines must name exact AC ids that exist. Replace the shorthand with the exact AC ids and
          use @api-contract for task-storage API response ACs."
        created_at: 2026-05-18T22:11:15.031Z
    kind: blocker
  - _ulid: 01KRYJ9SJWDMTXE409ED0RNABA
    anchor:
      type: structured
      ref: "@dispatch-event-envelope"
      section: acceptance_criteria
    entries:
      - _ulid: 01KRYJ9SJW8F1CYG03PFTYTXRR
        author: Jacob Chapel
        body: "The two proposed EventBus memory ACs use implementation-specific terms ('correlation-depth
          metadata' and 'delivery bookkeeping'). Reword them as behavioral resource-lifetime
          contracts: completed/aged-out event lineage and source-ordering state must not accumulate
          beyond the recent-event/delivery lifetime, without naming internal maps or metadata
          structures."
        created_at: 2026-05-18T22:11:28.988Z
    kind: question
  - _ulid: 01KRYJA66X1KF42A8MNRVTJCVR
    anchor:
      type: structured
      field: ac-invocation-lifecycle-helper-commands-do-not-proxy
      ref: "@agent-invocation-lifecycle"
      section: acceptance_criteria
    entries:
      - _ulid: 01KRYJA66Y4SDBWDZTV1JSVFNT
        author: Jacob Chapel
        body: "This AC is compound: it asserts both daemon-proxy suppression and preservation of
          mutation-safety environment. Split those into separate ACs, or keep the
          mutation-safety/env preservation detail in the implementation task if existing invocation
          ACs already own that behavior."
        created_at: 2026-05-18T22:11:41.918Z
    kind: question
  - _ulid: 01KRYJAHV4SHZBKWA09W5YZSAQ
    anchor:
      type: structured
      ref: "@task-update-daemon-dispatch-hardening-specs"
      section: tasks
    entries:
      - _ulid: 01KRYJAHV5NGSGPSX0PD127C6K
        author: Jacob Chapel
        body: The spec-update task lists many sequential 'kspec item ac add' mutations. Project convention
          requires batch mutations for 2+ sequential kspec writes, so make the How section say to
          use kspec batch with the AC additions, then inspect each owning spec with kspec item get.
        created_at: 2026-05-18T22:11:53.829Z
    kind: nit
