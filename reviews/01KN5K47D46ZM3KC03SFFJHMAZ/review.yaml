    entries:
      - _ulid: 01KN5KF4R0GWC4T2F02DAHYP7P
        author: Jacob Chapel
        body: "The new disk fallback drops live event counts for active sessions.
          listSessionSummariesFromDisk() reads only session.yaml via getSessionMetadataOnly(), so
          when the sessions domain is warming or degraded the filtered list routes return
          event_count 0 for active sessions until close-time stats are persisted. I reproduced this
          against the current route code with an active session that had three appended events: GET
          /api/sessions?task_id=@cache-test-task returned event_count 0 under a non-ready sessions
          cache. This regresses @daemon-entity-cache AC ac-session-live-counter and
          ac-session-event-tracking; the fallback path needs a live counter source or a direct
          event-count read for active sessions."
        created_at: 2026-04-01T22:43:46.560Z
      - _ulid: 01KN5M9B0SJHFHJ9KWT73319Y8
        author: Jacob Chapel
        body: "Fixed in 613afcce6: the disk-backed session-summary fallback now overlays live event counts
          from ProjectEntityCache instead of trusting session.yaml alone. Added a regression test
          covering GET /api/sessions?task_id=@cache-test-task with a degraded sessions cache and an
          active session carrying a live counter."
        created_at: 2026-04-01T22:58:04.953Z
