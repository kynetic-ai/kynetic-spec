    entries:
      - _ulid: 01KNADG11CWKRR47M2DDYQNANC
        author: Jacob Chapel
        body: Startup sync now runs twice. The on-start AC was already satisfied by a single call to
          `_syncAllActiveTargets()`, but this diff adds a second unconditional call immediately
          after it. That makes every engine start perform two full remote sync passes for every
          active target branch, doubling fetch/merge work and duplicate warning/log/degraded-state
          side effects on startup. The new tests only assert final branch state, so they do not
          catch this regression.
        created_at: 2026-04-03T19:35:36.236Z
      - _ulid: 01KNADZ3JBVV03JDBHCYFYN12J
        author: Jacob Chapel
        body: "Fixed in current branch: removed the duplicate startup call to _syncAllActiveTargets() in
          _initTargetSync() and added a regression in tests/dispatch-target-sync.test.ts that
          asserts engine start syncs each active target exactly once (dev plus plan/alpha).
          Re-verified with npm test -- dispatch-target-sync.test.ts and full npm test."
        created_at: 2026-04-03T19:43:50.347Z
