        body: Startup sync now runs twice.  already satisfied the on-start AC with a single , but this diff
          adds a second unconditional call immediately after it. That means every engine start
          performs two full remote sync passes for every active target branch, doubling fetch/merge
          work and duplicate warning/log/degraded-state side effects on startup. The new tests only
          assert final branch state, so they do not catch this regression.
