      - _ulid: 01KM45A29S2S9EN1Q9ZNV1T975
        author: Jacob Chapel
        body: " is not actually atomic when the affected tasks live in different task files.  explicitly
          supports loading tasks from multiple YAML files, but this helper writes each touched file
          sequentially and has no rollback path if a later  fails. In that case the cancelled task
          and some downstream cleanup notes are already persisted while later downstream files
          remain unchanged, which violates AC 's requirement that operators never observe a
          partially applied cancellation."
        created_at: 2026-03-19T23:01:23.897Z
      - _ulid: 01KM4664KSP3VC907DMTSCW020
        author: Jacob Chapel
        body: Fixed in commit b167ae34f. mutateTasksAtomically now stages multi-file task writes through the
          batch write buffer and flushes once after all touched task files are prepared, so
          cancellation cleanup is no longer persisted one file at a time. Added a regression test
          that moves the downstream task into a separate shadow task file and verifies task cancel
          still updates both files in one cancellation commit.
        created_at: 2026-03-19T23:16:43.768Z
