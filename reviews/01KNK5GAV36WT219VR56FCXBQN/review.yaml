    entries:
      - _ulid: 01KNK623FMC2DJZPTSAA6EF84Y
        author: Jacob Chapel
        body: "Concurrent hinted task write-throughs can lose one patch. This incremental path clones the
          current tasks index/detail maps and writes them back after awaited disk reads, so
          two  calls can start from the same snapshot and the later assignment overwrites the
          earlier one. I reproduced it with  using : task B updated, but task A stayed stale
          ().  now triggers this pattern for multi-task , so the cache can serve stale task data
          until a later watcher/full reload. Please serialize hinted task write-throughs or reuse
          the existing domain reload dedup path, and add a concurrency regression test."
        created_at: 2026-04-07T05:18:49.844Z
      - _ulid: 01KNK644Z0QMXZJHND0VAE5A0T
        author: Jacob Chapel
        body: "Confirmed repro: a tsx script updated task A and task B on disk, then ran Promise.all on two
          hinted writeThrough calls for the tasks domain. After the calls completed, task B
          reflected the new title but task A was still stale in cache on iteration 0. The root cause
          is that each incremental task update clones the current tasks index/details, awaits disk
          reads, and then assigns the cloned structures back without serialization.
          packages/daemon/src/routes/reviews.ts now makes this path easy to hit by issuing
          Promise.all over transitioned task ULIDs for request_changes."
        created_at: 2026-04-07T05:19:56.896Z
      - _ulid: 01KNK6TT6X39MH574VG5QGXY1V
        author: Jacob Chapel
        body: Fixed in fee4f128f. Hinted writeThrough for non-meta domains now runs through a queued
          in-flight reload lane, so concurrent task writeThrough calls no longer clone from the same
          stale snapshot and overwrite each other. Added a regression test that updates two task
          files, runs Promise.all over hinted task writeThrough calls, and verifies both cached task
          details reflect the new disk state.
        created_at: 2026-04-07T05:32:19.549Z
