threads:
  - _ulid: 01KRG734W4KQDM2JM8HMVA6GY3
    anchor:
      type: code
      commit: 67fe23685ef6ba6c463cf83414a02ad61e7b7027
      line_end: 6421
      line_start: 6412
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KRG734W5TXBH4NR7NGYBND0N
        author: Jacob Chapel
        body: "MUST-FIX: the implicit auto-start classifier only queues observations when the same
          initializer both names daemonPidFilePath/daemon.connection.json and performs the read.
          That leaves required observation shapes unreported: a normal alias pattern (metadataPath =
          join(..., 'daemon.connection.json'); readTestOutputSync(metadataPath)), a pidPath alias, a
          follow-up 'kspec serve status --json', and endpoint fetches via an existing daemon URL all
          pass with zero no-leaky-test-daemon errors and no scoped cleanup. This violates
          ac-implicit-autostart-cleanup-before-observation, which covers pid, metadata, status, and
          endpoint observations after a CLI command may auto-start the daemon. Evidence: I ran
          synthetic oxlint fixtures for metadata alias, pid alias, serve status, and daemon.apiUrl
          endpoint observation; all returned 'Found 0 warnings and 0 errors' despite no
          onTestFinished/try-finally cleanup."
        created_at: 2026-05-13T08:26:14.789Z
      - _ulid: 01KRGAWPSREN11V554YPY4ZPP3
        author: "@claude"
        body: >-
          Fixed in this cycle. Extended the implicit auto-start classifier to recognise the four
          missed observation shapes plus the secondary-observation cleanup-timing boundary:


          1. **Path alias chain** (`metadataPath = join(home.configDir, 'daemon.connection.json');
          read(metadataPath)` and `pidPath = isolatedHome.daemonPidFilePath;
          readFileSync(pidPath)`). Bindings whose init NAMES the daemon path without a read
          primitive are now recorded in `daemonPathAliasBindings`; a later file-read primitive whose
          argument resolves to one of these alias identifiers is classified as a daemon-ownership
          observation (`subtreeContainsReadOnDaemonPathAlias`).


          2. **`kspec serve status` invocations**. `isKspecServeStatusCall` +
          `subtreeContainsKspecServeStatus` recognise CLI calls whose argv tokenises to `serve
          status` — covers the helper string form (`kspec("serve status --json", tempDir)`), the
          helper argv form (`kspec(["serve", "status", "--json"], cwd)`), the exec/execSync
          shell-string form, and the spawn/spawnSync argv-array form. Token collection is
          quote-aware so `kspec search "serve status"` stays a single argv slot to `search` and is
          NOT mis-classified.


          3. **Endpoint fetches via member access** (`fetch(daemon.apiUrl)`, `new
          WebSocket(daemon.wsUrl)`). `daemonShapedBindings` tracks bindings whose init is itself a
          recognised observation; `subtreeContainsFetchOnDaemonMember` / `isDaemonEndpointMemberArg`
          accept fetch / new WebSocket against a `apiUrl`/`wsUrl`/`baseUrl`/`url` member on those
          bindings, descending into TemplateLiteral interpolations (`` `${daemon.apiUrl}/api/health`
          ``).


          4. **Standalone (unbound) observation calls**. CallExpression visit queues `await
          kspec("serve status …")` and `await fetch(daemon.apiUrl)` when they're entire
          ExpressionStatement payloads (not bound to a variable). Symmetric NewExpression visit
          handles `new WebSocket(daemon.wsUrl)`.


          5. **Secondary-observation cleanup boundary**. The cycle-1 cleanup-timing walk
          (`hasCleanupAfter`) didn't recognise the codebase's common pattern of registering cleanup
          once UP-FRONT and then reading metadata later for assertions (e.g.
          `tests/cli-serve.test.ts:570` registers `onTestFinished(() => killPid(pid))` then reads
          `metadataPath` at line 577). Added `hasCleanupBefore` anchored at the EARLIEST prior kspec
          CLI call (the implicit auto-start moment) so cleanup-before-secondary-observation is
          accepted while stale-pid cleanups (`const pid = 12345; onTestFinished(...); kspec(...)`)
          are still rejected via the existing `isCaptureOwnedByDetachedStart` ownership check.


          6. **Helper-function check differentiation**. Pure observation patterns (serve status,
          endpoint fetch) carry a `kind: "observation"` flag and skip the `isInHelperFunction`
          localWrapperUnsafe diagnostic. The helper-wrapper concern is about hiding daemon STARTUP
          from the call site; observation calls inside a polling helper / async callback are normal
          practice — the daemon was started in the caller's scope where the start has its own
          cleanup contract. Ownership captures (pid/metadata reads, direct or via alias) keep the
          helper check.


          Fixtures cover the four unsafe shapes (bound + standalone, including a spawnSync argv-form
          serve status), safe boundaries (cleanup-before, cleanup-immediate, polling helper,
          alias-with-cleanup), the stale-pid regression, and the quote-aware `kspec search 'serve
          status'` negative control.


          Verification:

          - `mise exec -- npm test -- --fresh tests/cli-no-daemon.test.ts
          tests/lint-no-leaky-test-daemon.test.ts tests/lint-daemon-test-guardrails.test.ts`: 31
          suites, 424 tests pass (was 413; the 11 new tests cover the cycle-2 shapes plus the
          safe-boundary regressions).

          - `mise exec -- npm test --fresh`: 2440 suites, 9245 passed / 9250 tests (5 skipped, same
          as cycle 1).

          - `npx oxlint tests/` returns to the 19-error pre-task baseline with zero
          `no-leaky-test-daemon` errors anywhere in the repo (previously after my cycle-2 extension
          this went up to 35 errors due to false positives on legitimate cli-no-daemon.test.ts /
          cli-serve.test.ts patterns; those are eliminated by the `hasCleanupBefore` + helper-kind
          fixes).

          - Synthetic fixtures mirroring the four reviewer probes (metadataPath alias, pidPath
          alias, kspec serve status, daemon.apiUrl endpoint) now emit `no-leaky-test-daemon` errors
          with the new pattern strings `aliased daemon path read` / `kspec serve status observation`
          / `daemon endpoint fetch`.
        created_at: 2026-05-13T09:32:38.072Z
    kind: blocker
