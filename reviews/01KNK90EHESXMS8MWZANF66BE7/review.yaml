    entries:
      - _ulid: 01KNK9131MG4MTJQYAHPYCFM4P
        author: Jacob Chapel
        body: The triage promote path still calls `writeThrough("tasks")` without the task ULID hint, even
          though `executeTriageAction()` returns the created task ref immediately before this block.
          That means promote continues to force a full tasks-domain reload in the request path
          instead of using the incremental single-entity patch this task is supposed to align with.
          Because this route is one of the mutation entry points that already knows which task was
          created, the implementation is still incomplete until it resolves `result.resultRef` (or
          the created task ULID) and passes it through here.
        created_at: 2026-04-07T06:10:42.356Z
      - _ulid: 01KNK9T26EV0A5GTJTKC84EWPT
        author: Jacob Chapel
        body: "Fixed: triage promote now resolves the created task ref back through taskDataManager and
          passes the created task ULID as the tasks-domain writeThrough hint, so this request path
          uses the incremental task patch instead of a full reload."
        created_at: 2026-04-07T06:24:20.686Z
    kind: blocker
    resolved_at: 2026-04-07T06:24:34.939Z
    resolved_by: Jacob Chapel
