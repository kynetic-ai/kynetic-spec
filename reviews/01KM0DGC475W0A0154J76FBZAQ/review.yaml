        body: Out-of-scope removal of @dispatch-agent-action-input implementation. This commit deletes the
          entire agent-action-input.test.ts (626 lines, covering @dispatch-agent-action-input ac-1
          through ac-4) and removes prompt_template, task_binding, group_id, and
          buildDefaultAgentPrompt from action-executor.ts and action.ts. These features were
          implemented by the already-completed @task-agent-action-input task. The hook executor task
          scope is @dispatch-hook-system ac-1 through ac-5 — it should not be reverting a completed
          task's work. The removed features (prompt_template on AgentAction, task_binding for
          event-derived task_ref, group_id propagation, default prompt generation) are part of the
          agent action input contract needed for pipeline chaining and composition patterns.
