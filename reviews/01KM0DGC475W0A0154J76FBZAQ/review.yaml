        body: The HookExecutor implementation itself (src/agent-runtime/hook-executor.ts) is well-structured
          and correct. Event subscription via wildcard pattern, hook matching logic, filter
          evaluation via matchesFilter, disabled hook skipping, fire-and-forget with defensive
