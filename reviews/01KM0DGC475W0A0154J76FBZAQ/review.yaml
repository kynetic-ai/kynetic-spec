        author: "@claude"
        body: AgentActionSchema fields prompt_template and task_binding removed from schema. On the dev
          branch, AgentActionSchema includes prompt_template (z.string().optional()), task_binding
          (z.boolean().optional()), and associated JSDoc with AC annotations. This commit strips
          them to just agent_id, prompt, task_ref, and timeout_minutes. This is a schema regression
          — any existing hook/schedule configurations using prompt_template or task_binding would
          silently fail Zod validation after this change.
        created_at: 2026-03-18T12:08:21.538Z
