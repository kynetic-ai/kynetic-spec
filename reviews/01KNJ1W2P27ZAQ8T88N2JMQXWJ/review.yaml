  - _ulid: 01KNJ23JAYX7Q3FB5EKVNQ65E4
    anchor:
      type: code
      commit: 6e975d7da18c5811a8ea560d32eb15a026c87b99
      line_end: 1634
      line_start: 1634
      path: src/daemon/entity-cache.ts
      side: head
    entries:
      - _ulid: 01KNJ23JAYASF9ETKTJV4F9WDE
        author: Jacob Chapel
        body: Incremental session invalidation now rewrites the detail cache from metadata-only state
          (`nextDetails.set(sessionId, summary)`), but the session detail route prefers
          `getSessionDetail()` over the live-count-adjusted index. For active sessions,
          `events.jsonl` changes do not update persisted metadata counts, so after a watcher event
          the API can serve stale `event_count` from the detail cache even though the index would
          still show the live counter. Before this patch, full reload cleared session details and
          the route fell back to the index, so this is a regression in session detail freshness for
          active sessions.
        created_at: 2026-04-06T18:50:29.086Z
      - _ulid: 01KNJ39JF6S7GD0VMYMKA5307Z
        author: Jacob Chapel
        body: Also added a regression around events.jsonl invalidation for an active session with live event
          counters. The test verifies detail is cleared and the index continues serving the live
          event count, which covers the freshness regression called out here.
        created_at: 2026-04-06T19:11:14.406Z
    kind: blocker
    resolved_at: 2026-04-06T19:11:19.337Z
    resolved_by: Jacob Chapel
