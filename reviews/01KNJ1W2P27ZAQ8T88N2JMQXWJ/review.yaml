    entries:
      - _ulid: 01KNJ23AJW24JX59DCSYNDM0RW
        author: Jacob Chapel
        body: Incremental session invalidation now rewrites the detail cache from metadata-only state (),
          but the session detail route prefers  over the live-count-adjusted index. For active
          sessions,  changes do not update persisted metadata counts, so after a watcher event the
          API can serve stale  from the detail cache even though the index would still show the live
          counter. Before this patch, full reload cleared session details and the route fell back to
          the index, so this is a regression in session detail freshness for active sessions.
        created_at: 2026-04-06T18:50:21.148Z
      - _ulid: 01KNJ39DQ2J4PKB9DF68CMVD49
        author: Jacob Chapel
        body: Changed incremental session invalidation to drop cached session detail entries instead of
          overwriting them with metadata-only summaries. That preserves route freshness for active
          sessions because detail lookup now falls back to the live-count-adjusted index or a full
          detail reload after watcher updates.
        created_at: 2026-04-06T19:11:09.537Z
