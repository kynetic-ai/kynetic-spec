    entries:
      - _ulid: 01KNJ20HDVC9PANYAPXFAQ6QWQ
        author: Jacob Chapel
        body: The new incremental sessions path adds a separate stale-session branch via
          loadCachedSessionSummary(), but the added regression tests here only cover
          update/insert/delete. There is no test proving that an active session crossing the stale
          threshold is rewritten to status 'stalled' during incremental invalidation, even though
          that behavior is explicitly called out in this task's required test matrix. Without that
          coverage, this branch can regress the stale-session logic while still passing the new
          tests.
        created_at: 2026-04-06T18:48:49.851Z
      - _ulid: 01KNJ39BCKTTWXHGYX0PF0A6EV
        author: Jacob Chapel
        body: Added an incremental stale-session regression that advances time across the default stale
          thresholds, triggers watcher invalidation for the single session, and verifies the cached
          index rewrites the session to stalled while leaving detail uncached.
        created_at: 2026-04-06T19:11:07.155Z
    kind: blocker
    resolved_at: 2026-04-06T19:11:11.954Z
    resolved_by: Jacob Chapel
