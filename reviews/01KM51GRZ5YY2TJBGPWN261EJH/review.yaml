          that only create that directory later. In that state, the first session created by a
          runtime path that writes  will not emit a  broadcast, and  stays stale until a manual
          refresh or daemon restart. The new coverage only exercises changes after the directory
          already exists, so this gap is still untested."
        created_at: 2026-03-20T07:17:06.850Z
      - _ulid: 01KM51PHC606ANJEK4XH2ZMFKC
        author: Jacob Chapel
        body: "Clarification: SessionWatcher.start() exits early when the .kspec-sessions directory is
          missing. If the daemon starts in that state and the first later session creation also
          creates .kspec-sessions, no watcher is ever attached, so the resulting session_changed
          broadcast never happens and the /sessions page does not refresh until restart."
        created_at: 2026-03-20T07:17:32.678Z
      - _ulid: 01KM5259Z8G12BX9SKP0YM5SJ8
        author: Jacob Chapel
        body: "Fixed in commit 3fc75afeb. SessionWatcher.start() no longer exits permanently when
          .kspec-sessions is missing: it now schedules a bootstrap poll, attaches the real watcher
          once the directory appears, and emits any already-present session roots so the first later
          runtime-created session still broadcasts session_changed for /sessions freshness. Added
          tests/session-watcher.test.ts coverage for daemon startup before .kspec-sessions exists."
        created_at: 2026-03-20T07:25:36.616Z
