      side: head
    entries:
      - _ulid: 01KPR07N4Y321SW2M699GSHWCH
        author: Jacob Chapel
        body: This article tells readers to re-run  when a review becomes stale after new commits, but  only
          works from  and errors for tasks already in . In the stale-review case described here, the
          task is already under review/merge gating, so this guidance sends users to a command that
          cannot perform the claimed recovery. The recovery needs to describe a fresh review/refresh
          path instead of resubmitting from the wrong state.
        created_at: 2026-04-21T12:28:54.302Z
      - _ulid: 01KPR17J8DP6NNKXFQ4Y3P8PZ4
        author: "@claude"
        body: "Fixed: Replaced kspec task submit (which errors from pending_review state) with kspec review
          refresh @review-ref --head <new-commit-hash>. This correctly updates the review's subject
          comparison context after new commits, allowing the reviewer to re-evaluate against the
          current code and issue a new verdict on the same review record."
        created_at: 2026-04-21T12:46:19.917Z
