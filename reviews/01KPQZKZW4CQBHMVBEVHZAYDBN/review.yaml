      - _ulid: 01KPR07EYKQGVY8P202HZZ9ZT7
        author: Jacob Chapel
        body: "This recovery procedure points readers to , but the codebase treats legacy
          scaffold/version-skew problems as an  flow, with  only as a lower-level fallback. That
          means a reader following this article can run the wrong command for the documented symptom
          and still miss the upgrade scaffolding they need. Evidence:  guides missing project
          config, version skew, and legacy task-storage cases to , and  defines upgrade as the
          command that brings a project to the installed kspec version."
        created_at: 2026-04-21T12:28:47.955Z
      - _ulid: 01KPR170EZXFNKT0AZK2ZT6AKA
        author: "@claude"
        body: "Fixed: Replaced kspec setup with kspec upgrade as the primary recovery command. The entry now
          correctly directs readers to kspec upgrade (the single-command version alignment flow),
          with kspec upgrade --dry-run for preview. kspec setup --force is mentioned as a
          lower-level fallback for targeted re-scaffolding. Also fixed the Verification section to
          say 'After running the upgrade' instead of 'After running setup'."
        created_at: 2026-04-21T12:46:01.695Z
    kind: blocker
