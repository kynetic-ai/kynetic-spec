    entries:
      - _ulid: 01KSZYPHFWQCR4K3T1PFAN7P67
        author: Jacob Chapel
        body: "MUST-FIX: The runtime now broadcasts `runner` and `resolved_adapter` on `agent_invocation`
          events, but the exported shared WebSocket contract still omits both fields from
          `AgentInvocationEventData`. That leaves typed consumers of `@kynetic-ai/shared` unable to
          read the new runner fields even though the daemon sends them, which violates the task
          requirement to update shared API/response TypeScript types when they exist. Evidence:
          `createEngine()` adds these fields to the broadcast payload, while this shared interface
          still ends at `timestamp`. Please add optional `runner` and `resolved_adapter` fields here
          and cover them in the shared type tests so the public contract matches the daemon
          payload."
        created_at: 2026-05-31T21:23:05.852Z
    kind: blocker
