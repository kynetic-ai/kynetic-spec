        author: Jacob Chapel
        body: MUST-FIX — Own acceptance-criterion coverage is incomplete. The parameterized test exercises
          start, pause, and resume, but only ac-start-reports-authority and the shared projection AC
          are annotated. Targeted completeness validation reports ac-pause-reports-authority and
          ac-resume-reports-authority as uncovered. Add standalone annotations for both criteria and
          ensure the associated assertions prove each authority result.
        created_at: 2026-07-16T12:02:14.543Z
    kind: blocker
  - _ulid: 01KXNCWQZVVMZJ0E6S6ACP8AZS
    anchor:
      type: code
      commit: ef7ffa06f604363415e906b2db0ccfbc3abb4afb
      line_end: 170
      line_start: 148
      path: tests/cli-agent-dispatch-lifecycle.test.ts
      side: head
    entries:
      - _ulid: 01KXNCWQZVCNCXQBEV05E8JZRK
        author: Jacob Chapel
        body: MUST-FIX — The required behavioral CLI boundary is bypassed. runLifecycleCli constructs a bare
          Commander instance, registers only agent commands, and directly injects JSON output state;
          it does not invoke the built CLI through tests/helpers/cli.ts with an explicit cwd and
          sanitized environment, and JSON cases never pass a real --json argument. This skips root
          option parsing, pre-action setup, process-level exit behavior, and actual stdout/stderr
          framing, so regressions in the exact grammar and JSON mode can pass. Replace or supplement
          this harness with the task-required subprocess helper and exercise the real flags for
          every grammar row.
        created_at: 2026-07-16T12:02:17.723Z
    kind: blocker
  - _ulid: 01KXNCWV7YCH8FQXGN928Z8SYG
    anchor:
      type: code
      commit: ef7ffa06f604363415e906b2db0ccfbc3abb4afb
      line_end: 407
      line_start: 405
      path: src/cli/commands/agent.ts
      side: head
    entries:
      - _ulid: 01KXNCWV7Y9Z36D5ZW9P9B00Y1
        author: Jacob Chapel
        body: MUST-FIX — Project-context resolution is outside the closed lifecycle error boundary. If
          initContext throws, mutation actions have no catch and can expose the rejected exception
          or stack; the two status actions catch it with generic error(..., err), whose text and
          JSON formatters stringify or serialize the raw exception and may include cwd/path
          suggestions. That violates the task requirement that every runtime failure use the fixed
          internal_error mapping and never expose a response path, cwd, or raw exception. Put
          context resolution behind the fail-closed mapping in both helpers/callers and add
          behavioral coverage with a distinctive thrown error that must not appear in either human
          or JSON output.
        created_at: 2026-07-16T12:02:21.054Z
    kind: blocker
  - _ulid: 01KXNCWYD4HT48MYAFT8D2Q0R8
    entries:
