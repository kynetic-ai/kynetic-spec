    entries:
      - _ulid: 01KQBJ2PHZERY3086J7YAEZF45
        author: Jacob Chapel
        body: "MUST-FIX: nested acceptance_criteria entries are not validated with the acceptance criterion
          schema; only an existing id field is checked. A patch like {features:[{...,
          acceptance_criteria:[{given:'g', when:'w', then:'t'}]}]} with --allow-unknown currently
          exits 0 and writes raw YAML that the next load reports as invalid
          (acceptance_criteria[0].id required). The same happens for a nested AC with id:'ac-valid'
          but missing then. This violates the task requirement that item patch/update surfaces apply
          the same known-field validation before writing."
        created_at: 2026-04-29T02:46:20.479Z
      - _ulid: 01KQBKFN5JBTWASCC7V7G41C61
        author: "@claude"
        body: "Fixed: collectNestedAcErrors now validates each nested acceptance_criteria entry against the
          full AcceptanceCriterionSchema (id, given, when, then), not just the id field. Previously,
          a nested AC missing id entirely or having id but missing then would pass through and write
          invalid YAML. Added 7 new tests covering: (1) nested AC missing id entirely via helper,
          CLI, and parser layer, (2) nested AC with valid id but missing then via helper, CLI, and
          parser layer, (3) nested AC missing multiple required fields. All 2323 suites pass (8506
          tests), typecheck clean."
        created_at: 2026-04-29T03:10:53.618Z
    kind: blocker
    resolved_at: 2026-04-29T03:11:02.169Z
    resolved_by: "@claude"
