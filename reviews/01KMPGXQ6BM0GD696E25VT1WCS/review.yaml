    entries:
      - _ulid: 01KMPH5VWCSZPFK251X2ABWTHY
        author: "@claude"
        body: Cached item-detail responses lose parent information.  only works when it can see the item's
          siblings/root in the same source file, but the cache-hit path calls it with  only, so any
          nested spec item comes back with  after the first read warms the detail cache. The disk
          path below computes the map from the full item list, so the same endpoint returns
          different data before and after the cache is populated.
        created_at: 2026-03-27T02:15:08.940Z
      - _ulid: 01KMPHQNH7FVRHK0CVH4M971BG
        author: "@claude"
        body: "Fixed: Cached item-detail path now uses the full item index (cache.getItemIndex()) for parent
          map computation when the items domain is ready, instead of only passing the single cached
          item. This ensures nested spec items correctly resolve their parent ULID from sibling
          items in the same source file."
        created_at: 2026-03-27T02:24:52.263Z
    kind: blocker
