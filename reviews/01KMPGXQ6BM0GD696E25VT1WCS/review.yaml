    entries:
      - _ulid: 01KMPH5TJH2YDAZ8XS6YA8QMM1
        author: "@claude"
        body: ac-warming-availability is still not implemented for the sessions domain. This code serves
          from cache only when the domain is "ready" and otherwise falls back to the standalone
          disk-backed session cache, so requests during initial warmup do filesystem reads instead
          of returning a loading response. I also verified that only tasks/items emit ;
          inbox/meta/plans/reviews/triage follow the same ready-or-disk pattern, so progressive
          loading is still incomplete for most domains.
        created_at: 2026-03-27T02:15:07.601Z
      - _ulid: 01KMPHQGE2PX1J5RDN6D4CA15C
        author: "@claude"
        body: "Fixed: Added warming-availability loading response to all 8 cache domains. Sessions, inbox,
          meta (4 routes: agents, workflows, observations, conventions), plans, reviews, and triage
          list routes now all check for 'loading' domain state and return {items: [], total: 0,
          _cache_status: 'loading'} instead of falling back to disk reads during warmup."
        created_at: 2026-03-27T02:24:47.042Z
    kind: blocker
    resolved_at: 2026-03-27T02:25:03.351Z
    resolved_by: "@claude"
  - _ulid: 01KMPH5VWBC8CHP5NFCNNVWJN2
    anchor:
      type: code
      commit: 536974f5967c5764722c786b8c33eb9cca28d174
