      side: head
    entries:
      - _ulid: 01KXMPQSBP54V6JVA78PH3DEAF
        author: Jacob Chapel
        body: "MUST-FIX: Legacy stop loses cleanup retry state and can report success without retrying
          cleanup. engine.stop() clears lifecycleStarted even when
          applyGlobalLifecycleAction('stop') throws; the alias catch retains the now-stopped engine
          in the map, and the next alias call invokes stop() again, skips lifecycle cleanup, deletes
          the engine, and returns 200. Runtime injection produced
          first={500,cleanup_pending,cancellation_failed}, second={200,{stopped:true}}, with
          lifecycleCalls still 1. Both POST /dispatch/stop and the action=stop adapter share this
          failure mode. Preserve a retryable engine/lifecycle state and prove repeated alias stop
          actually retries matching global cleanup before success."
        created_at: 2026-07-16T05:35:06.614Z
      - _ulid: 01KXMRBFN8CYSW9FH29JM6QAXD
        author: Jacob Chapel
        body: "Fixed in 224ff0ef12: legacy stop adapters now apply/retry durable global stop before runtime
          teardown. Cleanup failure leaves the same lifecycle-capable engine registered; repeated
          /dispatch/stop and action=stop tests prove a second request retries cleanup before
          success."
        created_at: 2026-07-16T06:03:20.616Z
    kind: blocker
    resolved_at: 2026-07-16T06:03:23.666Z
    resolved_by: Jacob Chapel
