        body: "MUST-FIX: The compatibility stop translators do not implement the frozen exact response rows.
          Every non-invalid error is labeled reason:'cleanup_pending', so pre-commit
          control_store_unavailable/control_store_corrupt/control_commit_failed and uncategorized
          internal errors gain a forbidden reason field. The task table requires reason only for
          post-commit cleanup failures; pre-commit and other internal rows contain only the boolean
          plus error_code. Apply stage-aware translation to both stop aliases and deep-equal every
          listed 409/500/503 row."
        created_at: 2026-07-16T05:35:09.811Z
      - _ulid: 01KXMRBNK9BQWG5ZVN2115ES8F
