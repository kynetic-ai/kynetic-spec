    entries:
      - _ulid: 01KXMPQP4NK3MNXBTJE7Y5YGH5
        author: Jacob Chapel
        body: "MUST-FIX: Invalid canonical transitions create runtime state before validation. The route
          calls ensureDispatchEngine before applyGlobalLifecycleAction/applyTaskLifecycleAction, so
          a stopped→pause request starts the engine, performs startup reconciliation, and queues
          held tasks before returning 409. Runtime evidence: POST global pause on a stopped
          real-shadow fixture returned 409 but left engineExists=true, engineRunning=true,
          dispatch_enabled=true, queue_depth=1, held_count=1. The plan requires invalid transitions
          to perform no reconciliation, enqueue, session, or process creation. Validate the
          transition/identity against committed authority before starting runtime infrastructure,
          and add a behavioral regression test."
        created_at: 2026-07-16T05:35:03.317Z
      - _ulid: 01KXMRB997CYFV67V66XTZJ804
        author: Jacob Chapel
        body: "Fixed in 224ff0ef12: shared pure transition guards now preflight committed matching-scope
          authority before ensureDispatchEngine, while the locked engine mutation reuses the same
          guards. Behavioral tests prove stopped global pause, matching task cleanup resume, and
          paused legacy start return 409 with no engine/runtime state created."
        created_at: 2026-07-16T06:03:14.086Z
      - _ulid: 01KXMRC8Z6KP59ZM8RJBXJJAGV
        author: Jacob Chapel
        body: "Fixed in 224ff0ef12: shared pure transition guards preflight committed matching-scope
          authority before ensureDispatchEngine, and behavioral tests prove invalid canonical and
          legacy requests create no engine state."
        created_at: 2026-07-16T06:03:46.534Z
    kind: blocker
    resolved_at: 2026-07-16T06:03:17.434Z
