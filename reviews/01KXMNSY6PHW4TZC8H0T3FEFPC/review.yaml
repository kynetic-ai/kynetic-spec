        body: "Fixed in 224ff0ef12: compatibility translators emit cleanup_pending only for
          DispatchCleanupError. Deep-equal tests cover cleanup, pre-commit control_commit_failed,
          uncategorized internal_error, and invalid_transition rows for both stop aliases, including
          prior-running booleans and path-free payloads."
