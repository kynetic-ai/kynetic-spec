threads:
  - _ulid: 01KNKF8MG7DX4GKR77FWAMET60
    anchor:
      type: structured
      ref: "@daemon-cache-command"
    entries:
      - _ulid: 01KNKF8MG74PX5MVR5FJMQ4MV3
        author: "@claude"
        body: This spec duplicates ownership with the planned @daemon-command-api AC update. Both describe
          read commands being served from cache when domains are ready, so the plan currently
          assigns the same behavior to two contracts. The benchmark plans keep spec boundaries
          crisp; choose one home for the command-API cache-serving behavior and make the other spec
          complementary rather than overlapping.
        created_at: 2026-04-07T07:59:41.063Z
    kind: blocker
  - _ulid: 01KNKF8MHC319XR0VQ5C7X832R
    anchor:
      type: structured
      ref: "@task-read-command-concurrency"
      section: description
    entries:
      - _ulid: 01KNKF8MHDKRNCR6TXDW7P4A7F
        author: "@claude"
        body: This task is not standalone-executable yet. Its How section leaves the core implementation
          choice unresolved (cache-only mode vs conservative allowlist), includes an explicit
          fallback-if-it-causes-issues branch, and assumes the worker will discover which commands
          are truly safe mid-task. Split the design decision from the implementation or commit to
          one concrete approach and verification plan.
        created_at: 2026-04-07T07:59:41.101Z
    kind: blocker
  - _ulid: 01KNKF8MH5XNSMD75BTW5890DE
    anchor:
      type: structured
      ref: "@daemon-concurrent-reads"
      section: acceptance_criteria
    entries:
      - _ulid: 01KNKF8MH55AVVXE860PE9B4ST
        author: "@claude"
        body: All three ACs define success in terms of internal mutex/file-lock acquisition rather than
          observable command behavior. Rewrite this spec around externally verifiable outcomes (for
          example, cache-backed reads can overlap without blocking each other, while commands that
          need disk/global-state serialization still do not) so the contract stays behavioral
          instead of locking in one implementation.
        created_at: 2026-04-07T07:59:41.093Z
    kind: blocker
  - _ulid: 01KNKF8MGN9CEQRRF17MG0YKV3
    anchor:
      type: structured
      ref: "@task-cache-task-history"
      section: description
    entries:
      - _ulid: 01KNKF8MGPZJGFVFRFNYFCR0DM
        author: "@claude"
        body: This task still presents three competing implementation options before saying option (b) is
          cleanest. The benchmark plans usually leave workers with one concrete path, not an in-task
          design fork. Tighten the task so the chosen approach, required interface changes, and
          verification boundary are explicit.
        created_at: 2026-04-07T07:59:41.078Z
    kind: question
  - _ulid: 01KNKF94HK5DH1MNS15HKPWSKT
    anchor:
      type: structured
      ref: "@daemon-task-history-cache"
    entries:
      - _ulid: 01KNKF94HM555FN129YCJTV6GM
        author: "@claude"
        body: This spec overlaps with the planned @daemon-entity-cache AC update instead of extending it
          cleanly. Retaining task history in cache is being introduced both as a new feature spec
          and as a new AC on the existing entity-cache spec, which creates duplicate ownership and
          review ambiguity. Consolidate the history-retention contract into one place and let the
          other spec reference it.
        created_at: 2026-04-07T07:59:57.492Z
    kind: blocker
  - _ulid: 01KNKF9A3M8M3F5YFDGFSBAWCT
    anchor:
      type: structured
      ref: "@task-cache-aware-remaining-loaders"
      section: description
    entries:
      - _ulid: 01KNKF9A3MWJQ48J9X98BF051T
        author: "@claude"
        body: "This task is much coarser than the benchmark plans: it bundles five loaders across four
          modules plus mixed index/detail fallback rules into one implementation step. Consider
          splitting it by domain or file cluster so each task stays independently executable, easier
          to review, and less likely to hide partial coverage gaps."
        created_at: 2026-04-07T08:00:03.188Z
    kind: question
