        author: Test User
        body: When  is called while the session is already , this implementation just assigns  and resolves
          immediately.  awaits  and then emits , so any queued session_prompt action is marked
          complete before the follow-up turn has actually run. That violates @session-prompt-action
          ac-2 ('completed when the turn finishes') and also hides delivery failures that occur in
          the queued turn path.
        created_at: 2026-03-22T11:38:01.511Z
    kind: blocker
  - _ulid: 01KMAND5EJQ2RS25NAFMVEY3PG
    anchor:
      type: code
      commit: 2dbdb68a84693d74e9ae060ab2c9753e3b1d5fa1
      line_end: 484
      line_start: 479
      path: src/agent-runtime/invocation.ts
      side: head
    entries:
      - _ulid: 01KMAND5EJ9AWT86BZ88VR825V
        author: Test User
        body: The follow-up queue only stores a single  string. HookExecutor intentionally fires all
          matching hooks independently, so two  actions targeting the same live session can arrive
          while that session is still . In that case the later call overwrites the earlier one, and
          one prompt is silently dropped even though both action runs report success. This breaks
          @session-prompt-action ac-1/ac-5 for multi-hook configurations.
        created_at: 2026-03-22T11:38:09.235Z
    kind: blocker
