threads:
  - _ulid: 01KXC6Y625WZGMGPJZRR1DJZJV
    anchor:
      type: structured
      ref: "@dispatch-lifecycle-control-authority"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXC6Y62541VPEMS93DMWQXEG
        author: Jacob Chapel
        body: "The plan still fails the required atomic, timeless AC rule. Concrete examples remain
          independently testable bundles: ac-paused-work-does-not-start combines global and task
          scope; ac-task-interrupted-stop-recovers combines daemon-start and retry triggers plus
          reopening and unrelated-task isolation; ac-controls-do-not-change-readiness asserts five
          state classes; ac-actions-are-idempotent ranges across all actions/scopes;
          ac-control-outcomes-are-auditable combines applied/no-op/failed; and
          ac-evidence-survives-control asserts six evidence classes. The proposed
          @per-task-dispatch-drain-coalescing ac-5 also combines timer cancellation, pending-drain
          suppression, and active-invocation cancellation. Split each behavior/path into one
          independently testable assertion and keep non-promises/mechanism in plan or task prose."
        created_at: 2026-07-12T22:25:03.557Z
    kind: blocker
  - _ulid: 01KXC6Y9EGDBGVAEABESYFP7CH
    anchor:
      type: structured
      ref: "@task-dispatch-control-persistence"
      section: description
    entries:
      - _ulid: 01KXC6Y9EGX2XNA1AAZ815S14J
        author: Jacob Chapel
        body: The commit/snapshot/watcher contract is not executable at the commit boundary. The plan writes
          and atomically renames dispatch-control.yaml before commitIfShadow, while current
          packages/daemon/src/project-context.ts forwards chokidar changes immediately to the cache
          callback. Another process can therefore call reloadCommitted() on the uncommitted
          replacement, including after commit failure. The plan specifies no watcher suppression,
          shadow-HEAD/version check, commit marker, or rollback-before-unlock path that prevents
          publication of that file. Freeze the cross-process publication mechanism and
          commit-failure rollback, and define the exact CacheDomain/status-projection bridge; a
          behavioral test requirement alone does not establish ownership ordering.
        created_at: 2026-07-12T22:25:07.024Z
    kind: blocker
  - _ulid: 01KXC6YEBY482SPD23YN58QFHR
    anchor:
      type: structured
      field: ac-interrupted-stop-recovers
      ref: "@dispatch-lifecycle-control-authority"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXC6YEBZ6766TAEN7S1T31T7
        author: Jacob Chapel
        body: "Durable crash recovery still cannot safely rediscover process ownership. pending_cleanup
          targets persist only PID/PGID plus session/task/path; after daemon downtime those numeric
          ids can be reused, yet the plan requires signalling a live matching process and mentions
          cleanup_identity_mismatch without defining a durable birth/identity token or a
          cross-platform verification rule. It also does not freeze the durable invocation-record
          file/schema: current SessionMetadataSchema is owned by src/sessions/types.ts and has no
          PID/PGID fields, while the task inventory names only src/sessions/store.ts. Define the
          durable record path/schema, process identity fingerprint and unverifiable-identity
          behavior, and exact ownership handoff before active status."
        created_at: 2026-07-12T22:25:12.063Z
    kind: blocker
  - _ulid: 01KXC6YHFXXQ52VCGDAADM531Q
    anchor:
      type: structured
      ref: "@task-dispatch-lifecycle-events"
      section: description
    entries:
      - _ulid: 01KXC6YHFXNK45887ZTSCQBS94
        author: Jacob Chapel
        body: The six event identifiers and start/pause/resume/stop mapping are now present, but the
          promised closed error_code contract is not. The plan uses invalid_transition,
          control_store_degraded, cleanup_pending, cleanup_identity_mismatch and other
          validation/identity/persistence failures without enumerating one closed set or mapping
          each failure class to a code. Exact event and API consumers cannot validate or branch on
          this contract until the code set and mapping are frozen.
        created_at: 2026-07-12T22:25:15.261Z
    kind: blocker
  - _ulid: 01KXC6YME0KYWT7G89319Q627N
    anchor:
      type: structured
      ref: "@task-daemon-dispatch-lifecycle-api"
      section: description
    entries:
      - _ulid: 01KXC6YME1DWMC6TQX0P3HEB66
        author: Jacob Chapel
        body: Legacy HTTP compatibility is still incomplete and contradicts current responses. Current POST
          /api/agent/dispatch returns 400 {dispatch_enabled:false,error} for foreign cwd, 409
          {dispatch_enabled:true,error} for a cwd conflict, and reason on no-op; the plan freezes
          only the action/body 400 and a success/no-op boolean shape. Current POST
          /api/agent/dispatch/start cwd-conflict 409 also includes status, but the plan freezes
          {started:false,error:string} without status. Store/start failures and exact
          error.code/details shapes are not mapped for every alias. Preserve every existing
          field/status case explicitly, then define translations for new 500/503 outcomes.
        created_at: 2026-07-12T22:25:18.273Z
    kind: blocker
  - _ulid: 01KXC6YQDHY1PN9M8QC9VRR8B0
    anchor:
      type: structured
      ref: "@task-cli-dispatch-lifecycle-controls"
      section: description
    entries:
      - _ulid: 01KXC6YQDHNDZBNAJ9YG504BKA
        author: Jacob Chapel
        body: The CLI contract remains incomplete despite switching to trait-compatible --force. The section
          labeled Grammar omits both existing kspec agent dispatch status and kspec agent status
          spellings, while current src/cli/commands/agent.ts implements both. It also does not
          freeze which commands use canonical /api/agent/status and /api/agent/dispatch/control
          versus legacy /dispatch/start|stop|status. tests/cli-daemon-endpoint-regression.test.ts
          currently asserts all four existing spellings against legacy endpoints, but the CLI task
          Files and Verification omit that suite. Add both status grammars, an exact
          command-to-endpoint compatibility table, and the existing regression suite to the task.
        created_at: 2026-07-12T22:25:21.329Z
    kind: blocker
  - _ulid: 01KXC6YT6WJ6NSNGXDCWY3XDDK
    anchor:
      type: structured
      ref: "@task-final-pre-spawn-control-gate"
      section: tasks
    entries:
      - _ulid: 01KXC6YT6W31GXRPG869C59JSM
        author: Jacob Chapel
        body: Primary closure ownership is syntactically unique but not executable.
          task-final-pre-spawn-control-gate claims ac-spawn-win-stop-cancels-invocation before
          task-engine-global-hard-stop exists, although that later task owns cancellation and
          cleanup. Likewise task-engine-global-lifecycle claims ac-paused-work-does-not-start for
          global or task authority before task pause is implemented. These
          cross-scope/late-mechanism ACs cannot be closed by their named primary tasks. Split the
          ACs by scope/race outcome or move each claim to the task that implements the required
          behavior, leaving verification tasks secondary.
        created_at: 2026-07-12T22:25:24.188Z
    kind: blocker
  - _ulid: 01KXC6YX101DWRT0CSMJQMPGD6
    anchor:
      type: structured
      ref: "@task-engine-task-hard-stop"
      section: description
    entries:
      - _ulid: 01KXC6YX10Z75MHZZAAY9EB2FQ
        author: Jacob Chapel
        body: Path classification is not fully truthful. task-engine-task-pause-resume already creates
          tests/dispatch-task-lifecycle.test.ts, but the dependent task-engine-task-hard-stop also
          marks that same file Create; it will be Existing when that task starts. Recovery also
          requires a durable PID/PGID binding in a validated session or invocation record, yet
          current schema ownership is src/sessions/types.ts and that Existing file is absent from
          the task and global Create/Existing inventory. Name the actual record schema owner and
          classify the shared test file as update in the later task. The active-session-registry
          path itself is now correctly Existing.
        created_at: 2026-07-12T22:25:27.072Z
    kind: blocker
