    entries:
      - _ulid: 01KXN5TRTN3XE10VE466JV7JDD
        author: codex-reviewer
        body: "MUST-FIX: startup is single-flight, but the post-start lifecycle action and rollback are not.
          `ensureDispatchEngine` gives only the creator `created: true`; joined callers resume after
          the same initialization and mutate the shared engine independently. A real-shadow
          two-request probe held shared startup and injected a one-shot `control_commit_failed` for
          the creator's first global-start mutation. The creator returned HTTP 503 and rolled the
          engine back, while the joined caller returned HTTP 200 with `outcome: applied`; afterward
          `getDispatchEngine(projectDir)` was undefined and committed global authority was
          `running`. This violates the no-success-on-control-failure and cold-start rollback
          guarantees, and affects the canonical route plus both start aliases. Serialize the entire
          cold-start lifecycle transaction (including post-start mutation and rollback), or
          otherwise prevent joiners from using an engine while rollback ownership is unsettled, and
          add a behavioral concurrent post-start persistence-failure regression."
        created_at: 2026-07-16T09:58:53.013Z
    kind: blocker
