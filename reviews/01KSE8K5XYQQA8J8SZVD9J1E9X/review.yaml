        created_at: 2026-05-25T00:35:48.698Z
      - _ulid: 01KSE8ZB9BTY0H4H3HJKM4RVRK
        author: Jacob Chapel
        body: "Corrected finding text: MUST-FIX: a protected-project storage preflight failure does not stop
          the rest of kspec upgrade. runAtomicStorageMigration can return a failed Storage migration
          safety preflight, but runUpgradePipeline still falls through into
          runBackfillCoreSkillsStep and later upgrade steps. I reproduced this against a temp
          project with KSPEC_PROTECTED_PROJECT_PATHS set to the project root: the JSON result had
          Storage migration safety preflight=failed but still reported Backfill core skills=done. A
          protected target must abort without any further upgrade mutations once the tripwire fires;
          otherwise the guard can prevent plan/review/manifest writes while later upgrade steps
          still touch .kspec/agent artifacts or commit shadow state on the same protected project."
        created_at: 2026-05-25T00:36:20.395Z
      - _ulid: 01KSEB21Q7JC6W97RC2HT5PKE7
        author: "@claude"
        body: >-
          Fixed in commit 7987f2ca73. Root cause: assertSafeMigrationTarget was scoped to
          runAtomicStorageMigration, so a failed Storage migration safety preflight only skipped
          plan/review/manifest writes — runUpgradePipeline still fell through to
          runBackfillCoreSkillsStep, runRerenderSkillsStep, runRegenerateAgentsStep,
          runGitignoreRepairStep, runScaffoldMissingStep, and the version-record step. Those write
          to .kspec/skills/, .agents/, .gitignore, and the shadow branch.


          Fix: hoisted assertSafeMigrationTarget to runUpgradePipeline immediately after the
          isCurrent/!force short-circuit and before Step 1 (Task storage migration). On tripwire
          failure the pipeline returns a single failed Storage migration safety preflight step plus
          skipped synthetic entries for every named downstream step (Task storage migration, Plan
          storage folder migration, Review storage folder migration, Storage manifest, Backfill core
          skills, Re-render skills, Regenerate agent instructions, Restore gitignore entries,
          Scaffold missing files, Record version). No mutation reaches disk. Dry-runs remain exempt
          so operators can still preview against protected targets.


          Regression test added at tests/upgrade-folder-storage.test.ts: 'upgrade refuses every
          pipeline step when KSPEC_PROTECTED_PROJECT_PATHS guards the target'. Asserts every
          downstream step is reported as skipped (including the previously-bypassed Backfill core
          skills), no step is done, and the manifest, setup state, .gitignore, .kspec/skills/
          listing, and plans/reviews directories are byte/listing identical to before the run.


          Focused upgrade tests: 18 passed in tests/upgrade-folder-storage.test.ts (was 17). Full
          suite: 2519 suites passed, 9600 tests passed, 5 pre-existing skipped of 9605.
        created_at: 2026-05-25T01:12:46.055Z
