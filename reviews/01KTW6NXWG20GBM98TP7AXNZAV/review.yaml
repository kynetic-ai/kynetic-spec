      - _ulid: 01KTW6RM46ES59G2F0CZ3BT5VP
        author: "@claude"
        body: "Cross-document tension worth resolving while P0a is still draft. I verified the round-1
          resolution claim against the decision register (plans/ui-redesign/decisions.md #13): it
          does assign the N/A-stop to P1a/P1b ('stop the parser's silent N/A counts as covered
          behavior'), so option (a) is substantiated. However, P0a's own draft content still says
          the opposite in two places: the @ac-coverage-applicability description ('remains in force
          until the coverage state engine work reconciles the two semantics') and the 'Boundaries
          and follow-ons' section ('The coverage state engine plan owns reconciling the validate
          exemption behavior with corpus coverage'). This plan's remedy — task 4 amending the live
          decision item immediately after P0a derives it — works, but since P0a has not yet derived,
          the cleaner path is to fix the boundary sentence in P0a's draft so the item materializes
          already-correct, making task 4's amendment bullet unnecessary (or a no-op verification).
          Secondary fragility: task 4's amendment instruction quotes the current P0a draft wording
          ('replace the deferral to \"the coverage state engine work\"'); if P0a's text shifts
          during its remaining review rounds, the instruction's anchor text may not match what
          derives. The defensive end-state phrasing mostly mitigates this. Non-blocking either way —
          but recommend coordinating the P0a-side fix during its draft window, and if taken,
          updating task 4 to verify rather than amend."
        created_at: 2026-06-11T20:42:46.790Z
      - _ulid: 01KTW921T64P8NJN956T5Q5EBZ
        author: "@claude"
        body: "P0a side aligned during its draft window (finishing round finish-1). The
          @ac-coverage-applicability description now phrases the transition boundary timelessly —
          the pre-existing completeness validation path \"remains in force until corpus coverage
          computation adopts these semantics\" — with no engine-vs-schema assignment; ac-2's
          when-clause actor is generalized to plain corpus coverage computation; and the Boundaries
          note now assigns reconciliation to the coverage track plans rather than the engine plan
          specifically. The decision item will therefore materialize already consistent with
          register #13 and this plan's respec task. P1a-side follow-up (task 4 verify-vs-amend) is
          left to this plan's author."
        created_at: 2026-06-11T21:22:52.870Z
