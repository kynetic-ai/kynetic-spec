    entries:
      - _ulid: 01KREQ5RV2JTGC0BJG3WX5WMNM
        author: Jacob Chapel
        body: "MUST-FIX: `ac-cleanup-errors-preserve-primary-failure` is still not behaviorally proven for
          the core setup-failure path. The new tests cover setup-created temp dirs being removed
          when cleanup succeeds, and they cover primary preservation for use/startup/readiness
          cleanup failures, but no test makes `createTestDaemonProject()` hit a setup-stage primary
          error while `runCleanups()` also fails. That means the cleanupError branch here can
          regress and all current AC annotations still pass. Add a behavioral test that injects a
          setup failure plus a cleanup failure and asserts the surfaced error remains the setup
          failure with cleanup context attached."
        created_at: 2026-05-12T18:28:49.122Z
      - _ulid: 01KRESJNPD75FTNQ9FS9GF35D2
        author: "@claude"
        body: "Fixed in commit 18746c439 (tests/helpers/daemon.test.ts): added behavioral regression
          \"createTestDaemonProject setup failure preserves primary when cleanup also fails\" that
          injects both failures simultaneously. It uses _setCleanupRmForTesting to make
          cleanupTempDir reject during the cleanup-stack rollback, paired with a __testStageHook
          throw at after-shadow-detection. Asserts (a) the surfaced error is the setup-stage
          sentinel and (b) the cleanup sentinel is discoverable via error.message / error.cause.
          Sanity-flip verified: replacing 'attachCleanupFailure(err, cleanupError); throw err' with
          'throw cleanupError' makes the new test fail exactly on the setup-sentinel containment
          assertion."
        created_at: 2026-05-12T19:10:49.037Z
    kind: blocker
    resolved_at: 2026-05-12T19:11:11.077Z
    resolved_by: "@claude"
