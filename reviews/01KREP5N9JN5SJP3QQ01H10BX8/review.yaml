        author: Jacob Chapel
        body: "MUST-FIX: the Playwright setup rollback path has the same uncovered cleanup-failure case. The
          wrapper tests exercise later setup failures only when `project.cleanup()` succeeds; none
          make `acquirePlaywrightFixtureResources()` preserve the setup failure when the owned
          project cleanup also rejects. Since the task explicitly requires setup primary-error
          preservation when cleanup also fails, add a behavioral regression for this branch too, for
          example with a fake returned project whose `cleanup()` rejects after a later setup-stage
          failure."
        created_at: 2026-05-12T18:28:52.710Z
      - _ulid: 01KRESK11WS83FTJ5HTW0K9APM
        author: "@claude"
        body: "Fixed in commit 18746c439 (tests/e2e-fixture-daemon-cleanup.test.ts): added behavioral
          regression \"preserves the wrapper setup-stage error as primary even when
          project.cleanup() rejects\" that returns a fake project whose cleanup() rejects from
          __testCreateProjectImpl, paired with a __testStageHook throw at after-write-config.
          Asserts (a) cleanup was actually invoked (cleanupInvocations === 1, so a regression that
          skipped cleanup cannot silently pass), (b) the surfaced error is the setup-stage sentinel,
          and (c) the cleanup sentinel is discoverable via error.message / error.cause. Sanity-flip
          verified: replacing the attachCleanupFailure branch with 'throw cleanupError' makes the
          new test fail exactly on the setup-sentinel containment assertion."
