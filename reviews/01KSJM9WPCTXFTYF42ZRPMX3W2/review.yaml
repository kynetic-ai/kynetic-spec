threads:
  - _ulid: 01KSJMCVVQY82EMRPRWY35XXAX
    anchor:
      type: structured
      field: Testing
      ref: "@task-clear-occupied-checkout-degraded-state-on-retry"
      section: tasks
    entries:
      - _ulid: 01KSJMCVVQ74KNT3TX6GA378K9
        author: Jacob Chapel
        body: "The Testing section tells the worker to run `npm test -- --fresh
          tests/dispatch-remote-branch-sync.test.ts`, but that file does not exist in this
          repository. Evidence: `rg --files tests | rg 'dispatch|remote|sync|merge'` lists
          `tests/dispatch-target-sync.test.ts`, `tests/dispatch-degraded-state.test.ts`, and related
          dispatch tests, but no `tests/dispatch-remote-branch-sync.test.ts`; an earlier `rg` over
          that path failed with `No such file or directory`. This makes the task non-standalone and
          gives the worker a failing verification command. Fix by naming the actual existing test
          file(s) to update/run, or explicitly add creation of
          `tests/dispatch-remote-branch-sync.test.ts` to the What/How scope."
        created_at: 2026-05-26T17:12:55.415Z
    kind: blocker
  - _ulid: 01KSJMD0572JYNNQ4PC6BS66TX
    anchor:
      type: structured
      field: description
      ref: "@task-rework-detached-reviewer-merge-helper-ephemeral-target"
      section: tasks
    entries:
      - _ulid: 01KSJMD057Q9SZVZ68TF5HWBVF
        author: Jacob Chapel
        body: "The task describes updating the rendered/installed skill copy so
          `.agents/skills/kspec-merge/scripts/detached-reviewer-merge.sh` receives the same behavior
          after `kspec agents generate`. That conflicts with the project skill source-of-truth
          rules: core skill sources live under `templates/skills/`, rendered `.agents/skills/`
          output is produced by `kspec skill render`, and `kspec agents generate` only regenerates
          `kspec-agents.md`. Evidence: `kspec skill --help` shows `skill render` renders
          platform-specific skill files, while `kspec agents --help` only generates agent
          instructions. Fix the task to say edit
          `templates/skills/merge/scripts/detached-reviewer-merge.sh`, run `kspec skill render` (or
          the exact supported render command), and only run `kspec agents generate` if the agent
          instruction document itself needs regeneration."
        created_at: 2026-05-26T17:12:59.816Z
    kind: blocker
  - _ulid: 01KSJMD4M8RMFC847HCQT893F3
    anchor:
      type: structured
      field: Covers
      ref: "@task-align-merge-helper-branch-lock-specs"
      section: tasks
    entries:
      - _ulid: 01KSJMD4M8APPNNCHYAXXQY4A2
        author: Jacob Chapel
        body: The spec-update task explicitly rewrites existing helper ACs
          (`ac-helper-refuses-dirty-target`, `ac-helper-safe-conflict-exit`) and updates
          `ac-helper-no-op-merge` semantics, but its Covers line only lists the newly added AC IDs.
          The later implementation/regression Covers also omit `ac-helper-refuses-dirty-target`,
          even though dirty/staged occupied-target refusal remains part of the requested spec
          behavior. This leaves changed existing behavior outside the plan's coverage map. Fix by
          adding every rewritten existing AC to the appropriate Covers lines, especially
          `@detached-reviewer-merge-helper ac-helper-refuses-dirty-target`, and make clear which
          task implements and tests each rewritten AC.
        created_at: 2026-05-26T17:13:04.392Z
    kind: blocker
  - _ulid: 01KSJMD8ZW7TE8GF3BX7Y13QYM
    anchor:
      type: structured
      field: How
      ref: "@task-add-plan-target-lock-e2e-regression"
      section: tasks
    entries:
      - _ulid: 01KSJMD8ZXDG6DCZSXNGJR4YA3
        author: Jacob Chapel
        body: The E2E regression task says that if full engine orchestration is too heavy, the worker may
          split it into a helper-level test plus a dispatch-sync test. That gives the worker
          discretion to downgrade the plan's required incident-level regression without a product
          decision. The incident was specifically the cross-product of plan-scoped target branches,
          manual_merge reviewer flow, helper branch locks, and dispatch root sync/push. Fix by
          requiring a true integration-style regression for that combined path, or by saying the
          worker must block/escalate if full orchestration proves infeasible rather than
          substituting narrower tests and still claiming the E2E coverage.
        created_at: 2026-05-26T17:13:08.861Z
    kind: blocker
