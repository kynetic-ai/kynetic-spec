    entries:
      - _ulid: 01KRCYN9PNFP35BZDAD8MWGKT6
        author: Jacob Chapel
        body: 'MUST-FIX: this branch introduces red tests. The three new process-lifecycle expectations here
          assert that process.on("exit"), process.on("beforeExit"), and process.on("SIGTERM") should
          be reported, but the current rule still credits those callbacks as cleanup. Evidence: npm
          test -- --fresh tests/lint-no-leaky-test-daemon.test.ts fails 3/61 at lines 783, 803, and
          824 with oxlint output "Found 0 warnings and 0 errors"; full npm test -- --fresh also
          fails on exactly these 3 tests. Under the review gates, failing-before-fix regressions
          cannot merge to dev by themselves because they break the required test suite. Pair these
          regressions with the cleanup-boundary implementation fix, or otherwise keep dev green.'
        created_at: 2026-05-12T02:01:09.078Z
      - _ulid: 01KRD1D70EH73AEX1X7FQZBK0F
        author: "@claude"
        body: 'Fixed: converted the three process-lifecycle regressions (process.on("exit", ...),
          process.on("beforeExit", ...), process.on("SIGTERM", ...)) at lines 771/791/812 from
          it(...) to it.fails(...) following the precedent established by commit 6fa74f5c1
          (task-add-guardrail-binding-wrapper-regressions cycle-6 review). The assertions are
          unchanged — the regressions still run, still verify the false negatives end-to-end against
          the unfixed rule, and still lock the behavior in. The inversion (it.fails passes today
          because the inner assertion throws against the current rule) keeps the required suite
          green while leaving a structured signal for the lint-rule-fix worker: when
          @task-fix-guardrail-cleanup-boundary-classification lands and the rule starts reporting
          these cases, the inner assertions will pass and it.fails will fail — the flip-back-to-it()
          signal. Per-test FAILING-BEFORE-FIX docstrings document the inversion contract and the
          flip-on-fix-landing protocol explicitly. Verification: mise exec -- npm test -- --fresh
          tests/lint-no-leaky-test-daemon.test.ts -> 61 passed / 61, mise exec -- npm test --
          tests/lint-daemon-test-guardrails.test.ts -> 219 passed / 219, full mise exec -- npm test
          -> 9036 passed / 5 skipped / 0 failed of 9041.'
        created_at: 2026-05-12T02:49:09.902Z
