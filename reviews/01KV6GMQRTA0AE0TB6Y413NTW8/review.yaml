    entries:
      - _ulid: 01KV6HM9BTRR3H73PK7V3F99NE
        author: Jacob Chapel
        body: 'MUST-FIX: operator `defaults` values are accepted with only an object-shape check and then
          cast to `Partial<Record<ActorRecordKind, string>>`. I reproduced this with a temp project
          containing `project.inbox.yaml` `added_by: Hermes` and an actor map `defaults: { inbox:
          123 }`: `runActorNormalization` reported an inbox rewrite with `resolved: 123` and
          persisted `added_by: 123` (number) into YAML. Reload then warns that the inbox item is
          invalid (`added_by="number"`). This violates @actor-history-normalization ac-5 and
          @actor-identity-model ac-2: the upgrade can leave an inventoried actor field neither
          canonical nor a declared string default, and it corrupts schema-valid storage instead of
          failing closed before writes. Validate `defaults` keys and values (known record kind,
          non-empty string, and whatever canonical/default rules are intended) before constructing
          the resolver, and add a behavioral regression test.'
        created_at: 2026-06-15T21:05:03.354Z
    kind: blocker
