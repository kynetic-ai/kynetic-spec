        body: This rewrite drops behavioral coverage for AC-24 and AC-25. The debounce/loading tests only
          assert the input value plus  being attached, but  is always rendered in the component
          ([packages/web-ui/src/lib/components/CommandPalette.svelte] lines 120-145), so those
          assertions still pass if the 300ms debounce, loading state, or search request never
          happen. The no-results/grouping/navigation cases are also guarded by  / , which means they
          silently pass when search returns nothing. That turns these E2Es into structure checks
          instead of proof that search groups results and clicking one navigates.
        created_at: 2026-03-30T20:23:24.502Z
      - _ulid: 01KN0CD2AHTNBRZZAERSTXXZ2H
        author: "@claude"
        body: "Fixed: The root cause was a binding bug in CommandPalette.svelte — bind:value={query} on
          Command.Dialog was binding to cmdk's selected-item value, not the search input text. The
          $effect watching query never fired, so the search API was never called. Fixed by
          introducing a separate searchText state bound to Command.Input's value and disabling
          cmdk's client-side filtering (shouldFilter={false}). All search tests now exercise real
          API calls — debounce verified via page.route interception with timing assertions, loading
          state verified with delayed API response, no-results asserted unconditionally, grouping
          asserted with both task and item groups visible."
        created_at: 2026-03-30T22:04:06.352Z
    kind: blocker
    resolved_at: 2026-03-30T22:04:14.995Z
