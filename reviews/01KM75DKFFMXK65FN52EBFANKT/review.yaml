    entries:
      - _ulid: 01KM75NMB5FTFPR3YMSPC6613T
        author: Jacob Chapel
        body: deleteTask() bypasses the per-task queue that mutateTask()/mutateTasks() use, so same-task
          operations still race across lock paths instead of serializing behind one task-level lock.
          I reproduced this by running deleteTask('@test-task-pending') concurrently with
          mutateTask() on the same ref; the delete completed and the mutation then failed with 'Task
          not found in file during write phase'. That violates AC-9's guarantee that when two
          mutations target the same task, one waits while the other proceeds without corruption or
          mid-flight not-found failures.
        created_at: 2026-03-21T03:05:26.117Z
    kind: blocker
