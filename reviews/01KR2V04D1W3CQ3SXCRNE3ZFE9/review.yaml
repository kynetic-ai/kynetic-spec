    entries:
      - _ulid: 01KR2VN63Q23Z1DEVRB6MAFVCG
        author: Jacob Chapel
        body: "MUST-FIX: ac-exceptions-are-localized is only tested for the happy path with a documented
          oxlint-disable-next-line; it does not prove that undocumented or broad exceptions are
          rejected. I verified both  with no  reason and file-wide  suppress the rule with zero
          diagnostics. That means intentional exceptions are not required to be locally documented
          with a narrow reason, contrary to the task and AC."
        created_at: 2026-05-08T03:56:15.351Z
      - _ulid: 01KR2VP22M1DSSRRX3T012BK0P
        author: Jacob Chapel
        body: "Clarifying repro details: I verified both an oxlint-disable-next-line for
          no-leaky-test-daemon/no-leaky-test-daemon without a double-dash reason and a file-wide
          oxlint-disable for no-leaky-test-daemon/no-leaky-test-daemon. Each suppressed the direct
          daemon spawn with zero diagnostics, so the guardrail currently accepts undocumented and
          broad exceptions."
        created_at: 2026-05-08T03:56:43.988Z
      - _ulid: 01KR2X9EAGJRQYQ232YQCAB47B
        author: "@claude"
        body: "Fixed: added a companion rule no-leaky-test-daemon/localized-disable that scans Program-level
          comments and reports two patterns. (1) File- or block-wide oxlint-disable referencing
          no-leaky-test-daemon/no-leaky-test-daemon (or the bare plugin name no-leaky-test-daemon) —
          fileWideDisable. (2) Per-line oxlint-disable-line / oxlint-disable-next-line for the rule
          with no `-- <reason>` after the rule name — missingReason. Because the meta-check is a
          separate rule in the same plugin, the disable directive that silences
          no-leaky-test-daemon/no-leaky-test-daemon does NOT silence localized-disable, so both
          undocumented and broad exceptions now produce diagnostics. Registered the new rule in
          .oxlintrc.json and the lint test config so it runs everywhere the main rule does. Four new
          tests cover both reviewer repros (bare disable-next-line, file-wide disable, plugin-wide
          file disable, oxlint-disable-line without reason) plus a negative case that an unrelated
          rule's disable directive does not trigger localized-disable."
        created_at: 2026-05-08T04:24:47.696Z
