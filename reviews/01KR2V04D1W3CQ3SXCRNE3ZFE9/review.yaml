    entries:
      - _ulid: 01KR2VMEY77DCY6GFDJSP3V0W8
        author: Jacob Chapel
        body: "MUST-FIX: The detached serve check only inspects literal/template arguments, so spawn-style
          argv calls are missed. Repro: a synthetic test with spawn(\"kspec\", [\"serve\",
          \"start\", \"--detach\", \"--port\", \"3456\"]) and no cleanup produced 'Found 0 warnings
          and 0 errors.' This violates ac-detached-serve-without-cleanup-flagged because that is a
          detached daemon start through the CLI without scoped cleanup."
        created_at: 2026-05-08T03:55:51.623Z
      - _ulid: 01KR2X90MFGX6QCMB50QBDV3BK
        author: "@claude"
        body: 'Fixed: detached-serve detection now also inspects ArrayExpression argv arguments. Replaced
          the literal/template-only walker in isDetachCallExpression with
          argsResolveToDetachedServe, which collects string contributions from literals, templates,
          and array elements (spawn("kspec", ["serve", "start", "--detach", ...])), tokenises them,
          and returns true when serve+start+--detach all appear (or any single contribution contains
          the contiguous "serve start ... --detach" substring). New focused tests cover the
          synthetic spawn argv repro and a spawnSync variant; the cleanup escape hatch is preserved
          (spawn("kspec", ["serve", "start", "--detach"]) followed by onTestFinished(killPid) still
          passes).'
        created_at: 2026-05-08T04:24:33.679Z
    kind: blocker
    resolved_at: 2026-05-08T04:24:59.109Z
    resolved_by: "@claude"
  - _ulid: 01KR2VMTPBYF14JBKQGPCSW05K
    anchor:
      type: code
      commit: 80326f51ed6858dab18923307b48c372f10622be
      line_end: 423
      line_start: 418
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KR2VMTPBFSN0RRAE259Z0ECR
        author: Jacob Chapel
        body: "MUST-FIX: The localhost URL guard only checks fetch()/WebSocket() when the first argument is
          the literal/template URL, so URL construction assigned to a variable and then passed to
          fetch is not reported. Repro: const url = `http://localhost:${port}/api/health`; await
          fetch(url) produced 'Found 0 warnings and 0 errors.' The task requires flagging daemon
          HTTP/WebSocket URLs constructed from localhost plus a raw port outside the allowed
          endpoint-contract cases."
        created_at: 2026-05-08T03:56:03.659Z
      - _ulid: 01KR2X96RXPE410D0P6SD96Z0S
        author: "@claude"
        body: "Fixed: variable-bound localhost URLs are now tracked. Added a localhostUrlIdentifiers Set
          that the rule populates from VariableDeclarator/AssignmentExpression where the init
          carries a localhost:<port> URL string (literal or template). The fetch() and new
          WebSocket() checks now also fail when the first argument is an Identifier whose name is in
          that Set. Repro from the review (const url = `http://localhost:${port}/api/health`; await
          fetch(url)) is now flagged. Three new tests cover the template-bound, literal-bound, and
          WebSocket variants, plus a negative case proving non-localhost variable URLs still pass.
          Caught one true positive in cli-serve.test.ts:117 (waitForDaemonHealth) — annotated with a
          documented inline disable matching the other CLI-launched-daemon fetches in the same
          file."
        created_at: 2026-05-08T04:24:39.965Z
    kind: blocker
    resolved_at: 2026-05-08T04:25:05.007Z
    resolved_by: "@claude"
  - _ulid: 01KR2VN63Q359GE2G4GRXYZM5N
    anchor:
