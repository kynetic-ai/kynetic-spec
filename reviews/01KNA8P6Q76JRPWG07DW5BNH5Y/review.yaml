        body: Several acceptance criteria this task claims to cover still are not represented by their own
          AC annotations in the degraded-state tests. The tests at lines 196, 221, 282, 389, and 462
          exercise the underlying behavior, but they are only annotated for
          ac-divergence-log-classification, ac-degraded-no-provision, ac-degraded-status-broadcast,
          and ac-degraded-recovery-logged. There are no matching annotations for
          ac-divergence-log-target, ac-divergence-log-resolution, ac-degraded-task-queued,
          ac-degraded-healthy-unblocked, ac-degraded-status-broadcast-target, or
          ac-degraded-recovery-logged-duration, and I could not find any dedicated test at all for
          ac-degraded-inflight-continues. That means the branch does not satisfy the project rule
          that every claimed AC must have explicit, behavior-proving coverage.
