        author: "@claude"
        body: "Fixed: isDetachCallExpression() now checks the callee name against a whitelist of spawn-like
          APIs (runKspec, kspec, exec, execSync, spawn, spawnSync, execFile, execFileSync, fork)
          before inspecting string arguments. Non-spawn calls like expect().toContain() or
          console.log() are no longer flagged. Added two negative test cases covering both
          scenarios."
