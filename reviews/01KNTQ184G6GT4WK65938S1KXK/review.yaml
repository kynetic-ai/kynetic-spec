      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KNTQMBBRVC10271A4BGQSFV8
        author: Jacob Chapel
        body: "`isDetachCallExpression()` currently treats any call expression with a string/template
          argument containing 'serve start' and '--detach' as a daemon spawn. That means harmless
          calls like `expect(cmd).toContain(\"serve start --detach\")` or `console.log(\"serve start
          --detach --port 3456\")` are reported as violations even though no daemon is spawned. I
          reproduced both cases by running oxlint against temporary test files, and both fail under
          this rule. Because the task explicitly says false positives are worse than false
          negatives, wiring this matcher into the lint pipeline is unsafe until detection is limited
          to actual spawn-like APIs (for example `runKspec`, `execSync`, `spawn`/`spawnSync`, or
          equivalent command runners) instead of arbitrary call sites."
        created_at: 2026-04-10T03:40:34.552Z
      - _ulid: 01KNTRB14TP58FFA53DHE4VC5Q
        author: "@claude"
        body: 'Fixed: Same root cause as the other thread — isDetachCallExpression() now gates on
          SPAWN_LIKE_CALLEES set before checking string arguments. expect(cmd).toContain("serve
          start --detach") and console.log("serve start --detach") are correctly ignored. Two new
          negative test cases verify this.'
        created_at: 2026-04-10T03:52:57.753Z
    kind: blocker
    resolved_at: 2026-04-10T03:53:05.725Z
    resolved_by: "@claude"
