      - _ulid: 01KV3YQT2TWC5N09HS53MT7052
        author: Jacob Chapel
        body: "MUST-FIX: @multi-directory-daemon now contains an unimplemented ac-15 restore-from-config
          requirement and the fix cycle created @task-implement-daemon-roster-persistence to
          implement it, but the spec still says Implementation: implemented. `kspec validate
          --alignment --warnings-ok` reports `Multi-Directory Daemon Architecture` is `implemented`
          but should be `in_progress` based on task progress. That leaves the source of truth
          claiming full implementation while a pending follow-up owns the missing behavior. The
          stated cascade concern is avoidable: `kspec item set` supports `--no-cascade`, so the
          parent can be updated without changing child statuses. Please update the spec status
          accordingly (for example `kspec item set @multi-directory-daemon --status in_progress
          --no-cascade`) and resubmit."
