    entries:
      - _ulid: 01KR5FZE4NX9V59WF2TZWBX73S
        author: Jacob Chapel
        body: 'MUST-FIX: the runtime option value-consuming set omits documented Node flags such as --import
          and --env-file, so direct daemon launches with those pre-script options are silently
          accepted. I verified with oxlint probes that both exec("node --import ./setup.mjs
          dist/daemon/index.js --port 0") / spawn("node", ["--import", "./setup.mjs", DAEMON_ENTRY,
          ...]) and exec("node --env-file .env dist/daemon/index.js --port 0") / spawn("node",
          ["--env-file", ".env", DAEMON_ENTRY, ...]) exit 0 with 0 diagnostics. These commands run
          Node with a preload/env option and then execute the daemon entrypoint, so they violate
          @daemon-test-guardrail-precision ac-direct-daemon-entry-invocations-flagged. Add these
          value-consuming options and behavioral positive regressions for shell-string and
          argv-array forms.'
        created_at: 2026-05-09T04:29:51.637Z
      - _ulid: 01KR5HQ3DXK9NP5CBXMP8D0KV6
        author: "@claude"
        body: "Fixed: extended the value-consuming Node flag set to cover the entire documented `--flag=...`
          audit (not just the cycle-11 `--import` and `--env-file` blockers). Added `--import`,
          `--env-file`, `--env-file-if-exists`, `--experimental-config-file`, `--allow-fs-read`,
          `--allow-fs-write`, `--build-snapshot-config`, `--experimental-sea-config`,
          `--heapsnapshot-near-heap-limit`, `--heapsnapshot-signal`, `--debug-port`,
          `--inspect-port`, `--dns-result-order`, `--network-family-autoselection-attempt-timeout`,
          `--icu-data-dir`, `--localstorage-file`, `--secure-heap`, `--secure-heap-min`,
          `--max-old-space-size-percentage`, `--disable-warning`, `--disable-proto`, `--watch-path`,
          `--watch-kill-signal`, all `--test-*` value-consuming runner options,
          `--trace-event-categories`, `--trace-event-file-pattern`, `--trace-require-module`,
          `--use-largepages`, and `--v8-pool-size`. Each flag was verified with a `node --flag value
          /tmp/script.cjs` probe before inclusion, and the doc comment now records the audit
          philosophy. Added behavioral oxlint regressions for both shell-string (`exec`/`execSync`)
          and argv-array (`spawn`/`execFile`/`execFileSync`) forms covering `--import`,
          `--env-file`, `--env-file-if-exists`, plus a `process.execPath` runtime variant — all in
          tests/lint-daemon-test-guardrails.test.ts and annotated against
          ac-direct-daemon-entry-invocations-flagged."
        created_at: 2026-05-09T05:00:15.677Z
    kind: blocker
    resolved_at: 2026-05-09T05:00:23.986Z
