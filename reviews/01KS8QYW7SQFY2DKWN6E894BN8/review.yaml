threads:
  - _ulid: 01KS8QZQ9RRNK9X6FHJYYS70P4
    anchor:
      type: structured
      ref: "@task-plan-resource-import-and-derive"
      section: tasks
    entries:
      - _ulid: 01KS8QZQ9RG8TJ6FH8XFR6FZ90
        author: Jacob Chapel
        body: "The cycle-4 plan CLI blocker is only partially fixed. The task now defines JSON error codes
          for missing plans, confirmation_required, and operation_cancelled, but it still does not
          define exit behavior for those failures or for invalid id/path, resource_not_found,
          resource_conflict, and entity_storage_incompatible. The prior blocker explicitly required
          the complete CLI --json error envelope and exit behavior. Impact: automation agents can
          implement the same JSON codes with incompatible process semantics. Exact fix: add explicit
          exit-code behavior for every plan resource CLI failure case, including non-interactive
          remove without --force and interactive prompt decline."
        created_at: 2026-05-22T21:03:14.744Z
    kind: blocker
  - _ulid: 01KS8R03ECEWQGFSW4P03RTQEY
    anchor:
      type: structured
      ref: "@task-review-screenshot-resource-ui"
      section: tasks
    entries:
      - _ulid: 01KS8R03EDD7G2JKQZ2RT0ETA7
        author: Jacob Chapel
        body: "The cycle-4 review CLI blocker is only partially fixed. The task now defines JSON error codes
          for missing reviews, confirmation_required, and operation_cancelled, but it still does not
          define exit behavior for those failures or for invalid id/path, resource_not_found,
          resource_conflict, and entity_storage_incompatible. The prior blocker explicitly required
          the complete CLI --json error envelope and exit behavior. Impact: review resource commands
          can diverge from plan resource commands and from automation expectations while satisfying
          the written JSON shape. Exact fix: add explicit exit-code behavior for every review
          resource CLI failure case, including non-interactive remove without --force and
          interactive prompt decline."
        created_at: 2026-05-22T21:03:27.181Z
    kind: blocker
  - _ulid: 01KS8R0GAM3R6YSYBNZ172FP3N
    anchor:
      type: structured
      ref: "@task-plan-resource-api-ui-static"
      section: tasks
    entries:
      - _ulid: 01KS8R0GANE9PEMMV99E8088EX
        author: Jacob Chapel
        body: "The plan resource multipart upload shape still leaves `replace` undefined at the wire level.
          The task says POST accepts multipart/form-data with text fields plus optional boolean
          `replace`, but multipart fields are transmitted as strings and the plan does not say
          whether replacement is requested by field presence, `true`, `1`, or another value, nor
          what error/status/code applies to an invalid value. Impact: API, web UI, and tests can
          implement incompatible replacement behavior while following the same route contract. Exact
          fix: define the accepted multipart `replace` representation and the invalid-value response
          shape/status, or make replacement a separate route/flag with an exact contract."
        created_at: 2026-05-22T21:03:40.373Z
    kind: blocker
  - _ulid: 01KS8R0W7WAFRBXDE9BBXYAK9V
    anchor:
      type: structured
      ref: "@task-review-screenshot-resource-ui"
      section: tasks
    entries:
      - _ulid: 01KS8R0W7WESB9JGZZKRSRQ2EM
        author: Jacob Chapel
        body: "The review resource multipart upload shape repeats the undefined `replace` contract. POST
          accepts multipart/form-data with optional boolean `replace`, but the plan does not define
          the accepted text value(s), whether field presence alone is true, or the invalid-value
          response status/code. Impact: review resource API and UI agents can diverge from plan
          resource behavior and from documentation. Exact fix: define the exact multipart `replace`
          wire representation and invalid-value response, matching the plan resource API contract
          where intended."
        created_at: 2026-05-22T21:03:52.573Z
    kind: blocker
  - _ulid: 01KS8R1B6SJDKQKCTPHMKDMMGN
    anchor:
      type: structured
      ref: "@task-plan-resource-import-and-derive"
      section: tasks
    entries:
      - _ulid: 01KS8R1B6S3X5M25EPFNT2ZR6J
        author: Jacob Chapel
        body: "The plan resource add command still has an undefined JSON failure for the required
          `<source-file>` input. The task defines errors for resource id/path, collisions, missing
          plan/resource, confirmation, cancellation, and incompatible storage, but not for a source
          file that is missing, unreadable, a directory, or otherwise cannot be copied. Impact:
          agents can implement incompatible `kspec plan resource add ... --json` failures for a
          required input path. Exact fix: define the JSON code, envelope fields, message guidance,
          and exit behavior for source-file read/copy failures, or explicitly map these cases to an
          existing code without conflating the source path with the destination resource path."
        created_at: 2026-05-22T21:04:07.897Z
    kind: blocker
  - _ulid: 01KS8R1PKKJHHJ59HVFR44D41S
    anchor:
      type: structured
      ref: "@task-review-screenshot-resource-ui"
      section: tasks
    entries:
      - _ulid: 01KS8R1PKKBAEZMV704SMTFV5W
        author: Jacob Chapel
        body: "The review resource add command has the same undefined JSON failure for the required
          `<source-file>` input. The task defines errors for resource id/path, collisions, missing
          review/resource, confirmation, cancellation, and incompatible storage, but not for a
          source file that is missing, unreadable, a directory, or otherwise cannot be copied.
          Impact: review resource CLI behavior can diverge from plan resource CLI behavior for a
          required argument. Exact fix: define the JSON code, envelope fields, message guidance, and
          exit behavior for source-file read/copy failures, matching the plan command where
          intended."
        created_at: 2026-05-22T21:04:19.571Z
    kind: blocker
