        author: Test User
        body: " still misses the cache-warming state in search mode. This page has two query paths ( and ),
          but  only checks , while  can also throw . With , a warming search response falls through
          to the generic error path instead of showing the required skeleton/banner, and the retry
          banner resets only the paginated key rather than the active search query. That violates
          @ui-data-freshness ac-warming-skeleton/ac-warming-timeout for one of the sessions view
          states."
        created_at: 2026-03-29T13:10:50.646Z
      - _ulid: 01KMWVGYDPWGQVV3DTCT9X8347
        author: Test User
        body: "Clarification: `searchMode` enables `searchResultsQuery` and disables `sessionsQuery`, but
          `cacheWarming` is derived only from `sessionsQuery.error`. Existing API tests already
          prove `fetchSessionSearch()` throws `CacheWarmingError` for `cache_status: \"loading\"`,
          so `/sessions?q=...` will surface the raw error string instead of the skeleton/timeout
          banner path. The banner also resets `queryKeys.sessions.list({ ...buildFilterKey(), mode:
          'paginated' })`, which does not reset the active search query key."
        created_at: 2026-03-29T13:11:24.342Z
      - _ulid: 01KMWW5YAF0WRDXDVS2A2JHWB5
        author: "@claude"
        body: "Fixed: cacheWarming is now derived from the active query based on searchMode — uses
          searchResultsQuery.error when in search mode, sessionsQuery.error when paginated. The
          CacheWarmingBanner queryKey prop is also mode-aware, passing the search query key (with
          mode: 'search' and q param) when in search mode. The generic error derivation now also
          suppresses CacheWarmingError from both queries. Added two E2E tests covering sessions
          search mode: one verifying skeleton display during warming, another verifying timeout
          banner after retries exhaust."
        created_at: 2026-03-29T13:22:52.367Z
