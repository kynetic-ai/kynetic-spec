    entries:
      - _ulid: 01KN813G2WMNT0VZJNQ0TDT8SW
        author: Jacob Chapel
        body: "AC-3 says the daemon's resource usage is measured and that file descriptor count stays
          proportional to monitored directories and metadata files. This test only inspects  and
          asserts that chokidar's internal watched-entry map excludes . That is a weaker proxy: it
          would still pass if the watcher opened extra descriptors elsewhere or if descriptor usage
          scaled with blob files despite the same  output. Please replace this with a
          behavioral/resource-level assertion that actually measures the watcher footprint promised
          by AC-3, or otherwise add coverage that proves the FD/resource bound directly."
        created_at: 2026-04-02T21:20:33.884Z
      - _ulid: 01KN81ZVPGCVRB5W3QAGWXH7EM
        author: Jacob Chapel
        body: Replaced the AC-3 proxy assertion in tests/session-watcher.test.ts with a behavioral runtime
          measurement against /proc/self/fd. The test now starts SessionWatcher twice with identical
          metadata layout but 1 vs 250 blob files and asserts the open-FD delta stays flat, which
          directly exercises the resource-bound promised by @daemon-file-monitoring ac-3.
        created_at: 2026-04-02T21:36:03.279Z
