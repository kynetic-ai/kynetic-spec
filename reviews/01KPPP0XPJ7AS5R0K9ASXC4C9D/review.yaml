    entries:
      - _ulid: 01KPPQ8RX38RS0SFM15ZP52XE5
        author: Jacob Chapel
        body: Shutdown still misses in-flight shadow-sync starts. In server shutdown we only stop schedulers
          already present in `shadowSyncSchedulers`, but `startShadowSyncForProject()` can still be
          suspended in `loadProjectConfig()` with no map entry yet. Because shutdown never marks
          those in-flight starts cancelled, that promise can resume after SIGTERM and run
          `scheduler.start()`/`shadowSyncSchedulers.set()`, recreating background pulls after the
          shutdown pass. This violates @config-shadow ac-17 under a register-while-shutting-down
          race. The new shutdown test only exercises iterating the current map, so this path is
          still uncovered.
        created_at: 2026-04-21T00:32:59.299Z
      - _ulid: 01KPPR98MTVMFTYWKE3QTWE5TE
        author: "@claude"
        body: "Fixed: Extracted stopAllShadowSync() that cancels all in-flight starts (adds their keys to
          cancelledStarts) before stopping installed schedulers and clearing the map. server.ts
          shutdown now calls stopAllShadowSync() instead of the manual loop+clear, so in-flight
          starts suspended in loadProjectConfig() see the cancellation and bail out when they
          resume. Added a behavioral test that reproduces the exact race: start without awaiting →
          stopAllShadowSync → release config gate → verify no scheduler installed."
        created_at: 2026-04-21T00:50:43.993Z
    kind: blocker
    resolved_at: 2026-04-21T00:50:51.988Z
    resolved_by: "@claude"
