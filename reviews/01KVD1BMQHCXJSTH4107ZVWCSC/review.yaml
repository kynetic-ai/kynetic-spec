    entries:
      - _ulid: 01KVD1NDZRSQZRD1Y355F47W1R
        author: Jacob Chapel
        body: "MUST-FIX: Cascade spec-item deletion can remove nested descendants without emitting events
          for them. The command path gathers only direct children before calling deleteSpecItem, and
          this splice removes the selected child subtree; recordSpecItemMutationEvent then emits
          only for that selected item. I verified with a temporary collector probe: deleting a child
          containing a grandchild removed the grandchild from disk (containsGrandchild=false) but
          produced only one items:updates/spec_item_changed event for the child. That violates
          @mutation-event-coverage ac-3/ac-5 because subscribers tracking the removed grandchild do
          not observe its removal without falling back to file-change invalidation."
        created_at: 2026-06-18T09:40:44.664Z
      - _ulid: 01KVD3C710REQGXHER8A8JY1Y0
        author: Jacob Chapel
        body: "Fixed in 0f12d20: deleteSpecItem now collects the raw YAML subtree being removed before
          splicing and emits spec_item_changed removed events for every spec item identity in that
          subtree. The command-route behavioral test now creates a nested
          requirement/constraint/decision tree, deletes the requirement with cascade, and asserts
          removed events for all three canonical item ULIDs."
        created_at: 2026-06-18T10:10:39.775Z
    kind: blocker
