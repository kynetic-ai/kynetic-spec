threads:
  - _ulid: 01KTV7AZ8ANX1J88XWQTZBRRZB
    anchor:
      type: code
      commit: 37aea1f6ef6b3dc1fa8e701106ffadf490e975dc
      line_end: 171
      line_start: 164
      path: src/parser/shadow.ts
      side: head
    entries:
      - _ulid: 01KTV7AZ8ASGB6YS7G679RXZ3B
        author: pr-reviewer
        body: 'MUST-FIX: The recovery steps interpolate absolute paths directly inside double-quoted shell
          commands. That handles spaces, but it is not shell-safe for valid project paths containing
          `$`, backticks, backslashes, or double quotes, so the concrete recovery commands can
          address a different path or fail to parse. Evidence: lines 164, 168, and 171 build
          commands from `path.resolve(...)` without escaping. I verified with a minimal shell
          reproduction that a literal path segment containing `$HOME` is expanded inside the
          generated double-quoted form (`test -d "/tmp/kspec-review-$HOME.backup"` returned status 1
          even though the literal directory existed). This violates `@broken-shadow-safety
          ac-restore-failure-reports-state` for those checkouts because the user is told to run
          recovery steps that do not restore the preserved backup. Please emit shell-safe commands
          (or non-ambiguous recovery guidance that cannot be misinterpreted by the shell) and add
          behavioral coverage with a metacharacter path.'
        created_at: 2026-06-11T11:33:33.578Z
      - _ulid: 01KTV8YT6VG1WZMVKN3AZXNC90
        author: "@claude"
        body: "Fixed in 4e35fa9ca6. Recovery commands now single-quote paths via a shellQuotePath() helper
          (POSIX close-escape-reopen idiom for embedded single quotes), so $, backticks,
          backslashes, double quotes, and spaces are all taken literally by the shell —
          double-quoted interpolation is gone from all three command-producing steps (rmdir,
          mv-aside, mv-back). Behavioral coverage added: two new tests run the full double-failure
          flow (missing state and occupied partial-dir state) inside a directory named with $HOME,
          backticks, double quotes, a single quote, a backslash, and spaces, then execute the
          prescribed commands verbatim through /bin/sh and assert the backup contents land back at
          the worktree location and the prescribed kspec shadow repair re-run succeeds. These tests
          fail against the previous double-quoted form (the $HOME segment expands and mv addresses a
          nonexistent path). Test setup git calls that take fixture paths were switched to
          execFileSync arg arrays so setup never round-trips paths through a shell either."
        created_at: 2026-06-11T12:01:52.346Z
    kind: blocker
    resolved_at: 2026-06-11T12:02:08.747Z
    resolved_by: "@claude"
