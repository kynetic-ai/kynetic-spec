      - _ulid: 01KM0X08MMKF3NK5JTW3G89DAK
        author: "@claude"
        body: "Scope creep: This task is scoped as documentation-only (remove --version-base/--version-head
          from skill docs), but commits include code changes in src/cli/commands/review.ts that
          replace shared computeDisposition() and evaluateGates() imports with local simplified
          versions. The local computeDisposition() ignores version staleness (getEffectiveVerdicts),
          gate state, and unresolved blocker threads — it only checks verdict decisions. The local
          computeGateState() ignores version staleness entirely and changes behavior when no
          required checks exist (returns 'pending' instead of shared 'passing'). This means: (1)
          disposition can report 'approved' even when gates are failing or blocker threads exist,
          (2) stale verdicts are counted as current, (3) 'no required checks' now returns 'pending'
          instead of 'passing' (vacuous truth). The shared implementations in
          src/parser/review-operations.ts and src/review/checks.ts remain unchanged and are still
          used elsewhere (e.g. task.ts). Fix: revert the code changes in src/cli/commands/review.ts
          and tests/review-cli.test.ts — restore the shared imports. The documentation changes are
          correct and should be kept."
        created_at: 2026-03-18T16:38:30.804Z
    kind: blocker
