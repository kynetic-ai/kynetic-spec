threads:
  - _ulid: 01KNTM99030NZBBRNKRGE68P5D
    anchor:
      type: code
      commit: 695a3a850da681a37673a880ca422bb8e4f3e9fa
      line_end: 126
      line_start: 111
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KNTM990334A1PPEGTKFPKPYB
        author: Jacob Chapel
        body: Any afterEach whose source text contains 'kill' or 'stop' is treated as cleanup for the whole
          enclosing describe, even when it does not stop the spawned daemon. I reproduced this with
          an unrelated afterEach(() => stopUnrelatedFixture()) plus runKspec("serve start --detach
          --port 3456") and the rule reported 0 errors. That violates the task requirement that
          afterEach only count when it actually covers the daemon cleanup in the same scope, so the
          original leak pattern can still pass lint.
        created_at: 2026-04-10T02:42:05.955Z
      - _ulid: 01KNTN1TMWHFF1ATSPJ6PNVZCC
        author: "@claude"
        body: "Fixed: afterEach detection now requires daemon-specific cleanup patterns (SIGTERM, killPid,
          stopDaemon, 'serve stop') instead of generic 'kill' or 'stop'. An afterEach like
          stopUnrelatedFixture() no longer counts as cleanup. Added a test case reproducing the
          exact scenario described (unrelated afterEach with generic stop)."
        created_at: 2026-04-10T02:55:30.460Z
    kind: blocker
    resolved_at: 2026-04-10T02:55:40.161Z
    resolved_by: "@claude"
  - _ulid: 01KNTM9E4E1RXTBNXB529CG48N
    anchor:
      type: code
      commit: 695a3a850da681a37673a880ca422bb8e4f3e9fa
      line_end: 145
      line_start: 133
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KNTM9E4EPPJZ8FCS9725C703
        author: Jacob Chapel
        body: 'The forward scan accepts cleanup registered anywhere later in the block, even after an await
          or assertion. Repro fixture: runKspec("serve start --detach --port 3456"); await
          somethingAsync(); onTestFinished(() => process.kill(pid, "SIGTERM")); produced 0 lint
          errors. The task explicitly requires cleanup to be registered before the next expect,
          await, or scope exit, so this misses unsafe tests that can fail before cleanup is
          registered.'
        created_at: 2026-04-10T02:42:11.214Z
      - _ulid: 01KNTN2EDTFASJ6FBVJ0M26F96
        author: "@claude"
        body: "Fixed: forward scan now stops at any statement containing 'await ' or 'expect(' — cleanup
          found after these points returns false. This means spawn() → await X → onTestFinished() is
          correctly flagged. Added two test cases: one with cleanup after await, one with cleanup
          after expect. Both are correctly flagged."
        created_at: 2026-04-10T02:55:50.713Z
    kind: blocker
    resolved_at: 2026-04-10T02:56:06.733Z
    resolved_by: "@claude"
