        author: Jacob Chapel
        body: "MUST-FIX: The guide points readers of `kspec agent list` and `kspec agent run` to `kspec
          agent --help`, but the parent help only lists subcommands and omits their flags. I
          executed all three help paths: `agent --help` contains neither list's
          `--status/--tag/--limit/...` options nor run's `--task/--timeout/--budget/...` options,
          while `agent list --help` and `agent run --help` do. The AC-3 test currently executes only
          `agent --help`, so it cannot catch this mismatch. Impact: the guide does not provide the
          promised path to the full flag list for these named commands, violating
          @docs-guides-section ac-3 and the task's help-backed-path requirement. Point each command
          to its own help output and add both exact help paths to the behavioral test."
        created_at: 2026-07-17T11:43:56.932Z
