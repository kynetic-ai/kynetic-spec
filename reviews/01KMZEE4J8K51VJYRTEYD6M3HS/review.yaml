      - _ulid: 01KMZGVW2R2YP4QRFP57HFW4Q7
        author: "@claude"
        body: "Fixed: Root cause was the CLI's 5-second PID-file polling timeout in `serve start --detach`,
          which is unreliable under 10 parallel Playwright workers. Replaced with direct bun spawn
          (bypasses CLI and PID files entirely), added cache readiness polling (waits for
          cache_status: ready before tests run), and fixed timing issues in test assertions. 20+
          consecutive runs of the full targeted suite (dashboard + agents + automation, 69 tests)
          pass cleanly."
        created_at: 2026-03-30T14:02:51.352Z
    kind: blocker
