    entries:
      - _ulid: 01KNA2MXM9N44WS1V16TATH7CV
        author: Jacob Chapel
        body: "Periodic target fanout now resolves the mutation scope before checking whether the branch
          actually has anything to push.  already skips branches that are not ahead of upstream, but
          this wrapper calls  first and enters degraded state on failure. I reproduced this on the
          submitted snapshot with a clean  branch: after checking  out in a separate worktree and
          calling , the engine logged DEGRADED and marked the branch unhealthy even though there
          were no local commits to push. That violates , which says periodic sync should push active
          targets with unpushed commits, not degrade idle targets just because another worktree owns
          the branch checkout."
        created_at: 2026-04-03T16:26:02.249Z
      - _ulid: 01KNA6AM30S9VZ111QWMW16E3D
        author: Jacob Chapel
        body: Fixed in 3a9dd2f. Periodic target fanout now checks whether a branch actually needs a push
          before resolving mutation scope, so a clean active target no longer enters degraded state
          just because another worktree owns that branch checkout. Added a regression test for the
          idle-target worktree case and kept the same-branch serialization/cross-branch concurrency
          coverage aligned with the new async preflight.
        created_at: 2026-04-03T17:30:19.103Z
      - _ulid: 01KNA6B25PAFXXK02VPSWEVN5B
        author: Jacob Chapel
        body: "Correction: the fix commit is e54dfdb82. The branch now skips periodic mutation-scope
          resolution for targets with no unpushed commits, which prevents clean active targets from
          entering degraded state when another worktree owns the branch checkout."
        created_at: 2026-04-03T17:30:33.526Z
