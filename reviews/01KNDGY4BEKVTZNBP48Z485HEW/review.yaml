      - _ulid: 01KNDH01KV591ND6R1VPZVHWMF
        author: "@claude"
        body: The serve.ts line reference for maybeAutoStartDaemon says line 177 for process.execPath but
          the actual code shows it at line 178. Minor discrepancy — not a blocker since the task
          description gives enough context to find it regardless. Similarly,
          task-daemon-spawn-runtime says "buildDaemonChildEnv() (line 109)" which is correct for the
          function declaration, but the BUN_ENV assignment is at line 111. These are cosmetic — the
          task descriptions are still navigable.
        created_at: 2026-04-05T00:34:30.139Z
    kind: question
  - _ulid: 01KNDH065XJE044QCSMWAD9NQM
    anchor:
      type: structured
      ref: "@task-daemon-compile-js"
      section: tasks
    entries:
      - _ulid: 01KNDH065Y23WZ8X68H0SDDY7H
        author: "@claude"
        body: Step 1 says "Add a conditional type reference or runtime type shim for Bun.file()" — but
          Bun.file() replacement is handled separately in task-elysia-node-adapter step 3. This
          could confuse an agent. Clarify that the compile task only needs to remove bun-types from
          tsconfig and that the Bun.file() call site is addressed by the adapter task.
        created_at: 2026-04-05T00:34:34.814Z
    kind: nit
  - _ulid: 01KNDH0AHAEP2PB7R75BJTD0DG
    anchor:
      type: structured
      ref: "@task-ws-connection-state-abstraction"
      section: tasks
    entries:
      - _ulid: 01KNDH0AHB05MN0GH7AMZ5N23T
        author: "@claude"
        body: "The task says ws.data is accessed in ~20 call sites across 5 files — verified this is
          accurate (grep found 20 matches across server.ts, heartbeat.ts, handler.ts, pubsub.ts,
          lifecycle.ts). The task correctly identifies all 5 files. Note: server.ts:487-497 shows an
          interesting pattern where ws.data is first read (as openContext to get the request for
          project path resolution via a separate WeakMap), then overwritten with connection state.
          The ConnectionStateManager needs to handle this two-phase pattern — the WeakMap init
          should happen after the openContext read, which the current description implies but does
          not explicitly call out."
        created_at: 2026-04-05T00:34:39.275Z
    kind: nit
  - _ulid: 01KNDH0F8NYCKHRYFSC9GDXADW
    anchor:
      type: structured
      ref: "@task-elysia-node-adapter"
      section: tasks
    entries:
      - _ulid: 01KNDH0F8NFZH2KKMBBJC5ESAE
        author: "@claude"
        body: Step 3 proposes readFileSync for the Bun.file() replacement — reads once at startup and serves
          from memory. This works for the index.html SPA fallback but note that the current
          Bun.file() call is inside the route handler (line 571), meaning it reads on every request
          (benefiting from Bun's file caching). The readFileSync-at-startup approach is actually
          better (consistent memory behavior), but the task should note that this changes the
          caching behavior — if index.html is updated while the daemon runs, the old version is
          served until restart. This is likely acceptable since the web UI build is a deploy-time
          artifact, but worth documenting.
        created_at: 2026-04-05T00:34:44.117Z
    kind: question
  - _ulid: 01KNDH0KSSCVHN79KQ5F7PQ1GS
    anchor:
      type: structured
      field: ac-connection-state
      ref: "@daemon-runtime-adapter"
      section: acceptance_criteria
    entries:
      - _ulid: 01KNDH0KSTZQ9XPFXC7Z6953TJ
        author: "@claude"
        body: ac-connection-state's then clause enumerates specific state fields (session ID, subscribed
          topics, sequence number, heartbeat timestamps, project path). This is more prescriptive
          than other ACs in the spec — it describes the data model rather than observable behavior.
          Consider whether "Per-connection state is tracked and accessible throughout the connection
          lifecycle without depending on runtime-specific WebSocket properties" would be more
          behavioral while still capturing the intent. Not a blocker — the current wording works and
          the enumeration helps implementers.
        created_at: 2026-04-05T00:34:48.762Z
    kind: nit
