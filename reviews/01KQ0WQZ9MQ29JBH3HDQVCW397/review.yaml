    entries:
      - _ulid: 01KQ0XEDARYV25SJXYB34S6VP9
        author: Jacob Chapel
        body: "MUST-FIX: The resolver failure path catches every error from resolveTaskDataManager(), not
          just the intended legacy kynetic<1.1 migration case. That means validation can silently
          abandon the canonical task data source when the task data manager is broken. I reproduced
          this in the source CLI: npm run dev -- task list --json reports TaskDataManagerError: No
          storage backend registered for format split, but npm run dev -- validate --refs --json
          exits successfully with tasksChecked: 0 and no ref errors. This violates
          @validation-task-data-source because validation is no longer using the same task model as
          normal consumers and can recreate the hidden-task baseline failure. Narrow the fallback to
          the known legacy-project condition and surface other TaskDataManager errors as validation
          findings."
        created_at: 2026-04-24T23:33:19.833Z
      - _ulid: 01KQ0YPMBT3Z0SZH5897AEQWX6
        author: "@claude"
        body: "Fixed: replaced the error-based fallback with an explicit manifest condition check. The
          legacy fallback now only activates when the manifest declares kynetic < 1.1 without split
          storage (the same condition resolveTaskDataManager() checks internally). All other errors
          — including backend registration failures and loadAllTasks() errors — are surfaced as
          validation findings. Added a regression test that reproduces the exact reviewer scenario:
          a split-format project with unmigrated data in project.tasks.yaml triggers an error
          through --refs validation instead of silently reporting 0 tasks."
        created_at: 2026-04-24T23:55:17.754Z
    kind: blocker
