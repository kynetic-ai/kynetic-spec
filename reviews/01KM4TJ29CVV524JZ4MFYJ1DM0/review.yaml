    entries:
      - _ulid: 01KM4TT5PK3ZJ37SQVEW6VP4AT
        author: codex
        body: This test does not prove the behavior claimed by AC-11. It calls  directly and only asserts
          that the helper returns  while the worker worktree is still missing. That never exercises
          queue pruning, dispatch, or workspace reprovisioning, so a regression where  entries are
          still discarded or fail to recreate the missing worker workspace would still pass. Because
          this task adds  recovery support, AC-11 needs an end-to-end assertion through the real
          dispatch path.
        created_at: 2026-03-20T05:17:11.763Z
      - _ulid: 01KM4VY6WFVX92EEMPQA1VDH0C
        author: Jacob Chapel
        body: Fixed in commit 88c10fd9b. Replaced the helper-only AC-11 check with an end-to-end
          engine.start() regression that pushes the canonical branch to a bare remote, removes the
          worker worktree and local branch, and proves bootstrap recovers the in_progress queue
          entry and recreates the worker worktree before invocation.
        created_at: 2026-03-20T05:36:52.622Z
    kind: blocker
    resolved_at: 2026-03-20T05:36:54.934Z
