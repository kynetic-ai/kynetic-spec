    entries:
      - _ulid: 01KVXP4M3JWRGPQVTZ5FJBH5T5
        author: pr-reviewer
        body: "MUST-FIX: coverage source watcher subscriptions are fixed to the scan paths loaded at
          startWatcher(). The read-model cache key changes after coverage.scan_paths changes, so the
          first request after a config edit recomputes, but CoverageScanWatcher is never rebuilt to
          watch the new path. kspec.config.yaml is not watched by this manager and the only observed
          restart paths are duplicate start/health recovery. After that first recompute, edits under
          the newly configured scan path are not forwarded to
          ProjectEntityCache.handleFileChange(projectPath, ...), so
          invalidateCoverageStateReadModelCache() is not called and subsequent coverage-state reads
          can return stale annotation state. Evidence: line 201 loads scan paths once before
          constructing CoverageScanWatcher; lines 307-339 construct it from that snapshot;
          repository search found no config-change restart/reload path. Please reconfigure or
          restart the coverage source watcher when coverage.scan_paths changes, and add a behavioral
          regression that changes scan_paths at runtime then verifies a source edit in the new path
          invalidates the read model."
        created_at: 2026-06-24T20:46:24.882Z
      - _ulid: 01KVXQHC691EBZYA7NCTCWMTTR
        author: Jacob Chapel
        body: "Fixed in e6540f87ae: CoverageScanWatcher now watches kspec.config.yaml, reloads
          coverage.scan_paths when that config changes, invalidates the coverage-state read model
          for the config edit, and updates source watcher subscriptions so edits under newly
          configured scan paths are forwarded to ProjectEntityCache.handleFileChange(). Added a
          behavioral regression that changes scan_paths at runtime and verifies a source edit in the
          new path reaches cache invalidation."
        created_at: 2026-06-24T21:10:51.337Z
    kind: blocker
    resolved_at: 2026-06-24T21:11:11.056Z
    resolved_by: Jacob Chapel
