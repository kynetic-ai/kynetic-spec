        body: "The walkthrough opens the shell block with four backticks at line 300, but this line also
          uses four backticks to close the embedded YAML fence. Markdown treats that as the end of
          the outer shell block, so the remaining here-doc delimiter and the start of step 2 render
          outside the intended command block. Impact: the AC requires exact temp-project steps, but
          the published guide is malformed before the first setup command finishes. Evidence: nl -ba
          docs/guides/working-with-local-resources.md shows line 324 starts an inner triple-backtick
          YAML fence and line 333 closes with four backticks; the inner fence should not close the
          four-backtick outer fence."
