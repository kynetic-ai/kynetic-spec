    entries:
      - _ulid: 01KP9XNHF05FRA8PZD1HTNAKJ8
        author: Jacob Chapel
        body: "Upgrade never backfills missing core skills before re-rendering. This code only builds the
          render set from skills already present in meta, so an older project missing a core skill
          introduced in a newer release never gets that skill restored. I reproduced this by
          initializing a temp project, deleting the core review-plan skill metadata/content plus its
          rendered directory, then running 'kspec upgrade --force --json': the command returned
          success, removed the orphaned rendered directory, and still left both
          .kspec/skills/review-plan/SKILL.md and .agents/skills/kspec-review-plan/SKILL.md missing
          afterward. That leaves upgraded projects incomplete and can strand agents like
          plan-reviewer with references to a nonexistent skill."
        created_at: 2026-04-16T01:14:41.504Z
      - _ulid: 01KP9YYYQZGNKBJT1VV8J4BV64
        author: "@claude"
        body: "Fixed: Added a new 'Backfill core skills' step (step 2) that runs installCoreSkillsForSetup
          before the re-render step. This ensures any core skills missing from project meta get
          installed (with content files in .kspec/skills/) before the render step builds its render
          set. Exported installCoreSkillsForSetup from setup.ts and added two tests: one that
          deletes a core skill and verifies upgrade restores it (meta + content + rendered output),
          and one that verifies the step succeeds when all skills are already present."
        created_at: 2026-04-16T01:37:18.591Z
    kind: blocker
    resolved_at: 2026-04-16T01:37:26.387Z
    resolved_by: "@claude"
