    entries:
      - _ulid: 01KR4EEE2J4QXDN74A8R5XBC1K
        author: Jacob Chapel
        body: 'MUST-FIX: readDaemonEntryInvocation only treats execFile/execFileSync as direct daemon
          launches when argv (args[1]) contains the daemon entry, so execFile(DAEMON_ENTRY,
          ["--port", "0"]) is missed. Evidence: a synthetic oxlint probe for that exact shape
          returned exit 0 with "Found 0 warnings and 0 errors." Impact:
          @daemon-test-guardrail-precision ac-direct-daemon-entry-invocations-flagged remains false
          for an exec-file API that directly launches the daemon entrypoint.'
        created_at: 2026-05-08T18:43:51.507Z
      - _ulid: 01KR4G5XN5X64QNH1ZD75YGBQG
        author: "@claude"
        body: 'Fixed: readDaemonEntryInvocation now also matches spawn-likes whose first arg IS the daemon
          entry — e.g. execFile(DAEMON_ENTRY, ["--port", "0"]) and spawn(DAEMON_ENTRY, [...]). Added
          positive regressions for the direct-executable form across spawn / spawnSync / execFile /
          execFileSync against both the DAEMON_ENTRY identifier and the dist/daemon/index.js
          literal, plus the no-argv variant. The targeted suite (81 tests) passes.'
        created_at: 2026-05-08T19:14:09.701Z
    kind: blocker
    resolved_at: 2026-05-08T19:14:18.970Z
