        body: "Malformed non-empty _ulid values are still migrated verbatim instead of being regenerated.
          This branch only replaces _ulid when it is missing or empty, so a task like '_ulid:
          not-a-valid-ulid' is written to .kspec/tasks/not-a-valid-ulid/ and kept in
          project.tasks.yaml. That reintroduces the blocker from the previous cycle and violates the
          split-storage contract that task directories are ULID-named. I reproduced it against this
          snapshot with the current CLI in a temp project: the command exited 0, printed a
          validation warning, and created .kspec/tasks/not-a-valid-ulid/{task,notes}.yaml."
