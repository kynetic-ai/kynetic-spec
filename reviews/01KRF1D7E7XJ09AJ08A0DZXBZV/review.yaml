threads:
  - _ulid: 01KRF1GC66GYJGQFB348VZ3YBD
    anchor:
      type: structured
      field: ac-protection-state-unavailable-fails-closed
      ref: "@task-add-cleanup-preservation-fail-closed-acs"
      section: acceptance_criteria
    entries:
      - _ulid: 01KRF1GC66PHZXX6QDMJ15ZFVZ
        author: Jacob Chapel
        body: "MUST-FIX: The proposed fail-closed AC conflicts with existing
          @dispatch-workspace-cleanup-policy ac-6. ac-6 currently permits a metadata-backed
          workspace with no matching registry record to be deterministically blocked or cleaned when
          metadata cannot be trusted, while the new AC requires skipping destructive removal when
          registry, metadata, or protection state cannot be trusted. Impact: implementers cannot
          tell whether corrupt/untrusted metadata should be cleaned or preserved, and tests could
          encode either behavior. Fix: make Phase 1 update the existing cleanup-policy AC or narrow
          the new AC so untrusted metadata has one authoritative outcome, then align
          @task-apply-protection-policy-across-artifact-reconciliation and fail-closed tests to that
          outcome."
        created_at: 2026-05-12T21:29:22.374Z
    kind: blocker
  - _ulid: 01KRF1GFWWXY0F9AQ14TR2EFWM
    anchor:
      type: structured
      field: description
      ref: "@task-centralize-dispatch-artifact-protection-decisions"
      section: tasks
    entries:
      - _ulid: 01KRF1GFWW5SK21Q2EEXXQJTCZ
        author: Jacob Chapel
        body: "MUST-FIX: The centralized policy task says non-closed registry states, including `closing`,
          are protection sources until existing cleanup rules classify them terminal, but the plan
          never defines the classifier precedence that lets a terminal cleanup-eligible `closing`
          workspace proceed to physical cleanup. Existing @dispatch-workspace-cleanup-policy
          ac-2/ac-3 and @dispatch-workspace-registry cleanup-completion ACs require
          completed/cancelled or merged/abandoned workspaces to enter cleanup and then reach
          `closed`; treating `closing` as protected can make cleanup fail closed forever before the
          record can become closed. Fix: define the cleanup classification rule explicitly, e.g.
          active/in-flight/provisioning and unclassified non-closed records are preserved, but
          `closing` records with terminal task/integration state and no
          active/in-flight/provisioning protection may proceed through reaping. Add negative-control
          coverage for that `closing` cleanup-eligible path, not only already-closed or orphaned
          artifacts."
        created_at: 2026-05-12T21:29:26.173Z
    kind: blocker
  - _ulid: 01KRF1GN4QZMXZW261K9XWYW7P
    anchor:
      type: structured
      field: description
      ref: "@task-add-cleanup-protection-maintenance-guardrails"
      section: tasks
    entries:
      - _ulid: 01KRF1GN4QCV6NQF0VYRTPXPVG
        author: Jacob Chapel
        body: "SHOULD-FIX: This guardrail task still overlaps heavily with
          @task-test-cleanup-protection-positive-and-regression-cases: both require per-surface
          protected and cleanup-eligible tests for the same destructive surfaces. Impact: two agents
          can add duplicate matrices or split AC coverage ambiguously. Fix: either merge the
          guardrail expectations into the main test task, or state the distinct responsibility of
          this task, such as a compact helper-contract matrix that supplements the public
          reconciliation tests without duplicating them."
        created_at: 2026-05-12T21:29:31.543Z
    kind: question
