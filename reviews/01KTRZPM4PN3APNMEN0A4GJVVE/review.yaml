      - _ulid: 01KTRZQHH9VTR2XTY0B2H2M6ZW
        author: "@claude"
        body: 'The task identifies triage endpoint drift only for @triage-daemon-api ac-4/ac-5, but the
          stored spec also has stale PUT wording in ac-8 and ac-9. Evidence: kspec item get
          @triage-daemon-api shows ac-8 and ac-9 as "a PUT request with act flag", while
          packages/daemon/src/routes/triage.ts implements POST /api/triage/:ref/act for both the 409
          already-acted and 422 pending cases. If the task updates only ac-4/ac-5, the plan leaves
          part of the same endpoint contract contradicted by the implementation and by the tests it
          asks workers to port. Update the task to correct ac-8/ac-9 as well, or explicitly explain
          why those ACs are out of scope.'
        created_at: 2026-06-10T14:42:08.042Z
    kind: blocker
  - _ulid: 01KTRZQYD4P8KR8XQVPE06BV1W
    anchor:
      type: structured
      field: description
      ref: "@task-reenable-split-storage-ref-validation-test"
      section: tasks
    entries:
      - _ulid: 01KTRZQYD4TG3QF90Y7M4G19EW
        author: "@claude"
        body: The task claims coverage for @validation-task-data-source ac-all-persisted-tasks-included in
          its Covers line, but its explicit annotation instructions list only @plan-validation ac-10
          and @validation-task-data-source ac-task-references-checked. In this repo, AC coverage
          requires standalone AC annotations, and kspec validate --completeness already reports
          missing AC coverage as the relevant integrity signal. A worker following the task
          literally can re-enable the dangling-ref tests while leaving
          ac-all-persisted-tasks-included unannotated, despite the plan claiming that AC is covered.
          Add ac-all-persisted-tasks-included to the required annotation/test mapping, or remove it
          from Covers if the task does not actually prove it.
        created_at: 2026-06-10T14:42:21.220Z
    kind: blocker
  - _ulid: 01KTRZR90CPH566YVE0873VH60
    anchor:
      type: structured
      field: description
      ref: "@task-daemon-triage-api-tests"
      section: tasks
    entries:
      - _ulid: 01KTRZR90CT3HD5E5XNT4Z9QBB
        author: "@claude"
        body: The endpoint checklist says the export format parameter is "markdown vs JSON", but the current
          route accepts format=json and format=context, with context returning markdown content. The
          old skipped suite also tests /api/triage/export?format=context. To keep the task
          executable without guesswork, should this bullet say "context vs JSON" or "format=context
          markdown vs format=json" instead of "markdown vs JSON"?
        created_at: 2026-06-10T14:42:32.077Z
    kind: question
