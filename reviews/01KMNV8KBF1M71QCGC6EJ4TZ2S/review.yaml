      - _ulid: 01KMNVCPTM73VNE1ENNH1T7D2T
        author: Jacob Chapel
        body: "`--verbose` is bypassed on cache hits. `computeCacheKey()` strips `--verbose` out of
          `vitestArgs`, and the cache lookup runs before any verbose-specific execution path, so a
          prior non-verbose run causes `node scripts/test.cjs --verbose tests/test-runner.test.ts`
          to return condensed cached output instead of streaming Vitest logs. I reproduced this by
          running `node scripts/test.cjs --fresh tests/test-runner.test.ts` and then `node
          scripts/test.cjs --verbose tests/test-runner.test.ts`; the second command printed `Using
          cached results` and only the condensed summary."
        created_at: 2026-03-26T19:54:24.468Z
    kind: blocker
  - _ulid: 01KMNVCPVS6M73DR5TKST92PFE
    anchor:
      type: code
      commit: d0760f32e8e67d210e40271eb30edaab4047c05f
      line_end: 499
      line_start: 475
      path: scripts/test.cjs
      side: head
    entries:
      - _ulid: 01KMNVCPVS6JDV42CZTFVRYSRR
        author: Jacob Chapel
        body: "Live `--verbose` runs never persist the promised full log file. In `runVitest()` the verbose
          branch uses `stdio: \"inherit\"`, so nothing is written to `logOutPath`; my `node
          scripts/test.cjs --fresh --verbose tests/test-runner.test.ts` reproduction ended with only
          `JSON report written to ...result.json` and no `Full log:` line, and the session cache
          contained a `.json` entry without a matching `.log`. That breaks the task's documented
          full-log behavior and leaves later cached results without a log artifact."
        created_at: 2026-03-26T19:54:24.505Z
    kind: blocker
