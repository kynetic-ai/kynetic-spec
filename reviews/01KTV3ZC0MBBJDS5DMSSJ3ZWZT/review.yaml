    entries:
      - _ulid: 01KTV4SM0YQVGFNVWKYZP2CMXW
        author: pr-reviewer
        body: "MUST-FIX: The recovery step is not correct for every state the error message can report.
          `describeWorktreeDirState()` can report that the shadow directory location is still an
          empty directory, a non-directory file, or a partial/incomplete directory, but the guidance
          always prints `mv \"<backup>\" \"<worktreeDir>\"`. When the destination already exists as
          a directory, that command moves the backup inside the directory instead of restoring it as
          the shadow directory; I verified this with a temp-dir `mv` check, which produced
          `worktree/backup`. For an existing file it can fail outright. That means the
          double-failure path can still give non-recovering guidance, which violates
          `@broken-shadow-safety ac-restore-failure-reports-state`'s requirement for concrete
          recovery steps tied to the resulting shadow-directory state. Please either make the
          recovery command state-aware (for example remove/rename the existing destination before
          moving the backup into place when safe to say so) or narrow the reported states so the
          command is only shown when it actually restores the backup."
        created_at: 2026-06-11T10:49:07.870Z
    kind: blocker
