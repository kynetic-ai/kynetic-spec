    entries:
      - _ulid: 01KNFTG7WX22F9198WVNNZRN5Y
        author: Jacob Chapel
        body: The new AC claims that shared initialization is reused across all domain reloads in a debounce
          window, but the current implementation still performs initialization per domain. A
          manifest change already invalidates both "meta" and "items" in the same window (), and
          each debounced reload independently calls  (), which in turn calls  inside  (). That means
          the path this AC describes still does the shared setup once per domain, not once per
          invalidation window. There is also no  annotation in the test suite. Please defer this AC
          until the reuse behavior exists and is covered, or implement the reuse + coverage in the
          same change.
        created_at: 2026-04-05T21:59:06.910Z
      - _ulid: 01KNFV2XTF5XED9AJHBZZH0MSA
        author: Jacob Chapel
        body: "Fixed in commit c6054304d: watcher-driven invalidations now share a debounce-cycle-scoped
          initContext() promise, so a manifest-triggered meta+items reload reuses one initialization
          pass instead of one per domain. Added behavioral coverage in
          tests/daemon-entity-cache.test.ts for @daemon-entity-cache ac-context-reuse and reverified
          with focused and full npm test runs."
        created_at: 2026-04-05T22:09:19.183Z
