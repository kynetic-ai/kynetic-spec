        body: 'Fixed: statusSetRejection() now checks VALID_TRANSITIONS_FROM before suggesting a command.
          Invalid transitions (e.g., pending→completed) get "Cannot transition from X to Y — that
          transition is not valid" instead of a misleading command suggestion. suggestedCommand in
          JSON details is null for invalid transitions. When currentStatus is unknown (batch mode),
          the command is still shown as best-effort guidance. Added 2 new tests covering valid
          transition paths (text and JSON mode).'
