    entries:
      - _ulid: 01KRFKS84YR6MHH0VWC2J3WEN6
        author: Jacob Chapel
        body: "MUST-FIX: TSEnumDeclaration is treated as opaque even when the enum is ambient/type-only. The
          comment directly below says declare ambient declarations are erased and should not shadow
          runtime bindings, but this branch returns true for every TSEnumDeclaration without
          checking stmt.declare. I verified with an oxlint probe using an approved import plus
          'declare enum killPid { noop }'; the rule reported the detached start as missing cleanup
          even though runtime cleanup still calls the approved imported killPid. This is a false
          positive against the precision contract and should be fixed, with a regression test
          proving declare enum does not shadow the approved helper while non-declare enum still
          does."
        created_at: 2026-05-13T02:48:47.518Z
      - _ulid: 01KRFN52FVYWR79ZE9RRNM4TZ8
        author: "@claude"
        body: "Fixed in 493ede939: extended statementBindsNameOpaquely to honour the documented
          declare-ambient carve-out for TSEnumDeclaration (and aligned ClassDeclaration,
          VariableDeclaration, TSImportEqualsDeclaration with the same intent). The
          TSEnumDeclaration branch now consults stmt.declare so a 'declare enum killPid { noop }' is
          no longer misclassified as opaque; the use site keeps approved-import trust. Behavioral
          regression in tests/lint-no-leaky-test-daemon.test.ts covers declare-enum / declare-class
          / declare-const carve-outs and includes a non-declare enum control that proves the
          cycle-15 enum-shadow rejection is still in place."
        created_at: 2026-05-13T03:12:43.515Z
    kind: blocker
    resolved_at: 2026-05-13T03:12:56.827Z
    resolved_by: "@claude"
