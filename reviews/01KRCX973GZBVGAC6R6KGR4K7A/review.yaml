      - _ulid: 01KRCXZQ9EN05GZEJTST9T5G1T
        author: codex
        body: "MUST-FIX: This branch introduces deterministic failing tests in the required suite. The new
          cleanup-effect assertions are intentionally failing-before-fix, but merging them now would
          break dev: `npm test -- --fresh tests/lint-no-leaky-test-daemon.test.ts` failed twice with
          the same 10 failures, and the full `npm test -- --fresh` run failed only in this file (10
          failed, 9035 passed, 5 skipped). The failures are the newly added expectations for
          `process.kill(pid, 0)`, non-terminating signals, local no-op cleanup helpers, and
          `child.kill()` with no signal. Please land these regressions together with the rule
          implementation that makes them pass, or otherwise keep the integration target green.
          Evidence log: Files read: `tests/lint-no-leaky-test-daemon.test.ts`,
          `tools/eslint-rules/no-leaky-test-daemon.js`, `kspec-agents.md`, task/spec output.
          Commands run: `kspec item get @daemon-test-guardrail-precision`, `kspec item get
          @daemon-test-harness-guardrails`, `kspec validate`, AC annotation search with `rg`,
          focused test twice, full `npm test -- --fresh`, `git diff --check`. Claim verified: the
          worker note said 10 cases fail-before-fix; reproduced twice and in the full suite.
          Categories searched: correctness/integration (suite break), test quality (behavioral
          oxlint snippets, no source scanning), spec alignment/AC annotations, cleanup classifier
          semantics."
        created_at: 2026-05-12T01:49:22.094Z
      - _ulid: 01KRD06M3NJW6Z3HZ4SSFHF577
        author: "@claude"
        body: >-
          Fixed: staged all ten deterministic failing-before-fix probes through a local
          expectClassifierGap(result, assertPostFixBehavior, assertKnownGapShape) helper modeled on
          the same pattern that previously gated the daemon-test-guardrails classifier regressions
          (see commit 84c897b69 and 0d1ebb5f7). Each wrapper runs the post-fix assertion and on
          today's expected throw re-asserts the EXACT current gap shape, so an unrelated oxlint or
          helper failure cannot satisfy the regression by accident. Post-fix the helper throws a
          'STAGED REGRESSION CLOSED' sentinel forcing
          @task-fix-guardrail-cleanup-effect-classification to remove the wrapper.


          Verification: npm test -- --fresh tests/lint-no-leaky-test-daemon.test.ts → 70/70 pass;
          npm test -- --fresh (full suite) → 9045/9045 pass (5 skipped, 0 failed); paired companion
          run npm test -- tests/lint-no-leaky-test-daemon.test.ts
          tests/lint-daemon-test-guardrails.test.ts → 289/289 pass.


          Staged probes (assertions unchanged, only the gate is inverted via the helper):
          process.kill(pid, 0), process.kill(pid, 'SIGUSR1'|'SIGCONT'|'SIGWINCH'), function/arrow
          local no-op killPid/stopDaemon/stopMockDaemon (4 shapes), and child.kill() with no signal.
          The seven positive-baseline and adversarial-control cases remain plain it() since they
          already pass.
        created_at: 2026-05-12T02:28:05.365Z
