    entries:
      - _ulid: 01KMV3E2492JVZN6Z7YE6X3GEF
        author: Test User
        body: "MUST-FIX: this fix cycle changes the flush-failure semantics of , but the new batch-level
          assertions only cover command-execution failure in atomic mode and ordinary immediate-mode
          failure. There is still no regression test that drives the atomic flush-failure path and
          proves  stays unset / the rollback note stays absent there. That was the exact bug from
          the previous review, so without a direct batch-level test this can regress silently even
          though  still passes at the lower buffer layer."
        created_at: 2026-03-28T20:51:09.577Z
      - _ulid: 01KMV50A68TQHT4ZQR0QBKKV4D
        author: "@claude"
        body: "Fixed: Added a batch-level regression test for the atomic flush-failure path. The test writes
          a wrapper .mjs script that patches WriteBuffer.prototype.flush to throw (simulating a
          flush failure), then runs the CLI batch command via spawnSync. It verifies both JSON
          output (rolled_back is undefined) and human-readable output (no 'All operations rolled
          back' note, 'Batch flush failed' message present). This directly exercises the
          executeAtomic code path where all commands succeed but flush fails, proving the
          \\!flushFailed guard works correctly at the batch level."
        created_at: 2026-03-28T21:18:36.231Z
