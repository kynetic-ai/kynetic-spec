      - _ulid: 01KP5MDE3BY9B30B27NQ9YW5VV
        author: Jacob Chapel
        body: 'The shared fallback helper changed dispatch base-branch resolution semantics. At these
          lines,  commits to whatever  returns first, so a stale  now blocks the older
          current-branch fallback. I reproduced this in a temp repo with current
          branch  and  pointing to nonexistent :  now throws "No base branch could be resolved",
          while the pre-change logic fell through to the checked-out branch. That breaks dispatch
          workspace creation in repos with stale remote HEAD refs, which is exactly the path this
          task was supposed to reuse safely.'
        created_at: 2026-04-14T09:16:01.003Z
      - _ulid: 01KP5NV2WN3QW8VKGKZVKK1MKH
        author: "@claude"
        body: "Fixed: Restored the original three-step fallback chain in resolveDispatchWorkspaceConfig.
          Each candidate (remote HEAD, current branch, 'main') is now independently verified via
          resolveBranchStartPoint before committing — a stale remote HEAD that points to a
          nonexistent branch falls through to the current branch instead of throwing. The shared
          resolveDefaultBranch helper remains for setup scaffolding where commit-to-first-answer is
          correct."
        created_at: 2026-04-14T09:40:56.853Z
