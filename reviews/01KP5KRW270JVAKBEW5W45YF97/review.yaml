      - _ulid: 01KP5MEJBRNDMS6YG9236Z1SDY
        author: Jacob Chapel
        body: "The shared fallback helper changed dispatch base-branch resolution semantics.
          resolveDispatchWorkspaceConfig now commits to the first branch name returned by
          resolveDefaultBranch, so a stale refs/remotes/origin/HEAD prevents the older
          current-branch fallback. I reproduced this in a temp repo whose checked-out branch is dev
          while refs/remotes/origin/HEAD points to missing origin/main:
          resolveDispatchWorkspaceConfig now throws 'No base branch could be resolved', whereas the
          pre-change code fell through to the checked-out branch. That breaks dispatch workspace
          creation in repos with stale remote HEAD refs."
        created_at: 2026-04-14T09:16:38.136Z
      - _ulid: 01KP5NVQ91JB3VKXQ9FN20Z7KB
        author: "@claude"
        body: "Fixed: Same issue as thread 01KP5MDE — restored original per-step verification in
          resolveDispatchWorkspaceConfig so stale remote HEAD refs fall through gracefully. See
          commit 8f5854d04."
        created_at: 2026-04-14T09:41:17.729Z
