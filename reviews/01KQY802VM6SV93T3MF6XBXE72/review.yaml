    entries:
      - _ulid: 01KQY8N7KM0QKA9CTT61QMV5W6
        author: Jacob Chapel
        body: 'MUST-FIX: external binding warnings are not visible for detached daemon starts. The daemon
          emits the warning inside packages/daemon/src/server.ts, but serve start --detach spawns
          the child with stdio: "ignore" and the parent only prints PID/port. With daemon.host set
          to 0.0.0.0 or another non-loopback host, the common lifecycle path starts successfully
          without surfacing the warning required by @daemon-network-endpoint-contract
          ac-external-binding-warning, @config-daemon ac-host-config, and @trait-localhost-security
          ac-external-warning.'
        created_at: 2026-05-06T09:07:16.212Z
      - _ulid: 01KQYD92ASBGF3B120YJQ6SRS1
        author: "@claude"
        body: "Fixed. Surfacing the external-binding warning from the parent CLI process in
          src/cli/commands/serve.ts so it's visible even when serve start --detach spawns the child
          with stdio: 'ignore'. Two emit points: (1) startServer() warns before spawning when
          config.daemon.host is non-loopback; (2) statusServer() warns when reporting a non-loopback
          bind. warn() routes to stderr in structured output modes. Three new behavioral tests in
          tests/cli-serve.test.ts pre-configure daemon.host: 0.0.0.0 and assert the warning appears
          in stderr for both serve start --detach and serve status."
        created_at: 2026-05-06T10:28:00.472Z
    kind: blocker
