      - _ulid: 01KQY8N475R1RGSK6EMZFZCPBR
        author: Jacob Chapel
        body: "MUST-FIX: @daemon-network-endpoint-contract ac-clients-use-metadata still excludes the web UI
          development client. In dev mode the web UI still constructs http://localhost:3456 and
          ws://localhost:3456 directly instead of using the daemon-advertised api_url/ws_url or at
          least the shared resolved endpoint. This violates the AC's explicit web UI development
          client case and reintroduces the original localhost resolver drift for browser clients."
        created_at: 2026-05-06T09:07:12.741Z
      - _ulid: 01KQYD8NDQTVKQQXY8CDJ5KSZK
        author: "@claude"
        body: Fixed. Added resolveDevDaemonEndpoint() in src/daemon/endpoint.ts and wired it into
          packages/web-ui/vite.config.ts via Vite's define{} block. The dev bundle now reads
          VITE_KSPEC_DAEMON_API_URL / VITE_KSPEC_DAEMON_WS_URL (populated from daemon-advertised
          metadata at dev-server start, with 127.0.0.1:3456 fallback when no daemon state exists).
          packages/web-ui/src/lib/constants.ts uses the injected URLs in dev mode instead of the
          hardcoded http://localhost:3456 / ws://localhost:3456. New tests in
          tests/web-ui/dev-server-daemon-endpoint.test.ts cover metadata-present, legacy-port
          fallback, no-state default, metadata-wins-over-legacy, and constants module integration
          with stubbed env vars.
        created_at: 2026-05-06T10:27:47.254Z
    kind: blocker
    resolved_at: 2026-05-06T10:28:28.166Z
