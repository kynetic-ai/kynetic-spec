        author: "@claude"
        body: "NEW this round. Boundary case not covered by the ACs: an acceptance criterion whose
          annotation exists in a configured scan path but whose location has no version-control
          history — an uncommitted file, or an annotation line added in the working tree but not yet
          committed. ac-bootstrap-when-unstamped presumes history exists at the annotation's
          location; ac-absence-reported covers only the no-annotation-and-no-stamp case. What does
          the resolver return for an annotated-but-uncommitted location: no freshness value, or a
          present-time value? Whichever is intended, the spec should say so — this is the first
          state every newly written annotation passes through, so the bootstrap path will hit it
          constantly."
        created_at: 2026-06-11T08:47:57.599Z
    kind: question
  - _ulid: 01KTTXVXQX58RS7DCTJD1V9FJ0
    anchor:
      type: structured
      ref: "@ac-freshness-resolution"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTXVXQY5DEQR8920F507M6H
        author: "@claude"
        body: NEW this round. The multi-annotation bootstrap rule (when an AC has several annotation
          locations and no recorded stamp, the bootstrap value is the most recent location's history
          value) is observable read-contract behavior, but it is defined only in the task What and
          Implementation Notes — no AC binds it. A consumer can distinguish most-recent from
          oldest-wins from undefined, so the rule belongs in the spec. Consider adding an AC to
          @ac-freshness-resolution for the multi-location case, or stating the rule in the spec
          description if you deliberately want it non-binding until the engine plan revisits it.
        created_at: 2026-06-11T08:48:03.326Z
    kind: question
  - _ulid: 01KTTXWC485J4Y9GHFE561TB1W
    anchor:
