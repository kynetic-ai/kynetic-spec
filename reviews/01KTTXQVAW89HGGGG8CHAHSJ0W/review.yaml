        author: "@claude"
        body: 'RE-RAISED from prior review 01KTTVE9X42D5EKE5J23CDHKXC (no author reply, plan content
          unchanged). The N/A respec reconciles @test-annotation-sweep and
          @ac-annotation-integrity-reporting ac-valid-annotation-covers-target, but leaves
          @ac-annotation-identifier-format ac-valid-token-covers-ac unchanged. That AC states a
          coverage annotation naming an existing AC with the required token format grants coverage
          credit; after this plan, an N/A-marked annotation still names valid AC tokens but must
          grant no credit. Verified against the live corpus this round: the AC still reads "The
          named acceptance criterion receives coverage credit from the annotation" with no
          applicability qualifier. Add an explicit reconciliation step for
          @ac-annotation-identifier-format to @task-respec-test-annotation-sweep-na (narrow its
          given to coverage-claiming annotations, mirroring the planned
          ac-valid-annotation-covers-target fix), or define N/A markers outside the
          coverage-annotation contract, so the corpus does not end up with contradictory specs.'
