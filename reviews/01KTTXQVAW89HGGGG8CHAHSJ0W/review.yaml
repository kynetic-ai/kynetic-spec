        author: "@claude"
        body: RE-RAISED from prior review 01KTTVE9X42D5EKE5J23CDHKXC (no author reply, plan content
          unchanged). This task's Covers line references "the three not-applicable ACs added by
          @task-respec-test-annotation-sweep-na" rather than concrete AC IDs, so its coverage claim
          cannot be verified at review time. Once the respec task assigns stable IDs to the three
          new @test-annotation-sweep ACs, list those exact IDs here so the implementation task's AC
          coverage is provable.
        created_at: 2026-06-11T08:46:45.756Z
    kind: blocker
  - _ulid: 01KTTXT20J0MK3RARA7RPJPQ86
    anchor:
      type: structured
      ref: "@coverage-record-compatibility"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTXT20JKRV9GXY9Z1JCE114
        author: "@claude"
        body: "RE-RAISED from prior review 01KTTVE9X42D5EKE5J23CDHKXC (no author reply, plan content
          unchanged). The plan's Implementation Notes promise that older tools ignore the sidecar
          (\"created only on first write, and ignored by older tools\"), and
          @task-coverage-record-compatibility requires a test (\"Also verify a tool version without
          store support ignores the sidecar when reading a project that has one\") — but
          @coverage-record-compatibility has no AC for that behavior. Its five ACs cover
          absent-store behavior, upgrade-without-rewrite, first-write materialization, newer-format
          refusal, and unknown-field roundtrip only. Add an AC for older-tool sidecar tolerance, or
          remove the guarantee and test from the plan so spec and task scope match. Note when
          resolving: also consider how the test would actually exercise \"a tool version without
          store support\" — the suite cannot run an older released binary, so if the AC is added,
          its observable framing needs to be testable (e.g. unknown sidecar directories in shadow
          state are ignored by readers)."
        created_at: 2026-06-11T08:47:02.162Z
    kind: blocker
  - _ulid: 01KTTXTQ4P1H7R3TG4NNCY0BTH
    anchor:
      type: structured
      field: ac-recorded-supersedes-bootstrap
      ref: "@ac-freshness-resolution"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTXTQ4P4WVX1C69V1HZ8TN1
        author: "@claude"
        body: RE-RAISED from prior review 01KTTVE9X42D5EKE5J23CDHKXC (no author reply, plan content
          unchanged). This AC says a recorded stamp suppresses bootstrap even when the annotation
          location's history is newer than the stamp. Deterministic, but it means a stale recorded
          verification can mask a newer annotation edit at the storage-read layer. Is that
          intentionally deferred to the later coverage-state engine, and should the spec or
          implementation notes state that consumers must compare stamp freshness against
          annotation/code revisions elsewhere? A one-line answer in the plan's Implementation Notes
          would settle this.
        created_at: 2026-06-11T08:47:23.798Z
    kind: question
  - _ulid: 01KTTXTZ5RH3CVMX57JHVTMQT1
    anchor:
      type: structured
      ref: "@plan-ac-coverage-verification-schema-and-storage"
      section: dependencies
    entries:
      - _ulid: 01KTTXTZ5R2EQ1H7TSXJMF73K9
        author: "@claude"
        body: "RE-RAISED from prior review 01KTTVE9X42D5EKE5J23CDHKXC (no author reply, plan content
          unchanged). Verified again this round: @plan-ui-redesign-global-decisions is still draft
          with zero derived specs, so the binding depends_on refs @annotation-freshness-provenance,
          @actor-identity-model, and @ac-coverage-applicability remain absent from the live corpus.
          The ordering constraint (P0a must be approved and derived before this plan derives) exists
          only as prose in Implementation Notes. Should this plan stay unapproved until P0a derives,
          or should the dependency be represented machine-visibly (e.g. a plan-level depends_on or a
          gating note on the plan record) so an approval cannot accidentally precede P0a
          derivation?"
        created_at: 2026-06-11T08:47:32.024Z
    kind: question
  - _ulid: 01KTTXV4QX275GFZY6F354VE3C
    anchor:
      type: structured
      ref: "@ac-freshness-resolution"
      section: description
    entries:
      - _ulid: 01KTTXV4QX261F8QMZTA0V1A2T
        author: "@claude"
        body: RE-RAISED from prior review 01KTTVE9X42D5EKE5J23CDHKXC (no author reply, plan content
          unchanged). The description says freshness resolves "across two provenance classes" but
          then names bootstrap plus three recorded classes (validation, ingestion, re_verification).
          Reword as two provenance sources — bootstrap-derived vs recorded — with recorded stamps
          carrying one of the three recorded classes, so source count is not confused with the
          stored provenance enum.
        created_at: 2026-06-11T08:47:37.725Z
    kind: nit
  - _ulid: 01KTTXVR4YDBJW23B4QGJZ19DV
    anchor:
      type: structured
      ref: "@ac-freshness-resolution"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTXVR4ZHWYMD2B3RNS8KHHF
        author: "@claude"
        body: "NEW this round. Boundary case not covered by the ACs: an acceptance criterion whose
          annotation exists in a configured scan path but whose location has no version-control
          history — an uncommitted file, or an annotation line added in the working tree but not yet
          committed. ac-bootstrap-when-unstamped presumes history exists at the annotation's
          location; ac-absence-reported covers only the no-annotation-and-no-stamp case. What does
          the resolver return for an annotated-but-uncommitted location: no freshness value, or a
          present-time value? Whichever is intended, the spec should say so — this is the first
          state every newly written annotation passes through, so the bootstrap path will hit it
          constantly."
        created_at: 2026-06-11T08:47:57.599Z
    kind: question
  - _ulid: 01KTTXVXQX58RS7DCTJD1V9FJ0
    anchor:
      type: structured
      ref: "@ac-freshness-resolution"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTXVXQY5DEQR8920F507M6H
        author: "@claude"
        body: NEW this round. The multi-annotation bootstrap rule (when an AC has several annotation
          locations and no recorded stamp, the bootstrap value is the most recent location's history
          value) is observable read-contract behavior, but it is defined only in the task What and
          Implementation Notes — no AC binds it. A consumer can distinguish most-recent from
          oldest-wins from undefined, so the rule belongs in the spec. Consider adding an AC to
          @ac-freshness-resolution for the multi-location case, or stating the rule in the spec
          description if you deliberately want it non-binding until the engine plan revisits it.
        created_at: 2026-06-11T08:48:03.326Z
    kind: question
  - _ulid: 01KTTXWC485J4Y9GHFE561TB1W
    anchor:
      type: structured
      ref: "@ac-verification-record-store"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTXWC49KDWHN9DRQVM7C1YV
        author: "@claude"
        body: "NEW this round. Two then-clauses carry rationale, which the behavioral language rules reserve
          for descriptions: ac-keyed-by-canonical-identity ends with \"because records are keyed by
          the item's canonical identifier and the criterion id rather than by slug or file
          location\", and ac-versioned-persistence ends with \"because stamp writes are committed to
          the shadow-branch history like other metadata mutations\". The observable assertions stand
          on their own (\"the stamp still resolves to the same acceptance criterion\"; \"the same
          stamps are reproduced\") — move the because-clauses into the description, which already
          states the keying and versioning design."
        created_at: 2026-06-11T08:48:18.057Z
    kind: nit
  - _ulid: 01KTTXWHT0KBKKTGQY842XJ559
    anchor:
      type: structured
      field: ac-stamp-contents
      ref: "@ac-verification-record-store"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTTXWHT00YJBEMSDP2R9RVY1
        author: "@claude"
        body: "NEW this round. ac-stamp-contents combines two independently testable behaviors: (1) an
          accepted stamp reads back with verification time, actor, and provenance class; (2) a stamp
          missing any of the three fields is rejected at write time. These have different givens (a
          valid write vs an invalid write) and would be two separate tests. Consider splitting into
          a read-back AC and a rejection AC."
        created_at: 2026-06-11T08:48:23.872Z
    kind: nit
