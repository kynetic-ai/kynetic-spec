        author: "@claude"
        body: "RE-RAISED from prior review 01KTTVE9X42D5EKE5J23CDHKXC (no author reply, plan content
          unchanged). The plan's Implementation Notes promise that older tools ignore the sidecar
          (\"created only on first write, and ignored by older tools\"), and
          @task-coverage-record-compatibility requires a test (\"Also verify a tool version without
          store support ignores the sidecar when reading a project that has one\") — but
          @coverage-record-compatibility has no AC for that behavior. Its five ACs cover
          absent-store behavior, upgrade-without-rewrite, first-write materialization, newer-format
          refusal, and unknown-field roundtrip only. Add an AC for older-tool sidecar tolerance, or
          remove the guarantee and test from the plan so spec and task scope match. Note when
          resolving: also consider how the test would actually exercise \"a tool version without
          store support\" — the suite cannot run an older released binary, so if the AC is added,
          its observable framing needs to be testable (e.g. unknown sidecar directories in shadow
          state are ignored by readers)."
