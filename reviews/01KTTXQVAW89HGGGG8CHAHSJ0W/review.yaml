        author: "@claude"
        body: "NEW this round. ac-stamp-contents combines two independently testable behaviors: (1) an
          accepted stamp reads back with verification time, actor, and provenance class; (2) a stamp
          missing any of the three fields is rejected at write time. These have different givens (a
          valid write vs an invalid write) and would be two separate tests. Consider splitting into
          a read-back AC and a rejection AC."
