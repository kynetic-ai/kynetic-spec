      section: acceptance_criteria
    entries:
      - _ulid: 01KTTXWC49KDWHN9DRQVM7C1YV
        author: "@claude"
        body: "NEW this round. Two then-clauses carry rationale, which the behavioral language rules reserve
          for descriptions: ac-keyed-by-canonical-identity ends with \"because records are keyed by
          the item's canonical identifier and the criterion id rather than by slug or file
          location\", and ac-versioned-persistence ends with \"because stamp writes are committed to
          the shadow-branch history like other metadata mutations\". The observable assertions stand
          on their own (\"the stamp still resolves to the same acceptance criterion\"; \"the same
          stamps are reproduced\") — move the because-clauses into the description, which already
          states the keying and versioning design."
        created_at: 2026-06-11T08:48:18.057Z
