      line_start: 1886
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXKKRQXRPSWZMVBG88J7R363
        author: Jacob Chapel
        body: "MUST-FIX: retained ownership is discarded as soon as the session status becomes non-active,
          even when dispatch_ownership.exited_at is absent. runInvocation closes the session before
          its finally block reaps the process group and persists exited_at, so a real completion
          window exists where the group remains live. A behavioral probe closed the session while
          leaving verified process evidence live; global stop returned applied, emitted no signal,
          and reported idle cleanup. This violates ac-live-group-prevents-cleanup-completion and the
          no-false-success stop contract. The submitted late-child regression writes exited_at
          before closing and therefore does not model runtime ordering."
        created_at: 2026-07-15T19:23:57.752Z
      - _ulid: 01KXKNDD28M4TPZKF9MSB8HKC4
        author: Jacob Chapel
        body: "Fixed in e01006b364: stop collection now retains any verified ownership lacking exited_at
          even after session status closes, and verified cleanup persists exited_at before durable
          session closure. Added a behavioral completion-window regression that closes the session
          first while the group remains live and proves the group is signalled and cleanup cannot
          false-succeed."
        created_at: 2026-07-15T19:52:43.336Z
    kind: blocker
    resolved_at: 2026-07-15T19:52:46.566Z
    resolved_by: Jacob Chapel
  - _ulid: 01KXKKRXND7RKRD4PMQ2EZZRAT
    anchor:
      type: code
      commit: 0898f3a8e00072d22546a1d4ca92b000a0baa8fa
      line_end: 1963
      line_start: 1944
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXKKRXNDSKHXRYV19H3DC3AN
        author: Jacob Chapel
        body: "MUST-FIX: the live-member refresh can replace task-A ownership with concurrently reassigned
          task-B ownership. The mutation callback returns null on immutable identity mismatch, but
          mutateSessionDispatchOwnership returns the unchanged metadata for null; this return then
          adopts refreshed.dispatch_ownership without rechecking the task selector. A behavioral
          probe reassigned the durable session from A to B during listProcessGroup; task-A stop
          returned applied and signaled task B's PGID. This violates task isolation and immutable
          cleanup-target requirements."
        created_at: 2026-07-15T19:24:03.629Z
      - _ulid: 01KXKNDKCT20Q6RE2W1HHV661X
        author: Jacob Chapel
        body: "Fixed in e01006b364: refresh results are revalidated against the original immutable identity
          before adoption. A concurrent task-A to task-B reassignment now leaves the frozen A target
          intact, so canonical re-read fails cleanup_ownership_mismatch with no signal. Added a
          behavioral race regression proving task B remains live and unsignalled."
        created_at: 2026-07-15T19:52:49.818Z
    kind: blocker
    resolved_at: 2026-07-15T19:52:53.068Z
    resolved_by: Jacob Chapel
  - _ulid: 01KXKKS3CYMAMGEVVGAB3X4X61
    anchor:
      type: code
      commit: 0898f3a8e00072d22546a1d4ca92b000a0baa8fa
      line_end: 1868
      line_start: 1865
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXKKS3CYXJXAH2168K06M6B5
        author: Jacob Chapel
        body: "MUST-FIX: unreadable or corrupt durable session metadata is silently skipped when recovering
          active ownership after daemon restart. With no in-memory retained owner, a behavioral
          probe seeded durable ownership, corrupted session.yaml, and invoked global stop; stop
          returned applied with idle cleanup and no signal while the modeled process evidence
          remained live. Existing corrupt-metadata tests retain the owner in memory and do not cover
          this restart/orphan path. The stop contract forbids reporting success when live ownership
          cannot be verified and terminated."
        created_at: 2026-07-15T19:24:09.502Z
      - _ulid: 01KXKNDSRYY2PDGQTXD30H0Q4N
        author: Jacob Chapel
        body: "Fixed in e01006b364: session storage now durably maintains a last-valid dispatch-ownership
          archive alongside canonical metadata. Restart collection can materialize a truthful target
          when session.yaml is unreadable, while cancellation still requires canonical session
          metadata re-verification and therefore reports cleanup_identity_unverifiable with stopped
          authority, failed cleanup, no signal, and no success. Added a syntactically corrupt
          restart regression."
        created_at: 2026-07-15T19:52:56.350Z
    kind: blocker
    resolved_at: 2026-07-15T19:52:59.442Z
    resolved_by: Jacob Chapel
  - _ulid: 01KXKKS95AM60CXDAS9SHD2K24
    anchor:
      type: code
      commit: 0898f3a8e00072d22546a1d4ca92b000a0baa8fa
      line_end: 199
      line_start: 178
      path: src/schema/dispatch-control.ts
      side: head
    entries:
      - _ulid: 01KXKKS95A6HY0RSVGH1QFW264
        author: Jacob Chapel
        body: "MUST-FIX: persisted task-scoped cleanup is not validated to contain only targets whose
          task_id matches the cleanup key. DispatchControlSchema.safeParse accepted a canonical
          task-A pending_cleanup entry containing a task-B target, and recovery processes every
          target under the key without a scope filter. A schema-valid persisted state can therefore
          make startup or retry for task A signal task B, violating the task-scope isolation ACs.
          Add cross-field validation and behavioral recovery coverage."
        created_at: 2026-07-15T19:24:15.402Z
      - _ulid: 01KXKNDZV6ETE0V2XHM7C2NQ86
        author: Jacob Chapel
        body: "Fixed in e01006b364: PendingCleanupRecordSchema now rejects every task-scoped target whose
          task_id differs from its canonical cleanup key. Recovery also defensively rejects such a
          target before signalling if an invalid in-memory store bypasses parsing. Added parser and
          startup-recovery behavioral regressions."
        created_at: 2026-07-15T19:53:02.566Z
    kind: blocker
    resolved_at: 2026-07-15T19:53:05.651Z
    resolved_by: Jacob Chapel
