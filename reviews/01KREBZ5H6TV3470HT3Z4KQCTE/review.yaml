    entries:
      - _ulid: 01KRECGCDBJ93825G66F98MH0J
        author: Jacob Chapel
        body: "MUST-FIX: helper-origin lookup still misses local bindings that are not function params or
          Block/Program statements.  walks function parameters and then only scans
          BlockStatement/Program statement lists with /; it never treats  initializers, / left
          bindings, or  params as local helper bindings. Those helpers then fall through to the
          free-identifier trust path in , so a no-op local helper still satisfies cleanup by name.
          Evidence: an ad hoc oxlint probe with  exited 0 with no  diagnostic; the same happened
          for  and . This violates @daemon-test-guardrail-precision
          ac-cleanup-helper-origin-is-trusted because the helper is locally bound and not an
          approved terminating primitive."
        created_at: 2026-05-12T15:22:22.507Z
      - _ulid: 01KRECJMZ87QF9ZS9KKQQDHK2K
        author: Jacob Chapel
        body: 'Clarifying the mangled shell-expanded text above: findLocalHelperDefinition currently handles
          function/arrow parameters and BlockStatement/Program statement declarations, but it does
          not treat ForStatement initializers, ForInStatement/ForOfStatement left bindings, or
          CatchClause params as local helper bindings. Repro evidence from ad hoc oxlint probes: (1)
          for-loop initializer: for (const killPid = (_p) => {}; true;) { runKspec("serve start
          --detach --port 3456"); const pid = readPidFromFile(); onTestFinished(() => killPid(pid));
          expect(true).toBe(true); break; } exited 0 with no no-leaky-test-daemon diagnostic; (2)
          for-of binding: for (const killPid of [(_p) => {}]) { ... } also exited 0 with no
          diagnostic; (3) catch parameter: catch (killPid) { ... onTestFinished(() => killPid(pid))
          ... } also exited 0 with no diagnostic. These are local, untrusted bindings of a
          cleanup-helper-like name, so the helper name alone still satisfies cleanup in violation of
          ac-cleanup-helper-origin-is-trusted.'
        created_at: 2026-05-12T15:23:36.808Z
      - _ulid: 01KREF8AZD2Y4VHQCM9P2T8TP2
        author: "@claude"
        body: "Fixed in 7c486bc61. findLocalHelperDefinition now recognises three additional binding shapes
          in the parent walk and classifies each as LOCAL_BINDING_OPAQUE: (1) CatchClause.param via
          patternBindsName (covers identifier and destructured catch bindings); (2)
          ForStatement.init via forStatementInitBindsName (VariableDeclaration init declarators);
          (3) ForOfStatement/ForInStatement.left via forXLeftBindsName (per-iteration left-binding
          declarators). All three reviewer probes now emit missingCleanup: ad hoc oxlint runs
          against (a) for (const killPid = (_p) => {}; true;) { runKspec(serve start --detach); ...
          onTestFinished(() => killPid(pid)); ... break; }, (b) for (const killPid of [(_p) => {}])
          { ... }, and (c) try { ... } catch (killPid) { ... onTestFinished(() => killPid(pid)) ...
          } all report no-leaky-test-daemon. Added six positive flag-it regressions (for-init no-op,
          for-init terminating, for-of left, for-in left, catch param, catch object-destructure) and
          two negative companions (unrelated for-of binding name, unrelated catch param name) to
          confirm the approved-import path still resolves when the inserted scope binds a different
          name. Targeted suites 352/352 pass; full suite 9132 passed, 5 skipped of 9137;
          changed-file oxlint clean (0 errors)."
        created_at: 2026-05-12T16:10:24.621Z
    kind: blocker
