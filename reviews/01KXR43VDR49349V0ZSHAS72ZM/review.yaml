    entries:
      - _ulid: 01KXR58VBXJT7N0SM0W0QFDJWV
        author: Jacob Chapel
        body: "MUST-FIX: The CLI procedure asks operators to run plain `kspec agent status` and then inspect
          held-task rows, task controls, scoped cleanup entries, and degraded-target rows under
          snake_case names. The human renderer exposes only Authority, Projection, Active, Queued,
          Held, and aggregate Cleanup; its JSON mode exposes the internal camelCase contract
          (`globalAuthority`, `heldTasks`, `taskControls`, and so on), while snake_case belongs to
          the public API. The documented procedure therefore cannot perform its own verification.
          Separate human CLI, CLI JSON, public API, and UI field names, and direct readers to an
          output mode that actually exposes every required row; add a behavioral assertion for that
          procedure."
        created_at: 2026-07-17T13:46:49.085Z
