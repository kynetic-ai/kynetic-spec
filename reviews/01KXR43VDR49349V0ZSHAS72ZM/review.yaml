    entries:
      - _ulid: 01KXR58PWMQQ8R2QZBCGHA9G3T
        author: Jacob Chapel
        body: "MUST-FIX: This AC-tagged test passes even when the requested help topic is wrong because it
          asserts only exit code 0 and nonempty stdout. `help agent dispatch` currently returns the
          nonempty top-level agent help, so the test reports coverage while the guide promise is
          broken. Assert the requested Usage path and relevant generated Options for each documented
          command or child; the test must fail when help silently resolves to an ancestor topic."
        created_at: 2026-07-17T13:46:44.500Z
