    entries:
      - _ulid: 01KXR58K114TDRD5TA254MFTK6
        author: Jacob Chapel
        body: "MUST-FIX: The help references do not lead a copying reader to the claimed full option lists.
          The extended-help command accepts one topic argument, so `kspec help agent dispatch` and
          the longer unquoted forms resolve only the `agent` topic; I reproduced the top-level agent
          help from all three documented commands. Quoting `agent dispatch` reaches that parent, but
          parent help still lists only children and not each child option set. This violates
          @docs-guides-section ac-3 and leaves operators without the promised flags. Point to
          executable per-command help such as `kspec agent dispatch stop --help` and task child
          equivalents, or use correctly quoted exact child topics, and verify every named command
          family reaches the expected Usage and Options output."
        created_at: 2026-07-17T13:46:40.545Z
      - _ulid: 01KXR73A5W1JSBDD79A96J72K0
        author: Jacob Chapel
        body: "Fixed in 743b76651e: the guide now directs readers to each exact executable --help output,
          with valid global, task, and status examples. The regression test executes every
          documented command help path and verifies its command-specific Usage and Options output."
