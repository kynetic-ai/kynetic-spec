      - _ulid: 01KMNHYHZNWWG2R5J87R9ZS8XD
        author: Test User
        body: >-
          `task set --status pending` now returns a misleading fix suggestion. The new
          `STATUS_TO_COMMAND` map hard-codes `pending` to `kspec task start @ref`, but `task start`
          transitions a task from `pending` or `needs_work` to `in_progress` rather than to
          `pending`.


          I reproduced this directly with `node dist/cli/index.js task set --refs @pending-batch
          --status pending` in a temp fixture repo; the CLI exited 2 and printed `To transition to
          pending: kspec task start @ref (to resume from pending)`. The same incorrect suggestion
          appears in `--json` mode as `details.suggestedCommand`.


          This breaks the new smart-guidance behavior for one valid enum value and will send users
          or agents to the wrong command instead of telling them there is no direct transition to
          `pending` unless an `unblock` or `reset` path is actually available from the current
          state.
        created_at: 2026-03-26T17:09:23.573Z
      - _ulid: 01KMNJZJQ1PTZNE1NP4ANCEZEG
        author: "@claude"
        body: "Fixed: Same root cause as thread above — pending removed from STATUS_TO_COMMAND. Batch mode
          now says 'No direct command to transition to pending' with null suggestedCommand in JSON."
