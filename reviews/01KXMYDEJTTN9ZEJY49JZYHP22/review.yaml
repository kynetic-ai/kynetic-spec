    entries:
      - _ulid: 01KXMZG783T546TZN2NKV0DV4P
        author: codex-reviewer
        body: "MUST-FIX: X-Request-Id is assigned inside the route handler, after Elysia body validation. A
          real-shadow request with action=restart returned the required native 400 validation body
          but x-request-id was null, so @trait-api-endpoint ac-6 and the claimed canonical failure
          tracing are still incomplete. Install the header in an onTransform or equivalent
          pre-validation hook and extend the native invalid-body test to assert it."
        created_at: 2026-07-16T08:08:15.875Z
    kind: blocker
  - _ulid: 01KXMZGA9GW42NP0WF1X50HWQM
    anchor:
      type: code
      commit: dc53f97405514dc91a021e92626e06d4b7219124
      line_end: 1110
      line_start: 1082
      path: packages/daemon/src/routes/agent-dispatch.ts
      side: head
    entries:
      - _ulid: 01KXMZGA9G7KTD7X5RY179YF6K
        author: codex-reviewer
        body: "MUST-FIX: Cold start failures do not roll back the engine created before the lifecycle
          mutation. With a real shadow pre-commit hook forcing control_commit_failed, POST
          /api/agent/dispatch returned HTTP 503
          {dispatch_enabled:false,error_code:control_commit_failed}, but getDispatchEngine still
          existed with running=true and durable authority=stopped. The failed request therefore
          changes runtime state and the next public status contradicts the frozen prior-running
          response. Track whether ensureDispatchEngine created the engine and tear it down/remove it
          on pre-commit failure across canonical start and both start aliases; add cold-failure
          behavioral coverage."
        created_at: 2026-07-16T08:08:18.992Z
    kind: blocker
  - _ulid: 01KXMZGDGH4S2NS0NN8N2QH9TV
    anchor:
      type: code
      commit: dc53f97405514dc91a021e92626e06d4b7219124
      line_end: 890
      line_start: 873
      path: packages/daemon/src/routes/agent-dispatch.ts
      side: head
    entries:
      - _ulid: 01KXMZGDGH94DSVS4DTEARSG8D
        author: codex-reviewer
        body: "MUST-FIX: stopDispatchEngine applies the durable global stop and then calls engine.stop(),
          whose shutdown path applies global stop again. A real legacy /api/agent/dispatch/stop
          request emitted dispatch_control.stop_applied (source api) followed by
          dispatch_control.noop (source daemon_shutdown). This regresses the dependency contract
          that one control outcome emits exactly once and creates two audit events for one alias
          request. Use a teardown path that does not repeat lifecycle control after the successful
          durable stop and assert one event with the expected identifier/outcome."
        created_at: 2026-07-16T08:08:22.289Z
    kind: blocker
