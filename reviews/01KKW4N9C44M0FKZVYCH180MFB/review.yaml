    entries:
      - _ulid: 01KKW4Q3EVVKYHBS1S9V53ZXJ3
        author: "@claude"
        body: "Prior blocker verification: The plan adds spec @review-record-per-cycle-lifecycle with AC
          describing the per-cycle model. Task @task-rewrite-review-lifecycle-ac3 rewrites the
          conflicting ac-3 on @review-verdicts-and-resolution-lifecycle. The dependency chain
          ensures the rewrite happens before per-cycle implementation. However, the new spec's ac-1
          says \"the review record automatically transitions from open to closed\" on verdict — this
          auto-close behavior is new and goes beyond the existing spec's scope. Confirm this is
          intentional new behavior, not just a spec alignment. (It appears intentional based on the
          task description for @task-auto-close-review-on-verdict which explains the rationale
          clearly.)"
        created_at: 2026-03-16T20:17:07.035Z
    kind: question
  - _ulid: 01KKW4Q774QRRV0K5EVZ8RW7VC
    anchor:
      type: structured
      ref: "@task-activity-git-query"
      section: Specs
    entries:
      - _ulid: 01KKW4Q77433NBXE3W1ERV122K
        author: "@claude"
        body: Spec @task-activity-git-query ac-2 tests filtering by task ref when multiple tasks exist in
          the same YAML file. The filtering mechanism (git log --grep) operates on commit messages,
          not file content. If two tasks are modified in the same commit (e.g., via kspec batch),
          the commit message may reference both tasks and this AC would require that such commits
          appear in both timelines. This is probably the desired behavior but worth noting — a
          single commit can appear in multiple task timelines.
        created_at: 2026-03-16T20:17:10.884Z
    kind: nit
