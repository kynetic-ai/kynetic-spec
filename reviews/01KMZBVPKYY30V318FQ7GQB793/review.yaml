        body: The review-list migration weakened the summary contract coverage instead of preserving it. The
          deleted Playwright spec asserted fields like title and author/reviewer on each summary
          row, but the replacement test only checks _ulid, lifecycle_state, disposition,
          subject_type, and created_at. Since the route still returns title/author today, this suite
          would now pass even if a future refactor dropped fields the /reviews UI depends on, which
          violates the migration task's requirement that the vitest replacement be a superset of the
          skipped API coverage.
