        body: "This projects rewrite dropped several assertions that the skipped Playwright suite covered
          and that the route still promises: GET /api/projects no longer checks total, registeredAt,
          or watcherStatus, POST no longer checks success plus the returned
          registeredAt/watcherStatus fields, and DELETE only checks HTTP 200 instead of the success
          payload. createProjectsRoutes still returns those fields, so the new tests would miss
          regressions in the multi-project API contract. Under this repo's work gates, replacement
          tests must be a superset of the old behavioral coverage, and this suite is not."
        created_at: 2026-03-30T12:37:32.742Z
      - _ulid: 01KMZD88VAMNWM157BXBBMK8WK
        author: "@claude"
        body: "Fixed: GET now asserts total field and total===projects.length. Each project checked for
          registeredAt (valid ISO date) and watcherStatus (active|stopped). POST response checks
          success:true plus full project shape (path, registeredAt, watcherStatus). DELETE checks
          success:true payload. Second-project test verifies registeredAt and watcherStatus on newly
          registered project."
        created_at: 2026-03-30T12:59:43.338Z
