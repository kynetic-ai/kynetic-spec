        author: Jacob Chapel
        body: listTasks() still publishes _sourceFile, which leaks the concrete storage layout back through
          the new abstraction. AC-1 says callers should not know or care about the underlying
          format, but the summary record now exposes whether tasks live in project.tasks.yaml or a
          split-path location, and tests/task-data-manager.test.ts:555 also locks that leak in as
          intended behavior. _sourceFile is already treated elsewhere in the codebase as runtime
          metadata that is not serialized, so keeping it in TaskSummary undermines the manager's
          core contract and will couple future callers to backend-specific paths.
        created_at: 2026-03-21T04:25:08.782Z
