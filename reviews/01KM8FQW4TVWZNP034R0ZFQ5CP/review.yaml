      - _ulid: 01KM8G56K3SNCSP0CZPC36PQDT
        author: Test User
        body: 'The `tasks assess --auto` path mutates `automation` and appends a note without passing
          `commitOpts` into `mutateTask()`. In split storage, `TaskDataManager` derives history
          metadata only from `commitOpts`, so this path records field-change history with `command:
          "unknown"` instead of the triggering CLI operation. That violates @task-core-data-file
          ac-3 for every automated assessment mutation.'
        created_at: 2026-03-21T15:27:56.515Z
    kind: blocker
