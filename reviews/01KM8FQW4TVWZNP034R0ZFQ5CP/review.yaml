    entries:
      - _ulid: 01KM8G6NEY8S78AWCGGNB7SE17
        author: Test User
        body: 'Dangling-ref cleanup mutates tasks through `mutateTasks()` without `commitOpts`. When this
          removes `depends_on`, `context`, `blocked_by`, or `spec_ref` in split storage, the
          appended per-task history entry falls back to `command: "unknown"`. These are real field
          mutations covered by @task-core-data-file ac-1/ac-3, so the audit trail is incomplete for
          `item delete` cleanup edits.'
        created_at: 2026-03-21T15:28:44.510Z
    kind: blocker
