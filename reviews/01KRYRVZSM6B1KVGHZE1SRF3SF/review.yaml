        author: Jacob Chapel
        body: "MUST-FIX: the new regression test is annotated only as @daemon-command-api
          ac-command-endpoint, but the task's primary coverage targets are @daemon-command-api
          ac-no-recursive-command-proxy and @cli-daemon-proxy
          ac-daemon-internal-proxy-suppression-is-scoped. I verified with rg that there are zero
          standalone annotations for either AC in tests. The test body covers the daemon request
          suppression behavior, but without the correct AC annotation it will not satisfy the
          coverage gate for ac-no-recursive-command-proxy; there is also no CLI daemon-proxy test
          that exercises suppression scope outside the daemon request. Add behavioral
          tests/annotations for both ACs (no source scanning)."
        created_at: 2026-05-19T00:08:24.927Z
      - _ulid: 01KRYYPWE0HD9EXN6NM3VG2KS1
        author: "@claude"
        body: "Fixed: re-annotated the daemon-internal regression test at tests/daemon-command-api.test.ts
          as '@daemon-command-api ac-no-recursive-command-proxy' (it was previously
          ac-command-endpoint). Added five behavioral tests in tests/cli-daemon-proxy.test.ts
          annotated as '@cli-daemon-proxy ac-daemon-internal-proxy-suppression-is-scoped' that
          exercise: (1) shouldProxyCommand inside runWithDaemonProxySuppressed returns {proxy:false,
          reason:'daemon command API execution'}; (2) suppression overrides --daemon force-proxy
          inside the guarded scope; (3) normal auto-detect routing resumes outside the scope; (4)
          force-direct (KSPEC_NO_DAEMON) wins outside the scope; (5) force-proxy (--daemon) failure
          path is preserved outside the scope; and (6) suppression does not leak into a concurrent
          async chain (uses promise-gated interleaving). Tests are purely behavioral — they call
          shouldProxyCommand and assert on returned values, not source content. npm test passed
          (2447 suites, 9288 tests)."
        created_at: 2026-05-19T01:48:20.800Z
    kind: blocker
