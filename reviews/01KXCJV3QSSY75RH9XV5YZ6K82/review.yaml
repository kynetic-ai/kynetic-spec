    entries:
      - _ulid: 01KXCJW630JDB33F09AQECBFFD
        author: codex
        body: Cleanup scope is contradictory. Top-level CleanupState aggregates global and task entries, and
          the task matrix allows global start while unrelated task cleanup remains. This handoff
          instead requires entries:[] and rejects global actions whenever any entry exists; API,
          CLI, UI, aliases, and verification inherit the ambiguity. Define matching-scope guards and
          add the stopped-global plus unrelated-task-cleanup row everywhere.
        created_at: 2026-07-13T01:53:40.960Z
    kind: blocker
  - _ulid: 01KXCJW9137VN4WSQY8Z476411
    anchor:
      type: structured
      ref: "@task-daemon-dispatch-lifecycle-api"
      section: description
    entries:
      - _ulid: 01KXCJW9137844K1ZTVFRKQPCQ
        author: codex
        body: The standalone wire schemas still diverge. Binding prose allows failed aggregate error_code
          only on entries whose latest attempt failed, but CLI, UI, API/CLI verification, and
          browser handoffs abbreviate this and omit the at-least-one failed-entry refinement. Public
          status is snake-case while UI models are camel-case, but no public-response normalization
          is specified and current fetchAgentStatus returns JSON directly. Freeze both rules across
          every consumer and fixture.
        created_at: 2026-07-13T01:53:43.971Z
    kind: blocker
