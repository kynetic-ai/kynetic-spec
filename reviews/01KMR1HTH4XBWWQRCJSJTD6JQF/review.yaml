      line_start: 58
      path: packages/daemon/src/routes/command.ts
      side: head
    entries:
      - _ulid: 01KMR1JHYT8EM6ZWMJD5FWQ5VJ
        author: "@claude"
        body: The route mutates process-global state (process.cwd(), console.*, and the exit interceptor)
          around each request without any cross-request serialization, so concurrent command calls
          can execute against the wrong project or corrupt each other's captured output. I
          reproduced this by issuing two POST /api/command requests in parallel against different
          temp projects; on the first iteration both responses came back 500 with ENOENT for an
          undefined path instead of returning each project's task list. Because the daemon serves
          multiple requests concurrently, this breaks the endpoint's core correctness under normal
          load.
        created_at: 2026-03-27T16:20:56.410Z
      - _ulid: 01KMR2R5AFH5YW23PTHPJZ5K2F
        author: "@claude"
        body: "Fixed: Added DispatchMutex class — a promise-based FIFO mutex that serializes ALL command
          dispatches within the daemon process. Both single-command and batch routes now wrap their
          entire execution inside dispatchMutex.run(), which ensures process.cwd(),
          console.log/error/warn, and the exit interceptor are never concurrently mutated. The file
          lock (withFileLock) remains inside the mutex for cross-process mutation coordination. Also
          removed the standalone withProjectDir helper — cwd management is now inline within the
          mutex-protected sections."
        created_at: 2026-03-27T16:41:28.655Z
    kind: blocker
    resolved_at: 2026-03-27T16:41:53.084Z
    resolved_by: "@claude"
  - _ulid: 01KMR1JMV74EWKMD681DSN86FA
    anchor:
      type: code
      commit: 65b59e1afcde5d4bda7e227ee4b8947c6573730a
      line_end: 359
      line_start: 145
      path: tests/daemon-command-api.test.ts
      side: head
    entries:
      - _ulid: 01KMR1JMV84QQ8B3JSAAHBM7E5
        author: "@claude"
        body: These tests claim AC coverage for cache updates and response parity, but they never exercise
          either behavior. The suite constructs the route with createCommandRoutes({ pubsub }) only,
          so getEntityCache is always undefined and the writeThrough branch at
          packages/daemon/src/routes/command.ts:266-278 and :390-399 is skipped entirely; the
          ac-mutation-cache-update tests only assert that a WebSocket event was broadcast. Likewise,
          the ac-response-parity test never runs the direct CLI or compares stdout/stderr, so it
          would still pass if the API response diverged from CLI output. This leaves two spec
          guarantees unproven.
        created_at: 2026-03-27T16:20:59.368Z
      - _ulid: 01KMR2SA2RKRJP7EJ8CS1K2KSZ
        author: "@claude"
        body: "Fixed: Both unproven behaviors now have genuine behavioral tests. (1)
          ac-mutation-cache-update: Tests now provide a mock EntityCacheAccessor that returns a
          spy-instrumented RouteEntityCache. After mutating commands, the test verifies writeThrough
          was called with the expected domains (tasks, items, inbox, etc.). A new test also verifies
          writeThrough is NOT called for read-only commands. (2) ac-response-parity: The test now
          runs the same command via both the API endpoint and the kspec() CLI subprocess helper,
          then compares the parsed JSON output field-by-field (title, status, _ulid, type,
          spec_ref). A second parity test verifies matching non-zero exitCode for failing commands."
        created_at: 2026-03-27T16:42:06.296Z
    kind: blocker
    resolved_at: 2026-03-27T16:42:14.848Z
    resolved_by: "@claude"
