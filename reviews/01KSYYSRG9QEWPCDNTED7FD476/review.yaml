threads:
  - _ulid: 01KSYZQQFRY1360T5FAK6KEYKW
    anchor:
      type: code
      commit: da7b1cff51e452cd9aa4edc844062ac0fa23830c
      line_end: 2433
      line_start: 2430
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KSYZQQFRVWP9ZY7BVKXQGF96
        author: Jacob Chapel
        body: "MUST-FIX: dispatch still renders the role-entry workflow with the legacy agent adapter before
          runner preflight. _buildDispatchPrompt passes agent.adapter ?? \"claude-agent-acp\" into
          buildRoleEntryContext, and that prompt is built before resolveRunnerInvocation runs. I
          verified with a runtime probe: an agent with runner=codex-runner and
          adapter=claude-agent-acp rendered 'Workflow entrypoint: `/task-work`'. If the resolved
          runner adapter is codex-acp, dispatch should render the Codex entrypoint syntax. Because
          this text is already expanded before runInvocation receives it, the later resolved-adapter
          prompt build cannot recover the portable token. This violates runner precedence for
          dispatch prompts and means dispatch does not consistently use the same resolved runner
          contract as one-shot invocation."
        created_at: 2026-05-31T12:21:58.904Z
    kind: blocker
  - _ulid: 01KSYZR7SDZ5RPV9RR2FA1NXWX
    anchor:
      type: code
      commit: da7b1cff51e452cd9aa4edc844062ac0fa23830c
      line_end: 419
      line_start: 413
      path: src/agents/runners.ts
      side: head
    entries:
      - _ulid: 01KSYZR7SDHRGFFX90EJB8E8M5
        author: Jacob Chapel
        body: "MUST-FIX: the resolver ignores required secret bindings and never emits the advertised
          missing_secret preflight failure. buildRunnerContract composes env.inherit/pass/set only;
          runner.env.secrets is not inspected. I verified with a probe using an EffectiveRunner
          whose env.secrets contained API_TOKEN { source: 'missing-source', required: true };
          resolveRunnerInvocation returned ok with an empty env instead of throwing
          RunnerResolutionError('missing_secret'). That allows a runner requiring a secret to spawn
          without the secret and violates the task's typed error contract plus the invalid
          security-setting preflight behavior."
        created_at: 2026-05-31T12:22:15.598Z
    kind: blocker
