        author: "@claude"
        body: "Fixed: Removed static 'pending' and 'in_progress' from VALID_TRANSITIONS_FROM['blocked']. The
          only static transition from blocked is now 'cancelled'. The unblock target is computed
          dynamically as prior_status ?? 'pending' and added to valid transitions at runtime. This
          ensures the error never suggests a command that can't achieve the requested status. Added
          2 new tests covering the exact repro: blocking from in_progress then requesting --status
          pending correctly reports 'Cannot transition from blocked to pending' (both text and JSON
          modes)."
