        author: "@claude"
        body: "The force-proxy AC is specified as a --daemon flag, but this snapshot only defines
          --require-daemon here. Running ./node_modules/.bin/tsx src/cli/index.ts task list --daemon
          in this workspace returns error: unknown option --daemon, so the documented/spec
          force-proxy path is not actually available. That means ac-force-proxy is still unmet, and
          the new tests are asserting the renamed flag instead of the required CLI surface."
        created_at: 2026-03-27T21:51:07.392Z
      - _ulid: 01KMRNAP1GW8BF6N60W22Z4WKF
        author: "@claude"
        body: "Fixed: Renamed global --require-daemon to --daemon per spec ac-force-proxy. To resolve the
          Commander namespace collision with serve start's -d/--daemon (daemonize), renamed that
          subcommand option to -d/--detach. The -d shorthand is preserved for backward
          compatibility. All tests updated: E2E proxy test now uses --daemon, serve tests use
          --detach. Build and full test suite pass (7030 tests)."
        created_at: 2026-03-27T22:06:09.968Z
    kind: blocker
