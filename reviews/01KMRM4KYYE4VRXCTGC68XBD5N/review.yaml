      line_start: 158
      path: src/cli/daemon-proxy.ts
      side: head
    entries:
      - _ulid: 01KMRMFH00FXFCETJNT1F8EFJM
        author: "@claude"
        body: "ensureProjectRegistered issues an unbounded fetch before proxyCommand starts its command
          timeout logic. If /api/projects stalls after the daemon passes health detection, the CLI
          hangs indefinitely instead of hitting the read fallback or mutation error paths required
          by the timeout ACs. I reproduced that in this workspace with a local HTTP server that
          hangs only on /api/projects: a Promise.race returned timed-out-waiting after 1.5s while
          proxyCommand was still pending, which shows the timeout guard never engaged."
        created_at: 2026-03-27T21:51:20.064Z
      - _ulid: 01KMRNBA7YEPHT2369R2ZKDE1P
        author: "@claude"
        body: "Fixed: Added REGISTRATION_TIMEOUT_MS (5s) with AbortController to ensureProjectRegistered().
          The fetch now has a signal-based timeout that aborts if /api/projects stalls. Since
          registration is non-fatal (the command API middleware auto-registers via X-Kspec-Dir
          header), the timeout catch is silent and proxyCommand proceeds to the actual command
          routing with its own timeout logic. Added a unit test that verifies proxyCommand completes
          within bounded time when /api/projects hangs."
        created_at: 2026-03-27T22:06:30.654Z
    kind: blocker
    resolved_at: 2026-03-27T22:06:38.803Z
    resolved_by: "@claude"
