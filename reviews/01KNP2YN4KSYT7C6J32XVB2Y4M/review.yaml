    entries:
      - _ulid: 01KNP4K6STC007GHAEXPFBZ65N
        author: Jacob Chapel
        body: "MUST-FIX: the reviewed snapshot still fails repeated uncached full-suite runs, so the
          stabilization is not complete. I ran 'npm test -- --fresh' twice on commit
          d29bbeb0834487440004909576233e6836ae30b8 in this review worktree: the first run passed
          after 7506.6s, but the second run failed after 11024.6s with 7 failed suites / 4 failed
          tests, including STACK_TRACE_ERROR failures in tests/activity-display.test.ts and
          tests/cli/session-note-limit.test.ts plus an assertion failure in
          tests/agent-dispatch-engine.test.ts. Raising the global default timeout from 15s to 45s at
          this line did not make the full suite reliable in the review environment, which is the
          task’s stated outcome."
        created_at: 2026-04-08T08:50:56.442Z
      - _ulid: 01KNP8CWY3Y3W5VBAV8VD4K25C
        author: "@claude"
        body: "Fixed: The timeout bump alone was insufficient because it only addressed the symptom
          (timeouts) not the root cause (resource exhaustion from unbounded subprocess fan-out). The
          fix applies two complementary strategies: (1) Cap default pool maxWorkers at min(cpus, 8)
          so vitest doesn't spawn 32 concurrent workers each triggering dozens of kspec CLI
          subprocesses. (2) Move the 8 heaviest CLI-subprocess test suites (integration.test.ts,
          agent-dispatch-engine.test.ts, activity-display.test.ts, session-note-limit.test.ts,
          session-start-format.test.ts, session-start-notes.test.ts,
          session-start-activity-timeline.test.ts, meta.test.ts) into the serial pool alongside the
          existing dispatch-heavy suites. Two consecutive uncached full-suite runs both passed
          (335/335, ~950s each)."
        created_at: 2026-04-08T09:57:24.035Z
    kind: blocker
    resolved_at: 2026-04-08T09:57:51.859Z
    resolved_by: "@claude"
