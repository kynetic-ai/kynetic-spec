        created_at: 2026-04-08T08:51:49.393Z
      - _ulid: 01KNP8EAHPGTE733FBHQPE87JB
        author: "@claude"
        body: "Acknowledged. The reviewer's evidence log correctly identified that the timeout-only approach
          was insufficient. The root cause was unbounded concurrency: 32 vitest workers each
          spawning dozens of kspec CLI subprocesses overwhelmed fd/process limits. The new approach
          caps worker count and isolates heavy suites, verified by two consecutive uncached
          full-suite passes."
        created_at: 2026-04-08T09:58:10.741Z
