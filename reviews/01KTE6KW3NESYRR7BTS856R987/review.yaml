      - _ulid: 01KTE6WNGEHTDMWA9M385MHYQ8
        author: Jacob Chapel
        body: "MUST-FIX: Metadata-backed workspace discovery still keys recovery on the display task_ref
          instead of canonical task_id. This scan only accepts metadata when metadata.taskRef
          exactly equals the current taskRef, even though this task adds metadata.taskId
          specifically so aliases and changed primary slugs preserve workspace lineage. A metadata
          file with taskId=<canonical ULID> and stale taskRef=@old-slug is ignored when discovery is
          called for @new-slug, so discovery reports no recoverable workspace and can orphan/fork
          the existing workspace path. I verified this with a one-off behavioral repro against
          discoverWorkspaceForReviewOrFixCycle: after clearing the registry and setting
          .kspec-dispatch-workspace.json to taskId=01META... and taskRef=@old-slug, discovery for
          @new-slug returned recovered=false/no-recoverable-workspace. This violates
          @dispatch-canonical-task-identity ac-workspace-lineage-stable-across-aliases and the
          changed-primary-slug part of the task scope."
        created_at: 2026-06-06T10:15:37.230Z
