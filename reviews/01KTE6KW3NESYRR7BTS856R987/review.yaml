    entries:
      - _ulid: 01KTE6WNGEHTDMWA9M385MHYQ8
        author: Jacob Chapel
        body: "MUST-FIX: Metadata-backed workspace discovery still keys recovery on the display task_ref
          instead of canonical task_id. This scan only accepts metadata when metadata.taskRef
          exactly equals the current taskRef, even though this task adds metadata.taskId
          specifically so aliases and changed primary slugs preserve workspace lineage. A metadata
          file with taskId=<canonical ULID> and stale taskRef=@old-slug is ignored when discovery is
          called for @new-slug, so discovery reports no recoverable workspace and can orphan/fork
          the existing workspace path. I verified this with a one-off behavioral repro against
          discoverWorkspaceForReviewOrFixCycle: after clearing the registry and setting
          .kspec-dispatch-workspace.json to taskId=01META... and taskRef=@old-slug, discovery for
          @new-slug returned recovered=false/no-recoverable-workspace. This violates
          @dispatch-canonical-task-identity ac-workspace-lineage-stable-across-aliases and the
          changed-primary-slug part of the task scope."
        created_at: 2026-06-06T10:15:37.230Z
    kind: blocker
  - _ulid: 01KTE6WRJAVMKT0XKJRPSNAK02
    anchor:
      type: code
      commit: 026ad7653a9c194b8072f0ce2ae7fd6a58b8e7bc
      line_end: 3960
      line_start: 3957
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KTE6WRJAMCS1D59CKR74DNX8
        author: Jacob Chapel
        body: "MUST-FIX: Active reviewer target-sync deferral still matches reviewer workspaces by display
          task_ref. activeInvocationDetails now stores the canonical taskId, and workspace records
          now store task_id, but _activeReviewerTargets builds reviewerTaskRefs from record.taskRef
          and then checks reviewerTaskRefs.has(record.task_ref). If the active reviewer was started
          under @new-slug while the registry record still has a stale display ref @old-slug but
          task_id=<same ULID>, this returns no active target, so periodic target sync does not defer
          the reviewer's integration target. I verified this with a one-off repro by seeding an
          active reviewer record with taskId=01TACT.../taskRef=@new-slug and a registry record with
          task_id=01TACT.../task_ref=@old-slug; _activeReviewerTargets() returned an empty set. This
          is another identity decision still keyed on a display alias instead of canonical task
          ULID."
        created_at: 2026-06-06T10:15:40.362Z
    kind: blocker
