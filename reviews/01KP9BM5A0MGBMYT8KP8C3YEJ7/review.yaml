        author: Jacob Chapel
        body: "Runtime step failures exit with EXIT_CODES.ERROR here, but @trait-semantic-exit-codes ac-4
          requires the runtime-failure code (3). I reproduced this by forcing agent-instruction
          regeneration to fail and running 'node dist/cli/index.js upgrade --json': the command
          returned status 1, so callers cannot distinguish upgrade execution failures from generic
          errors."
        created_at: 2026-04-15T20:05:59.928Z
