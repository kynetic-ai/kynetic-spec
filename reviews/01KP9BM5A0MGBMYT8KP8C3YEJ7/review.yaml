        author: "@claude"
        body: "Fixed: runtime step failures now exit with EXIT_CODES.NOT_FOUND (3) instead of
          EXIT_CODES.ERROR (1), matching @trait-semantic-exit-codes ac-4. New test asserts exit code
          3 by forcing EISDIR on kspec-agents.md."
        created_at: 2026-04-15T20:23:44.869Z
