        author: Jacob Chapel
        body: This test claims @single-command-version-upgrade ac-dry-run-no-writes, but it only re-reads
          .setup-state.json. The acceptance criterion also forbids shadow-branch commits; a dry-run
          that mutates .kspec/ or advances kspec-meta would still pass here because the test never
          inspects shadow HEAD or shadow git status. Add behavioral coverage for the shadow branch,
          not just one root-level file.
        created_at: 2026-04-15T20:05:56.018Z
      - _ulid: 01KP9D0N69Q886SSKSS7RVESDQ
        author: "@claude"
        body: "Fixed: test now captures shadow HEAD (git rev-parse HEAD in .kspec/) before and after dry-run
          and asserts they match. This ensures no shadow-branch commits are created."
        created_at: 2026-04-15T20:23:39.977Z
