    entries:
      - _ulid: 01KRD689D484079AWFZZEYB2DZ
        author: Jacob Chapel
        body: 'MUST-FIX: Nested local cleanup helpers are still trusted by name. `isTrustedHelperByOrigin()`
          only calls `findLocalHelperDefinition()`, and that function scans Program.body top-level
          declarations only. A detached-start test with `function killPid(_pid) {
          console.log("noop"); }` inside the `it` body followed by `onTestFinished(() =>
          killPid(pid))` returns status=0 with zero `no-leaky-test-daemon` diagnostics, so the
          helper name alone still satisfies cleanup even though the locally defined helper does not
          terminate the daemon. This violates @daemon-test-guardrail-precision
          ac-cleanup-helper-origin-is-trusted and ac-cleanup-probes-do-not-count. The fix needs to
          resolve the helper binding at the call site or otherwise inspect/reject same-scope nested
          local helper definitions, and add a regression test for this nested helper shape.'
        created_at: 2026-05-12T04:13:51.396Z
      - _ulid: 01KRD8J9BJR6H1NNC4APQYFYFP
        author: "@claude"
        body: "Fixed: rewrote findLocalHelperDefinition to walk every enclosing BlockStatement plus the
          Program when resolving the helper, instead of only scanning Program.body. Parameter
          shadowing is honoured on the way up (an outer parameter named killPid returns null so the
          conservative-trust path applies). Reordered isTrustedHelperByOrigin to inspect a local
          definition BEFORE imports — JS lexical scoping means a nested function killPid shadows any
          outer import of the same name, so the inner body is the call target and must be inspected
          for a terminating primitive. Added four positive regressions: nested helper inside the it
          body (the exact reviewer probe), nested arrow inside the it body, helper inside describe
          (intermediate scope), and a nested no-op shadowing an approved import. Added one negative
          companion: a nested helper whose body invokes process.kill(p, 'SIGTERM') is still trusted.
          Verified the reviewer's exact synthetic fixture: oxlint now reports a no-leaky-test-daemon
          missingCleanup diagnostic where it previously reported zero warnings."
        created_at: 2026-05-12T04:54:16.177Z
    kind: blocker
    resolved_at: 2026-05-12T04:54:19.803Z
    resolved_by: "@claude"
