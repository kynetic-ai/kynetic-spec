    entries:
      - _ulid: 01KPVNB2D38VQ4CSG8QXMMTXYA
        author: Jacob Chapel
        body: "This dirty-target gate is stricter than the spec: it rejects any porcelain output, including
          untracked files, but ac-helper-refuses-dirty-target only allows refusal for tracked
          modifications or staged drift. I reproduced it by creating an untracked scratch file in
          the occupied dev worktree; the helper exited 1 with 'Dirty files: ?? untracked.tmp'
          instead of proceeding. That turns harmless reviewer-local files into a merge blocker and
          violates the advertised recovery contract."
        created_at: 2026-04-22T22:35:29.571Z
      - _ulid: 01KPVPGR1N38VVFF7MYBFK4C8T
        author: "@claude"
        body: "Fixed: The dirty-target gate now uses git diff --quiet (tracked modifications) and git diff
          --cached --quiet (staged drift) instead of git status --porcelain. Untracked files no
          longer block the merge. Added a test that creates an untracked file in the occupied
          worktree and verifies the merge proceeds successfully."
        created_at: 2026-04-22T22:56:04.148Z
    kind: blocker
    resolved_at: 2026-04-22T22:56:20.223Z
    resolved_by: "@claude"
  - _ulid: 01KPVNB5YRTKMSVNYQEXQWP15B
    anchor:
      type: code
      commit: 8f0a82799dd28d92fb1e39a74a56e7bb8d8f69e6
      line_end: 38
      line_start: 37
      path: templates/skills/merge/files/detached-reviewer-merge.sh
      side: head
    entries:
      - _ulid: 01KPVNB5YR36JXXHCK0THQ4S91
        author: Jacob Chapel
        body: The helper resolves the merge input from
          refs/heads/dispatch/task/task-detached-reviewer-merge-helper/01kpvj8r at runtime instead
          of pinning to the reviewed snapshot commit. In a detached review flow that lets the
          canonical branch move after the snapshot is cut, so approval of commit 8f0a827 could merge
          later unreviewed commits. I reproduced this by detaching a reviewer worktree at one
          commit, advancing the task branch with another commit, then running the helper; the
          integration worktree received the later unreviewed file. The helper needs to require and
          verify the recorded canonical head and merge exactly that reviewed commit.
        created_at: 2026-04-22T22:35:33.208Z
      - _ulid: 01KPVPGY0AZPVAPN5V8WXAYZXN
        author: "@claude"
        body: "Fixed: The helper now requires KSPEC_DISPATCH_CANONICAL_HEAD env var and merges exactly that
          pinned commit SHA instead of resolving refs/heads/<branch> at runtime. If the branch has
          advanced past the pinned commit, the helper emits a warning but still merges only the
          reviewed commit. Added a test that advances the canonical branch after snapshot, runs the
          helper, and verifies the unreviewed file does NOT appear in the integration worktree."
        created_at: 2026-04-22T22:56:10.249Z
    kind: blocker
    resolved_at: 2026-04-22T22:56:26.647Z
    resolved_by: "@claude"
