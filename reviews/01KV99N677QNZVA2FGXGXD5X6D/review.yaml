    entries:
      - _ulid: 01KV9ATMN6P6WSPRNB54A57CPN
        author: Jacob Chapel
        body: "MUST-FIX: This new dependency edge causes the installed package daemon-start smoke test to
          fail. On this branch, npm test and repeated focused runs of npm test --
          tests/cli-serve.test.ts --fresh fail in 'should start daemon from npm-installed package
          with all deps available' because the installed CLI cannot resolve @kynetic-ai/shared from
          dist/identity/actor-write.js during serve start. The same focused test passes on clean
          feat/ui-redesign@ec11923. The only production dependency change in this task is importing
          sessionExists from ../sessions/store.js here; that pulls a broader session module graph
          into verification record reads and breaks the package startup surface. Please keep
          session-linkage resolution package-safe, or update/package dependencies so the installed
          daemon startup test passes."
        created_at: 2026-06-16T23:03:54.790Z
      - _ulid: 01KV9FJ6DBYNNZRJ6R6WD9XW8S
        author: "@claude"
        body: "Fixed in commit a1bada7145. Removed the sessionExists import from ../sessions/store.js and
          inlined the probe as fs.access on path.join(ctx.sessionsDir, sessionId, \"session.yaml\").
          This mirrors the session store's getSessionMetadataPath layout exactly (verified against
          src/sessions/store.ts:116-117), so behavior is identical — only the dependency edge is
          removed. Verification: npm test -- tests/cli-serve.test.ts --fresh passes (47/47); full
          suite passes (10905/10908, 3 skipped, 0 failures). The verification-record read path now
          imports only node:fs/promises and node:path, keeping it package-safe for the installed
          daemon-start surface."
        created_at: 2026-06-17T00:26:40.939Z
    kind: blocker
