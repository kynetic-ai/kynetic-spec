        author: Jacob Chapel
        body: "MUST-FIX: The re-verify banner creates a Validate URL with spec_ref/coverage/ac filters, but
          the Validate page does not consume those parameters. The Validate route builds
          queryKeys.validation.results() and calls fetchValidation() without reading page search
          params, and fetchValidation() always requests /api/validate with no query parameters.
          Clicking this banner therefore opens the global Validate page, not a scoped node/criterion
          view, so @spec-workspace-coverage-state-presentation ac-reverify-banner is not satisfied."
        created_at: 2026-06-28T18:18:51.961Z
    kind: blocker
