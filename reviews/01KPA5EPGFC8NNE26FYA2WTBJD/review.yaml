        body: >-
          This test is annotated as , but Single-Command Version Upgrade

          ────────────────────────────────────────

          ULID:      01KNXYJ3EVJKEJDNRDZ55WM0KF

          Slugs:     single-command-version-upgrade

          Type:      requirement

          Maturity:  draft

          Implementation: in_progress


          ─── Description ───

          A dedicated upgrade command brings a project from any

          previously-supported kspec version to the currently

          installed version in a single invocation. The command

          detects version skew, runs all required migrations,

          re-renders skills, regenerates agent instructions, and

          reports the net result. The upgrade is idempotent and safe

          to run when the project is already current.



          ─── Acceptance Criteria ───
            [ac-detects-skew]
              Given: A project was initialized with an older kspec version
          and its last-known version is recorded in project state

              When: The upgrade command runs

              Then: The command reads the recorded last-known version and
          identifies it as the source version for the upgrade

            [ac-source-version-fallback]
              Given: A project has no recorded last-known version

              When: The upgrade command runs

              Then: The command infers a source version from the shape of
          project state and records it with approximate confidence

            [ac-source-version-unknown]
              Given: A project's source version cannot be identified or
          inferred

              When: The upgrade command runs

              Then: The command reports the source version as unknown,
          names the target version, and proceeds with the full

          upgrade pipeline as if the project were on the oldest

          supported version

            [ac-reports-skew]
              Given: The upgrade command has determined source and target
          versions

              When: The command begins its upgrade pipeline

              Then: The command reports the source version and the target
          version before any changes are applied, and marks the

          source as approximate or unknown when it was inferred

          rather than read directly

            [ac-runs-task-storage-migration]
              Given: A project uses a task storage format that is no longer
          current

              When: The upgrade command runs

              Then: The task storage migration is run as part of the upgrade
          and reports whether any tasks were migrated

            [ac-rerenders-skills]
              Given: A project has skill files rendered from a previous
          version of the skill templates

              When: The upgrade command runs

              Then: Core skills are re-rendered so the rendered files match
          the currently installed version and obsolete rendered

          skills that no longer exist in the current version are

          removed

            [ac-regenerates-agents-file]
              Given: A project has an auto-generated agent instructions file
          from a previous version

              When: The upgrade command runs

              Then: The auto-generated agent instructions file is
          regenerated against the current templates

            [ac-restores-gitignore-entries]
              Given: A project is missing one or more kspec gitignore entries
          that are now required

              When: The upgrade command runs

              Then: Missing entries are appended to the gitignore and the
          change is reported

            [ac-idempotent-when-current]
              Given: A project is already at the current version with no
          drift

              When: The upgrade command runs

              Then: The command completes successfully, reports that no
          changes were necessary, and makes no modifications to

          the project

            [ac-reports-manual-follow-ups]
              Given: The upgrade applies changes that a user should review
          (such as a scaffolded or updated config file, new

          default agents, or new gitignore entries)

              When: The upgrade completes

              Then: The command reports each applied change with enough
          context for the user to decide whether additional

          manual follow-up is needed

            [ac-dry-run-reports]
              Given: A user wants to preview an upgrade without making
          changes

              When: The upgrade command runs with the dry-run flag

              Then: Every change the pipeline would apply is reported in
          the same format as a real upgrade run

            [ac-dry-run-no-writes]
              Given: The upgrade command is running with the dry-run flag

              When: The command completes

              Then: No filesystem modifications have been made at the
          project root and no shadow branch commits have been

          created



          ─── Inherited from @trait-error-guidance ───
            [ac-1] (from @trait-error-guidance)
              Given: command encounters error
              When: error message is shown
              Then: includes description of what went wrong
            [ac-2] (from @trait-error-guidance)
              Given: command encounters error
              When: error message is shown
              Then: includes suggested action to resolve
            [ac-3] (from @trait-error-guidance)
