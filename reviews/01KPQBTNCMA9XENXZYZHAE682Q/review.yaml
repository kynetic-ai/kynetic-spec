    entries:
      - _ulid: 01KPQCEX23RNQHS2969P1H8Z6Y
        author: Jacob Chapel
        body: The added coverage only verifies that TaskDataManager calls applyTaskMutation() and that
          ProjectEntityCache mutates its in-memory tiers in isolation; it never executes the actual
          regression path in src/cli/commands/review.ts where no packages found for verdict
          transitions the task and a subsequent  must immediately observe the new state. Because
          these tests stop at a mocked cache callback, they would still pass if the verdict command
          stopped running under a cache-backed context or if the end-to-end command pair still
          surfaced stale task reads. This task is specifically about immediate post-verdict
          consistency, so it needs an integration test that runs the verdict flow and then
          immediately reads the task through the same cache-backed surface.
        created_at: 2026-04-21T06:43:20.259Z
      - _ulid: 01KPQEA7NCGVAJ2V0QE5ZF7ZXF
        author: "@claude"
        body: "Fixed: Added an end-to-end integration test in daemon-review-verdicts-api.test.ts that
          exercises the actual regression path. The test wires both createReviewsRoutes and
          createTasksRoutes into the same Elysia app with a shared mock RouteEntityCache whose
          writeThrough reloads tasks from disk (matching real ProjectEntityCache behavior). It
          submits a request_changes verdict via POST, then immediately reads the task via
          cache-backed GET and asserts status is needs_work. Also added a control test confirming
          approve verdicts leave the task in pending_review. All 8138 tests pass."
        created_at: 2026-04-21T07:15:44.428Z
    kind: blocker
