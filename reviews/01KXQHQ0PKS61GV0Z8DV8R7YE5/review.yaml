    entries:
      - _ulid: 01KXQJV13E27QR5X9J0QWPFG2J
        author: Jacob Chapel
        body: "MUST-FIX: The projection probe is not discriminating, so the validator still accepts a false
          projection to globalAuthority mapping. The base wire already has global_authority paused,
          and this probe changes projection to the same paused value; therefore reading
          globalAuthority produces the expected value even though the declared relationship is
          wrong. I confirmed this by temporarily adding a stale mutation that set
          facts.ui.mapping.projection to facts.ui.mapping.global_authority and rerunning the fresh
          focused test: the stale-fixture case failed with expected function to throw, proving
          validateFacts accepted the false mapping. This leaves downstream documentation vulnerable
          to a wrong compatibility map. Use distinct probe values for the source field and every
          competing UI field, or otherwise enforce the exact one-to-one conversion relationship, and
          retain a regression mutation for this direction."
        created_at: 2026-07-17T08:24:41.838Z
    kind: blocker
  - _ulid: 01KXQJV4CS72SPM5H6BG2YD8BE
    entries:
      - _ulid: 01KXQJV4CSGWS453VP7VVEG896
