      - _ulid: 01KM7XYZTNCTF8BS03DXCBJNXY
        author: Jacob Chapel
        body: Adding commitOpts here causes TaskDataManager.mutateTask() to create a shadow commit, but this
          command still calls commitIfShadow() immediately afterward. The same pattern was
          introduced for needs-work, reset, todo done, and todo undone. In shadow mode those
          commands now emit two commits for one mutation, and the todo paths even leave a second
          mislabelled 'task-note' commit. That breaks the single semantic shadow-commit contract and
          will pollute task history whenever these commands are used.
        created_at: 2026-03-21T10:09:58.613Z
    kind: blocker
