      side: head
    entries:
      - _ulid: 01KXRYGTX4BPEGFGPRNK935G8M
        author: Jacob Chapel
        body: "MUST-FIX — Cache invalidation does not itself block the task, but this block tells every
          reader to inspect a blocked task and run task unblock. Evidence: the new behavioral test
          at tests/dispatch-operator-docs.test.ts:2005 and :2026 calls ensureWorkspaceBootstrap for
          prior-bootstrap-failed, bootstrap-config-changed, and canonical-branch-head-changed; both
          reruns succeed and return the invalidation reasons without any DispatchEngine failure or
          task block. Only a later bootstrap error enters the catch at
          src/agent-runtime/dispatch.ts:4146-4167 and blocks the task. Impact: a normal successful
          invalidation is documented as a failure, and task unblock is invalid when the task was
          never blocked. Make the observation, recovery, and healthy outcome conditional: allow
          successful automatic rerun; require unblock only when that rerun actually failed and the
          task note/status shows blocked. Extend the behavioral documentation assertion so this
          distinction cannot regress."
        created_at: 2026-07-17T21:08:05.156Z
    kind: blocker
  - _ulid: 01KXRYH18C1JAPQQ8Z4QZM3463
    anchor:
      type: code
      commit: 4109f86c5496c238583c213a8c10ac3bbafafe80
      line_end: 65
      line_start: 59
      path: docs/troubleshooting/dispatch-workspace-sync-and-cleanup.md
      side: head
    entries:
      - _ulid: 01KXRYH18DNQ2JK7KRT9264HMW
        author: Jacob Chapel
        body: "MUST-FIX — The path-collision recovery fixes the filesystem/configuration cause but omits
          restoring the task that dispatch blocks on workspace provisioning failure. Evidence: every
          provisionDispatchWorkspace exception is followed by a DISPATCH-WORKSPACE note and task
          block at src/agent-runtime/dispatch.ts:4098-4119;
          tests/agent-dispatch-engine.test.ts:1606-1654 behaviorally proves that recovery state.
          Impact: after moving unrelated content or correcting dispatch.worktree_root, the task
          remains blocked and cannot be selected, so the published procedure never reaches its
          stated healthy outcome. After the collision is corrected, instruct the operator to run
          kspec task unblock @task-ref, and add behavior-backed documentation coverage for
          provisioning-failure block/unblock rather than checking only command help and section
          shape."
        created_at: 2026-07-17T21:08:11.661Z
    kind: blocker
