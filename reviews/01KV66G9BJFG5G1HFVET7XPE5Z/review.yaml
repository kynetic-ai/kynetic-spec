    entries:
      - _ulid: 01KV66QB8F0F48HDAZ46WVV9GK
        author: Jacob Chapel
        body: "MUST-FIX: operator actor-map values are returned and persisted verbatim instead of being
          validated or normalized to a canonical identity/default. `loadOperatorActorMap` accepts
          any non-empty string, and this resolver returns `opExact`/`opNormalized` directly, so a
          map like `Hermes: not-a-real-actor` rewrites an actor field to `not-a-real-actor`. I
          verified this with an ad hoc temp-project run of `runActorNormalization`: the report
          recorded `resolutionSource: operator_mapping` and the inbox `added_by` field persisted
          `not-a-real-actor`. That violates @actor-history-normalization ac-5 (post-run inventoried
          fields are canonical or declared default) and breaks ac-3/idempotency exactly as the new
          upgrade guide warns on docs/guides/upgrading-kspec.md:135. Please either reject
          non-canonical operator mapping targets or classify/normalize recognizable target aliases
          to their canonical IDs before writing."
        created_at: 2026-06-15T17:54:29.263Z
    kind: blocker
  - _ulid: 01KV67D6WV5SBBE5DXSVGQHCGS
