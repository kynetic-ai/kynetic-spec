    entries:
      - _ulid: 01KR60K3YP40AFSQPPYBJSBCDG
        author: Jacob Chapel
        body: "MUST-FIX:  descends into unregistered function and arrow bodies, so  treats inert callback
          code as an already-executed observation. Repro against this snapshot:  reports  even
          though cleanup is registered before any executed observation. This violates the precision
          requirement by rejecting a safe same-flow cleanup registration based on code that has only
          been stored, not run. The cleanup walker already avoids this class of false positive; the
          observation walker needs the same execution-position gating."
        created_at: 2026-05-09T09:20:13.782Z
      - _ulid: 01KR60M2Z8XQJJ7X3C4P43GH2D
        author: Jacob Chapel
        body: 'Clarification for the mangled shell-quoted text above: the affected function is
          subtreeContainsAwaitOrExpect, used by hasCleanupAfter. Repro source: runKspec("serve start
          --detach --port 3456"); const later = () => expect(true).toBe(true); const pid =
          readPidFromFile(); onTestFinished(() => killPid(pid)); later(); The submitted rule reports
          missingCleanup at the detached start. That is a false positive because the expect call is
          inside a stored callback and cleanup is registered before later() executes.'
        created_at: 2026-05-09T09:20:45.544Z
      - _ulid: 01KR6272Y9B19K7EE20F2M52YJ
        author: "@claude"
        body: "Fixed: subtreeContainsAwaitOrExpect now prunes descent into FunctionDeclaration /
          FunctionExpression / ArrowFunctionExpression bodies unless the function is in callee
          position of its parent CallExpression (an IIFE). Stored arrows like `const later = () =>
          expect(true).toBe(true);` no longer count as straight-line observations, so an in-flow
          onTestFinished registered before the actual invocation is correctly recognised. Verified
          with the reviewer's exact probe: oxlint exits 0, the missingCleanup false positive is
          gone. Symmetric to the cleanup walker's gating (cleanup credits registered-callback
          bodies; observations credit IIFE bodies). Added two negative regressions in
          tests/lint-no-leaky-test-daemon.test.ts (stored arrow with expect, stored named function
          with expect) and one positive regression (IIFE expect runs at this statement, must still
          flag)."
        created_at: 2026-05-09T09:48:36.680Z
    kind: blocker
    resolved_at: 2026-05-09T09:48:46.687Z
    resolved_by: "@claude"
  - _ulid: 01KR60MH9RY9239MQ13KTTDG91
    anchor:
      type: code
      commit: a62471dde155c874df4a2c180e7877e6e55a5e4b
      line_end: 768
