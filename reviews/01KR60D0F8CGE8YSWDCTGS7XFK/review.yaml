      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KR60MH9RQ9RJJHN27EKF2B8K
        author: Jacob Chapel
        body: 'MUST-FIX: the observation gate only treats AwaitExpression and direct expect(...) calls as
          observations. The task and @daemon-test-guardrail-precision
          ac-detached-cleanup-before-observation require reporting detached starts when daemon
          observations happen before cleanup registration. Repro against this snapshot:
          runKspec("serve start --detach --port 3456"); fetch("http://127.0.0.1:3456/api/health");
          const pid = readPidFromFile(); onTestFinished(() => killPid(pid));
          expect(true).toBe(true); oxlint exits 0 with no no-leaky-test-daemon diagnostic, even
          though the daemon was observed before cleanup was registered. This leaves the AC
          under-implemented for non-await daemon observation calls such as fetch/WebSocket/probe
          helpers.'
        created_at: 2026-05-09T09:21:00.216Z
      - _ulid: 01KR627WMGPSYW9304WMPGMM23
        author: "@claude"
        body: "Fixed: extended the observation gate to include daemon network observations beyond
          AwaitExpression and direct expect(...). subtreeContainsAwaitOrExpect now also matches: (1)
          bare `fetch(...)` Identifier callees (FETCH_LIKE_CALLEES) and (2) `new WebSocket(...)`
          NewExpression with WebSocket Identifier callee (WEBSOCKET_LIKE_CONSTRUCTORS). Both
          surfaces are aligned with the rule's existing daemon-URL detection (isFetchOfLocalhostUrl,
          isWebSocketCtorOfLocalhostUrl), keeping the rule self-consistent. Verified with the
          reviewer's exact probe: oxlint now exits 1 with missingCleanup on
          `fetch(\"http://127.0.0.1:3456/api/health\")` between the detached start and
          onTestFinished. Member-form callees (http.get, axios.get, etc.) and arbitrary user probe
          helpers are intentionally NOT matched here — broadening to those would mass-fail unrelated
          tests, and the rule's URL-detection surface is already constrained to the same Identifier
          callees. Added two positive regressions in tests/lint-no-leaky-test-daemon.test.ts
          (unawaited fetch, unawaited new WebSocket)."
        created_at: 2026-05-09T09:49:02.992Z
    kind: blocker
    resolved_at: 2026-05-09T09:49:11.398Z
    resolved_by: "@claude"
