    entries:
      - _ulid: 01KSS0F0ZJ0QQH1SD2S4M5559P
        author: Jacob Chapel
        body: 'MUST-FIX: Dispatch occupied-target sync misclassifies untracked overwrite hazards as
          divergence. classifyTargetWorktreeCheckout only checks tracked and staged changes before
          returning an occupied checkout as eligible. In a temp repo reproduction, I put an
          untracked file in the eligible dev checkout with the same path as a new remote commit,
          then ran DispatchEngine._syncTarget(). The result was "diverged" and degraded state kind
          "divergence" with reason "remote history appears rewritten" plus reset guidance; it did
          not name the occupied checkout or tell the operator to clean/stash/detach it. That
          violates @dispatch-integration-mutation-scope
          ac-dirty-occupied-target-refusal-identifies-blocker and @dispatch-remote-branch-sync
          ac-unsafe-occupied-checkout-degraded-recovery, and can send an operator toward resetting
          the target branch instead of cleaning the local untracked blocker.'
        created_at: 2026-05-29T04:39:15.698Z
    kind: blocker
  - _ulid: 01KSS0F34QBN1YAGYANYWXZFFF
    entries:
