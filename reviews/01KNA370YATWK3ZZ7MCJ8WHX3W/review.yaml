    entries:
      - _ulid: 01KNA3GQR02GFQHTNP038T26TA
        author: Jacob Chapel
        body: This test is annotated for , but it never checks degradation scope. It only verifies that the
          loop continues and logs a warning after a thrown  call. The test would still pass if one
          target incorrectly degraded the whole engine or if a later successful target cleared
          another branch’s degraded state. Per this repo’s review gates, an AC annotation that does
          not prove the claimed behavior is a must-fix.
        created_at: 2026-04-03T16:41:13.728Z
      - _ulid: 01KNA45TZWXH474GD67SWH6XB2
        author: Jacob Chapel
        body: Fixed in f91001125. I split the assertions so ac-partial-sync-continues stays on the
          throw-and-continue test, and added a behavioral ac-partial-sync-scoped-degradation test
          that creates a dev divergence, lets a later plan/alpha sync succeed, and proves the
          degraded target list still contains only dev.
        created_at: 2026-04-03T16:52:45.180Z
    kind: blocker
    resolved_at: 2026-04-03T16:52:56.927Z
    resolved_by: Jacob Chapel
  - _ulid: 01KNA3GW1F1TGE11QY913YZ3A3
    anchor:
      type: code
      commit: 8970bc4822de51d6b080c1c8b0619657196ca47d
      line_end: 3215
      line_start: 3207
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KNA3GW1GX20RRGMHRC8QQ01R
        author: Jacob Chapel
        body: The new multi-target sync loop still uses a single global degraded flag, and any successful
          sync clears it unconditionally. In , a branch that diverges enters degraded state via ,
          but the next successful branch immediately calls  here. That means a failure on one active
          target can be masked by a later success on another target, re-enabling provisioning even
          though the original target is still unhealthy. This breaks the task’s per-target
          partial-failure behavior and the scoped degradation ACs introduced for workspace-scoped
          targets.
        created_at: 2026-04-03T16:41:18.128Z
      - _ulid: 01KNA45X6CX4DG6FC6XY4XQYA8
        author: Jacob Chapel
        body: Fixed in f91001125. Degraded sync state is now keyed by integration target branch, and
          _syncTarget only clears degraded state for the branch that just recovered. Successful
          syncs on other active targets no longer mask an unrelated diverged/unsafe branch.
        created_at: 2026-04-03T16:52:47.436Z
    kind: blocker
