threads:
  - _ulid: 01KNXXN5C4YR0HVQPDTBPY6D1M
    anchor:
      type: structured
      ref: "@default-project-agents-and-conventions"
      section: traits
    entries:
      - _ulid: 01KNXXN5C4H2HPHX7QSZFGVD44
        author: Jacob Chapel
        body: "@trait-idempotent-scaffold currently conflicts with this spec's stated force behavior. The
          inherited trait contract says force replaces existing artifacts after backing them up, but
          ac-force-reseed says force only recreates missing defaults and leaves existing or renamed
          items untouched. The same trait is also attached to @default-session-reflection-hook and
          @complete-auto-gitignore, where the plan likewise avoids overwrite-style force semantics,
          while @derivable-default-module is treated as a scaffolded item in the upgrade task but
          does not implement the trait. Tighten the trait's scope or reassign it so inherited ACs
          match each scaffolded spec's actual force/idempotency model."
        created_at: 2026-04-11T09:23:35.940Z
    kind: blocker
  - _ulid: 01KNXXNECR4XJZEPDDJ4AT0722
    anchor:
      type: structured
      ref: "@default-session-reflection-hook"
      section: dependencies
    entries:
      - _ulid: 01KNXXNECSKCV53RMRKCYWNPDJ
        author: Jacob Chapel
        body: The reflection-hook simplification is not carried through consistently. The spec and task now
          say the hook is universal and no longer needs per-agent identifiers, and the task no
          longer declares a depends_on edge, but the implementation notes still state that the
          default reflection hooks task depends on default agents and conventions because it looks
          up primary agent identifiers. That leaves the plan with two incompatible dependency
          stories for the same task. Update the dependency notes to match the simplified model so
          task ordering and rationale are unambiguous.
        created_at: 2026-04-11T09:23:45.177Z
    kind: blocker
