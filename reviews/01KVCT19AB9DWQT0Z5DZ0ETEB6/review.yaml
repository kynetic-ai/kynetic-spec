    entries:
      - _ulid: 01KVCV1F28903B7V77PH8QC5DD
        author: Jacob Chapel
        body: "MUST-FIX: this bootstrap recovery path still silently discards a direct bookkeeping mutation
          failure. If  rejects, the empty catch hides the underlying error detail, so an operator
          sees only the bootstrap failure and not the failed block mutation. That violates
          @dispatch-mutation-transparency ac-3, which requires every dispatch-initiated bookkeeping
          mutation failure to write the underlying error description to the operator-visible log and
          never be silently discarded. Route this through the same logged recovery path used for
          workspace provisioning/validation, or log  here."
        created_at: 2026-06-18T07:44:58.952Z
      - _ulid: 01KVCV397EZYRVWH79WD6K0JK3
        author: Jacob Chapel
        body: "Clarification: the swallowed rejection is from _blockTask(), and the logged detail should
          include the underlying error, e.g. by passing the caught error through
          describeBookkeepingError(err). The core issue remains that the catch at lines 2734-2735 is
          empty."
        created_at: 2026-06-18T07:45:58.510Z
    kind: blocker
