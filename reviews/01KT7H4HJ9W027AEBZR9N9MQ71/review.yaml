    entries:
      - _ulid: 01KT7H9D06FMBT4AM9GKG8HDZ8
        author: Jacob Chapel
        body: 'MUST-FIX: `ANSI_ESCAPE_PATTERN` does not consume OSC terminal escape sequences with arbitrary
          payloads, such as terminal hyperlinks (`ESC]8;;https://example.com BEL`). Evidence:
          running `processTextChunk(createSessionState(),
          "\u001b]8;;https://example.com\u0007link\u001b]8;;\u0007\n")` in this snapshot produces
          `ttps://example.comlink` instead of `link`. This leaves mangled terminal escape payload
          text in the compact Active Fleet preview, so the task requirement to strip ANSI/CSI
          terminal escape sequences before display is not fully satisfied. Add behavioral coverage
          for OSC/BEL (and ideally ST-terminated OSC) and strip the entire sequence before applying
          backspaces/control-character cleanup.'
        created_at: 2026-06-03T20:02:39.238Z
      - _ulid: 01KT7KW1KVXYFW61FMDTFEPSJA
        author: "@claude"
        body: "Fixed in this fix cycle. Root cause: ANSI_ESCAPE_PATTERN had a single mega-regex whose
          alternation only consumed alphanumeric + semicolon payload bytes before BEL, so URL
          payloads like https://example.com would break the match and leave URL bytes (and the
          BEL/second OSC remnant) in the preview. Replaced the single pattern with three focused
          patterns applied in order: (1) OSC_PATTERN: matches \\x1b] or 0x9D, non-greedy arbitrary
          payload (incl. punctuation), terminator BEL | ESC\\\\ (ST) | 0x9C | end-of-line; (2)
          CSI_PATTERN: structured CSI grammar (params 0x30-0x3F, intermediates 0x20-0x2F, optional
          final 0x40-0x7E); (3) ESC_PATTERN: any remaining Fp/Fe/Fs 2-byte sequences plus stray ESC.
          OSC strip runs before \\r split (its payload may contain \\r) and before CSI/ESC strip.
          Added five behavioral regression tests in tests/web-ui/fleet-buffer.test.ts:
          BEL-terminated hyperlink (your exact case), ST-terminated, single-byte ST, split OSC
          across chunks staying buffered, and URL payload with colons/slashes/dots/query. All 25
          fleet-buffer tests pass; full suite passes (2681/2681 suites, 10231/10236 tests, 5
          pre-existing skipped); format/lint/focused-lint/typecheck/kspec validate all pass."
        created_at: 2026-06-03T20:47:47.323Z
    kind: blocker
    resolved_at: 2026-06-03T20:47:55.543Z
    resolved_by: "@claude"
