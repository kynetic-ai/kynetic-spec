    entries:
      - _ulid: 01KM7XADYVH0VS8EYZQJVHXS0J
        author: Jacob Chapel
        body: "When deleteTask runs under the manager-owned write buffer, this direct fs.rm executes before
          the manager flushes the buffered index/task deletions. If buffer.flush() later fails in
          TaskDataManager.withWriteBuffer(), the task directory has already been removed while the
          index update is still buffered, so the operation is no longer atomic and cannot roll back
          cleanly. That violates @task-atomic-writes ac-2 for delete flows. Evidence: manager-owned
          buffering is activated in task-data-manager.ts:886-889, but the directory removal here
          happens outside that buffer lifecycle."
        created_at: 2026-03-21T09:58:44.955Z
    kind: blocker
