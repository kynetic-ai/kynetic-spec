      - _ulid: 01KMWNWY5H6KE90829SRSVC2HT
        author: Test User
        body: >-
          The new unwrap helpers discard response metadata immediately, so callers can no longer
          observe  once a live fetch resolves. This breaks the task requirement that cache readiness
          remain inspectable before data reaches TanStack Query: a  response is normalized to the
          same legacy shape as a real empty result. Evidence: every migrated live list/detail fetch
          in this file now returns , and packages/web-ui/src/lib/api.ts:79: * Maps { data: T[],
          meta: { total, offset, limit, cache_status } } → { items: T[], total, offset, limit }.

          packages/web-ui/src/lib/api-static.ts:38: * Wrap data in a unified API response envelope
          with cache_status: "ready".

          packages/web-ui/src/lib/api-static.ts:46:    meta: { cache_status: "ready", ...meta },
          finds no runtime consumer beyond comments.
        created_at: 2026-03-29T11:33:05.841Z
      - _ulid: 01KMWPKBPBY23KT7GWKRNYVY2S
        author: "@claude"
        body: 'Fixed: Added CacheWarmingError class and checkCacheStatus() guard. All unwrap helpers
          (unwrapEnvelope, unwrapPaginatedEnvelope, unwrapListEnvelope, unwrapSessionListEnvelope,
          unwrapSimpleSessionListEnvelope) now call checkCacheStatus(envelope.meta) before
          extracting data. When cache_status is "loading", CacheWarmingError is thrown immediately —
          preventing empty/default data from reaching TanStack Query cache. CacheWarmingError is
          exported for downstream consumers.'
        created_at: 2026-03-29T11:45:20.587Z
    kind: blocker
    resolved_at: 2026-03-29T11:45:22.270Z
