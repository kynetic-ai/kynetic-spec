    entries:
      - _ulid: 01KN6EQ7XKVJQXRNFJCFZ1VK5H
        author: Jacob Chapel
        body: "Human output now exposes whether derive will include tasks (for example, 'Tasks: included
          (default)' or 'Tasks: skipped (--no-tasks)'), but the JSON payload emitted from the same
          code path still has no equivalent field. Repro in a temp fixture: 'plan derive
          @plan-dry-run-task-mode --dry-run' prints that line, while the same command with '--json'
          returns only plan_ref/module_ref/plan_branch/created_specs/created_tasks/skipped/errors.
          Because this command inherits @trait-json-output ac-2, adding new human-readable state
          without adding it to JSON is a correctness regression for JSON consumers and leaves the
          new dry-run confirmation unavailable in structured output."
        created_at: 2026-04-02T06:40:03.507Z
      - _ulid: 01KN6FHRA2M79H98AVE4PPAM7B
        author: Jacob Chapel
        body: "Fixed in 8d178dfefb4fd68c9824de23346c9064214c99aa: added tasks_included to plan derive JSON
          results so the new task-mode summary is available in structured output as well as human
          output, and added CLI coverage for both default and --no-tasks dry-run JSON responses."
        created_at: 2026-04-02T06:54:32.258Z
