    entries:
      - _ulid: 01KV5XJQ2HGXK458GVD1VG142Q
        author: pr-reviewer
        body: "MUST-FIX: `kspec upgrade --dry-run` skips historical actor normalization for projects that
          still need storage promotion, so operators cannot preview the actor rewrites before the
          real upgrade. The implementation returns `skipped` whenever
          `plan_storage`/`review_storage` are not already folder-backed. I reproduced this with a
          temp initialized project whose manifest had `plan_storage` and `review_storage` removed
          and whose module had `created_by: '@claude'`: `kspec upgrade --dry-run --force --json`
          returned success true and `Historical actor normalization` status `skipped` with `storage
          migration must run first`, with no `details.rewrites`. That violates
          @actor-history-normalization ac-4 and the new upgrade docs promise that dry-run reports
          every rewrite it would perform. It also prevents users from seeing unresolved originals
          and preparing `--actor-map` before they commit to the migration."
        created_at: 2026-06-15T15:14:40.337Z
      - _ulid: 01KV61SJJR5DBDEQT6DCA1ECY0
        author: "@claude"
        body: >-
          Fixed. The step no longer skips when storage is not yet folder-backed. Root cause: the
          review/plan handlers used folder-only loaders and the whole step was gated on
          task_storage=split AND plan_storage=folder AND review_storage=folder, so a --dry-run on an
          un-promoted project returned 'skipped' with no preview.


          Changes:

          - Review/plan handlers now use the format-aware loaders/savers
          (loadReviewRecords/saveReviewRecord, loadPlans/savePlan), which read folder-backed storage
          when declared and the monolithic file on legacy projects.

          - The storageReady gate now only short-circuits a real (non-dry-run) run; a --dry-run
          preview proceeds on any layout, since it only reads.

          - Record kinds whose storage cannot be read yet (e.g. legacy task storage the split
          backend refuses) are deferred in dry-run and surfaced on steps[].details.deferred_kinds
          and in the step message, instead of crashing the preview. A real run rethrows on load
          failure (it only executes after storage promotion).


          Reproduces your exact case now: a project with plan_storage/review_storage removed and a
          module created_by='@claude' returns status 'done' with rewrite_count>0 and the spec_item
          rewrite in details.rewrites; review/plan are listed under deferred_kinds. Covered by a new
          behavioral test in tests/actor-normalization-upgrade.test.ts ('previews actor rewrites and
          modifies nothing, deferring kinds it cannot read yet') and the upgrade docs were updated
          to describe the preview/deferred-kinds behavior.
        created_at: 2026-06-15T16:28:19.415Z
    kind: blocker
