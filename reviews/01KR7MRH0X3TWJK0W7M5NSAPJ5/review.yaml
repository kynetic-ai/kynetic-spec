    entries:
      - _ulid: 01KR7MZP0C0H99864RB0WDB0JY
        author: Jacob Chapel
        body: "MUST-FIX: local helper-like abstractions are still only partially covered.  recognizes
          FunctionDeclaration and variable-bound function/arrow wrappers, but not object/class
          method wrappers. I confirmed with a manual oxlint probe that an ordinary test file
          containing  exits 0 with no  diagnostic. That is a local helper-like abstraction, not an
          approved shared fixture or documented guardrail internal, and it hides the daemon startup
          behind a wrapper while satisfying cleanup internally. This violates
          @daemon-test-guardrail-precision ac-approved-daemon-helper-boundary-explicit; the
          helper-boundary detection needs to include method/property forms (and equivalent
          class/object helper shapes) or otherwise report these wrapped starts."
        created_at: 2026-05-10T00:35:51.436Z
      - _ulid: 01KR7N0S5F5F3DKNE4EEY4B20V
        author: Jacob Chapel
        body: 'Correction to preserve the probe text after shell interpolation: the missing case is a local
          object-method helper. Probe source shape: const daemonHelper = { start() { runKspec("serve
          start --detach --port 3456"); const pid = readPidFromFile(); onTestFinished(() =>
          process.kill(pid, "SIGTERM")); } }; then the test body calls daemonHelper.start();
          expect(true).toBe(true). The manual oxlint run exited 0 with "Found 0 warnings and 0
          errors." The helper is neither tests/helpers/daemon.ts nor a documented guardrail
          internal, so ac-approved-daemon-helper-boundary-explicit still has a false negative for
          method/property helper wrappers.'
        created_at: 2026-05-10T00:36:27.439Z
      - _ulid: 01KR7PTKER61CJKJB8M36T97VR
        author: "@claude"
        body: Fixed in cycle 10. Extended isInHelperFunction in tools/eslint-rules/no-leaky-test-daemon.js
          to recognize function/arrow expressions whose parent is a Property (object-method
          shorthand and longhand value forms), MethodDefinition (class methods, instance/static),
          PropertyDefinition (class-field arrows/functions), or a plain '=' AssignmentExpression
          whose LHS is an Identifier or MemberExpression. Manual oxlint probe against the cycle-9
          reviewer source (object shorthand daemonHelper.start with internal cleanup) now exits 1
          with localWrapperUnsafe; added regression tests for the shorthand probe, longhand-fn
          property, arrow property, class instance method, static class method, class-field arrow,
          and assignment-to-member shapes, plus an allowed-narrow control proving the
          path-allowlisted shared fixture stays exempt. Diagnostic message updated to name
          'function, arrow, or method'.
        created_at: 2026-05-10T01:08:02.127Z
    kind: blocker
