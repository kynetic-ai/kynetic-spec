    entries:
      - _ulid: 01KXHXKZH4122YWESWV24BH7JH
        author: Jacob Chapel
        body: "MUST-FIX: Same-revision divergent commits can be promoted into a newer publication. This
          guard rejects only revisions lower than the published token. A committed snapshot with the
          same revision but different control content is ignored by reloadCommitted, yet mutate then
          accepts that snapshot as current, increments it, and publishes the stale authority under a
          new revision. Isolated temp-git evidence: published revision 4/running; external committed
          revision 4/paused; reload retained revision 4/running; the next no-op-shaped mutation
          produced revision 5/paused. That violates the monotonic revision contract and
          ac-stale-control-is-not-visible. Reject equal-revision divergent snapshots while still
          allowing equal snapshots at a later HEAD caused by unrelated shadow commits, and add a
          behavioral regression test covering both cases."
        created_at: 2026-07-15T03:37:38.596Z
    kind: blocker
