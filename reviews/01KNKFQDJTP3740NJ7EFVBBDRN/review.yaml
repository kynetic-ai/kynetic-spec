    entries:
      - _ulid: 01KNKFSAVV9W2WPFTJXYGXWKB1
        author: "@claude"
        body: This task's dependency set is still incomplete for the allowlist it proposes. The allowlist
          includes , but  calls  when rendering that command, and the only task in this plan that
          makes that loader cache-backed is @task-cache-task-history. As written, Phase 6 can be
          executed after the listed prerequisites and still let an allowlisted read command fall
          back to disk for history reads, which breaks the cache-backed concurrency assumption.
          Either remove  from the initial allowlist or add @task-cache-task-history as an explicit
          dependency and prerequisite in the task description.
        created_at: 2026-04-07T08:08:48.251Z
    kind: blocker
  - _ulid: 01KNKFSAWYAAVW0BGVM0X24R14
    anchor:
      type: structured
      ref: "@task-read-command-concurrency"
      section: description
    entries:
      - _ulid: 01KNKFSAWZC52H8Z1DA8X95Q0X
        author: "@claude"
        body: This task still drifts from the new spec contract. @daemon-concurrent-reads
          ac-concurrent-cache-reads says concurrent execution is allowed when a command's required
          cache domains are ready, but the What/How text here tells the implementer to require that
          all cache domains are ready before skipping the mutex. That would keep unrelated cold
          domains (for example inbox while running review get) from ever allowing concurrency, so
          the plan would implement a stricter behavior than the spec it claims to cover. Tighten the
          task to compute readiness per allowlisted command based on the domains that command
          actually touches.
        created_at: 2026-04-07T08:08:48.287Z
    kind: blocker
