    entries:
      - _ulid: 01KRE7A7N2GENH92P7EAVZXWM0
        author: Jacob Chapel
        body: "MUST-FIX: local helper definitions are trusted even when their binding is only initialized
          after an intervening observation.  scans every statement in the enclosing block and
          returns a function/arrow declarator without considering source order relative to the
          cleanup registration or the next /await. I verified with a synthetic fixture:  currently
          produces . If the assertion fails before the  initializer runs, the cleanup callback
          throws/has no callable helper and the detached daemon is not terminated. This violates
          @daemon-test-guardrail-precision ac-detached-cleanup-before-observation and
          ac-cleanup-helper-origin-is-trusted; the helper must only satisfy cleanup when its
          callable terminating binding is available before the first later observation, or this
          shape must be reported as missing scoped cleanup."
        created_at: 2026-05-12T13:51:38.146Z
      - _ulid: 01KRE7BNVNW0ZR413HVJQXB1ZQ
        author: Jacob Chapel
        body: 'Clarification for the blocker: the missing identifiers in the original comment are
          findLocalHelperDefinition and expect. The synthetic fixture was: runKspec("serve start
          --detach --port 3456"); const pid = readPidFromFile(); onTestFinished(() => killPid(pid));
          expect(true).toBe(true); const killPid = (p: number): void => process.kill(p, "SIGTERM");.
          Current output was Found 0 warnings and 0 errors. That proves the rule trusts a local
          helper function expression whose binding is not initialized until after an observation
          that can fail, so the cleanup callback may not have a callable terminating helper when
          teardown runs.'
        created_at: 2026-05-12T13:52:25.460Z
      - _ulid: 01KRE9H702F14WB1K03PV8EAGZ
        author: "@claude"
        body: 'Fixed in commit f2d28b784. findLocalHelperDefinition now classifies a matched
          VariableDeclarator-with-function-init as LOCAL_BINDING_OPAQUE when its declarator
          statement is not strictly before the use sites containing statement in the same enclosing
          block. FunctionDeclarations remain exempt because they are hoisted with their value to the
          start of the enclosing scope. Verified the reviewers exact synthetic probe (runKspec(serve
          start --detach), const pid, onTestFinished(() => killPid(pid)), expect(true).toBe(true),
          const killPid = (p) => process.kill(p, "SIGTERM")) via npx oxlint: now reports
          missingCleanup. Added 5 positive regressions (const arrow after, const function expression
          after, let arrow after, describe-scope const after afterEach, program-level const after
          describe) and 2 negative companions (hoisted function declaration still accepted,
          const-before-registration still accepted).'
        created_at: 2026-05-12T14:30:24.001Z
    kind: blocker
    resolved_at: 2026-05-12T14:30:27.543Z
