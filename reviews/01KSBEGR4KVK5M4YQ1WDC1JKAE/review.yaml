        author: Jacob Chapel
        body: "MUST-FIX: This test is annotated as covering @folder-backed-review-storage-1
          ac-review-screenshot-resource-loads-in-ui, but it only calls the parser resource resolver
          and asserts a filesystem path. The AC requires the screenshot to be discoverable and
          loadable when the review is opened in the web UI or exported to the static UI snapshot, so
          this is coverage at the wrong abstraction layer and can mark the UI/static behavior
          covered while no review UI route, resource URL, or static exported asset path is
          exercised. Replace this with behavioral UI/static coverage for the AC, or remove the false
          AC annotation from this task and leave that AC to the dedicated review screenshot resource
          UI task."
        created_at: 2026-05-23T22:22:22.448Z
      - _ulid: 01KSBH1KYE10DVTECTZ4SZRX7V
