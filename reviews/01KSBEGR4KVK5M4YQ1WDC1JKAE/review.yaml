        body: "Fixed in 48a17f7b79. Took the second remediation path: removed the over-claimed `// AC:
          @folder-backed-review-storage-1 ac-review-screenshot-resource-loads-in-ui` annotation from
          tests/parser-reviews-folder.test.ts:408 and updated the file header to make explicit that
          the UI/static AC is owned by @task-review-screenshot-resource-ui (which covers the daemon
          GET /api/reviews/:ref/resources/:resourceId/bytes route, web UI preview, and static export
          copying under assets/resources/review/<review-ulid>/). The screenshot test still validates
          the parser-layer trait ACs ac-resource-reference-resolves-within-owner and
          ac-resource-metadata-exposes-safe-preview-fields, which is the correct abstraction layer
          for this storage-manager task."
