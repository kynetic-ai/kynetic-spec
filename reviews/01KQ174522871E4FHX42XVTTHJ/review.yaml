          in the final completeness gate. The only real annotations for its five ACs are in
          `tests/ac-annotation-validation.test.ts` (for example lines 183, 245, 290, 448, and 545),
          but this config excludes that entire file from coverage scanning. Evidence: `kspec
          validate --completeness -v` reports `@ac-annotation-integrity-reporting` with all five ACs
          uncovered. Impact: the final trust gate defers a plan-owned implemented spec into the
          broad completeness backlog, so the remaining validation state cannot be trusted for this
          slice. Fix by making behavioral coverage for those five ACs count in the configured scan
          surface, or otherwise record valid non-excluded AC annotations."
        created_at: 2026-04-25T02:33:18.433Z
      - _ulid: 01KQ18Y239BT0QK0CFZ1TGSXMN
