      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXK5EJZ650CXV3TP7Y3XYWH0
        author: Jacob Chapel
        body: MUST-FIX — A failed ownership handoff decrements the active count of a different invocation.
          creationAdmitted becomes true as soon as _admitInvocationCreation returns (lines
          4112-4114), before _publishPersistedInvocationOwnership increments activeCount. When
          agent.dispatched persistence fails, _failInvocationOwnership only removes the reservation,
          but this common finally block still decrements activeCount. With one already-active
          invocation for the same agent and max_concurrent greater than one, the failed second spawn
          changes the count from 1 to 0, so status violates ac-status-reports-active-count and the
          scheduler can over-admit later work. The current failure-path test starts with no other
          active invocation, so the fallback-to-1 decrement masks this regression. Track whether
          ownership was actually published, and add a behavioral test with another active
          invocation.
        created_at: 2026-07-15T15:13:44.935Z
    kind: blocker
  - _ulid: 01KXK5ERAP4K75MGT83Y4NSKY4
    anchor:
      type: code
      commit: 676182f47b0680e3e8a60d8ab068fafe4fc0a4a1
      line_end: 1851
      line_start: 1848
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXK5ERAPKV5DCE1Z5XE28XY0
        author: Jacob Chapel
        body: "MUST-FIX — Stop silently treats unreadable active-session ownership as no work and reports
          successful cleanup. getSession returns null for missing or invalid session metadata, and
          this loop simply skips that session. I reproduced this with an active dispatch-owned
          session directory whose session.yaml was removed: applyGlobalLifecycleAction(stop)
          returned {outcome: applied, authority: stopped}, emitted zero process-group signals, and
          reported cleanup {status: idle, entries: []}. This loses the ac-stop-cancels-active-work
          and ac-stop-failure-reports-pending-cleanup/no-success guarantees; task-scoped stop has
          the same collection path. An unreadable candidate must produce durable failed/pending
          cleanup (without signaling unverified ownership), not successful idle cleanup, and needs
          behavioral coverage for missing/corrupt metadata."
        created_at: 2026-07-15T15:13:50.422Z
    kind: blocker
  - _ulid: 01KXK5F8Y3J0SC498CRJKYZAC3
    entries:
