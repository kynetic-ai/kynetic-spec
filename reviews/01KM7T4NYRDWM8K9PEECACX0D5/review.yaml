    entries:
      - _ulid: 01KM7TF020XPG5CCNEQNGFVHKK
        author: Jacob Chapel
        body: "rebuildIndex() is implemented only on the concrete split backend. There is still no supported
          way to request a rebuild through TaskStorageBackend, TaskDataManager, or any CLI/API path,
          and the only callers in this snapshot are tests importing splitBackend directly. That
          means AC-7 is not actually satisfied for real callers yet: production code cannot trigger
          the rebuild when drift is detected. Please expose this through the manager/public surface
          and verify that public entrypoint instead of a test-only direct backend call."
        created_at: 2026-03-21T09:08:48.832Z
