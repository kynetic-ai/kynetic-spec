      - _ulid: 01KM7TD7AYPM46BKYNMSM9F0QR
        author: Jacob Chapel
        body: "The new index projection writes plan_ref and review_ref, but the summary path still drops
          both fields: TaskSummary/rawToSummary() only expose spec_ref. Once split storage is
          activated, listTasks() will therefore stop returning plan_ref-linked tasks to plan-summary
          consumers and lose review_ref data from list surfaces, even though this task explicitly
          marked those refs as indexed. Please carry the new indexed fields through the summary
          type/parser and add a split-backend coverage test for listTasks()/task list --json."
        created_at: 2026-03-21T09:07:50.750Z
    kind: blocker
  - _ulid: 01KM7TF0205GPVAKQ1PX39ZEFQ
