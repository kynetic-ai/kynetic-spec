    entries:
      - _ulid: 01KXKT66TFGY7VD0TN7K2497X3
        author: Jacob Chapel
        body: "MUST-FIX — the new per-session ownership lock serializes only mutateSessionDispatchOwnership
          calls, while closeSession and other metadata mutators still perform independent
          read/modify/whole-file writes. Reproduction against this head: start closeSession on a
          1,000,000-line event log, wait 10 ms, persist ownership with exited_at, then await close;
          3/3 runs ended with status=completed but dispatch_ownership.exited_at=null. Because
          _collectStopTargets prefers session.yaml ownership and consults the ownership archive only
          when metadata itself is missing, a normal close racing verified exit publication can erase
          the durable exit proof and make restart/stop recovery rediscover a finished invocation as
          unresolved. Serialize all session metadata read-modify-writes with ownership mutation, or
          merge the latest ownership before every metadata write, and add a behavioral concurrency
          regression test."
        created_at: 2026-07-15T21:16:10.447Z
    kind: blocker
  - _ulid: 01KXKT6A911XHWKXF2Z6W2SFYQ
