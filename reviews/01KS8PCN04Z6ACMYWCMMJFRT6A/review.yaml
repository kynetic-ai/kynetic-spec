threads:
  - _ulid: 01KS8PFAJWEDRB3VKEDP4YRRBM
    anchor:
      type: structured
      ref: "@task-plan-resource-import-and-derive"
      section: tasks
    entries:
      - _ulid: 01KS8PFAJWT13DEAXPD85YMDW5
        author: Jacob Chapel
        body: "The plan resource interface is still not specified enough for independent implementation. The
          task names `--json` and `POST /api/plans/:ref/resources`, but it does not define JSON
          success payloads for add/list/get/remove, structured error payload and status mapping, or
          the POST request/upload body. Impact: agents can implement incompatible resource clients
          and tests while using the same route names. Exact fix: define the CLI JSON shapes and API
          request/response schema for each plan resource operation, including `resource_conflict`,
          invalid path, not-found, and delete-confirmation errors."
        created_at: 2026-05-22T20:36:48.860Z
    kind: blocker
  - _ulid: 01KS8PFEJ58C27WZHX1HEJCFDX
    anchor:
      type: structured
      ref: "@task-review-screenshot-resource-ui"
      section: tasks
    entries:
      - _ulid: 01KS8PFEJ5YHQ3C3KV9M0ZC1QC
        author: Jacob Chapel
        body: "Review resources have the same remaining API/JSON ambiguity. The task names the review
          resource commands and routes, but it does not define JSON success payloads, structured
          error payload and status mapping, or the `POST /api/reviews/:ref/resources` request/upload
          body. Impact: review evidence support can diverge from plan resources or from
          documentation. Exact fix: define the review resource CLI JSON shapes and API
          request/response schema, matching the plan resource contract where intended."
        created_at: 2026-05-22T20:36:52.933Z
    kind: blocker
  - _ulid: 01KS8PFJK39XXQD7YGHZKVC97T
    anchor:
      type: structured
      ref: "@task-folder-backed-plan-storage-manager"
      section: tasks
    entries:
      - _ulid: 01KS8PFJK3Y68ZJV1FZ7GD1T4N
        author: Jacob Chapel
        body: "The rebuild-index contract still names `--json` without defining its semantics. The plan and
          review storage-manager tasks define dry-run, repair, and force behavior in human terms,
          but not the JSON payload for no drift, drift, missing-folder conflict, repair result, or
          force-dropped stale entries. Impact: workers can choose incompatible machine-readable
          outputs. Exact fix: define one shared JSON schema for `kspec plan rebuild-index --json`
          and `kspec review rebuild-index --json`, including exit codes and error objects for stale
          or partial layouts."
        created_at: 2026-05-22T20:36:57.059Z
    kind: blocker
  - _ulid: 01KS8PFPK9Z55BHZAACNXAY3VE
    anchor:
      type: structured
      ref: "@task-plan-resource-api-ui-static"
      section: tasks
    entries:
      - _ulid: 01KS8PFPK9SAS7DKTK157V8YM4
        author: Jacob Chapel
        body: "Plan resource route ownership is duplicated. `@task-plan-resource-import-and-derive` says to
          add the exact plan-resource daemon routes, while this API/UI task also says to add
          authenticated/project-scoped resource endpoints for plan resource metadata and bytes.
          Impact: two automation agents can both edit the same route surface or assume the other
          task owns part of it. Exact fix: make one task the owner of plan resource route
          implementation and make the other consume that contract; update Testing and Covers lines
          to match the ownership boundary."
        created_at: 2026-05-22T20:37:01.161Z
    kind: blocker
  - _ulid: 01KS8PFTH8WJ0BCEVEFB9126YN
    anchor:
      type: structured
      ref: "@task-folder-backed-resources-docs"
      section: tasks
    entries:
      - _ulid: 01KS8PFTH8328WRQWJTB2PN3R8
        author: Jacob Chapel
        body: "The documentation task is still not linked to the documentation spec it covers. Its
          `spec_ref` is `@trait-entity-scoped-local-resources`, while its Covers line claims only
          `@folder-backed-resource-documentation` ACs; the documentation spec itself is also
          parented under `@core` even though the existing `@user-documentation` module owns end-user
          docs. Impact: an agent loading the task spec will read the resource trait instead of the
          docs contract, and the new docs behavior lands outside the established docs hierarchy.
          Exact fix: parent `@folder-backed-resource-documentation` under `@user-documentation` or
          the appropriate docs child, and set this task `spec_ref` to
          `@folder-backed-resource-documentation`."
        created_at: 2026-05-22T20:37:05.192Z
    kind: blocker
