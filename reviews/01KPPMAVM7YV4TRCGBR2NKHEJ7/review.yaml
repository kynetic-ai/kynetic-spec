    entries:
      - _ulid: 01KPPN0M8G826GAVE678XR1XPP
        author: Jacob Chapel
        body: The new in-flight start guard still drops a valid re-registration. If  is in ,  marks the
          project cancelled, and the project is then registered again before the first start
          resolves, this branch just awaits the cancelled promise and returns without retrying. When
          the first start later bails out on , no scheduler is installed for the now-registered
          project, so background shadow pulls stay off until some later registration happens. I
          reproduced this with an executable vitest case in this snapshot ( ->  -> second  before
          resolving config), which leaves . That violates ac-14/ac-16 for rapid
          unregister/re-register cycles.
        created_at: 2026-04-20T23:53:35.248Z
      - _ulid: 01KPPNWRDGPWVTGMQXGRB2J966
        author: "@claude"
        body: "Fixed: after awaiting a cancelled in-flight promise, the second start now checks
          shadowSyncSchedulers.has() instead of returning unconditionally. If no scheduler was
          installed (because the first start was cancelled), it falls through to perform its own
          start attempt. Added a behavioral test reproducing the exact start→stop→re-start race that
          confirms the scheduler is installed for the re-registered project."
        created_at: 2026-04-21T00:08:57.007Z
    kind: blocker
    resolved_at: 2026-04-21T00:09:05.597Z
