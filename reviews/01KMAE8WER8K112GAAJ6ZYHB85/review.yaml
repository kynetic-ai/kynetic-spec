        author: Test User
        body: SessionPromptActionRefinedSchema is never used by the real config-loading paths, so
          ActionSchema still accepts a session_prompt action with neither prompt nor
          prompt_template. Hooks, schedules, compositions, and kspec hook add/set all parse through
          ActionSchema, which means invalid session_prompt configs load successfully and only fail
          later at execution time with a No prompt or prompt_template configured error. That
          violates @session-prompt-action-schema ac-1, which requires load-time validation of a
          prompt or prompt template.
        created_at: 2026-03-22T09:36:35.469Z
