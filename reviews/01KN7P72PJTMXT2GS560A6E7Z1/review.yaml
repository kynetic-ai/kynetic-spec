      section: tasks
    entries:
      - _ulid: 01KN7P7ZF0C2B5YVQT8JSEQJR4
        author: "@claude"
        body: The coverage map is incomplete for @daemon-file-monitoring. This task is a test task, but it
          is the only task that claims coverage for ac-6 and ac-8. No implementation task currently
          owns the work for cross-project event isolation or unregistering a project after
          persistent monitoring failure. Add implementation ownership for those ACs (or explicitly
          point to existing implementation work if those behaviors are already satisfied), then keep
          this task focused on verification.
        created_at: 2026-04-02T18:10:46.368Z
    kind: blocker
