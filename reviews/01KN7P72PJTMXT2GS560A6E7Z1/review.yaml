        author: "@claude"
        body: "ac-4 is written as an implementation contract rather than observable behavior: 'the same
          monitoring backend is used' and 'no runtime fallback' are internal design choices, not
          outcomes a consumer can verify. This conflicts with the spec-writing rule against
          implementation leakage. Rewrite the AC in behavioral terms (for example, reliable change
          detection across supported platforms) and leave backend selection in implementation notes
          or tasks."
        created_at: 2026-04-02T18:10:46.260Z
    kind: blocker
  - _ulid: 01KN7P7ZEZCDEJ4YZXA1B53RE9
    anchor:
      type: structured
      section: dependencies
    entries:
      - _ulid: 01KN7P7ZEZMF5KT9GTAWDWX6ZJ
        author: "@claude"
        body: "The task graph puts spec-change work after implementation work: Phase 1 changes watcher
          behavior first, while Phase 2 later updates @daemon-server ac-8 and
          @multi-directory-daemon ac-19 to match. That violates the project's spec-first workflow
          and leaves at least task-chokidar-standardize operating against stale existing specs. Move
          the spec-update tasks ahead of the behavior-changing implementation tasks, or fold those
          spec updates into an earlier prerequisite step."
        created_at: 2026-04-02T18:10:46.367Z
    kind: blocker
  - _ulid: 01KN7P7ZEZPKGN6WDT4Y6K19YS
    anchor:
      type: structured
