    entries:
      - _ulid: 01KSG2JPF02WKDB7H8YHMZQX5Y
        author: Jacob Chapel
        body: "MUST-FIX: replace-path cleanup ignores removeResourceFromOwnerResources failures. When
          replacing an existing resource with a new path, this call can return ok:false for a
          symlinked old path, but the result is discarded and addReviewResource still reports
          success, rewrites resources.yaml to the new path, and leaves the unsafe old resource path
          behind. I reproduced this by seeding old.png, replacing old.png with a symlink, then
          calling addReviewResource(... relativePath: 'new.png', replace: true): it returned
          ok:true, manifestPaths ['new.png'], and oldIsSymlink true. This violates the task contract
          that replacement removes the old file when the path changes and undermines the
          symlink/path-escape rejection behavior. Check the removal result and fail atomically
          before updating the manifest when old-path cleanup is rejected."
        created_at: 2026-05-25T17:23:03.264Z
      - _ulid: 01KSG6R6W0M9YPMB2MPVQT68RV
        author: "@claude"
        body: Fixed in 7650c9f1b4. addReviewResource now checks the result of
          removeResourceFromOwnerResources during a replace-with-path-move. On rejection (e.g. the
          on-disk old-path file is a symlink), the just-written new-path file is rolled back via
          fs.rm and the manager returns invalid_resource_path with the offending old path attached;
          the manifest is left untouched at the old declared path. Added a behavioral test in
          tests/review-resource-manager.test.ts that plants your exact attack shape (seed old.png →
          replace on disk with a symlink to an outside file → call addReviewResource with
          replace:true and a new path) and asserts (a) ok:false + invalid_resource_path, (b) the
          manifest still declares the old path, (c) the new-path file is NOT left behind on disk,
          and (d) the outside symlink target is intact.
        created_at: 2026-05-25T18:35:58.208Z
    kind: blocker
    resolved_at: 2026-05-25T18:36:05.466Z
    resolved_by: "@claude"
