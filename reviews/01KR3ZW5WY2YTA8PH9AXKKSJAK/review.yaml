    entries:
      - _ulid: 01KR40M49B3E5F3FCXBAEEY4C1
        author: Jacob Chapel
        body: "MUST-FIX: The expected-failure wrapper makes these tests pass for the wrong failure shape.
          The task explicitly requires the assertions to prevent a generic parser failure from
          satisfying the regression, but each case is wrapped in it.fails(); under Vitest that means
          any failed assertion in the callback counts as a passing expected failure. For example, if
          runOxlint returned a parser/helper error with a nonzero exit code but no
          no-leaky-test-daemon diagnostic, the positive cases would still throw on the rule-message
          assertion and the test would pass. That loses the requested guardrail precision. Keep the
          suite green, but make the expected-failure marker selective so only the known classifier
          gap satisfies it and unexpected parser/helper failures fail the test."
        created_at: 2026-05-08T14:42:18.027Z
      - _ulid: 01KR42VB82A4ZARV572NTJ4RBA
        author: "@claude"
        body: >-
          Fixed: removed it.fails() and introduced an expectClassifierGap helper that selectively
          accepts only the known classifier-gap failure shape.


          How it works:

          - Each test runs the AC's required post-fix assertions (exit code AND rule name AND
          message fragment) inside assertPostFixBehavior. Today those throw because of the gap.

          - The helper catches that throw and runs assertKnownGapShape, which re-asserts the EXACT
          current shape (positive cases: exitCode === 0 and output does NOT contain the rule name;
          negative cases: exitCode !== 0 and output DOES contain the rule name).

          - A generic parser/helper failure also throws inside assertPostFixBehavior, but it does
          NOT match the known gap shape — assertKnownGapShape re-throws and the test fails. This is
          what bare it.fails() could not enforce.

          - expectClassifierGap also calls expectOxlintRanCleanly() up front: requires exit code 0
          or 1 and rejects any panic / internal-error / failed-to-parse / module-not-found output,
          so an oxlint runtime crash fails the precondition before the post-fix block even runs.

          - When @task-fix-guardrail-daemon-command-classification lands, assertPostFixBehavior
          succeeds, the catch block does not run, and the helper throws an explicit error directing
          the dependent task to remove the wrapper.


          Verification:

          - Focused: npm test -- --fresh tests/lint-daemon-test-guardrails.test.ts
          tests/lint-no-leaky-test-daemon.test.ts → 68/68 pass.

          - Full: npm test → 2402/2402 suites, 8803 passed, 5 skipped, 0 failed.

          - git diff --check 706fdefb...HEAD: no whitespace errors.
        created_at: 2026-05-08T15:21:11.682Z
