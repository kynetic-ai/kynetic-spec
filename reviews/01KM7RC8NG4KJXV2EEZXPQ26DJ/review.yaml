    entries:
      - _ulid: 01KM7RR0DQHSNV90N6JFZN9Q2R
        author: Jacob Chapel
        body: "Note-only writes leave the lean index stale. In split mode, `addNote()` flows through
          `mutateTask()` with `fieldChanges === null`, so this block skips `updateIndexEntry()` and
          only rewrites `notes.yaml`. Because the index still stores `notes_count`, `listTasks()`
          continues to report `notes_count: 0` after adding a note. I reproduced this with a temp
          split-storage fixture: create task -> `listTasks()` shows 0 -> `addNote()` ->
          `listTasks()` still shows 0. This is a correctness regression in caller-visible list data,
          so the task cannot merge until note mutations either keep index counts in sync or the
          index stops claiming to carry note counts."
        created_at: 2026-03-21T08:38:46.967Z
    kind: blocker
