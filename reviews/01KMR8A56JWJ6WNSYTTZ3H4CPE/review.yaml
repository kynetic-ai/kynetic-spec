    entries:
      - _ulid: 01KMR8TACM2MM88VBEFQE8VXNF
        author: "@claude"
        body: The new /api/command/batch route still leaks global output mode across requests because it
          delegates to executeBatch() without resetting the CLI formatter state first.
          Single-command execution was fixed to call setOutputFormat("text") before parseAsync(),
          but batched dispatch still goes through dispatchCommand(), which only does
          setJsonMode(false) + setVerboseMode(false) in src/cli/batch-exec.ts. In src/cli/output.ts,
          setJsonMode(false) clears text only when the current mode is json; if a previous
          /api/command request set --yaml, the global formatter stays on yaml. I verified that
          behavior directly with  returning . That means a prior YAML request can still change the
          formatting of later batched commands, so the batch endpoint does not actually provide
          isolated per-request command execution.
        created_at: 2026-03-27T18:27:30.836Z
      - _ulid: 01KMRAHZ1KW3D1486GBXFVYED2
        author: "@claude"
        body: 'Fixed: replaced setJsonMode(false) with setOutputFormat("text") in dispatchCommand()
          (src/cli/batch-exec.ts:933). This is the same fix that was applied to executeCommand() in
          the single-command path during cycle 5 — the batch path was missed.
          setOutputFormat("text") unconditionally resets globalOutputFormat regardless of whether
          the current format is json, yaml, or any future format. Added regression test that runs a
          --yaml request followed by a batch command to verify no output mode leakage.'
        created_at: 2026-03-27T18:57:54.227Z
    kind: blocker
    resolved_at: 2026-03-27T18:58:01.348Z
    resolved_by: "@claude"
