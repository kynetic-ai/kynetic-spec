      side: head
    entries:
      - _ulid: 01KV4NB9J42G1BF6EMPJ4APWAH
        author: Jacob Chapel
        body: "MUST-FIX: the task board/detail status helper remains a separate task-status vocabulary
          instead of consuming the shared task token. TaskList and ItemDetail now use StatusBadge,
          but TaskCard/TaskDetailContent still go through getStatusClasses(), which renders only a
          dot/text and even labels pending_review as 'Review' instead of the shared 'Pending Review'
          token. The same task state is not represented by the same color + glyph across task views,
          violating @ui-view-header ac-2."
