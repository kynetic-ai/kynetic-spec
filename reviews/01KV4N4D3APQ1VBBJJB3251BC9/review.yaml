      side: head
    entries:
      - _ulid: 01KV4NB5V9QAXD19GXFNH3BE4D
        author: Jacob Chapel
        body: "MUST-FIX: linked review dispositions in task detail still use local dispositionClasses()
          rather than the shared review-disposition token. Review list/detail now render
          changes_requested with StatusBadge as status-blocked plus a glyph, but this task detail
          section maps the same disposition to status-needs-work and renders no glyph. That leaves
          the same review disposition with different visual tokens across views, violating
          @ui-view-header ac-2."
        created_at: 2026-06-15T03:31:30.281Z
    kind: blocker
  - _ulid: 01KV4NB9J4C91RSGYWSSY8Y4RG
    anchor:
