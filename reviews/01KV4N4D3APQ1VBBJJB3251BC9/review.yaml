      side: head
    entries:
      - _ulid: 01KV4NAYJC5THXAWAQ1KZVQCTZ
        author: Jacob Chapel
        body: "MUST-FIX: RelatedSessionsSection still renders session statuses with a local statusColor()
          mapping and a plain Badge instead of the shared StatusBadge/status-token resolver. This is
          observable in existing item/task detail related-session views while the sessions
          list/detail now use the canonical session token. For example, abandoned maps here to
          status-needs-work, but STATUS_TOKENS.session.abandoned maps to status-cancelled, and this
          badge also emits no shared glyph. That violates @ui-view-header ac-2: the same session
          state is not represented by the same color + glyph across views."
        created_at: 2026-06-15T03:31:22.829Z
    kind: blocker
  - _ulid: 01KV4NB25CE1ESSJGAPT55QKJK
    anchor:
      type: code
      commit: 6ae08a8b4f0b8b0c72d04abf94f0bcbe561a37dd
      line_end: 54
      line_start: 32
      path: packages/web-ui/src/lib/components/session/SessionContextPanel.svelte
      side: head
    entries:
      - _ulid: 01KV4NB25C10FG0CHDZARVWPSC
        author: Jacob Chapel
        body: "MUST-FIX: SessionContextPanel still renders the same session.status with local
          Badge/color/label logic while the session detail header above it uses StatusBadge.
          timed_out and stalled fall through to status-cancelled here, stalled keeps the raw
          lowercase label, and no shared glyph is rendered. The same session state can therefore
          have a different or incomplete token inside the same detail view, violating
          @ui-view-header ac-2."
        created_at: 2026-06-15T03:31:26.508Z
    kind: blocker
  - _ulid: 01KV4NB5V9TSTE44R3ATQKY0G1
