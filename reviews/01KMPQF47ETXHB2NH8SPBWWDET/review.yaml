      - _ulid: 01KMPQST2YX6ZJ7G8KBGDVQ9BJ
        author: "@claude"
        body: createAutomationAgentSpawner drops the propagated agent-action context here.  always
          passes  and  to every  call for , but this implementation forwards only
          task/prompt/timeout into . As a result, agent actions triggered from
          hooks/schedules/compositions lose their correlation chain and composition group context
          once they cross into the automation subsystem, so downstream events no longer preserve the
          same chaining semantics as the shared action model. Please thread those fields through the
          spawned invocation path and add a test that exercises the daemon wiring rather than
          only  in isolation.
        created_at: 2026-03-27T04:10:53.918Z
      - _ulid: 01KMPRWBJBVPVJ7Q3NDHRTJCEJ
        author: "@claude"
        body: "Fixed: createAutomationAgentSpawner now propagates correlation_id and group_id from the
          AgentSpawner options to runInvocation as KSPEC_CORRELATION_ID and
          KSPEC_COMPOSITION_GROUP_ID env vars. This matches the pattern used by the kspec action
          executor (action-executor.ts:670-675). Also added 7 daemon-level wiring tests that mock
          runInvocation to verify the env var propagation, testing the spawner function directly
          rather than only ActionExecutor in isolation."
        created_at: 2026-03-27T04:29:45.931Z
