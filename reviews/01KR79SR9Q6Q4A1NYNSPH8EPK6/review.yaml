    entries:
      - _ulid: 01KR79YPTWFMKXTQE5AWQQVHM0
        author: Jacob Chapel
        body: "MUST-FIX: wrapped null/undefined initializers are treated as concrete bindings, so cleanup
          can still be accepted without a usable pid at registration time.  only checks bare , bare
          , and , but it does not unwrap transparent TypeScript wrappers. I verified with an oxlint
          probe against this snapshot:  exited 0 with 'Found 0 warnings and 0 errors'. That violates
          : the closure captures a binding whose runtime value is still undefined at registration,
          so an intervening assertion can leave the detached daemon without scoped cleanup. The
          null/undefined classifier should use the same transparent unwrap discipline as kill-target
          analysis, and tests should cover TS-wrapped / initializers."
        created_at: 2026-05-09T21:23:05.180Z
      - _ulid: 01KR79ZDQP8VTQ4MNR62NZ4Q3Y
        author: Jacob Chapel
        body: 'Clarification for shell-mangled snippets in the opening comment: the affected helper is
          isNullOrUndefinedInitializer at lines 666-673. It only recognizes bare Literal null, bare
          Identifier undefined, and UnaryExpression void. It does not unwrap TSAsExpression or other
          transparent TypeScript wrappers. Manual probe source: runKspec("serve start --detach
          --port 3456"); const pid = undefined as number | undefined; onTestFinished(() => { if (pid
          !== undefined) process.kill(pid, "SIGTERM"); }); expect(true).toBe(true); oxlint returned
          exit 0 with Found 0 warnings and 0 errors. That violates
          ac-detached-cleanup-bound-before-observation because pid is still undefined at cleanup
          registration time.'
        created_at: 2026-05-09T21:23:28.630Z
      - _ulid: 01KR7C1N4DTRRCH34Y9G8GW74J
        author: "@claude"
        body: "Fixed in 08328dee7: isNullOrUndefinedInitializer now calls unwrapTransparentExpression (the
          same fixed-point unwrap the kill-target analysis uses) before the structural check, so
          TSAsExpression / TSSatisfiesExpression / TSNonNullExpression / TSTypeAssertion /
          TSInstantiationExpression / ParenthesizedExpression / ChainExpression around literal null,
          Identifier undefined, or void <expr> all classify as placeholder initializers. The unwrap
          is shared between the declarator-init leg and the assignment-RHS leg of
          findConcreteBindingInStatements / inspectStatementsForBinding, so wrapped placeholders are
          caught regardless of whether the binding is initialised at declaration or reassigned
          later. Manual oxlint AC probes for the cycle-5 scenarios now exit 1 with
          cleanupClosureUnbound: const pid = undefined as number | undefined and const pid = null as
          any both rejected; the safe shape (const pid = readPidFromFile() as number) is still
          accepted (exit 0) because the unwrapped CallExpression remains a concrete value-producer.
          Added five regression tests in tests/lint-daemon-test-guardrails.test.ts: TSAsExpression
          undefined initializer, TSAsExpression null initializer, stacked (undefined)! as number
          wrappers, post-start assignment with TS-wrapped undefined RHS, and a positive control
          wrapping a concrete read."
        created_at: 2026-05-09T21:59:38.893Z
    kind: blocker
