        author: Jacob Chapel
        body: 'MUST-FIX: `@subject-revision-vocabulary ac-review-pass-labeling` is still represented only by
          this N/A annotation: "implemented by dependent @task-respec-review-pass-vocabulary." This
          task is that dependent implementation, and the behavioral E2E assertions added for the
          visible "Review pass:" label are annotated only with `@review-records-web-ui ac-11`. As a
          result the subject-revision vocabulary AC remains falsely marked N/A instead of being tied
          to a behavioral test, so coverage traceability is misleading even though the UI label
          itself is correct. Replace this stale N/A marker with real AC coverage, for example by
          also annotating the review-pass selector E2E label/grouping assertion with `// AC:
          @subject-revision-vocabulary ac-review-pass-labeling`.'
        created_at: 2026-06-19T02:28:44.519Z
