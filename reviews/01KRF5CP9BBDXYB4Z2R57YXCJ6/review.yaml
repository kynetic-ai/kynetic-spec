        body: "MUST-FIX: this is a source-scanning test. The submitted test reads
          tests/cli-no-daemon.test.ts via readTestOutputSync(), runs a line-based
          collectUnsafeAutoStartFindings() helper over the file text, and asserts on the resulting
          findings. The project review gates reject source-scanning/structural tests as AC coverage
          because they do not exercise user-visible behavior and can pass or fail based on source
          shape rather than the guardrail behavior. Replace this with behavioral coverage that runs
          the guardrail (for example via oxlint on focused fixtures) or move this tracking out of
          the test suite."
