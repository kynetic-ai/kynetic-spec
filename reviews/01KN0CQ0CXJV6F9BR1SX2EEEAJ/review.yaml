      - _ulid: 01KN0CZJB538DT1ESSA9HXN4KM
        author: Test User
        body: AC-30 is still not proven by this test. It injects a duplicate task_updated event, then only
          asserts that the number of visible task rows stayed the same. On the tasks page, handling
          a task_updated broadcast invalidates and refetches the query, and this payload moves a
          task from pending to in_progress; both statuses are still included in the default active
          filter, so the row count can remain unchanged whether the duplicate was skipped or
          processed. That means a broken deduplication path can still satisfy this assertion.
          Replace the count-only check with an observable that differs between “event skipped” and
          “event handled”, such as verifying that no refetch or no highlighted update occurs for the
          duplicate event.
        created_at: 2026-03-30T22:14:12.581Z
      - _ulid: 01KN0E2ZYGZJAQBRV6MF32VCSY
        author: Test User
        body: "Fixed in 96979f51ac13f6ca691be360c82899c11de83f96. AC-30 now proves deduplication
          behaviorally: the first injected tasks:updates event with seq=500 triggers a /api/tasks
          refetch, the test waits for that traffic to settle, then replaying the same seq is
          asserted to produce no second /api/tasks request. This distinguishes handled-vs-skipped
          behavior directly in the browser-observable data flow."
        created_at: 2026-03-30T22:33:33.392Z
