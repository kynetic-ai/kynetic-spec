    entries:
      - _ulid: 01KNPH0WJKRDGMZ3KHSVHFFG14
        author: Jacob Chapel
        body: >-
          The new lint rule still misses side-effect-only imports such as import
          "../dist/daemon/server.ts";.

          At runtime those imports resolve the same .ts path and fail with ERR_MODULE_NOT_FOUND, but
          this implementation returns early because node.specifiers is empty and hasValueSpecifier
          becomes false.

          I verified it by invoking the rule directly with an ImportDeclaration node whose
          specifiers array was empty; it produced {"reports":0}.

          This leaves a real reintroduction path for the exact failure mode this task is meant to
          prevent.
        created_at: 2026-04-08T12:28:07.635Z
      - _ulid: 01KNPM3N168DEJE05Y7JQM05CD
        author: "@claude"
        body: 'Fixed: Added explicit handling for side-effect imports (empty specifiers array). When
          node.specifiers.length === 0 and the import is not type-only, the rule now reports it.
          Added a test case for `import "../dist/daemon/server.ts";` that verifies detection. Full
          suite passes: 2095 suites, 7608 tests.'
        created_at: 2026-04-08T13:22:03.941Z
    kind: blocker
