    entries:
      - _ulid: 01KKXMTRJRKGAR1BYY3P3JD94Y
        author: "@claude"
        body: "Verdict and check endpoints do not validate review lifecycle state before mutating.
          Submitting an 'approve' or 'request_changes' verdict to an archived review triggers
          transitionLifecycle('closed') which throws (archived has no valid transitions), resulting
          in an unhandled 500 instead of a clear 400 error. The 'comment' verdict case is more
          concerning — it silently succeeds and adds a verdict to a terminal-state (archived)
          review, which violates the semantic invariant that archived reviews are immutable.
          Similarly, POST /:id/checks would add checks to an archived review. Recommend adding a
          lifecycle state guard (e.g., reject mutations on archived reviews with 400) before calling
          submitVerdict or creating checks. File: packages/daemon/src/routes/reviews.ts, lines
          62-138 (verdicts) and 200-327 (checks)."
        created_at: 2026-03-17T10:17:58.616Z
    kind: blocker
  - _ulid: 01KKXMV2HBQ185W55B3ZR4FHVJ
    anchor:
      type: code
      commit: ""
      line_end: 52
      line_start: 47
      path: packages/daemon/src/routes/reviews.ts
      side: head
    entries:
      - _ulid: 01KKXMV2HB3C1DXAG1N8VGKN4G
        author: "@claude"
        body: The VALID_TRANSITIONS map is duplicated between packages/daemon/src/routes/reviews.ts (line
          47) and src/parser/review-operations.ts (line 222). Both are currently identical, but if
          either is updated independently, the route-level validation and library-level validation
          could diverge. Consider importing a shared constant or re-exporting from the parser
          module. Low risk currently but could cause subtle bugs if transitions are ever modified.
        created_at: 2026-03-17T10:18:08.811Z
    kind: nit
  - _ulid: 01KKXMVBNMPVR5FZCSGTTQW0M0
    entries:
      - _ulid: 01KKXMVBNMMCT6YBH55JWYW5N8
        author: "@claude"
        body: AC-9 (WebSocket broadcast) is implemented in all three handlers via pubsub.broadcast() calls,
          but no test verifies that broadcast was actually called. A PubSubManager spy/mock could
          confirm the broadcast happens with correct topic and data. This follows the existing
          codebase pattern (no other route tests verify broadcast either), so it is not a regression
          — but it means AC-9 coverage relies on code inspection rather than test proof.
        created_at: 2026-03-17T10:18:18.164Z
    kind: nit
