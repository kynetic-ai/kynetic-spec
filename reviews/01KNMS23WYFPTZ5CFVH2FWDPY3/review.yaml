        author: Jacob Chapel
        body: "Fixed in the same isolation refactor. Cache-backed concurrent reads now run against
          per-request execution state and fresh CLI programs, and the new daemon command API
          coverage exercises the concrete reviewer repro shape by running concurrent read commands
          and asserting no cross-response leakage. Verification: npm test --
          tests/daemon-command-api.test.ts and npm test -- --fresh."
