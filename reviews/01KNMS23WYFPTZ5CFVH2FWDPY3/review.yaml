    entries:
      - _ulid: 01KNMSEFF0CRVGVDW2W3EV45TR
        author: Jacob Chapel
        body: "Bypassing the dispatch mutex here is still unsafe because executeCommand() mutates shared
          process-wide state and a shared Commander instance (resetCommandTree(program), console.*,
          process.stdout/stderr.write, process.chdir(), and the exit interceptor at lines 135-230).
          I reproduced this with two concurrent cache-eligible reads (tasks list + plan list)
          against a ready mock cache: plan list output leaked to the parent stdout (B-end / Plans
          (1): ...) instead of staying in the API response, and the pair never completed before
          timeout 15s expired. That means concurrent reads can corrupt captured output or hang, so
          ac-concurrent-cache-reads is not actually satisfied yet."
        created_at: 2026-04-07T20:16:52.704Z
