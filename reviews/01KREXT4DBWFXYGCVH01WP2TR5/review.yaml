    entries:
      - _ulid: 01KREY0T2W8PV8NYBY9V1BXN6P
        author: Jacob Chapel
        body: "MUST-FIX: the helper-body ownership check accepts any helper parameter or any object-literal
          property value as a valid kill target without proving that this value is the just-started
          daemon. I verified three false negatives with ad hoc oxlint probes: (1) function
          killPid(_pid, target) { process.kill(target!, 'SIGTERM') } called as killPid(pid) produces
          0 no-leaky diagnostics, even though the helper kills undefined instead of pid; (2)
          function killPid(_pid, target = otherPid) kills a stale outer pid while killPid(pid) is
          credited; (3) const handle = { otherPid, kill() { process.kill(otherPid, 'SIGTERM') } } is
          credited because the literal exposes otherPid as a property, but otherPid was bound before
          the detached start. Impact: cleanup-shaped code can still satisfy
          ac-cleanup-operation-terminates-daemon/ac-cleanup-helper-origin-is-trusted while leaving
          the newly started daemon running."
        created_at: 2026-05-12T20:28:26.588Z
      - _ulid: 01KRF09ZD58AZTEJ0HTWMEYGFH
        author: "@claude"
        body: >-
          Fixed in cycle 11. Two complementary tightening changes close all three sub-probes:


          1. Helper-function with parameter-bound kill target — `isHelperBodyKillTargetTiedToOwner`
          now finds the parameter's index in `ownerFn.params` and requires the call site
          (`useCallNode`) to provide a VERIFIABLE kill-target argument at that index via new
          `callSiteProvidesVerifiableArgAt`. Omitted args, undefined / void / null literals, and
          Literal / computed targets at the kill-target parameter position are rejected. This closes
          probes 1 (omitted second param) and 2 (parameter default to stale outer pid) — both call
          `killPid(pid)` with no arg at index 1.


          2. Object-literal kill method with stale closure capture — `collectDaemonKillCaptureNames`
          now also surfaces closure-captured kill-target identifiers from a local literal's kill
          method body (via `collectLiteralKillMethodClosureKillTargets`), regardless of whether the
          literal exposes the same name as a property. The cycle-9 structural check
          (literal-carries-property) was insufficient because the literal could expose a stale outer
          Identifier; the temporal-ownership check at the top level
          (`isCaptureOwnedByDetachedStart`) now runs against the closure capture and rejects names
          bound before the detached start. The canonical legitimate shape `{ pid, kill() {
          process.kill(pid, ...) } }` still passes because `pid` is bound AFTER the start.


          Verified all three reviewer probes now produce diagnostics via `npx oxlint`. Added 7
          positive flag-it regressions covering omitted-parameter, stale-default-parameter,
          arrow-helper variant, literal-exposes-stale-outer, unimported-approved-name,
          unapproved-path import, and literal-target argument shapes; 3 accepted-companion
          regressions for legitimate `stopPidBounded` / `stopChildProcessBounded` / `{ pid, kill()
          {...} }` shapes.
        created_at: 2026-05-12T21:08:24.100Z
    kind: blocker
