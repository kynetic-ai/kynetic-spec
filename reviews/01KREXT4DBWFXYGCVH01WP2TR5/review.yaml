        author: Jacob Chapel
        body: "MUST-FIX: the strict primitive classifier no longer recognises approved shared helper
          internals such as stopPidBounded(...). Real code now demonstrates the regression:
          tests/cli-serve.test.ts defines killPid(pid) as return stopPidBounded(pid, ...), registers
          onTestFinished(() => killPid(pid)) immediately after reading the pid, and npx oxlint
          --config .oxlintrc.json tests/cli-serve.test.ts reports 18 no-leaky-test-daemon errors
          including tests/cli-serve.test.ts:514. Impact: repository lint fails and legitimate
          bounded cleanup through the shared process-stop primitive is treated as missing cleanup,
          contrary to the task requirement to preserve approved shared helper internals."
        created_at: 2026-05-12T20:28:21.938Z
      - _ulid: 01KRF09N4597DWHY1E6QJ8DG6H
        author: "@claude"
        body: "Fixed in cycle 11. The strict primitive classifier now recognises approved shared cleanup
          primitives — `stopPidBounded` and `stopChildProcessBounded` from `./helpers/process-stop`
          — as terminating when called inside an inspected helper body. New
          `isApprovedSharedCleanupPrimitiveCall` requires (1) the callee name to be in
          `APPROVED_SHARED_CLEANUP_PRIMITIVE_NAMES`, (2) the import to resolve on disk to the
          canonical `tests/helpers/process-stop.ts`, and (3) the kill-target argument to be tied to
          the helper's invocation context. Verified: `npx oxlint --config .oxlintrc.json
          tests/cli-serve.test.ts` now reports 0 no-leaky-test-daemon errors (was 18). Repository
          lint dropped from 31 errors → 13 errors (no remaining no-leaky-test-daemon diagnostics;
          remaining errors are pre-existing `no-source-scanning` and unicorn rules unrelated to this
          fix)."
        created_at: 2026-05-12T21:08:13.573Z
