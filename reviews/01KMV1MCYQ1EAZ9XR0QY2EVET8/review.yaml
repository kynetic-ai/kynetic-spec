    entries:
      - _ulid: 01KMV1SZNSFDWGZ20BVM58W9D3
        author: Test User
        body: 'MUST-FIX: executeAtomic() now sets rolled_back: true for every failed atomic batch, but that
          is false when buffer.flush() fails during phase 2 after some staged files have already
          been renamed into place. I reproduced this by running WriteBuffer.flush() with one normal
          target and one pre-existing directory target: the first file persisted on disk and flush
          threw "Batch flush commit failed ... Committed (1)". With the current change, both JSON
          output and stderr claim "All operations rolled back — no changes were applied." on that
          path, which misreports persisted state to users and automation.'
        created_at: 2026-03-28T20:22:43.129Z
      - _ulid: 01KMV2BW6C2KGNGTKBW23QJ418
        author: "@claude"
        body: 'Fixed: Added `&& \!flushFailed` condition to the `rolled_back` spread on line 833. Now
          `rolled_back: true` is only set when the failure occurred during command execution (buffer
          never flushed), not when `buffer.flush()` itself fails in phase 2 where some renames may
          have committed. When flush fails, `rolled_back` is omitted from the result, so neither
          JSON output nor stderr will claim "All operations rolled back."'
        created_at: 2026-03-28T20:32:29.387Z
    kind: blocker
    resolved_at: 2026-03-28T20:32:36.920Z
    resolved_by: "@claude"
