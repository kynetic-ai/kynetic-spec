    entries:
      - _ulid: 01KM01DMB8STBJ1Y7AD0HSWDDQ
        author: "@claude"
        body: "Potential double action.failed event emission: Both the 'error' and 'close' event handlers on
          the child process emit action.failed events independently. When a process fails to spawn
          (e.g., ENOENT), Node.js fires both events. The promise resolve is idempotent (second call
          is a no-op), so the return value is correct, but onActionRunEvent fires twice with
          action.failed for the same action_run_id. Event consumers counting or logging failures
          would see duplicates. Same pattern exists in executeKspec. Fix: add a 'settled' boolean
          guard to prevent duplicate event emission after the first terminal event."
        created_at: 2026-03-18T08:36:28.648Z
    kind: nit
  - _ulid: 01KM01DW5V129XEY6TKB7HRMNF
    anchor:
      type: code
      commit: e33ebbbff
      line_end: 559
      line_start: 559
      path: src/agent-runtime/action-executor.ts
      side: head
    entries:
      - _ulid: 01KM01DW5V6SPJ4SGNAZQC7QQ9
        author: "@claude"
        body: kspec command splitting uses simple whitespace split (resolvedCommand.split(/\s+/)) which
          doesn't handle quoted arguments. For example, 'task note @ref --message "hello world"'
          would split incorrectly. This is acceptable for the typical simple kspec commands shown in
          the spec examples, but worth noting for future consumers. Not a spec violation since the
          schema defines command as a single string.
        created_at: 2026-03-18T08:36:36.667Z
    kind: nit
