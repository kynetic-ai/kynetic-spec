    entries:
      - _ulid: 01KMWG7S1X7C2EX1GZ6W57KQJQ
        author: Test User
        body: The daemon routes are now correctly emitting the unified {data, meta} envelope, but the web UI
          client only updated a few session helpers and still returns raw response.json() for many
          migrated read APIs. In this file, fetchTask()/fetchItem()/fetchItemTasks() and later
          fetchReview()/fetchWorkflows()/fetchTaskSessions()/fetchItemSessions()/fetchSession()/fetchValidation()/fetchAlignment()/fetchConventions()
          all leak the envelope object to callers typed as bare payloads. Those callers immediately
          dereference payload fields (for example TaskDetailContent.svelte reads response.items,
          ItemDetail.svelte reads itemResponse.title and tasksResponse.items,
          sessions/[id]/+page.svelte reads sessionQuery.data.status, validate/+page.svelte reads
          validation.schemaErrors, settings/+page.svelte reads conventionsQuery.data.items,
          workflows/+page.svelte reads workflowsQuery.data.items, reviews/[id]/+page.svelte reads
          review.subject). That means these pages will render undefined data or break as soon as
          they hit the migrated daemon, even though the route tests now prove the server returns
          envelopes (for example tasks.ts:321 and :406, items.ts:451/:522/:667,
          sessions.ts:645/:700/:774, validation.ts:258/:311). This migration needs to finish the
          client-side unwrapping for every affected read helper before it is safe to merge.
        created_at: 2026-03-29T09:54:09.597Z
      - _ulid: 01KMWHHK49XXD8TMYZG1GY8NH3
        author: "@claude"
        body: "Fixed: Added unwrapEnvelope() and unwrapPaginatedEnvelope() helpers to api.ts. Updated all
          ~30 affected client functions (fetchTask, fetchItem, fetchItemTasks, fetchReview,
          fetchSession, fetchValidation, fetchAlignment, fetchConventions, fetchWorkflows,
          fetchAgentDefinitions, fetchPlans, fetchPlanContent, fetchSessions, fetchTaskSessions,
          fetchItemSessions, fetchSessionContext, fetchProjectConfig, fetchShadowStatus,
          fetchMergedInbox, fetchValidationAggregation, search, fetchInbox, fetchObservations,
          fetchTriageRecords, fetchTasks, fetchItems, fetchReviews, fetchReviewsForTask) to unwrap
          the envelope before returning data to callers. Also updated E2E test mocks in 6 spec files
          (dashboard, sessions, validate, reviews-detail, code-diff-viewer, smoke) to return the new
          envelope format. All 7123 tests pass."
        created_at: 2026-03-29T10:16:59.785Z
    kind: blocker
