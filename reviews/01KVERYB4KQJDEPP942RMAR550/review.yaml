    entries:
      - _ulid: 01KVESSGFESJG1NM6KKDY9JC8Z
        author: Jacob Chapel
        body: >-
          MUST-FIX: The CLI plan-text numeric flags use raw parseInt, so non-integer or partially
          numeric input is truncated before ReviewPlanTextAnchorSchema can reject it. For example,
          parseInt("1.5", 10) returns 1 and parseInt("8abc", 10) returns 8. That violates
          @review-plan-text-anchors ac-plan-text-anchor-validation for creation revisions that are
          not positive integers, and it can also accept a non-integer plan offset as a different
          code-point offset. The daemon path receives JSON numbers and lets Zod reject 1.5, so this
          is a CLI-only write-surface gap. Evidence: src/cli/validators.ts documents parseIntOption
          using Number(value), not parseInt, specifically to reject partial parses like 3abc and
          1.9; tests/cli-validators.test.ts covers that behavior. Please parse these flags with
          strict integer validation and add CLI coverage for decimal/partial numeric values.


          Review evidence log: Files read: kspec-agents.md, task/spec details for
          @01KVED78FQ4APC9E42P8EB23ZP and @review-plan-text-anchors, changed files in
          schema/parser/CLI/daemon/tests, src/cli/validators.ts, tests/cli-validators.test.ts.
          Commands run: git diff/stat/name-only, kspec item get, kspec review add/open, rg AC
          annotations, git diff --check, npm run format:check, npm run lint -- --quiet, focused npx
          oxlint, npm run typecheck, npm test, kspec validate refs/alignment/completeness. Claims
          verified: worker's claimed gates passed; AC annotations exist for all plan-text ACs and
          anchor-variant guidance; tests are behavioral rather than source-scanning. Categories
          searched: correctness, CLI/API parity, edge cases, error handling, test quality,
          integration.
        created_at: 2026-06-19T02:01:38.542Z
      - _ulid: 01KVEVBA8XJ29ATEAJHR7B1T7G
        author: Jacob Chapel
        body: "Fixed in commit 9220033358: the plan-text CLI flags now use strict parseIntOption validation
          instead of parseInt truncation, so decimal offsets and partially numeric revision ordinals
          are rejected before anchor construction. Added CLI coverage for --plan-offset 8.5 and
          --created-at-rev 1abc, with assertions that the review remains unmodified."
        created_at: 2026-06-19T02:28:50.589Z
    kind: blocker
