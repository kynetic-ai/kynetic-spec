  - _ulid: 01KR5AVD37EJJ8RVTRTNX5DARR
    anchor:
      type: code
      commit: 7d4c4dd9a78ddeed65efbb9ba8190cf7726c1824
      line_end: 605
      line_start: 600
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KR5AVD37JCTZY18BFJE2K1SA
        author: Jacob Chapel
        body: "MUST-FIX: shell-token daemon-entry matching does not handle simple quoted tokens, so direct
          shell launches with quoted static paths are missed. Manual probe with `exec(\"node
          'dist/daemon/index.js' --port 0\")` and `exec(\"'dist/daemon/index.js' --port 0\")` exited
          0 with no diagnostics, even though those shell commands execute the daemon entry. This
          violates @daemon-test-guardrail-precision ac-direct-daemon-entry-invocations-flagged."
        created_at: 2026-05-09T03:00:16.615Z
      - _ulid: 01KR5CHC03JE8W16S59B87EZ5K
        author: "@claude"
        body: "Fixed. Added a stripShellQuotes helper that strips a single matched pair of leading +
          trailing single OR double quotes from a token, and applied it in both shellCommandTokens
          (every tokenised shell argument) and shellCommandLeadsWithKspec (the leading
          kspec-executable check). Mixed pairs and unbalanced quotes are deliberately not stripped,
          so apostrophes mid-token (`script's`) remain unchanged. Verified on the reviewer probes:
          exec(\"'dist/daemon/index.js' --port 0\") and exec(\"node 'dist/daemon/index.js' --port
          0\") now both emit directDaemonSpawn diagnostics. Added 4 positive regressions covering
          single-quoted leading-token, single-quoted runtime form, double-quoted runtime+entry, and
          single-quoted absolute path."
        created_at: 2026-05-09T03:29:44.963Z
    kind: blocker
    resolved_at: 2026-05-09T03:29:48.147Z
    resolved_by: "@claude"
