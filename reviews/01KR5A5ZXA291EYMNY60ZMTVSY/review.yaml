threads:
  - _ulid: 01KR5AV1XT865M9DM1Z8Q97AA9
    anchor:
      type: code
      commit: 7d4c4dd9a78ddeed65efbb9ba8190cf7726c1824
      line_end: 438
      line_start: 431
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KR5AV1XT0MCXS747TEDF3FYF
        author: Jacob Chapel
        body: 'MUST-FIX: `isDaemonEntryArg` only accepts identifiers and string literals, so static
          template-literal daemon paths in spawn-like arguments are silently accepted. Manual probe
          with `spawn(`dist/daemon/index.js`, ["--port", "0"])` and `execFile("node",
          [`dist/daemon/index.js`, "--port", "0"])` exited 0 with no diagnostics even though both
          are statically provable direct daemon-entry launches. This violates
          @daemon-test-guardrail-precision ac-direct-daemon-entry-invocations-flagged.'
        created_at: 2026-05-09T03:00:05.178Z
      - _ulid: 01KR5CGRS1VTKW6TW7FDRHM651
        author: "@claude"
        body: 'Fixed. isDaemonEntryArg now also accepts no-substitution template literals — both the strict
          daemon-entry literal (`dist/daemon/index.js`) and any path-suffixed form ending in
          `/dist/daemon/index.js`. Verified on the reviewer probes: spawn(`dist/daemon/index.js`,
          ["--port", "0"]) and execFile("node", [`dist/daemon/index.js`, "--port", "0"]) both emit
          directDaemonSpawn diagnostics now (manual oxlint shows 4 errors on the probe file). Added
          3 positive regressions covering literal, argv-element, and absolute-path template-literal
          forms across spawn/execFile/spawnSync.'
        created_at: 2026-05-09T03:29:25.277Z
    kind: blocker
    resolved_at: 2026-05-09T03:29:28.508Z
    resolved_by: "@claude"
  - _ulid: 01KR5AV5FYXQ6NW4G6AYSPVY0A
    anchor:
      type: code
      commit: 7d4c4dd9a78ddeed65efbb9ba8190cf7726c1824
      line_end: 882
      line_start: 873
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KR5AV5FYMKW9JZ2449EK8B8M
        author: Jacob Chapel
        body: 'MUST-FIX: the spawn/execFile runtime branch treats any daemon-entry-looking argv element as a
          daemon launch once args[0] is a recognized runtime. That over-reports runtime modes where
          Node does not execute a script. Manual probe: `spawn("node", ["--eval",
          "dist/daemon/index.js"])` and `execFile("node", ["--version", DAEMON_ENTRY])` both produce
          direct-daemon diagnostics, but neither starts the daemon entry as the main script. This
          violates @daemon-test-guardrail-precision ac-unrelated-subprocesses-not-reported. The
          argv-array path needs script-position modelling like the exec/execSync shell-string path,
          including eval/version/value-consuming option cases, plus regression coverage.'
        created_at: 2026-05-09T03:00:08.830Z
      - _ulid: 01KR5CGZ2CZAEPRQ3HN44BWQQC
        author: "@claude"
        body: Fixed. The spawn/spawnSync/execFile/execFileSync runtime branch now walks the argv
          ArrayExpression with the same script-position model as the exec/execSync shell-string
          walker — see the new findScriptPositionInArgvArray helper. Standalone flags skip one
          element, value-consuming flags skip the flag AND its separately-passed value, and
          no-script flags abort the walk entirely. The shared no-script predicate (renamed from
          isShellRuntimeEvalFlag to isShellRuntimeNoScriptFlag) now also recognises -v / --version /
          -h / --help so the reviewer probes spawn("node", ["--eval", "dist/daemon/index.js"]) and
          execFile("node", ["--version", DAEMON_ENTRY]) no longer emit direct-daemon diagnostics —
          both exit 0 cleanly under manual oxlint. Added 8 negative regressions (--eval / --version
          / -v / --help / -h / --print / daemon-as-require-value / other-script-then-daemon) and 4
          positive regressions to keep real launches like spawn("node", ["--require", "./pre.js",
          DAEMON_ENTRY, "--port", "0"]) flagged. Sibling shell-string negatives for --version and
          --help also added.
        created_at: 2026-05-09T03:29:31.724Z
    kind: blocker
    resolved_at: 2026-05-09T03:29:35.081Z
    resolved_by: "@claude"
  - _ulid: 01KR5AV9F7CW13FP3V0M44QN8G
    anchor:
