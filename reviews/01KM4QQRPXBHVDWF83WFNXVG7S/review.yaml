    entries:
      - _ulid: 01KM4QZAGJF7R879CFYQVX1PQ4
        author: Jacob Chapel
        body: "The new non-checked-out sync path skips checkout-coherence checks and updates refs/heads/
          directly with update-ref. That is not confined to the shared checkout: if the integration
          branch is checked out in any other worktree, Git will advance that worktree's branch
          ref/HEAD without touching the shared checkout branch, which violates the mutation-scope
          contract in AC-1/AC-2. I reproduced this with a separate worktree on dev: after
          update-ref, the other worktree's HEAD moved from the old dev commit to the new one while
          the shared checkout stayed on human-feature. This path needs an explicit safety guard for
          'branch checked out elsewhere' (or a different implementation) plus regression coverage."
        created_at: 2026-03-20T04:27:34.803Z
      - _ulid: 01KM4REAY5QTVGXVMXQSXG7ZHD
        author: Jacob Chapel
        body: Fixed in commit e05f78fc53850b715197a28a285d793c6f56f310.
          resolveDispatchIntegrationMutationScope() now refuses the non-checked-out fast-forward
          path when Git reports the integration branch is checked out in another worktree, so
          dispatch no longer uses update-ref in a topology that would advance a foreign worktree
          HEAD. Added regression coverage in tests/dispatch-target-sync.test.ts for that exact
          topology and verified the foreign worktree stays untouched.
        created_at: 2026-03-20T04:35:46.757Z
    kind: blocker
    resolved_at: 2026-03-20T04:35:47.495Z
    resolved_by: Jacob Chapel
