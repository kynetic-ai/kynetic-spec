    entries:
      - _ulid: 01KRF9DMPMGY4ZG2PZMZRAHXHB
        author: Jacob Chapel
        body: "MUST-FIX: local class declarations are not treated as helper-name bindings, so they can
          shadow an approved cleanup import and still receive cleanup credit.  walks parameters,
          catch/for bindings, function declarations, and variable declarations, but not ;  also only
          handles variable declarations. I verified with an oxlint fixture that imports  from , then
          declares  before : the rule exits with 0 no-leaky-test-daemon errors, even though the
          cleanup callback invokes the local class binding and throws instead of terminating the
          daemon. The same false negative reproduces inside a helper body for  shadowing the
          approved  primitive. This violates @daemon-test-guardrail-precision
          ac-cleanup-helper-origin-is-trusted and ac-cleanup-operation-terminates-daemon because
          helper/import trust is not local-scope accurate for class bindings."
        created_at: 2026-05-12T23:47:41.396Z
      - _ulid: 01KRF9EWC82D3CBZE07FK3F4AV
        author: Jacob Chapel
        body: 'Clarification for the shell-stripped code snippets above: the affected local-binding resolver
          is findLocalHelperDefinition plus statementBindsNameOpaquely. Repro 1: import killPid from
          ./helpers/daemon, start with runKspec("serve start --detach"), read pid, declare class
          killPid {}, then register onTestFinished(() => killPid(pid)). Oxlint produced only
          no-unused-vars and zero no-leaky-test-daemon errors. Repro 2: import stopPidBounded from
          ./helpers/process-stop, then inside a local killPid helper declare class stopPidBounded {}
          before calling stopPidBounded(pid); the cleanup is also credited. These class declarations
          lexically shadow the approved imports, so they need to be treated as opaque local
          bindings.'
        created_at: 2026-05-12T23:48:22.022Z
      - _ulid: 01KRFDQY3K2BN324680Q0JMG9M
        author: "@claude"
        body: >-
          Fixed in fix-cycle 14: extended `statementBindsNameOpaquely` (the residual-binding
          predicate consulted by `findLocalHelperDefinition`'s statement walker) to recognise
          `ClassDeclaration` whose id binds the looked-up name — both as a top-level statement and
          through the existing `ExportNamedDeclaration` / `ExportDefaultDeclaration` unwrap. Both
          reviewer repros now resolve as opaque local bindings:


          1. `class killPid {}` in the `it` body → `isTrustedHelperByOrigin` sees
          `LOCAL_BINDING_OPAQUE` and rejects the cleanup callback.

          2. `class stopPidBounded {}` inside a `killPid` helper body →
          `isApprovedSharedCleanupPrimitiveCall`'s lexical-resolution gate sees the opaque binding
          and rejects the trust.


          Three new positive regressions assert the cycle-14 shapes (in-scope class shadow,
          helper-body class shadow of an approved shared primitive, exported-class shadow). Full
          `tests/lint-no-leaky-test-daemon.test.ts` suite passes (156/156), and the full `npm test`
          suite passes (2429 suites).
        created_at: 2026-05-13T01:03:13.011Z
