      - _ulid: 01KMZQGPXV0J9FCMD5JV3X2Z45
        author: "@claude"
        body: "Fixed: Root cause was a race condition — page.waitForRequest() was set up after
          expandActivePlan() returned, but the batch fetch fires immediately when the plan detail is
          received (before the content section becomes visible). Replaced with a promise that
          resolves when the page.route handler completes, ensuring reliable synchronization.
          Verified stable across 3 consecutive runs. Commit 52f44a8f0."
