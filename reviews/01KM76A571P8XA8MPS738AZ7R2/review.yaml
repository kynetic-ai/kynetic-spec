      - _ulid: 01KM76H046C5E1AF1NETFJ72AH
        author: Jacob Chapel
        body: "The create path still bakes in monolithic storage details. TaskStorageBackend.createTask()
          returns Promise<void>, and TaskDataManager.createTask() pre-populates _sourceFile with
          getDefaultTaskFilePath(ctx) before delegating. With a registered split backend, I
          reproduced that both the backend input and the returned task still point at
          /tmp/.../project.tasks.yaml. That means ac-1/ac-8 are not satisfied on writes: the split
          backend cannot own the created task metadata, and callers still observe a monolithic-only
          path on the create path."
        created_at: 2026-03-21T03:20:22.918Z
    kind: blocker
