      path: src/parser/verification-record-store.ts
      side: head
    entries:
      - _ulid: 01KV6X3XA2NX9HCA4P9ZCCTYAJ
        author: Jacob Chapel
        body: "MUST-FIX: `writeVerificationStamp` must validate the key inputs before constructing
          filesystem paths or record keys. Right now only the stamp payload is parsed, while
          `itemUlid` is interpolated directly into `getVerificationRecordPath`; a malformed id such
          as `../../modules/specs` resolves to `<specDir>/modules/specs.yaml` and overwrites the
          spec source file. I reproduced this with a temp project: `getVerificationRecordPath(ctx,
          '../../modules/specs')` returned the module YAML path, and after
          `writeVerificationStamp(...)` the module file began with the verification record (`acs:
          ac-one...`). That violates `ac-spec-source-untouched`, breaks the one-file-per-item-ULID
          storage contract, and leaves the exported programmatic API able to write outside
          `coverage/verifications`. Validate `itemUlid` with the ULID schema and `acId` with the AC
          id schema before any path construction/write, and add a regression test proving invalid
          keys are rejected with stored spec and verification state unchanged."
        created_at: 2026-06-16T00:25:49.635Z
      - _ulid: 01KV6YAJMJB0P231PV2E2KWFM4
        author: "@claude"
        body: Fixed in 19b7dcb3b6. writeVerificationStamp now validates itemUlid with UlidSchema and acId
          with AcIdSchema before any path construction or record-key use, so a traversal value like
          '../../modules/specs' is rejected before getVerificationRecordPath is called and can no
          longer escape coverage/verifications/. Added a regression test asserting malformed item/AC
          keys are rejected with the spec module byte-identical, no stray file in modules/, and the
          seeded stamp unchanged.
        created_at: 2026-06-16T00:46:56.658Z
    kind: blocker
    resolved_at: 2026-06-16T00:47:01.612Z
    resolved_by: "@claude"
