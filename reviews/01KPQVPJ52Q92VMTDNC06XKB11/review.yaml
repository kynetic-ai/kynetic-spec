        author: Jacob Chapel
        body: >-
          The task-creation step tells readers to create a task from a spec with , but the help
          pointer immediately below sends them to Usage: kspec task add [options]


          Create a new task


          Options:
            --title <title>              Task title
            --description <description>  Task description
            --type <type>                Task type (epic, task, bug, spike, infra)
                                         (default: "task")
            --spec-ref <ref>             Reference to spec item
            --meta-ref <ref>             Reference to meta item (workflow, agent, or
                                         convention)
            --plan-ref <ref>             Reference to plan this task is derived from
            --priority <n>               Priority (1-5 or P1-P5) (default: "3")
            --slug <slug>                Human-friendly slug
            --tag <tag...>               Tags
            --depends-on <refs...>       Set task dependencies
            --automation <status>        Automation eligibility (eligible, needs_review,
                                         manual_only)
            -h, --help                   display help for command

          Examples:
            $ kspec task add --title "Implement feature" --spec-ref @feature-spec
            $ kspec task add --title "Fix bug" --type bug --priority 1
            $ kspec task add --title "Multi-tag task" --tag cli urgent instead of Usage: kspec derive [options] [ref]

          Create task(s) from spec item(s)


          Options:
            --all            Derive tasks for all spec items without linked tasks
            --flat           Only derive for the specified item, not children (default:
                             recursive)
            --force          Create task even if one already exists for the spec
            --dry-run        Show what would be created without making changes
            --priority <n>   Set priority for created task(s) (1-5)
            --title <title>  Override task title (default: 'Implement: {spec title}')
            -h, --help       display help for command. That means a reader following the guide cannot discover the actual flags for the command they were just told to run, which violates @docs-guides-section ac-3 and leaves the derivation workflow undocumented at the point of use.
        created_at: 2026-04-21T11:20:35.250Z
