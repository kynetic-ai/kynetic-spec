    entries:
      - _ulid: 01KM7VG7M91W45XZAKEWKJ8T28
        author: Jacob Chapel
        body: 'Blocking: the CLI is still wired to the monolithic singleton for task mutations. `task add`
          goes through `taskDataManager.createTask(...)` here instead of the new context-aware
          resolver, so a project with `task_storage.format: split` reports success but writes to the
          root-level monolithic `project.tasks.yaml` rather than `.kspec/tasks/<ulid>/task.yaml` and
          `.kspec/project.tasks.yaml`. I reproduced this with a fresh repo whose manifest sets
          `task_storage.format: split`: after `kspec task add --title "Split task" --slug split-task
          --priority 3 --description repro --json`, `.kspec/project.tasks.yaml` stayed `[]`,
          `.kspec/tasks/` remained empty, and a new top-level `project.tasks.yaml` appeared. That
          means the submitted implementation still does not work through the actual CLI path it is
          meant to enable.'
        created_at: 2026-03-21T09:26:57.929Z
    kind: blocker
