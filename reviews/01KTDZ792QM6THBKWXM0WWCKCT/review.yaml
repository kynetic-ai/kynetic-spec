    entries:
      - _ulid: 01KTE07YJ2M3VW4JNRV63RJ9FE
        author: Jacob Chapel
        body: "MUST-FIX: The terminal invocation event payload overwrites the display task_ref with the
          canonical task_id. terminalEvent already carries task_id and task_ref separately, but this
          payload spreads terminalEvent and then assigns task_ref: terminalEvent.task_id. As a
          result invocation.completed/invocation.failed event-bus consumers receive the canonical
          ULID in task_ref and lose the display ref, violating @dispatch-canonical-task-identity
          ac-session-and-event-payloads-separate-id-from-display-ref. Evidence: tests only assert
          the started onInvocationEvent payload, and the terminal event-bus path is not covered."
        created_at: 2026-06-06T08:19:26.914Z
      - _ulid: 01KTE2DZDM85Z18CM5SR6093QY
        author: "@claude"
        body: "Fixed: the terminal invocation event-bus payload (dispatch.ts ~3317) no longer overwrites
          task_ref with the canonical ULID. It now carries task_id (canonical, via the spread) and
          task_ref (display) as separate fields, mirroring the started payload. Behavioral coverage
          added in dispatch-canonical-task-identity-integration.test.ts: the test subscribes to
          engine.eventBus and asserts the invocation.completed payload has task_id == <ULID> and
          task_ref == display slug."
        created_at: 2026-06-06T08:57:41.555Z
    kind: blocker
    resolved_at: 2026-06-06T08:57:46.168Z
    resolved_by: "@claude"
  - _ulid: 01KTE08A4JVE220KTP926AWKP9
    anchor:
