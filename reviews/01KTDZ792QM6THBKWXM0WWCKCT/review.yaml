  - _ulid: 01KTE08MH82RGJDPH9PJE9J0YT
    anchor:
      type: code
      commit: 2d8e34d8c81c0004491f8011e8caecb34e918153
      line_end: 3074
      line_start: 3037
      path: src/agent-runtime/workspace.ts
      side: head
    entries:
      - _ulid: 01KTE08MH93Q26H9Q7K3GF3GKH
        author: Jacob Chapel
        body: "MUST-FIX: Registry reconciliation still looks up task status and active role by
          record.task_ref even though the caller now supplies canonical maps. DispatchEngine builds
          taskStatusByRef from @<task._ulid>, and _activeRoleByTaskId returns bare canonical task
          ULIDs. Historical/open workspace records persisted under a slug display ref therefore miss
          both lookups, so completed or cancelled tasks may not be marked integrated/abandoned or
          scheduled for cleanup during reconciliation, and active_role can be stale. This violates
          @dispatch-canonical-task-identity ac-workspace-registry-canonical-task-identity and the
          cleanup/lifecycle guarantees that must use canonical identity."
        created_at: 2026-06-06T08:19:49.417Z
      - _ulid: 01KTE2EYP5SB07Q5F1ZRK0K358
        author: "@claude"
        body: "Fixed: reconcileDispatchWorkspaceRegistry now resolves each record's canonical id
          (recordCanonicalId) and looks up task status by `@<ULID>` and active role by bare `<ULID>`
          — the exact key formats DispatchEngine builds (taskStatusByRef from @${task._ulid},
          _activeRoleByTaskId by bare ULID). A record persisted under a slug display ref now hits
          both lookups, so completed/cancelled tasks are marked integrated/abandoned and scheduled
          for cleanup and active_role stays current. Raw task_ref is only a degraded-mode fallback
          when the record cannot be canonicalized. Resolvable historical records are also backfilled
          with canonical task_id on the reconcile rewrite. Behavioral coverage: integration test
          'reconciles task status and active role by canonical id for a slug-display record'
          provisions under a slug, reconciles with canonical-keyed maps, and asserts
          active_role=reviewer + integration.status=merged."
        created_at: 2026-06-06T08:58:13.573Z
    kind: blocker
    resolved_at: 2026-06-06T08:58:18.251Z
    resolved_by: "@claude"
  - _ulid: 01KTE09EPK7ZM59861DHM1TTWC
    anchor:
      type: code
      commit: 2d8e34d8c81c0004491f8011e8caecb34e918153
      line_end: 1738
      line_start: 1732
      path: src/agent-runtime/workspace.ts
      side: head
    entries:
      - _ulid: 01KTE09EPKNWAWBG0TKYWHYWQP
        author: Jacob Chapel
        body: "MUST-FIX: Multiple non-closed historical alias records for the same canonical task can still
          be silently collapsed instead of rejected or reported. loadWorkspaceRecordForWorktreeRoot
          canonicalizes matching, but if two open records under different historical aliases both
          match the queried task and worktree root it sorts and returns the newest record. The
          registry validator also keys historical records without task_id by raw task_ref, so @slug
          and @<ULID> records for the same task do not collide there. This violates
          @dispatch-canonical-task-identity ac-workspace-registry-canonical-task-identity, which
          requires rejecting or reporting more than one non-closed workspace record for the same
          canonical task identity."
        created_at: 2026-06-06T08:20:16.211Z
      - _ulid: 01KTE2F7WD2Q5203QFJQKHJD2B
        author: "@claude"
        body: "Fixed: loadWorkspaceRecordForWorktreeRoot now rejects (throws DispatchWorkspaceError) when
          more than one non-closed record resolves to the same canonical task, instead of sorting
          and returning the newest — so two open alias records (@slug vs @<ULID>) for one task no
          longer silently collapse. reconcileDispatchWorkspaceRegistry additionally detects multiple
          non-closed records sharing a canonical id, reports them (operator-actionable warning), and
          skips task_id backfill for the conflicting records so the parser's task_id-keyed validator
          does not partially normalize them. Behavioral coverage: integration test 'rejects more
          than one non-closed alias record for the same canonical task' forges two open historical
          alias records and asserts provisioning rejects with the canonical-task diagnostic."
        created_at: 2026-06-06T08:58:22.989Z
    kind: blocker
