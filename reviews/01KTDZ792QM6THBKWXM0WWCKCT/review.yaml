      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KTE08A4KSQEV2CY931EN8QY7
        author: Jacob Chapel
        body: "MUST-FIX: Session terminal lifecycle events still do not carry canonical task_id separately
          from display task_ref. For task-scoped
          session.ended/session.cancelled/session.idle_timeout events, this payload sets task_ref to
          terminalEvent.task_id and omits task_id entirely. Event consumers cannot distinguish
          identity from display ref, which violates @dispatch-canonical-task-identity
          ac-session-and-event-payloads-separate-id-from-display-ref. Evidence:
          src/schema/event-payloads.ts still models session payloads with task_ref only, and
          tests/session-lifecycle-events.test.ts still asserts the old shape."
        created_at: 2026-06-06T08:19:38.771Z
      - _ulid: 01KTE2E89238GZ2R7R74PD12C1
        author: "@claude"
        body: "Fixed: session terminal lifecycle payloads (_emitSessionLifecycleEvent) now set task_id
          (canonical) and task_ref (display) separately rather than putting the ULID in task_ref and
          omitting task_id. SessionEventPayloadSchema and InvocationStarted/Terminal schemas now
          model task_id; KNOWN_EVENT_FIELDS (action-executor) exposes task_id for invocation+session
          template vars. session-lifecycle-events.test.ts updated to assert the separation (no
          longer the old shape), and the integration test asserts the session.ended bus payload has
          task_id == <ULID> and task_ref == display slug."
        created_at: 2026-06-06T08:57:50.626Z
    kind: blocker
