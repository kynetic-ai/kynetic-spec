threads:
  - _ulid: 01KXH5JE5KX7EN68YNCAMG1WDH
    anchor:
      type: structured
      field: ac-bootstrap-step-timeout
      ref: "@dispatch-runtime-bootstrap-contract"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXH5JE5ME0SXZZQRVZY1PFXQ
        author: "@claude"
        body: "Proposed AC leaks internal mechanism. Text: 'its process group is terminated'. Per
          /kspec:writing-specs, ACs must describe observable behavior, not internal mechanisms.
          'Process group' is OS-level implementation speak that a non-developer reader cannot
          observe. Rewrite to describe the observable outcome, e.g. 'the step is terminated and the
          step result records a stable timeout failure classification, and the invocation is not
          launched'. The task body already enumerates the observable parts ('Kill the step process
          group on timeout, record a stable timeout failure classification, and never hand off to
          the adapter after timeout') — surface those observables in the AC, not the OS mechanism."
        created_at: 2026-07-14T20:37:22.228Z
    kind: blocker
  - _ulid: 01KXH5K02M94QEQCNYCYMP4S6V
    anchor:
      type: structured
      field: ac-guarded-target-reset
      ref: "@dispatch-workspace-configuration"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXH5K02N577N89MR4SMNCD3M
        author: "@claude"
        body: "Proposed AC is compound and tautological — not independently testable. The 'When: guarded
          reset prerequisites hold' clause does not enumerate the prerequisites, so a reviewer
          cannot tell what is being asserted without reading the task body. The task body lists five
          prerequisites (no active/in-flight invocation, non-terminal task, no unresolved
          merge/integration result, clean canonical worker branch, --reason/--force requirement).
          Either (a) move the prerequisite list into the AC 'When' so the AC is self-contained, or
          (b) split into one AC per prerequisite refusal path so each can be tested independently.
          As written, the AC reads as 'when reset is allowed, reset is allowed', which is not a
          verifiable contract."
        created_at: 2026-07-14T20:37:40.565Z
    kind: blocker
  - _ulid: 01KXH5KG4JJDXB1NHKFPYFFTZ7
    anchor:
      type: structured
      field: ac-operator-cleanup-uses-policy
      ref: "@dispatch-workspace-cleanup-policy"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXH5KG4KFQSS3EQAWVS1DJ8Y
        author: "@claude"
        body: "Proposed AC is circular and untestable as written. Text: 'destructive action occurs only
          through existing protection and cleanup policy'. The spec
          @dispatch-workspace-cleanup-policy IS the cleanup policy, so the AC restates the spec name
          as the assertion — a tautology. The 'existing protection' clause is also undefined in the
          AC. Rewrite to describe the observable classification outcomes the operator sees (dry-run
          classification of protected/eligible/blocked, --force requirement for mutation, evidence
          retained for blocked artifacts), since those are the actual testable behaviors the task
          body implements. Without this rewrite the AC cannot be verified by reading code or running
          a test."
        created_at: 2026-07-14T20:37:57.011Z
    kind: blocker
