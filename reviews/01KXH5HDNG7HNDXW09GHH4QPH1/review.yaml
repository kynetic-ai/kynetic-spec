      - _ulid: 01KXH5JE5ME0SXZZQRVZY1PFXQ
        author: "@claude"
        body: "Proposed AC leaks internal mechanism. Text: 'its process group is terminated'. Per
          /kspec:writing-specs, ACs must describe observable behavior, not internal mechanisms.
          'Process group' is OS-level implementation speak that a non-developer reader cannot
          observe. Rewrite to describe the observable outcome, e.g. 'the step is terminated and the
          step result records a stable timeout failure classification, and the invocation is not
          launched'. The task body already enumerates the observable parts ('Kill the step process
          group on timeout, record a stable timeout failure classification, and never hand off to
          the adapter after timeout') — surface those observables in the AC, not the OS mechanism."
        created_at: 2026-07-14T20:37:22.228Z
