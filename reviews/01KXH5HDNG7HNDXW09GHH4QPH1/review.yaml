threads:
  - _ulid: 01KXH5JE5KX7EN68YNCAMG1WDH
    anchor:
      type: structured
      field: ac-bootstrap-step-timeout
      ref: "@dispatch-runtime-bootstrap-contract"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXH5JE5ME0SXZZQRVZY1PFXQ
        author: "@claude"
        body: "Proposed AC leaks internal mechanism. Text: 'its process group is terminated'. Per
          /kspec:writing-specs, ACs must describe observable behavior, not internal mechanisms.
          'Process group' is OS-level implementation speak that a non-developer reader cannot
          observe. Rewrite to describe the observable outcome, e.g. 'the step is terminated and the
          step result records a stable timeout failure classification, and the invocation is not
          launched'. The task body already enumerates the observable parts ('Kill the step process
          group on timeout, record a stable timeout failure classification, and never hand off to
          the adapter after timeout') — surface those observables in the AC, not the OS mechanism."
        created_at: 2026-07-14T20:37:22.228Z
    kind: blocker
  - _ulid: 01KXH5K02M94QEQCNYCYMP4S6V
    anchor:
      type: structured
      field: ac-guarded-target-reset
      ref: "@dispatch-workspace-configuration"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXH5K02N577N89MR4SMNCD3M
        author: "@claude"
        body: "Proposed AC is compound and tautological — not independently testable. The 'When: guarded
          reset prerequisites hold' clause does not enumerate the prerequisites, so a reviewer
          cannot tell what is being asserted without reading the task body. The task body lists five
          prerequisites (no active/in-flight invocation, non-terminal task, no unresolved
          merge/integration result, clean canonical worker branch, --reason/--force requirement).
          Either (a) move the prerequisite list into the AC 'When' so the AC is self-contained, or
          (b) split into one AC per prerequisite refusal path so each can be tested independently.
          As written, the AC reads as 'when reset is allowed, reset is allowed', which is not a
          verifiable contract."
        created_at: 2026-07-14T20:37:40.565Z
    kind: blocker
  - _ulid: 01KXH5KG4JJDXB1NHKFPYFFTZ7
    anchor:
      type: structured
      field: ac-operator-cleanup-uses-policy
      ref: "@dispatch-workspace-cleanup-policy"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXH5KG4KFQSS3EQAWVS1DJ8Y
        author: "@claude"
        body: "Proposed AC is circular and untestable as written. Text: 'destructive action occurs only
          through existing protection and cleanup policy'. The spec
          @dispatch-workspace-cleanup-policy IS the cleanup policy, so the AC restates the spec name
          as the assertion — a tautology. The 'existing protection' clause is also undefined in the
          AC. Rewrite to describe the observable classification outcomes the operator sees (dry-run
          classification of protected/eligible/blocked, --force requirement for mutation, evidence
          retained for blocked artifacts), since those are the actual testable behaviors the task
          body implements. Without this rewrite the AC cannot be verified by reading code or running
          a test."
        created_at: 2026-07-14T20:37:57.011Z
    kind: blocker
  - _ulid: 01KXH5MAKX3M52KK1JNWHD5XKQ
    anchor:
      type: structured
      field: ac-bootstrap-runner-env-separation
      ref: "@dispatch-runtime-bootstrap-contract"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXH5MAKX7AJ0BETZ69B746V9
        author: "@claude"
        body: Proposed AC 'runner env and secret bindings are not applied to bootstrap' partially leaks the
          runner-config schema ('env', 'secret bindings') as if those were user-observable
          natural-language concepts. Per /kspec:writing-specs, schema field names like
          env.inherit/pass/set/secrets should not appear in ACs. Rewrite in behavioral terms, e.g.
          'the bootstrap subprocess does not receive the agent's named-runner environment additions
          or secret values; those values are only visible to the later adapter-process spawn
          boundary'. The task body already describes the correct behavior in those terms — the AC
          text should match.
        created_at: 2026-07-14T20:38:24.125Z
    kind: blocker
  - _ulid: 01KXH5MXZ5S1WPY09ZJC3TBD27
    anchor:
      type: structured
      ref: "@task-close-bootstrap-public-contract"
      section: description
    entries:
      - _ulid: 01KXH5MXZ6JQG4S83DTDKX3Z51
        author: "@claude"
        body: "Plan-shape risk: this plan intentionally omits ## Specs and relies on workers running 'kspec
          item ac add' during Tasks 1 and 2 to amend existing owners. The plan note explains this.
          However, the plan document is the durable record of which ACs should be added; if the
          worker forgets or paraphrases, the spec system silently drifts from the plan. Two options
          to harden this: (1) include a ## Specs section that amends existing specs (the import
          parser supports this if entries carry a 'slug' matching an existing spec — verify or
          document this), or (2) add a note to the Implementation Notes section stating explicitly
          that worker-added ACs MUST match the task body verbatim and reviewer must verify via
          'kspec item get <spec>' after task completion. As written, this is a real but recoverable
          workflow risk."
        created_at: 2026-07-14T20:38:43.942Z
    kind: question
  - _ulid: 01KXH5N838G849PTCR1A538R0E
    anchor:
      type: structured
      ref: "@task-finish-dispatch-remote-sync-contract"
      section: description
    entries:
      - _ulid: 01KXH5N83993A13VA2723KJ5D1
        author: "@claude"
        body: "Task 3 scope is unusually large for a single task: @dispatch-remote-branch-sync has ~50
          acceptance criteria, the task description says 'audit every AC against
          src/agent-runtime/dispatch.ts, workspace integration/cleanup paths, daemon status routes,
          CLI status, and focused tests; implement missing behavior or tighten incorrect stale
          tests', and verification references five test files (the largest is 2842 lines). One
          worker attempt at this may end in needs_work purely on scope. Consider splitting by
          concern: (a) status projection completeness, (b) sync mechanics (push/pull/ff/divergence),
          (c) cleanup integration and target-set lifecycle. Each can carry its own behavioral test
          matrix. If you keep it as one task, expand the 'Required tests' bullet to enumerate which
          ACs each test file owns so the worker can run focused verifications rather than
          re-auditing the whole matrix each pass."
        created_at: 2026-07-14T20:38:54.313Z
    kind: question
  - _ulid: 01KXH5NZM26039DSNGTTQ70QWW
    anchor:
      type: structured
      ref: "@task-add-dispatch-workspace-operator-surface"
      section: description
    entries:
      - _ulid: 01KXH5NZM24CBK79MGSPG2MTM6
        author: "@claude"
        body: "Sanitized status projection in list/show is described in depth (canonical task/workspace
          identity, resolved target and branch provenance, role worktree paths/modes, lifecycle,
          role bootstrap summary/invalidation reasons, integration, health issues/suggestions,
          cleanup status, timestamps) but the spec AC text proposed for @dispatch-workspace-registry
          ac-operator-inspection only asserts 'sanitized lifecycle, bootstrap, integration, health,
          cleanup, ownership, and timestamp state is returned without bootstrap output'. The AC list
          does not match the projection description: provenance/branch lineage and role worktree
          paths/modes are in the body but missing from the AC. Either trim the body to match the AC
          or expand the AC to enumerate the projection fields. Also, 'sanitized' is implementation
          speak — the AC should describe the observable outcome (no bootstrap command output is
          included)."
        created_at: 2026-07-14T20:39:18.403Z
    kind: question
  - _ulid: 01KXH5P9K6114Q62GQA6SDDWZ2
    anchor:
      type: structured
      ref: "@task-close-bootstrap-public-contract"
      section: description
    entries:
