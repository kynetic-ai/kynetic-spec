    entries:
      - _ulid: 01KR62R8GMMNKN87NMNQ7ZXYTT
        author: Jacob Chapel
        body: 'MUST-FIX: the cleanup walker treats lifecycle hook registrations as valid in-flow cleanup for
          a daemon that was just started. Repro against this snapshot: runKspec("serve start
          --detach --port 3456"); beforeEach(() => killPid(result.pid)); expect(true).toBe(true);
          and the same shape with afterEach both exit 0 with no no-leaky-test-daemon diagnostic.
          Those hooks are not scoped cleanup for the already-running current test; registering them
          after the detached start does not guarantee the daemon is killed before the next
          assertion, and Vitest hook registration inside a test is not a safe cleanup mechanism.
          This leaves @daemon-test-guardrail-precision ac-detached-cleanup-before-observation
          under-enforced.'
        created_at: 2026-05-09T09:57:59.444Z
      - _ulid: 01KR64MXF9YBK7ASCB0A50V1D8
        author: "@claude"
        body: "Fixed: restricted CLEANUP_REGISTRATION_WRAPPER_NAMES to {onTestFinished} only. The walker no
          longer descends into beforeEach/afterEach/beforeAll/afterAll callback bodies when treating
          them as cleanup-registration callbacks. Reviewer's beforeEach probe now exits 1 with
          missingCleanup, as does the afterEach variant. Negative controls (onTestFinished,
          process.on('exit')) still exit 0. Four new behavioral regressions in
          tests/lint-no-leaky-test-daemon.test.ts cover the four lifecycle hook variants."
        created_at: 2026-05-09T10:31:06.985Z
    kind: blocker
    resolved_at: 2026-05-09T10:31:21.761Z
    resolved_by: "@claude"
  - _ulid: 01KR62RNWHEWSJ6JGMHN028E19
    anchor:
