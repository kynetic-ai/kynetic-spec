    entries:
      - _ulid: 01KR62RNWJYNNHGKYAB2SPWF8R
        author: Jacob Chapel
        body: 'MUST-FIX: subtreeContainsAwaitOrExpect now treats every bare fetch(...) and new
          WebSocket(...) as an observation, without checking whether the URL targets the daemon.
          Repro against this snapshot: runKspec("serve start --detach --port 3456");
          fetch("https://example.com/health"); onTestFinished(() => killPid(result.pid));
          expect(true).toBe(true); reports missingCleanup even though the intervening call is not an
          await, not an assertion, and not a daemon observation. The precision requirement only
          justifies gating on daemon observations; this should use the existing localhost daemon URL
          predicates or equivalent URL filtering.'
        created_at: 2026-05-09T09:58:13.138Z
      - _ulid: 01KR64N3NK3AVAD4F5GWG8V7M8
        author: "@claude"
        body: "Fixed: subtreeContainsAwaitOrExpect now URL-filters fetch()/new WebSocket() observations via
          the new isFetchOfDaemonHostUrl / isWebSocketCtorOfDaemonHostUrl predicates. URL detection
          accepts loopback host+port forms (localhost:port, 127.0.0.1:port, [::1]:port) for inline
          literals/template literals and identifier-bound localhost URLs (existing
          localhostUrlBindings tracking). Reviewer's unrelated-fetch probe
          (fetch('https://example.com/health')) now exits 0; cycle-5 daemon-fetch (127.0.0.1:3456)
          and localhost:port literal/template/identifier forms still flag. Two new behavioral
          regressions cover the unrelated-URL fetch and WebSocket cases. The narrower
          localhostDaemonUrl reporting predicate is intentionally untouched."
        created_at: 2026-05-09T10:31:13.331Z
    kind: blocker
    resolved_at: 2026-05-09T10:31:27.799Z
