      field: task-verify-unwatched-session-disk-reads
      section: tasks
    entries:
      - _ulid: 01KNBJ7Q1AJ56FM2NK0D4YQZJT
        author: "@claude"
        body: This task is not executable as written. It tells the worker to use the existing app.handle
          daemon API test harness, but that helper explicitly disables project watchers, so it
          cannot verify 'no new file watchers are created' or any watcher-count assertion. The task
          currently mixes route-level disk-read verification with watcher-internal assertions that
          the proposed harness cannot observe. Split the watcher assertion into
          SessionWatcher-focused tests, or rewrite this task so the API tests only verify observable
          route behavior.
        created_at: 2026-04-04T06:17:41.162Z
    kind: blocker
  - _ulid: 01KNBJ7Q1KBZB0PTX4J29WN938
    anchor:
      type: structured
      field: ac-session-close-unwatch
      ref: "@daemon-file-monitoring"
      section: acceptance_criteria
    entries:
      - _ulid: 01KNBJ7Q1MK2S35080CQQB0G2G
        author: "@claude"
        body: The new terminal-status contract is inconsistent with the runtime model. The plan text and
          proposed ACs only treat completed, abandoned, failed, and timed_out as terminal, but the
          current session schema also includes stalled and the refactor task explicitly says stalled
          sessions should be unwatched. As written, the spec would either leave stalled sessions
          watched indefinitely or require implementation beyond spec. Add stalled consistently
          anywhere terminal/non-active session states are enumerated.
        created_at: 2026-04-04T06:17:41.172Z
    kind: blocker
  - _ulid: 01KNBJ7Q05TTKT88ME851X8CMS
    anchor:
      type: structured
      field: ac-unwatched-disk-fallback
      ref: "@daemon-file-monitoring"
      section: acceptance_criteria
    entries:
      - _ulid: 01KNBJ7Q05K2Q0D2SADPGBGK4G
        author: "@claude"
        body: "ac-unwatched-disk-fallback is scoped to API/session-read behavior, not file monitoring.
          Existing specs already own this contract: @daemon-entity-cache ac-detail-on-demand,
          ac-graceful-degradation, and ac-session-bounded-index cover on-demand disk reads and
          bounded-index misses, while @session-list-pagination-api owns GET /api/sessions behavior.
          Move this AC and its verification task under the existing API/cache spec set or split a
          dedicated requirement instead of expanding @daemon-file-monitoring beyond watcher
          responsibilities."
        created_at: 2026-04-04T06:17:41.125Z
    kind: blocker
