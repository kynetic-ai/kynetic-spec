    entries:
      - _ulid: 01KW6TXK2PHVRK17YM24EE0PDR
        author: Jacob Chapel
        body: "MUST-FIX: linked_work_counts reports session: 0 for every node summary even though this same
          route resolves related sessions in linkedWorkGroups via getRelatedSessionsForItem. Impact:
          root and node projections can show false linked-work counts for any spec item with
          sessions tied to linked tasks, violating
          ac-bounded-root-projection/ac-node-detail-projection/ac-linked-work-definition. Evidence:
          getRelatedSessionsForItem builds sessions from tasks linked to the item, but the count
          helper hard-codes session to 0 and tests only cover task/plan counts."
        created_at: 2026-06-28T10:03:07.222Z
    kind: blocker
  - _ulid: 01KW6TXPAN7NN2F22ZCEZ87X05
    anchor:
      type: code
      commit: 30f92fa025dac26ded72129e9b9d93b7bdd794ac
      line_end: 213
