      path: packages/web-ui/src/lib/query/ws-invalidation.ts
      side: head
    entries:
      - _ulid: 01KW6TXPANKXFGHZB9GCACHCS7
        author: Jacob Chapel
        body: "MUST-FIX: direct task-file watcher events still invalidate only task queries and do not
          invalidate specWorkspace. Impact: when a task file changes outside a route-driven
          task_updated event, linked task counts/statuses in the spec workspace remain stale until a
          reload or unrelated invalidation, violating ac-cache-and-event-coherence for task changes.
          Evidence: the daemon file fallback maps project.tasks.yaml and tasks/<id>/task.yaml here,
          while the new tests at tests/web-ui/ws-cache-invalidation.test.ts:303 and :320 assert only
          task keys."
        created_at: 2026-06-28T10:03:10.550Z
    kind: blocker
