    entries:
      - _ulid: 01KM49KPEQ5YA1JF4V5TWHBZKX
        author: Jacob Chapel
        body: "Automatic repair can discard staged tracked changes that are not checkout drift.  only
          rejects unstaged worktree edits (), then treats any index tree that matches a recent
          reflog commit as stale drift and runs HEAD is now at 05e31856c fix(dispatch): repair
          shared checkout drift. A normal staged revert/backport can match a prior branch tip tree,
          so this path will silently wipe user changes instead of degrading. I reproduced this with
          plain git by staging the branch back to : 299846199b8ecff1a60fb7fec26209a082b9c060 matched
          the prior reflog commit tree exactly, which means the reset path here would fire. This
          violates ac-3's requirement to refuse destructive repair when local tracked changes would
          be overwritten. Add a staged-change guard or a stronger drift predicate, and cover the
          staged-only case in tests."
        created_at: 2026-03-20T00:16:33.751Z
      - _ulid: 01KM4ASMK00Y3PQKGZJDH1F2JM
        author: Jacob Chapel
        body: Fixed in commit fb63a8129. Dispatch now records the last coherent shared-checkout snapshot and
          only auto-repairs when index drift still matches that prior dispatch-observed tip; staged
          changes on the current HEAD now degrade instead of resetting. Added a staged-only
          regression test.
        created_at: 2026-03-20T00:37:17.024Z
