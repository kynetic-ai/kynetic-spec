threads:
  - _ulid: 01KMM9WMEDDB75SPVAZ2W106RE
    anchor:
      type: structured
      ref: "@daemon-entity-cache"
      section: traits
    entries:
      - _ulid: 01KMM9WMEEDB4WJFF3YJCM3WXH
        author: Jacob Chapel
        body: "@daemon-entity-cache is modeled as a cache behavior spec, not an HTTP endpoint, but it
          applies @trait-api-endpoint. That injects endpoint-only ACs like 2xx/4xx status handling,
          pagination wrappers, and X-Request-Id that are unrelated to this cache contract and are
          not claimed by any task. Remove the trait here, or move actual endpoint behavior into the
          endpoint specs that expose cached data."
        created_at: 2026-03-26T05:29:17.518Z
    kind: blocker
  - _ulid: 01KMM9WMEXEJ6W9S4MKDJ2AXZE
    anchor:
      type: structured
      ref: "@task-cli-proxy-routing"
      section: dependencies
    entries:
      - _ulid: 01KMM9WMEXCXCJN8SYYNYD9S6Q
        author: Jacob Chapel
        body: task-cli-proxy-routing claims coverage of @cli-daemon-proxy ac-read-from-cache, but it depends
          only on @task-daemon-command-api. The behavior behind ac-read-from-cache actually arrives
          in @task-migrate-read-routes, which is what makes daemon-served reads come from the entity
          cache instead of the existing initContext/loadAll* path. Add the missing dependency or
          narrow the task coverage so the dependency graph matches the claimed ACs.
        created_at: 2026-03-26T05:29:17.533Z
    kind: blocker
  - _ulid: 01KMM9WMF46BF685GMD7W4FWRN
    anchor:
      type: structured
      field: ac-timeout-fallback
      ref: "@cli-daemon-proxy"
      section: acceptance_criteria
    entries:
      - _ulid: 01KMM9WMF4K71V89VGEFTJ7CYA
        author: Jacob Chapel
        body: "ac-timeout-fallback currently says the CLI falls back to direct mode after a routed command
          times out. For mutating commands, that can double-execute the mutation: the daemon may
          still commit after the client times out, then the CLI repeats the same write locally. That
          conflicts with the single-writer/coherence goal. Constrain fallback to read-only commands,
          or add an at-most-once/idempotency contract before approving this behavior."
        created_at: 2026-03-26T05:29:17.540Z
    kind: blocker
  - _ulid: 01KMM9WMH82SHFM08509K0KAPT
    anchor:
      type: structured
      ref: "@task-update-related-specs"
      section: tasks
    entries:
      - _ulid: 01KMM9WMH839CDMYTZ355GEB88
        author: Jacob Chapel
        body: task-update-related-specs is not anchored to explicit AC ids and its Covers line is prose
          rather than concrete references. It also uses spec_ref=@daemon-read-path even though the
          work edits four different existing specs. That makes the task hard to validate in
          isolation. Either turn these spec deltas into explicit plan/spec edits now, or split this
          into concrete tasks with direct target refs and real AC coverage.
        created_at: 2026-03-26T05:29:17.608Z
    kind: question
