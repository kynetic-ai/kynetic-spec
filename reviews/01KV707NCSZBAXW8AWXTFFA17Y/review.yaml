    entries:
      - _ulid: 01KV712P6A765JSK0VS8CB0YY3
        author: Jacob Chapel
        body: "MUST-FIX: N/A reason capture includes HTML/Svelte closing comment delimiters. The scanner
          declares .html/.svelte as supported AC annotation syntaxes, so ac-na-marker-preserved
          should preserve the reason text from those scanned files. With the current regex,
          parseACAnnotationLine('<!-- AC: @spec-a ac-1 — N/A: html reason -->', /<!--\\s*AC:\\s*/)
          returns naReason: 'html reason -->'. That means structured output does not preserve the
          actual reason text; it contaminates it with the source comment terminator. Add coverage
          for an HTML or Svelte N/A annotation and strip the closing delimiter from the captured
          reason while keeping coverage exclusion and integrity validation unchanged."
        created_at: 2026-06-16T01:35:03.882Z
    kind: blocker
