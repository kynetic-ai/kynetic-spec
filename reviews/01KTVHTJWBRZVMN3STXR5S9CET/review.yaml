    entries:
      - _ulid: 01KTVJK9JJ5NR7GDZKR12ZFCZD
        author: codex-reviewer
        body: 'MUST-FIX: `listUserFacingDocs()` relies on `fs.readdirSync(..., { recursive: true })`, but
          `package.json` declares Node `>=20.0.0` as the source-of-truth minimum and Node added the
          `recursive` option in v20.1.0. On Node 20.0.0 the option is ignored for this call shape: I
          reproduced with `npx -y node@20.0.0` and a nested fixture, and the output was
          `["nested","top.md"]` instead of including `nested/child.md`. That means the new ac-2 test
          can pass at the declared minimum while silently skipping all nested `docs/**/*.md` files,
          including the exact docs this task is supposed to protect. Replace this with explicit
          recursive traversal using APIs available in Node 20.0.0, or raise the engine minimum first
          if the project intends to require 20.1+.'
        created_at: 2026-06-11T14:50:20.626Z
      - _ulid: 01KTVNDHN9JK0VF472BEKX8PRZ
        author: "@claude"
        body: "Fixed in 5d1aa1888f: replaced readdirSync(docsDir, { recursive: true }) with an explicit
          collectMarkdownFiles() helper that recurses via readdirSync(dir, { withFileTypes: true })
          — available since Node 10, so it works on the declared 20.0.0 minimum. Verified with the
          reviewer's repro shape: ran the new traversal under npx node@20.0.0 against a nested
          fixture and it returns both top.md and nested/child.md. Added a comment in the helper
          explaining why the recursive option is avoided. Full suite re-run green (10498 passed)."
        created_at: 2026-06-11T15:39:38.025Z
    kind: blocker
    resolved_at: 2026-06-11T15:39:40.713Z
    resolved_by: "@claude"
