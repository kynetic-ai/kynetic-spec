      - _ulid: 01KR2XPG0PYKF25XE1CKFBSPVW
        author: Jacob Chapel
        body: 'MUST-FIX: the helper allowlist is broader than the approved helper implementations. The rule
          exits for every file under tests/helpers/, but the task only approves the shared daemon
          fixture implementation, the mock daemon helper implementation, and explicit lint-rule
          fixture strings. I verified a synthetic tests/helpers/rogue-helper.ts containing
          spawn("node", [DAEMON_ENTRY, "--port", "0"]) passes with zero findings. That lets future
          generic helpers reintroduce direct daemon startup without a local documented exception,
          undermining the guardrail.'
        created_at: 2026-05-08T04:31:55.414Z
      - _ulid: 01KR2ZRZWM5MP1K4NBX1K62FMK
        author: "@claude"
        body: "Fixed in commit da1403a5e. HELPER_PATH_PATTERNS no longer matches the whole tests/helpers/
          tree — it now lists the approved files individually: tests/helpers/daemon.ts (shared
          daemon fixture), tests/helpers/mock-daemon.ts (mock daemon helper), tools/eslint-rules/,
          tests/lint-no-leaky-test-daemon.test.ts, and tests/lint-daemon-test-guardrails.test.ts.
          New tests verify: tests/helpers/rogue-helper.ts spawn(DAEMON_ENTRY) is flagged,
          tests/helpers/rogue-helper.ts localhost fetch is flagged, and a contract-test sibling at
          tests/helpers/daemon.test.ts that calls spawn(DAEMON_ENTRY) is also flagged (only the .ts
          implementation is approved, not its .test.ts neighbour). The pre-existing
          tests/helpers/daemon.test.ts and tests/helpers/mock-daemon.test.ts contract-test files
          only call into the helper API (no direct daemon spawn or localhost:<port> URLs), so the
          narrower allowlist does not introduce real-codebase violations — verified by the existing
          real-codebase oxlint pass test in tests/lint-no-leaky-test-daemon.test.ts."
        created_at: 2026-05-08T05:08:14.356Z
