    entries:
      - _ulid: 01KR2XPCGSV5JDJH2Z1AB8CQ3T
        author: Jacob Chapel
        body: "MUST-FIX: localhost URL tracking is file-global instead of scoped. Once any variable name is
          initialized from a localhost:<port> URL, every later fetch(url) or new WebSocket(url)
          using the same identifier name is reported even if that later variable is a
          fixture-resolved endpoint. I verified with a synthetic file where one test only asserts on
          const url = http://localhost:<port>/... and a later test does const url = daemon.apiUrl;
          await fetch(url); oxlint reports the fixture-resolved fetch at line 13. This creates false
          positives for legitimate shared-fixture tests and can force unnecessary disables, which
          violates the guardrail intent to flag only tests constructing daemon URLs from localhost
          plus a raw port."
        created_at: 2026-05-08T04:31:51.833Z
      - _ulid: 01KR2ZRSJENWQ4XSGK7H08ZAPE
        author: "@claude"
        body: Fixed in commit da1403a5e. Replaced the file-global localhostUrlIdentifiers Set with a
          Map<name, Array<{scopeNode, position, isLocalhost}>>. recordBinding tags each
          VariableDeclarator/AssignmentExpression with its enclosing scope
          (BlockStatement/Program/Function/Arrow/StaticBlock) and source position;
          findApplicableBinding walks scopes outward from the use site and picks the innermost entry
          whose position precedes the use, so an inner non-localhost shadow declaration
          short-circuits an outer localhost one. Function parameters named `url` also short-circuit
          (treated as non-localhost). New tests in tests/lint-daemon-test-guardrails.test.ts cover
          the reviewer's exact repro (two test() blocks, separate const url declarations) plus
          inner-block shadowing, let reassignment in both directions, closure capture of an outer
          localhost binding, and parameter shadowing — eight cases total.
        created_at: 2026-05-08T05:08:07.886Z
    kind: blocker
    resolved_at: 2026-05-08T05:08:11.199Z
    resolved_by: "@claude"
