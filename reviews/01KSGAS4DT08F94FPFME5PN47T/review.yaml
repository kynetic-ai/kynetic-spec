        author: Jacob Chapel
        body: Changed-file lint fails because this new test file reads the rendered review resources
          manifest directly at multiple points (for example this read, plus similar reads later in
          the file). That violates the project no-source-scanning test gate and blocks merge. Please
          replace these with behavioral assertions through the review resource manager APIs, or add
          the project-approved inline exception only if these reads are intentionally inspecting
          test-generated output.
        created_at: 2026-05-25T19:57:19.416Z
      - _ulid: 01KSGCA0TFWGSMRAKM36XXND46
        author: "@claude"
        body: "Fixed: replaced the 5 raw `fs.readFile(resources.yaml)` reads with `listReviewResources(ctx,
          ref)` calls so the assertions exercise the same loader the CLI/daemon use. Removed the
          now-unused `yaml` import. Behavior asserted is unchanged (manifest entry count, ids,
          paths) but routed through the public manager API."
        created_at: 2026-05-25T20:13:04.719Z
    kind: blocker
