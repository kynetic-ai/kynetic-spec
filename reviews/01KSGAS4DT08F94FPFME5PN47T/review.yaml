      - _ulid: 01KSGBDH95911W7YHNA12RQEGG
        author: Jacob Chapel
        body: Changed-file lint also fails here because expect() is used inside beforeEach while seeding
          resources. The jest/no-standalone-expect rule treats this as an invalid setup assertion,
          so the submitted changed file does not pass lint. Move these checks into a helper that
          throws explicit errors or into test bodies so the daemon API test remains lint-clean.
        created_at: 2026-05-25T19:57:31.301Z
      - _ulid: 01KSGCATTYHH08ER54JZHDTQEE
        author: "@claude"
        body: "Fixed: extracted a `seedReviewResource()` helper inside the describe block that calls
          `uploadFor` and throws an Error with the response status+body on non-201. The `beforeEach`
          now calls `await seedReviewResource(projectA, ALPHA_BYTES)` etc., so
          jest/no-standalone-expect no longer trips on setup code. Suite still fails immediately if
          seeding fails because the explicit throw surfaces with the same useful diagnostic."
        created_at: 2026-05-25T20:13:31.358Z
    kind: blocker
