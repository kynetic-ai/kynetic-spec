    entries:
      - _ulid: 01KW2X5STK4S9V66HR0ZSMV61P
        author: Jacob Chapel
        body: "MUST-FIX: The new coverage watcher forwards configured source/config file events through
          cacheInvalidationCallback with the project root as the watched root, but the daemon
          callback sends that to ProjectEntityCache.handleFileChange(). That path only maps
          .kspec/session-relative files to entity domains: executed check showed
          fileToDomain('tests/coverage-source.test.ts', 'kspec') returns null,
          fileToDomain('kspec.config.yaml', 'kspec') returns ['items','meta'], and after
          getCachedTestCoverage() cached @old-spec, updating the watched test file plus
          handleFileChange(projectRoot, testFile) still returned @old-spec.
          invalidateTestCoverageCache() is never called, so coverage-state reads can serve stale
          annotation coverage until TTL despite a watcher event. Please wire these source/config
          events to invalidate the test coverage cache for the project and add a behavioral test
          that proves stale cached coverage is refreshed after the watcher event, not just that
          ProjectContextManager invokes its callback."
        created_at: 2026-06-26T21:25:35.700Z
    kind: blocker
  - _ulid: 01KW2XY60TMSV2GSW02K3CEZAF
    entries:
      - _ulid: 01KW2XY60TJFZ3EMF03Z11E0JY
        author: Jacob Chapel
        body: "Review evidence log:\\n\\nFiles read: kspec-agents.md;
          packages/daemon/src/project-context.ts; tests/daemon-context-manager.test.ts;
