          kspec task get; kspec review for-task/add/open; kspec item get @coverage-state-api-cache;
          rg searches for coverage/cache/watcher integration; node --import tsx runtime stale-cache
          reproduction; npm run format:check; npx oxlint changed/relevant files; npm run lint --
          --quiet; npm run typecheck; npm test; kspec validate --refs/--alignment/--completeness
          --warnings-ok.\\n\\nClaims verified: worker claim that daemon-context-manager watcher
          tests pass was verified by full npm test including tests/daemon-context-manager.test.ts.
          The implied claim that watcher callback delivery invalidates coverage-state cache was
