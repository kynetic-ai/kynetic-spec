    entries:
      - _ulid: 01KP6M45P872DS6F53YH901ZKD
        author: Jacob Chapel
        body: "Agent rename detection is still ambiguous because any unmatched scaffold-tagged agent is
          treated as proof that the next missing default was renamed. Repro: initialize a project,
          rename pr-reviewer to my-reviewer, delete task-worker, then run 'kspec setup --no-hooks
          --skip-skills --force'. The command recreates both task-worker and pr-reviewer instead of
          preserving the renamed reviewer and reseeding only the deleted worker. That violates
          ac-renamed-defaults-preserved and ac-force-reseed for mixed rename+delete cases where the
          renamed default is not encountered first in DEFAULT_AGENTS order."
        created_at: 2026-04-14T18:30:11.912Z
      - _ulid: 01KP6NMKP5JYHHXQ7ABHCTSZ22
        author: "@claude"
        body: "Fixed: Replaced greedy consumed-set approach with ULID-based per-item tracking for agent
          rename detection — the same approach already used for conventions. Each agent's ULID is
          recorded in the state file at creation time. On subsequent/force runs, a missing agent is
          looked up by its original ULID in the current meta: if an agent with that ULID exists
          under a different ID, it's a rename; if no agent has that ULID, it's a deletion. Added
          test for the exact reproduction case (rename pr-reviewer to my-reviewer, delete
          task-worker, force reseed) — task-worker is correctly recreated and pr-reviewer is
          correctly preserved as my-reviewer."
        created_at: 2026-04-14T18:56:39.109Z
    kind: blocker
    resolved_at: 2026-04-14T18:56:47.764Z
    resolved_by: "@claude"
