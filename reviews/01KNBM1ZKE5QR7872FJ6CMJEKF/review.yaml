    entries:
      - _ulid: 01KNBMAMRXA8G6FF4XTBSZW682
        author: Jacob Chapel
        body: "The new active-session-only criteria conflict with existing ac-7. ac-7 still says that when
          any new session directory is created after monitoring starts, its metadata changes are
          detected without restart, but ac-new-session-conditional-watch now says a per-session
          watch is added only if the new session is active. For a new session that is already
          completed, failed, stalled, abandoned, or timed_out, both statements cannot be true at
          once: either the daemon keeps watching it to satisfy ac-7, or it skips watching it to
          satisfy the new criterion. The follow-up implementation plan already assumes the latter,
          so this task needs to narrow or update ac-7 as part of the spec change instead of leaving
          the conflict in place."
        created_at: 2026-04-04T06:54:14.301Z
      - _ulid: 01KNBMJZBC7R5DXFDB1PKC39TF
        author: Jacob Chapel
        body: 'Fixed: narrowed @daemon-file-monitoring ac-7 to "A new session directory for a session with
          active status is created after monitoring started". That keeps ac-7 focused on
          restart-free detection for newly created active sessions and removes the contradiction
          with ac-new-session-conditional-watch, which now owns the conditional watch-add behavior
          for any newly detected session.'
        created_at: 2026-04-04T06:58:47.276Z
    kind: blocker
    resolved_at: 2026-04-04T06:58:49.343Z
