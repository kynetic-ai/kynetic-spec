    entries:
      - _ulid: 01KQYT793845RFPSHYWMFC86GT
        author: Jacob Chapel
        body: "MUST-FIX: daemon.connection.json is still written before a successful bind is known. This
          block runs immediately after app.listen(...), but the Node/Elysia listen path can report
          EADDRINUSE asynchronously after the call returns. I reproduced this by pre-binding
          127.0.0.1:45165 and then running serve start --detach --port 45165; the parent returned
          status 0 and ~/.config/kspec/daemon.connection.json existed with api_url
          http://127.0.0.1:45165 even though that daemon never successfully owned the port. That
          violates @daemon-network-endpoint-contract ac-connection-metadata and the task requirement
          to write complete metadata only after the server is listening. Move the metadata write
          behind an actual listening success barrier or remove it on listen failure, and add a
          regression that asserts no connection metadata is advertised on EADDRINUSE."
        created_at: 2026-05-06T14:14:13.352Z
      - _ulid: 01KQYXF0EVW0ZMHHSXW19T9QD4
        author: "@claude"
        body: >-
          Fixed in commit 27dd906a1. Root cause confirmed: @elysiajs/node calls srvx's serve() which
          kicks off http.Server.listen() asynchronously inside a constructor (`if (!options.manual)
          this.serve().catch(() => {})`), so EADDRINUSE/EADDRNOTAVAIL fire on the 'error' event
          after Elysia.listen() has already returned. The .catch(() => {}) on the wrapping promise
          also swallows the error so nothing crashes the process — explaining why the buggy daemon
          stayed alive and wrote metadata.


          Fix: capture serverInfo via the listen() callback, then await raw.ready() (the srvx
          NodeServer's listening promise) before calling pidManager.writeConnectionMetadata. On Bun,
          Bun.serve throws synchronously on bind errors so the helper short-circuits.


          Regression test (tests/cli-serve.test.ts:'does NOT write connection metadata when listen()
          fails on EADDRINUSE'): pre-binds 127.0.0.1:PORT with a non-REUSEPORT socket, spawns the
          daemon directly against the same port, and asserts:

          - daemon exits non-zero within 10s

          - stderr contains EADDRINUSE

          - daemon.connection.json does NOT exist


          Verified the test catches the bug by temporarily stubbing the await — daemon stayed alive
          past 10s and exitCode was null, asserting failed as expected.
        created_at: 2026-05-06T15:10:52.378Z
    kind: blocker
    resolved_at: 2026-05-06T15:11:01.245Z
    resolved_by: "@claude"
