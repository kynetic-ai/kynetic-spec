threads:
  - _ulid: 01KTRZ5FBCST2CWDQBX98FXF58
    anchor:
      type: structured
      ref: "@task-standardize-node-version-docs"
      section: tasks
    entries:
      - _ulid: 01KTRZ5FBCFGJB7ED3ZF844MWN
        author: "@claude"
        body: >-
          The prescribed testing approach conflicts with the project's enforced lint gate. Four
          tasks instruct workers to write vitest tests that read project files and assert on their
          contents: task-add-license-file (read LICENSE first lines + package.json license field),
          task-standardize-node-version-docs (read package.json engines + INSTALL.md + 2 docs files
          and compare version strings), task-prepack-full-build-and-verification (assert
          package.json prepack equals 'npm run build'), task-workspace-packages-private (assert
          packages/*/package.json private === true).


          The oxlint rule no-source-scanning/no-source-file-reads is set to 'error' for tests
          (.oxlintrc.json line 42, implemented in tools/eslint-rules/no-source-scanning.js). It
          flags ALL fs.readFile/readFileSync calls in tests whose paths are not temp/fixture dirs,
          plus assertions on the results — its stated purpose is 'Bans reading project files and
          asserting on their string contents in tests.' The task's inline claim that 'reading docs
          files in tests is legitimate artifact verification, not source scanning' does not match
          the rule as implemented; the rule makes no artifact-vs-source distinction. A worker
          following these Testing sections verbatim will fail the lint gate, and the AC coverage
          claims for @published-artifact-completeness ac-1 and @supported-runtime-range ac-1/ac-2
          rest on those tests.


          Fix: update the Testing sections to route around the rule explicitly. Options, in
          preference order: (a) behavioral assertions via subprocess output — e.g. parse `npm pack
          --dry-run --json` stdout for LICENSE/dist presence, run scripts/verify-package.cjs and
          assert exit codes (both already behavioral and lint-clean); (b) import package.json as a
          module (import attributes) instead of fs-reading it; (c) where a file-content read is
          genuinely the only way (LICENSE text, markdown version strings), instruct the worker to
          use the rule's sanctioned escape hatch — an eslint-disable comment with a written reason —
          so reviewers of the derived tasks know it was deliberate. Each affected task should state
          which mechanism to use.
        created_at: 2026-06-10T14:32:15.980Z
    kind: blocker
  - _ulid: 01KTRZ5HXMHH56KKHYXBQSMJ3R
    anchor:
      type: structured
      ref: "@main"
      section: specs
    entries:
      - _ulid: 01KTRZ5HXNGACG0GQ5VFYTGWSY
        author: "@claude"
        body: >-
          All three specs are parented under @main, which is an empty placeholder module
          (description: 'Default module for Kynetic Spec. Add your spec items here.', implementation
          not_started, zero children). Every real domain in this project has a dedicated module
          (@core, @cli, @schema, @tasks, @web-ui, @user-documentation, @shadow-branch,
          @agent-integration, @meta). Release/packaging/distribution currently has no module.
          Parking these specs in the placeholder makes them hard to discover and leaves the
          hierarchy inconsistent.


          Suggest either creating a dedicated module (e.g. 'Release and Distribution') in the plan's
          Specs section and parenting the three requirements under it, or choosing an appropriate
          existing module. The plan record's stored module is also @main — the derive target should
          match whatever is decided.
        created_at: 2026-06-10T14:32:18.613Z
    kind: question
  - _ulid: 01KTRZ5MEY8GBS5N18BGGQQKNM
    anchor:
      type: structured
      section: dependencies
    entries:
      - _ulid: 01KTRZ5MEY2A2VVAMMXAPVJWQS
        author: "@claude"
        body: >-
          Several tasks write to the same files with no declared ordering, which matters under
          parallel dispatch: (1) tests/release-packaging.test.ts is created/extended by three tasks
          — task-add-license-file ('e.g. tests/release-packaging.test.ts'),
          task-standardize-node-version-docs ('e.g. in tests/release-packaging.test.ts'), and
          task-workspace-packages-private ('add an assertion to the packaging test'). Only the
          prepack task declares depends_on task-add-license-file; the other two could be dispatched
          before the file exists or in parallel, producing duplicate files or merge conflicts. (2)
          .github/workflows/publish.yml is edited by both task-prepack-full-build-and-verification
          (adds the verify-package step) and task-ci-node-version-matrix (adds the verify-min-node
          job and needs: edge).


          Suggest either adding depends_on edges (node-docs and workspace-private depend on
          task-add-license-file; serialize the two publish.yml tasks), or making each task's
          instructions self-sufficient ('create the test file if absent') and accepting the
          conflict-resolution cost. The current 'e.g.' phrasing leaves the file choice to each
          worker, which makes collisions more likely, not less.
        created_at: 2026-06-10T14:32:21.214Z
    kind: question
  - _ulid: 01KTRZ5PZ4ZR61FFA4Q1KHW16N
    anchor:
      type: structured
      field: ac-1
      ref: "@prepublish-runtime-verification"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTRZ5PZ49MJDAWYC25F6N3KY
        author: "@claude"
        body: "The term 'newest verified major version' is self-referential: a version becomes 'verified' by
          being in the pipeline, so any second version satisfies the AC and it can never fail on the
          upper bound. Consider sharpening to something falsifiable — e.g. 'the oldest supported
          major version and at least one newer major version' (minimal change), or define the upper
          bound by policy. The spec description uses the same phrase."
        created_at: 2026-06-10T14:32:23.780Z
    kind: question
  - _ulid: 01KTRZ5SFNNY82HYK5SWEXRA4V
    anchor:
      type: structured
      field: ac-2
      ref: "@supported-runtime-range"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTRZ5SFN3JRQZVZV996X0F79
        author: "@claude"
        body: ac-2 quantifies over every 'user-facing installation or onboarding document', but the covering
          task's consistency test enumerates three named files (INSTALL.md,
          docs/getting-started/installation.md, docs/getting-started/tutorial.md) — a future doc
          stating 'Node 18' elsewhere passes the test while violating the AC. The one-time grep
          sweep in the task narrows the gap but doesn't close it for future docs. Acceptable as a
          contract-vs-approximation tradeoff, but worth acknowledging in the task's Testing section.
          Also consider relates_to @docs-getting-started-section, whose Installation page contract
          ('supported Node versions') is one of the documents this AC quantifies over.
        created_at: 2026-06-10T14:32:26.357Z
    kind: nit
  - _ulid: 01KTRZ5VX1SH2T30ES6F8M609M
    anchor:
      type: structured
      ref: "@task-add-contributing-security-docs"
      section: tasks
    entries:
      - _ulid: 01KTRZ5VX1QCAX95XJ2076Y5D0
        author: "@claude"
        body: CONTRIBUTING.md and SECURITY.md are user/contributor-facing documentation surfaces, and this
          project specs its documentation surfaces in the @user-documentation module (e.g.
          @docs-getting-started-section, @readme-landing-page each define a durable contract for a
          doc surface). This task creates two new doc surfaces with no spec coverage. Fine if
          treated as repo hygiene, but if these files are meant to have a durable contract
          (SECURITY.md especially — reporting path, response window), a small requirement spec under
          @user-documentation would match the established pattern.
        created_at: 2026-06-10T14:32:28.833Z
    kind: nit
