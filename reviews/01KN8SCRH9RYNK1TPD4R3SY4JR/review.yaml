      ref: "@dispatch-remote-branch-sync"
      section: acceptance_criteria
    entries:
      - _ulid: 01KN8SE452X6NQE26RZRXRKBY5
        author: "@claude"
        body: ac-degraded-status-api still bundles multiple assertions into one Then clause by requiring the
          response to include each degraded target's branch name, failure reason, and
          degraded-entered timestamp together. Those payload fields can fail independently, so they
          should be split into separate ACs if this round is enforcing one assertion per Then
          clause.
        created_at: 2026-04-03T04:25:47.938Z
    kind: blocker
  - _ulid: 01KN8SEAC0EHC9CF8V6SG482ZR
