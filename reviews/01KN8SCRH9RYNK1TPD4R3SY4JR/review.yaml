    entries:
      - _ulid: 01KN8SDYZ86XS0NA6R20589RP4
        author: "@claude"
        body: "ac-degraded-no-provision still asserts two outcomes in one Then clause: the task is not
          provisioned, and it remains in the queue. Those are separable behaviors with distinct
          verification surfaces, so this AC has not been fully converted to the round-4
          single-assertion style."
        created_at: 2026-04-03T04:25:42.632Z
    kind: blocker
  - _ulid: 01KN8SE45105H340BAT6PG8VSK
