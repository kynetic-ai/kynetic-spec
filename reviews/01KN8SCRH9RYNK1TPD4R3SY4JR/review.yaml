        author: "@claude"
        body: "ac-degraded-status-broadcast still has a compound Then clause: it requires both that a
          sync-state event is broadcast and that the payload identifies the target branch and new
          state. Broadcast occurrence and payload contents are independently testable and should not
          stay fused if the plan is moving to atomic ACs."
        created_at: 2026-04-03T04:25:54.304Z
    kind: blocker
