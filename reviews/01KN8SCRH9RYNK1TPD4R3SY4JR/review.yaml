        author: "@claude"
        body: "ac-pull-ff-only still combines two independently testable assertions in one Then clause: the
          sync only fast-forwards when remote is a strict superset, and the sync never creates a
          merge commit. Round 4 was supposed to split compound Then clauses into single assertions,
          so this AC still fails that rule and should be split before approval."
        created_at: 2026-04-03T04:25:37.779Z
    kind: blocker
  - _ulid: 01KN8SDYZ8BC2ZWZ6B269SGRF3
    anchor:
