        author: "@claude"
        body: ac-degraded-recovery-logged still combines two assertions in one Then clause by requiring the
          recovery log to include both the target branch name and the degraded duration. Those
          fields can be verified independently, so this AC remains compound after the round-4 split.
        created_at: 2026-04-03T04:25:59.037Z
