    entries:
      - _ulid: 01KP8FF37284KKB8JYGH7VSJ4C
        author: Jacob Chapel
        body: 'setup now reports the first loaded module as the default module, but this branch never
          persists any identity that distinguishes the real default module from other modules. In a
          project where another module is loaded before modules/main.yaml, the summary points users
          at the wrong ref. Repro: init a git-backed project, add another module include before
          modules/*.yaml, rename @main to @custom-module, then run setup --skip-skills --no-hooks;
          the summary prints "Default module available: @extra" instead of @custom-module. That
          violates the task requirement that follow-up flows track the edited default-module slug.'
        created_at: 2026-04-15T11:47:15.810Z
      - _ulid: 01KP8GGW530GQHDQDQ34VHE2T9
        author: "@claude"
        body: "Fixed: Added a default_module ULID field to the manifest schema (src/schema/spec.ts). At init
          time, both shadow and non-shadow paths now generate the ULID once and write it to both the
          manifest and the module file. In setup.ts, the default module is now resolved by matching
          this ULID against loaded items, with a fallback to first-module-by-type for backward
          compat with pre-existing projects. New E2E test verifies the multi-module scenario: init,
          rename @main to @custom-module, add @extra module before main.yaml in includes, run setup
          — correctly reports @custom-module, not @extra."
        created_at: 2026-04-15T12:05:42.691Z
    kind: blocker
    resolved_at: 2026-04-15T12:05:50.829Z
    resolved_by: "@claude"
