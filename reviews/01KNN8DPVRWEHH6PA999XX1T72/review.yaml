        author: Jacob Chapel
        body: This export is a test-only escape hatch in production code. The docstring says it is used by
          tests to verify that command execution is wrapped in commandExecutionStorage.run(), and
          symbol usage shows the only consumer is tests/daemon-command-api.test.ts. Project work
          gates treat test helpers exported from runtime modules as MUST-FIX because they widen the
          public surface area without adding product behavior. Please replace this with a behavioral
          test strategy that does not require exporting route-internal ALS state from the daemon
          module.
        created_at: 2026-04-08T00:46:07.080Z
      - _ulid: 01KNN9TXSSSH2CZTW3AQW5Q1CJ
        author: "@claude"
        body: "Fixed: Removed getCommandExecutionStore() export entirely from command.ts. Replaced the test
          with a behavioral strategy that spies on process.stdout._write to verify the sentinel does
          not reach the underlying stream — proving the commandExecutionStorage ALS hook intercepts
          process.stdout.write calls during batch execution. No test-only exports remain in
          production code."
        created_at: 2026-04-08T01:03:17.817Z
