threads:
  - _ulid: 01KS8NKFJAHKAXZN6WJQF2FF5V
    anchor:
      type: structured
      ref: "@task-plan-resource-import-and-derive"
      section: tasks
    entries:
      - _ulid: 01KS8NKFJA1TKND2FG6MF3K8Z7
        author: Jacob Chapel
        body: "The plan still leaves the plan resource command and API surface to the worker. This task says
          to add CLI/API affordances and an explicit materialize/copy flag, but it does not choose
          exact command names, flags, route shapes, collision behavior, or resource id assignment.
          Impact: automation agents can make incompatible attach/list/inspect/remove and derive-copy
          interfaces. Exact fix: specify the exact plan resource commands/API routes and the exact
          derive flag name and semantics, including id generation or required --id behavior,
          overwrite/collision handling, JSON/error behavior, and whether markdown link validation
          runs on import, set, or both."
        created_at: 2026-05-22T20:21:36.458Z
    kind: blocker
  - _ulid: 01KS8NKKRCR4TSNVAQHM5DVWQ3
    anchor:
      type: structured
      ref: "@task-review-screenshot-resource-ui"
      section: tasks
    entries:
      - _ulid: 01KS8NKKRCT0ERJM9T2TT3QCM9
        author: Jacob Chapel
        body: "Review resource support has the same unresolved command/API contract. The task says to add
          CLI/API affordances for review resources, but does not define the exact review commands,
          route paths, identifiers, overwrite/removal behavior, or structured error behavior.
          Impact: review screenshots/evidence could land with a different interface from plan
          resources or from docs. Exact fix: choose the exact `kspec review resource ...` command
          set or other final CLI shape, matching API routes, id/path rules, JSON output, and
          deletion semantics before derivation."
        created_at: 2026-05-22T20:21:40.748Z
    kind: blocker
  - _ulid: 01KS8NKR180JV45ZYCDNN7V74V
    anchor:
      type: structured
      ref: "@task-folder-backed-plan-storage-manager"
      section: tasks
    entries:
      - _ulid: 01KS8NKR18T0PPAS2D2SE2QDG2
        author: Jacob Chapel
        body: "The rebuild-index interface is not a final design. This task allows `kspec plan rebuild-index
          --dry-run/--repair/--force` or an equivalent shared rebuild command, and the review
          storage task has the same escape hatch. Impact: workers can choose different command
          surfaces and tests will encode their local choice. Exact fix: pick one command contract
          now for both plan and review rebuilds, including command names, flags, dry-run output,
          repair behavior, force behavior, and incompatibility behavior for stale or partial
          layouts."
        created_at: 2026-05-22T20:21:45.128Z
    kind: blocker
  - _ulid: 01KS8NKWB9WMQTPKFFWB7ZQZXJ
    anchor:
      type: structured
      ref: "@task-update-plan-review-storage-specs"
      section: tasks
    entries:
      - _ulid: 01KS8NKWB9FYT9PRMJKNYTV1CB
        author: Jacob Chapel
        body: "This prerequisite spec-update task overclaims `@entity-folder-migration-and-compatibility
          ac-migration-preserves-record-identity-and-unknown-fields`. The task only updates existing
          spec language and adds traits; it does not migrate any plan/review records or preserve
          unknown record fields. Impact: coverage accounting says the migration preservation AC is
          partially implemented before any migration code exists. Exact fix: remove this Covers
          claim or replace it with a spec-maintenance-specific AC; leave the migration preservation
          AC covered by `@task-plan-review-folder-storage-migration`."
        created_at: 2026-05-22T20:21:49.545Z
    kind: blocker
  - _ulid: 01KS8NM0JWQW65VF9D40K06T55
    anchor:
      type: structured
      ref: "@task-folder-backed-resources-docs"
      section: tasks
    entries:
      - _ulid: 01KS8NM0JXWE00DYC0YBDEMNEW
        author: Jacob Chapel
        body: "The docs task overclaims implementation ACs: resource resolution/static export, plan-resource
          reference behavior, new manifest defaults, and stale-layout blocking. Documentation can
          describe these behaviors, but it does not implement them. Impact: derivation could mark
          behavioral ACs covered by a docs-only task and obscure missing implementation coverage.
          Exact fix: remove implementation ACs from this task Covers line, or add a
          documentation-specific spec/AC and have this task cover only that docs contract."
        created_at: 2026-05-22T20:21:53.885Z
    kind: blocker
  - _ulid: 01KS8NM560S2V20MXTM45XDJ7K
    anchor:
      type: structured
      field: ac-resource-delete-follows-owner-delete
      ref: "@trait-entity-scoped-local-resources"
      section: acceptance_criteria
    entries:
      - _ulid: 01KS8NM560T59PYXAN1ME2RDGE
        author: Jacob Chapel
        body: "This trait AC is not concretely covered for the plan and review owners that implement the
          trait. The shared resource-model task can provide deletion helpers, but owner deletion is
          completed in the plan/review storage managers, and their Covers lines do not claim this
          inherited resource-delete behavior. Impact: a worker could implement resource manifests
          and owner folder deletion without testing that declared local resources are deleted as
          part of concrete plan/review deletes. Exact fix: add `@trait-entity-scoped-local-resources
          ac-resource-delete-follows-owner-delete` to the plan and review storage-manager
          Covers/Testing sections, or split the AC so the shared model covers only reusable helper
          behavior and concrete owner specs cover integration."
        created_at: 2026-05-22T20:21:58.592Z
    kind: blocker
