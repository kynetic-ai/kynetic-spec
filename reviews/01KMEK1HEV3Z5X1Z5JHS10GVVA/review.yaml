    entries:
      - _ulid: 01KMEKE9XYN0MJ7QGQ63838NA1
        author: "@claude"
        body: Static mode return value does not match ValidationAggregation interface. The return is {
          entity_count, ac_count, trait_ac_count, trait_count, coverage_percent } but the interface
          has { stats, warnings, entity_counts, ac_counts, orphan_count, valid, error_count,
          warning_count }. The 'as ValidationAggregation' cast hides the type error. In practice,
          the validate page uses optional chaining (aggregation?.entity_counts.items ?? 0) so the
          missing fields produce 0/undefined which falls to the ?? default — behavior is
          accidentally correct. However, the cast is a type-safety violation that could break if
          consumption code changes.
        created_at: 2026-03-24T00:20:47.166Z
    kind: nit
