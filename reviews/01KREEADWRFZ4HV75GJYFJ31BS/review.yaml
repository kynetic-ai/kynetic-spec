      side: head
    entries:
      - _ulid: 01KREF8EVW2XHV4224FYMJH6B6
        author: Jacob Chapel
        body: "MUST-FIX: this async onTestFinished callback calls the new async killPid(pid) but does not
          await it before deleting the temp directory. On assertion failure before the normal serve
          stop path, cleanupTempDir can run while the daemon is still in the bounded stop sequence,
          so cleanup no longer guarantees observed process termination before teardown completes.
          Await killPid(pid) before removing the fixture directory."
        created_at: 2026-05-12T16:10:28.604Z
    kind: blocker
