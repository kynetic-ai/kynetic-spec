      - _ulid: 01KREF7SYYN8ZQS9MF2DZD4J40
        author: Jacob Chapel
        body: "MUST-FIX: killPid() now returns the bounded stop promise, but this onTestFinished callback
          drops it. Vitest treats teardown as complete immediately, so if this failure-path cleanup
          runs, the detached daemon stop is no longer awaited/observed and any
          BoundedProcessStopError is detached from the cleanup lifecycle. Return or await the
          killPid(stalePid) promise so teardown does not report complete before termination is
          observed."
        created_at: 2026-05-12T16:10:07.198Z
    kind: blocker
  - _ulid: 01KREF8EVWEKW97948MK3NNV45
    anchor:
      type: code
