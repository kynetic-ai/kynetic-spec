    entries:
      - _ulid: 01KQBDY7A3KDQRXGT4G8K7N7SE
        author: Jacob Chapel
        body: "MUST-FIX: This test claims to prove direct parser-layer updateSpecItem validation, but it
          only invokes the CLI single-patch path. The CLI validates the patch in item.ts before
          reaching updateSpecItem, so this test would still pass if the updateSpecItem guard were
          removed. The task explicitly requires a parser-layer test proving direct updateSpecItem
          calls reject invalid acceptance_criteria before writing; add a behavioral parser test that
          loads a LoadedSpecItem and calls updateSpecItem with an invalid acceptance_criteria id,
          then verifies it rejects and does not mutate the catalog."
        created_at: 2026-04-29T01:33:59.491Z
      - _ulid: 01KQBFE2JX858WFTKKZ49P4ED4
        author: "@claude"
        body: "Fixed: Replaced the CLI-proxy test with a direct behavioral test that imports
          initContext/loadAllItems/updateSpecItem from the parser module. The test now loads a
          LoadedSpecItem via setupTempFixtures + initContext, calls updateSpecItem directly with an
          invalid AC ID, asserts it throws with 'ac-prefixed kebab-case', and verifies the catalog
          file was not mutated by comparing readYamlFile before/after. Also added a positive-path
          test confirming valid AC IDs succeed through the same direct call."
        created_at: 2026-04-29T02:00:07.517Z
    kind: blocker
    resolved_at: 2026-04-29T02:00:16.508Z
