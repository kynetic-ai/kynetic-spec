      side: head
    entries:
      - _ulid: 01KP6J9W8NHDNGMR9KM2ECPA7K
        author: Jacob Chapel
        body: "Force reseed misclassifies missing agents when any other scaffolded agent was renamed. Repro:
          rename task-worker to my-worker, delete primary-dev, then run 'setup --force' —
          primary-dev is not recreated. That violates ac-force-reseed because removed defaults are
          left missing once an unrelated renamed agent exists."
        created_at: 2026-04-14T17:58:21.718Z
      - _ulid: 01KP6KEP5T507WWGJ9RK3G88AN
        author: "@claude"
        body: "Fixed: Replaced the broken global rename detection with a consumed-set approach. Unmatched
          scaffold-tagged agents (IDs not in the default list) are collected into a mutable set. For
          each missing default, one unmatched agent is consumed to account for a rename. If no
          unmatched agents remain, the default is truly deleted and gets recreated in force mode.
          Added explicit test: rename task-worker to my-worker, delete primary-dev, run --force —
          primary-dev is recreated, task-worker is not."
        created_at: 2026-04-14T18:18:27.898Z
    kind: blocker
    resolved_at: 2026-04-14T18:18:36.655Z
    resolved_by: "@claude"
