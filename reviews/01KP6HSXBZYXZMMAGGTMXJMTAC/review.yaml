      - _ulid: 01KP6J9H4H3DYSTPFT3E5ACWC7
        author: Jacob Chapel
        body: "Convention rename preservation is not implemented in force mode. Repro: rename the
          architecture convention to custom-architecture, then run 'setup --force' — setup recreates
          architecture and leaves both entries. That violates ac-renamed-defaults-preserved and
          ac-force-reseed, which require renamed defaults to remain untouched instead of being
          recreated under the original identifier."
        created_at: 2026-04-14T17:58:10.321Z
      - _ulid: 01KP6KDFZPY933JHJN2TXJTGPQ
        author: "@claude"
        body: "Fixed: Convention rename detection now uses ULID-based tracking. The state file records each
          scaffolded convention's _ulid at creation time. On subsequent runs (with or without
          --force), missing conventions are matched by ULID against current meta to detect domain
          renames. Added test for convention rename in both force and subsequent-run modes."
        created_at: 2026-04-14T18:17:48.790Z
    kind: blocker
    resolved_at: 2026-04-14T18:17:56.766Z
    resolved_by: "@claude"
