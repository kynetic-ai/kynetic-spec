    entries:
      - _ulid: 01KRFGEGJBC910B2KB1FQ66TQN
        author: Jacob Chapel
        body: "MUST-FIX: statementBindsNameOpaquely still misses TypeScript enum value bindings, so enum
          declarations can shadow approved cleanup helpers and be credited as daemon cleanup.
          Evidence: an ad hoc oxlint fixture with import { killPid } from './helpers/daemon', then
          inside the test body 'enum killPid { noop }' before onTestFinished(() => killPid(pid)),
          exited 0 with only no-unused-vars and no no-leaky-test-daemon error. The same false
          negative reproduces inside a helper body with 'enum stopPidBounded { noop }' shadowing the
          approved shared primitive import. At runtime these enum bindings are not callable cleanup
          functions, so the cleanup callback throws and the daemon is left running. This violates
          @daemon-test-guardrail-precision ac-cleanup-helper-origin-is-trusted and
          ac-cleanup-operation-terminates-daemon; treat TSEnumDeclaration or equivalent runtime TS
          declarations as opaque local bindings before falling through to approved-import trust."
        created_at: 2026-05-13T01:50:29.963Z
      - _ulid: 01KRFJPPTF6NA9YD2SH2SZTA1S
        author: "@claude"
        body: "Fixed: extended statementBindsNameOpaquely to recognise TSEnumDeclaration (the reviewer's
          exact probe shape), TSModuleDeclaration (namespace with body, non-declare), and
          TSImportEqualsDeclaration alongside the existing ClassDeclaration handling. All three emit
          a runtime binding whose value is not callable as a cleanup primitive, so calling
          `<name>(pid)` at teardown throws TypeError and leaves the daemon running. The export
          wrapper unwrap path already routes through statementBindsNameOpaquely so `export enum
          killPid { noop }` is handled by the same descent. Pure type-only declarations (interface,
          type alias, bodyless `declare` ambient forms) are erased by the TS compiler and so cannot
          shadow a runtime binding; they are deliberately NOT treated as opaque. Added 4 regression
          tests in tests/lint-no-leaky-test-daemon.test.ts mirroring the reviewer's probes: (1) enum
          killPid call-site shadow of approved import, (2) enum stopPidBounded helper-body shadow of
          approved shared primitive, (3) export enum killPid module-top shadow, and (4) namespace
          killPid TSModuleDeclaration shadow. Verified at shell level too: the reviewer's exact
          probe (import { killPid } from './helpers/daemon' + inner 'enum killPid { noop }' +
          onTestFinished(() => killPid(pid))) now exits 1 with the no-leaky-test-daemon error, and
          the helper-body 'enum stopPidBounded { noop }' shadow likewise. Targeted lint suites: 379
          tests pass (4 new). Full npm test: 9166 passed, 5 skipped of 9171."
        created_at: 2026-05-13T02:29:55.663Z
    kind: blocker
    resolved_at: 2026-05-13T02:30:04.407Z
    resolved_by: "@claude"
