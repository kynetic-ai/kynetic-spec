    entries:
      - _ulid: 01KM7YVWK4M0J3T1R3SX7Z507N
        author: Jacob Chapel
        body: 'MUST-FIX: history entries still ignore configured project author identity. This code always
          passes `author: undefined` into mutation metadata, and
          [createHistoryEntry](src/parser/split-backend.ts) falls back to `getAuthor()` without
          `ctx.config?.identity?.author`. In a split-storage project with `identity.author:
          "@config-author"` and no `KSPEC_AUTHOR`, task notes are authored as `@config-author` but
          task.yaml history records the git/system user instead. I reproduced that locally in a temp
          repo: the first history entry for a `task-set` mutation came back as `{"author":"Git
          User",...}` instead of `@config-author`, so @task-core-data-file ac-3 is still violated
          for configured-author projects.'
        created_at: 2026-03-21T10:25:45.572Z
