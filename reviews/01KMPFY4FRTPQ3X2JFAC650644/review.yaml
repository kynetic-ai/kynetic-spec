      - _ulid: 01KMPGRH2Y6QXG6KE3Q0ZVF83W
        author: "@claude"
        body: "Fixed: Added ULID-pattern recognition to fileToDomain() so session paths (bare ULID or
          ULID/filename) now correctly map to the sessions domain. The server.ts callback no longer
          needs special-case handling for .kspec-sessions paths — all paths flow through
          handleFileChange → fileToDomain. Added unit test verifying fileToDomain maps bare ULID,
          ULID/metadata.json, and ULID/events.jsonl to sessions, plus a behavioral test verifying
          handleFileChange invalidates the sessions domain when called with a session watcher path."
        created_at: 2026-03-27T02:07:51.902Z
