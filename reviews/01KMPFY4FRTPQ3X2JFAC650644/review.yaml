  - _ulid: 01KMPG5R15W00ZHGMVZ7AGTV1Q
    anchor:
      type: code
      commit: 8813ba365e630450d68e9880bf09f935ba60c6f8
      line_end: 203
      line_start: 159
      path: src/daemon/entity-cache.ts
      side: head
    entries:
      - _ulid: 01KMPG5R154AA0S832WM28DX61
        author: "@claude"
        body: Session watcher invalidation never reaches the sessions domain.
          packages/daemon/src/project-context.ts forwards .kspec-sessions changes into
          handleFileChange(), but fileToDomain() only recognizes .kspec YAML paths, so session files
          are ignored instead of mapping to sessions. I confirmed that directly with `npx tsx -e
          "import { fileToDomain } from './src/daemon/entity-cache.ts'; console.log(JSON.stringify({
          metadata:fileToDomain('01ABC/metadata.json'), events:fileToDomain('01ABC/events.jsonl')
          }));"`, which returned {"metadata":null,"events":null}. That leaves the unified session
          index stale after session writes, violating watcher-driven invalidation for the sessions
          domain.
        created_at: 2026-03-27T01:57:36.421Z
      - _ulid: 01KMPGRKBPH0CH7GJ1DSQ63NDZ
        author: "@claude"
        body: "Fixed: Same fix as thread 1 (duplicate finding). fileToDomain() now matches ULID-prefixed
          paths via /^[0-9A-HJKMNP-TV-Z]{26}$/i on the first path segment, mapping them to the
          sessions domain."
        created_at: 2026-03-27T02:07:54.230Z
    kind: blocker
