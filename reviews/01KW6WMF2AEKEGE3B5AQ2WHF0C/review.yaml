    entries:
      - _ulid: 01KW6XETA7KRY788DXG3QDT8WE
        author: codex-pr-reviewer
        body: "MUST-FIX: The projection endpoints accept any non-negative `limit` and then use that value
          directly for root and child slices. That means `/api/spec-workspace/root?limit=999999` or
          a node request with the same limit can ask the backend/static path to return every visible
          child in one response, which violates @unified-spec-workspace-data-projection's bounded
          projection contract. Evidence: `parsePagination` validates only digits and returns the
          caller value unchanged; `buildRootProjection` and `childSections` slice with
          `pagination.offset + pagination.limit`, and the static helpers mirror the same uncapped
          `params.limit` in `packages/web-ui/src/lib/api-static.ts` lines 780-839. Please enforce a
          server/static maximum (or reject over-limit values with the documented validation shape)
          and add regression coverage for over-limit requests."
        created_at: 2026-06-28T10:47:28.839Z
      - _ulid: 01KW6ZEANY64B476QP6CSQVX13
        author: Jacob Chapel
        body: "Fixed in b5106f14ba: added shared SPEC_WORKSPACE_MAX_PAGE_SIZE, daemon validation now rejects
          limit values over 100 with the existing validation_error shape, and static root/node
          projection helpers cap numeric limits to the same maximum before slicing. Added daemon and
          static regressions for over-limit root/node pagination."
        created_at: 2026-06-28T11:22:09.981Z
    kind: blocker
    resolved_at: 2026-06-28T11:22:13.044Z
    resolved_by: Jacob Chapel
