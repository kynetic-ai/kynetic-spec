        author: Jacob Chapel
        body: "MUST-FIX — The plan's required validation command is known red. `kspec validate --refs
          --warnings-ok` currently exits 4 with seven ambiguous-reference errors (@observations and
          @spec-plan-import), so `kspec validate --warnings-ok` in Tasks 1–3, 9, and 10 cannot pass
