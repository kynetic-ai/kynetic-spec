    entries:
      - _ulid: 01KXH5DAZE0JYXVA2DV19H27Z6
        author: Jacob Chapel
        body: MUST-FIX — The product prerequisites are not proportional to a documentation-correction plan.
          Task 1 mixes potentially necessary authoring/redaction work with a new 600-second
          timeout/process-group contract and shell preflight; Task 2 adds four workspace commands,
          destructive reset/cleanup semantics, root-overlap validation, and retention projection;
          Task 3 requires completion of the entire 50-AC in-progress remote-sync feature. Accurate
          docs can remove the nonexistent reset suggestion, document current limitations, and
          label/omit in-progress remote-sync behavior—the plan itself permits that alternative in
          Task 9. Retain only implementation that blocks a specific accurate public statement, and
          move or defer the remaining product hardening.
        created_at: 2026-07-14T20:34:35.118Z
    kind: blocker
  - _ulid: 01KXH5DEHGMXJ0DYQB0YZ8JYJG
    anchor:
      type: structured
      ref: "@task-document-dispatch-workspace-configuration"
      section: description
    entries:
      - _ulid: 01KXH5DEHHZE37PJV230QBAZG3
        author: Jacob Chapel
        body: MUST-FIX — Documentation ownership and AC coverage bypass the existing documentation
          hierarchy. @user-documentation is a module with no ACs, while @docs-guides-section
          ac-1..ac-3, @docs-concepts-section ac-1..ac-2, @docs-troubleshooting-section ac-1..ac-3,
          @docs-navigation-shape ac-1..ac-2, @docs-search ac-1..ac-3, @docs-reachability, and
          @readme-landing-page already own the behaviors this plan changes. Tasks 4–7 link only
          dispatch implementation specs, and Tasks 8–10 claim non-existent module-level 'full
          surface/closure' ACs. Add exact existing documentation AC references (and only genuinely
          missing new ACs) so every new page, index, search/render change, and README change has a
          real behavioral owner and test mapping.
        created_at: 2026-07-14T20:34:38.769Z
    kind: blocker
  - _ulid: 01KXH5DKGS09DYQJ61DRMACVNM
    anchor:
      type: structured
      ref: "@task-document-dispatch-bootstrap-recovery"
      section: dependencies
    entries:
      - _ulid: 01KXH5DKGSHR2Z1Z9W8TM99XRM
        author: Jacob Chapel
        body: MUST-FIX — The intra-plan graph permits tasks to consume files before they exist and creates
          parallel write conflicts. Task 5 extends tests/dispatch-workspace-docs.test.ts and edits
          the overview without depending on Task 4, which creates that test and also edits the
          overview. Tasks 6 and 7 modify docs/guides/configuring-dispatch-workspaces.md and extend
          the same test without depending on Task 4. Task 8 modifies the runner
          guide/overview/assignment page and the same test in parallel with Tasks 4 and 7, and
          promises a canonical guide link before Task 4. Task 5 also requires links to
          troubleshooting pages that Tasks 6/7 create while Task 7 depends on Task 5. Reassign
          shared-file ownership or add an acyclic serialization chain so every file, link target,
          test, and command exists before use.
        created_at: 2026-07-14T20:34:43.865Z
    kind: blocker
  - _ulid: 01KXH5DPY73RNKBX2R94YQAM4V
    anchor:
      type: structured
      ref: "@task-add-dispatch-workspace-operator-surface"
      section: dependencies
    entries:
      - _ulid: 01KXH5DPY7T2GYTAZVRY5NC3JC
        author: Jacob Chapel
        body: MUST-FIX — The plan ignores an active overlapping task graph.
          @plan-dispatch-lifecycle-pause-resume-and-stop-controls is active on its own plan branch
          and has pending tasks changing src/agent-runtime/dispatch.ts, bootstrap.ts, workspace.ts,
          src/cli/commands/agent.ts, the daemon dispatch route, cleanup behavior, and CLI/public
          projections. In particular @task-patch-dispatch-workspace-cleanup-spec will add
          ac-controlled-evidence-protected and @task-protect-controlled-dispatch-evidence changes
          workspace cleanup, so this plan's 'all cleanup ACs' snapshot is already incomplete. Gate
          these tasks on that plan being integrated (or explicitly depend on all required merged
          prerequisites and refresh the audit afterward); cross-plan task dependencies alone do not
          make plan-branch code available on dev.
        created_at: 2026-07-14T20:34:47.367Z
    kind: blocker
  - _ulid: 01KXH5DTFN49PB0TQFX70CY7HK
    anchor:
      type: structured
      ref: "@task-add-dispatch-workspace-operator-surface"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXH5DTFNDEPFHGMCW1E13CQB
        author: Jacob Chapel
        body: MUST-FIX — Proposed ACs are incomplete and non-atomic. Task 2 never supplies IDs/text for the
          promised @cli-agent-commands ACs; ac-operator-inspection combines list/show, many field
          families, and secret omission; ac-dispatch-root-exclusive-ownership combines destructive
          ownership with protected-root overlap validation; guarded reset and operator cleanup hide
          confirmation/force/refusal/no-mutation behavior behind vague 'prerequisites
          hold'/'existing policy' wording. Task 1's output-redaction AC combines persisted and
          displayed surfaces, and Task 3 adds a large status projection (effective mode, remote,
          interval, failures, deferral, next action) without any proposed AC. Replace 'all
          artifact-protection ACs' and 'corresponding ACs' with exact IDs, split independently
          testable outcomes, and cover every new CLI/error/status behavior before implementation.
        created_at: 2026-07-14T20:34:50.997Z
    kind: blocker
  - _ulid: 01KXH5DY6VWNNENP52ANV478NC
    anchor:
      type: structured
      ref: "@task-whole-public-doc-consistency-sweep"
      section: description
    entries:
      - _ulid: 01KXH5DY6VFW97TMBZ8S1R26JT
        author: Jacob Chapel
        body: MUST-FIX — The inventory cannot prove whole-document closure as specified. It requires a path
          for every entry but also includes virtual CLI-help snapshots, which have no repository
          path. Its enumerated globs omit tracked documentation surfaces such as
          packages/web-ui/README.md and
          .github/ISSUE_TEMPLATE/maintainer-approved-issues-and-features.md, and it does not state
          an inclusion/exclusion rule for AGENTS.md, CLAUDE.md, .claude skills, project-local
          skills, or fixture markdown even though it says no existing file may be silently omitted.
          Define a deterministic tracked-surface universe, explicit exclusion records/reasons, and a
          surface kind/command identifier for non-file help/scaffold surfaces; then make the
          completeness test compare against that universe.
        created_at: 2026-07-14T20:34:54.811Z
    kind: blocker
