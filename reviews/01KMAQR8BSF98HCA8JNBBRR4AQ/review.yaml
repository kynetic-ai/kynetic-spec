      - _ulid: 01KMAQWP8GXHZSHNVSP5WSCY8W
        author: Test User
        body: The dispatch engine still opts every invocation into the 100ms idle grace period by
          unconditionally passing DEFAULT_IDLE_GRACE_MS. That means sessions linger after the first
          turn even when there are no session.idle consumers and no interactive mode, which is
          exactly the backward-compat case ac-11 says must have no observable behavior change from
          single-turn dispatch. The new tests only cover the opt-in path where idleGracePeriodMs is
          set explicitly, so this regression is not exercised.
        created_at: 2026-03-22T12:21:35.120Z
