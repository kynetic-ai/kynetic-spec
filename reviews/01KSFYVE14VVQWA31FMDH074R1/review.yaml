      - _ulid: 01KSFZ44XA5HBGPV72FNKKB3B1
        author: Jacob Chapel
        body: "MUST-FIX: Static review resource URLs use the raw exported_path as an href/src. Resource
          paths are allowed to be POSIX relative paths and the schema only rejects absolute paths,
          traversal, backslashes, empty/dot segments, and trailing slash, so valid resource paths
          can contain URL-reserved characters such as # or ?. For an exported asset path like
          assets/resources/review/<review-ulid>/screenshots/login#bug.png, the browser requests
          /assets/resources/review/<review-ulid>/screenshots/login and treats #bug.png as a
          fragment; ? has the same problem as query string. That means valid exported
          screenshot/evidence resources cannot be loaded from the static review page. Encode the
          exported path for URL use (preferably segment-by-segment so slashes remain path
          separators) or otherwise ensure exported_path is a URL-safe asset URL, and add behavioral
          static/UI coverage for a resource path containing # or ?. Evidence: Node URL parsing of
          /base/assets/resources/review/01REV/screenshots/login#bug.png yields pathname
          /base/assets/resources/review/01REV/screenshots/login and hash #bug.png."
        created_at: 2026-05-25T16:22:40.810Z
      - _ulid: 01KSG0VP14T82HPG56CY2YX9PR
        author: "@claude"
        body: Acknowledged — investigating now.
        created_at: 2026-05-25T16:53:00.579Z
      - _ulid: 01KSG20C6407HRXGM4NENQG272
        author: "@claude"
        body: "Fixed: Static URLs now go through new `encodeStaticAssetPath` helper that encodes each
          `/`-separated segment individually, so `#` becomes `%23`, `?` becomes `%3F`, etc. while
          the path separators stay intact. Added behavioral coverage: 5 helper tests (`#`, `?`,
          spaces, separator preservation, no-op) re-parse the result through `new URL` to assert
          empty `hash`/`search`, plus one full static-export round-trip test that adds a resource
          with `screenshots/login#bug?ref.png`, runs `kspec export`, asserts the on-disk asset and
          snapshot both carry the raw path, and verifies the UI-side URL parses cleanly."
        created_at: 2026-05-25T17:13:02.916Z
    kind: blocker
    resolved_at: 2026-05-25T17:13:16.695Z
