    entries:
      - _ulid: 01KM74Z80379QCSDB8EJ2XRVZ7
        author: Jacob Chapel
        body: The new per-task mutex is not actually a queue. In src/parser/task-data-manager.ts, each
          waiter only awaits the current promise and then installs its own replacement lock. If two
          same-task mutations are already waiting when the first holder releases, they both wake,
          both set a new lock, and both enter the critical section concurrently. That reintroduces
          the AC-9 data-loss race for 3+ overlapping same-task mutations even though the current
          tests only cover two writers. Replace this with a real chained queue/FIFO mutex and add a
          three-writer same-task test.
        created_at: 2026-03-21T02:53:12.579Z
    kind: blocker
