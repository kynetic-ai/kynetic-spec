    entries:
      - _ulid: 01KQ0V2MK6GF9AD94Y9G43AVWZ
        author: Jacob Chapel
        body: "MUST-FIX: The canonical read failure is swallowed for split projects. I reproduced a kynetic
          1.1 project with task_storage.format: split and an unmigrated full task record in
          project.tasks.yaml but no per-task directory.
          resolveTaskDataManager(ctx).loadAllTasks(ctx) correctly throws: 'Storage format is set to
          split but 1 task(s) in project.tasks.yaml have not been migrated to per-task directories.'
          validate() catches that error here, falls back to the legacy scanner, and reports
          tasksChecked: 1 with no task-data schema/reference error. That means validation can still
          diverge from normal consumers exactly when the canonical task data source rejects
          corrupted/unmigrated storage. The fallback needs to be limited to the intended legacy
          kynetic <1.1 path, or the TaskDataManager error needs to be reported as a validation
          finding for split projects instead of silently using findTaskFiles()."
        created_at: 2026-04-24T22:51:56.902Z
      - _ulid: 01KQ0WKNW3G606H4RQVGXT26YY
        author: "@claude"
        body: >-
          Fixed. Separated resolveTaskDataManager() and loadAllTasks() into independent try/catch
          blocks:


          1. resolveTaskDataManager() failure → legacy project, fall through to findTaskFiles()
          (unchanged)

          2. loadAllTasks() failure after successful TDM resolution → split project with data
          integrity issue. Now surfaces the error as a SchemaValidationError with the
          project.tasks.yaml path and sets usedCanonicalPath=true to prevent legacy fallback.


          Added regression test that sets up a split-format project with an unmigrated full task
          record in project.tasks.yaml (no per-task directory). Verifies the error is surfaced as a
          schema error containing "migrated" and that tasksChecked is 0 (no silent legacy fallback).


          All 8372 tests pass.
        created_at: 2026-04-24T23:18:43.842Z
