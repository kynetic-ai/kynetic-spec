    entries:
      - _ulid: 01KP9VD4X8ZBHWWY0XKMM1K8YN
        author: Jacob Chapel
        body: When  is missing, the upgrade backfill rewrites  to the ULID of the newly scaffolded module
          instead of preserving the project’s existing default module. That silently changes which
          module later setup flows treat as the canonical default, so a project that intentionally
          repointed  (for example after adopting a different module as its default) is behaviorally
          altered just by running . I reproduced this against the built CLI by creating a second
          module, setting  to that module’s ULID, deleting , and observing the manifest switch to a
          fresh ULID after . The scaffold step should only append  and leave  unchanged unless the
          field is currently absent.
        created_at: 2026-04-16T00:35:09.352Z
      - _ulid: 01KP9WNCBER5S8M8RKYF3A5W5Z
        author: "@claude"
        body: "Fixed: Changed line 1303 from unconditional assignment to conditional — now only sets
          default_module when the field is absent or falsy. Added a test that sets default_module to
          a custom ULID, removes modules/main.yaml, runs upgrade, and verifies the manifest
          preserves the original default_module value while still scaffolding the new module file."
        created_at: 2026-04-16T00:57:07.693Z
    kind: blocker
    resolved_at: 2026-04-16T00:57:17.228Z
