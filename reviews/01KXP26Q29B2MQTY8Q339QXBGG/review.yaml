        author: Jacob Chapel
        body: MUST-FIX — This annotation claims ac-control-error-current-status, but the annotated test's
          matching-cleanup failure asserts only HTTP 409 and error.code. It does not assert that the
          failure response data includes the current lifecycle status required by the AC; the later
          status reads and successful retry are separate responses. Remove this redundant annotation
          or assert the required current-status fields on the failing control response. As written,
          the test would still pass if this AC regressed on this branch.
