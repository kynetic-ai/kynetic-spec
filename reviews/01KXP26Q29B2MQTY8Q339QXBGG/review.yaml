        author: Jacob Chapel
        body: "MUST-FIX — This annotation claims @trait-api-endpoint ac-3, which requires an invalid request
          body to return HTTP 400 with the documented error/details validation shape. The annotated
          test sends only schema-valid control bodies; its negative request is a valid body rejected
          as invalid_transition with HTTP 409. Evidence: the full test body has no 400/details
          assertion, and the fresh suite therefore cannot make this annotation meaningful. Remove
          the inaccurate annotation or add a behavioral invalid-body assertion that proves the trait
          AC. False AC attribution obscures which behavior is actually covered."
        created_at: 2026-07-16T18:34:33.153Z
    kind: blocker
