    entries:
      - _ulid: 01KM45XS1PW3K1TEHEBZP8XESW
        author: Jacob Chapel
        body: This refactor routes target sync through the isolated-target helper, but it also drops the
          explicit 30s fetch timeout and 10s ff-merge timeout that `_syncTargetBranch()` had before.
          If the remote stalls instead of returning an immediate git error, dispatch now blocks
          inside `git fetch`/`git merge` rather than reporting a transient sync failure and retrying
          on the next interval, which regresses the non-fatal sync behavior this task is supposed to
          preserve. Keep the targeting helper, but preserve the previous timeout semantics (or add
          equivalent timeout support in the helper).
        created_at: 2026-03-19T23:12:09.782Z
      - _ulid: 01KM46PER38TEFKVXBY9JD65YB
        author: Jacob Chapel
        body: Fixed in commit fadb999f7. Restored the original 30s fetch timeout and 10s ff-only merge
          timeout while keeping target sync on runDispatchIntegrationTargetGit(), and added a
          regression test that asserts those timeout options are still passed through the isolated
          targeting helper.
        created_at: 2026-03-19T23:25:38.435Z
