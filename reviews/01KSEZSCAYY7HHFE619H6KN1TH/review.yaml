    entries:
      - _ulid: 01KSF0JHR7A9HNCF3X8KKCDJYE
        author: Jacob Chapel
        body: "MUST-FIX: `--materialize-resources` copies plan resource bytes through unchecked filesystem
          paths. This loop builds `sourceAbs` with `path.join(planResourcesDir, planResource.path)`
          and passes it directly to `fs.copyFile`, so a pre-existing symlink at the plan resource
          leaf or an intermediate directory is followed. I reproduced this in a temp project by
          replacing `.kspec/plans/<plan>/resources/doc.txt` with a symlink to an outside file, then
          running `kspec plan derive @mat-plan --module @mod --materialize-resources`; the command
          exited 0 and the derived task resource contained `OUTSIDE_SECRET`. That violates the
          shared resource contract that symlink escapes are forbidden and lets materialization
          import bytes from outside the plan tree. Use the same symlink-safe resolver/mutation guard
          pattern here before copying, and add a regression test for materialization."
        created_at: 2026-05-25T07:28:46.855Z
      - _ulid: 01KSF2210TW9GXBBKR1RJ79Z2Z
        author: "@claude"
        body: "Fixed in cec6e309c6. Added preflightMaterializationSafety(ctx, planUlid, taskPlans) that
          walks every materialization source path through assertSafeResourceMutationPath BEFORE any
          createTask runs. A symlinked plan resource leaf (or intermediate directory) now rejects
          the entire derive with usage_error (exit code 2) and no task is written to disk. The
          materialize loop itself re-applies the same guard on both source and destination as
          defense in depth against TOCTOU between preflight and copy. Two regression tests added:
          (a) plant a symlink at the plan resource leaf pointing at an outside file, derive
          --materialize-resources, assert exit 2 + stderr mentions 'symlink' + task lookup fails (no
          partial task on disk); (b) replace plan resources/sub/ with a symlink to an outside
          directory and verify the same behavior."
        created_at: 2026-05-25T07:54:42.586Z
    kind: blocker
    resolved_at: 2026-05-25T07:54:56.474Z
    resolved_by: "@claude"
  - _ulid: 01KSF0JRZ0RFTS4ZGSF9J66T2C
    anchor:
      type: code
      commit: 7e8ff3aeec93b5586c92a90e58c70db9c4e3b4cc
      line_end: 567
      line_start: 559
      path: src/cli/commands/plan.ts
      side: head
    entries:
      - _ulid: 01KSF0JRZ0BQS6K53QYPAH2MCD
        author: Jacob Chapel
        body: "MUST-FIX: Materialized resource ids are derived as `plan-${planResource.id}` without
          validating that the prefixed id still satisfies the resource id contract before any task
          is created. `plan resource add` accepts ids up to 128 characters, but prefixing a valid
          128-character id creates a 133-character task resource id; `computeResourceMetadata` then
          fails after `createTask` has already written the derived task. I reproduced this with a
          128-character `a...a` plan resource id: `plan derive --materialize-resources` exited 1
          with the id validation error, but `task get @implement-doc --json` succeeded and showed
          the partially-created task still present with the original plan-owned `resource_refs`.
          Valid input should not leave partial derived tasks behind, and materialization needs a
          deterministic strategy for ids that would overflow after adding `plan-`."
        created_at: 2026-05-25T07:28:54.240Z
      - _ulid: 01KSF225DZ7CQE8Q7WJ1JJBR2X
        author: "@claude"
        body: "Fixed in cec6e309c6. The same preflightMaterializationSafety pass now validates the computed
          task id (plan-<original-id>) against validateResourceId BEFORE any createTask runs. A
          valid 128-char plan resource id that would produce a 133-char task id now fails fast with
          usage_error (exit code 2) and leaves no partial derived task on disk. Deterministic
          strategy: reject with a clear message telling the user the plan resource id must fit
          within 123 chars before the 'plan-' prefix is added so derive --materialize-resources can
          succeed. Centralized the prefix in buildMaterializedResourceId(planResourceId) so the
          preflight and the materialize loop cannot drift apart. Regression test plants a 128-char
          id, runs derive --materialize-resources, asserts exit 2 + stderr matches /cannot be
          materialized/ + task lookup fails."
        created_at: 2026-05-25T07:54:47.103Z
    kind: blocker
    resolved_at: 2026-05-25T07:55:01.027Z
    resolved_by: "@claude"
