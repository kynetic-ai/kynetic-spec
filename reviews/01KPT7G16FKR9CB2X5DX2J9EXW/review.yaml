      - _ulid: 01KPT7GSBENSP68CRFPG8VTAFY
        author: Jacob Chapel
        body: "This task's scope is guidance/docs/rendered-skill wiring, but its Covers block claims runtime
          helper behaviors (no-op merge, dirty-target refusal, conflict-safe exit) that are actually
          implemented and behaviorally verified in @task-detached-reviewer-merge-helper. That makes
          task ownership non-standalone and reviewability ambiguous: a reviewer cannot tell which
          task is responsible for proving those helper mechanics. Narrow this task's coverage to
          ac-helper-path-in-reviewer-guidance and keep the runtime merge mechanics ACs owned by the
          helper-mechanics task."
        created_at: 2026-04-22T09:14:42.415Z
    kind: blocker
  - _ulid: 01KPT7GSDTYJ9EAZNNYHF74KWF
    anchor:
      type: structured
      section: dependencies
    entries:
      - _ulid: 01KPT7GSDTTPKYV16C7TEEXE7G
        author: Jacob Chapel
        body: The dependency graph is over-constrained and hides the real prerequisite edge.
          @task-detached-reviewer-merge-helper does not appear to need portable supporting-file
          reference rewriting in order to implement and test the helper script's merge mechanics;
          existing supporting-file copying already exists. The portable-reference work is needed
          when reviewer guidance/rendered skill content must point at that helper path, which is
          @task-detached-reviewer-merge-guidance's concern. Remove the task-2 -> task-1 dependency
          unless the mechanics task truly cannot proceed without it, and if you decouple them, make
          @task-detached-reviewer-merge-guidance depend directly on both prerequisites.
        created_at: 2026-04-22T09:14:42.490Z
    kind: blocker
