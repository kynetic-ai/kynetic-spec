        author: "@claude"
        body: "Fixed: parsePlanDocument now checks the first significant (non-blank) line instead of using a
          multiline regex. The regex no longer uses the 'm' flag, so a heading later in the document
          does not match. Added parser unit test and CLI integration test reproducing the late-title
          scenario."
