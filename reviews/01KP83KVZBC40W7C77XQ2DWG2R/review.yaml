        body: "The new title validation still accepts a top-level heading anywhere in the document because
          it searches for a heading on any line instead of checking the first significant element. I
          confirmed this with an isolated CLI reproduction: a file that starts with prose and only
          later contains a top-level heading imported successfully with exit code 0, which violates
          the missing-title acceptance criterion for plans whose first significant element is not
          the title heading."
        created_at: 2026-04-15T08:32:37.883Z
