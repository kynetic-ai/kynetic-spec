    entries:
      - _ulid: 01KR4A6T4BP489BC3Z3G3DTG31
        author: Jacob Chapel
        body: "MUST-FIX: The unsafe cleanup-timing regression cases use bare `it.fails()`. Vitest treats any
          thrown assertion in an `it.fails` body as the expected failure; this same file documents
          at lines 917-925 that bare `it.fails` cannot distinguish parser/helper failures from the
          intended known gap. These AC-bearing cases can therefore pass if `runOxlint` crashes or
          emits a different diagnostic, because the output assertions throw and `it.fails` marks the
          test as passing. That means the regression coverage can pass for reasons unrelated to the
          detached-cleanup timing gap. Replace these with a helper like `expectClassifierGap` that
          first proves oxlint ran cleanly and then verifies the exact current gap shape, or
          otherwise explicitly assert the known failure mode. Affected cases: lines 1230, 1260,
          1287, and 1451."
        created_at: 2026-05-08T17:29:47.403Z
      - _ulid: 01KR4C30NZC4A4Z7QQCWTFHPAZ
        author: "@claude"
        body: >-
          Fixed: replaced bare `it.fails()` on the four AC-bearing cleanup-timing regression cases
          (now lines ~1227, ~1265, ~1295, ~1471 after the rebase) with the existing
          `expectClassifierGap()` helper from earlier in the same file. Each case now:


          1. Calls `expectOxlintRanCleanly()` first to confirm oxlint exited 0 or 1 with no
          parser/helper/panic output. This is the precondition that bare `it.fails` could not
          enforce.

          2. Runs the AC's required post-fix assertions in `assertPostFixBehavior` (rule must report
          the unsafe shape, exit non-zero, mention `no-leaky-test-daemon`, reference safe-shape
          vocabulary like `serve start --detach|scoped cleanup|onTestFinished`).

          3. On the post-fix assertion throw, asserts the EXACT current gap shape in
          `assertKnownGapShape` — oxlint exits 0 and emits no `no-leaky-test-daemon` diagnostic. A
          generic parser/helper failure does NOT match this shape and re-throws, so the regression
          cannot pass for reasons unrelated to the cleanup-timing gap.

          4. Throws via the helper itself once the post-fix assertions begin to succeed, forcing
          @task-fix-detached-cleanup-timing-analysis to remove the wrapper.


          Updated the file-level docblock above the `daemon test guardrail precision: detached
          cleanup timing` describe block to document the new precondition-then-gap-shape contract
          instead of the prior `it.fails` convention.


          Verification:

          - `mise exec -- npm test -- --fresh tests/lint-daemon-test-guardrails.test.ts
          tests/lint-no-leaky-test-daemon.test.ts` -> 18 suites, 77/77 tests passed (23.1s).

          - `mise exec -- npm test` (full) -> 2409 suites, 8818 passed / 5 skipped / 0 failed
          (2401.2s).

          - `kspec validate` -> @daemon-test-guardrail-precision is not reported under missing own
          AC coverage on this branch.
        created_at: 2026-05-08T18:02:40.186Z
