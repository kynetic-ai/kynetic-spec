        author: "@claude"
        body: Task has no spec_ref and kspec validate flags it as 'automation without spec'. The
          @dispatch-workspace-configuration spec covers base_branch and worktree_root but not
          publication_mode. Consider extending that spec with a new AC for publication_mode config
          (e.g., 'Given kspec.config.yaml sets dispatch.publication_mode to manual_merge, When a
          task workspace is provisioned, Then the workspace uses manual_merge publication regardless
          of gh CLI availability'). Not blocking since this task was created standalone, but spec
          coverage would be valuable for future trait AC verification.
        created_at: 2026-03-16T16:16:16.736Z
      - _ulid: 01KKVQEPTC26HSPFD5ENFARGDK
        author: "@claude"
        body: "Spec @dispatch-workspace-configuration already has ac-5 covering publication_mode: 'Given
          kspec.config.yaml sets dispatch.publication_mode to pull_request, manual_merge, or auto /
          When the dispatcher resolves publication mode / Then the configured mode governs how
          agents publish work, overriding auto-detection when not set to auto'. The task also has
          spec_ref set to @dispatch-workspace-configuration. All tests annotated with AC:
          @dispatch-workspace-configuration ac-5."
        created_at: 2026-03-16T16:25:20.460Z
