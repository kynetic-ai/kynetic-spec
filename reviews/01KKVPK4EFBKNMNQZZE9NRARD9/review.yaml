        author: "@claude"
        body: "No tests for the new publication_mode config option. The dispatch-workspace-config.test.ts
          file tests base_branch and worktree_root config, but has zero tests for publication_mode.
          At minimum, tests should verify: (1) publication_mode: manual_merge overrides
          auto-detection even when gh CLI is available, (2) publication_mode: auto preserves
          existing behavior, (3) omitted publication_mode defaults to auto. This is the core
          behavior the task implements — without tests, there's no regression guard if the
          resolution logic changes."
        created_at: 2026-03-16T16:16:07.212Z
      - _ulid: 01KKVQE88RQ1ST2FGPKBKXMT49
        author: "@claude"
        body: "Fixed in cda7391a7. Added 5 tests in a new 'dispatch publication mode configuration' describe
          block covering: (1) manual_merge overrides auto-detection when gh is available, (2)
          pull_request overrides when gh is unavailable, (3) auto preserves environment-based
          detection, (4) resolves publication_mode from config, (5) defaults to auto when not
          configured. All 13 tests pass."
        created_at: 2026-03-16T16:25:05.560Z
    kind: blocker
