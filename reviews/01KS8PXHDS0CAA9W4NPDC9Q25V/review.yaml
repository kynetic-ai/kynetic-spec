threads:
  - _ulid: 01KS8Q03P0M5Q3DW88R1ET4M5K
    anchor:
      type: structured
      ref: "@task-plan-resource-import-and-derive"
      section: tasks
    entries:
      - _ulid: 01KS8Q03P00E7FJCAPV2WVEMFM
        author: Jacob Chapel
        body: "The plan resource CLI JSON failure contract is still incomplete. The commands take
          <plan-ref>, and remove can fail when non-interactive without --force or when an
          interactive prompt is declined, but the declared JSON error-code union only allows
          invalid_resource_id, invalid_resource_path, resource_conflict, resource_not_found, and
          entity_storage_incompatible. It omits the plan-not-found case even though the final
          shared-code note lists plan_not_found, and it defines no JSON code, payload, or exit
          behavior for confirmation-required/cancelled removal. Impact: independent agents can
          implement incompatible machine-readable errors for common plan resource failures while
          still satisfying the written task. Exact fix: define the complete CLI --json error
          envelope and exit behavior for missing plan refs, missing resources, invalid id/path,
          collisions, incompatible storage, non-interactive remove without --force, and prompt
          decline; keep it consistent with the shared resource error-code list."
        created_at: 2026-05-22T20:45:58.848Z
    kind: blocker
  - _ulid: 01KS8Q07Q2VWRGYQTEW9MNPCG5
    anchor:
      type: structured
      ref: "@task-review-screenshot-resource-ui"
      section: tasks
    entries:
      - _ulid: 01KS8Q07Q22D5JZNJVDMEHB0CJ
        author: Jacob Chapel
        body: "The review resource CLI JSON failure contract has the same gap. The commands take
          <review-ref>, and remove can fail when non-interactive without --force or when an
          interactive prompt is declined, but the declared JSON error-code union omits
          review_not_found and has no code/payload/exit behavior for confirmation-required or
          cancelled removal. Impact: review resource CLI behavior can diverge from plan resources
          and from the docs while still appearing to follow the plan. Exact fix: define the complete
          review resource CLI --json error envelope and exit behavior for missing review refs,
          missing resources, invalid id/path, collisions, incompatible storage, non-interactive
          remove without --force, and prompt decline."
        created_at: 2026-05-22T20:46:02.978Z
    kind: blocker
  - _ulid: 01KS8Q0BV6BTEFANB08PVTZCPP
    anchor:
      type: structured
      ref: "@task-plan-resource-api-ui-static"
      section: tasks
    entries:
      - _ulid: 01KS8Q0BV6TG6MQQ82AEP3Y46R
        author: Jacob Chapel
        body: "The plan resource API error contract is still ambiguous for required POST and compatibility
          failures. POST requires a multipart file field named file, but the error mapping says
          invalid id/path or missing fields return invalid_resource_id/invalid_resource_path, which
          gives no exact code for a missing file. The same task also says incompatible storage
          returns the generic resource error body with code entity_storage_incompatible, while
          @entity-folder-migration-and-compatibility ac-daemon-returns-structured-conflict requires
          HTTP 409 with top-level error entity_storage_incompatible, a domain-specific code,
          migration suggestion, and cache-domain context when available. Impact: daemon/API agents
          can implement conflicting 409 envelopes and incompatible missing-file errors. Exact fix:
          define the missing-file POST error code/body, and make plan resource incompatible-storage
          responses use the shared daemon compatibility envelope with the domain-specific code and
          guidance fields."
        created_at: 2026-05-22T20:46:07.206Z
    kind: blocker
  - _ulid: 01KS8Q0FSD5N3RS0N5D2EQPGFZ
    anchor:
      type: structured
      ref: "@task-review-screenshot-resource-ui"
      section: tasks
    entries:
      - _ulid: 01KS8Q0FSD5DF7C2DYEF0BZT6J
        author: Jacob Chapel
        body: "The review resource API error contract repeats the remaining ambiguity. POST requires a
          multipart file field named file, but missing file has no exact error code because missing
          fields are only mapped to invalid_resource_id/invalid_resource_path. Incompatible storage
          is also specified as the generic resource error body with code
          entity_storage_incompatible, which conflicts with the migration/compatibility spec
          requiring a 409 envelope with top-level error, domain-specific code, migration suggestion,
          and cache-domain context when available. Impact: review resource routes can diverge from
          the shared daemon compatibility contract. Exact fix: define the missing-file POST error
          code/body and require review resource incompatible-storage responses to use the shared
          structured compatibility envelope."
        created_at: 2026-05-22T20:46:11.245Z
    kind: blocker
