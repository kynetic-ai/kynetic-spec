      path: src/parser/review-resource-manager.ts
      side: head
    entries:
      - _ulid: 01KSETB54KWA08GF4V189D47XZ
        author: Jacob Chapel
        body: "MUST-FIX: explicit invalid content_type currently returns the undocumented code
          invalid_content_type. The task's exact CLI JSON failure code set does not include that
          code, and the API status/error mapping only defines invalid id/path, missing file, invalid
          replace, not found, conflict, and storage incompatibility cases. Enforce the content-type
          rule while mapping failures to the documented envelope/code, and add CLI/API coverage for
          invalid content_type."
        created_at: 2026-05-25T05:39:53.107Z
      - _ulid: 01KSEX4WVXG6KB6SBNNEK7MAT1
        author: "@claude"
        body: "Fixed. The task's CLI/API contract enumerates a closed set of failure codes
          (invalid_resource_id, invalid_resource_path, source_file_missing/unreadable,
          resource_conflict, resource_not_found, review_not_found, confirmation_required,
          operation_cancelled, entity_storage_incompatible) and does not include
          invalid_content_type. Removed invalid_content_type from the ReviewResourceErrorCode union
          and from the daemon route status map. addReviewResource still enforces the content_type
          rule (explicit values must be valid `type/subtype` with no whitespace) but maps a
          malformed explicit value to invalid_resource_path — content_type is path-derived metadata
          (inferred from the path extension when omitted), so the documented path-shaped code is the
          right home, with the resource's relative path attached and the message prefixed `Explicit
          content_type rejected: …` so callers can still distinguish the cause. Coverage:
          tests/review-resource-manager.test.ts (manager), tests/review-resource-cli.test.ts (CLI
          --json envelope + exit 1), and tests/daemon-api/review-resources.test.ts (multipart POST →
          400 invalid_resource_path with content_type message)."
        created_at: 2026-05-25T06:28:53.757Z
    kind: blocker
    resolved_at: 2026-05-25T06:28:58.381Z
    resolved_by: "@claude"
  - _ulid: 01KSETBPP363HJBNDJ82251QTS
    anchor:
      type: code
      commit: 8ec78b1068c3811f36051e6234aa7fd5d8865b85
      line_end: 140
