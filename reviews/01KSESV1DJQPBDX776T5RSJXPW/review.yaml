    entries:
      - _ulid: 01KSETA09FDHAA860TPVPWH9XJ
        author: Jacob Chapel
        body: "MUST-FIX: review resource add writes with path.join plus fs.copyFile and never resolves the
          destination against the review resource tree. If <reviewDir>/resources/<path> or an
          ancestor is a symlink, copyFile follows it and can write outside the owning review
          directory, violating the task's forbidden symlink-escape requirement. Use a symlink-safe
          destination check/open pattern before writing and add coverage."
        created_at: 2026-05-25T05:39:15.375Z
      - _ulid: 01KSEX4AGJNZKQCEDDEQDR62A4
        author: "@claude"
        body: "Fixed. addReviewResource now routes the source-bytes copy through a new
          copySourceIntoOwnerResources helper in src/parser/entity-local-resources.ts (shared so
          future plan-resource / spec-resource managers reuse the same gate). The helper rejects:
          (1) a symlinked owner resources/ root, (2) any symlinked intermediate directory along the
          relative path, (3) a pre-existing symlink at the destination. After fs.copyFile it
          realpath-verifies the written file is still contained inside the owner realpath and
          removes the partial write if not. Failures surface as the documented invalid_resource_path
          code with path/source_file attached. Coverage in tests/review-resource-manager.test.ts
          adds three behavioral tests planting symlinks at each level and asserting the outside file
          is never written."
        created_at: 2026-05-25T06:28:34.962Z
    kind: blocker
    resolved_at: 2026-05-25T06:28:39.532Z
    resolved_by: "@claude"
  - _ulid: 01KSETAKJTCHZ5Z5WR0320K4ZM
    anchor:
      type: code
      commit: 8ec78b1068c3811f36051e6234aa7fd5d8865b85
      line_end: 1378
      line_start: 1376
      path: packages/web-ui/src/lib/api.ts
      side: head
    entries:
      - _ulid: 01KSETAKJTQS3VEJNSSN17M8VS
        author: Jacob Chapel
        body: "MUST-FIX: static exports now include review resource metadata and copied assets, but the web
          UI still cannot open review detail in static mode because fetchReview throws here, and
          fetchReviews returns an empty list. The review detail page depends on fetchReview, so
          exported screenshot resources are not discoverable or loadable from the static UI
          snapshot. Add static review list/detail lookup from the snapshot and cover resource
          rendering in static mode."
        created_at: 2026-05-25T05:39:35.130Z
      - _ulid: 01KSEX4KAWDC91M507MZP0DVEJ
        author: "@claude"
        body: "Fixed. Added fetchReviewsStatic and fetchReviewStatic in
          packages/web-ui/src/lib/api-static.ts that resolve against snapshot.reviews.
          packages/web-ui/src/lib/api.ts fetchReviews and fetchReview now call those helpers when
          isStaticMode() is true; fetchReviewSiblings drops its short-circuit since fetchReviews now
          works in static mode. To make snapshot.reviews type-visible to the static helpers I added
          ExportedReview to packages/shared/src/api.ts and a reviews?: ExportedReview[] field on
          KspecSnapshot (re-exported through packages/web-ui/src/lib/types/snapshot.ts). The bounded
          projection from src/export/json.ts already populates that field with each resource's
          exported_path, so the existing review detail page reads review.resources directly off the
          snapshot and resolveResourceUrl already prefers exported_path in static mode — no
          detail-page changes were needed once fetchReview resolved. New file
          tests/web-ui/review-static-mode.test.ts covers list, detail, siblings, and
          resource-metadata round-trip (including exported_path) in static mode."
        created_at: 2026-05-25T06:28:43.996Z
    kind: blocker
    resolved_at: 2026-05-25T06:28:49.408Z
    resolved_by: "@claude"
  - _ulid: 01KSETB54J1C8RCH6VBJMCC8FS
    anchor:
