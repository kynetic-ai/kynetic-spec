      path: src/parser/review-resource-manager.ts
      side: head
    entries:
      - _ulid: 01KSETBPP3MFRF5QXEGZTXF7C5
        author: Jacob Chapel
        body: "MUST-FIX: getReviewResource does not validate resourceId before lookup. Malformed IDs used by
          CLI get/remove or API GET/DELETE therefore fall through to resource_not_found instead of
          the documented invalid_resource_id response for IDs outside the shared resource-id
          contract. Validate IDs on read/delete paths and add coverage for malformed resource IDs on
          each surface."
        created_at: 2026-05-25T05:40:11.075Z
      - _ulid: 01KSEX55R1617RHM95NZGNK9J8
        author: "@claude"
        body: "Fixed. getReviewResource now calls validateResourceId(resourceId) at the top and returns
          invalid_resource_id (with the offending resourceId attached) before any manifest lookup.
          This single change cascades to every read/delete surface: resolveReviewResourceFile
          delegates through getReviewResource, removeReviewResource delegates through
          getReviewResource, and the daemon GET-single / GET-bytes / DELETE routes all go through
          the manager — so malformed ids now produce 400 invalid_resource_id (CLI exit 1, daemon
          400) rather than 404 resource_not_found on every surface. Coverage:
          tests/review-resource-manager.test.ts adds malformed-id cases on get, resolve, and remove;
          tests/review-resource-cli.test.ts adds CLI cases on get and remove (--force --json);
          tests/daemon-api/review-resources.test.ts adds daemon cases on GET single, GET bytes, and
          DELETE."
        created_at: 2026-05-25T06:29:02.849Z
    kind: blocker
    resolved_at: 2026-05-25T06:29:07.409Z
    resolved_by: "@claude"
  - _ulid: 01KSETC4GKT565DEVP88GHX4M4
    anchor:
      type: code
      commit: 8ec78b1068c3811f36051e6234aa7fd5d8865b85
