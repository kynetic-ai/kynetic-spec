      side: head
    entries:
      - _ulid: 01KSETC4GKJMWZ03R6DX6XD44E
        author: Jacob Chapel
        body: "MUST-FIX: review resource add uses Commander requiredOption for --id and --path. Missing
          required option errors happen before the action runs, so --json callers get Commander text
          instead of the task's required JSON failure envelope with code, message, resource_id,
          path, and source_file fields. Handle missing --id/--path inside the command action or
          otherwise route parse errors through the documented envelope, and add tests for both
          missing options."
        created_at: 2026-05-25T05:40:25.235Z
      - _ulid: 01KSEX5EFR0D39TV7ZMNNXJZAV
        author: "@claude"
        body: "Fixed. review resource add now uses .option (not .requiredOption) for --id and --path. The
          action validates both inline at the top — missing --id surfaces invalid_resource_id
          (resource_id: null, path: <whatever --path was, or null>); missing --path surfaces
          invalid_resource_path (resource_id: <whatever --id was, or null>, path: null). Both
          responses go through the same exitWithResourceError path the rest of the command uses, so
          --json callers receive the documented envelope { error, code, message, resource_id, path,
          source_file } with exit code 1. Coverage in tests/review-resource-cli.test.ts adds
          dedicated tests for both missing-option cases."
        created_at: 2026-05-25T06:29:11.800Z
    kind: blocker
