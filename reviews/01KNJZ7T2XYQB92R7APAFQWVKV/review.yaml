    entries:
      - _ulid: 01KNJZ9BW1CK6C5YPR5DHFF7AQ
        author: Jacob Chapel
        body: "The new incremental meta path bypasses the meta domain's in-flight reload dedup.
          processDomainChanges() now returns early into tryIncrementalMetaUpdate(), which calls
          reloadMetaSubdomains() directly instead of going through loadDomain(\"meta\"). I
          reproduced this with a delayed loadMetaManifestSubdomain in a focused npx tsx harness: two
          handleFileChange() calls for kynetic.yaml in separate debounce windows reached started=2,
          active=2, maxActive=2 while inFlightReloads stayed at 1 (the concurrent items reload
          only). That violates the existing ac-reload-dedup contract and reintroduces overlapping
          manifest/meta reload work under rapid file changes."
        created_at: 2026-04-07T03:20:27.777Z
      - _ulid: 01KNK0E3CD5RFCGP4JZ58AW5DY
        author: Jacob Chapel
        body: 'Fixed: incremental meta reloads now go through the same meta-domain in-flight gate as
          loadDomain("meta"), so overlapping manifest/shadow/session refreshes deduplicate instead
          of running concurrently. Added a regression test for overlapping kynetic.yaml
          invalidations and re-ran NODE_ENV= npm test -- --fresh.'
        created_at: 2026-04-07T03:40:31.501Z
