    entries:
      - _ulid: 01KM5TYW9YTCJY8TKPFJS924K5
        author: Jacob Chapel
        body: serve start still propagates KSPEC_NO_DAEMON into the spawned daemon process. That means the
          daemon-side PID collision path in packages/daemon/src/pid.ts will treat an existing live
          PID file as stale and remove it, because its isDaemonRunning() check now becomes false
          under no-daemon mode. Explicit serve commands are supposed to ignore this env var
          entirely, so KSPEC_NO_DAEMON=1 kspec serve start can still corrupt PID state or race a
          live daemon instead of reliably reporting already running.
        created_at: 2026-03-20T14:39:00.414Z
    kind: blocker
