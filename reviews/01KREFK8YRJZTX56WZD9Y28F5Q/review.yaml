threads:
  - _ulid: 01KREG2F8BRMEFB6FN4DM1TJ7Q
    anchor:
      type: code
      commit: 7c486bc61439fc86e9d39f39230c78379b4c9c48
      line_end: 1056
      line_start: 1054
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KREG2F8B4G1JPQTR89A4KZMY
        author: Jacob Chapel
        body: 'MUST-FIX: bare cleanup-helper names are still trusted when there is no approved import or
          inspectable local body. If `findLocalHelperDefinition` returns null and no import binds
          the helper, `isTrustedHelperByOrigin` falls through to `return true`, so a test with
          `runKspec("serve start --detach")`, `const pid = readPidFromFile()`, and
          `onTestFinished(() => killPid(pid))` reports 0 oxlint diagnostics even though `killPid`
          has no trusted origin. This violates ac-cleanup-helper-origin-is-trusted: helper name
          alone does not prove daemon termination.'
        created_at: 2026-05-12T16:24:40.971Z
      - _ulid: 01KREJBT9JJN28JTRK7945C5EH
        author: "@claude"
        body: "Fixed: isTrustedHelperByOrigin no longer falls through to a conservative-trust return on the
          free-identifier path. The previous final 'return true' (path 5) is now 'return false'. The
          only positive trust paths are now (1) a locally-inspectable function body that contains a
          terminating primitive, and (3) an import whose resolved path matches the
          approved-helper-implementation allowlist. Every other shape — opaque local binding (path
          2), unapproved import (path 4), and free identifier (path 5) — returns false. Verified
          reviewer's exact probe: runKspec(serve start --detach); const pid = readPidFromFile();
          onTestFinished(() => killPid(pid)); — oxlint now reports missingCleanup where the cycle-7
          commit reported 0 diagnostics. Added two regression tests (bare unimported killPid, bare
          unimported stopDaemon) plus the existing positive flag-it cases for the opaque-binding
          shapes still pass."
        created_at: 2026-05-12T17:04:44.338Z
    kind: blocker
    resolved_at: 2026-05-12T17:04:47.958Z
    resolved_by: "@claude"
  - _ulid: 01KREG33WZX33E6PXDS1ACQ1RT
    anchor:
      type: code
      commit: 7c486bc61439fc86e9d39f39230c78379b4c9c48
      line_end: 1100
      line_start: 1096
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KREG33WZ1FV4CJ45ADPWW4PN
        author: Jacob Chapel
        body: 'MUST-FIX: approved-helper import trust checks only the raw module specifier, not the path it
          resolves to from the importing test file. A nested test at `tests/e2e/synthetic-test.ts`
          with `import { killPid } from "./helpers/daemon"` is credited as cleanup because the
          specifier matches `APPROVED_HELPER_IMPORT_PATH_PATTERNS`, but that import resolves to
          `tests/e2e/helpers/daemon`, not the approved shared helper. My ad hoc oxlint probe for
          that shape exited 0 with 0 diagnostics, so an unapproved helper path can still satisfy
          cleanup by name alone.'
        created_at: 2026-05-12T16:25:02.111Z
      - _ulid: 01KREJC1BXQR8ZPJ86WK82216W
        author: "@claude"
        body: "Fixed: isHelperNameImportedFromApprovedPath no longer trusts the raw module specifier alone.
          The new isHelperImportSpecifierApproved helper (1) keeps the existing relative-prefix
          prefilter as a fast reject for bare/scoped/alias specifiers, then (2) resolves the
          specifier against the importing file's directory via
          path.resolve(path.dirname(context.physicalFilename), specifier), (3) normalises the
          resolved path's extension to .ts (the canonical on-disk form for the shared helpers —
          specifiers may omit the extension or use .js for NodeNext compatibility), and (4) tests
          the resolved path against APPROVED_HELPER_IMPLEMENTATION_PATTERNS (tests/helpers/daemon.ts
          and tests/helpers/mock-daemon.ts). Verified reviewer's exact probe: a synthetic test at
          tests/e2e/synthetic-test.ts importing { killPid } from './helpers/daemon' resolves to
          tests/e2e/helpers/daemon.ts — outside the implementation allowlist — and oxlint now
          reports missingCleanup where the cycle-7 commit reported 0 diagnostics. Added two
          regression tests (mis-resolved nested import is flagged; canonical-resolving
          ../helpers/daemon from tests/integration is still accepted) plus extended runOxlintAt with
          a relative-path parameter so the regression can put the synthetic file at the nested path
          that anchors the resolution."
        created_at: 2026-05-12T17:04:51.581Z
    kind: blocker
    resolved_at: 2026-05-12T17:04:55.219Z
    resolved_by: "@claude"
