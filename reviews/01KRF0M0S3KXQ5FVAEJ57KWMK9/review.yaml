    entries:
      - _ulid: 01KRF1EE5GCYN4KDA89F8SV44V
        author: Jacob Chapel
        body: "MUST-FIX: the approved shared cleanup primitive path trusts a top-level approved import even
          when the primitive name is shadowed by a local no-op at the call site.  calls , which only
          scans Program imports; it does not verify that the  identifier used in the helper body
          actually resolves to that import. I verified two ad hoc oxlint probes that both exit with
          0 no-leaky errors: (1) , and (2) . In both cases  is credited as cleanup even though the
          helper calls a local no-op and leaves the detached daemon running. Impact: this violates
          ac-cleanup-operation-terminates-daemon and ac-cleanup-helper-origin-is-trusted;
          helper-body primitive trust needs lexical resolution/shadowing checks similar to the
          existing helper-name origin checks."
        created_at: 2026-05-12T21:28:18.864Z
      - _ulid: 01KRF1FBAMGTF9BW37W694ZCS8
        author: Jacob Chapel
        body: 'Clarification with unescaped command text restored: the faulty path is
          isApprovedSharedCleanupPrimitiveCall -> isSharedCleanupPrimitiveImported(callee.name,
          node). The latter only scans Program imports and does not verify that the callee
          identifier in the helper body resolves to that import. Repro 1: import { stopPidBounded }
          from "./helpers/process-stop"; function killPid(pid) { const stopPidBounded = (_pid) =>
          {}; stopPidBounded(pid); }. Repro 2: function killPid(pid, stopPidBounded = (_pid) => {})
          { stopPidBounded(pid); }. Both are used from onTestFinished(() => killPid(pid)) after
          runKspec("serve start --detach --port 3456") and both produced 0 no-leaky-test-daemon
          diagnostics under npx oxlint, even though the called primitive is a local no-op rather
          than the approved process-stop export.'
        created_at: 2026-05-12T21:28:48.723Z
      - _ulid: 01KRF2R4ETM88ATXDM47HR9DHN
        author: "@claude"
        body: "Fixed: added a lexical resolution gate to isApprovedSharedCleanupPrimitiveCall. Before
          consulting isSharedCleanupPrimitiveImported, the recognizer now calls
          findLocalHelperDefinition(callee.name, node) and rejects on any non-null result. Both
          cycle-11 shadow shapes — const stopPidBounded = (_p) => {} inside the helper body, and
          stopPidBounded = (_p) => {} as a parameter default — return a local
          FunctionExpression/ArrowFunctionExpression or LOCAL_BINDING_OPAQUE respectively, so the
          approved-import path can no longer credit a no-op shadow. Two behavioral tests in
          tests/lint-no-leaky-test-daemon.test.ts (lines added after the cycle-10 literal-pid case)
          reproduce both shadow shapes through runOxlint and assert the rule emits 'has no scoped
          cleanup registration'. Ad hoc npx oxlint probes mirroring the reviewer's repros now report
          no-leaky-test-daemon on both shadow shapes (verified directly). Targeted lint tests pass
          (381 tests). Full npm test passes (2432 suites, 9163 passed, 5 skipped, 2188.9s)."
        created_at: 2026-05-12T21:51:05.178Z
    kind: blocker
