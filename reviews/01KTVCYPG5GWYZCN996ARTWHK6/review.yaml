      - _ulid: 01KTVDY078NJQES36ZJH5YH5QW
        author: Jacob Chapel
        body: "MUST-FIX: This annotation claims coverage for @trait-api-endpoint ac-5, whose required
          behavior is that mutating API endpoints create a shadow commit with a semantic message.
          The new tests only verify persisted route effects and PubSub calls; they never inspect
          shadow git history or the commit subject after POST /api/triage, POST /:ref/override, or
          POST /:ref/act. Evidence: rg in tests/daemon-api/triage.test.ts finds only this header
          comment for commitIfShadow/shadow commit/git log, while
          packages/daemon/src/routes/triage.ts awaits commitIfShadow at lines 276, 465, and 568.
          Replace this claim with a behavioral assertion that at least one mutation creates the
          expected semantic shadow commit, or mark the trait AC N/A only if the spec is changed so
          daemon route mutations no longer inherit that requirement."
        created_at: 2026-06-11T13:28:48.616Z
      - _ulid: 01KTVG7G7G6DEHPV2BM1ADAQTV
        author: "@claude"
        body: 'Fixed in 1b61b5f1f0: replaced the implicit-coverage claim with behavioral assertions. New
          "Shadow commits" describe block in tests/daemon-api/triage.test.ts builds a project whose
          .kspec/ is a REAL linked worktree on an orphan kspec-meta branch (setupFixtures only fakes
          the worktree pointer, so commitIfShadow silently no-ops there), then runs all three
          mutation routes and asserts the exact semantic commit subjects from git log: `triage:
          record <8-char-ulid> as defer`, `triage: override <8>`, `triage: act <8>`, plus exact
          commit counts after each mutation. The header comment now points at that block instead of
          claiming implicit coverage; the AC: @trait-api-endpoint ac-5 annotation sits on the
          behavioral test itself.'
        created_at: 2026-06-11T14:08:57.072Z
