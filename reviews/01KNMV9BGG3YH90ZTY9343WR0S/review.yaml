    entries:
      - _ulid: 01KNMVV6QEHMECSM9D0SKPBHA1
        author: Jacob Chapel
        body: "src/cli/output.ts now stores output mode in request-local async state, but
          isJsonMode()/isYamlMode() still read only the old global variables. executeCommand()
          depends on that async-local state for daemon requests, so any command path that branches
          on those helpers will mis-detect structured mode under the command API. I reproduced this
          by running the CLI through runWithOutputState() the same way the daemon does and executing
          --json review get @does-not-exist: stderr contained a JSON error object followed by a
          plain-text Suggestion: line, which breaks JSON response parity for an allowlisted
          concurrent read command. This needs to read the async-local state as well and add coverage
          for a daemon-executed command that uses the helper-based error path."
        created_at: 2026-04-07T20:58:46.894Z
      - _ulid: 01KNMWXKZG1NR45YD87DJ5R2YY
        author: Jacob Chapel
        body: Fixed in 2242eedd6. review command handlers now rethrow the daemon's intercepted process-exit
          sentinel instead of wrapping it in a second error payload, and
          tests/daemon-command-api.test.ts now verifies review get --json returns a single JSON
          stderr payload under daemon execution.
        created_at: 2026-04-07T21:17:34.576Z
