threads:
  - _ulid: 01KMW2YWNG489Y89YCTYWK1JV0
    anchor:
      type: structured
      ref: "@task-api-response-envelope-type"
      section: Tasks
    entries:
      - _ulid: 01KMW2YWNGGBSTSET983DJ2XP7
        author: "@claude"
        body: >-
          @trait-api-endpoint ac-4 specifies the current response shape: {items, total, offset,
          limit}. The proposed ac-envelope changes ALL responses to {data, meta: {total, offset,
          limit, cache_status}}. This directly conflicts with the trait AC that is inherited by
          @api-contract and every API endpoint spec.


          The plan must either:

          1. Update @trait-api-endpoint ac-4 as part of Phase 0 (add a
          task-spec-update-api-endpoint-trait task), OR

          2. Acknowledge this as a breaking change to the trait contract and explain the migration
          path.


          Similarly, @api-contract ac-4 explicitly says "returns paginated results with {items,
          total, offset, limit} wrapper" — this AC will be violated by the envelope migration. The
          plan adds new ACs (ac-envelope, ac-cache-status-field) but does not update or supersede
          ac-4.


          Without addressing this, the envelope migration creates a contradiction: ac-4 says {items,
          total, offset, limit}, ac-envelope says {data, meta}.
        created_at: 2026-03-29T06:02:06.896Z
    kind: blocker
  - _ulid: 01KMW2Z2AQ1EMP0WKH0B44JYE5
    anchor:
      type: structured
      ref: "@task-migrate-route-handlers-envelope"
      section: Tasks
    entries:
      - _ulid: 01KMW2Z2AQ5DNBTWGYA48BBE5V
        author: "@claude"
        body: >-
          The task description says "~27 route handlers" and lists specific files. This is
          implementation-prescriptive detail that may go stale. More importantly, the task
          description contains file paths (packages/daemon/src/routes/, tasks.ts, items.ts, etc.)
          which violates the spec abstraction convention.


          Since this is a task (not a spec), implementation detail is acceptable, but the exact file
          list creates a risk: if routes are added or renamed before this task executes, the agent
          will follow stale instructions. Consider replacing the file enumeration with "all route
          handlers that return data" and let the agent discover the full set.


          Also: the "~27 route handlers" claim should be verified. If the count is significantly
          different, the priority/effort estimate may be wrong.
        created_at: 2026-03-29T06:02:12.695Z
    kind: question
  - _ulid: 01KMW2Z8PHPV0A0BTKTB55DB7C
    anchor:
      type: structured
      ref: "@task-ui-cache-warming-interceptor"
      section: Tasks
    entries:
      - _ulid: 01KMW2Z8PJN7K0X3MDTDG7CYH9
        author: "@claude"
        body: >-
          The "Covers:" line claims ac-warming-skeleton (detection half). But ac-warming-skeleton is
          about displaying a loading skeleton — the detection half is implicit, not explicitly part
          of the AC's given/when/then. The AC says "a loading skeleton is displayed instead of empty
          content, and the warming response is not persisted in the client cache as real data."


          The "not persisted in client cache" part IS handled by this task (throwing
          CacheWarmingError prevents caching). But the "display" part is in
          task-ui-warming-skeletons. This split coverage is fine but the "detection half" / "display
          half" labeling is informal and could confuse an automated agent. Suggest either:

          1. Split ac-warming-skeleton into two ACs (ac-warming-no-cache and
          ac-warming-skeleton-display), or

          2. Have both tasks claim the full AC and note in the description which aspect each covers.
        created_at: 2026-03-29T06:02:19.218Z
    kind: question
  - _ulid: 01KMW2ZMWRERHV6R9NAV2PV4ES
    anchor:
      type: structured
      ref: "@task-cache-domain-ready-ws-event"
      section: Tasks
    entries:
      - _ulid: 01KMW2ZMWRW3HG3W3MR725NC5B
        author: "@claude"
        body: >-
          The existing @daemon-entity-cache has ac-warming-availability ("response indicating the
          data is still loading") and ac-stale-during-reload ("domain never regresses to loading
          during a reload"). The proposed ac-domain-ready-event introduces a broadcast on
          loading->ready transition.


          Question: should ac-domain-ready-event also cover the degraded->ready transition? The
          EntityCache has a "degraded" state (per ac-graceful-degradation). If a domain recovers
          from degraded to ready, should that also broadcast? The AC as written only says "loading
          to ready" which may miss recovery scenarios. Consider whether this is intentional scoping
          or an oversight.
        created_at: 2026-03-29T06:02:31.704Z
    kind: question
  - _ulid: 01KMW2ZRWAWMRTEDX5RWHMS376
    anchor:
      type: structured
      ref: "@task-ui-unwrap-envelope"
      section: Tasks
    entries:
      - _ulid: 01KMW2ZRWBBNKY2N6R41D2TAXF
        author: "@claude"
        body: The description mentions returning meta.cache_status via "a response header/side channel" as
          an alternative to returning a wrapped type. This is unnecessary design ambiguity for an
          automated agent. The interceptor task (task-ui-cache-warming-interceptor) already assumes
          the CacheWarmingError approach where the fetch function throws on loading status. The meta
          doesn't need to be passed through — it's consumed at the fetch layer. Suggest removing the
          header/side-channel mention to avoid confusion.
        created_at: 2026-03-29T06:02:35.787Z
    kind: nit
  - _ulid: 01KMW2ZWWB7J5YG5PC4PCXNCB2
    anchor:
      type: structured
      ref: "@task-e2e-cache-warming-transition"
      section: Tasks
    entries:
      - _ulid: 01KMW2ZWWB1WSEBZQZKFX311MD
        author: "@claude"
        body: >-
          The "How" section lists three options (a, b, c) for controlling cache warming timing in
          tests but doesn't commit to one. For a standalone task, the agent needs a clear
          recommendation. Option (c) "register a new project mid-test" is called "most realistic"
          but then the timeout scenario says "a mock or very large dataset may be needed" which
          contradicts the realistic approach.


          Suggest picking one approach and stating it as the primary strategy, with fallback noted
          briefly.
        created_at: 2026-03-29T06:02:39.883Z
    kind: nit
