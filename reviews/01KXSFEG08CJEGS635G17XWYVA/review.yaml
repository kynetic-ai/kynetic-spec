        author: Jacob Chapel
        body: "MUST-FIX — This source-verified concept says approval is followed directly by task
          completion, but the required lifecycle is approval, successful merge, then completion.
          Impact: the public conceptual model contradicts the corrected tutorial and review guide
          and can leave task metadata claiming completion before integration. Evidence: the package
          task-work and merge workflows define `kspec task complete` as the final post-merge step."
