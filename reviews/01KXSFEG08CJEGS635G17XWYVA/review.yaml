        author: Jacob Chapel
        body: "MUST-FIX — The overview presents the canonical loop as `Review → Complete`, omitting
          publication. This task explicitly requires merge-before-complete ordering; the current
          workflow keeps a task in `pending_review` through integration and completes it only after
          merge. Impact: a new user can close task state before the reviewed code is delivered.
          Evidence: `templates/agents-sections/04-pr-workflow.md:19` and
          `templates/skills/task-work/SKILL.md:42` both require completion after merge."
        created_at: 2026-07-18T02:29:23.173Z
    kind: blocker
