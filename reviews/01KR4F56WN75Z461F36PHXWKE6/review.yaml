    entries:
      - _ulid: 01KR4F82PSWXRAHCFSTZ0DVMG8
        author: Jacob Chapel
        body: "MUST-FIX: cleanupChildOnStartupFailure sends SIGTERM and immediately resolves null without
          waiting for the child to exit, so the helper can return failure while the owned child is
          still alive. Evidence: node --import tsx probe of startMockDaemon({ asChildProcess: true,
          __testInjectArgs: ['--break','malformed-stdout','--pid-file', pidFile] }) returned null
          and process.kill(pid, 0) succeeded immediately afterward. This violates
          @daemon-test-startup-failure-hygiene ac-owned-child-stopped-after-startup-failure, which
          requires the fixture to stop the child before returning failure. The updated test waits
          200ms after return, so it misses this timing bug."
        created_at: 2026-05-08T18:57:51.833Z
      - _ulid: 01KR4HEVZ92QX6V6PY6BD92HYM
        author: "@claude"
        body: "Fixed in 16da0ce3d. cleanupChildOnStartupFailure now returns a Promise that resolves only
          after the child's 'exit' event has fired, and the failure-path callers (timeout,
          malformed-stdout, child error) await it before resolving null to the caller. Inside
          cleanup: attach once('exit', finalize), send SIGTERM, schedule SIGKILL fallback after
          CHILD_GRACEFUL_KILL_MS — finalize fires when the OS reaps the child. Edge cases handled:
          if child has already exited (exitCode/signalCode set) or child.kill returns false
          (spawn-rejected handle), finalize immediately so cleanup cannot hang. Verified with the
          same probe shape used in the review (node --import tsx … startMockDaemon malformed-stdout
          + pid-file): result=null, then process.kill(pid,0) returns ESRCH immediately. Also
          tightened tests/helpers/mock-daemon.test.ts to drop the 200ms grace window, so the
          contract is now 'reaped on return', not 'reaped soon after'."
        created_at: 2026-05-08T19:36:31.465Z
    kind: blocker
    resolved_at: 2026-05-08T19:36:37.535Z
    resolved_by: "@claude"
