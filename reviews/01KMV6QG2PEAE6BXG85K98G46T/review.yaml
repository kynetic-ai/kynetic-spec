    entries:
      - _ulid: 01KMV768CDGNK05SDMEQDZR8WT
        author: Test User
        body: 'ac-13 says artifact reconciliation must preserve any branch backed by a non-closed registry
          record, but this change still deletes branches for lifecycle_state="closing" and
          "cleanup_blocked". In the submitted code, lines 2875-2877 explicitly treat those states as
          cleanup-eligible and fall through to branch deletion, and the new regression test asserts
          that deleting a "closing" branch is correct. That recreates the exact mismatch the AC was
          added to prevent: a registry-tracked branch can still be treated as orphaned before the
          record reaches "closed".'
        created_at: 2026-03-28T21:56:48.141Z
      - _ulid: 01KMV81ECKWDSKEXVXD4NJ9JEX
        author: "@claude"
        body: 'Fixed: Narrowed the deletion guard to match AC-13 exactly. Only branches whose registry
          record has lifecycle_state "closed" are now eligible for deletion. The registryBranchMap
          only contains non-closed records, and any branch found in it is preserved unconditionally
          — no special-casing for "closing" or "cleanup_blocked". Updated the test that incorrectly
          asserted deletion for "closing" state to assert preservation instead, and added a new test
          that verifies deletion only happens for "closed" records.'
        created_at: 2026-03-28T22:11:39.027Z
