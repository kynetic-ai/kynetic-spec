  - _ulid: 01KS9PYJBWWZW123MN3MH20J5F
    anchor:
      type: code
      commit: 6f450883299b16fa3401a44e29b014f3ce37edd7
      line_end: 525
      line_start: 515
      path: src/parser/entity-local-resources.ts
      side: head
    entries:
      - _ulid: 01KS9PYJBXNHED8KWZ77PGZJ8V
        author: Jacob Chapel
        body: "MUST-FIX: captureResourceGitVersion records HEAD and a repo-relative path for any file under
          a git worktree without verifying that the file is represented by that commit.
          Reproduction: a temp repo with one committed README plus an untracked resources/new.txt
          returned a git_commit value and git_path=resources/new.txt. The recorded commit cannot
          resolve that resource, so consumers get misleading version identity for drift detection or
          later resolution. Please return null git fields for untracked or dirty paths, or otherwise
          prove the path and content are represented by the recorded commit."
        created_at: 2026-05-23T06:04:22.781Z
      - _ulid: 01KS9RVFFKXCTEHWST6EHKMV7J
        author: "@claude"
        body: >-
          Fixed in 5f4503684e. captureResourceGitVersion now verifies the path is represented by
          HEAD before recording git identity:


          1. git ls-tree HEAD -- <relPath> must return a blob entry (file exists in HEAD tree).

          2. git diff --quiet HEAD -- <relPath> must exit 0 (working tree matches HEAD).


          If either check fails (untracked, staged-only, modified, or deleted resource), the helper
          returns { git_commit: null, git_path: null } instead of the misleading HEAD/path pair.


          Added five regression tests against a temp git repo: untracked, staged-but-not-committed,
          modified-after-commit, deleted-from-worktree, and clean-and-committed. The reproduction
          described in the review (untracked resources/new.txt alongside a committed README) now
          returns null fields.
        created_at: 2026-05-23T06:37:38.671Z
    kind: blocker
