    entries:
      - _ulid: 01KQYN7XT9CJN92RAA9ZXSW91F
        author: Jacob Chapel
        body: "MUST-FIX: explicit connect_host can be advertised even when that URL is not actually
          reachable or accepted by the daemon. resolveDaemonConnectHost returns any non-empty
          explicitConnectHost before considering the bind host, so the branch can write metadata
          such as bind_host=127.0.0.1 and api_url=http://127.0.0.2:<port>; a server bound to
          127.0.0.1 is not reachable at 127.0.0.2 (verified with a local HTTP probe: 127.0.0.1 ->
          200, 127.0.0.2 -> TypeError). For wildcard/external binds, the built daemon middleware
          still rejects non-default advertised hosts too: importing dist/daemon/server.js and
          running localhostOnly() returned 403 for Host 127.0.0.2:3456 and 192.0.2.10:3456. This
          breaks @config-daemon ac-connect-host-config and @daemon-network-endpoint-contract
          ac-clients-use-metadata because clients now honor metadata but the advertised endpoint may
          fail before any daemon API call succeeds. Constrain explicit connect_host to hosts
          reachable for the bind host, or make request validation accept the resolved advertised
          connect host in external-binding mode, and add a behavioral test that starts/calls through
          a non-default connect_host instead of only asserting metadata."
        created_at: 2026-05-06T12:47:11.689Z
      - _ulid: 01KQYQ4JM13E8M9DBW84VH26K4
        author: "@claude"
        body: >-
          Fixed. Two-part fix.


          (1) Reachability validation in resolveDaemonConnectHost
          (src/daemon-shared/endpoint.ts:188-227). When bind_host is a specific (non-wildcard)
          address and explicit connect_host doesn't match it, the resolver now throws with a clear
          message — bind=127.0.0.1, connect=127.0.0.2 / connect=192.168.1.10 / connect=::2 /
          different non-loopback addresses are all rejected at resolve time so unreachable metadata
          is never written. Wildcard binds (0.0.0.0 / ::) accept any explicit connect_host, and
          connect=bind is accepted (covers loopback-bind with loopback-connect, and external-bind
          with same-address connect).


          (2) Middleware now accepts the advertised connect_host
          (packages/daemon/src/server.ts:265-339, 449-462). localhostOnly() takes an optional
          additionalAllowedHosts list. createServer extends the default localhost set with the
          resolved endpoint.bindHost / endpoint.connectHost so requests addressed to the
          metadata-advertised URL are not 403'd. Wildcard addresses are filtered from the additional
          list (they're bind targets, not real Host header values). Default behavior with no options
          is unchanged — loopback-default mode stays loopback-only.


          Behavioral tests:

          - tests/cli-serve.test.ts: new e2e starts the daemon with bind=0.0.0.0 +
          connect_host=127.0.0.2, fetches the advertised http://127.0.0.2:port/api/health and
          asserts 200 OK plus body { status: 'ok' } (skips on platforms without 127.0.0.0/8 loopback
          alias). Before this fix the same URL returned 403 even though metadata pointed clients
          there.

          - tests/daemon-server.test.ts: middleware unit tests for additionalAllowedHosts (accepts
          non-default hosts, still rejects unlisted, filters wildcards, accepts bracketed IPv6,
          ignores empty entries, default-options preserves localhost-only). Test file now imports
          the production middleware from dist/daemon/server.js instead of duplicating the logic so
          drift is structurally prevented.

          - tests/daemon-endpoint.test.ts: explicit rejection cases (127.0.0.1+192.168.1.10,
          127.0.0.1+127.0.0.2, ::1+::2, 10.0.0.1+10.0.0.2) and acceptance cases (connect=bind, empty
          connect with specific bind falling back to bind).

          - tests/cli-no-daemon.test.ts: pre-existing forward-flags test updated to bind=0.0.0.0 so
          it satisfies the (now enforced) reachability rule.


          Full suite: npm test -- --fresh — 2360/2360 suites, 8651 tests passed, 5 pre-existing
          skips, 0 failures (~32 minutes). npm run typecheck clean. npm run build:daemon clean.
        created_at: 2026-05-06T13:20:19.073Z
