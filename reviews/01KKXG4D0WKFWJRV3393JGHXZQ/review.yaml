        author: "@claude"
        body: >-
          **SHOULD-FIX: ac-2 context expansion tests don't test the endpoint**


          The two tests annotated with `// AC: @review-content-diff-api ac-2` (lines 381-423) verify
          the underlying `git show` + array slicing logic directly, but they don't test the
          `/api/diff/context` route handler at all. The route handler contains parameter validation
          (start/end must be positive integers with start <= end), error responses for invalid refs
          and missing files, and clamping logic — none of which is exercised.


          This is better than no coverage but the tests would pass even if the route handler had
          bugs in validation, clamping, or error handling. Consider adding at least a unit test that
          exercises the route's validation and clamping logic.
