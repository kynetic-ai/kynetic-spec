    entries:
      - _ulid: 01KPQF7C38M0034Z48FX6WK7M8
        author: Jacob Chapel
        body: This new fast-path only patches the task index/detail caches and leaves tasks.historyDetails
          untouched, so it makes cached task reads only partially consistent.  still returns cached
          history first (), and I reproduced that an immediate history read after  still returns the
          old cached entry instead of the newly written history. Because this hook now runs for
          every cached task mutation, it introduces a stale-history regression for daemon/command
          contexts that already warmed task history.
        created_at: 2026-04-21T07:31:39.240Z
      - _ulid: 01KPQGBAT61TYBDS0FTJT7PMJB
        author: "@claude"
        body: "Fixed: applyTaskMutation() now deletes the historyDetails entry for the mutated task
          (this.tasks.historyDetails.delete(ulid)), so getTaskHistory() and loadTaskWithHistory()
          return null and fall through to disk where the freshly-written history entry is picked up.
          Added a unit test that verifies history is invalidated (returns null) after
          applyTaskMutation while index and detail tiers remain updated. All 8139 tests pass."
        created_at: 2026-04-21T07:51:17.574Z
    kind: blocker
    resolved_at: 2026-04-21T07:51:27.414Z
    resolved_by: "@claude"
