      - _ulid: 01KM09HAJVWRK47W8HMCV37E9F
        author: "@claude"
        body: Serialization test (ac-target-push-serialization) does not exercise the targetPushInProgress
          guard on DispatchEngine. It calls pushIntegrationTarget twice sequentially (both skip as
          up-to-date), proving idempotency but not serialization. The guard is a private field on
          the engine class and all git ops are synchronous so true concurrency cannot occur — the
          implementation is correct, but the test doesn't prove the AC. Consider testing via the
          engine or extracting the guard to make it testable.
        created_at: 2026-03-18T10:58:18.331Z
    kind: nit
  - _ulid: 01KM09HHNRP9JE9KBB2EBJ2504
    anchor:
