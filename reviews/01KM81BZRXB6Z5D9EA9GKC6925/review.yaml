          comparing `loadAllTasks(ctx)` vs `resolveTaskDataManager(ctx).loadAllTasks(ctx)` in split
          mode.

          Claims verified: reproduced that legacy `loadAllTasks(ctx)` drops split-storage
          notes/todos even after they exist on disk; confirmed new tests cover direct manager
          behavior but not CLI split-mode paths.

          Categories searched: correctness (found blocker), test coverage (gap for CLI split-mode
          reads), integration (found blocker in task commands), edge cases/error handling/security
