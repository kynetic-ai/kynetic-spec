      - _ulid: 01KM81NRQRT4YZ15GEK64JWT37
        author: Jacob Chapel
        body: >-
          `loadAllTasks(ctx)` still rebuilds tasks from `project.tasks.yaml`, which is only the lean
          index in split mode. That loader drops per-task `notes` and `todos`, so every command in
          this file that uses it (`tasks list`, `task list`, `tasks ready`, `tasks next`, `tasks
          blocked`, `tasks in-progress`, and `tasks assess automation`) is reading incomplete task
          objects under `task_storage.format: split`.


          I reproduced this with a temp split manifest: after adding one note and one todo through
          `resolveTaskDataManager(ctx)`, `loadAllTasks(ctx)` returned `notes.length === 0` and
          `todos.length === 0` while `manager.loadAllTasks(ctx)` returned `1` for both. That means
          `--full` output omits real notes/todos and `--grep` cannot match note content in split
          storage, so the snapshot still fails the per-task-file behavior from user-facing task
          commands.
        created_at: 2026-03-21T11:14:50.744Z
    kind: blocker
