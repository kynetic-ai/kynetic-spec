    entries:
      - _ulid: 01KNMM01F2G2QNDZW5GZR5VV6N
        author: Jacob Chapel
        body: The new triage fast path never serves data from cache in the normal "ready" state.
          loadTriageRecords() now returns cached records only when every ULID in getTriageIndex()
          also has a populated getTriageDetail() entry, but the cache contract explicitly keeps
          triage details empty after loadDomain("triage") and loads them on demand. In practice, a
          ready triage domain still falls through to disk, so this task does not satisfy
          @daemon-command-api ac-read-cache-serving for triage and the new test only passes because
          it mocks a cache state that production does not create.
        created_at: 2026-04-07T18:41:36.738Z
