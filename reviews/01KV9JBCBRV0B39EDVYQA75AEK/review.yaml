  - _ulid: 01KV9JQ3ARQFEZSKM9J7JM2PEW
    anchor:
      type: code
      commit: 2755ceda200d4ae94822794a7605a1a7a9e97f79
      line_end: 448
      line_start: 443
      path: src/parser/verification-record-store.ts
      side: head
    entries:
      - _ulid: 01KV9JQ3ARHKH1SA27R9W74B6M
        author: Jacob Chapel
        body: "MUST-FIX: loadVerificationRecords is a public store read path, but it silently drops records
          whose format is newer than supported. AC ac-newer-record-format-refused says that when a
          verification record store declaring a newer record-format version is read or written, the
          operation on the store refuses with an error naming both versions and leaves the store
          unmodified. This path reads every record file in the store and is used by validation's
          orphan scan; treating an incompatible record as absent loses the required format gate. The
          new test at tests/verification-record-compatibility.test.ts:450-459 also encodes the wrong
          behavior by expecting loadVerificationRecords(ctx) to return [] and validate() to hide the
          newer-format record instead of refusing the store read."
        created_at: 2026-06-17T01:21:47.352Z
      - _ulid: 01KV9X1CCQW4N2DB7QG0CQMYDE
        author: "@claude"
        body: "Fixed: loadVerificationRecords now throws VerificationRecordFormatCompatibilityError when any
          record in the store declares a newer-than-supported format version. The bulk scan was a
          public store read path (used by validate's orphan check), so
          ac-newer-record-format-refused requires the read to refuse, not silently drop. The
          single-record load and write paths already refused. Direct callers and operations
          involving the store (validate --completeness) propagate the refusal; operations not
          involving the store (kspec task list, inbox add) never reach this path and are unaffected.
          Updated the test at tests/verification-record-compatibility.test.ts to assert the bulk
          read and validate both refuse with both versions named, while an unrelated inbox write
          still succeeds."
        created_at: 2026-06-17T04:22:10.071Z
    kind: blocker
    resolved_at: 2026-06-17T04:22:18.738Z
    resolved_by: "@claude"
  - _ulid: 01KV9JQ68T92VKAEV2FHEW0H19
    anchor:
      type: code
      commit: 2755ceda200d4ae94822794a7605a1a7a9e97f79
      line_end: 576
      line_start: 551
      path: tests/verification-record-compatibility.test.ts
      side: head
    entries:
      - _ulid: 01KV9JQ68TBAECQC8R9262WETK
        author: Jacob Chapel
        body: "MUST-FIX: this test does not prove the 'unrecognized directory's files are neither read nor
          modified' part of ac-unrecognized-sidecar-untouched. The sidecar file contains valid YAML
          and the assertions only verify validate() returns a result and the bytes are unchanged
          after a later stamp write. An implementation could still enumerate and parse this unknown
          sidecar file and this test would pass, so the AC's unread guarantee is not behaviorally
          covered. Seed a sidecar that would fail if read as metadata, or otherwise make the read
          observable, while retaining the unchanged-file assertion."
        created_at: 2026-06-17T01:21:50.362Z
    kind: blocker
