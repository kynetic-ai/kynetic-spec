    entries:
      - _ulid: 01KVSAMJ275814EHCC8Q8NSBE4
        author: Jacob Chapel
        body: "MUST-FIX:  remains top-level passthrough, so the ingestion boundary accepts
          producer/framework-native sibling fields outside . I verified with  that a payload
          containing top-level  parses successfully through the input schema and  persists
          that  field into . This violates the normalized owned-envelope boundary and the
          requirement that native producer metadata be retained only under the explicitly namespaced
          extension object; the strict input boundary should reject these external top-level extras
          while the stored-record schema can remain tolerant for forward-compatible on-disk reads."
        created_at: 2026-06-23T04:08:26.439Z
      - _ulid: 01KVSANSFFGSMYSZZJ7C6HB6TM
        author: Jacob Chapel
        body: 'Clarification for the blocker above: `TestResultRunRecordInputSchema` is still
          `.passthrough()` at the top level on lines 160-176. I verified with `node --import tsx`
          that an input payload containing top-level `junit: { suite: "native top-level field" }`
          parses successfully, and a follow-up `writeTestRun` check persisted that `junit` field
          into `coverage/test-runs/runs/<run-id>/run.yaml`. That lets framework-native metadata
          bypass the `producer.native` namespace requirement. Keep the stored-record schema tolerant
          for forward-compatible reads, but make the external ingestion input boundary reject
          unknown top-level native/framework siblings before any sidecar mutation.'
        created_at: 2026-06-23T04:09:06.798Z
    kind: blocker
