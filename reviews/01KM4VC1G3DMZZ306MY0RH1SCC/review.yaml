        body: "The new source-agnostic AC still lacks an annotated page-level test. Every live-update E2E in
          this block injects only `topic: 'agents'`, while the separate watcher test only proves the
          daemon emits `session_changed`. Nothing verifies that a `sessions` broadcast drives the
          /sessions page refresh/indicator path, so `ac-live-update-source-agnostic` is not actually
          covered."
        created_at: 2026-03-20T05:31:25.056Z
      - _ulid: 01KM4W96GR3HQ4GH7K1R2BKRAY
        author: Jacob Chapel
        body: Fixed in commit 818b53f420eda826592758a52a7691fd0b055d75. Added an annotated page-level
          /sessions E2E for @session-list-infinite-scroll ac-live-update-source-agnostic that
          injects a sessions-topic broadcast, asserts the page subscribes to both agents and
          sessions topics, and verifies the list/count refresh from the sessions-topic path.
        created_at: 2026-03-20T05:42:52.696Z
