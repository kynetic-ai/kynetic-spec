      path: packages/web-ui/src/routes/sessions/+page.svelte
      side: head
    entries:
      - _ulid: 01KM4VM908RCKQFKYRHQQMTEB6
        author: Jacob Chapel
        body: Scrolled-state freshness only treats the list as changed when the total count or first row id
          changes. A matching session can update in-place without affecting either value (for
          example, a visible row changing status while still matching the current filter/sort), so
          `processLiveRefresh()` returns early and never freezes the list or shows the indicator.
          That violates the scrolled-update behavior required for non-top viewers.
        created_at: 2026-03-20T05:31:27.112Z
      - _ulid: 01KM4W95Q9X1AYX2VYFVKXTWN5
        author: Jacob Chapel
        body: Fixed in commit 818b53f420eda826592758a52a7691fd0b055d75. The scrolled freshness path now
          fingerprints the loaded session rows (ids plus status/timing/counters) and search results
          instead of only comparing total and first-row id, so in-place status/order changes still
          freeze the visible list and surface the non-blocking indicator.
        created_at: 2026-03-20T05:42:51.881Z
    kind: blocker
