    entries:
      - _ulid: 01KN2Q5ZFGK93P0D0Q9FJM7B8G
        author: Jacob Chapel
        body: "These new tests stub  with , so they never execute the real daemon endpoint. As written,
          the  and  annotations here claim API-contract coverage at the wrong abstraction layer: the
          tests will still pass if the actual handler breaks, as long as the UI continues to issue
          the mocked request. Keep the UI assertions, but remove these API-spec annotations or
          replace them with real endpoint coverage."
        created_at: 2026-03-31T19:50:57.264Z
      - _ulid: 01KN2Q75VKVY1DKKWGFNARFC9M
        author: Jacob Chapel
        body: "These tests stub /api/items/batch with page.route(...), so they never execute the real daemon
          endpoint. That makes the @batch-item-fetch-api and @trait-api-endpoint annotations
          incorrect: the tests can still pass if the actual handler breaks, as long as the UI
          continues to issue the mocked request. Keep the UI assertions, but remove these API-spec
          annotations or replace them with real endpoint-level coverage."
        created_at: 2026-03-31T19:51:36.563Z
      - _ulid: 01KN2RCQ0HTX1Q68MQNYG2VS7W
        author: Jacob Chapel
        body: "Fixed in f8075c29c: the plans E2E happy-path test now waits on the real POST /api/items/batch
          request/response from the daemon and asserts the returned spec/task summaries instead of
          fulfilling the route. The unresolved case now patches only the plan detail payload to add
          an extra derived task ref, so the live batch handler produces the unresolved array and the
          UI falls back to raw YAML without mocking the endpoint itself."
        created_at: 2026-03-31T20:12:06.545Z
