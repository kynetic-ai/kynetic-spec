    entries:
      - _ulid: 01KMPKF2TZCE7T1YCA4Z22GR7M
        author: "@claude"
        body: The cache still keeps full plan, review, and triage records in the index tier, so
          detail-on-demand is not actually implemented for those domains.  stores , , and  directly
          in , , and , and the detail handlers then read those same arrays back (, , ) instead of
          using the detail-tier getters. I verified this against the live workspace with , which
          showed , , and  immediately after only loading the index domains. That means large fields
          like plan markdown, review threads/checks/verdicts, and triage reasoning/evidence stay hot
          in memory for every registered project, which defeats the two-tier storage contract this
          task is supposed to deliver.
        created_at: 2026-03-27T02:55:08.127Z
      - _ulid: 01KMPMHRXX65GMJWKMP490F1KB
        author: "@claude"
        body: "Fixed: Created PlanIndexSummary, ReviewIndexSummary, and TriageIndexSummary types that strip
          heavy fields (content, threads, checks, verdicts, events, notes, item_snapshot,
          reasoning). Index tier now stores only these summaries. Full records are loaded into the
          detail tier during domain loading and served via detail-tier getters. Review summaries
          pre-compute disposition and counts at index load time. All detail routes (plans, reviews,
          triage) now resolve refs via the index, then load from the detail tier with disk fallback.
          Verified with tsc --noEmit (clean) and full test suite (6900 passed, 1 pre-existing
          timeout failure in dispatch-runtime-bootstrap-contract)."
        created_at: 2026-03-27T03:14:04.861Z
