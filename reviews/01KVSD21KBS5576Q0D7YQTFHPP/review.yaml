    entries:
      - _ulid: 01KVSE05K1TN786KET8YABVFC1
        author: Jacob Chapel
        body: "MUST-FIX: writeTestRunIndex is an exported store write path, but it only parses
          TestRunIndexSchema and then writes the index. TestRunIndexSchema accepts any positive
          format, so a caller can persist format 2 even though CURRENT_TEST_RESULT_RUN_RECORD_FORMAT
          is 1. I verified this with node --import tsx: writeTestRunIndex(ctx, { format: 2, runs: {}
          }) wrote coverage/test-runs/index.yaml. This violates @test-result-run-store
          ac-newer-record-format-refused because writes declaring newer record formats must be
          refused and leave the store unmodified."
        created_at: 2026-06-23T05:07:12.609Z
      - _ulid: 01KVSFANAQBYBKM3S3397FWACZ
        author: Jacob Chapel
        body: "Fixed in 4d918a9d6f: writeTestRunIndex now runs the raw record-format ceiling check before
          parsing or writing, and the regression test verifies a future-format index write is
          refused while coverage/test-runs remains absent."
        created_at: 2026-06-23T05:30:24.982Z
    kind: blocker
    resolved_at: 2026-06-23T05:30:35.357Z
