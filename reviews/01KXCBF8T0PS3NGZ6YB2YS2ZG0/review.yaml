      section: tasks
    entries:
      - _ulid: 01KXCBHWP1G867KHHR9R12EMR6
        author: codex
        body: "The path/command gate fails. Every one of the 15 tasks contains at least one invalid
          verification command: examples include the pseudo-command `kspec item get on every named
          owner`, nonexistent `npm run lint.`/`lint.`, test filenames with a trailing period, and
          `npm --prefix packages/web-ui test.`. Path ownership is also malformed:
          task-dispatch-lifecycle-events says Modify: None although it must change
          src/schema/event-registry.ts, src/schema/event-payloads.ts, and
          packages/shared/src/schemas.ts; task-engine-task-hard-stop lists
          @task-engine-task-pause-resume as a file; task-ui-dispatch-lifecycle-controls both creates
          the full HeldTaskRow path and lists bare HeldTaskRow.svelte as Modify while omitting the
          actual API/routes/components named only in top-level prose. Correct every command and give
          each task a truthful dependency-point Create/Modify/Test inventory."
        created_at: 2026-07-12T23:45:43.617Z
    kind: blocker
  - _ulid: 01KXCBJ07MF6DQQ6E0YHBW7WKN
    anchor:
