    entries:
      - _ulid: 01KXCBHSK8A4KYE5NSSWF2BTT2
        author: codex
        body: "The exact-spec-patch handoff is still not standalone. It does not contain the 60 exact
          description/AC payloads; it directs the worker to 'Exact Existing-Spec Changes above' and
          'Plan decision', so the derived task still requires top-level plan prose. It also says
          both 'Create the new requirement only through plan derivation' and 'Do not approve or
          derive this plan', instructions a post-derive task cannot coherently execute. In addition,
          exact patches such as @dispatch-event-payload ac-dispatch-control-common-fields combine
          base fields, task/global identity branches, and failure-only error_code in one AC, while
          ac-dispatch-control-field-bounds leaves the actual bounds only in plan prose. Affected:
          task-patch-dispatch-lifecycle-specs, task-dispatch-lifecycle-events, and
          task-daemon-dispatch-lifecycle-api. Inline exact durable patches in the patch task and
          split/freeze independently testable contracts."
        created_at: 2026-07-12T23:45:40.457Z
    kind: blocker
  - _ulid: 01KXCBHWP10PSAZ7DG8BRNQY09
    anchor:
