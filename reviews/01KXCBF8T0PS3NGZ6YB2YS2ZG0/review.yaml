        author: codex
        body: "All 15 rendered task bodies fail the required Hyphoria-style standalone-handoff gate. They
          contain 133 repetitions of shared scaffold sentences (inventory every ingress, keep
          source-of-truth ownership, deterministic barriers, preserve unrelated behavior, do not
          approve/derive, negative-boundary assertion, generic review handoff) instead of
          task-specific execution detail. Direct comparison with every task under Hyphoria plan
          @01KX9FG7Y7W1MT9T6MRQX0W26D shows the missing bar: those tasks name concrete operations,
          local authorities, exact edge cases, files, and task-specific evidence. Affected: all 15
          task slugs. Rewrite each description for its own subsystem and remove boilerplate that is
          irrelevant to that task (for example race/failure-trace language on metadata-only and UI
          tasks)."
        created_at: 2026-07-12T23:45:37.286Z
    kind: blocker
  - _ulid: 01KXCBHSK8AGH3G3GGJT1M3W8V
    anchor:
