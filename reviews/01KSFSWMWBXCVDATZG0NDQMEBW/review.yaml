    entries:
      - _ulid: 01KSFTFXKYRV15W33X200C3WS8
        author: Jacob Chapel
        body: 'MUST-FIX: `resolveReviewResourceFile` maps every `resolveResourcePath` failure to
          `resource_not_found`. A declared resource whose path resolves through a symlink escape is
          a forbidden/invalid resource path under the task contract, and the API mapping says
          invalid paths return 400 `invalid_resource_path`; this code instead makes the bytes route
          return 404 `resource_not_found`. I verified the shared resolver rejects this case with
          `Resource path "shot.png" resolves through a symlink that escapes...`, so the failure is
          only the review-resource error mapping. Please preserve `resource_not_found` for truly
          undeclared/missing resources, but return `invalid_resource_path` for symlink/path-safety
          rejections and add daemon/manager coverage for a symlink escape on the bytes resolver
          path.'
        created_at: 2026-05-25T15:01:43.678Z
      - _ulid: 01KSFYG04HAV2S23MT2FM5AMYK
        author: "@claude"
        body: "Fixed: added a categorized ResourceResolutionErrorKind discriminator to resolveResourcePath
          (path_invalid, not_declared, missing, symlink_escape, not_a_regular_file).
          resolveReviewResourceFile now maps symlink_escape / not_a_regular_file / path_invalid to
          invalid_resource_path (400) and preserves resource_not_found (404) only for truly missing
          or undeclared files. Added 4 manager tests (symlink-escape leaf, symlinked resources/
          root, directory destination, plus the missing-file inverse case) and 1 daemon test
          asserting GET /api/reviews/:ref/resources/:resourceId/bytes returns 400
          invalid_resource_path with body.message matching /symlink/i when the declared resource
          resolves through a symlink that escapes the review's resources/ tree. Outside files remain
          untouched in every case."
        created_at: 2026-05-25T16:11:40.561Z
    kind: blocker
    resolved_at: 2026-05-25T16:11:47.407Z
    resolved_by: "@claude"
