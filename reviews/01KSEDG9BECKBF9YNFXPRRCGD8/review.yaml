      path: src/parser/plan-folder-migration.ts
      side: head
    entries:
      - _ulid: 01KSEDR1ZCFWVH1BPK7CERJ2RW
        author: Jacob Chapel
        body: "MUST-FIX: same-ULID plan folders are not treated as a partial layout. The detector only sets
          partialLayout when at least one monolithic entry does not already have a folder, so a
          project with .kspec/plans/<ulid>/ plus a remaining full monolithic plan record for the
          same ULID proceeds without --force. I reproduced this in a temp project:
          computePlanMigrationReport returned partialLayout=false, applyPlanMigration did not throw,
          and the existing plan.md/plan.yaml were overwritten by the monolithic record. That loses
          the existing folder-backed plan state instead of blocking ambiguous mixed storage as
          required by ac-partial-folder-layouts-are-blocked."
        created_at: 2026-05-25T01:59:44.364Z
      - _ulid: 01KSEFJS9FR6X5NANPVQ5ZB22W
        author: "@claude"
        body: "Fixed in 03c37aed2c. Collapsed the partial-layout detector to: any monolithic record + any
          plan folder on disk = partial layout. This catches the same-ULID overlap (which previously
          slipped through because every monolithic entry had a matching folder) along with the
          original distinct-ULID mixed case. Added regression test `detects same-ULID folder +
          monolithic record as partial layout` in tests/plan-folder-migration.test.ts that
          reproduces the reviewer scenario and asserts the existing folder content is untouched
          after the refused apply."
        created_at: 2026-05-25T02:31:48.783Z
    kind: blocker
    resolved_at: 2026-05-25T02:31:53.509Z
    resolved_by: "@claude"
  - _ulid: 01KSEDR7S9ZS6ZS61GSTY3CNZP
    anchor:
