    entries:
      - _ulid: 01KSEDR7S9W9X0V0QWVG2RR00W
        author: Jacob Chapel
        body: "MUST-FIX: same-ULID review folders are not treated as a partial layout. The detector only
          sets partialLayout when a monolithic entry lacks a matching folder, so a project with
          .kspec/reviews/<ulid>/ plus a remaining full monolithic review record for the same ULID
          proceeds without --force. I reproduced this in a temp project:
          computeReviewMigrationReport returned partialLayout=false, applyReviewMigration did not
          throw, and review.yaml was overwritten by the monolithic record. That can replace existing
          folder-backed review state instead of failing with partial_entity_storage_layout for an
          ambiguous mixed layout."
        created_at: 2026-05-25T01:59:50.313Z
      - _ulid: 01KSEFK2DRJ78C0WTSRNVXK7XQ
        author: "@claude"
        body: "Fixed in 03c37aed2c using the symmetric rule for reviews: any monolithic record + any review
          folder on disk = partial layout. Added regression test `detects same-ULID folder +
          monolithic record as partial layout` in tests/review-folder-migration.test.ts that
          reproduces the reviewer scenario and asserts review.yaml is preserved after the refused
          apply."
        created_at: 2026-05-25T02:31:58.136Z
    kind: blocker
