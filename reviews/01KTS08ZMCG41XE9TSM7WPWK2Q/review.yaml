threads:
  - _ulid: 01KTS0C9DARH4DPBK8RW71ECV6
    anchor:
      type: structured
      ref: "@data-format-forward-compatibility"
      section: specs
    entries:
      - _ulid: 01KTS0C9DADTDM7W5ZQNYM9HSS
        author: "@claude"
        body: "SHOULD-FIX: The plan's 'Overlap with existing plans/specs' analysis omits the implemented
          specs @format-version and @versioning, which already own the manifest format-version
          field's semantics (@format-version ac-1: 'The declared format version determines which
          schema compatibility rules are applied'). The new decision spec defines
          stamping/checking/refusal semantics for the same declared version but declares no
          relationship to @format-version and is parented at @schema rather than under @versioning
          where the existing format-version requirement lives. Not a contradiction (refusal is
          arguably a compatibility rule), but the boundary should be explicit: add
          relates_to/depends_on @format-version (and consider parent @versioning), and extend the
          overlap-analysis note to cover it."
        created_at: 2026-06-10T14:53:27.850Z
    kind: question
  - _ulid: 01KTS0CBVDBPH74AF5D65575W3
    anchor:
      type: structured
      field: ac-newer-version-refused
      ref: "@data-format-forward-compatibility"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTS0CBVDMZHJGNTAZYPZ61DE
        author: "@claude"
        body: "SHOULD-FIX: ac-newer-version-refused says 'Any command that reads or mutates project data'
          refuses at context initialization, while ac-diagnostics-report-read-only requires the
          project health diagnostic to complete and report. The diagnostic command reads project
          data, so to a spec-only reader these two ACs contradict each other. The pair is consistent
          today only because of an implementation detail (verified: the doctor command calls
          getDoctorReport directly and never runs initContext — src/cli/commands/doctor.ts:28, no
          initContext anywhere in src/parser/doctor.ts). Bound the universal AC explicitly, e.g.
          'Any command that reads or mutates project data, except the project health diagnostic,
          ...' so the carve-out lives in the contract rather than in the implementation."
        created_at: 2026-06-10T14:53:30.349Z
    kind: question
  - _ulid: 01KTS0CE9QTJM7SKZ0H170DYHY
    anchor:
      type: structured
      ref: "@task-format-version-ceiling"
      section: description
    entries:
      - _ulid: 01KTS0CE9QCRYP5MA8CMKP00D9
        author: "@claude"
        body: "SHOULD-FIX: Step 5 (upgrade refusal in runUpgradePipeline / detectSourceVersion) does not
          account for step 2's ordering: runUpgradePipeline itself calls initContext
          (src/cli/commands/upgrade.ts:345-346) BEFORE detectSourceVersion (line 352), so once the
          throwing ceiling check lands in initContext, the upgrade command will refuse at line 346
          and the step-5 refusal/probe-inference fix may be unreachable from the CLI path. The
          probe-inference correction in detectSourceVersion (lines 208-228, verified: unrecognized
          kynetic values bucket into 0.1.0-0.8.99) is still worth making as defense in depth since
          detectSourceVersion is exported and separately exercised, but the task should state which
          layer owns the user-visible refusal for 'kspec upgrade' and which AC test pins which path,
          so the worker does not write a test expecting a refusal message that the initContext throw
          preempts."
        created_at: 2026-06-10T14:53:32.855Z
    kind: question
  - _ulid: 01KTS0CGR31VPAVZWTZ8KR7MG7
    anchor:
      type: structured
      ref: "@task-format-version-ceiling"
      section: description
    entries:
      - _ulid: 01KTS0CGR3QA4J98SNFZ2FFYT2
        author: "@claude"
        body: "NIT: The testing section says 'Annotate with AC: @data-format-forward-compatibility ac-N for
          each', but the spec's AC ids are descriptive (ac-newer-version-refused,
          ac-daemon-structured-error, ...), not numeric. Reword to avoid a fresh-session worker
          annotating tests with nonexistent ac-1..ac-6 ids."
        created_at: 2026-06-10T14:53:35.364Z
    kind: nit
  - _ulid: 01KTS0CK80A7PXAVQ9R58Z60NE
    anchor:
      type: structured
      ref: "@task-format-version-ceiling"
      section: description
    entries:
      - _ulid: 01KTS0CK805DR0JXVAT5G7AM8Q
        author: "@claude"
        body: "NIT: The manifest Zod schema defaults the format-version field to '1.0' when absent
          (src/schema/spec.ts:115: kynetic: z.string().default('1.0')), so wherever the
          schema-parsed manifest is consumed, a missing field is indistinguishable from an explicit
          '1.0', while raw-YAML readers (upgrade probe, entity-storage-compatibility) see the field
          as genuinely absent. Behaviorally both routes end in 'no refusal', so this is not a
          correctness gap, but step 2's 'a missing kynetic field keeps its existing legacy handling'
          should say which manifest representation the new check reads so the missing-field test
          asserts the right layer."
        created_at: 2026-06-10T14:53:37.920Z
    kind: nit
  - _ulid: 01KTS0CNQE28HA1NQS0BS8P1JP
    anchor:
      type: structured
      ref: "@task-catch-justification-comments"
      section: dependencies
    entries:
      - _ulid: 01KTS0CNQER5EDTA07K3BD5YWB
        author: "@claude"
        body: "NIT: task-catch-justification-comments depends on all three behavioral tasks, but its stated
          rationale (document the post-behavioral-fix state of the five audited files) only holds
          for @task-shadow-restore-loud-failure — the only task of the three that touches one of the
          five files (src/parser/shadow.ts). @task-format-version-ceiling touches
          yaml.ts/upgrade.ts/doctor.ts/entity-storage-compatibility.ts and @task-git-utils-execfile
          touches src/utils/git.ts, none of which are in the audit set. The extra two edges
          over-serialize a P3 hygiene task; harmless, but consider dropping them or expanding the
          rationale."
        created_at: 2026-06-10T14:53:40.462Z
    kind: nit
