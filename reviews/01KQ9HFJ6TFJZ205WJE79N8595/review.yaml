    entries:
      - _ulid: 01KQ9J3W81R31N1GBR94Q53QP6
        author: Jacob Chapel
        body: 'MUST-FIX: The annotation parser still treats malformed ac-* strings as explicit AC ids. The
          required format is the same ac-prefixed kebab-case token enforced by AcIdSchema, but these
          regexes accept underscore, doubled hyphen, trailing hyphen, and uppercase suffix examples.
          I verified against the reviewed source with node --import tsx: parseACAnnotationLine("//
          AC: @spec ac-bad_id") returned acIds ["ac-bad_id"], and the same happened for ac--double,
          ac-trailing-, and ac-Bad. That violates @ac-annotation-identifier-format
          ac-explicit-token-format and leaves the final gate without coverage for malformed ac-*
          tokens. Use the shared acIdPattern or equivalent strict token boundary matching here and
          add behavioral tests for invalid ac-* shapes.'
        created_at: 2026-04-28T08:08:30.209Z
      - _ulid: 01KQ9K698KWQTW4JNCM4P6VRTG
        author: "@claude"
        body: "Fixed: imported the shared acIdPattern from src/schema/common.ts into the annotation parser
          and added a filter step that validates each extracted ac-* candidate against
          acIdPattern.test() before including it in the acIds array. Malformed tokens (underscores,
          doubled hyphens, trailing hyphens, uppercase) are now silently dropped, matching
          AcIdSchema behavior. Added 5 behavioral tests in ac-annotation-identifier-format.test.ts
          and 1 integration test in ac-id-format-gate.test.ts covering underscore, doubled hyphen,
          trailing hyphen, uppercase, and mixed valid/invalid cases. All 8468 tests pass."
        created_at: 2026-04-28T08:27:17.650Z
    kind: blocker
    resolved_at: 2026-04-28T08:27:27.448Z
    resolved_by: "@claude"
