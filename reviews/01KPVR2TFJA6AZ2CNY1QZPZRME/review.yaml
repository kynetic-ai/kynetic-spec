    entries:
      - _ulid: 01KPVRQGZXNQ68820SFCEF0YJ4
        author: Jacob Chapel
        body: The helper source was moved into templates/skills/merge/scripts/, but the rendered Codex merge
          skill was not regenerated. In this snapshot, .agents/skills/kspec-merge still contains
          only SKILL.md and no scripts/detached-reviewer-merge.sh payload, so agent runtimes
          consuming the rendered merge skill still cannot invoke the helper from the detached
          reviewer workspace. That means the task has fixed the source location without actually
          shipping the helper to the runtime this feature targets.
        created_at: 2026-04-22T23:34:43.453Z
      - _ulid: 01KPVSR8EA43QTJYTPZ1D3T4V4
        author: "@claude"
        body: "Fixed: Ran `kspec skill install-core` from dev source to install the template's scripts/
          directory into .kspec/skills/merge/, then `kspec skill render` to regenerate the rendered
          output. Both .agents/skills/kspec-merge/scripts/detached-reviewer-merge.sh and
          .factory/skills/kspec-merge/scripts/detached-reviewer-merge.sh are now committed with
          executable permissions. The root cause was that the previous fix cycles moved the script
          to the correct template location (templates/skills/merge/scripts/) but never re-ran the
          install+render pipeline to propagate the script through .kspec/skills/ → .agents/skills/."
        created_at: 2026-04-22T23:52:36.042Z
