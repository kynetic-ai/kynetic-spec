    entries:
      - _ulid: 01KXMAYQM7JKSM7N2FSGRCXS6B
        author: Jacob Chapel
        body: MUST-FIX — The 17 failure cases supply a preselected failurePredicate directly to the emitter.
          They never provoke TaskIdentityResolutionError, DispatchLifecycleTransitionError,
          store/transaction errors, or DispatchCleanupError through
          applyGlobalLifecycleAction/applyTaskLifecycleAction, so _dispatchControlFailurePredicate
          and the real emission sites are untested. This suite remained green while the real
          ref-only lifecycle harness emitted zero events. Drive each failure class through the
          engine boundary and assert the emitted identifier/code/count; a table test may remain as
          supplemental mapper coverage.
        created_at: 2026-07-16T02:09:11.303Z
    kind: blocker
