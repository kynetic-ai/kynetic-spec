      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXMAYH1DCN8BT4A8S4X2R3CY
        author: Jacob Chapel
        body: "MUST-FIX — Ref-only task failures are unaudited. This catch reconstructs event identity only
          from context.taskId and silently skips emission when the request used taskRef. Task
          controls explicitly accept refs, so a resolved ref that reaches an invalid matrix
          transition and an unresolved ref both return an error without dispatch_control.failed,
          violating ac-failed-control-is-auditable and the closed-code contract. Reproduction: I
          instrumented the existing test case that pauses stopped @task-alpha and then
          @missing-task; onDispatchControlEvent received 0 events (expected invalid_transition and
          task_not_found). Ensure every task failure emits exactly once; for pre-canonicalization
          failures, reconcile the required canonical task_id contract rather than dropping the audit
          outcome."
        created_at: 2026-07-16T02:09:04.557Z
    kind: blocker
  - _ulid: 01KXMAYM4Y8RPM9VH715M1RNYE
    anchor:
      type: code
      commit: 40aed15a47ba2163b9d3ff74e5cadfee02d83c5c
      line_end: 35
      line_start: 25
      path: tests/dispatch-control-events.test.ts
      side: head
    entries:
      - _ulid: 01KXMAYM4YSQHEAEA3H7BZ79YQ
        author: Jacob Chapel
        body: MUST-FIX — The alleged commit barrier is a local Promise that directly invokes
          emitDispatchControlOutcome after release; it never drives DispatchEngine, a lifecycleStore
          mutation, or committed publication. Therefore the test cannot detect an engine emission
          before commit, during retry observation, or after the wrong durable state. Replace/add a
          behavioral engine/store test whose barrier surrounds the actual commit and whose event
          capture is attached to the engine EventBus/callback, proving zero before commit and
          exactly one afterward for applied and noop paths.
        created_at: 2026-07-16T02:09:07.742Z
    kind: blocker
  - _ulid: 01KXMAYQM6CS85M5FMZVTR2WPT
