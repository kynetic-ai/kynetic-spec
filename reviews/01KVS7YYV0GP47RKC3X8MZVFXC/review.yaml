      - _ulid: 01KVS8VKQHSRPASWA942GX3HM7
        author: pr-reviewer
        body: "MUST-FIX: `writeTestRun` validates the incoming payload schema but does not check the
          incoming `format` against `CURRENT_TEST_RESULT_RUN_RECORD_FORMAT` before writing. I
          reproduced this by submitting a run with `format: 2` while the current supported format is
          1: `writeTestRun` resolved successfully, created both `run.yaml` and `index.yaml`, and the
          run file contained `format: 2`. Only a later read refused the record. This violates
          @test-result-run-store ac-newer-record-format-refused because writes of newer run records
          must refuse with version diagnostics and leave the store unmodified. Add an input format
          ceiling check before any buffered writes and a behavioral regression that proves a
          future-format submitted run creates/changes no sidecar files."
        created_at: 2026-06-23T03:37:20.369Z
    kind: blocker
