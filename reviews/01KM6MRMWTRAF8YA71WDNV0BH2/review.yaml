      - _ulid: 01KM6MTP0H1SPMK8WYEXX0PBWH
        author: Jacob Chapel
        body: "Re-blocking an already blocked task overwrites the saved pre-block state with 'blocked'.
          Reproduction in a temp fixture project: start -> block('First blocker') -> block('Second
          blocker') -> unblock. After the second block, the task JSON shows prior_status='blocked';
          unblock then returns success but leaves status='blocked' with blocked_by=[]. That violates
          the new unblock contract for a normal CLI flow where another blocker is added before the
          original one is cleared. Preserve the first non-blocked prior status instead of replacing
          it on repeated block calls."
        created_at: 2026-03-20T22:11:05.873Z
