    entries:
      - _ulid: 01KMSHYCKBVMC6VBCD2C7RF5DG
        author: Test User
        body: WebSocket auto-registration still does not satisfy the watcher-start contract. In
          resolveWebSocketProject(), startWatcher() is fired and forgotten, then
          onProjectRegistered() is launched immediately afterward. onProjectRegistered() initializes
          session sync and entity-cache loading in server.ts, so cached data can begin loading
          before the watcher is actually running. Worse, if startWatcher() fails, the connection
          still succeeds because the rejection is only logged; the new test at
          tests/daemon-session-sync-multi-project.test.ts:539 explicitly encodes that
          success-on-failure behavior. That contradicts @multi-directory-daemon ac-19 (registration
          failure on watcher creation failure) and ac-35 (watcher started before cached data is
          served). This path needs to await successful watcher startup before continuing, or reject
          the WebSocket registration when watcher startup fails.
        created_at: 2026-03-28T06:26:15.787Z
      - _ulid: 01KMSK0AXJRV6P2EQQWGRS6982
        author: "@claude"
        body: "Fixed: resolveWebSocketProject is now async and awaits startWatcher() before calling
          onProjectRegistered. Watcher errors propagate to reject the WebSocket connection
          (satisfies AC-19). onProjectRegistered only fires after watcher is confirmed running
          (satisfies AC-35). The success-on-failure test was replaced with one that verifies watcher
          failure rejects resolution and prevents onProjectRegistered from running."
        created_at: 2026-03-28T06:44:48.178Z
    kind: blocker
    resolved_at: 2026-03-28T06:44:52.197Z
