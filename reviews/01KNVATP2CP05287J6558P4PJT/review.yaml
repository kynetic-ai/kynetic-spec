threads:
  - _ulid: 01KNVAVSDXR9C3MXACXBZ2JPGM
    anchor:
      type: structured
      ref: "@task-upgrade-command"
      section: dependencies
    entries:
      - _ulid: 01KNVAVSDYCJ72EYJS64QGVT6W
        author: Jacob Chapel
        body: This task's step 5 explicitly invokes the default-module scaffold and the default
          reflection-hook scaffold, but depends_on only lists the config, AGENTS file, gitignore,
          and default-agents tasks. As written, the plan allows the upgrade task to start before the
          module or hook scaffolds exist, even though it is supposed to compose those behaviors. Add
          dependencies on @task-derivable-default-module and @task-default-reflection-hooks, or
          remove those steps from the upgrade task's scope.
        created_at: 2026-04-10T09:16:41.278Z
    kind: blocker
  - _ulid: 01KNVAVSHGYEZZSV1YDXJYCREX
    anchor:
      type: structured
      ref: "@scaffolded-agents-file"
      section: description
    entries:
      - _ulid: 01KNVAVSHHFJK9BK75E20SRY7D
        author: Jacob Chapel
        body: The description promises the scaffolded AGENTS file is never overwritten unless the force flag
          is set, but the spec has no AC for the force path or backup behavior while the task
          implements both. That leaves a user-visible overwrite contract unreviewable and
          untestable. Add explicit ACs for forced overwrite behavior (and backup, if intended), or
          narrow the description so the task does not implement behavior the spec never defines.
        created_at: 2026-04-10T09:16:41.393Z
    kind: blocker
  - _ulid: 01KNVAVSFDRSRMHZJ5MEMYY1EG
    anchor:
      type: structured
      ref: "@default-project-agents-and-conventions"
      section: description
    entries:
      - _ulid: 01KNVAVSFD5WK9PVQA3NEV2X7E
        author: Jacob Chapel
        body: This description says users may edit, rename, or remove the scaffolded defaults, but neither
          the ACs nor the task define how rerunning setup preserves those choices. The task
          currently says to recreate any missing default item, which would silently undo a user
          removal and likely break renamed defaults as well. Either remove the
          removability/editability promise from the spec, or add explicit ACs and task logic that
          preserve user removals/renames across reruns.
        created_at: 2026-04-10T09:16:41.325Z
    kind: blocker
  - _ulid: 01KNVAWQXA1H4SKDXMH2WZKRRA
    anchor:
      type: structured
      ref: "@task-release-notes"
      section: description
    entries:
      - _ulid: 01KNVAWQXBXMPJ5A9KC1GB938S
        author: Jacob Chapel
        body: This task adds a structured/programmatic output mode for the release-notes command, but
          @release-notes-accessible has no AC for machine-readable output and no JSON-output trait.
          Either add that contract to the spec (preferred, since this is user-visible CLI behavior)
          or drop the requirement from the task so the implementation surface matches the plan.
        created_at: 2026-04-10T09:17:12.491Z
    kind: question
  - _ulid: 01KNVAXDQ6RNNTECWNPZC7S2PZ
    anchor:
      type: structured
      ref: "@task-upgrade-command"
      section: description
    entries:
      - _ulid: 01KNVAXDQ67JNGPQTXBX66ZKVH
        author: Jacob Chapel
        body: The upgrade spec requires the command to detect version skew and report both the source and
          target versions before applying changes, but this task only proposes reading the source
          version from a new shadow-branch state field. Older supported projects will not have that
          field, so the task as written cannot satisfy ac-detects-skew/ac-reports-skew for the very
          upgrade cases this plan is meant to handle. Define a fallback source-version detection
          strategy for pre-state-file projects, or narrow the spec so it does not promise exact
          from-version reporting when the version cannot be inferred.
        created_at: 2026-04-10T09:17:34.822Z
    kind: blocker
