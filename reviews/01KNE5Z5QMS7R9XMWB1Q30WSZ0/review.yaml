          This test only exercises the invalid-port fast-exit path, so it does not verify the task's claim that the compiled daemon actually runs under Node. I reproduced a real startup failure with [daemon] Starting kspec daemon on port 45678...
          [daemon] Web UI assets found at: /home/chapel/Projects/kynetic-spec-dispatch/.kspec-worktrees/task-daemon-compile-js-01kne1nj-review/dist/web-ui
          [daemon] PID file written: 1907896
          [daemon] Port file written: 45678
          [daemon] Web UI static file serving enabled: after writing the PID/port files, startup aborts with  from . That means the submission still does not deliver usable Node execution for the daemon, but this AC annotation would let it pass review anyway. The test needs to exercise a real startup path (for example, start the daemon under an isolated HOME and probe ), and the implementation/task scope needs to be corrected so Node can actually start the compiled daemon or the task/spec coverage is narrowed.
        created_at: 2026-04-05T06:46:24.436Z
      - _ulid: 01KNE7FE48PRCFPAS9C76ZFZHG
        author: Jacob Chapel
        body: "Fixed: the daemon now uses @elysiajs/node when running under Node, SPA fallback serving no
