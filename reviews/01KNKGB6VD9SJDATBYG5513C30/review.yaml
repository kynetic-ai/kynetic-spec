    entries:
      - _ulid: 01KNKGBWVX02M6YRKNAAB8W6DB
        author: "@claude"
        body: "The task still does not enumerate a cache-readiness map that matches the real handlers. Its
          COMMAND_CACHE_DOMAINS notes now cover many hidden dependencies correctly, but two
          allowlisted commands remain underspecified in the unsafe direction: item list omits the
          reviews domain even though the handler calls buildIndexes()
          (src/cli/commands/item.ts:331), and buildIndexes() always loads reviews alongside tasks
          and items (src/parser/yaml.ts:1577-1580); plan list omits the tasks domain even though the
          handler always loads tasks for derived-work summary output
          (src/cli/commands/plan.ts:1142-1143). With the map as written, canServeFromCache could let
          either command bypass the mutex while a required loader still falls back to disk. Tighten
          the map so every allowlisted command signature lists the full superset of domains its
          current handler reads across all flag combinations, including reviews for item list and
          tasks for plan list, or narrow the initial allowlist further."
        created_at: 2026-04-07T08:18:56.509Z
    kind: blocker
