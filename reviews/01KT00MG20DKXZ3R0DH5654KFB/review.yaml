    entries:
      - _ulid: 01KT01J95YNAK8NFPHWPV1309D
        author: Jacob Chapel
        body: 'MUST-FIX: `/api/meta/agents` does not populate the legacy `adapter` field with the resolved
          adapter for runner-backed agents that omit `adapter`. The task explicitly requires legacy
          clients that only read `adapter` to continue receiving an adapter identity, and the CLI
          JSON path already emits `adapter: adapterId` for this same runner-only case. I reproduced
          the daemon behavior with an in-process `/api/meta/agents` request against an agent
          containing `runner: configured-runner` and no `adapter`; the 200 response included
          `resolved_adapter: "claude-agent-acp"` but no `adapter` field. Clients still reading only
          `adapter` would therefore see no adapter identity for valid runner-backed agents.'
        created_at: 2026-05-31T22:13:11.998Z
      - _ulid: 01KT02S8NYHXGWMPJT6KP96DFC
        author: "@claude"
        body: "Fixed: /api/meta/agents now explicitly sets adapter: resolvedAdapter on the response object
          (packages/daemon/src/routes/meta.ts:160), mirroring the CLI JSON output and the
          /api/agent/status agent_definitions array. Runner-backed agents that omit the adapter
          field will now receive the resolved adapter on the legacy adapter field. Added a
          runner-only fixture (no adapter field) plus a behavioral test
          (tests/daemon-api/agent-runner-surfaces.test.ts) that hits /api/meta/agents and asserts
          both adapter and resolved_adapter equal the registry-resolved adapter identity."
        created_at: 2026-05-31T22:34:29.438Z
    kind: blocker
    resolved_at: 2026-05-31T22:34:37.430Z
    resolved_by: "@claude"
