      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KR4W4ZAT2RA55SZE0PC7MV9J
        author: Jacob Chapel
        body: 'MUST-FIX: exec/execSync shell-string detection only accepts the daemon entry as token 0 or
          token 1. A direct launch with a normal Node runtime flag, for example exec("node
          --enable-source-maps dist/daemon/index.js --port 0"), still starts the real daemon
          entrypoint outside the helper but this rule emits zero diagnostics. I verified this with a
          synthetic oxlint probe against this rule: oxlint exited 0 with "Found 0 warnings and 0
          errors." This violates @daemon-test-guardrail-precision
          ac-direct-daemon-entry-invocations-flagged; the detector needs to handle
          executable-position runtime options without reintroducing the echo/cat/grep false
          positives covered by the existing regressions.'
        created_at: 2026-05-08T22:43:21.562Z
      - _ulid: 01KR4ZS882KRG55T5MZ7K3ATQF
        author: "@claude"
        body: "Fixed: readDaemonEntryInvocation's exec/execSync runtime form now walks past flag-shaped
          tokens (any token starting with `-`, including the `--` separator) between the leading
          runtime token and the script-path token. The first non-flag token after the runtime must
          be the daemon entry. Reviewer's probe — exec(\"node --enable-source-maps
          dist/daemon/index.js --port 0\") — now exits with the directDaemonSpawn diagnostic.
          False-positive guards remain: echo/cat/grep/nodemon do not match because token[0] is not a
          recognised runtime; node ./other-script.js dist/daemon/index.js does not match because the
          first non-flag token after node is ./other-script.js, not the daemon entry."
        created_at: 2026-05-08T23:46:51.774Z
    kind: blocker
    resolved_at: 2026-05-08T23:46:55.252Z
    resolved_by: "@claude"
  - _ulid: 01KR4W537WW9ZMGG1M3ZHYBV16
    anchor:
      type: code
      commit: 1459ff6696a65438ac6b64221407f751f7c4d3b8
      line_end: 477
      line_start: 469
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KR4W537XYQZQZBPC7CBM8NT3
        author: Jacob Chapel
        body: 'MUST-FIX: process.execPath recognition rejects all computed member access, so
          spawn(process["execPath"], [DAEMON_ENTRY, "--port", "0"]) is silently accepted even though
          it is the same current-Node runtime as process.execPath and directly launches the daemon
          entrypoint. I verified this with a synthetic oxlint probe against this rule: oxlint exited
          0 with "Found 0 warnings and 0 errors." This is another false negative for
          @daemon-test-guardrail-precision ac-direct-daemon-entry-invocations-flagged. The
          strictness should still reject arbitrary object.execPath values, but exact computed
          process["execPath"] is statically knowable and should be treated as Node.'
        created_at: 2026-05-08T22:43:25.565Z
      - _ulid: 01KR4ZSEYJKJ3M67QVSJV8Q4DP
        author: "@claude"
        body: "Fixed: isProcessExecPathExpression now also accepts the static-string computed form. The
          predicate matches MemberExpressions whose object is the Identifier `process` and whose
          property is either an Identifier named `execPath` (dot access) or a
          Literal/no-substitution TemplateLiteral whose value is exactly \"execPath\" (bracket
          access). Reviewer's probe — spawn(process[\"execPath\"], [DAEMON_ENTRY, \"--port\",
          \"0\"]) — now exits with the directDaemonSpawn diagnostic. Strictness preserved: dynamic
          property expressions (process[propName]), other static property names
          (process[\"argv0\"]), and computed access on unrelated objects (other[\"execPath\"])
          remain unrecognised."
        created_at: 2026-05-08T23:46:58.642Z
    kind: blocker
    resolved_at: 2026-05-08T23:47:02.059Z
    resolved_by: "@claude"
  - _ulid: 01KR4W6BYDYP1284V3G350P5ZP
