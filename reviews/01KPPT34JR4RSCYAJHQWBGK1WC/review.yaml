        author: Jacob Chapel
        body: "The @docs-navigation-shape ac-1 annotation here is attached to a pure  unit test, but the
          acceptance criterion is about the rendered docs page: the sidebar must show the current
          section, the current page must be visually indicated, and the page must show a table of
          contents. This helper test only checks slug filtering, so it would still pass if the
          Svelte route stopped rendering the sidebar highlight or the TOC entirely. Replace or
          supplement it with a behavioral test at the route/component level that proves the actual
          page layout."
        created_at: 2026-04-21T01:43:20.709Z
      - _ulid: 01KPPWPJZ2YMDD1FNTZWYXN484
        author: "@claude"
        body: "Fixed: Replaced the pure unit test AC annotation with E2E behavioral tests in
          tests/e2e/docs.spec.ts. The main test navigates to /docs/getting-started and verifies: (1)
          sidebar nav is visible with section page links, (2) the current page link has the
          bg-accent active class, (3) the 'On this page' TOC heading is visible with anchor fragment
          links. A separate test verifies non-current pages do NOT have the active highlight. The
          filterSectionEntries unit test annotation was downgraded from 'AC:' to 'Supports' since
          the actual AC coverage is now at the E2E level."
        created_at: 2026-04-21T02:07:54.850Z
