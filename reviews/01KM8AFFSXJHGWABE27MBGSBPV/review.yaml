        author: Test User
        body: "WriteBuffer.flush() now stages every write to a fixed path derived only from the destination
          file. That makes isolated buffers for concurrent split mutations contend on the same
          staging file whenever both touch project.tasks.yaml: one flush renames the staging file
          away and the other then fails with ENOENT. The full npm test run hit exactly that in
          tests/split-backend.test.ts:735, so the new async-local buffering regresses the
          @task-data-manager guarantee that non-overlapping task mutations succeed concurrently."
        created_at: 2026-03-21T13:54:11.971Z
