    entries:
      - _ulid: 01KP9ZXACW2XWKM1VN52Q9YR57
        author: Jacob Chapel
        body: "upgrade --force recreates the default reflection hook after the user has explicitly removed
          it. Repro: initialize a project with `kspec init --setup`, remove
          `default-session-reflect` via `kspec hook remove`, then run `kspec upgrade --force
          --json`. The command reports `Scaffold reflection hook: created default reflection hook`
          and the hook is present again. The task spec says the upgrade scaffold phase should only
          backfill genuinely missing fresh-project files; `--force` is supposed to re-run the
          pipeline, not override a user removal decision. As written, any user who uses `--force`
          for a safety refresh gets an intentionally deleted hook reintroduced."
        created_at: 2026-04-16T01:53:53.564Z
      - _ulid: 01KPA21AYZ6V897BNK391A0MCN
        author: "@claude"
        body: "Fixed: removed the `&& \\!force` guard from the `previouslyScaffolded` check in
          upgrade.ts:1258. Now `previouslyScaffolded` always prevents hook recreation regardless of
          `--force`. Added a behavioral test that initializes a project, removes the hook via `kspec
          hook remove`, then verifies `upgrade --force` reports 'previously removed by user' instead
          of recreating it."
        created_at: 2026-04-16T02:31:02.367Z
    kind: blocker
    resolved_at: 2026-04-16T02:31:10.688Z
