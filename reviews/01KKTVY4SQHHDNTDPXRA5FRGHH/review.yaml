      - _ulid: 01KKTW0EJJ811585NDX6JYRYEZ
        author: "@claude"
        body: >-
          **Round 8 — Route design blocker verification**


          All 3 blockers from round 7 are resolved:


          1. **Diff route patterns (was: /:base..:head invalid for Elysia)** — Now uses query params
          throughout: `GET /api/diff?base=X&head=Y`, `GET /api/diff/file?base=X&head=Y&path=P`, `GET
          /api/diff/context?base=X&head=Y&path=P&start=N&end=M`. All are standard Elysia-compatible
          GET routes with query parameters.


          2. **Revision selector for code reviews (was: can't find siblings)** — Spec ac-11
          correctly specifies dual matching: subject-ref for plan/spec reviews, head-branch for code
          reviews. API ac-1 includes subject-branch filter. Implementation notes section confirms
          the approach.


          3. **Context/file route conflict (was: ambiguous routes)** — Now separate unambiguous
          routes: `/api/diff/file` and `/api/diff/context`. No overlap.


          **Minor nit:** task-review-detail-page description (line 605-606) says "query GET
          /api/reviews?subject-ref=X to find sibling reviews" but doesn't mention the code review
          case needing subject-branch filter. The spec (ac-11) and implementation notes are clear,
          so an implementer would figure it out — but the task description could be more explicit.
          Not a blocker.
        created_at: 2026-03-16T08:25:41.714Z
