        author: "@claude"
        body: The route does not satisfy @daemon-command-api ac-response-parity because it strips observable
          output before returning it. I verified with `node ./dist/cli/index.js task get
          @01KMMB3V7N2GC0JSPJKJYMPJPV --json` that direct CLI stdout exits 0 and ends with a
          trailing newline, but executeCommand removes that newline via .replace(/\n$/, "") and also
          .trim()s stderr. Commands whose output depends on exact trailing whitespace will therefore
          differ from direct CLI execution, and the current tests mask that by using the trimmed
          kspec() helper or trimming before comparison.
