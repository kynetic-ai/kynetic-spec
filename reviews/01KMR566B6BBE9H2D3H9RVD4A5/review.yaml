        author: "@claude"
        body: 'The implementation does not meet @trait-api-endpoint ac-6 on validation failures.
          X-Request-Id is only assigned in onBeforeHandle, so responses generated before the handler
          never receive it. I reproduced this by POSTing /api/command without command through the
          route directly: the response was 400 {"error":"validation_error",...} and the headers only
          contained content-type, with no x-request-id. The tests miss this because they only assert
          the header on the success path.'
