threads:
  - _ulid: 01KXVQTTWV0TCNZXRWST3G8TA8
    anchor:
      type: structured
      field: How / Required RED-GREEN proof
      ref: "@01KXVPGACWKT77Y967EWP3Y7DQ"
      section: description
    entries:
      - _ulid: 01KXVQTTWVZZA2ZMM3E075KJJR
        author: codex
        body: "The focused GREEN matrix is incomplete and internally ambiguous. Current dev emits eight
          extension classes under dist/web-ui/pagefind: .js, .css, .json, .pagefind, .pf_meta,
          .pf_index, .pf_fragment, and .pf_filter. The task source-authority section names all
          eight, but How step 5 omits .pf_meta and CSS, permits index/fragment/filter with and/or,
          and does not explicitly require the directory and malformed-encoding cases promised by
          step 2. An automated worker could therefore pass its stated focused tests while leaving a
          real metadata/filter asset or directory error path unverified. Smallest correction:
          enumerate one real-shaped fixture for every emitted extension class, including
          pagefind*.pf_meta and one each of index, fragment, and filter; require status, content
          type, and cache assertions for each, exact byte equality for every binary class, and
          explicit 404 cases for /pagefind/, nested directories, missing files, malformed encoding,
          raw traversal, encoded traversal, and encoded slash/backslash variants. This adds no new
          product scope; it makes the already-stated route contract testable."
        created_at: 2026-07-18T23:08:56.091Z
    kind: blocker
  - _ulid: 01KXVQV9275WWXYB71XB35HX70
    anchor:
      type: structured
      field: How step 7
      ref: "@01KXVPGACWKT77Y967EWP3Y7DQ"
      section: description
    entries:
      - _ulid: 01KXVQV927VDNS57TG1J67AXEQ
        author: codex
        body: "The browser failure assertion is not concrete enough for Playwright. page requestfailed
          events cover transport failures, not HTTP 404 or 500 responses, and the production defect
          currently manifests as an HTTP miss. Successful six-page searches make the main path fail
          today, but they do not prove the explicit requirement that every observed Pagefind request
          succeeded; an optional or swallowed Pagefind HTTP error could remain invisible. Smallest
          correction: require collection of both Pagefind requestfailed events and Pagefind
          responses with non-2xx status, then assert both collections are empty, the observed
          Pagefind response set is non-empty, and every observed Pagefind URL uses the daemon
          origin. Keep console-error and page-error collections as already required."
        created_at: 2026-07-18T23:09:10.599Z
    kind: blocker
  - _ulid: 01KXVQVQY4X164FAHBMY0NFPYW
    anchor:
      type: structured
      field: Verification
      ref: "@01KXVPGACWKT77Y967EWP3Y7DQ"
      section: description
    entries:
