          applicable. Smallest correction: replace or supplement the lint line with npm run lint --
          --quiet and an executable focused command for packages/daemon/src/web-ui-static.ts,
          tests/daemon-web-ui-startup-asset-coherence.test.ts, and tests/e2e/docs.spec.ts, adjusted
          to include any newly created adjacent test file. Preserve the existing format, typecheck,
          focused tests, E2E, full test, validation, and diff checks."
