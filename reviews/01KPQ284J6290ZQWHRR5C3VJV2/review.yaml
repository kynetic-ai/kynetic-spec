      - _ulid: 01KPQ2RHY7B2QR8MN1E60MZ6YD
        author: Jacob Chapel
        body: "Clicking a heading anchor never updates the URL fragment because this handler calls
          preventDefault() and only scrolls the target into view. I confirmed it with a targeted
          Playwright check against /docs/getting-started: after clicking the first <h2> anchor, the
          page URL stayed at /docs/getting-started with no #... suffix. That breaks
          @docs-navigation-shape ac-2's 'click a heading' path because the resulting direct link is
          not reflected in the address bar for copying/sharing."
        created_at: 2026-04-21T03:53:50.791Z
      - _ulid: 01KPQ3X7HXY2FD5NRTPP78BWM4
        author: "@claude"
        body: "Fixed: The anchor click handler now calls history.replaceState(null, '', href) after
          scrollIntoView() to update the URL fragment. This preserves smooth scrolling while making
          the anchor link copyable from the address bar. Added an E2E test that clicks a TOC link
          and verifies the URL includes the expected hash fragment."
        created_at: 2026-04-21T04:13:52.573Z
    kind: blocker
    resolved_at: 2026-04-21T04:14:06.871Z
