    entries:
      - _ulid: 01KSTT6HJP1G4SAP63T09WDYX4
        author: Jacob Chapel
        body: "MUST-FIX: The system runner storage location is not deterministic enough for implementation.
          Lines 456-459 and 870 say to store under a path such as
          ~/.config/kspec/projects/<project-key>/runners.yaml and to derive <project-key> from the
          canonical root path or an existing stable project identity. I found an existing global
          daemon config helper at src/daemon-shared/endpoint.ts:117-123, but no existing project-key
          convention. Impact: independent tasks can choose incompatible key algorithms or locations,
          making resolver/API/UI tests disagree and making local runner config hard to find after
          implementation. Suggested fix: replace the example/choice language with one exact storage
          contract, for example
          <daemon-config-dir>/projects/<url-safe-sha256(realpath(projectRoot))>/runners.yaml,
          explicitly using getDefaultDaemonConfigDir() or the daemon config-dir override in tests.
          Also state whether .kspec/project.runners.yaml is the shadow-worktree root sidecar and is
          auto-committed by normal kspec shadow saves, while the system file is never written to the
          shadow branch."
        created_at: 2026-05-29T21:28:15.190Z
    kind: blocker
