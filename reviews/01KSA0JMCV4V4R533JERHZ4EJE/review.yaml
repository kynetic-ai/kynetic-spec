    entries:
      - _ulid: 01KSA1CT81H24KPD6H0S0HVJ4R
        author: Jacob Chapel
        body: "MUST-FIX: resolveResourcePath only rejects undeclared paths when callers provide the optional
          manifest. If manifest is omitted, the public resolver validates the relative path and
          resolves any existing file under resources/, which violates
          @trait-entity-scoped-local-resources-1 ac-resource-reference-resolves-within-owner and
          ac-path-escape-rejected: resources must resolve only when declared, and undeclared paths
          must be rejected. Evidence: the signature makes manifest optional, the undeclared check is
          conditional on options.manifest, and tests/entity-local-resources.test.ts:305 exercises
          successful resolution without a manifest. Make the declared manifest check mandatory, or
          add a higher-level exported resolver that loads resources.yaml and use that as the
          trait-compliant resolver while keeping any unchecked helper private/internal."
        created_at: 2026-05-23T09:06:55.361Z
      - _ulid: 01KSA2TCHVRBEQKXGVMQWJR9WY
        author: "@claude"
        body: "Fixed: made the manifest argument required on the public resolveResourcePath and
          copyResourceForStaticExport so undeclared paths are rejected unconditionally at the type
          level. Added a new higher-level resolveResourceReference(ownerEntityDir, relativePath)
          helper that loads resources.yaml from disk and delegates to resolveResourcePath, giving
          callers without a parsed manifest a trait-compliant entry point. Updated existing
          resolveResourcePath tests to pass manifests. Added four behavioral tests covering:
          declared resolution via loaded manifest, undeclared-file rejection even when the file
          exists on disk, rejection when no resources.yaml has been written, and
          absolute/parent-traversal rejection at the path level. Full suite 9401/9406 passing (5
          skipped, +4 new), lint and typecheck clean."
        created_at: 2026-05-23T09:31:48.663Z
    kind: blocker
    resolved_at: 2026-05-23T09:31:58.605Z
    resolved_by: "@claude"
