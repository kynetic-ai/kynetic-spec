    entries:
      - _ulid: 01KMPCPWPD9QES7P97Y3YEDT4Q
        author: "@claude"
        body: "fileToDomain() maps kynetic.yaml only to the meta domain, but loadAllItems() rebuilds the
          items index from the manifest itself plus its includes. That leaves manifest-backed item
          data stale after watcher invalidation. I reproduced this with a temp copy of
          tests/fixtures: after ProjectEntityCache.loadDomain('items'), removing modules/core.yaml
          from kynetic.yaml and calling handleFileChange(tmp, manifestPath) kept the items index
          unchanged (before_count=3, after_count=3, Core Module still present). Any inline item
          edits or include list changes in the manifest will therefore remain stale until some
          unrelated items-domain reload happens, which violates watcher invalidation for the
          affected domain."
        created_at: 2026-03-27T00:57:03.949Z
      - _ulid: 01KMPDAWPDD71MQ12CKJZ47G57
        author: "@claude"
        body: 'Fixed: same root cause as thread 1 — duplicate thread. fileToDomain() now returns ["meta",
          "items"] for kynetic.yaml, ensuring both domains are invalidated on manifest changes.'
