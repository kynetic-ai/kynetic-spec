    entries:
      - _ulid: 01KSZ2EG37JN0B7D2VX9ZYY985
        author: Jacob Chapel
        body: "MUST-FIX: the invocation payload contract was extended with runner, adapter_id, and
          resolved_adapter, but the action template validator still exposes only the old invocation
          field list. Evidence: running node --import tsx with
          validateActionTemplates([\"runner={{runner}} adapter={{adapter_id}}
          resolved={{resolved_adapter}}\"], \"invocation.started\") returns unknown-field warnings
          for all three variables. Impact: hooks/actions using the new invocation payload fields in
          templates get false validation warnings, violating @dispatch-event-payload ac-2's contract
          that payload fields are available to template variables. Update
          KNOWN_EVENT_FIELDS.invocation and the related tests to include the new invocation fields."
        created_at: 2026-05-31T13:09:22.151Z
      - _ulid: 01KSZ3G7H7SF39SV54APNBJ2HN
        author: "@claude"
        body: 'Fixed: KNOWN_EVENT_FIELDS.invocation in src/agent-runtime/action-executor.ts now includes
          runner, adapter_id, and resolved_adapter (with an explanatory comment referencing
          ac-dispatched-event-records-runner). Verified the action template field probe now returns
          [] for templates referencing all three variables against invocation.started and
          invocation.completed. Added a behavioral test in tests/action-model.test.ts ("treats
          runner, adapter_id, and resolved_adapter as known invocation fields") that asserts
          validateActionTemplates produces no warnings for those variables on both started and
          terminal invocation events.'
        created_at: 2026-05-31T13:27:47.495Z
