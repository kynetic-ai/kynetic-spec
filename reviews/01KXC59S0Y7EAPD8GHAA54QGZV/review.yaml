        body: Atomicity and timeless behavioral language are still not closed.
          ac-spawn-win-honors-selected-action specifies two actions/outcomes;
          ac-task-interrupted-stop-recovers combines two triggers with reopening and isolation;
          ac-controls-do-not-change-readiness enumerates five guarantees;
          ac-evidence-survives-control combines six evidence classes; and
          ac-reconstruction-uses-current-state contains non-promise commentary. Exact patches
          @agent-dispatch-engine ac-11 and @cli-agent-commands ac-5 are compound too. Split focused
          behavioral ACs and move mechanisms/non-promises to descriptions or task notes.
