        body: Destructive CLI compatibility conflicts with the canonical trait and misses an existing
          regression suite. @trait-confirmation-prompt defines --force for
          destructive/non-interactive bypass, while the plan invents --yes and neither applies nor
          amends that trait. The task also omits tests/cli-daemon-endpoint-regression.test.ts even
          though endpoint selection is current dispatch CLI compatibility. Reconcile --force versus
          --yes, legacy-script behavior, and include the existing suite.
