threads:
  - _ulid: 01KXC5FAZ02CQH18V1D7JS6GX2
    anchor:
      type: structured
      ref: "@dispatch-lifecycle-control-authority"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXC5FAZ189SQJC24GMCW0TXQ
        author: Jacob Chapel
        body: Atomicity and timeless behavioral language are still not closed.
          ac-spawn-win-honors-selected-action specifies two independently testable actions and
          outcomes; ac-task-interrupted-stop-recovers combines daemon-start and retry triggers plus
          scope reopening and unrelated-task isolation; ac-controls-do-not-change-readiness
          enumerates five independently observable state guarantees; ac-evidence-survives-control
          combines six evidence classes; and ac-reconstruction-uses-current-state contains a
          non-assertion about not promising FIFO or retry timing. The exact patches are also
          compound, especially @agent-dispatch-engine ac-11 and @cli-agent-commands ac-5. Split
          focused behavioral ACs and move mechanism/non-promises to descriptions or task notes.
        created_at: 2026-07-12T21:59:28.481Z
    kind: blocker
  - _ulid: 01KXC5FDX3KQXYZ10MB40ZYDXZ
    anchor:
      type: structured
      ref: "@task-dispatch-control-persistence"
      section: description
    entries:
      - _ulid: 01KXC5FDX3WXPG7X11N4G9KE58
        author: Jacob Chapel
        body: The persistence/ownership contract is still not executable exactly. The plan says to acquire
          the existing dispatch shadow mutation lock, but current withDispatchShadowMutationLock is
          private to src/agent-runtime/workspace.ts:1758, so src/parser/dispatch-control.ts cannot
          consume it. The task does not name the shared helper owner/extraction, commit helper API,
          in-memory snapshot owner, or exact entity-cache domain/status-projection bridge. Current
          CacheDomain has no dispatch-control or agent-status domain and the generic watcher only
          forwards file changes. Freeze the reusable lock/commit owner and watcher-to-store/status
          invalidation path.
        created_at: 2026-07-12T21:59:31.491Z
    kind: blocker
  - _ulid: 01KXC5FGVJQ3C5P2BRT6S7X14N
    anchor:
      type: structured
      field: ac-interrupted-stop-recovers
      ref: "@dispatch-lifecycle-control-authority"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXC5FGVJ7X9ETSFKN3ERSCRT
        author: Jacob Chapel
        body: Crash recovery remains underspecified at the ownership boundary. pending_cleanup is only
          described as entries keyed by global or task ULID, without exact invocation/session
          identities and cleanup phase needed for targeted recovery. The plan says startup
          reconstructs dispatch-owned active/session ownership but does not identify the durable
          source or how it distinguishes still-live processes/sessions after volatile
          SessionRegistry loss. Define pending-cleanup fields, durable reconstruction source, phase
          transitions, and restart behavior for each resource.
        created_at: 2026-07-12T21:59:34.514Z
    kind: blocker
  - _ulid: 01KXC5FKWPZ17G9N94SSDNKTW3
    anchor:
      type: structured
      ref: "@task-dispatch-lifecycle-events"
      section: description
    entries:
      - _ulid: 01KXC5FKWQGNNGNKHTRT6XHR6P
        author: Jacob Chapel
        body: "The closed event taxonomy is incomplete: action includes start and every applied attempt must
          emit one corresponding event, but identifiers include pause_applied, resume_applied, and
          stop_applied only. There is no start_applied identifier, and mapping start to
          resume_applied contradicts the frozen verbs. Add an exact start mapping and enumerate the
          closed error_code values."
        created_at: 2026-07-12T21:59:37.623Z
    kind: blocker
  - _ulid: 01KXC5FPW9ZNG80Y5DGC9QVY2X
    anchor:
      type: structured
      ref: "@task-daemon-dispatch-lifecycle-api"
      section: description
    entries:
      - _ulid: 01KXC5FPW9VTBAR8NN3ZRHXHE0
        author: Jacob Chapel
        body: The HTTP compatibility contract is not closed for every existing route. The canonical
          envelope/statuses are specified, but POST /api/agent/dispatch, POST /dispatch/start, POST
          /dispatch/stop, and GET /dispatch/status are only called adapters or aliases. The plan
          does not say whether they retain current flat fields, return the new envelope, or
          translate new 409/500/503 failures. Freeze exact request, success/no-op, error status, and
          response fields for each route, plus error.code/details shapes.
        created_at: 2026-07-12T21:59:40.681Z
    kind: blocker
