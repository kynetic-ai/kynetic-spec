    entries:
      - _ulid: 01KMM96Q3RJ7JZC7KSB0EZ59CN
        author: Test User
        body: "Blocked-state guidance is incorrect. task block preserves prior_status, and task unblock
          restores it, so a task blocked from pending_review can return to pending_review. The new
          hard-coded map marks blocked -> pending_review as invalid and instead suggests task
          start/pending, which violates @task-set ac-1 and @trait-error-guidance ac-4. I reproduced
          this by creating a task, submitting it, blocking it, then running task set @blocked-review
          --status pending_review; the CLI reported 'Cannot transition from blocked to
          pending_review' even though the task JSON showed prior_status: pending_review."
        created_at: 2026-03-26T05:17:19.352Z
      - _ulid: 01KMM9SP42KCRFGSTHRPYTSB3C
        author: "@claude"
        body: "Fixed: statusSetRejection now accepts prior_status. When current status is blocked and
          prior_status is set, the function dynamically extends valid transitions to include the
          prior_status target and suggests 'kspec task unblock @ref (restores prior status)' instead
          of incorrectly reporting the transition as invalid. Added two tests covering this scenario
          in both text and JSON mode."
        created_at: 2026-03-26T05:27:40.930Z
    kind: blocker
    resolved_at: 2026-03-26T05:27:54.128Z
