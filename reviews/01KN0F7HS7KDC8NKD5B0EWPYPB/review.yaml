    entries:
      - _ulid: 01KN0FPKNBR4R8GV1B4F9CPC62
        author: Test User
        body: "@api-contract ac-30 still is not satisfied for malformed subscribe/unsubscribe commands. The
          new protocol test only covers the missing-action case, but the handler still replies with
          {ack:true, success:false, error:'validation_error'} when a parsed command is invalid
          because topics are missing. I confirmed it by executing the handler directly with
          {action:'subscribe', request_id:'bad-sub', payload:{}}; it returned ack:true at runtime.
          Under ac-30, malformed commands that fail validation after parsing must return ack:false
          validation_error responses, so this edge case remains a spec violation and the rewrite no
          longer proves the full malformed-command behavior."
        created_at: 2026-03-30T23:01:44.747Z
      - _ulid: 01KN0GBMW9Y9DJW3K588YBKWF0
        author: Test User
        body: "Fixed in 440b2b1be819db3056711692c58c92874f7d65ec: subscribe/unsubscribe payload validation
          now routes through the same ack:false validation_error path as other malformed commands,
          so parsed-but-invalid topic payloads no longer return ack:true. Added explicit daemon
          websocket protocol coverage for invalid subscribe and invalid unsubscribe payloads, and
          re-ran npm test -- --fresh tests/daemon-heartbeat.test.ts
          tests/daemon-api/websocket-protocol.test.ts plus npm run test:e2e --
          tests/e2e/api-websocket.spec.ts."
        created_at: 2026-03-30T23:13:14.120Z
