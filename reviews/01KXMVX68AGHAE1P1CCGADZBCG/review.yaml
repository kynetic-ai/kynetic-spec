    entries:
      - _ulid: 01KXMWQR2NNFN5KM8WRVYF6P21
        author: Jacob Chapel
        body: "MUST-FIX: Task-scoped control validates task_id syntax but not task existence. This preflight
          delegates to requireCanonicalTaskIdentity, whose full-ID path accepts any Crockford ULID
          even when the loaded task index has no match. A real-shadow route probe using absent
          task_id 01KG0RR6CA45ZT43W2T6HJMVB9 returned HTTP 200 outcome=applied and persisted
          task_controls with task_ref/title null instead of the required 404 task_not_found. This
          permits durable authority records for nonexistent tasks and leaves the closed not-found
          behavior unproved. Require an existing loaded task at this mutation boundary, preserve
          ref/id mismatch handling, and add exact behavioral task_not_found/ambiguous cases that
          prove no mutation and no raw alias exposure."
        created_at: 2026-07-16T07:19:56.758Z
      - _ulid: 01KXMY0ZH77K4PVE0NMBKXW87C
        author: Jacob Chapel
        body: "Fixed in dc53f97405: strict lifecycle identity resolution now requires the canonical ULID to
          exist in the loaded task index before preflight or locked engine mutation. Behavioral
          route tests cover exact 404 task_not_found and 409 ambiguity rows, no mutation/engine
          creation, and no raw alias exposure."
        created_at: 2026-07-16T07:42:27.879Z
    kind: blocker
    resolved_at: 2026-07-16T07:42:33.410Z
