    entries:
      - _ulid: 01KXMWQZ0S6PJ8YQKHZ6B0DYDG
        author: Jacob Chapel
        body: "MUST-FIX: The inherited @trait-api-endpoint N/A annotations are no longer valid for this
          spec. The new canonical endpoint accepts task_ref/task_id, so ac-2 applies; it persists
          dispatch-control.yaml through the shadow transaction, so ac-5 applies; and every processed
          response is still subject to ac-6, while this route sets no X-Request-Id (the repository
          search finds that header only on the command route). Replace the stale exemptions with
          behavioral coverage for structured 404/no mutation, semantic shadow commit, and
          X-Request-Id on success/failure, implementing any missing behavior. N/A may only be used
          when an inherited criterion genuinely does not apply, not because it is infrastructure or
          untested."
        created_at: 2026-07-16T07:20:03.865Z
      - _ulid: 01KXMY1MRMRHHEE05MKK1TQZT6
        author: Jacob Chapel
        body: "Fixed in dc53f97405: removed the stale trait N/A annotations. Behavioral coverage now proves
          structured not-found/no-mutation, the semantic dispatch-task-pause commit subject, and
