        body: "MUST-FIX: The lifecycle status ACs are annotated on Zod schema parse/rejection tests, not on
          behavior that requests status. These cases pass even if GET /api/agent/status omits or
          misreports authority/projection, queued/held counts, or held task
          identity/scope/mode/reason. The only new route success case starts with empty runtime
          state and accepts any Number/Array, so it does not prove the AC preconditions (active,
          queued, or held work exists) or exact values. Keep the schema tests, but add behavioral
          route fixtures with real active/queued/held state and exact lifecycle rows, and attach
          these AC annotations to tests that exercise the endpoint."
        created_at: 2026-07-16T07:20:00.171Z
      - _ulid: 01KXMY1A88CSD25QM79FQ6ZYJ1
        author: Jacob Chapel
        body: "Fixed in dc53f97405: moved every lifecycle status AC annotation from schema-only tests onto a
          GET /api/agent/status behavioral test. The fixture populates engine active and queued
          state plus a durably paused task, then asserts exact counts, projection, identity, scope,
          mode, reason, and control rows."
        created_at: 2026-07-16T07:42:38.855Z
    kind: blocker
