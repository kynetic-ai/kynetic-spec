      - _ulid: 01KR41HNDZ4BT4R8DABP9DR6X0
        author: Jacob Chapel
        body: "MUST-FIX: The linked spec still lacks own AC annotations for two acceptance criteria.
          Evidence: kspec validate reports @daemon-test-guardrail-precision uncovered for
          ac-direct-daemon-entry-invocations-flagged and ac-unrelated-subprocesses-not-reported. I
          also ran rg for AC annotations under tests/ and found this branch only annotates
          @daemon-test-guardrail-precision for ac-detached-cleanup-before-observation,
          ac-local-exception-is-local, and ac-exception-reason-states-subject. The task note says
          the missing ACs are covered by an existing precision block, but without the required
          annotations they do not count as AC coverage. Add matching AC annotations to the existing
          behavioral tests or add behavioral coverage for those two ACs before resubmitting."
        created_at: 2026-05-08T14:58:25.855Z
      - _ulid: 01KR44514TNXB5CPZ858HD4DTK
        author: "@claude"
        body: >-
          Fixed: added matching `// AC: @daemon-test-guardrail-precision` annotations to two
          existing behavioral describe blocks in tests/lint-daemon-test-guardrails.test.ts (commit
          500780baf):


          - Line 113 'direct daemon spawn is flagged outside the shared fixture' now also annotates
          ac-direct-daemon-entry-invocations-flagged. The block already exercises spawn(node|bun,
          [DAEMON_ENTRY]) outside an approved helper and asserts the rule flags the startup — that
          is exactly the AC's Given/When/Then.

          - Line 836 'does not regress legitimate non-daemon patterns' now also annotates
          ac-unrelated-subprocesses-not-reported. The block already exercises spawnSync('bun',
          ['run', 'some-script.mjs']) and other non-daemon shapes that the rule must not flag.


          Verification: `kspec validate` no longer reports @daemon-test-guardrail-precision under
          'Missing own AC coverage' — the two ACs are now covered. Focused tests (npm test --
          --fresh tests/lint-daemon-test-guardrails.test.ts tests/lint-no-leaky-test-daemon.test.ts)
          pass at 71/71. Full npm test passes at 8806 passed / 5 skipped / 0 failed across 2402
          suites (1950.9s).


          Note on scope: I chose the 'add matching AC annotations to the existing behavioral tests'
          path you offered rather than 'add behavioral coverage' because the failing-before-fix
          classifier-gap regressions for fork/execFile and for the echo/git argv-overlap
          false-positive are explicitly the scope of the sibling task
          @task-add-guardrail-classification-regressions (which is in pending_review on its own
          branch). Duplicating those it.fails-style regressions here would create a guaranteed merge
          conflict and double-up the contract with
          @task-fix-guardrail-daemon-command-classification.
        created_at: 2026-05-08T15:43:57.594Z
