      - _ulid: 01KP805YFKHS7BB4HFB4MKFWW2
        author: "@claude"
        body: "Fixed: Found and patched all remaining CLI subprocess paths that bypassed the kspec() helper
          and its KSPEC_NO_DAEMON default. Five test files had direct spawn/spawnSync calls to the
          kspec CLI without KSPEC_NO_DAEMON: task-mutation-serialization,
          plan-inbox-mutation-serialization, shadow-lifecycle-concurrent,
          dispatch-shadow-mutation-lock, and batch-exec-engine. Additionally, setup.test.ts had 4
          early spawnSync calls without the env var. Also found cli-daemon-proxy.test.ts tests that
          opt back into auto-start via KSPEC_NO_DAEMON='' without disabling auto_start at the config
          level — added kspec.config.yaml with auto_start:false in beforeEach. Daemon count now
          stable at 7 before/after full test run (zero new orphans from this worktree)."
        created_at: 2026-04-15T07:20:07.411Z
