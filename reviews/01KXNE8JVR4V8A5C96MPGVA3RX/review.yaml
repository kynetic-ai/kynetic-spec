      side: head
    entries:
      - _ulid: 01KXNFEAGS6X0Y4HWG4MXP4WZW
        author: Jacob Chapel
        body: MUST-FIX — These five AC annotations do not have behavioral coverage. The test only compares
          the exported HARD_STOP_CONFIRMATION constant; it never renders a lifecycle control,
          opens/cancels the dialog, verifies accessible labeling/evidence, exercises a successful
          state-changing mutation, checks focus, or observes a live update. Consequently it would
          still pass if the components violated all five annotated ACs. Replace/add component or
          browser tests that exercise the actual behaviors for hard-stop
          cancellation/evidence/cancelled outcome, focus retention, and live updates.
        created_at: 2026-07-16T12:46:50.905Z
    kind: blocker
  - _ulid: 01KXNFEDVD8B18PAWKSG5SH4MC
    anchor:
      type: code
      commit: 94bade5fd3b922dc5be743c479cbca710b5f864c
      line_end: 54
      line_start: 47
      path: packages/web-ui/src/lib/components/agents/DispatchStatus.svelte
      side: head
    entries:
      - _ulid: 01KXNFEDVDV0K01W84YZT6RE4N
        author: Jacob Chapel
        body: MUST-FIX — Focus restoration targets the pre-mutation DOM node. onAction awaits the mutation,
          then await tick() lets the successful cache update replace Pause/Stop with Resume/Start;
          the subsequent animation-frame callback calls focus() on invokingControl, which is now
          detached. The same pattern exists in HeldTaskRow. This does not satisfy
          ac-lifecycle-focus-retained after successful state-changing actions. Restore focus to a
          surviving/replacement logical control after the refreshed DOM is committed, and cover the
          success path behaviorally.
        created_at: 2026-07-16T12:46:54.317Z
    kind: blocker
  - _ulid: 01KXNFEH6FMXTG6FCZDT3CXM6J
    anchor:
      type: code
      commit: 94bade5fd3b922dc5be743c479cbca710b5f864c
      line_end: 267
      line_start: 244
      path: packages/web-ui/src/routes/agents/+page.svelte
      side: head
    entries:
      - _ulid: 01KXNFEH6FQAEK6W64X8XTHZ3H
        author: Jacob Chapel
        body: MUST-FIX — The outer condition renders Active invocations only when activeInvocations.length >
          0, so its nested empty-state branch is unreachable. When dispatch is running with zero
          active work, the actionable empty state and polite live region disappear. Existing
          Playwright tests for both behaviors failed twice; the base implementation rendered this
          section whenever dispatch was enabled. Change the section condition so running/zero-active
          remains visible and accessible.
        created_at: 2026-07-16T12:46:57.743Z
    kind: blocker
  - _ulid: 01KXNFEMC3Q7FA79NK96B94ZS1
    anchor:
      type: code
      commit: 94bade5fd3b922dc5be743c479cbca710b5f864c
      line_end: 1127
      line_start: 1112
      path: packages/web-ui/src/lib/api.ts
      side: head
    entries:
      - _ulid: 01KXNFEMC4TVVKP80RMJ8E0J72
        author: Jacob Chapel
        body: MUST-FIX — parseLifecycleWire constructs a new object from known lifecycle keys before passing
          it to a strict schema. Unknown properties on the incoming public wire object are therefore
          discarded instead of rejected, so the claimed closed exact wire/model boundary is not
          actually closed. The mutation envelope follows the same projection pattern. Validate the
          complete allowed status/mutation envelope (including rejection of unknown root fields)
          before projection, and add unknown-field tests that would fail with the current
          implementation.
        created_at: 2026-07-16T12:47:00.996Z
    kind: blocker
  - _ulid: 01KXNFEQNKKHWRKSZJFEFCP5SC
