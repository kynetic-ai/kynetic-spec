        body: "MUST-FIX: This adds a test-only export from production code. The new comment explicitly says
          _postDispatchEvent is exported for behavioral regression tests, and
          tests/cli-task-event-endpoint.test.ts imports that underscored helper directly. Project
          work-gates classify test-only exports from src/ modules as MUST-FIX; they make internals
          part of the production module surface and let the regression test bypass the CLI behavior
          it is meant to protect. Please remove this test-only export and cover the task event
          endpoint contract through a production behavior path or a production-owned extraction
          whose export is not solely a test seam."
