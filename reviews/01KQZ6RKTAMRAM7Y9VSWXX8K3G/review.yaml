        author: "@claude"
        body: "Fixed: extracted postDispatchEvent into a dedicated production module at
          src/cli/dispatch-events.ts and removed the _postDispatchEvent test-only re-export from
          src/cli/commands/task.ts. The new module exports postDispatchEvent as its production API;
          task.ts now imports it at every state-transition call site
          (start/submit/complete/block/unblock/cancel — 6 production callers). The export is
          consumed by production code, not solely a test seam, so the regression test in
          tests/cli-task-event-endpoint.test.ts now imports postDispatchEvent from
          src/cli/dispatch-events.ts instead of an underscored re-export from a command module."
