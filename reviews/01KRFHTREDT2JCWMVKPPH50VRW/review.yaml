    entries:
      - _ulid: 01KRFJH9MTA41QQDMEHF70RJK5
        author: Jacob Chapel
        body: 'MUST-FIX: active/in-flight task refs do not protect the corresponding dispatch branch when
          the trusted registry has no record yet. The helper marks
          evaluateTaskRef(@01KRF37Y941E2T8D1ATFV63JB0) as preserve=true, but
          evaluateDispatchBranch("dispatch/task/task-centralize-dispatch-artifact-protection-decisions/01krf37y")
          returns preserve=false with registry={status:"loaded",records:[]}. In reconciliation, that
          branch path reaches listDispatchBranches() and deleteDispatchBranch(), so the
          queue-to-spawn window can still delete a canonical branch for active/in-flight work before
          a registry record exists. This violates ac-active-inflight-provisioning-artifact-preserved
          and the task requirement that caller-supplied active/in-flight task refs are protection
          sources across destructive surfaces.'
        created_at: 2026-05-13T02:26:58.330Z
      - _ulid: 01KRFKYQQC1179QRR770DBS67E
        author: "@claude"
        body: >-
          Fixed: Derived activeOrInFlightShortIds via shortTaskId() and routed
          evaluateDispatchBranch() and evaluateWorkspacePath() through it. Any canonical
          dispatch/task/<slug>/<short-id> branch whose trailing segment matches an active/in-flight
          ref now returns preserve=true, and so do worker (<slug>-<short-id>) and reviewer
          (<slug>-<short-id>-review) worktree basenames under the configured worktree root — even
          when the registry has no record yet. Verified by:


          - New unit test (tests/dispatch-artifact-protection.test.ts) exercising the exact blocker
          scenario: activeOrInFlightTaskRefs=[@01KRF37Y941E2T8D1ATFV63JB0], registry={status:loaded,
          records:[]}, asserting evaluateDispatchBranch and evaluateWorkspacePath both return
          preserve=true for the canonical branch and worker/reviewer dirs.

          - A second unit test that asserts the derivation does not over-protect: non-canonical
          dispatch branches (wrong segment count) and paths outside worktreeRoot remain unprotected.

          - New E2E regression in tests/dispatch-workspace-cleanup.test.ts that reserves
          dispatch/task/task-queue-to-spawn-protection/01task00 with an empty registry and an active
          task ref, then proves reconcileDispatchWorkspaceArtifacts() does not delete the branch.
        created_at: 2026-05-13T02:51:47.308Z
    kind: blocker
    resolved_at: 2026-05-13T02:51:56.438Z
    resolved_by: "@claude"
