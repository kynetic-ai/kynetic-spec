      - _ulid: 01KVEZ03BAE42NMWDVJEG51SHJ
        author: Jacob Chapel
        body: 'MUST-FIX: The public shared API ReviewAnchor union was not extended with the new plan_text
          variant. The backend schema and daemon now accept/store/return anchors like { type:
          "plan_text", section, offset, quoted_text, created_at_rev }, but shared consumers still
          see ReviewThread.anchor as only code/structured/spec_ac. That makes valid review
          detail/static export data unrepresentable in the shipped client contract and prevents
          typed consumers from handling the new anchor shape. Add the plan_text variant here, and
          update the matching web createReviewThread input type so the daemon write interface can be
          called with the new anchor shape.'
        created_at: 2026-06-19T03:32:37.354Z
    kind: blocker
