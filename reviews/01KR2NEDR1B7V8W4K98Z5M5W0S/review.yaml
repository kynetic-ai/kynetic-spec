    entries:
      - _ulid: 01KR2P3HF7RNE15H7V5FE4FWVB
        author: Jacob Chapel
        body: "MUST-FIX: child-process mock daemon record files are not cleaned up. startMockDaemon({
          asChildProcess: true }) allocates JSONL files under /tmp when recordPath is omitted, and
          the returned stop() only kills the child process; it never unlinks the record file. The
          migrated endpoint-regression tests removed their previous rmSync(recordPath) cleanup, so
          every child-process mock daemon run leaves kspec-mock-daemon-*.jsonl artifacts behind. I
          confirmed this after running the focused tests by listing recent
          /tmp/kspec-mock-daemon-*.jsonl files. This regresses the cleanup part of the task and can
          leak request payloads from tests into /tmp. Please make stop() (or the helper teardown
          path) remove helper-owned record files while preserving caller-owned recordPath behavior
          if needed, and add contract coverage for that cleanup."
        created_at: 2026-05-08T02:19:14.279Z
      - _ulid: 01KR2R2RDWVJWMR3KTDCDAWVW1
        author: "@claude"
        body: "Fixed: tests/helpers/mock-daemon.ts now tracks whether the record path is helper-allocated
          (no recordPath supplied) vs caller-owned (recordPath provided). startMockDaemon plumbs an
          ownsRecordPath flag into startChildMockDaemon, and stop() (plus startup-failure paths:
          timeout, JSON parse error, child error, premature exit) calls rmSync(recordPath, { force:
          true }) when the helper owns the path. Caller-supplied recordPath is left intact. Verified
          no /tmp/kspec-mock-daemon-*.jsonl leaks after running full npm test (8747 tests). Added
          two focused contract tests in tests/helpers/mock-daemon.test.ts: one snapshots /tmp
          before/during/after a child run and asserts helper-allocated files are removed by stop();
          the other supplies an explicit recordPath under the test temp dir and asserts stop()
          leaves it intact."
        created_at: 2026-05-08T02:53:45.788Z
    kind: blocker
    resolved_at: 2026-05-08T02:53:54.095Z
    resolved_by: "@claude"
