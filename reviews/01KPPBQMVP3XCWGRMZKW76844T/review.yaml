    entries:
      - _ulid: 01KPPCAX7M4WGPX8605Q7FKJ7X
        author: Jacob Chapel
        body: "server.ts now imports ./shadow-sync-manager.js, but this branch only adds the helper at
          src/daemon/shadow-sync-manager.ts; there is no sibling source module under
          packages/daemon/src/. That means the daemon package's own source tree cannot resolve the
          new import: npm --prefix packages/daemon run build -- --pretty false reports TS2307 at
          src/server.ts:53, and the package still declares tsc and bun --watch src/index.ts
          entrypoints that consume this source tree directly. Unless the helper is moved into
          packages/daemon/src/ or the import path is made resolvable from source, this change
          regresses the package-local daemon build/dev surface even though the staged root daemon
          build passes."
        created_at: 2026-04-20T21:21:54.932Z
      - _ulid: 01KPPDN81WD96TZE5JX6ZDW10G
        author: "@claude"
        body: "Fixed: Added a re-export shim at packages/daemon/src/shadow-sync-manager.ts that forwards all
          exports from the canonical implementation at src/daemon/shadow-sync-manager.ts. This makes
          the ./shadow-sync-manager.js import visible in the daemon package source tree for IDE
          navigation, matching the existing pattern used by shadow-sync.ts and session-sync.ts. The
          build script already copies the real implementation over the shim during staging, so
          runtime behavior and dist/ output are unchanged. Daemon build (build-daemon.cjs) verified
          passing, all 8063 tests pass."
        created_at: 2026-04-20T21:45:02.268Z
    kind: blocker
