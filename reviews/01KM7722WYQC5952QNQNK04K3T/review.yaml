    entries:
      - _ulid: 01KM77AJ8H67S92MWD6VF976DQ
        author: Jacob Chapel
        body: " validates the callback output against , but it never enforces that the callback kept the
          original . Because the monolithic backend still writes that result back into the original
          slot, a caller can rewrite a task's identity in place. I reproduced this with a tsx probe:
          mutating  to  removed the old ULID from disk and persisted the new one. That breaks
          reference stability for dependencies/reviews and is inconsistent with , which does reject
          ULID changes."
        created_at: 2026-03-21T03:34:20.689Z
    kind: blocker
  - _ulid: 01KM77AY1P1GAACHN4YGK06RJC
    anchor:
      type: code
      commit: 29d48278f31ece8b422641f746402a06ab097948
      line_end: 505
      line_start: 471
      path: src/parser/task-data-manager.ts
      side: head
    entries:
      - _ulid: 01KM77AY1QG6B2JVMK1HQ71NWG
        author: Jacob Chapel
        body: "Mutations currently drop any raw task fields that are not modeled in TaskSchema. The write
          path schema-parses the raw record first, then mergeTaskPreservingRawShape() rebuilds the
          YAML from that normalized object, so unknown keys never make it back out. I reproduced
          this by injecting `custom_backend_field: preserved-value` into project.tasks.yaml, then
          calling addNote(); the field disappeared from disk after the mutation. That breaks the
          storage-format abstraction in ac-1/ac-8 because any backend-specific or forward-compatible
          metadata is lost on the first write."
        created_at: 2026-03-21T03:34:32.759Z
    kind: blocker
  - _ulid: 01KM77B98RPAXYSF8SMTFSX3YT
    anchor:
      type: code
      commit: 29d48278f31ece8b422641f746402a06ab097948
      line_end: 1008
      line_start: 970
      path: src/parser/yaml.ts
      side: head
    entries:
      - _ulid: 01KM77B98RJBR9TTC887SMD2ZG
        author: Jacob Chapel
        body: "The manager can read a bare single-task YAML file, but it cannot mutate that same file.
          loadSummariesFromFile() and the existing read path both accept a top-level task object,
          while extractRawTaskArray() only accepts arrays or `{ tasks: [...] }`. I reproduced this
          with a temp repo containing `.kspec/project.tasks.yaml` as a single task object:
          getTask('@single-task') succeeds, but addNote('@single-task') fails with `Task not found:
          01ARZ3NDEKTSV4RRFFQ69G5FAV`. That means the abstraction accepts a valid on-disk task file
          on reads and then refuses to write it back."
        created_at: 2026-03-21T03:34:44.248Z
    kind: blocker
  - _ulid: 01KM77BFMG2ZVYDHE89G2JAJPK
    anchor:
      type: code
      commit: 29d48278f31ece8b422641f746402a06ab097948
      line_end: 903
      line_start: 894
      path: src/parser/task-data-manager.ts
      side: head
    entries:
      - _ulid: 01KM77BFMG4Y2NB82RPWNFMYC1
        author: Jacob Chapel
        body: "`deleteTask()` still hard-requires `_sourceFile` before it will delegate to the backend. That
          leaks the monolithic file-path model into the supposedly format-agnostic manager. I
          reproduced this with a registered mock split backend whose getTask() returned a valid
          LoadedTask without `_sourceFile`: manager.deleteTask() threw `Cannot delete task @x: no
          source file metadata` and the backend's deleteTask() was never called. So once the split
          backend stops exposing file paths, the delete path stops routing through the backend at
          all, which violates ac-1/ac-8."
        created_at: 2026-03-21T03:34:50.768Z
    kind: blocker
