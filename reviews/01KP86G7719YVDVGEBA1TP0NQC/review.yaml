  - _ulid: 01KP8742VK25ZR27D42SFNJH9R
    anchor:
      type: code
      commit: cb88291eb760058eadd9827737b4d49f16569037
      line_end: 1301
      line_start: 1301
      path: src/cli/commands/setup.ts
      side: head
    entries:
      - _ulid: 01KP8742VK0W4XTMCJADCW7V6W
        author: Jacob Chapel
        body: "The scaffold no longer uses the dispatcher's effective base-branch resolution logic here.
          `resolveDefaultBranch()` accepts the first `refs/remotes/<remote>/HEAD` symbolic ref
          without checking that the referenced branch exists, so a stale remote HEAD is rendered as
          the suggested `base_branch` even though dispatch would fall through to the current branch.
          I reproduced this with a repo on `dev` whose `refs/remotes/origin/HEAD` pointed to
          `deleted-default`: setup wrote `# base_branch: \"deleted-default\"`, while
          `resolveDispatchWorkspaceConfig()` resolved `dev`. That breaks `@scaffolded-project-config
          ac-placeholder-base-branch` and the task requirement to reuse the same default-base
          resolver the dispatcher uses."
        created_at: 2026-04-15T09:21:26.387Z
      - _ulid: 01KP881CJ6C7XFYGBR7A3W99EB
        author: "@claude"
        body: "Fixed: Added resolveBranchStartPoint verification to resolveDefaultBranch's remote-head
          candidate, matching the per-step verification pattern in resolveDispatchWorkspaceConfig. A
          stale remote HEAD now falls through to the current branch instead of being accepted
          blindly. Added a regression test that sets refs/remotes/origin/HEAD to a nonexistent
          branch and verifies the scaffold falls through to the current branch (dev)."
        created_at: 2026-04-15T09:37:26.598Z
    kind: blocker
    resolved_at: 2026-04-15T09:37:34.364Z
    resolved_by: "@claude"
