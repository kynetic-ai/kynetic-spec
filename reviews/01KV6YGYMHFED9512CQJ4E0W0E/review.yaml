      - _ulid: 01KV6YSG8FP9VDDNCZY15F3YG5
        author: Jacob Chapel
        body: "Corrected blocker text: MUST-FIX: orphaned_verification_record is emitted by validation but
          is not surfaced by the human kspec validate --completeness formatter.
          formatCompletenessWarnings partitions warnings into explicit known groups and has no
          branch or fallback for the new type, so an orphan-only result would show a warning count
          without the item, AC, or message details. That falls short of AC
          ac-unresolvable-keys-tolerated, which requires validation to report orphaned verification
          records rather than effectively hiding them from the CLI report. The added test at
          tests/verification-record-store.test.ts line 343 checks the programmatic validate result,
          but it does not exercise CLI formatting. Add formatter output for this warning type and
          behavioral CLI coverage or an equivalent regression test so orphaned verification records
          are visible to users."
