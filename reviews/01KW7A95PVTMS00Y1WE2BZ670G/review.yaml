    entries:
      - _ulid: 01KW7B5WDNW9H46X167F2BMEXZ
        author: Jacob Chapel
        body: >-
          MUST-FIX: `/specs?plan=<ref>` no longer filters the specs workspace. The old route read
          `planFilter` from the URL and passed it into `fetchItems(...)`, so the plan "View Specs"
          path showed only specs for that plan. In the replacement route, `planFilter` is only used
          for the banner; the root query always calls `fetchSpecWorkspaceRoot({ limit:
          WORKSPACE_PAGE_SIZE })`, and the new spec-workspace API/client has no `plan` parameter to
          apply. Impact: users following a plan's "View Specs" link land on `/specs?plan=...` but
          see the whole spec corpus, which regresses the existing plan-filter navigation/read
          behavior. Please preserve the filter in the new projection/API/client/static path and add
          a behavioral assertion that the tree contents are filtered, not just that the banner
          appears.


          Evidence: base `packages/web-ui/src/routes/specs/+page.svelte` used `fetchItems(planFilter
          ? { plan: planFilter } : undefined)`; current route lines 66-68 call
          `fetchSpecWorkspaceRoot` without `planFilter`, while lines 589-596 only render the plan
          banner.
        created_at: 2026-06-28T14:47:16.149Z
      - _ulid: 01KW7DE3PMCNR9V7M5JT2JMECD
        author: Jacob Chapel
        body: "Fixed in c35fb3fd1b: /api/spec-workspace/root now accepts plan and filters visible root
          nodes/corpus counts to the plan's derived_specs, with live client, static fallback, and
          /specs query key all preserving the plan parameter. Added behavioral daemon/static tests
          and strengthened the View Specs E2E to assert the tree shows Test Feature and excludes
          unrelated Core Module/Test Trait rows."
        created_at: 2026-06-28T15:26:42.900Z
    kind: blocker
