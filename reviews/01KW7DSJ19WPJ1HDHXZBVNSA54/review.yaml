        body: 'MUST-FIX: The task explicitly covers @spec-workspace-delivery-quality ac-url-state-via-goto,
          but that AC has no behavioral test annotation. I ran `rg -n "AC:
          @spec-workspace-delivery-quality ac-url-state-via-goto" tests packages src`; the only
          match is `packages/web-ui/src/routes/specs/+page.svelte:10`, which is implementation
          source, not a test. Review rules require each covered AC to have an annotated behavioral
          test, and source annotations do not count as AC test coverage. Add or annotate a
          behavioral test proving URL-state changes for focused node/criterion/expansion use
          SvelteKit navigation or link behavior so `$page.url` stays reactive and direct history
          mutation is not used.'
