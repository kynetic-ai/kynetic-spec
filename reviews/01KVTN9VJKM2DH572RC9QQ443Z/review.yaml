    entries:
      - _ulid: 01KVTP5XR47JSM8X26RTMM4W7C
        author: Jacob Chapel
        body: "MUST-FIX: the real dispatch provisioning path still drops the task's plan_ref before
          resolving the workspace target. The same method uses plan_ref for target sync just above,
          but this provisionDispatchWorkspace call passes only title and slugs, so
          resolveDispatchWorkspaceConfig cannot see the owning plan during actual dispatched
          review/fix-cycle provisioning. A plan-scoped submitted branch with no existing workspace
          record can still be adopted/reconstructed against dispatch.base_branch rather than the
          plan branch, which is the adjacent recovery/adoption case this task explicitly called out.
          The new dispatch-workspace-config regression does not disprove this because it calls
          provisionDispatchWorkspace directly with plan_ref. Pass plan_ref through the dispatch
          provisioning/validation/discovery task payloads and add a dispatch-engine-level regression
          for a plan-scoped pending_review or needs_work entry."
        created_at: 2026-06-23T16:49:24.228Z
      - _ulid: 01KVTQH7HX8QMKD4C6EN8TEBAQ
        author: Jacob Chapel
        body: "Fixed in eb99e0b0ca: dispatch engine workspace health, discovery, provisioning, and
          validation task payloads now include plan_ref. Workspace config/health/discovery resolve
          with that task context, and a dispatch-engine-level pending_review adoption regression
          proves the invocation env and workspace record target the owning plan branch instead of
          dispatch.base_branch."
        created_at: 2026-06-23T17:13:03.293Z
