      section: acceptance_criteria
    entries:
      - _ulid: 01KSTNZQQREPHHBD3EP2HRYCD8
        author: Jacob Chapel
        body: This AC combines daemon agent-definition responses and dispatch status responses into one
          criterion, which makes coverage ambiguous and lets one half pass while the other half is
          missed. Split it into separate ACs for agent-definition API payloads and dispatch-status
          payloads. The same split should be considered for active versus queued invocation UI rows
          so each behavior has a single observable outcome.
        created_at: 2026-05-29T20:14:37.816Z
    kind: blocker
  - _ulid: 01KSTP01KY06WWPM6PJT28EBHS
    anchor:
      type: structured
      ref: "@task-runner-config-schema-types"
      section: tasks
    entries:
      - _ulid: 01KSTP01KYMKTZT6YQ4CM489S4
        author: Jacob Chapel
        body: "The task leaves the runner kind enum and out-of-scope sidecar behavior for the worker to
          decide: it says kind has 'at least acp_process' and to reserve 'headed_acp_sidecar' as a
          parsed value if the launcher is out of scope. That is not precise enough for a
          compatibility/security boundary. Define the exact accepted kind enum values and, if
          headed_acp_sidecar is accepted before implementation, specify whether validation fails
          closed, what diagnostic is emitted, and what sidecar-specific security/loopback fields are
          intentionally absent or reserved."
        created_at: 2026-05-29T20:14:47.934Z
