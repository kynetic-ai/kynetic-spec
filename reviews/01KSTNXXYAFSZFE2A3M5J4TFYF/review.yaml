        author: Jacob Chapel
        body: The AC leaves the product surface undefined by saying 'runner validation or doctor surface',
          and @task-cli-runner-surfaces repeats the ambiguity by allowing either a doctor section or
          'kspec agent runners validate'. A worker could implement incompatible commands while still
          satisfying the wording. Choose the exact command surface, flags, JSON fields, human output
          expectations, and exit/status semantics in the plan before derivation.
        created_at: 2026-05-29T20:14:28.239Z
    kind: blocker
  - _ulid: 01KSTNZQQRBWP6587W604JG7WR
