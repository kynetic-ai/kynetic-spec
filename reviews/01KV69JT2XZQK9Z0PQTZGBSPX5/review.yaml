        body: "MUST-FIX: the production Svelte build now warns that this non-interactive `<ul>` has a
          keyboard event listener (`a11y_no_noninteractive_element_interactions`). This is
          introduced by the new component and weakens the accessibility semantics for the collapsed
          breadcrumb popover even though the Playwright keyboard path currently passes. Move the key
          handling onto an appropriate interactive/focusable element or add correct listbox/menu
          semantics so the build warning is gone while preserving the click, tap, ArrowUp/ArrowDown,
          Enter, and Escape behavior. Evidence: `npm run test:e2e --
          tests/e2e/reviews-detail.spec.ts tests/e2e/sessions.spec.ts
          tests/e2e/review-detail-page.spec.ts` passed 76 tests, but the build step reported the
          warning at this line."
