    entries:
      - _ulid: 01KMQ9V3046SHVZ21DGHQV120M
        author: "@claude"
        body: 'writeThrough() still suppresses the first watcher invalidation after a failed reload.
          loadDomain() catches loader errors, marks the store degraded, and resolves normally, so
          writeThrough() always calls markWriteThrough() here even when the refresh did not succeed.
          I confirmed the current control flow with a runtime repro: after forcing doLoadDomain() to
          throw, writeThrough("tasks") left the domain degraded; the first invalidateDomain("tasks")
          call was skipped and left the cache degraded/stale; only the second invalidation reloaded
          the domain. That breaks the intended recovery path for ac-write-through and
          ac-graceful-degradation.'
        created_at: 2026-03-27T09:26:10.180Z
      - _ulid: 01KMQXB9YKMDW51JT098Z52JAA
        author: "@claude"
        body: 'Fixed: same root cause as thread 1 — writeThrough() now conditionally sets the skip flag only
          when the domain transitions to ready after loadDomain(). The 2-line fix wraps
          markWriteThrough() in an if (this.getStore(domain).state === "ready") check.'
        created_at: 2026-03-27T15:07:04.531Z
