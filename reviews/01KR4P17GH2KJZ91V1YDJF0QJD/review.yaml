    entries:
      - _ulid: 01KR4P6HY69KWZYGE3BTT5SXYT
        author: Jacob Chapel
        body: "MUST-FIX: the spawn-like direct-entry detector still treats any executable with a
          daemon-entry argv element as a daemon launch. In this block, after args[0] is not the
          daemon entry, the code only checks arrayArgContainsDaemonEntry(args[1]) and returns a
          directDaemonSpawn descriptor without verifying that args[0] is a JS runtime capable of
          executing the script. I confirmed with an oxlint probe that spawn('cat',
          ['dist/daemon/index.js']) and execFile('grep', ['dist/daemon/index.js', 'src/']) both emit
          no-leaky-test-daemon direct-daemon diagnostics even though those subprocesses only consume
          the path as data and do not start kspec's daemon. That violates
          @daemon-test-guardrail-precision ac-unrelated-subprocesses-not-reported and the task
          requirement to avoid matching unrelated executables. Restrict the argv daemon-entry form
          to actual runtime executables (for example node/bun/path-ending-in-node-or-bun, consistent
          with the exec/execSync shell-token logic) and add behavioral regressions for unrelated
          spawn/execFile argv cases."
        created_at: 2026-05-08T20:59:21.926Z
      - _ulid: 01KR4RQWM9J77XF238DN4M70A2
        author: "@claude"
        body: >-
          Fixed: tightened the spawn-like detector in readDaemonEntryInvocation to require args[0]
          to be a recognised JS runtime before treating an argv-element daemon entry as a daemon
          launch. New helper isRecognisedRuntimeArg wraps isRecognisedShellRuntimeToken (the same
          predicate the exec/execSync branch already uses) so 'node' / 'bun' (bare or path-suffixed)
          match while substring confusables ('nodemon', 'bunyan') and unrelated executables ('cat',
          'grep', 'docker') do not. The direct-executable form (args[0] IS the daemon entry, e.g.
          spawn(DAEMON_ENTRY, [...])) is unchanged — that path still fires regardless of args[0]
          shape because a shebang'd entry IS the runtime.


          Behavioral regressions added in tests/lint-daemon-test-guardrails.test.ts under the
          unrelated-subprocesses-not-reported describe:

          - spawn('cat', [DAEMON_ENTRY]) — must NOT be flagged (reviewer probe)

          - execFile('grep', ['dist/daemon/index.js', 'src/']) — must NOT be flagged (reviewer
          probe)

          - spawnSync('nodemon', [DAEMON_ENTRY, '--watch', 'src']) — substring-of-runtime guard

          - execFileSync('docker', ['run', 'image', 'dist/daemon/index.js']) — non-runtime
          executable

          - execFile('/usr/bin/node', [DAEMON_ENTRY, ...]) — positive regression: path-suffixed
          runtime still flagged


          Verification:

          - Targeted suite: 100 tests pass (95 prior + 5 new).

          - Full suite: 8850 passed, 5 skipped, 0 failed.

          - Project lint: 13 errors, 721 warnings — same dev baseline.

          - Reviewer's exact probe (spawn('cat', [...]) + execFile('grep', [...])) exits 0 with 0
          diagnostics.
        created_at: 2026-05-08T21:43:47.081Z
    kind: blocker
