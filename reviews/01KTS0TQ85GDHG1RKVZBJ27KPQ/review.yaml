        author: "@claude"
        body: "Same drift class the plan fixes for @triage-daemon-api, but left uncorrected here:
          @plan-validation ac-10 says 'Then: Validation warns about dangling plan reference' (and
          the spec description says 'warn about dangling references'), yet the task correctly
          establishes that validation.strict_refs defaults to true (src/parser/config.ts:518,
          verified), so the behavior the re-enabled test will assert is an ERROR with non-zero exit
          (kspecRun with expectFail: true). The test will be annotated 'AC: @plan-validation ac-10'
          while asserting behavior that contradicts the AC's literal wording. Suggest the task also
          update ac-10 (e.g. 'validation reports the dangling plan reference as a finding; with
          strict references enabled the command exits non-zero'), or explicitly justify in the task
          why the 'warn' wording is acceptable as-is. Note @validation-task-data-source's ACs are
