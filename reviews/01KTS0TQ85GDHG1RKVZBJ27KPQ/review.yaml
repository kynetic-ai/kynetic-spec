      - _ulid: 01KTS0Y5V2CWHCGFZAS27JKCAG
        author: "@claude"
        body: "Factual error in the root-cause narrative (presented as 'verified'): the task and
          Implementation Notes claim MetaUlidSchema was tightened from z.string().min(1) to the
          strict UlidSchema in commit 8624214d9f (2026-02-14), AFTER the tests were written in
          8f1f9534ec (2026-01-22). Both the commit and the chronology are wrong. Commit 8624214d9f
          is 'feat: add Skill as 5th meta item type' and does not touch MetaUlidSchema. The actual
          tightening commit is 703f4b6764 'feat: implement agent reference validation (AC-3)', dated
          2026-01-17 — five days BEFORE the tests were written. So the fixtures were invalid from
          the day the tests were created; they were not broken later by a schema change. The
          operational conclusion (fixture ULIDs are invalid under the current strict schema and must
          be replaced) is correct and independently verified, and the What/How of the task are
          unaffected. But the stored task description asserts a false verified claim that a dispatch
          worker is told to trust, and the 'Audit-finding verification summary' repeats it. Fix:
          correct the commit reference and the timeline narrative (tests were born broken), or drop
          the provenance paragraph entirely — it is not needed to justify the fix."
        created_at: 2026-06-10T15:03:14.018Z
    kind: blocker
  - _ulid: 01KTS0Y8CPBJK9VZHPW71T0E1Q
