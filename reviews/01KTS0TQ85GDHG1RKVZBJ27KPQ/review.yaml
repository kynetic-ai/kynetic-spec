        body: "The spec-reality drift correction in task-daemon-triage-api-tests is incomplete. The task
          directs updating only ac-4 and ac-5 of @triage-daemon-api from PUT wording to the
          implemented POST subroutes — but ac-8 and ac-9 ALSO describe 'a PUT request with act flag'
          ('Given: a PUT request with act flag targets a record with status acted_on' / '...with
          status pending'). The implementation is POST /api/triage/:ref/act
          (packages/daemon/src/routes/triage.ts:504; 409 at lines 523-529, 422 at lines 533-540 —
          behaviors verified). If the task runs as written, the spec ends up internally
          inconsistent: ac-4/ac-5 corrected to POST while ac-8/ac-9 still describe PUT, and the new
          tests would be annotated against ACs whose text describes a different method. Fix: extend
          the task's drift-correction instruction to cover ac-8 and ac-9 as well. Optional related
          cleanup for the same task: the triage.ts file-header AC comment block (lines 1-22) also
          says 'PUT override' / 'PUT act' and could be corrected in passing."
        created_at: 2026-06-10T15:03:16.630Z
