        author: "@claude"
        body: "Fixed: initContext() was passing projectRoots.mainRoot to loadProjectConfig(), causing config
          to load from the parent repo root instead of the worktree's checkout. Changed to pass
          projectRoots.worktreeRoot (falling back to mainRoot when not in a worktree). This matches
          the pattern used by every other loadProjectConfig() caller in the codebase (all pass
          projectDir, projectDir). Added 2 regression tests in worktree-context.test.ts proving: (1)
          worktree-only config is loaded when main has no config, (2) worktree config takes
          precedence when both exist. Full suite: 7602 passed."
