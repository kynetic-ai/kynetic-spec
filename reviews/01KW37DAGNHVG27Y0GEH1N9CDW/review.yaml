    entries:
      - _ulid: 01KW38CJJHKM2EV3HG28FHJZYK
        author: codex-pr-reviewer
        body: >-
          MUST-FIX: `applySpecTextRevert` ignores dry-run/read-only semantics. The shared
          `@coverage-resolution-mutation-interface` contract says dry-run coverage resolution
          requests must not produce a spec source edit, shadow commit, cache update, or other stored
          side effect, and non-dry-run mutations must refuse read-only/static contexts. This apply
          path never calls `assertCoverageResolutionWritable`, has no `readOnly` option, and does
          not branch on `options.request.dry_run` before `updateSpecItemFromCurrent` and
          `commitIfShadow`.


          I verified the behavior with a throwaway temp-project script: calling
          `applySpecTextRevert` with `dry_run: true` and a valid expected fingerprint returned `{
          responseDryRun: false, responseStored: true, fileChanged: true }` and created commit
          `Update Item AC: @neutral-resolution-target - ac-stale-text spec-text-revert`. That
          violates `@coverage-resolution-mutation-interface ac-dry-run-preview` and
          `ac-static-readonly-refusal`, and it lets a caller that intended a preview mutate project
          metadata.


          Please add the same writable/dry-run guard semantics as the other coverage resolution
          apply path, ensure `dry_run: true` routes to preview/no-write behavior or is refused
          before mutation, add behavioral coverage for this action, and expose any required
          read-only option at the service boundary.
        created_at: 2026-06-27T00:41:31.985Z
      - _ulid: 01KW39KVCKP6MA19SDG0YTR906
        author: Jacob Chapel
        body: "Fixed: applySpecTextRevert now uses assertCoverageResolutionWritable with a readOnly option,
          routes dry_run requests through previewSpecTextRevert before any item mutation or shadow
          commit, and has behavioral coverage proving dry-run/read-only semantics at the apply entry
          point. Re-verified focused coverage-resolution tests, full npm test, format, lint,
          typecheck, and kspec validations."
        created_at: 2026-06-27T01:02:58.962Z
    kind: blocker
