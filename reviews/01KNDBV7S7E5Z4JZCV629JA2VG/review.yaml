threads:
  - _ulid: 01KNDBWQ21K28NDDGBR10S048M
    anchor:
      type: structured
      field: ac-index-consistency
      ref: "@daemon-incremental-cache"
      section: acceptance_criteria
    entries:
      - _ulid: 01KNDBWQ21MQJ2FQ384WKRVN1V
        author: "@claude"
        body: ac-index-consistency uses atomicity language ('complete pre-update state or complete
          post-update state') but the implementation approach across all Phase 4 tasks is 'build
          locally and swap references' — which is the existing pattern for full reloads but has
          different semantics for incremental patches. When replacing a single entity in an array
          (index tier), the swap is not atomic unless the entire array reference is replaced. The AC
          is correct as a behavioral contract, but tasks should explicitly state they must clone the
          index array, patch the clone, and swap the entire reference — not mutate in place.
          Currently task-incremental-task-updates says 'build new index/detail references locally
          and swap atomically, same as the current full-reload pattern' but the current pattern
          replaces the entire array (this.tasks.index = summaries), which is different from patching
          one element. Clarify the mechanism in each Phase 4 task description.
        created_at: 2026-04-04T23:05:18.145Z
    kind: blocker
  - _ulid: 01KNDBWYGQ729BB11DYMCP26NZ
    anchor:
      type: structured
      field: ac-watcher-content-passthrough
      ref: "@daemon-incremental-cache"
      section: acceptance_criteria
    entries:
      - _ulid: 01KNDBWYGQV10CASDGGFYBFK1C
        author: "@claude"
        body: "ac-watcher-content-passthrough says 'the already-read content is available to the cache
          update logic so the file does not need to be read from disk a second time.' But the
          watcher's onFileChange callback signature is (file: string, content: string) — content is
          always a string. The AC and task-watcher-content-passthrough both say the content
          parameter should be 'optional' for removal events, but removal events use a completely
          separate callback (onFileRemoved) which does NOT receive content. The content parameter on
          handleFileChange does not need to be optional for the onFileChange path — it needs to be
          optional because handleFileChange is also called from the onFileRemoved path (or from
          other callers like write-through). The task description conflates two separate callbacks.
          Clarify that onFileChange always has content, and the optional parameter is for
          handleFileChange which has multiple callers with different signatures."
        created_at: 2026-04-04T23:05:25.783Z
    kind: blocker
  - _ulid: 01KNDBXD7VMVWGMQMVVXQM1M1X
    anchor:
      type: structured
      ref: "@task-update-ac-granular-reload"
      section: description
    entries:
      - _ulid: 01KNDBXD7VSCC0SV0TMYGCWR4A
        author: "@claude"
        body: "The updated ac-granular-reload wording ('Only the affected entity is reloaded, not the entire
          domain or unrelated domains') removes the existing guarantee that unrelated domains are
          not reloaded. The current AC covers two guarantees: (1) cross-domain isolation and (2)
          within-domain granularity. The new wording replaces both with entity-level language but
          makes cross-domain isolation implicit. Since the new daemon-incremental-cache spec has
          ac-fallback-full-reload which explicitly allows full domain reloads, the updated
          ac-granular-reload should preserve the cross-domain isolation guarantee separately.
          Suggested: keep ac-granular-reload for cross-domain isolation ('only the affected domain
          is reloaded, not unrelated domains') and let daemon-incremental-cache handle within-domain
          granularity. Otherwise the existing cross-domain contract regresses."
        created_at: 2026-04-04T23:05:40.859Z
    kind: blocker
  - _ulid: 01KNDBXVYBCTSCS8NVD3BAHBEB
    anchor:
      type: structured
      ref: "@task-meta-subdomain-decomposition"
      section: description
    entries:
      - _ulid: 01KNDBXVYB9XKVVA4BPZGEFBDH
        author: "@claude"
        body: The task says 'The meta domain state is ready when all three sub-domains have loaded at least
          once.' This introduces a new concept (sub-domain readiness) that interacts with the
          existing ac-progressive-loading and ac-warming-availability on daemon-entity-cache. Those
          ACs describe domain-level progressive loading. If meta has three sub-domains that can load
          independently, does partial meta readiness (e.g., manifest loaded but shadow not yet)
          count as 'meta domain ready'? The daemon-meta-subdomain spec should address this — either
          meta is not ready until all three sub-domains load (as the task states), or partial
          readiness is supported with a finer-grained state. The current ACs on daemon-entity-cache
          assume domain as the granularity unit for readiness.
        created_at: 2026-04-04T23:05:55.915Z
    kind: question
  - _ulid: 01KNDBY3FM4YGCFB2GBKXGC0NF
    anchor:
      type: structured
      ref: "@daemon-meta-subdomain"
      section: acceptance_criteria
    entries:
      - _ulid: 01KNDBY3FNVMY8T45CFB9BEKMC
        author: "@claude"
        body: "daemon-meta-subdomain has no AC for the initial load path. The three ACs cover
          re-invalidation scenarios (file change, schedule, session change), but not: 'Given the
          daemon starts and a project is registered, when meta is first loaded, then all three
          sub-domains are populated.' This is implicitly covered by the task description ('The
          initial loadAll still calls all three sequentially') but there is no spec-level contract.
          Consider adding an AC for first-load behavior."
        created_at: 2026-04-04T23:06:03.637Z
    kind: question
  - _ulid: 01KNDBYAQ3WSAR2ZATQCGTSG65
    anchor:
      type: structured
      section: dependencies
    entries:
      - _ulid: 01KNDBYAQ31KNJPBABQXDS2PZA
        author: "@claude"
        body: task-add-ac-context-reuse depends on task-update-ac-granular-reload, but these are both
          spec-update tasks modifying the same spec item (@daemon-entity-cache). Since they modify
          different ACs (one updates ac-granular-reload, the other adds ac-context-reuse), they
          could run in parallel. The dependency appears unnecessary — is there a reason for
          serialization? If both used kspec batch, they could be a single task.
        created_at: 2026-04-04T23:06:11.043Z
    kind: question
  - _ulid: 01KNDBYRRF1TTJSZTA65EP5PJH
    anchor:
      type: structured
      ref: "@task-incremental-item-updates"
      section: description
    entries:
      - _ulid: 01KNDBYRRGGTSZGNJ0KNBRKABR
        author: "@claude"
        body: "The task says 'Trait references (traits: [@trait-slug]) are not resolved during item loading
          — they are stored as strings.' This is true for the items domain, but loadAllItems() does
          resolve inheritance for display purposes in some paths. Verify that the incremental path
          does not need to handle trait resolution differently when a trait spec itself changes. If
          modules/traits.yaml is modified and contains trait definitions, items that reference those
          traits may need their inherited ACs refreshed in the detail tier. This may be a non-issue
          if detail tier is populated lazily, but worth confirming."
        created_at: 2026-04-04T23:06:25.424Z
    kind: question
  - _ulid: 01KNDBZ0CW9RJ5QNMB41RAA9HV
    anchor:
      type: structured
      ref: "@task-writethrough-incremental-alignment"
      section: description
    entries:
      - _ulid: 01KNDBZ0CWK5N6CQWR485WP61K
        author: "@claude"
        body: The task claims 'inbox, plans, triage, reviews — which are single-file domains where reload IS
          the minimal update.' This is true for inbox and triage (single files), but plans can be
          multi-file (each plan has its own file under plans/). The current plans domain does use
          loadPlans() which reads all plan files. If the plan count grows, this could become another
          candidate for incremental updates. Should plans be excluded from incremental or noted as a
          future candidate?
        created_at: 2026-04-04T23:06:33.245Z
    kind: question
  - _ulid: 01KNDBZCW9SYQ32373MNSY1VGA
    anchor:
      type: structured
      ref: "@daemon-incremental-cache"
      section: description
    entries:
      - _ulid: 01KNDBZCW9YHHVE99ZR5ZECQPZ
        author: "@claude"
        body: The spec description says 'Full domain reloads remain as a fallback when the changed file
          cannot be mapped to specific entities.' This is good but could also mention write-through
          as a caller that may or may not use incremental paths, since the plan includes a task
          specifically for write-through alignment. Not blocking — the ac-fallback-full-reload AC
          covers the contract.
        created_at: 2026-04-04T23:06:46.026Z
    kind: nit
  - _ulid: 01KNDBZM98PJ0Z5ACBBJQF672F
    anchor:
      type: structured
      ref: "@task-cache-kspec-context"
      section: description
    entries:
      - _ulid: 01KNDBZM98H32NE7B9GZEQC0E7
        author: "@claude"
        body: Task says 'e.g. 5 seconds' for the context cache validity window. This is implementation
          detail in a task description, which is fine, but consider whether the specific duration
          should be configurable or derived from the debounce window rather than hardcoded. A
          context that lives 5 seconds could serve stale data if the debounce window is 100ms and a
          second change arrives 3 seconds later. The task already says 'cache entry should be
          invalidated when the debounce cycle completes' which is the correct approach — the
          5-second TTL is a secondary safety net. Just noting the potential confusion between the
          two invalidation strategies described.
        created_at: 2026-04-04T23:06:53.608Z
    kind: nit
  - _ulid: 01KNDBZVWYQCDSBYGA1H6PX7RN
    anchor:
      type: structured
      ref: "@daemon-incremental-cache"
      section: specs
    entries:
      - _ulid: 01KNDBZVWYFFZ0XNH7JWJRSSNN
        author: "@claude"
        body: The spec is typed as 'feature' but daemon-meta-subdomain is typed as 'requirement'. Both are
          new behavioral contracts for the daemon cache system. The type distinction is fine
          (incremental cache is a new capability, meta sub-domains are a structural requirement),
          but worth confirming the intent is correct.
        created_at: 2026-04-04T23:07:01.406Z
    kind: nit
