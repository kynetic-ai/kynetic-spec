threads:
  - _ulid: 01KREVFB1DY33PQK357RJ60C24
    anchor:
      type: structured
      ref: "@plan-dispatch-workspace-provisioning-lease-protection"
      section: context
    entries:
      - _ulid: 01KREVFB1DZGWDGK36QPRMQQVW
        author: Jacob Chapel
        body: "MUST-FIX: The plan does not prove that a durable provisioning lease is necessary for the
          observed cleanup/bootstrap race. The direct evidence points to a narrower gap:
          _spawnInvocation adds an in-flight key before provisioning/bootstrap, reconciliation
          passes only _activeTaskRefs(), _activeTaskRefs() excludes inFlightTaskKeys, and
          reapDispatchWorkspace already blocks cleanup when activeTaskRefs contains the task. Before
          adding registry-backed leases, owner tuples, TTLs, and abandoned recovery, the plan needs
          to either narrow to the smaller fix or document concrete evidence that cleanup must
          protect bootstrap work across daemon restart or a separate process owner."
        created_at: 2026-05-12T19:43:56.973Z
    kind: blocker
  - _ulid: 01KREVFVFJCYJFQZ2HA55J025M
    anchor:
      type: structured
      ref: "@task-add-dispatch-workspace-provisioning-lease-schema"
      section: tasks
    entries:
      - _ulid: 01KREVFVFJT64WAWYG67V6M7FZ
        author: Jacob Chapel
        body: "MUST-FIX: The schema task commits the durable registry format to owner_daemon_id, owner_pid,
          process start time, owner_spawn_id, lease phases, expires_at, and bootstrap in_progress
          before the plan establishes that those durable fields are required. This is a migration
          and API commitment, and it can create a false safety signal if cleanup still has
          unprotected deletion paths or if restart ownership semantics are wrong. Defer this schema
          surface unless the plan rejects simpler options such as including in-flight refs in
          cleanup inputs, delaying cleanup until bootstrap completion, a scoped in-memory
          provisioning guard, or startup-only/manual artifact sweeps."
        created_at: 2026-05-12T19:44:13.810Z
    kind: blocker
  - _ulid: 01KREVGB2Q592C5MJA3WV05GSM
    anchor:
      type: structured
      field: ac-4
      ref: "@dispatch-workspace-cleanup-policy"
      section: acceptance_criteria
    entries:
      - _ulid: 01KREVGB2R1VX0N3AY5WR764JW
        author: Jacob Chapel
        body: "SHOULD-FIX: Existing specs already appear to require the core safety property.
          @dispatch-workspace-cleanup-policy ac-4 says active invocation ownership prevents branch
          deletion, @dispatch-workspace-registry ac-6 already has a provisioning lifecycle state,
          and @agent-dispatch-engine ac-26 treats in-flight work as active for scheduler ownership.
          That makes the reported race look like a direct implementation bug in cleanup inputs and
          destructive-path checks, not necessarily plan-level spec expansion. Reframe the plan
          around the existing contracts, or explain which specific behavior remains unspecified
          after those contracts are applied."
        created_at: 2026-05-12T19:44:29.784Z
    kind: question
  - _ulid: 01KREVGTMANPKED46K9QY1DXK5
    anchor:
      type: structured
      ref: "@task-make-artifact-reconciliation-lease-aware"
      section: tasks
    entries:
      - _ulid: 01KREVGTMB4A597D9WRMXD555Q
        author: Jacob Chapel
        body: "SHOULD-FIX: The plan lists many cleanup paths to make lease-aware, but it does not compare
          that to simpler cleanup policy changes: fail closed when registry state is unavailable,
          ignore recently-created directories under the dispatch root, skip periodic destructive
          cleanup while any spawn is in flight, or make periodic cleanup startup-only/manual until
          bootstrap has a terminal state. These alternatives may prevent the reported ENOENT failure
          with much less durable state and fewer lifecycle edge cases. Add an alternatives section
          with explicit rejection criteria, or reduce scope to the smallest cleanup interlock."
        created_at: 2026-05-12T19:44:45.707Z
    kind: question
  - _ulid: 01KREVHDBDSWRDNWASPEB4D3DF
    anchor:
      type: structured
      ref: "@plan-dispatch-workspace-provisioning-lease-protection"
      section: implementation_notes
    entries:
      - _ulid: 01KREVHDBDPVE7TQNE3271D4R5
        author: Jacob Chapel
        body: "WATCH: If a durable lease remains in scope, the plan should state the smallest viable
          retained version. A proportionate scope looks like one implementation task that includes
          in-flight task refs in cleanup protection, one cleanup task that skips every destructive
          path for in-flight/provisioning work and fails closed on unreadable registry state, and
          focused regression tests. Durable owner recovery, abandoned lease retention, operator
          lease diagnostics, and cross-daemon ownership can be deferred unless a reproduced
          restart/orphan-bootstrap case shows they are needed now."
        created_at: 2026-05-12T19:45:04.878Z
    kind: nit
