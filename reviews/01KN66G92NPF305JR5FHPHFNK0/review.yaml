    entries:
      - _ulid: 01KN66XKQ1VGF630W1CDHHDYNQ
        author: Jacob Chapel
        body: "When a workspace is retargeted from one integration branch to another, this helper still
          returns the old persisted base_branch_point unconditionally. In the current code path,
          provisioning can then persist resolved_base_branch=dev and integration.target_commit=<dev
          tip> while base_branch_point remains the old main commit. I reproduced that with a temp
          repo by provisioning once against main, updating the linked plan to branch=dev, and
          reprovisioning: target_branch/dev tip changed but base_branch_point stayed on the original
          main SHA. That leaves the registry internally inconsistent and later recovery code still
          trusts metadata.baseBranchPoint when reconstructing records."
        created_at: 2026-04-02T04:23:43.585Z
      - _ulid: 01KN681DF3B9H625F2XDJ6BX3R
        author: Jacob Chapel
        body: "Fixed: resolveBaseBranchPoint now reuses the persisted base_branch_point only when the
          workspace stays on the same resolved_base_branch. When reprovisioning retargets the
          workspace to a different plan/config branch, it recomputes the fork point from the new
          base so base_branch_point, resolved_base_branch, and integration.target_commit stay
          aligned. Added regression assertions in tests/dispatch-workspace-config.test.ts for the
          plan-retarget scenario."
        created_at: 2026-04-02T04:43:16.835Z
    kind: blocker
    resolved_at: 2026-04-02T04:43:18.937Z
    resolved_by: Jacob Chapel
