    entries:
      - _ulid: 01KR655ZTZSWT61SHH3J1BZM89
        author: Jacob Chapel
        body: "MUST-FIX: identifier-bound loopback daemon URLs are not treated as daemon observations. The
          new observation gate matches inline 127.0.0.1/[::1] literals through
          carriesDaemonHostPortUrl(), but firstArgIsDaemonObservation() falls back to
          isLocalhostUrlIdentifier(), whose binding map only records localhost: URLs. A test can
          therefore start a detached daemon, assign const url = 'http://127.0.0.1:3456/api/health'
          (or 'http://[::1]:3456/...'), call fetch(url) before cleanup registration, and receive no
          missingCleanup diagnostic. I verified this with oxlint probes: inline
          fetch('http://127.0.0.1:3456/...') flags, localhost identifier flags, but 127.0.0.1 and
          [::1] identifier bindings both exit 0 with no no-leaky-test-daemon diagnostic. That
          violates @daemon-test-guardrail-precision ac-detached-cleanup-before-observation because
          the daemon observation happens before cleanup is registered."
        created_at: 2026-05-09T10:40:26.463Z
      - _ulid: 01KR6791TFA899MAAKH9YV11RT
        author: "@claude"
        body: >-
          Fixed: identifier-bound 127.0.0.1/[::1] daemon URLs are now correctly recognised by the
          cleanup-timing observation gate. Two changes:


          1. Broadened the binding tracker. `localhostUrlBindings` entries now carry both
          `isLocalhost` (narrow `localhost:` pattern, drives `localhostDaemonUrl` reporting
          unchanged) AND `isDaemonHost` (broader `localhost:`/`127.0.0.1:`/`[::1]:` pattern, drives
          the cleanup-timing observation gate). `recordBinding` takes both flags;
          `firstArgIsDaemonObservation` now consults `isDaemonHostUrlIdentifier` so an identifier
          whose binding RHS matches the broader loopback pattern is treated as a daemon observation
          symmetric with the inline literal/template-literal path through
          `carriesDaemonHostPortUrl`.


          2. Deferred the detach `missingCleanup` check to `Program:exit`. The pre-existing
          visit-order bug meant the cleanup-timing analysis ran at the daemon-start `CallExpression`
          entry, BEFORE later `const url = '...'` `VariableDeclarator` visits, leaving
          identifier-bound URLs (even `localhost:` ones the existing tracker supported) invisible to
          the observation gate. The detach `CallExpression`s are now collected during traversal and
          processed at `Program:exit` when all bindings are recorded and parent pointers are set;
          the cleanup escape hatch (in-flow `onTestFinished`, `try { ... } finally { kill }`,
          ancestor `afterEach`, scoped disable comments) is preserved unchanged. Verified that the
          `Program:exit` listener fires after all `VariableDeclarator` visits in oxlint.


          Probes (npx oxlint):

          - `const url = 'http://127.0.0.1:3456/api/health'; fetch(url)` between detached start and
          cleanup → exits 1 with missingCleanup.

          - `const url = 'http://[::1]:3456/api/health'; fetch(url)` → exits 1.

          - `const url = 'http://localhost:3456/api/health'; fetch(url)` → exits 1 with BOTH
          missingCleanup AND localhostDaemonUrl (regression from the start; the cycle-7 deferral
          fixes it).

          - WebSocket variant `const url = 'ws://127.0.0.1:3456/api/ws'; new WebSocket(url)` → exits
          1.

          - Negative controls preserved: identifier-bound unrelated URL (`https://example.com/...`)
          → exits 0; identifier-bound 127.0.0.1 with cleanup BEFORE observation → exits 0;
          identifier-bound URL inside a stored arrow body invoked after cleanup → exits 0;
          outer-scope `const url = 'https://example.com'` shadowed by inner daemon URL → flag (inner
          shadow wins).

          - Prior-cycle regressions preserved: in-test beforeEach/afterEach/beforeAll/afterAll →
          flag; `process.on('exit', ...)` → exits 0; conditional onTestFinished → flag.


          Added 5 behavioral regressions in tests/lint-no-leaky-test-daemon.test.ts:

          - 4 positive: identifier-bound 127.0.0.1 fetch, identifier-bound [::1] fetch,
          identifier-bound localhost fetch (asserts on the missingCleanup message text
          specifically), identifier-bound 127.0.0.1 WebSocket.

          - 1 negative: identifier-bound unrelated URL.


          Targeted guardrail tests: 19/19 suites, 213/213 (was 208 — +5). Full suite: 2413/2413
          suites, 8966 pass / 5 skipped (was 8961, +5). cli-serve.test.ts and full tests/ tree
          audit: 0 no-leaky-test-daemon violations.
        created_at: 2026-05-09T11:17:03.945Z
