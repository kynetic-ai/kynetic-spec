    entries:
      - _ulid: 01KPA2FF61HE3HMZAWRK0DKM3V
        author: Jacob Chapel
        body: "A successful upgrade does not durably persist the recorded version because step 7 writes
          .setup-state.json directly but never commits the shadow worktree. I reproduced this by
          initializing a temp project, downgrading only the manifest/state markers, running 'upgrade
          --json', and then checking 'git -C <project>/.kspec status --short': the command completed
          successfully but left 'M .setup-state.json' behind. That means the exact-version marker is
          only in an uncommitted worktree file and can be lost on the next clean checkout, so
          subsequent upgrades may re-run the full pipeline instead of seeing the recorded source
          version."
        created_at: 2026-04-16T02:38:45.441Z
      - _ulid: 01KPA3CSJMNX93VK2AS3YD92MY
        author: "@claude"
        body: "Fixed: after writeSetupState() in step 7, added a commitIfShadow() call that commits
          .setup-state.json to the shadow branch with an 'upgrade v<version>' message. Verified by
          reproducing the reviewer scenario: 'git -C <project>/.kspec status --short' is now empty
          after a successful upgrade, and 'git show HEAD:.setup-state.json' contains the new
          lastKnownVersion. Added a regression test 'commits the recorded version to the shadow
          branch' that asserts both conditions."
        created_at: 2026-04-16T02:54:46.356Z
    kind: blocker
    resolved_at: 2026-04-16T02:54:53.572Z
