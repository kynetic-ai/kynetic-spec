threads:
  - _ulid: 01KTRZ4HJAK0TEZ82MRDC1VG72
    anchor:
      type: structured
      ref: "@task-command-dispatch-timeout"
      section: description
    entries:
      - _ulid: 01KTRZ4HJA0S4XDMGWM877E07N
        author: "@claude"
        body: "The task's proposed timeout design releases DispatchMutex while the timed-out in-process
          command may continue running. Current command.ts serializes all command dispatches through
          DispatchMutex because command execution still shares process-level hooks and mutation side
          effects. The plan says to Promise.race the dispatch and not kill the abandoned execution,
          which lets later commands run concurrently with work that may still hold the file lock,
          mutate shadow state, or write process output. That does not reliably satisfy the new
          timeout-isolation AC or the existing command serialization guarantees. Please revise the
          plan to define a safe cancellation/isolation design, or narrow the AC/task semantics to
          behavior the current in-process architecture can actually guarantee. Evidence read:
          packages/daemon/src/routes/command.ts DispatchMutex and the single/batch call sites around
          dispatchMutex.run."
        created_at: 2026-06-10T14:31:45.482Z
    kind: blocker
  - _ulid: 01KTRZ4M9JHJPQ9YHK5CJV0AK4
    anchor:
      type: structured
      ref: "@task-command-dispatch-timeout"
      section: description
    entries:
      - _ulid: 01KTRZ4M9JYGKPNWR83T9EC3QY
        author: "@claude"
        body: "The task points workers to packages/daemon/src/routes/response-envelope.ts for the existing
          structured error shape, but that file only defines wrapResponse for successful envelopes.
          Existing route errors are built with Elysia errorResponse bodies such as { error, message,
          suggestion } or { error, details }. Please update the task to name the actual pattern and
          desired timeout error body so a worker is not sent to the wrong helper. Evidence read:
          response-envelope.ts and existing route errorResponse call sites."
        created_at: 2026-06-10T14:31:48.274Z
    kind: question
  - _ulid: 01KTRZ4Q04S6FD7ZYWNPNSR3MV
    anchor:
      type: structured
      ref: "@task-daemon-log-capture"
      section: description
    entries:
      - _ulid: 01KTRZ4Q044GQB39ZYA2N0N50N
        author: "@claude"
        body: "The task says to reuse getGlobalKspecConfigDir() from src/daemon-shared/endpoint.ts, but the
          current shared helper is named getDefaultDaemonConfigDir(); getGlobalKspecConfigDir does
          not exist. Please correct the task guidance before derivation so the implementation task
          is executable from a fresh session. Evidence read: src/daemon-shared/endpoint.ts exports."
        created_at: 2026-06-10T14:31:51.044Z
    kind: question
