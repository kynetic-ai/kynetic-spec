    entries:
      - _ulid: 01KQB7VZ1VCTR6FVANS9F3W491
        author: Jacob Chapel
        body: This AC still has a compound Then clause and implementation-facing wording. The outcome says
          the unknown field is allowed but the invalid known schema field is rejected, which
          combines two independently verifiable assertions and exposes schema terminology. Rewrite
          it as one observable result, for example that a patch using --allow-unknown is rejected
          because a recognized item field has an invalid value, while the unknown field is not the
          rejection reason.
        created_at: 2026-04-28T23:47:54.043Z
    kind: blocker
  - _ulid: 01KQB7W1Z1G27J2KH34BKKESZV
    anchor:
      type: structured
      field: ac-bulk-dry-run-validates-data
      ref: "@item-patch"
      section: acceptance_criteria
    entries:
      - _ulid: 01KQB7W1Z2P4DMY5CFJ9HW2F7N
        author: Jacob Chapel
        body: "This AC describes the trigger as data that would fail schema validation in a real write and
          the When as kspec validating the operation. That is mechanism-level wording for an
          acceptance criterion. Keep the schema/helper details in the implementation task, and state
          the observable command behavior instead: a bulk dry-run operation with patch data that a
          normal write would reject is reported as an error rather than a successful preview."
        created_at: 2026-04-28T23:47:57.026Z
    kind: blocker
