    entries:
      - _ulid: 01KR70RBZS8M3PH41R9WK61PAY
        author: Jacob Chapel
        body: "MUST-FIX: the cleanup ownership check only extracts  targets when the first argument is a
          bare Identifier. A cleanup registered as  is accepted as scoped cleanup even when  is
          assigned only after the intervening assertion. I verified with an oxlint probe in this
          review: the sample exited 0 with 'Found 0 warnings and 0 errors.' That violates  because
          the callback does not own a concrete pid for the just-started daemon at registration time;
          it only owns an object whose pid field is still unset. Extend capture/ownership analysis
          for non-Identifier pid expressions (or conservatively reject them) so cleanup-shaped calls
          cannot bypass the binding check."
        created_at: 2026-05-09T18:42:20.281Z
      - _ulid: 01KR70SF2YCD7D9HYEYE0NKXY2
        author: Jacob Chapel
        body: 'Clarification for the blocker body above: the skipped target is `process.kill(...)`, and the
          accepted unsafe sample is `onTestFinished(() => { if (holder.pid !== undefined)
          process.kill(holder.pid, "SIGTERM"); })` with `holder.pid` assigned only after
          `expect(true).toBe(true)`. The independent oxlint probe exited 0 with "Found 0 warnings
          and 0 errors." This is the same ownership contract as
          `ac-detached-cleanup-bound-before-observation`: the callback has an object at registration
          time, but it does not own the concrete pid for the just-started daemon.'
        created_at: 2026-05-09T18:42:56.222Z
      - _ulid: 01KR72R0GF8VKX73DVHNZCM5SH
        author: "@claude"
        body: "Fixed. Walk MemberExpression / ChainExpression kill-target chains down to their root
          Identifier and feed the root through the same concrete-binding and ownership predicates as
          the bare-Identifier case. The reviewer's probe shape (`const holder = {}; runKspec('serve
          start --detach'); onTestFinished(() => { if (holder.pid !== undefined)
          process.kill(holder.pid, 'SIGTERM'); }); expect(true).toBe(true); holder.pid = 12345;`)
          now flags: the walk extracts root `holder`, the ownership predicate sees that `const
          holder = {}` ends BEFORE the runKspec start, and cleanupClosureUnbound is reported. The
          same walk applies to `<expr>.kill(...)` member receivers and to
          `killPid/stopDaemon/stopMockDaemon` first arguments. Non-Identifier-rooted targets
          (literal pids, CallExpressions, etc.) collapse to UNVERIFIABLE_KILL_TARGET and are
          rejected as unbound. Allowed-narrow case (`const child = spawn('kspec', ['serve', 'start',
          '--detach']); onTestFinished(() => process.kill(child.pid, 'SIGTERM'))`) still passes
          because the root `child`'s declarator range encompasses the spawn that IS the detached
          start. Five new regression tests cover member-expression target, deep member chain, member
          receiver, call-expression target, and the allowed-narrow control."
        created_at: 2026-05-09T19:17:05.679Z
    kind: blocker
