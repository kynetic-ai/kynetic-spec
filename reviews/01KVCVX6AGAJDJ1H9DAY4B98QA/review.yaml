    entries:
      - _ulid: 01KVCWXGB9G4JWTE1CC13KMBAF
        author: Jacob Chapel
        body: "MUST-FIX: The review_created payload does not identify non-ref review subjects. Review
          subjects can be task/plan/spec refs, code comparisons, or external URLs, but the new
          payload only exposes subject_type plus subject_ref. The emitters in src/parser/reviews.ts
          and src/parser/review-storage-manager.ts set subject_ref from review.subject.ref, so code
          reviews and external reviews broadcast subject_ref: null with no base/head commits or URL.
          That fails @mutation-event-coverage ac-2's requirement that the review-creation event
          identify the new review and its subject; the new test only covers a task subject, so it
          misses this case. Include enough subject identity for every ReviewSubject variant, or
          carry the subject object in the event payload, and add coverage for at least a code or
          external subject."
        created_at: 2026-06-18T08:17:46.345Z
      - _ulid: 01KVCY9FJFHSE6DYH4D22GS6MR
        author: Jacob Chapel
        body: "Fixed in a19ac97e76: review_created now carries the full normalized review subject in
          addition to subject_type and subject_ref, so task/plan/spec refs, code comparisons, and
          external URL subjects all have enough identity in the event payload. Added daemon
          command-route coverage for a code review subject with base/head commits and branch names."
        created_at: 2026-06-18T08:41:47.343Z
    kind: blocker
