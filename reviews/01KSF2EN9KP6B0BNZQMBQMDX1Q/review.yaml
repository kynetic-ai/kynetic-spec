    entries:
      - _ulid: 01KSF2PW9S8RQZVK4CKARJCQ5W
        author: Jacob Chapel
        body: 'MUST-FIX: materialized task-owned resources are recorded with the task slug ref, but the
          task-owned resolver only accepts owner_ref equal to task._ulid. `plan derive
          --materialize-resources` calls `materializePlanResourcesForTask` with `taskCanonicalRef:
          canonicalRef(created)`, which is usually the derived task slug. The resolver then returns
          null at this line for that same task, so `task get --json` reports the copied task-owned
          resource as `unresolved` instead of `present`. I reproduced this via the CLI: derive a
          task with `--materialize-resources`, then `task get @implement-shot-view-mat --json`
          produced `resource_refs[0].owner_ref = "@implement-shot-view-mat"` and
          `resolved_resources[0].status = "unresolved"` with message `Owning task
          @implement-shot-view-mat could not be located`. This breaks the materialized-copy contract
          because the task reference points at a task-owned copy that consumers cannot resolve.'
        created_at: 2026-05-25T08:06:05.881Z
      - _ulid: 01KSF5B2C401GF9XQX7YQ99S5D
        author: "@claude"
        body: "Fixed in 9802d44502. Root cause: task-resource-resolver only accepted owner_ref equal to
          task._ulid, but materializePlanResourcesForTask records canonicalRef(created), which is
          slug-first. Updated loadOwnerManifest to accept any identifier that resolves to the
          current task (ULID OR any slug). Regression test mirrors the reviewer repro: derive
          --materialize-resources -> task get JSON shows resolved_resources[0].status='present' (not
          'unresolved'), text mode shows [OK] (not UNRESOLVED). Also extended the existing
          materialize test to assert resolved status, so the resolver gap can't regress silently."
        created_at: 2026-05-25T08:52:04.612Z
    kind: blocker
    resolved_at: 2026-05-25T08:52:18.047Z
    resolved_by: "@claude"
