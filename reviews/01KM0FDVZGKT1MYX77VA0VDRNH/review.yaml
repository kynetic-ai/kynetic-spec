threads:
  - _ulid: 01KM0FF89PRR375WX2265GDG6N
    entries:
      - _ulid: 01KM0FF89Q5V8EHAZAJN1XT67Y
        author: "@claude"
        body: >-
          AC-4 test (disabled schedules) doesn't exercise the evaluation loop. The test creates a
          disabled schedule with evaluationIntervalMs: 100_000 and backfill: false, then checks no
          events fired after start(). Since the evaluation loop never fires in this test (100s
          interval), it only proves start() doesn't backfill disabled schedules — not that
          _evaluate() skips them. The test would pass even if the 'if (!record.schedule.enabled)
          continue;' check in _evaluate() were removed.


          Fix: Use triggerSchedule() on the disabled schedule to verify it's rejected, or use a
          short evaluation interval and wait for one cycle. The implementation at line 294 is
          correct; the test just doesn't exercise that path.


          Path: tests/schedule-engine.test.ts, lines 340-357
        created_at: 2026-03-18T12:42:01.911Z
      - _ulid: 01KM0H3B7QK0T9JJ2C4ZPGM01S
        author: "@claude"
        body: "Fixed in 3f77adc28. AC-4 test now uses evaluationIntervalMs: 50 so the evaluation loop fires
          and exercises the enabled check in _evaluate(). Verified the test fails if the enabled
          check is removed."
        created_at: 2026-03-18T13:10:28.855Z
    kind: blocker
  - _ulid: 01KM0FFRAAT4KEG0NFFZJQE9YJ
    entries:
      - _ulid: 01KM0FFRAB783K6SNYRNFDXWFW
        author: "@claude"
        body: >-
          AC-6 tests (config reload) use stop/start cycles instead of exercising hot-reload during
          evaluation. The spec says "When: The next evaluation cycle runs" — meaning changes should
          be detected without restarting the engine. The implementation correctly calls
          _reloadConfig() inside _evaluate(), but neither test exercises this path.


          Both "should detect added schedules after config reload" and "should remove schedules that
          are no longer in config" call engine.stop() then engine.start() to pick up changes. These
          tests would pass even if _reloadConfig() were only called in start() and not in
          _evaluate().


          Fix: After changing currentSchedules, trigger an evaluation cycle (e.g., by calling
          triggerSchedule on the new schedule, or waiting for a short evaluation interval) without
          restarting the engine. Verify that getStatus() reflects the config change.


          Path: tests/schedule-engine.test.ts, lines 388-457
        created_at: 2026-03-18T12:42:18.315Z
      - _ulid: 01KM0H3DVJNQA6P11SGCAQAM75
        author: "@claude"
        body: "Fixed in 3f77adc28. Both AC-6 tests now use evaluationIntervalMs: 50 and wait for the
          evaluation loop to hot-reload config without stop/start. Added schedules are detected and
          removed schedules are cleaned up during _evaluate()'s _reloadConfig() call."
        created_at: 2026-03-18T13:10:31.538Z
    kind: blocker
