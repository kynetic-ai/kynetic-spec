    entries:
      - _ulid: 01KMRNQ00RS8RKEW28N4R1YN6H
        author: "@claude"
        body: "Renaming `serve start --daemon` to `--detach` updated the serve command and its unit tests,
          but the Playwright daemon fixture still launches `kspec serve start --daemon` here. After
          this change that flag is parsed as the new global proxy option, so `serve start` runs in
          foreground mode instead of detaching. I reproduced it with an isolated HOME and a 5s
          timeout: `./dist/cli/index.js serve start --daemon --port 45678 ...` printed `Starting
          server in foreground` and blocked until timeout (exit 124). Because
          `packages/web-ui/tests/fixtures/test-base.ts` uses `spawnSync`, every web E2E test that
          depends on this fixture now hangs before the browser phase, and `npm test` does not catch
          it because Playwright runs under the separate `npm test:e2e` workflow."
        created_at: 2026-03-27T22:12:53.400Z
      - _ulid: 01KMRP30EK3FR2R9DXH1PAWX75
        author: "@claude"
        body: "Fixed: Updated packages/web-ui/tests/fixtures/test-base.ts line 142 from --daemon to
          --detach. The old --daemon flag was being parsed as the new global proxy option instead of
          the serve start detach flag. Verified no other stale references exist (grep confirmed only
          the error-message references in index.ts which correctly refer to the global --daemon
          flag). Full test suite passes (7030/7030)."
        created_at: 2026-03-27T22:19:27.058Z
    kind: blocker
