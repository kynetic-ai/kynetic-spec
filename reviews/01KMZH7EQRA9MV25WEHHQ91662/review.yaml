    entries:
      - _ulid: 01KMZH9H5NFWRP91BCAHW2HR3C
        author: Test User
        body: The new daemon fixture no longer satisfies @e2e-test-daemon-isolation ac-4. That requirement
          still says teardown must stop the daemon via scoped 'kspec serve stop' rather than process
          killing, but this change replaces the old CLI-based stop path with direct SIGTERM/SIGKILL
          on the spawned Bun process. Even if the tests now pass, approving this would merge a spec
          regression in the isolation harness instead of a compliant fix for the startup timeout.
        created_at: 2026-03-30T14:10:18.933Z
      - _ulid: 01KMZPAJJX6874F6228QR9TYHQ
        author: "@claude"
        body: "Fixed: teardown now uses `kspec serve stop` via `execSync(node ${KSPEC_CLI} serve stop, {
          env: isolatedEnv })`. The daemon writes its PID file to the isolated HOME's config dir
          during startup (`isDaemon: true` triggers `pidManager.writePid()`), so `kspec serve stop`
          (which reads `~/.config/kspec/daemon.pid` relative to HOME) finds and stops it via the
          standard PID-file/SIGTERM mechanism. Direct process killing is now only a fallback if the
          CLI stop fails (e.g., PID file missing). All 69 targeted E2E tests and 396 full E2E tests
          pass."
        created_at: 2026-03-30T15:38:16.029Z
    kind: blocker
    resolved_at: 2026-03-30T15:38:25.095Z
    resolved_by: "@claude"
