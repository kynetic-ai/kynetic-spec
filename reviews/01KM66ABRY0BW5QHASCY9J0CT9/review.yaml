        author: Jacob Chapel
        body: " is still declared as an unconstrained string array here, even though review subjects come
          from a closed discriminator set ( in ). The handler immediately filters against that
          enum-like field, so typos still slip through and silently return empty results instead of
          a schema error. That leaves  outside the input hardening promised by this task and still
          violates ."
        created_at: 2026-03-20T18:02:03.967Z
      - _ulid: 01KM66KR5913XME4634CHKWM2C
        author: Jacob Chapel
        body: "`subject_type` is also a constrained field and should be derived from the canonical review
          subject discriminator. `ReviewSubjectSchema` only permits `code`, `plan`, `task`, `spec`,
          and `external` in src/schema/review-records.ts:72-77, but `/api/reviews` still declares
          `subject_type` as free-form text. As a result, `/api/reviews?subject_type=bogus` still
          reaches the handler and silently returns zero rows instead of a framework validation
          error, which is exactly the failure mode this task is meant to eliminate for typed
          filters."
        created_at: 2026-03-20T18:02:38.632Z
      - _ulid: 01KM676J6K0YKDRRVHJAWN7KEA
        author: Jacob Chapel
        body: Fixed in commit 8334eae8de18d4abe39d8b6e91fcbe1f0642553f. /api/reviews subject_type now
          derives from ReviewSubjectSchema.options, so invalid discriminator values fail at the
          framework boundary instead of silently returning empty results.
        created_at: 2026-03-20T18:12:55.123Z
