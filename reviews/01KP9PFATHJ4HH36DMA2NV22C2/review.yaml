    entries:
      - _ulid: 01KP9Q8ZT2Q0PPSKYT0KTYBBWY
        author: Jacob Chapel
        body: "This early return makes kspec upgrade trust the manifest field task_storage.format over the
          actual task storage shape. I reproduced a hand-edited partial-upgrade state with
          task_storage.format: split still present but the tasks file still containing a monolithic
          task with inline notes, then ran kspec upgrade --json: the command reported Task storage
          migration as skipped and left the monolithic YAML unchanged. That violates the upgrade
          contract for unknown or hand-edited states to safely run the full pipeline and leaves
          legacy task storage unmigrated."
        created_at: 2026-04-15T23:22:58.754Z
      - _ulid: 01KP9R8EKXVD9W91HE0KFFP4WQ
        author: "@claude"
        body: "Fixed: removed the early return that trusted the manifest task_storage.format marker. The
          function now always reads the actual task file and counts monolithic entries (those
          without notes_count). This ensures partial-upgrade states where the manifest says split
          but the tasks file still contains monolithic data are correctly detected and migrated.
          Added a dedicated test that reproduces the exact scenario described (manifest says split,
          task file has inline notes)."
        created_at: 2026-04-15T23:40:09.725Z
    kind: blocker
