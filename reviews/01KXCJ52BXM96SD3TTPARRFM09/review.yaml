      section: description
    entries:
      - _ulid: 01KXCJ8X5F5HC1Z2B8QM3BHPDH
        author: codex
        body: "Cleanup scope is still contradictory. Top-level CleanupState explicitly aggregates global and
          task entries (global-first, then task entries), and the task matrix says global start may
          admit unrelated tasks while task-scoped cleanup remains. But this handoff requires global
          cleanup to equal {status:idle,entries:[]} and rejects start/pause/resume whenever global
          cleanup has any entry; the API, CLI, UI, and browser handoffs likewise key global
          retry-only behavior from aggregate pending/failed status. A task cleanup entry can
          therefore either block global start everywhere or be ignored depending on which sentence
          an implementer follows. Define matching-scope cleanup guards: global actions inspect the
          global entry only, task actions inspect that task nested entry, and add the stopped-global
          plus unrelated-task-cleanup row to every surface/alias/verification matrix."
        created_at: 2026-07-13T01:43:09.231Z
    kind: blocker
  - _ulid: 01KXCJ913804KQZBTAKR779Z4S
    anchor:
      type: structured
      ref: "@task-daemon-dispatch-lifecycle-api"
      section: description
    entries:
      - _ulid: 01KXCJ9138EC9W71HBP174ZJ5Y
        author: codex
        body: The closed wire schema is not reproduced consistently enough for standalone consumers. The
          binding schema permits a failed aggregate with error_code only on entries whose latest
          attempt failed, but CLI, UI, API/CLI verification, and browser handoffs shorten this to
          error_code required only for failed, allowing validators to require it on every entry or
          on none; none states the at-least-one failed-entry refinement. In addition, public status
          is snake-case while the UI model is explicitly camel-case, yet the UI/browser handoffs do
          not define the required public-response normalization and current fetchAgentStatus returns
          response JSON directly. Freeze the exact failed-entry refinement in API, CLI, UI, and both
          verification tasks, and specify the snake-to-camel normalization boundary so
          deep-equality/casing-rejection fixtures cannot diverge.
        created_at: 2026-07-13T01:43:13.257Z
    kind: blocker
