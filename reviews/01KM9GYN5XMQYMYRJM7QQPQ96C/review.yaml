      - _ulid: 01KM9GZMC1VFCB5Q2RCDSH5J00
        author: Test User
        body: The fix still matches any path segment named after shadow.directory instead of the actual
          shadow worktree rooted at the project. With shadow.directory=.specs, a cwd like
          /repo/packages/demo/.specs will still be treated as protected because
          isShadowWorktreePath() only does indexOf('/.specs'), so dangerous git commands in an
          unrelated nested directory get blocked. That means we still are not detecting the real
          shadow worktree, only a name match, which leaves the task’s core requirement unmet.
        created_at: 2026-03-22T01:01:37.025Z
