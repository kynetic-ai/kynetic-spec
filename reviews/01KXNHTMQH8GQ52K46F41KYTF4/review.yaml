      side: head
    entries:
      - _ulid: 01KXNJZXY9WTC4JQDBMBCPE0TB
        author: Jacob Chapel
        body: MUST-FIX — ac-control-separated-from-degraded and ac-control-separated-from-blocked are not
          behaviorally covered. This test only proves the API parser retains separate properties; it
          never renders the authority, projection, degraded-state label, and held/blocked evidence
          that the ACs require the agents view to label separately. A UI regression that merges or
          omits those labels would leave this test green. Replace or supplement it with rendered
          behavioral assertions.
