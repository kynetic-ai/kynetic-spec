      side: head
    entries:
      - _ulid: 01KXNJZTP7N1T0H8H0HFTHBBYP
        author: Jacob Chapel
        body: MUST-FIX — The annotations for ac-status-active-work-visible, ac-status-queued-work-visible,
          and ac-status-held-work-visible are attached to a wire-conversion test. Deep-equaling
          parsed arrays and calling renderLifecycleConsumer, a local object-projection helper, does
          not render the agents view and would still pass if the view hid draining active work,
          queued rows, or HeldTaskRow entirely. The current agents browser additions only route
          empty lifecycle arrays. Add behavioral rendered-view coverage for active work during
          draining/cleanup plus queued and held rows.
        created_at: 2026-07-16T13:48:50.247Z
    kind: blocker
  - _ulid: 01KXNJZXY943DPPV9KFHRSFJ5G
