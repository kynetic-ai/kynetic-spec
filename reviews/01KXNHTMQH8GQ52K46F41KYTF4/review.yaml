    entries:
      - _ulid: 01KXNJZM8CBXDTJRXQ6XTE5D1P
        author: Jacob Chapel
        body: MUST-FIX — Failed global hard stops do not restore focus to the invoking Hard stop control.
          runAction always calls restoreLifecycleFocus with the default false, and that branch
          prefers the first enabled replacement before the still-connected invoking button. In
          running state actions are ordered Pause, Hard stop; in paused state Resume, Hard stop.
          Therefore a rejected hard stop focuses Pause/Resume, violating ac-lifecycle-focus-retained
          and the task requirement for success/error refresh. The browser test covers Cancel and
          successful Pause only, so it does not catch this error path.
        created_at: 2026-07-16T13:48:43.660Z
    kind: blocker
  - _ulid: 01KXNJZQJJ61G1KRW7WV1PNB35
    anchor:
      type: code
      commit: da3bae8d95d5c41771751ce68f54e04cdd21a15b
      line_end: 74
      line_start: 41
      path: packages/web-ui/src/lib/components/agents/HeldTaskRow.svelte
      side: head
    entries:
      - _ulid: 01KXNJZQJJ6EVNYRZGE4C46V0X
        author: Jacob Chapel
        body: MUST-FIX — Held/task hard-stop failures have the same focus regression. The error path reaches
          finally and calls restoreLifecycleFocus with the default false, which prefers the row
          first enabled control over connectedInvoker. For absent or paused controls that moves
          focus from Hard-stop task to Pause task or Resume task after a rejected request. Preserve
          the invoking button on errors and add a behavioral task-row error-focus case.
        created_at: 2026-07-16T13:48:47.058Z
    kind: blocker
  - _ulid: 01KXNJZTP7K0ZGYPCYFB7YHPX9
    anchor:
