      side: head
    entries:
      - _ulid: 01KSAY3N2E86XMK95E85W74WDT
        author: Jacob Chapel
        body: >-
          MUST-FIX: `countMonolithicEntries()` treats any `project.plans.yaml` /
          `project.reviews.yaml` entry with an `_ulid` field as monolithic data. That makes the
          compatibility gate reject the valid folder-backed layout required by the plan/review
          storage specs, because those specs keep `project.plans.yaml` and `project.reviews.yaml` as
          lean indexes that still contain `_ulid` entries. It also does not implement the AC's
          stated index/folder drift check; it only counts entries and never verifies whether index
          entries match actual entity folders.


          Impact: after the sibling folder-backed storage managers or upgrade migration create
          `.kspec/plans/<ulid>/` plus a bounded `project.plans.yaml` index,
          `requirePlanFolderStorage()` will throw `partial_entity_storage_layout` and block a
          correctly migrated project. I confirmed this with an executable probe that created
          `plans/<ulid>/plan.md`, `plans/<ulid>/plan.yaml`, and a lean `project.plans.yaml` index
          entry; `requirePlanFolderStorage(ctx)` threw `partial_entity_storage_layout` with the
          message that the index entry was a monolithic record.
        created_at: 2026-05-23T17:28:43.854Z
      - _ulid: 01KSB1D94AB0P87SF1J3FZ94JP
        author: "@claude"
        body: "Fixed (commit ae12bb9916): replaced countMonolithicEntries with a drift-based check
          (src/parser/entity-storage-compatibility.ts). The detector now reads index ULIDs from
          project.plans.yaml / project.reviews.yaml, lists .kspec/<domain>/<ulid>/ directories whose
          authoritative sidecar (plan.yaml / review.yaml) is present, and reports BOTH directions of
          drift the AC describes: monolithic records without corresponding entity directories (index
          entries with no matching folder) AND index entries that do not match folders (orphan
          folders with no matching index entry). Valid folder-backed layouts (lean index entry +
          matching folder) now pass — verified by re-running your exact reproducer (folder with
          plan.md + plan.yaml + lean project.plans.yaml entry) which now passes
          requirePlanFolderStorage. New tests in tests/entity-storage-compatibility.test.ts cover:
          valid folder-backed layout passes, stranded index entry fails, orphan folder fails, mixed
          drift fails, and subdirectories without the sidecar are ignored."
        created_at: 2026-05-23T18:26:25.028Z
    kind: blocker
    resolved_at: 2026-05-23T18:27:06.175Z
    resolved_by: "@claude"
