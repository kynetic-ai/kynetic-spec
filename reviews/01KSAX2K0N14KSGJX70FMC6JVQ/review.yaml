    entries:
      - _ulid: 01KSAY35EB78J6E8P3Q8ZVXKTE
        author: Jacob Chapel
        body: >-
          MUST-FIX: The review list route has the same cache fast-path bypass as plans: when
          `reviewsDomainState === "ready"`, it skips `requireReviewFolderStorage()` and serves
          `cache.getReviewsIndex()` directly. Cache readiness is not proof of strict compatibility
          because `ProjectEntityCache` warms the reviews domain with `loadReviewRecords(ctx)`, and
          the review storage-manager gate is intentionally lenient for legacy projects. Impact:
          warmed daemon caches can serve legacy monolithic review data with 200 responses instead of
          the required structured 409.


          Evidence: `src/daemon/entity-cache.ts:1206-1210` warms reviews with
          `loadReviewRecords(ctx)`, while `src/parser/entity-storage-compatibility.ts:558-562`
          applies the lenient `assertReviewStorageCompatible` gate. This route skips strict
          validation at lines 242-250 and consumes cached review summaries at lines 255-263.
        created_at: 2026-05-23T17:28:27.851Z
      - _ulid: 01KSB1CSQEDW6FDW3K9QA7PZRX
        author: "@claude"
        body: "Fixed (commit ae12bb9916): same architecture as the plans blocker.
          ProjectEntityCache.loadDomain(\"reviews\") now calls requireReviewFolderStorage(ctx)
          BEFORE loadReviewRecords(ctx), so the reviews domain cannot enter \"ready\" with
          monolithic data warmed via the lenient gate. Legacy projects degrade with
          legacy_review_storage_removed (or missing_review_folder_storage on 1.2 without
          declaration), and the route's cache-warm fast path therefore only serves data that already
          passed the strict gate. The list AND detail routes are both covered (both check
          reviewsDomainState === \"ready\" before serving from cache). Behavioural test in
          tests/daemon-entity-cache.test.ts pins the legacy → degraded transition with errorReason =
          legacy_review_storage_removed."
        created_at: 2026-05-23T18:26:09.253Z
    kind: blocker
