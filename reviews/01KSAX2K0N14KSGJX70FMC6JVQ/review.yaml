    entries:
      - _ulid: 01KSAY2PTSK2X4MZ90Z0565YS5
        author: Jacob Chapel
        body: >-
          MUST-FIX: The plans route skips `requirePlanFolderStorage()` whenever the plans cache
          reports `ready`, then serves `cache.getPlansIndex()` directly. Cache warm-up does not
          prove strict folder compatibility: `ProjectEntityCache` populates the plans domain via
          `loadPlans(ctx)`, and `loadPlans` intentionally uses the lenient storage-manager gate that
          passes legacy `kynetic < 1.2` projects with no `plan_storage` declaration. Impact: a
          production daemon with a warmed plans cache can return 200 and serve monolithic legacy
          plan data instead of the required HTTP 409 `entity_storage_incompatible` response. The
          strict route-entry gate needs to run even on the ready-cache path, or cache warm-up must
          itself use the strict folder gate and degrade instead of caching legacy data.


          Evidence: `src/daemon/entity-cache.ts:1186-1190` warms plans with `loadPlans(ctx)`, while
          `src/parser/entity-storage-compatibility.ts:501-506` documents that `loadPlans` is lenient
          for legacy projects and relies on daemon routes to run `requirePlanFolderStorage`. This
          route bypasses that strict gate at `plansDomainState === "ready"` and consumes cached
          plans at lines 131-133.
        created_at: 2026-05-23T17:28:12.889Z
      - _ulid: 01KSB1CBBJCPGESV5A671RYQZP
        author: "@claude"
        body: "Fixed (commit ae12bb9916): the cache-warm fast path is now safe because
          ProjectEntityCache.loadDomain(\"plans\") runs requirePlanFolderStorage(ctx) BEFORE
          loadPlans(ctx) at src/daemon/entity-cache.ts. Legacy projects (kynetic 1.1 without
          plan_storage) hit the strict gate during warm-up, throw legacy_plan_storage_removed, and
          the existing catch block transitions the plans domain to \"degraded\" — they never enter
          \"ready\" with monolithic data. The route's cache-ready short-circuit therefore preserves
          both @daemon-read-path ac-no-per-request-sync (no per-request initContext on the warm
          path) and @entity-folder-migration-and-compatibility-1
          ac-unmigrated-projects-are-blocked-with-guidance (incompatible projects route through the
          gate-at-route-entry fallback, where requirePlanFolderStorage throws and the 409 helper
          translates it). Behavioural test in tests/daemon-entity-cache.test.ts asserts the legacy →
          degraded transition with the right errorReason; cache diagnostics surface the
          EntityStorageCompatibilityError code via the existing degraded-reason channel."
        created_at: 2026-05-23T18:25:54.542Z
    kind: blocker
    resolved_at: 2026-05-23T18:26:52.507Z
    resolved_by: "@claude"
  - _ulid: 01KSAY35EBV5KTK1NPSSTCRBCM
