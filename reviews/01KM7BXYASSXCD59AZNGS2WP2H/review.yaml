      - _ulid: 01KM7C3SNRRSRWNYYMWPQK32M3
        author: Jacob Chapel
        body: "Scope miss: this command file still reads tasks directly via loadAllTasks(), so the CLI has
          not actually migrated all task I/O behind TaskDataManager. At line 794 it loads the full
          task set and resolves the ref itself, and the same direct read pattern still appears at
          1004, 1266, 1378, 1507, 1699, 1937, 2019, 2095, 2164, 2235, 2349, 2479, 2572, 2636, 2668,
          2847, 2880, 2925, 2994, and 3071. TaskDataManager already exposes getTask()/listTasks()
          for these paths, so leaving loadAllTasks() in place means src/cli/commands/task.ts still
          knows about the monolithic task storage shape, which is exactly what this task is supposed
          to remove before the storage split lands."
        created_at: 2026-03-21T04:58:01.784Z
