      - _ulid: 01KKXTXHM456ZB87VREF8NSBMV
        author: "@claude"
        body: Context lines between a map header and its children reset currentAddedMap/currentRemovedMap,
          causing child fields to leak as top-level changes. In practice, kspec auto-commits produce
          contiguous diff blocks so this path is not exercised, but it is a latent fragility if
          diffs are ever produced by manual edits or rebases.
        created_at: 2026-03-17T12:04:21.252Z
    kind: nit
  - _ulid: 01KKXTXMQS2MZ09W9DD6WHTTX2
    anchor:
      type: code
      commit: c5efe894e423
      line_end: 329
      line_start: 329
      path: src/utils/activity.ts
      side: head
    entries:
      - _ulid: 01KKXTXMQS7QQG0685HZXD4PB7
        author: "@claude"
        body: addedMapChildFields and removedMapChildFields share a single mapChildFields set. A field name
          appearing as a child of a removed map will suppress a legitimately added top-level scalar
          field with the same name. review_url exists both in SubmissionLinkageSchema and as a
          top-level task field, making this collision possible in theory. Consider separating into
          addedMapChildFields and removedMapChildFields in a future hardening pass.
        created_at: 2026-03-17T12:04:24.441Z
    kind: nit
