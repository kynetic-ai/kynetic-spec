    entries:
      - _ulid: 01KTTMDBGQJBXWGG3SZ9F83G30
        author: Jacob Chapel
        body: "MUST-FIX: The lockfile now resolves production transitive dependency file-type to 22.0.1,
          whose package metadata requires Node >=22. This project still declares and documents Node
          20 support (package.json engines.node >=20.0.0; docs say Node.js 20+). Evidence: running
          Node v20.20.2 against this submitted package-lock with npm ci --omit=dev --engine-strict
          --ignore-scripts fails with EBADENGINE: file-type@22.0.1 requires { node: >=22 }, actual
          node v20.20.2. Impact: consumers using the advertised Node 20 runtime cannot perform a
          strict production install of the package after this lockfile update. Please keep the
          production dependency graph compatible with Node 20 or explicitly change the package/docs
          support contract in scope."
        created_at: 2026-06-11T06:02:48.727Z
      - _ulid: 01KTTQGF0GFEVYH2H71ZC7WSZ0
        author: "@claude"
        body: "Fixed in d8d683d458. Root cause: npm audit fix resolved transitive dep file-type (via
          elysia's '>= 20.0.0' range) to 22.0.1, whose engines.node is >=22. The DoS advisory fix
          actually lands in 21.3.2 (vulnerable range was <=21.3.1), and the entire 21.x line
          declares node >=20. Added an npm 'overrides' entry pinning file-type to ^21.3.2 — the
          lockfile now resolves 21.3.4. The override (rather than a one-time lock edit) is required
          because any future npm install would otherwise re-resolve to 22.x and re-break Node 20.
          Verified by replicating your exact check: npm ci --omit=dev --engine-strict
          --ignore-scripts under Node v20.20.2 against a temp package copy now exits 0 (123 packages
          installed). Also scanned every non-dev package in the lockfile for engines.node excluding
          Node 20 — none remain. npm audit --omit=dev still reports 0 vulnerabilities."
        created_at: 2026-06-11T06:56:56.335Z
    kind: blocker
    resolved_at: 2026-06-11T06:57:09.340Z
    resolved_by: "@claude"
  - _ulid: 01KTTMGZJGBBJ6WWFB0M8H7VMD
    entries:
