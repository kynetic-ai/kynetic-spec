      - _ulid: 01KM72YR46TZWE9Y9SXYQ3QAY4
        author: Jacob Chapel
        body: "`listTasks()` still reads full task records from storage instead of reading index-only data.
          In the monolithic backend this method delegates straight to `loadAllTasks()`, which parses
          every task file before the manager projects a `TaskSummary`. That means AC-2 is still
          unsatisfied: listing callers avoid detail fields in the return value, but they do not
          avoid detail-file I/O. The new tests only assert the returned shape, so this would still
          pass."
        created_at: 2026-03-21T02:17:59.174Z
    kind: blocker
  - _ulid: 01KM72Z14EBCRTYHRMN26CXW9S
    anchor:
      type: code
      commit: c3a88b1ac7c731546031baec42a2024062f4c88a
      line_end: 213
      line_start: 200
      path: src/parser/task-data-manager.ts
      side: head
    entries:
      - _ulid: 01KM72Z14F1TZ2FQK73ZC1JREQ
        author: Jacob Chapel
        body: AC-5 requires non-overlapping task mutations to proceed without contention, but the monolithic
          backend preserves the old file-scoped lock behavior. Both single-task and batch mutations
          delegate to the YAML helpers, and those helpers lock by `taskFilePath`; in the default
          monolithic layout unrelated tasks share `project.tasks.yaml`, so they still serialize
          behind the same lock. The new concurrency test only proves both writes eventually succeed,
          not that independent tasks can run without contending.
        created_at: 2026-03-21T02:18:08.399Z
    kind: blocker
  - _ulid: 01KM72Z7NHKRQC6WS7T1NACE4Z
