        author: Jacob Chapel
        body: The guardrail task permits source-level/static tests that enumerate destructive operations in
          src/agent-runtime/workspace.ts. Project review rules reject source-scanning tests as valid
          AC coverage, and the no-source-scanning lint rule is intended to enforce that. If
          implemented as written, this can produce non-behavioral coverage for
          ac-protection-applies-to-every-destructive-surface. Fix by removing the
          source-level/static-audit option and requiring behavioral/contract tests through the
          public reconciliation path or a focused helper API, with explicit protected and
          cleanup-eligible cases for each destructive surface.
        created_at: 2026-05-12T21:22:27.891Z
