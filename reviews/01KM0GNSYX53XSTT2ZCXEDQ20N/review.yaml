          handleActionEvent(). In-flight groups will see updated configs on their next event, not
          their original config. The docstring is misleading — consider updating it to reflect
          actual behavior, or storing a config snapshot per-group if the documented behavior is
          intended. Non-blocking: the spec doesn't mandate either behavior, and the test correctly
          validates practical behavior."
