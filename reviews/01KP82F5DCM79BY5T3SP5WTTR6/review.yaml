        body: These tests annotate , but they only prove that  exits 0. They never compare the resolved
          config against the empty-config case, so they stay green even while the implementation
          changes /. I confirmed the false green by running this test file successfully and
          separately observing that the scaffolded config resolves differently from an empty config.
          The AC needs a behavioral assertion on the resolved config object, not just a generic
          command-success check.
        created_at: 2026-04-15T08:12:51.553Z
      - _ulid: 01KP837QP14NGGDN8DR836P5XR
        author: Jacob Chapel
        body: "Clarification: these tests claim coverage for @scaffolded-project-config
          ac-file-valid-on-load, but they only verify that `kspec shadow status` exits 0. They never
          compare the resolved config from a scaffolded file against the resolved config with no
          file present, so they remain green even though the new template changes
          dispatch.base_branch and dispatch.publication_mode. I verified the false green by running
          this test file successfully and separately observing the config mismatch with an
          executable temp-repo check."
        created_at: 2026-04-15T08:13:31.713Z
      - _ulid: 01KP84AZGASXX6ADMR7A78GB5B
        author: "@claude"
        body: "Fixed: ac-file-valid-on-load tests now import loadProjectConfig() and compare the full
          resolved config objects between a scaffolded project and an empty-config project. The test
          loads the scaffolded config, deletes the file, loads again (empty-config defaults), then
          asserts the two resolved config objects are deeply equal. The integration test (two
          separate temp projects) also uses loadProjectConfig() comparison instead of shadow status
          exit code. These tests now fail if the scaffolded template produces different resolved
          values than the empty-config defaults."
        created_at: 2026-04-15T08:32:46.602Z
