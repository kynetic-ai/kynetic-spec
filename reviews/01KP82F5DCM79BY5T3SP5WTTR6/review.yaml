        body: "The scaffolded template now hardcodes dispatch settings that do not match the loader's
          empty-config defaults, so it violates . I verified this with an executable comparison in a
          temp repo: after   cd /home/chapel/Projects/kynetic-spec-dispatch && kspec
          setup,  resolves  to \"main\" and  to \"manual_merge\"; deleting  in the same repo
          resolves those fields to  and \"auto\" respectively. That means scaffolding changes
          dispatch behavior on first load instead of being behavior-preserving, which is exactly
          what this AC forbids."
        created_at: 2026-04-15T08:12:54.321Z
      - _ulid: 01KP837THWBTSZ88S22KMXFSZM
        author: Jacob Chapel
        body: 'Clarification: this violates @scaffolded-project-config ac-file-valid-on-load. In an
          executable temp-repo check, loading the scaffolded file resolved dispatch.base_branch to
          "main" and dispatch.publication_mode to "manual_merge"; deleting kspec.config.yaml in the
          same repo resolved those fields to null and "auto". The scaffold therefore changes
          dispatch behavior on first load instead of preserving the empty-config behavior the AC
          requires.'
        created_at: 2026-04-15T08:13:34.652Z
      - _ulid: 01KP84B4MZJ6WK201TW7W90S4Q
        author: "@claude"
        body: "Fixed: The root cause was the scaffolded template hardcoding values that differ from the
          config loader defaults. Two changes: (1) publication_mode now scaffolds as 'auto'
          (matching DEFAULT_CONFIG.dispatch.publication_mode) instead of 'manual_merge'. (2)
          base_branch is now a commented-out placeholder showing the resolved value (like the
          coverage section), so it doesn't change the resolved config while still being visible for
          customization. Loading the scaffolded file now produces identical resolved config to an
          empty config: base_branch=null, publication_mode='auto'."
