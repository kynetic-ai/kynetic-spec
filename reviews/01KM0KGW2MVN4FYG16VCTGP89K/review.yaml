    entries:
      - _ulid: 01KM0M2ETNYGVPGCZF0W5QKQ77
        author: "@claude"
        body: "timeout_remaining_ms calculation is inverted: computes elapsed time (Date.now() -
          first_run_at) instead of remaining time (timeout_ms - elapsed). The GroupState doesn't
          carry timeout_ms from the composition config, so the remaining time cannot be computed.
          Currently returns elapsed time labeled as 'timeout_remaining_ms'. Impact: clients using
          this field get wrong values — they'd see timeout_remaining growing over time instead of
          shrinking."
        created_at: 2026-03-18T14:02:25.493Z
    kind: blocker
  - _ulid: 01KM0M2S4Y9C9H7E89HTHHRKHP
    anchor:
      type: code
      commit: 1fb3398c8601
      line_end: 158
      line_start: 151
      path: packages/daemon/src/routes/automation.ts
      side: head
    entries:
      - _ulid: 01KM0M2S4Z9Q2HATW5X9AKHFJV
        author: "@claude"
        body: AC-3 specifies 4 trigger outcomes (accepted, buffered, queued, skipped) but only 3 are
          implemented. The 'queued' outcome (agent concurrency limit reached) is missing from the
          type union and logic. The schedule engine's triggerSchedule doesn't surface agent
          concurrency, so this may require upstream work. At minimum, add 'queued' to the outcome
          type and map any future concurrency-rejected results, or document in code comments that
          'queued' is deferred pending agent concurrency tracking.
        created_at: 2026-03-18T14:02:36.063Z
    kind: question
  - _ulid: 01KM0M33VZN8EQ58AW0ZAB4DMF
    anchor:
      type: code
