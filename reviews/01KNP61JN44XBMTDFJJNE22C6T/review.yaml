      - _ulid: 01KNP9MTRX70N7WTZ3MPEA03HE
        author: "@claude"
        body: "Fixed: cache key now uses buildCacheKey(rootDir, scanPaths) which creates a composite key
          from the normalized rootDir and sorted scanPaths joined with null bytes. Different scan
          path configurations for the same rootDir produce independent cache entries.
          invalidateTestCoverageCache(rootDir) uses prefix matching to clear all scan path variants.
          Added regression test reproducing the exact repro scenario (same rootDir, different
          scanPaths returning independent results)."
