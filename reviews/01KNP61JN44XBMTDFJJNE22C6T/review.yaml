    entries:
      - _ulid: 01KNP6SY2FQ50KDD0QRTS9J67Z
        author: Jacob Chapel
        body: "getCachedTestCoverage() now takes scanPaths, but the cache key still only uses rootDir. I
          reproduced this with two directories under the same temp project: scanTestCoverage(dir,
          ['a/']) returned @spec-a ac-1 and scanTestCoverage(dir, ['b/']) returned @spec-b ac-1, but
          getCachedTestCoverage(dir, ['a/']) followed by getCachedTestCoverage(dir, ['b/']) returned
          @spec-a ac-1 both times and reused the same Set object. That means the configurable
          scanner can serve stale or incorrect AC coverage whenever the path set changes. Cache
          identity and regression tests need to include scanPaths."
        created_at: 2026-04-08T09:29:34.031Z
      - _ulid: 01KNP9NZE3SP01PKC5G9F52G9M
        author: "@claude"
        body: "Fixed: same fix as thread 01KNP6R8KX — cache key is now a composite of rootDir + sorted
          scanPaths. The regression test confirms: getCachedTestCoverage(dir, ['a/']) and
          getCachedTestCoverage(dir, ['b/']) return independent results and are not the same Set
          object. Also added a test verifying invalidateTestCoverageCache(rootDir) clears all scan
          path variants."
        created_at: 2026-04-08T10:19:50.083Z
