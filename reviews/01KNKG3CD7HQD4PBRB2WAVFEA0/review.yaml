    entries:
      - _ulid: 01KNKG46748SY2W0REGEFEGW8M
        author: "@claude"
        body: "The new COMMAND_CACHE_DOMAINS direction fixes the all-domains mismatch, but the task still
          does not specify a cache-readiness rule that matches the current command handlers. Several
          allowlisted commands have non-obvious or option-dependent loader dependencies: task/tasks
          list always loads meta context before filtering (src/cli/commands/tasks.ts:90-104), item
          get calls buildIndexes(), which always loads reviews as well as tasks/items
          (src/cli/commands/item.ts:470-471; src/parser/yaml.ts:1575-1580), and review list loads
          tasks when --task is passed (src/cli/commands/review.ts:624-636). A per-command map keyed
          only by base command name is therefore still underspecified and can let an allowlisted
          read command skip the mutex while some invoked loader falls back to disk. Tighten this
          task by enumerating the exact required domains for each allowlisted command signature, or
          narrow the initial allowlist to commands whose loader set is unconditional and fully
          covered by earlier phases."
        created_at: 2026-04-07T08:14:43.940Z
    kind: blocker
