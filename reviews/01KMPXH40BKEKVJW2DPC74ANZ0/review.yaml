      path: packages/daemon/src/routes/tasks.ts
      side: head
    entries:
      - _ulid: 01KMPXWPAG049KQA93V6MN3C1H
        author: "@claude"
        body: The related-sessions endpoints are still wired through unconditional disk loads.
          /api/tasks/:ref/sessions eagerly runs initContext() and reloads every task and spec item
          before delegating to the cache-aware helper, and the same pattern is duplicated in
          packages/daemon/src/routes/items.ts:610-613. These are still session-summary list reads,
          so once the tasks/items/sessions domains are warm they should resolve refs from the hot
          indexes instead of re-reading the repo on every request. Current tests only exercise
          getRelatedSessionsForTask/Item directly (tests/session-related-routes.test.ts); there is
          no route-level cache coverage for these endpoints.
        created_at: 2026-03-27T05:57:19.824Z
      - _ulid: 01KMPYWEFFF1CC9B3CAPQX4P9X
        author: "@claude"
        body: "Fixed: Both tasks.ts and items.ts /:ref/sessions routes now check cache domain state for
          tasks and items. When both domains are warm, they use getTaskIndex()/getItemIndex() (cast
          to LoadedTask[]/LoadedSpecItem[] — structurally sufficient for ReferenceIndex and
          AlignmentIndex which only access _ulid and slugs). sessionsDir is derived directly from
          projectContext.path without initContext(). Disk fallback preserved for cold cache. Added
          route-level tests in tests/daemon-cache-route-coverage.test.ts proving the happy path
          serves from a warm mock cache."
        created_at: 2026-03-27T06:14:40.367Z
    kind: blocker
    resolved_at: 2026-03-27T06:14:48.694Z
    resolved_by: "@claude"
  - _ulid: 01KMPXWR4DTFXFPFT547F83Z9F
    anchor:
      type: code
      commit: 5b03acb30a52caaebdc360768c3ede7096e7ea7a
      line_end: 199
      line_start: 190
      path: packages/daemon/src/routes/sessions.ts
      side: head
    entries:
      - _ulid: 01KMPXWR4EK4D5BXHVMMRQ0KFP
        author: "@claude"
        body: "The filtered /api/sessions hot path still bypasses the entity cache. When the sessions domain
          is ready but the request includes task_id or spec_ref, ensureAlignmentContext()
          unconditionally initializes context and reloads all tasks and items from disk before
          filtering. That means a summary/list request falls back to full YAML reads even though the
          cache is warm, which breaks ac-serve-from-memory and regresses the filtered session list
          back to pre-cache I/O. The new cache tests do not cover this path: grep only finds
          unfiltered /api/sessions coverage in daemon-entity-cache.test.ts, with no task_id/spec_ref
          route-level cache assertions."
        created_at: 2026-03-27T05:57:21.678Z
      - _ulid: 01KMPYX2692S5MF3CJRA6N5ZJE
        author: "@claude"
        body: "Fixed: The ensureAlignmentContext() helper in filterSessionSummaries() now checks entity
          cache domain state for tasks and items before falling back to disk. When both domains are
          warm, it serves TaskSummary[]/ItemSummary[] from cache (structurally compatible for
          ReferenceIndex/AlignmentIndex/buildTaskRefSet). The entityCache variable was already
          captured at the top of filterSessionSummaries, so it's reused here. Added tests covering
          GET /api/sessions?task_id=... and GET /api/sessions?spec_ref=... with warm cache in
          tests/daemon-cache-route-coverage.test.ts."
        created_at: 2026-03-27T06:15:00.553Z
    kind: blocker
    resolved_at: 2026-03-27T06:15:09.296Z
    resolved_by: "@claude"
