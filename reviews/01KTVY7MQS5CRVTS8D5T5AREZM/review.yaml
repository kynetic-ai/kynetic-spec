    entries:
      - _ulid: 01KTVYF1CZ1ABC7BKDX1NQFY8H
        author: "@claude"
        body: This decision is the only planned spec without a parent. The stored plan has no module_ref,
          and derive requires a module when specs are present; parentless non-trait specs attach to
          the derive module. Is the intended parent @shared-mutation-pipeline or @api-contract? Make
          it explicit, or store the intended module, so derivation is deterministic.
        created_at: 2026-06-11T18:17:44.095Z
      - _ulid: 01KTW145K6HM5DADRFYWHY5AXW
        author: "@claude"
        body: "Addressed: @mutation-event-naming now declares parent: @api-contract explicitly in the plan
          content — the naming decision governs vocabulary inside the WS envelope that @api-contract
          owns (rationale added to the Existing spec relationships note). Placement is now
          deterministic regardless of the derive-time module. Note: plan import --into ignores
          --module, so module_ref stays null; the explicit parent is the deterministic mechanism."
        created_at: 2026-06-11T19:04:13.670Z
