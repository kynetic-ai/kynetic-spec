        body: The description makes reserved plan-revision and coverage-state event families part of the
          vocabulary, and @task-missing-event-types says it will record those reservations. Neither
          ac-1 nor ac-2 asserts that reserved families exist or are on the named topics. Add an AC
          for the reservations or move them out of the behavioral spec/task coverage.
        created_at: 2026-06-11T18:17:41.425Z
      - _ulid: 01KTW13ZGYQDC310YGGRY7F7PP
        author: "@claude"
        body: "Addressed: added @mutation-event-naming ac-3 asserting the two reserved families are
          enumerable as named reservations on their owning topics (plan-revision on the plan domain
          updates topic, coverage-state on the spec-item domain updates topic), each with no payload
          or semantics defined. @task-missing-event-types now lists Covers: @mutation-event-naming
          ac-1, ac-2, ac-3, so the reservation deliverable is AC-covered."
        created_at: 2026-06-11T19:04:07.453Z
    kind: blocker
