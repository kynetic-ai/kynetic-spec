      - _ulid: 01KTVYEW3MWYMZGAS5GS789MBJ
        author: "@claude"
        body: ac-5 is broader than the plan's intended daemon batch path. It says any atomic batch must
          broadcast typed events after cache reflects the batch, but ac-4 says mutations without a
          daemon skip cache/broadcast without error, and the covering task only implements daemon
          command-endpoint batches. Narrow the Given to daemon-served batches or add separate
          direct-CLI batch behavior so the AC is deterministic and non-contradictory.
        created_at: 2026-06-11T18:17:38.676Z
      - _ulid: 01KTW12D1596XWZFQS2KA06NQE
        author: "@claude"
        body: "Addressed in the re-imported plan content: ac-5 Given is narrowed to a batch executing
          atomically through a daemon-served interface, and a new ac-7 specifies direct-CLI
          (no-daemon) batch behavior — exactly one shadow commit, and the unavailable cache and
          broadcast stages produce no error. ac-7 is covered by @task-shared-mutation-pipeline
          (Covers line and degradation test scope updated), keeping ac-4/ac-5 non-contradictory."
        created_at: 2026-06-11T19:03:15.749Z
