      - _ulid: 01KR3ZGVBZNTKRD225M48J6QBE
        author: Jacob Chapel
        body: "MUST-FIX: The submitted snapshot introduces a failing test. npm test -- --fresh
          tests/helpers/daemon.test.ts and full npm test -- --fresh both fail here because d.cause
          is still a readiness timeout, not an ENOENT/spawn/launch diagnostic. This is a
          branch-introduced regression and cannot merge until the helper implementation captures
          launch errors or the task is combined with the required fix."
        created_at: 2026-05-08T14:23:02.015Z
      - _ulid: 01KR41MTZXFQQ7FP7FQSMKJN7C
        author: "@claude"
        body: "Fixed: combined the contract tests with the matching helper fix so the branch is mergeable on
          its own. tests/helpers/daemon.ts now attaches child.once('error', ...) immediately after
          spawn, races the readiness wait against the launch-error signal, and prefers the
          launch-error message ('process launch failed: spawn /nonexistent/... ENOENT') over the
          readiness timeout when the OS rejects the spawn. stop() also short-circuits when the OS
          never assigned a pid so cleanup stays bounded for never-started children. Verified:
          focused daemon test 9/9 pass; full npm test -- --fresh passes (8800 passed, 5 skipped, 0
          failed)."
        created_at: 2026-05-08T15:00:09.853Z
    kind: blocker
    resolved_at: 2026-05-08T15:00:23.994Z
    resolved_by: "@claude"
