          environment-dependent failure. Worker claim "resolved merge conflicts in
          tests/yaml-round-trip-stability.test.ts" — confirmed via git log showing merge commit
          872e1d0ec.


          Categories searched:

          - Correctness: Raw-data-preservation pattern correctly applied. writeRawMetaManifest
          preserves field order and only includes fields present in original or updates.
          mergeMetaItemPreservingRawShape filters Zod defaults (empty arrays, null, false) from new
          fields while preserving existing raw fields. No correctness issues.

          - Edge cases: Empty manifest (no wrapperObj) handled with kynetic_meta: "1.0" default.
          Missing array fields default to empty via getRawArray. Item not found returns -1
          correctly.

          - Error handling: All mutations wrapped in withFileLock for TOCTOU safety.
          deleteObservation/deleteMetaItem catch errors and return false. Consistent with existing
          patterns.

          - Test quality: Tests actually prove the ACs — they write minimal YAML, mutate, and verify
          absent sections don't appear AND data integrity is maintained. Round-trip test confirms
          byte-identical output.

          - Integration: Pattern matches existing raw-data-preservation in reviews.ts, yaml.ts
          (inbox), and workflow runs. No incompatibilities.

          - Security: No new input validation concerns — all paths use existing
          readYamlFile/writeYamlFilePreserveFormat.
