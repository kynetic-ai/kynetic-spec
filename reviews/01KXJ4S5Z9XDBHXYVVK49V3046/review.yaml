threads:
  - _ulid: 01KXJ5T7VZ8JJBYSTYT3YTPG57
    anchor:
      type: code
      commit: 083c00449470af0010a00d01db548583b51e03d9
      line_end: 159
      line_start: 144
      path: tests/dispatch-global-lifecycle.test.ts
      side: head
    entries:
      - _ulid: 01KXJ5T7VZHJF8QCFYE0HTHV0S
        author: Jacob Chapel
        body: "MUST-FIX — The lifecycle harness disables both reconciliation and coalescing and replaces
          `_spawnInvocation` with a recorder, while the suite exercises only bootstrap and one
          prune/dequeue barrier. The task explicitly requires the global transition matrix at the
          enqueue, coalesced-expiry, dequeue/retry, reconcile, post-invocation, and
          degraded-recovery barriers, including stopped/idle separately from stopped cleanup; there
          are also no behavioral cases for paused→start or stopped/idle→pause|resume invalid
          transitions. Impact: regressions in those task-owned ingress paths and matrix cells can
          pass this green suite. Evidence: `reconcileIntervalMs: 0` and `coalesceWindowMs: 0` here,
          plus a repository search found no other lifecycle-authority tests for those
          barriers/matrix cells. Add deterministic behavioral barrier/matrix coverage required by
          the task handoff."
        created_at: 2026-07-15T06:00:52.351Z
    kind: blocker
  - _ulid: 01KXJ5TC3X14VNXSEVPB62JBQZ
    anchor:
      type: code
      commit: 083c00449470af0010a00d01db548583b51e03d9
      line_end: 400
      line_start: 369
      path: tests/dispatch-global-lifecycle.test.ts
      side: head
    entries:
      - _ulid: 01KXJ5TC3XMXFM29FBNS84B39D
        author: Jacob Chapel
        body: "MUST-FIX — This is the only test annotated for
          `ac-stopped-reconstruction-uses-current-state`, but it never changes authoritative
          task/rule state or makes the stopped in-memory queue stale/lost. The same pending task
          exists before and after start, and its task cleanup keeps it held, so the assertions would
          still pass if start reused the stale bootstrap queue and never reconstructed current
          candidates. Impact: the stopped current-state reconstruction AC can regress undetected.
          Evidence: AC annotation search finds only this case, and lines 374–400 perform no
          task/rule mutation between stopped bootstrap and start. Add a behavioral stopped case that
          changes current authoritative eligibility/rules (or explicitly loses stale in-memory
          scheduling data) and proves only the current canonical candidate is started."
        created_at: 2026-07-15T06:00:56.701Z
    kind: blocker
  - _ulid: 01KXJ5TFPFA7SP7JHJMW60ESJ2
    anchor:
