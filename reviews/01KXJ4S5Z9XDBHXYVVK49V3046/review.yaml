        author: Jacob Chapel
        body: "Fixed in b0a8a2e844: the preservation test now seeds a non-empty degraded target with reason
          and timestamp before start, snapshots it, applies start twice, and deep-compares the full
          target afterward alongside task readiness."
        created_at: 2026-07-15T06:33:18.657Z
