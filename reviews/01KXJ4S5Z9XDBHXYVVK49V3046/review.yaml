        author: Jacob Chapel
        body: "MUST-FIX — The test annotated for `ac-controls-do-not-change-degraded-targets` snapshots an
          empty degraded-target collection; no degraded target is created before the lifecycle
          transition. Equality of empty-before and empty-after cannot detect code that clears or
          mutates existing degraded state, so the test does not satisfy the AC Given condition.
          Impact: lifecycle controls could erase real degraded-target evidence without a failing
          test. Evidence: `beforeDegraded` is read directly from a fresh harness and no
          `_enterDegradedState` or equivalent setup occurs anywhere in this suite. Seed a non-empty
          degraded target with stable reason/timestamp, apply the lifecycle action, and deep-compare
          it afterward."
        created_at: 2026-07-15T06:01:00.367Z
