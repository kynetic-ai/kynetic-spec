        body: Changing the comment route body schema to enum-backed Elysia unions makes invalid // values
          fail at framework validation time before the custom AC-10 error handling above can run.
          That regresses this endpoint from the documented  + actionable  contract to
          generic  responses, the same shift now asserted for verdict/check/lifecycle invalid enums.
          The task’s schema-derivation goal is fine, but this route still needs schema-derived
          validation without bypassing the review API’s invalid-input contract.
        created_at: 2026-03-20T16:25:35.264Z
      - _ulid: 01KM622JS21TRKQQGT2GJA13E9
        author: Jacob Chapel
        body: Fixed in cdb70fae4. The review routes still derive allowed values from the canonical schemas,
          but the transport schemas now accept raw strings and the handlers perform schema-derived
          validation so invalid verdict/check/lifecycle/comment enums return the documented 400
          actionable errors instead of framework 422s.
        created_at: 2026-03-20T16:43:21.762Z
