    entries:
      - _ulid: 01KM505VDAE4MJBCS8F4BJC29S
        author: Jacob Chapel
        body: This page now owns the transport-level subscription for 'agents' and 'sessions', but those
          topics are already subscribed globally in +layout via setupWsInvalidation().
          WebSocketManager.unsubscribe() is not reference-counted, so when /sessions unmounts it
          sends an unsubscribe for both topics and drops app-wide query invalidation for later views
          until the socket reconnects. Keep the page-level on/off handlers if needed, but do not
          call subscribe()/unsubscribe() here unless the manager learns shared subscription
          accounting.
        created_at: 2026-03-20T06:50:57.322Z
      - _ulid: 01KM50QNSJ23TJ20DK6B5EKAWV
        author: Jacob Chapel
        body: Fixed in commit 47d46a5f5. The /sessions page no longer calls subscribe()/unsubscribe() for
          globally owned agents/sessions topics; it only registers local on/off handlers so teardown
          cannot drop app-wide invalidation.
        created_at: 2026-03-20T07:00:41.394Z
