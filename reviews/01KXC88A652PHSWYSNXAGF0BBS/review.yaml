threads:
  - _ulid: 01KXC8AZGN1WNGA936PWE58FAF
    anchor:
      type: structured
      ref: "@dispatch-lifecycle-control-authority"
      section: acceptance_criteria
    entries:
      - _ulid: 01KXC8AZGNXCGAFKCHG6J8MDZ9
        author: Jacob Chapel
        body: Atomicity remains unresolved from every historical cycle. ac-paused-work-does-not-start
          combines global and task scopes; ac-task-interrupted-stop-recovers combines daemon-start
          and retry triggers plus scope reopening and unrelated-task isolation;
          ac-controls-do-not-change-readiness asserts five independently observable state classes;
          ac-actions-are-idempotent ranges across every action and scope;
          ac-control-outcomes-are-auditable combines applied, no-op, and failed outcomes;
          ac-evidence-survives-control asserts six evidence classes; and the proposed
          @per-task-dispatch-drain-coalescing ac-5 combines timer cancellation, pending-drain
          suppression, and active cancellation. These are independently testable behaviors, so the
          required atomic timeless AC gate still fails. Split them and move mechanism or
          non-promises to plan/task prose.
        created_at: 2026-07-12T22:49:31.413Z
    kind: blocker
  - _ulid: 01KXC8B2FD6HHJ1QJ6KBEYR5T6
    anchor:
      type: structured
      ref: "@task-dispatch-control-persistence"
      section: description
    entries:
      - _ulid: 01KXC8B2FDYH2D9VMRPD7MZ1DY
        author: Jacob Chapel
        body: The committed publication contract is still not executable. First, the frozen command git show
          <commit_oid>:.kspec/dispatch-control.yaml names a path that does not exist in the shadow
          commit tree; git -C .kspec ls-tree HEAD shows project files at the tree root, so the
          object path is dispatch-control.yaml. Second, existing rollbackDirtyShadowWorktree runs
          only after a force-reclaimed lock. A normal commitIfShadow or post-commit verification
          failure therefore releases the lock with dirty replacement bytes, and the next ordinary
          lock acquisition does not roll them back. Third, an external process can generate the
          watcher event before commit and then move HEAD without another filesystem event; a
          process-local post-commit store publication does not notify the daemon store. Freeze the
          correct Git tree path, rollback-before-unlock for every failed commit or verification, and
          a daemon-visible post-commit notification/retry mechanism for external writers.
        created_at: 2026-07-12T22:49:34.445Z
    kind: blocker
  - _ulid: 01KXC8B5D3QTTAKQXTNTQVEY7D
    anchor:
      type: structured
      ref: "@task-engine-global-hard-stop"
      section: description
    entries:
      - _ulid: 01KXC8B5D3Y6ERRB4HGWGQJX5B
        author: Jacob Chapel
        body: Pending cleanup can still clear dishonestly when a process leader is gone but its process
          group survives. The plan receipts an absent PID as not_found and advances to signals_sent
          after targets exit. Its surviving-group safeguard applies only after signalling, and the
          durable ownership tuple records only the leader birth token. On restart, a dead leader
          with live descendants can therefore be treated as settled even though unverified work
          remains. Require a safe group-survival check and keep cleanup pending as
          identity_unverifiable, or durably record enough member birth identities to verify the
          surviving group; never let not_found alone settle a target whose recorded PGID may still
          be live.
        created_at: 2026-07-12T22:49:37.443Z
    kind: blocker
  - _ulid: 01KXC8B8D2QJ5GNAF2XA5D85CF
    anchor:
      type: structured
      ref: "@task-dispatch-lifecycle-events"
      section: description
    entries:
      - _ulid: 01KXC8B8D2Z1ZZD1EF959EGD4M
        author: Jacob Chapel
        body: DispatchControlErrorCode is closed syntactically but its failure map is not exhaustive and
          single-valued. The map assigns ownership tuple disagreement to task_identity_mismatch,
          then assigns recovery ownership tuple mismatch to cleanup_identity_mismatch. Ownership
          tuples exist only in cleanup/recovery, so the same failure class has two codes. The legacy
          adapter sections also omit several mapped outcomes, including invalid_transition on start
          from paused and cleanup_identity_mismatch or cleanup_identity_unverifiable on stop
          recovery. Define disjoint failure predicates and one status/code projection for every
          canonical and compatibility surface so each failed attempt has exactly one code.
        created_at: 2026-07-12T22:49:40.514Z
    kind: blocker
  - _ulid: 01KXC8BCAR1PWPQ3291H2RMK6T
    anchor:
      type: structured
      ref: "@task-daemon-dispatch-lifecycle-api"
      section: description
    entries:
      - _ulid: 01KXC8BCAR1C9F35260VE0TY77
        author: Jacob Chapel
        body: The claimed exact legacy HTTP shapes still disagree with current source. Current GET
          /api/agent/status includes queued_invocations; resolved_adapter and optional runner on
          active and queued entries; and resolved_adapter, optional runner, and runner_validation on
          agent definitions. The frozen shape omits all of those fields. Current no-engine GET
          /api/agent/dispatch/status omits queued, while the proposed legacy fallback adds queued:[]
          in addition to the named lifecycle additions. Mutation aliases also lack explicit
          translations for invalid_transition and cleanup identity outcomes. Preserve every current
          field and presence/absence case from packages/daemon/src/routes/agent-dispatch.ts and its
          tests, then enumerate every new 409/500/503 translation per route.
        created_at: 2026-07-12T22:49:44.536Z
    kind: blocker
  - _ulid: 01KXC8BG9C2K3E5EAVQMVEAKYW
    anchor:
      type: structured
      ref: "@task-dispatch-control-persistence"
      section: tasks
    entries:
      - _ulid: 01KXC8BG9CVV61KY5J8KBC0W9V
        author: Jacob Chapel
        body: Primary ownership sequencing still requires future behavior. task-dispatch-control-persistence
          explicitly does not implement engine actions, yet it claims ac-actions-are-idempotent,
          whose outcome covers repeated valid lifecycle actions and their side effects across
          global/task start, pause, resume, and stop. Those actions and cleanup side effects land in
          later engine tasks, so this task cannot close or behaviorally test the AC at its
          dependency point. Split idempotency by owning action scope or move closure to a task after
          all relevant actions exist.
        created_at: 2026-07-12T22:49:48.588Z
    kind: blocker
