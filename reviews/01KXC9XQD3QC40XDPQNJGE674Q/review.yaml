        author: codex
        body: "Three of the 60 exact patches are not standalone after materialization:
          @daemon-agent-dispatch ac-5 requires the plan's public-status table,
          @dispatch-event-payload ac-dispatch-control-common-fields requires the common field set in
          the plan, and @dispatch-event-payload ac-dispatch-control-error-codes requires the exact
          closed enum in the plan. Inline the actual observable field/presence and enum contracts in
          their owning specs, or reference a durable owning spec relationship."
        created_at: 2026-07-12T23:19:43.294Z
    kind: blocker
  - _ulid: 01KXCA2C9WES34QVFYZEZ608JP
    anchor:
