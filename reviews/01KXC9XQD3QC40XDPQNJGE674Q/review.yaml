    entries:
      - _ulid: 01KXCA2G0QPSWJEHMHSJAPY4CW
        author: codex
        body: The legacy HTTP contract remains contradictory and incomplete. Current agent-dispatch routes
          return cwd-conflict errors containing projectDir and engine cwd, and /dispatch/start also
          includes complete status. The plan requires exact current error/cwd/project preservation
          while also forbidding paths and dynamic error strings on compatibility routes; both cannot
          hold. It also never freezes the body/presence rule for invalid_transition on
          start-from-paused, including whether /dispatch/start includes error and complete status.
          Choose an explicit compatibility exception or deliberate breaking sanitization and
          enumerate each alias's exact 409 body.
        created_at: 2026-07-12T23:19:50.551Z
