        author: codex
        body: The 77-AC expansion still fails atomic/timeless/materializable quality.
          ac-pause-allows-active-completion asserts both natural completion and no session
          cancellation across an unspecified global-or-task scope; ac-control-outcomes-are-auditable
          combines applied, no-op, and failed branches; ac-failures-do-not-expose-raw-errors ranges
          across every operator surface; and ac-reconstruction-does-not-promise-prior-fifo plus
          ac-reconstruction-does-not-promise-prior-retry-timing are non-promises that cannot be
          behaviorally proven. Split scopes/outcomes/surfaces and move non-promises to description
          or implementation notes.
        created_at: 2026-07-12T23:19:38.681Z
