threads:
  - _ulid: 01KTRYVGSQG550NNSJWZH8Y6SN
    anchor:
      type: structured
      ref: "@task-standardize-node-version-docs"
      section: tasks
    entries:
      - _ulid: 01KTRYVGSQS4J6TC8MNG5ASDHS
        author: "@claude"
        body: The task claims to cover @supported-runtime-range ac-2, but its required consistency test only
          names INSTALL.md, docs/getting-started/installation.md, and
          docs/getting-started/tutorial.md. The plan itself identifies
          docs/guides/starting-a-new-project.md and docs/guides/upgrading-kspec.md as user-facing
          docs that state Node requirements, and AC2 requires every user-facing
          installation/onboarding document that states a Node requirement to match engines.node. A
          worker could satisfy the listed test while leaving a stale minimum in another user-facing
          doc. Expand the scope/test to enumerate all user-facing docs with Node requirements, or
          explicitly include every known doc before claiming ac-2.
        created_at: 2026-06-10T14:26:49.783Z
    kind: blocker
  - _ulid: 01KTRYVKCQQ2MNB4TQPQCA07N3
    anchor:
      type: structured
      ref: "@task-prepack-full-build-and-verification"
      section: tasks
    entries:
      - _ulid: 01KTRYVKCQWV2RC0B5XMTNC650
        author: "@claude"
        body: The task claims @published-artifact-completeness ac-4, but its test plan only checks that
          package.json prepack equals "npm run build" and that verify-package passes after an
          explicit build. AC4 requires a source checkout with no build output where the package
          packing step itself produces the artifacts. The proposed test would still pass if npm
          pack/prepack integration were broken, as long as the script string and post-build verifier
          work. Add behavioral verification that packs/prepares from a clean temp copy with build
          output absent and inspects the resulting package contents.
        created_at: 2026-06-10T14:26:52.439Z
    kind: blocker
  - _ulid: 01KTRYVNZ51NDXYVF8Y01JMHB5
    anchor:
      type: structured
      ref: "@task-ci-node-version-matrix"
      section: tasks
    entries:
      - _ulid: 01KTRYVNZ543KSSJYAGV6K5Z9Q
        author: "@claude"
        body: The task's verification path is not executable in the normal kspec task flow. It says workflow
          changes are verified by PR/branch runs, but the current test workflow only triggers on
          pull_request to main and push to main, and this repo's local policy says dispatched task
          work should not open GitHub PRs. A task worker therefore cannot prove
          @prepublish-runtime-verification ac-1 before review/merge using the plan as written. Add a
          concrete project-compatible verification path, or change the workflow/task scope so branch
          verification is actually available.
        created_at: 2026-06-10T14:26:55.077Z
    kind: blocker
  - _ulid: 01KTRYVRGDWVTVAG4YV20XCNZY
    anchor:
      type: structured
      ref: "@task-audit-fix-production-deps"
      section: tasks
    entries:
      - _ulid: 01KTRYVRGEXCVCQG3QCQAN2MYZ
        author: "@claude"
        body: This task is scoped to production vulnerabilities from npm audit --omit=dev, but instructs the
          worker to run plain npm audit fix. Current plain npm audit also reports dev/workspace
          advisories for @sveltejs/kit and cookie, so npm audit fix may update dev/web UI tooling
          outside the stated production-deps scope. Should the task specify the intended
          command/scope more precisely, or expand to all audit findings?
        created_at: 2026-06-10T14:26:57.678Z
    kind: question
  - _ulid: 01KTRYVV23JHWFVTTKF5Z9Q5P4
    anchor:
      type: structured
      ref: "@task-dedupe-web-ui-devdeps"
      section: dependencies
    entries:
      - _ulid: 01KTRYVV23Q8XG5RYBEXWEXC47
        author: "@claude"
        body: Should this depend on @task-audit-fix-production-deps? Both tasks mutate root
          package.json/package-lock.json and the dependency tree. The implementation notes say
          hygiene tasks should run last, but depends_on does not encode that ordering, so derived
          work could create avoidable lockfile conflicts or stale dependency assumptions.
        created_at: 2026-06-10T14:27:00.291Z
    kind: question
  - _ulid: 01KTRYVXJYSS2CZANR0JYCGB5R
    anchor:
      type: structured
      ref: "@task-ci-node-version-matrix"
      section: tasks
    entries:
      - _ulid: 01KTRYVXJYT1K2SKAXQFP77C6S
        author: "@claude"
        body: While this task edits .github/workflows/test.yml, should it also replace the existing direct
          npx vitest run shard command with the project test runner script (for example npm test --
          --shard=...)? kspec-agents.md says tests should go through scripts/test.cjs rather than
          invoking vitest directly, because the runner performs environment readiness and caching
          behavior.
        created_at: 2026-06-10T14:27:02.878Z
    kind: question
