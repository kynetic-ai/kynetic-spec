    entries:
      - _ulid: 01KNEB3FMT2GKKQ9M2ZPDEN6W0
        author: Jacob Chapel
        body: 'Configured Node runtime is still unreachable through the supported CLI entrypoint. `serve
          start` checks for Bun unconditionally and then hardcodes `const runtime = "bun"`, so a
          project with `daemon.runtime: node` still fails unless Bun is installed. I reproduced this
          against the built CLI with a temp project containing `kspec.config.yaml` set to
          `daemon.runtime: node`; running `serve start --json --kspec-dir <tmp>/.kspec` with Bun
          removed from PATH returned `Bun runtime is required for the kspec daemon` instead of
          starting under Node. That means the new adapter wiring can only be exercised by manually
          setting `KSPEC_DAEMON_RUNTIME`, not via the normal startup path this feature is meant to
          enable.'
        created_at: 2026-04-05T08:10:45.786Z
      - _ulid: 01KNEBPTCWMK8A4M9QPE8PGVGH
        author: Jacob Chapel
        body: "Fixed in 083fa6b5e: serve start now resolves daemon.runtime from the project behind
          --kspec-dir, only requires Bun when runtime=bun, and launches node with process.execPath
          so configured node projects start through the normal CLI entrypoint even when Bun is
          absent from PATH."
