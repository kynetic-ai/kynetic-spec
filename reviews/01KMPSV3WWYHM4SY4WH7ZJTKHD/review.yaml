      side: head
    entries:
      - _ulid: 01KMPTG2W2E9GXPNQDAN41TNV5
        author: "@claude"
        body: The plan detail endpoint still falls through to disk while the plans domain is warming instead
          of returning a loading response. I reproduced this by mounting createPlansRoutes with a
          cache that reports plans=loading and requesting GET
          /api/plans/@plan-daemon-optimistic-data-layer; the handler returned HTTP 500 from the disk
          path rather than {_cache_status:"loading"}. That breaks @daemon-entity-cache
          ac-warming-availability for plan detail requests and defeats the progressive-loading
          contract during startup.
        created_at: 2026-03-27T04:58:00.962Z
      - _ulid: 01KMPV5F3VB7KNRS7TP3P16HBX
        author: "@claude"
        body: "Fixed: Plan detail endpoint now checks plansDomainState === 'loading' and returns
          {_cache_status: 'loading'} before any disk fallback, matching the list route pattern."
        created_at: 2026-03-27T05:09:41.627Z
    kind: blocker
    resolved_at: 2026-03-27T05:09:44.595Z
    resolved_by: "@claude"
  - _ulid: 01KMPTG4NRGJK83KH0JEY2PRQR
    anchor:
      type: code
      commit: c903c3369660d1b9746492fa5c1fd4e9844eaec3
      line_end: 276
      line_start: 271
      path: src/daemon/entity-cache.ts
      side: head
    entries:
      - _ulid: 01KMPTG4NRJFYPRN196DFWK2J7
        author: "@claude"
        body: "fileToDomain() still misses split-task storage paths, so watcher invalidation never fires for
          per-task task.yaml/notes.yaml changes. I verified the mapper directly:
          fileToDomain('project.tasks.yaml') returns ['tasks'], but
          fileToDomain('tasks/01KF1645CC9N4YGP991WD7XS8S/task.yaml') and .../notes.yaml both return
          null. In split mode addNote() explicitly writes only notes.yaml, so CLI/manual edits
          outside the route write-through path can leave the task cache stale, which breaks
          @daemon-entity-cache ac-watcher-invalidation and ac-granular-reload."
        created_at: 2026-03-27T04:58:02.808Z
      - _ulid: 01KMPV5N3GXRFWSAPRSM4377PV
        author: "@claude"
        body: "Fixed: fileToDomain() now includes a tasks/ prefix check to map split-backend per-task paths
          (tasks/<ULID>/task.yaml, tasks/<ULID>/notes.yaml) to the tasks domain."
        created_at: 2026-03-27T05:09:47.760Z
    kind: blocker
    resolved_at: 2026-03-27T05:09:50.979Z
    resolved_by: "@claude"
  - _ulid: 01KMPTG4PE91JPQB6TA0N3J79C
    anchor:
      type: code
      commit: c903c3369660d1b9746492fa5c1fd4e9844eaec3
      line_end: 579
      line_start: 553
      path: src/daemon/entity-cache.ts
      side: head
    entries:
      - _ulid: 01KMPTG4PEVM1CSNVFHZEKG7SP
        author: "@claude"
        body: "The live session counter overwrites persisted event_count with a counter that starts at zero.
          I verified this directly against ProjectEntityCache: after seeding an active session
          summary with event_count=25, getSessionIndex() reported 25 before
          incrementSessionEventCount(), then 1 after a single increment. The cache is dropping the
          persisted baseline instead of adding to it, so active sessions can regress from 25 events
          to 1. That breaks @session-summary-cache ac-live-counter."
        created_at: 2026-03-27T04:58:02.830Z
      - _ulid: 01KMPV5V7G0PAT25JQ8PC37KBJ
        author: "@claude"
        body: "Fixed: incrementSessionEventCount() now seeds the live counter from the persisted event_count
          in the session index on first call (when liveEventCounts has no entry for the session).
          This preserves the baseline so increments add to the persisted count rather than starting
          from zero."
        created_at: 2026-03-27T05:09:54.032Z
    kind: blocker
    resolved_at: 2026-03-27T05:09:57.059Z
    resolved_by: "@claude"
  - _ulid: 01KMPTG6JN76XF7R9CXAG2YZCD
    anchor:
      type: code
      commit: c903c3369660d1b9746492fa5c1fd4e9844eaec3
      line_end: 376
      line_start: 355
      path: packages/daemon/src/routes/reviews.ts
      side: head
    entries:
      - _ulid: 01KMPTG6JN375DRH5JNCS3D91C
        author: "@claude"
        body: "The review detail endpoint has the same warmup hole: when the reviews domain is loading, it
          bypasses the cache contract and reads from disk. I reproduced this with
          createReviewsRoutes plus a cache stub reporting reviews=loading; GET
          /api/reviews/@01KMPR2WKR9BRAGSS6Y6VD5AS8 returned the full review with HTTP 200 instead of
          a loading response. That violates @daemon-entity-cache ac-warming-availability and means
          detail traffic can bypass the cache during warmup."
        created_at: 2026-03-27T04:58:04.757Z
      - _ulid: 01KMPV617YAAMT75CJS47ZVZRH
        author: "@claude"
        body: "Fixed: Review detail endpoint now checks reviewsDomainState === 'loading' and returns
          {_cache_status: 'loading'} before any disk fallback, matching the pattern used on list
          routes."
        created_at: 2026-03-27T05:10:00.190Z
    kind: blocker
    resolved_at: 2026-03-27T05:10:03.263Z
    resolved_by: "@claude"
  - _ulid: 01KMPTG8H3F973RYNXF5M9J7MS
    anchor:
      type: code
      commit: c903c3369660d1b9746492fa5c1fd4e9844eaec3
      line_end: 68
      line_start: 60
      path: scripts/test.cjs
      side: head
    entries:
      - _ulid: 01KMPTG8H3X13B2ZEX8DB78YTG
        author: "@claude"
        body: "The new test-result cache can replay stale greens after build-script changes because the
          cache key omits package.json and the runner itself. I reproduced this in an isolated temp
          git repo using the exported computeCacheKey(): changing package.json's build:daemon script
          produced the same key before and after the edit, while main() exits early on any cached
          match at lines 524-546. This snapshot changes package.json's build pipeline, so npm test
          can now report a cached pass for an outdated build/test configuration. That weakens the
          repo's required verification gate."
        created_at: 2026-03-27T04:58:06.755Z
      - _ulid: 01KMPV678W3P2S0F7SVX5EJ2T3
        author: "@claude"
        body: "Fixed: TEST_INPUT_PATHS in scripts/test.cjs now includes package.json, scripts/test.cjs, and
          scripts/dependency-health.cjs. Changes to the build pipeline configuration or test runner
          itself will now invalidate cached test results."
        created_at: 2026-03-27T05:10:06.364Z
    kind: blocker
    resolved_at: 2026-03-27T05:10:09.700Z
    resolved_by: "@claude"
  - _ulid: 01KMPTH174YTP29FG79VZG0PQX
    entries:
      - _ulid: 01KMPTH174HTC4XJBP6WQYZ3CB
        author: "@claude"
        body: "Evidence log: files read included src/daemon/entity-cache.ts, packages/daemon/src/server.ts,
          packages/daemon/src/project-context.ts, packages/daemon/src/routes/tasks.ts,
          packages/daemon/src/routes/items.ts, packages/daemon/src/routes/sessions.ts,
