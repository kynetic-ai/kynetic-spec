          packages/daemon/src/routes/reviews.ts, packages/daemon/src/routes/triage.ts,
          packages/daemon/src/routes/inbox.ts, packages/daemon/src/routes/meta.ts,
          packages/daemon/src/routes/refs.ts, scripts/test.cjs, package.json, and
          tests/daemon-entity-cache.test.ts. Commands run: kspec task get, kspec item get
          @daemon-entity-cache, kspec item get @session-list-pagination-api, kspec item get
          @session-summary-cache, kspec validate, rg AC annotation search, npm test -- --fresh,
          targeted node/tsx repros for plan/review warmup behavior, fileToDomain mapping,
