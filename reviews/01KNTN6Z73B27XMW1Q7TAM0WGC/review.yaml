    entries:
      - _ulid: 01KNTNWGJNX4HT1NFC2NFA86NW
        author: Jacob Chapel
        body: "`isAfterEachWithCleanup()` is now too narrow for the behavior the task asked to allow. The
          task description explicitly allows a covering `afterEach` that calls `process.kill`
          against the spawned daemon, but this implementation only recognizes `SIGTERM`, `killPid`,
          `stopDaemon`, or `serve stop`. A valid pattern like `afterEach(() =>
          process.kill(child.pid))` is still flagged as an error; I reproduced that with a direct
          oxlint fixture in this snapshot. That is a false positive against an allowed cleanup form,
          so the rule still is not safe to ship."
        created_at: 2026-04-10T03:10:04.885Z
      - _ulid: 01KNTPW1S76312G1EF4DK65JN0
        author: "@claude"
        body: "Fixed: Extracted hasDaemonCleanupPattern() with process.kill, .kill(\"SIG*\"),
          SIGTERM/SIGKILL/SIGINT, killPid, stopDaemon, stopMockDaemon, and 'serve stop' as
          recognized patterns. afterEach(() => process.kill(child.pid)) now passes. Added negative
          test confirming this."
        created_at: 2026-04-10T03:27:18.311Z
    kind: blocker
    resolved_at: 2026-04-10T03:27:31.326Z
    resolved_by: "@claude"
  - _ulid: 01KNTNX2QSQ2DTTQ0P1WK3SG7Y
    anchor:
      type: code
      commit: 98105ed15c18b2af19e8280fa3957089ca379e72
      line_end: 180
      line_start: 171
      path: tools/eslint-rules/no-leaky-test-daemon.js
      side: head
    entries:
      - _ulid: 01KNTNX2QTT5D2RTZTMPPVG179
        author: Jacob Chapel
        body: "`isInTryWithFinallyCleanup()` still treats any finally block containing the substrings 'kill'
          or 'stop' as valid daemon cleanup. That recreates the original false-negative problem in a
          different branch: a test like `try { runKspec(\"serve start --detach ...\"); expect(...);
          } finally { stopUnrelatedFixture(); }` now passes lint even though the daemon is never
          cleaned up. I reproduced this with a direct `npx oxlint` fixture in this snapshot and the
          rule reported 0 errors. The finally-path logic needs the same daemon-specific filtering
          you added for `afterEach`, otherwise unrelated teardown helpers suppress real leaks."
        created_at: 2026-04-10T03:10:23.482Z
      - _ulid: 01KNTPW6SGJ3V5TSWX3T5PGBA5
        author: "@claude"
        body: "Fixed: isInTryWithFinallyCleanup() now uses the same hasDaemonCleanupPattern() as afterEach
          instead of generic 'kill'/'stop' substrings. finally { stopUnrelatedFixture() } is now
          correctly flagged. Added positive test confirming this."
        created_at: 2026-04-10T03:27:23.440Z
    kind: blocker
