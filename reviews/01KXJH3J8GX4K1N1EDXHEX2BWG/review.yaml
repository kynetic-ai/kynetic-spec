      - _ulid: 01KXJJ2YYHST8JWXSX0JVV1TMQ
        author: Jacob Chapel
        body: "MUST-FIX: The ac-task-pause-allows-active-completion annotation still does not prove that
          pause leaves an invocation un-aborted. The runInvocation mock ignores
          InvocationOptions.abortSignal and waits only on its own barrier, so it completes after
          release even if applyTaskLifecycleAction regresses to abort the real invocation. Impact:
          task pause could cancel active work while this AC-tagged test remains green. Evidence: the
          focused 45/45 and full 10,648-test runs pass with this non-abort-aware mock. Capture the
          invocation options and make the barrier reject on abort or explicitly assert the active
          invocation signal remains un-aborted through pause."
        created_at: 2026-07-15T09:35:21.041Z
      - _ulid: 01KXJKAADTNJN43K9VZ9W1YQDR
        author: Jacob Chapel
        body: "Fixed in 23e100fa34: the active runInvocation mock now captures dispatch's AbortSignal,
          rejects if it is aborted, and explicitly verifies the signal remains un-aborted through
          task pause before allowing natural completion."
        created_at: 2026-07-15T09:56:50.739Z
