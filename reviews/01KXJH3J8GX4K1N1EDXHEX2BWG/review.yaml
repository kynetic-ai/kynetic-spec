    entries:
      - _ulid: 01KXJJ321ANAF33Y499FJ8GVGP
        author: Jacob Chapel
        body: "MUST-FIX: The ac-task-pause-keeps-active-session-open annotation checks an unrelated registry
          entry, not the session belonging to the running task-A invocation. _spawnInvocation
          generates a preSessionId for its active tracking record, while the test independently
          registers the literal active-a; therefore a regression that closes only the matching
          active invocation session would leave active-a untouched and this test would pass. Impact:
          pause could close the actual task session without detection. Evidence: lines 474-488 never
          capture the runInvocation sessionId or associate active-a with the active record. Capture
          the generated invocation session identity, register/assert that exact session, and verify
          its close callback is not invoked."
        created_at: 2026-07-15T09:35:24.202Z
