      - _ulid: 01KW3AWMXJ8GWSDX53PZVWJAWX
        author: Jacob Chapel
        body: "MUST-FIX: updateSpecItemFromCurrent rewrites the whole parsed YAML object via
          writeYamlFilePreserveFormat, so spec comments are discarded when spec-text revert applies.
          Impact: @coverage-spec-text-revert ac-sibling-preservation requires comments to remain
          byte-equivalent, but a commented acceptance_criteria block loses its comment on this path.
          Evidence: executed an npx tsx repro with readYamlFile plus writeYamlFilePreserveFormat on
          a spec containing # keep this criterion comment; output printed comment-lost and the
          rewritten YAML no longer contained the comment. The submitted tests assert sibling AC
          values and notes, but do not include a comment fixture."
        created_at: 2026-06-27T01:25:15.826Z
      - _ulid: 01KW3D53GCTEXZSJ3V276XM7SV
        author: Jacob Chapel
        body: "Fixed in commit 4031861112: spec-text apply now uses a lock-held YAML document-node mutation
          helper that updates only the targeted acceptance criterion text scalars. Added a commented
          fixture and byte-level regression asserting the applied file equals the pre-apply file
          with only the targeted given/then values changed."
        created_at: 2026-06-27T02:04:50.060Z
    kind: blocker
    resolved_at: 2026-06-27T02:05:04.531Z
    resolved_by: Jacob Chapel
