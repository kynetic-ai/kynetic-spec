    kind: question
  - _ulid: 01KTW0CE9H0VAH7S5GNRBE1B91
    anchor:
      type: structured
      field: ac-older-tool-ignores-sidecar
      ref: "@coverage-record-compatibility"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTW0CE9HB8QF2S2DRHFNTJAM
        author: "@claude"
        body: "This AC specifies the behavior of tool versions predating the store — behavior this codebase
          cannot exercise (the task itself concedes 'the suite cannot execute an older released
          binary' and substitutes a mechanism-level proxy: unrecognized sidecar directories are
          ignored by shadow-state readers). An AC whose stated subject is untestable and whose
          verification is a different, narrower property invites annotation drift: the test will be
          annotated against an AC it does not actually prove. Consider rewording the AC to the
          property the current system guarantees and can verify — e.g., given a shadow state
          containing an unrecognized sidecar directory, when the metadata is loaded, validated, and
          written elsewhere, then the unrecognized directory's contents are neither read nor
          modified; plus an assertion that store creation touches no pre-existing file. The
          older-tool guarantee then belongs in the description as the purpose those properties
          serve."
        created_at: 2026-06-11T18:51:16.145Z
      - _ulid: 01KTW2GJ68MXXT90D01PGMKRPP
        author: "@claude"
        body: "Reworded as suggested: ac-older-tool-ignores-sidecar is replaced by two directly verifiable
          ACs — ac-unrecognized-sidecar-untouched (a sidecar directory the running tool does not
          recognize is neither read nor modified across load, validate, and write-elsewhere) and
          ac-store-creation-additive (the first stamp write modifies no metadata file that existed
          before the write). The older-tool guarantee moved into the spec description as the purpose
          these properties serve. Task 6 What bullet and Covers line updated to the new AC ids, so
          annotations will be made against properties the tests actually prove."
        created_at: 2026-06-11T19:28:28.359Z
    kind: question
  - _ulid: 01KTW0CH16ZRGZ68YG5NQ738T3
    anchor:
      type: structured
      field: ac-multi-annotation-most-recent
      ref: "@ac-freshness-resolution"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTW0CH16AJR96YXV731858TB
        author: "@claude"
        body: "Boundary gap: the multi-annotation AC requires 'each location having version-control
          history,' and ac-no-history-absence requires ALL locations to lack history. The mixed case
          — some annotated locations with history, some without — falls between the two givens and
          is uncovered by any AC, though the description implies the intended behavior (locations
          without history yield no value; the bootstrap is the most recent of the values that
          exist). The task's test list also omits the mixed case. Either extend this AC's given to
          cover mixed locations or add a dedicated AC, and add the mixed-location test to
          @task-freshness-resolution-read-path."
        created_at: 2026-06-11T18:51:18.950Z
      - _ulid: 01KTW2J2AM728VMZC6CE4G1SY5
        author: "@claude"
        body: "Extended ac-multi-annotation-most-recent to cover the mixed case: its given now requires at
          least one location with version-control history, and its then binds the bootstrap value to
          the most recent of the existing history values with no-history locations contributing
          none. It is disjoint from ac-no-history-absence (all locations lack history) and
          consistent with the narrowed ac-bootstrap-when-unstamped. The mixed-location test was
          added to @task-freshness-resolution-read-path, and the spec description plus the
          Implementation Notes multi-annotation section state the rule explicitly."
        created_at: 2026-06-11T19:29:17.652Z
    kind: question
  - _ulid: 01KTW0CKRA70GP0MHYYXZ9K4YH
    anchor:
      type: structured
      field: ac-timestamp-or-commit
