      section: description
    entries:
      - _ulid: 01KTW0C2SSV2JKJVXKWD1KE17J
        author: "@claude"
        body: "Conflict with the transition boundary in @ac-coverage-applicability (P0a, a decision this
          plan depends on). The decision states: 'the pre-existing completeness validation path that
          honors in-code not-applicable annotations for trait criteria remains in force until the
          coverage state engine work reconciles the two semantics.' Its ac-2 scopes the no-N/A rule
          to 'corpus coverage computed by the coverage state engine.' This task (with
          @task-respec-test-annotation-sweep-na) changes the pre-existing completeness validation
          path now — 'they earn no coverage credit in completeness validation, item APIs, task
          review context, or static export' — while the plan's own Implementation Notes declare the
          coverage-state engine a later plan and out of scope. As written, once both plans
          materialize, the live decision text will contradict this plan's implemented behavior.
          Resolve in one of two ways before approval: (a) amend the P0a decision wording so the
          transition boundary ends with this plan's respec (i.e., the respec IS the reconciliation),
          or (b) rescope tasks 4-5 so the pre-existing completeness path keeps honoring N/A until
          the engine plan, per the decision as written. Note the consumer-facing consequence rides
          on this choice: shipped guidance still documents the N/A trait-AC convention, and under
          option (a) every consumer project using it gains unresolvable completeness warnings while
          the docs still teach the convention — the plan defers the doc change, so the interim
          incoherence window should be an explicit, acknowledged decision."
        created_at: 2026-06-11T18:51:04.377Z
      - _ulid: 01KTW2CA26580RFQHP9W4DCZNQ
        author: "@claude"
        body: "Resolved via option (a), per the decision register, which assigns the N/A-stop to P1a/P1b —
          the respec IS the reconciliation. @task-respec-test-annotation-sweep-na now amends the
          live @ac-coverage-applicability boundary sentence (the item is live by the time the task
          runs, since this plan derives only after P0a): the pre-existing N/A-honoring completeness
          path ends with this respec plus @task-na-annotation-coverage-exclusion, not with the
          engine plan. Its engine-scoped ac-1/ac-2 are left untouched and stay claimed by the engine
          plan per the P0a handoff table. The consumer doc/behavior incoherence window is now an
          explicit acknowledged decision in Implementation Notes (N/A respec consequences): shipped
          guidance keeps teaching the convention while coverage credit ends; accepted because the
          annotation remains a well-formed task-scoped marker producing no findings, the new
          warnings correctly surface trait-AC misfits, and the doc change is deferred behind the
          shared-guidance neutrality chain."
        created_at: 2026-06-11T19:26:08.966Z
    kind: blocker
    resolved_at: 2026-06-11T19:30:41.919Z
    resolved_by: "@claude"
  - _ulid: 01KTW0C5R5ZEN671JWJEX2SMFQ
    anchor:
      type: structured
      ref: "@task-respec-test-annotation-sweep-na"
      section: description
    entries:
      - _ulid: 01KTW0C5R56X9AAFT511CY3EZA
        author: "@claude"
        body: "Reconciliation gap: @trait-validation ac-2 is not in the task's reconciliation list. ac-2
          reads 'Given spec implementing trait, When trait AC has test annotation // AC: @trait-ref
          ac-N, Then no warning for that AC.' The current parser strips the N/A suffix
          (src/parser/validate.ts, parseACAnnotationLine), so today an N/A-marked annotation
          satisfies that given and suppresses the warning. After
          @task-na-annotation-coverage-exclusion, a trait AC whose only annotation carries an N/A
          marker WILL warn — contradicting ac-2 under the currently-implemented reading. This is the
          same class of conflict the task already reconciles for @ac-annotation-integrity-reporting
          ac-valid-annotation-covers-target and @ac-annotation-identifier-format
          ac-valid-token-covers-ac, and trait ACs are precisely where the N/A convention is used
          most. Add @trait-validation ac-2 to the reconciliation list (narrow its given to
          coverage-claiming annotations), or document why its literal annotation form is judged to
          exclude N/A-marked lines."
        created_at: 2026-06-11T18:51:07.397Z
      - _ulid: 01KTW2DSX03HQEZGDW5NBVYX86
        author: "@claude"
        body: "Added @trait-validation ac-2 to the reconciliation list in
          @task-respec-test-annotation-sweep-na: its when clause is narrowed to coverage-claiming
          annotations (those without a not-applicable marker), so a trait AC whose only annotations
          carry N/A markers may warn without contradicting a live AC. The Covers line now includes
          @trait-validation ac-2 (given/when-clause reconciliation only) and the verification step
          covers all five mutated items."
        created_at: 2026-06-11T19:26:57.951Z
    kind: blocker
    resolved_at: 2026-06-11T19:30:48.977Z
    resolved_by: "@claude"
  - _ulid: 01KTW0C8P8BSAHPA0DMBWJWQME
    anchor:
      type: structured
      field: ac-bootstrap-when-unstamped
      ref: "@ac-freshness-resolution"
      section: acceptance_criteria
    entries:
      - _ulid: 01KTW0C8P9CFP4FWPYY4K53HSE
        author: "@claude"
        body: "Given-clause overlap with conflicting outcomes. ac-bootstrap-when-unstamped's given ('at
          least one annotation in a configured scan path and no recorded verification stamp')
          includes the scenario ac-no-history-absence covers (all annotation locations lack
          version-control history) — but the two thens conflict: one asserts a bootstrap value is
          produced, the other asserts no freshness value is produced. The description resolves the
          intent, but the ACs are the testable contract, and a test author working from ACs alone
          could implement either behavior for an uncommitted annotation location. Narrow
          ac-bootstrap-when-unstamped's given to '...at least one annotation in a configured scan
          path whose location has version-control history, and no recorded verification stamp' so
          the two givens are disjoint and each AC is deterministic."
        created_at: 2026-06-11T18:51:10.409Z
      - _ulid: 01KTW2E1G5965YJZEA7FT2H91D
        author: "@claude"
        body: "Narrowed as suggested: ac-bootstrap-when-unstamped given is now an acceptance criterion with
          at least one annotation in a configured scan path whose location has version-control
          history, and no recorded verification stamp. Its given and ac-no-history-absence are now
          disjoint, so each AC is deterministic for a test author working from ACs alone."
        created_at: 2026-06-11T19:27:05.732Z
    kind: blocker
