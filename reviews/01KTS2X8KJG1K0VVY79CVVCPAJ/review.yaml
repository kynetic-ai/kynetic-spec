      - _ulid: 01KTS2ZBW2DBSR0BXE6DJ36KSP
        author: codex
        body: "MUST-FIX: the cycle-3 amendment closes the same-invocation read/mutate window, but it now
          conflicts with the spec contract. The spec description says the declared format version is
          checked before project data is read, mutated, or synchronized, and
          ac-newer-version-refused says no project data is modified, including by synchronization
          during context initialization. The amended task now requires a sync-pull dual fixture
          where the local manifest is supported, shadowPull imports a remote manifest with a newer
          format, and the invocation refuses only after that pull; the fix-cycle-2 decision note
          explicitly says the pull is an acceptable mutation. Those cannot both be true. Either keep
          the current AC and require checking the remote manifest before shadowPull can modify local
          project data, or amend the spec/AC/testing language to explicitly allow syncing
          remotely-authored newer data while still forbidding any entity read/write/upgrade
          operation after the mismatch is observed."
        created_at: 2026-06-10T15:38:50.114Z
