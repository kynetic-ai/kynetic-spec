    entries:
      - _ulid: 01KRYQM47ZK2HAWFB0WBESJKP8
        author: Jacob Chapel
        body: "MUST-FIX: lineage pruning returns early whenever chainDepths.size <= ringBuffer.size, so
          stale lineage can remain after its events have aged out. Evidence: with capacity 5,
          emitting one correlated event and then five uncorrelated events leaves recent events with
          no correlation IDs while getChainDepth('correlation-stale') still returns 1. That violates
          the task/spec requirement to release lineage whose related events no longer appear in
          retained recent events."
        created_at: 2026-05-18T23:44:30.463Z
      - _ulid: 01KRYVXY036H686RW6V0DMKD2T
        author: "@claude"
        body: Fixed in df446d6338. The early-return guard `chainDepths.size <= ringBuffer.size` was masking
          stale correlations because a single correlated emit followed by N uncorrelated emits keeps
          that invariant true forever. Replaced with `chainDepths.size === 0` so any correlation
          whose events have aged out of the ring buffer is released on the next emit. Added a
          focused regression covering the exact 1-correlated-+-5-uncorrelated case.
        created_at: 2026-05-19T00:59:46.051Z
    kind: blocker
    resolved_at: 2026-05-19T00:59:49.715Z
    resolved_by: "@claude"
