        author: Jacob Chapel
        body: "This ancestor walk is too broad: it keeps searching past the project root all the way to /. I
          reproduced checkProjectDependencies() returning ok=true for a review workspace whose
          dependencies existed only in an unrelated parent directory (.../outer/node_modules), so a
          random ancestor install can now suppress a real missing-dependency failure. Please stop at
          the project root, or another explicit boundary, instead of accepting any filesystem
          ancestor."
        created_at: 2026-04-06T17:33:03.914Z
      - _ulid: 01KNHYHKD9X3WSTYBJ0NVG8DTF
        author: Jacob Chapel
        body: Fixed by bounding ancestor dependency lookup to the current project's root (the directory
          above .kspec-worktrees for review workspaces, otherwise the working directory itself). The
          test-runner regression now covers both the real detached-worktree case with no
          workspace/node_modules and a negative case showing that packages installed only above the
          project root still fail dependency health.
        created_at: 2026-04-06T17:48:14.632Z
    kind: blocker
