      - _ulid: 01KNHXNWCAE0N9A9KQ93F58CM4
        author: Jacob Chapel
        body: The same unbounded ancestor search was copied into bootstrap reuse detection. Because it also
          walks to /, an unrelated node_modules above the repo can make the dispatcher think
          workspace dependencies are healthy and incorrectly reuse bootstrap metadata instead of
          re-running install-workspace-dependencies. This needs the same project-root boundary as
          the test-runner check.
        created_at: 2026-04-06T17:33:06.314Z
      - _ulid: 01KNHYHNVP33P6ZBAS3KHQ8BN7
        author: Jacob Chapel
        body: Applied the same project-root boundary to dispatch bootstrap reuse detection. The bootstrap
          contract tests now verify both that project-root hoisted installs are accepted and that
          installs found only above the project root trigger install-workspace-dependencies instead
          of reusing stale bootstrap metadata.
        created_at: 2026-04-06T17:48:17.142Z
