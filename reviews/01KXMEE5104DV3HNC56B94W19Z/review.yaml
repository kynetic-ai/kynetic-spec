    entries:
      - _ulid: 01KXMFNHSGRMJQPE2SQPQZW0K7
        author: Jacob Chapel
        body: "MUST-FIX — WebSocket publication is inside the lifecycle action's success try/catch, so a
          delivery exception converts an already committed applied result into a second failed
          outcome. I reproduced this through public applyGlobalLifecycleAction with a throwing
          onDispatchControlEvent: authority committed to paused, the call rejected with the callback
          error, and EventBus retained both dispatch_control.pause_applied and
          dispatch_control.failed. packages/daemon wires this callback directly to
          PubSubManager.broadcast, whose ws.send can throw. This violates exactly-once auditing and
          misreports durable authority. Isolate best-effort agents-topic publication from the
          durable control result and add a behavioral regression proving a publication failure
          cannot reject/reclassify or double-emit the control outcome."
        created_at: 2026-07-16T03:31:33.296Z
    kind: blocker
  - _ulid: 01KXMFNNYBPJN8BW93SXKZV3EE
    anchor:
      type: code
      commit: 5f0855ff1c7ce4fb93457d442d1bb6b5be4a7375
      line_end: 1439
      line_start: 1435
      path: src/agent-runtime/dispatch.ts
      side: head
    entries:
      - _ulid: 01KXMFNNYBX6NZ6XGX37V4NJPR
        author: Jacob Chapel
        body: "MUST-FIX — Interrupted-stop recovery failures on daemon startup remain unaudited.
          _recoverPendingCleanups first durably marks a cleanup failure and throws, but start()
          discards that error here; no production startup/recovery path calls the new outcome
          emitter (rg finds source: recovery/daemon_startup only in tests). Thus
          cancellation/session/ownership failure predicates can reach a durable failed outcome
          during startup without the required dispatch_control.failed event, despite those sources
          and codes being part of this task's closed contract. Emit exactly once after the failed
          cleanup state commits and add a behavioral startup-recovery test; the current mapping test
          injects DispatchCleanupError into a pause store mutation and cannot detect this missing
          path."
        created_at: 2026-07-16T03:31:37.547Z
    kind: blocker
  - _ulid: 01KXMFNTTDH0W4NWWSPJ9V0ZZ6
    entries:
