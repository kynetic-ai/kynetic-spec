agents:
  - _ulid: 01KF0AGENT1CA45ZT43W2T6HJM
    id: task-worker
    name: Task Worker
    description: "Handles automation-eligible tasks"
    adapter: claude-agent-acp
    dispatch:
      - on: task.ready
        filter:
          automation: eligible
          tags:
            - mvp
          priority: 3
      - on: task.in_progress
      - on: task.needs_work
    capabilities: []
    tools: []
    skills: []
    concurrency:
      max_concurrent: 1
    auto_approve: false
  - _ulid: 01KF0AGENT2CC9N4YGP991WD7X
    id: pr-reviewer
    name: PR Reviewer
    description: "Reviews and merges pull requests"
    adapter: claude-agent-acp
    dispatch:
      - on: task.pending_review
    capabilities: []
    tools: []
    skills: []
    concurrency:
      max_concurrent: 1
    auto_approve: false
workflows:
  - _ulid: 01KF0WF001CA45ZT43W2T6HJMV
    id: spec-first
    trigger: behavior-change
    description: |
      Check **spec coverage** before implementing changes.
      Core principle: If changing behavior and spec doesn't cover it,
      update the spec first with `kspec item get`.
    steps:
      - type: check
        content: Does the spec cover this change?
        on_fail: Update or create spec before proceeding
      - type: decision
        content: What is the spec status?
        options:
          - Spec exists and matches -> Derive task, proceed
          - Spec exists but outdated -> Update spec first
          - No spec exists -> Create spec first (behavior) or task directly (infra)
      - type: action
        content: Update or create spec item if needed
  - _ulid: 01KF0WF002CC9N4YGP991WD7XS
    id: session-start
    trigger: session-start
    description: "Get context at the beginning of a work session with `kspec session start`."
    steps:
      - type: action
        content: Run kspec session start to get context
      - type: check
        content: Are there active (in_progress) tasks?
        on_fail: Pick from ready tasks or triage inbox
conventions: []
