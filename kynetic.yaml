  - _ulid: 01KM5Z4JEWP3RWESZNPDHW9X04
    slugs:
      - trait-type-safe-input
    title: Type-Safe Input Boundaries
    type: trait
    description: |
      Cross-cutting contract for any surface that accepts external input —
      CLI options, HTTP request bodies, WebSocket messages, or programmatic
      function arguments. Every input field with a defined type constraint
      (enum, number range, string format, required/optional, array element
      type) must be validated at the boundary before the input reaches
      business logic or persistence.

      Validation must be schema-derived — the source of truth for what
      constitutes valid input is the canonical schema definition, not a
      separate hardcoded check. Error messages must be actionable,
      identifying what was wrong and what is expected.
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: |
          Any input surface accepts a field with a defined type constraint
        id: ac-1
        then: |
          The operation is rejected before any data is persisted or
          state is mutated
        when: |
          The provided value does not satisfy the constraint
      - given: |
          An input validation error occurs for a constrained field
        id: ac-2
        then: |
          The message includes the set of valid alternatives for the
          field, not just the field name and invalid value (extends
          @trait-error-guidance ac-5 which requires identifying the
          field/value but not listing valid alternatives)
        when: |
          The error is reported to the caller
      - given: |
          A field's type constraint is defined in a canonical schema
        id: ac-3
        then: |
          The validation is derived from that schema definition rather
          than a separately maintained check
        when: |
          Validation logic checks the field
    tags: []
    created: 2026-03-20T15:52:01.244Z
    notes: []
  - _ulid: 01KQ9E388VPQJ9AAYSC6F7T9X9
    slugs:
      - trait-idempotent-file-scaffold
    title: Idempotent File Scaffolding Trait
    type: trait
    description: >-
      A scaffolding step that creates a file or writes to a managed block inside a file on disk
      follows a uniform set of rules so users can predict its behavior without reading its
      implementation: the target file is never modified unless the force flag is set; when force is
      set, the existing file is backed up to a sibling path before being replaced and the backup
      path is reported in the step's output; the step is safe to re-run and produces the same
      visible result on the second run as the first when no inputs changed; the step always reports
      its action (created, skipped, force-recreated) in a stable format consumable by the setup
      summary; and the step never destroys user content outside the file it owns.


      Scope: this trait applies only to scaffolding that writes files on disk. Scaffolds that create
      meta-spec items (agents, conventions, hooks, modules) have different force semantics — they
      use first-run-only creation with "reseed missing items only" on force — and must not inherit
      this trait.
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: A file scaffold step's target file already exists
        id: ac-existing-file-preserved-without-force
