  - _ulid: 01KFMKZFTYKPEXCHSAK9MTZX5Z
    slugs:
      - trait-localhost-security
    title: Loopback Default Security
    type: trait
    description: Security pattern for daemon services that are loopback-only by default. Binding to
      wildcard or other non-loopback interfaces is never the default; it is allowed only by explicit
      configuration and is treated as unauthenticated network exposure. Specs using this trait must
      enforce loopback-only behavior in default mode and surface explicit warnings when external
      binding is enabled.
    status:
      maturity: draft
      implementation: in_progress
    acceptance_criteria:
      - given: No non-loopback daemon host is configured
        id: ac-loopback-default
        then: The server binds only to loopback interfaces
        when: The server starts
      - given: The server is running in loopback-only mode
        id: ac-loopback-rejects-nonlocal
        then: The request is rejected with 403 Forbidden
        when: An HTTP request is received from a non-loopback remote address or with a non-local Host or
          Origin
      - given: daemon.host is explicitly configured to a non-loopback or wildcard address
        id: ac-external-host-explicit
        then: The server binds to the configured address
        when: The server starts
      - given: The effective daemon host is non-loopback or wildcard
        id: ac-external-warning
        then: Output includes a visible warning that the daemon has no authentication and exposes project
          data and mutation APIs on the configured network interface
        when: The daemon starts or a lifecycle command reports the daemon endpoint
