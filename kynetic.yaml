  - _ulid: 01KK7WM78BVYN7W8W9CJ37CV6H
    slugs:
      - trait-task-readiness
    title: Task Readiness Contract
    type: trait
    description: "Cross-cutting contract for determining whether a task is ready to be picked up. Any
      system that selects tasks for work must apply this base readiness check before
      consumer-specific filters (automation, tags, priority). Canonical definition: ready = (pending
      OR needs_work) + all depends_on completed + not blocked."
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: A system evaluates whether a task can be picked up for work
        id: ac-status
        then: Only tasks with status pending or needs_work are considered ready. All other statuses
          (in_progress, pending_review, completed, blocked, cancelled) are excluded.
        when: It checks the task status
      - given: A task has depends_on references to other tasks
        id: ac-deps
        then: All depends_on tasks must have status completed. If any dependency has a non-completed status
          (pending, in_progress, needs_work, pending_review, blocked, cancelled), the task is not
          ready.
        when: Readiness is evaluated
      - given: A task has a blocked_by array
        id: ac-not-blocked
        then: The blocked_by array must be empty. Any entry in blocked_by prevents readiness regardless of
          other conditions.
        when: Readiness is evaluated
      - given: A consumer applies additional filters (automation status, tags, priority thresholds)
        id: ac-composable
        then: Consumer-specific filters are applied on top of base readiness, never instead of it. A task
          must pass base readiness before any consumer filter is evaluated.
        when: It selects tasks for work
    tags:
      - tasks
      - dispatch
      - trait
    created: 2026-03-08T23:30:55.371Z
    notes: []
  - _ulid: 01KKB5HX59RKS2EVNG7DPND7YE
    slugs:
      - trait-markdown-rendering
    title: Markdown Rendering Trait
    type: trait
    description: |
      Cross-cutting trait defining quality requirements for any UI component
      that renders user or agent-authored markdown content. Ensures consistent
      rendering, syntax highlighting, sanitization, and dark mode support
      across all markdown surfaces.
    status:
      maturity: draft
      implementation: implemented
    depends_on: []
    implements: []
    relates_to: []
    tests: []
    traits: []
    acceptance_criteria:
      - given: |
          a component renders markdown content
        id: ac-1
        then: |
          all GFM elements render with correct semantic HTML and Tailwind
          prose typography styling
        when: |
          the content includes GFM elements (headings, lists, tables, links,
          emphasis, strikethrough, task lists, blockquotes)
      - given: |
          markdown content contains fenced code blocks with a language tag
        id: ac-2
        then: |
          code blocks display with syntax highlighting for the specified
          language using highlight.js, with at least 15 common languages
          supported (bash, typescript, javascript, python, rust, go, json,
          yaml, sql, css, html, java, c, cpp, diff)
        when: |
          the content is rendered
      - given: |
          markdown content contains inline code spans
        id: ac-3
        then: |
          inline code renders with a visually distinct background and
          monospace font, distinguishable from surrounding prose
        when: |
          the content is rendered
      - given: |
          markdown content contains any HTML including script tags,
          event handlers, or javascript: URLs
        id: ac-4
        then: |
          all unsafe HTML is stripped via DOMPurify sanitization while
          preserving safe structural markup (p, strong, em, code, pre,
          lists, tables, blockquotes)
        when: |
          the content is rendered
      - given: |
          markdown content contains external links (href starting with
          http://, https://, or //)
        id: ac-6
        then: |
          external links include target="_blank" and rel="noopener noreferrer"
          attributes for security
        when: |
          the content is rendered
      - given: |
          a component receives empty or undefined content
        id: ac-7
        then: |
          the component renders an empty container with no errors or
          console warnings
        when: |
          the markdown renderer is invoked
      - given: |
          markdown content contains malformed or unclosed syntax
          (e.g., unclosed code fences, broken table rows)
        id: ac-8
        then: |
          the content renders gracefully with best-effort formatting
          and no runtime errors
        when: |
          the content is rendered
      - given: |
          markdown content is very long (10,000+ lines or 500KB+)
        id: ac-9
        then: |
          the component renders without blocking the main thread for
          more than 100ms and does not cause memory errors
        when: |
          the content is rendered
